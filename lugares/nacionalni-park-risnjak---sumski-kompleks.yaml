resumen:
  es: Macizo montañoso kárstico cubierto de hayedos y abetales densos, hábitat clave para el lince boreal.
  en: >-
    Karst mountain massif blanketed by dense beech and silver fir forests, serving as a prime refuge for the
    Eurasian lynx.
  fr: Massif montagneux karstique drapé d’épaisses hêtraies-sapinières, sanctuaire vital pour le lynx boréal.
  de: >-
    Karstiges Bergmassiv mit dichten Buchen- und Tannenwäldern, ein zentrales Rückzugsgebiet für den
    Eurasischen Luchs.
  it: Massiccio montuoso carsico ammantato da fitte faggete e abetine, rifugio chiave per la lince eurasiatica.
  pt: >-
    Maciço montanhoso cárstico coberto por densos faiais e abetais, refúgio fundamental para o
    lince-euroasiático.
unico:
  es: Un monte de caliza donde viven los tres grandes carnívoros, oso, lobo y lince, y donde nace un río.
  en: >-
    A limestone mountain realm where Europe’s three apex carnivores—bear, wolf, and lynx—roam together and an
    emerald river takes birth.
  fr: >-
    Un mont calcaire où cohabitent les trois grands carnivores d’Europe—ours, loup et lynx—et où prend source
    un fleuve émeraude.
  de: >-
    Ein Kalkgebirge, in dem die drei großen Raubtiere Bär, Wolf und Luchs gemeinsam leben und ein
    smaragdgrüner Fluss entspringt.
  it: >-
    Un rilievo calcareo in cui convivono i tre grandi carnivori—orso, lupo e lince—e dove sgorga un fiume
    smeraldino.
  pt: >-
    Uma montanha calcária onde coabitam os três grandes carnívoros—urso, lobo e lince—e onde nasce um rio cor
    de esmeralda.
observaciones:
  es: >-
    El refugio Schlosser, bajo la cima, lleva el nombre de Josip Schlosser Klekovski; comprueba si está
    abierto antes de contar con él. Vístete bien, lleva agua y algo de comer, y sigue los senderos marcados.
    Los meses más recomendables son de mayo a octubre.
texto:
  es:
    intro: >-
      Hay montes que reparten el agua entre dos mares, y Risnjak es uno de ellos. El macizo, en el norte de
      los Alpes Dináricos, marca la divisoria entre las cuencas del Adriático y del mar Negro, y su parque
      nacional, en Gorski Kotar, a unos 15 km tierra adentro del Adriático, cubre 63,5 km² con el centro del
      macizo Risnjak-Snježnik y la zona de las fuentes del río Kupa. Aquí manda el bosque: hayas y abetos
      sobre caliza, y en el fondo el lince que dio nombre al lugar, porque Risnjak viene probablemente de la
      palabra croata para el lince, «ris».
    landscape: >-
      La cima más alta es Veliki Risnjak (1528 m) y el punto más bajo, la fuente del Kupa (313 m). Entre ambos
      hay un paisaje kárstico: dominan la caliza y la dolomía, con ponikve, lapiaces, derrumbes, sumideros y
      cuevas, y como la caliza es muy porosa casi no hay corrientes de agua en la superficie. Por eso el agua
      aparece de golpe, como en la fuente del Kupa: nace en el punto más bajo del parque, en una poza ovalada
      de unos 50 m de ancho, y el agua sale por dos canales, de 86 y 57 m de profundidad. La fuente está a 321
      m y es una de las más caudalosas, extensas y profundas de Croacia; está protegida desde el 12 de
      diciembre de 1963.


      El clima es de montaña húmeda: en el refugio de Risnjak, la temperatura media anual es de 2,5 °C y la
      lluvia anual de 3600 mm, de las más altas de Croacia. Los bosques ocupan el 92 % del parque y se
      reparten en 16 comunidades desde el valle del Kupa hasta Risnjak y Snježnik; la mayor parte es una
      mezcla de hayas y abetos. En la cima viven plantas raras, como el edelweiss y la orquídea vainilla
      negra. La flora suma hasta 1148 especies y subespecies, con una diversidad excepcional de orquídeas.
    wildlife: >-
      El [lince](/especie/lynx_lynx/) fue exterminado en el siglo XIX y volvió a Risnjak tras una
      reintroducción en la vecina Eslovenia. Risnjak es una de las zonas clave de Croacia donde sobrevive, y
      su bosque de montaña sin explotar es uno de los últimos refugios de grandes animales de Europa. Aquí
      también viven el [oso pardo](/especie/ursus_arctos/) y el [lobo](/especie/canis_lupus/): se siguen dos
      manadas, la de Risnjak y la de Snježnik. Hoy hay en el parque dos pequeñas manadas de
      [rebeco](/especie/rupicapra_rupicapra/), presentes todo el año.


      En el parque anidan 78 especies de aves, casi todas de bosque, y 114 se han registrado en el parque y su
      entorno. El [urogallo](/especie/tetrao_urogallus/) está en peligro en Croacia, y el halcón peregrino y
      el [mochuelo chico](/especie/glaucidium_passerinum/) son vulnerables. Se han registrado 89 especies de
      mariposas, 11 de ellas amenazadas; el valle del Kupa y las laderas de Dimovac, sobre Hrvatsko, tienen
      69, y por su riqueza de flora y fauna el curso alto del Kupa se llama el Valle Encantado de las
      Mariposas. Bajo tierra, en las cuevas se han hallado 42 taxones de invertebrados, 23 de ellos
      troglobios.
    visit: >-
      Empieza por el sendero educativo Leska. Fue el primero de un parque nacional croata, se inauguró el 4 de
      junio de 1993 y empieza a pocos minutos a pie al oeste del edificio de la administración, en Crni Lug.
      Es un circuito de 4.200 m, con poco desnivel, que se puede recorrer todo el año: en primavera la
      naturaleza despierta, en verano la sombra refresca, en otoño hay olores y colores, y casi todo el
      invierno es transitable. Sus 23 paneles explican flora, fauna y patrimonio cultural, con textos también
      en inglés; se aprende cómo era una casa rural tradicional y cómo viven osos, lobos y linces, y se puede
      recorrer solo o con guía.


      Para la fuente del Kupa hay dos accesos. De Razloge son 35 minutos (50 de vuelta), 1820 m y 229 m de
      desnivel de bajada, de dificultad intermedia, y el sendero empieza junto al centro de visitantes. De
      Hrvatsko son 1 h 30 min y 4850 m, de dificultad fácil, por la Ribička staza y los pueblos de Kupari. Hay
      dos centros de visitantes en el valle del Kupa: la Casa del Conocimiento de Gorski Kotar, en Razloge, y
      la Casa Natal del Río Kupa, en Gornji Kupari. La senda del Kupa puede quedar bloqueada por crecidas
      durante las lluvias fuertes y el deshielo primaveral.


      Para subir a Veliki Risnjak (1528 m) llegan cinco senderos marcados desde distintas direcciones; la
      mejor época es primavera, verano y otoño, y en invierno solo con equipo y experiencia. La ruta Horvatova
      empieza junto a Bijela Vodica y, tras tres kilómetros de camino forestal, pasa por Bukovac y Smrekovac;
      tarda 2 h 40 min, sube 838 m y es de dificultad intermedia. El acceso oeste, desde Vilje, es el camino
      más fácil a la cima: sube suave por la antigua pista forestal hasta Medvjeđa vrata (1289 m). Snježnik,
      de 1506 m, es la segunda cima, a hora y media a pie desde la estación de esquí de Platak, y es el lugar
      más usado en Croacia para el esquí de travesía.


      Para ver fauna, el parque ofrece un programa de observación en el prado de Lazac, uno de los pocos
      lugares de Europa donde aún se puede ver a los tres grandes: oso, lobo y lince. Empieza en la entrada
      principal; un coche lleva hasta el prado, a 30 km, y a la mañana siguiente el guardabosques devuelve a
      los visitantes a Crni Lug. La reserva es obligatoria con 7 días de antelación, y hay que llevar comida y
      agua, porque en la cabaña solo hay agua para el inodoro. También hay un programa para observar rebecos,
      que incluye guía, traslado hasta el aparcamiento más cercano al hábitat y prismáticos.
    history: >-
      Risnjak se protegió pronto: en 1949 el botánico Ivo Horvat propuso por primera vez proteger la zona, y
      en 1997 el parlamento amplió el parque a su tamaño actual, con Snježnik y las fuentes del Kupa. El
      espacio protegido supera las 4.600 ha y se divide entre zonas de protección estricta y dirigida; el
      espacio se deja a los procesos naturales.


      El territorio de cada oso es mayor que el parque, así que sus límites se quedan pequeños para proteger a
      osos y otros grandes animales.
    before: >-
      El refugio Schlosser, bajo la cima, lleva el nombre de Josip Schlosser Klekovski; comprueba si está
      abierto antes de contar con él. Vístete bien, lleva agua y algo de comer, y sigue los senderos marcados.
      Los meses más recomendables son de mayo a octubre.
    around: >-
      Risnjak está rodeado de bosques: el [Snježnik Massif Croatia](/lugar/snjeznik-massif-croatia/) queda a 1
      km, el [Snežniški gozdni masiv](/lugar/snezniski-gozdni-masiv-veliki-sneznik/) a 2 km, el [Kočevski
      gozdni kompleks](/lugar/kocevski-gozdni-kompleks/) a 3 km, el [Pragozd Krokar](/lugar/pragozd-krokar/) a
      5 km, los [Javorniški gozdovi](/lugar/javorniski-gozdovi-karstna-planota-javorniki/) a 9 km y la
      [Postonjska jama - Planinsko polje](/lugar/postonjska-jama---planinsko-polje/) a veinticuatro
      kilómetros.
  en:
    intro: >-
      Certain mountains divide water between two seas, and Risnjak is one of them. Rising in the northern
      Dinaric Alps, this massif marks the hydrological divide between the Adriatic and Black Sea basins. Its
      national park, located in Gorski Kotar some 15 km inland from the Adriatic, encompasses 63.5 km² across
      the core of the Risnjak-Snježnik range and the headwaters of the Kupa river. Forest reigns supreme:
      towering beech and silver fir over fractured limestone, watched over by the secretive cat that gave the
      mountain its name, as Risnjak likely derives from "ris", the Croatian word for lynx.
    landscape: >-
      The highest summit is Veliki Risnjak (1528 m) and the lowest elevation is the spring of the Kupa (313
      m). Between them spreads a textbook karst topography dominated by limestone and dolomite: ponikve
      sinkholes, limestone pavements, collapsed chasms, and cavernous shafts. Because limestone is profoundly
      porous, surface streams are almost absent; groundwater bursts forth abruptly, as exemplified by the Kupa
      spring. Wellying at the park’s lowest point in an oval pool some 50 m wide, water surges through two
      subterranean conduits 86 and 57 m deep. The spring pool sits at 321 m and ranks among the most
      discharge-rich, expansive, and deepest karst springs in Croatia; it has enjoyed legal protection since
      12 December 1963.


      The climate is cool and moist montane: at the Risnjak mountain hut, mean annual temperature is 2.5 °C
      and annual precipitation reaches 3600 mm, among the highest in Croatia. Forests blanket 92 % of the park
      across 16 ecological communities ascending from the Kupa valley to the summits of Risnjak and Snježnik,
      dominated by mixed beech-fir stands. Rare flora graces the high crags, including edelweiss and black
      vanilla orchid. The vascular flora counts up to 1148 species and subspecies, featuring an exceptional
      diversity of native orchids.
    wildlife: >-
      The [Eurasian lynx](/especie/lynx_lynx/) was extirpated in the nineteenth century and naturally
      recolonised Risnjak following reintroduction efforts in neighbouring Slovenia. Risnjak represents one of
      Croatia’s core survival zones, with its unfragmented mountain woodland ranking among the finest refuges
      for large mammals in Europe. Here dwell also the [brown bear](/especie/ursus_arctos/) and the
      [wolf](/especie/canis_lupus/), monitored in two stable packs—the Risnjak pack and the Snježnik pack. Two
      resident herds of [chamois](/especie/rupicapra_rupicapra/) roam the crags year-round.


      A total of 78 bird species breed in the park, almost all tied to mature forest, with 114 species
      recorded across the park and its buffer. The [western capercaillie](/especie/tetrao_urogallus/) is
      critically endangered in Croatia, while peregrine falcon and [Eurasian pygmy
      owlet](/especie/glaucidium_passerinum/) are vulnerable. Entomologists have documented 89 butterfly
      species, 11 of which are threatened; the Kupa valley and Dimovac slopes harbour 69 species, earning the
      upper Kupa valley the moniker "Enchanted Valley of Butterflies". Underground, 42 cave invertebrate taxa
      have been recorded, 23 of them obligate troglobites.
    visit: >-
      Begin your journey on the Leska educational trail. The first nature trail established in a Croatian
      national park, it was inaugurated on 4 June 1993 and begins a short walk west of the park administration
      building in Crni Lug. It forms an accessible loop of 4,200 m with minimal elevation change, walkable
      year-round: awakening in spring, offering cool woodland shade in summer, ablaze with colour in autumn,
      and walkable through most of winter. Its 23 interpretive panels explain flora, fauna, and cultural
      heritage with English translations, detailing traditional architecture and large carnivore ecology; it
      can be explored independently or with a guide.


      Two trails reach the source of the Kupa. From Razloge, it takes 35 minutes down (50 minutes return) over
      1820 m and 229 m of descent, graded moderate, starting by the visitor centre. From Hrvatsko, the hike
      requires 1 h 30 min over 4850 m, graded easy, following the Ribička staza past Kupari hamlets. Two
      visitor centres serve the Kupa valley: the Gorski Kotar House of Knowledge in Razloge and the Birth
      House of the Kupa River in Gornji Kupari. The river trail can flood during heavy downpours and spring
      snowmelt.


      To summit Veliki Risnjak (1528 m), five marked trails approach from various trailheads; spring, summer,
      and autumn are prime, while winter demands mountaineering equipment and experience. The Horvatova route
      begins near Bijela Vodica, following forest tracks through Bukovac and Smrekovac; it takes 2 h 40 min,
      climbs 838 m, and is moderately strenuous. The western approach from Vilje is the easiest ascent, gently
      climbing old forestry tracks to Medvjeđa Vrata (1289 m). Snježnik, at 1506 m, is the second summit, an
      hour and a half on foot from the Platak ski resort, renowned as Croatia’s finest ski-touring ridge.


      For wildlife enthusiasts, the park provides an observation programme on the remote Lazac meadow, one of
      the few places in Europe where bear, wolf, and lynx share habitat. Starting at the main entrance, a park
      vehicle transports guests 30 km to the cabin, and a ranger returns them to Crni Lug the next morning.
      Booking is mandatory 7 days in advance; visitors must bring all food and drinking water. A guided
      chamois-watching excursion is also available.
    history: >-
      Risnjak received early protective recognition: in 1949 botanist Ivo Horvat first formally advocated
      safeguarding the area, and in 1997 the Croatian parliament expanded the park to its current borders,
      incorporating Snježnik and the Kupa headwaters. The protected area exceeds 4,600 ha, divided into strict
      and active conservation zones where natural processes proceed unimpeded.


      Individual brown bear home ranges extend far beyond park boundaries, highlighting the ongoing challenge
      of landscape-scale connectivity for large carnivores.
    before: >-
      The Schlosser mountain hut nestled below the summit honours physician and botanist Josip Schlosser
      Klekovski; verify opening periods before relying on shelter. Dress warmly in layers, carry sufficient
      food and water, and stay on marked paths. Recommended hiking months span May to October.
    around: >-
      Risnjak is encircled by vast forests: [Snježnik Massif Croatia](/lugar/snjeznik-massif-croatia/) lies 1
      km away, [Snežnik Forest Massif / Veliki Snežnik](/lugar/snezniski-gozdni-masiv-veliki-sneznik/) 2 km,
      [Kočevsko Forest Complex](/lugar/kocevski-gozdni-kompleks/) 3 km, [Virgin Forest
      Krokar](/lugar/pragozd-krokar/) 5 km, [Javorniki Forest
      Complex](/lugar/javorniski-gozdovi-karstna-planota-javorniki/) 9 km, and [Postojna Cave - Planina Karst
      Field](/lugar/postonjska-jama---planinsko-polje/) twenty-four kilometres away.
  fr:
    intro: >-
      Certaines montagnes séparent les eaux entre deux mers, et le Risnjak en fait partie. Ce massif du nord
      des Alpes dinariques marque la ligne de partage des eaux entre l’Adriatique et le bassin de la mer
      Noire. Son parc national, au cœur du Gorski Kotar à environ 15 km des rivages adriatiques, s’étend sur
      63,5 km² englobant le cœur du massif Risnjak-Snježnik et les sources de la rivière Kupa. Ici règne la
      forêt : hêtres et sapins sur socle calcaire, veillés par le félin discret qui a donné son nom aux lieux,
      Risnjak dérivant très probablement de « ris », le lynx en croate.
    landscape: >-
      Le sommet culminant est le Veliki Risnjak (1528 m) et le point le plus bas la source de la Kupa (313 m).
      Entre les deux se déploie un karst remarquable : calcaires et dolomies prédominent, creusés de
      dépressions fermées (ponikve), lapiés, gouffres et cavernes, l’eau s’infiltrant immédiatement dans la
      roche poreuse. C’est pourquoi les rivières surgissent brusquement, à l’instar de la source de la Kupa.
      Jaillissant au point le plus bas du parc au fond d’une vasque ovale d’une cinquantaine de mètres de
      large (50 m), l’eau s’échappe par deux gouffres verticaux de 86 et 57 m de profondeur. La source s’élève
      à 321 m d’altitude et figure parmi les plus puissantes et profondes de Croatie ; elle est protégée
      depuis le 12 décembre 1963.


      Le climat est montagnard très arrosé : au refuge du Risnjak, la température moyenne annuelle est de 2,5
      °C et les précipitations annuelles atteignent 3600 mm, parmi les plus copieuses du pays. La forêt
      recouvre 92 % du parc à travers 16 associations végétales étagées depuis la vallée de la Kupa jusqu’aux
      crêtes du Snježnik, dominées par la hêtraie-sapinière. Sur les corniches rocheuses fleurissent des
      raretés comme l’edelweiss et l’orchidée vanille noire. La flore rassemble jusqu’à 1148 espèces et
      sous-espèces, avec un cortège d’orchidées d’une rare profusion.
    wildlife: >-
      Le [lynx boréal](/especie/lynx_lynx/), exterminé au dix-neuvième siècle, a recolonisé le Risnjak à la
      suite de réintroductions réussies en Slovénie voisine. Le Risnjak constitue un sanctuaire déterminant
      pour sa survie en Croatie, et ses forêts sauvages demeurent l’un des ultimes refuges de grands
      mammifères en Europe. Y cohabitent également l’[ours brun](/especie/ursus_arctos/) et le
      [loup](/especie/canis_lupus/), suivis à travers deux meutes territoriales (Risnjak et Snježnik). Deux
      hardes de [chamois](/especie/rupicapra_rupicapra/) fréquentent les crêtes tout au long de l’année.


      Le parc accueille 78 espèces d’oiseaux nicheurs, presque toutes forestières, et 114 espèces ont été
      observées avec la périphérie. Le [grand tétras](/especie/tetrao_urogallus/) est en grand péril en
      Croatie, tandis que le faucon pèlerin et la [chevêchette d’Europe](/especie/glaucidium_passerinum/) sont
      vulnérables. On y a répertorié 89 espèces de papillons, dont 11 menacées ; la vallée de la Kupa et les
      pentes du Dimovac en concentrent 69, ce qui vaut au cours supérieur de la Kupa le surnom de « Vallée
      enchantée des papillons ». Sous terre, les gouffres abritent 42 taxons d’invertébrés, dont 23
      strictement troglobies.
    visit: >-
      Commencez par le sentier pédagogique Leska. Premier sentier d’interprétation créé dans un parc national
      croate, inauguré le 4 juin 1993, il démarre à quelques pas à l’ouest du siège administratif à Crni Lug.
      C’est une boucle très facile de 4 200 m praticable toute l’année : éveil printanier, ombrage estival
      bienfaisant, palette automnale et promenade hivernale souvent praticable. Ses 23 panneaux explicatifs
      bilingues croate-anglais détaillent faune, flore, architecture rurale et grands prédateurs, et le
      parcours se fait librement ou accompagné d’un guide.


      Pour la source de la Kupa, deux itinéraires existent. Depuis Razloge, il faut 35 minutes (50 au retour)
      pour 1820 m et 229 m de descente, de difficulté moyenne, le chemin partant du centre d’accueil. Depuis
      Hrvatsko, compter 1 h 30 min et 4850 m, sur un sentier facile longeant la rivière Kupa et les hameaux de
      Kupari. Deux centres d’interprétation accueillent les visiteurs dans la vallée : la Maison du Savoir du
      Gorski Kotar à Razloge et la Maison Natale de la Kupa à Gornji Kupari. Le sentier peut être submergé
      lors des crues printanières.


      Pour gravir le Veliki Risnjak (1528 m), cinq sentiers balisés convergent vers la cime ; le printemps,
      l’été et l’automne sont idéaux, l’hiver exigeant crampons et expérience alpine. La voie Horvatova débute
      à Bijela Vodica et traverse de beaux sous-bois vers Bukovac et Smrekovac ; elle prend 2 h 40 min pour
      838 m de montée et une difficulté moyenne. L’accès ouest depuis Vilje est le plus doux, montant par une
      piste forestière jusqu’à Medvjeđa vrata (1289 m). Le Snježnik, haut de 1506 m, est le deuxième sommet du
      parc, accessible en une heure et demie de marche depuis la station de Platak, secteur réputé pour le ski
      de randonnée.


      Pour la grande faune, le parc propose un programme d’affût sur la clairière reculée de Lazac, l’un des
      rares endroits d’Europe où observer ours, loup et lynx. Le départ se fait à l’accueil principal ; un
      véhicule conduit les visiteurs à 30 km, et le garde forestier les ramène le lendemain matin à Crni Lug.
      La réservation est obligatoire 7 jours à l’avance ; il faut apporter ses vivres et de l’eau potable. Une
      sortie guidée dédiée aux chamois est également proposée.
    history: >-
      Le Risnjak bénéficia d’une attention précoce : dès 1949, le botaniste Ivo Horvat proposa la
      sanctuarisation du massif, et en 1997 le parlement étendit le parc à ses dimensions actuelles, intégrant
      le Snježnik et les sources de la Kupa. L’espace protégé dépasse 4 600 ha, répartis entre zones de
      protection intégrale et dirigée.


      Le domaine vital individuel de chaque ours dépassant la superficie du parc, ses frontières restent
      étroites pour préserver à elles seules ces grands prédateurs.
    before: >-
      Le refuge Schlosser, sous le sommet, porte le nom du naturaliste Josip Schlosser Klekovski ; vérifiez
      ses périodes de gardiennage avant de compter sur un hébergement. Équipez-vous chaudement, emportez
      vivres et eau, et restez sur les sentiers balisés. La saison conseillée s’étend de mai à octobre.
    around: >-
      Le Risnjak est entouré d’immenses forêts : le [Massif du Snježnik en
      Croatie](/lugar/snjeznik-massif-croatia/) se trouve à 1 km, le [Massif forestier du Snežnik / Veliki
      Snežnik](/lugar/snezniski-gozdni-masiv-veliki-sneznik/) à 2 km, le [Complexe forestier de
      Kočevsko](/lugar/kocevski-gozdni-kompleks/) à 3 km, la [Forêt primaire de
      Krokar](/lugar/pragozd-krokar/) à 5 km, les [Forêts de
      Javorniki](/lugar/javorniski-gozdovi-karstna-planota-javorniki/) à 9 km et la [Grotte de Postojna -
      Poljé de Planina](/lugar/postonjska-jama---planinsko-polje/) à vingt-quatre kilomètres.
  de:
    intro: >-
      Es gibt Berge, die das Wasser zwischen zwei Meeren teilen, und der Risnjak ist einer von ihnen. Das
      Massiv in den nördlichen Dinariden markiert die Wasserscheide zwischen Adria und Schwarzem Meer. Sein
      Nationalpark im Gorski Kotar, rund 15 km landeinwärts der Adria, erstreckt sich über 63,5 km² und
      umfasst das Herz des Risnjak-Snježnik-Massivs sowie das Quellgebiet der Kupa. Hier herrscht der Urwald:
      Buchen und Weißtannen auf Kalkgestein, behütet von jener scheuen Wildkatze, die dem Gebirge vermutlich
      seinen Namen gab, denn Risnjak leitet sich wohl vom kroatischen Wort „ris“ für Luchs ab.
    landscape: >-
      Der höchste Gipfel ist der Veliki Risnjak (1528 m) und der tiefste Punkt die Quelle der Kupa (313 m).
      Dazwischen erstreckt sich eine ausgeprägte Karstlandschaft: Kalkstein und Dolomit dominieren mit Dolinen
      (Ponikve), Karrenfeldern, Einsturztrichtern und Höhlen. Da der Kalkstein hochgradig wasserdurchlässig
      ist, gibt es kaum oberirdische Fließgewässer; das Wasser tritt unvermittelt zutage, wie an der
      Kupa-Quelle. Am tiefsten Punkt des Parks entspringt sie in einem ovalen Quelltopf von etwa 50 m
      Durchmesser, gespeist aus zwei senkrechten Röhren von 86 und 57 m Tiefe. Die Quelle liegt auf 321 m Höhe
      und zählt zu den stärksten und tiefsten Karstquellen Kroatiens; sie steht seit dem 12. Dezember 1963
      unter Naturschutz.


      Das Gebirgsklima ist feucht und kühl: An der Risnjak-Hütte liegt die Jahresmitteltemperatur bei 2,5 °C
      und der Jahresniederschlag erreicht 3600 mm, Höchstwerte in Kroatien. Wälder bedecken 92 % der
      Parkfläche in 16 Pflanzengesellschaften vom Kupatal bis zu den Kämmen des Snježnik, überwiegend als
      Buchen-Tannen-Mischwald. An den Felswänden gedeihen alpine Seltenheiten wie Edelweiß und die Schwarze
      Kohlröschen-Orchidee. Die Flora zählt bis zu 1148 Arten und Unterarten mit einem bemerkenswerten
      Reichtum an wilden Orchideen.
    wildlife: >-
      Der [Eurasische Luchs](/especie/lynx_lynx/) war im neunzehnten Jahrhundert ausgerottet und kehrte nach
      erfolgreichen Wiederansiedlungen im benachbarten Slowenien in den Risnjak zurück. Der Park ist eines der
      Schlüsselgebiete seines Überlebens in Kroatien, und seine unzerschnittenen Bergwälder bilden eines der
      letzten Rückzugsgebiete für Großraubtiere in Europa. Hier leben auch [Braunbär](/especie/ursus_arctos/)
      und [Wolf](/especie/canis_lupus/), die in zwei Rudeln (Risnjak und Snježnik) beobachtet werden. Zwei
      kleine Bestände der [Gämse](/especie/rupicapra_rupicapra/) bewohnen ganzjährig die Felsregionen.


      Im Park brüten 78 Vogelarten, fast ausnahmslos Waldvögel, und 114 Arten wurden mit der Umgebung erfasst.
      Das [Auerhuhn](/especie/tetrao_urogallus/) ist in Kroatien stark gefährdet, Wanderfalke und
      [Sperlingskauz](/especie/glaucidium_passerinum/) gelten als gefährdet. Es wurden 89 Schmetterlingsarten
      gezählt, 11 davon bedroht; das Tal der Kupa und die Hänge des Dimovac weisen 69 Arten auf, weshalb der
      Oberlauf als „Verzaubertes Schmetterlingstal“ gerühmt wird. In Höhlen leben 42 Wirbellosen-Taxa,
      darunter 23 echte Troglobionten.
    visit: >-
      Beginne mit dem Lehrpfad Leska. Als erster Naturlehrpfad eines kroatischen Nationalparks am 4. Juni 1993
      eröffnet, startet er wenige Gehminuten westlich der Parkverwaltung in Crni Lug. Der 4.200 m lange
      Rundweg mit geringem Gefälle ist ganzjährig begehbar: Erwachen im Frühling, schattige Kühle im Sommer,
      bunte Herbstwälder und Winterspaziergänge. Seine 23 Informationstafeln auf Kroatisch und Englisch
      vermitteln Wissen über Flora, Fauna, traditionelle Bauweise und Raubtiere; er kann auf eigene Faust oder
      geführt begangen werden.


      Zur Kupa-Quelle führen zwei Pfade. Ab Razloge wandert man 35 Minuten hinab (50 Minuten zurück) über 1820
      m und 229 m Höhenunterschied, mittelschwer, mit Einstieg am Infozentrum. Ab Hrvatsko benötigt man 1 h 30
      min für 4850 m, leicht, entlang des Fischereipfads (Ribička staza) und der Kupari-Dörfer. Zwei
      Besucherzentren liegen im Kupatal: das Haus des Wissens in Razloge und das Geburtshaus der Kupa in
      Gornji Kupari. Bei starkem Regen und Schneeschmelze kann der Uferweg überflutet sein.


      Auf den Veliki Risnjak (1528 m) führen fünf markierte Wanderwege aus verschiedenen Richtungen; Frühjahr,
      Sommer und Herbst sind ideal, der Winter erfordert Steigeisen und Erfahrung. Die Horvatova-Route beginnt
      bei Bijela Vodica und zieht über Forstwege durch Bukovac und Smrekovac; sie dauert 2 h 40 min bei 838 m
      Aufstieg, mittelschwer. Der Westzustieg ab Vilje ist der leichteste Anstieg sanft über Forstwege zum
      Sattel Medvjeđa vrata (1289 m). Der Snježnik (1506 m) ist der zweithöchste Gipfel, anderthalb Gehstunden
      von der Skistation Platak entfernt, und Kroatiens beliebtestes Skitourengebiet.


      Zur Tierbeobachtung bietet der Park ein Programm auf der abgelegenen Wiese Lazac an, wo Bär, Wolf und
      Luchs denselben Raum teilen. Treffpunkt ist der Haupteingang; ein Fahrzeug bringt Gäste 30 km weit zur
      Beobachtungshütte, am nächsten Morgen begleitet der Ranger zurück nach Crni Lug. Eine Buchung ist 7 Tage
      im Voraus erforderlich; Verpflegung und Trinkwasser müssen mitgebracht werden. Auch geführte
      Gams-Beobachtungen werden angeboten.
    history: >-
      Der Risnjak wurde früh geschützt: 1949 regte der Botaniker Ivo Horvat den Schutz des Gebiets an, und
      1997 erweiterte das Parlament den Park auf seine heutige Größe mit Snježnik und den Kupa-Quellen. Das
      Schutzgebiet umfasst über 4.600 ha, aufgeteilt in Kern- und Pflegezonen, in denen natürliche Prozesse
      Vorrang haben.


      Das Streifgebiet eines einzelnen Bären ist größer als der Park, weshalb die Parkgrenzen allein für den
      dauerhaften Schutz der Großraubtiere zu eng bemessen sind.
    before: >-
      Die Schlosser-Hütte unter dem Gipfel erinnert an den Naturforscher Josip Schlosser Klekovski; prüfe vor
      der Tour ihre Öffnungszeiten. Rüste dich wetterfest aus, führe ausreichend Proviant mit und bleibe auf
      markierten Wegen. Die empfohlene Reisezeit reicht von Mai bis Oktober.
    around: >-
      Der Risnjak ist von geschlossenen Wäldern umgeben: Das [Snježnik-Massiv in
      Kroatien](/lugar/snjeznik-massif-croatia/) liegt 1 km entfernt, das [Snežnik-Waldmassiv / Veliki
      Snežnik](/lugar/snezniski-gozdni-masiv-veliki-sneznik/) 2 km, der [Waldkomplex
      Kočevsko](/lugar/kocevski-gozdni-kompleks/) 3 km, der [Urwald Krokar](/lugar/pragozd-krokar/) 5 km, die
      [Javorniki-Wälder](/lugar/javorniski-gozdovi-karstna-planota-javorniki/) 9 km und die [Höhle von
      Postojna - Planina-Karstfeld](/lugar/postonjska-jama---planinsko-polje/) vierundzwanzig Kilometer
      entfernt.
  it:
    intro: >-
      Vi sono montagne che spartiscono le acque tra due mari, e il Risnjak è tra queste. Questo massiccio
      delle Alpi Dinariche settentrionali segna lo spartiacque tra i bacini dell’Adriatico e del Mar Nero. Il
      suo parco nazionale, situato nel Gorski Kotar a circa 15 km dal litorale adriatico, si estende per 63,5
      km² abbracciando il cuore del massiccio Risnjak-Snježnik e le sorgenti del fiume Kupa. A dominare è la
      foresta vergine: faggi e abeti bianchi su rocce calcaree, sorvegliati dalla lince che ha dato il nome
      alla montagna, derivando Risnjak dalla parola croata «ris», la lince.
    landscape: >-
      La cima più elevata è il Veliki Risnjak (1528 m) e il punto più depresso è la sorgente del fiume Kupa
      (313 m). Tra i due estremi si articola un classico paesaggio carsico: calcari e dolomie modellati da
      doline (ponikve), campi carreggiati, inghiottitoi e pozzi, dove l’acqua si inabissa subito nel
      sottosuolo. Per questo le risorgenze appaiono all’improvviso, come la sorgente della Kupa: scaturisce al
      punto più basso del parco in un laghetto ovale largo circa 50 m, alimentato da due condotti verticali
      profondi 86 e 57 m. La sorgente si trova a 321 m di quota ed è una delle più copiose e profonde della
      Croazia; è protetta dal 12 dicembre 1963.


      Il clima è tipicamente montano umido: presso il rifugio del Risnjak la temperatura media annua è di 2,5
      °C e le precipitazioni toccano i 3600 mm annui, tra i valori più alti del paese. I boschi ricoprono il
      92 % del parco attraverso 16 consorzi forestali distribuiti dalla valle della Kupa fino alle creste del
      Risnjak e dello Snježnik, dominati dalla faggeta-abetina mista. Sulle balze rocciose crescono rarità
      come la stella alpina e la nigritella nera. La flora conta fino a 1148 specie e sottospecie, con una
      superba ricchezza di orchidee selvatiche.
    wildlife: >-
      La [lince eurasiatica](/especie/lynx_lynx/), sterminata nel diciannovesimo secolo, è tornata sul Risnjak
      a seguito dei fortunati rilasci nella vicina Slovenia. Il Risnjak rappresenta un’area nodale per la sua
      sopravvivenza in Croazia, e i suoi boschi incontaminati figurano tra gli ultimi santuari di grandi
      mammiferi d’Europa. Qui convivono stabilmente l’[orso bruno](/especie/ursus_arctos/) e il
      [lupo](/especie/canis_lupus/), monitorati in due branchi distinti (Risnjak e Snježnik). Due nuclei
      stabili di [camoscio alpino](/especie/rupicapra_rupicapra/) frequentano le balze sommitali tutto l’anno.


      Nel parco nidificano 78 specie di uccelli, in gran parte forestali, e 114 sono state registrate con
      l’area circostante. L’[urogallo](/especie/tetrao_urogallus/) è in grave pericolo in Croazia, mentre il
      falco pellegrino e la [civetta nana](/especie/glaucidium_passerinum/) sono specie vulnerabili. Sono
      state censite 89 specie di farfalle, 11 delle quali minacciate; la valle della Kupa e i versanti di
      Dimovac ne accolgono 69, valendo all’alto corso del fiume il nome di «Valle Incantata delle Farfalle».
      Nel sottosuolo vivono 42 taxa di invertebrati cavernicoli, 23 dei quali troglobi obbligati.
    visit: >-
      Inizia dal sentiero didattico Leska. Primo percorso naturalistico allestito in un parco nazionale
      croato, inaugurato il 4 giugno 1993, prende il via a pochi minuti a piedi a ovest della sede del parco a
      Crni Lug. È un anello pianeggiante di 4.200 m percorribile tutto l’anno: risveglio primaverile, frescura
      estiva nel bosco, profumi autunnali e passeggiate invernali sulla neve battuta. I suoi 23 pannelli
      informativi in croato e inglese illustrano flora, fauna, tradizioni e grandi predatori; si percorre
      liberamente o con guida.


      Per la sorgente della Kupa si offrono due accessi. Da Razloge occorrono 35 minuti a scendere (50 minuti
      a risalire) lungo 1820 m e 229 m di dislivello, di media difficoltà, con partenza dal centro visite. Da
      Hrvatsko si impiegano 1 h 30 min per 4850 m, su sentiero facile lungo la pista dei pescatori (Ribička
      staza) e i borghi di Kupari. Due centri visite accolgono il pubblico nella valle: la Casa della
      Conoscenza a Razloge e la Casa Natale del Fiume Kupa a Gornji Kupari. Il sentiero rivierasco può
      allagarsi in caso di forti piogge o disgelo primaverile.


      Per salire al Veliki Risnjak (1528 m) convergono cinque sentieri segnalati; la stagione ideale va da
      primavera ad autunno, mentre l’inverno richiede ramponi ed esperienza alpinistica. L’itinerario
      Horvatova parte da Bijela Vodica attraversando faggete verso Bukovac e Smrekovac; richiede 2 h 40 min
      per 838 m di salita, di media difficoltà. L’accesso occidentale da Vilje è il più dolce, salendo
      comodamente su strada forestale fino a Medvjeđa vrata (1289 m). Lo Snježnik (1506 m) è la seconda vetta,
      a un’ora e mezza di marcia dalla stazione di Platak, meta d’eccellenza dello scialpinismo croato.


      Per l’osservazione della fauna il parco propone un programma nel pascolo isolato di Lazac, dove
      convivono orso, lupo e lince. Il ritrovo è all’ingresso principale; un veicolo conduce a 30 km di
      distanza e la mattina seguente il guardaparco riaccompagna a Crni Lug. La prenotazione è obbligatoria
      con 7 giorni di anticipo; occorre portare viveri e acqua potabile. È disponibile anche un’uscita guidata
      dedicata ai camosci.
    history: >-
      Il Risnjak ricevette precoce attenzione conservazionistica: nel 1949 il botanico Ivo Horvat ne propose
      la tutela integrale, e nel 1997 il parlamento allargò il parco ai confini attuali con lo Snježnik e le
      sorgenti della Kupa. L’area protetta supera i 4.600 ha, ripartita in zone di riserva integrale e
      orientata in cui dominano i processi spontanei.


      L’home range di ciascun orso eccede la superficie dell’area protetta, a dimostrazione che i confini del
      parco rimangono angusti per tutelare da soli i grandi predatori.
    before: >-
      Il rifugio Schlosser, posto sotto la cima, ricorda il medico e botanico Josip Schlosser Klekovski;
      verifica i periodi di apertura prima di programmare un pernottamento. Indossa abiti caldi, porta
      provviste adeguate e segui i sentieri tracciati. I mesi consigliati vanno da maggio a ottobre.
    around: >-
      Il Risnjak è circondato da sconfinate foreste: il [Massiccio dello Snježnik in
      Croazia](/lugar/snjeznik-massif-croatia/) dista 1 km, il [Massiccio Forestale dello Snežnik / Veliki
      Snežnik](/lugar/snezniski-gozdni-masiv-veliki-sneznik/) 2 km, il [Complesso Forestale di
      Kočevsko](/lugar/kocevski-gozdni-kompleks/) 3 km, la [Foresta Primaria di
      Krokar](/lugar/pragozd-krokar/) 5 km, le [Foreste di
      Javorniki](/lugar/javorniski-gozdovi-karstna-planota-javorniki/) 9 km e la [Grotta di Postumia - Polje
      di Planina](/lugar/postonjska-jama---planinsko-polje/) ventiquattro chilometri.
  pt:
    intro: >-
      Há montanhas que dividem as águas entre dois mares, e o Risnjak é uma delas. Este maciço no norte dos
      Alpes Dináricos marca a divisória entre as bacias do Adriático e do Mar Negro. O seu parque nacional,
      situado no Gorski Kotar a cerca de 15 km do mar Adriático, abrange 63,5 km² integrando o núcleo do
      maciço Risnjak-Snježnik e as cabeceiras do rio Kupa. Aqui impera a floresta: faias e abetos sobre rocha
      calcária, sob o olhar vigilante do felino esquivo que deu nome à serra, já que Risnjak deriva da palavra
      croata «ris», o lince.
    landscape: >-
      O ponto culminante é o Veliki Risnjak (1528 m) e o ponto mais baixo a nascente do rio Kupa (313 m).
      Entre ambos desenvolve-se um relevo cárstico notável: calcários e dolomitos sulcados por dolinas
      (ponikve), lapiás, algares e grutas, onde a água desaparece rapidamente no subsolo. É por essa razão que
      as ressurgências emergem com violência, como sucede na nascente do Kupa: brota no ponto mais baixo do
      parque numa lagoa ovalada de cerca de 50 m de diâmetro, alimentada por dois canais verticais com 86 e 57
      m de profundidade. A nascente situa-se a 321 m de altitude e é uma das mais caudalosas e profundas da
      Croácia; está protegida desde 12 de dezembro de 1963.


      O clima é de montanha húmido: no refúgio do Risnjak, a temperatura média anual é de 2,5 °C e a
      precipitação anual atinge 3600 mm, valores cimeiros na Croácia. As matas recobrem 92 % da superfície do
      parque distribuídas por 16 associações florísticas desde o vale do Kupa até aos picos do Snježnik,
      dominadas pelo faial-abetal misto. Nos escarpados rochosos vicejam raridades como a edelvaisse e a
      orquídea-baunilha-negra. A flora soma até 1148 espécies e subespécies, exibindo uma prodigiosa
      diversidade de orquídeas bravas.
    wildlife: >-
      O [lince-euroasiático](/especie/lynx_lynx/) foi extirpado no século XIX e regressou a Risnjak após
      reintroduções bem-sucedidas na vizinha Eslovénia. O parque constitui um território vital para a sua
      sobrevivência na Croácia, funcionando a sua mancha florestal contínua como um dos últimos santuários de
      grandes mamíferos na Europa. Habitam aqui também o [urso-pardo](/especie/ursus_arctos/) e o
      [lobo](/especie/canis_lupus/), monitorizados em duas alcateias territoriais (Risnjak e Snježnik). Duas
      pequenas manadas de [camurça](/especie/rupicapra_rupicapra/) residem nos penhascos ao longo de todo o
      ano.


      No parque nidificam 78 espécies de aves, quase todas florestais, e 114 foram observadas em conjunto com
      a zona envolvente. O [tetraz-grande](/especie/tetrao_urogallus/) encontra-se criticamente ameaçado na
      Croácia, ao passo que o falcão-peregrino e o [mocho-pigmeu](/especie/glaucidium_passerinum/) são
      vulneráveis. Foram catalogadas 89 espécies de borboletas, 11 das quais protegidas; o vale do Kupa e as
      encostas de Dimovac reúnem 69 espécies, conferindo ao alto Kupa o epíteto de «Vale Encantado das
      Borboletas». No meio subterrâneo vivem 42 taxa de invertebrados cavernícolas, 23 dos quais estritamente
      troglóbios.
    visit: >-
      Inicia o percurso pelo trilho pedagógico Leska. Primeiro trilho interpretativo criado num parque
      nacional croata, inaugurado a 4 de junho de 1993, tem início a escassos minutos a pé a oeste da sede do
      parque em Crni Lug. É um circuito acessível de 4.200 m de desnível suave percorrível todo o ano:
      despertar primaveril, frescura estival, aromas outonais e caminhadas na neve no inverno. Os seus 23
      painéis informativos bilingues croata-inglês descrevem fauna, flora, etnografia e grandes predadores;
      realiza-se em autonomia ou com guia.


      Para a nascente do Kupa há dois acessos. A partir de Razloge são 35 minutos a descer (50 minutos no
      regresso) ao longo de 1820 m e 229 m de desnível, de dificuldade média, com partida junto ao centro de
      acolhimento. A partir de Hrvatsko demora-se 1 h 30 min para 4850 m, em percurso fácil pela rota dos
      pescadores (Ribička staza) e pelas aldeias de Kupari. Existem dois centros interpretativos no vale: a
      Casa do Conhecimento em Razloge e a Casa Natal do Rio Kupa em Gornji Kupari. O trilho ribeirinho pode
      ficar submerso durante cheias ou no degelo.


      Para subir ao Veliki Risnjak (1528 m) convergem cinco trilhos marcados; primavera, verão e outono são os
      períodos ideais, exigindo o inverno equipamento de alpinismo. A rota Horvatova principia em Bijela
      Vodica e sobe por pistas florestais através de Bukovac e Smrekovac; demora 2 h 40 min para 838 m de
      subida, com dificuldade moderada. O acesso ocidental a partir de Vilje é o mais suave, subindo
      gradualmente até Medvjeđa vrata (1289 m). O Snježnik, com 1506 m, é o segundo cume, a hora e meia de
      caminhada a partir da estância de Platak, afamado polo de esqui de travessia.


      Para observação de fauna, o parque disponibiliza um programa no prado ermo de Lazac, onde coabitam urso,
      lobo e lince. O ponto de encontro é na portaria principal; um transporte leva os visitantes ao abrigo
      situado a 30 km, trazendo-os de volta na manhã seguinte a Crni Lug. A reserva é obrigatória com 7 dias
      de antecedência; é indispensável levar mantimentos e água potável. Também se organiza uma atividade
      guiada para avistamento de camurças.
    history: >-
      O Risnjak foi alvo de proteção pioneira: em 1949 o botânico Ivo Horvat propôs a preservação da montanha,
      e em 1997 o parlamento expandiu o parque para os limites atuais incorporando o Snježnik e as nascentes
      do Kupa. O espaço protegido excede 4.600 ha, articulando zonas de reserva estrita e orientada deixadas
      aos processos espontâneos.


      A área de vida de cada urso ultrapassa a extensão do parque, comprovando que as fronteiras protegidas
      são insuficientes para salvaguardar isoladamente os grandes predadores.
    before: >-
      O refúgio Schlosser, aninhado sob o cume, evoca o naturalista Josip Schlosser Klekovski; confirma os
      seus períodos de abertura antes de contar com dormida. Leva agasalhos, água e mantimentos suficientes, e
      caminha pelos trilhos marcados. Os meses recomendados decorrem entre maio e outubro.
    around: >-
      O Risnjak está envolvido por vastas florestas: o [Maciço de Snježnik na
      Croácia](/lugar/snjeznik-massif-croatia/) dista 1 km, o [Maciço Florestal de Snežnik / Veliki
      Snežnik](/lugar/snezniski-gozdni-masiv-veliki-sneznik/) 2 km, o [Complexo Florestal de
      Kočevsko](/lugar/kocevski-gozdni-kompleks/) 3 km, a [Floresta Virgem de Krokar](/lugar/pragozd-krokar/)
      5 km, as [Florestas de Javorniki](/lugar/javorniski-gozdovi-karstna-planota-javorniki/) 9 km e a [Gruta
      de Postojna - Polje de Planina](/lugar/postonjska-jama---planinsko-polje/) vinte e quatro quilómetros.
