resumen:
  es: >-
    Falla tectónica y cañón de pared vertical en el lago Helvetinjärvi (*Helvetinkolu*, La Puerta del
    Infierno) encajado entre pinares boreales.
  en: >-
    Tectonic fault and vertical-walled canyon on Lake Helvetinjärvi (*Helvetinkolu*, Hell's Gate) framed by
    boreal pine forests.
  fr: >-
    Faille tectonique et canyon aux parois verticales sur le lac Helvetinjärvi (*Helvetinkolu*, La Porte de
    l'Enfer) enchâssé dans les pinèdes boréales.
  de: >-
    Tektonischer Grabenbruch und senkrechte Schlucht am See Helvetinjärvi (*Helvetinkolu*, Höllentor) inmitten
    borealer Kiefernwälder.
  it: >-
    Faglia tettonica e canyon a parete verticale sul lago Helvetinjärvi (*Helvetinkolu*, La Porta
    dell'Inferno) incastonati tra pinete boreali.
  pt: >-
    Falha tectónica e desfiladeiro de paredes verticais no lago Helvetinjärvi (*Helvetinkolu*, A Porta do
    Inferno) entre pinhais boreais.
unico:
  es: >-
    Dos antiguos valles de falla, con una grieta de roca de apenas un par de metros de ancho y un nombre, lago
    del infierno, nacido de la maldición de un brujo.
  en: >-
    Two ancient rift valleys featuring a rock crevasse barely a couple of metres wide and a name—Hell's
    Lake—born of a sorcerer's curse.
  fr: >-
    Deux anciens fossés d'effondrement, avec une fissure rocheuse de deux mètres de large et un nom — le lac
    de l'enfer — né de la malédiction d'un sorcier.
  de: >-
    Zwei uralte Grabenbrüche mit einer kaum zwei Meter breiten Felsspalte und einem Namen – Höllensee –, der
    dem Fluch eines Zauberers entsprang.
  it: >-
    Due antiche fosse tettoniche, con una fenditura rocciosa larga appena un paio di metri e un nome, lago
    dell'inferno, nato dalla maledizione di uno sciamano.
  pt: >-
    Dois antigos vales de rifte, com uma fenda rochosa com apenas dois metros de largura e um nome — lago do
    inferno — nascido da maldição de um xamã.
observaciones:
  es: >-
    Los perros van atados. Acampa solo en los sitios habilitados y enciende fuego solo en los hogares
    señalados; con aviso de incendio forestal, no se puede encender ninguna hoguera. No hay papeleras ni
    puntos de reciclaje: llévate todo lo que traes. Puedes recoger bayas y setas comestibles, pero no otras
    plantas. Los móviles funcionan bastante bien, salvo donde los cantiles o el bosque bloquean la señal.
    Consulta los avisos y el estado actual del parque antes de salir.
texto:
  es:
    intro: >-
      Una grieta de apenas un par de metros de ancho que baja en picado hasta un lago: eso es Helvetinkolu, el
      emblema del Parque Nacional de Helvetinjärvi, en el municipio de Ruovesi, en la región de Pirkanmaa.
      Hace entre 150 y 200 millones de años, el desplazamiento de la corteza terrestre abrió aquí dos valles
      de falla, y los lagos que llenan sus fondos forman cadenas estrechas, de orillas empinadas, que se
      pierden de vista. Sobre ellos se extiende una de las muestras de bosque salvaje de Tavastia, en un
      parque de unos cincuenta kilómetros cuadrados creado en 1982.
    landscape: >-
      Todo gira en torno a las dos fallas. En la más profunda se alinean los lagos Kovero, Luomajärvi, Iso
      Helvetinjärvi, Pikku Helvetinjärvi y Pitkä Helvetinjärvi, una cadena estrecha y de paredes empinadas.
      Helvetinkolu se abre al sureste del Iso Helvetinjärvi y desciende, estrecha y vertical, hasta la orilla.
      Las rocas y los cantiles dividen la vida en dos: en lo alto, al sol, dominan líquenes y musgos como el
      liquen de los renos; en la sombra de los cantiles crece un musgo de horquilla de hoja larga.


      Los bosques que bordean los valles de falla, los lagos y las pequeñas charcas están entre los más viejos
      del parque, y quedan partes del monte antiguo en estado natural. Por eso el sendero entre Helvetinkolu y
      el lago Luomajärvi es la mejor manera de ver el bosque viejo. El parque está en el límite entre zonas de
      vegetación, así que conviven especies del sur, como Woodsia ilvensis, y del norte, como Lychnis alpina.
      Alrededor de la garganta el suelo es mejor y el bosque de hierbas es más variado: Hepatica nobilis,
      Matteuccia struthiopteris y tilo de hoja pequeña.
    wildlife: >-
      La fauna que cuentan las fuentes se concentra en el agua y en el aire. El lago Haukkajärvi es un área de
      cría importante, y sus islas albergan una gaviota sombría en peligro crítico, sensible a las molestias.
      Por eso el acceso a las islas está prohibido del 15 de abril al 31 de julio. Entre las plantas, hay
      musgos, líquenes y hongos de repisa amenazados, y bosques con hongos típicos de bosque viejo, como
      Phellinus lundellii y Fomitopsis rosea.


      El invierno cambia el parque. Los senderos no tienen mantenimiento en invierno y las pendientes están
      peligrosamente resbaladizas; en cambio, se puede caminar, esquiar, remar y navegar en canoa libremente
      fuera de las zonas restringidas.
    visit: >-
      El parque es un destino excelente para una excursión de un día, con unos 40 km de senderos marcados,
      exigentes en algunos tramos por los desniveles. Los senderos son Haukanhieta-Heinälahti,
      Haukanhieta-Helvetinkolu (5,5 km), un sendero exigente accesible desde Haukanhieta y el sendero natural
      Helvetistä Itään.


      El Helvetistä Itään, de 3,9 km, es la ruta clásica: lleva a los mejores miradores sobre Helvetinkolu y
      es apto para toda la familia. La primera mitad es ancha y muy fácil; la segunda va por senda de bosque y
      pasarelas y cruza turberas húmedas y pinares de turbera. Se recomienda en sentido contrario a las agujas
      del reloj. En Helvetinkolu una larga y empinada escalera de madera baja hasta la orilla del Iso
      Helvetinjärvi, donde hay una caseta de día, un hogar y un baño seco. Al final del recorrido hay una
      pequeña cascada. Los cantiles del mirador no tienen vallas: ve con cuidado. Y no camines por el fondo de
      la grieta: no se permite por seguridad.


      Para el verano, la playa natural de arena de Haukanhieta, en el lago Haukkajärvi, es un buen lugar de
      descanso.
    history: >-
      Helvetinkolu era ya una atracción en el siglo XIX, y el pintor Akseli Gallen-Kallela y el poeta J. L.
      Runeberg admiraron su paisaje. A principios de los años 1890, Gallen-Kallela recorrió la zona con el
      artista Louis Sparre, y ambos retrataron a la gente y el paisaje. Según la leyenda, un brujo maldijo el
      lago: no habría lucios mientras sus uñas siguieran blandas, y de ahí el nombre, lago del infierno.


      Para conservar el paisaje, Metsähallitus creó cuatro bosques de paisaje: primero Helvetinkolu, en los
      años 1950, y después las orillas del Haukkajärvi, en los 1960. Casi todos los humedales del parque se
      han restaurado, y se hacen quemas de restauración que imitan los incendios naturales.
    before: >-
      Los perros van atados. Acampa solo en los sitios habilitados y enciende fuego solo en los hogares
      señalados; con aviso de incendio forestal, no se puede encender ninguna hoguera. No hay papeleras ni
      puntos de reciclaje: llévate todo lo que traes. Puedes recoger bayas y setas comestibles, pero no otras
      plantas. Los móviles funcionan bastante bien, salvo donde los cantiles o el bosque bloquean la señal.
      Consulta los avisos y el estado actual del parque antes de salir.
  en:
    intro: >-
      A cleft barely a couple of metres wide that drops sheer down to a lake: that is Helvetinkolu, the emblem
      of Helvetinjärvi National Park, in the municipality of Ruovesi, in the Pirkanmaa region. Between 150 and
      200 million years ago, tectonic plate shifts split the earth here into two rift valleys, and the narrow
      lakes filling their floors form steep-sided chains stretching as far as the eye can see. Above them lies
      one of Tavastia's finest tracts of wilderness, protected within a fifty-square-kilometre park
      established in 1982.
    landscape: >-
      Everything here revolves around the two faults. Along the deeper one lie lakes Kovero, Luomajärvi, Iso
      Helvetinjärvi, Pikku Helvetinjärvi, and Pitkä Helvetinjärvi, a narrow, sheer-walled sequence of waters.
      Helvetinkolu opens southeast of Iso Helvetinjärvi, descending narrow and vertical all the way to the
      water's edge. Rocks and cliff faces split life in two: up top in the sunlight, lichens and mosses such
      as reindeer lichen reign supreme, while deep in the damp shade of the cliffs thrives long-leaved
      fork-moss.


      The forests fringing the rift valleys, lakes, and small woodland ponds rank among the oldest in the
      park, with notable stands of primeval woodland preserved in a natural state. For this reason, the trail
      connecting Helvetinkolu and Lake Luomajärvi provides the best route to admire the old-growth forest. The
      park straddles the boundary between southern and northern vegetation zones, allowing southern species
      like Woodsia ilvensis to grow alongside northern ones like Lychnis alpina. Around the gorge, richer
      soils nourish a more diverse herb-rich forest with Hepatica nobilis, ostrich fern (Matteuccia
      struthiopteris), and small-leaved lime.
    wildlife: >-
      The fauna highlighted in park records is concentrated in the water and the air. Lake Haukkajärvi serves
      as a vital breeding haven, its islands harbouring a critically endangered lesser black-backed gull
      colony highly vulnerable to disturbance. Access to these nesting islands is strictly forbidden from 15
      April to 31 July. Plant life includes threatened mosses, lichens, and bracket fungi, alongside typical
      old-growth indicator species like Phellinus lundellii and Fomitopsis rosea.


      Winter transforms the park entirely. The paths receive no winter maintenance and steep slopes become
      treacherous; however, you can freely walk, ski, row, or paddle canoes outside the designated restricted
      zones.
    visit: >-
      The park makes a superb day-trip destination, offering around 40 km of marked trails that can prove
      demanding in sections due to sharp elevation changes. Major marked paths include Haukanhieta-Heinälahti,
      Haukanhieta-Helvetinkolu (5.5 km), a challenging loop starting at Haukanhieta, and the nature trail
      Helvetistä Itään.


      The 3.9 km Helvetistä Itään trail is the classic route: it leads to the finest vantage points over
      Helvetinkolu and is suitable for the entire family. Its first half is broad and easy; the second follows
      rugged forest paths and boardwalks across moist bogs and pine mires. Walking counter-clockwise is
      recommended. At Helvetinkolu, a long, steep wooden staircase descends to the shore of Iso Helvetinjärvi,
      where you will find a day cabin, a fire pit, and a dry toilet. A small waterfall awaits near the end of
      the circuit. The cliff edge at the lookout lacks guardrails, so watch your footing carefully. Walking
      along the bottom of the gorge is prohibited for safety reasons.


      In summer, the natural sandy beach of Haukanhieta on Lake Haukkajärvi offers a pleasant spot to rest.
    history: >-
      Helvetinkolu was already a celebrated attraction in the nineteenth century, admired by painter Akseli
      Gallen-Kallela and national poet J. L. Runeberg. In the early 1890s, Gallen-Kallela travelled the area
      with fellow artist Louis Sparre, both sketching the local people and dramatic topography. According to
      folklore, a sorcerer cursed the lake declaring that no pike would inhabit it as long as his fingernails
      remained soft—giving rise to the name, Hell's Lake.


      To preserve this scenery, the Finnish forest service Metsähallitus designated four scenic protection
      forests: first Helvetinkolu during the 1950s, followed by the shores of Haukkajärvi in the 1960s. Almost
      all park wetlands have undergone ecological restoration, supplemented by controlled burning mimicking
      natural wildfires.
    before: >-
      Dogs must be kept on a leash at all times. Camp only at designated sites and light campfires exclusively
      in the official fire rings; during forest fire warnings, open flames are entirely forbidden. There are
      no bins or recycling containers: pack out all your rubbish. You may forage edible wild berries and
      mushrooms, but leave other plants undisturbed. Mobile reception is generally good, though deep cliffs
      and thick woods can disrupt signals. Check park alerts and track conditions before you set out.
  fr:
    intro: >-
      Une fissure d'à peine deux mètres de large qui plonge à pic vers un lac : voilà Helvetinkolu, l'emblème
      du parc national d'Helvetinjärvi, dans la commune de Ruovesi, en région de Pirkanmaa. Il y a entre 150
      et 200 millions d'années, les mouvements de l'écorce terrestre ont ouvert ici deux vallées de faille, et
      les lacs qui occupent leurs fonds forment des chapelets étroits aux rives abruptes s'étirant à perte de
      vue. Au-dessus s'étend l'un des plus beaux massifs forestiers sauvages de Tavastie, au sein d'un parc
      d'une cinquantaine de kilomètres carrés créé en 1982.
    landscape: >-
      Tout gravite autour des deux failles. Dans la plus profonde s'égrènent les lacs Kovero, Luomajärvi, Iso
      Helvetinjärvi, Pikku Helvetinjärvi et Pitkä Helvetinjärvi, un chapelet resserré bordé de parois
      abruptes. Helvetinkolu s'ouvre au sud-est de l'Iso Helvetinjärvi et plonge, étroite et verticale,
      jusqu'à la rive. Les falaises et les rochers partagent la vie en deux : au sommet, baignés de soleil,
      s'épanouissent lichens et mousses comme le lichen des rennes ; dans l'ombre humide des parois croît une
      mousse fourchue aux feuilles allongées.


      Les forêts qui bordent les vallées d'effondrement, les lacs et les petites tourbières comptent parmi les
      plus anciennes du parc, avec des secteurs de forêt primaire encore intacts. C'est pourquoi le sentier
      reliant Helvetinkolu au lac Luomajärvi offre la meilleure occasion d'admirer cette vieille forêt. Situé
      à la frontière des zones de végétation, le parc fait cohabiter des espèces méridionales comme Woodsia
      ilvensis et boréales comme Lychnis alpina. Autour de la gorge, un sol plus fertile nourrit une riche
      forêt de feuillus avec Hepatica nobilis, la fougère plume d'autruche (Matteuccia struthiopteris) et le
      tilleul à petites feuilles.
    wildlife: >-
      La faune documentée par les gestionnaires se concentre dans l'eau et dans les airs. Le lac Haukkajärvi
      constitue une zone de nidification majeure, et ses îlots abritent une colonie de goélands bruns en
      danger critique d'extinction, très vulnérables au dérangement. L'accès aux îles est donc rigoureusement
      interdit du 15 avril au 31 juillet. La flore compte des mousses, des lichens et des polypores menacés,
      ainsi que des champignons inféodés aux vieux bois comme Phellinus lundellii et Fomitopsis rosea.


      L'hiver métamorphose les lieux. Les sentiers ne sont pas déneigés et les pentes deviennent très
      glissantes ; en revanche, vous pouvez marcher, skier, ramer et canoter en toute liberté en dehors des
      zones soumises à restrictions.
    visit: >-
      Le parc est une destination idéale pour une excursion d'une journée, offrant près de 40 km de sentiers
      balisés parfois exigeants en raison du relief escarpé. Les itinéraires principaux comprennent
      Haukanhieta-Heinälahti, Haukanhieta-Helvetinkolu (5,5 km), une boucle technique au départ de Haukanhieta
      et le sentier de découverte Helvetistä Itään.


      Le sentier Helvetistä Itään, long de 3,9 km, est le grand classique : il dessert les plus beaux points
      de vue sur Helvetinkolu et convient à toute la famille. Sa première moitié est large et accessible ; la
      seconde emprunte des chemins forestiers et des passerelles en bois traversant des tourbières humides et
      des pinèdes marécageuses. Il est conseillé de l'effectuer dans le sens inverse des aiguilles d'une
      montre. À Helvetinkolu, un long escalier de bois raide descend jusqu'au bord de l'Iso Helvetinjärvi,
      pourvu d'un abri de jour, d'un foyer pour le feu et de toilettes sèches. Une petite cascade se découvre
      vers la fin du parcours. Les falaises du belvédère sont dépourvues de barrières : progressez prudemment.
      Il est interdit de marcher au fond de la faille pour des motifs de sécurité.


      En été, la plage de sable naturel de Haukanhieta, au bord du lac Haukkajärvi, offre une halte bienvenue.
    history: >-
      Helvetinkolu attirait déjà les voyageurs au XIXe siècle, et le peintre Akseli Gallen-Kallela ainsi que
      le poète national J. L. Runeberg vinrent célébrer sa beauté sauvage. Au tout début des années 1890,
      Gallen-Kallela sillonna la région en compagnie de l'artiste Louis Sparre, dessinant les habitants et les
      paysages. D'après la légende, un sorcier jeta un sort sur le lac en décrétant qu'aucun brochet n'y
      nagerait tant que ses ongles resteraient mous, valant au site son surnom de lac de l'enfer.


      Afin de préserver ce patrimoine naturel, l'administration forestière Metsähallitus protégea quatre
      forêts paysagères : d'abord Helvetinkolu dans les années 1950, puis les rives de l'Haukkajärvi dans les
      années 1960. La quasi-totalité des zones humides a été restaurée, accompagnée de brûlages dirigés
      reproduisant le cycle naturel des incendies.
    before: >-
      Les chiens doivent être tenus en laisse. Ne campez que sur les emplacements autorisés et n'allumez de
      feux que dans les foyers aménagés ; en période d'alerte aux feux de forêt, tout feu est prohibé. Le parc
      ne dispose d'aucune poubelle : remportez l'ensemble de vos déchets. La cueillette des baies et
      champignons comestibles est permise, mais les autres végétaux sont protégés. La couverture réseau est
      satisfaisante, hormis au pied des falaises ou sous couvert dense. Vérifiez les avis officiels avant
      votre départ.
  de:
    intro: >-
      Ein kaum zwei Meter breiter Felsspalt, der steil zu einem See hinabfällt: Das ist Helvetinkolu, das
      Wahrzeichen des Nationalparks Helvetinjärvi in der Gemeinde Ruovesi in der Region Pirkanmaa. Vor 150 bis
      200 Millionen Jahren rissen tektonische Erdbewegungen hier zwei Grabenbrüche auf, deren steilwandige
      Seenketten sich schmal bis zum Horizont erstrecken. Darüber dehnt sich ein urwüchsiger Wald Tavastlands
      in einem rund fünfzig Quadratkilometer großen Schutzgebiet aus, das 1982 ausgewiesen wurde.
    landscape: >-
      Alles dreht sich hier um die beiden Grabenbrüche. Im tieferen Tal reihen sich die Seen Kovero,
      Luomajärvi, Iso Helvetinjärvi, Pikku Helvetinjärvi und Pitkä Helvetinjärvi wie an einer Kette
      aneinander. Helvetinkolu öffnet sich südöstlich des Iso Helvetinjärvi und stürzt als schmale Felsspalte
      senkrecht zum Ufer ab. Felsen und Steilwände teilen die Natur: Oben in der Sonne dominieren Flechten wie
      die Rentierflechte und Moose, während im feuchten Schatten der Schluchtwände das langblättrige Gabelmoos
      wächst.


      Die Wälder entlang der Bruchtäler, Seen und Waldteiche gehören zu den ältesten des Parks, und weite
      Flächen haben ihren urwaldartigen Zustand bewahrt. Der Wanderweg zwischen Helvetinkolu und dem
      Luomajärvi ist die schönste Route, um diese Altwälder zu erleben. Durch seine Lage am Übergang zweier
      Vegetationszonen begegnen sich hier südliche Arten wie Woodsia ilvensis und nördliche Pflanzen wie
      Lychnis alpina. In der Schluchtumgebung sind die Böden nährstoffreicher und bringen artenreiche
      Laubmischwälder mit Leberblümchen (Hepatica nobilis), Straußfarn (Matteuccia struthiopteris) und
      Winterlinde hervor.
    wildlife: >-
      Die Tierwelt konzentriert sich vor allem auf Wasser und Luft. Der See Haukkajärvi ist ein wichtiges
      Brutgewässer, dessen Inseln eine vom Aussterben bedrohte, störungsempfindliche Heringsmöwenkolonie
      beherbergen. Das Betreten der Inseln ist daher vom 15. April bis zum 31. Juli streng verboten. Unter den
      Pflanzen finden sich gefährdete Moose, Flechten und Baumpilze sowie typische Altwaldpilze wie Phellinus
      lundellii und Fomitopsis rosea.


      Der Winter verwandelt den Park. Die Wege werden im Winter nicht geräumt und steile Hänge sind tückisch
      glatt; abseits der Ruhezonen darfst du dich jedoch auf Skiern, Schneeschuhen oder zu Fuß frei bewegen,
      rudern oder paddeln.
    visit: >-
      Der Nationalpark eignet sich hervorragend für Tagesausflüge und bietet rund 40 km markierte Wanderwege,
      die stellenweise durch steile Anstiege fordern. Bekannte Routen sind Haukanhieta-Heinälahti,
      Haukanhieta-Helvetinkolu (5,5 km), ein anspruchsvoller Rundweg ab Haukanhieta sowie der Lehrpfad
      Helvetistä Itään.


      Der 3,9 km lange Weg Helvetistä Itään ist der Klassiker: Er führt zu den schönsten Aussichtspunkten über
      Helvetinkolu und eignet sich für die ganze Familie. Die erste Hälfte verläuft breit und eben, der zweite
      Teil führt über schmale Waldpfade und Holzstege durch feuchte Moore und Moorwälder. Es empfiehlt sich,
      gegen den Uhrzeigersinn zu wandern. An der Felsspalte Helvetinkolu führt eine lange, steile Holztreppe
      hinab zum Seeufer des Iso Helvetinjärvi, wo eine Tageshütte, eine Feuerstelle und eine Trockentoilette
      bereitstehen. Am Ende der Tour rauscht ein kleiner Wasserfall. Die Felskanten an den Aussichtspunkten
      sind ungesichert: Bewege dich achtsam. Das Gehen auf dem Grund der Felsspalte ist aus Sicherheitsgründen
      untersagt.


      Im Sommer lädt der natürliche Sandstrand Haukanhieta am See Haukkajärvi zum Verweilen ein.
    history: >-
      Helvetinkolu war schon im neunzehnten Jahrhundert ein beliebtes Ausflugsziel; der Maler Akseli
      Gallen-Kallela und der Dichter J. L. Runeberg ließen sich von der rauen Landschaft inspirieren. Anfang
      der 1890er-Jahre bereiste Gallen-Kallela das Gebiet zusammen mit Louis Sparre und zeichnete Land und
      Leute. Der Sage nach verfluchte ein Zauberer den See, sodass keine Hechte gedeihen würden, solange seine
      Fingernägel weich blieben – so entstand der Name Höllensee.


      Um die Landschaft zu schützen, wies Metsähallitus vier Landschaftsschutzwälder aus: zuerst Helvetinkolu
      in den 1950er-Jahren, später die Ufer des Haukkajärvi in den 1960er-Jahren. Fast alle Feuchtgebiete im
      Park wurden renaturiert, unterstützt durch gezieltes Abbrennen zur Nachahmung natürlicher Waldbrände.
    before: >-
      Hunde gehören an die Leine. Zelte ausschließlich auf den ausgewiesenen Plätzen und entzünde Feuer nur an
      den offiziellen Feuerstellen; bei Waldbrandwarnung ist jedes offene Feuer streng verboten. Es gibt keine
      Mülleimer: Nimm all deine Abfälle wieder mit. Du darfst essbare Beeren und Pilze sammeln, alle anderen
      Pflanzen stehen unter Schutz. Der Mobilfunkempfang ist überwiegend stabil, außer in tiefen Schluchten
      oder dichten Beständen. Informiere dich vorab über aktuelle Parkhinweise.
  it:
    intro: >-
      Una fenditura rocciosa larga appena un paio di metri che scende a strapiombo verso un lago: questo è
      Helvetinkolu, l'emblema del Parco nazionale di Helvetinjärvi, nel comune di Ruovesi, nella regione di
      Pirkanmaa. Tra 150 e 200 milioni di anni fa, i movimenti della crosta terrestre aprirono qui due valli
      di faglia, e i laghi che ne riempiono i fondovalle formano catene strette dalle rive scoscese che si
      perdono a vista d'occhio. Al di sopra si estende un lembo intatto di foreste della Tavastia, in un parco
      di una cinquantina di chilometri quadrati istituito nel 1982.
    landscape: >-
      Tutto ruota attorno alle due faglie. Nella più profonda si allineano i laghi Kovero, Luomajärvi, Iso
      Helvetinjärvi, Pikku Helvetinjärvi e Pitkä Helvetinjärvi, una sequenza d'acqua racchiusa da ripide
      pareti. Helvetinkolu si apre a sudest dell'Iso Helvetinjärvi e precipita, stretta e verticale, sino alla
      riva. Le rocce e le scogliere dividono la vita in due: in alto, al sole, dominano licheni e muschi come
      il lichene delle renne; nell'ombra umida delle pareti cresce un muschio biforcuto a foglie lunghe.


      I boschi che costeggiano le fosse tettoniche, i laghi e i piccoli specchi d'acqua sono tra i più antichi
      del parco, con ampie porzioni di foresta vergine allo stato naturale. Per questo il sentiero tra
      Helvetinkolu e il lago Luomajärvi è l'itinerario migliore per ammirare il bosco vetusto. Il parco sorge
      al confine tra diverse fasce vegetazionali, facendo convivere specie meridionali come Woodsia ilvensis e
      settentrionali come Lychnis alpina. Attorno alla gola il terreno è più fertile e il bosco di erbe più
      rigoglioso, accogliendo Hepatica nobilis, felce piuma di struzzo (Matteuccia struthiopteris) e tiglio
      selvatico.
    wildlife: >-
      La fauna documentata si concentra nell'acqua e nell'aria. Il lago Haukkajärvi è un'importante area di
      nidificazione, e le sue isole ospitano lo zafferano comune, specie in pericolo critico e assai sensibile
      al disturbo. L'accesso alle isole è pertanto vietato dal 15 aprile al 31 luglio. Tra i vegetali spiccano
      muschi, licheni e funghi a mensola minacciati, oltre a specie fungine legate alle foreste vetuste come
      Phellinus lundellii e Fomitopsis rosea.


      L'inverno trasforma radicalmente il parco. I sentieri non sono soggetti a manutenzione invernale e i
      pendii diventano pericolosamente scivolosi; al di fuori delle zone di riserva integrale puoi comunque
      camminare, sciare, remare e andare liberamente in canoa.
    visit: >-
      Il parco è una meta eccellente per un'escursione in giornata, con circa 40 km di sentieri segnati,
      impegnativi in alcuni tratti per i ripidi dislivelli. I percorsi principali includono
      Haukanhieta-Heinälahti, Haukanhieta-Helvetinkolu (5,5 km), un anello escursionistico con partenza da
      Haukanhieta e il sentiero didattico Helvetistä Itään.


      L'itinerario Helvetistä Itään, lungo 3,9 km, è il tracciato classico: conduce ai migliori punti
      panoramici su Helvetinkolu ed è adatto a tutta la famiglia. La prima metà è pianeggiante e agevole; la
      seconda segue sentieri boschivi e passerelle in legno attraverso torbiere umide e pinete palustri. È
      consigliabile percorrerlo in senso antiorario. A Helvetinkolu una ripida scala di legno scende fino alla
      riva dell'Iso Helvetinjärvi, dove si trovano un rifugio diurno, un focolare e un bagno a secco. Al
      termine dell'itinerario si incontra una piccola cascata. Le scogliere panoramiche sono prive di
      parapetti: procedi con attenzione. È vietato scendere sul fondo della gola per motivi di sicurezza.


      In estate, la spiaggia sabbiosa naturale di Haukanhieta sul lago Haukkajärvi offre un ottimo punto di
      sosta.
    history: >-
      Helvetinkolu era già un'attrazione rinomata nel XIX secolo, celebrata dal pittore Akseli Gallen-Kallela
      e dal poeta nazionale J. L. Runeberg. All'inizio degli anni 1890, Gallen-Kallela esplorò l'area insieme
      all'artista Louis Sparre, ritraendone abitanti e paesaggi. Secondo la leggenda locale, uno sciamano
      maledisse il lago stabilendo che non vi sarebbero stati lucci finché le sue unghie fossero rimaste
      morbide, da cui il nome di lago dell'inferno.


      Per preservare il paesaggio, l'ente forestale Metsähallitus istituì quattro foreste panoramiche
      protette: prima Helvetinkolu negli anni 1950, poi le sponde dell'Haukkajärvi negli anni 1960. Quasi
      tutte le zone umide sono state ripristinate, anche mediante incendi controllati che replicano i cicli
      naturali.
    before: >-
      I cani vanno tenuti al guinzaglio. Campeggia solo nelle aree attrezzate e accendi fuochi esclusivamente
      nei punti fuoco autorizzati; in caso di allerta incendi boschivi è vietata qualsiasi fiamma libera. Non
      ci sono cestini per i rifiuti: riporta con te tutto ciò che porti. Puoi raccogliere bacche e funghi
      commestibili, ma le altre piante non vanno toccate. La copertura cellulare è soddisfacente, tranne nei
      punti in cui scarpate e fitta boscaglia schermano il segnale. Informati sugli avvisi ufficiali prima di
      partire.
  pt:
    intro: >-
      Uma fenda de apenas dois metros de largura que desce a pique até a um lago: eis Helvetinkolu, o emblema
      do Parque Nacional de Helvetinjärvi, no município de Ruovesi, na região de Pirkanmaa. Há entre 150 e 200
      milhões de anos, os movimentos da crosta terrestre abriram aqui dois vales de falha, e os lagos que
      preenchem os seus fundos formam cadeias estreitas de margens escarpadas que se perdem no horizonte.
      Sobre eles estende-se uma das melhores parcelas de floresta selvagem de Tavastia, num parque com cerca
      de cinquenta quilómetros quadrados criado em 1982.
    landscape: >-
      Tudo aqui gira em torno das duas falhas. Na mais profunda alinham-se os lagos Kovero, Luomajärvi, Iso
      Helvetinjärvi, Pikku Helvetinjärvi e Pitkä Helvetinjärvi, uma cadeia estreita ladeada por vertentes
      abruptas. Helvetinkolu rasga-se a sudeste do Iso Helvetinjärvi e desce, estreita e vertical, até à
      margem. As rochas e as escarpas dividem a vida em duas: no topo soalheiro dominam líquenes e musgos como
      o líquen-das-renas; na sombra húmida dos penhascos medra o musgo-bifurcado de folhas compridas.


      As matas que marginam as falhas tectónicas, os lagos e as lagoas florestais estão entre as mais velhas
      do parque, conservando manchas de floresta antiga em estado virgem. Por essa razão, o trilho entre
      Helvetinkolu e o lago Luomajärvi é a melhor rota para admirar o bosque primitivo. Situado na fronteira
      entre zonas biogeográficas, o parque reúne espécies meridionais como Woodsia ilvensis e boreais como
      Lychnis alpina. Em redor do desfiladeiro o solo é mais rico e a mata herbácea mais diversa, albergando
      Hepatica nobilis, feto-avestruz (Matteuccia struthiopteris) e tília-de-folhas-pequenas.
    wildlife: >-
      A fauna registada nas fontes concentra-se na água e no ar. O lago Haukkajärvi constitui um sítio de
      nidificação vital, e os seus ilhéus acolhem uma colónia de gaivota-d'asa-escura criticamente ameaçada e
      muito sensível à perturbação. O acesso às ilhas está interdito de 15 de abril a 31 de julho. Na flora
      destacam-se musgos, líquenes e fungos de prateleira raros, além de cogumelos típicos de matas maduras
      como Phellinus lundellii e Fomitopsis rosea.


      O inverno muda a paisagem. Os trilhos não têm manutenção na neve e as encostas ficam muito
      escorregadias; fora das zonas de reserva integral podes caminhar, esquiar, remar e navegar livremente em
      canoa.
    visit: >-
      O parque é um excelente destino para uma caminhada de um dia, com cerca de 40 km de trilhos sinalizados
      com declives por vezes exigentes. Os trilhos incluem Haukanhieta-Heinälahti, Haukanhieta-Helvetinkolu
      (5,5 km), um circuito puxado com início em Haukanhieta e o trilho natural Helvetistä Itään.


      O trilho Helvetistä Itään, com 3,9 km, é a rota clássica: conduz aos melhores miradouros sobre
      Helvetinkolu e é adequado a toda a família. A primeira metade é larga e suave; a segunda segue por
      carreiros de floresta e passadiços sobre turfeiras húmidas e pinhais pantanosos. Recomenda-se o sentido
      anti-horário. Em Helvetinkolu, uma longa e íngreme escadaria de madeira desce até à margem do Iso
      Helvetinjärvi, onde existem um abrigo diurno, um ponto de fogueira e um sanitário seco. No final do
      percurso surge uma pequena cascata. As escarpas dos miradouros não têm guarda-corpos: caminha com
      cautela. Não desças ao fundo da fenda rochosa por motivos de segurança.


      No verão, a praia natural de areia de Haukanhieta, no lago Haukkajärvi, é um local agradável para
      descansar.
    history: >-
      Helvetinkolu era já uma atração famosa no século XIX, apreciada pelo pintor Akseli Gallen-Kallela e pelo
      poeta nacional J. L. Runeberg. No início da década de 1890, Gallen-Kallela percorreu a área com o
      artista Louis Sparre, retratando o povo e a paisagem. Segundo a lenda local, um xamã amaldiçoou o lago
      afirmando que não haveria lúcios enquanto as suas unhas fossem macias — daí a designação de lago do
      inferno.


      Para proteger o património paisagístico, o serviço florestal Metsähallitus criou quatro áreas
      protegidas: primeiro Helvetinkolu, na década de 1950, e mais tarde as margens do Haukkajärvi, na de
      1960. Praticamente todas as zonas húmidas foram restauradas, complementadas com queimadas controladas
      que imitam os incêndios florestais naturais.
    before: >-
      Os cães devem andar com trela. Acampa apenas nos locais autorizados e acende fogueiras exclusivamente
      nos pontos próprios; em risco de incêndio florestal é proibido acender qualquer fogo. Não existem
      caixotes do lixo: traz todos os teus resíduos de volta. Podes apanhar bagas e cogumelos silvestres
      comestíveis, mas não colhas outras plantas. A rede móvel funciona genericamente bem, exceto onde as
      escarpas ou o arvoredo denso bloqueiam o sinal. Consulta os avisos oficiais antes de partir.
