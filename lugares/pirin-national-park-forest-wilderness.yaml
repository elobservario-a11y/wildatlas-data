resumen:
  es: Cumbres graníticas y kársticas dramáticas con el pino de Baykushev (más de 1.300 años de antigüedad).
  en: Dramatic granite and karst peaks sheltering the ancient Baykushev pine (over 1,300 years old).
  fr: Crêtes granitiques et karstiques spectaculaires abritant le pin de Baykushev (âgé de plus de 1 300 ans).
  de: Dramatische Granit- und Karstgipfel mit der uralten Baykushev-Kiefer (über 1.300 Jahre alt).
  it: Spettacolari vette granitiche e calcaree con il pino di Baykushev (oltre 1.300 anni di età).
  pt: Cumes graníticos e cársticos dramáticos com o pinheiro de Baykushev (com mais de 1.300 anos de idade).
unico:
  es: Aquí crece un pino de unos 1 300 años, el de Baykushev, y también el glaciar más al sur de Europa.
  en: Home to the Baykushev pine, roughly 1,300 years old, and the southernmost glacier in Europe.
  fr: Ici vit un pin d'environ 1 300 ans, le pin de Baykushev, ainsi que le glacier le plus méridional d'Europe.
  de: >-
    Hier wächst eine rund 1 300 Jahre alte Panzerkiefer, die Baykushev-Kiefer, und liegt der südlichste
    Gletscher Europas.
  it: >-
    Qui cresce un pino loricato di circa 1 300 anni, il pino di Baykushev, e si trova il ghiacciaio più
    meridionale d'Europa.
  pt: >-
    Aqui cresce um pinheiro com cerca de 1 300 anos, o pinheiro de Baykushev, e situa-se o glaciar mais
    meridional da Europa.
