texto:
  es:
    intro: >-
      Bajo la cumbre más alta del macizo, en el circo Golemiya Kazan, queda un resto de hielo de la última
      edad glaciar: Snezhnika, el glaciar más meridional de Europa. Ese detalle resume Pirin. El parque
      nacional cubre la mayor parte de los montes Pirin, en el suroeste de Bulgaria, sube de 950 m a los 2 914
      m del Vihren y no tiene un solo núcleo de población en su interior. Es una montaña alpina en pleno sur
      de los Balcanes, con lagos glaciares y mármol, y con el pino más viejo del país.
    landscape: >-
      El relieve de Pirin es obra del hielo. En el Pleistoceno la montaña sufrió una glaciación alpina, y de
      ella quedan 118 lagos glaciares, muchos en circos; el mayor y más profundo es el Popovo. También quedan
      dos pequeños glaciares, Snezhnika y Banski Suhodol.


      La roca cambia de norte a sur. La cresta del Vihren, de mármol, reúne las tres cumbres más altas del
      macizo: Vihren (2 914 m), Kutelo (2 908 m) y Banski Suhodol (2 884 m), y entre ellas se levanta la
      cresta de Koncheto. Casi el 60 % del parque está por encima de los 2 000 m.


      En invierno nieva mucho. Por encima de los 1 800 m la nieve alcanza los 160-180 cm en marzo, y los
      aludes son frecuentes.


      La vegetación se ordena por pisos: bosque, subalpino y alpino. Los bosques cubren el 57,3 % del parque,
      y el 95 % de ellos son de coníferas. Entre los árboles, el pino mugo es el que ocupa más superficie,
      seguido del [pino macedonio](/especie/pinus_peuce/), el abeto rojo, el haya y el [pino
      bosnio](/especie/pinus_heldreichii/). Los pinos macedonio y bosnio de Pirin suponen el 42 % y el 52 % de
      su superficie total en Bulgaria. El más famoso, el pino de Baykushev, es el árbol más viejo del país: un
      pino bosnio de unos 1 300 años. En el piso subalpino dominan el pino mugo y el enebro siberiano.


      Pirin alberga 17 endemismos locales, 36 búlgaros y 110 balcánicos. Entre los locales está la amapola de
      Pirin (Papaver degenii), y el parque registra 165 especies vegetales protegidas por ley.
    wildlife: >-
      Hay 240 especies de vertebrados registradas, incluidas 166 aves y 50 mamíferos. Entre las especies de
      mayor valor de conservación están el [oso pardo](/especie/ursus_arctos/), el
      [lobo](/especie/canis_lupus/), el [gato montés](/especie/felis_silvestris/), la
      [marta](/especie/martes_martes/), el [jabalí](/especie/sus_scrofa/), el
      [ciervo](/especie/cervus_elaphus/), el [corzo](/especie/capreolus_capreolus/) y el [rebeco
      balcánico](/especie/rupicapra_rupicapra/), un endemismo de los Balcanes. El topillo nival europeo es una
      especie relicta.


      Entre las aves, tres especies son relictas: el mochuelo boreal, el [pico
      dorsiblanco](/especie/dendrocopos_leucotos/) y el [pico tridáctilo](/especie/picoides_tridactylus/).
      Entre las más raras figuran el [águila real](/especie/aquila_chrysaetos/), el águila culebrera, el
      [halcón sacre](/especie/falco_cherrug/), el [halcón peregrino](/especie/falco_peregrinus/), el
      [urogallo](/especie/tetrao_urogallus/), el grévol y la perdiz griega.


      En los arroyos y lagos viven pocas especies de peces, como la [trucha común](/especie/salmo_trutta/), y
      la [anguila europea](/especie/anguilla_anguilla/) se da por extinta. Entre los anfibios y reptiles hay
      [salamandra común](/especie/salamandra_salamandra/), sapo de vientre amarillo, víbora común y lagartija
      vivípara. Entre las mariposas más vistosas está la apolo de montaña (Parnassius apollo).
    visit: >-
      Casi todo empieza en Bansko, donde está el centro de información principal del parque, con una
      exposición interactiva sobre sus bosques, su vegetación y su fauna. Hay otro centro en Sandanski. Desde
      Bansko, el sendero III conecta la ciudad con el refugio Banderitsa y el refugio Vihren; Banderitsa se
      construyó en 1915 por orden del zar Fernando I de Bulgaria.


      El parque mantiene 20 senderos señalizados que atraviesan circos, lagos, crestas y formaciones rocosas.
      El número 1, parte del sendero europeo E4, cruza el macizo del refugio Predel al refugio Yavorov, el
      Vihren, el lago Tevno, el refugio Pirin y Popovi Livadi. El itinerario V conecta Dobrinishte, Gotse
      Delchev y Bezbog antes de seguir hacia Melnik.


      El tramo más exigente es la cresta de Koncheto, a unos 2 810 m, entre Banski Suhodol y Kutelo.
    history: >-
      El parque se creó en 1962 para preservar sus ecosistemas, paisajes y comunidades de plantas y animales,
      y en 1983 entró en la lista del Patrimonio Mundial de la UNESCO. Toda su superficie pertenece además a
      la red europea Natura. Dentro hay dos reservas naturales: Bayuvi Dupki–Dzhindzhiritsa y Yulen. Una
      dirección con sede en Bansko, dependiente del Ministerio de Medio Ambiente y Aguas, lo gestiona.


      La presión no es pequeña. Entre las amenazas están las canteras, los incendios provocados, la tala
      ilegal, la caza furtiva, el exceso de uso de senderos y, sobre todo, las estaciones de esquí. La
      estación de esquí de Bansko se amplió aunque la ley del parque prohíbe esa actividad dentro de sus
      límites.
    before: >-
      La dirección recomienda calzado estable, ropa impermeable y consultar la previsión antes de salir. La
      nieve es abundante en invierno y los aludes son frecuentes.
    around: >-
      El [Parque Nacional Rila - Bosques Antiguos](/lugar/rila-national-park-old-forests/) queda a unos 11 km,
      y la [Garganta de Kresna - Corredor Biológico del Río Struma](/lugar/kresnensko-defile/) a unos 9 km.
  en:
    intro: >-
      Beneath the massif's highest crest, nestled inside Golemiya Kazan cirque, lies a relict pocket of ice
      from the last glacial epoch: Snezhnika, Europe's southernmost glacier. That remarkable detail
      encapsulates Pirin. The national park protects the greater part of the Pirin Mountains in south-western
      Bulgaria, rising from 950 m up to the 2,914 m apex of Mount Vihren, entirely devoid of permanent human
      settlements. It is true alpine wilderness in the southern Balkans, characterized by glacial tarns, white
      marble walls and the nation's most ancient tree.
    landscape: >-
      Pirin's topography was carved by ice. During the Pleistocene epoch the range underwent extensive alpine
      glaciation, leaving 118 glacial tarns, many cupped in high cirques; Lake Popovo is both the largest and
      deepest. Two micro-glaciers persist: Snezhnika and Banski Suhodol.


      The underlying geology transitions from north to south. The towering marble Vihren ridge gathers the
      massif's three loftiest summits: Vihren (2,914 m), Kutelo (2,908 m) and Banski Suhodol (2,884 m), linked
      by the knife-edge arête of Koncheto. Nearly 60% of the park lies above 2,000 m in elevation.


      Winter brings immense snowfall. Above 1,800 m, snow accumulation reaches 160-180 cm by March, and
      avalanches are frequent.


      Vegetation is strictly stratified across montane, subalpine and alpine zones. Forests cover 57.3% of the
      park, with 95% of woodland composed of conifers. Mountain pine covers the largest area, followed by
      [Macedonian pine](/especie/pinus_peuce/), Norway spruce, European beech and [Bosnian
      pine](/especie/pinus_heldreichii/). Pirin's Macedonian and Bosnian pine forests represent 42% and 52% of
      their total range in Bulgaria. The celebrated Baykushev pine is the oldest tree in the country: a
      Bosnian pine around 1,300 years old. In the subalpine belt, dwarf mountain pine and Siberian juniper
      predominate.


      Pirin shelters 17 local endemics, 36 Bulgarian endemics and 110 Balkan endemics. Among local rarities is
      the Pirin poppy (Papaver degenii), with 165 plant species strictly protected by law.
    wildlife: >-
      Naturalists record 240 vertebrate species, including 166 birds and 50 mammals. Keystone species of high
      conservation priority include the [brown bear](/especie/ursus_arctos/), [grey
      wolf](/especie/canis_lupus/), [European wildcat](/especie/felis_silvestris/), [European pine
      marten](/especie/martes_martes/), [wild boar](/especie/sus_scrofa/), [red
      deer](/especie/cervus_elaphus/), [roe deer](/especie/capreolus_capreolus/) and the
      [chamois](/especie/rupicapra_rupicapra/), a regional Balkan endemic. The European snow vole is a glacial
      relict.


      Among birds, three species are post-glacial relicts: boreal owl, [white-backed
      woodpecker](/especie/dendrocopos_leucotos/) and [three-toed woodpecker](/especie/picoides_tridactylus/).
      Notable raptors and woodland species include the [golden eagle](/especie/aquila_chrysaetos/), short-toed
      snake eagle, [saker falcon](/especie/falco_cherrug/), [peregrine falcon](/especie/falco_peregrinus/),
      [western capercaillie](/especie/tetrao_urogallus/), hazel grouse and rock partridge.


      Mountain streams and cold tarns support a limited fish fauna including [sea
      trout](/especie/salmo_trutta/), while the [European eel](/especie/anguilla_anguilla/) is now considered
      extirpated. Amphibians and reptiles include the [fire salamander](/especie/salamandra_salamandra/),
      yellow-bellied toad, common adder and viviparous lizard. The Apollo butterfly (Parnassius apollo) is a
      standout high-mountain insect.
    visit: >-
      Most journeys begin in Bansko, site of the main park information centre featuring interactive exhibits
      on local forests, flora and fauna. A second visitor centre is situated in Sandanski. From Bansko, trail
      III connects the town with Banderitsa hut and Vihren hut; Banderitsa was constructed in 1915 on the
      orders of Tsar Ferdinand I of Bulgaria.


      The park maintains 20 marked hiking trails threading through cirques, tarns, ridges and crags. Trail 1,
      part of the European long-distance path E4, traverses the massif from Predel hut through Yavorov hut,
      Vihren, Lake Tevno, Pirin hut and Popovi Livadi. Route V links Dobrinishte, Gotse Delchev and Bezbog
      before continuing towards Melnik.


      The most demanding traverse is the Koncheto ridge arête, at roughly 2,810 m between Banski Suhodol and
      Kutelo.
    history: >-
      The park was founded in 1962 to safeguard virgin mountain ecosystems, dramatic landscapes and endemic
      wildlife communities, and was inscribed as a UNESCO World Heritage site in 1983. Its entire area belongs
      to the European Natura network. Two strict nature reserves lie within its boundaries: Bayuvi
      Dupki–Dzhindzhiritsa and Yulen. Administration is overseen by a dedicated park directorate based in
      Bansko under the Ministry of Environment and Water.


      Pressures are considerable. Environmental threats include commercial stone quarrying, arson, illegal
      logging, poaching, trail erosion and above all ski development. The Bansko ski resort was expanded
      despite park regulations prohibiting such infrastructure within core boundaries.
    before: >-
      The park directorate strongly advises sturdy mountain boots, waterproofs and checking mountain forecasts
      before setting out. Winter brings heavy snowfall, and avalanches are frequent.
    around: >-
      [Rila National Park Old Forests](/lugar/rila-national-park-old-forests/) lies roughly 11 km away, and
      [Kresna Gorge - Struma River Biocorridor](/lugar/kresnensko-defile/) about 9 km.
  fr:
    intro: >-
      Sous le plus haut sommet du massif, dans le cirque de Golemiya Kazan, subsiste une poche de glace
      héritée de la dernière ère glaciaire : Snezhnika, le glacier le plus méridional d'Europe. Ce détail
      résume à lui seul le Pirin. Ce parc national protège la majeure partie des monts Pirin, dans le
      sud-ouest de la Bulgarie, s'élevant de 950 m jusqu'aux 2 914 m du mont Vihren, sans aucun village habité
      à l'intérieur de ses limites. C'est une montagne alpine en plein sud des Balkans, ponctuée de lacs
      glaciaires, de marbres immaculés et du plus vieil arbre de Bulgarie.
    landscape: >-
      Le relief du Pirin est l'œuvre des glaces quaternaires. Au Pléistocène, le massif a connu une glaciation
      alpine intense qui a laissé 118 lacs glaciaires, blottis dans des cirques d'altitude ; le lac Popovo est
      à la fois le plus vaste et le plus profond. Deux petits glaciers subsistent : Snezhnika et Banski
      Suhodol.


      La géologie change du nord au sud. La crête marbrière du Vihren rassemble les trois plus hauts sommets
      du massif : le Vihren (2 914 m), le Kutelo (2 908 m) et le Banski Suhodol (2 884 m), reliés par l'arête
      aérienne de Koncheto. Près de 60 % du parc s'établit au-dessus de 2 000 m d'altitude.


      L'hiver est rigoureux et très enneigé. Au-dessus de 1 800 m, l'épaisseur de neige atteint 160-180 cm en
      mars, et les avalanches sont fréquentes.


      La végétation s'étage rigoureusement : forêt montagnarde, étage subalpin et étage alpin. Les forêts
      couvrent 57,3 % du parc, et 95 % d'entre elles sont formées de conifères. Le pin mugo occupe la plus
      grande superficie, suivi du [pin de Macédoine](/especie/pinus_peuce/), de l'épicéa commun, du hêtre et
      du [pin de Bosnie](/especie/pinus_heldreichii/). Les pinèdes de pin de Macédoine et de Bosnie du Pirin
      représentent 42 % et 52 % de leur aire totale en Bulgarie. Le plus célèbre, le pin de Baykushev, est le
      plus vieil arbre du pays : un pin de Bosnie âgé d'environ 1 300 ans. À l'étage subalpin dominent le pin
      couché et le genévrier de Sibérie.


      Le Pirin abrite 17 endémiques locales, 36 espèces endémiques de Bulgarie et 110 des Balkans. Parmi les
      joyaux locaux figure le pavot de Pirin (Papaver degenii), le parc comptant 165 espèces végétales
      protégées par la loi.
    wildlife: >-
      On recense 240 espèces de vertébrés, dont 166 oiseaux et 50 mammifères. Parmi les espèces prioritaires
      figurent l'[ours brun](/especie/ursus_arctos/), le [loup](/especie/canis_lupus/), le [chat
      sauvage](/especie/felis_silvestris/), la [martre des pins](/especie/martes_martes/), le
      [sanglier](/especie/sus_scrofa/), le [cerf élaphe](/especie/cervus_elaphus/), le
      [chevreuil](/especie/capreolus_capreolus/) et le [chamois](/especie/rupicapra_rupicapra/) des Balkans,
      sous-espèce endémique de la région. Le campagnol des neiges est un remarquable relique glaciaire.


      Chez les oiseaux, trois espèces sont des reliques post-glaciaires : la chouette de Tengmalm, le [pic à
      dos blanc](/especie/dendrocopos_leucotos/) et le [pic tridactyle](/especie/picoides_tridactylus/). Parmi
      les rapaces et oiseaux remarquables nichent l'[aigle royal](/especie/aquila_chrysaetos/), le circaète
      Jean-le-Blanc, le [faucon sacre](/especie/falco_cherrug/), le [faucon
      pèlerin](/especie/falco_peregrinus/), le [grand tétras](/especie/tetrao_urogallus/), la gélinotte des
      bois et la perdrix bartavelle.


      Les torrents et lacs froids abritent la [truite fario](/especie/salmo_trutta/), tandis que l'[anguille
      d\'Europe](/especie/anguilla_anguilla/) est tenue pour disparue. Batraciens et reptiles comptent la
      [salamandre tachetée](/especie/salamandra_salamandra/), le sonneur à ventre jaune, la vipère péliade et
      le lézard vivipare. Le papillon apollon (Parnassius apollo) hante les pelouses d'altitude.
    visit: >-
      Les visites commencent généralement à Bansko, siège du centre d'information du parc doté d'une
      exposition interactive sur les écosystèmes forestiers, la flore et la faune. Un second centre existe à
      Sandanski. Depuis Bansko, le sentier balisé III relie la ville aux refuges Banderitsa et Vihren ; le
      refuge Banderitsa fut édifié en 1915 sur ordre du tsar Ferdinand Ier de Bulgarie.


      Le parc compte 20 sentiers balisés parcourant cirques, lacs, crêtes et barres rocheuses. L'itinéraire
      numéro 1, tronçon du chemin européen E4, traverse tout le massif depuis le refuge Predel jusqu'à
      Yavorov, Vihren, le lac Tevno, le refuge Pirin et Popovi Livadi. L'itinéraire V relie Dobrinishte, Gotse
      Delchev et Bezbog avant de descendre vers Melnik.


      Le passage le plus vertigineux est l'arête effilée de Koncheto, à environ 2 810 m d'altitude, entre
      Banski Suhodol et Kutelo.
    history: >-
      Le parc a été fondé en 1962 pour protéger ses paysages glaciaires et ses peuplements forestiers
      remarquables, et inscrit sur la liste du Patrimoine mondial de l'UNESCO en 1983. L'intégralité de sa
      superficie s'intègre au réseau européen Natura. Deux réserves intégrales sont encloses dans son
      périmètre : Bayuvi Dupki–Dzhindzhiritsa et Yulen. Une direction autonome basée à Bansko sous tutelle
      ministérielle veille sur les lieux.


      Les pressions environnementales sont réelles : carrières de pierre, incendies intentionnels, coupes
      illicites, braconnage et surtout empiétement des infrastructures de sports d'hiver. La station de ski de
      Bansko a été étendue en dépit des règles du parc interdisant ce type d'équipements.
    before: >-
      La direction recommande de solides chaussures de montagne, des vêtements chauds et imperméables et la
      consultation rigoureuse des bulletins météorologiques. La neige est abondante en hiver et les avalanches
      fréquentes.
    around: >-
      Le [Parc national de Rila - Forêts anciennes](/lugar/rila-national-park-old-forests/) se trouve à
      environ 11 km, et le [Défilé de Kresna - Corridor biologique de la Struma](/lugar/kresnensko-defile/) à
      environ 9 km.
  de:
    intro: >-
      Unter dem höchsten Gipfel des Massivs, im Kar Golemiya Kazan, überdauert ein Eisrest der letzten
      Kaltzeit: Snezhnika, der südlichste Gletscher Europas. Dieses Detail bringt den Pirin auf den Punkt. Der
      Nationalpark umfasst den Großteil des Pirin-Gebirges im Südwesten Bulgariens, steigt von 950 m auf die 2
      914 m des Vihren an und birgt keine einzige dauerhafte Siedlung. Es ist ein echtes Hochgebirge im Süden
      des Balkans mit eiszeitlichen Bergseen, schneeweißem Marmor und dem ältesten Baum des Landes.
    landscape: >-
      Das Relief des Pirin ist ein Werk des eiszeitlichen Frosts. Im Pleistozän erlebte das Massiv eine alpine
      Vergletscherung, aus der 118 Karseen hervorgingen; der Popovo-See ist der weiteste und tiefste. Zwei
      Mikro-Gletscher haben überdauert: Snezhnika und Banski Suhodol.


      Das Gestein wechselt von Norden nach Süden. Der Marmorkamm des Vihren versammelt die drei höchsten
      Erhebungen des Massivs: Vihren (2 914 m), Kutelo (2 908 m) und Banski Suhodol (2 884 m), verbunden durch
      den messerscharfen Felsgrat Koncheto. Fast 60 % des Parks liegen über 2 000 m Meereshöhe.


      Im Winter fällt reichlich Schnee. Oberhalb von 1 800 m erreicht die Schneehöhe im März 160-180 cm, und
      Lawinen gehen häufig nieder.


      Die Vegetation gliedert sich in Wald-, Krummholz- und Alpinzone. Wälder bedecken 57,3 % des Parks, wobei
      95 % auf Nadelgehölze entfallen. Die Bergkiefer dominiert flächenmäßig, gefolgt von [Rumelischer
      Kiefer](/especie/pinus_peuce/), Gemeiner Fichte, Rotbuche und
      [Schlangenhaut-Kiefer](/especie/pinus_heldreichii/). Die Bestände der Rumelischen und der
      Schlangenhaut-Kiefer im Pirin stellen 42 % und 52 % ihres bulgarischen Gesamtareals dar. Die berühmte
      Baykushev-Kiefer ist der älteste Baum Bulgariens: eine rund 1 300 Jahre alte Schlangenhaut-Kiefer. In
      der Krummholzzone herrschen Latsche und Zwergwacholder vor.


      Der Pirin beherbergt 17 lokale, 36 bulgarische und 110 balkanische Endemiten, darunter den Pirin-Mohn
      (Papaver degenii); 165 Pflanzenarten stehen unter gesetzlichem Artenschutz.
    wildlife: >-
      240 Wirbeltierarten sind nachgewiesen, darunter 166 Vogel- und 50 Säugetierarten. Zu den herausragenden
      Leitarten gehören [Braunbär](/especie/ursus_arctos/), [Wolf](/especie/canis_lupus/),
      [Wildkatze](/especie/felis_silvestris/), [Baummarder](/especie/martes_martes/),
      [Wildschwein](/especie/sus_scrofa/), [Rothirsch](/especie/cervus_elaphus/),
      [Reh](/especie/capreolus_capreolus/) und die [Gämse](/especie/rupicapra_rupicapra/) der Balkan-Unterart.
      Die Schneemaus ist ein eiszeitliches Relikt.


      Unter den Vögeln gelten drei Arten als Glazialrelikte: Raufußkauz,
      [Weißrückenspecht](/especie/dendrocopos_leucotos/) und
      [Dreizehenspecht](/especie/picoides_tridactylus/). Zu den seltenen Bewohnern zählen
      [Steinadler](/especie/aquila_chrysaetos/), Schlangenadler, [Sakerfalke](/especie/falco_cherrug/),
      [Wanderfalke](/especie/falco_peregrinus/), [Auerhuhn](/especie/tetrao_urogallus/), Haselhuhn und
      Steinhuhn.


      In Bächen und Karseen lebt die [Forelle](/especie/salmo_trutta/), während der [Europäische
      Aal](/especie/anguilla_anguilla/) als verschollen gilt. Bei Amphibien und Reptilien finden sich
      [Feuersalamander](/especie/salamandra_salamandra/), Gelbbauchunke, Kreuzotter und Waldeidechse. Ein
      Paradeinsekt der alpinen Matten ist der Rote Apollo (Parnassius apollo).
    visit: >-
      Dreh- und Angelpunkt ist Bansko mit dem Hauptbesucherzentrum und seiner interaktiven Ausstellung über
      Bergwälder und Tierwelt. Ein weiteres Zentrum befindet sich in Sandanski. Ab Bansko führt der markierte
      Weg III zu den Hütten Banderitsa und Vihren; Banderitsa entstand 1915 auf Veranlassung von Zar Ferdinand
      I. von Bulgarien.


      Der Park pflegt 20 markierte Routen über Kare, Seen und Felsgrate. Der Fernweg 1 als Teil des
      europäischen Fernwanderwegs E4 durchquert das Massiv von der Hütte Predel über Yavorov, Vihren, den
      Tevno-See, die Hütte Pirin bis Popovi Livadi. Die Route V verbindet Dobrinishte, Gotse Delchev und
      Bezbog und führt weiter nach Melnik.


      Als anspruchsvollster Abschnitt gilt der Grat von Koncheto auf 2 810 m Höhe zwischen Banski Suhodol und
      Kutelo.
    history: >-
      Der Park wurde 1962 gegründet und 1983 in das UNESCO-Weltnaturerbe aufgenommen. Seine gesamte Fläche ist
      Teil des europäischen Natura-Netzes. Zwei Totalreservate liegen innerhalb seiner Grenzen: Bayuvi
      Dupki–Dzhindzhiritsa und Yulen. Verwaltet wird das Areal von einer Parkdirektion in Bansko.


      Der Nutzungsdruck ist beträchtlich: Steinbrüche, Brandstiftungen, illegaler Holzeinschlag, Wilderei und
      der Ausbau von Skigebieten fordern das Schutzgebiet heraus. Das Skigebiet Bansko wurde erweitert,
      obgleich Gesetze Wintersportanlagen im Kerngebiet untersagen.
    before: >-
      Die Parkverwaltung rät zu trittfesten Bergstiefeln, wetterfester Kleidung und Wetterabfrage. Im Winter
      herrschen extreme Schneelagen und Lawinengefahr.
    around: >-
      Der [Nationalpark Rila - Urwälder](/lugar/rila-national-park-old-forests/) liegt rund 11 km entfernt und
      die [Kresna-Schlucht - Struma-Biokorridor](/lugar/kresnensko-defile/) etwa 9 km.
  it:
    intro: >-
      Sotto la vetta più alta del massiccio, nel circo Golemiya Kazan, resiste una sacca di ghiaccio risalente
      all'ultima glaciazione: Snezhnika, il ghiacciaio più meridionale d'Europa. Questo tratto distintivo
      sintetizza il Pirin. Il parco nazionale abbraccia gran parte dei monti Pirin, nel sud-ovest della
      Bulgaria, sale da 950 m fino ai 2 914 m del Vihren e non ospita alcun centro abitato stanziale. È
      un'autentica montagna alpina nel meridione dei Balcani, orlata da laghi glaciali, marmi nivei e
      dall'albero più antico del paese.
    landscape: >-
      L'orografia del Pirin è frutto del gelo quaternario. Nel Pleistocene il massiccio fu interessato da una
      potente glaciazione alpina che ha lasciato 118 laghi glaciali incastonati nei circhi d'alta quota; il
      lago Popovo è il maggiore e più profondo. Permangono due minuscoli ghiacciai: Snezhnika e Banski
      Suhodol.


      La composizione litologica muta tra settori: la cresta marmorea del Vihren raccoglie le tre cime più
      alte del massiccio, ossia Vihren (2 914 m), Kutelo (2 908 m) e Banski Suhodol (2 884 m), collegate
      dall'aerea cresta di Koncheto. Quasi il 60% del parco supera i 2 000 m di altitudine.


      In inverno le precipitazioni nevose sono abbondanti: oltre i 1 800 m il manto nevoso tocca 160-180 cm a
      marzo, con valanghe frequenti.


      La vegetazione segue fasce altimetriche: forestale, subalpina e alpina. Le foreste coprono il 57,3% del
      parco, costituite per il 95% da conifere. Il pino mugo domina la copertura, seguito dal [pino della
      Macedonia](/especie/pinus_peuce/), dall'abete rosso, dal faggio e dal [pino
      loricato](/especie/pinus_heldreichii/). Le pinete di pino macedone e loricato del Pirin rappresentano il
      42% e il 52% della loro superficie totale in Bulgaria. Il più venerabile, il pino di Baykushev, è
      l'albero più longevo della nazione: un pino loricato di circa 1 300 anni. Nel piano subalpino allignano
      il pino mugo e il ginepro nano.


      Il Pirin ospita 17 endemismi locali, 36 bulgari e 110 balcanici, tra cui il papavero del Pirin (Papaver
      degenii); 165 specie floristiche sono protette dalla legge.
    wildlife: >-
      Sono censite 240 specie di vertebrati, tra cui 166 uccelli e 50 mammiferi. Tra le specie a maggior
      priorità conservazionistica figurano l'[orso bruno](/especie/ursus_arctos/), il [lupo
      grigio](/especie/canis_lupus/), il [gatto selvatico](/especie/felis_silvestris/), la
      [martora](/especie/martes_martes/), il [cinghiale](/especie/sus_scrofa/), il [cervo
      nobile](/especie/cervus_elaphus/), il [capriolo](/especie/capreolus_capreolus/) e il [camoscio
      alpino](/especie/rupicapra_rupicapra/) balcanico. L'arvicola delle nevi rappresenta un relitto glaciale.


      Tra gli uccelli spiccano tre relitti post-glaciali: la civetta capogrosso, il [picchio
      dorsobianco](/especie/dendrocopos_leucotos/) e il [picchio tridattilo](/especie/picoides_tridactylus/).
      Tra le specie rare nidificano l'[aquila reale](/especie/aquila_chrysaetos/), il biancone, il
      [sacro](/especie/falco_cherrug/), il [falco pellegrino](/especie/falco_peregrinus/),
      l'[urogallo](/especie/tetrao_urogallus/), il francolino di monte e la coturnice.


      Nei corsi d'acqua e nei laghi alpini nuota la [trota atlantica](/especie/salmo_trutta/), mentre
      l'[anguilla](/especie/anguilla_anguilla/) è considerata estinta localmente. Anfibi e rettili contano la
      [salamandra pezzata](/especie/salamandra_salamandra/), l'ululone dal ventre giallo, il marasso e la
      lucertola vivipara. Tra i lepidotteri risalta la farfalla apollo (Parnassius apollo).
    visit: >-
      Il baricentro delle visite è Bansko, sede del centro visitatori principale con allestimenti interattivi
      su foreste, flora e fauna. Un ulteriore centro opera a Sandanski. Da Bansko, il sentiero III conduce ai
      rifugi Banderitsa e Vihren; il rifugio Banderitsa fu eretto nel 1915 per volere dello zar Ferdinando I
      di Bulgaria.


      Il parco cura 20 itinerari segnalati che toccano circhi, laghi e formazioni rupestri. L'itinerario 1,
      parte del cammino europeo E4, traversa il massiccio dal rifugio Predel verso Yavorov, Vihren, il lago
      Tevno, il rifugio Pirin e Popovi Livadi. L'itinerario V collega Dobrinishte, Gotse Delchev e Bezbog
      prima di calare a Melnik.


      Il tratto di maggior impegno alpinistico è la cresta di Koncheto a 2 810 m di quota, tra Banski Suhodol
      e Kutelo.
    history: >-
      Il parco fu istituito nel 1962 per tutelare gli ecosistemi forestali e i paesaggi d'alta quota, e nel
      1983 è entrato nel Patrimonio Mondiale dell'UNESCO. L'intero comprensorio appartiene alla rete europea
      Natura. Racchiude due riserve integrali: Bayuvi Dupki–Dzhindzhiritsa e Yulen. È amministrato da una
      direzione con sede a Bansko.


      Le minacce ambientali sono consistenti: cave di pietra, incendi dolosi, tagli abusivi, bracconaggio e
      impianti sciistici. Il comprensorio sciistico di Bansko è stato ampliato malgrado le normative del parco
      vietino tali infrastrutture nel perimetro protetto.
    before: >-
      La direzione raccomanda calzature da montagna, indumenti termici e impermeabili e la consultazione
      attenta del meteo. La neve è abbondante in inverno e le valanghe frequenti.
    around: >-
      Il [Parco nazionale di Rila - Foreste vetuste](/lugar/rila-national-park-old-forests/) dista circa 11
      km, e la [Gola di Kresna - Corridoio biologico del fiume Struma](/lugar/kresnensko-defile/) circa 9 km.
  pt:
    intro: >-
      Sob o cume mais elevado do maciço, no circo Golemiya Kazan, resiste uma bolsa de gelo remanescente da
      última era glaciar: Snezhnika, o glaciar mais meridional da Europa. Esse pormenor resume o Pirin. O
      parque nacional abarca a maior fração das montanhas Pirin, no sudoeste da Bulgária, ascendendo de 950 m
      até aos 2 914 m do monte Vihren, desprovido de povoações no seu interior. É uma montanha alpina em pleno
      sul dos Balcãs, salpicada de lagoas glaciares, mármores alvos e o pinheiro mais antigo do país.
    landscape: >-
      O relevo do Pirin foi entalhado pelo gelo. No Plistocénico a montanha conheceu uma glaciação alpina da
      qual restam 118 lagoas glaciares anichadas em circos; a lagoa Popovo é a mais extensa e funda. Restam
      dois microglaciares: Snezhnika e Banski Suhodol.


      A geologia varia de norte para sul. A crista de mármore do Vihren reúne as três montanhas mais
      alcantiladas do maciço: Vihren (2 914 m), Kutelo (2 908 m) e Banski Suhodol (2 884 m), unidas pela
      arista vertiginosa de Koncheto. Quase 60% do parque situa-se acima dos 2 000 m de altitude.


      No inverno neva com intensidade. Acima dos 1 800 m a neve atinge 160-180 cm em março, ocorrendo
      avalanches frequentes.


      A vegetação reparte-se por pisos: florestal, subalpino e alpino. As florestas cobrem 57,3% do parque,
      sendo 95% constituídas por coníferas. O pinheiro-anão domina em área, seguido do
      [pinheiro-da-macedónia](/especie/pinus_peuce/), do abeto-falso, da faia e do
      [pinheiro-bósnio](/especie/pinus_heldreichii/). Os pinhais destas duas espécies no Pirin representam 42%
      e 52% da sua área total na Bulgária. O espécime emblemático, o pinheiro de Baykushev, é a árvore mais
      velha do país: um pinheiro-bósnio com cerca de 1 300 anos. No andar subalpino dominam o pinheiro-anão e
      o zimbro-anão.


      O Pirin acolhe 17 endemismos locais, 36 búlgaros e 110 balcânicos, como a papoila-de-pirin (Papaver
      degenii); 165 espécies vegetais estão protegidas por lei.
    wildlife: >-
      Estão identificadas 240 espécies de vertebrados, integrando 166 aves e 50 mamíferos. Nas espécies de
      topo contam-se o [urso-pardo](/especie/ursus_arctos/), o [lobo-cinzento](/especie/canis_lupus/), o
      [gato-bravo](/especie/felis_silvestris/), a [marta do pinheiro europeia](/especie/martes_martes/), o
      [javali](/especie/sus_scrofa/), o [veado-vermelho](/especie/cervus_elaphus/), a
      [corça](/especie/capreolus_capreolus/) e a [camurça](/especie/rupicapra_rupicapra/) balcânica. A
      ratazana-das-neves é uma espécie relíquia.


      Na avifauna, três espécies são relíquias glaciares: o mocho-de-tengmalm, o
      [pica-pau-de-dorso-branco](/especie/dendrocopos_leucotos/) e o
      [pica-pau-tridáctilo](/especie/picoides_tridactylus/). Entre as aves raras nidificam a
      [águia-real](/especie/aquila_chrysaetos/), a águia-cobreira, o [falcão-sacre](/especie/falco_cherrug/),
      o [falcão-peregrino](/especie/falco_peregrinus/), o [tetraz-grande](/especie/tetrao_urogallus/), a
      galinha-do-mato e a perdiz-grega.


      Nos cursos de água sobrevive a [truta-fário](/especie/salmo_trutta/), julgando-se a
      [enguia-europeia](/especie/anguilla_anguilla/) extinta localmente. Anfíbios e répteis compreendem a
      [salamandra-de-fogo](/especie/salamandra_salamandra/), o bombina-de-ventre-amarelo, a víbora-comum e a
      lagartixa-vivípara. A borboleta apolo (Parnassius apollo) embeleza as pastagens alpinas.
    visit: >-
      A base habitual de partidas é Bansko, onde funciona o centro de informação principal do parque com
      painéis interativos sobre ecossistemas florestais e fauna. Existe outro posto em Sandanski. A partir de
      Bansko, o trilho III liga a vila aos abrigos Banderitsa e Vihren; Banderitsa foi edificado em 1915 por
      iniciativa do czar Fernando I da Bulgária.


      O parque gere 20 percursos demarcados por circos, lagoas e cristas alcantiladas. O trilho 1, integrado
      na rota europeia E4, atravessa o maciço desde o abrigo Predel passando por Yavorov, Vihren, lagoa Tevno,
      abrigo Pirin e Popovi Livadi. A rota V liga Dobrinishte, Gotse Delchev e Bezbog antes de descer para
      Melnik.


      O troço mais exigente é a arista escarpada de Koncheto, a cerca de 2 810 m, entre Banski Suhodol e
      Kutelo.
    history: >-
      O parque foi instituído em 1962 para salvaguardar ecossistemas e paisagens florestais pristinas,
      integrando a lista do Património Mundial da UNESCO em 1983. A totalidade da área integra a rede europeia
      Natura. Alberga duas reservas integrais: Bayuvi Dupki–Dzhindzhiritsa e Yulen. É tutelado por uma direção
      sediada em Bansko.


      As pressões antrópicas são sensíveis: pedreiras, fogos florestais, corte clandestino de madeira, caça
      furtiva e o turismo de esqui. A estância de esqui de Bansko foi expandida apesar de a regulamentação do
      parque proibir tais obras no interior do perímetro.
    before: >-
      A direção recomenda calçado técnico de montanha, agasalhos impermeáveis e verificação atenta da
      meteorologia. O inverno é pródigo em neves e avalanches.
    around: >-
      O [Parque Nacional de Rila - Bosques Antigos](/lugar/rila-national-park-old-forests/) fica a cerca de 11
      km, e o [Desfiladeiro de Kresna - Corredor Biológico do Rio Struma](/lugar/kresnensko-defile/) a cerca
      de 9 km.
