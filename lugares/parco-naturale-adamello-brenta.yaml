resumen:
  es: >-
    Dos mundos geológicos opuestos cara a cara: los picos calcáreos de los Dolomitas de Brenta y el macizo de
    granito glaciar del Adamello (con el histórico oso pardo del Trentino).
  en: >-
    Two opposing geological worlds facing each other: the limestone spires of the Brenta Dolomites and the
    glaciated granite massif of the Adamello (home to Trentino's historic brown bear).
  fr: >-
    Deux mondes géologiques opposés face à face : les cimes calcaires des Dolomites de Brenta et le massif de
    granite glaciaire de l'Adamello (foyer de l'ours brun du Trentin).
  de: >-
    Zwei gegensätzliche geologische Welten von Angesicht zu Angesicht: die Kalkzacken der Brenta-Dolomiten und
    das gletschergekrönte Granitmassiv des Adamello (Heimat des historischen Trentiner Braunbären).
  it: >-
    Due mondi geologici opposti l'uno di fronte all'altro: le vette calcaree delle Dolomiti di Brenta e il
    massiccio granitico glaciale dell'Adamello (con lo storico orso bruno del Trentino).
  pt: >-
    Dois mundos geológicos opostos frente a frente: os picos calcários das Dolomitas de Brenta e o maciço
    granítico glaciar do Adamello (com o histórico urso-pardo do Trentino).
unico:
  es: >-
    Dos mundos geológicos opuestos conviven en un mismo parque, y en él vive el oso pardo, el animal símbolo
    del parque, que estuvo al borde de la extinción.
  en: >-
    Two opposing geological realms coexist within a single park, inhabited by the brown bear, the park's
    symbolic animal that once stood on the brink of extinction.
  fr: >-
    Deux mondes géologiques opposés cohabitent dans un même parc, où vit l'ours brun, animal emblématique du
    parc qui s'est trouvé au bord de l'extinction.
  de: >-
    Zwei grundverschiedene Gesteinswelten begegnen sich in einem Park, in dem der Braunbär als Wappentier
    lebt, nachdem er einst unmittelbar vor dem Aussterben stand.
  it: >-
    Due regni geologici antitetici convivono in un unico parco, dimora dell'orso bruno, animale simbolo del
    parco un tempo giunto a un passo dall'estinzione.
  pt: >-
    Dois universos geológicos contrários coexistem num mesmo parque, onde habita o urso-pardo, animal-símbolo
    do parque que esteve à beira da extinção.
observaciones:
  es: >-
    El parque pide no llevarse flores, rocas ni fragmentos de naturaleza, dejar el coche en casa y moverse a
    pie, en bicicleta o en los autobuses del parque. Se recomienda ropa técnica adecuada a los cambios bruscos
    de tiempo de la montaña. Mira los avisos del parque antes de ir, porque algunos senderos cierran
    temporalmente por obras.
texto:
  es:
    intro: >-
      Dos montañas que no se parecen en nada se miran a ambos lados de un valle. A un lado, el grupo de
      Brenta, con sus «castillos de piedra» de torres, agujas y paredes vertiginosas, hechas de sedimentos de
      antiguos mares. Al otro, el macizo de Adamello-Presanella, de tonalita, una roca magmática durísima que
      nació en las profundidades de la corteza. Entre ambos corre el Val Rendena, y todo ello forma el Parque
      Natural Adamello-Brenta, en el Trentino: 625,83 km² de territorio de montaña entre los 477 y los 3.558
      metros de altitud.
    landscape: >-
      El ambiente es el típico del arco alpino centro-meridional: bosques de coníferas que cubren las laderas
      hasta los 1.800 metros y, por encima, praderas alpinas y vegetación rupestre que sube más allá de los
      2.500 metros. Los bosques ocupan un tercio del parque. Pastos, torrentes, turberas y roquedos
      inaccesibles aparecen a todas las altitudes.


      La geología es el argumento. El Triásico marca el nacimiento de las Dolomitas en la Pangea tropical,
      entre atolones de coral y llanuras de marea, donde se deposita la Dolomía Principal. Esos sedimentos de
      fondos tropicales que ya no existen se han convertido en las rocas que hoy tocan el cielo. Del otro
      lado, el Adamello-Presanella es un macizo de tonalita. Ambos grupos han sido modelados por el agua y los
      glaciares desde hace unos 20 millones de años, cuando emergieron los Alpes Meridionales. Recorrer el
      Geoparque es pasar las páginas de un libro de piedra de más de 350 millones de años, con 61 geositios.


      Eso explica la flora. Hay una riqueza que tiene pocos paralelos en el arco alpino, y los dos sectores
      geológicos, la caliza de Brenta y las rocas cristalinas del Adamello-Presanella, han favorecido
      endemismos. Entre los 477 metros y las cumbres se suceden los bosques de frondosas de la parte baja, los
      hayedos del piso montano y, más arriba, la franja de coníferas de abeto rojo, alerce y pino cembro, la
      que más superficie forestal ocupa y que llega hasta los 1.900-2.000 metros. El alerce es pionero: ocupa
      primero las superficies de altura abandonadas por el pastoreo. Más arriba aparecen enebro enano y
      rododendro, azalea alpina y sauces rastreros, y entre las plantas supervivientes de las glaciaciones
      están la edelweiss y la linnea boreal.
    wildlife: >-
      Lo primero que cuenta el parque es el [oso pardo](/especie/ursus_arctos/). Casi se extinguió en los
      Alpes: en 1998 solo había tres ejemplares censados genéticamente en el Trentino occidental, y en 1996 el
      parque inició con fondos LIFE el proyecto Life Ursus de repoblación. Hoy se expande, junto con el
      [lobo](/especie/canis_lupus/) y el [lince](/especie/lynx_lynx/), que han llegado en los últimos años en
      número no cuantificable.


      Entre los ungulados, hay una población consistente de [rebeco](/especie/rupicapra_rupicapra/) y una
      colonia de [cabra montés](/especie/capra_ibex/) fruto de un proyecto de reintroducción de muchos años;
      también [ciervo](/especie/cervus_elaphus/), [corzo](/especie/capreolus_capreolus/) y muflón. La ardilla
      y la [marmota](/especie/marmota_marmota/) son los roedores más extendidos.


      Para quien mira aves: entre las gallináceas hay lagópodo alpino, perdiz griega, [gallo
      lira](/especie/tetrao_tetrix/), [urogallo](/especie/tetrao_urogallus/) y grévol. Entre las rapaces
      diurnas anidan el [águila real](/especie/aquila_chrysaetos/), el ratonero, el azor, el gavilán, el
      halcón abejero y el cernícalo; el [quebrantahuesos](/especie/gypaetus_barbatus/) es solo ocasional. Las
      rapaces nocturnas son de especial interés ecológico: el cárabo, el búho chico, el mochuelo boreal y el
      mochuelo alpino.


      En el agua, el parque protege la calidad de sus torrentes y de más de 80 lagos. Los lagos tienen
      salvelino, trucha marmórea y trucha común, y entre los anfibios están el tritón alpino y la rana de
      montaña. Y hay un lago célebre: el Tovel, famoso por el color rojo que sus aguas tomaban en ciertas
      épocas por la floración de algas, hasta 1964.
    visit: >-
      El mejor primer paso son los centros de visitantes: hay siete, repartidos por el territorio, con temas
      propios (la flora, el oso, la geología, el agua, la relación entre el ser humano y el ambiente, y la
      fauna). Ofrecen salas sensoriales con sonidos y olores del bosque, pantallas táctiles, maquetas,
      proyecciones y dioramas, del misterio del Lago Rosso al regreso del oso. La Casa del Parco Geopark
      explica la geodiversidad de Adamello-Presanella y las Dolomitas de Brenta con recursos interactivos.


      Las rutas más conocidas giran en torno al agua. El Sentiero delle Cascate de Val Genova se recorre entre
      Piana di Bedole y Malga Caret; el deshielo y las lluvias hacen que las cascadas luzcan especialmente
      caudalosas a finales de primavera y en verano, y la Cascata Nardis cae unos 95 metros. El circuito
      guiado de las malgas del Brenta enlaza Arza, Termoncello y Loverdina y llega a un mirador sobre el lago
      de Tovel y su cascada.


      Numerosos valles laterales dan acceso a los ambientes más salvajes y remotos, donde se ve la fauna.
    history: >-
      La idea de un parque nació de proteger el oso pardo de los Alpes a través de su hábitat: en 1928 la
      retomó Gian Giacomo Gallarati Scotti. Las propuestas señalaban tres elementos a proteger: el Val Genova,
      el grupo de Brenta y el lago de Tovel, y la última población autóctona de oso pardo de los Alpes.
      Adamello Brenta y Paneveggio Pale di San Martino fueron los dos primeros parques naturales provinciales
      de Italia.


      Desde 2008 el parque es parte de la red internacional de Geoparques y desde 2015 del programa de
      Geoparques Globales de la UNESCO. En él conviven tres reconocimientos UNESCO: las Dolomitas Patrimonio
      Mundial, la Reserva de la Biosfera MAB Alpi Ledrensi e Judicaria y el Geoparque Global Adamello Brenta.
    before: >-
      El parque pide no llevarse flores, rocas ni fragmentos de naturaleza, dejar el coche en casa y moverse a
      pie, en bicicleta o en los autobuses del parque. Se recomienda ropa técnica adecuada a los cambios
      bruscos de tiempo de la montaña. Mira los avisos del parque antes de ir, porque algunos senderos cierran
      temporalmente por obras.
    around: >-
      El [Parque Nacional del Stelvio](/lugar/parco-nazionale-dello-stelvio/) está a poco más de diez
      kilómetros. Más lejos, el [Parque Natural de Karwendel](/lugar/naturpark-karwendel/), el [Parque Natural
      de los Alpes Marítimos](/lugar/parco-naturale-delle-alpi-marittime/), el [Parque Natural del Mont
      Avic](/lugar/parco-naturale-mont-avic/) y el [Grupo Ankogel - Altos
      Tauern](/lugar/ankogelgruppe---hohe-tauern/) comparten con Adamello-Brenta la cabra montés y el rebeco.
  en:
    intro: >-
      Two entirely contrasting mountain realms face each other across a deep valley. On one side, the Brenta
      Group, with its «stone fortresses» of spires, pinnacles, and sheer precipices forged from ancient seabed
      sediments. On the other, the Adamello-Presanella massif, composed of tonalite, an extremely dense
      magmatic rock born deep within the Earth's crust. Between them flows the Val Rendena, and together they
      form the Adamello-Brenta Natural Park in Trentino: 625.83 km² of rugged mountain terrain ranging from
      477 to 3,558 metres in altitude.
    landscape: >-
      The environment typifies the south-central Alpine arc: coniferous forests blanket slopes up to 1,800
      metres, giving way above to alpine meadows and rock-face flora reaching beyond 2,500 metres. Forests
      cover one third of the park, while pastures, glacial torrents, peat bogs, and inaccessible cliffs occur
      across all elevations.


      Geology provides the central storyline. The Triassic witnessed the birth of the Dolomites in tropical
      Pangea, among coral atolls and tidal flats where the Main Dolomite was deposited. Those ancient tropical
      sediments now form spires that scrape the sky. Opposite them, the Adamello-Presanella is a massive
      tonalite intrusion. Both massifs have been sculpted by water and ice for some 20 million years, since
      the Southern Alps first emerged. Exploring the Geopark is akin to turning the pages of a
      350-million-year stone archive featuring 61 geodiversity sites.


      This geological divide fosters exceptional floristic diversity with few Alpine equivalents, where
      limestone in Brenta and crystalline rocks in Adamello-Presanella encourage local endemism. Between 477
      metres and the high summits, deciduous woodlands at valley bottom yield to montane beech forests,
      followed by a coniferous belt of Norway spruce, larch, and Swiss stone pine that constitutes the bulk of
      the forest cover up to 1,900-2,000 metres. Larch acts as a pioneer, colonizing abandoned high pastures.
      Higher still, dwarf juniper, alpenrose, alpine azalea, and creeping willows take hold, with glacial
      relics like edelweiss and twinflower clinging to sheltered pockets.
    wildlife: >-
      The park's foremost emblem is the [brown bear](/especie/ursus_arctos/). The Alpine population came
      perilously close to extirpation: in 1998, only three individuals were genetically confirmed in western
      Trentino, prompting the park to launch the Life Ursus restocking project with European LIFE funds in
      1996. Today the population expands alongside the [wolf](/especie/canis_lupus/) and [Eurasian
      lynx](/especie/lynx_lynx/), which have returned in unquantified numbers in recent years.


      Among ungulates, a robust population of [chamois](/especie/rupicapra_rupicapra/) thrives, accompanied by
      an [alpine ibex](/especie/capra_ibex/) colony established through long-term reintroduction, as well as
      [red deer](/especie/cervus_elaphus/), [roe deer](/especie/capreolus_capreolus/), and mouflon. Red
      squirrels and [alpine marmots](/especie/marmota_marmota/) represent the most widespread rodents.


      For birdwatchers, woodland grouse include rock ptarmigan, rock partridge, [black
      grouse](/especie/tetrao_tetrix/), [western capercaillie](/especie/tetrao_urogallus/), and hazel grouse.
      Diurnal raptors nesting here include the [golden eagle](/especie/aquila_chrysaetos/), common buzzard,
      northern goshawk, Eurasian sparrowhawk, European honey buzzard, and common kestrel, with the [bearded
      vulture](/especie/gypaetus_barbatus/) appearing occasionally. Nocturnal raptors carry high ecological
      value: tawny owl, long-eared owl, Tengmalm's owl, and Eurasian pygmy owl.


      Aquatic habitats are rigorously protected across torrential streams and over 80 alpine lakes. These
      waters shelter Arctic char, marble trout, and brown trout, alongside alpine newts and common frogs.
      Among them lies famed Lake Tovel, celebrated until 1964 for its waters turning brilliant blood-red
      during seasonal algal blooms.
    visit: >-
      A recommended starting point is the network of visitor centres: seven facilities dotted across the park,
      each dedicated to a distinct theme (flora, the bear, geology, water, humans and the environment, and
      wildlife). They feature sensory rooms filled with forest sounds and scents, interactive touchscreens,
      topographic models, films, and dioramas, from the enigma of the Red Lake to the return of the bear. The
      Casa del Parco Geopark interprets the contrasting geodiversity of Adamello-Presanella and the Brenta
      Dolomites through hands-on exhibits.


      The most celebrated walking routes celebrate water. The Sentiero delle Cascate in Val Genova links Piana
      di Bedole and Malga Caret; snowmelt and seasonal rainfall lend these cataracts spectacular power in late
      spring and summer, with the Cascata Nardis dropping some 95 metres. The guided Malghe del Brenta circuit
      connects Arza, Termoncello, and Loverdina, leading to an overlook above Lake Tovel and its waterfall.


      Numerous lateral valleys provide access to remote wilderness areas where wildlife is most readily
      observed.
    history: >-
      The vision of an Alpine park took shape around preserving the brown bear through its natural habitat,
      championed in 1928 by Gian Giacomo Gallarati Scotti. Early proposals identified three vital elements to
      safeguard: Val Genova, the Brenta Group, and Lake Tovel, alongside the last indigenous brown bear
      population in the Alps. Adamello Brenta and Paneveggio Pale di San Martino became the first two
      provincial natural parks created in Italy.


      In 2008 the park joined the European and Global Geoparks Network, integrating into the UNESCO Global
      Geoparks programme in 2015. Three distinct UNESCO designations overlap here: the Dolomites World
      Heritage Site, the Alpi Ledrensi and Judicaria Biosphere Reserve, and the Adamello Brenta UNESCO Global
      Geopark.
    before: >-
      The park requests that you do not remove flowers, rocks, or natural specimens, leaving vehicles behind
      in favour of walking, cycling, or using park shuttle buses. Technical clothing adapted to sudden
      mountain weather shifts is strongly advised. Check park bulletins prior to departure, as select trails
      may close temporarily for trail maintenance.
    around: >-
      The [Parque Nacional del Stelvio](/lugar/parco-nazionale-dello-stelvio/) lies just over ten kilometres
      away. Further afield, [Parque Natural de Karwendel](/lugar/naturpark-karwendel/), [Parque Natural de los
      Alpes Marítimos](/lugar/parco-naturale-delle-alpi-marittime/), [Parque Natural del Mont
      Avic](/lugar/parco-naturale-mont-avic/), and [Grupo Ankogel - Altos
      Tauern](/lugar/ankogelgruppe---hohe-tauern/) share ibex, chamois, and high-alpine biomes with
      Adamello-Brenta.
  fr:
    intro: >-
      Deux géants montagnards que tout oppose se font face de part et d'autre d'une vallée. D'un côté, le
      groupe de Brenta, véritable forteresse de calcaire hérissée de tours, d'aiguilles et de parois
      vertigineuses issues d'anciennes mers tropicales. De l'autre, le massif de l'Adamello-Presanella,
      constitué de tonalite, une roche magmatique très dure forgée dans les entrailles de la croûte terrestre.
      Entre les deux s'étire le Val Rendena, l'ensemble formant le parc naturel Adamello-Brenta, dans le
      Trentin : 625,83 km² de territoire montagnard s'échelonnant entre 477 et 3 558 mètres d'altitude.
    landscape: >-
      Le milieu est caractéristique de l'arc alpin méridional : des forêts de conifères habillent les versants
      jusqu'à 1 800 mètres, laissant place en altitude aux pelouses alpines et à la flore des rochers qui
      dépasse les 2 500 mètres. Les forêts couvrent un tiers du parc. Pâturages, torrents, tourbières et
      pierriers inaccessibles se rencontrent à toutes les altitudes.


      La géologie sert de fil conducteur. Le Trias voit naître les Dolomites dans la Pangée tropicale, au
      milieu d'atolls coralliens et de lagunes côtières où se dépose la dolomie principale. Ces sédiments
      d'océans disparus sont devenus les aiguilles dressées vers le ciel. En face, l'Adamello-Presanella forme
      un massif plutonique de tonalite. Ces deux ensembles ont été sculptés par les eaux et les glaciers
      depuis environ 20 millions d'années, lors du soulèvement des Alpes méridionales. Parcourir le géoparc,
      c'est feuilleter un livre de pierre de plus de 350 millions d'années jalonné de 61 géosites.


      Cette dualité explique la richesse floristique, sans grand équivalent dans les Alpes. Entre 477 mètres
      et les crêtes se succèdent les feuillus de basse vallée, les hêtraies montagnardes et la ceinture de
      conifères — épicéa commun, mélèze et pin cembro —, qui occupe l'essentiel du manteau forestier jusqu'à 1
      900-2 000 mètres. Le mélèze fait figure de pionnier sur les alpages délaissés. Plus haut s'épanouissent
      genévrier nain, rhododendron ferrugineux, azalée naine et saules rampants, tandis que des reliques
      glaciaires comme l'edelweiss et la linnée boréale persistent dans les combes fraîches.
    wildlife: >-
      La figure tutélaire du parc est l'[ours brun](/especie/ursus_arctos/). Il frôla l'extinction totale dans
      les Alpes : en 1998, seuls trois individus étaient recensés génétiquement dans le Trentin occidental,
      incitant le parc à lancer en 1996 le projet Life Ursus grâce à des fonds européens. Aujourd'hui, la
      population prospère aux côtés du [loup gris](/especie/canis_lupus/) et du [lynx
      boréal](/especie/lynx_lynx/), revenus ces dernières années en effectifs non quantifiables.


      Parmi les ongulés, le [chamois](/especie/rupicapra_rupicapra/) maintient des effectifs abondants, tandis
      qu'une colonie de [bouquetin des Alpes](/especie/capra_ibex/) est issue d'un long programme de
      réintroduction, aux côtés du [cerf élaphe](/especie/cervus_elaphus/), du
      [chevreuil](/especie/capreolus_capreolus/) et du mouflon. L'écureuil roux et la [marmotte des
      Alpes](/especie/marmota_marmota/) sont les rongeurs les plus répandus.


      Pour les ornithologues : parmi les galliformes nichent le lagopède alpin, la perdrix bartavelle, le
      [tétras lyre](/especie/tetrao_tetrix/), le [grand tétras](/especie/tetrao_urogallus/) et la gélinotte
      des bois. Les rapaces diurnes comptent l'[aigle royal](/especie/aquila_chrysaetos/), la buse variable,
      l'autour des palombes, l'épervier d'Europe, la bondrée apivore et le faucon crécerelle, le [gypaète
      barbu](/especie/gypaetus_barbatus/) n'apparaissant qu'occasionnellement. Les rapaces nocturnes sont d'un
      grand intérêt écologique : chouette hulotte, hibou moyen-duc, nyctale de Tengmalm et chevêchette
      d'Europe.


      Le réseau hydrographique protège des torrents vifs et plus de 80 lacs d'altitude. Ces eaux hébergent
      omble chevalier, truite marbrée et truite fario, ainsi que triton alpestre et grenouille rousse. Parmi
      eux se distingue le célèbre lac de Tovel, réputé pour la coloration rouge sang que prenaient ses eaux
      lors de floraisons algales jusqu'en 1964.
    visit: >-
      Les centres d'accueil constituent la meilleure porte d'entrée : sept maisons réparties sur le territoire
      développent chacune une thématique propre (flore, ours, géologie, eau, relations homme-nature et faune).
      Ils offrent salles sensorielles, maquettes, bornes tactiles et dioramas, des mystères du Lago Rosso au
      retour des prédateurs. La Casa del Parco Geopark explicite la géodiversité contrastée entre Adamello et
      Brenta à l'aide d'installations interactives.


      Les randonnées les plus prisées s'articulent autour de l'eau. Le Sentiero delle Cascate dans le Val
      Genova relie Piana di Bedole à Malga Caret ; les cascades y sont spectaculaires à la fonte des neiges,
      la Cascata Nardis plongeant de quelque 95 mètres. Le circuit guidé des alpages du Brenta réunit Arza,
      Termoncello et Loverdina jusqu'à un belvédère surplombant le lac de Tovel.


      De multiples vallées latérales ouvrent l'accès aux combes les plus sauvages où la faune s'observe dans
      le calme.
    history: >-
      Le projet de parc est né de la volonté de sauvegarder l'ours brun alpin par la préservation de son
      biotope, reprise en 1928 par Gian Giacomo Gallarati Scotti. Les propositions initiales ciblaient trois
      piliers : le Val Genova, le groupe de Brenta et le lac de Tovel, ainsi que le dernier noyau d'ours
      indigènes des Alpes. L'Adamello-Brenta et Paneveggio-Pale di San Martino devinrent les deux premiers
      parcs naturels provinciaux d'Italie.


      Depuis 2008, le parc adhère au réseau international des géoparcs et relève depuis 2015 du programme des
      géoparcs mondiaux UNESCO. Trois distinctions UNESCO s'y superposent : les Dolomites au Patrimoine
      mondial, la Réserve de biosphère MAB Alpi Ledrensi e Judicaria et le Géoparc mondial Adamello Brenta.
    before: >-
      Le parc invite à ne prélever ni végétaux ni roches, à laisser son véhicule personnel et à privilégier la
      marche, le vélo ou les navettes collectives. Un équipement de montagne adapté aux variations brusques du
      temps est indispensable. Consultez les avis du parc avant de partir, certains sentiers faisant l'objet
      de travaux temporaires.
    around: >-
      Le [Parque Nacional del Stelvio](/lugar/parco-nazionale-dello-stelvio/) se trouve à un peu plus de dix
      kilomètres. Plus loin, le [Parque Natural de Karwendel](/lugar/naturpark-karwendel/), le [Parque Natural
      de los Alpes Marítimos](/lugar/parco-naturale-delle-alpi-marittime/), le [Parque Natural del Mont
      Avic](/lugar/parco-naturale-mont-avic/) et le [Grupo Ankogel - Altos
      Tauern](/lugar/ankogelgruppe---hohe-tauern/) partagent bouquetins, chamois et écosystèmes d'altitude.
  de:
    intro: >-
      Zwei Gebirge, die unterschiedlicher kaum sein könnten, blicken sich über ein Tal hinweg an. Auf der
      einen Seite die Brentagruppe mit ihren Felsburgen aus Zinnen, Türmen und schwindelerregenden Wänden aus
      altem Meeressediment. Auf der anderen das Massiv von Adamello-Presanella aus Tonalit, einem extrem
      harten Tiefengestein aus dem Erdinneren. Dazwischen verläuft das Val Rendena, und alles zusammen bildet
      den Naturpark Adamello-Brenta im Trentino: 625,83 km² Bergland zwischen 477 und 3.558 Metern Meereshöhe.
    landscape: >-
      Die Landschaft ist typisch für die südlichen Zentralalpen: Nadelwälder überziehen die Hänge bis 1.800
      Meter, darüber breiten sich alpine Matten und Felsfluren bis über 2.500 Meter aus. Wälder nehmen ein
      Drittel des Parks ein. Almen, Bergbäche, Hochmoore und unzugängliche Felsabstürze finden sich in allen
      Höhenlagen.


      Die Geologie liefert den Schlüssel zum Verständnis: Die Trias markiert die Entstehung der Dolomiten auf
      der tropischen Pangaea zwischen Korallenatollen und Gezeitenwatten, wo sich der Hauptdolomit ablagerte.
      Jene versteinerten Tropensedimente bilden heute kühne Felstürme. Dem gegenüber steht das Plutonmassiv
      des Adamello-Presanella. Beide Gruppen wurden seit rund 20 Millionen Jahren, als sich die Südalpen
      hoben, von Wasser und Gletschern modelliert. Den Geopark zu durchwandern gleicht dem Blättern in einem
      über 350 Millionen Jahre alten Steinbuch mit 61 Geostandorten.


      Dies begründet den Pflanzenreichtum des Gebiets: Zwischen 477 Metern und den Gipfeln wechseln Laubwälder
      der Tallagen zu Buchenwäldern und schließlich zum Nadelwaldgürtel aus Fichte, Lärche und Zirbelkiefer,
      der bis auf 1.900-2.000 Meter reicht. Die Lärche besiedelt als Pionierbaum aufgelassene Hochweiden.
      Weiter oben wachsen Zwergwacholder, Alpenrose, Alpenazalee und Kriechweiden, während eiszeitliche
      Reliktarten wie Edelweiß und Moosglöckchen in kühlen Nischen überdauerten.
    wildlife: >-
      Das Aushängeschild des Parks ist der [Braunbär](/especie/ursus_arctos/). Er stand in den Alpen kurz vor
      dem Erlöschen: 1998 wurden im westlichen Trentino nur noch drei Individuen genetisch nachgewiesen,
      woraufhin der Park 1996 mit LIFE-Mitteln das Wiederansiedlungsprojekt Life Ursus startete. Heute breitet
      sich die Population zusammen mit dem [Wolf](/especie/canis_lupus/) und dem [Eurasischen
      Luchs](/especie/lynx_lynx/) aus, die in den vergangenen Jahren zugewandert sind.


      Unter den Huftieren behauptet sich eine stattliche [Gämsenpopulation](/especie/rupicapra_rupicapra/)
      neben einer durch Auswilderungen etablierten Kolonie des [Alpensteinbocks](/especie/capra_ibex/),
      begleitet von [Rothirsch](/especie/cervus_elaphus/), [Reh](/especie/capreolus_capreolus/) und Mufflon.
      Eichhörnchen und [Alpenmurmeltier](/especie/marmota_marmota/) sind weit verbreitet.


      Für Vogelkundler: Unter den Raufußhühnern brüten Alpenschneehuhn, Steinhuhn,
      [Birkhuhn](/especie/tetrao_tetrix/), [Auerhuhn](/especie/tetrao_urogallus/) und Haselhuhn. Zu den
      Greifvögeln zählen [Steinadler](/especie/aquila_chrysaetos/), Mäusebussard, Habicht, Sperber,
      Wespenbussard und Turmfalke; der [Bartgeier](/especie/gypaetus_barbatus/) kreist gelegentlich im Gebiet.
      Eulen wie Waldkauz, Waldohreule, Raufußkauz und Sperlingskauz besitzen hohen ökologischen Wert.


      Der Park schützt klare Gebirgsbäche und über 80 Karseen mit Seesaibling, Marmorierter Forelle und
      Bachforelle. Berühmt ist der Tovelsee, dessen Wasser sich bis 1964 durch eine Algenblüte periodisch
      blutrot färbte.
    visit: >-
      Als Auftakt empfehlen sich die Besucherzentren: Sieben Einrichtungen im Park widmen sich je eigenen
      Schwerpunkten (Flora, Bär, Geologie, Wasser, Mensch und Umwelt, Fauna). Sie bieten Tasträume, Dioramen,
      Geruchsstationen und Medienräume. Das Haus Casa del Parco Geopark veranschaulicht die gegensätzliche
      Geodiversität von Adamello und Brenta interaktiv.


      Beliebte Wanderungen folgen dem Wasser: Der Sentiero delle Cascate im Val Genova verbindet Piana di
      Bedole mit Malga Caret; die Wasserfälle schwellen zur Schneeschmelze mächtig an, wobei der Wasserfall
      Cascata Nardis rund 95 Meter tief stürzt. Die geführte Almwanderung der Malghe del Brenta verbindet
      Arza, Termoncello und Loverdina bis zu einem Aussichtspunkt über dem Tovelsee.


      Zahlreiche Seitentäler erschließen einsame Hochlagen, wo Wildtiere ungestört beobachtet werden können.
    history: >-
      Der Schutzgedanke wurzelte im Erhalt des Alpenbraunbären und seines Lebensraums, eine Initiative, die
      1928 von Gian Giacomo Gallarati Scotti aufgegriffen wurde. Frühe Pläne benannten drei Schutzzonen: das
      Val Genova, die Brentagruppe und den Tovelsee. Adamello-Brenta und Paneveggio-Pale di San Martino wurden
      zu den ersten beiden Naturparks Italiens erklärt.


      Seit 2008 gehört der Park dem europäischen Geopark-Netzwerk an und ist seit 2015 UNESCO Global Geopark.
      Drei UNESCO-Prädikate vereinen sich hier: Dolomiten-Weltnaturerbe, Biosphärenreservat Alpi Ledrensi e
      Judicaria und Geopark Adamello Brenta.
    before: >-
      Pflanzen, Steine und Naturfunde dürfen nicht entnommen werden; lasse das Auto stehen und nutze
      Wanderwege, Fahrräder oder Parkbusse. Alpine Ausrüstung für plötzliche Wetterumschwünge ist angeraten.
      Informiere dich vorab über aktuelle Wegesperrungen.
    around: >-
      Der [Parque Nacional del Stelvio](/lugar/parco-nazionale-dello-stelvio/) liegt etwas mehr als zehn
      Kilometer entfernt. Weiter entfernt teilen der [Parque Natural de
      Karwendel](/lugar/naturpark-karwendel/), der [Parque Natural de los Alpes
      Marítimos](/lugar/parco-naturale-delle-alpi-marittime/), der [Parque Natural del Mont
      Avic](/lugar/parco-naturale-mont-avic/) und die [Grupo Ankogel - Altos
      Tauern](/lugar/ankogelgruppe---hohe-tauern/) Steinböcke, Gämsen und hochalpine Lebensräume mit
      Adamello-Brenta.
  it:
    intro: >-
      Due montagne che non si somigliano affatto si guardano dai lati opposti di una valle. Da una parte il
      gruppo di Brenta, con i suoi castelli di pietra fatti di torri, guglie e pareti vertiginose formate da
      sedimenti marini arcaici. Dall'altra il massiccio dell'Adamello-Presanella, scolpito nella tonalite,
      roccia magmatica durissima originata nelle profondità crostali. Tra di essi scorre la Val Rendena,
      componendo il Parco Naturale Adamello-Brenta, in Trentino: 625,83 km² di territorio montano compreso tra
      477 e 3.558 metri di altitudine.
    landscape: >-
      L'ambiente riflette l'arco alpino centro-meridionale: foreste di conifere ammantano i versanti fino a
      1.800 metri, cedendo il passo a praterie alpine e rupi che superano i 2.500 metri. I boschi ricoprono un
      terzo dell'area protetta. Pascoli, torrenti glaciali, torbiere e bastioni rocciosi si distribuiscono a
      ogni quota.


      La geologia costituisce il tema fondante. Il Triassico segna la genesi delle Dolomiti nella Pangea
      tropicale, tra atolli corallini e piane di marea dove si depositò la Dolomia Principale. Quei fondali
      marini si sono trasformati nelle cattedrali di roccia odierne. Sul versante opposto
      l'Adamello-Presanella è un massiccio plutonico di tonalite. Entrambi i gruppi sono stati modellati da
      ghiaccio e acqua da circa 20 milioni di anni, all'atto dell'orogenesi delle Alpi Meridionali. Esplorare
      il Geoparco equivale a sfogliare un archivio litologico di oltre 350 milioni di anni con 61 geositi.


      Tale varietà geologica spiega la ricchezza floristica: tra 477 metri e le vette si avvicendano
      latifoglie di fondovalle, faggete montane e la fascia di conifere a peccio, larice e pino cembro,
      dominante fino a 1.900-2.000 metri. Il larice colonizza pionieristicamente gli alpeggi dismessi. Più in
      alto prosperano ginepro nano, rododendro, azalea alpina e salici striscianti, mentre relitti glaciali
      quali stella alpina e abelia boreale resistono negli anfratti freddi.
    wildlife: >-
      La specie bandiera del parco è l'[orso bruno](/especie/ursus_arctos/). Fu a un passo dalla totale
      scomparsa nell'arco alpino: nel 1998 rimanevano solo tre individui geneticamente censiti nel Trentino
      occidentale, inducendo il parco a intraprendere nel 1996 il progetto europeo Life Ursus per il
      ripopolamento. Oggi la popolazione si consolida assieme al [lupo grigio](/especie/canis_lupus/) e alla
      [lince europea](/especie/lynx_lynx/), riapparsi negli ultimi anni in consistenza non quantificabile.


      Tra gli ungulati spiccano una solida popolazione di [camoscio alpino](/especie/rupicapra_rupicapra/) e
      una colonia di [stambecco](/especie/capra_ibex/) insediata grazie a pluriennali reintroduzioni, oltre a
      [cervo](/especie/cervus_elaphus/), [capriolo](/especie/capreolus_capreolus/) e muflone. Scoiattolo e
      [marmotta](/especie/marmota_marmota/) sono i roditori più diffusi.


      Per gli amanti dell'avifauna: tra i tetraonidi nidificano pernice bianca, coturnice, [fagiano di
      monte](/especie/tetrao_tetrix/), [urogallo](/especie/tetrao_urogallus/) e francolino di monte. I rapaci
      diurni accolgono l'[aquila reale](/especie/aquila_chrysaetos/), la poiana, l'astore, lo sparviere, il
      pecchiaiolo e il gheppio, mentre il [gipeto](/especie/gypaetus_barbatus/) fa saltuarie apparizioni. Gli
      strigiformi includono allocco, gufo comune, civetta capogrosso e civetta nana.


      Il reticolo idrografico custodisce torrenti limpidi e oltre 80 laghi alpini popolati da salmerino
      alpino, trota marmorata e trota fario. Celebre è il lago di Tovel, noto fino al 1964 per il fenomeno
      dell'arrossamento delle sue acque indotto da una fioritura algale.
    visit: >-
      Il percorso ideale muove dai centri visitatori: sette sedi dislocate sul territorio con percorsi
      tematici dedicati (flora, orso, geologia, acqua, rapporto uomo-ambiente, fauna). Comprendono stanze
      sensoriali, plastici, schermi interattivi e diorami, dal mistero del Lago Rosso al rientro dell'orso. La
      Casa del Parco Geopark illustra la geodiversità a confronto tra Adamello e Brenta.


      Le escursioni classiche seguono le vie d'acqua. Il Sentiero delle Cascate in Val Genova congiunge Piana
      di Bedole e Malga Caret; le cateratte mostrano grande vigore a inizio estate, con la Cascata Nardis che
      precipita per circa 95 metri. Il periplo guidato delle malghe del Brenta tocca Arza, Termoncello e
      Loverdina affacciandosi sul lago di Tovel.


      Numerose valli secondarie aprono l'accesso alle zone più selvagge dove avvistare la fauna protetta.
    history: >-
      L'idea originaria scaturì dall'urgenza di salvaguardare l'orso bruno alpino tramite la tutela del suo
      areale, proposta rilanciata nel 1928 da Gian Giacomo Gallarati Scotti. Le prime istanze individuavano
      tre fulcri: la Val Genova, il gruppo di Brenta e il lago di Tovel, culla dell'ultima popolazione d'orsi
      autoctoni delle Alpi. Adamello-Brenta e Paneveggio-Pale di San Martino furono i primi due parchi
      provinciali istituiti in Italia.


      Dal 2008 il parco è membro della rete dei geoparchi mondiali e dal 2015 rientra nel programma UNESCO
      Global Geoparks. Vi convergono tre riconoscimenti UNESCO: Dolomiti Patrimonio Mondiale, Riserva della
      Biosfera MAB Alpi Ledrensi e Judicaria e Geoparco Mondiale Adamello Brenta.
    before: >-
      È vietato asportare minerali o specie botaniche; si consiglia di lasciare l'auto e fruire dei sentieri,
      della bicicletta o dei bus navetta del parco. Sono necessari indumenti da montagna adatti a mutamenti
      meteo repentini. Controlla gli avvisi del parco prima della partenza per eventuali cantieri lungo i
      tracciati.
    around: >-
      Il [Parque Nacional del Stelvio](/lugar/parco-nazionale-dello-stelvio/) si trova a poco più di dieci
      chilometri. Più lontani, il [Parque Natural de Karwendel](/lugar/naturpark-karwendel/), il [Parque
      Natural de los Alpes Marítimos](/lugar/parco-naturale-delle-alpi-marittime/), il [Parque Natural del
      Mont Avic](/lugar/parco-naturale-mont-avic/) e il [Grupo Ankogel - Altos
      Tauern](/lugar/ankogelgruppe---hohe-tauern/) condividono stambecchi, camosci ed ecosistemi alpini con
      l'Adamello-Brenta.
  pt:
    intro: >-
      Duas montanhas inteiramente distintas fitam-se de margens opostas de um vale. De um lado ergue-se o
      grupo de Brenta, com as suas fortalezas de pedra esculpidas em agulhas, torres e muralhas vertiginosas
      nascidas de antigos sedimentos marinhos. Do outro avulta o maciço de Adamello-Presanella, talhado em
      tonalito, rocha magmática de grande dureza forjada nas profundezas da crosta terrestre. No intervalo
      estende-se o Val Rendena, compondo o Parque Natural Adamello-Brenta, no Trentino: 625,83 km² de relevo
      alpino compreendido entre os 477 e os 3.558 metros de altitude.
    landscape: >-
      O ambiente reflete os traços do arco alpino centro-meridional: florestas de coníferas recobrem as
      vertentes até aos 1.800 metros, sucedendo-se prados alpinos e vegetação rupícola que ultrapassam os
      2.500 metros. As florestas ocupam um terço da superfície protegida. Pastagens, torrentes glaciares,
      turfeiras e escarpas agrestes distribuem-se por todas as cotas.


      A geologia estrutura a paisagem: o Triásico assistiu à génese das Dolomitas na Pangeia tropical, entre
      atóis de coral e lagunas de maré onde assentou a Dolomia Principal. Esses depósitos de mares extintos
      formam hoje espigões de pedra voltados ao céu. Defronte, o Adamello-Presanella ergue-se como maciço de
      tonalito. Ambos os conjuntos foram cinzelados pelo gelo e pela água desde há cerca de 20 milhões de
      anos, aquando da emersão dos Alpes Meridionais. Percorrer o Geoparque equivale a desfolhar um registo
      lítico de mais de 350 milhões de anos dotado de 61 geossítios.


      Essa variedade explica a riqueza botânica: dos 477 metros às cumeadas sucedem-se folhosas de vale,
      faiais montanos e a cintura de coníferas — abeto-falso, lariço e pinheiro-suíço —, dominante até aos
      1.900-2.000 metros. O lariço coloniza pastagens desativadas. Mais acima surgem zimbro-anão, rododendro,
      azáleas-alpinas e salgueiros-anões, enquanto relíquias glaciares como a edelvaisse e a linneia-boreal
      sobrevivem em reentrâncias abrigadas.
    wildlife: >-
      O estandarte maior do parque é o [urso-pardo](/especie/ursus_arctos/). Esteve à beira do desaparecimento
      nos Alpes: em 1998 restavam somente três espécimes recenseados geneticamente no Trentino ocidental,
      levando o parque a encetar em 1996 o projeto Life Ursus com apoio comunitário. Hoje a população recupera
      em conjunto com o [lobo](/especie/canis_lupus/) e o [lince-euroasiático](/especie/lynx_lynx/),
      regressados em número não quantificável nos últimos anos.


      Entre os ungulados destaca-se uma densa população de [camurça](/especie/rupicapra_rupicapra/) e uma
      colónia de [íbex](/especie/capra_ibex/) restabelecida após sucessivas reintroduções, além de
      [veado](/especie/cervus_elaphus/), [corço](/especie/capreolus_capreolus/) e muflão. O esquilo e a
      [marmota](/especie/marmota_marmota/) são os roedores mais abundantes.


      Na avifauna nidificam a lagópode-branca, a perdiz-da-rocha, o [tetraz-lira](/especie/tetrao_tetrix/), o
      [tetraz-grande](/especie/tetrao_urogallus/) e a galinha-do-mato. Entre as aves de rapina diurnas
      contam-se a [águia-real](/especie/aquila_chrysaetos/), o bútio-comum, o açor, o gavião, o
      vespeiro-europeu e o peneireiro, com o [quebra-ossos](/especie/gypaetus_barbatus/) a surgir
      episodicamente. Os estrigiformes englobam coruja-do-mato, bufo-pequeno, mocho-funéreo e mocho-pigmeu.


      Os ecossistemas aquáticos salvaguardam ribeiros e mais de 80 lagos alpinos onde habitam truta-mariscada,
      truta-marmoreada e truta-comum. Destaca-se o lago de Tovel, afamado pelo tom vermelho-sangue que as suas
      águas assumiam sazonalmente através da proliferação de algas até 1964.
    visit: >-
      A melhor porta de entrada faz-se pelos centros de visitantes: sete núcleos distribuídos pelo território
      com valências temáticas distintas (flora, urso, geologia, água, ser humano e ambiente, fauna). Possuem
      salas sensoriais, dioramas, ecrãs táteis e maquetas explicativas. A Casa del Parco Geopark ilustra o
      confronto geológico entre Adamello e Brenta de forma interativa.


      Os percursos mais procurados privilegiam os cursos de água. O Sentiero delle Cascate em Val Genova liga
      Piana di Bedole a Malga Caret; o degelo faz transbordar as cascatas no final da primavera, caindo a
      Cascata Nardis cerca de 95 metros. O roteiro pedestre das malgas de Brenta enlaça Arza, Termoncello e
      Loverdina com miradouro sobre o lago de Tovel.


      Numerosos vales secundários conduzem aos setores mais recônditos para observação de fauna selvagem.
    history: >-
      A aspiração de criar um parque nasceu da urgência de conservar o urso-pardo alpino através do seu
      habitat, recuperada em 1928 por Gian Giacomo Gallarati Scotti. Os projetos fundadores delineavam três
      pilares de salvaguarda: o Val Genova, o grupo de Brenta e o lago de Tovel, berço dos últimos ursos
      autóctones dos Alpes. Adamello-Brenta e Paneveggio-Pale di San Martino foram os dois primeiros parques
      provinciais de Itália.


      Desde 2008 o parque integra a rede internacional de geoparques e desde 2015 o programa UNESCO Global
      Geoparks. Nele convergem três classificações da UNESCO: Dolomitas Património Mundial, Reserva da
      Biosfera MAB Alpi Ledrensi e Judicaria e Geoparque Mundial Adamello Brenta.
    before: >-
      É proibido recolher flores, rochas ou fragmentos naturais; recomenda-se deixar o automóvel e deslocar-se
      a pé, de bicicleta ou nos vaivéns do parque. Roupa técnica para mudanças meteorológicas súbitas é
      indispensável. Consulta os avisos prévios para eventuais cortes temporários de trilhos.
    around: >-
      O [Parque Nacional del Stelvio](/lugar/parco-nazionale-dello-stelvio/) localiza-se a pouco mais de dez
      quilómetros. Mais afastados, o [Parque Natural de Karwendel](/lugar/naturpark-karwendel/), o [Parque
      Natural de los Alpes Marítimos](/lugar/parco-naturale-delle-alpi-marittime/), o [Parque Natural del Mont
      Avic](/lugar/parco-naturale-mont-avic/) e o [Grupo Ankogel - Altos
      Tauern](/lugar/ankogelgruppe---hohe-tauern/) partilham íbexes, camurças e biomas alpinos com
      Adamello-Brenta.
