resumen:
  es: >-
    El segundo parque nacional más grande de Finlandia (2.550 km²), colinas redondeadas (*tunturi*) de tundra
    ártica y senderismo salvaje a la sombra de Sokosti (718 m).
  en: >-
    Finland’s second largest national park (2,550 km²), rounded arctic tundra fell-tops (*tunturi*), and wild
    trekking under the shadow of Sokosti (718 m).
  fr: >-
    Deuxième plus grand parc national de Finlande (2 550 km²), collines arrondies de toundra (*tunturi*) et
    trekking sauvage sous l’ombre du Sokosti (718 m).
  de: >-
    Finnlands zweitgrößter Nationalpark (2.550 km²), sanfte Tunturi-Kuppen arktischer Tundra und weite Wildnis
    im Schatten des Sokosti (718 m).
  it: >-
    Il secondo parco nazionale più esteso della Finlandia (2.550 km²), rilievi arrotondati di tundra
    (*tunturi*) e trekking selvaggio all’ombra del Sokosti (718 m).
  pt: >-
    O segundo maior parque nacional da Finlândia (2.550 km²), colinas arredondadas de tundra (*tunturi*) e
    caminhadas selvagens à sombra do Sokosti (718 m).
unico:
  es: 'Una línea de fells divide las aguas del parque: unos ríos van al mar Báltico y otros al océano Ártico.'
  en: >-
    A chain of open fells divides the park’s waters: some rivers flow to the Baltic Sea and others to the
    Arctic Ocean.
  fr: >-
    Une chaîne de fells sépare les eaux du parc : certains cours d’eau rejoignent la mer Baltique et d’autres
    l’océan Arctique.
  de: >-
    Eine Kette baumloser Fjellkuppen teilt die Gewässer: Einige Flüsse fließen zur Ostsee, andere zum
    Nordpolarmeer.
  it: >-
    Una dorsale di fells separa le acque del parco: alcuni fiumi scendono al mar Baltico e altri sfociano nel
    mar Glaciale Artico.
  pt: >-
    Uma cordilheira de fells divide as águas do parque: alguns rios correm para o mar Báltico e outros para o
    oceano Ártico.
observaciones:
  es: >-
    En la zona de ocio las hogueras solo se permiten en los fogones señalizados del mapa, con leña llevada
    para ese fin; en la zona remota puedes hacer fuego con ramas caídas, salvo en algunos lugares. Los perros
    pueden entrar, pero siempre con correa. En la franja fronteriza no se puede entrar sin el permiso
    adecuado, ni siquiera un paso. La cobertura móvil es aceptable, pero hay muchas zonas con señal débil.
    Durante marzo y abril las cabañas abiertas suelen estar llenas, así que reserva una cabaña reservable o
    lleva tienda.
texto:
  es:
    intro: >-
      En la Laponia boscosa cabe entera dentro de un solo parque. Urho Kekkonen, creado en 1983, abarca 2.550
      km² entre los municipios de Savukoski, Sodankylä e Inari y es el segundo parque nacional más grande de
      Finlandia, además del segundo más visitado. Aquí la vegetación exuberante es rara: hay bosques
      interminables y casi vírgenes de pino y abeto, turberas inmensas y, en medio, una franja de fells que
      parte el parque de este a oeste. Es un sitio para quien busca soledad y distancias largas.
    landscape: >-
      Un parque de esta escala tiene un eje, y es el de los fells, que lo cruzan de este a oeste. Esa región
      de colinas parte las aguas: en el sur nacen el Luirojoki, el Kopsusjoki y el Repojoki, que bajan al
      Báltico junto al Kemijoki, y en el norte y el este el Suomujoki, el Luttojoki y otros desembocan en el
      océano Ártico. Sokosti es la cumbre más alta, con 718 metros; le siguen Ukselmapää, con 698, y Vuomapää,
      con 689. Todos los paisajes de fell del parque cuentan una historia austera sobre la Edad de Hielo.


      Abajo, el bosque. La mayor parte del parque es pinar, repartido por todas partes sobre la arena de
      crestas bajas de eskers, y es en su mayoría bosque intacto. El abetal continuo de la Laponia oriental
      llega hasta la zona de Vongoiva-Sokosti-Lupukkapää. En las laderas, el límite del arbolado lo forma el
      abedul de montaña, y en las cumbres donde apenas sobreviven pinos y abetos forma matorrales densos por
      los que solo puedes abrirte paso; la mayoría de los abedulares de montaña de Finlandia están en este
      parque. Más arriba todavía, en lo alto del fell, solo quedan arbustos enanos, ciperáceas y licopodio
      alpino.


      Después de los bosques, lo que más cubre el parque son turberas y humedales, con extensos tremedales en
      el sur. En ellas puede haber hasta treinta especies de esfagnos. Posoaapa, de unos 16 km de largo y
      7.000 hectáreas, era la mayor turbera aapa de Finlandia, pero quedó casi toda bajo el embalse de Lokka.
      El basamento rocoso es bastante pobre en nutrientes y por eso hay pocas especies vegetales; el clima es
      continental, y el mar no modera la temperatura ni trae lluvias fuertes.
    wildlife: >-
      Más de veinte especies de mamíferos habitan el parque. Entre los grandes carnívoros están el [oso
      pardo](/especie/ursus_arctos/), el [glotón](/especie/gulo_gulo/), el [lobo](/especie/canis_lupus/) y el
      [lince](/especie/lynx_lynx/), y el parque es un santuario donde son las especies más amenazadas. Es más
      probable cruzarte con [renos](/especie/rangifer_tarandus/), liebres, [alces](/especie/alces_alces/) y
      zorros. Junto a los cursos de agua busca la [nutria](/especie/lutra_lutra/) o sus rastros, y en algunos
      lugares vive el amenazado [mejillón perlífero](/especie/margaritifera_margaritifera/).


      El [águila real](/especie/aquila_chrysaetos/) es el emblema oficial del parque: hay once territorios, y
      en toda Finlandia se calculan entre 362 y 496 parejas nidificantes. El parque ofrece zonas de
      nidificación a más de cien especies de aves. En el bosque antiguo viven el arrendajo siberiano, el
      carbonero lapón y el [pico tridáctilo](/especie/picoides_tridactylus/). La larva de la polilla taiga
      crece casi del todo el primer verano, pero no será adulta hasta el tercer verano, tras invernar dos
      inviernos; de ahí que la polilla aparezca en un mismo sitio solo cada dos años.


      El año tiene dos temporadas fuertes: la de esquí, en marzo y abril, y la de senderismo, en verano y
      otoño. En invierno la travesía es muy exigente: puede haber hasta menos 40 grados y solo un par de horas
      de luz en lo más oscuro.
    visit: >-
      La mayoría de las excursiones parten del centro de fell de Kiilopää, del lago Aittajärvi junto al
      Suomujoki o de Raja-Jooseppi, y muchos senderistas terminan cerca de Sokosti. Los senderos señalizados
      del oeste son fáciles incluso sin experiencia; el interior salvaje sirve para travesías largas y
      exigentes. Muchos excursionistas pernoctan en los refugios de monte construidos junto al lago
      Luirojärvi, a los pies de Sokosti.


      Si prefieres una introducción tranquila, el sendero Kiirunapolku rodea el fell Kiilopää y sus paneles
      cuentan la naturaleza austera del fell, con sus plantas, aves y otros animales. En bicicleta, en verano
      solo se puede circular por senderos marcados, y uno de los permitidos es la conexión de Kakslauttanen a
      Kopsusjärvi; en invierno se puede pedalear fuera de las pistas de esquí.
    history: >-
      El pastoreo de renos, con su cultura y tradiciones antiguas, sigue siendo una fuente importante de
      sustento para la población local. El 80 % de la superficie del parque está en la patria de los sami, y
      los seidas son sagrados para ellos y deben abordarse con respeto. El pastoreo dejó en el parque trampas
      para renos salvajes, cercas, cabañas y antiguos asentamientos skolt restaurados.


      El parque forma, junto con otros cinco espacios cercanos, un único espacio Natura 2000.
    before: >-
      En la zona de ocio las hogueras solo se permiten en los fogones señalizados del mapa, con leña llevada
      para ese fin; en la zona remota puedes hacer fuego con ramas caídas, salvo en algunos lugares. Los
      perros pueden entrar, pero siempre con correa. En la franja fronteriza no se puede entrar sin el permiso
      adecuado, ni siquiera un paso. La cobertura móvil es aceptable, pero hay muchas zonas con señal débil.
      Durante marzo y abril las cabañas abiertas suelen estar llenas, así que reserva una cabaña reservable o
      lleva tienda.
    around: >-
      El [Parque Nacional de Sarek](/lugar/sarek-national-park/) comparte con Urho Kekkonen la alta montaña,
      el glotón, el alce y el oso pardo. El [Parque Nacional de Gutulia](/lugar/gutulia-national-park/)
      comparte el bosque primario, los humedales, el alce, el arrendajo siberiano y el pico tridáctilo, y el
      [Parque Nacional de Stabbursdalen](/lugar/stabbursdalen-national-park/) el alce, el arrendajo siberiano
      y el oso pardo. El [Parque Nacional de Hossa](/lugar/hossan-kansallispuisto/) comparte el glotón, el
      reno y el lobo.
  en:
    intro: >-
      Forested Lapland could almost fit entirely inside this single park. Established in 1983, Urho Kekkonen
      covers 2,550 km² across the municipalities of Savukoski, Sodankylä, and Inari, ranking as Finland's
      second largest national park and its second most visited. Luxuriant vegetation is rare here: vast,
      nearly virgin pine and spruce forests stretch endlessly alongside immense mires, bisected from east to
      west by a chain of fells. It is a realm made for those seeking deep solitude and long distances.
    landscape: >-
      A park on this scale revolves around a single central spine: the fells traversing it from east to west.
      This uplands region forms a major watershed: to the south rise the Luirojoki, Kopsusjoki, and Repojoki,
      flowing via the Kemijoki down to the Baltic Sea, whereas to the north and east the Suomujoki, Luttojoki,
      and others empty into the Arctic Ocean. Sokosti is the highest peak at 718 metres, followed by
      Ukselmapää at 698 and Vuomapää at 689. Every fell landscape in the park recounts an austere tale of the
      Ice Age.


      Down below lies the forest. Most of the park is pine woodland spreading across the sandy soils of low
      esker ridges, largely untouched old-growth. The continuous spruce belt of eastern Lapland reaches the
      Vongoiva-Sokosti-Lupukkapää sector. On the hillsides, mountain birch marks the tree line, forming dense
      thickets across summits where pine and spruce can barely survive, through which you must push your way;
      most of Finland's mountain birch stands are preserved within this park. Higher still, on the windswept
      fell tops, only dwarf shrubs, sedges, and alpine clubmoss cling to life.


      After woodlands, mires and wetlands cover the largest extent, with expansive aapa bogs in the south. Up
      to thirty sphagnum moss species can be found among them. Posoaapa, roughly 16 km long and 7,000
      hectares, was once Finland's grandest aapa mire before being mostly submerged under the Lokka reservoir.
      The bedrock is nutrient-poor, limiting plant diversity, while the continental climate brings sharp
      temperature swings unchecked by oceanic moderation.
    wildlife: >-
      More than twenty mammal species inhabit the park. Large predators include the [brown
      bear](/especie/ursus_arctos/), [wolverine](/especie/gulo_gulo/), [wolf](/especie/canis_lupus/), and
      [Eurasian lynx](/especie/lynx_lynx/), finding refuge in this sanctuary where they are strictly
      protected. You are far more likely to encounter semi-domesticated
      [reindeer](/especie/rangifer_tarandus/), mountain hares, [moose](/especie/alces_alces/), and red foxes.
      Along watercourses, look for the [Eurasian otter](/especie/lutra_lutra/) or its tracks, and certain
      rivers harbour the endangered [freshwater pearl mussel](/especie/margaritifera_margaritifera/).


      The [golden eagle](/especie/aquila_chrysaetos/) serves as the park's official emblem: eleven territories
      exist here, out of an estimated 362 to 496 breeding pairs across all Finland. The park provides nesting
      grounds for over a hundred bird species. Old-growth forests shelter the Siberian jay, grey-headed
      chickadee, and the [three-toed woodpecker](/especie/picoides_tridactylus/). Larvae of the northern dart
      moth grow nearly to full size in their first summer but do not emerge as adults until their third
      summer, having overwintered twice; thus the adult moth appears at any given spot only every two years.


      The year features two distinct peak seasons: skiing in March and April, and hiking in summer and autumn.
      Winter journeys demand serious wilderness skills: temperatures can plummet to minus 40 degrees,
      accompanied by merely a couple of hours of twilight at midwinter.
    visit: >-
      Most hiking tours start from the Kiilopää fell centre, Lake Aittajärvi along the Suomujoki, or
      Raja-Jooseppi, with many backpackers heading towards the base of Sokosti. Marked trails in the west are
      accessible even to novices; the wild backcountry lends itself to long, self-sufficient wilderness treks.
      Many hikers spend nights in wilderness huts beside Lake Luirojärvi beneath Sokosti.


      If you prefer a gentler introduction, the Kiirunapolku nature trail loops around Kiilopää fell with
      interpretive boards explaining fell ecology, plants, birds, and adaptations. Cycling in summer is
      restricted to designated tracks, such as the route connecting Kakslauttanen to Kopsusjärvi; in winter
      you can fatbike outside prepared ski tracks.
    history: >-
      Reindeer herding, along with its ancient culture and traditions, remains a vital livelihood for local
      communities. Around 80 % of the park's territory lies within the Sámi homeland; *seidas* (sacred natural
      sites) are revered by them and must be approached with utmost respect. Historic herding has left wild
      reindeer pitfalls, fences, log cabins, and restored Skolt Sámi seasonal homesteads throughout the
      landscape.


      The park, together with five neighbouring protected tracts, constitutes a single unified Natura 2000
      site.
    before: >-
      In the recreational zone, campfires are permitted only at designated campfire rings shown on maps, using
      provided firewood; in the remote backcountry you may gather dry fallen wood, except in restricted zones.
      Dogs are welcome but must remain leashed at all times. Entering the border zone without a formal permit
      is strictly forbidden, even for a single step. Mobile network reception is generally adequate but
      suffers from dead zones in valleys. During March and April open wilderness huts fill quickly, so book a
      reservable hut or carry a sturdy tent.
    around: >-
      The [Sarek National Park](/lugar/sarek-national-park/) shares high mountain landscapes, wolverine,
      moose, and brown bear with Urho Kekkonen. [Gutulia National Park](/lugar/gutulia-national-park/) shares
      primeval taiga, mires, moose, Siberian jay, and three-toed woodpecker, while [Stabbursdalen National
      Park](/lugar/stabbursdalen-national-park/) shares moose, Siberian jay, and brown bear. [Hossa National
      Park](/lugar/hossan-kansallispuisto/) shares wolverine, reindeer, and wolf.
  fr:
    intro: >-
      La Laponie forestière tiendrait presque tout entière dans ce seul parc. Créé en 1983, Urho Kekkonen
      s'étend sur 2 550 km² entre les communes de Savukoski, Sodankylä et Inari, se hissant au deuxième rang
      des parcs nationaux de Finlande par sa taille comme par sa fréquentation. La végétation luxuriante y est
      absente : d'immenses forêts quasi vierges de pins et d'épicéas bordent de gigantesques tourbières,
      coupées d'est en ouest par une chaîne de monts pelés (*fells*). Un territoire taillé pour qui cherche la
      solitude et les grands espaces.
    landscape: >-
      Un parc de cette ampleur s'organise autour d'un axe majeur : la chaîne de fells qui le traverse d'est en
      ouest. Ce relief partage les eaux : au sud naissent le Luirojoki, le Kopsusjoki et le Repojoki,
      descendant vers la Baltique par le Kemijoki, tandis qu'au nord et à l'est le Suomujoki, le Luttojoki et
      d'autres rejoignent l'océan Arctique. Le Sokosti est le sommet le plus haut avec 718 mètres ; suivent
      l'Ukselmapää avec 698 et le Vuomapää avec 689. Tous les reliefs du parc racontent l'histoire austère de
      la période glaciaire.


      En contrebas règne la forêt. La majeure partie du parc est une pinède établie sur le sable de cordons
      d'eskers, formant une forêt ancienne pour l'essentiel intacte. La pessière continue de Laponie orientale
      s'avance jusqu'au secteur Vongoiva-Sokosti-Lupukkapää. Sur les pentes, la limite des arbres est fixée
      par le bouleau tortueux des montagnes, formant des taillis denses sur les hauteurs où pins et épicéas
      peinent à survivre, au travers desquels vous devrez vous frayer un chemin ; la majorité des bétulaies
      montagnardes de Finlande se trouvent ici. Plus haut encore, sur les sommets dénudés, ne subsistent que
      landes rases, cypéracées et lycopodes alpins.


      Après les forêts, ce sont les tourbières et zones humides qui dominent, avec de vastes tourbières aapa
      au sud. On peut y dénombrer jusqu'à trente espèces de sphaignes. Posoaapa, longue d'environ 16 km et
      couvrant 7 000 hectares, était la plus vaste tourbière aapa de Finlande avant d'être presque engloutie
      sous le lac de barrage de Lokka. Le socle rocheux pauvre en nutriments limite la variété végétale, et le
      climat continental impose de vifs contrastes que la mer ne vient pas tempérer.
    wildlife: >-
      Plus de vingt espèces de mammifères peuplent le parc. Parmi les grands carnivores figurent l'[ours
      brun](/especie/ursus_arctos/), le [glouton](/especie/gulo_gulo/), le [loup](/especie/canis_lupus/) et le
      [lynx boréal](/especie/lynx_lynx/), trouvant ici un sanctuaire où ils sont protégés. Vous croiserez plus
      facilement des [rennes](/especie/rangifer_tarandus/), des lièvres variables, des
      [élans](/especie/alces_alces/) et des renards. Le long des rivières, guettez la [loutre
      d'Europe](/especie/lutra_lutra/) ou ses traces, et certains cours d'eau abritent la rare [moule perlière
      d'eau douce](/especie/margaritifera_margaritifera/).


      L'[aigle royal](/especie/aquila_chrysaetos/) est l'emblème officiel du parc : on y compte onze
      territoires, pour une population finlandaise estimée entre 362 et 496 couples nicheurs. Le parc offre
      des sites de nidification à plus de cent espèces d'oiseaux. La vieille taïga héberge le mésangeai
      imitateur, la mésange lapone et le [pic tridactyle](/especie/picoides_tridactylus/). La chenille de la
      noctuelle arctique grandit presque totalement son premier été mais n'atteint l'âge adulte qu'au
      troisième été, après avoir hiberné deux hivers ; l'adulte n'apparaît donc en un même lieu que tous les
      deux ans.


      L'année s'articule autour de deux saisons fortes : le ski en mars et avril, et la randonnée en été et
      automne. En hiver, la traversée exige une solide expérience : le thermomètre peut descendre jusqu'à
      moins 40 degrés avec seulement deux heures de pénombre au plus creux de l'hiver.
    visit: >-
      La majorité des randonnées partent du centre de plein air de Kiilopää, du lac Aittajärvi le long du
      Suomujoki ou de Raja-Jooseppi, et nombre de randonneurs convergent vers le pied du Sokosti. Les sentiers
      balisés de l'ouest sont accessibles même aux débutants ; le cœur sauvage se prête aux longues traversées
      en autonomie. De nombreux marcheurs passent la nuit dans les refuges de montagne construits au bord du
      lac Luirojärvi, sous le Sokosti.


      Si vous préférez une découverte en douceur, le sentier Kiirunapolku fait le tour du mont Kiilopää et ses
      panneaux détaillent la flore, les oiseaux et la faune des fells. En vélo, l'été n'autorise la
      circulation que sur les pistes indiquées, comme la liaison reliant Kakslauttanen à Kopsusjärvi ; en
      hiver, vous pouvez pédaler en fatbike hors des pistes de ski de fond damées.
    history: >-
      L'élevage des rennes, avec sa culture et ses traditions ancestrales, reste un moyen d'existence
      essentiel pour la population locale. Environ 80 % de la surface du parc s'inscrit dans le territoire
      d'origine des Samis, et leurs *seidas* (sites sacrés) appellent un respect absolu. Le pastoralisme a
      laissé dans le paysage des fosses de piégeage pour rennes sauvages, des clôtures, des cabanes et
      d'anciens campements samis skolts restaurés.


      Le parc forme, avec cinq autres espaces protégés voisins, un unique site Natura 2000.
    before: >-
      Dans la zone récréative, les feux de camp ne sont autorisés que sur les foyers signalés sur les cartes,
      avec le bois fourni ; dans la zone sauvage, vous pouvez faire du feu avec du bois mort tombé au sol,
      sauf dans certains secteurs sensibles. Les chiens sont admis mais impérativement tenus en laisse.
      Pénétrer dans la zone frontière sans permis délivré est strictement prohibé, même d'un seul pas. La
      couverture mobile est correcte mais présente de nombreuses zones blanches en fond de vallée. En mars et
      avril, les cabanes ouvertes sont souvent complètes : réservez un refuge payant ou emportez une tente
      robuste.
    around: >-
      Le [Parc national de Sarek](/lugar/sarek-national-park/) partage avec Urho Kekkonen les grands reliefs,
      le glouton, l'élan et l'ours brun. Le [Parc national de Gutulia](/lugar/gutulia-national-park/) partage
      la taïga primaire, les tourbières, l'élan, le mésangeai et le pic tridactyle, tandis que le [Parc
      national de Stabbursdalen](/lugar/stabbursdalen-national-park/) partage l'élan, le mésangeai et l'ours
      brun. Le [Parc national de Hossa](/lugar/hossan-kansallispuisto/) partage le glouton, le renne et le
      loup.
  de:
    intro: >-
      Das waldreiche Lappland fände fast vollständig in diesem einen Schutzgebiet Platz. Der 1983 gegründete
      Urho-Kekkonen-Nationalpark umfasst 2.550 km² in den Gemeinden Savukoski, Sodankylä und Inari; er ist der
      zweitgrößte Nationalpark Finnlands und der am zweithäufigsten besuchte. Üppige Vegetation sucht man hier
      vergebens: Endlose, nahezu unberührte Kiefern- und Fichtenurwälder dehnen sich neben weiten Mooren aus,
      geteilt von einer Fjellkette, die das Gebiet von Ost nach West durchzieht. Ein Raum für alle, die tiefe
      Einsamkeit und lange Distanzen schätzen.
    landscape: >-
      Ein Schutzgebiet dieser Dimension besitzt ein prägendes Rückgrat: den von Ost nach West verlaufenden
      Fjellrücken. Diese Höhenzone fungiert als Wasserscheide: Nach Süden entwässern Luirojoki, Kopsusjoki und
      Repojoki über den Kemijoki zur Ostsee, während nach Norden und Osten der Suomujoki, der Luttojoki und
      weitere Gewässer ins Nordpolarmeer münden. Der Sokosti ragt mit 718 Metern als höchster Gipfel empor,
      gefolgt vom Ukselmapää mit 698 und dem Vuomapää mit 689. Jedes Fjellmassiv erzählt eine karge
      eiszeitliche Geschichte.


      Weiter unten herrscht der Wald. Den größten Teil des Parks bedecken Kiefernwälder auf sandigen
      Eskerrücken, überwiegend unberührter Primärwald. Der geschlossene Fichtengürtel Ostlapplands reicht bis
      in die Region Vongoiva-Sokosti-Lupukkapää. An den Hängen bildet die Fjällbirke die Waldgrenze; auf
      windigen Höhen, wo Kiefern und Fichten kaum gedeihen, wächst sie zu dichten Krummholzzonen heran, durch
      die du dir mühsam einen Pfad bahnen musst. Die meisten Fjällbirkenwälder Finnlands liegen in diesem
      Park. Noch höher, auf den nackten Fjellkuppen, trotzen nur Zwergsträucher, Sauergräser und Alpen-Bärlapp
      dem Frost.


      Nach den Wäldern nehmen Moore und Feuchtgebiete den größten Raum ein, darunter weite Aapamoore im Süden.
      Bis zu dreißig Torfmoosarten wurden hier nachgewiesen. Das Posoaapa, rund 16 km lang und 7.000 Hektar
      groß, war einst Finnlands bedeutendstes Aapamoor, ehe es fast ganz im Lokka-Stausee versank. Das
      nährstoffarme Festgestein begrenzt die Artenvielfalt, und das raue Kontinentalklima erfährt keinerlei
      ausgleichenden Einfluss durch das Meer.
    wildlife: >-
      Über zwanzig Säugetierarten leben im Parkgebiet. Zu den großen Raubtieren zählen
      [Braunbär](/especie/ursus_arctos/), [Vielfraß](/especie/gulo_gulo/), [Wolf](/especie/canis_lupus/) und
      [Eurasischer Luchs](/especie/lynx_lynx/), für die das Reservat ein wichtiges Refugium darstellt.
      Deutlich häufiger begegnest du halbwilden [Rentieren](/especie/rangifer_tarandus/), Schneehasen,
      [Elchen](/especie/alces_alces/) oder Rotfüchsen. Entlang der Fließgewässer kannst du nach dem
      [Fischotter](/especie/lutra_lutra/) oder seinen Fährten Ausschau halten; mancherorts überlebt die
      gefährdete [Flussperlmuschel](/especie/margaritifera_margaritifera/).


      Der [Steinadler](/especie/aquila_chrysaetos/) ist das Wappentier des Parks: Elf Reviere sind hier
      besetzt, bei landesweit geschätzten 362 bis 496 Brutpaaren. Der Park bietet über hundert Vogelarten
      Nistplätze. Im Urwald leben Unglückshäher, Lapplandmeise und
      [Dreizehenspecht](/especie/picoides_tridactylus/). Die Raupe der Tundra-Erdeule wächst in ihrem ersten
      Sommer fast vollständig heran, verwandelt sich aber erst im dritten Sommer nach zwei Überwinterungen in
      den Falter; daher tritt die Art an einem Standort nur alle zwei Jahre auf.


      Das Jahr gliedert sich in zwei Hauptsaisonen: Skilanglauf im März und April sowie Wandern im Sommer und
      Herbst. Wintertouren erfordern großes Geschick: Die Temperaturen können bis auf minus 40 Grad fallen,
      bei nur zwei Stunden Dämmerlicht um die Wintersonnenwende.
    visit: >-
      Die meisten Touren starten am Fjellzentrum Kiilopää, am See Aittajärvi am Suomujoki oder in
      Raja-Jooseppi; viele Wanderer steuern die Hänge des Sokosti an. Ausgeschilderte Pfade im Westen gelingen
      auch Einsteigern; das wilde Hinterland eignet sich für lange, anspruchsvolle Trekkingrouten. Viele
      Rucksackwanderer übernachten in den Wildnishütten am See Luirojärvi zu Füßen des Sokosti.


      Wer einen sanften Einstieg sucht, wählt den Naturlehrpfad Kiirunapolku rund um den Kiilopää, dessen
      Schautafeln Pflanzen, Vögel und Lebensräume erläutern. Radfahren im Sommer ist ausschließlich auf
      freigegebenen Wegen erlaubt, etwa auf der Trasse von Kakslauttanen zum Kopsusjärvi; im Winter kannst du
      mit dem Fatbike abseits gespurter Loipen fahren.
    history: >-
      Die Rentierwirtschaft mit ihren althergebrachten Traditionen sichert bis heute die Existenzgrundlage der
      einheimischen Bevölkerung. Rund 80 % der Parkfläche liegen im Siedlungsgebiet der Samen; ihre heiligen
      Stätten (*Seitas*) verlangen respektvollen Umgang. Die Rentierhaltung hinterließ Fanggruben für
      Wildrentiere, Zäune, historische Blockhütten und restaurierte Siedlungsreste der Skoltsamen.


      Der Nationalpark bildet zusammen mit fünf angrenzenden Arealen ein zusammenhängendes Natura 2000-Gebiet.
    before: >-
      In der Erholungszone sind Lagerfeuer ausschließlich an den auf Karten verzeichneten Feuerstellen mit
      bereitgestelltem Holz gestattet; im abgelegenen Wildnisgebiet darfst du herabgefallene Äste nutzen,
      ausgenommen in Sonderzonen. Hunde dürfen mitgeführt werden, müssen jedoch ausnahmslos an der Leine
      bleiben. Der Grenzstreifen darf ohne Genehmigung keinesfalls betreten werden, nicht einmal für einen
      Schritt. Der Mobilfunkempfang ist meist solide, weist in tiefen Tälern aber Funklöcher auf. Im März und
      April sind offene Hütten oft belegt: Reserviere vorab eine Miethütte oder führe ein Zelt mit.
    around: >-
      Der [Nationalpark Sarek](/lugar/sarek-national-park/) teilt Hochgebirgsnatur, Vielfraß, Elch und
      Braunbär mit Urho Kekkonen. Der [Nationalpark Gutulia](/lugar/gutulia-national-park/) teilt Urwälder,
      Moore, Elche, Unglückshäher und Dreizehenspechte, der [Nationalpark
      Stabbursdalen](/lugar/stabbursdalen-national-park/) Elche, Unglückshäher und Braunbären. Der
      [Nationalpark Hossa](/lugar/hossan-kansallispuisto/) teilt Vielfraß, Rentier und Wolf.
  it:
    intro: >-
      La Lapponia delle grandi foreste potrebbe quasi entrare per intero in quest'unico parco. Istituito nel
      1983, Urho Kekkonen copre 2.550 km² tra i comuni di Savukoski, Sodankylä e Inari, confermandosi il
      secondo parco nazionale più vasto della Finlandia e il secondo più visitato. La vegetazione
      lussureggiante è qui sconosciuta: boschi sterminati e quasi intatti di pino e abete rosso si affiancano
      a torbiere sconfinate, solcati da est a ovest da una catena di fells. È uno spazio ideale per chi cerca
      solitudine autentica e lunghe distanze.
    landscape: >-
      Un parco di questa scala ha una sua spina dorsale: la serie di rilievi che lo taglia da est a ovest.
      Questa fascia montuosa fa da spartiacque: verso sud nascono Luirojoki, Kopsusjoki e Repojoki, che
      defluiscono nel Baltico attraverso il Kemijoki, mentre a nord e a est il Suomujoki, il Luttojoki e altri
      fiumi raggiungono il mar Glaciale Artico. Il Sokosti è la cima più elevata con 718 metri, seguito da
      Ukselmapää a quota 698 e Vuomapää a 689. Ogni paesaggio di fell testimonia la severa impronta dell'era
      glaciale.


      Più in basso domina la foresta. La maggior parte del parco è coperta da pinete radicate sulle sabbie dei
      cordoni morenici esker, in gran parte boschi vetusti primari. La fascia continua di abeti rossi della
      Lapponia orientale giunge fino al settore Vongoiva-Sokosti-Lupukkapää. Sui versanti, il limite della
      vegetazione arborea è segnato dalla betulla di montagna; sulle alture dove pini e abeti faticano a
      resistere forma boscaglie fitte attraverso cui devi farti strada a forza; gran parte dei boschi di
      betulla montana finlandesi cresce qui. Più in alto ancora, sulle creste spazzate dal vento, resistono
      soltanto arbusti nani, ciperacee e licopodio alpino.


      Dopo le foreste, torbiere e zone umide ricoprono l'estensione maggiore, con ampie paludi aapa a sud. Vi
      si possono contare fino a trenta specie di sfagni. Posoaapa, estesa per circa 16 km e 7.000 ettari, era
      la più grande torbiera aapa della Finlandia prima di essere sommersa dal bacino artificiale di Lokka. Il
      basamento roccioso povero di nutrienti limita le varietà floristiche, e il clima continentale impone
      sbalzi termici che il mare non attenua.
    wildlife: >-
      Oltre venti specie di mammiferi vivono nel parco. Tra i grandi carnivori figurano l'[orso
      bruno](/especie/ursus_arctos/), il [ghiottone](/especie/gulo_gulo/), il [lupo
      grigio](/especie/canis_lupus/) e la [lince boreale](/especie/lynx_lynx/), protetti in questo santuario
      naturale. È ben più frequente avvistare [renne](/especie/rangifer_tarandus/), lepri variabili,
      [alci](/especie/alces_alces/) e volpi rosse. Presso i corsi d'acqua cerca la [lontra
      europea](/especie/lutra_lutra/) o le sue tracce, e in alcuni torrenti vive la rara [cozza perlifera
      d'acqua dolce](/especie/margaritifera_margaritifera/).


      L'[aquila reale](/especie/aquila_chrysaetos/) è il simbolo ufficiale del parco: vi si contano undici
      territori, su una stima nazionale tra 362 e 496 coppie nidificanti. Il parco ospita oltre cento specie
      di volatili. La vecchia taiga custodisce la ghiandaia siberiana, la cincia siberiana e il [picchio
      tridattilo](/especie/picoides_tridactylus/). La larva della nottua della taiga compie gran parte della
      crescita nella prima estate ma raggiunge lo stadio adulto solo alla terza estate dopo due svernamenti;
      per questo l'insetto adulto compare nello stesso sito ogni due anni.


      L'anno presenta due stagioni culminanti: lo sci nordico a marzo e aprile, e l'escursionismo in estate e
      autunno. In inverno le traversate richiedono grande prudenza: il termometro può scendere fino a meno 40
      gradi con appena due ore di luce crepuscolare nel cuore dell'inverno.
    visit: >-
      La maggior parte delle escursioni parte dal centro visite di Kiilopää, dal lago Aittajärvi lungo il
      Suomujoki o da Raja-Jooseppi, e molti trekker puntano alla base del Sokosti. I tracciati segnati a ovest
      sono accessibili anche ai principianti; l'entroterra selvaggio richiede autonomia per traversate
      impegnative. Molti escursionisti pernottano nei rifugi liberi sulle sponde del lago Luirojärvi ai piedi
      del Sokosti.


      Se cerchi un approccio più rilassato, il sentiero Kiirunapolku compie un anello attorno al Kiilopää con
      pannelli didattici su piante, uccelli e animali del fell. In bicicletta, d'estate si può pedalare solo
      sui percorsi autorizzati, come il collegamento tra Kakslauttanen e Kopsusjärvi; in inverno puoi muoverti
      in fatbike fuori dalle piste da sci battute.
    history: >-
      L'allevamento delle renne, con la sua antica cultura, rimane fonte primaria di sussistenza per gli
      abitanti locali. Circa l'80 % del territorio del parco rientra nella terra ancestrale dei sami; i loro
      *seidas* (luoghi sacri) esigono massimo rispetto. Il pastoralismo ha disseminato trappole per renne
      selvatiche, recinti, capanne di tronchi e insediamenti skolt sami restaurati.


      Il parco forma assieme ad altre cinque riserve adiacenti un'unica grande area Natura 2000.
    before: >-
      Nella zona ricreativa i fuochi sono permessi solo nei punti fuoco indicati sulle mappe, con la legna
      fornita; nell'area selvaggia remota puoi accendere il fuoco con rami secchi a terra, tranne in settori
      speciali. I cani sono ammessi ma rigorosamente al guinzaglio. È vietato varcare la fascia di confine
      senza permesso specifico, anche per un solo passo. La copertura telefonica è buona ma presenta zone
      d'ombra nelle valli. A marzo e aprile i rifugi aperti sono spesso affollati: prenota un rifugio
      custodito o porta una tenda resistente.
    around: >-
      Il [Parco nazionale di Sarek](/lugar/sarek-national-park/) condivide con Urho Kekkonen l'alta montagna,
      il ghiottone, l'alce e l'orso bruno. Il [Parco nazionale di Gutulia](/lugar/gutulia-national-park/)
      condivide la taiga vergine, le paludi, l'alce, la ghiandaia siberiana e il picchio tridattilo, mentre il
      [Parco nazionale di Stabbursdalen](/lugar/stabbursdalen-national-park/) condivide l'alce, la ghiandaia e
      l'orso bruno. Il [Parco nazionale di Hossa](/lugar/hossan-kansallispuisto/) condivide il ghiottone, la
      renna e il lupo.
  pt:
    intro: >-
      A Lapónia florestal quase caberia inteira dentro deste único parque. Criado em 1983, Urho Kekkonen
      estende-se por 2.550 km² entre os municípios de Savukoski, Sodankylä e Inari, sendo o segundo maior
      parque nacional da Finlândia e o segundo mais visitado. A vegetação luxuriante é aqui inexistente:
      imensas florestas quase virgens de pinheiro e espruce ladeiam turfeiras infindáveis, recortadas de leste
      a oeste por uma cordilheira de fells. É um lugar talhado para quem procura solidão profunda e longas
      distâncias.
    landscape: >-
      Um parque desta envergadura estrutura-se em redor de um eixo principal: a sucessão de fells que o
      atravessa de leste a oeste. Este relevo separa as águas: para sul nascem o Luirojoki, o Kopsusjoki e o
      Repojoki, que descem para o Báltico através do Kemijoki, enquanto a norte e a leste o Suomujoki, o
      Luttojoki e outros desaguam no oceano Ártico. O Sokosti é o cume mais elevado, com 718 metros; seguem-se
      o Ukselmapää, com 698, e o Vuomapää, com 689. Cada paisagem de fell relata a história austera dos tempos
      glaciares.


      Mais abaixo reina a floresta. A maior parte do parque é pinhal assente nas areias de cristas de eskers,
      em grande medida bosque primitivo intocado. A mancha contínua de espruces da Lapónia oriental alcança a
      zona de Vongoiva-Sokosti-Lupukkapää. Nas encostas, o limite arbóreo é traçado pela bétula-das-montanhas;
      nos topos onde pinheiros e espruces mal sobrevivem, forma matagais densos pelos quais tens de abrir
      caminho; a maior parte dos bosques de bétula-das-montanhas da Finlândia fica neste parque. Mais acima
      ainda, nos cumes batidos pelo vento, apenas sobrevivem arbustos anões, ciperáceas e licopódio-alpino.


      Depois das florestas, são as turfeiras e zonas húmidas que mais cobrem o parque, com vastas turfeiras
      aapa a sul. Podem encontrar-se nelas até trinta espécies de esfagno. Posoaapa, com cerca de 16 km de
      comprimento e 7.000 hectares, era a maior turfeira aapa da Finlândia antes de ficar quase toda submersa
      pela albufeira de Lokka. O substrato rochoso é muito pobre em nutrientes, limitando a diversidade
      vegetal, e o clima continental impõe amplitudes térmicas sem a moderação do mar.
    wildlife: >-
      Mais de vinte espécies de mamíferos povoam o parque. Entre os grandes carnívoros contam-se o
      [urso-pardo](/especie/ursus_arctos/), o [glutão](/especie/gulo_gulo/), o
      [lobo-cinzento](/especie/canis_lupus/) e o [lince-euroasiático](/especie/lynx_lynx/), acolhidos neste
      refúgio onde são espécies rigorosamente protegidas. É bem mais provável cruzares-te com
      [renas](/especie/rangifer_tarandus/), lebres-árcticas, [alces](/especie/alces_alces/) e raposas. Ao
      longo dos cursos de água procura a [lontra-europeia](/especie/lutra_lutra/) ou os seus rastos, e em
      certos rios vive a ameaçada [náiade perlífera](/especie/margaritifera_margaritifera/).


      A [águia-real](/especie/aquila_chrysaetos/) é o símbolo oficial do parque: existem aqui onze
      territórios, num total finlandês estimado entre 362 e 496 casais reprodutores. O parque acolhe locais de
      nidificação para mais de cem espécies de aves. A taiga antiga abriga o gaio-siberiano, o chapim-lapónico
      e o [pica-pau-tridáctilo](/especie/picoides_tridactylus/). A lagarta da traça-da-taiga cresce quase na
      totalidade no primeiro verão, mas só atinge o estado adulto no terceiro verão, após hibernar dois
      invernos; por isso a traça adulta surge no mesmo local apenas a cada dois anos.


      O ano divide-se em duas épocas marcantes: a de esqui em março e abril, e a de caminhadas no verão e
      outono. No inverno, as travessias exigem experiência séria: as temperaturas descem até menos 40 graus
      com apenas duas horas de crepúsculo no pico do inverno.
    visit: >-
      A maioria das excursões parte do centro de Kiilopää, do lago Aittajärvi junto ao Suomujoki ou de
      Raja-Jooseppi, e muitos caminhantes rumam à base do Sokosti. Os trilhos assinalados a oeste são
      acessíveis mesmo a quem tem pouca experiência; o interior bravio presta-se a longas travessias em
      autonomia. Muitos pedestrianistas pernoitam nos abrigos de montanha construídos junto ao lago
      Luirojärvi, aos pés do Sokosti.


      Se preferes uma introdução suave, o trilho Kiirunapolku circunda o monte Kiilopää e os seus painéis
      explicam a natureza austera do fell, com as suas plantas, aves e outros animais. Em bicicleta, no verão
      só é permitido pedalar em trilhos autorizados, como a ligação de Kakslauttanen a Kopsusjärvi; no inverno
      podes pedalar em fatbike fora das pistas de esqui preparadas.
    history: >-
      O pastoreio de renas, com a sua cultura e tradições seculares, permanece um meio de subsistência fulcral
      para as comunidades locais. Cerca de 80 % da área do parque insere-se no território tradicional dos
      samis; as suas pedras sagradas (*seidas*) exigem absoluto respeito. O pastoreio deixou no terreno
      armadilhas para renas selvagens, vedações, cabanas de madeira e antigos povoamentos samis skolts
      recuperados.


      O parque constitui, juntamente com cinco áreas protegidas contíguas, um único sítio Natura 2000.
    before: >-
      Na zona recreativa só são permitidas fogueiras nos locais assinalados nos mapas, com a lenha
      disponibilizada; na zona remota podes usar ramos caídos no chão, exceto em zonas delimitadas. Os cães
      podem entrar mas têm de permanecer sempre presos por trela. É terminantemente proibido entrar na faixa
      de fronteira sem autorização formal, nem que seja por um único passo. A cobertura de telemóvel é
      razoável mas tem zonas sem sinal nos vales profundos. Em março e abril os abrigos abertos enchem com
      frequência: reserva uma cabana paga ou leva tenda resistente.
    around: >-
      O [Parque Nacional de Sarek](/lugar/sarek-national-park/) partilha com Urho Kekkonen a alta montanha, o
      glutão, o alce e o urso-pardo. O [Parque Nacional de Gutulia](/lugar/gutulia-national-park/) partilha a
      taiga virgem, as turfeiras, o alce, o gaio-siberiano e o pica-pau-tridáctilo, e o [Parque Nacional de
      Stabbursdalen](/lugar/stabbursdalen-national-park/) o alce, o gaio-siberiano e o urso-pardo. O [Parque
      Nacional de Hossa](/lugar/hossan-kansallispuisto/) partilha o glutão, a rena e o lobo.
