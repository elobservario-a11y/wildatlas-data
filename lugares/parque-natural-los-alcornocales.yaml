resumen:
  es: >-
    El mayor alcornocal continuo de la península ibérica (170.000 ha) y las gargantas húmedas (*canutos*) que
    albergan relictos de la flora laurisilva terciaria.
  en: >-
    The largest continuous cork oak forest on the Iberian Peninsula (170,000 ha) and humid ravines (*canutos*)
    preserving relict Tertiary laurel forest flora.
  fr: >-
    La plus vaste subéraie d’un seul tenant de la péninsule Ibérique (170 000 ha) et les gorges humides
    (*canutos*) abritant des reliques de la laurisylve tertiaire.
  de: >-
    Der größte zusammenhängende Korkeichenwald der Iberischen Halbinsel (170.000 ha) mit feuchten Schluchten
    (*Canutos*), die Relikte des tertiären Lorbeerwaldes bergen.
  it: >-
    La più vasta sughereta continua della penisola iberica (170.000 ha) e le gole umide (*canutos*) che
    accolgono relitti della laurisilva terziaria.
  pt: >-
    O maior montado de sobreiros contínuo da Península Ibérica (170.000 ha) e as gargantas húmidas (*canutos*)
    que abrigam relíquias da laurissilva terciária.
unico:
  es: >-
    Aquí, a pocos kilómetros del estrecho de Gibraltar, el mayor alcornocal de la península convive con una
    laurisilva de la Era Terciaria que no tiene igual en la Europa continental.
  en: >-
    A short distance from the Strait of Gibraltar, mainland Europe’s grandest cork oak woodland shelters a
    Tertiary rainforest valley found nowhere else on the continent.
  fr: >-
    À deux pas du détroit de Gibraltar, la plus grande forêt de chênes-lièges d’Europe abrite une laurisylve
    de l’ère tertiaire sans équivalent sur le continent.
  de: >-
    Wenige Kilometer von der Straße von Gibraltar entfernt bildet Europas größter Korkeichenwald die Kulisse
    für einen subtropischen Tertiär-Nebelschluchtwald, der auf dem Festland einzigartig ist.
  it: >-
    A pochi chilometri dallo stretto di Gibilterra, la più grande foresta di querce da sughero d’Europa
    custodisce una laurisilva dell’era terziaria unica sul continente.
  pt: >-
    A curta distância do estreito de Gibraltar, o maior sobreiral da Europa alberga vales de laurissilva da
    Era Terciária sem paralelo no continente.
observaciones:
  es: >-
    Colabora para evitar incendios: no arrojes cigarrillos ni nada que produzca combustión. Lleva contigo la
    basura hasta el contenedor más próximo, respeta el silencio y los bienes y propiedades privadas.
texto:
  es:
    intro: >-
      Hay un valle en el sur de Europa donde se camina entre laureles, rododendros y helechos como si el mapa
      se hubiera equivocado de latitud. No es un invernadero: es un canuto, un valle estrecho y profundo del
      Parque Natural Los Alcornocales, en la provincia de Cádiz y el norte de Málaga. Aquí la humedad que sube
      de la costa se acumula en forma de niebla, y bajo esa niebla sobrevive una flora de la Era Terciaria.
      Alrededor, el alcornocal cubre las sierras como el mayor y mejor conservado de la península ibérica.
    landscape: >-
      Casi todo el parque, más del 90 % de su superficie, descansa sobre la Unidad del Aljibe: areniscas y
      arcillas de origen marino que han dado sierras abruptas, de pendientes acusadas, con el pico del Aljibe
      (1092 m) como cota máxima. El suelo de arenisca es la clave: favorece el alcornocal denso y, en las
      zonas más húmedas, deja sitio a quejigos y robles andaluces.


      La lluvia hace el resto. Los frentes oceánicos barren el parque de oeste a este en otoño, invierno y
      primavera, y las lluvias anuales superan los 800 litros por metro cuadrado y llegan a pasar de 1400 en
      algunas zonas. En las sierras del sur, además, las nieblas veraniegas llamadas barbas del levante
      aportan humedad en la larga estación seca. De ese clima, parecido al subtropical, viene el apodo del
      parque: la última selva mediterránea.


      Esa humedad se concentra en los canutos. En el fondo de esos valles estrechos, las hojas lisas y
      brillantes de la laurisilva aprovechan la poca luz que dejan pasar los árboles de los bordes: laurel,
      rododendro, avellanillo, durillo, aliso, acebo y, entre ellos, el ojaranzo en flor. Es un bosque de
      galería de tipo subtropical, único en la Europa continental, y una flora de la Era Terciaria.


      Subes de nivel y todo cambia. En las alturas, donde las rocas asoman, el suelo es pobre y rico en
      metales como el aluminio, y sobre él crece la herriza, un matorral denso y achaparrado. En las laderas
      hay matorral mediterráneo con jaras, brezos y cantuesos.
    wildlife: >-
      El parque está en el extremo más meridional de Europa, así que es paso obligado de millones de aves
      migratorias hacia y desde África. Lo que se ve pasar son sobre todo planeadoras: cigüeñas, milanos,
      halcón abejero, águila calzada y culebrera, buitres y alimoches, que recuperan energías en el parque o
      esperan buen tiempo para cruzar el estrecho.


      Entre residentes, en los bosquetes de roble cazan águilas calzadas, culebreras y ratoneras, además de
      azores, gavilanes y cárabos. En los roquedos hay [buitre leonado](/especie/gyps_fulvus/), alimoche,
      [águila perdicera](/especie/aquila_fasciata/), [búho real](/especie/bubo_bubo/) y [halcón
      peregrino](/especie/falco_peregrinus/). Y en los canutos, entre los helechos, suenan el [mirlo
      acuático](/especie/cinclus_cinclus/) y el [martín pescador](/especie/alcedo_atthis/).


      Los mamíferos tienen aquí algunas rarezas. Se conservan las mayores poblaciones europeas de meloncillo,
      una mangosta, y se pueden ver ginetas, nutrias, tejones y garduñas. Estas sierras albergan además la
      última población de corzo andaluz de la raza morisca, en el límite suroccidental de la distribución
      mundial de la especie. En los arroyos hay libélulas en peligro de extinción, y se ha citado la araña
      negra de los alcornocales.
    visit: >-
      Empieza por El Aljibe, el centro de visitantes a las afueras de Alcalá de los Gazules. Su jardín
      botánico enseña la flora singular del parque y el ojaranzo, superviviente de épocas pasadas. Un
      itinerario interior recorre los canutos, quejigares, alcornocales, robledales y bosques de niebla, y
      cada formación se asocia a un sustrato geológico distinto. También se interpretan las especies
      amenazadas y los trabajos para conservarlas.


      Para caminar, la Garganta del Capitán lleva entre alcornoques hasta tumbas de la Edad del Bronce; la
      ruta de la Laguna del Moral cruza un bosque rico en aves, y el sendero Río Hozgarganta pasa junto a
      rocas suavizadas por el agua y restos de una antigua fábrica de artillería. Para los montañeros, la cota
      máxima es el pico del Aljibe. Cierra la jornada con un paseo por pueblos como Jimena de la Frontera,
      Alcalá de los Gazules o Castellar de la Frontera.
    history: >-
      El parque se declaró en 1989. Los pueblos altos llegaron a su apogeo con el reino nazarí, cuando eran la
      frontera occidental del Reino de Granada, y aún conservan rasgos andalusíes. Mucho antes, el hombre ya
      pintaba aquí: hay más de medio centenar de cuevas con arte rupestre. La del Tajo de las Figuras se
      considera la capilla sixtina del arte rupestre esquemático; la de Bacinete guarda más de un centenar de
      representaciones en magnífico estado, y la de la Laja Alta, un catálogo de las primeras embarcaciones
      del Mediterráneo.


      El alcornocal sigue siendo un monte productivo: lo más destacable del parque es su producción de corcho.
      Pero la seca afecta a esa producción, y en 2017 se aprobó un plan de gestión integral para
      compatibilizar el parque con las actividades humanas. Entre las amenazas figuran los tendidos
      eléctricos, los parques eólicos, las autovías, las presas y el cambio climático.
    before: >-
      Colabora para evitar incendios: no arrojes cigarrillos ni nada que produzca combustión. Lleva contigo la
      basura hasta el contenedor más próximo, respeta el silencio y los bienes y propiedades privadas.
    around: >-
      A veintinueve kilómetros está el [Parque Nacional de la Sierra de las
      Nieves](/lugar/parque-nacional-sierra-de-las-nieves/). Lejos de aquí, comparten bosque mediterráneo
      maduro y especies como el buitre negro y la cigüeña negra el [Parque Nacional de
      Cabañeros](/lugar/parque-nacional-de-cabaneros/), el [Parque Nacional de
      Monfragüe](/lugar/parque-nacional-de-monfrague/) y la [Reserva Natural de la Sierra de
      Malcata](/lugar/reserva-natural-da-serra-da-malcata/).
  en:
    intro: >-
      There is a hidden valley in southern Europe where you walk among laurels, rhododendrons and giant ferns
      as if geography had slipped into the subtropics. This is no greenhouse: it is a *canuto*, a deep
      sandstone gorge in Los Alcornocales Natural Park, spanning the province of Cádiz and northern Málaga.
      Here, maritime moisture sweeping off the Atlantic condenses into persistent fog, sheltering a relict
      laurel forest dating from the Tertiary Period. Surrounding these gorges, majestic cork oak woodlands
      stretch across the mountains as the largest and best-preserved cork forest on the Iberian Peninsula.
    landscape: >-
      Over 90 % of the park rests upon the Aljibe Sandstone Formation: marine sands and clays creating rugged
      ridges and sheer slopes culminating at Pico del Aljibe (1092 m). This acidic, nutrient-poor sandstone is
      key, fostering dense cork oak forests alongside Portuguese and Algerian oaks in moisture-rich swales.


      Abundant rainfall shapes the environment. Atlantic weather fronts sweep eastward across the sierra from
      autumn through spring, delivering annual precipitation surpassing 800 litres per square metre and
      exceeding 1400 litres in summit basins. In southern ranges, summer sea mists known as *barbas del
      levante* condense along ridges during the dry season, earning the park its title as Europe's last
      Mediterranean rainforest.


      Moisture concentrates within the steep *canutos*. In these narrow canyon bottoms, evergreen
      laurophyllous foliage captures filtered sunlight beneath the canopy: bay laurel, pontic rhododendron
      (*ojaranzo*), alder buckthorn, viburnum, alder and holly thrive alongside rare flowering shrubs. It is a
      subtropical gallery forest unique in continental Europe.


      Climbing higher, the landscape transforms. Windswept rocky crests support nutrient-poor soils rich in
      aluminum, dominated by low ericaceous heathland known locally as *herriza*. Mid-slopes feature classic
      Mediterranean scrub of cistus, tree heather and lavender.
    wildlife: >-
      Occupying the southernmost tip of continental Europe, the park forms a crucial bottleneck for millions
      of migratory birds travelling between Europe and Africa. Autumn and spring bring vast thermals of
      gliding migrants: white and black storks, black kites, honey buzzards, booted eagles, short-toed snake
      eagles, griffon vultures and Egyptian vultures resting before the sea crossing.


      Resident raptors breed extensively in oak woodlands, including booted eagles, short-toed eagles, common
      buzzards, goshawks, sparrowhawks and tawny owls. Towering crags host the [griffon
      vulture](/especie/gyps_fulvus/), Egyptian vulture, [Bonelli's eagle](/especie/aquila_fasciata/),
      [Eurasian eagle-owl](/especie/bubo_bubo/) and [peregrine falcon](/especie/falco_peregrinus/). Along
      rushing canuto streams, the [white-throated dipper](/especie/cinclus_cinclus/) and [common
      kingfisher](/especie/alcedo_atthis/) hunt amongst royal ferns.


      Mammals include noteworthy southern specialities. The park harbours Europe’s densest populations of the
      Egyptian mongoose (*meloncillo*), alongside common genets, Eurasian otters, European badgers and stone
      martens. The surrounding sierras preserve the last indigenous herd of the Moorish roe deer, marking the
      southwestern global limit of the species. Clean headwaters sustain endangered dragonflies and the
      endemic Alcornocales funnel-web spider.
    visit: >-
      Begin at El Aljibe Visitor Centre on the outskirts of Alcalá de los Gazules. Its ethnobotanical garden
      showcases endemic flora including the rare *ojaranzo*. An interpretive trail guides visitors through
      canuto galleries, cork oak groves and cloud forest ecosystems linked to diverse geological beds.


      For hiking, the Garganta del Capitán trail leads through ancient cork oaks to Bronze Age rock tombs; the
      Laguna del Moral path winds through rich bird habitats, and the Río Hozgarganta trail traces polished
      river rocks past the historic ruins of an eighteenth-century royal artillery foundry. Mountaineers can
      ascend Pico del Aljibe. Complete your visit exploring historic white hill towns such as Jimena de la
      Frontera, Alcalá de los Gazules and Castellar de la Frontera.
    history: >-
      Los Alcornocales was declared a natural park in 1989. Its fortified white villages flourished under the
      Nasrid Kingdom of Granada as frontier outposts, retaining their Moorish architectural character.
      Prehistoric communities settled these mountains millennia earlier, leaving rock art in over fifty
      sandstone caves. The cave of Tajo de las Figuras is hailed as the prehistoric Sistine Chapel of
      schematic art; Bacinete preserves over a hundred well-conserved pictographs, and Laja Alta depicts some
      of the earliest maritime sailing vessels known in the Mediterranean.


      Cork extraction remains the economic backbone of the territory. However, oak decline syndrome (*la
      seca*) threatens forest health, prompting a comprehensive management plan approved in 2017 to reconcile
      traditional forestry with conservation. Modern pressures include high-voltage power lines, wind farms,
      transport corridors, reservoirs and climate shifts.
    before: >-
      Exercise extreme care with fire hazards; never discard matches, lit objects or smoking materials. Carry
      all waste out to the nearest municipal container, respect wildlife and local tranquil atmospheres, and
      heed private property boundaries.
    around: >-
      Twenty-nine kilometres away lies [Sierra de las Nieves National
      Park](/lugar/parque-nacional-sierra-de-las-nieves/). Further afield, mature Mediterranean woodlands and
      rare raptors are shared with [Cabañeros National Park](/lugar/parque-nacional-de-cabaneros/), [Monfragüe
      National Park](/lugar/parque-nacional-de-monfrague/) and [Serra da Malcata Nature
      Reserve](/lugar/reserva-natural-da-serra-da-malcata/).
  fr:
    intro: >-
      Il existe dans le sud de l'Europe une vallée où l'on chemine entre lauriers, rhododendrons et fougères
      arborescentes comme si la géographie s'était trompée de latitude. Ce n'est pas une serre : c'est un
      *canuto*, gorge étroite et ombragée du parc naturel Los Alcornocales, à cheval sur la province de Cadix
      et le nord de Malaga. Ici, les brumes atlantiques se condensent en brouillards persistants sous lesquels
      survit une flore relique de l'ère tertiaire. Tout autour, la subéraie s'étend à perte de vue, formant la
      forêt de chênes-lièges la plus vaste et la mieux préservée de la péninsule Ibérique.
    landscape: >-
      Plus de 90 % de la superficie du parc repose sur l'unité géologique de l'Aljibe : des grès et argiles
      marins qui ont façonné des reliefs escarpés culminant au pic de l'Aljibe (1092 m). Ces sols siliceux et
      acides sont déterminants : ils favorisent une subéraie dense, relayée dans les fonds humides par les
      chênes zéens et les chênes d'Andalousie.


      Les précipitations abondantes font le reste. Les dépressions océaniques balayent les reliefs d'ouest en
      est de l'automne au printemps, avec des pluies annuelles dépassant 800 litres par mètre carré et
      franchissant 1400 litres sur les crêtes les plus arrosées. En été, les brouillards côtiers appelés
      *barbas del levante* apportent une humidité précieuse en pleine saison sèche, conférant au massif son
      statut de dernière forêt tropicale méditerranéenne d'Europe.


      Cette humidité se concentre au fond des *canutos*. Dans ces gorges ombragées, le feuillage vernissé de
      la laurisylve capte le peu de lumière disponible : laurier noble, rhododendron pontique (*ojaranzo*),
      bourdaine, viorne tin, aulne et houx composent une ripisylve d'affinité subtropicale unique en Europe
      continentale.


      En prenant de la hauteur, le paysage change radicalement. Sur les crêtes rocheuses aux sols lessivés
      riches en métaux croît l’*herriza*, une lande rase à bruyères, tandis que les versants portent un maquis
      de cistes et de lavandes.
    wildlife: >-
      Situé à l'extrémité méridionale de l'Europe, le parc constitue un passage obligé pour des millions
      d'oiseaux migrateurs entre l'Europe et l'Afrique. Cigognes, milans, bondrées apivores, aigles bottés,
      circaètes, vautours fauves et percnoptères profitent des ascendances thermiques ou attendent une météo
      clémente pour franchir le détroit.


      Parmi les espèces résidentes, les chênaies abritent l'aigle botté, le circaète Jean-le-Blanc, la buse
      variable, l'autour des palombes et la chouette hulotte. Les falaises hébergent le [vautour
      fauve](/especie/gyps_fulvus/), le percnoptère, l’[aigle de Bonelli](/especie/aquila_fasciata/), le
      [grand-duc d'Europe](/especie/bubo_bubo/) et le [faucon pèlerin](/especie/falco_peregrinus/). Dans les
      gorges humides chantent le [cincle plongeur](/especie/cinclus_cinclus/) et le [martin-pêcheur
      d'Europe](/especie/alcedo_atthis/).


      Les mammifères réservent de remarquables particularités : le parc abrite les plus denses populations
      européennes de mangouste ichneumon (*meloncillo*), ainsi que la genette, la loutre et la martre. Ces
      sierras accueillent en outre la dernière population de chevreuil andalou de race morisque, à la limite
      sud-occidentale mondiale de l'espèce. Les ruisseaux abritent des libellules protégées et une mygale
      endémique des subéraies.
    visit: >-
      Commencez par le centre de visiteurs El Aljibe, aux abords d'Alcalá de los Gazules. Son jardin botanique
      présente les raretés floristiques locales, dont le spectaculaire rhododendron *ojaranzo*. Un parcours
      thématique reconstitue canutos, chênaies et forêts de brouillard.


      Pour randonner, la Garganta del Capitán serpente sous les chênes-lièges jusqu'à des sépultures de l'âge
      du bronze ; le sentier de la Laguna del Moral traverse un sous-bois riche en passereaux, et le chemin du
      Río Hozgarganta longe des berges sculptées par les crues près d'une ancienne fonderie royale
      d'artillerie. Les randonneurs aguerris graviront le pic de l'Aljibe. Terminez par la découverte des
      villages fortifiés de Jimena de la Frontera, Alcalá de los Gazules ou Castellar de la Frontera.
    history: >-
      Le parc a été créé en 1989. Ses villages perchés connurent leur apogée sous le royaume nasride de
      Grenade, dont ils formaient la frontière occidentale. Bien avant, les populations préhistoriques ont
      orné plus d'une cinquantaine d'abris sous roche d'art rupestre. La grotte du Tajo de las Figuras est
      considérée comme la chapelle Sixtine de l'art schématique ibérique ; celle de Bacinete rassemble plus
      d'une centaine de peintures remarquables et la Laja Alta expose des représentations de navires
      méditerranéens archaïques.


      La subéraie demeure un espace sylvicole actif, le liège constituant la ressource maîtresse du parc. Face
      au dépérissement des chênes (*la seca*), un plan d'aménagement durable a été adopté en 2017. Les lignes
      électriques, parcs éoliens, infrastructures routières et le réchauffement climatique restent sous
      surveillance.
    before: >-
      Prévenez scrupuleusement les incendies : ne jetez aucun mégot ni matière incandescente. Rapportez tous
      vos déchets jusqu'aux conteneurs communaux, respectez le calme des lieux et la propriété privée.
    around: >-
      À vingt-neuf kilomètres s'étend le [parc national de la Sierra de las
      Nieves](/lugar/parque-nacional-sierra-de-las-nieves/). Plus loin, de vastes chênaies méditerranéennes et
      des espèces emblématiques comme la cigogne noire sont partagées avec le [parc national de
      Cabañeros](/lugar/parque-nacional-de-cabaneros/), le [parc national de
      Monfragüe](/lugar/parque-nacional-de-monfrague/) et la [réserve naturelle de la Serra da
      Malcata](/lugar/reserva-natural-da-serra-da-malcata/).
  de:
    intro: >-
      Im Süden Europas existiert ein verborgenes Tal, in dem man zwischen Lorbeerbäumen, Rhododendren und
      Riesenfarnen wandert, als befände man sich in den Subtropen. Es handelt sich um ein natürliches
      Refugium: ein *Canuto*, eine tief eingeschnittene Schlucht im Naturpark Los Alcornocales zwischen den
      Provinzen Cádiz und Málaga. Die vom Atlantik heranwehenden Wolken stauen sich hier zu dichtem Nebel,
      unter dem eine Pflanzenwelt aus dem Tertiär überdauert hat. Ringsum dehnen sich Korkeichenwälder über
      die Gebirgszüge aus – die größten und vitalsten der gesamten Iberischen Halbinsel.
    landscape: >-
      Mehr als 90 % des Naturparks lagern auf der Aljibe-Sandsteinformation: Meeresablagerungen aus Sandstein
      und Ton, die steile Gebirgsrücken geformt haben, deren höchster Punkt der Pico del Aljibe (1092 m) ist.
      Dieser saure Sandsteinboden begünstigt dichte Korkeichenbestände, die in feuchteren Lagen von
      Portugiesischen Eichen und Andalusischen Eichen abgelöst werden.


      Den entscheidenden Faktor bildet der Regen. Atlantische Tiefdruckgebiete überqueren das Gebirge von
      Herbst bis Frühling, wobei die jährlichen Niederschlagsmengen 800 Liter pro Quadratmeter übertreffen und
      in Kammlagen über 1400 Liter erreichen. Im Sommer bringen Seenebel namens *Barbas del Levante*
      Feuchtigkeit in der Trockenzeit, was dem Park den Ruf als letzter mediterraner Regenwald einbrachte.


      Diese Feuchtigkeit staut sich in den tiefen Schluchten, den *Canutos*. Auf deren Grund gedeiht die
      schattentolerante Lorbeerwaldflora: Echter Lorbeer, Pontischer Rhododendron (*Ojaranzo*), Faulbaum,
      Schneeball, Schwarzerle und Stechpalme. Ein solcher subtropischer Galeriewald ist auf dem europäischen
      Festland ohne Parallele.


      In größeren Höhen wandelt sich das Bild. Auf kargen, felsigen Graten wächst die *Herriza*, eine
      zwergwüchsige Heidelandschaft, während die Hänge von Macchie aus Zistrosen, Baumheide und Schopflavendel
      eingenommen werden.
    wildlife: >-
      An der Südspitze des europäischen Festlands gelegen, dient der Park Millionen von Zugvögeln als
      wichtiges Sprungbrett nach Afrika. Störche, Milane, Wespenbussarde, Zwergadler, Schlangenadler,
      Gänsegeier und Schmutzgeier nutzen die Thermik und warten günstige Winde für die Meerengenüberquerung
      ab.


      Unter den Standvögeln bewohnen Greifvögel wie Schlangenadler, Mäusebussard, Habicht und Waldkauz die
      dichten Eichenbestände. Felsformationen bieten Nistplätze für [Gänsegeier](/especie/gyps_fulvus/),
      Schmutzgeier, [Habichtsadler](/especie/aquila_fasciata/), [Uhu](/especie/bubo_bubo/) und
      [Wanderfalke](/especie/falco_peregrinus/). Entlang der Bäche in den Schluchten jagen
      [Wasseramsel](/especie/cinclus_cinclus/) und [Eisvogel](/especie/alcedo_atthis/).


      Bei den Säugetieren beherbergt der Park die stärksten Bestände der Ichneumon-Manguste (*Meloncillo*) in
      Europa sowie Ginsterkatzen, Fischotter und Steinmarder. Zudem lebt hier das maurische Reh, die
      südlichste Rehpopulation weltweit. In den Bächen leben seltene Libellenarten und die endemische
      Alcornocales-Vogelspinne.
    visit: >-
      Starte am Besucherzentrum El Aljibe bei Alcalá de los Gazules. Der angeschlossene botanische Garten
      veranschaulicht seltene Gewächse wie den blühenden Rhododendron *Ojaranzo*. Ein Lehrpfad erläutert die
      Schluchtwälder, Korkeichen und Nebelwälder im Zusammenspiel mit dem Gestein.


      Zum Wandern führt die Route Garganta del Capitán unter alten Korkeichen zu Felsgräbern aus der
      Bronzezeit; der Pfad Laguna del Moral erschließt vogelreiche Waldstücke, und der Weg am Río Hozgarganta
      passiert eine historische königliche Geschützgießerei. Bergwanderer zieht es auf den Pico del Aljibe.
      Sehenswert sind weiße Bergdörfer wie Jimena de la Frontera, Alcalá de los Gazules und Castellar de la
      Frontera.
    history: >-
      Der Naturpark wurde 1989 ausgewiesen. Seine Bergdörfer erlebten im maurischen Königreich Granada als
      Grenzfestungen ihre Blütezeit. Jahrtausende zuvor hinterließen prähistorische Jäger Felsmalereien in
      über fünfzig Sandsteinhöhlen. Die Höhle Tajo de las Figuras gilt als Sixtinische Kapelle der
      schematischen Felskunst; Bacinete enthält über hundert Malereien und Laja Alta zeigt frühe
      Schiffszeichnungen aus dem Mittelmeerraum.


      Die Korkgewinnung prägt bis heute die Wirtschaft der Region. Zur Bekämpfung des Eichensterbens (*La
      Seca*) wurde 2017 ein umfassender forstlicher Bewirtschaftungsplan verabschiedet. Stromtrassen,
      Windparks und Autobahnen erfordern achtsames Umweltmanagement.
    before: >-
      Verhalte dich umsichtig beim Brandschutz: Wirf keine brennenden Gegenstände oder Zigaretten weg. Nimm
      sämtlichen Abfall wieder mit, respektiere die Ruhe und achte private Grundstücksgrenzen.
    around: >-
      Neunundzwanzig Kilometer entfernt liegt der [Nationalpark Sierra de las
      Nieves](/lugar/parque-nacional-sierra-de-las-nieves/). Weit entfernt teilen alte mediterrane
      Eichenwälder und Arten wie der Schwarzstorch Lebensräume mit dem [Nationalpark
      Cabañeros](/lugar/parque-nacional-de-cabaneros/), dem [Nationalpark
      Monfragüe](/lugar/parque-nacional-de-monfrague/) und dem [Naturschutzgebiet Serra da
      Malcata](/lugar/reserva-natural-da-serra-da-malcata/).
  it:
    intro: >-
      Esiste una valle nel sud dell'Europa dove si cammina tra allori, rododendri e felci arborescenti come se
      la mappa avesse cambiato latitudine. Non si tratta di una serra, bensì di un *canuto*, profonda gola di
      arenaria del Parco Naturale Los Alcornocales, a cavallo tra la provincia di Cadice e il nord di Malaga.
      Qui le brezze atlantiche condensano in nebbie persistenti sotto cui sopravvive una vegetazione relitta
      dell'era terziaria. All'intorno, la sughereta ricopre le catene montuose formando il bosco di querce da
      sughero più esteso e meglio preservato della penisola iberica.
    landscape: >-
      Oltre il 90 % del territorio del parco poggia sull'unità geologica dell'Aljibe: arenarie e argille
      marine che hanno originato creste ripide culminanti nel Pico del Aljibe (1092 m). Il substrato arenaceo
      e acido è determinante: favorisce fitti querceti da sughero, affiancati nelle valli più umide da querce
      farnetto e querce andaluse.


      Le piogge atlantiche completano il quadro. Le perturbazioni oceaniche spazzano i rilievi da ovest verso
      est da autunno a primavera, con precipitazioni che superano gli 800 litri per metro quadrato fino a
      oltrepassare i 1400 litri sui crinali sommitali. In estate le nebbie costiere chiamate *barbas del
      levante* apportano preziosa umidità in piena stagione secca, valendo al parco la denominazione di ultima
      foresta pluviale mediterranea.


      Questa umidità si condensa all'interno dei *canutos*. Sul fondo delle gole ombrose, le foglie
      sempreverdi della laurisilva catturano la luce filtrata: alloro, rododendro pontico (*ojaranzo*),
      frangola, lentaggine, ontano e agrifoglio compongono un bosco a galleria di tipo subtropicale unico
      nell'Europa continentale.


      Salendo di quota il paesaggio muta radicalmente. Sulle creste rocciose povere cresce l’*herriza*, una
      landa di brughiera nana, mentre sui versanti prospera la macchia mediterranea di cisto ed erica.
    wildlife: >-
      Situato all'estremità meridionale d'Europa, il parco rappresenta un corridoio vitale per milioni di
      uccelli migratori in viaggio tra Europa e Africa. Cicogne, nibbi, falchi pecchiaioli, aquile minori,
      bianconi, grifoni e capovaccai sfruttano le correnti ascensionali in attesa del vento favorevole per
      attraversare lo stretto.


      Tra le specie stanziali, i querceti ospitano aquile minori, bianconi, poiane, astori e allocchi. Le
      pareti rocciose offrono rifugio a [grifone](/especie/gyps_fulvus/), capovaccaio, [aquila del
      Bonelli](/especie/aquila_fasciata/), [gufo reale](/especie/bubo_bubo/) e [falco
      pellegrino](/especie/falco_peregrinus/). Lungo i ruscelli dei canutos nidificano il [merlo
      acquaiolo](/especie/cinclus_cinclus/) e il [martin pescatore](/especie/alcedo_atthis/).


      Tra i mammiferi spiccano rarità come la mangusta egiziana (*meloncillo*), presente qui con le maggiori
      popolazioni d'Europa, oltre a genette, lontre, tassi e faine. Queste montagne accolgono l'ultima
      popolazione di capriolo andaluso morisco, al limite sud-occidentale dell'areale mondiale della specie.
      Nelle acque vivono libellule rare e il ragno imbutiforme dei querceti.
    visit: >-
      Inizia dal centro visitatori El Aljibe, alle porte di Alcalá de los Gazules. Il giardino botanico mostra
      piante singolari tra cui il rododendro fiorito *ojaranzo*. Un percorso guidato illustra canutos,
      sugherete e foreste di nebbia legati ai diversi suoli geologici.


      Per camminare, la Garganta del Capitán conduce sotto le querce da sughero a tombe dell'età del bronzo;
      il sentiero della Laguna del Moral si snoda in boschi ricchi di avifauna, e la pista del Río Hozgarganta
      costeggia sponde levigate vicino ai resti di una reale fabbrica d'artiglieria. Gli escursionisti più
      esperti possono salire al Pico del Aljibe. Concludi la visita nei borghi fortificati di Jimena de la
      Frontera, Alcalá de los Gazules o Castellar de la Frontera.
    history: >-
      Il parco è stato istituito nel 1989. I suoi borghi d'altura raggiunsero il massimo splendore durante il
      regno nasride di Granada, di cui costituivano la frontiera occidentale. Molto prima, le popolazioni
      preistoriche dipinsero oltre una cinquantina di grotte d'arenaria. La grotta del Tajo de las Figuras è
      considerata la cappella Sistina dell'arte schematica iberica; Bacinete conserva oltre un centinaio di
      pitture ben conservate e Laja Alta raffigura antiche navi a vela mediterranee.


      La sughereta resta un bosco produttivo fondamentale per l'estrazione del sughero. Per contrastare il
      deperimento delle querce (*la seca*), nel 2017 è stato approvato un piano di gestione forestale
      sostenibile. Elettrodotti, parchi eolici e arterie viarie richiedono costante attenzione ambientale.
    before: >-
      Collabora attivamente alla prevenzione degli incendi: non gettare mozziconi né sostanze infiammabili.
      Porta con te i rifiuti fino ai cassonetti urbani, rispetta il silenzio del bosco e le proprietà private.
    around: >-
      A ventinove chilometri si trova il [Parco Nazionale della Sierra de las
      Nieves](/lugar/parque-nacional-sierra-de-las-nieves/). Più lontano, condividono boschi maturi di querce
      e specie come la cicogna nera il [Parco Nazionale di Cabañeros](/lugar/parque-nacional-de-cabaneros/),
      il [Parco Nazionale di Monfragüe](/lugar/parque-nacional-de-monfrague/) e la [Riserva Naturale della
      Serra da Malcata](/lugar/reserva-natural-da-serra-da-malcata/).
  pt:
    intro: >-
      Existe um vale no sul da Europa onde se caminha entre loureiros, rododendros e fetos gigantes como se a
      geografia se tivesse enganado na latitude. Não se trata de uma estufa: é um *canuto*, um desfiladeiro
      estreito e profundo do Parque Natural Los Alcornocales, nas províncias de Cádis e norte de Málaga. Aqui
      o nevoeiro húmido do oceano condensa-se permanentemente, permitindo a sobrevivência de uma flora
      relíquia da Era Terciária. Em redor, o sobreiral reveste as serras como o maior e mais bem conservado
      montado de sobro de toda a Península Ibérica.
    landscape: >-
      Mais de 90 % da superfície do parque assenta sobre a Unidade do Aljibe: arenitos e argilas marinhas que
      esculpiram relevos acidentados culminando no Pico del Aljibe (1092 m). O substrato arenoso e ácido é
      fundamental: favorece densos povoamentos de sobreiro, cedendo espaço em fundos húmidos ao
      carvalho-cerquinho e carvalho-das-canárias.


      A precipitação atlântica molda a paisagem. As frentes oceânicas varrem o maciço de oeste para leste do
      outono à primavera, com valores anuais que superam os 800 litros por metro quadrado e ultrapassam os
      1400 litros nas cumeadas mais altas. No verão, as névoas marítimas chamadas *barbas del levante*
      garantem humidade contínua, valendo ao parque o título de última selva mediterrânica da Europa.


      Essa humidade concentra-se no fundo dos *canutos*. Nestas gargantas sombrias, as folhas coriáceas da
      laurissilva aproveitam a luminosidade filtrada: loureiro, rododendro-pontico (*ojaranzo*),
      amieiro-negro, folhado, amieiro e azevinho formam uma galeria ripícola de feição subtropical única na
      Europa continental.


      Subindo em altitude, o cenário transforma-se. Nas cristas rochosas pobres surge a *herriza*, charneca
      anã de urzes, enquanto as encostas acolhem matagais de estevas e alfazemas.
    wildlife: >-
      Localizado no extremo sul da Europa continental, o parque é passagem obrigatória para milhões de aves
      migradoras entre a Europa e África. Cegonhas, milhafres, búteos-vespeiros, águias-calçadas,
      águias-cobreiras, grifos e abutres-do-egito aproveitam as térmicas ou aguardam ventos favoráveis para
      atravessar o estreito.


      Entre as aves residentes, os carvalhais acolhem a águia-calçada, a águia-cobreira, a
      águia-d'asa-redonda, o açor e a coruja-do-mato. Os escarpamentos rochosos abrigam o
      [grifo](/especie/gyps_fulvus/), o abutre-do-egito, a [águia-de-bonelli](/especie/aquila_fasciata/), o
      [bufo-real](/especie/bubo_bubo/) e o [falcão-peregrino](/especie/falco_peregrinus/). Nas ribeiras dos
      canutos ocorrem o [melro-d'água](/especie/cinclus_cinclus/) e o
      [guarda-rios-comum](/especie/alcedo_atthis/).


      Nos mamíferos destacam-se a mangusta-egípcia (*sacarrabos* ou *meloncillo*), que atinge aqui as maiores
      densidades europeias, a par de ginetas, lontras, texugos e fuinhas. Estas serras albergam ainda a última
      população de corço andaluz mourisco, no extremo sudoeste da sua distribuição global. Nos cursos de água
      ocorrem libélulas raras e a aranha-funil dos sobreirais.
    visit: >-
      Começa pelo centro de visitantes El Aljibe, na periferia de Alcalá de los Gazules. O seu jardim botânico
      apresenta a flora autóctone com destaque para o florido rododendro *ojaranzo*. Um itinerário
      interpretativo conduz através dos canutos, montados de sobro e florestas de nevoeiro associadas aos
      solos arenosos.


      Para caminhar, o trilho Garganta del Capitán avança entre sobreiros centenários até sepulturas da Idade
      do Bronze; o percurso da Laguna del Moral cruza bosques com rica avifauna, e o trilho do Río Hozgarganta
      margeia rochedos polidos junto a ruínas de uma fundição real de artilharia. Montanhistas podem subir ao
      Pico del Aljibe. Completa o dia explorando aldeias históricas como Jimena de la Frontera, Alcalá de los
      Gazules ou Castellar de la Frontera.
    history: >-
      O parque foi criado em 1989. As suas povoações alcandoradas atingiram o esplendor durante o Reino
      Nacérida de Granada, quando formavam a fronteira ocidental. Milénios antes, comunidades pré-históricas
      pintaram mais de meia centena de abrigos rochosos. A gruta do Tajo de las Figuras é considerada a capela
      Sistina da arte rupestre esquemática ibérica; Bacinete guarda mais de uma centena de gravuras e a Laja
      Alta exibe desenhos primitivos de embarcações do Mediterrâneo.


      O montado de sobro continua a ser um espaço produtivo com a extração de cortiça como esteio económico
      regional. Face ao declínio do sobreiral (*la seca*), foi aprovado em 2017 um plano de gestão florestal
      integral. Linhas elétricas, parques eólicos e autoestradas exigem vigilância ecológica constante.
    before: >-
      Colabora ativamente na prevenção de incêndios florestais: nunca atires beatas nem produtos inflamáveis.
      Transporta o teu lixo até aos contentores municipais, respeita o silêncio da serra e as vedações
      privadas.
    around: >-
      A vinte e nove quilómetros situa-se o [Parque Nacional da Sierra de las
      Nieves](/lugar/parque-nacional-sierra-de-las-nieves/). Mais longe, partilham montados maduros e espécies
      como a cegonha-preta o [Parque Nacional de Cabañeros](/lugar/parque-nacional-de-cabaneros/), o [Parque
      Nacional de Monfragüe](/lugar/parque-nacional-de-monfrague/) e a [Reserva Natural da Serra da
      Malcata](/lugar/reserva-natural-da-serra-da-malcata/).
