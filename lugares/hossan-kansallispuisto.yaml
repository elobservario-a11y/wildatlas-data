resumen:
  es: >-
    Lagos y ríos claros entre crestas de grava glaciar (esker) y pinares de taiga, con pinturas rupestres a
    orillas del lago Somerjärvi.
  en: >-
    Clear lakes and rivers woven between glacial esker ridges and taiga pine forests, featuring rock art on
    the shores of Lake Somerjärvi.
  fr: >-
    Lacs et rivières limpides entre crêtes d'eskers glaciaires et pinèdes de la taïga, avec des peintures
    rupestres sur les rives du lac Somerjärvi.
  de: >-
    Klare Seen und Flüsse zwischen eiszeitlichen Os-Kämmen und Taiga-Kiefernwäldern, mit uralten Felsmalereien
    am See Somerjärvi.
  it: >-
    Laghi e fiumi limpidi tra creste di esker glaciali e pinete di taiga, con pitture rupestri sulle rive del
    lago Somerjärvi.
  pt: >-
    Lagos e rios cristalinos entre cristas de eskers glaciares e pinhais de taiga, com pinturas rupestres nas
    margens do lago Somerjärvi.
unico:
  es: >-
    En un mismo parque hay una galería de arte de la Edad de Piedra, la pintura rupestre más septentrional de
    Finlandia y un cañón de lago de solo diez metros de ancho.
  en: >-
    Within a single park lies a Stone Age art gallery, the northernmost rock painting in Finland, and a lake
    canyon barely ten metres wide.
  fr: >-
    Un même parc abrite une galerie d'art de l'âge de pierre, la peinture rupestre la plus nordique de
    Finlande et un lac de canyon large de dix mètres seulement.
  de: >-
    In ein und demselben Park finden sich eine Kunstgalerie der Steinzeit, die nördlichste Felsmalerei
    Finnlands und ein nur zehn Meter breiter Seencanyon.
  it: >-
    In uno stesso parco si trovano una galleria d'arte dell'Età della Pietra, la pittura rupestre più a nord
    della Finlandia e un lago di forra largo appena dieci metri.
  pt: >-
    Num mesmo parque encontras uma galeria de arte da Idade da Pedra, a pintura rupestre mais a norte da
    Finlândia e um desfiladeiro lacustre com apenas dez metros de largura.
observaciones:
  es: >-
    Los perros van atados. Acampa junto a los puntos de descanso, hogares y cabañas señalados; el fuego solo
    se enciende en los hogares marcados y está prohibido con aviso de incendio forestal. No hay papeleras ni
    puntos de reciclaje: te llevas todo lo que traes. Puedes recoger bayas y setas comestibles, pero no otras
    plantas. Sin nieve, la bicicleta de montaña solo va por las rutas señaladas.
texto:
  es:
    intro: >-
      Antes de que hubiera mapas, en Hossa ya se pintaba. En un muro de roca que se alza del lago Somerjärvi,
      en lo que hoy es Kainuu, alguien dibujó hace unos 3.500 a 4.500 años escenas de caza y rituales
      chamánicos, con figuras humanas con astas en la cabeza. Alrededor se extiende un parque nacional de
      crestas de grava, lagos de aguas cristalinas y pinares abruptos: el Parque Nacional de Hossa, de 111
      km², creado en 2017 en honor del centenario de la independencia de Finlandia.
    landscape: >-
      Hossa es un punto de encuentro de tres rutas de agua, y por eso tiene tantas aguas corrientes y más de
      cien lagos y estanques. Los esker, esas altas crestas de grava, y las marmitas glaciares de la Edad del
      Hielo definen el paisaje: muchos estanques, como el lago Öllöri, se formaron así, y en sus fondos hay
      manantiales por donde sale el agua subterránea de las crestas. Las aguas son pobres y claras, salvo las
      de las turberas, oscuras.


      La roca dejó también su firma. El cañón de Julma-Ölkky es un valle de fractura abierto durante cientos
      de millones de años: su lago mide unos tres kilómetros de largo, solo diez metros de ancho en el punto
      más estrecho y unos 50 m de profundidad, y la pared se alza otros 50 m sobre el agua. En la parte norte,
      la fractura Pirunkirkko, la Iglesia del Diablo, es una bóveda de roca donde, según un relato, un sabio
      hacía sus hechizos.


      Los bosques son sobre todo de pino y bastante abruptos, con abetos en las laderas altas, y entre ellos
      hay muchas turberas, casi todas pequeñas.
    wildlife: >-
      Hossa se mira más por el agua que por el monte. Las gravas y las rocas del fondo de las corrientes son
      importantes para el tímalo y la [trucha](/especie/salmo_trutta/), que desovan en los rápidos. En
      Huosivirta, una corriente que no se hiela nunca, el [mirlo acuático](/especie/cinclus_cinclus/) es un
      visitante habitual del invierno, y quien quiera fotografiar el vapor en los días de helada tiene allí su
      sitio. Los arroyos, manantiales y turberas de manantial son lo menos estudiado y pueden guardar
      sorpresas, como musgos raros o animales de fondo.


      El año marca los accesos. En verano, las playas de arena de Kokalmus son buen sitio de fotografía, con
      la mejor luz de noche, tras la puesta de sol, y al amanecer. En invierno los senderos no tienen
      mantenimiento y se abren rutas invernales; desde enero hasta finales de abril una ruta de desierto de 6
      km lleva a Värikallio a pie, con raquetas, esquís o bicicleta de ruedas anchas.
    visit: >-
      Unos 90 km de senderos, casi todos fáciles, recorren las crestas y los lagos; se pueden combinar
      senderos circulares y de conexión para hacer una travesía larga. Hay rutas accesibles en Huosilampi,
      Lihapyörre y Muikkupuro, un arroyo cristalino entre los lagos Iso-Valkeainen y Keski-Valkeainen con un
      sendero accesible hasta el refugio.


      La visita estrella es Värikallio. En verano se llega por un sendero de unos 8 kilómetros desde el
      aparcamiento de Lihapyörre, y una pasarela de acero lleva hasta la pared. Es gratuito, está abierto todo
      el año y no tiene personal. Las 61 figuras de la roca incluyen humanos con astas, y no hay ni una barca,
      aunque se pintaron desde una barca o desde el hielo.


      El centro de visitantes, junto con el área de excursionismo creada en 1979, abrió en 1991. Para el cañón
      de Julma-Ölkky hay que ir en barca: su pequeña pintura rupestre, con dos personas y un alce o ciervo, es
      la más septentrional de Finlandia y solo se ve desde el agua o, en invierno, desde el hielo.
    history: >-
      Hossa es un antiguo territorio de caza sami, y los restos de vivienda más antiguos tienen casi 10.000
      años. Hasta principios de los años 1950 se segaban prados, y de ello quedan graneros de prado. La cría
      de renos empezó en el siglo XVI, cuando solo los sami vivían aquí, y la tala y la flotación de troncos
      llegaron a principios del siglo XX. En Lounatkoski, junto a los rápidos más veloces del parque, un
      molino sigue en funcionamiento.


      Junto al estanque Keihäslampi está el Papinpetäjä, el Pino del Cura, con años tallados; el más antiguo
      que se identifica es 1750. El parque protege los organismos, la geología y el paisaje de crestas,
      colinas y pequeñas aguas, que cuentan una larga convivencia entre personas y naturaleza.
    before: >-
      Los perros van atados. Acampa junto a los puntos de descanso, hogares y cabañas señalados; el fuego solo
      se enciende en los hogares marcados y está prohibido con aviso de incendio forestal. No hay papeleras ni
      puntos de reciclaje: te llevas todo lo que traes. Puedes recoger bayas y setas comestibles, pero no
      otras plantas. Sin nieve, la bicicleta de montaña solo va por las rutas señaladas.
    around: >-
      Con Hossa comparten especies del norte, como el glotón y el reno, estos lugares: el [Parque Nacional
      Urho Kekkonen](/lugar/urho-kekkonen-national-park/), la [Reserva Natural de
      Vindelfjällen](/lugar/vindelfjallens-naturreservat/), el [Parque Nacional de
      Femundsmarka](/lugar/femundsmarka-nasjonalpark/) y el [Parque Nacional de Jotunheimen - El Hogar de los
      Gigantes](/lugar/jotunheimen-national-park/).
  en:
    intro: >-
      Long before maps existed, people were already painting in Hossa. On a sheer rock wall rising out of Lake
      Somerjärvi in present-day Kainuu, Stone Age hunter-gatherers created hunting scenes and shamanic rituals
      some 3,500 to 4,500 years ago, depicting human figures bearing antlers on their heads. Surrounding it
      extends a national park of narrow gravel ridges, crystal-clear lakes, and rugged pine forests: Hossa
      National Park, covering 111 km², established in 2017 to celebrate the centenary of Finland's
      independence.
    landscape: >-
      Hossa sits at the meeting point of three major watercourses, which explains its abundance of flowing
      streams and more than a hundred lakes and kettle ponds. Glacial eskers—lofty gravel ridges formed by
      meltwater torrents—and kettle holes from the Ice Age define the landscape: many ponds, like Lake Öllöri,
      were gouged this way, their bottoms fed by subaquatic springs filtering pure groundwater out of the
      ridges. The waters are naturally nutrient-poor and crystal clear, except for the dark, peat-stained
      waters of the bogs.


      The bedrock has also left its dramatic imprint. The canyon of Julma-Ölkky is a tectonic fracture rift
      valley formed over hundreds of millions of years: its canyon lake stretches around three kilometres
      long, measures barely ten metres across at its narrowest choke point, and reaches 50 m deep, with rock
      walls towering another 50 m sheer above the dark water. In its northern reaches, Pirunkirkko—the Devil's
      Church—is a gaping rock cave where, according to local folklore, a wise shaman cast powerful spells.


      The forests consist mainly of Scots pine growing on rugged slopes, with Norway spruce clothing the
      higher ridges, punctuated by numerous small mires and peat bogs.
    wildlife: >-
      Hossa is best experienced from the water rather than the mountain crests. The gravel and cobble river
      beds provide essential spawning grounds for grayling and [brown trout](/especie/salmo_trutta/) in the
      foaming rapids. At Huosivirta, a swift current that never freezes even in the depths of subarctic
      winter, the [white-throated dipper](/especie/cinclus_cinclus/) is a regular winter visitor, creating
      enchanting photography opportunities amidst the frost-fogged waters. The small forest brooks, natural
      seepage springs, and spring-fed fens remain little explored and may shelter rare mosses and benthic
      invertebrates.


      The seasons govern access. In summer, the sandy beaches of Kokalmus offer wonderful wilderness
      photography with late evening light and morning mist. In winter, footpaths remain unmaintained and
      designated winter trails open; from January through late April, a 6 km wilderness track leads visitors
      to Värikallio on snowshoes, cross-country skis, fatbikes, or on foot.
    visit: >-
      Around 90 km of well-marked trails, most of them graded easy, traverse the eskers and skirt the shores,
      allowing hikers to link loops and connector paths into multi-day treks. Accessible paths equipped for
      mobility devices are available at Huosilampi, Lihapyörre, and Muikkupuro—a crystal-clear stream between
      lakes Iso-Valkeainen and Keski-Valkeainen featuring an accessible boardwalk all the way to a shelter.


      The crown jewel of any visit is Värikallio. In summer, you reach it along an 8-kilometre hiking trail
      from the Lihapyörre parking area, where a suspended steel walkway brings you directly in front of the
      painted cliff face. Visiting is free, open year-round, and unstaffed. The 61 figures on the rock face
      depict horned human figures and wildlife, with no boats depicted although they were painted from
      watercraft or winter ice.


      The visitor centre, alongside the original state hiking area established in 1979, opened in 1991.
      Julma-Ölkky canyon is best explored by excursion boat: its small rock painting showing two human figures
      and an elk or deer is the northernmost in Finland and can only be seen from the water or winter lake
      ice.
    history: >-
      Hossa is traditional Sámi hunting and fishing territory, where the oldest dwelling sites date back
      nearly 10,000 years. Until the early 1950s, natural water meadows were cut for hay, leaving behind
      historic log hay barns. Reindeer husbandry began in the sixteenth century when only the Sámi lived here,
      followed by commercial logging and timber floating in the early twentieth century. At Lounatkoski, by
      the park's most torrential rapids, a historic water mill still stands operational.


      Beside the Keihäslampi pond stands Papinpetäjä—the Priest's Pine—carved with memorial dates, the oldest
      legible being 1750. The park protects fragile boreal biodiversity, glacial esker geology, and a mosaic
      of small waters that recount ten millennia of human coexistence with northern nature.
    before: >-
      Dogs must be kept on a leash at all times. Camp only at designated camping sites, lean-to shelters, and
      wilderness huts; open fires are permitted exclusively in official campfire rings and strictly prohibited
      during forest fire warnings. There are no refuse containers: take all waste away with you. Picking
      edible wild berries and mushrooms is permitted, but do not disturb other flora. In snow-free seasons,
      mountain bikes must remain on designated cycling tracks.
    around: >-
      Hossa shares northern taiga wildlife, including wolverines and reindeer, with [Urho Kekkonen National
      Park](/lugar/urho-kekkonen-national-park/), [Vindelfjällen Nature
      Reserve](/lugar/vindelfjallens-naturreservat/), [Femundsmarka National
      Park](/lugar/femundsmarka-nasjonalpark/), and [Jotunheimen National Park - Home of the
      Giants](/lugar/jotunheimen-national-park/).
  fr:
    intro: >-
      Bien avant l'existence des cartes, on peignait déjà à Hossa. Sur une paroi rocheuse surgissant des eaux
      du lac Somerjärvi, dans l'actuelle région de Kainuu, des chasseurs-cueilleurs ont dessiné il y a 3 500 à
      4 500 ans des scènes de chasse et des rituels chamaniques avec d'étranges silhouettes humaines
      couronnées de bois de cervidés. Tout autour s'étend un parc national composé d'eskers, de lacs aux eaux
      cristallines et de pinèdes escarpées : le parc national de Hossa, couvrant 111 km², créé en 2017 pour
      célébrer le centenaire de l'indépendance finlandaise.
    landscape: >-
      Hossa se situe au confluent de trois grands réseaux hydrographiques, ce qui explique son abondance de
      cours d'eau et ses plus de cent lacs et étangs. Les eskers, ces hautes crêtes de gravier d'origine
      glaciaire, et les kettles façonnent le relief : nombre de plans d'eau, comme le lac Öllöri, sont nés de
      ces dépressions, alimentés au fond par des sources résurgentes d'eau souterraine pure. Ces eaux sont
      oligotrophes et limpides, contrastant avec les eaux sombres des tourbières.


      Le socle rocheux a imprimé sa signature minérale. Le canyon de Julma-Ölkky est une vallée de fracture
      tectonique forgée au fil de centaines de millions d'années : son lac s'étire sur trois kilomètres de
      long, ne dépasse pas dix mètres de large dans son goulet le plus resserré et atteint 50 m de profondeur,
      dominé par des parois verticales s'élevant à plus de 50 m au-dessus des flots. Vers le nord, la cavité
      de Pirunkirkko, l'Église du Diable, forme une anfractuosité où, selon les récits locaux, un chaman
      jetait ses sortilèges.


      Les forêts se composent avant tout de pins sylvestres tapissant des pentes abruptes, d'épicéas sur les
      sommets et d'une multitude de petites tourbières humides.
    wildlife: >-
      Hossa s'apprécie surtout depuis l'élément aquatique. Les lits de gravier et de galets abritent
      d'excellentes frayères pour l'ombre commun et la [truite fario](/especie/salmo_trutta/) au cœur des
      rapides. À Huosivirta, un cours d'eau qui ne gèle jamais même au cœur de l'hiver, le [cincle
      plongeur](/especie/cinclus_cinclus/) est un hivernant assidu, offrant de magnifiques scènes dans les
      brumes givrées. Les ruisseaux forestiers et les tourbières de résurgence recèlent des mousses rares et
      des invertébrés aquatiques peu étudiés.


      Les saisons règlent les accès. En été, les rives sablonneuses de Kokalmus sont parfaites pour la
      photographie crépusculaire. En hiver, les sentiers pédestres laissent place à des pistes blanches
      balisées ; de janvier à la fin avril, un itinéraire hivernal de 6 km permet de rallier Värikallio à
      pied, en raquettes, en skis ou en fatbike.
    visit: >-
      Près de 90 km de sentiers balisés parcourent les eskers et les berges lacustres, permettant d'enchaîner
      des boucles courtes ou de longues traversées. Des parcours accessibles sont aménagés à Huosilampi,
      Lihapyörre et Muikkupuro, un ruisseau translucide entre les lacs Iso-Valkeainen et Keski-Valkeainen
      pourvu d'un platelage adapté menant à un abri.


      Le site incontournable reste Värikallio. En saison estivale, on y accède par un sentier d'environ 8
      kilomètres depuis le parking de Lihapyörre, où une passerelle métallique suspendue mène au plus près de
      la falaise. L'accès est libre toute l'année sans personnel sur place. Les 61 figures rupestres
      comprennent des hommes cornus et des cervidés peints depuis une embarcation ou sur la glace.


      Le centre d'accueil, greffé sur l'aire de randonnée établie en 1979, a ouvert ses portes en 1991. Le
      canyon de Julma-Ölkky se découvre en bateau : sa petite peinture rupestre figurant deux humains et un
      élan est la plus boréale de Finlande et ne s'observe que depuis l'eau ou depuis le lac gelé en hiver.
    history: >-
      Hossa est un territoire ancestral de chasse et de pêche sami, où les plus anciens vestiges d'habitation
      remontent à près de 10 000 ans. Jusqu'au début des années 1950, on y fauchait le foin des prairies
      inondables, dont témoignent d'antiques granges en rondins. L'élevage du renne commença au XVIe siècle du
      temps des communautés samies, suivi par l'exploitation forestière et le flottage du bois au début du XXe
      siècle. À Lounatkoski, près des rapides les plus tumultueux, un moulin à eau historique demeure en état
      de marche.


      Près de l'étang de Keihäslampi se dresse le Papinpetäjä, le Pin du Prêtre, portant des dates gravées
      dans son écorce dont la plus ancienne remonte à 1750. Le parc préserve la biodiversité boréale, la
      géologie des eskers et un réseau de petits lacs narrant des millénaires d'harmonie entre l'homme et la
      nature.
    before: >-
      Les chiens doivent être tenus en laisse. Ne campez qu'aux emplacements aménagés et n'allumez du feu que
      dans les foyers officiels, tout feu étant proscrit en période d'alerte incendie. Il n'y a aucune
      poubelle : remportez la totalité de vos détritus. La cueillette des baies et champignons sauvages
      comestibles est permise. Hors neige, le vélo tout-terrain doit emprunter exclusivement les pistes
      prévues.
    around: >-
      Hossa partage des espèces typiques de la taïga comme le glouton et le renne avec le [Parc National Urho
      Kekkonen](/lugar/urho-kekkonen-national-park/), la [Reserva Natural de
      Vindelfjällen](/lugar/vindelfjallens-naturreservat/), le [Parque Nacional de
      Femundsmarka](/lugar/femundsmarka-nasjonalpark/) et le [Parc National de Jotunheimen - Le Domaine des
      Géants](/lugar/jotunheimen-national-park/).
  de:
    intro: >-
      Lange bevor es Landkarten gab, malte man bereits in Hossa. An einer senkrecht aus dem See Somerjärvi
      aufragenden Felswand im heutigen Kainuu bannten steinzeitliche Jäger und Sammler vor 3.500 bis 4.500
      Jahren Jagdszenen und schamanische Rituale mit gehörnten Menschengestalten auf den Stein. Ringsum
      erstreckt sich ein Nationalpark aus Kiesrücken, glasklaren Waldseen und urigen Kiefernwäldern: der 111
      km² große Nationalpark Hossa, der 2017 zum hundertjährigen Jubiläum der finnischen Unabhängigkeit
      feierlich gegründet wurde.
    landscape: >-
      Hossa liegt am Schnittpunkt dreier großer Gewässersysteme, was seinen Reichtum an fließenden Gewässern
      und mehr als hundert Seen und Teichen erklärt. Esker – jene schmalen, von Schmelzwasserströmen
      aufgeschütteten Kiesrücken – und eiszeitliche Toteislöcher prägen die Landschaft: Zahlreiche Teiche wie
      der See Öllöri entstanden auf diese Weise und werden an ihrem Grund von Quellen gespeist, die
      gefiltertes Grundwasser aus den Kämmen zutage fördern. Die Gewässer sind extrem nährstoffarm und
      glasklar, im Gegensatz zu den dunklen Moorgewässern.


      Auch der Felsgrund hinterließ ein markantes Denkmal. Der Canyon von Julma-Ölkky ist ein tektonisches
      Bruchtal, das über hunderte Millionen Jahre entstand: Sein Schluchtsee ist rund drei Kilometer lang, an
      der engsten Stelle kaum zehn Meter breit und bis zu 50 m tief, während die Felswand weitere 50 m
      senkrecht über dem Wasserspiegel aufragt. Im nördlichen Abschnitt bildet die Kluft Pirunkirkko – die
      Teufelskirche – eine Felsenhöhle, in der der Sage nach ein Zauberkundiger seine Rituale vollzog.


      Die Wälder bestehen vorwiegend aus Waldkiefern an den Hanglagen, während Fichten die Höhenzüge säumen
      und viele kleine Torfmoore die Senken füllen.
    wildlife: >-
      Hossa erschließt sich vor allem über das Wasser. Die kiesigen und steinigen Betten der Flüsse bilden
      wertvolle Laichgründe für Äsche und [Forelle](/especie/salmo_trutta/) in den Stromschnellen. Bei
      Huosivirta, einer Strömung, die selbst in klirrenden Wintern niemals zufriert, ist die
      [Wasseramsel](/especie/cinclus_cinclus/) ein regelmäßiger Wintergast, der Fotografen im Eisdunst
      begeistert. Kleine Waldquellbäche und Quellmoore bergen seltene Moose und Gewässerorganismen.


      Die Jahreszeiten bestimmen das Naturerlebnis. Im Sommer laden die Sandstrände von Kokalmus zum
      Fotografieren im Abendlicht ein. Im Winter ruht die Wegepflege und markierte Winterrouten werden
      gespurt; von Januar bis Ende April erschließt eine 6 km lange Wildnisspur Värikallio zu Fuß, auf
      Schneeschuhen, Skiern oder mit dem Fatbike.
    visit: >-
      Rund 90 km markierte Pfade, überwiegend von einfachem Schwierigkeitsgrad, erschließen die Höhenrücken
      und Uferlinien, sodass sich Rundwege zu mehrtägigen Wanderungen verbinden lassen. Barrierefreie
      Abschnitte stehen bei Huosilampi, Lihapyörre und Muikkupuro zur Verfügung – letzterer ein glasklarer
      Bach zwischen Iso-Valkeainen und Keski-Valkeainen mit barrierefreiem Bohlenweg zu einer Schutzhütte.


      Höhepunkt jedes Besuchs ist Värikallio. Im Sommer erreichst du die Felswand über einen rund 8 Kilometer
      langen Wanderweg ab dem Parkplatz Lihapyörre; ein stählerner Hängesteg führt unmittelbar an die bemalte
      Felswand heran. Das Areal ist ganzjährig kostenlos und ohne Personal zugänglich. Die 61 Felsfiguren
      zeigen Menschen mit Geweihen und Waldtiere, gemalt vom Boot oder vom Wintereis aus.


      Das Besucherzentrum, das auf das 1979 ausgewiesene Wandergebiet zurückgeht, wurde 1991 eröffnet. Die
      Schlucht Julma-Ölkky erkundet man am besten per Ausflugsboot: Ihre kleine Felszeichnung zweier Menschen
      mit einem Elch ist die nördlichste Finnlands und nur vom Wasser oder im Winter vom Eis aus sichtbar.
    history: >-
      Hossa ist traditionelles Jagd- und Fischereigebiet der Samen; die ältesten Siedlungsspuren reichen
      nahezu 10.000 Jahre zurück. Bis Anfang der 1950er-Jahre wurden natürliche Überschwemmungswiesen zur
      Heugewinnung gemäht, wovon historische Heuscheunen künden. Die Rentierzucht begann im sechzehnten
      Jahrhundert unter den Samen, gefolgt von Holzeinschlag und Flößerei im frühen zwanzigsten Jahrhundert.
      Bei Lounatkoski an den wildesten Stromschnellen des Parks arbeitet noch heute eine historische
      Wassermühle.


      Nahe dem Waldteich Keihäslampi steht der Papinpetäjä – die Priesterkiefer –, in deren Rinde Jahreszahlen
      eingekerbt sind; die älteste lesbare Zahl lautet 1750. Der Park schützt boreale Lebensräume,
      eiszeitliche Esker-Geologie und ein Mosaik kleiner Waldgewässer, die von jahrtausendelanger Koexistenz
      von Mensch und Natur zeugen.
    before: >-
      Hunde sind ausnahmslos an der Leine zu führen. Zelte nur an den ausgewiesenen Rastplätzen und Hütten;
      offenes Feuer ist nur an den markierten Feuerstellen gestattet und bei Waldbrandgefahr verboten. Es gibt
      keine Abfalleimer: Nimm all deine Abfälle wieder mit. Das Sammeln essbarer Beeren und Pilze ist
      gestattet. Ohne Schnee darf das Mountainbike ausschließlich auf ausgewiesenen Routen genutzt werden.
    around: >-
      Hossa teilt boreale Taiga-Arten wie Vielfraß und Rentier mit dem [Nationalpark Urho
      Kekkonen](/lugar/urho-kekkonen-national-park/), dem [Naturschutzgebiet
      Vindelfjällen](/lugar/vindelfjallens-naturreservat/), dem
      [Femundsmarka-Nationalpark](/lugar/femundsmarka-nasjonalpark/) und dem [Nationalpark Jotunheimen – Reich
      der Riesen](/lugar/jotunheimen-national-park/).
  it:
    intro: >-
      Molto prima che esistessero le carte geografiche, a Hossa si dipingeva già sulla roccia. Su una parete a
      strapiombo sulle acque del lago Somerjärvi, nell'odierna regione di Kainuu, cacciatori preistorici
      impressero tra 3.500 e 4.500 anni fa scene venatorie e riti sciamanici con figure umane sormontate da
      corna. Tutt'intorno si stende un parco nazionale di creste moreniche, laghi cristallini e fitte pinete:
      il Parco nazionale di Hossa, ampio 111 km², istituito nel 2017 in occasione del centenario
      dell'indipendenza della Finlandia.
    landscape: >-
      Hossa sorge all'incrocio di tre importanti bacini fluviali, il che spiega la straordinaria ricchezza di
      corsi d'acqua e gli oltre cento laghi e specchi d'acqua. Gli esker, alte creste di ghiaia glaciale, e le
      cavità modellate dai ghiacci definiscono il rilievo: molti bacini, come il lago Öllöri, si sono formati
      in queste depressioni, alimentati sul fondo da sorgenti sotterranee di acque purissime. Sono acque
      povere di nutrienti e limpidissime, a differenza di quelle torbose e scure delle paludi.


      Anche la roccia ha lasciato la sua impronta. La gola di Julma-Ölkky è una valle di faglia tettonica
      originatasi in centinaia di milioni di anni: il suo lago di forra misura circa tre chilometri di
      lunghezza, appena dieci metri di larghezza nel punto più angusto e circa 50 m di profondità, mentre la
      parete si innalza per altri 50 m a picco sulle acque. Nella parte settentrionale la cavità Pirunkirkko,
      la Chiesa del Diavolo, forma una caverna in cui la tradizione voleva che un saggio sciamano compisse i
      suoi incantesimi.


      Le foreste sono dominate dal pino silvestre lungo i pendii, con abeti rossi sulle alture e una miriade
      di piccole torbiere a punteggiare il bosco.
    wildlife: >-
      Hossa si contempla principalmente a pelo d'acqua. I fondali di ciottoli e ghiaia dei torrenti ospitano
      importanti zone di frega per il temolo e la [trota atlantica](/especie/salmo_trutta/) nelle rapide. A
      Huosivirta, una corrente che non gela mai nemmeno nel cuore dell'inverno subartico, il [merlo
      acquaiolo](/especie/cinclus_cinclus/) è un ospite abituale, attirando gli sguardi tra i vapori del gelo.
      I ruscelli boschivi e le torbiere sorgive custodiscono muschi rari e invertebrati bentonici ancora poco
      esplorati.


      Le stagioni regolano la fruizione. In estate le rive sabbiose di Kokalmus sono ideali per la fotografia
      con le magiche luci notturne. In inverno i sentieri estivi non vengono battuti e subentrano percorsi
      invernali segnalati; da gennaio a fine aprile una traccia innevata di 6 km conduce a Värikallio a piedi,
      con le ciaspole, con gli sci o in fatbike.
    visit: >-
      Circa 90 km di sentieri segnati, in gran parte agevoli, percorrono gli esker e i bordi dei laghi,
      permettendo di combinare anelli escursionistici in lunghe traversate. Tratti accessibili sono presenti a
      Huosilampi, Lihapyörre e Muikkupuro, un ruscello trasparente tra i laghi Iso-Valkeainen e
      Keski-Valkeainen dotato di passerella facilitata verso il rifugio.


      L'attrazione principe è Värikallio. In estate vi si accede tramite un sentiero di circa 8 chilometri a
      partire dal parcheggio di Lihapyörre, dove una passerella d'acciaio sospesa conduce proprio davanti alla
      parete dipinta. L'accesso è libero tutto l'anno senza personale di custodia. Le 61 figure rupestri
      raffigurano uomini cornuti e animali, dipinti da una barca o direttamente dal ghiaccio invernale.


      Il centro visite, erede dell'area escursionistica creata nel 1979, ha aperto i battenti nel 1991. La
      forra di Julma-Ölkky si visita al meglio in barca: la sua piccola pittura rupestre con due figure umane
      e un alce è la più settentrionale della Finlandia ed è visibile solo dall'acqua o, d'inverno, dalla
      superficie ghiacciata.
    history: >-
      Hossa è un territorio storico di caccia e pesca per i sami, con tracce di insediamento che risalgono a
      quasi 10.000 anni fa. Fino ai primi anni 1950 vi si falciavano i prati alluvionali per il fieno, come
      testimoniano i caratteristici fienili in tronchi. L'allevamento delle renne cominciò nel XVI secolo,
      seguito dal taglio del legname e dalla fluitazione all'inizio del XX secolo. A Lounatkoski, presso le
      rapide più impetuose del parco, un mulino ad acqua storico è ancora funzionante.


      Presso lo stagno di Keihäslampi si trova il Papinpetäjä, il Pino del Prete, con date incise sulla
      corteccia la cui più antica leggibile risale al 1750. Il parco tutela gli ecosistemi boreali, la
      morfologia degli esker e il fitto reticolo idrografico, custodi di una millenaria convivenza tra l'uomo
      e la natura.
    before: >-
      I cani devono essere tenuti costantemente al guinzaglio. Campeggia unicamente nelle piazzole e nei
      rifugi consentiti; accendi fuochi solo nei bracieri ufficiali ed evita qualsiasi fiamma in caso di
      allerta incendi boschivi. Non ci sono contenitori per rifiuti: riporta indietro tutto ciò che produci.
      La raccolta di bacche e funghi commestibili è libera. Senza neve, le biciclette possono transitare
      unicamente sui percorsi indicati.
    around: >-
      Hossa condivide la fauna della taiga settentrionale, come il ghiottone e la renna, con il [Parco
      Nazionale Urho Kekkonen](/lugar/urho-kekkonen-national-park/), la [Riserva Naturale di
      Vindelfjällen](/lugar/vindelfjallens-naturreservat/), il [Parco Nazionale di
      Femundsmarka](/lugar/femundsmarka-nasjonalpark/) e il [Parco Nazionale di Jotunheimen - La Casa dei
      Giganti](/lugar/jotunheimen-national-park/).
  pt:
    intro: >-
      Muito antes de haver mapas, já se pintava em Hossa. Num paredão de rocha que emerge das águas do lago
      Somerjärvi, na atual região de Kainuu, caçadores da Idade da Pedra desenharam há cerca de 3.500 a 4.500
      anos cenas venatórias e rituais xamânicos com figuras humanas coroadas por hastes de cervídeos. Em redor
      espalha-se um parque nacional de cristas de cascalho, lagos de águas transparentes e pinhais bravios: o
      Parque Nacional de Hossa, com 111 km², criado em 2017 para assinalar o centenário da independência da
      Finlândia.
    landscape: >-
      Hossa situa-se no ponto de convergência de três importantes bacias hidrográficas, o que justifica a sua
      abundância de correntes e mais de uma centena de lagos e lagoas. Os eskers, essas altas cristas de
      gravilha deixadas pelo degelo, e as marmitas glaciares da Idade do Gelo desenham a paisagem: muitas
      lagoas, como o lago Öllöri, formaram-se assim, alimentadas no fundo por nascentes subaquáticas que
      filtram a água subterrânea das colinas. São águas límpidas e pobres em nutrientes, em contraste com as
      águas escuras das turfeiras.


      A rocha também deixou a sua marca. O desfiladeiro de Julma-Ölkky é uma falha tectónica aberta ao longo
      de centenas de milhões de anos: o seu lago de canhão mede cerca de três quilómetros de comprimento,
      apenas dez metros de largura na passagem mais estreita e cerca de 50 m de profundidade, com a escarpa a
      erguer-se outros 50 m acima da lâmina de água. No setor norte, a fenda Pirunkirkko, a Igreja do Diabo, é
      uma reentrância rochosa onde, reza a tradição, um xamã lançava os seus feitiços.


      As matas são maioritariamente de pinheiro-silvestre nas encostas escarpadas, surgindo o espruce nas
      cotas altas e inúmeras pequenas turfeiras a entrecortar o arvoredo.
    wildlife: >-
      Hossa vive-se sobretudo pela água. Os leitos de gravilha e calhaus rolados dos ribeiros acolhem
      importantes zonas de desova para o tímalo e a [truta-marisca](/especie/salmo_trutta/) nos rápidos. Em
      Huosivirta, uma corrente que nunca congela mesmo no rigor do inverno boreal, o
      [melro-d'água](/especie/cinclus_cinclus/) é um visitante habitual, proporcionando belas fotografias
      entre a bruma gélida. Os regatos florestais e as turfeiras de nascente abrigam musgos raros e
      invertebrados aquáticos pouco estudados.


      As estações do ano determinam o acesso. No verão, os areais de Kokalmus são excelentes para fotografia
      com a luz noturna do norte. No inverno os trilhos de verão deixam de ter manutenção e abrem-se rotas
      brancas; de janeiro ao final de abril, um trilho selvagem de 6 km conduz a Värikallio a pé, com raquetes
      de neve, esquis ou fatbike.
    visit: >-
      Cerca de 90 km de trilhos bem sinalizados, a maioria de nível fácil, percorrem os eskers e as orlas
      lacustres, permitindo conjugar circuitos circulares e veredas em travessias longas. Existem percursos
      acessíveis em Huosilampi, Lihapyörre e Muikkupuro, um regato cristalino entre os lagos Iso-Valkeainen e
      Keski-Valkeainen com passadiço adaptado até ao abrigo.


      A atração mais emblemática é Värikallio. No verão chega-se através de um trilho com cerca de 8
      quilómetros a partir do parque de estacionamento de Lihapyörre, onde um passadiço suspenso de aço conduz
      junto à parede pintada. A visita é gratuita, aberta o ano inteiro e sem vigilância no local. As 61
      figuras rupestres representam humanos com cornos e animais selvagens, pintados a partir de embarcações
      ou sobre o gelo invernal.


      O centro de visitantes, ligado à área de recreio criada em 1979, abriu em 1991. A garganta de
      Julma-Ölkky visita-se preferencialmente de barco: a sua pequena pintura rupestre, com duas pessoas e um
      alce, é a mais setentrional da Finlândia e só se avista a partir da água ou do gelo invernal.
    history: >-
      Hossa é um território histórico de caça e pesca dos sami, onde os vestígios de habitação mais remotos
      rondam os 10.000 anos. Até ao início da década de 1950 ceifavam-se prados de inundação para feno,
      sobrevivendo ainda velhos palheiros de madeira. A pastorícia de renas teve início no século XVI pelas
      mãos dos sami, seguindo-se a exploração florestal e a flutuação de madeira no dealbar do século XX. Em
      Lounatkoski, junto aos rápidos mais impetuosos, um moinho de água histórico continua em funcionamento.


      Junto à lagoa Keihäslampi encontra-se o Papinpetäjä, o Pinheiro do Padre, com anos gravados na casca; o
      mais antigo legível data de 1750. O parque protege a biodiversidade da taiga, o património geológico dos
      eskers e um mosaico de pequenas águas que contam uma convivência milenar entre o ser humano e a
      natureza.
    before: >-
      Os cães devem andar sempre com trela. Acampa unicamente nas áreas de pernoita e abrigos previstos;
      acende fogo apenas nos locais autorizados, sendo interdito durante alertas de incêndio florestal. Não
      existem caixotes do lixo: traz todo o teu lixo de volta. É permitida a colheita de bagas e cogumelos
      silvestres comestíveis. Sem neve, as bicicletas de montanha só podem circular nas pistas autorizadas.
    around: >-
      Hossa partilha espécies da taiga setentrional, como o glutão e a rena, com o [Parque Nacional Urho
      Kekkonen](/lugar/urho-kekkonen-national-park/), a [Reserva Natural de
      Vindelfjällen](/lugar/vindelfjallens-naturreservat/), o [Parque Nacional de
      Femundsmarka](/lugar/femundsmarka-nasjonalpark/) e o [Parque Nacional de Jotunheimen - A Terra dos
      Gigantes](/lugar/jotunheimen-national-park/).
