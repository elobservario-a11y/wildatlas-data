resumen:
  es: >-
    Acantilados de morrena glaciar de 95 m cayendo al Báltico, hayedos costeros y la mayor reserva de bisontes
    europeos costera.
  en: >-
    Glacial moraine cliffs rising 95 m above the Baltic Sea, coastal beech forests, and Poland's foremost
    coastal European bison reserve.
  fr: >-
    Falaises morainiques glaciaires de 95 m plongeant dans la Baltique, hêtraies littorales et plus importante
    réserve côtière de bisons d'Europe.
  de: >-
    Bis zu 95 m hohe Moränen-Steilküsten an der Ostsee, küstennahe Buchenwälder und das größte küstennahe
    Wisentreservat Polens.
  it: >-
    Falesie moreniche glaciali di 95 m a picco sul Baltico, faggete litoranee e la principale riserva costiera
    di bisonti europei.
  pt: >-
    Falésias de moreia glaciar com 95 m tombando sobre o Báltico, faias litorais e a maior reserva costeira de
    bisontes-europeus.
unico:
  es: >-
    Reúne en un mismo parque acantilados de morrena, hayedos casi naturales y un delta de islotes pantanosos
    que sigue formándose.
  en: >-
    Combines dynamic moraine cliffs, near-natural coastal beechwoods, and an evolving delta of marshy islands
    within a single protected territory.
  fr: >-
    Rassemble au sein d'un même parc des falaises morainiques vives, des hêtraies quasi naturelles et un delta
    d'îlots marécageux en constante formation.
  de: >-
    Vereint in einem einzigen Schutzgebiet aktive Steilküsten, naturnahe Buchen-Urwälder und ein morastiges
    Inseldelta, das fortwährend neu entsteht.
  it: >-
    Unisce in un unico parco falesie moreniche attive, faggete quasi vergini e un delta di isolotti palustri
    in perenne evoluzione geologica.
  pt: >-
    Reúne num mesmo parque falésias de moreia ativas, faiais costeiros quase virgens e um delta de ilhotas
    pantanosas em permanente modelação geológica.
observaciones:
