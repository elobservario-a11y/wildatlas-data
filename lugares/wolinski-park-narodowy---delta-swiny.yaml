    Consulta los avisos del gestor sobre accesos y estado de los senderos antes de ir. La villa balnearia de
    Międzyzdroje tiene afluencia media en verano.
texto:
  es:
    intro: >-
      Cada año, el Báltico se come unos 80 centímetros de la costa de Wolin. Los acantilados activos más altos
      llegan a 95 m, y el mar los roe por abajo mientras los hayedos se asoman por arriba. Es la estampa del
      Parque Nacional de Wolin, que protege parte de la mayor isla de Polonia entre la bahía de Pomerania y la
      laguna de Szczecin, y que en su logotipo lleva dos símbolos: el pigargo y un cardo marino, el *mikołajek
      nadmorski*.


      Se creó en 1960 y en 1996 se amplió con aguas marinas, con las de la laguna y con un archipiélago de
      islas costeras. Desde entonces es el primer parque marino de Polonia: ocupa 10 937 ha entre tierra, mar
      y delta.
    landscape: >-
      Hay tres paisajes. El principal es una cadena de colinas de morrena frontal que ocupa cerca del 75 % del
      parque; su punto más alto es Grzywacz, de 115,9 m. El segundo es el delta del Świna: decenas de islotes
      pantanosos separados por canales, donde la formación del terreno sigue activa. Cada año cambia el fondo,
      aparecen nuevos bajíos e islotes. Y el tercero, en el este, es una comarca de lagos de origen glaciar:
      Warnowo, Czajcze, Domysłowskie, Zatorek y Wisełka.


      El bosque cubre buena parte de tierra firme. El pino ocupa el 68 % de la superficie terrestre, el haya
      el 23 % y el roble el 7 %, con una edad media de 130 años. Los hayedos están muy bien conservados, con
      una estructura cercana a la natural y, en el sotobosque, la melica de una flor, orquídeas y la dentaria
      bulbífera. En la costa las laderas de los acantilados se cubren de espesos matorrales de espino
      amarillo; en la playa crecen la honkenia, el elimo de arena y la oruga marina, y en el delta, unas 30
      especies de plantas de suelos salinos.


      En total, en la isla de Wolin hay más de 1300 plantas vasculares, unas 600 de ellas dentro del parque.
    wildlife: >-
      Por Wolin pasa la principal ruta migratoria de aves a lo largo de la costa báltica, y en el parque se
      han registrado más de 230 especies. Las aves de humedal encuentran aquí tranquilidad y alimento, sobre
      todo en las migraciones de primavera y otoño, y el delta del Świna es una zona de importancia europea
      para las aves. En la desembocadura del Świna se ven el chorlitejo patinegro y el pigargo, y varios tipos
      de charranes; la buscarla acuática es una especie prioritaria de Natura 2000 en el parque, muy amenazada
      en Polonia y Europa. El pigargo anida aquí desde hace más de un siglo, y el parque trabaja en que el
      búho real vuelva a ocupar sus terrenos.


      En el agua, la bahía es el hábitat de peces y de mamíferos marinos cada vez más raros, como la foca gris
      y la marsopa, además de focas comunes y anilladas. En tierra viven la nutria, el castor, el murciélago
      ratonero grande y el bisonte europeo. Entre los insectos hay poblaciones del ciervo volante y del
      longicornio del roble.


      De mayo a octubre es la mejor época. Las aves migratorias son un buen motivo para ir en primavera y
      otoño.
    visit: >-
      Empieza por el Museo de la Naturaleza, en el centro de Międzyzdroje, en la colina Filaretów, con jardín
      y pajareras donde viven pigargos y búhos reales. Guarda la mayor colección museística de Polonia de
      machos de combatiente en plumaje nupcial, 130 ejemplares. El parque tiene también un recinto de
      exhibición de bisontes cerca de Międzyzdroje, y un punto de información turística en Zalesie, junto a un
      búnker de la Segunda Guerra Mundial.


      Para caminar, el sendero rojo recorre diecinueve kilómetros por la costa báltica e incluye el mirador de
      Kawcza Góra. El azul tiene veintiséis y pasa por el lago Turkusowe y los miradores de Piaskowa Góra y
      Zielonka, y bordea la laguna de Szczecin, donde se pueden ver aves propias de esos hábitats. El sendero
      de Kawcza Góra va de Żubrowisko a Międzyzdroje pasando por Kawcza, y el de la costa une Świnoujście,
      Międzyzdroje y Kołczewo. Hay cinco miradores activos: Gosań, Kawcza, Zielonka, Piaskowa Góra y Grodzisko
      Lubin. Y dos senderos de naturaleza: Zatorek y Łuniewo.


      En bicicleta pasan por el parque las rutas internacionales R-10, alrededor del Báltico, y R-66,
      alrededor de la laguna de Szczecin.
    history: >-
      En Grodzisko Lubin hay un castro altomedieval que funcionó entre los siglos X y XII, con vistas a la
      laguna. El parque tiene siete zonas de protección estricta, seis de ellas forestales, y se superpone con
      la zona de hábitats «Ujście Odry i Zalew Szczeciński» y con la de aves «Wolin i Uznam».
    before: >-
      Consulta los avisos del gestor sobre accesos y estado de los senderos antes de ir. La villa balnearia de
      Międzyzdroje tiene afluencia media en verano.
    around: >-
      A veintiséis kilómetros queda el [Valle del río Peene / Rewilding
      Peene](/lugar/rewilding-peene-valley-peenetal/). Más lejos, el [Parque Nacional Desembocadura del
      Warta](/lugar/park-narodowy-ujscie-warty/) comparte con Wolin el cisne cantor, el pigargo y los
      humedales.
  en:
    intro: >-
      Each year the Baltic Sea erodes roughly 80 centimetres of Wolin's coastline. The highest active sea
      cliffs soar to 95 m, undercut by crashing waves while primeval beechwoods crown the rim. This striking
      coastline forms the hallmark of Wolin National Park, which shelters part of Poland's largest island
      between Pomerania Bay and the Szczecin Lagoon. Its emblem features two coastal icons: the white-tailed
      eagle and sea holly (*mikołajek nadmorski*).


      Founded in 1960 and expanded in 1996 to encompass coastal marine waters, lagoon expanses, and an
      archipelago of delta islets, it stands as Poland's first marine national park, covering 10,937 ha across
      mainland, sea, and delta environments.
    landscape: >-
      Three distinct landscapes define the park. The dominant element is an undulating terminal moraine ridge
      spanning roughly 75 % of the territory, culminating at Mount Grzywacz (115.9 m). The second landscape is
      the Świna reverse delta: dozens of swampy islets dissected by meandering channels where sedimentary land
      building remains actively underway, constantly reconfiguring shoals and shallows. The third, lying in
      the east, comprises a picturesque post-glacial lake district featuring Warnowo, Czajcze, Domysłowskie,
      Zatorek, and Wisełka.


      Dense woodland blankets much of the dry land. Scots pine accounts for 68 % of the forested terrain,
      beech occupies 23 %, and pedunculate oak covers 7 %, boasting an average stand age of 130 years. The
      coastal beechwoods retain a near-primeval structural complexity, sheltering woodland melick, rare
      orchids, and bulbiferous toothwort in the understorey. Along the bluffs, cliff faces host impenetrable
      sea buckthorn thickets, while sandy foredunes harbor sea sandwort, sea lyme grass, and sea rocket,
      complemented by around 30 halophyte species adapted to brackish delta marshland.


      Across Wolin Island more than 1300 vascular plant species thrive, approximately 600 of which occur
      within national park borders.
    wildlife: >-
      Wolin lies along the primary avian flyway following the Baltic littoral, with over 230 bird species
      recorded in the park. Coastal wetlands offer tranquil feeding grounds, especially during spring and
      autumn passages, establishing the Świna delta as an Important Bird Area of European stature. Near the
      mouth of the Świna, Kentish plover and white-tailed eagle hunt alongside various tern species; the
      aquatic warbler represents a priority Natura 2000 species, exceptionally threatened across Poland and
      the wider continent. The white-tailed eagle has nested continuously here for well over a century, while
      dedicated conservation projects seek to encourage the recolonization of the Eurasian eagle-owl.


      In the marine sector, the bay provides refuge for marine mammals and fishes of high conservation
      concern, including grey seal, harbor porpoise, harbor seal, and ringed seal. On land, Eurasian otter,
      European beaver, greater mouse-eared bat, and European bison roam the habitats. Notable woodland insects
      include thriving populations of stag beetle and great capricorn beetle.


      May through October provides optimal conditions for visits, with spring and autumn migratory passages
      offering world-class birdwatching spectacles.
    visit: >-
      Begin at the Natural History Museum in central Międzyzdroje on Filaretów Hill, which features botanical
      grounds and aviaries housing rehabilitated white-tailed eagles and eagle-owls. It preserves Poland's
      preeminent taxidermy collection of ruffs in full breeding plumage, displaying 130 mounted specimens. The
      park also maintains a European bison demonstration enclosure near Międzyzdroje, and an educational post
      in Zalesie adjacent to a Second World War bunker complex.


      For hiking, the red trail runs for nineteen kilometers along the Baltic bluffs and scales the Kawcza
      Góra lookout. The blue trail covers twenty-six kilometers past turquoise Lake Turkusowe and viewpoints
      at Piaskowa Góra and Zielonka, tracing the Szczecin Lagoon shoreline where wetland birds congregate. The
      Kawcza Góra spur connects Żubrowisko to Międzyzdroje via Kawcza, while the coastal route links
      Świnoujście, Międzyzdroje, and Kołczewo. Five active panoramic viewpoints await: Gosań, Kawcza,
      Zielonka, Piaskowa Góra, and Grodzisko Lubin, alongside two nature trails at Zatorek and Łuniewo.


      Cyclists can cross the territory via international routes R-10 (Baltic Sea Cycle Route) and R-66
      (Szczecin Lagoon Ring).
    history: >-
      At Grodzisko Lubin stand the remnants of an early medieval stronghold that flourished between the tenth
      and twelfth centuries, commanding panoramic vistas across the lagoon. The park encompasses seven strict
      protection reserves—six protecting ancient woodland—and overlaps the European habitats site «Ujście Odry
      i Zalew Szczeciński» and special protection area «Wolin i Uznam».
    before: >-
      Review trail bulletins and park access notices before your outing. The seaside town of Międzyzdroje
      experiences moderate tourist influxes during the peak summer holiday season.
    around: >-
      Twenty-six kilometers away lies the [Valle del río Peene / Rewilding
      Peene](/lugar/rewilding-peene-valley-peenetal/). Farther southwest, the [Parque Nacional Desembocadura
      del Warta](/lugar/park-narodowy-ujscie-warty/) shares with Wolin key populations of whooper swans,
      white-tailed eagles, and alluvial marshlands.
  fr:
    intro: >-
      Chaque année, la mer Baltique grignote environ 80 centimètres du rivage de Wolin. Les plus hautes
      falaises actives culminent à 95 m : la houle ronge leur base tandis que de vénérables hêtraies
      couronnent leur crête. C'est l'image emblématique du parc national de Wolin, qui protège une fraction
      majeure de la plus grande île polonaise entre la baie de Poméranie et la lagune de Szczecin. Deux
      symboles illustrent son logotype : le pygargue à queue blanche et le panicaut maritime (*mikołajek
      nadmorski*).


      Créé en 1960 puis agrandi en 1996 aux eaux marines côtières, à la lagune et à un chapelet d'îlots, il
      est devenu le premier parc marin de Pologne : il rassemble 10 937 ha partagés entre terres émergées,
      lagune, mer et delta.
    landscape: >-
      Trois paysages composent le parc. Le plus étendu est un chapelet de collines morainiques terminales
      couvrant près de 75 % de sa superficie, avec pour point culminant le mont Grzywacz (115,9 m). Le second
      est le delta rétrograde de la Świna : des dizaines d'îlots tourbeux découpés de chenaux où la
      sédimentation est toujours en cours, déplaçant hauts-fonds et bancs de sable au fil des tempêtes. Le
      troisième, à l'est, est un chapelet de lacs glaciaires réunissant Warnowo, Czajcze, Domysłowskie,
      Zatorek et Wisełka.


      La forêt occupe la majeure partie des terres. Le pin sylvestre compose 68 % de la couverture forestière,
      le hêtre 23 % et le chêne pédonculé 7 %, avec un âge moyen remarquable de 130 ans. Les hêtraies
      maritimes conservent une dynamique proche de l'état naturel, abritant dans leur sous-bois la mélique
      uniflore, des orchidées forestières et la dentaire à bulbilles. Sur le littoral, les pentes instables
      des falaises se garnissent de fourrés impénétrables d'argousier ; sur l'estran croissent l'honkénie, le
      seigle de mer et le caquillier maritime, tandis que le delta abrite près de 30 espèces halophiles
      inféodées aux marais saumâtres.


      Au total, l'île de Wolin compte plus de 1300 plantes vasculaires, dont environ 600 prospèrent au sein du
      parc national.
    wildlife: >-
      Wolin se trouve sur le principal couloir de migration aviaire longeant la Baltique : plus de 230 espèces
      d'oiseaux y sont répertoriées. Les zones humides côtières procurent repos et nourriture en abondance,
      particulièrement au printemps et à l'automne, érigeant le delta de la Świna en zone d'importance
      internationale pour l'avifaune. À l'embouchure se côtoient le pluvier à collier interrompu, le pygargue
      et plusieurs sternes ; la fauvette aquatique constitue une espèce prioritaire du réseau Natura 2000,
      hautement menacée en Pologne comme en Europe. Le pygargue nidifie continuellement sur ces falaises
      depuis plus d'un siècle, tandis que le parc mène un programme de réinstallation du grand-duc d'Europe.


      Côté marin, la baie abrite des mammifères emblématiques menacés tels que le phoque gris et le marsouin
      commun, ainsi que des phoques veaux-marins et annelés. Sur terre vivent la loutre d'Europe, le castor,
      le grand murin et le bison d'Europe. Parmi les insectes remarquables figurent de belles populations de
      lucane cerf-volant et de grand capricorne du chêne.


      De mai à octobre s'étend la période idéale. Les passages migratoires justifient pleinement une venue au
      printemps et en automne.
    visit: >-
      Commencez par le musée d'histoire naturelle au cœur de Międzyzdroje, établi sur la colline Filaretów :
      il propose un parc paysager et des volières abritant pygargues et grands-ducs. Il conserve la plus riche
      collection muséale de Pologne de combattants variés mâles en plumage nuptial, avec 130 spécimens
      exposés. Le parc dispose également d'un enclos d'observation des bisons près de Międzyzdroje et d'un
      centre d'information à Zalesie, aménagé à côté d'un bunker de la Seconde Guerre mondiale.


      Pour randonner, le sentier balisé rouge parcourt dix-neuf kilomètres le long des falaises baltiques et
      gagne le belvédère de Kawcza Góra. Le balisage bleu s'étire sur vingt-six kilomètres, reliant le lac
      Turkusowe, les promontoires de Piaskowa Góra et de Zielonka, puis les rives de la lagune de Szczecin où
      s'observent les oiseaux limicoles. L'itinéraire de Kawcza Góra relie Żubrowisko à Międzyzdroje, et le
      sentier littoral dessert Świnoujście, Międzyzdroje et Kołczewo. Cinq belvédères aménagés sont ouverts :
      Gosań, Kawcza, Zielonka, Piaskowa Góra et Grodzisko Lubin, en plus de deux sentiers d'interprétation à
      Zatorek et Łuniewo.


      À vélo, le parc est traversé par les véloroutes internationales R-10, circuit de la mer Baltique, et
      R-66, boucle de la lagune de Szczecin.
    history: >-
      À Grodzisko Lubin subsistent les terrassements d'une forteresse du haut Moyen Âge occupée entre les Xe
      et XIIe siècles, offrant une vue imprenable sur la lagune. Le parc compte sept réserves intégrales, dont
      six forestières, et s'intègre au site communautaire « Ujście Odry i Zalew Szczeciński » ainsi qu'à la
      zone de protection spéciale « Wolin i Uznam ».
    before: >-
      Prenez connaissance des avis du gestionnaire relatifs aux conditions d'accès et à l'état des sentiers
      côtiers avant votre venue. La station de Międzyzdroje connaît une affluence modérée au cœur de l'été.
    around: >-
      À vingt-six kilomètres s'ouvre la [Valle del río Peene / Rewilding
      Peene](/lugar/rewilding-peene-valley-peenetal/). Plus au sud-ouest, le [Parque Nacional Desembocadura
      del Warta](/lugar/park-narodowy-ujscie-warty/) partage avec Wolin le cygne chanteur, le pygargue à queue
      blanche et les grandes roselières alluviales.
  de:
    intro: >-
      Jahr für Jahr reißt die Ostsee rund 80 Zentimeter der Küstenlinie von Wolin fort. Die höchsten aktiven
      Kliffs erreichen 95 m Höhe: Wellen unterhöhlen den Hang, während uralte Buchenwälder über die
      Abbruchkante ragen. Es ist das Wahrzeichen des Nationalparks Wolin, der einen Großteil der größten Insel
      Polens zwischen Pommerscher Bucht und Stettiner Haff schützt. Sein Emblem trägt zwei Symbole der
      Ostseeküste: den Seeadler und den Stranddistel-Mannstreu (*mikołajek nadmorski*).


      Der Park wurde 1960 gegründet und 1996 um Meeresgewässer, Haffbuchten und ein vorgelagertes
      Inselarchipel erweitert. Damit wurde er zu Polens erstem marinen Nationalpark; er umfasst 10 937 ha
      Land-, Haff-, Meeres- und Deltaflächen.
    landscape: >-
      Drei Landschaftsformen prägen das Schutzgebiet. Den Kern bildet ein Endmoränenzug, der rund 75 % der
      Parkfläche einnimmt und im Berg Grzywacz mit 115,9 m gipfelt. Die zweite Einheit ist das Rückseitendelta
      der Świna: Dutzende morastige, von Wasserläufen durchzogene Inseln, auf denen die Landbildung durch
      Sedimentablagerungen ununterbrochen fortschreitet und Sandbänke sowie Untiefen formt. Die dritte
      Landschaft im Osten bildet eine malerische Kette eiszeitlicher Rinnenseen: Warnowo, Czajcze,
      Domysłowskie, Zatorek und Wisełka.


      Wälder bedecken weite Teile des Festlands. Waldkiefern stellen 68 % der Landfläche, Rotbuchen 23 % und
      Stieleichen 7 %, mit einem durchschnittlichen Bestandsalter von 130 Jahren. Die küstennahen Buchenwälder
      sind außergewöhnlich naturnah erhalten; im Unterholz wachsen Einblütiges Perlgras, Wald-Orchideen und
      Zwiebel-Zahnwurz. An der Kliffkante bilden dichte Sanddorngebüsche einen natürlichen Schutzstreifen; am
      Spülsaum siedeln Salzmiere, Strandroggen und Meersenf, während im Haffdelta rund 30 halophile
      Pflanzenarten salzhaltige Röhrichtböden besiedeln.


      Auf der Insel Wolin existieren über 1300 Gefäßpflanzenarten, von denen etwa 600 innerhalb des
      Nationalparks gedeihen.
    wildlife: >-
      Über Wolin verläuft die Hauptzugroute der Vögel entlang der südlichen Ostseeküste; mehr als 230
      Vogelarten sind im Park registriert. Die Feuchtbiotope bieten nahrungsreiche Rastplätze während des
      Frühjahrs- und Herbstzugs, weshalb das Świna-Delta als Vogelschutzgebiet von europäischer Tragweite
      gilt. An der Mündung der Świna jagen Seeregenpfeifer, Seeadler und diverse Seeschwalbenarten; der
      Seggenrohrsänger ist eine prioritäre Art des Schutzgebietsnetzes Natura 2000, stark bedroht in Polen und
      Gesamteuropa. Der Seeadler brütet hier seit über einem Jahrhundert, und der Park fördert aktiv die
      Wiederansiedlung des Uhus.


      In den marinen Gewässern finden seltene Meeressäuger wie Kegelrobbe und Schweinswal, aber auch Seehunde
      und Ringelrobben einen wichtigen Rückzugsraum. An Land streifen Fischotter, Biber, Großes Mausohr und
      Wisente umher. Unter den Totholzkäfern heben sich stabile Populationen von Hirschkäfer und Großem
      Eichenbock hervor.


      Von Mai bis Oktober herrschen die besten Reisebedingungen. Zur Vogelzugzeit im Frühjahr und Herbst lohnt
      sich ein Besuch für Vogelbeobachter besonders.
    visit: >-
      Beginne im Naturkundemuseum im Zentrum von Międzyzdroje auf dem Filaretów-Hügel, umgeben von einem
      Schaugarten und Volieren mit Seeadlern und Uhus. Hier befindet sich Polens größte Schausammlung
      balzender Kampfläufermännchen mit 130 Präparaten. Der Nationalpark unterhält zudem ein Wisentschaugehege
      nahe Międzyzdroje sowie eine Infostelle in Zalesie neben einem Bunkerkomplex aus dem Zweiten Weltkrieg.


      Zum Wandern führt der rot markierte Weg über neunzehn Kilometer an der Steilküste entlang zum
      Aussichtspunkt Kawcza Góra. Der blaue Pfad misst sechsundzwanzig Kilometer, führt am See Turkusowe und
      den Aussichtskanzeln Piaskowa Góra sowie Zielonka vorbei und erschließt das Stettiner Haff mit seinen
      Watvögeln. Ein Verbindungsweg führt von Żubrowisko über Kawcza nach Międzyzdroje, während der Küstenpfad
      Świnoujście, Międzyzdroje und Kołczewo verbindet. Fünf Aussichtspunkte sind eingerichtet: Gosań, Kawcza,
      Zielonka, Piaskowa Góra und Grodzisko Lubin, ergänzt durch Naturlehrpfade in Zatorek und Łuniewo.


      Radfahrer nutzen die internationalen Fernradwege R-10 (Ostseeküsten-Radweg) und R-66 (Rund um das
      Stettiner Haff).
    history: >-
      In Grodzisko Lubin thronen die Wälle einer frühmittelalterlichen Burgwallanlage, die zwischen dem
      zehnten und zwölften Jahrhundert das Haff überwachte. Der Nationalpark umfasst sieben Totalreservate,
      davon sechs Waldgebiete, und deckt sich mit dem FFH-Gebiet «Ujście Odry i Zalew Szczeciński» sowie dem
      Vogelschutzgebiet «Wolin i Uznam».
    before: >-
      Informiere dich vorab über aktuelle Wegesperrungen und Schutzbestimmungen. Das Seebad Międzyzdroje weist
      in den Sommermonaten ein mäßiges Besucheraufkommen auf.
    around: >-
      Sechsundzwanzig Kilometer westlich liegt das [Valle del río Peene / Rewilding
      Peene](/lugar/rewilding-peene-valley-peenetal/). Weiter südwestlich teilt der [Parque Nacional
      Desembocadura del Warta](/lugar/park-narodowy-ujscie-warty/) mit Wolin Singschwan, Seeadler und weite
      Flussauen.
  it:
    intro: >-
      Ogni anno il Baltico erode circa 80 centimetri della costa di Wolin. Le falesie attive più elevate
      raggiungono 95 m di altezza: le onde ne scavano la base mentre faggete secolari si affacciano sui
      precipizi. È l'immagine distintiva del Parco Nazionale di Wolin, che tutela la porzione più selvaggia
      della maggiore isola polacca tra la baia di Pomerania e la laguna di Stettino. Sul suo stemma compaiono
      due simboli della costa: l'aquila di mare e la calcatreppola marittima (*mikołajek nadmorski*).


      Istituito nel 1960 e ampliato nel 1996 includendo acque marine, bacini lagunari e un arcipelago di isole
      costiere, costituisce il primo parco marino della Polonia: copre 10 937 ha ripartiti tra terraferma,
      mare e delta.
    landscape: >-
      Il territorio racchiude tre paesaggi. Il principale è una dorsale di colline moreniche terminali che
      occupa circa il 75 % della superficie del parco, culminando nei 115,9 m del monte Grzywacz. Il secondo è
      il delta retrogrado della Świna: decine di isolotti paludosi separati da canali labirintici dove la
      deposizione dei sedimenti genera continuamente nuove secche e bassifondi. Il terzo comparto, a est, è un
      comprensorio di laghi glaciali che comprende Warnowo, Czajcze, Domysłowskie, Zatorek e Wisełka.


      Le foreste occupano gran parte delle terre emerse. Il pino silvestre copre il 68 % della superficie
      terrestre, il faggio il 23 % e la farnia il 7 %, con un'età media ragguardevole di 130 anni. Le faggete
      costiere mantengono una struttura quasi vergine, ospitando nel sottobosco la paleo-erba uniflora,
      orchidee forestali e la dentaria bulbifera. Sulle scarpate i versanti franosi sono colonizzati da fitti
      cespuglieti di olivello spinoso; sulla battigia crescono la centonchia marina, la gramigna delle spiagge
      e il ravastrello marittimo, mentre nel delta prosperano circa 30 specie alofite tipiche delle barene
      salmastre.


      Sull'isola di Wolin vivono oltre 1300 specie di piante vascolari, circa 600 delle quali vegetano
      all'interno del parco.
    wildlife: >-
      Lungo Wolin transita la principale rotta migratoria avaria della costa baltica: nel parco si contano
      oltre 230 specie di uccelli censite. Le zone umide offrono quiete e nutrimento durante i passaggi
      primaverili e autunnali, rendendo il delta della Świna un'area ornitologica di rilievo europeo. Alla
      foce si osservano il fratino, l'aquila di mare e varie sterne; il pagliarolo rappresenta una specie
      prioritaria della rete Natura 2000, gravemente minacciata in Polonia e in Europa. L'aquila di mare
      nidifica stabilmente da oltre un secolo e l'ente parco promuove il ritorno riproduttivo del gufo reale.


      Nel settore marino la baia protegge specie pregiate come la foca grigia e la focena comune, oltre a
      foche comuni e foche anellate. Sulla terraferma vivono la lontra europea, il castoro, il vespertilio
      maggiore e il bisonte europeo. Tra gli invertebrati saproxilici si segnalano fiorenti popolazioni di
      cervo volante e cerambice della quercia.


      Da maggio a ottobre si gode del clima migliore. I flussi migratori rendono la primavera e l'autunno
      stagioni privilegiate per l'avvistamento.
    visit: >-
      Inizia dal Museo di Storia Naturale nel centro di Międzyzdroje, sulla collina Filaretów, dotato di
      giardino botanico e voliere con aquile di mare e gufi reali. Custodisce la più importante collezione
      polacca di maschi di combattente in livrea nuziale, forte di 130 esemplari. Il parco gestisce anche un
      recinto faunistico per bisonti vicino a Międzyzdroje e un punto informazioni a Zalesie, accanto a un
      bunker della Seconda Guerra Mondiale.


      Per camminare, il sentiero rosso si snoda per diciannove chilometri lungo le scogliere baltiche toccando
      il belvedere di Kawcza Góra. Quello blu conta ventisei chilometri, sfiora il lago Turkusowe e i punti
      panoramici di Piaskowa Góra e Zielonka, costeggiando la laguna di Stettino dove sostano gli uccelli
      acquatici. Il sentiero di Kawcza Góra unisce Żubrowisko a Międzyzdroje, mentre la via costiera collega
      Świnoujście, Międzyzdroje e Kołczewo. I punti panoramici attivi sono cinque: Gosań, Kawcza, Zielonka,
      Piaskowa Góra e Grodzisko Lubin, affiancati da due sentieri natura a Zatorek e Łuniewo.


      In sella alla bicicletta transitano le ciclovie internazionali R-10, anello attorno al Baltico, e R-66,
      periplo della laguna di Stettino.
    history: >-
      A Grodzisko Lubin sorgono i resti di un castelliere altomedievale attivo tra il decimo e il dodicesimo
      secolo, dominante la laguna. Il parco possiede sette riserve a tutela integrale, sei delle quali
      forestali, e coincide con il sito di interesse comunitario «Ujście Odry i Zalew Szczeciński» e con la
      zona di protezione speciale «Wolin i Uznam».
    before: >-
      Controlla gli avvisi dell'ente parco su sentieri e accessibilità prima di partire. La località turistica
      di Międzyzdroje registra un'affluenza media durante l'alta stagione estiva.
    around: >-
      A ventisei chilometri si incontra la [Valle del río Peene / Rewilding
      Peene](/lugar/rewilding-peene-valley-peenetal/). Più a sud-ovest, il [Parque Nacional Desembocadura del
      Warta](/lugar/park-narodowy-ujscie-warty/) condivide con Wolin cigni selvatici, aquile di mare e fertili
      acquitrini fluviali.
  pt:
    intro: >-
      Todos os anos o mar Báltico desgasta cerca de 80 centímetros da linha costeira de Wolin. As arribas
      ativas mais elevadas atingem 95 m de altura: o mar escava a base enquanto faiais seculares coroam o topo
      das vertentes. É a paisagem emblemática do Parque Nacional de Wolin, que resguarda a maior ilha da
      Polónia entre a baía da Pomerânia e a lagoa de Szczecin. No seu emblema figuram dois símbolos costeiros:
      a águia-rabalva e o cardo-marítimo (*mikołajek nadmorski*).


      Criado em 1960 e ampliado em 1996 com águas marinhas, bacias lagunares e um arquipélago de ilhas,
      consolidou-se como o primeiro parque marinho da Polónia: abrange 10 937 ha repartidos entre terra firme,
      mar e delta.
    landscape: >-
      O parque estrutura-se em três paisagens. A principal consiste num cordão de colinas de moreia terminal
      ocupando cerca de 75 % da área protegida, culminando no monte Grzywacz com 115,9 m. A segunda é o delta
      do Świna: dezenas de ilhotas pantanosas recortadas por canais meandriformes onde os processos de
      sedimentação permanecem dinâmicos, moldando baixios e bancos arenosos. A terceira unidade, a leste,
      acolhe um conjunto de lagos glaciares: Warnowo, Czajcze, Domysłowskie, Zatorek e Wisełka.


      A floresta domina grande parte do relevo terrestre. O pinheiro-silvestre representa 68 % da cobertura
      vegetal em terra, a faia 23 % e o carvalho-roble 7 %, acusando uma idade média de 130 anos. Os faiais
      costeiros evidenciam uma maturidade estrutural quase virgem, abrigando no sobcoberto a melica-uniflora,
      orquídeas bravias e a dentária-bulbífera. Nas arribas a vegetação pioneira forma espessos matagais de
      espinheiro-marítimo; no areal brotam a honquénia, o feno-das-praias e a eruca-marítima, enquanto no
      delta prosperam cerca de 30 espécies halófitas adaptadas a lodaçais salobros.


      Na ilha de Wolin catalogam-se mais de 1300 plantas vasculares, cerca de 600 das quais no interior do
      parque nacional.
    wildlife: >-
      Por Wolin passa a principal rota migratória de aves ao longo do litoral báltico, somando o parque mais
      de 230 espécies recenseadas. As zonas húmidas proporcionam tranquilidade e alimento durante as passagens
      de primavera e outono, consagrando o delta do Świna como área de importância internacional para as aves.
      Na foz avistam-se o borrelho-de-coleira-interrompida, a águia-rabalva e várias andorinhas-do-mar; a
      felosa-aquática é espécie prioritária da rede Natura 2000, altamente ameaçada na Polónia e na Europa. A
      águia-rabalva nidifica no maciço há mais de um século, ao passo que a gestão do parque incentiva a
      recolonização do bufo-real.


      No meio aquático, a baía oferece refúgio a mamíferos marinhos raros como a foca-cinzenta e o boto-comum,
      para além de focas-comuns e focas-aneladas. Em terra ocorrem a lontra-europeia, o castor-europeu, o
      morcego-rato-grande e o bisonte-europeu. Na entomofauna destacam-se contingentes vitais de vaca-loura e
      escaravelho-capricórnio.


      De maio a outubro desfruta-se da melhor época. A migração das aves recomenda uma viagem na primavera e
      no outono.
    visit: >-
      Começa pelo Museu de História Natural no centro de Międzyzdroje, na colina Filaretów, apetrechado com
      jardim botânico e aviários de águias-rabalvas e bufos-reais. Preserva a mais rica coleção taxidérmica da
      Polónia de machos de combatente em plumagem nupcial, totalizando 130 exemplares. O parque conta ainda
      com um cercado de demonstração de bisontes próximo de Międzyzdroje e um posto informativo em Zalesie,
      contíguo a um búnquer da Segunda Guerra Mundial.


      Para caminhar, o percurso vermelho percorre dezanove quilómetros pelas arribas da costa báltica e conduz
      ao miradouro de Kawcza Góra. O trilho azul soma vinte e seis quilómetros, passa pela lagoa Turkusowe e
      pelos miradouros de Piaskowa Góra e Zielonka, contornando a lagoa de Szczecin onde confluem aves
      aquáticas. O traçado de Kawcza Góra liga Żubrowisko a Międzyzdroje, e a rota costeira une Świnoujście,
      Międzyzdroje e Kołczewo. Há cinco miradouros ativos: Gosań, Kawcza, Zielonka, Piaskowa Góra e Grodzisko
      Lubin, acompanhados por dois trilhos interpretativos em Zatorek e Łuniewo.


      De bicicleta podes percorrer as rotas internacionais R-10, circuito do mar Báltico, e R-66, volta da
      lagoa de Szczecin.
    history: >-
      Em Grodzisko Lubin erguem-se vestígios de uma praça-forte altomedieval que vigiou a lagoa entre os
      séculos X e XII. O parque integra sete reservas de proteção estrita, seis das quais florestais, e
      sobrepõe-se ao sítio comunitário «Ujście Odry i Zalew Szczeciński» e à zona de proteção especial «Wolin
      i Uznam».
    before: >-
      Informa-te previamente sobre acessos e transitabilidade dos trilhos costeiros. A estância balnear de
      Międzyzdroje regista afluência média durante o auge do verão.
    around: >-
      A vinte e seis quilómetros estende-se o [Valle del río Peene / Rewilding
      Peene](/lugar/rewilding-peene-valley-peenetal/). Mais a sudoeste, o [Parque Nacional Desembocadura del
      Warta](/lugar/park-narodowy-ujscie-warty/) partilha com Wolin o cisne-bravo, a águia-rabalva e vastos
      paulais ribeirinhos.
