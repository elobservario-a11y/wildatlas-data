resumen:
  es: >-
    El mayor parque nacional británico: meseta subártica, restos del bosque caledoniano de pino silvestre y
    urogallo.
  en: >-
    Britain's largest national park: subarctic plateau, remnants of the ancient Caledonian pine forest, and
    capercaillie.
  fr: >-
    Le plus vaste parc national britannique : plateau subarctique, vestiges de la forêt calédonienne de pins
    et grand tétras.
  de: >-
    Der größte britische Nationalpark: subarktisches Hochplateau, Relikte des kaledonischen Kiefernurwalds und
    Auerhuhn.
  it: >-
    Il più esteso parco nazionale britannico: altopiano subartico, lembi della foresta caledone di pino
    silvestre e gallo cedrone.
  pt: >-
    O maior parque nacional britânico: planalto subártico, vestígios da floresta caledónica de
    pinheiro-silvestre e tetraz.
unico:
  es: >-
    Una meseta ártico-alpina con neveros que resisten el verano y, a sus pies, más de la mitad del bosque
    caledoniano que sobrevive en Escocia.
  en: >-
    An Arctic-alpine plateau holding snow patches that endure through summer, fronted below by over half of
    Scotland's surviving Caledonian pinewoods.
  fr: >-
    Un haut plateau arctico-alpin conservant des névés tout l'été et abritant à ses pieds plus de la moitié
    des pinèdes calédoniennes d'Écosse.
  de: >-
    Ein arktisch-alpines Hochplateau mit Schneefeldern, die den Sommer überdauern, und darunter mehr als die
    Hälfte des verbliebenen kaledonischen Urwalds Schottlands.
  it: >-
    Un altopiano artico-alpino con nevai che resistono all'estate e, ai suoi piedi, oltre la metà dell'antica
    foresta caledone di Scozia.
  pt: >-
    Um planalto árctico-alpino com neves perpétuas de verão e, no sopé, mais de metade dos pinhais caledónicos
    sobreviventes da Escócia.
observaciones:
  es: >-
    Para proteger la fauna sensible a las molestias hay que seguir las señales y llevar a los perros bien
    controlados y con correa cuando se pida. Hay normas nuevas que prohíben fuegos y barbacoas en todo el
    parque, y tras el incendio se cerraron el aparcamiento de Allt Mor y el sendero de Allt Mor hasta el de
    Sugarbowl y el puente de Utsi: comprueba en la web del parque si siguen cerrados. El parque recibe unos 2
    millones de visitantes al año y los derechos de acceso de Escocia se rigen por el Scottish Outdoor Access
    Code.


    Para reducir la erosión, el funicular de Cairn Gorm solo deja salir de la estación alta a los esquiadores
    en temporada; el resto de visitantes solo puede subir a la montaña con una excursión guiada.
texto:
  es:
    intro: >-
      Desde Aviemore, en una tarde clara, los canchales de granito del Lairig Ghru y del Braeriach se
      encienden en un rojo cálido. No es casualidad: el nombre gaélico de esta cordillera es Am Monadh Ruadh,
      «las colinas rojas». Esas colinas son el corazón del Parque Nacional de los Cairngorms, el mayor del
      Reino Unido, con 4.528 km² repartidos en cinco concejos escoceses. Se estableció en 2003, en el noreste
      de Escocia, y en 2010 se amplió a Perth and Kinross.
    landscape: >-
      Los Cairngorms no son picos afilados sino una cordillera de altiplano: tres mesetas principales a unos
      1000–1200 m, sobre las que se alzan cumbres redondeadas, restos erosionados de montañas mucho más altas,
      hasta unos 1300 m. Muchas tienen tors, afloramientos de roca sueltos sobre un paisaje de bloques, y los
      bordes de las mesetas son en parte acantilados de granito. El granito que forma los propios Cairngorms
      se emplazó hace unos 427 millones de años, y las glaciaciones de los últimos 2,5 millones de años
      hicieron el resto, con rasgos de erosión y de depósito.


      Arriba, el ambiente es ártico-alpino, parecido a la tundra. No hay glaciares, pero puede nevar en
      cualquier mes y los neveros suelen durar todo el verano; es la zona más fiable de Gran Bretaña para
      escalar en nieve y hielo. Entre las mesetas, pasos como el Lairig Ghru, cuya cima está a 835 m en las
      Pools of Dee, donde el agua puede estar helada incluso a mitad de verano.


      Abajo, otra escena. Tres grandes ríos nacen en el parque: el Spey, el Dee y el Don; el Spey, segundo río
      más largo de Escocia, nace en los Monadhliath. Las marismas de Insh, en el alto Strathspey, forman una
      de las mayores extensiones de turbera de llanura inundable y fen de Escocia. Y en las vegas y valles se
      esconde el bosque caledoniano: el pinar que se extiende de Glen Feshie a Abernethy es su mayor extensión
      continua.
    wildlife: >-
      Mayo y junio son para las aves. En las mesetas crían la [perdiz nival](/especie/lagopus_muta/), el
      chorlito carambolo, el escribano nival y el [águila real](/especie/aquila_chrysaetos/). En los bosques
      viven el [urogallo](/especie/tetrao_urogallus/), el [gallo lira](/especie/tetrao_tetrix/), el
      [piquituerto escocés](/especie/loxia_scotica/) y el herrerillo capuchino, y en el pinar de Abernethy hay
      además ardilla roja, gato montés escocés, ciervo y [águila pescadora](/especie/pandion_haliaetus/), con
      una arena de cortejo del urogallo.


      En las marismas de Insh, en verano, crían el águila pescadora y los limícolas; en invierno llegan
      ánsares del Ártico y hasta 200 cisnes cantores. La liebre ártica y el ciervo comparten la meseta con el
      único rebaño de renos semidomésticos de las islas británicas. Llegó en 1952 con un pastor sueco y hoy
      ronda los 150 animales. Y el río Dee, entero, es zona especial de conservación por el salmón atlántico,
      la nutria euroasiática y el mejillón perlero.


      Septiembre es la época de la berrea del ciervo, y las estaciones cambian además lo que se puede hacer:
      la nieve cierra y abre rutas, y en los centros de Spittal of Glen Muick muestran cada día el pronóstico
      del tiempo y, en invierno, el de aludes.
    visit: >-
      Con 55 munros, montañas de más de 3.000 pies, el parque invita a caminar, pero no hace falta subir a las
      cumbres: hay más de 100 senderos locales, todos graduados como fáciles, moderados o exigentes, y muchos
      están balizados. Dos de las Great Trails de Escocia lo atraviesan: el Speyside Way y el Cateran Trail.
      Para pedalear y remar, el parque es también un destino habitual de bicicleta y de canoa.


      Los centros cuentan el territorio. El de Glenmore, pasado Loch Morlich, orienta sobre los senderos del
      bosque. En el Loch Garten Nature Centre, entre el pinar caledonio, hay información sobre la reserva y
      una zona de observación de fauna. En Nethy Bridge, el centro de la reserva de Abernethy lo lleva el
      grupo comunitario Explore Abernethy y es el punto de partida de una red de paseos. El centro Burn O'Vat
      es la base ideal para caminar por el bosque alrededor de Loch Kinord, en Muir of Dinnet, y la base de
      Glen Doll informa de fauna, botánica y paisajes de los Angus Glens y es punto de partida hacia Corrie
      Fee y varios munros.


      Para el cielo, Tomintoul y Glenlivet se presentan como uno de los parques de cielo oscuro más
      septentrionales del mundo.
    history: >-
      Fue el segundo parque nacional de Escocia, tras el de Loch Lomond y los Trossachs. Hoy hay nueve
      reservas naturales nacionales dentro del parque: Abernethy, Corrie Fee, Craigellachie, Glen Tanar, Insh
      Marshes, Muir of Dinnet, Invereshie e Inshriach, Glenmore y Mar Lodge Estate.


      En Abernethy hay unas 4000 ha de bosque, y algo menos de la mitad es pinar caledonio autóctono. La RSPB
      planta 60 000 álamos temblones, abedules, enebros y sauces en unas 590 ha para ampliarlo y, para
      aumentar la madera muerta, voló con explosivos las copas de nueve pinos de entre 100 y 200 años. En 2015
      se retiraron 53 km de una línea eléctrica de 132 kV en el centro del parque. Y en 2026 un gran incendio
      dañó unos 25 km² en la zona de Glenmore y Abernethy.
    before: >-
      Para proteger la fauna sensible a las molestias hay que seguir las señales y llevar a los perros bien
      controlados y con correa cuando se pida. Hay normas nuevas que prohíben fuegos y barbacoas en todo el
      parque, y tras el incendio se cerraron el aparcamiento de Allt Mor y el sendero de Allt Mor hasta el de
      Sugarbowl y el puente de Utsi: comprueba en la web del parque si siguen cerrados. El parque recibe unos
      2 millones de visitantes al año y los derechos de acceso de Escocia se rigen por el Scottish Outdoor
      Access Code.


      Para reducir la erosión, el funicular de Cairn Gorm solo deja salir de la estación alta a los
      esquiadores en temporada; el resto de visitantes solo puede subir a la montaña con una excursión guiada.
    around: >-
      Lejos de los Cairngorms, otros lugares de montaña comparten sus aves de altura. El [Pallas-Yllästunturi
      National Park](/lugar/pallas-yllastunturi-national-park/) tiene chorlito carambolo y perdiz nival, como
      la meseta escocesa. El [Parc Nacional d'Aigüestortes i Estany de Sant
      Maurici](/lugar/parc-nacional-d-aiguestortes-i-estany-de-sant-maurici/) y [Totes Gebirge - Karst
      Desert](/lugar/totes-gebirge---karst-desert/) comparten perdiz nival, urogallo y águila real, y
      [Vindelfjällens naturreservat](/lugar/vindelfjallens-naturreservat/) comparte perdiz nival y águila
      real.
  en:
    intro: >-
      From Aviemore on a clear evening, the granite screes of the Lairig Ghru and Braeriach glow a warm, deep
      amber. That is no accident: the Gaelic name for this massif is Am Monadh Ruadh, "the Red Hills". Those
      hills form the high core of Cairngorms National Park, the largest in the United Kingdom, encompassing
      4,528 km² across five Scottish council areas. It was established in 2003 in north-eastern Scotland, and
      extended into Perth and Kinross in 2010.
    landscape: >-
      The Cairngorms are not sharp spires but an expansive upland range: three main plateaux situated around
      1000–1200 m, above which rise rounded domes—eroded stumps of far taller ancestral mountains—climbing up
      to roughly 1300 m. Many crests bear weathered granite tors perched atop boulder-fields, while the
      plateau edges plunge in sheer granite precipices. The plutonic granite of the Cairngorms was emplaced
      some 427 million years ago, and glaciations over the past 2.5 million years completed the relief through
      scouring corries and morainic deposits.


      On the heights, the environment is Arctic-alpine, closely resembling arctic tundra. There are no
      glaciers, but snow can fall in any month of the year and semi-permanent snowbeds frequently survive the
      summer; it is Britain's most reliable winter climbing ground. Between the plateaux cut ancient passes
      like the Lairig Ghru, summiting at 835 m at the Pools of Dee, where water can remain icy even in
      midsummer.


      Below, the scene changes utterly. Three major salmon rivers rise within the park: the Spey, the Dee, and
      the Don; the Spey, Scotland's second-longest river, originates in the Monadhliath. Insh Marshes in upper
      Strathspey represents one of the largest floodplain fen and mire systems in Scotland. In the glens hides
      the ancient Caledonian forest: the Scots pinewood sweeping from Glen Feshie to Abernethy is its largest
      unbroken tract.
    wildlife: >-
      May and June belong to the birds. Across the high plateaux breed [rock
      ptarmigan](/especie/lagopus_muta/), Eurasian dotterel, snow bunting, and [golden
      eagle](/especie/aquila_chrysaetos/). In the ancient woods live [western
      capercaillie](/especie/tetrao_urogallus/), [black grouse](/especie/tetrao_tetrix/), [Scottish
      crossbill](/especie/loxia_scotica/), and crested tit, while the Abernethy pinewood also shelters red
      squirrel, Scottish wildcat, red deer, and breeding [osprey](/especie/pandion_haliaetus/), alongside
      traditional capercaillie display leks.


      At Insh Marshes, summer brings nesting ospreys and breeding waders; in winter wild Arctic geese arrive
      alongside up to 200 whooper swans. Mountain hares and red deer share the plateau with Britain's only
      free-ranging herd of semi-domestic reindeer. Introduced in 1952 by a Swedish Sámi herdsman, the herd
      today numbers around 150 animals. The entire River Dee is designated a Special Area of Conservation for
      Atlantic salmon, Eurasian otter, and freshwater pearl mussel.


      September is the season of the red deer rut, and shifting seasons govern mountain travel: winter
      snowdrifts close and reopen high passes, and visitor centres like the Spittal of Glen Muick display
      daily weather bulletins and winter avalanche forecasts.
    visit: >-
      With 55 munros—mountains rising over 3,000 feet—the park is a hillwalker's paradise, yet tackling peaks
      is never obligatory: over 100 local paths, graded easy, moderate, or strenuous, wind through lower
      country, many clearly signposted. Two of Scotland's Great Trails cross the park: the Speyside Way and
      the Cateran Trail. Cycling, gravel biking, and open canoeing are equally popular.


      Visitor centres open windows onto the terrain. The Glenmore visitor centre beyond Loch Morlich advises
      on forest trails. At Loch Garten Nature Centre, nestled in the ancient pine, exhibits interpret the
      reserve beside wildlife observation hides. In Nethy Bridge, the Abernethy National Nature Reserve centre
      is operated by community group Explore Abernethy as a gateway to local walks. The Burn O'Vat centre in
      Muir of Dinnet provides an ideal base for walking around Loch Kinord, while the Glen Doll ranger base
      interprets the flora and geology of the Angus Glens and serves as trailhead for Corrie Fee and
      surrounding munros.


      Looking upward, Tomintoul and Glenlivet is accredited as one of the world's northernmost Dark Sky Parks.
    history: >-
      It was the second national park established in Scotland, following Loch Lomond and The Trossachs. Today
      nine National Nature Reserves lie within its bounds: Abernethy, Corrie Fee, Craigellachie, Glen Tanar,
      Insh Marshes, Muir of Dinnet, Invereshie and Inshriach, Glenmore, and Mar Lodge Estate.


      Abernethy encompasses some 4000 ha of woodland, just under half of which is ancient semi-natural
      Caledonian pinewood. The RSPB is planting 60,000 native aspens, birches, junipers, and sallows across
      some 590 ha to restore tree-line scrub, and experimentally blasted the crowns of nine pines aged 100 to
      200 years to mimic dead wood veterans. In 2015, some 53 km of overhead 132 kV power lines were
      dismantled in the park's heart. In 2026, a severe wildfire scorched approximately 25 km² in the Glenmore
      and Abernethy area.
    before: >-
      To protect ground-nesting birds and sensitive woodland fauna, follow signposts and keep dogs under close
      control on leads where requested. Strict park-wide bylaws prohibit open campfires and disposable
      barbecues, and following the wildfire, the Allt Mor car park and the trail from Allt Mor to Sugarbowl
      and Utsi's Bridge were closed: verify current status on the park website. The park receives some 2
      million visitors annually, and access rights are governed by the Scottish Outdoor Access Code.


      To limit summit erosion, the Cairn Gorm Mountain funicular railway strictly confines skiers to the upper
      slopes in season; non-skiers may only venture beyond the top station on designated guided excursions.
    around: >-
      Far from the Cairngorms, other arctic-alpine regions share its specialised birdlife.
      [Pallas-Yllästunturi National Park](/lugar/pallas-yllastunturi-national-park/) harbours dotterel and
      ptarmigan identical to the Scottish plateau. [Parc Nacional d'Aigüestortes i Estany de Sant
      Maurici](/lugar/parc-nacional-d-aiguestortes-i-estany-de-sant-maurici/) and [Totes Gebirge - Karst
      Desert](/lugar/totes-gebirge---karst-desert/) share rock ptarmigan, western capercaillie, and golden
      eagle, while [Vindelfjällens naturreservat](/lugar/vindelfjallens-naturreservat/) shares rock ptarmigan
      and golden eagle.
  fr:
    intro: >-
      Depuis Aviemore, par temps clair au crépuscule, les éboulis granitiques du Lairig Ghru et du Braeriach
      s'embrasent d'une lueur ocre rouge. Ce n'est point un hasard : le nom gaélique de ce massif est Am
      Monadh Ruadh, « les collines rouges ». Ces hauteurs constituent le cœur du parc national des Cairngorms,
      le plus étendu du Royaume-Uni avec ses 4 528 km² répartis sur cinq comtés écossais. Établi en 2003 dans
      le nord-est de l'Écosse, il a été agrandi en 2010 pour intégrer le Perth and Kinross.
    landscape: >-
      Les Cairngorms ne dressent pas d'aiguilles acérées mais forment un massif d'altitude tabulaire : trois
      hauts plateaux principaux étagés entre 1000 et 1200 m, surmontés de dômes arrondis érodés culminant
      jusqu'à environ 1300 m. Plusieurs sommets arborent des tors, empilements de blocs de granit déchaussés
      par le gel, tandis que les rebords du plateau plongent en falaises abruptes. Le granit des Cairngorms
      s'est mis en place il y a environ 427 millions d'années, et les glaciations des derniers 2,5 millions
      d'années ont parachevé le relief par creusement de cirques et dépôts morainiques.


      En altitude règne une ambiance arctico-alpine proche de la toundra. Il n'y a pas de glaciers, mais la
      neige peut tomber en tout mois et certains névés persistent l'été entier ; c'est le site d'escalade
      hivernale sur neige et glace le plus régulier de Grande-Bretagne. Entre les plateaux s'ouvrent de
      profondes brèches comme le Lairig Ghru, dont le col s'élève à 835 m aux Pools of Dee, où l'eau reste
      glacée même au cœur de l'été.


      En contrebas, le paysage change d'âme. Trois grands fleuves à saumon naissent dans le parc : la Spey, la
      Dee et le Don ; la Spey, deuxième plus long cours d'eau d'Écosse, prend sa source dans les Monadhliath.
      Les marais d'Insh Marshes, dans le haut Strathspey, forment l'un des plus vastes ensembles de tourbières
      et fens inondables d'Écosse. Et dans les vallées se tapit l'antique forêt calédonienne : la pinède
      s'étirant de Glen Feshie à Abernethy en forme le plus vaste massif d'un seul tenant.
    wildlife: >-
      Mai et juin appartiennent aux oiseaux. Sur les hauts plateaux nichent le [lagopède
      alpin](/especie/lagopus_muta/), le pluvier guignard, le plectrophane des neiges et l'[aigle
      royal](/especie/aquila_chrysaetos/). Dans les vieilles forêts vivent le [grand
      tétras](/especie/tetrao_urogallus/), le [tétras lyre](/especie/tetrao_tetrix/), le [bec-croisé
      d'Écosse](/especie/loxia_scotica/) et la mésange huppée, tandis que la pinède d'Abernethy abrite
      également écureuil roux, chat sauvage d'Écosse, cerf élaphe et le [balbuzard
      pêcheur](/especie/pandion_haliaetus/), avec des arènes de parade du grand tétras.


      Dans les marais d'Insh, l'été voit nicher le balbuzard pêcheur et les limicoles ; en hiver arrivent les
      oies sauvages de l'Arctique et jusqu'à 200 cygnes chanteurs. Le lièvre variable et le cerf partagent le
      plateau avec l'unique harde de rennes semidomestiques des îles Britanniques. Introduite en 1952 par un
      éleveur sami suédois, elle compte aujourd'hui près de 150 têtes. La rivière Dee tout entière est classée
      zone spéciale de conservation pour le saumon atlantique, la loutre d'Europe et la moule perlière d'eau
      douce.


      Septembre résonne du brame du cerf, et le cycle des saisons dicte les parcours de montagne : les
      tourmentes ferment ou ouvrent les cols, et les chalets d'accueil comme Spittal of Glen Muick affichent
      quotidiennement météo locale et risques d'avalanche.
    visit: >-
      Avec 55 munros — sommets dépassant 3 000 pieds —, le parc comble les marcheurs, mais nul besoin
      d'affronter les crêtes : plus de 100 sentiers locaux jalonnés, classés faciles, modérés ou ardus,
      sillonnent le piémont. Deux des Great Trails d'Écosse traversent le territoire : le Speyside Way et le
      Cateran Trail. Le vélo, le gravel et le canoë constituent également des activités très prisées.


      Les maisons du parc racontent le pays. Celle de Glenmore, au-delà du Loch Morlich, oriente sur les
      pistes forestières. Au Loch Garten Nature Centre, sous la futaie calédonienne, des observatoires et
      expositions dévoilent la vie sauvage. À Nethy Bridge, l'espace de la réserve d'Abernethy, géré par le
      collectif local Explore Abernethy, ouvre sur un réseau de balades. Le centre de Burn O'Vat à Muir of
      Dinnet est le point de départ idéal pour contourner le Loch Kinord, tandis que la base de Glen Doll
      informe sur la faune des Angus Glens et donne accès au Corrie Fee et aux munros voisins.


      La nuit, le secteur de Tomintoul et Glenlivet est homologué comme l'un des parcs de ciel étoilé les plus
      septentrionaux au monde.
    history: >-
      Ce fut le deuxième parc national créé en Écosse, après celui du Loch Lomond et des Trossachs. Neuf
      réserves naturelles nationales s'inscrivent aujourd'hui dans son périmètre : Abernethy, Corrie Fee,
      Craigellachie, Glen Tanar, Insh Marshes, Muir of Dinnet, Invereshie et Inshriach, Glenmore et Mar Lodge
      Estate.


      À Abernethy s'étendent quelque 4000 ha de forêt, dont un peu moins de la moitié en vieille pinède
      calédonienne indigène. La RSPB y plante 60 000 trembles, bouleaux, genévriers et saules sur environ 590
      ha pour restaurer la limite des arbres, et a étêté à l'explosif les cimes de neuf pins de 100 à 200 ans
      pour recréer du bois mort sur pied. En 2015, quelque 53 km d'une ligne électrique de 132 kV ont été
      démantelés au cœur du massif. Et en 2026, un grand incendie a dévasté environ 25 km² dans le secteur de
      Glenmore et Abernethy.
    before: >-
      Afin de préserver les espèces vulnérables nichant au sol, respectez les sentiers et tenez impérativement
      les chiens sous contrôle et en laisse lorsque demandé. De stricts arrêtés interdisent feux ouverts et
      barbecues dans tout le parc, et à la suite du feu de forêt, le parking d'Allt Mor et le chemin vers
      Sugarbowl et le pont d'Utsi ont été fermés : vérifiez leur réouverture sur le site web du parc. Le
      massif enregistre environ 2 millions de visiteurs par an, et l'accès s'exerce conformément au Scottish
      Outdoor Access Code.


      Pour limiter l'érosion sommitale, le funiculaire de Cairn Gorm ne permet aux passagers de sortir de la
      gare supérieure qu'en saison de ski ; les autres visiteurs ne peuvent accéder à la crête qu'encadrés par
      une visite guidée.
    around: >-
      Loin des Cairngorms, d'autres terres d'altitude abritent la même faune spécialisée. Le
      [Pallas-Yllästunturi National Park](/lugar/pallas-yllastunturi-national-park/) accueille pluvier
      guignard et lagopède alpin comme le haut plateau écossais. Le [Parc Nacional d'Aigüestortes i Estany de
      Sant Maurici](/lugar/parc-nacional-d-aiguestortes-i-estany-de-sant-maurici/) et le [Totes Gebirge -
      Karst Desert](/lugar/totes-gebirge---karst-desert/) partagent le lagopède alpin, le grand tétras et
      l'aigle royal, tandis que la [Vindelfjällens naturreservat](/lugar/vindelfjallens-naturreservat/)
      partage lagopède alpin et aigle royal.
  de:
    intro: >-
      Von Aviemore aus leuchten an einem klaren Abend die Granitschutthalden des Lairig Ghru und des Braeriach
      in warmem Rot. Kein Zufall: Der gälische Name dieses Gebirges lautet Am Monadh Ruadh, „die roten Berge“.
      Diese Höhen bilden das Herzstück des Cairngorms-Nationalparks, des größten des Vereinigten Königreichs,
      der 4.528 km² über fünf schottische Verwaltungsbezirke umfasst. Er wurde 2003 im Nordosten Schottlands
      gegründet und 2010 um Teile von Perth and Kinross erweitert.
    landscape: >-
      Die Cairngorms sind keine schroffen Zacken, sondern ein weitläufiges Tafelland: drei Hauptplateaus auf
      etwa 1000–1200 m, über die sich runde Kuppen – erodierte Reste weit höherer Vorzeitberge – bis auf rund
      1300 m erheben. Viele tragen markante Granittors auf ausgedehnten Blockmeeren, während die Ränder des
      Hochplateaus in steile Granitwände abfallen. Der Granit der Cairngorms drang vor rund 427 Millionen
      Jahren in die Erdkruste ein, und die Eiszeiten der letzten 2,5 Millionen Jahre formten den Rest mit
      Karen und Moränenablagerungen.


      Auf den Höhen herrscht arktisch-alpines Klima ähnlich der Tundra. Es gibt keine Gletscher, aber Schnee
      kann in jedem Sommermonat fallen, und Altschneefelder überstehen oft das ganze Jahr; es ist das
      schneesicherste Winterklettergebiet Großbritanniens. Zwischen den Plateaus schneiden Pässe wie der
      Lairig Ghru ein, dessen Scheitelpunkt bei 835 m an den Pools of Dee liegt, wo das Wasser selbst im
      Hochsommer eiskalt bleibt.


      Unten im Tal zeigt sich ein ganz anderes Bild. Drei große Lachsflüsse entspringen im Park: Spey, Dee und
      Don; der Spey, Schottlands zweitlängster Fluss, entspringt in den Monadhliath. Die Insh Marshes im
      oberen Strathspey bilden eines der größten Überschwemmungsmoore Schottlands. Und in den Tälern verbirgt
      sich der kaledonische Urwald: Der Kiefernwald von Glen Feshie bis Abernethy ist sein größter
      zusammenhängender Rest.
    wildlife: >-
      Mai und Juni gehören den Vögeln. Auf den Plateaus brüten [Alpenschneehuhn](/especie/lagopus_muta/),
      Mornellregenpfeifer, Schneeammer und [Steinadler](/especie/aquila_chrysaetos/). In den alten Wäldern
      leben [Auerhuhn](/especie/tetrao_urogallus/), [Birkhuhn](/especie/tetrao_tetrix/), [Schottischer
      Kreuzschnabel](/especie/loxia_scotica/) und Haubenmeise, und der Kiefernwald von Abernethy beherbergt
      zudem Eichhörnchen, Europäische Wildkatze, Rothirsch und [Fischadler](/especie/pandion_haliaetus/) samt
      traditionellen Balzplätzen des Auerhahns.


      In den Feuchtgebieten der Insh Marshes brüten im Sommer Fischadler und Watvögel; im Winter rasten
      arktische Wildgänse und bis zu 200 Singschwäne. Schneehase und Rothirsch teilen sich das Hochplateau mit
      der einzigen freilebenden Herde halbzahmer Rentiere der Britischen Inseln. Sie wurde 1952 von einem
      schwedischen Samen eingeführt und umfasst heute rund 150 Tiere. Der gesamte Fluss Dee ist als FFH-Gebiet
      für Atlantischen Lachs, Fischotter und Flussperlmuschel ausgewiesen.


      Im September ertönt die Brunft der Rothirsche, und der Jahreszeitenwechsel bestimmt die Tourenplanung:
      Winterstürme sperren Routen, und Besucherzentren wie Spittal of Glen Muick informieren täglich über
      Wetter und Lawinengefahr.
    visit: >-
      Mit 55 Munros – Bergen über 3.000 Fuß Höhe – lockt der Park Bergwanderer, doch niemand muss zwingend auf
      die Grate: Über 100 markierte Wege aller Schwierigkeitsgrade führen durch das Vorland. Zwei der Great
      Trails Schottlands queren das Gebiet: der Speyside Way und der Cateran Trail. Auch für Radfahrer,
      Gravelbiker und Kanuten ist der Park ein erstklassiges Revier.


      Die Besucherzentren vermitteln die Besonderheiten der Landschaft. Jenes in Glenmore jenseits des Loch
      Morlich informiert über Waldrouten. Im Loch Garten Nature Centre inmitten des alten Kiefernwaldes geben
      Beobachtungsstände und Ausstellungen Einblick in die Vogelwelt. In Nethy Bridge dient das von der
      Bürgerinitiative Explore Abernethy geführte Zentrum als Tor zum Abernethy-Reservat. Das
      Burn-O'Vat-Zentrum in Muir of Dinnet erschließt Rundwege um den Loch Kinord, während der Stützpunkt in
      Glen Doll über die Angus Glens informiert und Ausgangspunkt für Corrie Fee und umliegende Munros ist.


      Nachts gilt das Gebiet von Tomintoul und Glenlivet als einer der nördlichsten zertifizierten Dark Sky
      Parks der Erde.
    history: >-
      Er war nach Loch Lomond and The Trossachs der zweite Nationalpark Schottlands. Heute liegen neun
      Nationale Naturreservate im Schutzgebiet: Abernethy, Corrie Fee, Craigellachie, Glen Tanar, Insh
      Marshes, Muir of Dinnet, Invereshie und Inshriach, Glenmore sowie Mar Lodge Estate.


      In Abernethy wachsen rund 4000 ha Wald, davon knapp die Hälfte ursprünglicher kaledonischer Kiefernwald.
      Die Vogelschutzorganisation RSPB pflanzt auf rund 590 ha 60.000 Zitterpappeln, Birken, Wacholder und
      Weiden zur Hebung der Waldgrenze und sprengte experimentell die Wipfel von neun Alt-Kiefern im Alter von
      100 bis 200 Jahren, um Totholzhabitate zu simulieren. Im Jahr 2015 wurden 53 km einer 132-kV-Freileitung
      mitten im Park rückgebaut. Im Jahr 2026 verwüstete ein großer Waldbrand rund 25 km² im Gebiet von
      Glenmore und Abernethy.
    before: >-
      Zum Schutz bodenbrütender Vögel und sensibler Waldtiere folge den Wegen und halte Hunde wo
      vorgeschrieben strikt an der Leine. Es gelten strenge Verbote für offenes Feuer und Einweggrills im
      gesamten Park, und nach dem Brand wurden der Parkplatz Allt Mor sowie der Weg nach Sugarbowl und zur
      Utsi-Brücke gesperrt: Prüfe den aktuellen Status auf der Park-Website. Rund 2 Millionen Besucher kommen
      jährlich, und das freie Betretungsrecht richtet sich nach dem Scottish Outdoor Access Code.


      Um die Erosion der empfindlichen Gipfelflur einzudämmen, dürfen Fahrgäste der Cairngorm-Standseilbahn
      die Bergstation in der Saison nur zum Skifahren verlassen; alle übrigen Besucher dürfen den
      Gipfelbereich nur im Rahmen geführter Touren betreten.
    around: >-
      Weit abseits der Cairngorms teilen andere alpine Gebiete diese arktische Vogelwelt. Der
      [Pallas-Yllästunturi National Park](/lugar/pallas-yllastunturi-national-park/) beherbergt
      Mornellregenpfeifer und Alpenschneehuhn wie das schottische Hochplateau. Der [Parc Nacional
      d'Aigüestortes i Estany de Sant Maurici](/lugar/parc-nacional-d-aiguestortes-i-estany-de-sant-maurici/)
      und das [Totes Gebirge - Karst Desert](/lugar/totes-gebirge---karst-desert/) teilen Alpenschneehuhn,
      Auerhuhn und Steinadler, während das [Naturreservat Vindelfjällen](/lugar/vindelfjallens-naturreservat/)
      Schneehuhn und Steinadler teilt.
  it:
    intro: >-
      Da Aviemore, in una limpida serata, le pietraie di granito del Lairig Ghru e del Braeriach si accendono
      di un rosso ardente. Non è un caso: il nome gaelico di questo massiccio è Am Monadh Ruadh, «le colline
      rosse». Quei rilievi costituiscono il nucleo del Parco Nazionale dei Cairngorms, il più vasto del Regno
      Unito, con i suoi 4.528 km² estesi su cinque contee scozzesi. Fu istituito nel 2003 nel nord-est della
      Scozia e ampliato nel 2010 per includere territori di Perth and Kinross.
    landscape: >-
      I Cairngorms non sfoggiano creste aguzze ma costituiscono un massiccio altopiano: tre pianori principali
      sospesi a circa 1000–1200 m, sormontati da cupole arrotondate modellate dall'erosione che salgono fino a
      circa 1300 m. Molte sommità presentano tors, monoliti granitici isolati tra coltri di blocchi morenici,
      mentre i margini precipitano in pareti a strapiombo. Il granito dei Cairngorms si è formato circa 427
      milioni di anni fa, e le glaciazioni degli ultimi 2,5 milioni di anni hanno completato l'opera scavando
      circhi e colmando morene.


      Lassù il clima è artico-alpino, affine alla tundra. Non vi sono ghiacciai attivi, ma può nevicare in
      qualsiasi mese estivo e i nevai residui durano spesso tutta la stagione; è la palestra di arrampicata
      invernale su neve e ghiaccio più costante della Gran Bretagna. Tra i pianori si aprono gole glaciali
      come il Lairig Ghru, che tocca il culmine a 835 m presso le Pools of Dee, dove l'acqua gela persino in
      piena estate.


      In basso lo scenario cambia radicalmente. Tre grandi fiumi da salmone nascono nel parco: lo Spey, il Dee
      e il Don; lo Spey, secondo fiume di Scozia, scaturisce dai monti Monadhliath. Le paludi di Insh Marshes
      nell'alto Strathspey compongono una delle maggiori torbiere basse alluvionali di Scozia. E nelle valli
      si annida l'antica foresta caledone: la pineta che corre da Glen Feshie ad Abernethy è la più vasta
      superficie ininterrotta rimasta.
    wildlife: >-
      Maggio e giugno sono i mesi dell'avifauna. Sugli altopiani nidificano la [pernice
      bianca](/especie/lagopus_muta/), il piviere tortolino, lo zigolo delle nevi e l'[aquila
      reale](/especie/aquila_chrysaetos/). Nei boschi allignano il [gallo
      cedrone](/especie/tetrao_urogallus/), il [fagiano di monte](/especie/tetrao_tetrix/), il [crociere
      scozzese](/especie/loxia_scotica/) e la cincia dal ciuffo, e la pineta di Abernethy accoglie inoltre
      scoiattoli rossi, gatti selvatici scozzesi, cervi nobili e il [falco
      pescatore](/especie/pandion_haliaetus/), con le storiche arene di parata del cedrone.


      Nelle paludi di Insh, d'estate nidificano il falco pescatore e i trampolieri; d'inverno giungono oche
      artiche e fino a 200 cigni selvatici. La lepre bianca e il cervo condividono l'altopiano con l'unica
      mandria semidomestica di renne delle isole britanniche. Introdotta nel 1952 da un pastore sami svedese,
      conta oggi circa 150 esemplari. L'intero corso del fiume Dee è zona speciale di conservazione per
      salmone atlantico, lontra e perna d'acqua dolce.


      A settembre risuona il bramito del cervo, e l'inverno ridisegna la viabilità: la neve chiude e riapre i
      valichi, e nei centri come Spittal of Glen Muick si espongono bollettini meteo e rischio valanghe.
    visit: >-
      Con 55 munros — vette superiori a 3.000 piedi —, il parco è una meta classica dell'escursionismo, ma non
      occorre salire in quota: vi sono oltre 100 sentieri locali di ogni difficoltà, molti dei quali
      segnalati. Due dei Great Trails scozzesi lo attraversano: lo Speyside Way e il Cateran Trail. Anche la
      bicicletta, il gravel e la canoa sono praticatissimi.


      I centri visite illustrano il territorio. Quello di Glenmore, oltre Loch Morlich, guida lungo i
      tracciati forestali. Al Loch Garten Nature Centre, immerso nei pini vetusti, capanni di osservazione
      mostrano la fauna della riserva. A Nethy Bridge, il centro di Abernethy è curato dall'associazione
      civica Explore Abernethy come punto di partenza per passeggiate. Il centro Burn O'Vat a Muir of Dinnet
      costituisce la base per camminare intorno a Loch Kinord, mentre Glen Doll descrive la geologia degli
      Angus Glens ed è la base per Corrie Fee e vari munros.


      Di notte, Tomintoul e Glenlivet è accreditato come uno dei parchi delle stelle più settentrionali al
      mondo.
    history: >-
      È stato il secondo parco nazionale istituito in Scozia dopo Loch Lomond and The Trossachs. Oggi nove
      riserve naturali nazionali ricadono nei suoi confini: Abernethy, Corrie Fee, Craigellachie, Glen Tanar,
      Insh Marshes, Muir of Dinnet, Invereshie e Inshriach, Glenmore e Mar Lodge Estate.


      Ad Abernethy vegetano circa 4000 ha di bosco, di cui quasi la metà è pineta caledone autoctona. La RSPB
      vi pianta 60 000 pioppi tremuli, betulle, ginepri e salici su circa 590 ha per innalzare il limite del
      bosco, e ha fatto saltare con cariche le chiome di nove pini tra 100 e 200 anni per accelerare la
      creazione di legno morto. Nel 2015 sono stati smantellati 53 km di elettrodotto aereo da 132 kV nel
      cuore del parco. Nel 2026 un esteso rogo ha percorso circa 25 km² tra Glenmore e Abernethy.
    before: >-
      Per tutelare la fauna nidificante al suolo rispetta i segnali e tieni i cani rigorosamente al guinzaglio
      quando prescritto. Nuove norme vietano fuochi liberi e barbecue nell'intero comprensorio, e in seguito
      all'incendio il parcheggio di Allt Mor e il tracciato per Sugarbowl e il ponte di Utsi sono stati
      chiusi: verifica lo stato aggiornato sul sito web. Il parco registra circa 2 milioni di presenze annue e
      l'accesso è disciplinato dallo Scottish Outdoor Access Code.


      Per contenere il calpestio sommitale, la funicolare di Cairn Gorm consente di lasciare la stazione
      superiore solo agli sciatori in inverno; gli altri escursionisti possono accedere alla cima solo
      accompagnati da guide.
    around: >-
      Lontano dai Cairngorms, altri rilievi custodiscono la medesima avifauna d'alta quota. Il
      [Pallas-Yllästunturi National Park](/lugar/pallas-yllastunturi-national-park/) accoglie piviere
      tortolino e pernice bianca come l'altopiano scozzese. Il [Parc Nacional d'Aigüestortes i Estany de Sant
      Maurici](/lugar/parc-nacional-d-aiguestortes-i-estany-de-sant-maurici/) e il [Totes Gebirge - Karst
      Desert](/lugar/totes-gebirge---karst-desert/) condividono pernice bianca, gallo cedrone e aquila reale,
      mentre la [Vindelfjällens naturreservat](/lugar/vindelfjallens-naturreservat/) condivide pernice bianca
      e aquila reale.
  pt:
    intro: >-
      A partir de Aviemore, num entardecer límpido, as cascalheiras graníticas do Lairig Ghru e do Braeriach
      tingem-se de um vermelho quente. Não é por acaso: o nome gaélico desta cordilheira é Am Monadh Ruadh,
      «as colinas vermelhas». Estas alturas formam o coração do Parque Nacional dos Cairngorms, o maior do
      Reino Unido, com 4.528 km² distribuídos por cinco municípios escoceses. Foi fundado em 2003 no nordeste
      da Escócia e alargado em 2010 a Perth and Kinross.
    landscape: >-
      Os Cairngorms não são picos pontiagudos, mas uma imensa cordilheira de planaltos: três altiplanos
      principais situados a cerca de 1000–1200 m, coroados por cumes abaulados que sobem até cerca de 1300 m.
      Muitos topos exibem tors, blocos monolíticos de granito esculpidos pelas geadas, enquanto as bordas dos
      planaltos despenham em falésias abruptas. O granito intrusivo dos Cairngorms consolidou-se há cerca de
      427 milhões de anos, tendo as glaciações dos últimos 2,5 milhões de anos esculpido o relevo em circos e
      depósitos morenicos.


      Nas alturas impera um clima árctico-alpino semelhante à tundra. Não existem glaciares, mas pode nevar em
      qualquer mês e os campos de neve duram com frequência o verão inteiro; é o terreno de escalada em gelo e
      neve mais fiável da Grã-Bretanha. Entre os planaltos abrem-se desfiladeiros como o Lairig Ghru, cujo
      ponto mais alto atinge 835 m nas Pools of Dee, onde as águas permanecem geladas em pleno estio.


      Em baixo a paisagem transforma-se. Três grandes rios salmonídeos nascem no parque: o Spey, o Dee e o
      Don; o Spey, segundo rio mais longo da Escócia, brota nos Monadhliath. Os pântanos de Insh Marshes no
      alto Strathspey constituem uma das mais vastas áreas de turfeira aluvial da Escócia. E nos vales
      resguarda-se a floresta caledónica: o pinhal que corre de Glen Feshie a Abernethy é a sua maior mancha
      contínua.
    wildlife: >-
      Maio e junho são consagrados às aves. Nos planaltos nidificam a [perdiz-branca](/especie/lagopus_muta/),
      o borrelho-fusco, a escrevedeira-das-neves e a [águia-real](/especie/aquila_chrysaetos/). Nas florestas
      maduras vivem o [tetraz](/especie/tetrao_urogallus/), o [galo-lira](/especie/tetrao_tetrix/), o
      [cruza-bico-escocês](/especie/loxia_scotica/) e o chapim-de-poupa, enquanto o pinhal de Abernethy
      alberga ainda esquilos-vermelhos, gato-bravo-escocês, veados-vermelhos e a
      [águia-pesqueira](/especie/pandion_haliaetus/), com tradicionais arenas de corte do tetraz.


      Nas várzeas de Insh nidificam no verão águias-pesqueiras e limícolas; no inverno chegam gansos do Ártico
      e até 200 cisnes-bravos. A lebre-ártica e o veado partilham o planalto com a única manada semidoméstica
      de renas das ilhas britânicas. Introduzida em 1952 por um pastor sami sueco, soma hoje cerca de 150
      animais. Todo o curso do rio Dee é zona especial de conservação para o salmão-do-atlântico, a lontra e o
      mexilhão-de-rio.


      Setembro é tempo de brama dos veados, e a alternância climática comanda a montanha: a neve fecha e
      reabre passagens, e os postos de acolhimento como Spittal of Glen Muick disponibilizam previsões
      meteorológicas e de risco de avalanches.
    visit: >-
      Com 55 munros — elevações acima de 3.000 pés —, o parque é um paraíso pedestre, sem que seja forçoso
      subir às cristas: mais de 100 percursos locais, com níveis fácil, moderado ou exigente, cobrem as cotas
      baixas. Dois dos Great Trails da Escócia cruzam o parque: o Speyside Way e o Cateran Trail. O
      cicloturismo e a canoagem são modalidades muito populares.


      Os centros informativos decifram a região. O de Glenmore, junto a Loch Morlich, orienta nos trilhos
      florestais. No Loch Garten Nature Centre, no pinhal ancestral, existem postos de observação e exposições
      sobre fauna. Em Nethy Bridge, o centro da reserva de Abernethy é gerido pela comunidade Explore
      Abernethy como ponto de partida para caminhadas. O Burn O'Vat em Muir of Dinnet constitui a base para
      circundar o Loch Kinord, enquanto o centro de Glen Doll apresenta a botânica dos Angus Glens e abre
      caminho para Corrie Fee e munros vizinhos.


      À noite, Tomintoul e Glenlivet destaca-se como um dos parques de céu escuro certificados mais
      setentrionais do planeta.
    history: >-
      Foi o segundo parque nacional instituído na Escócia, após Loch Lomond and The Trossachs. Alberga hoje
      nove reservas naturais nacionais: Abernethy, Corrie Fee, Craigellachie, Glen Tanar, Insh Marshes, Muir
      of Dinnet, Invereshie e Inshriach, Glenmore e Mar Lodge Estate.


      Em Abernethy estendem-se cerca de 4000 ha de arvoredo, metade dos quais de pinhal caledónico autóctone.
      A RSPB está a plantar 60 000 choupos-tremedores, bétulas, zimbros e salgueiros em cerca de 590 ha para
      altear a linha de arvoredo, e dinamitou as copas de nove pinheiros com 100 a 200 anos para acelerar a
      criação de madeira morta. Em 2015 desmantelaram-se 53 km de uma linha elétrica de 132 kV no interior do
      parque. Em 2026, um violento incêndio florestal calcinou cerca de 25 km² na zona de Glenmore e
      Abernethy.
    before: >-
      Para proteger a fauna nidificante no solo, respeita a sinalização e conduz os cães sempre presos por
      trela quando indicado. Regulamentos proíbem fogueiras e churrascos em todo o parque, e na sequência do
      incêndio foram encerrados o parque de Allt Mor e o caminho para Sugarbowl e ponte de Utsi: confirma o
      estado no sítio web oficial. O parque acolhe cerca de 2 milhões de visitantes por ano, regulando-se o
      acesso pelo Scottish Outdoor Access Code.


      Para travar a erosão nos cumes, o funicular de Cairn Gorm só permite aos passageiros sair da estação
      cimeira em temporada de esqui; os demais visitantes só podem aceder à montanha através de excursões
      guiadas.
    around: >-
      Longe dos Cairngorms, outras montanhas partilham estas aves boreais. O [Pallas-Yllästunturi National
      Park](/lugar/pallas-yllastunturi-national-park/) alberga borrelho-fusco e perdiz-branca como o planalto
      escocês. O [Parc Nacional d'Aigüestortes i Estany de Sant
      Maurici](/lugar/parc-nacional-d-aiguestortes-i-estany-de-sant-maurici/) e o [Totes Gebirge - Karst
      Desert](/lugar/totes-gebirge---karst-desert/) partilham perdiz-branca, tetraz e águia-real, enquanto a
      [Vindelfjällens naturreservat](/lugar/vindelfjallens-naturreservat/) partilha perdiz-branca e
      águia-real.
