resumen:
  es: >-
    La mayor extensión superviviente del relicto bosque de laurisilva subtropical de la era Terciaria en el
    mundo (Patrimonio Mundial UNESCO).
  en: >-
    The largest surviving tract of relict Tertiary subtropical laurel forest in the world (UNESCO World
    Heritage).
  fr: >-
    La plus vaste étendue subsistante de forêt subtropicale de lauriers de l’ère tertiaire au monde
    (Patrimoine mondial de l’UNESCO).
  de: >-
    Das weltweit größte verbliebene Vorkommen des subtropischen Lorbeer-Urwalds aus dem Tertiär
    (UNESCO-Weltnaturerbe).
  it: >-
    La più grande estensione superstite al mondo di foresta subtropicale di laurisilva dell'era Terziaria
    (Patrimonio Mondiale UNESCO).
  pt: >-
    A maior mancha sobrevivente da floresta relíquia de laurissilva subtropical da era Terciária no mundo
    (Património Mundial UNESCO).
unico:
  es: >-
    En un único bosque viven unas cuarenta y seis especies de caracoles, y veintinueve de ellas no existen en
    ningún otro lugar fuera de Madeira.
  en: >-
    In a single forest live some forty-six species of land snails, twenty-nine of which exist nowhere else on
    Earth outside Madeira.
  fr: >-
    Dans cette seule forêt prospèrent quelque quarante-six espèces d'escargots terrestres, dont vingt-neuf
    n'existent nulle part ailleurs en dehors de Madère.
  de: >-
    In diesem einzigen Wald leben rund sechsundvierzig Landschneckenarten, von denen neunundzwanzig nirgendwo
    sonst auf der Erde vorkommen.
  it: >-
    In un unico bosco vivono circa quarantasei specie di chiocciole terrestri, ventinove delle quali non
    esistono in nessun altro luogo al di fuori di Madeira.
  pt: >-
    Numa única floresta coabitam cerca de quarenta e seis espécies de caracóis terrestres, vinte e nove das
    quais não existem em mais nenhum ponto fora da Madeira.
observaciones:
  es: >-
    Las normas de conducta son claras: no recojas plantas, flores, piedras ni conchas, y no toques, persigas
    ni alimentes especies terrestres o marinas. Los senderos oficiales tienen estado de acceso y normas de
    reserva en la web del gestor; míralos antes de salir.
texto:
  es:
    intro: >-
      Bajo la niebla de Madeira sigue en pie un bosque que ya existía hace al menos 1,8 millones de años. Es
      la laurisilva, y ocupa cerca de 15000 hectáreas concentradas sobre todo en la costa norte de la isla. La
      UNESCO la inscribió como Patrimonio Mundial Natural y cree que un 90% es bosque primario, lo que la
      convierte en la mayor extensión de laurisilva superviviente. Entras por un camino o por una levada y, en
      pocos pasos, el mundo se vuelve verde, húmedo y muy antiguo.
    landscape: >-
      Empieza por el suelo. La isla de Madeira es la parte emergida de un gran volcán de tipo escudo, y sus
      rocas son sobre todo basalto y ceniza volcánica. Sobre esa base crece la laurisilva en los sectores de
      la isla donde la humedad relativa y las precipitaciones son más altas: de ahí la niebla, de ahí tanto
      helecho. En el geositio de 25 Fontes se ve la otra mitad de la historia, un acuífero colgado que explica
      por qué el agua brota de la ladera.


      La vegetación es la protagonista. Los árboles, muchos centenarios, son los monumentos del bosque, pero
      lo pequeño también cuenta: plantas de menor porte y helechos ganan protagonismo en la inmensidad verde,
      y los líquenes proliferan por todas partes, en taludes, troncos y rocas. Su abundancia indica una
      excelente calidad ambiental del aire y del agua.


      Los botánicos distinguen tres comunidades: la laurisilva del barbusano, la del til y la del vinhático.
      Entre las especies de árbol y arbusto que se citan están *Ocotea foetens*, *Laurus novocanariensis*,
      *Clethra arborea* y *Picconia excelsa*. En Ribeiro Frio puedes buscar la orquídea endémica *Dactylorhiza
      foliosa*, y entre las plantas endémicas del lugar aparecen también *Echium candicans* e *Isoplexis
      sceptrum*.
    wildlife: >-
      La fauna se cuenta en tres capítulos: insectos, moluscos terrestres y aves, con endemismos de Madeira y
      de la Macaronesia. Los caracoles son los más sorprendentes, pero no los que más se ven.


      Entre las aves, el gestor destaca la [paloma trocaz](/especie/columba_trocaz/), el pombo-trocaz, y el
      [reyezuelo de Madeira](/especie/regulus_madeirensis/), el bis-bis (*Regulus maderensis*). El pinzón
      *Fringilla maderensis* es endémico de la isla.


      El bosque se recorre todo el año, y la imagen que lo resume es la de la laurisilva envuelta en brumas en
      Fanal. En Ribeiro Frio, mira a ras de suelo: ahí está la orquídea.
    visit: >-
      Miles de personas recorren cada año los caminos de la Laurisilva para descubrir el bosque. Hay una red
      de senderos y veredas, y varios están en la lista regional de recorridos recomendados.


      Tres rutas dan tres formas de entrar. La Vereda dos Balcões sale de la carretera regional ER 103, en
      Ribeiro Frio, y mide 1.5 km de ida y otros 1.5 km de vuelta. La Levada das 25 Fontes (PR 6) arranca en
      Rabaçal, junto a la ER105, y se calcula en unas 3 horas. Y la PR 14, la Levada dos Cedros, une Fanal con
      Curral Falso. Una de las rutas atraviesa además el macizo montañoso central y la laurisilva, dos
      ecosistemas de la Red Natura 2000.


      Para entender lo que pisas, hay tres centros. El Centro de Receção do Rabaçal, en Calheta, tiene
      exposiciones permanentes sobre la historia de Rabaçal y sobre la laurisilva. En la Casa das Queimadas,
      la planta baja es un centro de recepción que informa sobre el bosque. Y el Centro Florestal da
      Macaronésia ofrece una exposición permanente sobre las medidas de conservación forestal.
    history: >-
      La laurisilva está íntegramente dentro del Parque Natural de Madeira, y el uso del territorio se regula
      mediante el Plano de Ordenamento e Gestão da Laurissilva da Madeira. Es zona de la Red Natura 2000.


      La amenaza que preocupa es climática: la presión del clima puede sumarse a otras presiones humanas sobre
      este bosque.
    before: >-
      Las normas de conducta son claras: no recojas plantas, flores, piedras ni conchas, y no toques, persigas
      ni alimentes especies terrestres o marinas. Los senderos oficiales tienen estado de acceso y normas de
      reserva en la web del gestor; míralos antes de salir.
    around: >-
      La [Reserva Natural Marina de Rocha do Navio](/lugar/reserva-natural-da-rocha-do-navio/) está a unos 2
      km, y las [Islas Desertas](/lugar/islas-desertas/) un poco más allá, ya mar adentro. Lejos, en otro
      archipiélago de la Macaronesia, el [Parque Nacional de Garajonay](/lugar/parque-nacional-de-garajonay/)
      comparte con Madeira la laurisilva y especies como *Ocotea foetens* y *Laurus novocanariensis*, además
      de hábitats de bosque primario y maduro y de alta montaña.
  en:
    intro: >-
      Beneath the swirling mountain mists of Madeira thrives a forest that already existed at least 1.8
      million years ago. This is the laurisilva, covering roughly 15000 hectares concentrated mainly along the
      island's steep northern coast. UNESCO inscribed it as a World Heritage property and estimates that fully
      90% is primary forest, making it the largest surviving tract of laurel forest on the planet. You enter
      via a footpath or alongside a levada canal, and within a few paces the surroundings become lush,
      moisture-laden, and profoundly ancient.
    landscape: >-
      Everything begins with the volcanic ground beneath your boots. The island of Madeira represents the
      exposed summit of a massive shield volcano, its bedrock dominated by dark basalt and volcanic ash
      layers. On this porous foundation, the laurel forest thrives where relative humidity and precipitation
      reach their highest levels: hence the persistent sea mists, hence the dense carpets of ferns. At the 25
      Fontes geosite, you discover the other half of the hydrogeological story—a perched aquifer explaining
      why spring water gushes continuously from basalt cliffs.


      Vegetation reigns supreme. Century-old trees stand as monuments of the woods, yet smaller plants claim
      their share of glory: understorey ferns carpet the green expanse, while epiphytic lichens drape
      rockfaces, banks, and branches. Their abundance reflects pristine air and freshwater quality.


      Botanists classify three primary forest associations: the barbusano laurisilva, the til forest, and the
      vinhático woodland. Key tree and shrub species include *Ocotea foetens*, *Laurus novocanariensis*,
      *Clethra arborea*, and *Picconia excelsa*. At Ribeiro Frio you can search for the endemic rock orchid
      *Dactylorhiza foliosa*, while other endemic botanical treasures include pride of Madeira (*Echium
      candicans*) and Madeira foxglove (*Isoplexis sceptrum*).
    wildlife: >-
      The native fauna unfolds across three distinct chapters: insects, terrestrial molluscs, and forest
      birds, replete with Madeira and Macaronesian endemics. Land snails are biologically the most astonishing
      group, though rarely the most conspicuous.


      Among birds, park rangers highlight the endemic [Trocaz pigeon](/especie/columba_trocaz/), locally known
      as the pombo-trocaz, and the [Madeira firecrest](/especie/regulus_madeirensis/), affectionately dubbed
      the bis-bis (*Regulus maderensis*). The local chaffinch (*Fringilla maderensis*) is likewise unique to
      the island.


      The laurisilva rewards visits throughout the year, with its most iconic atmosphere found at Fanal when
      thick cloud wraps around centuries-old til trees. At Ribeiro Frio, look closely at damp mossy banks to
      find the native orchid.
    visit: >-
      Thousands of hikers travel the trails of the Laurisilva each year to discover this primeval wilderness.
      A well-maintained network of paths and footpaths exists, with several officially designated on the
      regional walking register.


      Three iconic routes provide three varied introductions. The Vereda dos Balcões sets out from regional
      road ER 103 at Ribeiro Frio, measuring 1.5 km out and another 1.5 km back. The Levada das 25 Fontes (PR
      6) departs from Rabaçal near road ER105, requiring about 3 hours of walking. The PR 14, Levada dos
      Cedros, links Fanal with Curral Falso. One cross-island route also traverses both the central mountain
      massif and the indigenous laurisilva, two vital Natura 2000 habitats.


      To better understand what you are exploring, three visitor facilities are available. The Centro de
      Receção do Rabaçal in Calheta features permanent exhibits on local history and forest ecology. At Casa
      das Queimadas, the ground floor serves as an information centre interpreting the laurel woods. And the
      Centro Florestal da Macaronésia showcases ongoing forest conservation initiatives.
    history: >-
      The laurel forest is protected within the Madeira Natural Park, its territory regulated under the Plano
      de Ordenamento e Gestão da Laurissilva da Madeira. It is fully designated within the Natura 2000
      network.


      Climate pressure represents the most concerning future challenge, as shifting rainfall regimes can
      compound existing anthropogenic stresses on island ecology.
    before: >-
      Park conduct rules are straightforward: do not collect plants, flowers, geological specimens, or shells,
      and never approach, chase, or feed wild animals. Check the official park website for updated trail
      statuses and reservation guidelines before setting out.
    around: >-
      The [Reserva Natural Marina de Rocha do Navio](/lugar/reserva-natural-da-rocha-do-navio/) lies roughly 2
      km away, with the [Islas Desertas](/lugar/islas-desertas/) visible further out across the open ocean.
      Further afield within Macaronesia, [Parque Nacional de Garajonay](/lugar/parque-nacional-de-garajonay/)
      on La Gomera shares with Madeira related laurel forest formations and species such as *Ocotea foetens*
      and *Laurus novocanariensis*, alongside mature primeval woodland and cloud forest habitats.
  fr:
    intro: >-
      Sous les brumes océaniques de Madère s'épanouit une forêt qui existait déjà il y a au moins 1,8 million
      d'années. C'est la laurisilve, qui s'étend sur près de 15000 hectares principalement concentrés sur le
      versant nord de l'île. L'UNESCO l'a inscrite au patrimoine mondial naturel en estimant que 90% en
      constitue de la forêt primaire, ce qui en fait la plus vaste forêt de lauriers relique du monde. Vous y
      pénétrez par un sentier ou le long d'une levada et, en quelques pas, le paysage devient verdoyant,
      ruisselant d'humidité et infiniment ancien.
    landscape: >-
      Tout commence par le socle insulaire. L'île de Madère représente la partie émergée d'un immense
      volcan-bouclier, et ses roches se composent essentiellement de basaltes et de cendres volcaniques. Sur
      cette assise fertile, la laurisilve prospère là où l'humidité atmosphérique et les précipitations
      culminent : d'où la brume tenace et l'opulence des fougères. Sur le géosite des 25 Fontes se révèle
      l'autre versant de cette dynamique, un aquifère perché expliquant la multitude de résurgences
      jaillissant de la roche.


      La végétation arborée constitue le cœur du décor. Des arbres plusieurs fois centenaires dressent leurs
      fûts moussus, mais la flore du sous-bois joue également un rôle capital : fougères arborescentes et
      herbacées tapissent le sol, tandis que les lichens prolifèrent sur les talus, troncs et rochers,
      témoignant d'une pureté exceptionnelle de l'air et de l'eau.


      Les spécialistes distinguent trois communautés végétales majeures : la laurisilve à barbusano, celle à
      til et celle à vinhático. Parmi les essences arborées et arbustives figurent *Ocotea foetens*, *Laurus
      novocanariensis*, *Clethra arborea* et *Picconia excelsa*. À Ribeiro Frio, vous pouvez rechercher
      l'orchidée indigène *Dactylorhiza foliosa*, aux côtés d'autres endémiques remarquables telles qu'*Echium
      candicans* et *Isoplexis sceptrum*.
    wildlife: >-
      La faune indigène s'articule en trois volets majeurs : les insectes, les mollusques terrestres et les
      oiseaux de sous-bois, riches en endémismes de Madère et de Macaronésie. Les escargots terrestres
      constituent le groupe le plus fascinant pour les biogéographes.


      Parmi les oiseaux, les forestiers mettent en lumière le [pigeon trocaz](/especie/columba_trocaz/), ou
      pombo-trocaz, et le [roitelet de Madère](/especie/regulus_madeirensis/), localement appelé bis-bis
      (*Regulus maderensis*). Le pinson des arbres insulaire (*Fringilla maderensis*) est également
      strictement endémique de l'île.


      La forêt se visite en toute saison, l'ambiance la plus poétique restant celle des brumes enveloppant les
      vieux lauriers de Fanal. À Ribeiro Frio, scrutez les talus suintants : c'est là que fleurit l'orchidée.
    visit: >-
      Des milliers de passionnés parcourent chaque année les sentiers de la laurisilve. Une trame
      d'itinéraires et de chemins balisés sillonne le massif, nombre d'entre eux étant homologués comme
      parcours recommandés par les autorités régionales.


      Trois itinéraires offrent trois visions complémentaires. La Vereda dos Balcões s'amorce depuis la route
      régionale ER 103 à Ribeiro Frio, comptant 1,5 km à l'aller et 1,5 km au retour. La Levada das 25 Fontes
      (PR 6) démarre à Rabaçal le long de l'ER105 et demande environ 3 heures de marche. Enfin, le PR 14
      (Levada dos Cedros) relie Fanal à Curral Falso. L'un des grands sentiers franchit à la fois le massif
      montagneux central et la forêt indigène, deux écosystèmes majeurs du réseau Natura 2000.


      Pour approfondir vos connaissances, trois structures vous accueillent. Le Centro de Receção do Rabaçal,
      à Calheta, propose des expositions permanentes sur l'histoire hydraulique et l'écologie forestière. À la
      Casa das Queimadas, le rez-de-chaussée abrite un point d'information dédié au milieu naturel. Enfin, le
      Centro Florestal da Macaronésia expose les démarches de conservation forestière insulaire.
    history: >-
      La laurisilve est intégralement englobée dans le parc naturel de Madère, ses usages étant strictement
      définis par le Plano de Ordenamento e Gestão da Laurissilva da Madeira. Elle relève du réseau Natura
      2000.


      La principale préoccupation d'avenir concerne l'évolution climatique : les bouleversements hydrologiques
      et de température pourraient accentuer les pressions sur ces équilibres insulaires fragiles.
    before: >-
      Les règles de visite sont formelles : il est strictement interdit de cueillir plantes, fleurs, minéraux
      ou coquilles, ainsi que de déranger ou nourrir la faune terrestre ou marine. Vérifiez la praticabilité
      des sentiers et les modalités d'accès sur le portail officiel de l'organisme gestionnaire avant votre
      sortie.
    around: >-
      La [Reserva Natural Marina de Rocha do Navio](/lugar/reserva-natural-da-rocha-do-navio/) se situe à
      environ 2 km, tandis que les [Islas Desertas](/lugar/islas-desertas/) se profilent au large sur l'océan.
      Plus loin, au cœur de la Macaronésie, le [Parque Nacional de
      Garajonay](/lugar/parque-nacional-de-garajonay/) partage avec Madère la même forêt relique de laurisilve
      et des essences telles qu'*Ocotea foetens* et *Laurus novocanariensis*, ainsi que des habitats
      forestiers primaires d'altitude.
  de:
    intro: >-
      Unter den Passatnebeln Madeiras überdauerte ein Wald, der bereits vor mindestens 1,8 Millionen Jahren
      existierte. Es ist der Laurisilva-Lorbeerwald, der rund 15000 Hektar bedeckt und sich vor allem an den
      steilen Nordhängen der Insel konzentriert. Die UNESCO erklärte ihn zum Weltnaturerbe und schätzt, dass
      90% davon echten Primärwald darstellen – das größte erhaltene Lorbeerwaldgebiet der Erde. Du betrittst
      ihn auf einem Wanderpfad oder entlang einer Levada, und nach wenigen Schritten wird die Umgebung feucht,
      sattgrün und uralt.
    landscape: >-
      Alles beginnt mit dem vulkanischen Boden. Die Insel Madeira ist der aus dem Atlantik ragende
      Gipfelbereich eines mächtigen Schildvulkans, dessen Gesteine vor allem aus Basalt und Tuff bestehen. Auf
      diesem Untergrund gedeiht der Lorbeerwald dort, wo Luftfeuchtigkeit und Niederschläge am höchsten sind:
      Daher rühren die dichten Nebel und üppigen Farne. Am Geotop der 25 Fontes offenbart sich die
      hydrogeologische Seite der Landschaft, wo ein schwebender Grundwasserleiter das Wasser aus den
      Basaltwänden quellen lässt.


      Die Pflanzenwelt beherrscht das Landschaftsbild. Uralte Baumriesen bilden ehrwürdige Naturdenkmäler,
      doch auch die niedere Vegetation prägt den Wald: Baumfarne und Kräuter bilden ein geschlossenes grünes
      Stockwerk, während Flechten Felsen und Stämme überziehen. Ihr Reichtum belegt die exzellente Reinheit
      von Luft und Wasser.


      Botaniker unterscheiden drei Waldgesellschaften: den Barbusano-Lorbeerwald, den Til-Lorbeerwald und den
      Vinhático-Wald. Unter den Gehölzen stechen *Ocotea foetens*, *Laurus novocanariensis*, *Clethra arborea*
      und *Picconia excelsa* hervor. Bei Ribeiro Frio kannst du die endemische Knabenkraut-Art *Dactylorhiza
      foliosa* entdecken; zu den seltenen Endemiten zählen ferner der Stolz von Madeira (*Echium candicans*)
      und *Isoplexis sceptrum*.
    wildlife: >-
      Die Tierwelt gliedert sich in drei Hauptgruppen: Insekten, Landschnecken und Vögel, reich an
      makaronesischen Endemiten. Die Schneckenfauna ist ökologisch herausragend, wenn auch oft im Verborgenen
      lebend.


      Unter den Vögeln heben Ornithologen die [Silberhalstaube](/especie/columba_trocaz/) (Pombo-trocaz) und
      das [Madeiragoldhähnchen](/especie/regulus_madeirensis/) (Bis-bis, *Regulus maderensis*) hervor. Auch
      der Madeira-Buchfink (*Fringilla maderensis*) ist streng endemisch auf der Insel heimisch.


      Der Wald lässt sich das ganze Jahr über erwandern; das berühmteste Stimmungsbild bietet der
      nebelumwobene Lorbeerhain von Fanal. In Ribeiro Frio lohnt der Blick auf feuchte Moospolster nach der
      seltenen Orchidee.
    visit: >-
      Tausende Wanderer erkunden alljährlich die Pfade des Lorbeerwalds. Ein dichtes Netz aus Wanderwegen und
      Fußpfaden erschließt das Gebirge, viele davon als empfohlene Regionalrouten ausgewiesen.


      Drei Wege bieten drei verschiedene Zugänge. Die Vereda dos Balcões beginnt an der Regionalstraße ER 103
      in Ribeiro Frio und misst 1,5 km hin sowie 1,5 km zurück. Die Levada das 25 Fontes (PR 6) startet in
      Rabaçal an der ER105 und erfordert rund 3 Stunden Gehzeit. Die Route PR 14 (Levada dos Cedros) verbindet
      Fanal mit Curral Falso. Ein Weitwanderweg quert zudem das zentrale Hochgebirgsmassiv und den Urwald,
      zwei Kernräume des Natura-2000-Netzes.


      Für Hintergrundwissen stehen drei Besucherzentren offen. Das Centro de Receção do Rabaçal in Calheta
      zeigt Dauerausstellungen zur Erschließung der Levadas und zur Waldökologie. Im Erdgeschoss der Casa das
      Queimadas informiert eine Ausstellung über den Urwald. Das Centro Florestal da Macaronésia stellt
      forstliche Erhaltungsmaßnahmen vor.
    history: >-
      Der Lorbeerwald liegt vollständig innerhalb des Naturparks Madeira und unterliegt den strengen Vorgaben
      des Plano de Ordenamento e Gestão da Laurissilva da Madeira. Er ist Teil des Schutzgebietsnetzes Natura
      2000.


      Als ernste Bedrohung gilt der Klimawandel, da veränderte Niederschlagsmuster den empfindlichen
      Wasserhaushalt der Inselwälder belasten können.
    before: >-
      Es gelten strikte Verhaltensregeln: Das Entnehmen von Pflanzen, Blumen, Steinen oder Gehäusen ist ebenso
      untersagt wie das Stören, Nachstellen oder Füttern wildlebender Tiere. Informiere dich vorab auf der
      Website der Parkverwaltung über Wegesperrungen und Richtlinien.
    around: >-
      Das Meeresschutzgebiet [Reserva Natural Marina de Rocha do
      Navio](/lugar/reserva-natural-da-rocha-do-navio/) liegt etwa 2 km entfernt, und die [Islas
      Desertas](/lugar/islas-desertas/) zeichnen sich weiter draußen auf dem Atlantik ab. Weiter entfernt in
      Makaronesien teilt der [Parque Nacional de Garajonay](/lugar/parque-nacional-de-garajonay/) auf La
      Gomera Lorbeerwaldgesellschaften mit *Ocotea foetens* und *Laurus novocanariensis* sowie primäre
      Bergwaldhabitate.
  it:
    intro: >-
      Sotto le nebbie montane di Madeira prospera una foresta che esisteva già almeno 1,8 milioni di anni fa.
      È la laurisilva, che ricopre circa 15000 ettari concentrati prevalentemente lungo i ripidi versanti
      settentrionali dell'isola. L'UNESCO l'ha inserita nel Patrimonio Mondiale Naturale stimando che il 90%
      sia costituito da foresta primaria, primato che ne fa la più vasta laurisilva relitta del globo. Vi si
      accede lungo un sentiero o costeggiando una levada e, in pochi passi, l'ambiente circostante diventa
      lussureggiante, grondante umidità e incredibilmente antico.
    landscape: >-
      Tutto prende forma dalla natura vulcanica del territorio. L'isola di Madeira costituisce la sommità
      emersa di un imponente vulcano a scudo, con rocce dominate da basalti compatti e ceneri vulcaniche. Su
      questo substrato la laurisilva cresce laddove l'umidità atmosferica e le piogge toccano i livelli
      massimi: da qui la coltre di nubi perenni e la rigogliosa vegetazione a felci. Nel geosito delle 25
      Fontes emerge l'altro volto dell'idrologia isolana, con una falda sospesa che riversa copiose sorgenti
      dalle pareti rocciose.


      Il manto vegetale è il vero protagonista. Gli alberi centenari si ergono a patriarchi del bosco, ma
      anche il sottobosco esprime grande ricchezza: felci e piante basse rivestono ogni spazio, mentre i
      licheni proliferano su scarpate, tronchi e massi, a conferma della purezza dell'aria e dell'acqua.


      I botanici distinguono tre comunità principali: la laurisilva a barbusano, quella a til e quella a
      vinhático. Tra le specie arboree e arbustive spiccano *Ocotea foetens*, *Laurus novocanariensis*,
      *Clethra arborea* e *Picconia excelsa*. A Ribeiro Frio puoi cercare l'orchidea spontanea *Dactylorhiza
      foliosa*, assieme ad altri endemismi come *Echium candicans* e *Isoplexis sceptrum*.
    wildlife: >-
      La fauna indigena si articola in tre capitoli: insetti, molluschi terrestri e avifauna forestale,
      caratterizzati da endemismi di Madeira e della Macaronesia. I gasteropodi terrestri rappresentano il
      gruppo biologicamente più sorprendente.


      Tra gli uccelli, i rapporti del parco pongono in risalto la [colomba di
      Madera](/especie/columba_trocaz/), localmente nota come pombo-trocaz, e il [fiorrancino di
      Madera](/especie/regulus_madeirensis/), chiamato bis-bis (*Regulus maderensis*). Anche il fringuello di
      Madeira (*Fringilla maderensis*) è specie rigorosamente endemica dell'isola.


      La foresta si esplora in ogni periodo dell'anno, raggiungendo il massimo fascino quando le nebbie
      avvolgono i patriarchi di Fanal. Presso Ribeiro Frio osserva con attenzione le pareti muschiose: lì si
      nasconde la rara orchidea rupestre.
    visit: >-
      Migliaia di camminatori percorrono annualmente i tracciati della laurisilva per entrare a contatto con
      questo habitat primitivo. Una capillare rete di percorsi e sentieri attraversa l'area protetta, con vari
      itinerari ufficialmente raccomandati dalla regione.


      Tre percorsi offrono tre ingressi distinti. La Vereda dos Balcões prende le mosse dalla strada regionale
      ER 103 a Ribeiro Frio, sviluppandosi per 1,5 km all'andata e altrettanti 1,5 km al ritorno. La Levada
      das 25 Fontes (PR 6) parte da Rabaçal nei pressi della ER105, richiedendo circa 3 ore di cammino. La PR
      14 (Levada dos Cedros) congiunge Fanal a Curral Falso. Uno dei tracciati escursionistici attraversa
      inoltre sia il massiccio montuoso centrale sia la laurisilva, due formazioni chiave della rete Natura
      2000.


      Per approfondire le peculiarità del territorio sono attivi tre presidi. Il Centro de Receção do Rabaçal
      a Calheta ospita mostre sulla storia della rete irrigua e sull'ambiente naturale. Alla Casa das
      Queimadas, il piano terra accoglie un punto informazioni dedicato alla flora boschiva. Infine, il Centro
      Florestal da Macaronésia illustra i progetti di tutela forestale.
    history: >-
      La laurisilva ricade per intero nel territorio del Parco Naturale di Madeira, e la sua gestione è
      disciplinata dal Plano de Ordenamento e Gestão da Laurissilva da Madeira. L'area appartiene alla rete
      Natura 2000.


      Le minacce emergenti derivano dalle dinamiche climatiche globali, capaci di alterare i delicati
      equilibri idrici dell'ecosistema insulare.
    before: >-
      Le norme di salvaguardia sono rigorose: è fatto divieto di asportare piante, fiori, ciottoli o
      conchiglie, nonché di disturbare o alimentare la fauna terrestre e marina. Verifica lo stato di apertura
      dei sentieri e le indicazioni dell'ente gestore prima di metterti in cammino.
    around: >-
      La [Reserva Natural Marina de Rocha do Navio](/lugar/reserva-natural-da-rocha-do-navio/) dista circa 2
      km, mentre le [Islas Desertas](/lugar/islas-desertas/) emergono all'orizzonte in mare aperto. A maggior
      distanza, nel contesto della Macaronesia, il [Parque Nacional de
      Garajonay](/lugar/parque-nacional-de-garajonay/) condivide con Madeira la laurisilva relitta, essenze
      come *Ocotea foetens* e *Laurus novocanariensis*, e ambienti forestali primari montani.
  pt:
    intro: >-
      Sob o nevoeiro da Madeira ergue-se uma floresta que já existia há pelo menos 1,8 milhões de anos. É a
      laurissilva, ocupando perto de 15000 hectares concentrados primordialmente na vertente norte da ilha. A
      UNESCO classificou-a como Património Mundial Natural e calcula que 90% corresponda a floresta primária,
      tornando-a na mais vasta mancha de laurissilva relíquia sobrevivente no mundo. Entras por uma vereda ou
      ladeando uma levada e, num punhado de passos, o cenário torna-se verdejante, húmido e profundamente
      ancestral.
    landscape: >-
      Tudo parte da base vulcânica da ilha. A ilha da Madeira constitui a porção emersa de um vulcão-escudo de
      grandes dimensões, assentando em rochas basálticas e piroclastos. Sobre esta matriz medra a laurissilva
      nos setores insulares onde a humidade relativa e as chuvas atingem valores mais elevados: daí os
      nevoeiros persistentes, daí a abundância exuberante de fetos. No sítio geológico das 25 Fontes revela-se
      a outra face hidrogeológica, um aquífero suspenso que explica a abundância de nascentes brotando das
      arribas.


      A flora é a protagonista soberana. As árvores centenárias erguem-se como monumentos vivos da mata, mas
      os estratos inferiores detêm igual encanto: fetos e herbáceas forram o solo úmido, e os líquenes cobrem
      taludes, troncos e penedos, espelhando a pureza intacta da atmosfera e das águas.


      Os botânicos identificam três comunidades florestais: a laurissilva do barbusano, a do til e a do
      vinhático. Entre os exemplares arbóreos e arbustivos destacam-se *Ocotea foetens*, *Laurus
      novocanariensis*, *Clethra arborea* e *Picconia excelsa*. No Ribeiro Frio podes procurar a orquídea
      endémica *Dactylorhiza foliosa*, surgindo ainda endemismos como o massaroco (*Echium candicans*) e a
      crista-de-galo (*Isoplexis sceptrum*).
    wildlife: >-
      A fauna nativa divide-se em três capítulos essenciais: insetos, moluscos terrestres e avifauna
      florestal, com múltiplos endemismos da Madeira e da Macaronésia. Os caracóis de terra assumem
      singularidade extrema na biologia da ilha.


      Nas aves, a gestão do parque salienta o [pombo-trocaz](/especie/columba_trocaz/) e o
      [bis-bis](/especie/regulus_madeirensis/) (*Regulus maderensis*). O tentilhão-da-madeira (*Fringilla
      maderensis*) é igualmente um táxon estritamente privativo da ilha.


      A floresta visita-se em todas as épocas do ano, guardando a imagem mística do Fanal quando os nevoeiros
      abraçam os velhos tis. No Ribeiro Frio, perscruta as escarpas húmidas: é ali que desponta a orquídea
      nativa.
    visit: >-
      Milhares de caminheiros percorrem anualmente as veredas da laurissilva para testemunhar esta relíquia
      natural. Existe uma rede demarcada de percursos pedestres recomendados pela tutela regional.


      Três percursos facultam três experiências contrastantes. A Vereda dos Balcões parte da estrada regional
      ER 103, no Ribeiro Frio, totalizando 1,5 km de ida e 1,5 km no regresso. A Levada das 25 Fontes (PR 6)
      arranca no Rabaçal junto à ER105, estimando-se em cerca de 3 horas de marcha. E o PR 14, a Levada dos
      Cedros, une o Fanal ao Curral Falso. Um dos itinerários pedestres cruza em simultâneo o maciço
      montanhoso central e a laurissilva, dois biótopos nucleares da Rede Natura 2000.


      Para aprofundar o conhecimento do território existem três polos de apoio. O Centro de Receção do
      Rabaçal, na Calheta, acolhe exposições temáticas sobre as levadas e o ecossistema florestal. Na Casa das
      Queimadas, o rés do chão opera como centro informativo sobre a laurissilva. E o Centro Florestal da
      Macaronésia divulga projetos de preservação florestal.
    history: >-
      A floresta de laurissilva encontra-se integralmente inserida no Parque Natural da Madeira, sendo o
      ordenamento disciplinado pelo Plano de Ordenamento e Gestão da Laurissilva da Madeira. O território está
      incluído na Rede Natura 2000.


      A vulnerabilidade futura liga-se às dinâmicas climáticas, cujas alterações de pluviosidade podem
      sobrecarregar a resiliência ecológica da floresta insular.
    before: >-
      As normas de conduta ambiental são expressas: não colhas plantas, flores, rochas ou conchas, e não
      importunes nem alimentes espécies animais. Verifica as condições operacionais dos trilhos e os avisos de
      reserva antes de iniciares a caminhada.
    around: >-
      A [Reserva Natural Marina de Rocha do Navio](/lugar/reserva-natural-da-rocha-do-navio/) dista cerca de 2
      km, avistando-se as [Islas Desertas](/lugar/islas-desertas/) mais ao largo em mar aberto. Mais distante,
      no arquipélago vizinho das Canárias, o [Parque Nacional de
      Garajonay](/lugar/parque-nacional-de-garajonay/) partilha com a Madeira a laurissilva e elementos como
      *Ocotea foetens* e *Laurus novocanariensis*, a par de biótopos de floresta primária madura e de
      montanha.
