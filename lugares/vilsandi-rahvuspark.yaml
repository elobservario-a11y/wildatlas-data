resumen:
  es: >-
    El santuario ornitológico marítimo más antiguo del Báltico (1910), abarcando unos 160 islotes y arrecifes
    de caliza en Saaremaa.
  en: >-
    The oldest marine bird sanctuary in the Baltic (1910), encompassing some 160 limestone islets and reefs
    off Saaremaa.
  fr: >-
    Le plus ancien sanctuaire ornithologique marin de la Baltique (1910), englobant quelque 160 îlots et
    récifs calcaires à Saaremaa.
  de: >-
    Das älteste maritime Vogelschutzgebiet der Ostsee (1910), das rund 160 Kalksteininseln und Riffe vor
    Saaremaa umfasst.
  it: >-
    Il più antico santuario ornitologico marittimo del Baltico (1910), comprendente circa 160 isolotti e
    scogliere calcaree a Saaremaa.
  pt: >-
    O santuário ornitológico marítimo mais antigo do Báltico (1910), englobando cerca de 160 ilhéus e recifes
    calcários em Saaremaa.
unico:
  es: >-
    Una costa baja y solitaria que lleva unos siete mil años subiendo del mar, con la reserva de aves más
    antigua del Báltico.
  en: >-
    A low, windswept coastline rising from the sea for some seven thousand years, home to the oldest bird
    reserve in the Baltic.
  fr: >-
    Un littoral bas et sauvage émergeant des flots depuis environ sept mille ans, abritant la plus ancienne
    réserve d'oiseaux de la Baltique.
  de: >-
    Eine flache, einsame Küste, die sich seit etwa siebentausend Jahren aus dem Meer hebt, mit dem ältesten
    Vogelschutzgebiet der Ostsee.
  it: >-
    Una costa bassa e solitaria che emerge dal mare da circa settemila anni, con la più antica riserva
    avifaunistica del Baltico.
  pt: >-
    Uma costa baixa e desolada que se eleva das águas há cerca de sete mil anos, albergando a mais antiga
    reserva de aves do Báltico.
observaciones:
  es: >-
    El faro de Kiipsaare es propiedad privada, está sobre suelo inseguro y subir es peligroso. En Harilaid el
    sendero está marcado con estacas rojas y los vehículos a motor están prohibidos. El sendero
    Käkisilma-Vilsandi está cerrado por el dragado del canal Papisaare-Vikati. Mejor época: de mayo a octubre.
texto:
  es:
    intro: >-
      En 1933 se construyó el faro de Kiipsaare, de 25 m, a 150 m tierra adentro. Hoy está a más de 50 m
      dentro del mar, inclinado: la erosión se llevó el suelo que lo sostenía. Esa es la mejor manera de
      entender Vilsandi, un parque que el mar sigue moldeando en el oeste de Saaremaa. Casi cien islas, con el
      mar y la costa de Saaremaa, suman 485,9 km², de los que 393,5 km² son agua. Nació de una reserva de aves
      fundada en 1910, y es la reserva más antigua del Báltico.
    landscape: >-
      El terreno del parque lleva unos siete mil años elevándose lentamente desde el mar y ha dejado lagos
      relictos en antiguas calas cerradas. Los hábitats marinos incluyen arrecifes, islotes rocosos, bajíos,
      bahías someras y lagunas costeras. En tierra hay turberas de manantial, turberas calcáreas y turberas
      ricas en especies.


      Los alvares son el paisaje más raro. Los prados de alvar se desarrollan sobre afloramientos calizos con
      menos de veinte centímetros de suelo rico en cal. Son un hábitat raro a escala mundial, y ocupan el
      trece por ciento de la tierra firme del parque.


      En Harilaid, una península rectangular unida al resto por una estrecha franja, el cuello de Harilaiu,
      hay playas de arena y guijarros y dunas. Emergió del mar hace uno o dos milenios y sigue en constante
      movimiento: la costa cambia continuamente, y quien vuelve ve los cambios con sus ojos. Harilaid está
      protegido desde 1924 y siempre estuvo deshabitado.
    wildlife: >-
      Es un parque de aves. Se han registrado 247 especies, 114 de ellas nidificantes. El eider común es la
      más común, con más de 4.000 parejas. En la migración paran muchas aves, como la barnacla cariblanca y el
      eider de anteojos. Entre las raras figuran el [pigargo europeo](/especie/haliaeetus_albicilla/) y el
      [búho real](/especie/bubo_bubo/). La caza está absolutamente prohibida.


      Entre los mamíferos hay [alces](/especie/alces_alces/), ciervos, corzos y jabalíes, además de colonias
      reproductoras de [foca gris](/especie/halichoerus_grypus/). En la costa y los lagos someros hay salmón
      atlántico y lamprea de río, y en las costas, arenque, sapo corredor y sanguijuela medicinal.


      Un tercio de todas las plantas protegidas de Estonia están en el parque. Entre ellas, la littorela, el
      ajenjo marino, el cardo marino, el junco negro y el Rhinanthus de Saaremaa. Hay 32 especies de
      orquídeas, entre ellas la Dactylorhiza osiliensis.
    visit: >-
      El centro de visitantes está en el antiguo complejo señorial de Loona, en Rootsiküla, y informa de la
      naturaleza y del patrimonio marítimo de las islas. Tiene una exposición permanente de fósiles,
      documentales y libros de naturaleza, y está abierto todo el año y adaptado a sillas de ruedas. Organiza
      actividades gratuitas de naturaleza y programas de educación, con aviso previo.


      En Harilaid, el sendero de Harilaiu recorre una costa solitaria: horizonte bajo, viento, arena dorada,
      dunas, árboles doblados por el viento, sonidos de focas y aves, objetos militares y el faro de Kiipsaare
      en el mar. La ruta circular de Harilaid tiene once kilómetros; una variante de nueve kilómetros llega al
      faro de Kiipsaare y regresa al área de descanso, y atraviesa un área señalada para observar aves y focas
      junto a las dunas y la bahía de Laialepa. Al campamento de la bahía de Laialepa hay que caminar unos 4
      km por el sendero.


      En Vilsandi, dos senderos (6 km y 8 km) salen del centro de la isla, cerca de la torre de observación de
      la estación biológica. Muestran el patrimonio marítimo (puertos, casas de capitanes, molinos), los
      Vaika, islas de aves donde nació la conservación en el Báltico, y un faro de más de dos siglos. Informan
      de los barcos a Vilsandi en el centro de visitantes, y se aparca en el puerto de Papissaare. Con poca
      agua y buen tiempo se puede ir andando de Saaremaa a Vilsandi, vadeando de islote en islote hasta
      Väike-Vilsandi.
    history: >-
      La conservación en el Báltico nació aquí, en las islas de aves de Vaika. La estación biológica del
      parque está en Vilsandi, y el parque es Área Importante para las Aves de BirdLife International.
    before: >-
      El faro de Kiipsaare es propiedad privada, está sobre suelo inseguro y subir es peligroso. En Harilaid
      el sendero está marcado con estacas rojas y los vehículos a motor están prohibidos. El sendero
      Käkisilma-Vilsandi está cerrado por el dragado del canal Papisaare-Vikati. Mejor época: de mayo a
      octubre.
    around: >-
      Vilsandi no tiene vecinos cercanos en el atlas, pero sí lugares lejanos con los que comparte costa y
      especies. El [Parque Nacional del Mar de Wadden (Dinamarca)](/lugar/wadden-sea-national-park-dinamarca/)
      y el [Parque Nacional de Słowiński](/lugar/slowinski-park-narodowy/) comparten con él la costa, el eider
      y la foca gris; el [Lago Peipus y Delta del Río Emajõgi](/lugar/peipsi-jarv---emajoe-suursoo/), la
      costa, los humedales y el alce; y el [Parque Nacional de Slītere y Costa del Estrecho de
      Irbe](/lugar/sliteres-nacionalais-parks/), la foca gris y el alce.
  en:
    intro: >-
      In 1933, the Kiipsaare lighthouse, 25 m high, was built 150 m inland. Today it stands over 50 m out into
      the sea, famously tilting: wave erosion swept away the ground beneath it. That is the clearest symbol of
      Vilsandi, a coastal national park continuously reshaped by the waves on western Saaremaa. Nearly a
      hundred islands, combined with the surrounding sea and coast of Saaremaa, cover 485.9 km², of which
      393.5 km² are marine waters. It evolved from a bird sanctuary founded in 1910, making it the oldest
      conservation reserve in the Baltic.
    landscape: >-
      The land has been gradually emerging from the sea for about seven thousand years, leaving relic coastal
      lakes cut off in former sheltered bays. Marine habitats encompass reefs, rocky skerries, shoals, shallow
      bays, and lagoons. On land, spring fens, rich fens, and calcareous fens flourish.


      Alvar grasslands form the most distinctive landscape. These alvars develop over limestone bedrock with
      less than twenty centimetres of lime-rich, shallow soil. They represent a globally rare habitat,
      occupying thirteen percent of the park's dry land area.


      On Harilaid, a teardrop-shaped peninsula tethered to the mainland by the narrow Harilaiu isthmus, sandy
      and gravelly beaches meet wind-sculpted coastal dunes. Having surfaced from the sea one or two millennia
      ago, it remains in perpetual drift: the shoreline migrates visibly with every gale. Harilaid has enjoyed
      formal protection since 1924 and was never permanently settled.
    wildlife: >-
      This is preeminently a realm of birds. Observers have recorded 247 species, 114 of them nesting. Common
      eider is the most abundant breeding waterbird, with more than 4,000 pairs. Migration brings masses of
      waterfowl, notably barnacle goose and Steller's eider. Rarity sightings include the [white-tailed
      eagle](/especie/haliaeetus_albicilla/) and [Eurasian eagle-owl](/especie/bubo_bubo/). Hunting is
      strictly prohibited.


      Mammals include [moose](/especie/alces_alces/), red deer, roe deer, and wild boar, alongside significant
      breeding haul-outs of [grey seal](/especie/halichoerus_grypus/). In the shallows and lagoons thrive
      Atlantic salmon, river lamprey, Baltic herring, natterjack toad, and medicinal leech.


      A third of all protected plant species in Estonia occur within the park. Notable species include
      shoreweed, sea wormwood, sea holly, black bog-rush, and the endemic Saaremaa yellow-rattle. The park
      protects 32 species of orchids, including *Dactylorhiza osiliensis*.
    visit: >-
      The visitor centre occupies the historic Loona manor complex in Rootsiküla, providing interpretation on
      nature and local maritime heritage. It features a permanent fossil exhibit, nature documentaries, and
      reference library, open year-round with wheelchair access. Guided nature walks and educational programs
      are arranged upon advance notice.


      On Harilaid, the Harilaiu hiking trail explores an untamed coast: low horizons, wind, golden sand,
      dunes, wind-flagged pines, calling seals and seabirds, derelict military remnants, and the tilted
      Kiipsaare lighthouse offshore. The full Harilaid loop measures eleven kilometres; a shorter
      nine-kilometre option visits Kiipsaare lighthouse and returns to the rest area, traversing designated
      bird and seal viewing points by the dunes and Laialepa Bay. Reaching the campsite at Laialepa Bay
      requires a walk of roughly 4 km along the path.


      On Vilsandi, two marked trails (6 km and 8 km) branch out from the island center near the biological
      station's lookout tower. They reveal maritime heritage (harbors, captains' cottages, windmills), the
      Vaika bird islets where Baltic nature conservation was born, and an operational lighthouse over two
      centuries old. Boat transfers to Vilsandi are coordinated at the visitor centre, with parking at
      Papissaare harbor. During calm low water in summer, one can walk from Saaremaa to Vilsandi, wading
      through knee-deep water across shallows and islets to Väike-Vilsandi.
    history: >-
      Baltic nature conservation began on the Vaika bird islets. The park's biological research station is
      situated on Vilsandi, and the territory is designated an Important Bird Area by BirdLife International.
    before: >-
      Kiipsaare lighthouse is private property on unstable seabed; climbing it is dangerous and prohibited. On
      Harilaid the trail is marked with red stakes and motor vehicles are banned. The Käkisilma-Vilsandi
      wading trail is temporarily closed due to dredging of the Papisaare-Vikati fairway. Best visiting
      season: May to October.
    around: >-
      Vilsandi shares open coast, eider, and grey seal with distant marine relatives: [Wadden Sea National
      Park (Denmark)](/lugar/wadden-sea-national-park-dinamarca/) and [Słowiński National
      Park](/lugar/slowinski-park-narodowy/) share barrier coastlines, eiders, and grey seals; [Lake Peipus
      and Emajõgi River Delta](/lugar/peipsi-jarv---emajoe-suursoo/) shares wetland shores and moose; while
      [Slītere National Park](/lugar/sliteres-nacionalais-parks/) shares Baltic grey seals and coastal moose
      habitat.
  fr:
    intro: >-
      En 1933, le phare de Kiipsaare, haut de 25 m, fut érigé à 150 m à l'intérieur des terres. Aujourd'hui,
      il s'élève à plus de 50 m au large dans les vagues, spectaculairement penché : l'érosion marine a
      emporté le sol sablonneux. C'est l'image la plus saisissante de Vilsandi, un parc façonné par les
      tempêtes à l'ouest de Saaremaa. Près de cent îles et îlots, combinés à la mer et au rivage de Saaremaa,
      totalisent 485,9 km², dont 393,5 km² de domaine marin. Il est né d'une réserve ornithologique fondée en
      1910, ce qui en fait le plus ancien sanctuaire naturel de toute la Baltique.
    landscape: >-
      Le relief émerge lentement de la mer depuis environ sept mille ans, isolant des lagunes relictuelles
      dans d'anciennes anses fermées. Les milieux marins regroupent récifs, écueils, hauts-fonds, baies peu
      profondes et lagunes côtières. À terre s'étendent des tourbières de sources, des tourbières basses
      calcaires et des bas-marais alcalins.


      Les alvars constituent le paysage le plus exceptionnel. Ces pelouses calcicoles se développent sur des
      dalles calcaires affleurantes avec moins de vingt centimètres de sol superficiel. C'est un biotope rare
      à l'échelle de la planète, occupant treize pour cent des terres émergées du parc.


      Sur Harilaid, une péninsule reliée au littoral par l'étroit isthme de Harilaiu, se succèdent cordons de
      galets, plages de sable et dunes vives. Émergée des eaux il y a un ou deux millénaires, elle est en
      perpétuelle mutation : le trait de côte bouge sous l'action des tempêtes. Harilaid bénéficie d'une
      protection depuis 1924 et est restée inhabitée.
    wildlife: >-
      C'est avant tout un royaume aviaire. On y a recensé 247 espèces d'oiseaux, dont 114 nicheuses. L'eider à
      duvet est le plus abondant, rassemblant plus de 4 000 couples. Lors des migrations s'arrêtent des nuées
      de bernaches nonnettes et d'eiders de Steller. Parmi les grands prédateurs nichent le [pygargue à queue
      blanche](/especie/haliaeetus_albicilla/) et le [hibou grand-duc](/especie/bubo_bubo/). La chasse y est
      formellement bannie.


      Parmi les mammifères figurent l'[élan](/especie/alces_alces/), le cerf élaphe, le chevreuil et le
      sanglier, ainsi que d'importantes colonies de mise bas de [phoque gris](/especie/halichoerus_grypus/).
      Dans les lagunes frayent le saumon atlantique et la lamproie de rivière, et sur les rivages prospèrent
      le hareng de la Baltique, le crapaud calamite et la sangsue médicinale.


      Un tiers des plantes protégées d'Estonie poussent dans le parc. Parmi elles figurent la littorelle,
      l'armoise maritime, le panicaut maritime, le choin noirâtre et le rhinanthe de Saaremaa. On recense 32
      espèces d'orchidées, dont *Dactylorhiza osiliensis*.
    visit: >-
      Le centre des visiteurs est installé dans l'ancien manoir de Loona, à Rootsiküla, renseignant sur la
      biodiversité et le passé maritime insulaire. Il dispose d'une exposition de fossiles, de documentaires
      et d'une bibliothèque de nature, ouvert toute l'année et adapté aux personnes à mobilité réduite. Des
      activités guidées sont proposées sur demande.


      À Harilaid, le sentier de Harilaiu longe une côte sauvage : horizon infini, vent du large, sable doré,
      pins couchés par les bourrasques, appels des phoques et le phare penché de Kiipsaare émergeant des
      vagues. La boucle complète fait onze kilomètres ; une variante de neuf kilomètres gagne le phare et
      revient au parking, longeant des observatoires ornithologiques vers la baie de Laialepa. Pour atteindre
      le bivouac de Laialepa, il faut marcher environ 4 km le long du sentier.


      Sur Vilsandi, deux sentiers balisés (6 km et 8 km) partent du cœur de l'île près de la tour de la
      station biologique. Ils révèlent le patrimoine maritime (ports côtiers, maisons de capitaines, moulins),
      les îlots de Vaika berceau de la protection de la nature en Baltique, et un phare vieux de plus de deux
      siècles. Les traversées en bateau vers Vilsandi se réservent au centre de visiteurs, avec embarquement
      au port de Papissaare. Par mer calme et basse mer en été, on peut franchir le détroit à pied depuis
      Saaremaa jusqu'à Vilsandi en pataugeant d'îlot en îlot jusqu'à Väike-Vilsandi.
    history: >-
      La préservation de la nature en mer Baltique est née sur les îlots de Vaika. La station de recherche
      biologique est établie sur Vilsandi, et le parc est classé Zone importante pour la conservation des
      oiseaux par BirdLife International.
    before: >-
      Le phare de Kiipsaare est une propriété privée sur un fond marin instable ; y monter est dangereux et
      prohibé. À Harilaid le tracé est balisé de piquets rouges et les engins motorisés sont interdits. Le
      passage pédestre Käkisilma-Vilsandi est fermé en raison de travaux de dragage du chenal
      Papisaare-Vikati. Saison favorable : mai à octobre.
    around: >-
      Vilsandi ne compte aucun voisin immédiat dans l'atlas mais partage ses paysages maritimes avec des
      sanctuaires lointains : le [Parc national de la mer des Wadden
      (Danemark)](/lugar/wadden-sea-national-park-dinamarca/) et le [Parc national de
      Słowiński](/lugar/slowinski-park-narodowy/) partagent rivages côtiers, eiders et phoques gris ; le [Lac
      Peïpous et delta de l'Emajõgi](/lugar/peipsi-jarv---emajoe-suursoo/) partage rivages et élan ; tandis
      que le [Parc national de Slītere](/lugar/sliteres-nacionalais-parks/) réunit le phoque gris et l'élan.
  de:
    intro: >-
      Im Jahr 1933 wurde der 25 m hohe Leuchtturm von Kiipsaare 150 m landeinwärts errichtet. Heute steht er
      mehr als 50 m weit im Meer, markant geneigt: Die Brandungserosion hat den stützenden Sandboden
      weggespült. Das veranschaulicht das Wesen von Vilsandi, einem von der Ostsee unablässig umgestalteten
      Park im Westen von Saaremaa. Fast hundert Inseln bedecken zusammen mit Meeresfläche und Küste 485,9 km²,
      wovon 393,5 km² auf Wasser entfallen. Er ging aus einem 1910 gegründeten Vogelschutzgebiet hervor und
      ist das älteste Reservat der gesamten Ostsee.
    landscape: >-
      Das Land hebt sich seit etwa siebentausend Jahren langsam aus den Fluten und hinterließ Reliktseen in
      abgeschnürten Buchten. Die marinen Lebensräume umfassen Riffe, Felsenholme, Flachwasserbuchten und
      Strandseen. An Land existieren Quellmoore, kalkreiche Flachmoore und artenreiche Niedermoore.


      Die Alvare bilden die außergewöhnlichste Landschaft. Diese Alvarwiesen entwickeln sich über
      Kalkfelsbänken mit weniger als zwanzig Zentimetern flachgründigem, kalkreichem Boden. Sie sind ein
      weltweit seltener Lebensraum und bedecken dreizehn Prozent der Landfläche des Parks.


      Auf Harilaid, einer über die schmale Nehrung Harilaiu angebundenen Halbinsel, erstrecken sich
      Sandstrände, Geröllbänke und Dünen. Sie tauchte erst vor ein bis zwei Jahrtausenden aus dem Meer auf und
      wandert unablässig mit den Strömungen. Harilaid steht seit 1924 unter Schutz und war stets unbewohnt.
    wildlife: >-
      Vilsandi ist ein Reich der Vögel. Es wurden 247 Vogelarten erfasst, davon 114 Brutvogelarten. Die
      Eiderente ist mit mehr als 4.000 Brutpaaren am häufigsten vertreten. Auf dem Zug rasten Massen von
      Weißwangengänsen und Scheckenten. Zu den seltenen Brutvögeln zählen
      [Seeadler](/especie/haliaeetus_albicilla/) und [Uhu](/especie/bubo_bubo/). Die Jagd ist streng verboten.


      Unter den Säugetieren leben [Elche](/especie/alces_alces/), Rothirsche, Rehe und Wildschweine neben
      bedeutenden Wurfgemeinschaften der [Kegelrobbe](/especie/halichoerus_grypus/). In Lagunen und
      Flachgewässern kommen Atlantischer Lachs und Flussneunauge vor, an den Ufern Ostseehering, Kreuzkröte
      und Medizinischer Blutegel.


      Ein Drittel aller geschützten Pflanzen Estlands wächst im Park, darunter Strandling, Meerwermut,
      Stranddistel, Schwarzes Kopfried und der endemische Saaremaa-Klappertopf. Es gibt 32 Orchideenarten,
      darunter *Dactylorhiza osiliensis*.
    visit: >-
      Das Besucherzentrum befindet sich im historischen Gutshaus Loona in Rootsiküla und vermittelt Natur- und
      Kulturgeschichte der Inselwelt. Es bietet eine Fossilienausstellung, Naturfilme und Bibliothek, ist
      ganzjährig geöffnet und rollstuhlgerecht ausgebaut. Naturkundliche Führungen werden auf Voranmeldung
      durchgeführt.


      Auf Harilaid erschließt der Wanderweg Harilaiu eine einsame Küstenlandschaft: weiter Horizont, Seewind,
      Dünensand, windgeschorene Kiefern, Rufe von Robben und der schiefe Leuchtturm Kiipsaare in den Wellen.
      Der Rundweg misst elf Kilometer; eine verkürzte Variante über neun Kilometer führt zum Leuchtturm und
      zurück, vorbei an Beobachtungspunkten an der Bucht Laialepa. Bis zum Zeltplatz an der Bucht Laialepa
      wandert man etwa 4 km entlang des Pfads.


      Auf Vilsandi beginnen zwei markierte Wege (6 km und 8 km) nahe dem Aussichtsturm der Biologischen
      Station. Sie führen zu historischem Seefahrterbe (Bootshäfen, Kapitänshäusern, Mühlen), den
      Vaika-Vogelinseln, an denen der baltische Naturschutz begann, und einem über zwei Jahrhunderte alten
      Leuchtturm. Überfahrten nach Vilsandi erfragt man im Besucherzentrum; Parkmöglichkeiten bestehen am
      Hafen Papissaare. Bei Niedrigwasser und ruhiger See kann man im Sommer von Saaremaa nach Vilsandi durch
      knietiefes Wasser über Holme nach Väike-Vilsandi waten.
    history: >-
      Der Naturschutz im Ostseeraum nahm auf den Vaika-Vogelinseln seinen Anfang. Die Biologische
      Forschungsstation des Parks befindet sich auf Vilsandi, und das Gebiet ist als Important Bird Area
      ausgewiesen.
    before: >-
      Der Leuchtturm von Kiipsaare befindet sich in Privatbesitz auf unsicherem Grund; das Besteigen ist
      verboten. Auf Harilaid ist der Weg mit roten Pfählen markiert und das Befahren mit Kraftfahrzeugen
      untersagt. Die Wattpassage Käkisilma-Vilsandi ist wegen Baggerarbeiten zeitweise geschlossen. Beste
      Besuchszeit: Mai bis Oktober.
    around: >-
      Vilsandi besitzt keine direkten Nachbarn im Atlas, teilt jedoch marine Lebensräume mit weit entfernten
      Zonen: Der [Nationalpark Wattenmeer (Dänemark)](/lugar/wadden-sea-national-park-dinamarca/) und der
      [Slowinzischer Nationalpark](/lugar/slowinski-park-narodowy/) teilen Flachküsten, Eiderenten und
      Kegelrobben; der [Peipussee und Emajõgi-Flussdelta](/lugar/peipsi-jarv---emajoe-suursoo/) teilt
      Strandwiesen und Elch; während der [Nationalpark Slītere](/lugar/sliteres-nacionalais-parks/)
      Kegelrobben und Küstenelche aufweist.
  it:
    intro: >-
      Nel 1933 il faro di Kiipsaare, alto 25 m, fu eretto a 150 m nell'entroterra. Oggi si trova a più di 50 m
      in mezzo al mare, vistosamente inclinato: i flutti hanno scalzato la sabbia su cui posava. È l'emblema
      migliore di Vilsandi, un parco costantemente rimodellato dalle mareggiate nell'ovest di Saaremaa. Quasi
      cento isole, insieme al mare e alla costa di Saaremaa, sommano 485,9 km², di cui 393,5 km² marini. È
      nato da una riserva per l'avifauna fondata nel 1910, risultando l'area protetta più antica dell'intero
      bacino baltico.
    landscape: >-
      La terraferma si solleva lentamente dal mare da circa settemila anni lasciando specchi d'acqua relitti
      in antiche insenature rimaste chiuse. Gli ambienti marittimi comprendono scogliere, isolotti rocciosi,
      bassifondi, baie poco profonde e lagune costiere. A terra si estendono torbiere di risorgiva, torbiere
      alcaline e acquitrini ricchi di specie.


      Gli alvar disegnano il paesaggio più inconsueto. I prati di alvar si sviluppano su affioramenti calcarei
      con meno di venti centimetri di suolo superficiale ricco di calce. Costituiscono un habitat raro su
      scala globale, occupando il tredici per cento delle terre emerse del parco.


      A Harilaid, una penisola rettangolare raccordata alla costa dallo stretto istmo di Harilaiu, si
      alternano spiagge di sabbia e ciottoli e dune costiere. È emersa dalle onde uno o due millenni fa e
      rimane in perenne movimento: il profilo litoraneo muta incessantemente. Harilaid è protetta dal 1924 ed
      è sempre rimasta disabitata.
    wildlife: >-
      È essenzialmente un regno ornitologico. Sono state censite 247 specie, 114 delle quali nidificanti.
      L'edredone comune è il più abbondante con oltre 4.000 coppie. Durante i passi migratori sostano masse di
      oche facciabianca e re d'Eider. Tra i rapaci nidificano l'[Aquila di
      mare](/especie/haliaeetus_albicilla/) e il [Gufo reale](/especie/bubo_bubo/). La caccia è rigorosamente
      vietata.


      Tra i mammiferi compaiono [alci](/especie/alces_alces/), cervi nobili, caprioli e cinghiali, oltre a
      colonie riproduttive di [Foca grigia](/especie/halichoerus_grypus/). Lungo la riva e nelle lagune
      nuotano il salmone atlantico e la lampreda di fiume, oltre ad aringa baltica, rospo smeraldino e
      sanguisuga medicinale.


      Un terzo di tutta la flora protetta dell'Estonia vegeta nel parco. Tra queste spiccano la littorella,
      l'assenzio marino, l'eringio marittimo, il giunco nero e la cresta di gallo di Saaremaa. Si contano 32
      specie di orchidee, tra cui *Dactylorhiza osiliensis*.
    visit: >-
      Il centro visitatori ha sede nello storico maniero di Loona a Rootsiküla e illustra la natura e le
      vicende marinare dell'arcipelago. Offre una mostra permanente di fossili, filmati naturalistici e testi
      di consultazione, aperto tutto l'anno con accessibilità per sedie a rotelle. Vengono curate attività
      divulgative su prenotazione.


      A Harilaid, il sentiero di Harilaiu corre su una costa aspra e deserta: orizzonti piatti, vento
      sferzante, sabbia dorata, pini inclinati dalle tempeste, richiami di foche e il faro pendente di
      Kiipsaare tra le onde. L'anello complessivo misura undici chilometri; un percorso ridotto di nove
      chilometri tocca il faro e ritorna al parcheggio, costeggiando aree di avvistamento foche e avifauna
      presso le dune e la baia di Laialepa. Per giungere al campeggio di Laialepa si cammina per circa 4 km
      lungo la pista.


      A Vilsandi due itinerari tracciati (6 km e 8 km) si diramano dal centro dell'isola vicino alla torretta
      della stazione biologica. Raccontano il passato marittimo (scali, case dei capitani, mulini), gli
      isolotti Vaika dove nacque la conservazione baltica e un faro funzionante con oltre due secoli di
      storia. I collegamenti marittimi per Vilsandi si concordano al centro visitatori, con imbarco al molo di
      Papissaare. In estate con bassa marea e mare calmo è possibile raggiungere a piedi Vilsandi da Saaremaa,
      guadando tratti d'acqua bassi tra gli scogli fino a Väike-Vilsandi.
    history: >-
      La tutela naturalistica nel mar Baltico nacque proprio sugli scogli di Vaika. La stazione di ricerca
      biologica sorge a Vilsandi e il comprensorio è riconosciuto come Important Bird Area da BirdLife
      International.
    before: >-
      Il faro di Kiipsaare è proprietà privata su fondale instabile; salirvi è vietato e pericoloso. A
      Harilaid il tracciato è segnalato da picchetti rossi e i mezzi a motore sono interdetti. Il guado di
      Käkisilma-Vilsandi è provvisoriamente chiuso per lavori di dragaggio nel canale Papisaare-Vikati.
      Periodo consigliato: da maggio a ottobre.
    around: >-
      Vilsandi non presenta aree contigue nell'atlas ma condivide specie e dinamiche costiere con siti
      lontani: il [Parco Nazionale del Mare di Wadden (Danimarca)](/lugar/wadden-sea-national-park-dinamarca/)
      e il [Parco Nazionale di Słowiński](/lugar/slowinski-park-narodowy/) spartiscono coste sabbiose,
      edredoni e foche grigie; il [Lago Peipus e Delta del Fiume
      Emajõgi](/lugar/peipsi-jarv---emajoe-suursoo/) condivide rive lagunari e alce; mentre il [Parco
      Nazionale di Slītere](/lugar/sliteres-nacionalais-parks/) ospita foche grigie e alci costieri.
  pt:
    intro: >-
      Em 1933 o farol de Kiipsaare, com 25 m de altura, foi erguido a 150 m terra adentro. Hoje ergue-se a
      mais de 50 m mar adentro, dramaticamente inclinado: a abrasão marinha removeu o solo arenoso que o
      suportava. Essa é a imagem marcante de Vilsandi, um parque que o mar continua a esculpir no ocidente de
      Saaremaa. Quase cem ilhas e ilhéus, em conjunto com o mar e a linha costeira de Saaremaa, somam 485,9
      km², dos quais 393,5 km² são águas marinhas. Nasceu a partir de uma reserva ornitológica fundada em
      1910, constituindo o espaço protegido mais antigo de todo o Báltico.
    landscape: >-
      O relevo ergue-se lentamente das águas há cerca de sete mil anos, isolando lagoas relíquias em antigas
      enseadas fechadas. Os biótopos marinhos abrangem recifes, recifes de pedra, baixios, baías pouco
      profundas e lagunas litorais. Em terra surgem turfeiras de nascente, turfeiras calcárias e pauis ricos
      em biodiversidade.


      Os alvares desenham a paisagem mais singular. Estas pradarias de alvar desenvolvem-se sobre lajes
      calcárias com menos de vinte centímetros de solo fértil em cal. Representam um habitat escasso à escala
      global, cobrindo treze por cento da superfície terrestre do parque.


      Em Harilaid, uma península unida ao território pelo estreito istmo de Harilaiu, estendem-se praias de
      areia e calhaus rolados e dunas ativas. Emergiu do mar há apenas um ou dois milénios e mantém-se em
      constante mutação com as tempestades. Harilaid beneficia de estatuto protegido desde 1924 e nunca teve
      povoamento permanente.
    wildlife: >-
      É primordialmente um santuário de aves. Foram inventariadas 247 espécies, 114 das quais nidificantes. O
      eider-edredão é a ave marinha mais abundante, congregando mais de 4.000 casais reprodutores. Durante as
      migrações acolhe bandos de ganso-de-faces-brancas e eider-camuflado. Entre as aves raras nidificam a
      [águia-rabalva](/especie/haliaeetus_albicilla/) e o [bufo-real](/especie/bubo_bubo/). A caça é
      estritamente interdita.


      Nos mamíferos registam-se o [alce](/especie/alces_alces/), veados, corços e javalis, a par de
      maternidades costeiras de [foca-cinzenta](/especie/halichoerus_grypus/). Nas águas rasas e lagunas
      ocorrem o salmão-do-atlântico e a lampreia-de-rio, além de arenque-do-báltico, sapo-corredor e
      sanguessuga-medicinal.


      Um terço de todas as plantas sob proteção em território estónio ocorre nos limites do parque. Entre elas
      figuram a littorela, o absinto-marítimo, o cardo-marítimo, o junco-negro e o rinchão de Saaremaa. Estão
      identificadas 32 espécies de orquídeas, incluindo *Dactylorhiza osiliensis*.
    visit: >-
      O centro de acolhimento ocupa o solar histórico de Loona, em Rootsiküla, divulgando a biodiversidade e o
      património marítimo insular. Dispõe de mostra permanente de fósseis, videoteca e biblioteca, funcionando
      todo o ano com acessibilidade para pessoas com mobilidade reduzida. Promove programas educativos e
      visitas guiadas mediante marcação.


      Em Harilaid, o trilho de Harilaiu percorre uma orla deserta: horizonte raso, vento vigoroso, areia
      dourada, pinheiros inclinados pelo vento, vocalizações de focas e o farol inclinado de Kiipsaare nas
      ondas. A volta completa tem onze quilómetros; uma opção de nove quilómetros vai até ao farol e regressa
      ao parqueamento, passando por pontos de observação de focas e avifauna junto às dunas e à enseada de
      Laialepa. Até ao acampamento de Laialepa caminha-se cerca de 4 km pela vereda.


      Em Vilsandi, dois percursos balizados (6 km e 8 km) arrancam do centro da ilha perto da torre da estação
      biológica. Evidenciam o passado naval (ancoradouros, casas de capitães, moinhos), os ilhéus de Vaika
      onde nasceu a conservação no Báltico, e um farol operacional com mais de dois séculos. As travessias de
      barco para Vilsandi marcam-se no centro de acolhimento, com embarque no porto de Papissaare. No verão,
      com maré baixa e tempo calmo, é possível atravessar a pé de Saaremaa a Vilsandi, caminhando por baixios
      com água pelos joelhos de ilhéu em ilhéu até Väike-Vilsandi.
    history: >-
      A salvaguarda da natureza no mar Báltico deu os primeiros passos nos ilhéus de aves de Vaika. A base
      científica do parque situa-se em Vilsandi, sendo o conjunto catalogado como Área Importante para as Aves
      pela BirdLife International.
    before: >-
      O farol de Kiipsaare constitui propriedade privada sobre fundos marinhos instáveis; subir à estrutura é
      perigoso e proibido. Em Harilaid a vereda está assinalada por estacas vermelhas e veículos motorizados
      são estritamente interditos. O vau pedestre Käkisilma-Vilsandi encontra-se encerrado devido a dragagens
      no canal Papisaare-Vikati. Época ideal: maio a outubro.
    around: >-
      Vilsandi não conta com áreas limítrofes imediatas no atlas, mas partilha dinâmicas ecológicas com zonas
      distantes: o [Parque Nacional do Mar de Wadden (Dinamarca)](/lugar/wadden-sea-national-park-dinamarca/)
      e o [Parque Nacional de Słowiński](/lugar/slowinski-park-narodowy/) partilham cordões litorais, eiders e
      focas-cinzentas; o [Lago Peipus e Delta do Rio Emajõgi](/lugar/peipsi-jarv---emajoe-suursoo/) partilha
      lagoas e alces; e o [Parque Nacional de Slītere y Costa del Estrecho de
      Irbe](/lugar/sliteres-nacionalais-parks/) abriga focas-cinzentas e alces costeiros.
