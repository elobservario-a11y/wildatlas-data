resumen:
  es: >-
    Desfiladero granítico submediterráneo de 18 km de longitud que constituye el punto de mayor diversidad de
    herpetofauna de Bulgaria.
  en: >-
    Sub-Mediterranean granite gorge stretching 18 km that represents Bulgaria's foremost hotspot for reptile
    and amphibian diversity.
  fr: >-
    Défilé granitique subméditerranéen de 18 km de long constituant le principal sanctuaire herpétologique de
    Bulgarie.
  de: >-
    Submediterrane Granitschlucht von 18 km Länge, die den artenreichsten Herpetofauna-Hotspot Bulgariens
    bildet.
  it: >-
    Forra granitica submediterranea di 18 km che costituisce il più importante polo di biodiversità
    erpetologica della Bulgaria.
  pt: >-
    Desfiladeiro granítico submediterrânico com 18 km de extensão que acolhe a maior diversidade herpetológica
    da Bulgária.
unico:
  es: >-
    Un tajo donde se cruzan dos climas y se encuentran los pasillos de aves y de grandes mamíferos, y donde la
    carretera es la principal amenaza.
  en: >-
    A bottleneck canyon where two climatic realms intersect and major mammal corridors converge, under severe
    ecological pressure from heavy highway traffic.
  fr: >-
    Un défilé rocheux où se croisent deux climats et où convergent les couloirs de grands mammifères, menacé
    par la densité du trafic routier.
  de: >-
    Eine Engstelle, an der zwei Klimazonen aufeinandertreffen und Wildtierkorridore kollidieren, akut bedroht
    durch den Schwerlastverkehr.
  it: >-
    Una gola rupestre dove si incontrano due climi e convergono le rotte di uccelli e grandi mammiferi,
    minacciata dal traffico stradale.
  pt: >-
    Uma garganta onde se cruzam dois climas e confluem corredores faunísticos de mamíferos e aves, sob ameaça
    da estrada rodoviária.
observaciones:
  es: 'Si vas a cruzarla en coche, extrema la atención: la fauna atraviesa la carretera.'
texto:
  es:
    intro: >-
      Una carretera, una vía de tren y un río apretados en el mismo tajo. La garganta de Kresna, en el
      suroeste de Bulgaria, es un valle escarpado de unos 18 km que ha excavado el río Struma entre la montaña
      Maleshevska y el Pirin. Por aquí pasan también lobos, osos y aves migratorias, porque la garganta es a
      la vez un pasillo de comunicaciones y un corredor de vida salvaje.
    landscape: >-
      El Struma se abre paso por un valle estrecho y de pendientes fuertes, tallado en profundidad en granitos
      y rocas metamórficas. El terreno varía mucho de un tramo a otro: laderas pedregosas, grandes cortados
      verticales y pequeños tramos rocosos. Los cauces conservan formas naturales o seminaturales, con bosques
      de ribera de aliso, sauce y plátano oriental.


      Aquí pasa el límite entre el clima mediterráneo y el centroeuropeo, y esa frontera explica la variedad:
      una enorme diversidad de especies animales y vegetales, muchas de ellas endémicas o relictas. En los
      bosques hay robles como Quercus pubescens, Carpinus orientalis y Fraxinus ornus, y plantas mediterráneas
      como Quercus coccifera y Phillyrea.


      En el sur, la garganta divide en dos la reserva de Tisata, que protege la flora mediterránea de hoja
      perenne: las mayores poblaciones búlgaras de enebro griego y olivo, y la única población compacta de
      enebro arbóreo de Bulgaria.
    wildlife: >-
      Es una garganta pequeña con una lista enorme: unas 31 especies de reptiles, 75 de mamíferos y 232 de
      aves. Los registros del lugar incluyen la [nutria](/especie/lutra_lutra/), el
      [lobo](/especie/canis_lupus/) y el [oso pardo](/especie/ursus_arctos/); entre los reptiles, el [galápago
      de Hermann](/especie/testudo_hermanni/) y la culebra leopardo; y peces como la marisca y el asp, junto
      al tritón crestado de Karelín.


      Para las aves, la garganta es parte de la Via Aristotelis, una de las principales rutas aéreas de las
      aves migratorias de Europa a África. El [alimoche](/especie/neophron_percnopterus/) y otras especies
      raras y amenazadas la usan como lugar de descanso. Y para los mamíferos grandes es un corredor entre las
      montañas de la península balcánica.
    visit: >-
      La garganta se atraviesa sobre todo por la carretera I-1, que la recorre de norte a sur en unos 23,1 km,
      y por el ferrocarril Sofía–Blagoevgrad–Kulata, que corre unos 20 km en paralelo por la ladera izquierda
      del valle. Verla es, ante todo, cruzarla con la vista abierta.
    history: >-
      En 1913, durante la Segunda Guerra Balcánica, se libró aquí la batalla de la garganta de Kresna entre
      Bulgaria y Grecia.


      La conservación gira en torno a la carretera. La propuesta de lugar de importancia comunitaria llegó en
      2007 y la designación como zona especial de conservación, en 2021. Con la carretera actual y sin medidas
      de mitigación suficientes ya se han producido muchos atropellos de fauna. El Ministerio búlgaro señala
      que la garganta es importante para proteger flora, fauna y hábitats de excepcional biodiversidad, y el
      acuerdo que cita prevé construir la autopista Struma fuera de la garganta. La Convención de Berna ha
      instado a las autoridades búlgaras a hacerlo así, y el objetivo acordado es sacar por completo el
      tráfico de tránsito y dejar la I-1 (E79) como carretera local.
    before: 'Si vas a cruzarla en coche, extrema la atención: la fauna atraviesa la carretera.'
    around: >-
      El [Parque Nacional Pirin - Bosque Salvaje](/lugar/pirin-national-park-forest-wilderness/) queda a unos
      9 km y el [Parque Nacional Rila - Bosques Antiguos](/lugar/rila-national-park-old-forests/) a unos
      veintiséis kilómetros. Más lejos, el [Parque Natural de Strandzha](/lugar/priroden-park-strandzha/)
      comparte con la garganta la tortuga de Hermann y la nutria.
  en:
    intro: >-
      A highway, a railway line, and a rushing river wedged tightly inside the same rocky defile. Kresna Gorge
      in southwestern Bulgaria forms an 18 km rugged ravine carved by the Struma River between the Maleshevska
      Mountains and the towering Pirin massif. Brown bears, wolves, and migrating flyways channel through this
      rocky narrows, acting simultaneously as a crucial international transport artery and an irreplaceable
      ecological lifeline.
    landscape: >-
      The Struma carves through a narrow, steeply terraced valley incised into ancient crystalline granites
      and metamorphic bedrocks. The topography changes sharply from one reach to another: unstable scree
      slopes, vertical granite cliffs, and boulder-choked riverbeds. The river retains semi-natural braided
      gravel bars fringed by riparian gallery woodlands of grey alder, white willow, and oriental plane.


      Here lies the transition between Mediterranean and Central European climatic zones, fostering
      extraordinary biological richness: dense concentrations of endemic, thermophilous, and relict species.
      Surrounding hillsides support sub-Mediterranean oak woodlands with downy oak (Quercus pubescens),
      oriental hornbeam (Carpinus orientalis), and flowering ash (Fraxinus ornus), alongside evergreen maquis
      species like kermes oak (Quercus coccifera) and mock privet (Phillyrea latifolia).


      To the south, the gorge cleaves the Tisata Nature Reserve into two sectors, established to protect
      unique evergreen Mediterranean flora: Bulgaria's largest populations of Grecian juniper (Juniperus
      excelsa) and wild olive, alongside the nation's solitary dense stand of tree heath (Erica arborea).
    wildlife: >-
      For such a compact defile, its biodiversity tally is astonishing: roughly 31 reptile species, 75 mammal
      species, and 232 recorded bird species. Mammal records encompass the [Eurasian
      otter](/especie/lutra_lutra/), the grey [wolf](/especie/canis_lupus/), and roaming [brown
      bears](/especie/ursus_arctos/); reptiles feature [Hermann's tortoise](/especie/testudo_hermanni/) and
      the leopard snake; while native ichthyofauna includes the Struma spined loach and asp, alongside the
      Balkan crested newt.


      For migratory birds, the gorge forms a key bottleneck along the Via Aristotelis flyway, one of Europe's
      primary migration routes funneling southbound migrants to Africa. The globally endangered [Egyptian
      vulture](/especie/neophron_percnopterus/) and rare raptors utilize the thermal updrafts and rocky crags
      for roosting. For large terrestrial carnivores, it serves as an indispensable genetic bridge uniting
      mountain ranges of the southern Balkan Peninsula.
    visit: >-
      Travellers primarily experience the canyon via the main national road I-1, which threads the defile from
      north to south over roughly 23.1 km, or from the Sofia–Blagoevgrad–Kulata railway line running parallel
      for some 20 km along the valley's left bank. Experiencing the gorge is, above all, a slow drive or train
      journey undertaken with attentive eyes.
    history: >-
      In 1913, during the Second Balkan War, the decisive Battle of Kresna Gorge was fought across these rocky
      narrows between the armies of Bulgaria and Greece.


      Modern environmental efforts revolve directly around the transport corridor. Proposed as a Site of
      Community Importance in 2007, it gained Special Area of Conservation designation in 2021. The
      unmitigated two-lane road causes devastating wildlife roadkill. The Bulgarian Ministry acknowledges the
      gorge's exceptional biodiversity value, and official agreements endorse routing the future Struma
      Motorway entirely outside the canyon. The Bern Convention has repeatedly urged Bulgarian authorities to
      honor this pledge, redirecting through-traffic and retaining the existing I-1 (E79) solely for local
      access.
    before: >-
      If you drive through the gorge by car, exercise extreme vigilance: wildlife frequently crosses the
      roadway day and night.
    around: >-
      [Pirin National Park - Forest Wilderness](/lugar/pirin-national-park-forest-wilderness/) lies roughly 9
      km to the east and [Rila National Park - Old Forests](/lugar/rila-national-park-old-forests/) twenty-six
      kilometres to the north. Further east, [Strandzha Nature Park](/lugar/priroden-park-strandzha/) shares
      with Kresna Hermann's tortoises and otters.
  fr:
    intro: >-
      Une route, une voie ferrée et un fleuve fougueux resserrés au fond de la même faille. Les gorges de
      Kresna, dans le sud-ouest de la Bulgarie, forment une entaille escarpée d'environ 18 km que le fleuve
      Strouma a creusée entre la montagne de Maleshevska et le massif du Pirin. Loups, ours et oiseaux
      migrateurs y transitent continuellement, car ce défilé constitue à la fois un axe de circulation
      stratégique et un sanctuaire pour la faune.
    landscape: >-
      Le Strouma s'ouvre un passage dans une vallée étroite aux versants abrupts, profondément sculptée dans
      les granites et les roches métamorphiques. La morphologie varie fortement selon les tronçons : éboulis
      instables, imposantes parois rocheuses et bancs de galets. Le lit fluvial conserve des berges sauvages
      bordées d'aulnes, de saules et de platanes d'Orient.


      Ici passe la zone de contact entre le climat méditerranéen et le domaine continental, générant une
      diversité biologique exceptionnelle riche en taxons endémiques ou reliques. Les versants accueillent des
      chênaies pubescentes avec charme d'Orient et frêne à fleurs, ainsi que des arbustes méditerranéens comme
      le chêne kermès et le filaire.


      Au sud, les gorges coupent en deux la réserve naturelle de Tisata, créée pour sauvegarder la flore
      sempervirente : les plus vastes populations bulgares de genévrier grec et d'olivier sauvage, ainsi que
      l'unique peuplement continu de bruyère arborescente de Bulgarie.
    wildlife: >-
      Pour un défilé si exigu, la diversité faunistique s'avère vertigineuse : environ 31 espèces de reptiles,
      75 de mammifères et 232 d'oiseaux. Les observations régulières comptent la [loutre
      d'Europe](/especie/lutra_lutra/), le [loup gris](/especie/canis_lupus/) et l'[ours
      brun](/especie/ursus_arctos/) ; parmi les reptiles figurent la [tortue
      d'Hermann](/especie/testudo_hermanni/) et la couleuvre léopard ; les eaux abritent l'aspe et la loche de
      Strouma, ainsi que le triton crêté de Karéline.


      Pour l'avifaune, la gorge s'inscrit sur la Via Aristotelis, l'un des corridors migratoires majeurs
      reliant l'Europe à l'Afrique. Le [vautour percnoptère](/especie/neophron_percnopterus/) et d'autres
      rapaces menacés y trouvent reposoir et ascendances thermiques. Pour les grands prédateurs, c'est un
      couloir unissant les massifs des Balkans.
    visit: >-
      Le défilé se traverse principalement par la route I-1, qui parcourt les gorges du nord au sud sur
      environ 23,1 km, et par la voie ferrée Sofia–Blagoevgrad–Kulata, qui s'étire sur quelque 20 km en
      parallèle sur la rive gauche. La découvrir consiste avant tout à la traverser avec un regard attentif.
    history: >-
      En 1913, au cours de la deuxième guerre balkanique, se déroula ici la rude bataille des gorges de Kresna
      opposant la Bulgarie et la Grèce.


      Les enjeux contemporains tournent autour de l'axe routier. Proposé comme site d'intérêt communautaire en
      2007, le défilé a été désigné zone spéciale de conservation en 2021. Le trafic routier provoque de
      graves hécatombes par collision de faune. Le ministère bulgare reconnaît la valeur de ce couloir de
      biodiversité, et les accords prévoient le tracé de la future autoroute Strouma hors du défilé. La
      convention de Berne a sommé les autorités de dévier le transit lourd et de dédier la route I-1 (E79) à
      la desserte locale.
    before: >-
      Si vous traversez le défilé en automobile, redoublez de vigilance : la faune sauvage traverse
      fréquemment la chaussée.
    around: >-
      Le [parc national du Pirin - Forêt sauvage](/lugar/pirin-national-park-forest-wilderness/) se trouve à
      environ 9 km et le [parc national de Rila - Forêts anciennes](/lugar/rila-national-park-old-forests/) à
      environ vingt-six kilomètres. Plus à l'est, le [parc naturel de
      Strandzha](/lugar/priroden-park-strandzha/) partage avec Kresna la tortue d'Hermann et la loutre.
  de:
    intro: >-
      Eine Fernstraße, eine Bahnlinie und ein reißender Fluss, eingezwängt in dieselbe enge Felsrinne. Die
      Kresna-Schlucht im Südwesten Bulgariens ist ein steiles Felsental von rund 18 km Länge, das der Fluss
      Struma zwischen Maleschewska-Gebirge und Pirin-Massiv gegraben hat. Wölfe, Bären und Zugvögel passieren
      diese Enge gleichermaßen, denn die Schlucht ist Verkehrsachse und lebenswichtiger Wildtierkorridor
      zugleich.
    landscape: >-
      Die Struma bricht durch ein schmales Tal mit steilen Hängen, tief eingeschnitten in alte Granite und
      kristalline Gneise. Das Relief wechselt unvermittelt: Geröllhalden, senkrechte Felstürme und naturnahe
      Kiesbänke. Die Ufer säumen Galeriewälder aus Schwarzerle, Weide und Morgenländischer Platane.


      Hier verläuft die Klimagrenze zwischen Mittelmeerraum und mitteleuropäischem Kontinentalklima, was den
      Artenreichtum erklärt: Eine Fülle endemischer und wärmeliebender Reliktarten gedeiht an den Flanken. In
      den Buschwäldern wachsen Flaumeiche, Orientalische Hainbuche und Manna-Esche, untermischt mit
      mediterranen Holzarten wie Kerme-Eiche und Steinlinde.


      Im Süden teilt die Schlucht das Naturschutzgebiet Tisata in zwei Hälften, das zum Schutz der immergrünen
      Flora ausgewiesen wurde: Es birgt Bulgariens größte Bestände von Griechischem Wacholder und Wildölbaum
      sowie das einzige geschlossene Vorkommen der Baumheide in Bulgarien.
    wildlife: >-
      Für eine so schmale Schlucht ist die Artenliste überragend: Rund 31 Reptilienarten, 75 Säugetierarten
      und 232 Vogelarten sind dokumentiert. Regelmäßig nachgewiesen werden
      [Fischotter](/especie/lutra_lutra/), [Wolf](/especie/canis_lupus/) und
      [Braunbär](/especie/ursus_arctos/); unter den Reptilien leben [Griechische
      Landschildkröte](/especie/testudo_hermanni/) und Europäische Katzennatter; in den Gewässern schwimmen
      Rapfen und Balkan-Steinbeißer, begleitet vom Östlichen Kammmolch.


      Für Zugvögel bildet das Tal einen Hauptkorridor der Via Aristotelis auf dem Zug nach Afrika. Der
      bedrohte [Schmutzgeier](/especie/neophron_percnopterus/) und seltene Greifvögel nutzen die Felswände als
      Rastplatz. Für Großsäuger ist die Schlucht eine unverzichtbare Brücke zwischen den Gebirgszügen der
      Balkanhalbinsel.
    visit: >-
      Reisende erleben das Tal vor allem auf der Fernstraße I-1, die den Canyon von Nord nach Süd auf etwa
      23,1 km durchmisst, sowie aus den Zügen der Bahnstrecke Sofia–Blagoewgrad–Kulata, die rund 20 km
      parallel am linken Talhang verläuft. Die Schlucht zu erkunden bedeutet vor allem, sie mit offenen Augen
      zu durchqueren.
    history: >-
      Im Jahr 1913, während des Zweiten Balkankriegs, tobte hier die erbitterte Schlacht in der
      Kresna-Schlucht zwischen Bulgarien und Griechenland.


      Der Naturschutz steht ganz im Zeichen des Straßenbaus. 2007 als FFH-Gebiet vorgeschlagen, folgte 2021
      die Ausweisung als Besonderes Erhaltungsgebiet. Der dichte Verkehr fordert dramatische Verluste unter
      querenden Tieren. Das bulgarische Ministerium betont den Ausnahmerang des Biotopkorridors, und
      getroffene Vereinbarungen sehen den Bau der Struma-Autobahn außerhalb der Schlucht vor. Die Berner
      Konvention mahnte die Regierung an, den Transitverkehr umzuleiten und die I-1 (E79) nur als Lokalstraße
      zu belassen.
    before: >-
      Fährst du mit dem Auto durch die Schlucht, sei äußerst wachsam: Wildtiere queren die Fahrbahn
      regelmäßig.
    around: >-
      Der [Nationalpark Pirin – Waldwildnis](/lugar/pirin-national-park-forest-wilderness/) liegt etwa 9 km
      östlich und der [Nationalpark Rila – Urwälder](/lugar/rila-national-park-old-forests/) rund
      sechsundzwanzig Kilometer nördlich. Weiter östlich teilt der [Naturpark
      Strandscha](/lugar/priroden-park-strandzha/) Landschildkröten und Fischotter mit Kresna.
  it:
    intro: >-
      Una strada statale, una ferrovia e un fiume impetuoso serrati all'interno del medesimo solco rupestre.
      La gola di Kresna, nel sud-ovest della Bulgaria, è una forra dirupata di circa 18 km scavata dal fiume
      Struma tra i monti Maleshevska e il massiccio del Pirin. Vi transitano lupi, orsi e stormi migratori,
      poiché la forra rappresenta al contempo un'arteria di comunicazione e un insostituibile corridoio di
      vita selvatica.
    landscape: >-
      Lo Struma si fa strada entro una valle angusta e scoscesa, incisa nei graniti primordiali e nelle rocce
      metamorfiche. La morfologia varia repentinamente: ghiaioni instabili, vertiginose pareti a picco e greti
      ciottolosi. Le sponde mantengono foreste a galleria di ontano nero, salice bianco e platano orientale.


      Qui corre la linea di contatto tra clima mediterraneo e clima continentale, che genera una straordinaria
      ricchezza biologica ricca di endemismi e specie relitte. I versanti boscati ospitano roverella, carpino
      orientale e orniello, accanto a formazioni mediterranee di quercia spinosa e ilatro.


      A sud la gola divide in due parti la riserva naturale di Tisata, istituita a tutela della flora
      sempreverde: le più consistenti popolazioni bulgare di ginepro greco e olivo selvatico, nonché l'unica
      formazione compatta di erica arborea della Bulgaria.
    wildlife: >-
      Per una gola così racchiusa l'inventario faunistico è sbalorditivo: circa 31 specie di rettili, 75 di
      mammiferi e 232 di uccelli. Le presenze regolari contano la [lontra europea](/especie/lutra_lutra/), il
      [lupo grigio](/especie/canis_lupus/) e l'[orso bruno](/especie/ursus_arctos/); tra i rettili spiccano la
      [testuggine di Hermann](/especie/testudo_hermanni/) e il colubro leopardino; le acque ospitano l'aspio e
      il tritone crestato di Karelin.


      Per l'avifauna il canyon è un passaggio obbligato della Via Aristotelis, rotta migratoria primaria verso
      l'Africa. Il [capovaccaio](/especie/neophron_percnopterus/) e altri rapaci minacciati vi trovano posatoi
      rocciosi e correnti termiche ascendenti. Per i grandi mammiferi funge da cerniera genetica tra i
      massicci balcanici.
    visit: >-
      La forra si sperimenta essenzialmente percorrendo la strada statale I-1, che la fende da nord a sud per
      circa 23,1 km, o a bordo della linea ferroviaria Sofia–Blagoevgrad–Kulata che corre parallela per 20 km
      sulla sponda sinistra. Scoprirla significa prima di tutto attraversarla mantenendo lo sguardo vigile sul
      paesaggio.
    history: >-
      Nel 1913, durante la Seconda Guerra Balcanica, si combatté qui la dura battaglia della gola di Kresna
      tra le forze armate bulgare e greche.


      La moderna tutela ecologica verte sulla questione della viabilità. Proposta come Sito di Interesse
      Comunitario nel 2007, è stata dichiarata Zona Speciale di Conservazione nel 2021. La strada attuale
      miete innumerevoli vittime tra la fauna selvatica. Il ministero bulgaro riconosce l'eccezionale valore
      della gola, e gli impegni assunti prevedono la realizzazione dell'autostrada Struma fuori dalla forra.
      La Convenzione di Berna ha sollecitato a deviare il traffico pesante per conservare la I-1 (E79)
      unicamente quale viabilità locale.
    before: >-
      Se attraversi la forra in auto, presta la massima attenzione: gli animali selvatici attraversano
      costantemente la carreggiata.
    around: >-
      Il [Parco nazionale del Pirin - Foreste selvagge](/lugar/pirin-national-park-forest-wilderness/) dista
      circa 9 km verso est e il [Parco nazionale di Rila - Foreste
      vetuste](/lugar/rila-national-park-old-forests/) circa ventisei chilometri a nord. Più a oriente, il
      [Parco naturale di Strandzha](/lugar/priroden-park-strandzha/) condivide con Kresna la testuggine di
      Hermann e la lontra.
  pt:
    intro: >-
      Uma estrada, uma linha de comboio e um rio impetuoso espremidos no mesmo desfiladeiro rochoso. A
      garganta de Kresna, no sudoeste da Bulgária, é um vale abrupto de cerca de 18 km rasgado pelo rio Struma
      entre as montanhas Maleshevska e o maciço de Pirin. Por aqui passam lobos, ursos e aves migradoras,
      operando a garganta como eixo viário e corredor vital de fauna selvagem.
    landscape: >-
      O Struma abre caminho num vale estreito e escarpado, profundamente entalhado em granitos e xistos
      cristalinos. O relevo muda bruscamente: encostas de cascalheira, vertiginosas escarpas rochosas e bancos
      fluviais de seixos. As margens conservam matas ripícolas de amieiro, salgueiro e plátano-oriental.


      Aqui corre a transição entre o clima mediterrânico e o continental, gerando uma espantosa riqueza
      botânica e faunística repleta de endemismos e relíquias. As encostas abrigam carvalhais de
      carvalho-negral, carpe-oriental e freixo-de-flores, ao lado de espécies termófilas como a carrasqueira e
      o aderno.


      A sul, o desfiladeiro divide em duas partes a reserva natural de Tisata, criada para resguardar a
      vegetação mediterrânica perenifólia: os maiores núcleos búlgaros de zimbro-grego e zambujeiro, e a única
      formação compacta de urze-molar da Bulgária.
    wildlife: >-
      Para um desfiladeiro tão apertado, a lista zoológica é prodigiosa: cerca de 31 espécies de répteis, 75
      de mamíferos e 232 de aves. Os registos confirmam a [lontra-europeia](/especie/lutra_lutra/), o
      [lobo-cinzento](/especie/canis_lupus/) e o [urso-pardo](/especie/ursus_arctos/); nos répteis
      salientam-se a [tartaruga-de-hermann](/especie/testudo_hermanni/) e a cobra-leopardo; as águas acolhem o
      áspio e o tritão-de-crista-balcânico.


      Para a avifauna, o desfiladeiro integra a Via Aristotelis, grande rota de migração rumo a África. O
      [abutre-do-egito](/especie/neophron_percnopterus/) e outras rapinas vulneráveis usam as correntes
      térmicas e as escarpas para repouso. Para os grandes carnívoros, atua como passagem entre as serras da
      península Balcânica.
    visit: >-
      A garganta atravessa-se sobretudo pela estrada I-1, que percorre o canhão de norte a sul em cerca de
      23,1 km, e pela via-férrea Sófia–Blagoevgrad–Kulata que corre paralela por 20 km na encosta esquerda do
      vale. Descobri-la é, acima de tudo, transitar por ela de olhos bem abertos na paisagem.
    history: >-
      Em 1913, durante a Segunda Guerra Balcânica, travou-se aqui a violenta batalha da garganta de Kresna
      entre a Bulgária e a Grécia.


      A preservação gira em torno da estrada. Proposta como Sítio de Importância Comunitária em 2007, foi
      declarada Zona Especial de Conservação em 2021. O tráfego pesado atual causa frequentes atropelamentos
      de fauna silvestre. O ministério búlgaro reconhece a relevância do corredor de biodiversidade, prevendo
      os acordos a construção da futura autoestrada Struma fora do desfiladeiro. A Convenção de Berna instou o
      governo a desviar o trânsito e conservar a I-1 (E79) apenas para acesso local.
    before: >-
      Se viajares de automóvel pelo desfiladeiro, redobra a atenção: os animais atravessam frequentemente a
      faixa de rodagem.
    around: >-
      O [Parque Nacional de Pirin - Floresta Selvagem](/lugar/pirin-national-park-forest-wilderness/) dista
      cerca de 9 km para leste e o [Parque Nacional de Rila - Florestas
      Antigas](/lugar/rila-national-park-old-forests/) cerca de vinte e seis quilómetros para norte. Mais a
      leste, o [Parque Natural de Strandzha](/lugar/priroden-park-strandzha/) partilha com Kresna a
      tartaruga-de-hermann e a lontra.
