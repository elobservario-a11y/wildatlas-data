    It is the roof of the Balkan Peninsula and the birthplace of the Maritsa, the most voluminous river
    flowing entirely within the Balkans.
  fr: >-
    C'est le toit de la péninsule balkanique et le berceau de la Maritsa, le fleuve au débit le plus puissant
    coulant entièrement dans les Balkans.
  de: >-
    Das Dach der Balkanhalbinsel und die Wiege der Mariza, des wasserreichsten ausschließlich im Balkan
