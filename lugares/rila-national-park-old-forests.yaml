texto:
  es:
    intro: >-
      En la cima del Musala, a 2 925 m, la temperatura máxima registrada es de 18,7 °C. Es la montaña más alta
      de los Balcanes, y Rila la rodea con un parque nacional de 810,46 km², el mayor de Bulgaria, en el
      suroeste del país. Desde los 800 m de Blagoevgrad hasta esa cumbre, el parque sube entre bosques de
      coníferas centenarios, 120 lagos naturales, la mayoría glaciares, y nacimientos de ríos tan grandes como
      el Maritsa y el Iskar.
    landscape: >-
      Rila es una montaña de agua. Del parque nace casi el 4 % de todos los ríos de Bulgaria, entre ellos el
      Maritsa, el río con más caudal que discurre enteramente por los Balcanes, y el Iskar, el más largo que
      discurre enteramente por Bulgaria. El motor es la nieve: la cobertura estable dura más de 200 días al
      año, y en los últimos meses del invierno supera los 2 m de espesor por encima de los 2 000 m. Cuando se
      derrite, a partir de abril, el caudal de los ríos sube con fuerza, y de ese deshielo viene la mayor
      parte del agua potable de los pueblos cercanos.


      Arriba, el clima es duro. La temperatura sigue bajo cero nueve meses al año y rara vez pasa de 15 °C en
      verano; el mínimo medido es de -31,2 °C. Los vientos fuertes son característicos del parque, con
      velocidades de más de 30 m/s.


      Los lagos tienen nombre propio. Entre los 120 destacan los Siete Lagos de Rila; en los lagos Babreka,
      Salzata y Okoto se concentran la mayor cantidad y variedad de algas de agua dulce.


      El bosque vive a esa altura. Cubre 534,81 km², el 66 % del parque, y la mayor parte son bosques
      centenarios de picea, [pino macedonio](/especie/pinus_peuce/) y pino silvestre. La altitud media de los
      bosques es de 1 800 m, y más de tres cuartas partes están entre 1 500 y 2 300 m, lo que favorece a las
      coníferas.


      La flora tiene unas 1 400 especies de plantas vasculares, 282 de musgos y 130 de algas de agua dulce.
      Hay 57 endémicas, tres de ellas locales: la prímula de Rila, el ruibarbo de Rila y una alquemila
      (pavlovsko shapiche). Y 105 son relictas: 74 de la edad de hielo y 31 del Terciario. Se conocen además
      233 especies de hongos, más del 11 % de las de Bulgaria.
    wildlife: >-
      La fauna incluye 48 especies de mamíferos, 99 de aves, 20 de reptiles y anfibios y 5 de peces, además de
      2 934 especies de invertebrados, 282 de ellos endémicos. El [oso pardo](/especie/ursus_arctos/), el
      [rebeco](/especie/rupicapra_rupicapra/) y el [lobo](/especie/canis_lupus/), cuya distribución en
      Bulgaria es muy limitada, son especies de gran valor.


      Entre las aves, el parque concentra la población principal de [urogallo](/especie/tetrao_urogallus/),
      grévol, perdiz griega, chova piquigualda y [treparriscos](/especie/tichodroma_muraria/). Entre las raras
      o amenazadas, el [águila real](/especie/aquila_chrysaetos/), el águila culebrera, el [halcón
      peregrino](/especie/falco_peregrinus/), el [pico tridáctilo](/especie/picoides_tridactylus/) y el [pico
      dorsiblanco](/especie/dendrocopos_leucotos/).


      Tres reptiles y anfibios son relictos: el tritón alpino, una rana de montaña y el lagarto vivíparo. El
      tritón alpino está amenazado en todo el mundo.
    visit: >-
      El centro de visitantes e información turística está en Panichishte, en el municipio de Sapareva Banya.
      Informa sobre la biodiversidad, los regímenes y normas del parque, ofrece rutas y programas
      interpretativos y educativos y proyecciones audiovisuales.


      Dos senderos europeos cruzan el parque: el E4 y el E8. Para una primera salida, el itinerario del Ibar
      parte del balneario de Kostenets y sigue los ríos Chavcha y Ravnivrashka hasta el refugio Belmeken. En
      la reserva Skakavitsa hay un recorrido señalizado entre Panichishte y el refugio Skakavitsa, y una ruta
      de tránsito cruza la reserva Central Rila por el valle de Tiha Maritsa hacia el pico Musala.


      Cerca del límite del parque está el monasterio de Rila, monumento cultural y uno de los destinos
      principales de la zona.
    history: >-
      El parque nacional se creó el 24 de febrero de 1992 para proteger ecosistemas de importancia nacional.
      Tiene cuatro reservas naturales: Parangalitsa, Central Rila, Ibar y Skakavitsa. Las cuatro cubren 16
      232,5 hectáreas, una quinta parte del parque.
    before: >-
      En Rila solo se puede caminar por itinerarios turísticos señalizados. Los fuegos y la acampada solo
      están permitidos en lugares señalizados para esos usos, que existen para evitar incendios forestales.
    around: >-
      El [Parque Nacional Pirin - Bosque Salvaje](/lugar/pirin-national-park-forest-wilderness/) queda a unos
      once kilómetros, y la [Garganta de Kresna - Corredor Biológico del Río
      Struma](/lugar/kresnensko-defile/) a unos veintiséis kilómetros.
  en:
    intro: >-
      On the summit of Musala, at 2,925 m, the highest temperature ever recorded is 18.7 °C. It is the highest
      mountain in the Balkans, and Rila encircles it with an 810.46 km² national park, the largest in
      Bulgaria, situated in the southwest of the country. From 800 m near Blagoevgrad up to that summit, the
      park rises through centuries-old coniferous forests, 120 natural lakes—most of them glacial—and the
      headwaters of major rivers like the Maritsa and the Iskar.
    landscape: >-
      Rila is a water-giving mountain. Nearly 4 % of all Bulgarian rivers originate within the park, including
      the Maritsa, the most voluminous river running entirely within the Balkans, and the Iskar, the longest
      flowing entirely within Bulgaria. The driving force is snow: stable snow cover lasts more than 200 days
      a year, exceeding 2 m in depth above 2,000 m during late winter. When it melts from April onward, river
      flows swell dramatically, providing most of the drinking water for surrounding settlements.


      Up high, the climate is harsh. Temperatures remain below freezing for nine months of the year and rarely
      exceed 15 °C in summer; the record minimum is -31.2 °C. Fierce winds are a trademark of the park, with
      speeds surpassing 30 m/s.


      The lakes have distinct identities. Among the 120, the Seven Rila Lakes stand out; lakes Babreka,
      Salzata, and Okoto harbor the greatest richness and diversity of freshwater algae.


      The forest thrives at high altitudes. It covers 534.81 km², or 66 % of the park, dominated by ancient
      stands of Norway spruce, [Macedonian pine](/especie/pinus_peuce/), and Scots pine. The average forest
      elevation is 1,800 m, with over three-quarters lying between 1,500 and 2,300 m, conditions exceptionally
      favorable to conifers.


      The flora includes roughly 1,400 vascular plant species, 282 mosses, and 130 freshwater algae. There are
      57 endemic species, three of them local: Rila primrose, Rila rhubarb, and a lady's mantle (pavlovsko
      shapiche). Moreover, 105 are relicts: 74 from the ice age and 31 from the Tertiary. Additionally, 233
      fungal species are known, representing more than 11 % of Bulgaria's mycota.
    wildlife: >-
      The fauna comprises 48 mammal species, 99 birds, 20 reptiles and amphibians, and 5 fish, as well as
      2,934 invertebrate species, 282 of which are endemic. The [brown bear](/especie/ursus_arctos/), the
      [chamois](/especie/rupicapra_rupicapra/), and the [grey wolf](/especie/canis_lupus/), whose Bulgarian
      range is strictly limited, are species of outstanding conservation value.


      Among birds, the park holds core populations of [western capercaillie](/especie/tetrao_urogallus/),
      hazel grouse, rock partridge, yellow-billed chough, and [wallcreeper](/especie/tichodroma_muraria/).
      Rare or threatened raptors include the [golden eagle](/especie/aquila_chrysaetos/), short-toed snake
      eagle, [peregrine falcon](/especie/falco_peregrinus/), [three-toed
      woodpecker](/especie/picoides_tridactylus/), and [white-backed
      woodpecker](/especie/dendrocopos_leucotos/).


      Three reptiles and amphibians are glacial relicts: the alpine newt, a mountain frog, and the viviparous
      lizard. The alpine newt is globally threatened.
    visit: >-
      The visitor and tourist information center is located in Panichishte, in Sapareva Banya municipality. It
      provides details on biodiversity, park rules, self-guided trails, educational programs, and audiovisual
      presentations.


      Two European long-distance paths cross the park: E4 and E8. For an introductory trek, the Ibar route
      starts from the spa town of Kostenets and follows the Chavcha and Ravnivrashka rivers up to the Belmeken
      hut. In the Skakavitsa reserve there is a marked trail between Panichishte and the Skakavitsa hut, and a
      transit route traverses the Central Rila reserve through the Tiha Maritsa valley toward Musala peak.


      Near the park boundary stands the Rila Monastery, a renowned cultural monument and a top destination in
      the region.
    history: >-
      The national park was designated on 24 February 1992 to protect ecosystems of national significance. It
      contains four strict nature reserves: Parangalitsa, Central Rila, Ibar, and Skakavitsa. The four
      reserves together cover 16,232.5 hectares, roughly one-fifth of the park.
    before: >-
      In Rila, hiking is permitted only along marked tourist trails. Campfires and camping are allowed
      exclusively in designated areas established to prevent forest fires.
    around: >-
      [Pirin National Park - Forest Wilderness](/lugar/pirin-national-park-forest-wilderness/) lies about
      eleven kilometers away, and the [Kresna Gorge - Struma River Wildlife
      Corridor](/lugar/kresnensko-defile/) is roughly twenty-six kilometers away.
  fr:
    intro: >-
      Au sommet du Moussala, à 2 925 m, la température maximale enregistrée s'élève à 18,7 °C. C'est la plus
      haute montagne des Balkans, et le massif de Rila l'entoure d'un parc national de 810,46 km², le plus
      vaste de Bulgarie, au sud-ouest du pays. Depuis les 800 m proches de Blagoevgrad jusqu'à cette cime, le
      parc s'élève au milieu de forêts de conifères séculaires, de 120 lacs naturels pour la plupart
      glaciaires et des sources de grands fleuves comme la Maritsa et l'Iskar.
    landscape: >-
      Rila est un château d'eau montagnard. Près de 4 % de tous les cours d'eau de Bulgarie prennent leur
      source dans le parc, parmi lesquels la Maritsa, le cours d'eau le plus puissant coulant entièrement dans
      les Balkans, et l'Iskar, le plus long traversant uniquement la Bulgarie. Le moteur en est la neige : la
      couverture stable persiste plus de 200 jours par an, dépassant 2 m d'épaisseur au-delà de 2 000 m à la
      fin de l'hiver. À la fonte des neiges, dès avril, le débit fluvial gonfle fortement, fournissant la
      majeure partie de l'eau potable des agglomérations voisines.


      En altitude, le climat est rude. Les températures restent négatives neuf mois par an et dépassent
      rarement 15 °C en été ; le minimum mesuré s'établit à -31,2 °C. Les vents violents caractérisent le
      parc, avec des rafales excédant 30 m/s.


      Les lacs possèdent une identité propre. Parmi les 120 plans d'eau se détachent les Sept Lacs de Rila ;
      les lacs Babreka, Salzata et Okoto concentrent la plus grande richesse et variété d'algues d'eau douce.


      La forêt s'épanouit à cette altitude. Elle s'étend sur 534,81 km², soit 66 % du parc, principalement
      constituée de peuplements séculaires d'épicéa commun, de [pin de Macédoine](/especie/pinus_peuce/) et de
      pin sylvestre. L'altitude moyenne des boisements est de 1 800 m, et plus des trois quarts s'étagent
      entre 1 500 et 2 300 m, une fourchette idéale pour les résineux.


      La flore compte environ 1 400 espèces de plantes vasculaires, 282 mousses et 130 algues d'eau douce. On
      recense 57 endémiques, dont trois locales : la primevère de Rila, la rhubarbe de Rila et une alchémille
      (pavlovsko shapiche). Par ailleurs, 105 sont relictes : 74 de l'époque glaciaire et 31 du Tertiaire. On
      dénombre en outre 233 espèces de champignons, soit plus de 11 % de la mycoflore bulgare.
    wildlife: >-
      La faune compte 48 espèces de mammifères, 99 d'oiseaux, 20 de reptiles et amphibiens et 5 de poissons,
      ainsi que 2 934 espèces d'invertébrés, dont 282 endémiques. L'[ours brun](/especie/ursus_arctos/), le
      [chamois](/especie/rupicapra_rupicapra/) et le [loup](/especie/canis_lupus/), dont l'aire de répartition
      en Bulgarie demeure très circonscrite, sont des espèces d'une valeur patrimoniale exceptionnelle.


      Parmi les oiseaux, le parc abrite la population principale de [grand
      tétras](/especie/tetrao_urogallus/), de gélinotte des bois, de perdrix bartavelle, de chocard à bec
      jaune et de [tichodrome échelette](/especie/tichodroma_muraria/). Parmi les espèces rares ou menacées
      figurent l'[aigle royal](/especie/aquila_chrysaetos/), le circaète Jean-le-Blanc, le [faucon
      pèlerin](/especie/falco_peregrinus/), le [pic tridactyle](/especie/picoides_tridactylus/) et le [pic à
      dos blanc](/especie/dendrocopos_leucotos/).


      Trois reptiles et amphibiens sont des relictes glaciaires : le triton alpestre, une grenouille de
      montagne et le lézard vivipare. Le triton alpestre est menacé à l'échelle planétaire.
    visit: >-
      Le centre d'accueil et d'information touristique se situe à Panichishte, dans la municipalité de
      Sapareva Banya. Il renseigne sur la biodiversité, les règles du parc, propose des itinéraires balisés,
      des programmes éducatifs et des projections audiovisuelles.


      Deux sentiers européens de grande randonnée parcourent le parc : l'E4 et l'E8. Pour une première
      excursion, le sentier de l'Ibar part de la station thermale de Kostenets et longe les rivières Chavcha
      et Ravnivrashka jusqu'au refuge de Belmeken. Dans la réserve de Skakavitsa, un chemin balisé relie
      Panichishte au refuge de Skakavitsa, et un itinéraire traverse la réserve de Rila centrale par la vallée
      de Tiha Maritsa vers le pic Moussala.


      À proximité de la limite du parc s'élève le monastère de Rila, chef-d'œuvre culturel et halte majeure de
      la région.
    history: >-
      Le parc national a été créé le 24 février 1992 pour préserver des écosystèmes d'importance nationale. Il
      englobe quatre réserves naturelles intégrales : Parangalitsa, Rila centrale, Ibar et Skakavitsa. Ces
      quatre réserves totalisent 16 232,5 hectares, soit un cinquième du territoire du parc.
    before: >-
      Dans le parc de Rila, il est uniquement permis de randonner sur les sentiers touristiques balisés. Les
      feux et le camping ne sont tolérés que sur les emplacements réservés à ces usages, prévus pour éviter
      les incendies de forêt.
    around: >-
      Le [parc national de Pirin - Forêt sauvage](/lugar/pirin-national-park-forest-wilderness/) se trouve à
      environ onze kilomètres, et les [gorges de Kresna - Corridor biologique de la
      Struma](/lugar/kresnensko-defile/) à environ vingt-six kilomètres.
  de:
    intro: >-
      Auf dem Gipfel des Musala auf 2 925 m Höhe liegt die gemessene Höchsttemperatur bei 18,7 °C. Er ist der
      höchste Berg des Balkans, und das Rila-Gebirge umrahmt ihn mit einem 810,46 km² großen Nationalpark, dem
      größten Bulgariens im Südwesten des Landes. Von 800 m bei Blagoewgrad bis zu jenem Gipfel steigt der
      Park durch jahrhundertealte Nadelwälder, 120 Naturseen – zumeist glazialen Ursprungs – und Quellgebiete
      bedeutender Ströme wie Mariza und Iskar empor.
    landscape: >-
      Das Rila-Gebirge ist ein gigantischer Wasserspeicher. Fast 4 % aller Flüsse Bulgariens entspringen im
      Park, darunter die Mariza, der wasserreichste ganz auf dem Balkan fließende Strom, und der Iskar, der
      längste rein bulgarische Fluss. Antriebskraft ist der Schnee: Eine geschlossene Schneedecke liegt über
      200 Tage im Jahr und übersteigt im Spätwinter eine Mächtigkeit von 2 m oberhalb von 2 000 m. Bei der
      Schneeschmelze ab April steigen die Flusspegel stark an und liefern das meiste Trinkwasser für
      umliegende Städte.


      In der Höhe herrscht extremes Klima. Die Temperaturen verharren neun Monate im Jahr unter dem
      Gefrierpunkt und steigen im Sommer selten über 15 °C; das gemessene Tiefstmaß liegt bei -31,2 °C. Starke
      Winde prägen den Park mit Geschwindigkeiten von über 30 m/s.


      Die Seen besitzen unverwechselbare Züge. Unter den 120 stechen die Sieben Rila-Seen hervor; in den Seen
      Babreka, Salzata und Okoto konzentriert sich die größte Vielfalt an Süßwasseralgen.


      Der Wald behauptet sich in dieser Höhenlage. Er bedeckt 534,81 km², also 66 % der Parkfläche, dominiert
      von Urwaldbeständen aus Gemeiner Fichte, [Rumelischer Kiefer](/especie/pinus_peuce/) und Waldkiefer. Die
      mittlere Waldhöhe liegt bei 1 800 m, und mehr als drei Viertel stocken zwischen 1 500 und 2 300 m, was
      Nadelhölzer stark begünstigt.


      Die Flora umfasst rund 1 400 Gefäßpflanzenarten, 282 Moose und 130 Süßwasseralgen. Es gibt 57 endemische
      Sippen, drei davon lokale Endemiten: die Rila-Primel, der Rila-Rhabarber und ein Frauenmantel (Pavlovsko
      shapiche). 105 Arten sind Relikte: 74 aus der Eiszeit und 31 aus dem Tertiär. Zudem sind 233 Pilzarten
      bekannt, mehr als 11 % aller Pilze Bulgariens.
    wildlife: >-
      Die Tierwelt zählt 48 Säugetierarten, 99 Vogelarten, 20 Reptilien und Amphibien sowie 5 Fischarten, dazu
      2 934 Wirbellose mit 282 Endemiten. [Braunbär](/especie/ursus_arctos/),
      [Gämse](/especie/rupicapra_rupicapra/) und [Wolf](/especie/canis_lupus/), deren Bestände in Bulgarien
      stark begrenzt sind, besitzen herausragenden Schutzwert.


      Unter den Vögeln beherbergt der Park Kernpopulationen von [Auerhuhn](/especie/tetrao_urogallus/),
      Haselhuhn, Steinhuhn, Alpendohle und [Mauerläufer](/especie/tichodroma_muraria/). Zu den seltenen
      Greifvögeln und Spechten zählen [Steinadler](/especie/aquila_chrysaetos/), Schlangenadler,
      [Wanderfalke](/especie/falco_peregrinus/), [Dreizehenspecht](/especie/picoides_tridactylus/) und
      [Weißrückenspecht](/especie/dendrocopos_leucotos/).


      Drei Amphibien- und Reptilienarten sind Eiszeitrelikte: Bergmolch, Bergfrosch und Waldeidechse. Der
      Bergmolch gilt weltweit als gefährdet.
    visit: >-
      Das Besucher- und Informationszentrum liegt in Panitschischte in der Gemeinde Saparewa Banja. Es
      informiert über Artenvielfalt und Schutzbestimmungen, bietet Routenvorschläge, Lehrprogramme und
      audiovisuelle Präsentationen.


      Zwei europäische Fernwanderwege queren den Park: der E4 und der E8. Für den Einstieg führt die
      Ibar-Route vom Kurort Kostenets entlang der Flüsse Chawtscha und Rawnikraschka zur Belmeken-Hütte. Im
      Skakawiza-Reservat verläuft ein markierter Pfad zwischen Panitschischte und der Skakawiza-Hütte, und
      eine Querung führt durch das Zentral-Rila-Reservat über das Tiha-Mariza-Tal zum Musala-Gipfel.


      Nahe der Parkgrenze liegt das berühmte Rila-Kloster, ein herausragendes Kulturdenkmal und
      Hauptausflugsziel der Region.
    history: >-
      Der Nationalpark wurde am 24. Februar 1992 gegründet, um Ökosysteme von nationaler Tragweite zu sichern.
      Er umfasst vier strenge Naturreservate: Parangaliza, Zentral-Rila, Ibar und Skakawiza. Zusammen nehmen
      sie 16 232,5 Hektar ein, rund ein Fünftel der Gesamtfläche.
    before: >-
      Im Rila-Nationalpark darfst du dich nur auf den markierten Wanderrouten bewegen. Offenes Feuer und
      Zelten sind ausschließlich an behördlich ausgewiesenen Plätzen gestattet, um Waldbrände zu verhindern.
    around: >-
      Der [Pirin-Nationalpark - Bergwildnis](/lugar/pirin-national-park-forest-wilderness/) liegt etwa elf
      Kilometer entfernt, und die [Kresna-Schlucht - Biokorridor am Struma](/lugar/kresnensko-defile/) rund
      sechsundzwanzig Kilometer.
  it:
    intro: >-
      Sulla vetta del Musala, a 2 925 m, la temperatura massima registrata tocca i 18,7 °C. È la cima più alta
      dei Balcani, e il Rila la cinge con un parco nazionale di 810,46 km², il maggiore della Bulgaria, nel
      sud-ovest del paese. Dagli 800 m nei pressi di Blagoevgrad fino alla cresta culminante, il parco sale
      tra foreste di conifere secolari, 120 laghi naturali per lo più glaciali e le sorgenti di grandi fiumi
      quali il Maritsa e l'Iskar.
    landscape: >-
      Il Rila è una vera montagna d'acqua. Dal parco trae origine quasi il 4 % di tutti i fiumi della
      Bulgaria, tra cui il Maritsa, il fiume di maggior portata che scorre interamente nei Balcani, e l'Iskar,
      il più lungo che fluisce per intero in territorio bulgaro. Il motore è la neve: la copertura permanente
      dura oltre 200 giorni all'anno e nella tarda stagione invernale supera i 2 m di accumulo oltre i 2 000
      m. Con il disgelo a partire da aprile, le portate fluviali crescono vistosamente, assicurando la quasi
      totalità dell'acqua potabile ai paesi circostanti.


      In quota il clima è inclemente. La colonnina di mercurio rimane sottozero nove mesi all'anno e
      oltrepassa raramente i 15 °C in estate; il record minimo è di -31,2 °C. I venti tempestosi sono tipici
      del parco, con velocità che superano i 30 m/s.


      I bacini lacustri vantano caratteri peculiari. Tra i 120 spiccano i Sette Laghi di Rila; nei laghi
      Babreka, Salzata e Okoto si concentra la massima concentrazione e diversità di alghe d'acqua dolce.


      La foresta alligna a queste quote. Ricopre 534,81 km², pari al 66 % del parco, dominata da boschi
      vetusti di abete rosso, [pino macedone](/especie/pinus_peuce/) e pino silvestre. La quota media dei
      boschi si attesta a 1 800 m, e oltre tre quarti vegetano tra 1 500 e 2 300 m, fascia ideale per le
      conifere.


      La flora annovera circa 1 400 specie di piante vascolari, 282 muschi e 130 alghe d'acqua dolce. Si
      contano 57 entità endemiche, tre delle quali esclusive: la primula di Rila, il rabarbaro di Rila e
      un'alchemilla (pavlovsko shapiche). Inoltre 105 sono relitte: 74 glaciali e 31 terziarie. Si conoscono
      anche 233 specie di funghi, oltre l'11 % dell'intera micoflora bulgara.
    wildlife: >-
      La fauna comprende 48 specie di mammiferi, 99 di uccelli, 20 di rettili e anfibi e 5 di pesci, a cui si
      aggiungono 2 934 specie di invertebrati con 282 endemismi. L'[orso bruno](/especie/ursus_arctos/), il
      [camoscio alpino](/especie/rupicapra_rupicapra/) e il [lupo grigio](/especie/canis_lupus/), la cui
      distribuzione in Bulgaria è assai frammentata, costituiscono presenze di immenso valore.


      Tra i volatili, il parco ospita il nucleo riproduttivo cardine di
      [urogallo](/especie/tetrao_urogallus/), francolino di monte, coturnice, gracchio corallino e [picchio
      muraiolo](/especie/tichodroma_muraria/). Tra le specie rare figurano l'[aquila
      reale](/especie/aquila_chrysaetos/), il biancone, il [falco pellegrino](/especie/falco_peregrinus/), il
      [picchio tridattilo](/especie/picoides_tridactylus/) e il [picchio
      dorsobianco](/especie/dendrocopos_leucotos/).


      Tre specie di anfibi e rettili sono relitti glaciali: il tritone alpestre, una rana montana e la
      lucertola vivipara. Il tritone alpestre è specie minacciata su scala globale.
    visit: >-
      Il centro visite e accoglienza si trova a Panichishte, nel comune di Sapareva Banya. Fornisce
      indicazioni su fauna e flora, orari e regolamenti del parco, propone itinerari guidati, percorsi
      didattici e proiezioni multimediali.


      Due sentieri europei di lunga percorrenza solcano il parco: l'E4 e l'E8. Per una prima escursione,
      l'itinerario dell'Ibar muove dalla stazione termale di Kostenets e costeggia i torrenti Chavcha e
      Ravnivrashka fino al rifugio Belmeken. Nella riserva di Skakavitsa un tracciato segnato unisce
      Panichishte al rifugio Skakavitsa, mentre una traversata percorre la riserva Rila Centrale attraverso la
      valle di Tiha Maritsa verso la cima Musala.


      Presso il confine del parco sorge il celebre monastero di Rila, tesoro storico-culturale e polo
      d'attrazione principale dell'area.
    history: >-
      Il parco nazionale è stato istituito il 24 febbraio 1992 per tutelare ecosistemi di rilevanza nazionale.
      Include quattro riserve naturali integrali: Parangalitsa, Rila Centrale, Ibar e Skakavitsa. Le quattro
      aree protette assommano a 16 232,5 ettari, circa un quinto della superficie del parco.
    before: >-
      Nel parco di Rila è consentito camminare unicamente lungo i sentieri escursionistici segnalati.
      L'accensione di fuochi e il campeggio sono ammessi esclusivamente nelle piazzole appositamente
      predisposte per scongiurare incendi boschivi.
    around: >-
      Il [Parco Nazionale del Pirin - Foreste Vetuste](/lugar/pirin-national-park-forest-wilderness/) dista
      circa undici chilometri, e la [Gola di Kresna - Corridoio Biologico del Fiume
      Struma](/lugar/kresnensko-defile/) circa ventisei chilometri.
  pt:
    intro: >-
      No cimo do Musala, a 2 925 m de altitude, a temperatura máxima histórica registada é de 18,7 °C. É a
      montanha mais alta dos Balcãs, e Rila envolve-a com um parque nacional de 810,46 km², o maior da
      Bulgária, no sudoeste do país. Dos 800 m perto de Blagoevgrad até ao cume culminante, o parque ascende
      por entre matas de coníferas seculares, 120 lagos naturais na sua maioria glaciares e nascentes de
      grandes artérias fluviais como o Maritsa e o Iskar.
    landscape: >-
      Rila é um autêntico castelo de água montanhoso. Do parque brota quase 4 % de todos os rios da Bulgária,
      entre os quais o Maritsa, o rio de maior caudal que corre exclusivamente nos Balcãs, e o Iskar, o mais
      longo inteiramente búlgaro. A força motriz é a neve: a cobertura nivosa firme perdura mais de 200 dias
      por ano, superando 2 m de espessura acima dos 2 000 m no final do inverno. Com o degelo a partir de
      abril, os caudais sobem de modo expressivo, assegurando a maior fatia da água potável das povoações em
      redor.


      Nos planaltos cimeiros o clima é impiedoso. As temperaturas mantêm-se abaixo de zero nove meses por ano
      e raramente ultrapassam os 15 °C no verão; o recorde mínimo atinge -31,2 °C. Os ventos tempestuosos
      constituem um traço marcante, com rajadas que superam 30 m/s.


      As lagoas possuem identidade vincada. De entre as 120 sobressaem os Sete Lagos de Rila; nos lagos
      Babreka, Salzata e Okoto concentra-se a maior fartura e variedade de algas de água doce.


      A floresta domina nestas cotas. Estende-se por 534,81 km², perfazendo 66 % do parque, preenchida por
      talhões seculares de espruce-comum, [pinheiro-da-macedónia](/especie/pinus_peuce/) e pinheiro-silvestre.
      A altitude média do arvoredo situa-se nos 1 800 m, distribuindo-se mais de três quartos entre 1 500 e 2
      300 m, patamar perfeito para as coníferas.


      A flora compreende cerca de 1 400 espécies de plantas vasculares, 282 briófitos e 130 algas
      dulciaquícolas. Contabilizam-se 57 endemismos, três dos quais estritamente locais: a prímula-de-rila, o
      ruibarbo-de-rila e uma alquemila (pavlovsko shapiche). Além disso, 105 são relíquias: 74 da idade do
      gelo e 31 do Terciário. Conhecem-se ainda 233 espécies de fungos, representando mais de 11 % da
      micoflora búlgara.
    wildlife: >-
      A fauna compreende 48 espécies de mamíferos, 99 de aves, 20 de répteis e anfíbios e 5 de peixes, para
      além de 2 934 espécies de invertebrados com 282 endemismos. O [urso-pardo](/especie/ursus_arctos/), a
      [camurça](/especie/rupicapra_rupicapra/) e o [lobo-cinzento](/especie/canis_lupus/), cuja presença na
      Bulgária é muito restrita, assumem enorme valor biológico.


      Entre a avifauna, o parque abriga o núcleo fulcral de [tetraz-grande](/especie/tetrao_urogallus/),
      galinha-do-mato, perdiz-grega, gralha-de-bico-amarelo e
      [trepadeira-dos-muros](/especie/tichodroma_muraria/). Entre as rapinas e pica-paus raros avultam a
      [águia-real](/especie/aquila_chrysaetos/), a águia-cobreira, o
      [falcão-peregrino](/especie/falco_peregrinus/), o [pica-pau-tridáctilo](/especie/picoides_tridactylus/)
      e o [pica-pau-de-dorso-branco](/especie/dendrocopos_leucotos/).


      Três espécies de répteis e anfíbios são relíquias da época glaciar: o tritão-alpino, uma rã-da-montanha
      e a lagartixa-vivípara. O tritão-alpino encontra-se ameaçado a nível mundial.
    visit: >-
      O centro de visitantes e informação turística localiza-se em Panichishte, no município de Sapareva
      Banya. Presta apoio sobre a biodiversidade, horários e normas de conduta, sugerindo trilhos balizados,
      programas pedagógicos e exibições audiovisuais.


      Dois trilhos de longo curso europeus cruzam o parque: o E4 e o E8. Para uma primeira caminhada, o
      percurso do Ibar arranca da estância termal de Kostenets e acompanha os rios Chavcha e Ravnivrashka até
      ao refúgio Belmeken. Na reserva de Skakavitsa existe um caminho sinalizado entre Panichishte e o refúgio
      Skakavitsa, existindo ainda uma travessia que corta a reserva de Rila Central pelo vale de Tiha Maritsa
      rumo ao pico Musala.


      Perto dos limites do parque ergue-se o célebre Mosteiro de Rila, notável património cultural e principal
      destino de visitação da região.
    history: >-
      O parque nacional foi criado a 24 de fevereiro de 1992 para salvaguardar ecossistemas de valor nacional.
      Contém quatro reservas naturais integrais: Parangalitsa, Rila Central, Ibar e Skakavitsa. No total as
      quatro reservas ocupam 16 232,5 hectares, cerca de um quinto da superfície protegida.
    before: >-
      Em Rila apenas é consentido caminhar pelos trilhos turísticos sinalizados. Fogueiras e campismo só são
      permitidos nos locais devidamente assinalados para esse efeito, concebidos para travar o risco de
      incêndios florestais.
    around: >-
      O [Parque Nacional de Pirin - Floresta Selvagem](/lugar/pirin-national-park-forest-wilderness/) fica a
      cerca de onze quilómetros, e o [Desfiladeiro de Kresna - Corredor Biológico do Rio
      Struma](/lugar/kresnensko-defile/) a cerca de vinte e seis quilómetros.
