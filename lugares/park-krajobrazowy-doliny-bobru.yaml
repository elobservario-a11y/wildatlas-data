  en: >-
    Meandering incised gorges of the Bóbr River carving through limestone and schist hills of the Sudeten
    foreland.
  fr: Méandres encaissés du Bóbr à travers les collines calcaires et schisteuses de l'avant-pays des Sudètes.
  de: Eingeschnittene Mäander des Bober durch die Kalk- und Schieferhügel des sudetischen Vorlandes.
  it: Meandri incassati del fiume Bóbr che incidono i rilievi calcarei e scistosi dell'avampaese sudetico.
