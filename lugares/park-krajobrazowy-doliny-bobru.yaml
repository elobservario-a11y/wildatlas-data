unico:
  es: Un solo río que, a golpe de gargantas y presas, encadena rocas de todas las edades, lagos y castillos.
  en: >-
    A single river that, through steep gorges and dams, strings together rocks of all geological ages,
    reservoirs and medieval castles.
  fr: >-
    Un seul cours d'eau qui, au fil de gorges et de retenues, aligne des roches de tous les âges, des lacs et
    des châteaux.
  de: >-
    Ein einzelner Fluss, der sich durch Felsengorchen und Stauseen gräbt und Gesteine aller Erdzeitalter, Seen
    und Burgen aneinanderreiht.
  it: >-
    Un solo corso d'acqua che, tra forre e dighe, allinea rocce di ogni era geologica, bacini artificiali e
    castelli.
  pt: >-
    Um único rio que, entre desfiladeiros e barragens, encadeia rochas de todas as idades, albufeiras e
    castelos medievais.
observaciones:
  es: >-
    Los senderos de Borowy Jar parten del centro de Jelenia Góra y cada uno se hace en poco más de una hora.
    Lo mejor es ir entre mayo y octubre, y cuenta con una o dos jornadas para el conjunto del parque.
texto:
  es:
    intro: >-
      Un río que cruza las colinas de los Sudetes occidentales sin pedir permiso: así es el Bóbr entre Jelenia
      Góra y Lwówek Śląski. El Parque Paisajístico del Valle del Bóbr, creado en mil novecientos ochenta y
      nueve, gira entero alrededor de ese tramo. Hay gargantas donde la roca asoma en capas de edades
      distintas, lagos que no existían antes de las presas, bosques de pícea, roble, abedul y pino, y en el
      fondo del valle, prados fértiles y pastos.
    landscape: >-
      El Bóbr no baja en línea recta. Donde el terreno se estrecha forma gargantas, y en ellas la corriente
      deja a la vista formaciones rocosas de edades muy distintas, como páginas de un libro abierto. Entre
      garganta y garganta, las presas han creado lagos de aspecto vistoso. La mayor es la de Pilchowice,
      levantada entre mil novecientos tres y mil novecientos doce: parte el río del parque en dos tramos, uno
      alto de trece kilómetros y otro bajo de veinticinco.


      Fuera de la ribera, el contraste es de manual. En el fondo del valle mandan los prados fértiles y los
      pastos; en las laderas, la pícea, el roble, el abedul y el pino. La flora suma unas ochocientas
      especies, y muchas de ellas están protegidas o son raras: entre las rarezas botánicas se citan el
      acónito *Aconitum variegatum*, la orquídea *Epipactis palustris*, otra orquídea, *Dactylorhiza majalis*,
      la genciana *Gentiana cruciata*, la *Gentianella ciliata* y el cólquico *Colchicum autumnale*.


      Hay también roca con carácter. Cerca de Lwówek Śląski se abre una cueva en calizas cuyas galerías y
      cámaras suman unos ciento treinta y seis metros. En el municipio de Wleń, un cuello volcánico de basalto
      es uno de los ocho monumentos naturales del parque, y la cima más alta, la de Siedlęcinka, llega a
      cuatrocientos noventa y cinco metros.
    wildlife: >-
      Entre las aves reproductoras del parque aparecen la serreta grande, el [guion de
      codornices](/especie/crex_crex/), el [búho real](/especie/bubo_bubo/), el [mochuelo
      chico](/especie/glaucidium_passerinum/) y el mochuelo boreal, que encabezan una lista de ciento diez
      especies nidificantes. Entre los anfibios figura la [salamandra común](/especie/salamandra_salamandra/),
      una especie en regresión. Entre las especies del parque figuran también el [castor
      europeo](/especie/castor_fiber/), la [nutria europea](/especie/lutra_lutra/) y la [trucha
      común](/especie/salmo_trutta/).


      La temporada de visita va de mayo a octubre.
    visit: >-
      La puerta más cómoda es Jelenia Góra, porque el área de Borowy Jar empieza en el norte de la ciudad y
      sigue el río hacia Siedlęcin. Dos senderos señalizados, el amarillo y el verde, parten de la estación de
      autobuses. El amarillo es una pista asfaltada para peatones y ciclistas junto al agua, fácil y bonita, y
      lleva en unos cincuenta y cinco minutos hasta el refugio Perła Zachodu. Por el camino se pasa junto al
      manantial Hipokrene, que sale directo de la pared de roca y tiene un panel informativo. El verde pasa
      bajo la torre mirador «Grzybek», sigue por pista de grava hacia el mismo refugio y tarda unos ochenta
      minutos.


      Para tener vistas, la Ścieżka Poetów termina en el mirador «Trafalgar», con barandilla y una panorámica
      de la garganta del Bóbr y de Jelenia Góra. Sobre Borowy Jar, la montaña Gapy es menos transitada y tiene
      en su cima formaciones rocosas como Progi y Sośnik, con un panel que explica el panorama.


      Si buscas más recorrido: dos senderos de largo recorrido atraviesan el parque, el azul, parte de la ruta
      internacional E3, y el verde, la Ruta de los Castillos Piastas. En Lwówek Śląski hay un sendero
      didáctico, «Szwajcaria Lwówecka», y la torre mirador de Góra Zamkowa, en Wleń, completa las vistas. Para
      ir en bici, la ruta euroregional ER-6 sigue el Bóbr y llega hasta la torre ducal de Siedlęcin.
    history: >-
      El valle guarda historia a cada paso. En lo alto de Góra Zamkowa, en Wleń, quedan las ruinas de una
      castellanía medieval, y la misma colina es hoy reserva natural: protege un robledal-carpinar con plantas
      valiosas y restos del patrimonio histórico. Otra reserva, la de Dziki Wąwóz, en Lubomierz, guarda
      bosques de arce y tilo y robledales-carpinares en el barranco del arroyo Maciejowicki.


      El plan de protección aprobado en dos mil veinticuatro fija el objetivo: conservar los valores
      naturales, históricos, culturales y paisajísticos del parque, y en particular el sistema hidrográfico
      del Bóbr con sus prados, brazos muertos y humedales, que son hábitat de especies protegidas y raras.
    before: >-
      Los senderos de Borowy Jar parten del centro de Jelenia Góra y cada uno se hace en poco más de una hora.
      Lo mejor es ir entre mayo y octubre, y cuenta con una o dos jornadas para el conjunto del parque.
    around: >-
      A un kilómetro está el [Macizo de Krkonoše / Karkonosze](/lugar/krkonose---karkonosze-high-massif/), y a
      veintiséis los [Hayedos de las Montañas de
      Jizera](/lugar/narodni-prirodni-rezervace-jizerskohorske-buciny/). Más lejos, el [Garganta del Crișul
      Repede](/lugar/cheile-crisului-repede/) comparte con el valle del Bóbr el guion de codornices, el
      mochuelo chico y los desfiladeros.
  en:
    intro: >-
      A river cutting through the hills of the Western Sudetes without hesitation: that is the Bóbr between
      Jelenia Góra and Lwówek Śląski. The Bóbr Valley Landscape Park, designated in nineteen eighty-nine,
      revolves entirely around this dramatic river corridor. There are steep gorges where rock layers of
      widely differing geological ages lie exposed, reservoirs that did not exist before dam construction,
      diverse forests of spruce, oak, birch and pine, and fertile valley-bottom meadows and pastures.
    landscape: >-
      The Bóbr never flows in a straight line. Where the valley narrows it forms rock gorges, and the rushing
      current reveals distinct strata from widely varied geological eras, like pages of an open book. Between
      the gorges, historic masonry dams have created picturesque reservoirs. The largest is Pilchowice Dam,
      built between nineteen hundred and three and nineteen hundred and twelve: it splits the park's river
      into two distinct reaches, an upper section of thirteen kilometres and a lower run of twenty-five.


      Away from the water's edge, the landscape presents classic upland contrasts. In the valley floor, lush
      hay meadows and fertile pastures dominate; on steeper slopes grow spruce, sessile oak, silver birch and
      Scots pine. The vascular flora counts some eight hundred species, many of which are protected or scarce:
      botanical highlights include variegated monkshood *Aconitum variegatum*, marsh helleborine *Epipactis
      palustris*, broad-leaved marsh orchid *Dactylorhiza majalis*, cross gentian *Gentiana cruciata*, fringed
      gentian *Gentianella ciliata* and autumn crocus *Colchicum autumnale*.


      There is also striking geology. Near Lwówek Śląski, a limestone cave opens into galleries and
      subterranean chambers totalling some one hundred and thirty-six metres. In the municipality of Wleń, a
      basalt volcanic neck stands as one of eight natural monuments in the park, and the highest elevation,
      Siedlęcinka hill, attains four hundred and ninety-five metres.
    wildlife: >-
      Among breeding birds recorded in the river corridor are the common merganser, [corn
      crake](/especie/crex_crex/), [Eurasian eagle-owl](/especie/bubo_bubo/), [Eurasian pygmy
      owlet](/especie/glaucidium_passerinum/) and boreal owl, leading an inventory of one hundred and ten
      nesting species. Amphibians include the [fire salamander](/especie/salamandra_salamandra/), a species
      experiencing regional decline. Key mammalian and aquatic inhabitants also include the [Eurasian
      beaver](/especie/castor_fiber/), the [Eurasian otter](/especie/lutra_lutra/) and native brown [sea
      trout](/especie/salmo_trutta/).


      The prime visiting season runs from May to October.
    visit: >-
      The most convenient gateway is Jelenia Góra, as the scenic Borowy Jar area begins right at the northern
      edge of town and traces the river toward Siedlęcin. Two waymarked footpaths, the yellow and the green,
      leave from the bus station. The yellow trail is a tarmac path for walkers and cyclists running close
      along the water, gentle and attractive, reaching the Perła Zachodu mountain lodge in around fifty-five
      minutes. En route you pass the Hipokrene spring, emerging directly from the crag with an interpretive
      board. The green trail passes beneath the «Grzybek» lookout tower, continues along a gravel track to the
      same lodge and requires about eighty minutes.


      For expansive views, the Ścieżka Poetów leads to the «Trafalgar» vantage point, equipped with railings
      and surveying the Bóbr gorge and Jelenia Góra. Above Borowy Jar, Mount Gapy sees fewer hikers and
      features rock formations such as Progi and Sośnik at its crest, accompanied by a panoramic viewpoint
      panel.


      For longer journeys: two long-distance trails traverse the park: the blue trail, forming part of the
      international E3 footpath, and the green trail, known as the Trail of the Piast Castles. In Lwówek
      Śląski a nature trail explores «Szwajcaria Lwówecka», and the observation tower on Góra Zamkowa in Wleń
      provides wider vistas. Cyclists can follow the euroregional ER-6 route along the Bóbr toward the
      medieval ducal tower in Siedlęcin.
    history: >-
      The valley holds historical heritage at every turn. Atop Góra Zamkowa in Wleń stand the ruins of a
      medieval castellany, and the hill itself is now a nature reserve protecting an oak-hornbeam woodland
      rich in rare herbs and historical remains. Another reserve, Dziki Wąwóz in Lubomierz, protects
      maple-linden and oak-hornbeam ravine forests along the Maciejowicki brook.


      The conservation management plan approved in two thousand and twenty-four defines the central objective:
      preserving the natural, historical, cultural and scenic assets of the park, particularly the hydrologic
      network of the Bóbr with its flood meadows, oxbow wetlands and riparian marshes that harbour protected
      and endangered species.
    before: >-
      Trails through Borowy Jar start directly from central Jelenia Góra and each takes little more than one
      hour. The best time to visit is between May and October, allowing one or two days to explore the broader
      park.
    around: >-
      One kilometre away lies the [Krkonoše / Karkonosze High
      Massif](/lugar/krkonose---karkonosze-high-massif/), and twenty-six kilometres distant are the [Jizera
      Mountains Primeval Beech Forests](/lugar/narodni-prirodni-rezervace-jizerskohorske-buciny/). Further
      away, the [Crișul Repede Gorge](/lugar/cheile-crisului-repede/) shares with the Bóbr valley the corn
      crake, pygmy owl and winding limestone defiles.
  fr:
    intro: >-
      Une rivière qui traverse sans hésiter les collines des Sudètes occidentales : tel est le Bóbr entre
      Jelenia Góra et Lwówek Śląski. Le parc paysager de la vallée du Bóbr, créé en mil neuf cent
      quatre-vingt-neuf, s'articule tout entier autour de ce cours d'eau. On y découvre des gorges où la roche
      affleure en strates d'époques géologiques variées, des lacs créés par les barrages, des forêts
      d'épicéas, de chênes, de bouleaux et de pins, et dans le fond de la vallée, de fertiles prairies de
      fauche.
    landscape: >-
      Le Bóbr ne descend pas en ligne droite. Là où le relief se resserre se creusent des défilés où le
      courant met à nu des formations rocheuses d'âges très disparates, semblables aux pages d'un livre
      d'histoire naturelle. Entre deux gorges, les retenues forment des plans d'eau remarquables. Le plus
      grand est celui de Pilchowice, aménagé entre mil neuf cent trois et mil neuf cent douze : il coupe la
      rivière du parc en deux tronçons, l'un amont de treize kilomètres et l'autre aval de vingt-cinq.


      En dehors des rives, le contraste est saisissant. Au fond de la vallée dominent les prairies grasses et
      les pâturages ; sur les versants s'étendent l'épicéa, le chêne, le bouleau et le pin. La flore compte
      environ huit cents espèces, dont beaucoup sont protégées ou rares : parmi ces raretés figurent l'aconit
      panaché *Aconitum variegatum*, l'épipactis des marais *Epipactis palustris*, l'orchis de mai
      *Dactylorhiza majalis*, la gentiane croisette *Gentiana cruciata*, la gentianelle ciliée *Gentianella
      ciliata* et le colchique d'automne *Colchicum autumnale*.


      Le sous-sol présente un relief marqué. Près de Lwówek Śląski s'ouvre une cavité calcaire dont les
      galeries totalisent environ cent trente-six mètres. Sur la commune de Wleń, un neck volcanique de
      basalte constitue l'un des huit monuments naturels du parc, et le point culminant, la colline de
      Siedlęcinka, atteint quatre cent quatre-vingt-quinze mètres.
    wildlife: >-
      Parmi les oiseaux nicheurs de la vallée figurent le grand harle, le [râle des
      genêts](/especie/crex_crex/), le [hibou grand-duc](/especie/bubo_bubo/), la [chevêchette
      d'Europe](/especie/glaucidium_passerinum/) et la chouette de Tengmalm, en tête d'une liste de cent dix
      espèces reproductrices. Parmi les amphibiens se distingue la [salamandre
      tachetée](/especie/salamandra_salamandra/), en régression régionale. Le cortège faunique compte
      également le [castor d'Europe](/especie/castor_fiber/), la [loutre d'Europe](/especie/lutra_lutra/) et
      la [truite fario](/especie/salmo_trutta/).


      La saison de visite s'étend de mai à octobre.
    visit: >-
      Le point d'accès le plus pratique est Jelenia Góra, le secteur de Borowy Jar s'ouvrant au nord de la
      cité en longeant la rivière vers Siedlęcin. Deux sentiers balisés, le jaune et le vert, partent de la
      gare routière. Le sentier jaune emprunte une voie asphaltée piétonne et cyclable au fil de l'eau, douce
      et agréable, menant en environ cinquante-cinq minutes au refuge Perła Zachodu. En chemin, vous longez la
      source Hipokrene qui jaillit de la roche avec son panneau didactique. Le sentier vert passe sous la tour
      d'observation « Grzybek », suit un chemin de gravier vers le même refuge et demande environ
      quatre-vingts minutes.


      Pour les panoramas, la Ścieżka Poetów s'achève au belvédère « Trafalgar », doté de rambardes sur les
      gorges du Bóbr et Jelenia Góra. Dominant Borowy Jar, la colline Gapy est plus confidentielle et présente
      à son sommet les falaises de Progi et Sośnik avec table d'orientation.


      Pour de plus amples randonnées : deux grands itinéraires traversent le parc, le sentier bleu, intégré à
      la voie européenne E3, et le sentier vert, la Route des châteaux Piast. À Lwówek Śląski, un sentier
      thématique explore « Szwajcaria Lwówecka », tandis que la tour de Góra Zamkowa à Wleń complète les
      points de vue. À bicyclette, la véloroute eurorégionale ER-6 longe le Bóbr jusqu'à la tour ducale de
      Siedlęcin.
    history: >-
      La vallée recèle un riche passé à chaque détour. Au sommet de Góra Zamkowa, à Wleń, subsistent les
      vestiges d'une châtellenie médiévale ; la colline forme aujourd'hui une réserve naturelle préservant une
      chênaie-charmaie et ce patrimoine castral. Une autre réserve, celle de Dziki Wąwóz à Lubomierz, protège
      des forêts d'érablières à tilleuls et des ravins boisés le long du ruisseau Maciejowicki.


      Le plan de gestion approuvé en deux mille vingt-quatre fixe les orientations : préserver le patrimoine
      naturel, historique et paysager du parc, et en particulier le réseau hydrographique du Bóbr avec ses
      prairies inondables, bras morts et zones humides abritant des espèces vulnérables.
    before: >-
      Les sentiers de Borowy Jar démarrent du centre de Jelenia Góra et chacun demande un peu plus d'une
      heure. La période idéale va de mai à octobre, et comptez une ou deux journées pour l'ensemble du parc.
    around: >-
      À un kilomètre s'étend le [massif des monts des Géants /
      Karkonosze](/lugar/krkonose---karkonosze-high-massif/), et à vingt-six kilomètres les [hêtraies des
      monts de la Jizera](/lugar/narodni-prirodni-rezervace-jizerskohorske-buciny/). Plus loin, les [gorges du
      Crișul Repede](/lugar/cheile-crisului-repede/) partagent avec la vallée du Bóbr le râle des genêts, la
      chevêchette d'Europe et les défilés rocheux.
  de:
    intro: >-
      Ein Fluss, der die Hügel der Westsudeten ohne Zögern durchbricht: So präsentiert sich der Bober zwischen
      Jelenia Góra und Lwówek Śląski. Der im Jahr neunzehnhundertneunundachtzig geschaffene Landschaftspark
      Bobertal dreht sich ganz um diesen Talabschnitt. Schluchten zeigen Gesteinsschichten verschiedenster
      Epochen, Stauseen entstanden durch historische Staumauern, Hänge tragen Fichten-, Eichen-, Birken- und
      Kiefernwälder, und in der Talsohle breiten sich fruchtbare Auenwiesen aus.
    landscape: >-
      Der Bober fließt niemals geradlinig. Wo das Gelände eng wird, bildet er Schluchten, in denen das
      strömende Wasser Felsformationen unterschiedlichster Erdzeitalter wie aufgeschlagene Buchseiten
      freilegt. Zwischen den Schluchten haben Talsperren reizvolle Stauseen geschaffen. Die größte ist die
      Talsperre Pilchowice, erbaut zwischen neunzehnhundertdrei und neunzehnhundertzwölf: Sie teilt den Fluss
      im Park in zwei Abschnitte, einen oberen von dreizehn Kilometern und einen unteren von fünfundzwanzig.


      Abseits des Ufers zeigt sich der landschaftliche Kontrast. In der Aue dominieren Mähwiesen und Weiden;
      an den Hängen stehen Fichte, Traubeneiche, Birke und Kiefer. Die Flora zählt rund achthundert Arten, von
      denen viele streng geschützt oder selten sind: Zu den botanischen Kostbarkeiten gehören der Bunte
      Eisenhut *Aconitum variegatum*, die Sumpf-Stendelwurz *Epipactis palustris*, das Breitblättrige
      Knabenkraut *Dactylorhiza majalis*, der Kreuz-Enzian *Gentiana cruciata*, der Gefranste Enzian
      *Gentianella ciliata* und die Herbst-Zeitlose *Colchicum autumnale*.


      Auch die Geologie setzt Akzente. Bei Lwówek Śląski öffnet sich eine Karsthöhle im Kalkgestein, deren
      Gänge und Hallen rund einhundertsechsunddreißig Meter messen. In der Gemeinde Wleń bildet ein
      Basaltschlot eines von acht Naturdenkmälern des Parks, und die höchste Erhebung, die Siedlęcinka,
      erreicht vierhundertfünfundneunzig Meter.
    wildlife: >-
      Zu den Brutvögeln des Tals gehören der Gänsesäger, der [Wachtelkönig](/especie/crex_crex/), der
      [Uhu](/especie/bubo_bubo/), der [Sperlingskauz](/especie/glaucidium_passerinum/) und der Raufußkauz an
      der Spitze einer Liste von einhundertzehn Nistvogelarten. Unter den Amphibien sticht der
      [Feuersalamander](/especie/salamandra_salamandra/) hervor, dessen Bestände rückläufig sind. Heimisch
      sind im Park auch der [Europäische Biber](/especie/castor_fiber/), der [Eurasische
      Fischotter](/especie/lutra_lutra/) und die heimische Bach-[Forelle](/especie/salmo_trutta/).


      Die Hauptbesuchszeit reicht von Mai bis Oktober.
    visit: >-
      Der bequemste Ausgangspunkt ist Jelenia Góra, da die Felsenstrecke des Borowy Jar unmittelbar am
      Nordrand der Stadt beginnt und dem Fluss nach Siedlęcin folgt. Zwei markierte Wanderwege, der gelbe und
      der grüne, starten am Busbahnhof. Der gelbe Weg verläuft als asphaltierte Promenade für Fußgänger und
      Radler nah am Wasser, bequem und landschaftlich reizvoll, und führt in rund fünfundfünfzig Minuten zur
      Bergbaude Perła Zachodu. Unterwegs passierst du die Quelle Hipokrene, die direkt aus der Felswand
      austritt und mit einer Schautafel versehen ist. Der grüne Pfad zieht unter dem Aussichtsturm «Grzybek»
      hindurch auf Schotterwegen zur gleichen Baude und beansprucht etwa achtzig Minuten.


      Für weite Blicke führt der Dichterpfad zum Aussichtspunkt «Trafalgar» mit Geländer und Rundblick über
      das Bobertal und Jelenia Góra. Oberhalb von Borowy Jar ist der Berg Gapy ruhiger und bietet Felsen wie
      Progi und Sośnik mit Panoramatafeln.


      Für ausgedehnte Touren queren zwei Fernwanderwege den Park: die blaue Route als Teil des europäischen
      Fernwanderwegs E3 und die grüne Route der Piastenburgen. In Lwówek Śląski erschließt ein Lehrpfad die
      «Löwenberger Schweiz», und der Turm auf der Góra Zamkowa in Wleń rundet das Panorama ab. Per Rad folgt
      die euroregionale Route ER-6 dem Bober bis zum Wohnturm in Siedlęcin.
    history: >-
      Das Tal birgt auf Schritt und Tritt Geschichte. Auf der Höhe der Góra Zamkowa in Wleń ragen Burgruinen
      einer mittelalterlichen Kastellanei auf; der Berg selbst steht als Naturschutzgebiet unter Schutz und
      bewahrt Eichen-Hainbuchenwälder mit seltenen Pflanzen. Ein weiteres Reservat, die Dziki Wąwóz bei
      Lubomierz, schützt Schluchtwälder aus Bergahorn und Linde entlang des Baches Maciejowicki.


      Der im Jahr zweitausendvierundzwanzig beschlossene Schutzplan setzt klare Ziele: Erhaltung der Natur-,
      Kultur- und Landschaftswerte des Parks, insbesondere des Gewässernetzes des Bober mit seinen Auwiesen,
      Altarmen und Feuchtgebieten als Lebensraum geschützter Arten.
    before: >-
      Die Pfade durch den Borowy Jar starten direkt im Zentrum von Jelenia Góra und dauern jeweils etwas mehr
      als eine Stunde. Am besten reist du zwischen Mai und Oktober an und planst ein bis zwei Tage für den
      gesamten Park ein.
    around: >-
      Nur einem Kilometer entfernt liegt das [Riesengebirge /
      Karkonosze](/lugar/krkonose---karkonosze-high-massif/), und sechsundzwanzig Kilometer trennen den Park
      von den [Isergebirgs-Buchenurwäldern](/lugar/narodni-prirodni-rezervace-jizerskohorske-buciny/). Weiter
      entfernt teilt die [Crișul-Repede-Schlucht](/lugar/cheile-crisului-repede/) mit dem Bobertal
      Wachtelkönig, Sperlingskauz und Felsenklammen.
  it:
    intro: >-
      Un fiume che attraversa i rilievi dei Sudeti occidentali senza deviazioni: ecco il Bóbr tra Jelenia Góra
      e Lwówek Śląski. Il Parco paesaggistico della valle del Bóbr, istituito nel millenovecentottantanove, si
      sviluppa interamente attorno a questa gola fluviale. Vi si aprono gole dove la roccia affiora in strati
      di epoche geologiche diverse, bacini che non esistevano prima delle dighe, boschi di abete rosso,
      quercia, betulla e pino silvestre, e nel fondovalle fertili prati falciabili.
    landscape: >-
      Il Bóbr non scorre in linea retta. Dove la valle si restringe forma forre rocciose in cui la corrente
      svela formazioni di età geologiche eterogenee, come pagine aperte di un trattato geologico. Tra una gola
      e l'altra, le dighe hanno dato origine a laghi artificiali suggestivi. La più imponente è quella di
      Pilchowice, costruita tra il millenovecentotre e il millenovecentododici: divide il fiume del parco in
      due tronconi, uno superiore di tredici chilometri e uno inferiore di venticinque.


      Fuori dall'alveo, il contrasto paesaggistico è netto. Nel fondovalle dominano prati umidi e pascoli
      fertili; sui versanti crescono l'abete rosso, la quercia, la betulla e il pino. La flora vascolare conta
      circa ottocento specie, molte delle quali protette o inconsuete: tra le rarità botaniche si segnalano
      l'aconito screziato *Aconitum variegatum*, l'elleborina palustre *Epipactis palustris*, l'orchidea
      *Dactylorhiza majalis*, la genziana crociata *Gentiana cruciata*, la *Gentianella ciliata* e il colchico
      autunnale *Colchicum autumnale*.


      Anche la geologia riserva sorprese. Presso Lwówek Śląski si apre una grotta carsica nei calcari con
      gallerie e vani per circa centotrentasei metri. Nel comune di Wleń, un camino vulcanico di basalto
      costituisce uno degli otto monumenti naturali del parco, mentre la vetta più alta, la collina di
      Siedlęcinka, tocca i quattrocentonovantacinque metri.
    wildlife: >-
      Tra i volatili nidificanti nella valle compaiono lo smergo maggiore, il [re di
      quaglie](/especie/crex_crex/), il [gufo reale](/especie/bubo_bubo/), la [civetta
      nana](/especie/glaucidium_passerinum/) e la civetta capogrosso, alla guida di una comunità di centodieci
      specie riproduttrici. Tra gli anfibi è presente la [salamandra
      pezzata](/especie/salamandra_salamandra/), specie in regresso nell'area. La fauna include anche il
      [castoro](/especie/castor_fiber/), la [lontra europea](/especie/lutra_lutra/) e la [trota
      atlantica](/especie/salmo_trutta/).


      Il periodo migliore per la visita va da maggio a ottobre.
    visit: >-
      Il punto di accesso più comodo è Jelenia Góra, poiché l'area di Borowy Jar inizia all'estremità nord
      della città e risale il corso fluviale verso Siedlęcin. Dalla stazione degli autobus si diramano due
      itinerari segnati, il giallo e il verde. Il sentiero giallo è una pista asfaltata ciclo-pedonale
      accostata all'acqua, agevole e panoramica, che conduce in circa cinquantacinque minuti al rifugio Perła
      Zachodu. Lungo il cammino si incontra la sorgente Hipokrene, che scaturisce direttamente dalla parete
      rocciosa con un pannello informativo. Il sentiero verde transita sotto la torre di vedetta «Grzybek»,
      prosegue su sterrata verso lo stesso rifugio e richiede circa ottanta minuti.


      Per ampi scorci, la Ścieżka Poetów conduce al belvedere «Trafalgar», protetto da ringhiera, con vista
      sulla gola del Bóbr e sull'abitato di Jelenia Góra. Sopra Borowy Jar, il monte Gapy è meno battuto ed
      esibisce in vetta guglie rocciose come Progi e Sośnik con una mappa dei panorami.


      Per percorsi più ampi: due cammini di lunga distanza attraversano il parco, il tracciato blu, parte del
      sentiero europeo E3, e il sentiero verde dei Castelli Piast. A Lwówek Śląski un percorso didattico
      esplora la «Svizzera di Lwówek», e la torre panoramica di Góra Zamkowa a Wleń regala ulteriori viste. In
      sella alla bici, la ciclovia euroregionale ER-6 segue il Bóbr fino alla torre ducale di Siedlęcin.
    history: >-
      La valle custodisce memorie a ogni curva. Sulla sommità di Góra Zamkowa a Wleń rimangono le rovine di
      una castellania medievale; la collina è oggi riserva naturale a protezione di querco-carpineti con flora
      protetta. Un'altra riserva, quella di Dziki Wąwóz a Lubomierz, tutela boschi di forra con aceri e tigli
      nella forra del torrente Maciejowicki.


      Il piano di gestione approvato nel duemilaventiquattro ne ribadisce gli scopi: salvaguardare il
      patrimonio naturale, storico e paesaggistico del parco, con particolare attenzione alla rete idrografica
      del Bóbr, ai suoi prati allagabili, alle lanche e alle paludi fluviali.
    before: >-
      I sentieri di Borowy Jar partono dal centro di Jelenia Góra e ciascuno si percorre in poco più di
      un'ora. Il periodo più indicato va da maggio a ottobre, preventivando uno o due giorni per la visita
      completa.
    around: >-
      A un chilometro si trova il [Massiccio di Krkonoše /
      Karkonosze](/lugar/krkonose---karkonosze-high-massif/), e a ventisei le [Faggete Primordiali dei Monti
      di Jizera](/lugar/narodni-prirodni-rezervace-jizerskohorske-buciny/). Più distante, la [Gola del Crișul
      Repede](/lugar/cheile-crisului-repede/) condivide con la valle del Bóbr il re di quaglie, la civetta
      nana e le gole rupestri.
  pt:
    intro: >-
      Um rio que rasga as colinas dos Sudetas ocidentais com determinação: assim é o Bóbr entre Jelenia Góra e
      Lwówek Śląski. O Parque Paisagístico do Vale do Bóbr, criado em mil novecentos e oitenta e nove, gira
      inteiramente em torno deste vale fluvial. Aqui abrem-se gargantas onde a rocha aflora em estratos de
      eras geológicas distintas, albufeiras que não existiam antes das represas, bosques de abeto, carvalho,
      bétula e pinheiro, e no fundo do vale férteis prados ripícolas.
    landscape: >-
      O Bóbr não corre em linha reta. Onde o relevo aperta forma desfiladeiros rochosos onde as águas expõem
      formações de idades díspares, como páginas abertas de um livro da terra. Entre gargantas sucessivas, as
      barragens deram origem a belas albufeiras. A maior é a de Pilchowice, erguida entre mil novecentos e
      três e mil novecentos e doze: divide o rio do parque em dois setores, um superior de treze quilómetros e
      outro inferior de vinte e cinco.


      Longe das margens, o contraste é patente. No fundo do vale dominam prados de feno verdejantes e
      pastagens; nas encostas medram o abeto, o carvalho-roble, a bétula e o pinheiro-silvestre. A flora soma
      cerca de oitocentas espécies, muitas delas raras ou sob proteção: destacam-se o acónito *Aconitum
      variegatum*, a orquídea *Epipactis palustris*, o lírio-dos-pântanos *Dactylorhiza majalis*, a
      genciana-cruzada *Gentiana cruciata*, a *Gentianella ciliata* e o açafrão-do-outono *Colchicum
      autumnale*.


      A geologia também surpreende. Perto de Lwówek Śląski abre-se uma gruta cárstica em calcários cujas
      galerias somam cerca de cento e trinta e seis metros. No município de Wleń, uma chaminé vulcânica de
      basalto é um dos oito monumentos naturais do parque, e o cume mais elevado, em Siedlęcinka, culmina a
      quatrocentos e noventa e cinco metros.
    wildlife: >-
      Entre as aves nidificantes do vale surgem o merganso-grande, o [codornizão](/especie/crex_crex/), o
      [bufo-real](/especie/bubo_bubo/), o [mocho-pigmeu](/especie/glaucidium_passerinum/) e o
      mocho-de-tengmalm, encabeçando um rol de cento e dez espécies reprodutoras. Nos anfíbios marca presença
      a [salamandra-de-fogo](/especie/salamandra_salamandra/), espécie em declínio local. O elenco faunístico
      inclui ainda o [castor-europeu](/especie/castor_fiber/), a [lontra-europeia](/especie/lutra_lutra/) e a
      [truta-fário](/especie/salmo_trutta/).


      A época recomendada para a visita vai de maio a outubro.
    visit: >-
      O ponto de partida mais prático é Jelenia Góra, pois a área de Borowy Jar principia na zona norte da
      cidade e segue o rio rumo a Siedlęcin. Da estação rodoviária saem dois trilhos sinalizados, o amarelo e
      o verde. O amarelo é uma pista asfaltada pedonal e ciclável junto à margem, fácil e airosa, que chega em
      cerca de cinquenta e cinco minutos ao refúgio Perła Zachodu. Pelo caminho passa-se pela nascente
      Hipokrene, que brota da escarpa com painel interpretativo. O verde passa sob a torre de vigia «Grzybek»,
      continua em piso de gravilha até ao mesmo refúgio e demora cerca de oitenta minutos.


      Para miradouros panorâmicos, a Ścieżka Poetów culmina no posto «Trafalgar», munido de guarda-corpos
      sobre a garganta do Bóbr e Jelenia Góra. Acima de Borowy Jar, o monte Gapy é mais sossegado e apresenta
      no topo penedos como Progi e Sośnik com painel descritivo.


      Se procuras percursos mais longos: dois trilhos de grande rota cruzam o parque, a rota azul, integrada
      no itinerário europeu E3, e a rota verde dos Castelos Piastas. Em Lwówek Śląski um percurso didático
      percorre a «Suíça de Lwówek», e a torre na Góra Zamkowa em Wleń brinda com horizontes desafogados. De
      bicicleta, a rota eurorregional ER-6 acompanha o Bóbr até à torre senhorial de Siedlęcin.
    history: >-
      O vale encerra património a cada recanto. No cimo da Góra Zamkowa, em Wleń, subsistem vestígios de uma
      fortaleza medieval; o morro é hoje reserva natural e protege carvalhais-olmeirais com plantas raras.
      Outra reserva, Dziki Wąwóz em Lubomierz, salvaguarda matas de ravina com bordos e tílias ao longo da
      ribeira de Maciejowicki.


      O plano de ordenamento aprovado em dois mil e vinte e quatro definiu a sua meta: conservar os valores
      naturais, históricos e cénicos do parque, dedicando especial atenção à rede fluvial do Bóbr com as suas
      várzeas, esteiros e charcos húmidos.
    before: >-
      Os trilhos de Borowy Jar partem do centro de Jelenia Góra e realizam-se em pouco mais de uma hora cada.
      O melhor período decorre de maio a outubro, reservando um ou dois dias para o conjunto do vale.
    around: >-
      A um quilómetro ergue-se o [Maciço de Krkonoše / Karkonosze](/lugar/krkonose---karkonosze-high-massif/),
      e a vinte e seis ficam os [Faiais Virgens das Montanhas de
      Jizera](/lugar/narodni-prirodni-rezervace-jizerskohorske-buciny/). Mais distante, o [Desfiladeiro de
      Crișul Repede](/lugar/cheile-crisului-repede/) partilha com o vale do Bóbr o codornizão, o mocho-pigmeu
      e as gargantas rochosas.
