resumen:
  es: >-
    La 'Montaña Madre' de los Abruzos (Monte Amaro 2.793 m), Geoparque UNESCO de inmensos cañones kársticos,
    altiplanos selváticos y ermitas rupestres colgadas.
  en: >-
    The 'Mother Mountain' of Abruzzo (Monte Amaro 2,793 m), a UNESCO Global Geopark of colossal karst canyons,
    wild plateaus, and hanging rock hermitages.
  fr: >-
    La « Montagne Mère » des Abruzzes (Monte Amaro 2 793 m), géoparc UNESCO d'immenses canyons karstiques, de
    hauts plateaux sauvages et d'ermitages rupestres suspendus.
  de: >-
    Der 'Mutterberg' der Abruzzen (Monte Amaro 2.793 m), UNESCO-Geopark mit gewaltigen Karstschluchten,
    einsamen Hochflächen und kühn in den Fels gebauten Einsiedeleien.
  it: >-
    La 'Montagna Madre' d'Abruzzo (Monte Amaro 2.793 m), Geoparco UNESCO di orridi calcarei, pianori d'alta
    quota ed eremi rupestri aggrappati alla roccia.
  pt: >-
    A 'Montanha-Mãe' dos Abruzos (Monte Amaro 2.793 m), Geoparque da UNESCO de desfiladeiros cársicos
    monumentais, planaltos selvagens e ermidas rupestres suspensas.
unico:
  es: >-
    Es una montaña donde caminas por el hábitat del oso marsicano y, a la vez, por 95 geositios que cuentan
    cómo se hizo el Apenino.
  en: >-
    A mountain massif where you walk through prime Marsican brown bear habitat while discovering 95 geosites
    telling the story of the Apennines' geological birth.
  fr: >-
    Un massif de haute montagne où vous cheminez sur les traces de l'ours marsicain au cœur de 95 géosites
    racontant la naissance des Apennins.
  de: >-
    Ein Gebirgsstock, in dem du durch den Lebensraum des Marsischen Braunbären wanderst und zugleich 95
    Geotope entdeckst, die von der Entstehung des Apennins zeugen.
  it: >-
    Una montagna in cui cammini nell'habitat dell'orso marsicano e, al contempo, attraverso 95 geositi che
    raccontano l'origine geologica dell'Appennino.
  pt: >-
    Uma cordilheira alpina onde caminhas pelo habitat do urso-marsicano e percorres 95 geossítios que revelam
    a génese dos Apeninos.
