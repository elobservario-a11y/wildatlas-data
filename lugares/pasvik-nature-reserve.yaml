resumen:
  es: >-
    El extremo occidental del bosque primario de taiga siberiana de pino silvestre (*Pinus sylvestris*),
    albergando la mayor densidad de oso pardo de Noruega en la frontera con Rusia.
  en: >-
    The westernmost edge of the primeval Siberian Scots pine taiga (*Pinus sylvestris*), harbouring Norway's
    highest brown bear density along the Russian border.
  fr: >-
    La lisière occidentale de la taïga sibérienne primaire de pin sylvestre (*Pinus sylvestris*), abritant la
    plus forte densité d'ours brun de Norvège le long de la frontière russe.
  de: >-
    Der westlichste Ausläufer der sibirischen Ur-Taiga aus Wald-Kiefern (*Pinus sylvestris*) mit Norwegens
    größter Braunbärendichte an der Grenze zu Russland.
  it: >-
    L'estremo lembo occidentale della taiga siberiana primaria di pino silvestre (*Pinus sylvestris*), con la
    massima concentrazione di orsi bruni della Norvegia al confine con la Russia.
  pt: >-
    O limite ocidental da taiga siberiana virgem de pinheiro-silvestre (*Pinus sylvestris*), albergando a
    maior concentração de ursos-pardos da Noruega na fronteira russa.
unico:
  es: >-
    Pasvik es el límite occidental de varias especies siberianas de plantas y animales, raras en Noruega y
    comunes en Rusia.
  en: >-
    Pasvik marks the western range limit for several Siberian plant and animal species that are rare in Norway
    yet common across Russia.
  fr: >-
    Pasvik constitue la limite occidentale de plusieurs espèces végétales et animales sibériennes, rares en
    Norvège et communes en Russie.
  de: >-
    Pasvik markiert die westliche Verbreitungsgrenze mehrerer sibirischer Pflanzen- und Tierarten, die in
    Norwegen selten, in Russland jedoch weit verbreitet sind.
  it: >-
    Pasvik segna il confine occidentale di numerose specie siberiane di flora e fauna, rare in Norvegia ma
    diffuse in Russia.
  pt: >-
    Pasvik marca o limite ocidental de várias espécies siberianas de flora e fauna, raras na Noruega mas
    comuns na Rússia.
observaciones:
