resumen:
  es: Garganta del Danubio encajada entre colinas terraceadas, robledales xotérmicos y roquedos.
  en: Danube gorge flanked by terraced slopes, thermophilic oak woods, and crags.
  fr: Gorge du Danube encaissée entre coteaux en terrasses, chênaies thermophiles et falaises rocheuses.
  de: Enges Durchbruchstal der Donau zwischen Weinbergterrassen, trockenwarmen Eichenwäldern und Felswänden.
  it: Gola del Danubio incastonata tra versanti terrazzati a vigneto, querceti termofili e rupi scoscese.
  pt: Desfiladeiro do Danúbio encaixado entre socalcos vinhateiros, carvalhais termófilos e escarpas rochosas.
unico:
  es: >-
    Es un tramo del Danubio que se salvó de la presa: aquí el río aún corre libre entre gravas, islas y brazos
    muertos.
  en: >-
    A stretch of the Danube saved from damming: here the river still runs free among gravel banks, islands,
    and side arms.
  fr: >-
    Un tronçon du Danube sauvé des barrages : ici le fleuve coule encore libre entre bancs de graviers, îles
    et bras morts.
  de: >-
    Ein Donauabschnitt, der vor dem Staustufenbau gerettet wurde: Hier fließt der Strom noch frei zwischen
    Schotterbänken, Inseln und Altarmen.
  it: >-
    Un tratto del Danubio scampato agli sbarramenti: qui il fiume scorre ancora libero tra ghiaieti, isole e
    lanche.
  pt: >-
    Um troço do Danúbio que escapou às barragens: aqui o rio ainda corre livre entre cascalheiras, ilhotas e
    braços mortos.
observaciones:
  es: La primavera, con la floración, y el otoño son los mejores momentos.
texto:
  es:
    intro: >-
      Un río que se topa con un macizo tiene dos opciones: rodearla o abrirse paso. El Danubio abrió paso. En
      unos 35 kilómetros entre Melk y Krems corta la punta sur del macizo de Bohemia y deja a ambos lados un
      valle estrecho donde el fondo, a unos 200 metros, tiene un clima favorecido y las colinas de alrededor,
      que llegan a 900, aguantan inviernos fríos. Esa diferencia lo explica casi todo: terrazas de piedra en
      las laderas, pastizales secos, robledales y un río que sigue corriendo libre. La UNESCO lo declaró
      paisaje cultural en 2000, junto con los monasterios de Melk y Göttweig y el casco antiguo de Krems.
    landscape: >-
      Las cumbres más altas son el Jauerling, con 960 metros, y el Sandl, con 723. Las laderas se cultivan en
      terrazas de piedra, y esos muros secos, junto a los pastizales secos, son el verdadero hábitat de la
      Wachau.


      El Danubio mismo es el otro protagonista. Al ser un valle de ruptura no tiene grandes llanuras
      inundables: en todo el Patrimonio Mundial solo quedan 239 hectáreas de bosque de ribera. Por eso cada
      resto cuenta, y por eso importan los brazos laterales recuperados.


      Los pastizales secos se reparten por Spitz, St. Michael, Dürnstein, Rossatz y Krems. El mayor del este
      del valle es el Höhereck, junto a Dürnstein, con unas 200 especies de plantas y cerca de 100 de
      mariposas diurnas. En la parte soleada de las pendientes hay robledales claros de roble pubescente, una
      rareza amenazada en toda Europa, sobre todo cerca de la Teufelsmauer, en Spitz.
    wildlife: >-
      Los muros de piedra seca guardan a la lagartija esmeralda, el emblema de la Wachau, que vive entre los
      125 y los 600 metros en las laderas cálidas, igual que la [culebra de
      Esculapio](/especie/elaphe_longissima/), una de las mayores serpientes de Europa, de hasta 2 metros e
      inofensiva para las personas. Entre los pastos secos viven la mantis religiosa, todavía común aquí
      aunque amenazada en Baja Austria, y el ziesel, una ardilla de tierra muy amenazada en Austria que sigue
      siendo muy frecuente cerca de Krems y Mautern. Cada vez se ven más gatos monteses, una especie que en el
      país se daba por extinguida.


      Arriba, en los roquedos y bosques, hay [halcón peregrino](/especie/falco_peregrinus/), [cigüeña
      negra](/especie/ciconia_nigra/), [búho real](/especie/bubo_bubo/), martín pescador y abubilla; el
      abejaruco y el [pigargo europeo](/especie/haliaeetus_albicilla/) son visitantes regulares. En los
      bosques antiguos, como el de la Steinige Ries junto a Rossatz, vive el raro pico dorsiblanco. La región
      es una de las 58 Áreas Importantes para las Aves de Austria. El río aporta más de 50 especies de peces,
      entre ellas el [Huchen](/especie/hucho_hucho/) y la nase, además de [castor](/especie/castor_fiber/) y
      [nutria](/especie/lutra_lutra/).


      El calendario da cita a lo largo del año. El almendro florece de finales de febrero, y unas dos semanas
      después llega la floración del albaricoque, a mediados de abril, que se considera el punto álgido de la
      primavera. Con ella regresan la abubilla y la alondra totovía. El abejaruco, ave migratoria, se observa
      de primeros de mayo a finales de agosto. Al final de la primavera florecen orquídeas como el Knabenkraut
      quemado y el de casco, y en otoño abubillas y abejarucos se marchan. Las ovejas Brillenschaf pastan los
      pastizales secos de Dürnstein (Kuhberg y Kellerberg) y de Setzberg, en Spitz, para que no los invada el
      matorral.
    visit: >-
      Para el bosque de ribera, el mejor punto es la Pritzenau, junto a Rossatz. El paseo sale del
      aparcamiento del campo de deportes, a pocos pasos de la ciclovía del Danubio, y entra directo en la
      llanura aluvial por caminos anchos y llanos. Hay una pasarela de madera sobre un brazo del Danubio, y
      con suerte se ven martines pescadores, garzas y castores.


      Para quien quiera más, el Welterbesteig Wachau tiene 180 km y une los 13 municipios del Patrimonio
      Mundial a ambos lados del río; Krems es un buen punto de partida.
    history: >-
      La Wachau se pobló pronto: en Willendorf apareció la Venus de Willendorf, la huella humana más antigua
      conocida del valle. En época romana el Danubio fue la frontera norte del Imperio y el fuerte Favianis,
      en la actual Mautern, vigilaba la salida del valle. En la Edad Media dominaron los Kuenring, con
      castillos en Aggstein y Dürnstein.


      A principios de los setenta se proyectó una central hidroeléctrica en Rossatz. La oposición de la
      población la frenó, y en 1983 se canceló definitivamente. Por eso el Danubio sigue libre aquí. En 2006
      el brazo que habría servido de canal se reconectó al río con fines ambientales.


      Hoy la Wachau es paisaje protegido desde 1955, tiene el Diploma Europeo de Espacios Protegidos desde
      1994 y, desde 1972, el parque natural Jauerling-Wachau. El proyecto LIFE Auenwildnis recuperó brazos
      laterales y bosque de ribera: construyó 43 charcas de puesta para el tritón crestado del Danubio y el
      sapillo de vientre amarillo, y de los álamos negros nativos, que eran unos 600 árboles viejos, se han
      plantado más de 5000. BirdLife colgó cinco nidos artificiales para el águila de cola blanca y hubo los
      primeros intentos de nidificación en casi cien años. Los voluntarios siegan cada año entre 5 y 10
      hectáreas de pastizal seco.
    before: La primavera, con la floración, y el otoño son los mejores momentos.
    around: >-
      El atlas no recoge vecinos cercanos de la Wachau. El [Corredor Fluvial de las Areniscas del
      Elba](/lugar/elbe-sandstone-river-corridor/) es un lugar lejano que comparte con ella el búho real y los
      hábitats de corredor fluvial y cañón.
  en:
    intro: >-
      When a river confronts a bedrock massif, it has two choices: bypass it or slice straight through. The
      Danube cut through. Over some 35 kilometres between Melk and Krems it carves across the southern tip of
      the Bohemian Massif, flanking both sides with a steep gorge where the valley bottom, at roughly 200
      metres, enjoys a benign microclimate while surrounding summits reaching 900 face freezing winters. That
      contrast shapes everything: dry-stone vineyard terraces, steppe grasslands, downy oak woods, and an
      undammed river running wild. UNESCO inscribed the cultural landscape in 2000, embracing Melk and
      Göttweig Abbeys alongside Krems historic core.
    landscape: >-
      The highest summits are the Jauerling at 960 metres and the Sandl at 723. The hillsides are sculpted
      with dry-stone agricultural terraces; these stone dry-walls and sunny steppe grasslands constitute the
      signature habitat of the Wachau.


      The Danube itself is the other master force. Because it is a narrow antecedent gorge, vast floodplains
      never formed: across the entire World Heritage area only 239 hectares of riparian forest survive.
      Consequently, every relic parcel is invaluable, and restored side arms assume paramount importance.


      Dry grasslands cluster around Spitz, St. Michael, Dürnstein, Rossatz, and Krems. The largest expanse in
      the eastern gorge is the Höhereck above Dürnstein, harboring around 200 plant species and close to 100
      butterfly species. On sun-drenched upper slopes thrive open thermophilic woodlands of downy oak, an
      endangered habitat across Europe, notably around the Teufelsmauer in Spitz.
    wildlife: >-
      Dry-stone retaining walls harbor the green lizard, the living emblem of the Wachau, thriving between 125
      and 600 metres on warm slopes alongside the [Aesculapian snake](/especie/elaphe_longissima/), one of
      Europe's largest snakes, reaching up to 2 metres and completely harmless to humans. The dry pastures
      shelter the praying mantis, still widespread here despite declines across Lower Austria, and the
      European ground squirrel (Ziesel), severely endangered in Austria yet holding dense colonies near Krems
      and Mautern. European wildcat sightings are increasingly confirmed, a carnivore once deemed extirpated
      in the country.


      Upward on cliffs and forested bluffs reside [peregrine falcon](/especie/falco_peregrinus/), [black
      stork](/especie/ciconia_nigra/), [Eurasian eagle-owl](/especie/bubo_bubo/), common kingfisher, and
      Eurasian hoopoe; European bee-eater and [white-tailed eagle](/especie/haliaeetus_albicilla/) are regular
      visitors. In mature deciduous stands such as the Steinige Ries near Rossatz breeds the elusive
      white-backed woodpecker. The region is designated as one of Austria's 58 Important Bird Areas. The river
      yields over 50 fish species, including the endangered [Huchen](/especie/hucho_hucho/) and common nase,
      along with [Eurasian beaver](/especie/castor_fiber/) and [Eurasian otter](/especie/lutra_lutra/).


      The seasons establish a vivid rhythm. Almond trees flower in late February, followed two weeks later by
      apricot blossoms in mid-April, heralding peak spring. Hoopoes and woodlarks return simultaneously.
      Migratory bee-eaters hunt from early May through late August. Late spring brings burnt and military
      orchids, while autumn sees departing birds of passage. Rare Brillenschaf sheep graze the dry meadows of
      Dürnstein (Kuhberg and Kellerberg) and Setzberg in Spitz to halt shrub encroachment.
    visit: >-
      For floodplain woods, the finest excursion is the Pritzenau near Rossatz. The trail sets out from the
      sports ground car park, steps from the Danube Cycle Path, venturing into the alluvial forest along
      broad, flat paths. A wooden boardwalk spans a side arm, where patient walkers spot kingfishers, herons,
      and beavers.


      For panoramic hiking, the Welterbesteig Wachau spans 180 km, linking the 13 World Heritage
      municipalities along both riverbanks; Krems serves as an ideal base.
    history: >-
      Settlement in the Wachau dates deep into prehistory: the Venus of Willendorf was unearthed here, the
      oldest known artistic remnant of humanity in the valley. In Roman antiquity, the Danube formed the
      northern Imperial frontier (*Limes*), guarded by the legionary fortress Favianis at present-day Mautern.
      Medieval barons of the Kuenring family dominated the gorge from castles at Aggstein and Dürnstein.


      In the early nineteen-seventies, engineers designed a major hydroelectric dam at Rossatz. Resolute
      public opposition blocked the project, and in 1983 it was permanently cancelled, ensuring the Danube
      remained undammed here. In 2006, the side channel originally planned for the power canal was reconnected
      to the river for ecological restoration.


      The Wachau has been protected as a landscape reserve since 1955, was awarded the European Diploma of
      Protected Areas in 1994, and incorporates the Jauerling-Wachau Nature Park established in 1972. The LIFE
      Auenwildnis project revived backwaters and riparian woods: digging 43 breeding pools for Danube crested
      newts and yellow-bellied toads, and from the 600 surviving veteran native black poplars, over 5000 young
      trees have been planted. BirdLife erected five artificial nesting platforms for white-tailed eagles,
      sparking the first breeding attempts in nearly a century. Volunteers mow between 5 and 10 hectares of
      dry grasslands annually.
    before: Spring, with its orchard blossoms, and autumn are the finest seasons to visit.
    around: >-
      The atlas lists no immediate neighbors for Wachau. The [Elbe Sandstone River
      Corridor](/lugar/elbe-sandstone-river-corridor/) is a distant counterpart sharing eagle-owls, canyon
      topography, and free-flowing river corridor dynamics.
  fr:
    intro: >-
      Un fleuve butant contre un massif a deux choix : le contourner ou forcer le passage. Le Danube a forcé
      le passage. Sur environ 35 kilomètres entre Melk et Krems, il tranche la pointe méridionale du massif de
      Bohême pour encaisser une étroite gorge où le fond, vers 200 mètres, jouit d'un climat clément tandis
      que les collines culminant à 900 affrontent des hivers rigoureux. Ce contraste explique tout : terrasses
      de pierres sèches, pelouses steppiques, chênaies claires et un fleuve indompté. L'UNESCO a classé ce
      paysage culturel en 2000, englobant les abbayes de Melk et de Göttweig ainsi que le centre historique de
      Krems.
    landscape: >-
      Les plus hauts sommets sont le Jauerling avec 960 mètres et le Sandl avec 723. Les versants sont
      aménagés en terrasses de pierres sèches ; ces murets et les pelouses sèches associées constituent le
      cœur écologique de la Wachau.


      Le cours du Danube est l'autre acteur majeur. Étant une gorge de percée, elle n'offre pas de vastes
      plaines d'inondation : dans tout le périmètre du Patrimoine mondial ne subsistent que 239 hectares de
      forêt alluviale. Dès lors, chaque fragment compte, rendant cruciale la réactivation des bras
      secondaires.


      Les pelouses steppiques s'égrènent autour de Spitz, St. Michael, Dürnstein, Rossatz et Krems. La plus
      vaste à l'est de la vallée est le Höhereck, près de Dürnstein, qui abrite environ 200 espèces végétales
      et près de 100 espèces de papillons de jour. Sur les adrets prospèrent des chênaies thermophiles de
      chêne pubescent, un habitat rare et menacé en Europe, notamment vers la Teufelsmauer à Spitz.
    wildlife: >-
      Les murets de pierres sèches abritent le lézard vert, emblème de la Wachau, qui évolue entre 125 et 600
      mètres sur les adrets ensoleillés, tout comme la [couleuvre d'Esculape](/especie/elaphe_longissima/),
      l'un des plus grands serpents d'Europe atteignant jusqu'à 2 mètres et inoffensif pour l'homme. Dans les
      pelouses sèches vit la mante religieuse, encore commune ici quoique menacée en Basse-Autriche, ainsi que
      le souslik d'Europe (ziesel), un écureuil terrestre très menacé en Autriche qui conserve de denses
      colonies vers Krems et Mautern. Les observations de chat forestier se multiplient, carnivore jadis
      réputé éteint dans le pays.


      Plus haut sur les falaises nichent le [faucon pèlerin](/especie/falco_peregrinus/), la [cigogne
      noire](/especie/ciconia_nigra/), le [hibou grand-duc](/especie/bubo_bubo/), le martin-pêcheur et la
      huppe fasciée ; le guêpier d'Europe et le [pygargue à queue blanche](/especie/haliaeetus_albicilla/)
      sont des hôtes réguliers. Dans les vieilles forêts comme la Steinige Ries près de Rossatz vit le rare
      pic à dos blanc. La région figure parmi les 58 Zones importantes pour la conservation des oiseaux
      d'Autriche. Le fleuve rassemble plus de 50 espèces de poissons, dont le [huchon](/especie/hucho_hucho/)
      et le hotu, ainsi que le [castor d'Europe](/especie/castor_fiber/) et la [loutre
      d'Europe](/especie/lutra_lutra/).


      Le fil de l'année rythme les observations. Les amandiers fleurissent fin février, suivis deux semaines
      plus tard par la floraison des abricotiers vers la mi-avril, apogée printanier de la vallée.
      Réapparaissent alors huppe et alouette lulu. Les guêpiers se contemplent de début mai à fin août. En fin
      de printemps s'épanouissent des orchidées comme l'orchis brûlé et l'orchis guerrier, avant les départs
      d'automne. Des moutons de race Brillenschaf pâturent les pelouses sèches de Dürnstein (Kuhberg et
      Kellerberg) et du Setzberg à Spitz pour empêcher l'enfrichement.
    visit: >-
      Pour la ripisylve, la meilleure excursion est celle de la Pritzenau, près de Rossatz. Le sentier part du
      parking du stade, tout près de la véloroute du Danube, et pénètre dans la ripisylve par de larges allées
      plates. Une passerelle en bois franchit un bras du fleuve où vous pourrez apercevoir martins-pêcheurs,
      hérons et castors.


      Pour les marcheurs au long cours, le Welterbesteig Wachau s'étend sur 180 km reliant les 13 communes du
      Patrimoine mondial sur les deux rives ; Krems constitue un départ idéal.
    history: >-
      L'occupation humaine de la Wachau est immémoriale : c'est à Willendorf que fut découverte la Vénus de
      Willendorf, plus ancien vestige artistique de la vallée. À l'époque romaine, le Danube formait la
      frontière nord de l'Empire, surveillée par le camp de Favianis à l'actuelle Mautern. Au Moyen Âge
      régnait la lignée des Kuenring depuis les forteresses d'Aggstein et de Dürnstein.


      Au début des années soixante-dix, un projet de centrale hydroélectrique fut conçu à Rossatz. La
      mobilisation populaire fit échouer le chantier, définitivement abandonné en 1983, préservant la liberté
      du fleuve. En 2006, le bras prévu pour le canal a été reconnecté au lit vif à des fins écologiques.


      La Wachau est classée paysage protégé depuis 1955, titulaire du Diplôme européen des espaces protégés
      depuis 1994, et intègre depuis 1972 le parc naturel Jauerling-Wachau. Le programme LIFE Auenwildnis a
      réhabilité bras secondaires et forêts alluviales : il a creusé 43 mares de reproduction pour le triton
      crêté du Danube et le sonneur à ventre jaune, et à partir des 600 vieux peupliers noirs autochtones,
      plus de 5000 jeunes plants ont été réintroduits. BirdLife a fixé cinq plateformes pour le pygargue,
      suscitant les premières tentatives de reproduction en près d'un siècle. Des bénévoles fauchent chaque
      année entre 5 et 10 hectares de pelouses sèches.
    before: Le printemps avec la floraison des vergers et l'automne sont les saisons les plus favorables.
    around: >-
      L'atlas ne compte pas de voisins immédiats pour la Wachau. Le [Corredor Fluvial de las Areniscas del
      Elba](/lugar/elbe-sandstone-river-corridor/) est un sanctuaire lointain partageant le grand-duc, les
      reliefs de gorges et la dynamique fluviale libre.
  de:
    intro: >-
      Wenn ein Fluss auf ein Gebirgsmassiv trifft, hat er zwei Wege: ausweichen oder durchbrechen. Die Donau
      hat den Durchbruch gewählt. Auf rund 35 Kilometern zwischen Melk und Krems durchtrennt sie den Südrand
      der Böhmischen Masse und hinterlässt ein enges Tal, dessen Grund auf rund 200 Metern ein begünstigtes
      Weinklima genießt, während umliegende Höhen bis 900 Meter frostige Winter erleben. Dieser Kontrast prägt
      das Bild: Trockensteinmauern, Steppenrasen, lichte Flaumeichenwälder und eine frei strömende Donau. Die
      UNESCO erhob die Wachau im Jahr 2000 mitsamt den Stiften Melk und Göttweig sowie der Altstadt von Krems
      zum Weltkulturerbe.
    landscape: >-
      Die höchsten Erhebungen sind der Jauerling mit 960 Metern und der Sandl mit 723. Die Hänge sind
      terrassiert; die Trockensteinmauern bilden zusammen mit den Felssteppenrasen den charakteristischen
      Lebensraum der Wachau.


      Die Donau selbst ist die zweite Hauptkraft. Da es sich um ein Durchbruchstal handelt, fehlen ausgedehnte
      Auwälder: Im gesamten Welterbegebiet existieren nur noch 239 Hektar Weichholzau. Daher wiegt jeder Rest
      schwer und die Renaturierung von Nebenarmen ist unverzichtbar.


      Trockenrasen erstrecken sich bei Spitz, St. Michael, Dürnstein, Rossatz und Krems. Der größte im Ostteil
      ist das Höhereck bei Dürnstein mit rund 200 Pflanzenarten und beinahe 100 Tagfalterarten. An den
      sonnenexponierten Hängen stocken lichte Wälder der Flaumeiche – eine europaweit gefährdete Seltenheit,
      besonders ausgeprägt an der Teufelsmauer in Spitz.
    wildlife: >-
      Die Trockensteinmauern sind das Refugium der Smaragdeidechse, dem Wappentier der Wachau, die zwischen
      125 und 600 Metern an Wärmehängen lebt, ebenso wie die [Äskulapnatter](/especie/elaphe_longissima/),
      eine der größten Schlangen Europas mit bis zu 2 Metern Länge und völlig harmlos. In den Steppenrasen
      leben Gottesanbeterin und Ziesel, ein in Österreich stark bedrohtes Erdhörnchen mit stabilen Vorkommen
      bei Krems und Mautern. Zunehmend werden Wildkatzen nachgewiesen, die hierzulande lange als ausgestorben
      galten.


      Oben in Felsen und Hangwäldern brüten [Wanderfalke](/especie/falco_peregrinus/),
      [Schwarzstorch](/especie/ciconia_nigra/), [Uhu](/especie/bubo_bubo/), Eisvogel und Wiedehopf;
      Bienenfresser und [Seeadler](/especie/haliaeetus_albicilla/) sind regelmäßige Gäste. In Altholzbeständen
      wie der Steinigen Ries bei Rossatz lebt der seltene Weißrückenspecht. Die Region ist eines von 58
      Important Bird Areas in Österreich. Der Fluss birgt mehr als 50 Fischarten, darunter
      [Huchen](/especie/hucho_hucho/) und Nase, sowie [Europäischer Biber](/especie/castor_fiber/) und
      [Eurasischer Fischotter](/especie/lutra_lutra/).


      Das Jahr folgt festen Zyklen. Die Mandelblüte öffnet Ende Februar, gefolgt rund zwei Wochen später von
      der Marillenblüte Mitte April als Höhepunkt des Frühjahrs. Mit ihr kehren Wiedehopf und Heidelerche
      zurück. Bienenfresser lassen sich von Anfang Mai bis Ende August beobachten. Im Spätfrühling blühen
      Brand- und Helm-Knabenkraut, ehe im Herbst die Zugvögel abwandern. Brillenschafe beweiden die
      Trockenrasen von Dürnstein (Kuhberg und Kellerberg) und Setzberg in Spitz, um Verbuschung zu verhindern.
    visit: >-
      Für Auwaldwanderungen eignet sich die Pritzenau bei Rossatz ideal. Der Spaziergang beginnt am
      Sportplatzparkplatz nahe dem Donauradweg und führt auf flachen Wegen in die Au. Ein Holzsteg quert einen
      Donaualtarm mit Chancen auf Eisvogel, Reiher und Biber.


      Für Weitwanderer verbindet der Welterbesteig Wachau über 180 km die 13 Welterbegemeinden beiderseits des
      Stroms; Krems ist ein hervorragender Ausgangspunkt.
    history: >-
      Die Besiedlung begann früh: In Willendorf wurde die weltberühmte Venus von Willendorf geborgen. Zur
      Römerzeit bildete die Donau den nassen Limes, bewacht vom Kastell Favianis im heutigen Mautern. Im
      Mittelalter herrschten die Kuenringer von Burgen wie Aggstein und Dürnstein aus.


      Zu Beginn der siebziger Jahre war bei Rossatz ein Donau-Wasserkraftwerk geplant. Bürgerschaftlicher
      Widerstand stoppte das Vorhaben, das 1983 endgültig verworfen wurde – weshalb die Donau hier frei
      fließt. Im Jahr 2006 wurde der als Kraftwerkskanal vorgesehene Altarm wieder an den Hauptstrom
      angebunden.


      Seit 1955 ist die Wachau Landschaftsschutzgebiet, trägt seit 1994 das Europadiplom und umfasst seit 1972
      den Naturpark Jauerling-Wachau. Das Projekt LIFE Auenwildnis revitalisierte Seitenarme: Es schuf 43
      Laichgewässer für Donau-Kammmolch und Gelbbauchunke, und von den rund 600 autochthonen Schwarzpappeln
      wurden mehr als 5000 Jungbäume nachgezogen. BirdLife brachte fünf Seeadler-Nesthilfen an mit ersten
      Brutversuchen nach fast hundert Jahren. Ehrenamtliche mähen jährlich 5 bis 10 Hektar Trockenrasen.
    before: Der Frühling mit der Obstblüte und der Herbst bieten die schönsten Eindrücke.
    around: >-
      Der Atlas führt keine unmittelbaren Nachbargebiete zur Wachau. Der [Elbe Sandstone River
      Corridor](/lugar/elbe-sandstone-river-corridor/) ist ein entfernterer Stromabschnitt, der Uhu,
      Durchbruchstäler und freie Flussdynamik mit ihr teilt.
  it:
    intro: >-
      Un grande fiume che incontra un rilievo montuoso ha due alternative: aggirarlo o aprirsi un varco. Il
      Danubio ha forzato il passaggio. Per circa 35 chilometri tra Melk e Krems taglia la propaggine
      meridionale del Massiccio Boemo originando una stretta gola in cui il fondovalle, a circa 200 metri di
      quota, gode di un clima mite mentre i rilievi attorno, che salgono fino a 900 metri, affrontano inverni
      gelidi. Tale contrasto modella il paesaggio: terrazzamenti a secco, praterie steppiche, querceti radi e
      un fiume che scorre libero. L'UNESCO ha iscritto la Wachau come paesaggio culturale nel 2000,
      accogliendo le abbazie di Melk e Göttweig e il centro storico di Krems.
    landscape: >-
      Le vette dominanti sono lo Jauerling con 960 metri e il Sandl con 723. I pendii sono modellati da
      terrazze in pietra a secco; questi muretti e le contigue praterie steppiche formano il cardine ecologico
      della Wachau.


      Il Danubio è l'altro protagonista fondamentale. Essendo una gola di spaccatura fluviale, mancano vaste
      piane alluvionali: nell'intero comprensorio UNESCO rimangono appena 239 ettari di bosco ripariale. Per
      questo ogni residuo è prezioso e assume rilievo la riattivazione dei rami laterali.


      I prati steppici si distribuiscono attorno a Spitz, St. Michael, Dürnstein, Rossatz e Krems. Il più
      ampio del settore orientale è l'Höhereck presso Dürnstein, che vanta circa 200 specie botaniche e quasi
      100 farfalle diurne. Nelle stazioni più assolate allignano querceti radi di roverella, una rarità a
      rischio in tutta Europa, particolarmente visibile presso la Teufelsmauer a Spitz.
    wildlife: >-
      I muretti a secco offrono rifugio al ramarro occidentale, animale guida della Wachau, presente tra 125 e
      600 metri sui versanti caldi assieme al [Colubro di Esculapio](/especie/elaphe_longissima/), tra i
      maggiori serpenti d'Europa capace di raggiungere 2 metri di lunghezza e innocuo per l'uomo. Nei prati
      aridi vivono la mantide religiosa, ancora diffusa pur essendo minacciata nella regione, e il citello
      europeo (ziesel), roditore terricolo fortemente minacciato in Austria con colonie attive vicino a Krems
      e Mautern. Si moltiplicano gli avvistamenti di gatto selvatico europeo, ritenuto a lungo estinto nel
      paese.


      Sulle falesie nidificano il [Falco pellegrino](/especie/falco_peregrinus/), la [Cicogna
      nera](/especie/ciconia_nigra/), il [Gufo reale](/especie/bubo_bubo/), il martin pescatore e l'upupa; il
      gruccione e l'[Aquila di mare](/especie/haliaeetus_albicilla/) sono frequentatori regolari. Nei boschi
      maturi come la Steinige Ries presso Rossatz vive il raro picchio dorsobianco. L'area è una delle 58
      Important Bird Areas dell'Austria. Il corso d'acqua accoglie oltre 50 specie ittiche, tra cui il
      [Salmone del Danubio](/especie/hucho_hucho/) e la nasetta, oltre a [castoro
      europeo](/especie/castor_fiber/) e [Lontra europea](/especie/lutra_lutra/).


      Il ritmo stagionale è scandito dalla natura. I mandorli fioriscono a fine febbraio, seguiti due
      settimane dopo dalla fioritura dei peschi e albicocchi verso metà aprile, culmine primaverile della
      valle. Con essa ricompaiono upupa e tottavilla. I gruccioni si osservano da inizio maggio a fine agosto.
      A tarda primavera sbocciano orchidee come l'orchide bruciata e l'orchide militare, prima delle partenze
      autunnali. Le pecore di razza Brillenschaf pascolano i prati magri di Dürnstein (Kuhberg e Kellerberg) e
      del Setzberg a Spitz per contrastare l'avanzata degli arbusti.
    visit: >-
      Per esplorare il bosco ripariale il punto migliore è la Pritzenau a Rossatz. L'itinerario parte dal
      piazzale degli impianti sportivi, a breve distanza dalla ciclabile del Danubio, inoltrandosi nella
      pianura alluvionale su ampi viali pianeggianti. Una passerella in legno attraversa un braccio
      secondario, dove è possibile avvistare martin pescatore, aironi e castori.


      Per chi predilige il cammino a tappe, il Welterbesteig Wachau si articola su 180 km raccordando i 13
      comuni del Patrimonio Mondiale su entrambe le sponde; Krems è una comoda base logistica.
    history: >-
      La presenza umana nella Wachau affonda le radici nella preistoria: a Willendorf fu rinvenuta la celebre
      Venere di Willendorf, la più remota testimonianza artistica della valle. In età romana il Danubio
      segnava il Limes imperiale, presidiato dal forte Favianis presso l'odierna Mautern. Nel Medioevo
      dominarono i baroni Kuenring dai manieri di Aggstein e Dürnstein.


      All'inizio degli anni settanta fu avanzato il progetto di una diga idroelettrica a Rossatz. La ferma
      opposizione dei residenti arrestò l'opera, cancellata definitivamente nel 1983, salvaguardando il corso
      naturale del fiume. Nel 2006 il ramo laterale originariamente destinato al canale di scarico è stato
      ricollegato al Danubio con finalità ecologiche.


      La Wachau è paesaggio protetto dal 1955, fregiata del Diploma Europeo delle Aree Protette dal 1994, e
      comprende dal 1972 il parco naturale Jauerling-Wachau. Il progetto LIFE Auenwildnis ha risanato lanche e
      saliceti: ha scavato 43 stagni riproduttivi per il tritone crestato del Danubio e l'ululone dal ventre
      giallo, e dai 600 pioppi neri indigeni rimasti sono stati prodotti oltre 5000 giovani esemplari.
      BirdLife ha collocato cinque nidi artificiali per l'aquila di mare con i primi tentativi di
      nidificazione in quasi cent'anni. Gruppi di volontari sfalciano annualmente tra 5 e 10 ettari di
      prateria arida.
    before: La primavera con la fioritura e l'autunno dorato sono i periodi più gratificanti.
    around: >-
      L'atlas non include siti contigui alla Wachau. Il [Corredor Fluvial de las Areniscas del
      Elba](/lugar/elbe-sandstone-river-corridor/) rappresenta un corrispettivo fluviale lontano che condivide
      gufo reale, forre rocciose e ambienti di corridoio fluviale integro.
  pt:
    intro: >-
      Um grande rio que embate contra um maciço rochoso tem duas opções: contorná-lo ou rasgar passagem. O
      Danúbio rasgou passagem. Em cerca de 35 quilómetros entre Melk e Krems corta a ponta meridional do
      Maciço da Boémia, entalhando uma garganta onde o fundo, a cerca de 200 metros de altitude, usufrui de
      clima tépido enquanto os relevos circundantes atingem 900 metros e suportam invernos rigorosos. Este
      contraste forjou tudo: socalcos de pedra seca, pastagens estépicas, carvalhais abertos e um rio que
      corre desembaraçado. A UNESCO classificou a paisagem cultural em 2000, integrando as abadias de Melk e
      Göttweig e o centro histórico de Krems.
    landscape: >-
      As cotas cimeiras pertencem ao Jauerling com 960 metros e ao Sandl com 723. As encostas foram modeladas
      em socalcos agrícolas de pedra solta; estes muros secos e as pastagens áridas adjacentes são o coração
      biológico de Wachau.


      O Danúbio assume protagonismo determinante. Sendo um vale de cluse estreito, carece de grandes planícies
      de inundação: em toda a área classificada subsistem apenas 239 hectares de mata ripícola. Daí que cada
      reduto seja valioso e a recuperação de braços laterais ganhe peso crucial.


      As pastagens secas pontuam em redor de Spitz, St. Michael, Dürnstein, Rossatz e Krems. A maior da secção
      nascente é o Höhereck, junto a Dürnstein, albergando cerca de 200 espécies de plantas e quase 100
      espécies de borboletas diurnas. Nos sectores ensolarados medram carvalhais claros de carvalho-negral,
      uma raridade sob ameaça em toda a Europa, sobretudo perto da Teufelsmauer em Spitz.
    wildlife: >-
      Os muros de pedra seca servem de refúgio ao sardão-esmeralda, o emblema vivo de Wachau, ocorrendo entre
      os 125 e os 600 metros nas vertentes soalheiras, a par da
      [cobra-de-esculápio](/especie/elaphe_longissima/), uma das maiores serpentes da Europa com até 2 metros
      de comprimento e inofensiva. Nas clareiras aridas ocorrem o louva-a-deus, ainda comum aqui embora em
      declínio na Baixa Áustria, e o esquilo-terrestre-europeu (ziesel), roedor muito ameaçado na Áustria que
      conserva colónias vigorosas perto de Krems e Mautern. Multiplicam-se os avistamentos de gato-bravo,
      espécie dada como extinta no país durante décadas.


      Nas escarpas superiores nidificam o [falcão-peregrino](/especie/falco_peregrinus/), a
      [cegonha-preta](/especie/ciconia_nigra/), o [bufo-real](/especie/bubo_bubo/), o guarda-rios e a poupa; o
      abelharuco e a [águia-rabalva](/especie/haliaeetus_albicilla/) são visitantes assíduos. Nos bosques
      maduros como a Steinige Ries perto de Rossatz ocorre o raro pica-pau-de-dorso-branco. A região constitui
      uma das 58 Áreas Importantes para as Aves da Áustria. O rio sustenta mais de 50 espécies piscícolas,
      entre elas o [salmão-do-danúbio](/especie/hucho_hucho/) e a boga-do-danúbio, além de
      [castor-europeu](/especie/castor_fiber/) e [lontra-europeia](/especie/lutra_lutra/).


      O calendário orquestra-se em harmonia com as estações. As amendoeiras abrem flor no final de fevereiro,
      seguindo-se duas semanas depois a floração dos damasqueiros em meados de abril, ápice primaveril da
      região. Com ela regressam poupas e cotovias-arbóreas. Os abelharucos observam-se do início de maio ao
      fim de agosto. No fim da primavera desabrocham orquídeas raras, anunciando as partidas migratórias de
      outono. Ovelhas da raça Brillenschaf pastoreiam as pastagens secas de Dürnstein (Kuhberg e Kellerberg) e
      Setzberg em Spitz para travar a matagalização.
    visit: >-
      Para conhecer a floresta aluvial, o melhor trilho situa-se na Pritzenau, em Rossatz. O passeio inicia-se
      junto ao campo desportivo, a poucos passos da ciclovia do Danúbio, penetrando na mata ripícola por
      caminhos planos e desimpedidos. Um passadiço de madeira transpõe um braço secundário onde se avistam
      guarda-rios, garças e castores.


      Para caminhadas de longo curso, o Welterbesteig Wachau estende-se por 180 km conectando os 13 municípios
      do Património Mundial em ambas as margens; Krems constitui uma excelente base.
    history: >-
      A ocupação de Wachau é antiquíssima: em Willendorf foi descoberta a célebre Vénus de Willendorf, o mais
      antigo vestígio de arte humana do vale. No período romano o Danúbio delimitava o Limes do Império,
      guardado pelo forte Favianis na atual Mautern. Na Idade Média reinaram os Kuenring a partir dos castelos
      de Aggstein e Dürnstein.


      No início dos anos setenta foi desenhado um projeto hidroelétrico em Rossatz. A contestação cívica
      travou a obra, cancelada em definitivo em 1983, mantendo o Danúbio intocado. Em 2006 o canal previsto
      para o empreendimento foi reconectado ao leito vivo do rio para restauro ambiental.


      A Wachau está classificada como paisagem protegida desde 1955, detém o Diploma Europeu de Áreas
      Protegidas desde 1994 e integra desde 1972 o parque natural Jauerling-Wachau. O programa comunitário
      LIFE Auenwildnis regenerou braços fluviais: abriu 43 charcos reprodutores para o tritão-de-crista e o
      sapo-de-ventre-amarelo, e a partir dos 600 choupos-negros nativos plantaram-se mais de 5000 árvores
      jovens. A BirdLife instalou cinco plataformas de nidificação para a águia-rabalva, motivando as
      primeiras tentativas de reprodução em quase um século. Voluntários ceifam anualmente entre 5 e 10
      hectares de pastagens secas.
    before: A primavera, com a floração dos pomares, e o outono são os períodos ideais de visita.
    around: >-
      O atlas não assinala vizinhos diretos de Wachau. O [Corredor Fluvial de las Areniscas del
      Elba](/lugar/elbe-sandstone-river-corridor/) é uma referência remota que partilha o bufo-real,
      desfiladeiros fluviais e dinâmica fluvial livre.
