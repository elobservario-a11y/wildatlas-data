resumen:
  es: >-
    El feudo histórico principal y refugio salvador del lince ibérico (*Lynx pardinus*), albergando dehesas
    centenarias de encinas y alcornoques.
  en: >-
    The historical stronghold and ultimate sanctuary of the Iberian lynx (*Lynx pardinus*), home to
    centuries-old dehesas of holm and cork oaks.
  fr: >-
    Le fief historique et refuge sauveur du lynx pardelle (*Lynx pardinus*), abritant des dehesas séculaires
    de chênes verts et de chênes-lièges.
  de: >-
    Die historische Hochburg und rettende Zuflucht des Pardelluchses (*Lynx pardinus*) mit jahrhundertealten
    Dehesas aus Stein- und Korkeichen.
  it: >-
    La roccaforte storica e l'estremo rifugio della lince pardina (*Lynx pardinus*), custode di dehesas
    secolari di lecci e querce da sughero.
  pt: >-
    O feudo histórico principal e derradeiro refúgio do lince-ibérico (*Lynx pardinus*), abrigando montados
    seculares de azinheiras e sobreiros.
unico:
  es: >-
    Reúne la mayor población mundial de lince ibérico en las manchas de vegetación natural más extensas de
    Sierra Morena.
  en: >-
    Harbours the world's largest population of Iberian lynx within Sierra Morena's most extensive tracts of
    natural vegetation.
  fr: >-
    Rassemble la plus grande population mondiale de lynx pardelle au cœur des plus vastes étendues de
    végétation naturelle de Sierra Morena.
  de: >-
    Beherbergt die weltgrößte Population des Pardelluchses in den weitläufigsten Naturwäldern der gesamten
    Sierra Morena.
  it: >-
    Ospita la maggiore popolazione mondiale di lince pardina nelle più estese formazioni di vegetazione
    naturale della Sierra Morena.
  pt: >-
    Reúne a maior população mundial de lince-ibérico nas manchas de vegetação natural mais extensas da Sierra
    Morena.
observaciones:
  es: >-
    No molestes ni des comida a los animales, porque se altera su conducta, y no te salgas del camino
    señalizado. El silencio es parte de la visita: el ruido es otra forma de contaminación. Lleva el móvil con
    batería para llamar al 112, aunque no siempre hay cobertura.
texto:
  es:
    intro: >-
      Hay un lugar en el mundo donde el felino más amenazado del planeta cuenta con su mayor población: la
      Sierra de Andújar, en el noroeste de la provincia de Jaén. Es Sierra Morena en estado casi puro, un
      paisaje de lomas suaves con dehesas, monte mediterráneo y pinares, y el río Jándula cruzándolo. El
      [lince ibérico](/especie/lynx_pardinus/) es la estrella, pero aquí también tiene su principal reducto
      andaluz el [lobo](/especie/canis_lupus/).
    landscape: >-
      El parque es una muestra del paisaje alomado típico de Sierra Morena, y tiene tres caras. En el corazón,
      monte mediterráneo y dehesas. Al norte, sierras escarpadas. Al sur, densos pinares. Es un paisaje de
      media montaña que conserva las manchas de vegetación natural más extensas de toda la sierra, y en el que
      los encinares son los más grandes de Sierra Morena.


      Mandan la encina y el alcornoque, en forma de dehesa, y en las altitudes mayores y más húmedas aparece
      el quejigo. Entre ellos asoman unas formas redondeadas de granito que en la zona llaman bolos, y que los
      dueños de las fincas aprovechan, entre otros usos, como abrevaderos para el ganado. Junto al agua el
      paisaje cambia: el Jándula forma un corredor verde de bosque en galería, con sauces, fresnos, alisos,
      tamujos y adelfas, que contrasta con el monte mediterráneo que lo rodea. Con el Yeguas, forma los
      corredores de ribera del parque.
    wildlife: >-
      La lista de animales es el mayor reclamo del parque. Además del lince, que cuenta aquí con la mayor
      población del mundo, y del lobo, hay [águila imperial ibérica](/especie/aquila_adalberti/), [águila
      real](/especie/aquila_chrysaetos/) y [buitre negro](/especie/aegypius_monachus/). Algunas de estas
      grandes rapaces son fáciles de avistar desde el sendero Jabalí-Encinarejo. También viven ciervos rojos,
      gamos, muflones y jabalíes, mangostas, [gatos monteses](/especie/felis_silvestris/) y
      [nutrias](/especie/lutra_lutra/).


      Mira también al agua. En el Jándula se ven martines pescadores, ánades reales, garzas reales,
      zampullines chicos y cormoranes grandes, y la nutria encuentra refugio en el río. A lo largo de su
      recorrido hay observatorios de aves, en Doña Rosa y Los Lastrones. Los mamíferos, en cambio, se
      esconden: ciervos, jabalíes, zorros y garduñas son difíciles de ver, pero en el sendero Junquillo sus
      rastros aparecen con cierta facilidad.
    visit: >-
      Empieza por el centro de visitantes Viñas de Peñallana, a la entrada del parque, en el kilómetro 13 de
      la carretera que une Andújar con el santuario de la Virgen de la Cabeza. Es una primera aproximación a
      los ambientes y a los seres vivos del parque: puedes palpar su morfología, pasear por un bosque
      mediterráneo recreado, ver reproducido el cubil del lobo ibérico y seguir los rastros del lince para
      entender su hábitat, su comportamiento y la amenaza que lo hace el felino más amenazado del planeta.


      Después, a pie. El sendero Junquillo es un camino fácil de 5.684 metros de ida, con unas dos horas de
      duración y dificultad baja. Atraviesa dehesas casi llanas y manchas de monte mediterráneo, con aves
      fáciles de ver, y deja ver cómo las fincas contribuyen a la diversidad: el paisaje cambia de una finca a
      otra. Empieza en un cruce de la A-6178 señalizado hacia Valdelagrana y Las Tapias, a unos diecinueve
      kilómetros del santuario. El sendero Jabalí-Encinarejo termina en el embalse del Encinarejo, y un paseo
      junto al Jándula bajo el bosque en galería completa el entorno. El sendero de ribera sigue el curso del
      río por el interior del parque.
    history: >-
      El parque ha sido refugio de especies amenazadas, y el lince es la prueba: la Sierra de Andújar mantiene
      una de las mejores poblaciones viables y ha apoyado el programa peninsular de conservación de la
      especie. Es, además, la principal reserva del lince ibérico, una especie en peligro de extinción.


      El paisaje guarda también memoria humana. En pleno corazón del parque se alza el santuario de la Virgen
      de la Cabeza, donde cada año se celebra la romería de la patrona de los monteros. En Baños de la Encina
      está el castillo de Burgalimar, uno de los más antiguos de Europa, y en Andújar, el puente romano.
    before: >-
      No molestes ni des comida a los animales, porque se altera su conducta, y no te salgas del camino
      señalizado. El silencio es parte de la visita: el ruido es otra forma de contaminación. Lleva el móvil
      con batería para llamar al 112, aunque no siempre hay cobertura.
    around: >-
      A unos 2 km queda el [Parque Natural de Sierra Madrona y Valle de
      Alcudia](/lugar/parque-natural-de-sierra-madrona-y-valle-de-alcudia/), y a diecinueve kilómetros,
      [Sierra Morena Oriental - Despeñaperros](/lugar/sierra-morena-oriental---despenaperros/). Más lejos, el
      [Parque Nacional de Cabañeros](/lugar/parque-nacional-de-cabaneros/) y la [ZEC Montes de
      Toledo](/lugar/zec-montes-de-toledo/) comparten con Andújar el lince ibérico, el águila imperial y el
      buitre negro, y la [Reserva Natural da Serra da Malcata](/lugar/reserva-natural-da-serra-da-malcata/)
      comparte el lince y el buitre negro.
  en:
    intro: >-
      There is a place on earth where the planet's most endangered feline thrives in its largest population:
      the Sierra de Andújar, in north-western Jaén province. It represents Sierra Morena in almost untouched
      condition, a landscape of gentle rolling hills dotted with dehesas, Mediterranean scrub and pine woods,
      traversed by the Jándula River. The [Iberian lynx](/especie/lynx_pardinus/) is the star resident, though
      this range also protects Andalusia's main redoubt of the [grey wolf](/especie/canis_lupus/).
    landscape: >-
      The park is an exemplary display of the rolling hillscape typical of Sierra Morena, showing three
      distinct facets. At its heart lie Mediterranean woodlands and open dehesas. To the north rise rugged
      mountain ridges. To the south spread dense pine forests. It forms a mid-mountain expanse preserving the
      largest uninterrupted patches of natural vegetation across the entire range, where the holm oak
      woodlands are the most expansive in Sierra Morena.


      Holm oaks and cork oaks reign in classic dehesa wood-pastures, with gall oaks appearing at higher, more
      humid elevations. Among them emerge massive rounded granite boulders known locally as bolos, which
      landowners have historically adapted as drinking troughs for livestock. Down by the water the scenery
      transforms: the Jándula River forms a verdant gallery forest corridor of willows, ashes, alders, tamujo
      shrubs and oleanders, offering a sharp contrast to the surrounding Mediterranean scrub. Together with
      the Yeguas River, it forms the park's primary riparian arteries.
    wildlife: >-
      The fauna is the park's primary allure. Besides the lynx, which boasts its highest numbers on Earth
      here, and the wolf, the skies are patrolled by the [Spanish imperial eagle](/especie/aquila_adalberti/),
      [golden eagle](/especie/aquila_chrysaetos/) and [cinereous vulture](/especie/aegypius_monachus/). Some
      of these great raptors can be readily spotted along the Jabalí-Encinarejo trail. Red deer, fallow deer,
      mouflons, wild boars, Egyptian mongooses, [European wildcats](/especie/felis_silvestris/) and [Eurasian
      otters](/especie/lutra_lutra/) also thrive.


      Look towards the rivers as well. Along the Jándula you can sight kingfishers, mallards, grey herons,
      little grebes and great cormorants, with otters finding refuge in the current. Dedicated bird
      observatories stand at Doña Rosa and Los Lastrones. Mammals are shyer: deer, wild boars, red foxes and
      stone martens conceal themselves, but along the Junquillo trail their tracks appear with dependable
      regularity.
    visit: >-
      Begin at the Viñas de Peñallana visitor centre, situated at the entrance to the park at kilometre 13 of
      the road linking Andújar with the sanctuary of the Virgen de la Cabeza. It provides an engaging
      introduction to the park's ecosystems: you can touch tactile models, walk through a reconstructed
      Mediterranean woodland, view a replica Iberian wolf den and examine lynx tracks to understand their
      habitat, behaviour and the threats facing the most endangered cat on the planet.


      Then, explore on foot. The Junquillo trail is an easy one-way walk of 5,684 metres, taking about two
      hours with low difficulty. It traverses nearly flat dehesas and pockets of Mediterranean scrub where
      birds are easily spotted, illustrating how private estates contribute to biodiversity as scenery changes
      between properties. It begins at a signposted junction on the A-6178 heading towards Valdelagrana and
      Las Tapias, about nineteen kilometres from the sanctuary. The Jabalí-Encinarejo trail finishes at the
      Encinarejo reservoir, where a stroll alongside the Jándula under riverine forest rounds off the
      excursion. The riverside path traces the waterway deeper into the park.
    history: >-
      The park has served as a sanctuary for endangered fauna, proven by the lynx: Sierra de Andújar
      maintained one of the few viable breeding stocks and supported the wider peninsular conservation
      strategy. It remains the paramount stronghold of the Iberian lynx, an endangered species.


      The terrain also preserves human memory. In the very heart of the mountains rises the sanctuary of the
      Virgen de la Cabeza, where the annual pilgrimage of the patroness of hunters takes place. In Baños de la
      Encina stands Burgalimar Castle, one of the oldest in Europe, while Andújar retains its Roman bridge.
    before: >-
      Never disturb or feed the wildlife, as it alters natural behaviour, and keep strictly to marked
      pathways. Silence is essential: noise is another form of pollution. Keep your mobile phone charged to
      dial 112, though signal is not guaranteed everywhere.
    around: >-
      About 2 km away lies [Sierra Madrona and Valle de Alcudia Natural
      Park](/lugar/parque-natural-de-sierra-madrona-y-valle-de-alcudia/), and nineteen kilometres away is
      [Sierra Morena Oriental - Despeñaperros](/lugar/sierra-morena-oriental---despenaperros/). Further off,
      [Cabañeros National Park](/lugar/parque-nacional-de-cabaneros/) and the [Montes de Toledo
      SAC](/lugar/zec-montes-de-toledo/) share with Andújar the Iberian lynx, imperial eagle and cinereous
      vulture, while [Serra da Malcata Natural Reserve](/lugar/reserva-natural-da-serra-da-malcata/) shares
      the lynx and cinereous vulture.
  fr:
    intro: >-
      Il existe sur terre un endroit où le félin le plus menacé de la planète possède sa plus grande
      population : la Sierra de Andújar, dans le nord-ouest de la province de Jaén. C'est la Sierra Morena à
      l'état presque pur, ondulant en collines douces occupées par des dehesas, des maquis méditerranéens et
      des pinèdes, traversée par le río Jándula. Le [lynx pardelle](/especie/lynx_pardinus/) en est l'emblème
      suprême, mais le massif abrite également le principal refuge andalou du [loup](/especie/canis_lupus/).
    landscape: >-
      Le parc offre un modèle parfait des paysages ondulés caractéristiques de la Sierra Morena, dévoilant
      trois visages. Au centre, maquis méditerranéen et dehesas. Au nord, crêtes escarpées. Au sud, épaisses
      pinèdes. Cet espace de moyenne montagne conserve les massifs de végétation naturelle les plus continus
      de toute la chaîne, où les yeuseraies sont les plus vastes de Sierra Morena.


      Le chêne vert et le chêne-liège dominent sous forme de dehesas pastorales, cédant la place au chêne
      faginé sur les hauteurs plus humides. Entre les arbres émergent de gros blocs granitiques arrondis,
      appelés localement bolos, souvent aménagés en abreuvoirs par les éleveurs. Au bord de l'eau, le décor
      change : le Jándula trace un corridor de ripisylve fraîche plantée de saules, frênes, aulnes, tamujos et
      lauriers-roses, tranchant vivement avec le maquis environnant. Avec le río Yeguas, il constitue l'épine
      dorsale des corridors fluviaux du parc.
    wildlife: >-
      La richesse faunique est le grand attrait du parc. Outre le lynx, fort de ses effectifs records
      mondiaux, et le loup, le ciel accueille l'[aigle ibérique](/especie/aquila_adalberti/), l'[aigle
      royal](/especie/aquila_chrysaetos/) et le [vautour moine](/especie/aegypius_monachus/). Plusieurs de ces
      grands rapaces s'observent facilement le long du sentier Jabalí-Encinarejo. Cerfs élaphes, daims,
      mouflons, sangliers, mangoustes ichneumons, [chats sauvages](/especie/felis_silvestris/) et [loutres
      d'Europe](/especie/lutra_lutra/) y prospèrent également.


      Scrutez aussi les cours d'eau. Sur le Jándula se croisent martins-pêcheurs, canards colverts, hérons
      cendrés, grèbes castagneux et grands cormorans, la loutre trouvant refuge dans la rivière. Des
      observatoires ornithologiques ont été aménagés à Doña Rosa et Los Lastrones. Les mammifères restent plus
      discrets : cerfs, sangliers, renards et fouines se cachent, mais sur le sentier Junquillo leurs
      empreintes sont courantes.
    visit: >-
      Commencez par le centre de visiteurs de Viñas de Peñallana, à l'entrée du parc, au kilomètre 13 de la
      route reliant Andújar au sanctuaire de la Virgen de la Cabeza. Il offre une excellente initiation aux
      biotopes du parc : découverte tactile de la géomorphologie, promenade dans une forêt méditerranéenne
      reconstituée, tanière reconstituée du loup ibérique et moulages d'empreintes de lynx pour comprendre son
      mode de vie et les menaces pesant sur le félin le plus vulnérable au monde.


      Poursuivez à pied. Le sentier Junquillo est un chemin aisé de 5 684 mètres aller, durant environ deux
      heures avec une faible difficulté. Il traverse des dehesas planes et des taches de maquis où les oiseaux
      se laissent aisément contempler, montrant l'apport des grands domaines privés à la biodiversité locale.
      Il commence à un carrefour de l'A-6178 fléché vers Valdelagrana et Las Tapias, à environ dix-neuf
      kilomètres du sanctuaire. Le sentier Jabalí-Encinarejo débouche sur la retenue d'Encinarejo, où une
      marche ombragée le long du Jándula complète la sortie. Le sentier de rive longe le cours d'eau au cœur
      du parc.
    history: >-
      Le parc s'est érigé en sanctuaire des espèces menacées, comme en atteste le lynx : la Sierra de Andújar
      a conservé des noyaux reproducteurs viables indispensables au programme de réintroduction ibérique. Elle
      constitue aujourd'hui le sanctuaire majeur du lynx pardelle, espèce en danger critique d'extinction.


      Le massif garde aussi la mémoire des hommes. En plein cœur du parc se dresse le sanctuaire de la Virgen
      de la Cabeza, théâtre du pèlerinage annuel de la sainte patronne des chasseurs. À Baños de la Encina se
      dresse le château de Burgalimar, parmi les plus anciens d'Europe, et à Andújar subsiste le pont romain.
    before: >-
      Ne dérangez pas et ne nourrissez jamais les animaux sauvages, car vous perturbez leur comportement, et
      ne quittez sous aucun prétexte le sentier balisé. Le silence fait partie du respect des lieux : le bruit
      est une nuisance environnementale. Gardez votre portable chargé pour joindre le 112, même si le réseau
      n'est pas continu.
    around: >-
      À environ 2 km s'étend le [Parque Natural de Sierra Madrona y Valle de
      Alcudia](/lugar/parque-natural-de-sierra-madrona-y-valle-de-alcudia/), et à dix-neuf kilomètres [Sierra
      Morena Oriental - Despeñaperros](/lugar/sierra-morena-oriental---despenaperros/). Plus loin, le [Parc
      national de Cabañeros](/lugar/parque-nacional-de-cabaneros/) et la [ZEC Montes de
      Toledo](/lugar/zec-montes-de-toledo/) partagent avec Andújar lynx pardelle, aigle ibérique et vautour
      moine, tandis que la [Reserva Natural da Serra da Malcata](/lugar/reserva-natural-da-serra-da-malcata/)
      abrite le lynx et le vautour moine.
  de:
    intro: >-
      Es gibt einen Ort auf der Erde, an dem die am stärksten bedrohte Katzenart unseres Planeten ihre größte
      Population zählt: die Sierra de Andújar im Nordwesten der Provinz Jaén. Sie verkörpert die Sierra Morena
      in fast unberührter Ursprünglichkeit – sanft geschwungene Hügel mit Dehesas, Macchia und Kiefernwäldern,
      durchströmt vom Río Jándula. Der [Pardelluchs](/especie/lynx_pardinus/) ist das Symbol des Parks, doch
      hier liegt auch der wichtigste andalusische Rückzugsort für den [Wolf](/especie/canis_lupus/).
    landscape: >-
      Der Park veranschaulicht idealtypisch die hügelige Waldlandschaft der Sierra Morena und zeigt drei
      Gesichter. Im Zentrum dominieren mediterrane Macchia und Dehesas. Im Norden erheben sich schroffe
      Gebirgszüge. Im Süden dehnen sich dichte Kiefernforste aus. Es handelt sich um eine
      Mittelgebirgslandschaft mit den geschlossensten Naturvegetationsflächen der gesamten Gebirgskette, wobei
      die Steineichenwälder die größten der Sierra Morena sind.


      Steineiche und Korkeiche prägen als beweidete Dehesa das Bild, während in höheren, feuchteren Lagen die
      Portugiesische Eiche hinzutritt. Zwischen den Bäumen ragen mächtige rundliche Granitfelsen hervor, die
      man hier Bolos nennt und die traditionell als Viehtränken genutzt werden. Am Wasser wandelt sich das
      Bild: Der Jándula bildet ein grünes Band aus Galeriewäldern mit Weiden, Eschen, Erlen, Tamujos und
      Oleander, das scharf mit der umgebenden Trockenvegetation kontrastiert. Zusammen mit dem Yeguas formt er
      die Uferkorridore des Parks.
    wildlife: >-
      Der Tierreichtum ist das herausragende Merkmal des Parks. Neben dem Luchs, der hier weltweit am
      häufigsten vorkommt, und dem Wolf leben hier [Spanischer Kaiseradler](/especie/aquila_adalberti/),
      [Steinadler](/especie/aquila_chrysaetos/) und [Mönchsgeier](/especie/aegypius_monachus/). Mehrere dieser
      Großgreifvögel lassen sich entlang des Wanderwegs Jabalí-Encinarejo gut erspähen. Rothirsche,
      Damhirsche, Mufflons, Wildschweine, Ichneumons, [Wildkatzen](/especie/felis_silvestris/) und
      [Fischotter](/especie/lutra_lutra/) bevölkern die Hänge.


      Ein Blick auf die Flussläufe lohnt sich ebenfalls. Am Jándula sind Eisvögel, Stockenten, Graureiher,
      Zwergtaucher und Kormorane heimisch, während der Fischotter Nahrung und Unterschlupf findet. Feste
      Vogelbeobachtungspunkte gibt es in Doña Rosa und Los Lastrones. Die Säugetiere zeigen sich scheuer:
      Hirsche, Wildschweine, Füchse und Steinmarder leben im Verborgenen, doch auf dem Weg Junquillo stößt man
      rasch auf ihre Spuren.
    visit: >-
      Beginne im Besucherzentrum Viñas de Peñallana am Parkeingang bei Kilometer 13 der Straße, die Andújar
      mit dem Heiligtum der Virgen de la Cabeza verbindet. Es bietet einen lebendigen Einstieg in die
      Lebensräume des Parks: Du kannst die Geländemorphologie ertasten, einen nachgebildeten Mittelmeerwald
      durchwandern, einen Wolfsbau erkunden und Trittsiegeln des Luchses folgen, um Lebensweise und
      Schutzstatus der seltensten Katze der Erde zu verstehen.


      Danach geht es zu Fuß weiter. Der Pfad Junquillo ist eine einfache Wanderung von 5.684 Metern einfacher
      Länge, die rund zwei Stunden dauert und geringe Anforderungen stellt. Er führt durch ebene Dehesas und
      Macchia-Inseln mit reicher Vogelwelt und zeigt, wie Großgrundbesitz zur Landschaftsvielfalt beiträgt. Er
      startet an einer Kreuzung der A-6178 mit Wegweisern nach Valdelagrana und Las Tapias, etwa neunzehn
      Kilometer vor dem Heiligtum. Der Weg Jabalí-Encinarejo endet am Stausee Encinarejo, wo ein Spaziergang
      am Jándula unter Ufergehölzen die Tour abrundet. Der Uferweg folgt dem Flusslauf tiefer in den Park
      hinein.
    history: >-
      Der Park hat sich als Arche Noah für bedrohte Tierarten erwiesen, was der Luchs belegt: Die Sierra de
      Andújar bewahrte vitale Bestände und trug maßgeblich zum spanienweiten Zucht- und Schutzprogramm bei.
      Sie bildet das weltweite Kernreservat des stark gefährdeten Pardelluchses.


      Auch menschliche Kulturgeschichte spiegelt sich im Park wider. Im Herzen des Massivs thront das
      Heiligtum der Virgen de la Cabeza, alljährlicher Schauplatz der Wallfahrt der Schutzpatronin der Jäger.
      In Baños de la Encina steht die Burg Burgalimar, eine der ältesten Festungen Europas, während in Andújar
      eine römische Brücke erhalten ist.
    before: >-
      Störe und füttere keine Wildtiere, da dies ihr natürliches Verhalten beeinträchtigt, und verlasse nicht
      die ausgeschilderten Pfade. Stille gehört zum Naturerlebnis: Lärm ist eine Form von Umweltbelastung.
      Führe ein geladenes Mobiltelefon mit, um den Notruf 112 zu erreichen, auch wenn nicht überall
      Netzempfang besteht.
    around: >-
      Rund 2 km entfernt liegt der [Parque Natural de Sierra Madrona y Valle de
      Alcudia](/lugar/parque-natural-de-sierra-madrona-y-valle-de-alcudia/) und neunzehn Kilometer entfernt
      [Sierra Morena Oriental - Despeñaperros](/lugar/sierra-morena-oriental---despenaperros/). Weiter
      entfernt teilen der [Parque Nacional de Cabañeros](/lugar/parque-nacional-de-cabaneros/) und das [ZEC
      Montes de Toledo](/lugar/zec-montes-de-toledo/) Pardelluchs, Kaiseradler und Mönchsgeier mit Andújar,
      während die [Reserva Natural da Serra da Malcata](/lugar/reserva-natural-da-serra-da-malcata/) Luchs und
      Mönchsgeier schützt.
  it:
    intro: >-
      C'è un angolo di mondo in cui il felino più minacciato del pianeta conta la sua popolazione più
      consistente: la Sierra de Andújar, nel nord-ovest della provincia di Jaén. Rappresenta la Sierra Morena
      in forma quasi incontaminata, un paesaggio di dolci rilievi con dehesas, macchia mediterranea e pinete,
      solcato dal fiume Jándula. La [lince pardina](/especie/lynx_pardinus/) è l'autentica protagonista, ma il
      territorio costituisce anche il rifugio andaluso cardine per il [lupo grigio](/especie/canis_lupus/).
    landscape: >-
      Il parco incarna alla perfezione la morfologia collinare della Sierra Morena, articolandosi in tre
      fisionomie distinte. Nel cuore, boscaglie mediterranee e pascoli alberati. A nord, creste montuose
      scoscese. A sud, fitte pinete. È un territorio di media quota che conserva i lembi di vegetazione
      naturale più estesi dell'intera cordigliera, dove le leccete toccano le dimensioni massime di Sierra
      Morena.


      Leccio e quercia da sughero regnano in forma di dehesa pascolata, sostituiti dalla roverella nelle zone
      più elevate e umide. Tra gli alberi affiorano caratteristici ammassi tondeggianti di granito detti
      bolos, storicamente sfruttati dai proprietari come abbeveratoi per il bestiame. Presso l'acqua
      l'orizzonte muta: lo Jándula forma una galleria fluviale rigogliosa di salici, frassini, ontani, tamujos
      e oleandri che contrasta con la macchia circostante. Insieme allo Yeguas, garantisce le direttrici
      ripariali del parco.
    wildlife: >-
      La fauna rappresenta l'attrattiva più celebre del parco. Oltre alla lince, che vanta qui il primato
      numerico mondiale, e al lupo, i cieli sono solcati da [aquila imperiale
      iberica](/especie/aquila_adalberti/), [aquila reale](/especie/aquila_chrysaetos/) e [avvoltoio
      monaco](/especie/aegypius_monachus/). Diversi di questi grandi rapaci si avvistano con facilità dal
      sentiero Jabalí-Encinarejo. Cervi rossi, daini, mufloni, cinghiali, manguste, [gatti
      selvatici](/especie/felis_silvestris/) e [lontre europee](/especie/lutra_lutra/) vivono numerosi.


      Osserva anche i corsi d'acqua. Lungo lo Jándula dimorano martin pescatori, germani reali, aironi
      cenerini, tuffetti e cormorani, mentre la lontra trova rifugio tra le correnti. Capanni di avvistamento
      ornitologico sorgono a Doña Rosa e Los Lastrones. I mammiferi sono più discreti: cervi, cinghiali, volpi
      e faine si nascondono, ma lungo il percorso Junquillo le loro tracce sono assai frequenti.
    visit: >-
      Inizia dal centro visitatori di Viñas de Peñallana, all'ingresso del parco, al chilometro 13 della
      strada che congiunge Andújar al santuario della Virgen de la Cabeza. Permette di accostarsi agli
      ecosistemi del parco: puoi toccare plastici morfologici, percorrere una lecceta ricostruita, osservare
      la tana del lupo iberico e seguire le orme della lince per comprenderne abitudini, biologia e le minacce
      che gravano sul felino più a rischio al mondo.


      Poi prosegui a piedi. Il sentiero Junquillo è un cammino accessibile di 5.684 metri di sola andata,
      della durata di due ore circa a bassa difficoltà. Si snoda tra dehesas pianeggianti e macchia fitta con
      uccelli facili da scorgere, mostrando come i grandi latifondi favoriscano la varietà paesaggistica. Ha
      inizio a un bivio della A-6178 con indicazioni per Valdelagrana e Las Tapias, a circa diciannove
      chilometri dal santuario. Il tracciato Jabalí-Encinarejo termina presso l'invaso di Encinarejo, dove una
      passeggiata fluviale tra gli ontani dello Jándula chiude l'anello. Il sentiero rivierasco segue il corso
      d'acqua nel cuore dell'area protetta.
    history: >-
      Il parco ha costituito un rifugio salvifico per specie sull'orlo dell'estinzione, come conferma la
      lince: la Sierra de Andújar ha preservato popolazioni riproduttive sane, decisive per il piano di
      recupero della penisola. Rimane la riserva cardine della lince pardina, specie gravemente minacciata.


      Il paesaggio serba anche memorie storiche. Nel cuore della sierra si innalza il santuario della Virgen
      de la Cabeza, meta dell'annuale pellegrinaggio della patrona dei cacciatori. A Baños de la Encina sorge
      il castello di Burgalimar, tra i più vetusti d'Europa, mentre ad Andújar troneggia il ponte romano.
    before: >-
      Non disturbare e non offrire cibo agli animali selvatici per non alterarne i comportamenti, e non
      abbandonare i percorsi tracciati. Il silenzio è parte integrante dell'esperienza: il frastuono è una
      forma di inquinamento. Porta il telefono carico per contattare il 112, benché il segnale non sia
      garantito ovunque.
    around: >-
      A circa 2 km sorge il [Parque Natural de Sierra Madrona y Valle de
      Alcudia](/lugar/parque-natural-de-sierra-madrona-y-valle-de-alcudia/), e a diciannove chilometri la
      [Sierra Morena Oriental - Despeñaperros](/lugar/sierra-morena-oriental---despenaperros/). Più lontano,
      il [Parque Nacional de Cabañeros](/lugar/parque-nacional-de-cabaneros/) e la [ZEC Montes de
      Toledo](/lugar/zec-montes-de-toledo/) condividono con Andújar lince pardina, aquila imperiale e
      avvoltoio monaco, mentre la [Reserva Natural da Serra da
      Malcata](/lugar/reserva-natural-da-serra-da-malcata/) protegge lince e avvoltoio monaco.
  pt:
    intro: >-
      Há um lugar no mundo onde o felino mais ameaçado do planeta conta com a sua maior população: a Sierra de
      Andújar, no noroeste da província de Jaén. É a Sierra Morena em estado quase intocado, uma paisagem de
      colinas suaves com montados, matagais mediterrânicos e pinhais, sulcada pelo rio Jándula. O
      [lince-ibérico](/especie/lynx_pardinus/) é a grande estrela, mas aqui resiste também o principal reduto
      andaluz do [lobo-cinzento](/especie/canis_lupus/).
    landscape: >-
      O parque é um mostruário do relevo ondulado característico da Sierra Morena, exibindo três feições. No
      centro, mato mediterrânico e montados. A norte, serranias escarpadas. A sul, densos pinhais. Trata-se de
      uma paisagem de média montanha que guarda as manchas florestais mais contínuas de toda a cordilheira,
      onde os azinhais são os mais extensos da Sierra Morena.


      A azinheira e o sobreiro dominam em regime de montado tradicional, surgindo o carvalho-cerquinho nas
      cotas mais elevadas e húmidas. Por entre as copas despontam grandes blocos arredondados de granito
      chamados bolos, que os lavradores aproveitam tradicionalmente como bebedouros para o gado. Junto à água
      o cenário muda: o Jándula molda uma galeria ripícola de salgueiros, freixos, amieiros, tamujos e
      loendros que contrasta com o mato circundante. Com o rio Yeguas, desenha os corredores fluviais do
      parque.
    wildlife: >-
      O rol zoológico constitui o maior chamariz do parque. Além do lince, com a maior densidade planetária, e
      do lobo, cruzam os ares a [águia-imperial-ibérica](/especie/aquila_adalberti/), a
      [águia-real](/especie/aquila_chrysaetos/) e o [abutre-preto](/especie/aegypius_monachus/). Várias destas
      grandes rapinas avistam-se com facilidade a partir do trilho Jabalí-Encinarejo. Veados-vermelhos, gamos,
      muflões, javalis, saca-rabos, [gatos-bravos](/especie/felis_silvestris/) e
      [lontras-europeias](/especie/lutra_lutra/) habitam a serra.


      Repara igualmente na água. No Jándula surgem guarda-rios, patos-reais, garças-reais, mergulhões-pequenos
      e corvos-marinhos, enquanto a lontra encontra abrigo seguro. Ao longo do seu traçado existem
      observatórios de aves em Doña Rosa e Los Lastrones. Os mamíferos ocultam-se: veados, javalis, raposas e
      fuinhas são esquivos, mas no caminho Junquillo as suas pegadas revelam-se facilmente.
    visit: >-
      Começa pelo centro de acolhimento de Viñas de Peñallana, à entrada do parque, no quilómetro 13 da
      estrada que liga Andújar ao santuário da Virgen de la Cabeza. Proporciona uma primeira aproximação aos
      biomas do parque: podes tocar em maquetas do relevo, caminhar por um bosque mediterrânico recriado,
      contemplar a reprodução do covil do lobo-ibérico e examinar rastos de lince para apreender o seu
      comportamento e as ameaças ao felino mais vulnerável do planeta.


      Depois, prossegue a pé. O trilho Junquillo é um percurso acessível de 5.684 metros só de ida, com cerca
      de duas horas de marcha e baixa dificuldade. Atravessa montados planos e manchas de matagal com aves
      fáceis de observar, mostrando como as herdades privadas fomentam a biodiversidade. Principia num
      cruzamento da A-6178 sinalizado para Valdelagrana e Las Tapias, a cerca de dezanove quilómetros do
      santuario. O percurso Jabalí-Encinarejo termina na albufeira do Encinarejo, completando-se com um
      passeio ribeirinho sob a galeria arbórea do Jándula. O trilho de margem segue o curso do rio pelo
      coração do parque.
    history: >-
      O parque funcionou como tábua de salvação para espécies em declínio, como comprova o lince: a Sierra de
      Andújar conservou populações viáveis indispensáveis ao programa ibérico de recuperação da espécie.
      Representa o baluarte mundial do lince-ibérico, espécie em perigo de extinção.


      A paisagem conserva também pegadas humanas. No coração da serra ergue-se o santuário da Virgen de la
      Cabeza, onde decorre anualmente a romaria da padroeira dos caçadores. Em Baños de la Encina localiza-se
      o castelo de Burgalimar, dos mais antigos da Europa, e em Andújar destaca-se a ponte romana.
    before: >-
      Não perturbes nem alimentes os animais selvagens, pois alteras os seus hábitos naturais, e não saias dos
      caminhos demarcados. O silêncio é parte integrante da visita: o ruído polui o ambiente natural. Mantém o
      telemóvel carregado para marcar o 112, embora nem sempre haja rede disponível.
    around: >-
      A cerca de 2 km fica o [Parque Natural de Sierra Madrona y Valle de
      Alcudia](/lugar/parque-natural-de-sierra-madrona-y-valle-de-alcudia/), e a dezanove quilómetros a
      [Sierra Morena Oriental - Despeñaperros](/lugar/sierra-morena-oriental---despenaperros/). Mais longe, o
      [Parque Nacional de Cabañeros](/lugar/parque-nacional-de-cabaneros/) e a [ZEC Montes de
      Toledo](/lugar/zec-montes-de-toledo/) partilham com Andújar o lince-ibérico, a águia-imperial e o
      abutre-preto, enquanto a [Reserva Natural da Serra da
      Malcata](/lugar/reserva-natural-da-serra-da-malcata/) preserva o lince e o abutre-preto.
