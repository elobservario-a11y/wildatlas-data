resumen:
  es: >-
    El primer parque nacional marino del Mediterráneo consagrado a la protección de la tortuga marina boba
    (*Caretta caretta*) en la bahía de Laganas.
  en: >-
    The first national marine park in the Mediterranean, dedicated to protecting the loggerhead sea turtle
    (*Caretta caretta*) in Laganas Bay.
  fr: >-
    Le premier parc national marin de Méditerranée voué à la sauvegarde de la tortue caouanne (*Caretta
    caretta*) dans la baie de Laganas.
  de: >-
    Der erste nationale Meerespark des Mittelmeers, gewidmet dem Schutz der Unechten Karettschildkröte
    (*Caretta caretta*) in der Bucht von Laganas.
  it: >-
    Il primo parco nazionale marino del Mediterraneo, istituito per salvaguardare la tartaruga marina comune
    (*Caretta caretta*) nella baia di Laganas.
  pt: >-
    O primeiro parque nacional marinho do Mediterrâneo, consagrado à salvaguarda da tartaruga-boba (*Caretta
    caretta*) na baía de Laganas.
unico:
  es: >-
    La mayor población reproductora de tortuga boba del Mediterráneo, con sus nidos a un paso de las
    sombrillas de la playa.
  en: >-
    The largest loggerhead sea turtle breeding population in the Mediterranean, with clutches laid steps away
    from beach parasols.
  fr: >-
    La plus importante colonie reproductrice de tortue caouanne en Méditerranée, pondant à deux pas des
    parasols estivaux.
  de: >-
    Die bedeutendste Brutpopulation der Unechten Karettschildkröte im Mittelmeerraum, mit Nestern unmittelbar
    neben den Strandliegen.
  it: >-
    La maggiore popolazione riproduttiva di tartaruga marina comune del Mediterraneo, con nidi scavati a breve
    distanza dagli ombrelloni.
  pt: >-
    A maior população reprodutora de tartaruga-boba do Mediterrâneo, com ninhos escavados a escassos metros
    das espreguiçadeiras de praia.
observaciones:
  es: >-
    En las playas de puesta está prohibido conducir vehículos, pasear perros y montar a caballo. La actividad
    en la playa debe limitarse a los 5 metros más cercanos al mar, porque las tortugas anidan en el centro y
    en la parte trasera. El mobiliario de playa de Laganas este, Kalamaki, Daphni y Gerakas se retira cada
    noche. Hay que respetar las jaulas que protegen los nidos y dejar que las crías lleguen solas al mar, sin
    tocarlas. De noche está prohibida la presencia humana en las playas de puesta: hay que salir de ellas
    entre la puesta de sol y las 7 de la mañana. No se debe alimentar, tocar ni nadar con las tortugas.
texto:
  es:
    intro: >-
      Cada noche de verano, en una playa de la bahía de Laganas, una hembra de tortuga boba sube arrastrándose
      hasta la arena y cava un nido. La bahía tiene seis playas así, 5,5 km en total, y en ellas se hacen de
      media unos 1.200 nidos al año. El Parque Nacional Marino de Zante protege el mar de esa bahía, en la
      costa sur de la isla, y las playas donde las tortugas desovan. Cubre 135 km² y se creó para esto:
      proteger a la [tortuga boba](/especie/caretta_caretta/), en un decreto presidencial de diciembre de
      1999, con la iniciativa de ARCHELON, la sociedad griega de protección de las tortugas marinas.
    landscape: >-
      El parque abarca el área marina de la bahía de Laganas y la franja de playas de puesta, con tres zonas
      marinas (A, B y C) y las áreas de puesta estrictamente protegidas. Incluye también el humedal del lago
      Keri y las dos pequeñas islas Strofadia, a unos 50 km al sur de Zante. Bajo el agua, la zona sublitoral
      guarda praderas de [Posidonia oceanica](/especie/posidonia_oceanica/) que llegan hasta unos 40 metros de
      profundidad; esta fanerógama marina, endémica del Mediterráneo, protege además la costa de la erosión.
      Entre los hábitats hay dunas, arrecifes sumergidos y la azucena de mar.


      Las seis playas se reparten el cuidado según su valor. Sekania tiene la mayor densidad de nidos de
      tortuga boba y es Área de Protección Absoluta, sin acceso público. Las demás (Marathonisi, Laganas este,
      Kalamaki, Dafni y Gerakas) son áreas de protección de la naturaleza, con medidas especiales para la
      población reproductora.
    wildlife: >-
      En 1977 se descubrió que las tortugas bobas criaban en estas playas. La temporada de puesta va de
      mediados de mayo a mediados de agosto, y las hembras ponen los huevos por la noche; la de eclosión, de
      mediados de julio a finales de septiembre. Ese calendario marca el parque: de principios de mayo a
      mediados de octubre, voluntarios de todo el mundo participan en el programa de conservación de ARCHELON,
      con censos de puesta de día y de noche, protección de los nidos con vallado y excavación de nidos tras
      la eclosión para estimar su éxito.


      Bajo el agua, la tortuga se observa en su entorno natural, siguiendo reglas para no molestarla. Y en la
      costa oeste de Zante vive además una población residente de [foca monje](/especie/monachus_monachus/)
      del Mediterráneo.
    visit: >-
      Se puede visitar de dos maneras: desde la playa o desde el agua. Las playas de puesta están abiertas
      desde las 7 de la mañana hasta la puesta de sol. ARCHELON tiene una estación de información en la plaza
      Solomos, en la ciudad de Zante, donde sus voluntarios cuentan cómo se protege a las tortugas.


      En el mar, un código voluntario para observar tortugas, respaldado por el parque, fija reglas claras:
      como máximo dos embarcaciones observan una tortuga a la vez, a menos de 2 nudos, y el resto debe quedar
      a 45 metros como mínimo; hay que mantener el silencio, y el tiempo máximo es de 10 minutos. Las tortugas
      se abordan siempre de lado y a una distancia de 15 metros como mínimo. En la bahía hay zonas vedadas a
      la navegación y un límite de velocidad de 6 nudos.
    history: >-
      El parque protege las playas de puesta de la tortuga boba y el hábitat y la población de la foca monje.
      En cada una de las zonas marinas está estrictamente prohibida la pesca.


      Se han elaborado códigos de conducta específicos para visitas, actividades de sensibilización, caminatas
      y excursiones marinas. Sekania, la playa con más nidos, es reserva natural estricta, y ARCHELON registra
      y protege los nidos de forma sistemática desde 1984.
    before: >-
      En las playas de puesta está prohibido conducir vehículos, pasear perros y montar a caballo. La
      actividad en la playa debe limitarse a los 5 metros más cercanos al mar, porque las tortugas anidan en
      el centro y en la parte trasera. El mobiliario de playa de Laganas este, Kalamaki, Daphni y Gerakas se
      retira cada noche. Hay que respetar las jaulas que protegen los nidos y dejar que las crías lleguen
      solas al mar, sin tocarlas. De noche está prohibida la presencia humana en las playas de puesta: hay que
      salir de ellas entre la puesta de sol y las 7 de la mañana. No se debe alimentar, tocar ni nadar con las
      tortugas.
    around: >-
      No hay lugares del atlas cerca. A distancia, comparten tortuga boba, foca monje y posidonia el
      [archipiélago de Lastovo](/lugar/park-prirode-lastovsko-otocje/); tortuga boba y foca monje,
      [Akamas](/lugar/akamas-peninsula/); tortuga boba y posidonia, [La Mola](/lugar/la-mola-formentera/); y
      foca monje, la [Rocha do Navio](/lugar/reserva-natural-da-rocha-do-navio/).
  en:
    intro: >-
      Every summer night on a sandy beach of Laganas Bay, a female loggerhead sea turtle drags herself from
      the surf and excavates a nest in the sand. The bay hosts six such beaches, spanning 5.5 km in total,
      where an average of around 1,200 nests are laid annually. The National Marine Park of Zakynthos protects
      the maritime waters of this bay along the southern coast of the island, alongside the vital nesting
      shores. Encompassing 135 km², it was formally established to safeguard the [loggerhead sea
      turtle](/especie/caretta_caretta/) through a presidential decree in December 1999, spurred by the
      tireless campaigning of ARCHELON, the Sea Turtle Protection Society of Greece.
    landscape: >-
      The park takes in the marine expanse of Laganas Bay and its rim of nesting beaches, structured into
      three marine management zones (A, B and C) alongside strictly protected coastal nesting sectors. It also
      incorporates the coastal wetland of Lake Keri and the two small Strofades islets lying roughly 50 km
      south of Zakynthos. Beneath the sea surface, the sublittoral zone shelters extensive beds of [Neptune
      grass](/especie/posidonia_oceanica/) descending to depths of around 40 metres; this marine flowering
      plant, endemic to the Mediterranean, oxygenates the water and anchors the shoreline against coastal
      erosion. Terrestrial habitats include coastal sand dunes, submerged reefs and sea daffodils.


      The six beaches are managed in accordance with their conservation value. Sekania sustains the highest
      nesting density of loggerhead turtles in the Mediterranean and is an Absolute Protection Area, barred to
      public access. The remaining shores (Marathonisi, East Laganas, Kalamaki, Dafni and Gerakas) are managed
      nature protection areas, subject to seasonal restrictions.
    wildlife: >-
      It was in 1977 that scientists first documented loggerhead turtles breeding across these shores. The
      nesting window spans from mid-May to mid-August, with females crawling ashore to deposit eggs under
      cover of darkness; hatching extends from mid-July through late September. This seasonal calendar governs
      the park: from early May to mid-October, volunteers from across the world join ARCHELON conservation
      field programmes, conducting day and night nesting surveys, installing protective nest cages, and
      excavating nests post-emergence to calculate hatching success.


      Underwater, turtles can be observed in their natural foraging habitat under strict codes of conduct to
      prevent stress. Off the rugged western coast of Zakynthos resides an isolated population of
      Mediterranean [monk seal](/especie/monachus_monachus/).
    visit: >-
      The park can be experienced from the shore or from the water. Nesting beaches are open to the public
      from 7 in the morning until sunset. ARCHELON operates a seasonal educational kiosk on Solomos Square in
      Zakynthos town, where field volunteers explain ongoing turtle conservation efforts.


      At sea, a voluntary turtle-watching code endorsed by the park sets strict navigation rules: a maximum of
      two vessels may observe a single turtle simultaneously, operating under 2 knots while remaining vessels
      stay at least 45 metres away; visitors must maintain silence, with observation sessions capped at 10
      minutes. Vessels must approach turtles laterally and keep a minimum distance of 15 metres. Navigational
      exclusion zones and a speed limit of 6 knots are enforced across the bay.
    history: >-
      The park safeguards the primary nesting beaches of the loggerhead turtle together with the foraging
      habitat and haul-out caves of the Mediterranean monk seal. Commercial and recreational fishing is
      strictly prohibited within all marine core zones.


      Specific codes of conduct have been designed for beach visits, public education, nature walks and
      low-impact boat excursions. Sekania, which concentrates the bulk of all nests, is managed as a strict
      nature reserve, and ARCHELON has systematically monitored and shielded nests across the island since
      1984.
    before: >-
      On nesting beaches, driving motor vehicles, walking dogs and horseback riding are strictly prohibited.
      Beach leisure must be confined to within 5 metres of the shoreline, as turtles nest in the middle and
      upper dune berms. Umbrellas and sun loungers on East Laganas, Kalamaki, Dafni and Gerakas are cleared
      every evening. Respect protective nest cages and never touch emerging hatchlings crawling toward the
      surf. Nighttime access to nesting beaches is strictly forbidden: visitors must leave between sunset and
      7 in the morning. Touching, feeding or swimming alongside turtles is prohibited.
    around: >-
      There are no proximate Atlas sites nearby. Further across the Mediterranean, loggerhead sea turtles,
      monk seals and Posidonia meadows are shared with the [Lastovo
      Archipelago](/lugar/park-prirode-lastovsko-otocje/); loggerheads and monk seals with
      [Akamas](/lugar/akamas-peninsula/); turtles and seagrass with [La Mola](/lugar/la-mola-formentera/); and
      monk seals with [Rocha do Navio](/lugar/reserva-natural-da-rocha-do-navio/).
  fr:
    intro: >-
      Chaque nuit d'été, sur une plage de la baie de Laganas, une tortue caouanne femelle s'extrait des flots
      et creuse un nid dans le sable. La baie rassemble six plages de ce type, représentant 5,5 km au total,
      où sont déposés en moyenne quelque 1 200 nids chaque année. Le parc national marin de Zante protège les
      eaux maritimes de cette baie sur la côte sud de l'île ainsi que les estrans de ponte. Couvrant 135 km²,
      il a été instauré pour protéger la [tortue caouanne](/especie/caretta_caretta/) par un décret
      présidentiel de décembre 1999, sous l'impulsion d'ARCHELON, la société grecque de protection des tortues
      marines.
    landscape: >-
      Le parc englobe le domaine marin de la baie de Laganas et le liseré des plages de nidification, articulé
      en trois zones marines (A, B et C) et des secteurs littoraux de ponte strictement protégés. Il inclut
      également la zone humide du lac Keri et les deux îlots des Strophades, situés à environ 50 km au sud de
      Zante. Sous la surface, l'étage médiolittoral et infralittoral abrite de vastes herbiers de
      [posidonie](/especie/posidonia_oceanica/) qui descendent jusqu'à environ 40 mètres de profondeur ; cette
      phanérogame marine endémique de Méditerranée oxygène les eaux et protège le littoral contre la houle.
      Les milieux naturels comptent dunes côtières, récifs sous-marins et lys de mer.


      Les six plages font l'objet d'un zonage rigoureux selon leur valeur biologique. Sekania concentre la
      plus forte densité de pontes et constitue une réserve intégrale interdite au public. Les autres secteurs
      (Marathonisi, Laganas est, Kalamaki, Dafni et Gerakas) sont des aires protégées soumises à des mesures
      d'encadrement saisonnier.
    wildlife: >-
      C'est en 1977 que fut découvert le caractère exceptionnel de ces plages pour la reproduction des
      caouannes. La période de ponte s'échelonne de la mi-mai à la mi-août, les femelles déposant leurs œufs
      de nuit ; les émergences ont lieu de la mi-juillet à la fin septembre. Ce calendrier régit le parc : de
      début mai à la mi-octobre, des bénévoles du monde entier participent aux programmes d'ARCHELON, assurant
      patrouilles nocturnes, pose de cages grillagées et inventaires des nids après l'éclosion.


      Sous l'eau, les tortues peuvent être observées dans leur milieu naturel selon des consignes strictes.
      Sur le littoral occidental de Zante subsiste en outre une population résidente de [phoque
      moine](/especie/monachus_monachus/) de Méditerranée.
    visit: >-
      La découverte du parc s'effectue depuis la terre ou depuis la mer. Les plages de nidification sont
      accessibles au public de 7 heures du matin jusqu'au coucher du soleil. ARCHELON tient un kiosque
      d'information sur la place Solomos dans la ville de Zante, où les volontaires présentent les mesures de
      conservation.


      En mer, une charte de bonne conduite validée par le parc encadre l'observation des tortues : au maximum
      deux embarcations peuvent approcher un animal à la fois, à moins de 2 nœuds, tandis que les autres
      bateaux patientent à 45 mètres au moins ; le silence est exigé et la durée limitée à 10 minutes.
      L'approche s'effectue toujours par le travers à une distance minimale de 15 mètres. Des zones sont
      interdites aux moteurs et la vitesse est plafonnée à 6 nœuds dans la baie.
    history: >-
      Le parc a pour mission de préserver les plages de ponte de la tortue caouanne ainsi que les habitats
      sous-marins et les grottes de mise bas du phoque moine. Toute forme de pêche professionnelle ou de
      loisir est strictement prohibée dans les sanctuaires marins.


      Des codes de conduite rigoureux régissent la baignade, les excursions nautiques et les activités de
      sensibilisation. Sekania, qui accueille l'essentiel des nids, bénéficie d'une protection totale, et
      ARCHELON assure le suivi scientifique des nids depuis 1984.
    before: >-
      Sur les plages de ponte, véhicules à moteur, chiens et chevaux sont formellement bannis. L'installation
      des baigneurs doit se limiter à la bande des 5 mètres la plus proche de l'eau, les tortues nichant dans
      le haut de plage. Les équipements de plage à Laganas est, Kalamaki, Dafni et Gerakas sont retirés chaque
      soir. Respectez les cages de protection et laissez les nouveau-nés gagner la mer sans intervenir. La
      présence humaine nocturne est interdite : les plages ferment entre le coucher du soleil et 7 heures du
      matin. Ne nagez pas avec les tortues et ne les touchez jamais.
    around: >-
      Aucun site du réseau n'est immédiatement adjacent. À l'échelle méditerranéenne, tortue caouanne, phoque
      moine et posidonie se retrouvent dans l'[archipel de Lastovo](/lugar/park-prirode-lastovsko-otocje/) ;
      caouannes et phoques moines sur la [péninsule d'Akamas](/lugar/akamas-peninsula/) ; tortues et
      posidonies à [La Mola](/lugar/la-mola-formentera/) ; et phoque moine à [Rocha do
      Navio](/lugar/reserva-natural-da-rocha-do-navio/).
  de:
    intro: >-
      In jeder Sommernacht kriecht an den Sandstränden der Bucht von Laganas ein Weibchen der Unechten
      Karettschildkröte aus der Brandung und gräbt eine Nistgrube in den Sand. Die Bucht beherbergt sechs
      solcher Strände mit 5,5 km Gesamtlänge, an denen im Schnitt rund 1.200 Gelege im Jahr abgelegt werden.
      Der Meeresnationalpark Zakynthos schützt das Meeresgebiet an der Südküste der Insel sowie die
      Niststrände. Mit 135 km² Fläche entstand er zum Schutz der [Unechten
      Karettschildkröte](/especie/caretta_caretta/) durch Präsidialerlass im Dezember 1999 auf beharrliche
      Initiative der griechischen Meeresschildkrötenschutzgesellschaft ARCHELON.
    landscape: >-
      Der Park umfasst das Meeresgebiet der Laganas-Bucht und den Gürtel der Niststrände, gegliedert in drei
      Schutzzonen (A, B und C) sowie streng geschützte Küstenzonen. Er schließt das Feuchtgebiet des Keri-Sees
      und die beiden kleinen Strofaden-Inseln rund 50 km südlich von Zakynthos ein. Unter Wasser birgt das
      Flachmeer ausgedehnte Wiesen des [Neptungrases](/especie/posidonia_oceanica/), die bis in etwa 40 Meter
      Tiefe hinabreichen; dieses im Mittelmeer endemische Seegras versorgt das Wasser mit Sauerstoff und
      bewahrt die Strände vor Wellenerosion. Zu den Lebensräumen zählen Küstendünen, Brandungsriffe und
      Dünen-Trichternarzissen.


      Die sechs Strände unterliegen differenzierten Schutzregeln. Sekania weist die höchste Nistdichte auf und
      ist ein Totalreservat ohne öffentlichen Zugang. Die übrigen Strände (Marathonisi, Laganas-Ost, Kalamaki,
      Dafni und Gerakas) sind Naturschutzzonen mit strengen saisonalen Schutzbestimmungen.
    wildlife: >-
      Im Jahr 1977 wurde erstmals die herausragende Bedeutung dieser Strände für die Karettschildkröte
      dokumentiert. Die Eiablage dauert von Mitte Mai bis Mitte August, wobei die Tiere nachts an Land gehen;
      die Jungtiere schlüpfen von Mitte Juli bis Ende September. Dieser Zyklus bestimmt den Parkbetrieb: Von
      Anfang Mai bis Mitte Oktober engagieren sich Freiwillige aus aller Welt bei ARCHELON, führen Zählungen
      durch, sichern Nester mit Schutzgittern und untersuchen Schlupfraten.


      Unter Wasser lässt sich die Schildkröte unter strengen Verhaltensregeln beim Schwimmen beobachten. An
      den Felsküsten West-Zakynthos' lebt zudem eine sesshafte Population der seltenen
      Mittelmeer-[Mönchsrobbe](/especie/monachus_monachus/).
    visit: >-
      Der Park erschließt sich vom Land wie vom Wasser aus. Die Niststrände sind von 7 Uhr morgens bis zum
      Sonnenuntergang für Besucher geöffnet. ARCHELON unterhält einen Informationspavillon auf dem
      Solomos-Platz in Zakynthos-Stadt, wo Freiwillige über den Schildkrötenschutz aufklären.


      Auf See regelt ein vom Meerespark anerkannter Verhaltenskodex die Tierbeobachtung: Maximal zwei Boote
      dürfen sich einer Schildkröte gleichzeitig nähern, mit weniger als 2 Knoten Fahrt, während Begleitboote
      mindestens 45 Meter Abstand wahren; Motoren müssen gedrosselt werden, Ruhe ist Pflicht und die
      Beobachtungsdauer ist auf 10 Minuten begrenzt. Die Annäherung erfolgt seitlich bei mindestens 15 Metern
      Distanz. In der Bucht gelten Fahrverbote und ein Tempolimit von 6 Knoten.
    history: >-
      Der Park schützt die Nistgründe der Meeresschildkröte sowie die Ruhe- und Wurfhöhlen der
      Mittelmeer-Mönchsrobbe. Fischerei ist in den Schutzzonen strikt verboten.


      Spezielle Verhaltensregeln gelten für Strandbesuche, naturkundliche Wanderungen und Bootsfahrten.
      Sekania mit der höchsten Nistkonzentration ist ein unberührtes Forschungsreservat; ARCHELON erfasst und
      schützt die Gelege auf Zakynthos seit 1984.
    before: >-
      An den Niststränden sind Motorfahrzeuge, Hunde und Reiten verboten. Strandaktivitäten müssen auf den
      meerseitigen Streifen von 5 Metern beschränkt bleiben, da Schildkröten im Mittel- und Hinterstrand
      nisten. Liegen und Sonnenschirme werden abends an den Hauptstränden weggeräumt. Schutzgitter dürfen
      nicht versetzt werden; Schlüpflinge müssen ohne menschliche Berührung das Meer erreichen. Nachts gilt an
      den Niststränden absolutes Betretungsverbot zwischen Sonnenuntergang und 7 Uhr morgens. Füttern,
      Berühren oder Mitschwimmen mit Schildkröten ist untersagt.
    around: >-
      In direkter Nachbarschaft liegen keine Atlas-Gebiete. Im weiteren Mittelmeerraum teilen
      Karettschildkröte, Mönchsrobbe und Neptungras der
      [Lastovo-Archipel](/lugar/park-prirode-lastovsko-otocje/); Schildkröte und Robbe die
      [Akamas-Halbinsel](/lugar/akamas-peninsula/); Schildkröte und Posidonia [La
      Mola](/lugar/la-mola-formentera/); und Mönchsrobben die [Rocha do
      Navio](/lugar/reserva-natural-da-rocha-do-navio/).
  it:
    intro: >-
      In ogni notte d'estate, lungo una spiaggia della baia di Laganas, una femmina di tartaruga marina comune
      risale dal mare e scava una buca nella sabbia. La baia ospita sei spiagge idonee per 5,5 km complessivi,
      dove ogni anno si registrano in media circa 1.200 nidi. Il Parco nazionale marino di Zante tutela le
      acque di questa baia lungo la costa meridionale dell'isola e le spiagge di deposizione. Con una
      superficie di 135 km², è nato per tutelare la [tartaruga marina comune](/especie/caretta_caretta/)
      tramite un decreto presidenziale del dicembre 1999, grazie all'impegno di ARCHELON, l'associazione greca
      per la salvaguardia delle tartarughe marine.
    landscape: >-
      Il parco comprende lo specchio d'acqua della baia di Laganas e l'arco delle spiagge di nidificazione,
      suddiviso in tre zone marine di tutela (A, B e C) e aree costiere rigorosamente protette. Include anche
      la palude del lago Keri e le due piccole isole Strofadi, situate a circa 50 km a sud di Zante. Sotto il
      pelo dell'acqua, il piano infralitorale accoglie rigogliose praterie di [posidonia
      oceanica](/especie/posidonia_oceanica/) che scendono fino a circa 40 metri di profondità; questa pianta
      marina endemica del Mediterraneo ossigena le acque e mitiga l'erosione costiera provocata dal moto
      ondoso. Gli ambienti includono dune sabbiose, scogliere sommerse e gigli marini.


      Le sei spiagge godono di tutele differenziate in base al pregio ecologico. Sekania ospita la
      concentrazione più densa di nidi ed è Riserva Integrale, preclusa a qualunque accesso pubblico. Gli
      altri lidi (Marathonisi, Laganas orientale, Kalamaki, Dafni e Gerakas) sono aree naturali protette
      soggette a rigide prescrizioni.
    wildlife: >-
      Nel 1977 fu scoperta la straordinaria vocazione riproduttiva di queste spiagge. La deposizione delle
      uova avviene da metà maggio a metà agosto, con le femmine che approdano a riva col buio; le schiuse
      proseguono da metà luglio a fine settembre. Il parco si organizza su questo calendario: da inizio maggio
      a metà ottobre volontari da tutto il mondo prendono parte ai campi di ARCHELON, svolgendo monitoraggi
      notturni, posando gabbie metalliche a protezione dei nidi e verificando il successo della schiusa.


      In mare le tartarughe possono essere ammirate nel loro elemento naturale osservando regole di rispetto.
      Sulla costa occidentale di Zante vive inoltre una popolazione stanziale di [foca
      monaca](/especie/monachus_monachus/) mediterranea.
    visit: >-
      La visita può svolgersi sia da terra sia dal mare. Le spiagge di nidificazione sono aperte dalle 7 del
      mattino fino al tramonto. ARCHELON gestisce un punto informativo permanente in piazza Solomos, nella
      città di Zante, dove i volontari illustrano le buone pratiche di salvaguardia.


      In mare, un codice etico di navigazione ratificato dall'ente parco disciplina l'avvistamento delle
      tartarughe: al massimo due imbarcazioni possono osservare un esemplare in contemporanea, navigando a
      meno di 2 nodi, mentre le altre devono mantenersi ad almeno 45 metri di distanza; è richiesto silenzio
      assoluto e il contatto visivo non può eccedere i 10 minuti. L'avvicinamento va effettuato di fianco
      mantenendo una distanza minima di 15 metri. Nella baia sono in vigore divieti di transito a motore e un
      limite di velocità di 6 nodi.
    history: >-
      Il parco tutela le spiagge di riproduzione della tartaruga marina e i rifugi costieri della foca monaca
      mediterranea. Qualsiasi forma di pesca professionale o ricreativa è rigorosamente bandita nelle riserve
      marine.


      Sono stati definiti codici di condotta per balneazione, visite guidate ed escursioni in barca. La
      spiaggia di Sekania, dove si concentra la maggioranza dei nidi, è una riserva naturale chiusa al
      pubblico; ARCHELON vi compie rilievi scientifici continuativi fin dal 1984.
    before: >-
      Sulle spiagge di nidificazione è severamente vietato circolare con mezzi a motore, condurre cani e
      cavalcare. La sosta dei bagnanti deve concentrarsi entro i 5 metri dalla battigia, poiché le tartarughe
      depongono nella fascia mediana e retrostante dell'arenile. Gli stabilimenti di Laganas est, Kalamaki,
      Dafni e Gerakas rimuovono ombrelloni e lettini ogni sera. Rispetta le gabbie protettive e lascia che i
      piccoli raggiungano il mare da soli senza toccarli. Di notte vige il divieto assoluto di accesso: le
      spiagge chiudono tra il tramonto e le 7 del mattino. È vietato toccare, nutrire o nuotare con le
      tartarughe.
    around: >-
      Nessun sito dell'atlas si trova nelle immediate vicinanze. A livello mediterraneo, tartaruga comune,
      foca monaca e praterie di posidonia coesistono nell'[arcipelago di
      Lastovo](/lugar/park-prirode-lastovsko-otocje/); tartarughe e foche monache nella [penisola di
      Akamas](/lugar/akamas-peninsula/); tartarughe e posidonia a [La Mola](/lugar/la-mola-formentera/); e
      foche monache nella [Rocha do Navio](/lugar/reserva-natural-da-rocha-do-navio/).
  pt:
    intro: >-
      Em cada noite de verão, numa praia da baía de Laganas, uma fêmea de tartaruga-boba arrasta-se para fora
      das ondas e escava um ninho na areia. A baía conta com seis praias arenosas deste tipo, somando 5,5 km
      de extensão, nas quais se registam anualmente em média cerca de 1.200 posturas. O Parque Nacional
      Marinho de Zante protege o domínio marítimo desta enseada na costa sul da ilha e os areais de desova.
      Abrangendo 135 km², foi criado para proteger a [tartaruga-boba](/especie/caretta_caretta/) por decreto
      presidencial em dezembro de 1999, sob o impulso da ARCHELON, a sociedade grega de proteção das
      tartarugas marinhas.
    landscape: >-
      O parque engloba a bacia marítima da baía de Laganas e o cordão de praias de nidificação, organizado em
      três zonas marítimas de proteção (A, B e C) e setores costeiros de salvaguarda integral. Integra
      igualmente o paul do lago Keri e os dois pequenos ilhéus Strofades, a cerca de 50 km a sul de Zante. Sob
      as águas, a faixa infralitoral alberga prados viçosos de
      [erva-de-posidónia](/especie/posidonia_oceanica/) que atingem cerca de 40 metros de profundidade; esta
      planta marinha endémica do Mediterrâneo oxigena o meio e trava a erosão costeira provocada pelas vagas.
      Entre os habitats destacam-se sistemas dunares, recifes submersos e o narciso-das-areias.


      As seis praias distribuem-se por diferentes níveis de tutela. Sekania reúne a maior densidade de
      posturas de tartaruga-boba, constituindo Reserva Integral sem qualquer acesso público. As restantes
      enseadas (Marathonisi, Laganas nascente, Kalamaki, Dafni e Gerakas) constituem áreas de proteção com
      restrições sazonais.
    wildlife: >-
      Foi em 1977 que se descobriu a vitalidade reprodutora destas praias para as tartarugas-bobas. A época de
      desova decorre de meados de maio a meados de agosto, com as fêmeas a subir à praia durante a noite; a
      eclosão dos ovos prolonga-se de meados de julho ao final de setembro. O parque vive em função deste
      ritmo: de início de maio a meados de outubro, voluntários de vários países integram os projetos da
      ARCHELON, monitorizando ninhos, instalando gaiolas metálicas de proteção e avaliando o sucesso das
      posturas.


      No mar, é possível observar as tartarugas no seu elemento sob regras estritas para não perturbar os
      espécimes. Na costa ocidental de Zante habita também uma colónia residente de
      [foca-monge-do-mediterrâneo](/especie/monachus_monachus/).
    visit: >-
      A visitação pode decorrer a partir da praia ou a partir do mar. As praias de desova encontram-se abertas
      entre as 7 da manhã e o pôr do sol. A ARCHELON dispõe de um posto de acolhimento na praça Solomos, na
      cidade de Zante, onde voluntários prestam esclarecimentos sobre o projeto de conservação.


      No mar, um código de conduta voluntário reconhecido pelo parque estabelece regras precisas: no máximo
      duas embarcações podem avistar uma tartaruga em simultâneo, navegando a menos de 2 nós e mantendo os
      restantes barcos a uma distância mínima de 45 metros; exige-se silêncio e o tempo limite é de 10
      minutos. A aproximação faz-se sempre de lado e a pelo menos 15 metros de distância. Na baía vigoram
      zonas interditas a motores e um limite de velocidade fixado em 6 nós.
    history: >-
      O parque salvaguarda os areais de postura da tartaruga-boba bem como as cavidades costeiras de abrigo e
      reprodução da foca-monge. É estritamente proibida qualquer modalidade de pesca nas zonas marítimas de
      proteção integral.


      Foram implementados códigos de conduta específicos para passeios balneares, percursos a pé e excursões
      marítimas. Sekania, com a maior densidade de ninhos, constitui reserva estrita; a ARCHELON regista e
      tutela sistematicamente as posturas desde 1984.
    before: >-
      Nos areais de desova é terminantemente proibido conduzir viaturas, passear cães ou montar a cavalo. A
      permanência de banhistas deve confinar-se à faixa de 5 metros contígua à linha de água, uma vez que as
      tartarugas nidificam nas zonas central e superior do areal. Os equipamentos de praia em Laganas
      nascente, Kalamaki, Dafni e Gerakas são retirados diariamente ao entardecer. Deves respeitar as
      estruturas de proteção dos ninhos e permitir que as crias alcancem o mar sozinhas. A permanência noturna
      é proibida: as praias encerram entre o pôr do sol e as 7 da manhã. É proibido alimentar, tocar ou nadar
      com as tartarugas.
    around: >-
      Não existem sítios do atlas nas imediações imediatas. No Mediterrâneo em geral, a tartaruga-boba, a
      foca-monge e os prados de posidónia coexistem no [arquipélago de
      Lastovo](/lugar/park-prirode-lastovsko-otocje/); tartarugas e focas-monge em
      [Akamas](/lugar/akamas-peninsula/); tartarugas e posidónia em [La Mola](/lugar/la-mola-formentera/); e a
      foca-monge na [Rocha do Navio](/lugar/reserva-natural-da-rocha-do-navio/).
