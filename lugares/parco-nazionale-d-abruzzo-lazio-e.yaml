resumen:
  es: >-
    El santuario del oso pardo marsicano y el lobo apennino en hayedos viejos y valles de alta montaña del
    centro de Italia.
  en: >-
    Sanctuary of the Marsican brown bear and Apennine wolf in primeval beechwoods and high alpine valleys of
    central Italy.
  fr: >-
    Le sanctuaire de l'ours brun marsicain et du loup des Apennins parmi les hêtraies anciennes et les vallées
    alpines du centre de l'Italie.
  de: >-
    Zufluchtsort des Marsischen Braunbären und des Apenninwolfs in uralten Buchenwäldern und Hochtälern
    Mittelitaliens.
  it: >-
    Il santuario dell'orso bruno marsicano e del lupo appenninico tra faggete vetuste e valli d'alta quota del
    centro Italia.
  pt: >-
    O santuário do urso-pardo-marsicano e do lobo-dos-apeninos em faiais ancestrais e vales alpinos do centro
    de Itália.
unico:
  es: >-
    Es el último refugio del oso pardo marsicano, una de las poblaciones de oso más raras del mundo, y de un
    rebeco que solo existe en estos montes, además de los hayedos viejos reconocidos como Patrimonio Mundial.
  en: >-
    The last sanctuary of the Marsican brown bear, one of the rarest bear populations on Earth, alongside a
    chamois endemic to these massifs and ancient beech forests inscribed as a UNESCO World Heritage Site.
  fr: >-
    Le dernier refuge de l'ours brun marsicain, l'une des populations d'ours les plus rares au monde, et d'un
    isard propre à ces montagnes, en plus de hêtraies séculaires reconnues au Patrimoine mondial.
  de: >-
    Letzter Rückzugsort des Marsischen Braunbären, einer der seltensten Bärenpopulationen der Welt, sowie
    einer nur hier heimischen Gämse und uralter Buchenwälder des UNESCO-Welterbes.
  it: >-
    È l'ultimo rifugio dell'orso bruno marsicano, una delle popolazioni di orso più rare al mondo, e di un
    camoscio esclusivo di queste montagne, oltre alle faggete vetuste riconosciute Patrimonio Mondiale.
  pt: >-
    O último refúgio do urso-pardo-marsicano, uma das populações ursinas mais raras do globo, e de uma camurça
    restrita a estas serras, além de faiais vetustos classificados como Património Mundial.
observaciones:
  es: >-
    Los centros de visitantes tienen horarios cambiantes por temporada, así que comprueba antes de ir qué
    abre. En la zona de reserva integral el acceso es solo con permiso. La reserva general regula el acceso
    motorizado y la recogida de madera y de productos del sotobosque.
texto:
  es:
    intro: >-
      A finales del siglo XIX, en estas montañas solo sobrevivían unos pocos osos pardos marsicanos y unos
      pocos rebecos apeninos. En 1921 una federación alquiló 500 hectáreas de la Camosciara al municipio de
      Opi, en lo alto del valle Fondillo, y aquel rincón minúsculo se convirtió en el germen de un parque que
      hoy suma 50.000 hectáreas, con otras 80.000 de zona de amortiguación.
    landscape: >-
      Las montañas del parque son grandes sistemas calizos, alineados en los Monti della Meta: el Petroso
      (2.249 m), el Marsicano (2.245 m), el Meta (2.242 m), el Tartaro, el Jamiccio, el Cavallo y el Palombo.
      Las cumbres más altas conservan huellas de la última glaciación cuaternaria, con circos y morrenas,
      sobre todo en los montes de la Meta, la Serra delle Gravare, el Petroso y el Palombo. En la meseta de
      Biscurri, las dolinas fueron talladas por antiguos glaciares y por el agua de deshielo.


      El haya manda. Cubre casi el 60 % de la superficie del parque y crece normalmente entre los 900 y los
      1.800 m, con colores que cambian en cada estación. Entre Pescasseroli y Villavallelonga están los únicos
      hayedos centenarios que escaparon a la tala periódica; en 2017 cinco de estos núcleos, de más de 1.000
      hectáreas y algunos de unos 560 años, fueron declarados Patrimonio Mundial junto con los bosques
      primarios de hayas de los Cárpatos y otras regiones de Europa. El tejo es poco frecuente y se refugia en
      las zonas más altas y salvajes del hayedo. Más arriba, entre el hayedo y la pradera de alta montaña,
      crece el pino mugo, una reliquia glaciar, sobre todo en la Camosciara; y en la Camosciara y el valle
      Fondillo, el [pino negro](/especie/pinus_nigra/) de Villetta Barrea, una variedad exclusiva del parque
      que quizá data del Terciario.


      Sobre los 1.900-2.000 m se extienden las praderas de alta montaña, que con prados y claros cubren más
      del 30 % del parque.
    wildlife: >-
      La flora llega a más de 2.000 especies de plantas superiores. En primavera, entre mayo y junio, florece
      el Iris marsica, un endemismo que solo crece en algunos lugares, y en los rincones más recónditos, la
      orquídea más bella, grande y rara del parque: el zapatito de dama amarillo, Cypripedium calceolus, que
      crece en el corazón de la reserva integral y corre riesgo de extinción por la recolección inútil de
      turistas.


      El gran protagonista es el [oso pardo](/especie/ursus_arctos/) marsicano. Pesa más de 200 kg, es
      solitario y tranquilo, y su población no llega a 100 ejemplares. Verlo no es fácil: los animales del
      parque son huidizos y cautelosos. Con tranquilidad, silencio y respeto al entorno, en algunas épocas se
      pueden ver el rebeco, el oso, el lobo, el ciervo y el águila real.


      El [rebeco](/especie/rupicapra_pyrenaica/) de los Abruzos, endémico junto con el oso marsicano, se salvó
      de la extinción en las laderas de la Camosciara, un nombre que recuerda su presencia relicta; de aquí
      salieron los rebecos reintroducidos en la Majella y en el Gran Sasso. El [lobo](/especie/canis_lupus/)
      apenino es el depredador más importante del parque y de todo el Apenino; en 1970 quedaban solo unos diez
      ejemplares. El [ciervo](/especie/cervus_elaphus/) estaba extinguido cuando se creó el parque, y en 1971
      se reintrodujeron los primeros ejemplares de los Alpes orientales; el
      [corzo](/especie/capreolus_capreolus/), también reintroducido, es hoy la especie más fácil de ver. En
      2018 se confirmó la presencia de la [nutria](/especie/lutra_lutra/) en las aguas limpias del Sangro, más
      de cuarenta años después del último registro.


      Para las aves, el [águila real](/especie/aquila_chrysaetos/) cría con seis parejas en las zonas menos
      accesibles, pero se la ve a menudo planeando sobre el centro del parque. En los bosques hay pico verde y
      el raro [pico dorsiblanco](/especie/picoides_lilfordi/); el pico de Lilford destaca en los bosques del
      monte Tranquillo y de los montes de la Meta. En los cantiles viven la [chova
      piquirroja](/especie/pyrrhocorax_pyrrhocorax/) y la chova piquigualda, y en los arroyos el [mirlo
      acuático](/especie/cinclus_cinclus/). Entre los anfibios, en los valles con aguas de manantial y
      turberas viven la salamandrina de anteojos, el tritón italiano y la salamandra común; y entre los
      insectos, mariposas como Parnassius apollo y el longicornio del haya, [Rosalia
      alpina](/especie/rosalia_alpina/).
    visit: >-
      La carretera estatal 83 Marsicana cruza el parque de norte a sureste por Pescasseroli, Opi, Villetta
      Barrea, Civitella Alfedena, Barrea y Alfedena, y esos son los pueblos desde los que se entra. Los
      centros de visitantes son estructuras de información, educación e interpretación ambiental en los
      pueblos del parque. Hay centros dedicados a la naturaleza y al zoo en Pescasseroli, al lobo en Civitella
      Alfedena, al agua en Villetta Barrea, al rebeco en Opi, al corzo en Bisegna, a la flora en Ortona dei
      Marsi y al oso en Pizzone, Villavallelonga y Campoli Appennino. En Pescasseroli están además el centro
      del parque, el museo naturalista, el museo histórico, el jardín botánico, el arboreto apenínico y el
      área faunística. Y hay recintos con animales en Civitella Alfedena, con lobo y lince, y en
      Villavallelonga, con oso y ciervo.


      La red oficial señala unos 150 itinerarios ecoturísticos que suman más de 250 km. En la zona B el
      senderismo es libre. La excursión de Val Cervara atraviesa un hayedo centenario y termina con una visita
      al centro del oso en Villavallelonga, y el sendero que conecta la Camosciara con las Cascate figura con
      dificultad T. El parque recomienda la primavera y el inicio del verano por el despertar de la
      naturaleza, las floraciones y el canto de los pájaros.
    history: >-
      La idea del parque nació tras la Primera Guerra Mundial por el trabajo de Erminio Sipari, ambientalista
      y diputado. El 25 de noviembre de 1921 Sipari y la Federación Pro Montibus empezaron a gestionar como
      protegido un pequeño terreno entre el valle Fondillo y la Camosciara. En 1933 el régimen fascista
      suprimió el ente de gestión autónomo del parque; en 1951 se restableció, y con él se reforzaron la
      vigilancia, los estudios científicos y las prohibiciones de caza.


      La ampliación de 1976 al macizo del monte Marsicano evitó un gran sistema de pistas de esquí entre
      Pescasseroli y Bisegna. Hoy el parque se divide en zonas: la zona de reserva integral restringe el
      acceso con permiso, sobre todo por investigación científica, y la zona B es sobre todo bosque,
      principalmente hayedo, y prados.
    before: >-
      Los centros de visitantes tienen horarios cambiantes por temporada, así que comprueba antes de ir qué
      abre. En la zona de reserva integral el acceso es solo con permiso. La reserva general regula el acceso
      motorizado y la recogida de madera y de productos del sotobosque.
    around: >-
      La [Riserva Naturale Guidata Gole del Sagittario](/lugar/gole-del-sagittario/) está a unos 3 km. A doce
      kilómetros queda el [Parco Nazionale della Majella](/lugar/parco-nazionale-della-majella/), adonde
      llegaron rebecos nacidos aquí; las [Gole di Celano - Canyon delle Gole di
      Celano-Aielli](/lugar/gole-di-celano/) están a dieciséis kilómetros y el [Parco Nazionale del Gran Sasso
      e Monti della Laga](/lugar/parco-nazionale-del-gran-sasso-e-monti-della-laga/), que también recibió
      rebecos de este parque, a veintisiete.
  en:
    intro: >-
      At the close of the nineteenth century, only a handful of Marsican brown bears and Apennine chamois
      clung to survival in these rugged mountains. In 1921 a private federation leased 500 hectares of the
      Camosciara from the municipality of Opi, high in the Fondillo valley, and that tiny enclave became the
      seed of a national park that today encompasses 50,000 hectares, buffered by a further 80,000 hectares.
    landscape: >-
      The park's relief consists of massive limestone massifs aligned along the Monti della Meta: Monte
      Petroso (2,249 m), Monte Marsicano (2,245 m), Monte Meta (2,242 m), Monte Tartaro, Monte Jamiccio, Monte
      Cavallo, and Monte Palombo. The highest peaks retain clear marks of the last Quaternary glaciation,
      displaying cirques and moraines across the Monti della Meta, Serra delle Gravare, Petroso, and Palombo.
      On the Biscurri plateau, sinkholes were hollowed out by ancient glaciers and subsequent meltwaters.


      Beech is the undisputed master. It covers nearly 60 % of the park's territory and typically grows
      between 900 and 1,800 m, shifting hues with every passing season. Between Pescasseroli and
      Villavallelonga survive the only multi-centenary beech groves that escaped logging; in 2017 five of
      these old-growth stands, spanning over 1,000 hectares with trees up to 560 years old, were inscribed as
      a UNESCO World Heritage Site alongside the ancient beech forests of the Carpathians and other European
      regions. Yew is rare, sheltering in the wildest, highest folds of the forest. Higher up, between the
      beech belt and alpine pastures, dwarf mountain pine persists as a glacial relict, particularly in the
      Camosciara; and in the Camosciara and Valle Fondillo grows the Villetta Barrea [European black
      pine](/especie/pinus_nigra/), an endemic variety perhaps dating back to the Tertiary.


      Above 1,900-2,000 m stretch alpine grasslands which, together with subalpine meadows and clearings,
      cover more than 30 % of the national park.
    wildlife: >-
      The vascular flora exceeds 2,000 species. In spring, during May and June, blooms Iris marsica, a rare
      endemic confined to localized calcareous slopes, while in the most secluded corners flowers the park's
      most celebrated, grand, and fragile orchid: the yellow lady's slipper, Cypripedium calceolus, thriving
      in the strict reserve but threatened by tourist gathering.


      The iconic sovereign of these mountains is the Marsican [brown bear](/especie/ursus_arctos/). Reaching
      over 200 kg, it is solitary and shy, with a wild population numbering fewer than 100 individuals.
      Catching sight of it requires great discretion: the park's fauna is elusive and cautious. With patience,
      silence, and deep respect for the habitat, fortunate visitors may observe chamois, bear, wolf, red deer,
      and golden eagle.


      The Apennine [Pyrenean chamois](/especie/rupicapra_pyrenaica/), endemic alongside the Marsican bear,
      escaped extinction on the steep cliffs of the Camosciara—a place-name echoing its relict survival; from
      here derived animals used to reintroduce chamois to the Majella and Gran Sasso. The Apennine [grey
      wolf](/especie/canis_lupus/) is the apex predator of the park and the entire Apennine chain; in 1970
      only about ten individuals survived. The [red deer](/especie/cervus_elaphus/) had vanished when the park
      was formed, and in 1971 the first eastern Alpine animals were reintroduced; the [roe
      deer](/especie/capreolus_capreolus/), also reintroduced, is now the most frequently sighted ungulate. In
      2018 the presence of the [Eurasian otter](/especie/lutra_lutra/) was confirmed in the pristine waters of
      the Sangro River, more than forty years after the last historical record.


      Among birds, the [golden eagle](/especie/aquila_chrysaetos/) nests with six breeding pairs in remote
      crags, frequently seen soaring over central valleys. Forests shelter European green woodpeckers and the
      rare [white-backed woodpecker](/especie/picoides_lilfordi/), with Lilford's woodpecker thriving in the
      old-growth stands of Monte Tranquillo and the Monti della Meta. Rocky ramparts host the [red-billed
      chough](/especie/pyrrhocorax_pyrrhocorax/) and yellow-billed chough, while streams are patrolled by the
      [white-throated dipper](/especie/cinclus_cinclus/). Amphibians in spring-fed bogs include the spectacled
      salamander, Italian newt, and common fire salamander; insects feature Apollo butterflies and the rare
      beech longhorn, [Rosalia longicorn](/especie/rosalia_alpina/).
    visit: >-
      State highway 83 Marsicana crosses the park from north to southeast through Pescasseroli, Opi, Villetta
      Barrea, Civitella Alfedena, Barrea, and Alfedena, which serve as the primary gateways. Visitor centres
      provide environmental education, interpretation, and local information across these towns. Dedicated
      centres focus on nature and wildlife at Pescasseroli, the wolf at Civitella Alfedena, aquatic ecosystems
      at Villetta Barrea, the Apennine chamois at Opi, roe deer at Bisegna, local flora at Ortona dei Marsi,
      and the brown bear at Pizzone, Villavallelonga, and Campoli Appennino. Pescasseroli also hosts park
      headquarters, the natural history museum, historical museum, botanical garden, Apennine arboretum, and a
      wildlife area. Semi-wild enclosures are situated at Civitella Alfedena (wolf and lynx) and
      Villavallelonga (bear and deer).


      The official trail network features around 150 ecotourism routes totalling over 250 km. Hiking in Zone B
      is free. The Val Cervara hike winds through ancient old-growth beechwoods ending at the bear centre in
      Villavallelonga, while the trail linking Camosciara with the waterfalls is graded T (tourist
      difficulty). Park managers recommend visiting in spring and early summer to enjoy nature's awakening,
      blooms, and birdsong.
    history: >-
      The concept of the national park arose after the First World War through the vision of environmentalist
      and deputy Erminio Sipari. On 25 November 1921 Sipari and the Pro Montibus Federation began managing a
      protected enclave between Valle Fondillo and Camosciara. In 1933 the fascist regime dissolved the park's
      autonomous governing authority; it was reconstituted in 1951, reinforcing ranger surveillance,
      scientific research, and hunting bans.


      The 1976 expansion to the Monte Marsicano massif successfully thwarted a sprawling ski resort between
      Pescasseroli and Bisegna. Today the park is zoned: the strict nature reserve restricts entry to
      authorized permits for scientific study, while Zone B encompasses extensive protective forests, mainly
      beech, and alpine pastures.
    before: >-
      Visitor centres operate seasonal opening schedules; verify current hours before travelling. Access to
      the strict nature reserve (Zone A) is strictly prohibited without special authorization. The general
      reserve regulates vehicle access, firewood collection, and gathering of wild forest products.
    around: >-
      The [Riserva Naturale Guidata Gole del Sagittario](/lugar/gole-del-sagittario/) lies about 3 km away.
      Twelve kilometres away is [Parco Nazionale della Majella](/lugar/parco-nazionale-della-majella/), which
      received chamois born here; [Gole di Celano - Canyon delle Gole di
      Celano-Aielli](/lugar/gole-di-celano/) sits sixteen kilometres away, and [Parco Nazionale del Gran Sasso
      e Monti della Laga](/lugar/parco-nazionale-del-gran-sasso-e-monti-della-laga/) twenty-seven kilometres
      away.
  fr:
    intro: >-
      À la fin du XIXe siècle, seuls quelques rares ours bruns marsicains et une poignée d'isards des Apennins
      survivaient dans ces reliefs. En 1921, une fédération loua 500 hectares de la Camosciara à la commune
      d'Opi, en amont du val Fondillo, et cette enclave devint le berceau d'un parc national qui rassemble
      aujourd'hui 50 000 hectares, bordés par 80 000 hectares de zone tampon.
    landscape: >-
      Les reliefs du parc forment de vastes massifs calcaires alignés le long des Monti della Meta : le
      Petroso (2 249 m), le Marsicano (2 245 m), le Meta (2 242 m), le Tartaro, le Jamiccio, le Cavallo et le
      Palombo. Les plus hauts sommets conservent les stigmates de la dernière glaciation quaternaire, avec
      cirques et moraines sur les monts de la Meta, la Serra delle Gravare, le Petroso et le Palombo. Sur le
      plateau de Biscurri, les dolines ont été excavées par les anciens glaciers et les eaux de fonte.


      Le hêtre domine sans partage. Il couvre près de 60 % de la superficie du parc et prospère habituellement
      entre 900 et 1 800 m, changeant de palette à chaque saison. Entre Pescasseroli et Villavallelonga se
      cachent les seules hêtraies séculaires ayant échappé aux coupes régulières ; en 2017, cinq de ces îlots
      forestiers, totalisant plus de 1 000 hectares et comptant des arbres vieux de 560 ans, ont été inscrits
      au Patrimoine mondial aux côtés des forêts primaires de hêtres des Carpates et d'autres régions
      d'Europe. L'if reste rare, cantonné aux secteurs les plus rudes et sauvages du sous-bois. Plus haut,
      entre hêtraie et pelouse d'altitude, pousse le pin nain couché, relique glaciaire emblématique de la
      Camosciara ; et dans la Camosciara et le val Fondillo vit le [pin noir](/especie/pinus_nigra/) de
      Villetta Barrea, variété exclusive du parc héritée de l'ère tertiaire.


      Au-dessus de 1 900-2 000 m s'étendent les pelouses de haute montagne qui, avec prés et clairières,
      représentent plus de 30 % du parc.
    wildlife: >-
      La flore compte plus de 2 000 espèces de plantes vasculaires. Au printemps, en mai et juin, s'épanouit
      l'Iris marsica, endémique stricte de quelques versants rocailleux, tandis que dans les replis les plus
      discrets fleurit l'orchidée reine du parc : le sabot de Vénus, Cypripedium calceolus, présent au cœur de
      la réserve intégrale mais menacé par les cueillettes sauvages.


      Le grand seigneur des lieux est l'[ours brun](/especie/ursus_arctos/) marsicain. Dépassant 200 kg,
      solitaire et placide, sa population n'atteint pas 100 individus. L'apercevoir exige discrétion et
      persévérance : la faune locale se montre extrêmement farouche. Avec patience, silence et respect du
      milieu, on peut espérer croiser isard, ours, loup, cerf et aigle royal.


      L'[isard](/especie/rupicapra_pyrenaica/) des Apennins, endémique tout comme l'ours marsicain, s'est
      sauvé de l'extinction sur les falaises de la Camosciara ; c'est d'ici que provinrent les animaux
      réintroduits dans la Majella et au Gran Sasso. Le [loup](/especie/canis_lupus/) des Apennins est le
      grand prédateur de ces montagnes ; en 1970, il ne restait qu'une dizaine d'individus. Le [cerf
      élaphe](/especie/cervus_elaphus/) avait disparu à la création du parc, et en 1971 les premiers animaux
      furent réintroduits des Alpes orientales ; le [chevreuil](/especie/capreolus_capreolus/), également
      réintroduit, est aujourd'hui le grand herbivore le plus aisé à observer. En 2018, la présence de la
      [loutre d'Europe](/especie/lutra_lutra/) a été formellement confirmée dans les eaux pures du Sangro,
      plus de quarante ans après la dernière observation.


      Côté avifaune, l'[aigle royal](/especie/aquila_chrysaetos/) compte six couples nicheurs dans les parois
      les plus inaccessibles. Les forêts abritent le pic vert et le rare [pic à dos
      blanc](/especie/picoides_lilfordi/), la sous-espèce de Lilford étant typique des hêtraies du mont
      Tranquillo et des monts de la Meta. Les falaises abritent le [crave à bec
      rouge](/especie/pyrrhocorax_pyrrhocorax/) et le chocard, et les torrents le [cincle
      plongeur](/especie/cinclus_cinclus/). Parmi les amphibiens des tourbières figurent la salamandrine à
      lunettes, le triton italien et la salamandre tachetée ; chez les insectes se distinguent l'apollon et la
      [rosalie des Alpes](/especie/rosalia_alpina/).
    visit: >-
      La route nationale 83 Marsicana traverse le parc du nord au sud-est par Pescasseroli, Opi, Villetta
      Barrea, Civitella Alfedena, Barrea et Alfedena, qui constituent les bourgs d'accès. Des centres de
      visiteurs assurent accueil et médiation environnementale dans les villages. Des espaces thématiques se
      consacrent à la faune et au zoo à Pescasseroli, au loup à Civitella Alfedena, à l'eau à Villetta Barrea,
      à l'isard à Opi, au chevreuil à Bisegna, à la flore à Ortona dei Marsi et à l'ours à Pizzone,
      Villavallelonga et Campoli Appennino. Pescasseroli regroupe le siège du parc, le musée naturaliste, le
      musée historique, le jardin botanique, l'arboretum apennin et un parc animalier. Des enclos
      d'observation existent à Civitella Alfedena (loup et lynx) et Villavallelonga (ours et cerf).


      Le réseau officiel répertorie environ 150 itinéraires écotouristiques cumulant plus de 250 km. En zone
      B, la randonnée s'exerce librement. La boucle du Val Cervara traverse une hêtraie ancienne pour
      rejoindre le centre de l'ours à Villavallelonga, et le sentier menant de la Camosciara aux cascades
      présente une difficulté T (touristique). Le parc recommande le printemps et le début d'été pour le
      réveil de la nature et le concert des oiseaux.
    history: >-
      L'idée du parc vit le jour au sortir de la Première Guerre mondiale grâce à l'action du député
      naturaliste Erminio Sipari. Le 25 novembre 1921, Sipari et la Federazione Pro Montibus entreprirent la
      protection d'un premier noyau entre le val Fondillo et la Camosciara. En 1933, le régime fasciste
      supprima l'organisme autonome de gestion ; rétabli en 1951, le parc renforça dès lors la garderie, la
      recherche scientifique et les interdictions cynégétiques.


      L'agrandissement de 1976 au massif du mont Marsicano empêcha l'aménagement d'un vaste domaine skiable
      entre Pescasseroli et Bisegna. Le parc s'articule aujourd'hui en zones : la réserve intégrale restreint
      l'accès sur autorisation scientifique, tandis que la zone B protège forêts et estives.
    before: >-
      Les centres de visiteurs adoptent des horaires saisonniers ; renseignez-vous sur les ouvertures avant
      vos déplacements. En zone de réserve intégrale, l'accès est rigoureusement prohibé sans autorisation
      préalable. La réserve générale réglemente la circulation automobile et la cueillette des produits
      forestiers.
    around: >-
      La [Riserva Naturale Guidata Gole del Sagittario](/lugar/gole-del-sagittario/) est à environ 3 km. À
      douze kilomètres s'élève le [Parco Nazionale della Majella](/lugar/parco-nazionale-della-majella/), où
      ont été réintroduits des isards issus du parc ; les [Gole di Celano - Canyon delle Gole di
      Celano-Aielli](/lugar/gole-di-celano/) se trouvent à seize kilomètres et le [Parco Nazionale del Gran
      Sasso e Monti della Laga](/lugar/parco-nazionale-del-gran-sasso-e-monti-della-laga/) à vingt-sept
      kilomètres.
  de:
    intro: >-
      Gegen Ende des neunzehnten Jahrhunderts überlebten in diesen Gebirgszügen nur noch wenige Marsische
      Braunbären und Apennin-Gämsen. Im Jahr 1921 pachtete ein Naturschutzverband 500 Hektar der Camosciara
      von der Gemeinde Opi im oberen Fondillo-Tal; dieser unscheinbare Winkel wurde zur Keimzelle eines
      heutigen Nationalparks von 50.000 Hektar Fläche, umgeben von 80.000 Hektar Pufferzone.
    landscape: >-
      Die Berge des Parks sind wuchtige Kalkmassive der Monti della Meta: Monte Petroso (2.249 m), Monte
      Marsicano (2.245 m), Monte Meta (2.242 m), Monte Tartaro, Monte Jamiccio, Monte Cavallo und Monte
      Palombo. Die höchsten Gipfel bewahren Spuren der letzten Eiszeit mit Karen und Moränen an den Hängen der
      Meta, Serra delle Gravare, des Petroso und Palombo. Auf der Biscurri-Hochebene schufen einstige
      Gletscher und Schmelzwässer tiefe Dolinen.


      Die Buche regiert unangefochten: Sie bedeckt nahezu 60 % der Parkfläche und gedeiht vor allem zwischen
      900 und 1.800 m Höhe in jahreszeitlich wechselnden Farben. Zwischen Pescasseroli und Villavallelonga
      liegen die einzigen jahrhundertealten Buchenwälder, die Holzeinschlägen entgingen; 2017 wurden fünf
      dieser Altholzbestände mit über 1.000 Hektar und bis zu 560 Jahre alten Bäumen als UNESCO-Welterbe der
      Buchenurwälder der Karpaten und anderer Regionen Europas anerkannt. Eiben sind selten und verbergen sich
      in unzugänglichen Schluchten. Weiter oben, am Übergang zur Almstufe, wächst die Bergkiefer als
      Eiszeitrelikt in der Camosciara; dort und im Fondillo-Tal überdauert die
      Villetta-Barrea-[Schwarzkiefer](/especie/pinus_nigra/), eine botanische Besonderheit des Gebiets aus dem
      Tertiär.


      Oberhalb von 1.900-2.000 m breiten sich alpine Matten aus, die zusammen mit Wiesen und Lichtungen mehr
      als 30 % des Nationalparks einnehmen.
    wildlife: >-
      Über 2.000 höhere Pflanzenarten sind im Schutzgebiet nachgewiesen. Im Mai und Juni blüht die seltene
      Iris marsica, während an verborgenen Plätzen die kostbarste Orchidee des Gebiets gedeiht: der Gelbe
      Frauenschuh, Cypripedium calceolus, der im Herzen der Kernzone wächst und vor unbedachtem Pflücken
      geschützt werden muss.


      Das Wappentier des Parks ist der Marsische [Braunbär](/especie/ursus_arctos/): Mit über 200 kg
      Körpergewicht lebt er einzelgängerisch und scheu; seine Gesamtpopulation zählt weniger als 100 Tiere.
      Ihn zu erspähen verlangt Geduld und Ruhe. Wer sich leise und aufmerksam bewegt, kann je nach Saison
      Gämse, Bär, Wolf, Hirsch und Steinadler erleben.


      Die Apennin-[Pyrenäen-Gämse](/especie/rupicapra_pyrenaica/) überlebte an den Steilwänden der Camosciara
      vor der Ausrottung; von hier stammten jene Tiere, mit denen Bestände in der Majella und am Gran Sasso
      wiederbegründet wurden. Der Apennin-[Wolf](/especie/canis_lupus/) ist das wichtigste Raubtier des
      Gebirges; um 1970 gab es nur noch etwa zehn Exemplare. Der [Rothirsch](/especie/cervus_elaphus/) war bei
      Parkgründung verschwunden und wurde ab 1971 aus den Ostalpen wiederangesiedelt; das ebenfalls
      wiedereingebürgerte [Reh](/especie/capreolus_capreolus/) ist heute das am häufigsten beobachtete
      Schalenwild. 2018 wurde der [Eurasische Fischotter](/especie/lutra_lutra/) im sauberen Wasser des Sangro
      nach über vierzig Jahren Unterbrechung wieder nachgewiesen.


      Unter den Vögeln brütet der [Steinadler](/especie/aquila_chrysaetos/) mit sechs Paaren in abgeschiedenen
      Felswänden. In den Bergwäldern leben Grünspecht und der seltene
      [Weißrückenspecht](/especie/picoides_lilfordi/), dessen Lilford-Unterart die Wälder des Monte Tranquillo
      und der Monti della Meta besiedelt. An Steilwänden nisten
      [Alpenkrähe](/especie/pyrrhocorax_pyrrhocorax/) und Alpendohle, an Bergbächen die
      [Wasseramsel](/especie/cinclus_cinclus/). Unter den Amphibien finden sich Brillensalamander,
      Italienischer Wassermolch und Feuersalamander; unter den Insekten Apollofalter und der seltene
      [Alpenbock](/especie/rosalia_alpina/).
    visit: >-
      Die Staatsstraße 83 Marsicana erschließt das Schutzgebiet von Norden nach Südosten über Pescasseroli,
      Opi, Villetta Barrea, Civitella Alfedena, Barrea und Alfedena, die als Zugänge dienen. In den Gemeinden
      informieren Besucherzentren über Naturräume und Tierwelt: Tiergehege und Natur in Pescasseroli,
      Wolfszentrum in Civitella Alfedena, Wasserausstellung in Villetta Barrea, Gämsenausstellung in Opi,
      Rehzentrum in Bisegna, Flora in Ortona dei Marsi sowie Bärenzentren in Pizzone, Villavallelonga und
      Campoli Appennino. Pescasseroli beherbergt Parkverwaltung, Naturkundemuseum, historisches Museum,
      botanischen Garten, Arboretum und Schaufreiflächen. Gehege mit Wolf und Luchs bestehen in Civitella
      Alfedena, mit Bär und Hirsch in Villavallelonga.


      Rund 150 markierte Ökotourismus-Routen summieren sich auf über 250 km Wegstrecke. In Zone B ist Wandern
      frei gestattet. Die Tour durch das Val Cervara führt durch Altwälder zum Bärenzentrum in
      Villavallelonga, und der Pfad von der Camosciara zu den Wasserfällen ist als leichter Spazierweg
      eingestuft. Der Park empfiehlt Frühling und Frühsommer zur Tierbeobachtung und Blütezeit.
    history: >-
      Die Parkidee entstand nach dem Ersten Weltkrieg auf Initiative des Abgeordneten und Naturschützers
      Erminio Sipari. Am 25. November 1921 begann Sipari gemeinsam mit der Vereinigung Pro Montibus den Schutz
      eines Geländes zwischen Valle Fondillo und Camosciara. 1933 hob das faschistische Regime die autonome
      Parkverwaltung auf; 1951 wiedergegründet, intensivierte der Park Naturschutzüberwachung,
      wissenschaftliche Studien und Jagdverbote.


      Die Erweiterung von 1976 um den Gebirgsstock des Monte Marsicano verhinderte ein Großskigebiet zwischen
      Pescasseroli und Bisegna. Heute gliedert sich das Gebiet in Zonen: Die Kernzone erfordert
      Sondergenehmigungen zu Forschungszwecken, während Zone B naturnahe Wälder und Almweiden umfasst.
    before: >-
      Besucherzentren haben saisonale Öffnungszeiten; prüfe vorab die Zugänglichkeit. In der Kernzone (Zone A)
      ist das Betreten abseits genehmigter Forschung untersagt. Die allgemeine Schutzzone regelt motorisierten
      Verkehr sowie Holz- und Pilzsammeln.
    around: >-
      Das Schutzgebiet [Riserva Naturale Guidata Gole del Sagittario](/lugar/gole-del-sagittario/) liegt etwa
      3 km entfernt. Zwölf Kilometer entfernt liegt der [Parco Nazionale della
      Majella](/lugar/parco-nazionale-della-majella/), der hiesige Gämsen erhielt; die Schlucht [Gole di
      Celano - Canyon delle Gole di Celano-Aielli](/lugar/gole-di-celano/) liegt sechzehn Kilometer entfernt
      und der [Parco Nazionale del Gran Sasso e Monti della
      Laga](/lugar/parco-nazionale-del-gran-sasso-e-monti-della-laga/) siebenundzwanzig Kilometer.
  it:
    intro: >-
      Alla fine dell'Ottocento, tra queste montagne sopravvivevano soltanto pochi orsi bruni marsicani e
      sparuti camosci appenninici. Nel 1921 una federazione prese in affitto 500 ettari della Camosciara dal
      comune di Opi, alla testata della Val Fondillo, e quel minuscolo angolo divenne il germoglio di un parco
      che oggi conta 50.000 ettari, affiancato da altri 80.000 di fascia di protezione esterna.
    landscape: >-
      Le montagne del parco sono possenti sistemi calcarei allineati lungo i Monti della Meta: il Petroso
      (2.249 m), il Marsicano (2.245 m), il Meta (2.242 m), il Tartaro, il Jamiccio, il Cavallo e il Palombo.
      Le vette più elevate custodiscono tracce dell'ultima glaciazione quaternaria, con circhi e morene
      evidenti sui monti della Meta, la Serra delle Gravare, il Petroso e il Palombo. Sull'altopiano di
      Biscurri, le doline furono scavate dagli antichi ghiacciai e dal disgelo.


      Il faggio domina incontrastato. Ricopre quasi il 60 % della superficie del parco e cresce di norma tra i
      900 e i 1.800 m, con tinte che mutano a ogni stagione. Tra Pescasseroli e Villavallelonga allignano le
      uniche faggete secolari scampate ai tagli periodici; nel 2017 cinque di questi nuclei vetusti, estesi
      per oltre 1.000 ettari e con alberi fino a 560 anni, sono stati dichiarati Patrimonio Mondiale
      all'interno delle faggete primordiali dei Carpazi e di altre regioni d'Europa. Il tasso è raro e si
      rifugia nei valloni più selvaggi. Più in alto, tra faggeta e prateria d'altitudine, alligna il pino
      mugo, relitto glaciale della Camosciara; e nella Camosciara e in Val Fondillo il [pino
      nero](/especie/pinus_nigra/) di Villetta Barrea, varietà esclusiva del parco risalente al Terziario.


      Oltre i 1.900-2.000 m si allargano le praterie d'alta quota, che assieme a pascoli e radure rivestono
      più del 30 % del parco.
    wildlife: >-
      La flora annovera oltre 2.000 specie di piante vascolari. In primavera, tra maggio e giugno, fiorisce
      l'Iris marsica, endemismo circoscritto a stazioni rupestri, e nei recessi più appartati la regina delle
      orchidee: la scarpetta di Venere, Cypripedium calceolus, protetta nella riserva integrale ma vulnerabile
      alla raccolta indiscriminata.


      Il sovrano indiscusso è l'[orso bruno](/especie/ursus_arctos/) marsicano. Con oltre 200 kg di peso,
      solitario e cauto, conta una popolazione selvatica inferiore a 100 esemplari. Avvistarlo richiede
      silenzio e discrezione: gli animali sono elusivi. Muovendosi con calma e rispetto, a seconda dei mesi si
      possono scorgere camoscio, orso, lupo, cervo e aquila reale.


      Il [camoscio](/especie/rupicapra_pyrenaica/) appenninico, endemico assieme all'orso marsicano, scampò
      all'estinzione sulle pareti della Camosciara, toponimo che ne ricorda l'estremo rifugio; da qui
      provennero i capi reintrodotti sulla Majella e sul Gran Sasso. Il [lupo grigio](/especie/canis_lupus/)
      appenninico è il predatore chiave del parco e dell'intera catena; nel 1970 sopravvivevano appena dieci
      esemplari. Il [cervo](/especie/cervus_elaphus/) era scomparso alla nascita dell'area protetta e nel 1971
      vennero reintrodotti i primi capi dalle Alpi orientali; il [capriolo](/especie/capreolus_capreolus/),
      anch'esso reintrodotto, è oggi l'ungulato più visibile. Nel 2018 è tornata a essere accertata la
      presenza della [lontra europea](/especie/lutra_lutra/) nelle acque limpide del Sangro, a più di
      quarant'anni dall'ultima segnalazione.


      Tra gli uccelli, l'[aquila reale](/especie/aquila_chrysaetos/) nidifica con sei coppie sulle pareti più
      impervie. Nei boschi vivono picchio verde e il raro [picchio dorsobianco](/especie/picoides_lilfordi/),
      con la sottospecie di Lilford presente nei boschi del monte Tranquillo e dei monti della Meta. Sulle
      rupi allignano [gracchio corallino](/especie/pyrrhocorax_pyrrhocorax/) e gracchio alpino, e lungo i
      torrenti il [merlo acquaiolo](/especie/cinclus_cinclus/). Tra gli anfibi delle torbiere compaiono
      salamandrina dagli occhiali, tritone italiano e salamandra pezzata; tra gli insetti l'apollo e la
      [rosalia alpina](/especie/rosalia_alpina/).
    visit: >-
      La strada statale 83 Marsicana percorre il parco da nord a sud-est toccando Pescasseroli, Opi, Villetta
      Barrea, Civitella Alfedena, Barrea e Alfedena, punti di riferimento per la visita. I centri visite
      svolgono attività informativa e didattica nei borghi: centri natura e zoo a Pescasseroli, del lupo a
      Civitella Alfedena, dell'acqua a Villetta Barrea, del camoscio a Opi, del capriolo a Bisegna, della
      flora a Ortona dei Marsi e dell'orso a Pizzone, Villavallelonga e Campoli Appennino. Pescasseroli ospita
      inoltre la sede del parco, il museo naturalistico, il museo storico, l'orto botanico, l'arboreto
      appenninico e l'area faunistica. Aree faunistiche recintate accolgono lupi e linci a Civitella Alfedena,
      orsi e cervi a Villavallelonga.


      La rete escursionistica conta circa 150 itinerari ecoturistici per oltre 250 km complessivi. In zona B
      il trekking è libero. L'escursione in Val Cervara risale una faggeta vetusta fino al centro orso di
      Villavallelonga, mentre il sentiero che dalla Camosciara raggiunge le cascate ha difficoltà turistica T.
      Il parco raccomanda la primavera e l'inizio dell'estate per godere del risveglio naturale e del canto
      dei volatili.
    history: >-
      L'idea del parco prese forma dopo la prima guerra mondiale grazie all'impegno dell'onorevole e
      naturalista Erminio Sipari. Il 25 novembre 1921 Sipari e la Federazione Pro Montibus avviarono la tutela
      di un primo nucleo tra Val Fondillo e Camosciara. Nel 1933 il regime fascista soppresse l'ente autonomo
      di gestione; ricostituito nel 1951, rafforzò sorveglianza, ricerca scientifica e divieti venatori.


      L'ampliamento del 1976 al massiccio del monte Marsicano sventò un vasto comprensorio sciistico tra
      Pescasseroli e Bisegna. Oggi il parco è suddiviso in zone: la riserva integrale limita l'accesso a
      permessi scientifici, mentre la zona B comprende boschi protetti e praterie montane.
    before: >-
      I centri visite osservano orari legati alla stagionalità; informati prima di partire su aperture e
      accessi. Nella zona di riserva integrale l'accesso è rigorosamente vietato senza autorizzazione. La
      riserva generale disciplina transito veicolare e raccolta di legna e frutti del sottobosco.
    around: >-
      La [Riserva Naturale Guidata Gole del Sagittario](/lugar/gole-del-sagittario/) si trova a circa 3 km. A
      dodici chilometri sorge il [Parco Nazionale della Majella](/lugar/parco-nazionale-della-majella/),
      popolato da camosci nati qui; le [Gole di Celano - Canyon delle Gole di
      Celano-Aielli](/lugar/gole-di-celano/) distano sedici chilometri e il [Parco Nazionale del Gran Sasso e
      Monti della Laga](/lugar/parco-nazionale-del-gran-sasso-e-monti-della-laga/) ventisette chilometri.
  pt:
    intro: >-
      Nos finais do século XIX, apenas alguns raros ursos-pardos-marsicanos e poucas camurças-dos-apeninos
      sobreviviam nestas escarpas. Em 1921 uma federação arrendou 500 hectares da Camosciara ao município de
      Opi, no cimo do vale Fondillo, e esse enclave converteu-se no embrião de um parque que hoje soma 50.000
      hectares, ladeado por outros 80.000 de zona de tampão.
    landscape: >-
      As montanhas do parque constituem imponentes maciços calcários alinhados ao longo dos Monti della Meta:
      o Petroso (2.249 m), o Marsicano (2.245 m), o Meta (2.242 m), o Tartaro, o Jamiccio, o Cavallo e o
      Palombo. As cumeeiras mais altas guardam marcas da última glaciação quaternária, com circos e moreias
      nos montes da Meta, na Serra delle Gravare, no Petroso e no Palombo. No planalto de Biscurri, as dolinas
      foram talhadas por antigos glaciares e pelas águas de degelo.


      A faia comanda a paisagem. Cobre quase 60 % da superfície do parque e prospera geralmente entre os 900 e
      os 1.800 m, variando de tonalidades a cada estação. Entre Pescasseroli e Villavallelonga abrigam-se os
      únicos faiais centenários que escaparam ao corte regular; em 2017 cinco destes núcleos antigos,
      abrangendo mais de 1.000 hectares e com árvores de até 560 anos, foram declarados Património Mundial no
      conjunto das florestas primárias de faias dos Cárpatos e de outras regiões da Europa. O teixo é escasso,
      refugiado nos recantos mais agrestes. Mais acima, entre o faial e os prados de altitude, medra o
      pinheiro-das-rochas como relíquia glaciar na Camosciara; e na Camosciara e no vale Fondillo sobrevive o
      [pinheiro-larício](/especie/pinus_nigra/) de Villetta Barrea, variedade singular do parque com origens
      prováveis no Terciário.


      Acima dos 1.900-2.000 m estendem-se as pastagens de alta montanha que, juntamente com prados e
      clareiras, perfazem mais de 30 % da área protegida.
    wildlife: >-
      A flora vascular supera 2.000 espécies. Na primavera, em maio e junho, floresce a Iris marsica,
      endemismo exclusivo de encostas rochosas, e nos recantos mais reservados surge a rainha das orquídeas: o
      sapatinho-de-vénus, Cypripedium calceolus, resguardado na reserva integral mas exposto ao risco de
      colheita predatória.


      O grande protagonista é o [urso-pardo](/especie/ursus_arctos/) marsicano. Com mais de 200 kg de peso,
      solitário e pacato, a sua população selvagem não atinge 100 espécimes. Avistá-lo exige cautela e
      silêncio, pois a fauna é esquiva. Com calma, paciência e respeito pelo meio ambiente, é possível
      observar camurça, urso, lobo, veado e águia-real.


      A [camurça-dos-pirineus](/especie/rupicapra_pyrenaica/) dos Apeninos, endémica juntamente com o urso
      marsicano, salvou-se da extinção nas faldas da Camosciara; daqui partiram os exemplares reintroduzidos
      na Majella e no Gran Sasso. O [lobo-cinzento](/especie/canis_lupus/) apenínico é o grande predador da
      cordilheira; em 1970 restavam escassos dez indivíduos. O [veado-vermelho](/especie/cervus_elaphus/)
      encontrava-se extinto aquando da instituição do parque, e em 1971 foram reintroduzidos os primeiros
      animais oriundos dos Alpes orientais; a [corça](/especie/capreolus_capreolus/), também reintroduzida, é
      hoje o ungulado mais comum. Em 2018 confirmou-se a presença da [lontra-europeia](/especie/lutra_lutra/)
      nas águas translúcidas do Sangro, mais de quarenta anos após o último registo.


      Entre as aves, a [águia-real](/especie/aquila_chrysaetos/) nidifica com seis casais em falésias
      inóspitas. As matas abrigam o pica-pau-verde e o raro
      [pica-pau-de-dorso-branco](/especie/picoides_lilfordi/), com a subespécie de Lilford associada aos
      velhos faiais do monte Tranquillo e dos montes da Meta. Nas fragas nidificam a
      [gralha-de-bico-vermelho](/especie/pyrrhocorax_pyrrhocorax/) e a gralha-de-bico-amarelo, e nas ribeiras
      o [melro-d'água](/especie/cinclus_cinclus/). Entre os anfíbios dos pauis destacam-se a
      salamandrina-de-lunetas, o tritão-italiano e a salamandra-de-fogo; nos insetos pontuam a borboleta-apolo
      e o besouro [Rosalia alpina](/especie/rosalia_alpina/).
    visit: >-
      A estrada estatal 83 Marsicana cruza o parque de norte a sudeste passando por Pescasseroli, Opi,
      Villetta Barrea, Civitella Alfedena, Barrea e Alfedena, que funcionam como portas de entrada. Os centros
      de acolhimento asseguram a receção e a educação ambiental nas localidades: centros dedicados à fauna em
      Pescasseroli, ao lobo em Civitella Alfedena, à água em Villetta Barrea, à camurça em Opi, à corça em
      Bisegna, à flora em Ortona dei Marsi e ao urso em Pizzone, Villavallelonga e Campoli Appennino.
      Pescasseroli concentra a sede do parque, o museu naturalista, o museu histórico, o jardim botânico, o
      arboreto apenínico e a área faunística. Há cercados com animais em Civitella Alfedena (lobo e lince) e
      em Villavallelonga (urso e veado).


      A rede oficial conta com cerca de 150 percursos ecoturísticos que ultrapassam 250 km de extensão. Na
      zona B o pedestrianismo é livre. A caminhada de Val Cervara atravessa um faial antigo até ao centro do
      urso em Villavallelonga, enquanto o trilho da Camosciara às cascatas tem grau de dificuldade T
      (turístico). O parque sugere a visita na primavera e início do verão para apreciar o desabrochar da
      vegetação e o chilrear das aves.
    history: >-
      A ideia do parque germinou após a Primeira Guerra Mundial por empenho do deputado conservacionista
      Erminio Sipari. A 25 de novembro de 1921 Sipari e a Federação Pro Montibus deram início à gestão
      protegida de um núcleo entre o vale Fondillo e a Camosciara. Em 1933 o regime fascista dissolveu o
      organismo autónomo do parque; restaurado em 1951, consolidou vigilância, investigação científica e
      proibições de caça.


      A ampliação de 1976 ao maciço do monte Marsicano travou um complexo de pistas de esqui entre
      Pescasseroli e Bisegna. O território reparte-se hoje por zonas: a reserva integral restringe o acesso a
      autorizações científicas, enquanto a zona B acolhe florestas e pastagens protegidas.
    before: >-
      Os centros de visitantes têm funcionamento sazonal; confirma os horários de abertura antes de viajares.
      Na reserva integral a entrada é estritamente proibida sem licença prévia. A reserva geral condiciona o
      tráfego automóvel e a apanha de lenha e cogumelos.
    around: >-
      A [Riserva Naturale Guidata Gole del Sagittario](/lugar/gole-del-sagittario/) fica a cerca de 3 km. A
      doze quilómetros ergue-se o [Parco Nazionale della Majella](/lugar/parco-nazionale-della-majella/), para
      onde transitaram camurças aqui nascidas; as [Gole di Celano - Canyon delle Gole di
      Celano-Aielli](/lugar/gole-di-celano/) situam-se a dezasseis quilómetros e o [Parco Nazionale del Gran
      Sasso e Monti della Laga](/lugar/parco-nazionale-del-gran-sasso-e-monti-della-laga/) a vinte e sete
      quilómetros.
