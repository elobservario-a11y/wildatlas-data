    El mayor lugar de descanso e invernada de aves migratorias del interior de Baja Sajonia, rodeado de uno de
    los mayores prados húmedos del noroeste de Alemania.
  en: >-
    The foremost staging and wintering waterbird haven in inland Lower Saxony, framed by one of northwestern
    Germany’s largest wet meadow expanses.
  fr: >-
    Le premier site de repos et d’hivernage d’oiseaux d’eau de l’intérieur de la Basse-Saxe, entouré d’un des
    plus grands prés humides du nord-ouest allemand.
  de: >-
    Bedeutendster Rast- und Überwinterungsplatz für Wasservögel im niedersächsischen Binnenland, umgeben von
    einem der größten Feuchtgrünländer Nordwestdeutschlands.
  it: >-
    Il principale sito d’invernata per l’avifauna acquatica nell’entroterra della Bassa Sassonia, incorniciato
    da uno dei maggiori prati umidi della Germania.
  pt: >-
    O maior refúgio de descanso e invernada de aves aquáticas no interior da Baixa Saxónia, rodeado por uma
    das maiores pastagens húmidas do noroeste alemão.
