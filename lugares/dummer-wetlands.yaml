    El segundo lago dulceacuícola más grande de Baja Sajonia rodeado de prados húmedos de nidificación de
    limícolas.
  en: Lower Saxony’s second-largest freshwater lake surrounded by vast wet meadows vital for breeding waders.
  fr: >-
    Le deuxième plus grand lac naturel de Basse-Saxe ceinturé de vastes prairies humides idéales pour la
    nidification des limicoles.
  de: >-
    Niedersachsens zweitgrößter Binnensee, umrahmt von ausgedehnten Feuchtwiesen als Brutrevier bedrohter
    Wiesenbrüter.
  it: >-
    Il secondo lago naturale della Bassa Sassonia cinto da estesi prati allagati per la nidificazione dei
    limicoli.
  pt: >-
    O segundo maior lago natural da Baixa Saxónia cercado por vastos prados húmidos essenciais para a
    nidificação de aves limícolas.
unico:
