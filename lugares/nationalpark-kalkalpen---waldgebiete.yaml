resumen:
  es: >-
    El mayor bosque frondoso continuo de Austria y la mayor zona de regeneración salvaje de los Alpes
    calcáreos.
  en: >-
    Austria's largest contiguous tract of broadleaf forest and the grandest wilderness recovery area in the
    Northern Limestone Alps.
  fr: >-
    Le plus grand massif forestier continu de feuillus d’Autriche et la plus vaste zone de régénération
    sauvage des Préalpes calcaires.
  de: >-
    Österreichs größtes zusammenhängendes Laubwaldgebiet und die größte Waldwildniszone der Nördlichen
    Kalkalpen.
  it: >-
    Il più grande manto forestale continuo di latifoglie dell’Austria e la principale riserva di
    riforestazione naturale delle Alpi calcaree.
  pt: >-
    A maior mancha florestal contínua de folhosas da Áustria e a mais vasta zona de renaturalização selvagem
    dos Alpes calcários.
unico:
  es: >-
    Los árboles crecen, envejecen y mueren como dicta la naturaleza, y por eso viven aquí las especies de
    bosque primario que solo sobreviven donde hay árboles viejos y madera muerta.
  en: >-
    Trees sprout, age, and decay under purely natural dynamics, sheltering old-growth specialist species
    dependent on standing veteran trees and abundant deadwood.
  fr: >-
    Les arbres germent, vieillissent et meurent selon les lois de la nature, abritant des espèces de forêt
    primaire qui ne survivent que sur les vieux troncs sénescents.
  de: >-
    Bäume keimen, altern und vergehen nach den Gesetzen der Natur; daher leben hier Urwaldarten, die auf
    Totholz und Altbäume angewiesen sind.
  it: >-
    Gli alberi crescono, invecchiano e cadono secondo i ritmi della natura, offrendo rifugio a specie di
    foresta primaria legate a tronchi senescenti e legno morto.
  pt: >-
    As árvores germinam, envelhecem e decompõem-se segundo os ditames da natureza, acolhendo espécies de
    floresta virgem dependentes de árvores velhas e madeira morta.
observaciones:
  es: >-
    No hay obligación de ir por senderos, pero se pide usar los marcados; las zonas húmedas y turberas están
    prohibidas. Se puede escalar solo en zonas y épocas permitidas; en la Kampermauer, en Hengstpass, hay
    prohibición de escalar hasta el 15 de julio para proteger a las aves que anidan en la roca. Las bicicletas
    solo circulan del 15 de abril al 31 de octubre, desde dos horas después del amanecer hasta una hora antes
    del ocaso. Revisa los cierres, desvíos y avisos de peligro antes de salir.
texto:
  es:
    intro: >-
      En 1985, opositores a una central eléctrica ocuparon el Hintergebirge, y la empresa renunció a sus
      planes de embalses. Aquella montaña, casi sin habitantes, es hoy el corazón de la mayor selva de
      Austria. El Parque Nacional Kalkalpen protege unos 209 km² en el Sengsengebirge y el Reichraminger
      Hintergebirge, y 16.502 hectáreas de su superficie son «Waldwildnis», bosque salvaje: algo que no existe
      en ningún otro lugar del país.
    landscape: >-
      El parque sube de los 385 a los 1.963 m y reúne 30 tipos de bosque. Es también un parque de agua: más de
      800 manantiales alimentan el sistema de arroyos más largo de los Alpes orientales sin tocar, en
      gargantas de dolomía y torrentes de montaña del Reichraminger Hintergebirge.


      El haya manda: los hayedos antiguos de este parque y los del área salvaje de Dürrenstein-Lassingtal
      fueron declarados Patrimonio Natural Mundial en 2017, el primero de Austria. En un resto de bosque
      primario del Sengsengebirge crece el haya más antigua que se conoce en los Alpes. Hay 32 especies de
      árboles, la mitad de las 65 que existen en Austria, y más de 50 de arbustos; entre ellos, la pera
      silvestre Amelanchier ovalis, con flores vistosas en primavera. Prados de siega y pastos de montaña son
      islas en un mar de bosque, y dan hábitat a plantas y animales que necesitan paisaje abierto.
    wildlife: >-
      Del longicornio alpino al [lince](/especie/lynx_lynx/), el parque es hogar y refugio de muchos animales
      raros. Han vuelto el [águila real](/especie/aquila_chrysaetos/), la [nutria](/especie/lutra_lutra/), el
      lince y el [halcón peregrino](/especie/falco_peregrinus/), y se ha instalado la [cigüeña
      negra](/especie/ciconia_nigra/). Hay ocho territorios de águila real y 55 especies de mamíferos, 17 de
      ellas murciélagos. El lince es un cazador muy esquivo, pero las cámaras trampa lo han confirmado: es la
      mayor gata de bosque de Austria.


      El [pico dorsiblanco](/especie/dendrocopos_leucotos/) es el pájaro carpintero más raro de Austria y la
      especie de ave más importante del parque. Convive con el mochuelo boreal y el papamoscas papirrojo, en
      alta densidad. Entre los escarabajos, el [longicornio alpino](/especie/rosalia_alpina/), hoy raro, tiene
      aquí su población más importante de Austria; en total hay 41 especies confirmadas de bosque primario. Y
      hay más de 1.600 especies de mariposas, más que en ningún otro espacio protegido de Austria.


      El año tiene su calendario. En primavera, los rangers te llevan a ver el cortejo del [gallo
      lira](/especie/tetrao_tetrix/) o a salidas ornitológicas. A mediados y finales de septiembre llega la
      berrea, que se puede ver con los rangers en el Bodinggraben, mientras los rebecos están en el
      Sengsengebirge. El ciervo es tímido: sus sentidos superan los nuestros y se retira al bosque. En
      octubre, el hayedo está en su momento más colorido, con hojas amarillo anaranjadas. La temporada
      recomendada va de mayo a octubre.
    visit: >-
      El parque se camina. El Buchensteig, en Reichraming, sigue un viejo camino de leñadores y campesinos
      hacia el Hintergebirge, con dos etapas: 3,5 km hasta Wilder Graben y 6 km hasta Große Klause, unas tres
      horas y media por trayecto. En el valle de Weißenbach hay un circuito de dos a tres horas que enseña
      cómo el paisaje pasó de bosque de carboneo a bosque comercial y de ahí a bosque natural. La ruta a
      Blahbergalm desde Weißwasser, de cuatro horas y media a cinco, sigue las huellas de los mineros que
      extraían bauxita. Y el paseo por el Bodinggraben hasta Blumaueralm es suave y apto para cochecitos y
      sillas de ruedas con ayuda hasta el Jagahäusl.


      En bici hay 500 km de rutas de montaña bien señalizadas, desde el fácil Hintergebirgsradweg hasta
      subidas a refugios. El Buchensteig puede hacerse de vuelta por el carril bici del Hintergebirge, ocho
      kilómetros de grava. Para dormir al aire libre hay dos zonas de vivac, Weißwasser y Steyrsteg, abiertas
      de mayo a octubre; hay que apuntarse en el centro de visitantes Ennstal.


      El centro de visitantes Ennstal, en Reichraming, y la torre panorámica de Wurbauerkogel, cerca de
      Windischgarsten, tienen exposiciones sobre los animales del bosque y de la roca; desde la torre se ve un
      panorama de 21 cumbres de más de dos mil metros. Por la noche, el parque forma parte del
      Naturnachtgebiet Eisenwurzen, la mayor reserva de cielo oscuro de Austria, certificada por Dark Sky
      International.
    history: >-
      Hay artefactos de cazadores del Paleolítico, de entre 18.000 y 10.000 a. C., en la cueva Nixloch. En
      tiempos más recientes se talló mucho bosque para la industria del hierro de la Eisenwurzen, y la
      ferrovía forestal de Reichraming funcionó hasta principios de los años setenta.


      El parque nació de la resistencia a esas obras. El 5 de diciembre de 1996 el Parlamento de Alta Austria
      aprobó por unanimidad la ley del parque nacional. Hoy es categoría II de la UICN, espacio Ramsar y de la
      red europea Natura, y el 89 % es zona natural.
    before: >-
      No hay obligación de ir por senderos, pero se pide usar los marcados; las zonas húmedas y turberas están
      prohibidas. Se puede escalar solo en zonas y épocas permitidas; en la Kampermauer, en Hengstpass, hay
      prohibición de escalar hasta el 15 de julio para proteger a las aves que anidan en la roca. Las
      bicicletas solo circulan del 15 de abril al 31 de octubre, desde dos horas después del amanecer hasta
      una hora antes del ocaso. Revisa los cierres, desvíos y avisos de peligro antes de salir.
    around: >-
      A unos trece kilómetros está el [Parque Nacional Gesäuse - Garganta del
      Enns](/lugar/nationalpark-gesause---enns-gorge/), y a unos veinticuatro el [Grupo del
      Hochschwab](/lugar/hochschwabgruppe/). El parque se solapa en parte con el [Totes Gebirge - Desierto
      Kárstico](/lugar/totes-gebirge---karst-desert/).
  en:
    intro: >-
      In 1985, grassroots environmentalists occupied the remote Hintergebirge, compelling power companies to
      scrap proposed hydroelectric dams. That depopulated mountain redoubt is today the heart of Austria's
      largest forest wilderness. Kalkalpen National Park safeguards some 209 km² across the Sengsengebirge and
      Reichraminger Hintergebirge, with 16,502 hectares designated as strict «Waldwildnis» (forest
      wilderness)—an ecological scale unmatched anywhere else in the nation.
    landscape: >-
      The park ascends from 385 to 1,963 m across 30 distinct woodland associations. It is equally a realm of
      water: over 800 pristine springs nourish the longest undisturbed stream system in the Eastern Alps,
      tumbling through dolomite gorges and mountain torrents in the Reichraminger Hintergebirge.


      European beech reigns supreme: the ancient beechwoods of this park alongside those of the
      Dürrenstein-Lassingtal Wilderness Area were inscribed as Austria's very first UNESCO Natural World
      Heritage site in 2017. In a primeval relict grove in the Sengsengebirge grows the oldest known European
      beech in the Alps. The park harbours 32 native tree species—half of all 65 native to Austria—and over 50
      shrub species, including snowy mespilus (Amelanchier ovalis), blossoming brightly in spring. Hay meadows
      and alpine pastures form open islands in a sea of forest, providing refuge for species dependent on
      sunlit ecotones.
    wildlife: >-
      From the Rosalia longicorn to the [Eurasian lynx](/especie/lynx_lynx/), the park serves as a primeval
      sanctuary for endangered species. The [golden eagle](/especie/aquila_chrysaetos/), [Eurasian
      otter](/especie/lutra_lutra/), lynx, and [peregrine falcon](/especie/falco_peregrinus/) have returned,
      joined by breeding [black storks](/especie/ciconia_nigra/). Eight golden eagle territories span the
      range, alongside 55 mammal species including 17 species of bats. The lynx remains an exceptionally
      elusive predator, but camera traps consistently confirm resident breeding: it represents Austria's
      largest wild feline.


      The [white-backed woodpecker](/especie/dendrocopos_leucotos/) is Austria's rarest woodpecker and the
      park's foremost avian flagship species, coexisting in remarkable densities with boreal owls and
      red-breasted flycatchers. Among saproxylic beetles, the [Rosalia longicorn](/especie/rosalia_alpina/)
      finds its most significant Austrian population here, amid 41 confirmed primeval forest relict insect
      species. Over 1,600 butterfly and moth species have been recorded—the highest diversity of any Austrian
      protected area.


      The seasons guide the wildlife calendar: in spring, rangers lead tours to watch [black
      grouse](/especie/tetrao_tetrix/) displaying on lekking grounds or birdwatching expeditions. In mid to
      late September the deer rut echoes across Bodinggraben, while chamois seek higher crags in the
      Sengsengebirge. In October the beech canopy turns brilliant golden-orange. The recommended visiting
      season runs from May to October.
    visit: >-
      The park is best explored on foot. The Buchensteig in Reichraming follows an old historic woodsman trail
      into the Hintergebirge across two legs: 3.5 km to Wilder Graben and 6 km to Große Klause, taking roughly
      three and a half hours each way. The Weißenbach valley features a two to three-hour loop illustrating
      the transition from charcoal-burners' forest to commercial timberland and onward to unmanaged
      wilderness. The hike to Blahbergalm from Weißwasser takes four and a half to five hours, following old
      bauxite miners' tracks. The stroll through Bodinggraben to Blumaueralm is gentle and barrier-free up to
      the Jagahäusl.


      Mountain bikers enjoy 500 km of waymarked alpine tracks, ranging from the gentle Hintergebirgsradweg to
      steep hut climbs. The Buchensteig can be combined into a loop returning via the Hintergebirge cycle
      path, covering eight kilometres of gravel. For wilderness overnight stays, two designated bivouac
      meadows at Weißwasser and Steyrsteg operate from May to October; registration via the Ennstal visitor
      centre is required.


      The Ennstal visitor centre in Reichraming and the panoramic Wurbauerkogel tower near Windischgarsten
      present wildlife and geology exhibitions; the tower looks out upon a panoramic vista of 21 peaks
      exceeding two thousand metres. By night, the park forms part of the Eisenwurzen Dark Sky Reserve,
      certified by Dark Sky International.
    history: >-
      Archaeological finds left by Paleolithic hunters between 18,000 and 10,000 BC were discovered in the
      Nixloch cave. In later centuries, extensive felling fueled the ironworks of the Eisenwurzen, and the
      historic logging railway of Reichraming operated until the early seventies.


      The national park arose directly from grassroots protests against industrial damming. On 5 December
      1996, the Upper Austrian Parliament unanimously passed the National Park Act. Today it holds IUCN
      Category II status, Ramsar wetland designation, and European Natura network protection, with 89 %
      dedicated to strict wilderness.
    before: >-
      There is no strict trail-confinement rule, but visitors are urged to use marked paths; entering
      sensitive mires and wetlands is prohibited. Rock climbing is permitted only in designated sectors and
      outside breeding seasons; on the Kampermauer at Hengstpass climbing is closed until 15 July to protect
      cliff-nesting raptors. Mountain biking is allowed exclusively from 15 April to 31 October, between two
      hours after sunrise and one hour before sunset. Always review safety alerts and closures before
      departing.
    around: >-
      Around thirteen kilometres away lies [Gesäuse National Park - Enns
      Gorge](/lugar/nationalpark-gesause---enns-gorge/), and some twenty-four kilometres away rises the
      [Hochschwab Group](/lugar/hochschwabgruppe/). The park also partially overlaps the [Totes Gebirge Karst
      Desert](/lugar/totes-gebirge---karst-desert/).
  fr:
    intro: >-
      En 1985, des militants écologistes occupèrent le Hintergebirge, contraignant les promoteurs à abandonner
      leurs projets de barrages hydroélectriques. Ce massif montagnard désert est aujourd’hui le cœur de la
      plus grande forêt sauvage d’Autriche. Le Parc national de Kalkalpen protège environ 209 km² dans le
      Sengsengebirge et le Reichraminger Hintergebirge, et 16 502 hectares de sa surface sont classés «
      Waldwildnis », une zone de nature sauvage forestière sans équivalent dans le pays.
    landscape: >-
      Le parc s’étage de 385 à 1 963 m d’altitude et rassemble 30 types forestiers distincts. C’est également
      un sanctuaire aquatique : plus de 800 sources karstiques alimentent le plus long réseau de torrents
      intacts des Alpes orientales, dévalant gorges dolomitiques et ravins du Reichraminger Hintergebirge.


      Le hêtre domine : les hêtraies anciennes du parc et celles de la zone de nature sauvage de
      Dürrenstein-Lassingtal ont été inscrites au patrimoine mondial de l’UNESCO en 2017, une première
      naturelle pour l’Autriche. Dans un vestige de forêt primaire du Sengsengebirge grandit le hêtre le plus
      âgé connu dans tout l’arc alpin. On compte 32 espèces d’arbres indigènes, soit la moitié des 65
      présentes en Autriche, et plus de 50 arbustes, dont l’amélanchier à feuilles ovales aux fleurs
      printanières éclatantes. Prairies de fauche et alpages composent des îles pastorales au sein d’une mer
      d’arbres.
    wildlife: >-
      De la rosalie des Alpes au [lynx boréal](/especie/lynx_lynx/), le parc sert de refuge à de nombreuses
      raretés fauniques. L’[aigle royal](/especie/aquila_chrysaetos/), la [loutre
      d’Europe](/especie/lutra_lutra/), le lynx et le [faucon pèlerin](/especie/falco_peregrinus/) sont
      revenus, rejoints par la nidification de la [cigogne noire](/especie/ciconia_nigra/). Huit territoires
      d’aigles royaux sont occupés, aux côtés de 55 mammifères dont 17 espèces de chauves-souris. Les pièges
      photographiques attestent la reproduction régulière du lynx, le plus grand félin sauvage d’Autriche.


      Le [pic à dos blanc](/especie/dendrocopos_leucotos/) est le pic le plus rare d’Autriche et l’oiseau
      emblématique du parc, cohabitant en fortes densités avec la chouette de Tengmalm et le gobe-mouche nain.
      Parmi les coléoptères saproxyliques, la [rosalie des Alpes](/especie/rosalia_alpina/) possède ici sa
      population autrichienne la plus prospère, parmi 41 espèces reliques de forêts primaires. On recense plus
      de 1 600 papillons, une diversité sans égal en Autriche.


      Le calendrier faunique rythme l’année : au printemps, les rangers guident vers les arènes de parade du
      [tétras lyre](/especie/tetrao_tetrix/). À la mi-septembre résonne le brame du cerf dans le Bodinggraben,
      tandis que les chamois occupent les crêtes du Sengsengebirge. En octobre, les hêtraies flamboient de
      teintes dorées. La période conseillée s’étend de mai à octobre.
    visit: >-
      Le parc se découvre à pied. Le Buchensteig, à Reichraming, emprunte un ancien sentier de bûcherons vers
      le Hintergebirge en deux tronçons : 3,5 km jusqu’à Wilder Graben et 6 km jusqu’à Große Klause, soit
      trois heures et demie par étape. Dans la vallée de Weißenbach, une boucle de deux à trois heures
      illustre le passage de la forêt charbonnière à la forêt commerciale puis à la libre évolution. La montée
      à la Blahbergalm depuis Weißwasser demande quatre heures et demie à cinq heures sur les traces des
      mineurs de bauxite. La promenade du Bodinggraben à la Blumaueralm est accessible aux poussettes et
      fauteuils roulants avec aide jusqu’au Jagahäusl.


      À vélo, 500 km d’itinéraires VTT balisés s’offrent aux cyclistes, de la piste facile du
      Hintergebirgsradweg aux montées de refuges. Le Buchensteig peut se boucler en retour par la piste du
      Hintergebirge sur huit kilomètres de gravier. Pour bivouaquer, deux aires aménagées à Weißwasser et
      Steyrsteg ouvrent de mai à octobre sur inscription au centre Ennstal.


      Le centre de visiteurs Ennstal à Reichraming et la tour du Wurbauerkogel près de Windischgarsten
      abritent des expositions naturalistes ; la tour dévoile un panorama de 21 sommets dépassant deux mille
      mètres. La nuit, le parc s’intègre à la réserve de ciel étoilé d’Eisenwurzen, certifiée par Dark Sky
      International.
    history: >-
      Des vestiges de chasseurs paléolithiques datés entre 18 000 et 10 000 avant notre ère ont été découverts
      dans la grotte du Nixloch. Aux époques modernes, les forêts furent exploitées pour la métallurgie de
      l’Eisenwurzen et le chemin de fer forestier de Reichraming fonctionna jusqu’au début des années
      soixante-dix.


      Le parc naquit de la contestation contre les grands barrages. Le 5 décembre 1996, le Parlement de
      Haute-Autriche adopta à l’unanimité la loi créant le parc national. C’est aujourd’hui un site de
      catégorie II de l’UICN, une zone Ramsar et un site du réseau européen Natura dont 89 % est voué à la
      nature sauvage intégrale.
    before: >-
      Le cheminement n’est pas strictement confiné aux pistes, mais vous êtes instamment prié de suivre les
      sentiers balisés ; l’accès aux tourbières et zones humides est interdit. L’escalade est encadrée : au
      Kampermauer sur le Hengstpass, elle est interdite jusqu’au 15 juillet pour protéger la nidification
      rupestre des rapaces. Les vélos ne circulent que du 15 avril au 31 octobre, de deux heures après le
      lever du soleil à une heure avant son coucher. Vérifiez les avis de fermeture avant votre départ.
    around: >-
      À environ treize kilomètres se trouve le [Parc national de Gesäuse - Gorge de
      l’Enns](/lugar/nationalpark-gesause---enns-gorge/) et à environ vingt-quatre kilomètres s’élève le
      [Massif du Hochschwab](/lugar/hochschwabgruppe/). Le parc chevauche également en partie le [Totes
      Gebirge - Désert karstique](/lugar/totes-gebirge---karst-desert/).
  de:
    intro: >-
      1985 besetzten Naturschützer das Hintergebirge, woraufhin die Kraftwerkspläne aufgegeben wurden. Dieses
      menschenleere Bergland ist heute das Herz der größten Waldwildnis Österreichs. Der Nationalpark
      Kalkalpen schützt rund 209 km² im Sengsengebirge und Reichraminger Hintergebirge, wovon 16.502 Hektar
      als echte «Waldwildnis» ausgewiesen sind—eine Dimension, die es in Österreich sonst nirgends gibt.
    landscape: >-
      Der Park reicht von 385 bis auf 1.963 m hinauf und vereint 30 verschiedene Waldgesellschaften. Er ist
      auch ein Reich des Wassers: Über 800 Quellen speisen das längste unberührte Fließgewässersystem der
      Ostalpen in den Dolomitschluchten des Reichraminger Hintergebirges.


      Die Rotbuche dominiert: Die alten Buchenwälder dieses Parks wurden zusammen mit jenen des
      Wildnisgebietes Dürrenstein-Lassingtal im Jahr 2017 zum ersten UNESCO-Weltnaturerbe Österreichs erklärt.
      In einem Urwaldrest im Sengsengebirge wächst die älteste bekannte Buche der Alpen. 32 Baumarten kommen
      vor—die Hälfte aller 65 heimischen Baumarten Österreichs—und über 50 Straucharten, darunter die
      Felsenbirne (Amelanchier ovalis). Mähwiesen und Almen bilden offene Inseln im Waldmeer.
    wildlife: >-
      Vom Alpenbock bis zum [Eurasischen Luchs](/especie/lynx_lynx/) ist der Park ein Refugium für seltene
      Tierarten. [Steinadler](/especie/aquila_chrysaetos/), [Fischotter](/especie/lutra_lutra/), Luchs und
      [Wanderfalke](/especie/falco_peregrinus/) sind zurückgekehrt; auch der
      [Schwarzstorch](/especie/ciconia_nigra/) brütet hier wieder. Acht Steinadlerreviere sind besetzt, und 55
      Säugetierarten—darunter 17 Fledermäuse—leben im Park. Fotofallen belegen die regelmäßige Reproduktion
      des Luchses, der größten Wildkatzenart des Landes.


      Der [Weißrückenspecht](/especie/dendrocopos_leucotos/) ist Österreichs seltenster Specht und die
      bedeutendste Leitart des Parks, der hier in hoher Dichte mit Raufußkauz und Zwergschnäpper lebt. Unter
      den Käfern besitzt der [Alpenbock](/especie/rosalia_alpina/) sein bedeutendstes österreichisches
      Vorkommen inmitten von 41 nachgewiesenen Urwaldreliktarten. Über 1.600 Schmetterlingsarten wurden
      gezählt—mehr als in jedem anderen Schutzgebiet Österreichs.


      Die Jahreszeiten setzen Akzente: Im Frühjahr führen Ranger zur Balz des
      [Birkhuhns](/especie/tetrao_tetrix/). Mitte September beginnt die Hirschbrunft im Bodinggraben, während
      Gämsen die Felsgrate des Sengsengebirges aufsuchen. Im Oktober erstrahlen die Buchenwälder in
      leuchtendem Goldgelb. Die empfohlene Besuchszeit reicht von Mai bis Oktober.
    visit: >-
      Der Park will erwandert werden. Der Buchensteig in Reichraming folgt einem alten Holzknechtweg ins
      Hintergebirge in zwei Etappen: 3,5 km bis zum Wilden Graben und 6 km bis zur Großen Klause (Gehzeit je
      Etappe rund dreieinhalb Stunden). Im Weißenbachtal zeigt ein Rundweg von zwei bis drei Stunden den
      Wandel vom Köhlerwald zum Wirtschaftswald und zur Wildnis. Die Wanderung zur Blahbergalm ab Weißwasser
      dauert viereinhalb bis fünf Stunden auf den Spuren historischer Bauxitknappen. Der Spaziergang durch den
      Bodinggraben zur Blumaueralm ist kinderwagen- und rollstuhlgerecht bis zum Jagahäusl.


      Für Mountainbiker stehen 500 km markierte Radrouten bereit, vom gemütlichen Hintergebirgsradweg bis zu
      anspruchsvollen Almtouren. Der Buchensteig lässt sich über den Hintergebirgsradweg auf acht Kilometern
      Schotter als Rundtour schließen. Für Freiluftübernachtungen gibt es zwei Biwakplätze in Weißwasser und
      am Steyrsteg von Mai bis Oktober (Voranmeldung im Besucherzentrum Ennstal).


      Das Besucherzentrum Ennstal in Reichraming und der Panoramaturm Wurbauerkogel bei Windischgarsten bieten
      Ausstellungen; der Turm gewährt einen Rundblick auf 21 Zweitausender. Nachts gehört der Park zum
      Lichtschutzgebiet Eisenwurzen (Dark Sky Reserve).
    history: >-
      Funde steinzeitlicher Jäger aus der Zeit zwischen 18.000 und 10.000 v. Chr. wurden in der Nixloch-Höhle
      entdeckt. Später wurde viel Holz für das Eisenwesen der Eisenwurzen geschlagen; die Waldbahn Reichraming
      verkehrte bis Anfang der siebziger Jahre.


      Der Park entstand aus dem Bürgerprotest gegen Großstaustufen: Am 5. Dezember 1996 beschloss der
      Oberösterreichische Landtag einstimmig das Nationalparkgesetz. Heute ist er IUCN-Kategorie II,
      Ramsar-Gebiet und Teil des europäischen Natura-Netzwerks, wobei 89 % der Fläche als Naturzone gelten.
    before: >-
      Es gilt kein striktes Wegegebot, doch wird gebeten, die markierten Wege zu nutzen; Moore und
      Feuchtgebiete dürfen nicht betreten werden. Klettern ist nur in ausgewiesenen Zonen erlaubt; an der
      Kampermauer am Hengstpass gilt bis zum 15. Juli ein Kletterverbot zum Vogelschutz. Radfahren ist
      ausschließlich vom 15. April bis 31. Oktober von zwei Stunden nach Sonnenaufgang bis eine Stunde vor
      Sonnenuntergang gestattet. Prüfe vorab Gefahrenmeldungen.
    around: >-
      Rund dreizehn Kilometer entfernt liegt der [Nationalpark Gesäuse -
      Ennsschlucht](/lugar/nationalpark-gesause---enns-gorge/) und etwa vierundzwanzig Kilometer entfernt ragt
      die [Hochschwabgruppe](/lugar/hochschwabgruppe/) auf. Das Areal überschneidet sich teilweise mit dem
      [Toten Gebirge - Karstwüste](/lugar/totes-gebirge---karst-desert/).
  it:
    intro: >-
      Nel 1985 gli oppositori a un grande invaso idroelettrico occuparono lo Hintergebirge, inducendo i
      promotori a rinunciare alle dighe. Quel massiccio disabitato costituisce oggi il cuore della più vasta
      foresta selvaggia d’Austria. Il Parco Nazionale Kalkalpen protegge circa 209 km² tra il Sengsengebirge e
      il Reichraminger Hintergebirge, con 16.502 ettari rigorosamente destinati a riserva integrale boschiva
      («Waldwildnis»), un’estensione senza paragoni nel paese.
    landscape: >-
      Il parco si innalza da quota 385 fino ai 1.963 m e racchiude 30 tipologie forestali distinte. È anche un
      immenso bacino idrografico: oltre 800 sorgenti alimentano il sistema torrentizio integro più lungo delle
      Alpi orientali, inciso nelle gole dolomitiche del Reichraminger Hintergebirge.


      Il faggio regna incontrastato: le faggete vetuste di questo parco e quelle dell’area selvaggia di
      Dürrenstein-Lassingtal sono state proclamate Patrimonio Naturale Mondiale UNESCO nel 2017, primato
      assoluto per l’Austria. In un lembo di bosco vergine del Sengsengebirge prospera il faggio più antico
      censito nell’intero arco alpino. Si contano 32 specie arboree autoctone, la metà delle 65 presenti in
      Austria, e oltre 50 arbusti, tra cui il pero corvino (Amelanchier ovalis) con fioriture primaverili
      candide. Praterie falciate e alpeggi formano radure aperte nel fitto del bosco.
    wildlife: >-
      Dalla rosalia alpina alla [lince eurasiatica](/especie/lynx_lynx/), il parco costituisce un rifugio
      d’eccezione. Sono tornati l’[aquila reale](/especie/aquila_chrysaetos/), la [lontra
      europea](/especie/lutra_lutra/), la lince e il [falco pellegrino](/especie/falco_peregrinus/), con la
      nidificazione confermata della [cicogna nera](/especie/ciconia_nigra/). Si contano otto territori
      stabili di aquila reale e 55 specie di mammiferi, tra cui 17 chirotteri. Le fototrappole documentano
      costantemente la riproduzione della lince, il felino selvatico più grande d’Austria.


      Il [picchio dorsobianco](/especie/dendrocopos_leucotos/) è il picide più raro d’Austria e la specie
      ornitica simbolo del parco, presente ad alte densità con la civetta capogrosso e il pigliamosche
      pettirosso. Tra i coleotteri lignicoli, il [cerambice del faggio](/especie/rosalia_alpina/) annovera qui
      la popolazione più importante d’Austria, affiancato da 41 specie relitte di bosco vetusto. Si registrano
      oltre 1.600 specie di lepidotteri, un record per le aree protette austriache.


      Il calendario naturale guida le stagioni: in primavera i guardaparco organizzano uscite per le parate
      nuziali del [fagiano di monte](/especie/tetrao_tetrix/). A metà settembre risuona il bramito del cervo
      nel Bodinggraben, mentre i camosci popolano i crinali del Sengsengebirge. In ottobre il foliage dei
      faggi si tinge di giallo dorato. La stagione consigliata va da maggio a ottobre.
    visit: >-
      Il parco si esplora a piedi. Il Buchensteig a Reichraming ricalca un sentiero storico di boscaioli verso
      lo Hintergebirge in due tappe: 3,5 km fino a Wilder Graben e 6 km fino a Große Klause, per circa tre ore
      e mezza a tratta. Nella valle di Weißenbach un percorso ad anello di due o tre ore narra il passaggio
      dal bosco dei carbonai alla foresta commerciale e poi alla riserva naturale. L’itinerario per la
      Blahbergalm da Weißwasser richiede da quattro ore e mezza a cinque ore sulle orme dei minatori di
      bauxite. La passeggiata dal Bodinggraben alla Blumaueralm è pianeggiante e accessibile a carrozzine fino
      al Jagahäusl.


      In bicicletta sono disponibili 500 km di piste sterrate segnate, dalla dolce Hintergebirgsradweg a
      salite per rifugi alpini. Il Buchensteig può essere completato ad anello rientrando sulla ciclabile
      dello Hintergebirge per otto chilometri di ghiaia. Per il pernottamento all’aperto esistono due aree
      bivacco attrezzate a Weißwasser e Steyrsteg, operative da maggio a ottobre previa registrazione al
      centro visite Ennstal.


      Il centro visite Ennstal a Reichraming e la torre del Wurbauerkogel presso Windischgarsten ospitano
      esposizioni naturalistiche; dalla torre si gode una visuale su 21 vette oltre i duemila metri. Di notte
      il parco fa parte della riserva di cielo stellato Eisenwurzen, certificata da Dark Sky International.
    history: >-
      Reperti di cacciatori paleolitici datati tra 18.000 e 10.000 a.C. sono stati rinvenuti nella grotta
      Nixloch. In epoca storica si tagliò molto legname per le fucine dell’Eisenwurzen e la ferrovia forestale
      di Reichraming restò attiva fino ai primi anni settanta.


      Il parco nacque dalle mobilitazioni contro i bacini artificiali: il 5 dicembre 1996 il parlamento
      regionale dell’Alta Austria approvò all’unanimità la legge istitutiva. Oggi è riconosciuto nella
      categoria II IUCN, sito Ramsar e della rete europea Natura, con l’89 % tutelato come riserva integrale.
    before: >-
      Non vige l’obbligo tassativo di restare sui sentieri, ma si raccomanda l’uso dei tracciati segnati; è
      vietato addentrarsi nelle torbiere e zone umide. L’arrampicata è consentita solo in falesie dedicate;
      sulla parete Kampermauer presso lo Hengstpass è vietata fino al 15 luglio per tutelare i rapaci
      nidificanti. Le biciclette possono circolare esclusivamente dal 15 aprile al 31 ottobre, da due ore dopo
      l’alba fino a un’ora prima del tramonto. Verifica avvisi e chiusure prima di partire.
    around: >-
      A circa tredici chilometri sorge il [Parco Nazionale Gesäuse - Gola
      dell’Enns](/lugar/nationalpark-gesause---enns-gorge/) e a circa ventiquattro chilometri si erge il
      [Gruppo dell’Hochschwab](/lugar/hochschwabgruppe/). Il parco si sovrappone parzialmente al [Totes
      Gebirge - Deserto Carsico](/lugar/totes-gebirge---karst-desert/).
  pt:
    intro: >-
      Em 1985, opositores a um grande empreendimento hidroelétrico ocuparam o Hintergebirge, forçando o
      cancelamento das barragens planeadas. Essa cordilheira quase despovoada constitui hoje o coração da
      maior mata virgem da Áustria. O Parque Nacional de Kalkalpen protege cerca de 209 km² entre o
      Sengsengebirge e o Reichraminger Hintergebirge, dedicando 16.502 hectares a «Waldwildnis» (floresta
      selvagem integral)—uma escala de preservação ímpar no país.
    landscape: >-
      O parque eleva-se desde os 385 até aos 1.963 m e congrega 30 tipologias florestais distintas. É também
      um santuário de águas bravas: mais de 800 nascentes cristalinas alimentam a maior rede fluvial
      inalterada dos Alpes Orientais, rasgando gargantas de dolomito e torrentes no Reichraminger
      Hintergebirge.


      A faia comanda: os faganais ancestrais deste parque e os da área selvagem de Dürrenstein-Lassingtal
      foram inscritos como Património Mundial Natural da UNESCO em 2017, pioneiros na Áustria. Num reduto de
      floresta virgem do Sengsengebirge medra a faia mais antiga catalogada em todo o arco alpino. Ocorrem 32
      espécies arbóreas nativas—metade das 65 existentes na Áustria—e mais de 50 arbustos, entre eles a
      tramazeira-das-rochas (Amelanchier ovalis). Pradarias de ceifa e pastagens formam ilhas abertas num
      imenso mar florestal.
    wildlife: >-
      Desde a rosália-alpina até ao [lince-euroasiático](/especie/lynx_lynx/), o parque é abrigo para raras
      espécies silvestres. Regressaram a [águia-real](/especie/aquila_chrysaetos/), a
      [lontra-europeia](/especie/lutra_lutra/), o lince e o [falcão-peregrino](/especie/falco_peregrinus/),
      nidificando com sucesso a [cegonha-preta](/especie/ciconia_nigra/). Existem oito territórios de
      águia-real e 55 mamíferos catalogados, incluindo 17 espécies de morcegos. Câmaras de armadilhagem
      fotográfica comprovam a reprodução regular do lince, o maior felino selvagem da Áustria.


      O [pica-pau-de-dorso-branco](/especie/dendrocopos_leucotos/) é o pica-pau mais raro da Áustria e a ave
      mais emblemática do parque, coexistindo em densidades elevadas com o mocho-de-tengmalm e o
      papa-moscas-pequeno. Nos insetos xilófagos, a [rosália-alpina](/especie/rosalia_alpina/) detém aqui a
      população austríaca mais expressiva, entre 41 espécies relíquias de floresta primária. Registam-se mais
      de 1.600 espécies de borboletas, a cifra mais alta de qualquer área protegida austríaca.


      O calendário natural dita o ritmo: na primavera, vigilantes organizam passeios para escutar o
      [galo-lira](/especie/tetrao_tetrix/). Em meados de setembro soa a brama dos veados em Bodinggraben,
      enquanto as camurças percorrem as cristas de Sengsengebirge. Em outubro a folhagem das faias adquire
      tons dourados e alaranjados. A época ideal de visita decorre de maio a outubro.
    visit: >-
      O parque descobre-se a pé. O Buchensteig em Reichraming percorre uma rota histórica de lenhadores pelo
      Hintergebirge em duas etapas: 3,5 km até Wilder Graben e 6 km até Große Klause, demorando cerca de três
      horas e meia por sentido. No vale de Weißenbach um circuito de duas a três horas ilustra a evolução da
      mata carvoeira para floresta produtiva e finalmente área protegida. A subida até Blahbergalm desde
      Weißwasser requer de quatro horas e meia a cinco horas na peugada de antigos mineiros de bauxite. O
      trilho em Bodinggraben até Blumaueralm é plano e acessível a carrinhos de bebé e cadeiras de rodas até
      ao Jagahäusl.


      Para bicicletas existem 500 km de pistas assinaladas, desde a suave ciclovia Hintergebirgsradweg até
      subidas íngremes a abrigos. O Buchensteig pode fechar-se em circuito circular regressando pela pista
      ciclável do Hintergebirge ao longo de oito quilómetros de cascalho. Para pernoitar sob as estrelas
      existem dois parques de bivaque em Weißwasser e Steyrsteg, abertos de maio a outubro mediante reserva no
      centro de visitantes Ennstal.


      O centro de visitantes Ennstal em Reichraming e a torre panorâmica de Wurbauerkogel junto a
      Windischgarsten acolhem mostras interativas; da torre contempla-se um panorama sobre 21 cumes acima dos
      dois mil metros. À noite o território integra a reserva de céu escuro Eisenwurzen, certificada pela Dark
      Sky International.
    history: >-
      Vestígios de caçadores do Paleolítico datados de entre 18.000 e 10.000 a.C. foram descobertos na gruta
      de Nixloch. Em épocas mais recentes o corte intensivo sustentou as forjas de Eisenwurzen, e a linha
      férrea florestal de Reichraming funcionou até aos primeiros anos da década de setenta.


      O parque nacional resultou da luta cívica contra os represamentos hidroelétricos. A 5 de dezembro de
      1996 o Parlamento da Alta Áustria aprovou por unanimidade a lei do parque. Hoje possui o estatuto de
      Categoria II da UICN, zona Ramsar e Rede europeia Natura, com 89 % consagrado a reserva integral.
    before: >-
      Não existe obrigação estrita de confinamento a trilhos, mas solicita-se a circulação nos caminhos
      marcados; é expressamente proibido entrar em turfeiras e pauis. A escalada só é consentida em setores
      regulados; na crista de Kampermauer em Hengstpass vigora interdição até 15 de julho para salvaguardar a
      nidificação rupestre de rapinas. As bicicletas só circulam entre 15 de abril e 31 de outubro, desde duas
      horas após o nascer do sol até uma hora antes do crepúsculo. Confirma os avisos antes de partir.
    around: >-
      A cerca de treze quilómetros localiza-se o [Parque Nacional de Gesäuse - Desfiladeiro do
      Enns](/lugar/nationalpark-gesause---enns-gorge/) e a cerca de vinte e quatro quilómetros ergue-se o
      [Grupo de Hochschwab](/lugar/hochschwabgruppe/). O parque sobrepõe-se parcialmente ao [Totes Gebirge -
      Deserto Cársico](/lugar/totes-gebirge---karst-desert/).
