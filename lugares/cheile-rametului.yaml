observaciones:
  es: >-
    El tramo por el cauce obliga a entrar en el agua. Para la seguridad, el servicio público Salvamont Alba
    figura como contacto de la zona.
texto:
  es:
    intro: >-
      Durante cerca de un kilómetro, la única manera de seguir adelante en Cheile Râmețului es dentro del
      agua. Las paredes de caliza se cierran, el río Geoagiu ocupa el fondo y no queda camino: se avanza por
      el cauce. Es una reserva de apenas 150 hectáreas en el este de los montes Trascău, y todo en ella está
      comprimido: roca, agua y una flora en la que conviven especies alpinas y termófilas.
    landscape: >-
      Las gargantas están en la parte centro-oriental de los montes Trascău, en el curso medio del valle del
      Geoagiu: Valea Mănăstirii aguas abajo, Valea Mogoșului aguas arriba. Son dos macizos excavados en
      calizas jurásicas, y la reserva va de 530 a 1189 metros de altitud.


      La caliza se ha disuelto con intensidad, y el resultado es un catálogo kárstico: laderas escarpadas y
      desnudas, cumbres agudas en forma de torre, crestas, dolinas, cuevas, portales y canalones, además de
      canchales y bloques. Los bosques, las praderas y los henares rodean la roca. En el interior del macizo
      predomina la circulación subterránea del agua; solo el arroyo Geoagiu, también llamado de la Mănăstirea,
      atraviesa las gargantas. Alrededor del área protegida hay una zona de amortiguación de unos 300 metros,
      sobre todo de bosque limítrofe.


      El clima es fresco: 6 a 8 °C de media anual, 16 a 18 °C en julio y entre –3 y –4 °C en enero. Llueve
      entre 700 y 800 mm al año, y más de 1.000 en las zonas altas.
    wildlife: >-
      La vegetación pertenece al piso de bosques mixtos de haya y roble albar. Dentro de las gargantas
      conviven especies alpinas, como *Ranunculus oreophilus*, *Arabis alpina* y *Saxifraga paniculata*, con
      termófilas como *Silene bupleuroides* y *Linum flavum*. Hay además endemismos, entre ellos *Dianthus
      kitaibelii* ssp. *spiculifolius*, *Silene dubia*, *Aconitum moldaicum* y *Hepatica transsilvanica*.
      Entre las especies raras y protegidas están el tejo, el geranio *Geranium macrorrhizum* y el zapatito de
      dama, *Cypripedium calceolus*.


      La descripción invita a escuchar el canto de las aves entre el agua y el follaje de la garganta, y la
      estrategia municipal de Alba Iulia menciona al [águila real](/especie/aquila_chrysaetos/) en Cheile
      Râmețului.
    visit: >-
      Un sendero turístico marcado recorre las gargantas, desde el monasterio hasta la aldea de Cheia. Se
      llega por la DC 73 desde Teiuș hacia el monasterio de Râmeț, o por la DJ 107 desde Aiud hasta Brădești,
      en la comuna de Râmeț. La entrada es muy difícil: durante cerca de un kilómetro solo se puede avanzar
      por el agua del río.


      El monasterio de Râmeț, a 34 km de Alba Iulia y a 18 de Teiuș, está a la entrada de las gargantas. Es
      uno de los asentamientos monásticos más antiguos de Transilvania, y el tercer estrato de frescos de su
      interior lo pintó Mihu de la Crișul Alb en 1377.
    history: >-
      La reserva se estableció en 1969, con una decisión del Consejo Popular del condado de Alba, y es hoy un
      área protegida de interés nacional de categoría IV de la UICN, de tipo mixto. La ficha oficial la
      describe como un paisaje pintoresco y muy poco modificado por el ser humano, modelado en caliza, que
      conserva plantas raras.


      Los montes Trascău tienen otras gargantas conocidas, como las de Turzii, Turenilor, Găldiței,
      Întregaldelor, Cetii, Aiudului y Ampoiței.
    before: >-
      El tramo por el cauce obliga a entrar en el agua. Para la seguridad, el servicio público Salvamont Alba
      figura como contacto de la zona.
  en:
    intro: >-
      For nearly a kilometre, the only way forward in Cheile Râmețului is in the water. The limestone walls
      close in, the Geoagiu River fills the gorge floor, and no path remains: you advance through the
      riverbed. It is a reserve of barely 150 hectares in the eastern Trascău Mountains, and everything within
      it is compressed: rock, water, and a flora where alpine and thermophilous species live side by side.
    landscape: >-
      The gorge lies in the east-central part of the Trascău Mountains, in the middle course of the Geoagiu
      valley: Valea Mănăstirii downstream, Valea Mogoșului upstream. They are two massifs carved into Jurassic
      limestones, and the reserve ranges from 530 to 1189 metres in altitude.


      The limestone has undergone intense dissolution, yielding a rich karst catalogue: steep and bare slopes,
      sharp tower-like peaks, crests, sinkholes, caves, natural portals, and gullies, along with screes and
      boulders. Forests, meadows, and hayfields encircle the rock. Inside the massif, underground water
      circulation predominates; only the Geoagiu stream, also called Mănăstirea, cuts through the gorge.
      Surrounding the protected area is a buffer zone of about 300 metres, mostly made up of bordering forest.


      The climate is cool: 6 to 8 °C annual average, 16 to 18 °C in July, and between –3 and –4 °C in January.
      Annual rainfall is between 700 and 800 mm, exceeding 1,000 mm in the high areas.
    wildlife: >-
      The vegetation belongs to the mixed beech and sessile oak forest zone. Within the gorge, alpine species
      such as *Ranunculus oreophilus*, *Arabis alpina*, and *Saxifraga paniculata* cohabit with thermophiles
      such as *Silene bupleuroides* and *Linum flavum*. There are also endemics, including *Dianthus
      kitaibelii* ssp. *spiculifolius*, *Silene dubia*, *Aconitum moldaicum*, and *Hepatica transsilvanica*.
      Among rare and protected species are yew, the cranesbill *Geranium macrorrhizum*, and lady's slipper
      orchid, *Cypripedium calceolus*.


      The setting invites you to listen to bird song echoing between the rushing water and the gorge canopy,
      and the municipal strategy of Alba Iulia mentions the [golden eagle](/especie/aquila_chrysaetos/) in
      Cheile Râmețului.
    visit: >-
      A marked tourist trail traverses the gorge, from the monastery to the hamlet of Cheia. Access is via the
      DC 73 from Teiuș towards Râmeț Monastery, or via the DJ 107 from Aiud to Brădești, in the commune of
      Râmeț. Entering is very demanding: for nearly a kilometre you can only advance through the river water.


      Râmeț Monastery, 34 km from Alba Iulia and 18 from Teiuș, stands at the entrance to the gorge. It is one
      of the oldest monastic settlements in Transylvania, and the third layer of frescoes inside was painted
      by Mihu of Crișul Alb in 1377.
    history: >-
      The reserve was established in 1969 by a decision of the Alba County People's Council, and today it is a
      protected area of national interest under IUCN Category IV, of mixed type. The official description
      depicts it as a picturesque landscape very little altered by human activity, sculpted in limestone,
      preserving rare plants.


      The Trascău Mountains harbour other well-known gorges, including Turzii, Turenilor, Găldiței,
      Întregaldelor, Cetii, Aiudului, and Ampoiței.
    before: >-
      The section along the riverbed forces you into the water. For safety, the Salvamont Alba public rescue
      service is listed as the regional contact.
  fr:
    intro: >-
      Sur près d'un kilomètre, la seule façon d'avancer dans Cheile Râmețului est d'entrer dans l'eau. Les
      parois de calcaire se resserrent, la rivière Geoagiu occupe le fond et aucun sentier ne subsiste : la
      progression se fait dans le lit du cours d'eau. C'est une réserve d'à peine 150 hectares dans l'est des
      monts Trascău, et tout y est condensé : la roche, l'eau et une flore où se côtoient espèces alpines et
      thermophiles.
    landscape: >-
      Les gorges se situent dans la partie centre-orientale des monts Trascău, dans le cours moyen de la
      vallée du Geoagiu : Valea Mănăstirii en aval, Valea Mogoșului en amont. Ce sont deux massifs entaillés
      dans des calcaires jurassiques, et la réserve s'étage de 530 à 1189 mètres d'altitude.


      Le calcaire a subi une dissolution intense, donnant naissance à un véritable répertoire karstique :
      versants escarpés et dénudés, sommets effilés en forme de tours, crêtes, dolines, grottes, arches et
      couloirs, ainsi que des éboulis et des blocs. Forêts, prairies et prés de fauche entourent la roche. À
      l'intérieur du massif, la circulation souterraine des eaux domine ; seul le ruisseau Geoagiu, également
      appelé de la Mănăstirea, traverse les gorges. Autour de l'espace protégé s'étend une zone tampon
      d'environ 300 mètres, composée principalement de forêt limitrophe.


      Le climat est frais : 6 à 8 °C de moyenne annuelle, 16 à 18 °C en juillet et entre –3 et –4 °C en
      janvier. Les précipitations sont de 700 à 800 mm par an, et dépassent 1 000 mm sur les hauteurs.
    wildlife: >-
      La végétation relève de l'étage des forêts mixtes de hêtre et de chêne rouvre. À l'intérieur des gorges
      cohabitent des espèces alpines, comme *Ranunculus oreophilus*, *Arabis alpina* et *Saxifraga
      paniculata*, avec des espèces thermophiles comme *Silene bupleuroides* et *Linum flavum*. On y trouve
      aussi des endémismes, parmi lesquels *Dianthus kitaibelii* ssp. *spiculifolius*, *Silene dubia*,
      *Aconitum moldaicum* et *Hepatica transsilvanica*. Parmi les espèces rares et protégées figurent l'if,
      le géranium à grosses racines *Geranium macrorrhizum* et le sabot de Vénus, *Cypripedium calceolus*.


      Le cadre invite à écouter le chant des oiseaux entre le bouillonnement de l'eau et la canopée de la
      gorge, et la stratégie municipale d'Alba Iulia mentionne l'[aigle royal](/especie/aquila_chrysaetos/) à
      Cheile Râmețului.
    visit: >-
      Un sentier touristique balisé parcourt les gorges, du monastère jusqu'au hameau de Cheia. L'accès
      s'effectue par la DC 73 depuis Teiuș en direction du monastère de Râmeț, ou par la DJ 107 depuis Aiud
      jusqu'à Brădești, dans la commune de Râmeț. L'entrée est très exigeante : sur près d'un kilomètre, on ne
      peut progresser que dans l'eau de la rivière.


      Le monastère de Râmeț, à 34 km d'Alba Iulia et à 18 de Teiuș, s'élève à l'entrée des gorges. C'est l'un
      des plus anciens établissements monastiques de Transylvanie, et la troisième couche de fresques de son
      intérieur a été peinte par Mihu de Crișul Alb en 1377.
    history: >-
      La réserve a été créée en 1969 par décision du Conseil populaire du județ d'Alba, et constitue
      aujourd'hui une aire protégée d'intérêt national de catégorie IV de l'UICN, de type mixte. La notice
      officielle la décrit comme un paysage pittoresque et très peu altéré par l'homme, façonné dans le
      calcaire, qui abrite des plantes rares.


      Les monts Trascău comptent d'autres gorges réputées, comme celles de Turzii, Turenilor, Găldiței,
      Întregaldelor, Cetii, Aiudului et Ampoiței.
    before: >-
      Le passage dans le lit du cours d'eau oblige à marcher dans l'eau. Pour la sécurité, le service public
      Salvamont Alba est le contact officiel du secteur.
  de:
    intro: >-
      Fast einen Kilometer lang führt der einzige Weg durch die Cheile Râmețului mitten durchs Wasser. Die
      Kalksteinwände rücken eng zusammen, der Fluss Geoagiu füllt die Sohle aus und es bleibt kein Pfad mehr
      übrig: Du bewegst dich im Flussbett vorwärts. Es ist ein Reservat von kaum 150 Hektar im Osten des
      Trascău-Gebirges, und alles darin ist verdichtet: Fels, Wasser und eine Pflanzenwelt, in der alpine und
      wärmeliebende Arten nebeneinander wachsen.
    landscape: >-
      Die Schlucht liegt im östlichen Zentralteil des Trascău-Gebirges, im Mittellauf des Geoagiu-Tals: Valea
      Mănăstirii talabwärts, Valea Mogoșului talaufwärts. Es sind zwei aus jurassischen Kalksteinen
      herausgearbeitete Massive, und das Reservat erstreckt sich von 530 bis 1189 Metern Höhe.


      Der Kalkstein ist intensiv verkarstet, und das Ergebnis ist ein reiches Karstinventar: steile, kahle
      Hänge, scharfe, turmartige Gipfel, Grate, Dolinen, Höhlen, Felsentore und Rinnen sowie Schutthalden und
      Felsblöcke. Wälder, Wiesen und Mähwiesen säumen den Fels. Im Inneren des Massivs dominiert die
      unterirdische Wasserzirkulation; nur der Geoagiu-Bach, auch Mănăstirea genannt, durchquert die Schlucht.
      Um das Schutzgebiet liegt eine Pufferzone von etwa 300 Metern, die vor allem aus angrenzendem Wald
      besteht.


      Das Klima ist kühl: 6 bis 8 °C Jahresmittel, 16 bis 18 °C im Juli und zwischen –3 und –4 °C im Januar.
      Es fallen 700 bis 800 mm Regen pro Jahr und mehr als 1.000 mm in den Höhenlagen.
    wildlife: >-
      Die Vegetation gehört zur Höhenstufe der Buchen-Traubeneichen-Mischwälder. In der Schlucht leben alpine
      Arten wie *Ranunculus oreophilus*, *Arabis alpina* und *Saxifraga paniculata* gemeinsam mit
      wärmeliebenden Vertretern wie *Silene bupleuroides* und *Linum flavum*. Hinzu kommen Endemiten, darunter
      *Dianthus kitaibelii* ssp. *spiculifolius*, *Silene dubia*, *Aconitum moldaicum* und *Hepatica
      transsilvanica*. Unter den seltenen und geschützten Arten finden sich die Eibe, der
      Felsen-Storchschnabel *Geranium macrorrhizum* und der Frauenschuh, *Cypripedium calceolus*.


      Die Kulisse lädt dazu ein, dem Vogelgesang zwischen dem Rauschen des Wassers und dem Laub der Schlucht
      zu lauschen, und das Gemeindekonzept von Alba Iulia führt den [Steinadler](/especie/aquila_chrysaetos/)
      in der Cheile Râmețului auf.
    visit: >-
      Ein markierter Wanderweg durchzieht die Schlucht vom Kloster bis zum Weiler Cheia. Die Anfahrt erfolgt
      über die DC 73 von Teiuș zum Kloster Râmeț oder über die DJ 107 von Aiud nach Brădești in der Gemeinde
      Râmeț. Der Einstieg ist sehr anspruchsvoll: Fast einen Kilometer lang kommst du nur durch das
      Flusswasser voran.


      Das Kloster Râmeț, 34 km von Alba Iulia und 18 von Teiuș entfernt, steht am Eingang der Schlucht. Es ist
      eine der ältesten Klostersiedlungen Siebenbürgens; die dritte Schicht der Innenfresken malte Mihu de la
      Crișul Alb im Jahr 1377.
    history: >-
      Das Reservat wurde 1969 durch Beschluss des Volksrats des Kreises Alba eingerichtet und ist heute ein
      Schutzgebiet von nationaler Bedeutung der IUCN-Kategorie IV gemischten Typs. Die amtliche Beschreibung
      kennzeichnet es als malerische, vom Menschen kaum veränderte Landschaft im Kalkstein, die seltene
      Pflanzen bewahrt.


      Das Trascău-Gebirge besitzt weitere bekannte Schluchten, darunter jene von Turzii, Turenilor, Găldiței,
      Întregaldelor, Cetii, Aiudului und Ampoiței.
    before: >-
      Der Abschnitt im Flussbett zwingt dazu, ins Wasser zu gehen. Für Notfälle ist der Bergrettungsdienst
      Salvamont Alba als örtlicher Ansprechpartner verzeichnet.
  it:
    intro: >-
      Per quasi un chilometro, l'unico modo per avanzare nelle Cheile Râmețului è nell'acqua. Le pareti
      calcaree si serrano, il fiume Geoagiu occupa il fondo e non resta alcun sentiero: si cammina nel letto
      del corso d'acqua. È una riserva di appena 150 ettari nella parte orientale dei monti Trascău, e ogni
      elemento vi appare compresso: roccia, acqua e una flora in cui convivono specie alpine e termofile.
    landscape: >-
      Le gole si trovano nella parte centro-orientale dei monti Trascău, nel medio corso della valle del
      Geoagiu: Valea Mănăstirii a valle, Valea Mogoșului a monte. Sono due massicci incisi nei calcari
      giurassici, e la riserva si sviluppa tra 530 e 1189 metri di quota.


      Il calcare si è dissolto con intensità, originando un vero e proprio campionario carsico: versanti
      ripidi e spogli, vette acuminate a torre, creste, doline, grotte, archi naturali e canaloni, oltre a
      pietraie e blocchi rocciosi. Boschi, prati e prati da fieno circondano la roccia. All'interno del
      massiccio prevale la circolazione sotterranea delle acque; solo il torrente Geoagiu, detto anche della
      Mănăstirea, attraversa la gola. Attorno all'area protetta si estende una fascia di rispetto di circa 300
      metri, costituita prevalentemente da bosco limitrofo.


      Il clima è fresco: da 6 a 8 °C di media annua, da 16 a 18 °C a luglio e tra –3 e –4 °C a gennaio. Cadono
      tra 700 e 800 mm di pioggia all'anno, superando i 1.000 mm nelle zone elevate.
    wildlife: >-
      La vegetazione appartiene alla fascia dei boschi misti di faggio e rovere. All'interno della gola
      convivono specie alpine, come *Ranunculus oreophilus*, *Arabis alpina* e *Saxifraga paniculata*, con
      elementi termofili come *Silene bupleuroides* e *Linum flavum*. Sono presenti anche endemismi, tra cui
      *Dianthus kitaibelii* ssp. *spiculifolius*, *Silene dubia*, *Aconitum moldaicum* ed *Hepatica
      transsilvanica*. Tra le specie rare e protette figurano il tasso, il geranio *Geranium macrorrhizum* e
      la pianella della Madonna, *Cypripedium calceolus*.


      Il paesaggio invita ad ascoltare il canto degli uccelli tra lo scorrere delle acque e le fronde della
      gola, e la strategia municipale di Alba Iulia cita l'[aquila reale](/especie/aquila_chrysaetos/) nelle
      Cheile Râmețului.
    visit: >-
      Un itinerario turistico segnato percorre le gole, dal monastero fino all'abitato di Cheia. L'accesso
      avviene lungo la DC 73 da Teiuș verso il monastero di Râmeț, oppure tramite la DJ 107 da Aiud fino a
      Brădești, nel comune di Râmeț. L'imbocco è assai impegnativo: per circa un chilometro si può avanzare
      solo camminando nell'acqua del fiume.


      Il monastero di Râmeț, a 34 km da Alba Iulia e a 18 da Teiuș, sorge all'ingresso delle gole. È uno dei
      complessi monastici più antichi della Transilvania, e il terzo strato di affreschi al suo interno fu
      realizzato da Mihu de la Crișul Alb nel 1377.
    history: >-
      La riserva fu istituita nel 1969 con delibera del Consiglio popolare del distretto di Alba, ed è oggi
      un'area protetta di interesse nazionale appartenente alla categoria IV della IUCN, di tipo misto. La
      scheda ufficiale la descrive come un paesaggio pittoresco e pochissimo modificato dall'uomo, modellato
      nel calcare, custode di piante rare.


      I monti Trascău comprendono altre celebri gole, come quelle di Turzii, Turenilor, Găldiței,
      Întregaldelor, Cetii, Aiudului e Ampoiței.
    before: >-
      Il tratto lungo il greto costringe a entrare nell'acqua. Per questioni di sicurezza, il soccorso alpino
      Salvamont Alba è il riferimento operativo della zona.
  pt:
    intro: >-
      Durante cerca de um quilómetro, a única forma de seguir em frente em Cheile Râmețului é dentro de água.
      As paredes de calcário fecham-se, o rio Geoagiu ocupa o fundo e não resta qualquer caminho: avança-se
      pelo leito do rio. É uma reserva de apenas 150 hectares no leste dos montes Trascău, e tudo nela surge
      comprimido: rocha, água e uma flora onde convivem espécies alpinas e termófilas.
    landscape: >-
      As gargantas situam-se na parte centro-oriental dos montes Trascău, no curso médio do vale do Geoagiu:
      Valea Mănăstirii a jusante, Valea Mogoșului a montante. São dois maciços escavados em calcários
      jurássicos, e a reserva desenvolve-se dos 530 aos 1189 metros de altitude.


      O calcário dissolveu-se intensamente, originando um catálogo cárstico completo: encostas escarpadas e
      desnudas, cumes agudos em forma de torre, cristas, dolinas, grutas, portais e canais, além de
      cascalheiras e blocos. Florestas, prados e prados de feno rodeiam a rocha. No interior do maciço
      predomina a circulação subterrânea da água; apenas o ribeiro Geoagiu, também chamado da Mănăstirea,
      atravessa o desfiladeiro. Em redor da área protegida estende-se uma zona de amortecimento de cerca de
      300 metros, composta sobretudo por floresta limítrofe.


      O clima é fresco: 6 a 8 °C de média anual, 16 a 18 °C em julho e entre –3 e –4 °C em janeiro. Chove
      entre 700 e 800 mm por ano, ultrapassando os 1.000 mm nas zonas altas.
    wildlife: >-
      A vegetação pertence ao andar das florestas mistas de faia e carvalho-alvarinho. No interior do
      desfiladeiro convivem espécies alpinas, como *Ranunculus oreophilus*, *Arabis alpina* e *Saxifraga
      paniculata*, com plantas termófilas como *Silene bupleuroides* e *Linum flavum*. Existem ainda
      endemismos, entre eles *Dianthus kitaibelii* ssp. *spiculifolius*, *Silene dubia*, *Aconitum moldaicum*
      e *Hepatica transsilvanica*. Entre as espécies raras e protegidas encontram-se o teixo, o gerânio
      *Geranium macrorrhizum* e o sapatinho-de-vénus, *Cypripedium calceolus*.


      O ambiente convida a escutar o canto das aves por entre a água e a folhagem do desfiladeiro, e a
      estratégia municipal de Alba Iulia cita a [águia-real](/especie/aquila_chrysaetos/) em Cheile Râmețului.
    visit: >-
      Um trilho turístico marcado percorre o desfiladeiro, desde o mosteiro até à aldeia de Cheia. O acesso
      faz-se pela DC 73 a partir de Teiuș em direção ao mosteiro de Râmeț, ou pela DJ 107 a partir de Aiud até
      Brădești, no município de Râmeț. A entrada é muito exigente: durante cerca de um quilómetro só é
      possível avançar pela água do rio.


      O mosteiro de Râmeț, a 34 km de Alba Iulia e a 18 de Teiuș, ergue-se à entrada das gargantas. É um dos
      povoamentos monásticos mais antigos da Transilvânia, e a terceira camada de frescos no seu interior foi
      pintada por Mihu de Crișul Alb em 1377.
    history: >-
      A reserva foi criada em 1969, por decisão do Conselho Popular do condado de Alba, e constitui hoje uma
      área protegida de interesse nacional de categoria IV da UICN, de tipo misto. A ficha oficial descreve-a
      como uma paisagem pitoresca e muito pouco modificada pelo ser humano, moldada em calcário, que conserva
      plantas raras.


      Os montes Trascău contam com outros desfiladeiros conhecidos, como os de Turzii, Turenilor, Găldiței,
      Întregaldelor, Cetii, Aiudului e Ampoiței.
    before: >-
      O troço pelo leito obriga a entrar na água. Para segurança, o serviço público de socorro Salvamont Alba
      é o contacto oficial da região.
