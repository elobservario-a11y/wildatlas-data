resumen:
  es: >-
    Desfiladero calizo estrechísimo de los Montes Trascău donde el camino transcurre encajado entre la roca
    cruzando el río a pie.
  en: >-
    Extremely narrow limestone gorge in the Trascău Mountains where the trail runs squeezed between rock
    walls, crossing the river on foot.
  fr: >-
    Défilé calcaire extrêmement étroit des monts Trascău où le sentier chemine encaissé entre la roche en
    traversant la rivière à pied.
  de: >-
    Extrem enge Kalksteinschlucht im Trascău-Gebirge, in der der Weg eingezwängt zwischen den Felsen durch das
    Flussbett führt.
  it: >-
    Gola calcarea strettissima dei monti Trascău dove il percorso si snoda incassato tra le pareti rocciose
    risalendo il fiume a piedi.
  pt: >-
    Desfiladeiro calcário estreitíssimo dos Montes Trascău onde o trilho avança encaixado entre a rocha
    cruzando o rio a pé.
