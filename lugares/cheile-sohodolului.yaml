  en: >-
    A limestone defile where rushing waters carved a nose-shaped cavern, a natural rock arch, and prehistoric
    paintings at its gate.
  fr: >-
    Une gorge calcaire où l'eau a façonné une grotte en forme de narines, une arche de pierre et des peintures
    rupestres à son entrée.
  de: >-
    Eine Kalksteinschlucht, in der das Wasser eine Höhle in Nasenform, ein Felsentor und Felsmalereien am
    Eingang schuf.
  it: >-
    Una gola calcarea in cui l'acqua ha scavato una grotta a forma di narici, un arco di pietra e pitture
