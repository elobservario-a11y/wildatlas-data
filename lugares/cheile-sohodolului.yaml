  pt: >-
    Uma garganta de calcário onde a água escavou uma gruta com formato de narinas, um arco de pedra e pinturas
    rupestres à entrada.
observaciones:
  es: El fuego abierto y la acampada solo se permiten en los espacios habilitados.
texto:
  es:
    intro: >-
      Aquí el agua tardó miles de años en abrirse paso, y todavía se nota que tuvo que luchar. El río Jaleș
      (Sohodol) corta los montes Vâlcan en una garganta excavada en calizas cretácicas, y el resultado es un
      museo de karst al aire libre: dolinas, cañones, lapiaces, simas, cuevas y paredes verticales. Las Cheile
      Sohodolului ocupan 350 hectáreas, al norte del pueblo de Runcu, en el extremo norte del condado de Gorj,
      pegadas al límite con Hunedoara.
    landscape: >-
      El cañón se extiende unos doce kilómetros dentro de los montes Vâlcan, entre Runcu y Poiana Contului.
      Los Vâlcan forman parte de los Cárpatos Meridionales, y su cima más alta, Oslea, llega a 1.946 metros en
      el extremo occidental.


      La obra es del agua. Durante miles de años fue excavando la montaña para abrirse camino hacia la salida,
      y de ahí salieron las aberturas de Nări, que recuerdan las fosas nasales humanas. La cueva Nările es un
      fenómeno natural bastante raro: dos galerías de unos 70 metros cada una. Entre las demás formaciones,
      esculpidas por el agua o el viento en la caliza, están Cuptorul, la cueva Gârla Vacii y el arco Inelul.


      A la entrada de las gargantas está la cueva Popii, la más visitada, con pinturas rupestres de figuras
      antropomorfas negras. Y para quien le guste la espeleología, el valle ofrece cuevas espectaculares y
      simas verticales en el perímetro espeleológico Valea Sohodolului/Balta.
    wildlife: >-
      La riqueza está en las plantas: en una superficie de unos 150.000 a 200.000 metros cuadrados del valle
      se contaron 345 especies de plantas vasculares, de 71 familias, y algunas de ellas son raras en la flora
      del país. Esa abundancia en un territorio tan pequeño se explica por las condiciones del relieve, del
      suelo y del clima. Entre los árboles hay castaños centenarios plantados antes de 1859.


      En verano el desfiladero es unos 10 grados más fresco, por la sombra de las rocas y el agua del Sohodol.
    visit: >-
      Se llega desde la carretera nacional DN67D, que une Târgu Jiu con Baia de Aramă, siguiendo las señales.
      El camino está bien acondicionado a lo largo de las gargantas, y se puede recorrer en coche, en
      bicicleta o a pie, aunque lo mejor es hacerlo a pie. Hoy un camino provincial las atraviesa y comunica,
      por encima de la montaña, con la zona de Valea de Pești, en la cuenca del Jiu occidental. Al caminar, se
      ven las etapas de la evolución del cañón: cuevas, grutas, marmitas y túneles por donde se cuela el agua.
    history: >-
      Las gargantas son un área protegida de interés nacional, de categoría IV según la clasificación
      internacional de áreas protegidas (reserva natural de tipo mixto), en el término municipal de Runcu. En
      ellas se rodaron escenas de la película rumana Trandafirul Galben, con el personaje Mărgelatu.
    before: El fuego abierto y la acampada solo se permiten en los espacios habilitados.
    around: >-
      Las [Montañas de Parâng](/lugar/muntii-parang/) quedan a trece kilómetros, y a diecisiete el [Parque
      Nacional Desfiladero del Jiu - Bosque
      Primario](/lugar/parcul-national-defileul-jiului-codrii-seculari/). A diecinueve está el [Parque
      Nacional Retezat](/lugar/parcul-national-retezat---masivul-muntos/) y a veintidós las [Montañas de
      Godeanu](/lugar/muntii-godeanu/) y el [Parque Nacional Domogled - Valle del
      Cerna](/lugar/parcul-national-domogled---valea-cernei/). A veintisiete kilómetros queda el [Rewilding
      Meseta de Mehedinți](/lugar/rewilding-mehedinti-plateau/). Más lejos, el [Parque Nacional de
      Lovćen](/lugar/nacionalni-park-lovcen/) también es karst.
  en:
    intro: >-
      Water spent millennia carving its way through stone here, and the traces of that persistent struggle
      remain etched into the landscape. The Jaleș (Sohodol) River dissects the Vâlcan Mountains in a canyon
      hollowed out of Cretaceous limestones, yielding an open-air karst museum: sinkholes, sheer ravines,
      clints, vertical chasms, caves, and towering cliffs. Cheile Sohodolului spans 350 hectares north of the
      village of Runcu, in the northernmost reaches of Gorj County abutting the border with Hunedoara.
    landscape: >-
      The canyon winds for some twelve kilometers through the Vâlcan Mountains between Runcu and Poiana
      Contului. The Vâlcan range belongs to the Southern Carpathians, its highest crest, Oslea, reaching 1,946
      meters at its western extreme.


      Water has been the master architect. Over thousands of years it excavated the bedrock seeking an outlet,
      producing the Nări apertures, which resemble human nostrils. The Nările cave is an unusual natural
      feature: two twin galleries each extending some 70 meters. Other notable formations sculpted out of the
      limestone by water and wind include Cuptorul, Gârla Vacii cave, and the Inelul rock arch.


      Right at the threshold of the gorge lies Peștera Popii, the most visited cave, displaying black
      anthropomorphic rock paintings. For speleologists, the valley offers dramatic vertical shafts and
      caverns across the Valea Sohodolului/Balta speleological sector.
    wildlife: >-
      The primary botanical treasure lies in the plant communities: within a modest expanse of some 150,000 to
      200,000 square meters of the valley, botanists have inventoried 345 vascular plant species across 71
      families, several of which are national rarities. This exceptional richness across a small area stems
      from contrasting relief, rocky soils, and microclimates. The woodlands feature veteran sweet chestnut
      trees planted prior to 1859.


      In high summer, the deep shade of the crags and the cold Sohodol stream keep the gorge roughly 10
      degrees cooler than the adjacent lowlands.
    visit: >-
      Access is from the DN67D national road connecting Târgu Jiu with Baia de Aramă by following posted
      directions. A paved road threads the gorge, allowing visits by car, bicycle, or foot, though walking is
      by far the most rewarding. A county road crosses through the mountains to connect with the Valea de
      Pești area in the Western Jiu basin. Walking along the gorge, you can trace the developmental stages of
      the canyon: grottos, water-sculpted kettles, and rock tunnels.
    history: >-
      The gorge is designated a protected nature reserve of national interest, classified as Category IV by
      the IUCN (mixed nature reserve), in the municipality of Runcu. Scenes from the Romanian adventure film
      Trandafirul Galben featuring the folk hero Mărgelatu were filmed among these limestone crags.
    before: >-
      Open campfires and wilderness bivouacking are permitted strictly in designated official recreation
      areas.
    around: >-
      The [Parâng Mountains](/lugar/muntii-parang/) lie thirteen kilometers away, and seventeen kilometers the
      [Jiu Gorge National Park - Ancient Beech
      Forests](/lugar/parcul-national-defileul-jiului-codrii-seculari/). Nineteen kilometers away is [Retezat
      National Park](/lugar/parcul-national-retezat---masivul-muntos/), and twenty-two kilometers both the
      [Godeanu Mountains](/lugar/muntii-godeanu/) and [Domogled-Valea Cernei National
      Park](/lugar/parcul-national-domogled---valea-cernei/). The [Mehedinți Plateau Rewilding
      Area](/lugar/rewilding-mehedinti-plateau/) lies twenty-seven kilometers distant. Further away, [Lovćen
      National Park](/lugar/nacionalni-park-lovcen/) also preserves classic karst.
  fr:
    intro: >-
      L'eau a mis des millénaires à frayer son chemin ici, et la mémoire de cette lutte reste gravée dans la
      pierre. La rivière Jaleș (Sohodol) entaille les monts Vâlcan par une gorge creusée dans les calcaires
      crétacés, donnant naissance à un véritable musée karstique de plein air : dolines, défilés, lapiés,
      gouffres, cavernes et falaises verticales. Les Cheile Sohodolului s'étendent sur 350 hectares au nord du
      village de Runcu, à l'extrémité septentrionale du județ de Gorj, en bordure du județ de Hunedoara.
    landscape: >-
      Le canyon serpente sur douze kilomètres dans les monts Vâlcan, entre Runcu et Poiana Contului. Les
      Vâlcan appartiennent aux Carpates méridionales, leur point culminant, l'Oslea, s'élevant à 1 946 mètres
      à l'ouest.


      L'œuvre est celle de l'eau. Au fil des millénaires, elle a foré la roche pour s'échapper vers la plaine,
      sculptant les cavités de Nări qui évoquent des narines humaines. La grotte Nările constitue une
      curiosité géologique : deux galeries jumelles d'environ 70 mètres chacune. Parmi les autres modelés
      sculptés dans le calcaire figurent Cuptorul, la grotte Gârla Vacii et l'arche rocheuse d'Inelul.


      À l'entrée des gorges s'ouvre la grotte Popii, la plus fréquentée, abritant des peintures rupestres
      anthropomorphes noires. Pour les amateurs de spéléologie, la vallée recèle des gouffres verticaux
      remarquables dans le périmètre Valea Sohodolului/Balta.
    wildlife: >-
      La grande valeur réside dans la flore : sur une superficie d'environ 150 000 à 200 000 mètres carrés,
      les botanistes ont recensé 345 espèces de plantes vasculaires réparties en 71 familles, plusieurs étant
      rares en Roumanie. Cette profusion végétale s'explique par les microclimats et les sols rocheux. Le
      boisement comprend des châtaigniers séculaires plantés avant 1859.


      En plein été, le défilé est environ 10 degrés plus frais que la plaine grâce à l'ombre des parois et aux
      eaux vives du Sohodol.
    visit: >-
      L'accès s'effectue depuis la route nationale DN67D reliant Târgu Jiu à Baia de Aramă en suivant le
      fléchage. Une route aménagée suit les gorges, permettant une découverte en voiture, à vélo ou à pied, la
      marche étant de loin la plus enrichissante. Une route départementale traverse le massif pour rejoindre
      le secteur de Valea de Pești dans le bassin du Jiu occidental. En marchant, on observe les marmites de
      géant, les arches et les porches taillés par le torrent.
    history: >-
      Les gorges constituent une réserve naturelle protégée d'intérêt national de catégorie IV UICN sur la
      commune de Runcu. Elles ont servi de décor naturel à des scènes du film roumain Trandafirul Galben
      mettant en scène le personnage de Mărgelatu.
    before: Les feux et le bivouac ne sont autorisés que sur les emplacements officiellement aménagés.
    around: >-
      Les [monts Parâng](/lugar/muntii-parang/) se trouvent à treize kilomètres, et le [parc national des
      gorges du Jiu - forêts primaires](/lugar/parcul-national-defileul-jiului-codrii-seculari/) à dix-sept
      kilomètres. À dix-neuf kilomètres s'élève le [parc national de
      Retezat](/lugar/parcul-national-retezat---masivul-muntos/), et à vingt-deux kilomètres les [monts
      Godeanu](/lugar/muntii-godeanu/) ainsi que le [parc national Domogled-vallée de la
      Cerna](/lugar/parcul-national-domogled---valea-cernei/). La [zone de réensauvagement du plateau de
      Mehedinți](/lugar/rewilding-mehedinti-plateau/) est à vingt-sept kilomètres. Plus loin, le [parc
      national de Lovćen](/lugar/nacionalni-park-lovcen/) relève du même domaine karstique.
  de:
    intro: >-
      Das Wasser brauchte Jahrtausende, um sich hier einen Weg zu bahnen, und die Wucht dieses Kampfes ist im
      Fels verewigt. Der Fluss Jaleș (Sohodol) durchschneidet das Vâlcan-Gebirge in einer Schlucht aus
      kreidezeitlichen Kalken, die ein Karstmuseum unter freiem Himmel bildet: Dolinen, Canyons, Karrenfelder,
      Höhlenschlünde und Felswände. Die Cheile Sohodolului erstrecken sich über 350 Hektar nördlich der
      Ortschaft Runcu im Norden des Kreises Gorj an der Grenze zu Hunedoara.
    landscape: >-
      Der Canyon zieht sich über zwölf Kilometer durch das Vâlcan-Gebirge zwischen Runcu und Poiana Contului.
      Das Gebirge gehört zu den Südkarpaten; der höchste Gipfel, Oslea, erreicht 1.946 Meter im Westen.


      Das Wasser war der Gestalter. Über Jahrtausende höhlte es das Gestein aus; so entstanden die
      Nări-Öffnungen, die an menschliche Nasenlöcher erinnern. Die Höhle Nările ist eine geologische
      Seltenheit: zwei parallele Gänge von je rund 70 Metern Länge. Zu den weiteren Felsformen zählen
      Cuptorul, die Höhle Gârla Vacii und der Felsenbogen Inelul.


      Am Eingang liegt die Höhle Peștera Popii, die meistbesuchte Höhle, mit prähistorischen anthropomorphen
      Felsmalereien. Für Höhlenforscher birgt das Tal vertikale Schächte und Klüfte im Speläologie-Gebiet
      Valea Sohodolului/Balta.
    wildlife: >-
      Die floristische Vielfalt ist herausragend: Auf einer Fläche von rund 150.000 bis 200.000 Quadratmetern
      wurden 345 Gefäßpflanzenarten aus 71 Familien gezählt, darunter viele rumänische Rote-Liste-Arten. Diese
      Dichte erklärt sich aus kleinklimatischen Gegensätzen und Kalkböden. Zu den Gehölzen zählen
      Edelkastanien, die vor 1859 gepflanzt wurden.


      Im Hochsommer ist die Schlucht im Schatten der Wände und am kühlen Wasser des Sohodol rund 10 Grad
      kühler als das Vorland.
    visit: >-
      Die Anreise erfolgt über die Nationalstraße DN67D zwischen Târgu Jiu und Baia de Aramă. Eine ausgebaute
      Straße führt durch die Schlucht und eignet sich für Fahrrad, Auto oder Fußgänger, wobei der Fußweg den
      reichsten Eindruck gewährt. Eine Kreisstraße verbindet das Tal über das Gebirge mit Valea de Pești im
      Jiu-Becken. Beim Begehen lassen sich Strudeltöpfe, Höhlenpforten und Felsdurchbrüche aus nächster Nähe
      betrachten.
    history: >-
      Die Schlucht ist ein Naturschutzgebiet von nationaler Bedeutung der IUCN-Kategorie IV auf dem
      Gemeindegebiet von Runcu. In der Kulisse der Felswände wurden Szenen des rumänischen Abenteuerfilms
      Trandafirul Galben um die Figur des Mărgelatu gedreht.
    before: Offenes Feuer und Zelten sind ausschließlich auf den dafür vorgesehenen Rastplätzen gestattet.
    around: >-
      Das [Parâng-Gebirge](/lugar/muntii-parang/) liegt dreizehn Kilometer entfernt und siebzehn Kilometer der
      [Nationalpark Jiu-Schlucht - Urwälder](/lugar/parcul-national-defileul-jiului-codrii-seculari/).
      Neunzehn Kilometer trennen dich vom
      [Retezat-Nationalpark](/lugar/parcul-national-retezat---masivul-muntos/) und zweiundzwanzig Kilometer
      vom [Godeanu-Gebirge](/lugar/muntii-godeanu/) sowie dem [Nationalpark
      Domogled-Cerna-Tal](/lugar/parcul-national-domogled---valea-cernei/). Das
      [Mehedinți-Plateau-Rewilding-Gebiet](/lugar/rewilding-mehedinti-plateau/) liegt siebenundzwanzig
      Kilometer entfernt. Weiter entfernt teilt der [Lovćen-Nationalpark](/lugar/nacionalni-park-lovcen/) die
      Karstformen.
  it:
    intro: >-
      L'acqua ha impiegato millenni per aprirsi un passaggio e i segni di quell'azione rimangono scolpiti
      nella pietra. Il fiume Jaleș (Sohodol) taglia i monti Vâlcan in una forra scavata nei calcari cretacei,
      dando vita a un autentico museo carsico all'aperto: doline, forre, campi carreggiati, abissi, grotte e
      falesie verticali. Le Cheile Sohodolului coprono 350 ettari a nord dell'abitato di Runcu, all'estremità
      settentrionale del distretto di Gorj a ridosso del confine con Hunedoara.
    landscape: >-
      Il canyon si snoda per circa dodici chilometri nei monti Vâlcan tra Runcu e Poiana Contului. I Vâlcan
      appartengono ai Carpati Meridionali, con la vetta più alta, Oslea, che tocca i 1.946 metri all'estremità
      occidentale.


      L'architetto del paesaggio è l'acqua. Nel corso dei millenni ha intagliato la pietra per trovare uno
      sbocco, creando le aperture di Nări che ricordano le narici umane. La grotta Nările è una curiosità
      naturale: due gallerie parallele di circa 70 metri ciascuna. Tra le altre formazioni scolpite nel
      calcare spiccano Cuptorul, la grotta Gârla Vacii e l'arco roccioso di Inelul.


      All'imbocco delle gole si apre la grotta Popii, la più visitata, che conserva pitture rupestri
      antropomorfe nere. Per gli appassionati di speleologia, la vallata offre pozzi verticali e caverne nel
      distretto carsico Valea Sohodolului/Balta.
    wildlife: >-
      La ricchezza risiede nelle piante: su una superficie compresa tra 150.000 e 200.000 metri quadrati della
      vallata sono state censite 345 specie di piante vascolari appartenenti a 71 famiglie, molte delle quali
      rare a livello nazionale. Questa varietà si deve ai microclimi e ai suoli rocciosi. Tra i boschi sorgono
      castagni secolari piantati prima del 1859.


      In estate il canyon risulta circa 10 gradi più fresco della pianura grazie all'ombra delle pareti
      rocciose e alle acque fredde del Sohodol.
    visit: >-
      L'accesso avviene dalla strada statale DN67D che collega Târgu Jiu a Baia de Aramă seguendo la
      segnaletica. Una strada attraversa le gole consentendo la visita in auto, in bicicletta o a piedi,
      quest'ultima consigliata per apprezzare il paesaggio. Una rotabile supera il massiccio montuoso
      collegandosi alla conca di Valea de Pești nel bacino del Jiu occidentale. Camminando si osservano
      marmitte dei giganti, cavità e gallerie di roccia levigata.
    history: >-
      Le gole costituiscono un'area protetta di rilievo nazionale di categoria IV IUCN nel comune di Runcu.
      Tra queste rocce furono girate sequenze del film d'avventura romeno Trandafirul Galben con il
      personaggio di Mărgelatu.
    before: I fuochi e il campeggio sono ammessi esclusivamente nelle piazzole debitamente attrezzate.
    around: >-
      I [Monti Parâng](/lugar/muntii-parang/) distano tredici chilometri e a diciassette chilometri sorge il
      [Parco Nazionale Gola del Jiu - Foreste
      Primarie](/lugar/parcul-national-defileul-jiului-codrii-seculari/). A diciannove chilometri si erge il
      [Parco Nazionale Retezat](/lugar/parcul-national-retezat---masivul-muntos/) e a ventidue i [Monti
      Godeanu](/lugar/muntii-godeanu/) e il [Parco Nazionale Domogled-Valle del
      Cerna](/lugar/parcul-national-domogled---valea-cernei/). L' [Area di Rinselvatichimento dell'Altopiano
      di Mehedinți](/lugar/rewilding-mehedinti-plateau/) dista ventisette chilometri. Più distante, anche il
      [Parco Nazionale di Lovćen](/lugar/nacionalni-park-lovcen/) preserva forme carsiche.
  pt:
    intro: >-
      A água necessitou de milénios para rasgar passagem aqui, e a força desse embate permanece vincada na
      pedra. O rio Jaleș (Sohodol) corta os montes Vâlcan através de uma garganta talhada em calcários
      cretácicos, originando um museu cárstico ao ar livre: algares, desfiladeiros, lapiás, grutas e escarpas
      verticais. As Cheile Sohodolului cobrem 350 hectares a norte da aldeia de Runcu, no extremo setentrional
      do distrito de Gorj junto à fronteira com Hunedoara.
    landscape: >-
      O canhão estende-se por doze quilómetros ao longo dos montes Vâlcan entre Runcu e Poiana Contului. Os
      Vâlcan integram os Cárpatos Meridionais, com o cume mais alto, Oslea, a atingir 1.946 metros no extremo
      ocidental.


      A paisagem foi desenhada pela água. Ao longo de milénios escavou a bancada para encontrar saída,
      originando as cavidades de Nări que se assemelham a narinas humanas. A gruta Nările constitui um
      fenómeno invulgar: duas galerias gémeas com cerca de 70 metros cada. Entre as formações esculpidas
      contam-se Cuptorul, a gruta Gârla Vacii e o arco de pedra Inelul.


      À entrada do desfiladeiro abre-se a gruta Popii, a mais visitada, com pinturas rupestres antropomórficas
      a preto. Para os adeptos da espeleologia, o vale reúne poços verticais e algares no perímetro Valea
      Sohodolului/Balta.
    wildlife: >-
      A grande riqueza botânica manifesta-se nas plantas: numa área contida entre 150.000 a 200.000 metros
      quadrados foram recenseadas 345 espécies de plantas vasculares de 71 famílias, várias delas raras no
      país. Essa abundância num espaço tão circunscrito resulta do relevo abrupto e dos solos rochosos. Entre
      o arvoredo encontram-se castanheiros seculares plantados antes de 1859.


      No verão, a garganta é cerca de 10 graus mais fresca do que a planície devido à sombra dos penhascos e
      às águas límpidas do Sohodol.
    visit: >-
      O acesso faz-se a partir da estrada nacional DN67D que une Târgu Jiu a Baia de Aramă seguindo as placas.
      Uma via asfaltada atravessa a garganta, possibilitando a visita de carro, bicicleta ou a pé, sendo a
      caminhada a forma mais proveitosa de desfrutar o sítio. Uma estrada provincial transpõe a serra e liga à
      área de Valea de Pești na bacia do Jiu ocidental. Caminhando avistam-se marmitas de gigante e fendas de
      escoamento.
    history: >-
      A garganta é uma reserva natural classificada de interesse nacional na categoria IV da UICN, no
      município de Runcu. Nestes cenários foram rodadas sequências do filme romeno Trandafirul Galben
      protagonizado pelo herói popular Mărgelatu.
    before: Fogueiras e acampamento só são admitidos nos locais expressamente autorizados e equipados.
    around: >-
      As [Montanhas de Parâng](/lugar/muntii-parang/) ficam a treze quilómetros e a dezassete o [Parque
      Nacional do Desfiladeiro do Jiu - Florestas
      Primárias](/lugar/parcul-national-defileul-jiului-codrii-seculari/). A dezanove quilómetros situa-se o
      [Parque Nacional Retezat](/lugar/parcul-national-retezat---masivul-muntos/) e a vinte e dois quer as
      [Montanhas de Godeanu](/lugar/muntii-godeanu/) quer o [Parque Nacional Domogled-Vale do
      Cerna](/lugar/parcul-national-domogled---valea-cernei/). A [Área de Renaturalização do Planalto de
      Mehedinți](/lugar/rewilding-mehedinti-plateau/) dista vinte e sete quilómetros. Mais distante, o [Parque
      Nacional de Lovćen](/lugar/nacionalni-park-lovcen/) exibe igualmente relevo cárstico.
