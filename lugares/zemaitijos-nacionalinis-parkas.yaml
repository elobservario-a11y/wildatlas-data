resumen:
  es: >-
    Meseta morrénica boscosa salpicada de lagos cristalinos y turberas protegidas en la región histórica de
    Samogitia.
  en: >-
    Wooded hills, pristine post-glacial lakes and peat bogs in the historical heartland of Samogitia in
    Lithuania.
  fr: Collines boisées, lacs glaciaires limpides et tourbières au cœur historique de la Samogitie en Lituanie.
  de: >-
    Bewaldete Moränenhügel, klare nacheiszeitliche Seen und Hochmoore im historischen Kernland von Samogitien
    in Litauen.
  it: Colline boscose, limpidi laghi post-glaciali e torbiere nel cuore storico della Samogizia in Lituania.
  pt: >-
    Colinas arborizadas, lagos límpidos pós-glaciares e turfeiras no coração histórico da Samogícia, na
    Lituânia.
unico:
  es: >-
    En un mismo paisaje de lagos limpios, turberas y taiga occidental viven peces relictos de la glaciación,
    castros y colinas sagradas de una cultura antigua y un museo en un antiguo silo soviético.
  en: >-
    A labyrinth of moraine hills embracing Lake Plateliai, ancient peat bogs and an authentic Soviet-era
    underground Cold War ballistic missile silo complex.
  fr: >-
    Un labyrinthe de collines morainiques entourant le grand lac Plateliai, des tourbières sauvages et un silo
    souterrain de missiles nucléaires soviétiques de la guerre froide.
  de: >-
    Ein Labyrinth eiszeitlicher Hügel rund um den Plateliai-See, unberührte Moore und eine unterirdische
    sowjetische Atomraketenbasis aus dem Kalten Krieg.
  it: >-
    Un labirinto di colline moreniche attorno al lago Plateliai, torbiere incontaminate e una base sotterranea
    sovietica di missili balistici nucleari della Guerra Fredda.
  pt: >-
    Um labirinto de colinas morenicas em redor do lago Plateliai, turfeiras intocadas e uma base subterrânea
    soviética de mísseis balísticos nucleares da Guerra Fria.
observaciones:
  es: >-
    En las reservas estrictas solo pueden entrar visitantes con fines científicos y con permiso de la
    administración del parque. Antes de ir a los museos y a los senderos, comprueba con el gestor las
    condiciones de visita.
texto:
  es:
    intro: >-
      Hace unos diez o doce mil años, cuando el glaciar se retiró, dejó atrás un país de colinas redondeadas,
      crestas de morrena y hoyos hondos que se llenaron de agua. Eso es hoy el Parque Nacional de Žemaitija:
      una meseta de Samogitia, a 45 km del Báltico, donde los lagos cubren más del 7% del territorio y casi
      toda la vida gira alrededor de uno solo, el Plateliai. Es el más pintoresco, limpio y profundo del
      parque y de toda Samogitia, con 1205 hectáreas, islas, penínsulas y bahías rodeadas de colinas y
      bosques.
    landscape: >-
      El relieve lo explica el hielo. Las colinas redondeadas de kame y las crestas morrénicas rodean la
      cubeta del lago Plateliai, y entre ellas se reparten lagos hondos o someros, turberas y arroyos
      sinuosos. La altitud va de 110 a 191,8 metros sobre el nivel del mar.


      Los lagos son 26, naturales, y suman 1484,2 hectáreas, formados después de la última glaciación. Tres de
      ellos, Plateliai, Ilgis y Beržoras, ocupan casi el 90% del conjunto y todos tienen islas; el Plateliai
      tiene siete. Entre las colinas hay también lagos pequeños rodeados de turbera, como Lestis, Piktežeris y
      Aklaežeris: son distróficos, casi sin flora, y el agua es parda por la turba. El río Babrungas nace en
      el Plateliai y recorre 10 km dentro del parque; el Uošna, en cambio, es el más largo del parque, con
      13,3 km de sus 16,6 km dentro.


      El bosque cubre casi el 45% del territorio. Dominan los abetales, que son el 47% de las masas, seguidos
      de pinares (26%) y abedulares (13%), con alisedas y robledales. Los bosques de coníferas viejos y mixtos
      se conocen como taiga occidental y están protegidos en toda Europa. Y entre las colinas, en las
      hondonadas, se formaron muchas turberas, uno de los ecosistemas mejor conservados.
    wildlife: >-
      El parque es un buen lugar de aves. En las turberas anidan aves muy raras y amenazadas: la
      [grulla](/especie/grus_grus/), el zarapito, la agachadiza y la lavandera boyera. La grulla, antes una
      gran rareza, se ha multiplicado, y su trompeteo se oye hoy en casi cada turbera grande. Entre las aves
      muy raras del parque están la [cigüeña negra](/especie/ciconia_nigra/), el ratonero, el zampullín
      cuellirrojo y el pito cano. Anidan además especies protegidas en Europa como el grévol, el [guión de
      codornices](/especie/crex_crex/) y el [cisne cantor](/especie/cygnus_cygnus/). Con el inicio de la cría,
      desde los carrizales de las orillas se oye al [avetoro](/especie/botaurus_stellaris/), y cada año crían
      más de cien parejas de [cigüeña blanca](/especie/ciconia_ciconia/) en nidos sobre tejados, postes y
      árboles.


      En el lago Plateliai, los cormoranes grandes se agrupan cada año, varios cientos de ellos, en los
      árboles de la península de Auksalė. Y bajo el agua, en el Plateliai viven los peces relictos de agua
      fría, el eperlano de lago y el coregono lacustre. Treinta y una especies de peces se reproducen en el
      parque, y también vive el cangrejo de río de pinzas anchas.


      Entre los mamíferos, trece de las 49 especies figuran en la Lista Roja de Lituania, entre ellas el
      [lince](/especie/lynx_lynx/) y la [nutria](/especie/lutra_lutra/). Once especies de murciélagos viven en
      el territorio, de las quince de Lituania, con el orejudo pardo y el murciélago de Nathusius como los más
      frecuentes. Y los [castores](/especie/castor_fiber/) hacen su parte: las pequeñas turberas y charcas que
      forman son muy importantes para la diversidad biológica durante sus primeros cinco a ocho años.


      En flora, el parque tiene 1253 especies, 70 de ellas en la Lista Roja de Lituania. Entre las plantas
      protegidas en Europa están Botrychium simplex y la orquídea Liparis loeselii, y hay reliquias de la
      época glaciar como Cladium mariscus, Salix lapponum y Primula farinosa. Se han hallado también más de
      500 especies de hongos y 260 de líquenes.
    visit: >-
      Plateliai, el pueblo junto al lago, es la puerta de entrada: aquí está el Centro de Visitantes de la
      dirección del parque, y se llega en autobús desde la estación de Plungė. En el antiguo señorío de
      Plateliai, la caballeriza alberga el Museo del Martes de Carnaval y el granero, una exposición
      histórico-etnográfica y de naturaleza, con acceso interactivo a la vida salvaje del parque.


      Para caminar, el sendero Šeirė mide 4,1 km, con un tramo de 1,4 km adaptado para personas con movilidad
      reducida. Pasa por la turbera de Gaudupis, el lago Piktežeris y la orilla del lago Plateliai, y comparte
      1,8 km con el circuito ciclista del lago. La ruta forestal de Liepijų tiene 4 km, atraviesa un bosque
      natural y lleva paneles que explican los puntos más interesantes. El circuito ciclista alrededor del
      lago mide 24 km.
    history: >-
      El parque cuida más de doscientos bienes de patrimonio cultural, desde la Edad de Piedra: castros,
      lugares sagrados, cementerios y asentamientos. Destacan las iglesias de Plateliai y Beržoras, la
      basílica de Žemaičių Kalvarija, el molino de Babrungėnai y las cruces, capillas y cruces con tejadillo
      de Samogitia. Las viejas costumbres se hacen notar sobre todo en el tradicional Carnaval.


      La otra historia es mucho más reciente. El Museo de la Guerra Fría ocupa un antiguo complejo soviético
      de silos de misiles balísticos, donde de 1963 a 1978 hubo cuatro misiles SS-4. En conservación, el
      parque tiene dos reservas naturales estrictas, Plokštinė y Rukundžiai.
    before: >-
      En las reservas estrictas solo pueden entrar visitantes con fines científicos y con permiso de la
      administración del parque. Antes de ir a los museos y a los senderos, comprueba con el gestor las
      condiciones de visita.
  en:
    intro: >-
      In Samogitia, in north-western Lithuania, the last glacier left behind an undulating landscape of
      moraine hillocks, lakes and bogs. Žemaitija National Park was established to preserve this natural and
      ethnographic tapestry: 12.05 km² of rolling uplands and hollows, where 45% of the territory is covered
      in forest and 7 lakes interlink amid historic villages and ancient hillforts.
    landscape: >-
      The terrain is distinctly hummocky: rounded hills and glacial ridges alternate with deep depressions
      sheltering deep or shallow lakes, raised bogs and meandering forest brooks. Altitudes range between 110
      and 191.8 metres above sea level.


      There are 26 natural lakes covering 1484.2 hectares, formed following the glacial retreat. Three of
      them—Plateliai, Ilgis and Beržoras—encompass almost 90% of the lacustrine area and all feature wooded
      islands; Lake Plateliai boasts seven islands. Tucked among hills lie smaller dystrophic kettle bogs such
      as Lestis, Piktežeris and Aklaežeris, with dark peat-stained waters. The Babrungas river drains Lake
      Plateliai, flowing for 10 km within the park; the Uošna is the longest park stream, running for 13.3 km
      of its 16.6 km length inside the boundary.


      Forests blanket roughly 45% of the park. Spruce stands predominate (47%), followed by pine woods (26%)
      and birch groves (13%), interspersed with black alder swamps and ancient oak woods. Mature Western Taiga
      coniferous forests are strictly protected under European law.
    wildlife: >-
      The national park is an exceptional bird sanctuary. In the secluded bogs breed rare species: the [common
      crane](/especie/grus_grus/), Eurasian curlew, common snipe and western yellow wagtail. Crane numbers
      have rebounded significantly, their bugling echoing across every major bog. Other rare avian residents
      include the [black stork](/especie/ciconia_nigra/), common buzzard, red-necked grebe and grey-headed
      woodpecker. Protected European breeders include the hazel grouse, [corncrake](/especie/crex_crex/) and
      [whooper swan](/especie/cygnus_cygnus/). In spring, the booming call of the [Eurasian
      bittern](/especie/botaurus_stellaris/) resounds from shoreline reedbeds, and over a hundred pairs of
      [white storks](/especie/ciconia_ciconia/) nest atop village rooftops and poles.


      On Lake Plateliai, hundreds of great cormorants gather annually on the Auksalė peninsula. Beneath the
      surface dwell glacial relict fish like lake smelt and European whitefish. Thirty-one fish species spawn
      within park waters alongside broad-fingered noble crayfish.


      Among mammals, thirteen of 49 documented species are listed in Lithuania's Red Data Book, including the
      Eurasian [lynx](/especie/lynx_lynx/) and European [otter](/especie/lutra_lutra/). Eleven bat species
      inhabit the territory. European [beavers](/especie/castor_fiber/) play a vital hydrological role, their
      ponds enriching wetland biodiversity during their initial five to eight years.


      The flora comprises 1253 plant species, with 70 featured in the national Red Book, including small
      grapefern (*Botrychium simplex*), fen orchid (*Liparis loeselii*) and glacial relicts such as fen sedge
      (*Cladium mariscus*), downy willow and bird's-eye primrose. Mycologists have catalogued over 500 fungi
      and 260 lichen species.
    visit: >-
      Plateliai village serves as the primary gateway, hosting the park visitor centre accessible by bus from
      Plungė railway station. In the historic Plateliai manor, the stables house the Shrove Tuesday Carnival
      Mask Museum while the granary features ethnographic and nature exhibits.


      For walking, the Šeirė educational trail spans 4.1 km, with a 1.4 km barrier-free section adapted for
      reduced mobility. It winds past Gaudupis bog, Lake Piktežeris and Lake Plateliai shore, sharing 1.8 km
      with the lake cycle path. The Liepijų forest trail covers 4 km through natural woodland, while the
      complete bicycle circuit around Lake Plateliai extends for 24 km.
    history: >-
      The park safeguards over two hundred cultural heritage sites dating back to the Stone Age: ancient
      hillforts, sacred groves, burial mounds and historic villages. Notable landmarks include the wooden
      churches of Plateliai and Beržoras, the basilica of Žemaičių Kalvarija and the traditional Samogitian
      carved roadside crosses and roofed folk shrines.


      Modern history is represented by the Cold War Museum, situated inside a former top-secret Soviet
      ballistic missile base that housed four SS-4 nuclear missiles between 1963 and 1978. In nature
      conservation, the park encompasses two strict nature reserves, Plokštinė and Rukundžiai.
    before: >-
      Entering strict nature reserves is permitted only for scientific research with written authorization
      from the park directorate. Check operating hours and visitor conditions with the visitor centre before
      touring the Cold War Museum or nature trails.
  fr:
    intro: >-
      En Samogitie, dans le nord-ouest de la Lituanie, la fonte des calottes glaciaires a laissé une
      topographie ondulée de buttes morainiques, de lacs et de tourbières. Le parc national de Žemaitija a été
      créé pour préserver ce paysage naturel et culturel : 12,05 km² de collines et vallons où 45 % du
      territoire est boisé et 7 lacs s'égrènent au milieu de villages traditionnels et d'anciens castros.
    landscape: >-
      Le relief est très vallonné : crêtes glaciaires et collines morainiques alternent avec des cuvettes
      abritant lacs calmes, tourbières ombrotrophiques et ruisseaux sinueux. L'altitude s'étage de 110 à 191,8
      mètres au-dessus du niveau de la mer.


      Le parc compte 26 lacs naturels couvrant 1484,2 hectares, issus du retrait glaciaire. Trois d'entre
      eux—Plateliai, Ilgis et Beržoras—représentent près de 90 % de la superficie lacustre et comportent tous
      des îles boisées ; le lac Plateliai en compte sept. Nichés entre les collines s'étendent aussi de petits
      lacs dystrophes comme Lestis, Piktežeris et Aklaežeris, aux eaux sombres teintées par la tourbe. La
      rivière Babrungas naît dans le lac Plateliai et s'écoule sur 10 km dans le parc ; l'Uošna est le cours
      d'eau le plus long du parc, avec 13,3 km de ses 16,6 km situés à l'intérieur des limites.


      La forêt couvre environ 45 % du territoire. L'épicéa domine (47 % des peuplements), suivi du pin
      sylvestre (26 %) et du bouleau (13 %), complétés par des aulnaies et des chênaies. Ces forêts de
      conifères reliques constituent la taïga occidentale, protégée à l'échelle européenne.
    wildlife: >-
      Le parc constitue un remarquable havre ornithologique. Dans les tourbières nichent des oiseaux rares :
      la [grue cendrée](/especie/grus_grus/), le courlis cendré, la bécassine des marais et la bergeronnette
      printanière. Les grues ont vu leurs effectifs croître et leurs trompètements résonnent sur chaque
      tourbière majeure. Parmi les raretés figurent la [cigogne noire](/especie/ciconia_nigra/), la buse
      variable, le grèbe jougris et le pic cendré. S'y reproduisent également la gélinotte des bois, le [râle
      des genêts](/especie/crex_crex/) et le [cygne chanteur](/especie/cygnus_cygnus/). Dans les roselières
      résonne le [butor étoilé](/especie/botaurus_stellaris/), tandis que plus de cent couples de [cigognes
      blanches](/especie/ciconia_ciconia/) nichent dans les hameaux.


      Sur le lac Plateliai, des centaines de grands cormorans se rassemblent chaque année sur la presqu'île
      d'Auksalė. Dans les eaux profondes nagent des poissons reliques glaciaires comme l'éperlan de lac et le
      corégone blanc. Trente-et-une espèces de poissons fraient dans le parc aux côtés de l'écrevisse à pattes
      rouges.


      Côté mammifères, treize des 49 espèces recensées figurent sur la Liste rouge de Lituanie, dont le
      [lynx](/especie/lynx_lynx/) boréal et la [loutre](/especie/lutra_lutra/). On compte onze espèces de
      chauves-souris. Les [castors](/especie/castor_fiber/) jouent un rôle écologique déterminant en créant
      des plans d'eau favorables à la biodiversité pendant leurs premières cinq à huit années.


      La flore compte 1253 espèces de plantes, dont 70 inscrites sur la Liste rouge nationale, notamment le
      botryche simple (*Botrychium simplex*), le liparis de Loesel et des reliques glaciaires. On y recense
      plus de 500 champignons et 260 lichens.
    visit: >-
      Plateliai est la porte d'entrée du parc : on y trouve la maison du parc, desservie en car depuis la gare
      de Plungė. Dans l'ancien manoir seigneurial, les écuries accueillent le musée des Masques de Carnaval
      tandis que le grenier abrite une muséographie sur la nature et l'ethnographie samogitienne.


      Le sentier pédagogique de Šeirė s'étire sur 4,1 km, dont 1,4 km accessible aux personnes à mobilité
      réduite, traversant la tourbière de Gaudupis et longeant le lac Plateliai sur 1,8 km commun avec la
      piste cyclable. Le sentier forestier de Liepijų parcourt 4 km en forêt naturelle, et le grand circuit
      cyclable autour du lac mesure 24 km.
    history: >-
      Le parc veille sur plus de deux cents monuments du patrimoine culturel : castros préhistoriques, sites
      sacrés païens et villages traditionnels. On admire les églises en bois de Plateliai et Beržoras, la
      basilique de Žemaičių Kalvarija et les calvaires sculptés typiques de Samogitie.


      L'histoire contemporaine est marquée par le musée de la Guerre froide, aménagé dans une ancienne base
      souterraine soviétique qui hébergea quatre missiles nucléaires SS-4 entre 1963 et 1978. Deux réserves
      intégrales, Plokštinė et Rukundžiai, sanctuarisent les biotopes les plus fragiles.
    before: >-
      L'accès aux réserves intégrales est strictement réservé aux missions scientifiques munies d'une
      autorisation préalable. Renseignez-vous auprès du centre d'accueil sur les modalités d'accès au musée de
      la Guerre froide et aux sentiers.
  de:
    intro: >-
      In Niederlitauen (Samogitien) im Nordwesten Litauens hinterließ das Inlandeis eine bewegte
      Hügellandschaft aus Moränen, Seen und Mooren. Der Nationalpark Žemaitija wurde geschaffen, um dieses
      Mosaik zu bewahren: 12,05 km² kuppige Höhen und Senken, auf denen 45 % der Fläche bewaldet sind und 7
      Seen inmitten alter Dörfer und Burgberge liegen.
    landscape: >-
      Das Relief ist ausgeprägt hügelig: Moränenkuppen und Oser wechseln sich mit Kesseln ab, in denen tiefe
      oder seichte Seen, Moore und Bäche liegen. Die Höhenlage reicht von 110 bis 191,8 Meter über dem
      Meeresspiegel.


      Die 26 natürlichen Seen bedecken 1484,2 Hektar und entstanden nach der letzten Eiszeit. Drei von
      ihnen—Plateliai, Ilgis und Beržoras—machen fast 90 % der gesamten Seefläche aus und besitzen bewaldete
      Inseln; der Plateliai-See birgt allein sieben Eilande. In Senken liegen dystrophe Moorseen wie Lestis,
      Piktežeris und Aklaežeris mit torfbraunem Wasser. Die Babrungas entspringt im Plateliai und fließt 10 km
      durch den Park; die Uošna ist mit 13,3 km ihrer 16,6 km Gesamtlänge der längste Fluss im Park.


      Wälder bedecken rund 45 % des Gebiets. Fichtenwälder dominieren (47 %), gefolgt von Kiefernforsten (26
      %) und Birkenbeständen (13 %), ergänzt durch Schwarzerlenbrüche und alte Eichen. Diese naturnahen
      Nadelmischwälder bilden die europaweit geschützte Westliche Taiga.
    wildlife: >-
      Der Park ist ein herausragendes Vogelschutzgebiet. In den Mooren brüten seltene Arten wie der
      [Kranich](/especie/grus_grus/), Großer Brachvogel, Bekassine und Schafstelze. Der Kranichbestand hat
      sich erholt, sodass seine Rufe über fast jedem Moor hallen. Zu den seltenen Vögeln zählen
      [Schwarzstorch](/especie/ciconia_nigra/), Mäusebussard, Ohrentaucher und Grauspecht. Auch Haselhuhn,
      [Wachtelkönig](/especie/crex_crex/) und [Singschwan](/especie/cygnus_cygnus/) brüten hier. Im Frühjahr
      ertönt der Ruf der [Rohrdommel](/especie/botaurus_stellaris/) aus dem Schilf, während über einhundert
      Paare des [Weißstorchs](/especie/ciconia_ciconia/) in den Dörfern nisten.


      Am Plateliai-See versammeln sich alljährlich Hunderte Kormorane auf der Halbinsel Auksalė. In den Tiefen
      leben Kaltwasser-Reliktfische wie Stint und Kleine Maräne. Einunddreißig Fischarten laichen im Park, und
      auch der Edelkrebs kommt vor.


      Unter den Säugetieren stehen dreizehn der 49 Arten auf der Roten Liste Litauens, darunter
      [Luchs](/especie/lynx_lynx/) und [Fischotter](/especie/lutra_lutra/). Elf Fledermausarten bewohnen das
      Gebiet. Europäische [Biber](/especie/castor_fiber/) schaffen Teiche, die in ihren ersten fünf bis acht
      Jahren die Artenvielfalt bereichern.


      Die Pflanzenwelt umfasst 1253 Arten, von denen 70 auf der Roten Liste stehen, darunter die Einfache
      Mondraute (*Botrychium simplex*), Glanzorchis und Eiszeitrelikte. Über 500 Pilzarten und 260 Flechten
      wurden erfasst.
    visit: >-
      Plateliai am Seeufer ist das Tor zum Nationalpark mit dem Besucherzentrum, erreichbar per Bus ab Bahnhof
      Plungė. Im ehemaligen Gutshof beherbergen die Stallungen das Fastnachtsmaskenmuseum und der Speicher
      Ausstellungen zu Natur und Volkskultur.


      Der Lehrpfad Šeirė misst 4,1 km, wovon 1,4 km barrierefrei ausgebaut sind; er führt am Gaudupis-Moor und
      Piktežeris-See vorbei und verläuft 1,8 km auf dem Radrundweg. Der Waldpfad Liepijų umfasst 4 km durch
      Naturwald, während die Radrunde um den Plateliai-See 24 km misst.
    history: >-
      Über zweihundert Kulturdenkmäler zeugen von einer Besiedlung seit der Steinzeit: Burgberge, heidnische
      Opferplätze und Holzkirchen in Plateliai und Beržoras, die Basilika in Žemaičių Kalvarija sowie
      geschnitzte samogitische Holzkreuze prägen das Land.


      Jüngere Geschichte dokumentiert das Museum des Kalten Krieges in einer unterirdischen sowjetischen
      Raketenbasis, die von 1963 bis 1978 vier atomare Mittelstreckenraketen des Typs SS-4 beherbergte. Die
      Kernzonen Plokštinė und Rukundžiai stehen unter absolutem Schutz.
    before: >-
      Das Betreten der Kernzonen ist nur für wissenschaftliche Zwecke mit Sondergenehmigung gestattet.
      Informiere dich vor Besuchen im Museum des Kalten Krieges oder auf Wanderwegen im Besucherzentrum.
  it:
    intro: >-
      In Samogizia, nella Lituania nord-occidentale, l'ultima calotta glaciale ha lasciato un paesaggio
      ondulato di rilievi morenici, specchi d'acqua e torbiere. Il Parco Nazionale di Žemaitija è stato
      istituito per salvaguardare questo mosaico naturale e rurale: 12,05 km² di rilievi e avvallamenti, dove
      il 45% del territorio è boscoso e 7 laghi si snodano tra borghi tradizionali e antichi castellieri.
    landscape: >-
      La morfologia è marcatamente ondulata: dossi e colline moreniche si alternano a conche che ospitano
      laghi profondi o laminari, torbiere alte e ruscelli boschivi. L'altitudine spazia tra 110 e 191,8 metri
      sul livello del mare.


      I 26 laghi naturali coprono 1484,2 ettari, originatisi dopo l'ultima glaciazione. Tre di essi—Plateliai,
      Ilgis e Beržoras—costituiscono quasi il 90% dell'area lacustre e racchiudono isole boscose; il lago
      Plateliai ne conta sette. Tra i rilievi si celano piccoli bacini distrofici come Lestis, Piktežeris e
      Aklaežeris, dalle acque scure tinte dalla torba. Il fiume Babrungas nasce nel Plateliai e scorre per 10
      km nel parco; l'Uošna è il corso d'acqua più lungo, scorrendo per 13,3 km dei suoi 16,6 km complessivi
      entro i confini protetti.


      I boschi ricoprono circa il 45% del parco. Prevalgono le peccete (47%), seguite da pinete (26%) e
      betuleti (13%), con ontanete nere e querce secolari. Queste foreste boreali intatte costituiscono la
      Taiga occidentale, protetta a livello europeo.
    wildlife: >-
      Il parco costituisce un importante rifugio ornitologico. Nelle torbiere nidificano specie minacciate: la
      [gru](/especie/grus_grus/), il chiurlo maggiore, il beccaccino e la cutrettola. La gru è tornata comune
      e il suo richiamo echeggia in ogni grande palude. Tra i volatili rari si osservano la [cicogna
      nera](/especie/ciconia_nigra/), la poiana comune, lo svasso collorosso e il picchio cenerino. Nidificano
      inoltre il francolino di monte, il [re di quaglie](/especie/crex_crex/) e il [cigno
      selvatico](/especie/cygnus_cygnus/). Dai canneti risuona il canto del
      [tarabuso](/especie/botaurus_stellaris/), mentre oltre cento coppie di [cicogna
      bianca](/especie/ciconia_ciconia/) nidificano nei villaggi.


      Sul lago Plateliai centinaia di cormorani si radunano ogni anno nella penisola di Auksalė. Nei fondali
      vivono pesci relitti glaciali come il brio e il coregone bianco. Trentuno specie ittiche si riproducono
      nel parco, popolato anche dal gambero di fiume europeo.


      Tra i mammiferi, tredici delle 49 specie censite sono inserite nel Libro Rosso della Lituania, compresi
      la [lince](/especie/lynx_lynx/) e la [lontra](/especie/lutra_lutra/). Undici specie di pipistrelli
      popolano i boschi. I [castori](/especie/castor_fiber/) creano piccoli specchi d'acqua preziosi per la
      biodiversità durante i primi cinque-otto anni di attività.


      La flora include 1253 specie di piante vascolari, con 70 entità minacciate, tra cui Botrychium simplex,
      Liparis loeselii e relitti glaciali. Sono stati catalogati oltre 500 funghi e 260 licheni.
    visit: >-
      Plateliai è il centro d'accesso principale con il centro visite del parco, raggiungibile in autobus da
      Plungė. Nel vecchio maniero le scuderie ospitano il Museo delle Maschere di Carnevale e il granaio una
      mostra sulla natura e sulla cultura samogitica.


      Il sentiero didattico Šeirė misura 4,1 km, con 1,4 km accessibile a persone con disabilità; attraversa
      la torbiera di Gaudupis e lambisce il lago Plateliai, condividendo 1,8 km con la pista ciclabile. Il
      percorso forestale Liepijų copre 4 km in bosco naturale, mentre l'anello ciclabile attorno al lago
      Plateliai misura 24 km.
    history: >-
      Il parco tutela oltre duecento monumenti storici risalenti fino all'età della pietra: castellieri,
      boschi sacri pagani e antiche necropoli. Spiccano le chiese lignee di Plateliai e Beržoras, la basilica
      di Žemaičių Kalvarija e i tipici capitelli votivi in legno intagliato della Samogizia.


      La storia recente è documentata dal Museo della Guerra Fredda, ricavato in un silo sotterraneo sovietico
      che dal 1963 al 1978 custodì quattro missili nucleari SS-4. Due riserve integrali, Plokštinė e
      Rukundžiai, tutelano gli ecosistemi più vulnerabili.
    before: >-
      L'ingresso nelle riserve integrali è consentito unicamente per ricerche scientifiche previa
      autorizzazione. Informati presso il centro visite sugli orari del Museo della Guerra Fredda e sulla
      percorribilità dei sentieri.
  pt:
    intro: >-
      Na Samogícia, no noroeste da Lituânia, o recuo do manto de gelo deixou uma paisagem ondulada de colinas
      morenicas, lagos e turfeiras. O Parque Nacional de Žemaitija foi criado para proteger esta matriz
      natural e etnográfica: 12,05 km² de relevos e depressões, onde 45% da área é arborizada e 7 lagos
      comunicam entre povoações históricas e antigos castros pagãos.
    landscape: >-
      O relevo é nitidamente acidentado: lombas morenicas e cômoros alternam com covas que retêm lagos
      profundos ou lamacentos, turfeiras altas e ribeiros florestais. A altitude varia entre 110 e 191,8
      metros acima do nível do mar.


      Existem 26 lagos naturais cobrindo 1484,2 hectares, esculpidos pelo degelo glaciar. Três
      deles—Plateliai, Ilgis e Beržoras—concentram quase 90% da superfície lacustre e possuem ilhas
      arborizadas; o lago Plateliai conta com sete ilhotas. Nos fundos de vale ocultam-se pequenos lagos
      distróficos como Lestis, Piktežeris e Aklaežeris, de águas escuras tingidas pela turfa. O rio Babrungas
      nasce no Plateliai e corre 10 km dentro do parque; o Uošna é o rio mais longo da reserva, com 13,3 km
      dos seus 16,6 km totais no interior da área protegida.


      A floresta cobre cerca de 45% do território. Predominam os abetais de espruce (47%), seguidos de pinhais
      (26%) e bétulas (13%), pontuados por amiais e carvalhais seculares. Estas matas boreais maduras integram
      a Taiga Ocidental, protegida pela União Europeia.
    wildlife: >-
      O parque é um santuário ornitológico notável. Nas turfeiras nidificam espécies vulneráveis: o
      [grou-comum](/especie/grus_grus/), o maçarico-real, a narceja-comum e a alvéola-amarela. A população de
      grous recuperou fortemente e o seu trompetear ouve-se em quase todas as grandes turfeiras. Entre as aves
      raras contam-se a [cegonha-preta](/especie/ciconia_nigra/), a águia-d'asa-redonda, o
      mergulhão-de-pescoço-castanho e o pica-pau-cinzento. Nidificam também a galinha-do-mato, o
      [codornizão](/especie/crex_crex/) e o [cisne-bravo](/especie/cygnus_cygnus/). Nos caniçais escuta-se o
      [abicaravão](/especie/botaurus_stellaris/), enquanto mais de cem casais de
      [cegonha-branca](/especie/ciconia_ciconia/) nidificam nas aldeias.


      No lago Plateliai reúnem-se anualmente centenas de corvos-marinhos na península de Auksalė. Nas
      profundezas vivem peixes relíquias da Idade do Gelo, como o eperlano e a corégona-branca. Trinta e uma
      espécies de peixes desovam nas águas do parque, que albergam também o lagostim-de-patas-vermelhas.


      Nos mamíferos, treze das 49 espécies constam do Livro Vermelho da Lituânia, incluindo o
      [lince](/especie/lynx_lynx/) e a [lontra](/especie/lutra_lutra/). Registam-se onze espécies de morcegos.
      Os [castores](/especie/castor_fiber/) criam pequenas lagoas e canais essenciais à biodiversidade durante
      os seus primeiros cinco a oito anos de atividade.


      A flora soma 1253 espécies de plantas vasculares, com 70 ameaçadas, como Botrychium simplex, Liparis
      loeselii e relíquias glaciares. Estão catalogadas mais de 500 espécies de fungos e 260 de líquenes.
    visit: >-
      A vila de Plateliai é a porta de entrada com o centro de visitantes, acessível de autocarro a partir de
      Plungė. Na antiga quinta senhorial, as cavalariças albergam o Museu de Máscaras de Carnaval e o celeiro
      uma mostra sobre a natureza e a cultura popular da Samogícia.


      O trilho de interpretação de Šeirė tem 4,1 km, com 1,4 km adaptado para mobilidade reduzida; passa pela
      turfeira de Gaudupis e orla do lago Plateliai, partilhando 1,8 km com a ciclovia. O percurso florestal
      de Liepijų tem 4 km por bosque natural, e a rota de bicicleta em redor do lago Plateliai perfaz 24 km.
    history: >-
      O parque salvaguarda mais de duzentos sítios do património cultural desde a Idade da Pedra: castros
      defensivos, outeiros sagrados pagãos e cemitérios seculares. Destacam-se as igrejas de madeira de
      Plateliai e Beržoras, a basílica de Žemaičių Kalvarija e as cruzes votivas esculpidas em madeira da
      Samogícia.


      A história contemporânea está patente no Museu da Guerra Fria, instalado num antigo silo subterrâneo
      soviético que entre 1963 e 1978 abrigou quatro mísseis balísticos nucleares SS-4. Duas reservas
      integrais, Plokštinė e Rukundžiai, preservam os habitats intocados.
    before: >-
      A entrada nas reservas integrais só é permitida para fins de investigação científica com autorização
      formal. Consulta o centro de visitantes para conhecer horários do Museu da Guerra Fria e estado dos
      trilhos.
