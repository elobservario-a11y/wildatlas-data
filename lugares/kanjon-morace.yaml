unico:
  es: >-
    Un cañón de paredes de hasta mil metros por el que corre tanto la carretera como un corredor de vida entre
    las montañas y el lago Skadar.
  en: >-
    A canyon carved by thousand-metre cliffs carrying both the main transport artery and a vital ecological
    corridor linking northern mountains with Lake Skadar.
  fr: >-
    Un défilé aux falaises hautes de mille mètres où cheminent à la fois la route panoramique et un couloir
    écologique reliant la montagne au lac Skadar.
  de: >-
    Ein Canyon mit bis zu tausend Meter hohen Felswänden, durch den sich sowohl die Fernstraße als auch ein
    Lebensraumkorridor zwischen Hochgebirge und Skutarisee zieht.
  it: >-
    Un canyon con pareti verticali fino a mille metri percorso sia dalla strada statale sia da un corridoio
    ecologico tra le montagne e il lago di Scutari.
  pt: >-
    Um desfiladeiro com escarpas de até mil metros por onde serpenteiam a estrada panorâmica e um corredor
    ecológico entre as montanhas e o lago Skadar.
observaciones:
  es: La mejor época va de mayo a octubre.
texto:
  es:
    intro: >-
      La carretera que baja de Kolašin a Podgorica no recorre un valle: recorre el fondo de un cañón. El
      Morača, un río de montaña rápido y relativamente pequeño, ha excavado en la roca una garganta de paredes
      enormes y escarpadas, de hasta 1000 metros de profundidad, y en lugar de apartarse de ella, la carretera
      principal que lleva a Podgorica y a la costa montenegrina la sigue.


      Es un cañón corto para un río largo: el Morača supera los 100 kilómetros, pero el tramo encajado ocupa
      solo 30 kilómetros de su curso medio, justo antes de que el río salga a la llanura de Zeta.
    landscape: >-
      El cañón se extiende por los municipios de Podgorica y Kolašin. Visto desde arriba tiene dos tramos: la
      parte montañosa, que arranca en el norte de Montenegro, donde el río ha cortado la roca hasta alcanzar
      su mayor profundidad en la región de Tisov Vrh, unos 1000 metros; y la parte baja, que sale a la llanura
      y, tras recibir al Zeta, su mayor afluente, llega al lago Skadar. El otro gran afluente es el Cijevna,
      que entra por la izquierda.


      El Morača no es un río de gran caudal: mide unos 100 metros de ancho y suele ser poco profundo, de modo
      que su curso no se ha modificado. El clima del cañón, en parte mediterráneo, y las diferencias de
      altitud mezclan el sur submediterráneo con el norte dinárico, más montañoso.
    wildlife: >-
      El cañón funciona como corredor migratorio entre el lago Skadar y el valle de Podgorica, y como refugio
      de especies mediterráneas y esteparias que necesitan menos oscilaciones de clima. En su cuenca hay 993
      especies de plantas, de 498 géneros y 107 familias, entre ellas mediterráneas, submediterráneas,
      centroeuropeas y de montaña, según la altura.


      El agua guarda su propia riqueza: se han encontrado 30 especies de peces, ocho de ellas en la Lista Roja
      de la UICN, y su fauna es singular porque mezcla peces del Adriático y de la cuenca del Danubio; para
      algunas especies con centro de distribución en Albania, el Morača es el límite norte. Las truchas migran
      y dependen de la conexión entre la cuenca alta y la baja.


      La zona es rica en grandes mamíferos y en pequeños depredadores, y tiene muchas especies de aves, sobre
      todo rapaces.
    visit: >-
      La ruta es la propia carretera. Enlaza Podgorica con Kolašin y el norte de Montenegro, y recorre el
      cañón de punta a punta.


      Al norte del cañón, en el valle del río, está el monasterio de Morača, fundado en 1252. Sus frescos más
      antiguos son once escenas de la vida del profeta Elías, del siglo XIII.
    history: >-
      El Morača es uno de los símbolos de Podgorica y el mayor río que atraviesa la ciudad. El lago Skadar, al
      que desemboca, es una criptodepresión que el Morača alimenta y que el río Buna drena al Adriático. La
      cuenca del Morača cubre 3257 kilómetros cuadrados.
    before: La mejor época va de mayo a octubre.
    around: >-
      A dos kilómetros están los [Montes Komovi](/lugar/park-prirode-komovi/), y a cinco el [Cañón del Río
      Cijevna](/lugar/kanjon-cijevine/), el otro gran afluente del Morača. A ocho kilómetros se encuentran el
      [Parque Nacional de los Alpes Albaneses](/lugar/parku-kombetar-i-alpeve-te-shqiperise/) y la [Reserva
      Natural Estricta del Río Gashi](/lugar/rezervati-natyror-i-strazuar-lumi-i/). A dieciséis kilómetros
      está el [Parque Nacional del Lago Skadar](/lugar/nacionalni-park-skadarsko-jezero/), donde desemboca el
      río, y a diecisiete la [Meseta Kárstica de Sinjajevina](/lugar/sinjajevina-karst-plateau/).
  en:
    intro: >-
      The road winding down from Kolašin toward Podgorica does not trace a gentle valley: it cuts directly
      through the abyss of a gorge. The Morača, a swift and relatively small mountain river, has chiseled an
      immense defile through solid karst limestone, plunging down sheer cliffs up to 1000 metres deep. Rather
      than bypassing this obstacle, the main arterial highway connecting the interior with Podgorica and the
      Montenegrin coast runs along its bedrock ledge.


      It is a compact canyon carved by a longer river: while the Morača exceeds 100 kilometres in total
      length, the canyon proper spans just 30 kilometres along its middle reach, immediately before the river
      emerges onto the fertile Zeta plain.
    landscape: >-
      The canyon extends across the municipalities of Podgorica and Kolašin. Viewed geographically, it divides
      into two contrasting sectors: the rugged northern canyon, where the river carves through mountain
      bedrock to reach its greatest depth near Tisov Vrh, roughly 1000 metres below the rim; and the gentler
      lower basin, which opens into lowland plains to join the Zeta River, its largest tributary, before
      emptying into Lake Skadar. Another major tributary, the Cijevna, enters from the left bank.


      The Morača is not a high-volume river: it measures around 100 metres in width and remains relatively
      shallow, which has preserved its natural bed from major damming. The local climate blends Mediterranean
      warmth with Dinaric alpine extremes, creating a distinct biogeographic transition zone.
    wildlife: >-
      The gorge serves as a critical migration corridor linking Lake Skadar with the Podgorica valley, and as
      a thermal refuge for Mediterranean and steppe species sensitive to severe winter frosts. Its drainage
      basin harbors 993 plant species belonging to 498 genera and 107 families, intermingling Mediterranean,
      sub-Mediterranean, Central European, and alpine taxa along the elevation gradient.


      The aquatic ecosystem is equally rich: researchers have identified 30 fish species, eight of which
      appear on the IUCN Red List. The ichthyofauna uniquely blends Adriatic endemics with Danubian basin
      species; for several freshwater taxa centered in Albania, the Morača marks their northernmost European
      limit. Native trout migrate seasonally between upper spawning streams and lower reaches.


      The surrounding limestone cliffs support thriving populations of large carnivores, small predatory
      mammals, and diverse raptor communities.
    visit: >-
      The route follows the road itself. It connects Podgorica with Kolašin and northern Montenegro,
      traversing the canyon from end to end.


      At the northern portal of the gorge sits the historic Morača Monastery, founded in 1252. Its oldest
      surviving frescoes include eleven delicate scenes depicting the life of the Prophet Elijah, dating from
      the XIII century.
    history: >-
      The Morača stands as an enduring natural emblem of Podgorica and the largest river flowing through the
      capital city. Lake Skadar, its ultimate destination, forms a vast cryptodepression replenished by the
      Morača and drained by the Buna River into the Adriatic Sea. The Morača catchment basin encompasses 3257
      square kilometres.
    before: The best time to visit is May to October.
    around: >-
      Two kilometres away rise the [Komovi Nature Park](/lugar/park-prirode-komovi/), and five kilometres
      distant is the [Cijevna River Canyon](/lugar/kanjon-cijevine/), the Morača’s other great tributary
      canyon. Eight kilometres away lie the [Albanian Alps National
      Park](/lugar/parku-kombetar-i-alpeve-te-shqiperise/) and the [Gashi River Strict Nature
      Reserve](/lugar/rezervati-natyror-i-strazuar-lumi-i/). Sixteen kilometres away sits [Lake Skadar
      National Park](/lugar/nacionalni-park-skadarsko-jezero/), and seventeen kilometres away extends the
      [Sinjajevina Karst Plateau](/lugar/sinjajevina-karst-plateau/).
  fr:
    intro: >-
      La route descendant de Kolašin à Podgorica ne suit pas une vallée ordinaire : elle s’enfonce au fond
      d’un gouffre. La Morača, cours d’eau montagnard rapide et modeste, a incisé dans le karst une gorge aux
      parois abruptes tombant jusqu’à 1000 mètres de profondeur. Loin de contourner cet obstacle, l’artère
      principale reliant l’intérieur à Podgorica et au littoral monténégrin épouse directement le tracé de la
      faille.


      C’est un canyon resserré pour un cours d’eau étendu : si la Morača dépasse 100 kilomètres au total, son
      tronçon en gorge n’occupe que 30 kilomètres de son cours moyen, juste avant qu’elle ne débouche dans la
      plaine de la Zeta.
    landscape: >-
      Le canyon s’étend sur les territoires de Podgorica et de Kolašin. Du ciel, il se divise en deux parties
      distinctes : le secteur haut et montagneux au nord du Monténégro, où la rivière atteint son encaissement
      maximal dans le massif de Tisov Vrh à environ 1000 mètres sous les crêtes ; et la section basse, qui
      gagne les plaines pour recevoir la Zeta, son tributaire majeur, avant de se jeter dans le lac Skadar.
      L’autre affluent notable est la Cijevna, arrivant en rive gauche.


      La Morača n’est pas un fleuve puissant : elle mesure environ 100 mètres de large et reste peu profonde,
      préservant son lit d’aménagements majeurs. Le climat mêle influences méditerranéennes et rigueurs
      dinariques, créant une remarquable transition écologique.
    wildlife: >-
      La gorge sert de corridor migratoire entre le lac Skadar et la plaine de Podgorica, ainsi que de refuge
      thermique pour des espèces méditerranéennes et steppiques. Son bassin versant compte 993 espèces de
      plantes, appartenant à 498 genres et 107 familles, étagées entre cortèges méditerranéens,
      sub-méditerranéens, centre-européens et orophiles.


      Le milieu aquatique recèle une faune remarquable : on y recense 30 espèces de poissons, dont huit
      figurent sur la liste rouge de l’UICN, mêlant de façon singulière des espèces adriatiques et
      danubiennes. Pour plusieurs poissons originaires d’Albanie, la Morača marque leur frontière
      septentrionale. Les truites indigènes y accomplissent des migrations vitales entre amont et aval.


      Les falaises abritent de grands mammifères carnassiers, de petits prédateurs et une abondante communauté
      d’oiseaux de proie.
    visit: >-
      L’itinéraire suit la route elle-même. Elle relie Podgorica à Kolašin et au nord du Monténégro,
      parcourant le défilé de part en part.


      Au nord du défilé se dresse le monastère de Morača, fondé en 1252. Ses fresques les plus anciennes
      comptent onze scènes remarquables illustrant la vie du prophète Élie, peintes au XIIIe siècle.
    history: >-
      La Morača est l’emblème naturel de Podgorica et le principal cours d’eau qui traverse la capitale. Le
      lac Skadar, où elle termine sa course, forme une vaste cryptodépression drainée par la Buna vers
      l’Adriatique. Le bassin hydrographique de la Morača s’étend sur 3257 kilomètres carrés.
    before: La meilleure période va de mai à octobre.
    around: >-
      À deux kilomètres s’élèvent les [monts Komovi](/lugar/park-prirode-komovi/), et à cinq kilomètres
      commence le [canyon de la rivière Cijevna](/lugar/kanjon-cijevine/), l’autre grand défilé affluent. À
      huit kilomètres se trouvent le [parc national des Alpes
      albanaises](/lugar/parku-kombetar-i-alpeve-te-shqiperise/) et la [réserve naturelle intégrale de la
      rivière Gashi](/lugar/rezervati-natyror-i-strazuar-lumi-i/). À seize kilomètres s’étend le [parc
      national du lac Skadar](/lugar/nacionalni-park-skadarsko-jezero/), et à dix-sept le [plateau karstique
      de Sinjajevina](/lugar/sinjajevina-karst-plateau/).
  de:
    intro: >-
      Die Straße, die von Kolašin nach Podgorica hinabführt, folgt keinem weiten Tal, sondern dem Grund einer
      gewaltigen Schlucht. Die Morača, ein schneller und verhältnismäßig kleiner Gebirgsfluss, hat eine
      schwindelerregende Felsschlucht von bis zu 1000 Metern Tiefe in den Karst gegraben. Anstatt das
      Hindernis zu meiden, folgt die Hauptverkehrsstraße nach Podgorica und zur montenegrinischen Küste direkt
      den Felsbändern der Klamm.


      Es ist ein kurzer Canyon für einen langen Fluss: Die Morača misst über 100 Kilometer Gesamtlänge, doch
      der tief eingeschnittene Engpass umfasst lediglich 30 Kilometer ihres Mittellaufs, kurz bevor der Strom
      in die Zeta-Ebene eintritt.
    landscape: >-
      Die Schlucht erstreckt sich über die Gemeinden Podgorica und Kolašin. Aus der Vogelperspektive gliedert
      sie sich in zwei Abschnitte: den alpinen oberen Canyon im Norden Montenegros, wo der Fluss im Bereich
      Tisov Vrh mit rund 1000 Metern Tiefe seine engste Spalte erreicht; und den unteren Abschnitt, der sich
      zur Ebene öffnet, den Zeta-Fluss als größten Zufluss aufnimmt und schließlich in den Skutarisee mündet.
      Der andere bedeutende Nebenfluss ist die Cijevna von links.


      Die Morača führt keine gewaltigen Wassermassen: Sie ist etwa 100 Meter breit und meist seicht, weshalb
      ihr Bett weitgehend unverbaut blieb. Das Schluchtklima verbindet mediterrane Einflüsse mit dinarischer
      Hochgebirgswelt zu einer artenreichen Übergangszone.
    wildlife: >-
      Der Canyon dient als Zugkorridor zwischen Skutarisee und Podgorica-Ebene sowie als mildes Refugium für
      frostempfindliche mediterrane Arten. Im Einzugsgebiet wachsen 993 Pflanzenarten aus 498 Gattungen und
      107 Familien, die je nach Höhenlage von mediterranen bis zu alpinen Pflanzengesellschaften reichen.


      Auch die Fischfauna ist bemerkenswert: 30 Fischarten wurden nachgewiesen, acht davon auf der Roten Liste
      der IUCN, mit einer einzigartigen Mischung aus adriatischen und donauländischen Arten. Für mehrere aus
      Albanien stammende Flussfische markiert die Morača die absolute Nordgrenze ihres Verbreitungsgebiets.
      Einheimische Forellen wandern zur Laichzeit durch das Gewässersystem.


      In den Steilwänden horsten zahlreiche Greifvögel, begleitet von großen Beutegreifern und Marderartigen.
    visit: >-
      Die Route folgt der Straße selbst. Sie verbindet Podgorica mit Kolašin sowie dem Norden Montenegros und
      durchquert den Canyon in ganzer Länge.


      Am Nordeingang der Schlucht steht das 1252 gegründete Kloster Morača. Zu seinen kostbarsten Schätzen
      zählen elf Freskenzyklen aus dem Leben des Propheten Elias aus dem XIII. Jahrhundert.
    history: >-
      Die Morača ist das Wahrzeichen von Podgorica und der größte Fluss der montenegrinischen Hauptstadt. Der
      Skutarisee, in den sie mündet, bildet eine Kryptodepression, die von der Morača gespeist und von der
      Buna zur Adria entwässert wird. Das Einzugsgebiet der Morača umfasst 3257 Quadratkilometer.
    before: Die beste Reisezeit ist Mai bis Oktober.
    around: >-
      Zwei Kilometer entfernt liegt der [Naturpark Komovi](/lugar/park-prirode-komovi/), und fünf Kilometer
      entfernt die [Cijevna-Schlucht](/lugar/kanjon-cijevine/). Acht Kilometer entfernt befinden sich der
      [Nationalpark Albanische Alpen](/lugar/parku-kombetar-i-alpeve-te-shqiperise/) und das [Naturreservat
      Gashi-Fluss](/lugar/rezervati-natyror-i-strazuar-lumi-i/). Sechzehn Kilometer entfernt erstreckt sich
      der [Nationalpark Skutarisee](/lugar/nacionalni-park-skadarsko-jezero/) und siebzehn Kilometer entfernt
      das [Karstplateau Sinjajevina](/lugar/sinjajevina-karst-plateau/).
  it:
    intro: >-
      La carrozzabile che scende da Kolašin a Podgorica non attraversa una vallata aperta: solca il fondo di
      un abisso. Il Morača, corso d’acqua montano impetuoso e relativamente modesto, ha scavato nel calcare
      carsico una forra colossale con pareti verticali profonde fino a 1000 metri. Anziché aggirarla, la
      strada maestra diretta a Podgorica e alla costa montenegrina segue fedelmente i gradoni della gola.


      È una forra compatta per un corso d’acqua esteso: la lunghezza totale del Morača supera i 100
      chilometri, ma il tratto incassato si sviluppa per soli 30 chilometri nel corso medio, subito prima che
      il fiume sfoci nella piana di Zeta.
    landscape: >-
      La forra appartiene ai territori comunali di Podgorica e Kolašin. Osservata dall’alto mostra due settori
      distinti: il tratto montano settentrionale, dove il fiume incide il calcare toccando la massima
      profondità presso Tisov Vrh, a circa 1000 metri sotto l’orlo dell’altopiano; e il settore inferiore, che
      sbocca nei bassopiani confluendo con la Zeta, suo tributario principale, prima di raggiungere il lago di
      Scutari. L’altro grande affluente è la Cijevna, che entra da sinistra.


      Il Morača non presenta portate monumentali: largo circa 100 metri e poco profondo, ha conservato il suo
      alveo naturale privo di grandi sbarramenti. Il microclima montano-mediterraneo favorisce l’incontro tra
      la flora adriatica e quella dinarica d’alta quota.
    wildlife: >-
      La gola funge da corridoio biologico tra il bacino di Scutari e la valle di Podgorica, nonché da rifugio
      termico per specie mediterranee vulnerabili ai geli invernali. Il bacino idrografico accoglie 993 specie
      floristiche, ascritte a 498 generi e 107 famiglie, distribuite secondo il dislivello tra comunità
      submediterranee ed elementi alpini.


      Le acque celano un prezioso patrimonio ittico: vi si contano 30 specie di pesci, otto delle quali
      inserite nella Lista Rossa IUCN, fondendo elementi adriatici e danubiani. Per diverse specie albanesi il
      Morača segna il limite settentrionale di distribuzione. Le trote autoctone compiono migrazioni
      periodiche lungo l’alveo.


      Le pareti rocciose ospitano numerosi rapaci diurni e notturni, a fianco di mammiferi carnivori e
      ungulati selvatici.
    visit: >-
      L’itinerario segue la strada stessa. Collega Podgorica con Kolašin e il nord del Montenegro, percorrendo
      la forra da cima a fondo.


      All’estremità settentrionale del canyon sorge il celebre monastero di Morača, fondato nel 1252. Tra i
      suoi affreschi più arcaici spiccano undici scene dedicate alla vita del profeta Elia, dipinte nel XIII
      secolo.
    history: >-
      Il Morača è il simbolo identitario di Podgorica e il maggior corso d’acqua che bagna la capitale
      montenegrina. Il lago di Scutari, dove sfocia, costituisce una criptodepressione alimentata dal Morača e
      drenata dal fiume Buna verso l’Adriatico. Il bacino idrografico del Morača si estende per 3257
      chilometri quadrati.
    before: Il periodo migliore va da maggio a ottobre.
    around: >-
      A due chilometri si trova il [Parco Naturale dei Monti Komovi](/lugar/park-prirode-komovi/), e a cinque
      chilometri si apre il [Canyon del Fiume Cijevna](/lugar/kanjon-cijevine/). A otto chilometri si trovano
      il [Parco Nazionale delle Alpi Albanesi](/lugar/parku-kombetar-i-alpeve-te-shqiperise/) e la [Riserva
      Naturale Integrale del Fiume Gashi](/lugar/rezervati-natyror-i-strazuar-lumi-i/). A sedici chilometri si
      distende il [Parco Nazionale del Lago di Scutari](/lugar/nacionalni-park-skadarsko-jezero/), e a
      diciassette l’[Altopiano Carsico di Sinjajevina](/lugar/sinjajevina-karst-plateau/).
  pt:
    intro: >-
      A estrada que desce de Kolašin rumo a Podgorica não atravessa um vale aberto: percorre o leito de um
      desfiladeiro vertiginoso. O Morača, rio de montanha impetuoso e relativamente pequeno, escavou na rocha
      calcária uma fenda com paredões alcantilados de até 1000 metros de profundidade. Em vez de evitar a
      fenda, a estrada principal que liga o interior a Podgorica e ao litoral montenegrino acompanha de perto
      as escarpas.


      É um desfiladeiro compacto para um rio longo: o Morača ultrapassa 100 quilómetros de extensão total, mas
      o troço encravado ocupa apenas 30 quilómetros do seu curso médio, antes de o rio desembocar na planície
      de Zeta.
    landscape: >-
      O desfiladeiro abrange os municípios de Podgorica e Kolašin. Do ar exibe dois setores demarcados: o
      troço alpino no norte de Montenegro, onde o rio rasga o relevo atingindo a profundidade máxima na zona
      de Tisov Vrh, cerca de 1000 metros abaixo dos cumes; e o setor inferior, que desemboca nas planícies
      fluviais recebendo o Zeta, o seu afluente maior, antes de desaguar no lago Skadar. O outro afluente
      relevante é o Cijevna, entrando pela margem esquerda.


      O Morača não possui caudais volumosos: mede cerca de 100 metros de largura e apresenta baixa
      profundidade, o que poupou o seu curso a grandes barragens. O clima combina traços mediterrânicos com o
      rigor dinárico, criando uma fértil transição biogeográfica.
    wildlife: >-
      O desfiladeiro funciona como corredor migratório entre a bacia de Skadar e a planície de Podgorica, bem
      como refúgio térmico para espécies de cariz mediterrânico sensíveis aos frios de inverno. A sua bacia
      alberga 993 espécies florísticas, distribuídas por 498 géneros e 107 famílias, repartidas conforme a
      altitude entre comunidades submediterrânicas e orófitas alpinas.


      A riqueza aquática é igualmente marcante: foram registadas 30 espécies piscícolas, oito das quais
      integradas na Lista Vermelha da UICN, cruzando espécies adriáticas e danubianas. Para vários peixes com
      centro em território albanês, o Morača assinala o limite norte europeu. As trutas nativas realizam
      migrações reprodutoras essenciais.


      As escarpas calcárias acolhem inúmeras aves de rapina, além de carnívoros e ungulados selvagens.
    visit: >-
      O percurso faz-se pela própria estrada. Liga Podgorica a Kolašin e ao norte de Montenegro, atravessando
      o desfiladeiro de uma ponta à outra.


      No topo norte do desfiladeiro ergue-se o mosteiro de Morača, fundado em 1252. Entre os seus frescos mais
      antigos preservam-se onze cenas alusivas à vida do profeta Elias, pintadas no século XIII.
    history: >-
      O Morača constitui um símbolo histórico de Podgorica e o principal rio a cruzar a capital montenegrina.
      O lago Skadar, onde desagua, é uma vasta criptodepressão alimentada pelo Morača e drenada pelo rio Buna
      para o mar Adriático. A bacia hidrográfica do Morača abrange 3257 quilómetros quadrados.
    before: A melhor época vai de maio a outubro.
    around: >-
      A dois quilómetros ergue-se o [Parque Natural dos Montes Komovi](/lugar/park-prirode-komovi/), e a cinco
      quilómetros começa o [Desfiladeiro do Rio Cijevna](/lugar/kanjon-cijevine/). A oito quilómetros ficam o
      [Parque Nacional dos Alpes Albaneses](/lugar/parku-kombetar-i-alpeve-te-shqiperise/) e a [Reserva
      Natural Estrita do Rio Gashi](/lugar/rezervati-natyror-i-strazuar-lumi-i/). A dezasseis quilómetros
      situa-se o [Parque Nacional do Lago Skadar](/lugar/nacionalni-park-skadarsko-jezero/), e a dezassete o
      [Planalto Cárstico de Sinjajevina](/lugar/sinjajevina-karst-plateau/).
