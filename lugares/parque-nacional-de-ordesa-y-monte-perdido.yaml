resumen:
  es: >-
    El 'Gran Cañón de Europa', Patrimonio Mundial UNESCO Pyrénées-Mont Perdu, coronado por Monte Perdido
    (3.355 m) y con los cuatro grandes cañones: Ordesa, Añisclo, Escuaín y Pineta.
  en: >-
    The 'Grand Canyon of Europe', UNESCO World Heritage Pyrénées-Mont Perdu, crowned by Monte Perdido (3,355
    m) with four grand canyons: Ordesa, Añisclo, Escuaín, and Pineta.
  fr: >-
    Le 'Grand Canyon d'Europe', patrimoine mondial de l'UNESCO Pyrénées-Mont Perdu, couronné par le mont Perdu
    (3 355 m) avec ses quatre grands canyons : Ordesa, Añisclo, Escuaín et Pineta.
  de: >-
    Der 'Grand Canyon Europas', UNESCO-Welterbe Pyrénées-Mont Perdu, gekrönt vom Monte Perdido (3.355 m) mit
    vier monumentalen Schluchten: Ordesa, Añisclo, Escuaín und Pineta.
  it: >-
    Il 'Grand Canyon d'Europa', Patrimonio Mondiale UNESCO Pyrénées-Mont Perdu, coronato dal Monte Perdido
    (3.355 m) e solcato da quattro grandi gole: Ordesa, Añisclo, Escuaín e Pineta.
  pt: >-
    O 'Grand Canyon da Europa', Património Mundial da UNESCO Pyrénées-Mont Perdu, coroado pelo Monte Perdido
    (3.355 m) e rasgado por quatro grandes desfiladeiros: Ordesa, Añisclo, Escuaín e Pineta.
unico:
  es: >-
    En un solo parque pasas de la selva de hayas y abetos del fondo del valle al macizo calcáreo más alto de
    Europa, uno que ilustra episodios clave de la orogénesis pirenaica.
  en: >-
    Within a single park you transition from lush beech and fir valley forests to the highest limestone massif
    in Europe, illustrating pivotal stages of Pyrenean orogeny.
  fr: >-
    En un seul parc, vous passez de la forêt dense de hêtres et sapins du fond de vallée au plus haut massif
    calcaire d'Europe, témoin d'épisodes clés de l'orogenèse pyrénéenne.
  de: >-
    In einem einzigen Park gelangst du von dichten Buchen- und Tannenwäldern des Talbodens zum höchsten
    Kalksteinmassiv Europas, das Meilensteine der pyrenäischen Gebirgsbildung veranschaulicht.
  it: >-
    In un unico parco passi dalla foresta di faggi e abeti del fondovalle al massiccio calcareo più elevato
    d'Europa, che testimonia fasi cruciali dell'orogenesi pirenaica.
  pt: >-
    Num único parque passas das florestas densas de faias e abetos do fundo do vale ao maciço calcário mais
    alto da Europa, que ilustra episódios essenciais da orogenia pirenaica.
observaciones:
  es: >-
    En épocas de alta afluencia no puedes subir a la Pradera de Ordesa en vehículo privado: hay que tomar el
    bus lanzadera desde Torla-Ordesa. Desde el 9 de febrero de 2022 está prohibido el vivac en todo el sector
    Ordesa; solo se permite la zona de acampada de Góriz, con reserva previa. Dentro del parque no se puede
    hacer fuego, llevar perros sueltos ni recolectar animales, plantas, minerales o rocas.
texto:
  es:
    intro: >-
      Según la leyenda, un caballero acosado por sus enemigos alzó su espada Durandarte y hendió la pared que
      le cerraba el paso: así se abrió la Brecha de Rolando. Sea cual sea el origen, la pared sigue ahí, y el
      parque que la rodea tiene mucho de escenario de leyenda. El Parque Nacional de Ordesa y Monte Perdido
      ocupa el Pirineo de Huesca, entre los 700 m del río Bellós y los 3348 m del Monte Perdido, y reúne
      cuatro valles muy distintos: Ordesa, Añisclo, Escuaín y Pineta. Es Reserva de la Biosfera desde 1977 y
      Patrimonio de la Humanidad desde 1997.
    landscape: >-
      Todo empieza con una montaña de caliza. Su forma básica nace del plegamiento alpino de la era Terciaria,
      y el hielo del Cuaternario la terminó de tallar en circos y valles glaciares. Por eso el valle de Ordesa
      tiene perfil de «U», con el Arazas recorriéndolo hasta su confluencia con el Ara; por eso el macizo de
      las Tres Sorores es el macizo calcáreo más alto de Europa; y por eso en la cara norte del Monte Perdido
      aún queda un glaciar, aunque en retroceso.


      Después llegó el agua, que disuelve la caliza. Arriba, por encima de los 2000 m, el sistema kárstico se
      traga la lluvia y las cumbres son extremadamente áridas. Abajo, el agua que desaparece vuelve a salir en
      cascadas, gargantas y cañones. El Arazas, de aguas cristalinas con truchas, baja entre cascadas, y la
      Cola de Caballo y las Gradas de Soaso son sus paradas más destacadas. Añisclo es una garganta de 21 km
      por la que corre el Bellós entre paredes con desniveles de más de 1.000 m. En Escuaín, el Yaga cruza una
      garganta kárstica con cuevas y galerías subterráneas. Y en Pineta nace el Cinca, alimentado por los
      hielos y neveros del Ibón de Marboré.


      La vegetación sube por pisos. En el montano, entre 800 y 1700 m, hay hayedos, abetos blancos y pinos
      silvestres; hasta los 2000 m domina el pino negro. En los pastos de altura florece la flor de nieve, el
      edelweiss. Y en los acantilados y gleras viven plantas exclusivas del Pirineo: la flora del parque suma
      1400 especies, casi el 45 % de las del Pirineo aragonés.
    wildlife: >-
      Mira a los cortados. El [quebrantahuesos](/especie/gypaetus_barbatus/) vive en los desfiladeros y la
      alta montaña, y en Escuaín habita en sus cortados. A su lado planean el [águila
      real](/especie/aquila_chrysaetos/), el [buitre leonado](/especie/gyps_fulvus/), el
      [alimoche](/especie/neophron_percnopterus/), los milanos y el águila culebrera. En los bosques viven el
      [urogallo](/especie/tetrao_urogallus/), la lechuza de Tengmalm, el pito real y el pico dorsiblanco.


      En los pastizales subalpinos altos se ven con facilidad las [marmotas](/especie/marmota_marmota/) y los
      [sarrios](/especie/rupicapra_pyrenaica/), como llaman en Aragón al rebeco. Su población ronda los 700
      ejemplares y ha bajado por la queratoconjuntivitis y el pestivirus. El ciervo vuelve a expandirse por el
      Pirineo, y el [oso pardo](/especie/ursus_arctos/), con entre 25 y 32 ejemplares en toda la cordillera,
      se ha dejado sentir en los sectores más salvajes. Entre los pequeños mamíferos hay nutrias, zorros,
      gatos monteses y el desmán de los Pirineos. En los torrentes de agua limpia vive la rana pirenaica, un
      endemismo del Pirineo, y el tritón pirenaico indica la pureza del agua.


      El calendario cambia el parque cada trimestre. En primavera la Senda de los Cazadores y la Faja de Pelay
      suelen estar cerradas por hielo, piedras y árboles caídos, y en Añisclo el Bellós baja bravo por el
      deshielo. El otoño es la gran escena: desde la segunda mitad de octubre los bosques caducifolios de
      Ordesa estallan en color, y en Añisclo hayas, arces y fresnos llegan a su punto álgido entre finales de
      octubre y principios de noviembre.
    visit: >-
      Cada valle tiene su puerta. A Ordesa se entra por Torla, a Añisclo por Escalona, a Escuaín por Escuaín y
      Tella, y a Pineta por Bielsa. Empieza por un centro de visitantes: el de Torla-Ordesa guarda
      naturalizado a Laña, el último bucardo antes de su extinción; también hay centros en Casa Oliván y en
      Tella, y puntos de información en La Pradera, Escalona, San Úrbez, Fanlo, Escuaín, Bielsa y Pineta.


      En Ordesa, el punto de información de la Pradera es el inicio de las rutas a las cascadas del Arazas y
      la Cola de Caballo, y de la Senda de los Cazadores y la Faja de Pelay. La senda sube al mirador de
      Calcilarruego y da acceso a la faja, una cornisa sobre el cañón del Arazas.


      Si prefieres otro valle: en Escuaín basta seguir desde el pueblo la ruta de los miradores para ver la
      garganta, o ir a los miradores de Angonés desde Revilla. Desde Pineta, en verano, se sube al Balcón de
      Pineta o al Ibón de Marboré, rutas que piden buena forma física y material adecuado. En Escuaín, la
      orientación sur hace que haya menos heladas y que la nieve desaparezca antes.
    history: >-
      Esta zona estuvo aislada hasta hace poco, y eso conservó paisajes, arquitectura y costumbres. Durante
      siglos los pastores de Torla, Gavarnie, Barèges y Broto pactaron cómo compartir los pastos: ovejas al
      piedemonte en invierno y rebaños a los puertos en verano. En el bosque de Turieto, el pirineísta Lucien
      Briet tiene un monumento; lo llamó una selva donde solo se ven árboles, a través de árboles y sobre
      árboles.


      El parque se declaró en 1918. A finales de los años 70, vecinos e instituciones se movilizaron para
      frenar un embalse hidroeléctrico que habría inundado el Cañón de Añisclo. En Añisclo, además, se llega a
      la ermita de San Úrbez por un puente vertiginoso anclado entre las rocas sobre el Bellós.
    before: >-
      En épocas de alta afluencia no puedes subir a la Pradera de Ordesa en vehículo privado: hay que tomar el
      bus lanzadera desde Torla-Ordesa. Desde el 9 de febrero de 2022 está prohibido el vivac en todo el
      sector Ordesa; solo se permite la zona de acampada de Góriz, con reserva previa. Dentro del parque no se
      puede hacer fuego, llevar perros sueltos ni recolectar animales, plantas, minerales o rocas.
    around: >-
      El [Parque Nacional de los Pirineos](/lugar/parc-national-des-pyrenees/) está a solo 1 km. Entre los
      lugares lejanos, el [Parque Nacional de los Picos de
      Europa](/lugar/parque-nacional-de-los-picos-de-europa/) comparte sarrio, alta montaña, cañones y macizos
      kársticos con glaciares, y el [Parco Nazionale Gran Paradiso](/lugar/parco-nazionale-gran-paradiso/)
      comparte quebrantahuesos y águila real, glaciares y bosque maduro.
  en:
    intro: >-
      According to legend, a knight hard-pressed by his foes raised his sword Durandarte and cleaved the rock
      wall blocking his retreat: thus the Brèche de Roland was opened. Whatever its true geological genesis,
      the cliff endures, and the national park surrounding it possesses the atmosphere of a mythic stage.
      Ordesa y Monte Perdido National Park occupies the Huesca Pyrenees, spanning from 700 m along the Bellós
      river to 3348 m atop Monte Perdido, encompassing four starkly distinct valleys: Ordesa, Añisclo,
      Escuaín, and Pineta. It was designated a Biosphere Reserve in 1977 and a UNESCO World Heritage site in
      1997.
    landscape: >-
      It all began with an ocean of limestone. The primary structure emerged during the Tertiary Alpine
      folding, later sculpted by Quaternary glaciation into monumental cirques and troughs. Hence the Ordesa
      valley boasts a dramatic U-shaped cross-section, carved by the Arazas down to its meeting with the Ara;
      hence the Tres Sorores massif stands as the highest limestone massif in Europe; and hence a lingering,
      retreating glacier clings to the northern face of Monte Perdido.


      Then came moving water, dissolving the carbonate rock. High above, beyond 2000 m, the karst network
      swallows rainfall, leaving barren, arid summit crests. Below, the subterranean torrents re-emerge in
      thundering cascades, gorges, and canyons. The crystal-clear Arazas, teeming with trout, cascades through
      stepped waterfalls, with the Cola de Caballo and Gradas de Soaso among its most famed features. Añisclo
      is a canyon of 21 km where the Bellós courses between cliffs exceeding 1,000 m in vertical drop. In
      Escuaín, the Yaga carves through a subterranean karst gorge dotted with caverns. In Pineta rises the
      Cinca, fed by snowfields and the ice of Ibón de Marboré.


      Vegetation arranges itself into distinct life zones. The montane belt, between 800 and 1700 m, shelters
      beechwoods, silver firs, and Scots pines; up to 2000 m, mountain pine takes command. In subalpine
      pastures blooms the iconic edelweiss. Clinging to limestone bluffs are specialized Pyrenean endemics:
      the park's flora counts 1400 species, nearly 45 % of all plants found in the Aragonese Pyrenees.
    wildlife: >-
      Cast your eyes toward the cliffs. The [bearded vulture](/especie/gypaetus_barbatus/) frequents high
      ravines and crags, nesting commonly along the Escuaín gorge. Alongside it soar the [golden
      eagle](/especie/aquila_chrysaetos/), [griffon vulture](/especie/gyps_fulvus/), [Egyptian
      vulture](/especie/neophron_percnopterus/), kites, and short-toed snake eagles. Ancient forests shelter
      the [western capercaillie](/especie/tetrao_urogallus/), boreal owl, black woodpecker, and white-backed
      woodpecker.


      Across high subalpine pastures, [alpine marmots](/especie/marmota_marmota/) and [Pyrenean
      chamois](/especie/rupicapra_pyrenaica/) (known locally in Aragon as sarrios) are readily spotted. The
      chamois population stands around 700 individuals, having declined due to outbreaks of
      keratoconjunctivitis and pestivirus. Red deer are gradually expanding back into the Pyrenean valleys,
      while the [brown bear](/especie/ursus_arctos/), numbering between 25 and 32 individuals across the
      entire range, roams secluded sectors. Small mammals include otters, foxes, wildcats, and the Pyrenean
      desman. Pristine glacial torrents shelter the endemic Pyrenean frog and the Pyrenean brook salamander,
      both sensitive biological indicators.


      Each season transforms the park. In spring, the hunters' path (Senda de los Cazadores) and Faja de Pelay
      are frequently closed by residual ice, rockfalls, and fallen timber, while the Bellós swells with
      turbulent snowmelt. Autumn provides the grand spectacle: from mid-October onward the deciduous woodlands
      of Ordesa explode with golden foliage, while in Añisclo beeches, maples, and ashes reach their peak
      between late October and early November.
    visit: >-
      Each valley offers its own gateway. Access Ordesa from Torla, Añisclo from Escalona, Escuaín through
      Escuaín or Tella, and Pineta via Bielsa. Start at a visitor centre: the Torla-Ordesa centre preserves
      the mount of Celia, the last Pyrenean ibex before its extinction; other facilities operate at Casa
      Oliván and Tella, complemented by information desks in La Pradera, Escalona, San Úrbez, Fanlo, Escuaín,
      Bielsa, and Pineta.


      In Ordesa, the information post at La Pradera marks the trailhead for hikes to the Arazas waterfalls,
      the Cola de Caballo, the Senda de los Cazadores, and the elevated Faja de Pelay ledge. The hunters'
      trail climbs to Calcilarruego viewpoint, providing access to the breathtaking cornice above the Arazas
      canyon.


      Alternative valleys offer distinct charms: in Escuaín, follow the cliff viewpoint path from the village
      to overlook the gorge, or walk to the Angonés viewpoints from Revilla. From Pineta, summer tracks climb
      to the Balcón de Pineta and Ibón de Marboré, routes demanding solid physical stamina and mountain gear.
      Escuaín's southern orientation brings fewer frosts and earlier snowmelt.
    history: >-
      This region remained secluded until modern times, conserving traditional architecture, land stewardship,
      and pastoral customs. For centuries, shepherds from Torla, Gavarnie, Barèges, and Broto negotiated
      shared grazing rights: flocks moved to lowlands in winter and summered on alpine passes. In the Turieto
      woods, a monument honours pioneer mountaineer Lucien Briet, who hailed the valley as a jungle where one
      sees only trees, through trees, and above trees.


      The national park was established in 1918. In the late 70s, local communities and institutions mobilised
      successfully to halt a proposed hydroelectric dam that would have drowned the Añisclo Canyon. In
      Añisclo, visitors reach the cave hermitage of San Úrbez via a vertiginous bridge anchored between cliffs
      high above the Bellós river.
    before: >-
      During high season, private vehicles are barred from driving up to the Pradera de Ordesa: you must board
      the shuttle bus from Torla-Ordesa. Since 9 February 2022, bivouacking is strictly forbidden across the
      entire Ordesa sector; overnight camping is restricted to the designated zone at Góriz with prior
      booking. Inside the park you may not light fires, allow dogs off leash, or collect animals, plants,
      minerals, or rocks.
    around: >-
      Just 1 km away across the border lies [Parque Nacional de los
      Pirineos](/lugar/parc-national-des-pyrenees/). Farther afield, [Parque Nacional de los Picos de
      Europa](/lugar/parque-nacional-de-los-picos-de-europa/) shares the chamois, alpine crags, deep gorges,
      and glaciated karst massifs, while [Parco Nazionale Gran
      Paradiso](/lugar/parco-nazionale-gran-paradiso/) shares the bearded vulture and golden eagle alongside
      glacial high-mountain terrain.
  fr:
    intro: >-
      Selon la légende, un chevalier cerné par ses ennemis brandit son épée Durandal et fendit la muraille
      rocheuse qui lui fermait le passage : ainsi s'ouvrit la brèche de Roland. Quelle que soit l'origine
      géologique, la paroi se dresse toujours là et le parc qui l'entoure a tout d'un décor de légende. Le
      parc national d'Ordesa et du Mont-Perdu s'étend dans les Pyrénées de Huesca, entre les 700 m du cours du
      Bellós et les 3348 m du mont Perdu, rassemblant quatre vallées très contrastées : Ordesa, Añisclo,
      Escuaín et Pineta. Il est réserve de biosphère depuis 1977 et classé au patrimoine mondial depuis 1997.
    landscape: >-
      Tout commence par une montagne de calcaire. Son relief fondamental est né du plissement alpin à l'ère
      tertiaire, avant que les glaces du Quaternaire ne finissent de sculpter cirques et auges glaciaires.
      C'est pourquoi la vallée d'Ordesa présente un profil parfait en « U », traversée par l'Arazas jusqu'à sa
      confluence avec l'Ara ; c'est pourquoi le massif des Tres Sorores constitue le plus haut massif calcaire
      d'Europe ; et c'est pourquoi un glacier subsiste sur la face nord du mont Perdu, bien qu'en régression
      constante.


      Puis vint l'action de l'eau, qui dissout le calcaire. Au-dessus de 2000 m, le réseau karstique engloutit
      les pluies, rendant les crêtes particulièrement arides. En contrebas, ces eaux ressurgissent en
      cascades, gorges et défilés. L'Arazas dévale en cascades successives aux eaux limpides à truites, dont
      la cascade de la Cola de Caballo et les Gradas de Soaso sont les points d'orgue. Añisclo forme un canyon
      de 21 km où le Bellós gronde entre des parois verticales de plus de 1 000 m de dénivelé. À Escuaín, le
      Yaga s'engouffre dans une gorge karstique percée de grottes souterraines. Enfin, dans la vallée de
      Pineta naît le Cinca, alimenté par les névés de l'Ibón de Marboré.


      La végétation s'étage rigoureusement. L'étage montagnard, entre 800 et 1700 m, abrite hêtraies,
      sapinières et pinèdes sylvestres ; jusqu'à 2000 m domine le pin à crochets. Sur les estives d'altitude
      s'épanouit l'edelweiss. Sur les parois rocheuses s'accrochent des plantes exclusives aux Pyrénées : la
      flore du parc réunit 1400 espèces, soit près de 45 % de celles des Pyrénées aragonaises.
    wildlife: >-
      Levez les yeux vers les falaises. Le [gypaète barbu](/especie/gypaetus_barbatus/) habite les défilés et
      la haute montagne, nichant régulièrement sur les parois d'Escuaín. À ses côtés planent l'[aigle
      royal](/especie/aquila_chrysaetos/), le [vautour fauve](/especie/gyps_fulvus/), le
      [percnoptère](/especie/neophron_percnopterus/), les milans et le circaète Jean-le-Blanc. Les forêts
      abritent le [grand tétras](/especie/tetrao_urogallus/), la chouette de Tengmalm, le pic noir et le pic à
      dos blanc.


      Sur les pelouses subalpines d'altitude, on observe aisément les [marmottes des
      Alpes](/especie/marmota_marmota/) et les [isards](/especie/rupicapra_pyrenaica/) (sarrios en Aragon). La
      population d'isards avoisine 700 individus, ayant diminué en raison de la kératoconjonctivite et du
      pestivirus. Le cerf colonise à nouveau les vallées pyrénéennes, tandis que l'[ours
      brun](/especie/ursus_arctos/), fort de 25 à 32 individus sur l'ensemble de la chaîne, fréquente les
      secteurs les plus sauvages. La petite faune compte loutres, renards, chats sauvages et le desman des
      Pyrénées. Dans les torrents froids vivent la grenouille des Pyrénées et le calotriton des Pyrénées.


      Les saisons métamorphosent le parc. Au printemps, le sentier des Chasseurs et la Faja de Pelay restent
      souvent fermés en raison du verglas et des chutes de pierres, et le Bellós roule des eaux puissantes
      lors de la fonte des neiges. L'automne offre une splendeur absolue : dès la seconde quinzaine d'octobre,
      les feuillus d'Ordesa se parent de pourpre et d'or, tandis qu'à Añisclo hêtres et érables s'enflamment
      entre fin octobre et début novembre.
    visit: >-
      Chaque vallée possède sa propre porte d'accès. On pénètre à Ordesa par Torla, à Añisclo par Escalona, à
      Escuaín par Escuaín et Tella, et à Pineta par Bielsa. Commencez par un centre d'accueil : celui de
      Torla-Ordesa conserve Laña, le dernier bouquetin des Pyrénées avant son extinction ; d'autres espaces
      vous accueillent à Casa Oliván et à Tella, avec des postes d'information à La Pradera, Escalona, San
      Úrbez, Fanlo, Escuaín, Bielsa et Pineta.


      À Ordesa, le point d'information de la Pradera marque le point de départ vers les cascades de l'Arazas,
      la Cola de Caballo, le sentier des Chasseurs et la vire de la Faja de Pelay. Ce sentier s'élève jusqu'au
      belvédère de Calcilarruego et ouvre l'accès à la cornise dominant le canyon.


      Si vous préférez une autre vallée : à Escuaín, il suffit de suivre depuis le village le sentier des
      belvédères pour admirer la gorge, ou de gagner les points de vue d'Angonés depuis Revilla. Depuis
      Pineta, l'été permet de monter au Balcón de Pineta ou à l'Ibón de Marboré, des itinéraires réclamant une
      excellente condition physique. L'exposition sud d'Escuaín tempère les gelées et accélère la fonte de la
      neige.
    history: >-
      Cette région pyrénéenne est restée enclavée jusqu'à une époque récente, ce qui a préservé ses paysages
      ruraux, son architecture et ses coutumes. Pendant des siècles, les bergers de Torla, Gavarnie, Barèges
      et Broto ont conclu des traités pastoraux pour partager les pâturages : troupeaux en plaine l'hiver et
      sur les estives l'été. Dans la forêt de Turieto, un monument rend hommage au pyrénéiste Lucien Briet,
      qui la décrivit comme une jungle où l'on ne voit que des arbres, à travers des arbres et sur des arbres.


      Le parc national a été créé en 1918. À la fin des années 70, habitants et institutions se mobilisèrent
      pour empêcher la construction d'un barrage hydroélectrique qui aurait noyé le canyon d'Añisclo. À
      Añisclo, on rejoint l'ermitage troglodytique de San Úrbez par un pont spectaculaire jeté au-dessus du
      Bellós.
    before: >-
      En période d'affluence, l'accès des véhicules particuliers à la Pradera d'Ordesa est interdit : il est
      obligatoire d'emprunter la navette depuis Torla-Ordesa. Depuis le 9 février 2022, le bivouac est
      rigoureusement interdit dans tout le secteur Ordesa ; seule l'aire aménagée de Góriz l'autorise sur
      réservation préalable. Dans le parc, il est interdit d'allumer du feu, de laisser divaguer les chiens ou
      de prélever minéraux, plantes et roches.
    around: >-
      Le [Parque Nacional de los Pirineos](/lugar/parc-national-des-pyrenees/) ne se trouve qu'à 1 km. Parmi
      les espaces plus lointains, le [Parque Nacional de los Picos de
      Europa](/lugar/parque-nacional-de-los-picos-de-europa/) partage avec Ordesa l'isard, les canyons
      calcaires et les reliefs glaciaires, tandis que le [Parco Nazionale Gran
      Paradiso](/lugar/parco-nazionale-gran-paradiso/) partage le gypaète barbu, l'aigle royal et la haute
      montagne alpine.
  de:
    intro: >-
      Der Sage nach hob ein von Feinden bedrängter Ritter sein Schwert Durendal und spaltete die Felswand, die
      seinen Rückzug versperrte: So entstand die Brecha de Rolando. Wie auch immer der geologische Ursprung
      lautet, die Felsmauer ragt bis heute auf, und die umgebende Hochgebirgswelt gleicht einer mythischen
      Kulisse. Der Nationalpark Ordesa y Monte Perdido erstreckt sich in den Pyrenäen von Huesca zwischen 700
      m am Río Bellós und 3348 m auf dem Gipfel des Monte Perdido und vereint vier völlig unterschiedliche
      Täler: Ordesa, Añisclo, Escuaín und Pineta. Er ist seit 1977 Biosphärenreservat und seit 1997
      UNESCO-Welterbe.
    landscape: >-
      Alles begann mit einem Urmeer aus Kalkstein. Seine Grundgestalt formte sich während der tertiären
      alpidischen Faltung; eiszeitliche Gletscher meißelten daraufhin Trogtäler und Steilwände. Deshalb
      besitzt das Ordesa-Tal ein klassisches U-Profil, durchflossen vom Río Arazas bis zur Mündung in den Ara;
      deshalb bilden die Tres Sorores das höchste Kalksteinmassiv Europas; und deshalb existiert an der
      Nordwand des Monte Perdido bis heute ein schrumpfender Gletscher.


      Später formte das Wasser den löslichen Kalk. Oberhalb von 2000 m schluckt das Karstnetz jeden
      Niederschlag, wodurch die Grate arid und wasserlos bleiben. In der Tiefe tritt das versickerte Wasser in
      tosenden Kaskaden, Klammen und Schluchten wieder zutage. Der kristallklare Arazas stürzt über Kaskaden
      zu Tal, unter denen die Cola de Caballo und die Gradas de Soaso die bekanntesten Höhepunkte sind.
      Añisclo ist eine 21 km lange Schlucht, in der sich der Bellós zwischen Wänden mit über 1.000 m
      Höhenunterschied hindurchzwängt. In Escuaín durchfließt der Yaga eine Karstklamm mit Höhlen und
      Höhlensystemen. Im Pineta-Tal entspringt der Cinca, gespeist von Schneefeldern und dem Eis des Ibón de
      Marboré.


      Die Vegetation gliedert sich in Höhenstufen. Die montane Stufe zwischen 800 und 1700 m trägt Buchen,
      Weiß-Tannen und Waldkiefern; bis 2000 m herrscht die Bergkiefer vor. Auf den hochalpinen Matten blüht
      das Edelweiß. An Felsbändern siedeln Pyrenäen-Endemiten: Die Flora umfasst 1400 Pflanzenarten, nahezu 45
      % aller Arten der aragonesischen Pyrenäen.
    wildlife: >-
      Blicke hinauf zu den Steilwänden. Der [Bartgeier](/especie/gypaetus_barbatus/) bewohnt die tiefen
      Schluchten und hochalpinen Grate und brütet verlässlich in den Felswänden von Escuaín. Neben ihm kreisen
      [Steinadler](/especie/aquila_chrysaetos/), [Gänsegeier](/especie/gyps_fulvus/),
      [Schmutzgeier](/especie/neophron_percnopterus/), Milane und Schlangenadler. In den Wäldern leben
      [Auerhuhn](/especie/tetrao_urogallus/), Raufußkauz, Schwarzspecht und Weißrückenspecht.


      Auf den subalpinen Weiden lassen sich [Alpenmurmeltiere](/especie/marmota_marmota/) und Pyrenäen-Gämsen,
      hier [Pyrenäen-Gämse](/especie/rupicapra_pyrenaica/) (sarrio) genannt, leicht beobachten. Der
      Gämsenbestand liegt bei rund 700 Tieren und ging durch Infektionskrankheiten wie Keratokonjunktivitis
      und Pestivirus zurück. Rothirsche breiten sich in den Tälern wieder aus, während der
      [Braunbär](/especie/ursus_arctos/) mit 25 bis 32 Tieren im gesamten Pyrenäenbogen in den
      unzugänglichsten Zonen seine Spuren hinterlässt. Kleine Säuger umfassen Fischotter, Fuchs, Wildkatze und
      den Pyrenäen-Desman. Klare Gebirgsbäche beherbergen den Pyrenäenfrosch und den Pyrenäen-Gebirgsmolch.


      Jede Jahreszeit prägt den Park eigenständig. Im Frühjahr bleiben der Jägerpfad (Senda de los Cazadores)
      und das Felsenband Faja de Pelay wegen Altschnee und Steinschlag meist gesperrt, und im Añisclo tost das
      Schmelzwasser. Der Herbst bietet das größte Schauspiel: Ab Mitte Oktober leuchten die Laubwälder von
      Ordesa in Rot und Gold, und im Añisclo-Canyon erreichen Buchen, Ahorne und Eschen zwischen Ende Oktober
      und Anfang November ihren Höhepunkt.
    visit: >-
      Jedes Tal besitzt seinen eigenen Zugang. Nach Ordesa gelangt man über Torla, nach Añisclo über Escalona,
      nach Escuaín über Escuaín und Tella und nach Pineta über Bielsa. Beginne in einem Besucherzentrum: Jenes
      in Torla-Ordesa zeigt das Präparat von Celia, dem letzten Exemplar des Pyrenäensteinbocks vor seinem
      Aussterben; weitere Ausstellungen bestehen in Casa Oliván und Tella, flankiert von Informationsstellen
      in La Pradera, Escalona, San Úrbez, Fanlo, Escuaín, Bielsa und Pineta.


      In Ordesa ist der Parkplatz La Pradera Ausgangspunkt der Wege zu den Wasserfällen des Arazas, zur Cola
      de Caballo sowie zur Senda de los Cazadores und Faja de Pelay. Dieser Höhenpfad steigt zur
      Aussichtskanzel Calcilarruego auf und führt über das Felsband hoch über der Arazas-Schlucht entlang.


      Alternativen bieten andere Täler: In Escuaín folgt man vom Dorf dem Aussichtsweg zur Schlucht oder
      wandert von Revilla zu den Felskanzeln von Angonés. Vom Pineta-Tal steigen geübte Bergwanderer im Sommer
      zum Balcón de Pineta oder Ibón de Marboré auf, was gute Kondition und Trittsicherheit verlangt. Die
      Südlage von Escuaín mildert Fröste und lässt den Schnee rascher schmelzen.
    history: >-
      Dieses Gebiet blieb bis vor kurzem abgeschieden, was bäuerliche Architektur, Bräuche und
      Landschaftsformen bewahrte. Über Jahrhunderte regelten Hirten aus Torla, Gavarnie, Barèges und Broto
      Weideverträge zur gemeinsamen Almwirtschaft: Herden im Winter im Vorland, im Sommer auf den Hochalmen.
      Im Turieto-Wald erinnert ein Denkmal an den Pyrenäenpionier Lucien Briet, der ihn als Dschungel pries,
      in dem man nur Bäume sieht, durch Bäume hindurch und über Bäumen.


      Der Nationalpark wurde 1918 gegründet. Ende der 70er Jahre verhinderten Anwohner und Verbände
      erfolgreich einen Staudammbau, der die Añisclo-Schlucht überflutet hätte. In Añisclo führt zudem eine
      kühne Brücke hoch über dem Bellós zur Felseneremitur San Úrbez.
    before: >-
      In der Hochsaison ist die Zufahrt zur Pradera de Ordesa mit Privatfahrzeugen untersagt: Du musst den
      Pendelbus ab Torla-Ordesa nutzen. Seit dem 9. Februar 2022 ist Biwakieren im gesamten Sektor Ordesa
      untersagt; Zelten ist ausschließlich am Biwakplatz Góriz mit Voranmeldung gestattet. Offenes Feuer,
      freilaufende Hunde und das Entnehmen von Pflanzen, Tieren oder Gestein sind verboten.
    around: >-
      Nur 1 km entfernt jenseits der Grenze liegt der [Parque Nacional de los
      Pirineos](/lugar/parc-national-des-pyrenees/). Weiter entfernt teilt der [Parque Nacional de los Picos
      de Europa](/lugar/parque-nacional-de-los-picos-de-europa/) Gämse, Hochgebirgsschluchten und Karstmassive
      mit Ordesa, während der [Parco Nazionale Gran Paradiso](/lugar/parco-nazionale-gran-paradiso/)
      Bartgeier, Steinadler und alpine Urlandschaften teilt.
  it:
    intro: >-
      Secondo la leggenda, un cavaliere braccato dai nemici levò la spada Durlindana e spezzò la muraglia
      rocciosa che gli sbarrava il cammino: nacque così la breccia di Rolando. Qualunque ne sia l'origine
      geologica, la parete si erge immutata e il parco che la circonda evoca un grandioso scenario mitico. Il
      Parco Nazionale di Ordesa e del Monte Perdido occupa i Pirenei di Huesca, spaziando tra i 700 m della
      forra del Bellós e i 3348 m della vetta del Monte Perdido, raccogliendo quattro valli profondamente
      diverse: Ordesa, Añisclo, Escuaín e Pineta. È Riserva della Biosfera dal 1977 e Patrimonio dell'Umanità
      dal 1997.
    landscape: >-
      Tutto scaturisce da una colossale montagna calcarea. La struttura fondamentale deriva dal corrugamento
      alpino terziario, rifinita poi dai ghiacciai quaternari in circhi e vallate alpine. Per questa ragione
      la valle di Ordesa possiede una superba sezione a «U», percorsa dal fiume Arazas fino alla confluenza
      con l'Ara; per questo il massiccio delle Tres Sorores è il rilievo calcareo più alto d'Europa; e per
      questo sulla parete nord del Monte Perdido sopravvive tuttora un ghiacciaio, sebbene in arretramento.


      In seguito operò l'azione dell'acqua, capace di disciogliere il carbonato di calcio. In alto, sopra i
      2000 m, il sistema carsico inghiotte ogni pioggia e le creste appaiono rocciose e aride. In basso, le
      acque sotterranee riaffiorano con forza in cascate, gole e orridi. Il cristallino Arazas discende tra
      salti d'acqua popolati da trote, tra cui spiccano la cascata della Cola de Caballo e le Gradas de Soaso.
      Añisclo forma un canyon lungo 21 km dove il Bellós scorre incassato tra pareti verticali con dislivelli
      superiori a 1.000 m. A Escuaín, lo Yaga attraversa una gola carsica ricca di cavità ipogee. E nella
      valle di Pineta nasce il Cinca, alimentato dai nevai e dai ghiacci dell'Ibón de Marboré.


      La flora segue rigorose fasce altitudinali. Il piano montano, tra gli 800 e i 1700 m, ospita faggete,
      abeti bianchi e pini silvestri; fino a 2000 m primeggia il pino uncinato. Nei pascoli alpini fiorisce la
      stella alpina, l'edelweiss. Sulle falesie vegetano endemismi esclusivi dei Pirenei: la flora vascolare
      annovera 1400 specie, quasi il 45 % della flora dei Pirenei aragonesi.
    wildlife: >-
      Osserva le falesie strapiombanti. Il [gipeto](/especie/gypaetus_barbatus/) abita le gole e le creste
      d'alta quota, insediandosi stabilmente sulle pareti di Escuaín. Al suo fianco volteggiano l'[aquila
      reale](/especie/aquila_chrysaetos/), il [grifone](/especie/gyps_fulvus/), il
      [capovaccaio](/especie/neophron_percnopterus/), i nibbi e il biancone. Nei boschi vivono il [gallo
      cedrone](/especie/tetrao_urogallus/), la civetta capogrosso, il picchio nero e il picchio dorsobianco.


      Nei pascoli subalpini si scorgono agevolmente le [marmotte alpine](/especie/marmota_marmota/) e i
      [camosci dei Pirenei](/especie/rupicapra_pyrenaica/) (chiamati sarrios in Aragona). La popolazione di
      camosci conta circa 700 capi, ridottasi in passato per epidemie di cheratocongiuntivite e pestivirus. Il
      cervo è tornato a popolare le valli, mentre l'[orso bruno](/especie/ursus_arctos/), forte di una
      presenza stimata tra 25 e 32 esemplari sull'intera catena pirenaica, frequenta i settori più impervi. La
      fauna minore comprende lontre, volpi, gatti selvatici e il desman pirenaico. Nei torrenti freddi e
      incontaminati vivono la rana pirenaica e il tritone dei Pirenei.


      Il ritmo stagionale muta l'assetto del parco. In primavera il sentiero dei Cacciatori e la Faja de Pelay
      sono spesso chiusi per neve residua e pericolo di crolli, mentre ad Añisclo il Bellós ruggisce
      alimentato dal disgelo. L'autunno regala il quadro visivo più celebre: dalla seconda metà di ottobre le
      foreste caducifoglie di Ordesa si accendono di toni caldi, mentre ad Añisclo faggi, aceri e frassini
      toccano il culmine cromatico tra fine ottobre e inizio novembre.
    visit: >-
      Ogni valle ha la propria porta di ingresso. A Ordesa si accede da Torla, ad Añisclo da Escalona, a
      Escuaín da Escuaín e Tella, e a Pineta da Bielsa. Puoi iniziare da una struttura didattica: il centro
      visitatori di Torla-Ordesa custodisce il reperto tassidermico di Celia, l'ultimo stambecco pirenaico
      prima dell'estinzione; altri punti accoglienza sorgono a Casa Oliván e Tella, affiancati da sportelli a
      La Pradera, Escalona, San Úrbez, Fanlo, Escuaín, Bielsa e Pineta.


      A Ordesa, il punto informativo della Pradera costituisce la base per i sentieri delle cascate
      dell'Arazas, della Cola de Caballo, del sentiero dei Cacciatori e della Faja de Pelay. Il percorso
      risale al belvedere di Calcilarruego e immette sulla vertiginosa cornice rocciosa affacciata sul canyon.


      Se scegli altre vallate: a Escuaín basta percorrere dal paese l'itinerario dei belvederi per ammirare la
      gola, oppure salire ai belvederi di Angonés da Revilla. Da Pineta, in estate, si sale verso il Balcón de
      Pineta e l'Ibón de Marboré, escursioni che esigono solida preparazione fisica. L'esposizione a
      mezzogiorno di Escuaín attenua le gelate e accelera lo scioglimento della neve.
    history: >-
      Questo territorio pirenaico è rimasto isolato fino a tempi recenti, preservando consuetudini
      agro-pastorali, architettura e paesaggi storici. Per secoli i pastori di Torla, Gavarnie, Barèges e
      Broto hanno stipulato patti di pascolo per condividere le risorse: bestiame a valle in inverno e sui
      pascoli alti d'estate. Nel bosco di Turieto un monumento rende omaggio all'esploratore Lucien Briet, che
      lo definì una selva dove si scorgono solo alberi, attraverso alberi e sopra alberi.


      Il parco fu proclamato nel 1918. Alla fine degli anni 70, comunità locali e studiosi si mobilitarono per
      bloccare un progetto di sbarramento idroelettrico che avrebbe sommerso la gola di Añisclo. Ad Añisclo,
      inoltre, un ardito ponte sospeso tra le rocce sopra il Bellós conduce all'eremo rupestre di San Úrbez.
    before: >-
      Nei periodi di forte afflusso turistico non è consentito salire alla Pradera di Ordesa con veicoli
      privati: è obbligatorio utilizzare il bus navetta da Torla-Ordesa. Dal 9 febbraio 2022 il bivacco è
      tassativamente vietato in tutto il settore Ordesa; il pernottamento in tenda è consentito solo presso
      l'area attrezzata di Góriz su prenotazione. All'interno del parco è vietato accendere fuochi, lasciare i
      cani liberi o asportare specie biologiche e minerali.
    around: >-
      Il [Parque Nacional de los Pirineos](/lugar/parc-national-des-pyrenees/) dista solo 1 km oltre il
      confine. Tra i luoghi più distanti, il [Parque Nacional de los Picos de
      Europa](/lugar/parque-nacional-de-los-picos-de-europa/) condivide con Ordesa camosci, forre calcaree e
      massicci alpini glaciali, mentre il [Parco Nazionale Gran
      Paradiso](/lugar/parco-nazionale-gran-paradiso/) condivide gipeto, aquila reale e grandiose morfologie
      montane.
  pt:
    intro: >-
      Segundo a lenda, um cavaleiro acossado pelos seus adversários brandiu a sua espada Durandarte e fendeu a
      muralha rochosa que lhe barrava a fuga: assim se rasgou a Brecha de Rolando. Seja qual for a origem
      geológica, a escarpa permanece imponente e o parque em redor assemelha-se a um cenário mítico. O Parque
      Nacional de Ordesa e Monte Perdido ocupa os Pirenéus de Huesca, estendendo-se entre os 700 m no vale do
      rio Bellós e os 3348 m no pico do Monte Perdido, congregando quatro vales distintos: Ordesa, Añisclo,
      Escuaín e Pineta. É Reserva da Biosfera desde 1977 e Património Mundial desde 1997.
    landscape: >-
      Tudo nasce de uma colossal montanha de calcário. A sua estrutura básica consolidou-se na orogenia alpina
      da era Terciária, tendo os glaciares do Quaternário terminado de esculpir circos e vales suspensos. É
      por essa razão que o vale de Ordesa possui perfil em «U», percorrido pelo Arazas até confluir com o Ara;
      por isso o maciço das Tres Sorores é o relevo calcário mais alto da Europa; e por isso na vertente norte
      do Monte Perdido subsiste um glaciar residual em retrocesso.


      Mais tarde atuou a água, dissolvendo o calcário solúvel. No alto, acima dos 2000 m, a drenagem cárstica
      absorve a chuva e as cristas revelam-se arriscadamente áridas. Em baixo, a água subterrânea ressurge em
      cascatas impetuosas e gargantas profundas. O Arazas, de águas cristalinas com trutas, precipita-se em
      sucessivas quedas de água, sendo a Cola de Caballo e as Gradas de Soaso paragens emblemáticas. Añisclo é
      um desfiladeiro de 21 km onde o Bellós corre encaixado entre falésias verticais com desníveis de mais de
      1.000 m. Em Escuaín, o Yaga talha um canhão cárstico com grutas e galerias profundas. E em Pineta brota
      o Cinca, alimentado pelos ventos e geleiras do Ibón de Marboré.


      A flora reparte-se por andares de altitude. O piso montano, entre os 800 e os 1700 m, sustenta faiais,
      abetos-brancos e pinheiros-silvestres; até aos 2000 m domina o pinheiro-das-rochas. Nas pastagens
      alpinas floresce a célebre flor-dos-alpes, o edelvais. Nas escarpas abrigam-se plantas exclusivas da
      cordilheira: a flora do parque congrega 1400 espécies, quase 45 % da flora vascular dos Pirenéus
      aragoneses.
    wildlife: >-
      Ergue o olhar para os paredões. O [quebra-ossos](/especie/gypaetus_barbatus/) habita as gargantas e os
      cumes alpinos, nidificando com frequência nos cortados de Escuaín. Ao seu lado planam a
      [águia-real](/especie/aquila_chrysaetos/), o [abutre-fouveiro](/especie/gyps_fulvus/), o
      [abutre-do-egito](/especie/neophron_percnopterus/), os milhafres e a águia-cobreira. Nas matas habitam o
      [tetraz-grande](/especie/tetrao_urogallus/), o mocho-boreal, o pica-pau-preto e o
      pica-pau-de-dorso-branco.


      Nas pradarias subalpinas avistam-se com facilidade [marmotas-alpinas](/especie/marmota_marmota/) e
      [camurças-dos-pirinéus](/especie/rupicapra_pyrenaica/) (designadas sarrios em Aragão). A sua população
      ronda os 700 exemplares, tendo declinado com surtos de queratoconjuntivite e pestivírus. O veado
      regressa gradualmente aos vales, e o [urso-pardo](/especie/ursus_arctos/), com um efetivo estimado entre
      25 e 32 espécimes em toda a cordilheira, deambula pelos setores mais ermos. A pequena fauna reúne
      lontras, raposas, gatos-bravos e a toupeira-da-água. Nas torrentes puras habitam a rã-dos-pirenéus e o
      tritão-dos-pirenéus.


      O ciclo das estações molda a paisagem. Na primavera, o trilho dos Caçadores e a Faja de Pelay
      encontram-se habitualmente encerrados por gelo e derrocadas, e o Bellós desce bravio com o degelo. O
      outono proporciona o maior espetáculo: a partir de meados de outubro os bosques caducifólios de Ordesa
      resplandecem em cores douradas, enquanto em Añisclo faias e bordos atingem o apogeu entre fins de
      outubro e princípios de novembro.
    visit: >-
      Cada vale possui a sua via de entrada. Em Ordesa entra-se por Torla, em Añisclo por Escalona, em Escuaín
      por Escuaín e Tella, e em Pineta por Bielsa. Começa por um centro de visitantes: o de Torla-Ordesa expõe
      o exemplar empalhado de Celia, o último cabra-montês pirenaico antes da extinção; existem centros em
      Casa Oliván e Tella, com postos de informação em La Pradera, Escalona, San Úrbez, Fanlo, Escuaín, Bielsa
      e Pineta.


      Em Ordesa, o posto de La Pradera constitui o ponto de partida para os caminhos das cascatas do Arazas,
      da Cola de Caballo, do trilho dos Caçadores e da Faja de Pelay. Esta rota alcandorada sobe ao miradouro
      de Calcilarruego e percorre a cornija sobranceira ao desfiladeiro.


      Se preferires outro vale: em Escuaín podes percorrer a partir da aldeia a rota dos miradouros para
      contemplar o canhão, ou subir aos miradouros de Angonés a partir de Revilla. A partir de Pineta, no
      verão, ascende-se ao Balcón de Pineta e ao Ibón de Marboré, itinerários que exigem boa compleição física
      e equipamento de montanha. A orientação a sul em Escuaín atenua o gelo e antecipa a fusão das neves.
    history: >-
      Este território pirenaico manteve-se resguardado até época recente, facto que preservou a arquitetura
      tradicional, costumes e paisagens agrícolas. Durante séculos os pastores de Torla, Gavarnie, Barèges e
      Broto celebraram tratados pastoris de partilha de pastos: gado no sopé no inverno e nos cumes no verão.
      No bosque de Turieto, um monumento homenageia o explorador Lucien Briet, que a descreveu como uma selva
      onde apenas se veem árvores, por entre árvores e sobre árvores.


      O parque foi criado em 1918. Nos finais dos anos 70, cidadãos e municípios mobilizaram-se com sucesso
      para impedir uma barragem hidroelétrica que inundaria o desfiladeiro de Añisclo. Em Añisclo, uma ponte
      impressionante lançada entre fragas sobre o Bellós dá acesso à ermida de San Úrbez.
    before: >-
      Em períodos de afluência intensa não é permitido subir à Pradera de Ordesa em viatura particular: deves
      apanhar o autocarro vaivém em Torla-Ordesa. Desde 9 de fevereiro de 2022 é expressamente proibido o
      bivaque em todo o setor de Ordesa; a pernoita apenas se admite na zona de campismo de Góriz com marcação
      prévia. No interior do parque é proibido fazer fogo, soltar cães ou recolher fauna, flora e minerais.
    around: >-
      A apenas 1 km de distância fica o [Parque Nacional de los Pirineos](/lugar/parc-national-des-pyrenees/).
      Entre os locais distantes, o [Parque Nacional de los Picos de
      Europa](/lugar/parque-nacional-de-los-picos-de-europa/) partilha a camurça, desfiladeiros cársticos e
      maciços alpinos glaciares, enquanto o [Parco Nazionale Gran
      Paradiso](/lugar/parco-nazionale-gran-paradiso/) partilha o quebra-ossos, a águia-real e a alta
      montanha.
