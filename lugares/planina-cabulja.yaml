    Una montaña desnuda y sin agua que, con sus vecinas, forma el centro endémico de Herzegovina, donde se
    concentra buena parte de las plantas endémicas de la región.
  en: >-
    A barren, waterless mountain that forms, together with its neighbours, Herzegovina's botanical hotspot
    harbouring numerous localized endemics.
  fr: >-
    Une montagne dénudée et sans eau qui forme avec ses voisines le cœur endémique de l'Herzégovine, abritant
    une rare concentration de plantes endémiques.
  de: >-
    Ein kahler, wasserloser Gebirgsstock, der mit seinen Nachbarn das Endemiten-Zentrum der Herzegowina mit
    außergewöhnlicher Pflanzenvielfalt bildet.
  it: >-
    Una montagna nuda e priva d'acqua che forma con le vette vicine il centro d'endemismo dell'Erzegovina, con
