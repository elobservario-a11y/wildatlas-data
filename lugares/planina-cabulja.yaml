texto:
  es:
    intro: >-
      Čabulja es una mole de caliza desnuda, pedregosa y sin agua que se alza en Herzegovina entre el río
      Neretva y su afluente derecho, el Drežanka, dentro del municipio de Mostar. Su cima más alta es Velika
      Vlajna. Y sin embargo es una de las montañas con más plantas endémicas de la región.
    landscape: >-
      Čabulja está hecha de calizas mesozoicas y, en parte, de dolomías, y es la prolongación morfotectónica
      de la montaña Velež. Hacia el valle del Drežanka cae de golpe: escarpes tectónicos de varios cientos de
      metros de altura. Hacia el suroeste, en cambio, se suaviza en un piedemonte. En ambos lados la fuerte
      glaciación pleistocena dejó grandes conjuntos de morrenas, sobre todo en el suroeste.


      El resto es una montaña desnuda, pedregosa y sin agua en superficie, con poca tierra de cultivo en los
      estrechos valles del suroeste, donde quedan pocos pueblos dispersos. Al este, el cerro Hum es su estribo
      sureste. Por el otro lado, más allá del lago de Blidinje, cierra la meseta de Blidinje, entre Čvrsnica y
      Vran; entre Čvrsnica y Čabulja se abre el valle de Drežnica, con el arroyo Drežanka y dos pueblos del
      mismo nombre.
    wildlife: >-
      El tesoro de Čabulja es botánico. Junto a Čvrsnica y Vran, el parque de Blidinje la sitúa entre las
      montañas de su centro endémico herzegovino, y en la zona se citan como endémicas Minuartia handelii,
      Dianthus freynii, Oxytropis prenja y Campanula hercegovina. En el conjunto del parque de Blidinje se han
      registrado unas 1500 especies de plantas, más de 200 de ellas endémicas, subendémicas o relictas, y se
      guarda el mayor hábitat del [pino de Bosnia](/especie/pinus_heldreichii/), llamado munika, un pino
      endémico de corteza clara. Aproximadamente dos tercios del parque son bosque; el resto, prados, pastos y
      praderas de montaña.


      De fauna, los datos son del parque en su conjunto. Se han registrado 122 especies de aves, entre ellas
      el [urogallo](/especie/tetrao_urogallus/), el [águila real](/especie/aquila_chrysaetos/), el águila
      calzada, la culebrera europea y el [buitre leonado](/especie/gyps_fulvus/). Entre los mamíferos aparecen
      el [rebeco](/especie/rupicapra_rupicapra/), el [corzo](/especie/capreolus_capreolus/), el
      [jabalí](/especie/sus_scrofa/), el [oso pardo](/especie/ursus_arctos/), el
      [lobo](/especie/canis_lupus/), el [lince](/especie/lynx_lynx/), el [gato
      montés](/especie/felis_silvestris/) y la [marta](/especie/martes_martes/). Hay también 91 especies de
      mariposas diurnas.


      Más de la mitad de la precipitación del parque cae como nieve, y su deshielo mantiene en parte las aguas
      subterráneas durante el verano seco. En Čabulja, buena parte de la montaña es pasto de verano con
      asentamientos ganaderos estacionales, también de pastores de la Herzegovina occidental submediterránea.
    visit: >-
      Las rutas del Parque Natural Blidinje se describen sobre todo en el macizo de Čvrsnica, y desde allí se
      divisa Čabulja; la propia montaña no tiene un itinerario de visita descrito. El parque ofrece
      senderismo, bicicleta de montaña y actividades educativas sobre flora, geología e hidrogeología.
    history: >-
      Blidinje se declaró parque natural en 1995. El Drežanka se alimenta de las aguas de Vran, Čvrsnica y
      Čabulja y cierra por el sur el parque con su cañón.
    before: Es una montaña sin agua en superficie, así que el agua hay que llevarla.
    around: >-
      Pegadas a Čabulja, a distancia casi nula, están el [Parque Natural Blidinje - Macizo de
      Čvrsnica](/lugar/park-prirode-blidinje---cvrsnica/) y las [Montañas de Vran](/lugar/planina-vran/).
  en:
    intro: >-
      Čabulja is a massive bulwark of bare, waterless limestone rising starkly in Herzegovina between the
      Neretva River and its right tributary, the Drežanka, within the municipality of Mostar. Its crowning
      summit is Velika Vlajna. Yet despite its harsh sterility, it stands as one of the most botanically
      celebrated mountains in the region.
    landscape: >-
      Čabulja is sculpted from Mesozoic limestones and dolomites, forming the morphotectonic continuation of
      Mount Velež. Toward the Drežanka canyon it breaks off abruptly in monumental fault scarps several
      hundred metres high. In contrast, its southwestern flanks descend more gently into an undulating
      limestone piedmont. Massive Pleistocene moraine fields mantle both flanks, especially toward the
      southwest.


      The rest of the mountain is bare, stony karst without surface water, offering meager arable plots in the
      narrow southwestern valleys where a few scattered hamlets survive. To the east, Hum hill forms its
      southeastern spur. Beyond Lake Blidinje, the high Blidinje plateau opens between Čvrsnica and Vran;
      between Čvrsnica and Čabulja cuts the deep Drežnica valley with the rushing Drežanka stream and its twin
      riverside villages.
    wildlife: >-
      The true treasure of Čabulja is its botanical richness. Together with Čvrsnica and Vran, Blidinje Nature
      Park designates these peaks as the core endemic centre of Herzegovina, recording localized botanical
      endemics such as Minuartia handelii, Dianthus freynii, Oxytropis prenja, and Campanula hercegovina.
      Across Blidinje Nature Park, botanists have documented roughly 1500 plant species, with over 200
      endemic, subendemic, or relict taxa, alongside Europe's largest continuous tracts of the pale-barked
      [Bosnian pine](/especie/pinus_heldreichii/) (munika). Roughly two-thirds of the park is forested, with
      the remainder consisting of alpine meadows and rocky pastures.


      Faunal counts encompass the entire park territory: 122 bird species have been recorded, including the
      [western capercaillie](/especie/tetrao_urogallus/), [golden eagle](/especie/aquila_chrysaetos/), booted
      eagle, short-toed snake eagle, and [griffon vulture](/especie/gyps_fulvus/). Mammals include the
      [chamois](/especie/rupicapra_rupicapra/), [roe deer](/especie/capreolus_capreolus/), [wild
      boar](/especie/sus_scrofa/), [brown bear](/especie/ursus_arctos/), [grey wolf](/especie/canis_lupus/),
      [Eurasian lynx](/especie/lynx_lynx/), European [wildcat](/especie/felis_silvestris/), and [pine
      marten](/especie/martes_martes/). In addition, 91 diurnal butterfly species flutter across the pastures.


      More than half of annual precipitation falls as snow, feeding subterranean karst aquifers through the
      dry summer. In Čabulja, the high plateau supports traditional summer transhumance with seasonal pastoral
      dwellings used by herders from sub-Mediterranean western Herzegovina.
    visit: >-
      Most marked hiking routes within Blidinje Nature Park are concentrated on the neighbouring Čvrsnica
      massif, which affords commanding views across to Čabulja; Čabulja itself lacks dedicated developed
      visitor infrastructure. The park authority provides opportunities for wilderness hiking, mountain
      biking, and environmental educational programs.
    history: >-
      Blidinje was officially established as a nature park in 1995. The Drežanka River gathers waters draining
      from Vran, Čvrsnica, and Čabulja, bounding the southern perimeter of the park with its colossal canyon.
    before: 'This is a strictly waterless karst mountain: carrying ample drinking water is essential.'
    around: >-
      Immediately bordering Čabulja lie [Blidinje Nature Park – Čvrsnica
      Massif](/lugar/park-prirode-blidinje---cvrsnica/) and the [Vran Mountains](/lugar/planina-vran/).
  fr:
    intro: >-
      La Čabulja est une puissante croupe de calcaire nu, pierreuse et dépourvue d'eau, dressée en Herzégovine
      entre la Neretva et son affluent droit, la Drežanka, sur le territoire de Mostar. Son sommet culminant
      est Velika Vlajna. Pourtant, sous cette austérité minérale se cache l'un des sanctuaires floristiques
      les plus riches de la région.
    landscape: >-
      La Čabulja est formée de calcaires et dolomies mésozoïques, constituant le prolongement morphotectonique
      du massif du Velež. Vers le canyon de la Drežanka, elle s'effondre d'un coup en escarpements verticaux
      de plusieurs centaines de mètres. Vers le sud-ouest, le relief s'adoucit en un glacis calcaire. Sur les
      deux versants, les glaciers pléistocènes ont déposé d'immenses champs morainiques.


      Le reste de la montagne est aride, sans écoulement de surface, avec quelques maigres parcelles cultivées
      dans les vallons du sud-ouest où subsistent de rares hameaux. À l'est, la colline du Hum forme son
      contrefort. De l'autre côté, au-delà du lac de Blidinje, s'ouvre le plateau de Blidinje entre Čvrsnica
      et Vran ; entre Čvrsnica et Čabulja s'enfonce la gorge de Drežnica drainée par la Drežanka.
    wildlife: >-
      Le joyau de la Čabulja est sa flore. Avec la Čvrsnica et le Vran, le parc de Blidinje en fait le cœur de
      son pôle endémique d'Herzégovine, abritant Minuartia handelii, Dianthus freynii, Oxytropis prenja et
      Campanula hercegovina. Dans l'ensemble du parc naturel sont recensées environ 1500 espèces végétales,
      dont plus de 200 endémiques, subendémiques ou reliques, ainsi que le plus vaste peuplement de [pin de
      Bosnie](/especie/pinus_heldreichii/) (munika). Environ deux tiers du parc sont boisés, le reste étant
      composé de pelouses d'altitude et de rocailles.


      Pour la faune, 122 espèces d'oiseaux ont été observées dans le parc, parmi lesquelles le [grand
      tétras](/especie/tetrao_urogallus/), l'[aigle royal](/especie/aquila_chrysaetos/), l'aigle botté, le
      circaète et le [vautour fauve](/especie/gyps_fulvus/). Les mammifères comptent le
      [chamois](/especie/rupicapra_rupicapra/), le [chevreuil](/especie/capreolus_capreolus/), le
      [sanglier](/especie/sus_scrofa/), l'[ours brun](/especie/ursus_arctos/), le
      [loup](/especie/canis_lupus/), le [lynx boréal](/especie/lynx_lynx/), le [chat
      sauvage](/especie/felis_silvestris/) et la [martre des pins](/especie/martes_martes/). On y dénombre
      aussi 91 espèces de papillons de jour.


      Plus de la moitié des précipitations tombe sous forme de neige, alimentant les réserves souterraines
      durant l'été aride. La Čabulja accueille des estives traditionnelles exploitées par les pasteurs de
      l'Herzégovine sub-méditerranéenne.
    visit: >-
      Les sentiers balisés du parc naturel de Blidinje parcourent principalement la Čvrsnica, d'où l'on domine
      la Čabulja ; la montagne elle-même ne possède pas d'aménagements touristiques lourds. Le parc propose
      randonnées sauvages, vélo tout-terrain et sensibilisation naturaliste.
    history: >-
      Blidinje a été classé parc naturel en 1995. La rivière Drežanka draine les eaux du Vran, de la Čvrsnica
      et de la Čabulja, bordant la limite sud du parc par son impressionnant canyon.
    before: 'Cette montagne est totalement dépourvue de points d''eau : emportez des réserves suffisantes.'
    around: >-
      Contigus à la Čabulja s'étendent le [parc naturel de Blidinje – massif de
      Čvrsnica](/lugar/park-prirode-blidinje---cvrsnica/) et les [montagnes de Vran](/lugar/planina-vran/).
  de:
    intro: >-
      Die Čabulja ist ein wuchtiges Massiv aus nacktem, felsigem und wasserlosem Karstkalk, das sich in der
      Herzegowina zwischen der Neretva und ihrem rechten Zufluss Drežanka im Stadtgebiet von Mostar aufbaut.
      Ihr höchster Gipfel ist die Velika Vlajna. Trotz ihrer Trockenheit zählt sie zu den artenreichsten
      botanischen Hotspots des Landes.
    landscape: >-
      Die Čabulja besteht aus mesozoischen Kalken und Dolomiten und bildet die tektonische Fortsetzung des
      Velež-Gebirges. Zum tiefen Drežanka-Tal bricht sie unvermittelt mit gewaltigen Felsabstürzen ab. Nach
      Südwesten flacht das Relief sanft in ein Karst-Piedmont ab. Auf beiden Seiten hinterließen eiszeitliche
      Gletscher mächtige Moränenzüge.


      Das übrige Gebirge ist kahl und ohne oberirdische Gewässer, mit kargen Böden in den engen südwestlichen
      Tälern, wo wenige Höfe verstreut liegen. Im Osten bildet der Hum ihren südöstlichen Ausläufer. Jenseits
      des Blidinje-Sees schließt sich das Hochland von Blidinje zwischen Čvrsnica und Vran an; zwischen
      Čvrsnica und Čabulja schneidet der Drežanka-Bach einen tiefen Canyon ein.
    wildlife: >-
      Der herausragende Wert der Čabulja liegt in ihrer Pflanzenwelt. Gemeinsam mit Čvrsnica und Vran bildet
      sie das Endemitenzentrum des Naturparks Blidinje mit seltenen Lokalendemiten wie Minuartia handelii,
      Dianthus freynii, Oxytropis prenja und Campanula hercegovina. Im gesamten Naturpark wurden rund 1500
      Pflanzenarten erfasst, darunter über 200 Endemiten, Subendemiten oder Eiszeitrelikte, sowie der größte
      Bestand der hellrindigen [Schlangenhaut-Kiefer](/especie/pinus_heldreichii/) (Munika). Etwa zwei Drittel
      des Parks sind bewaldet, der Rest besteht aus Almen und Felsfluren.


      Die Tierwelt umfasst 122 Vogelarten, darunter [Auerhuhn](/especie/tetrao_urogallus/),
      [Steinadler](/especie/aquila_chrysaetos/), Zwergadler, Schlangenadler und
      [Gänsegeier](/especie/gyps_fulvus/). Bei den Säugetieren leben hier
      [Gämse](/especie/rupicapra_rupicapra/), [Reh](/especie/capreolus_capreolus/),
      [Wildschwein](/especie/sus_scrofa/), [Braunbär](/especie/ursus_arctos/), [Wolf](/especie/canis_lupus/),
      [Eurasischer Luchs](/especie/lynx_lynx/), [Wildkatze](/especie/felis_silvestris/) und
      [Baummarder](/especie/martes_martes/). Zudem flattern 91 Tagfalterarten über die Hochflächen.


      Über die Hälfte der Jahresniederschläge fällt als Schnee, der die Karstquellen im Sommer speist. Auf der
      Čabulja weiden im Sommer Herden traditioneller Almwirtschaften.
    visit: >-
      Die markierten Wanderwege des Naturparks Blidinje erschließen vor allem das Čvrsnica-Massiv, von dem aus
      man zur Čabulja blickt; die Čabulja selbst besitzt keine ausgebaute touristische Infrastruktur. Der
      Naturpark bietet Bergwandern, Mountainbiken und naturkundliche Exkursionen.
    history: >-
      Blidinje wurde 1995 als Naturpark unter Schutz gestellt. Die Drežanka sammelt die Abflüsse von Vran,
      Čvrsnica und Čabulja und begrenzt den Park nach Süden mit ihrem Canyon.
    before: 'Das Gebirge besitzt keine Quellen: Führe ausreichend Trinkwasser mit.'
    around: >-
      Direkt an die Čabulja grenzen der [Naturpark Blidinje –
      Čvrsnica-Massiv](/lugar/park-prirode-blidinje---cvrsnica/) und das [Vran-Gebirge](/lugar/planina-vran/).
  it:
    intro: >-
      La Čabulja è una dorsale di calcare nudo, pietrosa e arida, che si erge in Erzegovina tra il fiume
      Neretva e il suo affluente Drežanka, nel territorio di Mostar. La vetta culminante è Velika Vlajna.
      Malgrado l'estrema aridità esteriore, è una delle montagne più ricche di endemismi floristici della
      penisola balcanica.
    landscape: >-
      La Čabulja è costituita da calcari e dolomie mesozoiche, prolungamento morfotettonico del massiccio del
      Velež. Verso la gola della Drežanka precipita con scarpate tettoniche di molte centinaia di metri. Verso
      sud-ovest il rilievo si attenua in un declivio pedemontano. Su entrambi i versanti le glaciazioni
      pleistoceniche hanno depositato ampi apparati morenici.


      Il resto del monte è aspro e privo di sorgenti superficiali, con scarsi suoli coltivabili nei valloni
      sud-occidentali dove sorgono piccoli casolari. A est il colle Hum ne costituisce la propaggine. Oltre il
      lago di Blidinje si estende l'altopiano compreso tra Čvrsnica e Vran; tra Čvrsnica e Čabulja si incassa
      la profonda valle della Drežanka.
    wildlife: >-
      Il tesoro della Čabulja risiede nella flora. Assieme a Čvrsnica e Vran, il parco di Blidinje la
      considera il cuore del centro endemico erzegovese, custode di specie come Minuartia handelii, Dianthus
      freynii, Oxytropis prenja e Campanula hercegovina. Nel comprensorio di Blidinje sono censite circa 1500
      piante, con oltre 200 entità endemiche, subendemiche o relitte, nonché la più grande popolazione del
      [pino loricato](/especie/pinus_heldreichii/) (munika). Circa due terzi del parco sono coperti da boschi,
      il resto da pascoli alpini e ghiaioni.


      Per la fauna, i dati abbracciano l'intero parco con 122 specie aviarie censite, tra cui [gallo
      cedrone](/especie/tetrao_urogallus/), [aquila reale](/especie/aquila_chrysaetos/), aquila minore,
      biancone e [grifone](/especie/gyps_fulvus/). Tra i mammiferi figurano [camoscio
      alpino](/especie/rupicapra_rupicapra/), [capriolo](/especie/capreolus_capreolus/),
      [cinghiale](/especie/sus_scrofa/), [orso bruno](/especie/ursus_arctos/), [lupo
      grigio](/especie/canis_lupus/), [lince eurasiatica](/especie/lynx_lynx/), [gatto
      selvatico](/especie/felis_silvestris/) e [martora](/especie/martes_martes/). Sono state censite anche 91
      specie di farfalle diurne.


      Oltre metà delle precipitazioni cade sotto forma di neve, alimentando le falde nella stagione secca.
      Sulla Čabulja resiste il pascolo estivo tradizionale.
    visit: >-
      I percorsi escursionistici del Parco naturale di Blidinje interessano soprattutto il massiccio di
      Čvrsnica, da cui si ammira la Čabulja; la montagna in sé non possiede sentieri turistici attrezzati. Il
      parco organizza escursioni guidate, percorsi in mountain bike e attività didattiche.
    history: >-
      Blidinje è stato istituito come parco naturale nel 1995. La Drežanka raccoglie le acque carsiche di
      Vran, Čvrsnica e Čabulja, chiudendo a sud l'area protetta con la sua spettacolare gola.
    before: 'È una montagna priva d''acqua: porta con te una congrua scorta idrica.'
    around: >-
      A ridosso della Čabulja sorgono il [Parco naturale Blidinje – Massiccio del
      Čvrsnica](/lugar/park-prirode-blidinje---cvrsnica/) e i [Monti del Vran](/lugar/planina-vran/).
  pt:
    intro: >-
      A Čabulja é um maciço imponente de calcário nudo, pedregoso e sem água, erguido na Herzegovina entre o
      rio Neretva e o seu afluente direito Drežanka, no município de Mostar. O seu topo mais alto é Velika
      Vlajna. Apesar da extrema secura mineral, é uma das serras com maior concentração de plantas endémicas
      da região.
    landscape: >-
      A Čabulja é constituída por calcários e dolomitos mesozoicos, formando o prolongamento morfotectónico da
      serra de Velež. Para o canhão do Drežanka despenca em escarpas tectónicas abruptas com várias centenas
      de metros de desnível. Para sudoeste o relevo suaviza-se num sopé cársico. Em ambas as vertentes a
      glaciação plistocénica acumulou extensos campos de moreias.


      O restante relevo é árido e desprovido de linhas de água superficiais, com pequenas leiras cultivadas
      nos vales apertados de sudoeste onde subsistem raras povoações. A leste, o monte Hum forma o seu
      contraforte. Do outro lado, além da lagoa de Blidinje, abre-se o planalto entre Čvrsnica e Vran; entre
      Čvrsnica e Čabulja rasga-se o desfiladeiro de Drežnica, percorrido pelo ribeiro Drežanka.
    wildlife: >-
      O grande valor da Čabulja reside na botânica. A par de Čvrsnica e Vran, o parque de Blidinje
      classifica-a como o núcleo endémico da Herzegovina, abrigando espécies singulares como Minuartia
      handelii, Dianthus freynii, Oxytropis prenja e Campanula hercegovina. No conjunto do parque de Blidinje
      contam-se cerca de 1500 espécies vegetais, mais de 200 endémicas, subendémicas ou relíquias, bem como o
      maior reduto do [pinheiro-da-Bósnia](/especie/pinus_heldreichii/) (munika). Cerca de dois terços do
      parque são floresta, constituindo o restante pastagens alpinas e rochedos.


      Na fauna, os registos abrangem o parque global com 122 espécies de aves, incluindo
      [tetraz-grande](/especie/tetrao_urogallus/), [águia-real](/especie/aquila_chrysaetos/), águia-calçada,
      águia-cobreira e [abutre-fouveiro](/especie/gyps_fulvus/). Nos mamíferos ocorrem
      [camurça](/especie/rupicapra_rupicapra/), [corço](/especie/capreolus_capreolus/),
      [javali](/especie/sus_scrofa/), [urso-pardo](/especie/ursus_arctos/),
      [lobo-cinzento](/especie/canis_lupus/), [lince-euroasiático](/especie/lynx_lynx/),
      [gato-bravo](/especie/felis_silvestris/) e [marta](/especie/martes_martes/). Existem igualmente 91
      espécies de borboletas diurnas.


      Mais de metade da precipitação anual cai como neve, sustentando as águas subterrâneas durante o estio. A
      Čabulja acolhe pastoreio estival tradicional.
    visit: >-
      Os trilhos balizados do Parque Natural de Blidinje percorrem mormente o maciço de Čvrsnica, de onde se
      contempla a Čabulja; a serra em si não dispõe de percursos turísticos estruturados. O parque dinamiza
      pedestrianismo, BTT e atividades pedagógicas.
    history: >-
      Blidinje foi declarado parque natural em 1995. O rio Drežanka drena as águas de Vran, Čvrsnica e Čabulja
      e delimita a sul o parque através do seu canhão monumental.
    before: 'É uma serra sem nascentes de água: abastece-te com água potável suficiente.'
    around: >-
      Contíguos à Čabulja erguem-se o [Parque Natural de Blidinje – Maciço de
      Čvrsnica](/lugar/park-prirode-blidinje---cvrsnica/) e as [Montanhas de Vran](/lugar/planina-vran/).
