texto:
  es:
    intro: >-
      En el otoño de 1944, Vormsi quedó casi vacía: los suecos costeros que habían vivido en la isla desde el
      siglo XIII se habían ido y por los campos vagaba el ganado sin dueño. La reserva paisajística de Vormsi
      guarda lo que hace especial a esta isla del Báltico: un afloramiento de caliza con corales fósiles,
      enebrales, alvares y praderas costeras, y un cielo por el que pasan dos rutas migratorias.
    landscape: >-
      Vormsi, la cuarta isla de Estonia, nació de una isla grande y unas treinta pequeñas, y hace unos 3000
      años sus partes más altas empezaron a emerger. Al subir el terreno, bahías del mar se convirtieron en
      los lagos Prästvike, Diby y Kersleti. Bajo todo ello hay caliza, tan característica que da nombre al
      piso Vormsi del Ordovícico.


      Es una isla llana: su punto más alto es la colina de Huitberg, a 13 metros sobre el mar. Las costas
      oeste y norte son pedregosas y solo hay playa de arena en Rumpo. El paisaje alterna alvares y enebrales
      en el oeste con zonas bajas y encharcadas en el este, y más de la mitad de la superficie es bosque. Los
      pastos costeros y los prados arbolados nacieron de la agricultura activa y siguen vivos gracias a ella;
      en ellos crecen plantas y animales desaparecidos o amenazados en Estonia y en Europa.


      Huitberg guarda un biohermo de caliza ordovícica, y donde el musgo deja la roca al descubierto se ven
      corales fosilizados. En el bosque, junto al camino de Förby a Fällarna, está el arrecife de coral de
      Hoitberg, y en Hullo hay un gran bloque errático, el Parunikivi. La península de Rumpo, por su parte,
      tiene comunidades de líquenes singulares.
    wildlife: >-
      La isla suma 211 especies de aves. Entre las que anidan destacan el [pigargo
      europeo](/especie/haliaeetus_albicilla/) y la [grulla común](/especie/grus_grus/); también hay [búho
      real](/especie/bubo_bubo/), y a menudo se oye el [guión de codornices](/especie/crex_crex/), escaso en
      el resto de Europa. Por Vormsi pasan dos rutas migratorias importantes: en primavera y otoño se ve el
      paso de barnaclas cariblancas y otras ocas, y en otoño las grullas cubren los campos.


      Entre los mamíferos, 25 especies, hay [linces](/especie/lynx_lynx/), que se han vuelto numerosos, y
      muchos [jabalíes](/especie/sus_scrofa/). Entre las especies protegidas figura el murciélago orejudo.
      Tres reptiles y tres anfibios completan el cuadro; uno de los más raros es el [sapo
      corredor](/especie/bufo_calamita/), que vive en charcas someras de la costa. La flora supera las 900
      especies de árboles, arbustos y hierbas, unas 60 de ellas protegidas.
    visit: >-
      Se llega en ferri desde Rohuküla, que admite peatones y vehículos. Una encuesta de RMK recogió que
      quienes venían por el día pasaban en la reserva una media de 5,2 horas.


      El sendero de Rumpo es la visita natural: recorre enebrales, alvares y praderas costeras, pasa junto a
      los líquenes y abre vistas sobre la bahía de Hullo y sus islotes. En otro sector está Huitberg, el
      afloramiento con los corales.
    history: >-
      Entre el siglo XIII y 1944 vivieron en la isla sobre todo suecos costeros. En 1938 había unos 2600
      habitantes, la mayoría suecos. Documentos de 1391 mencionan por primera vez la isla. La iglesia de San
      Olaf de Hullo, levantada en el siglo XIII primero de madera, recibió un coro de piedra en el XIV. Los
      pueblos del oeste, con casas de armadores y marineros, se consideraban los más ricos. Los faros dan fama
      a algunos pueblos: el de Saxby, y el de Norrby, construido en 1935.
    before: >-
      Comprueba los accesos y las restricciones de la reserva antes de salir. No lleves perros a los senderos
      con ganado y deposita los residuos de tu visita en los puntos de recogida.
    around: >-
      [Kaina-Lahe-Kassari](/lugar/kaina-lahe-kassari-maastikukaitseala/) queda a unos veintitrés kilómetros, y
      [Osmussaar](/lugar/osmussaare-maastikukaitseala/), a unos veintiocho.
  en:
    intro: >-
      In the autumn of 1944 Vormsi fell almost silent: the coastal Swedes who had lived on the island since
      the thirteenth century had left, and cattle roamed the fields ownerless. The Vormsi Landscape Reserve
      preserves what makes this Baltic island unique: an outcrop of limestone with fossil corals, juniper
      heaths, alvar habitats and coastal meadows, and a sky crossed by two major migratory flyways.
    landscape: >-
      Vormsi, Estonia's fourth-largest island, was born of one main landmass and around thirty small islets,
      and some 3,000 years ago its higher ground began to emerge from the sea. As the terrain rose, coastal
      inlets became the lakes Prästvike, Diby and Kersleti. Beneath everything lies limestone so
      characteristic that it lends its name to the Vormsi Stage of the Ordovician.


      It is a flat island: its highest point is Huitberg hill at 13 metres above sea level. The western and
      northern coasts are stony with sandy beach only at Rumpo. The landscape alternates between alvars and
      juniper heaths in the west and low-lying marshy ground in the east, with more than half the surface
      covered by forest. Coastal grasslands and wooded meadows are the product of active farming and survive
      only through it; they shelter plants and animals extinct or threatened across Estonia and Europe.


      Huitberg harbours an Ordovician limestone bioherm, and wherever moss gives way to bare rock you can see
      fossilised corals. In the forest along the track from Förby to Fällarna stands the Hoitberg coral reef,
      and at Hullo a large erratic boulder, the Parunikivi. The Rumpo peninsula hosts singular lichen
      communities.
    wildlife: >-
      The island has recorded 211 bird species. Breeding highlights include [white-tailed
      eagle](/especie/haliaeetus_albicilla/) and [common crane](/especie/grus_grus/); the [Eurasian
      eagle-owl](/especie/bubo_bubo/) is also present, and the distinctive rasping call of the [corn
      crake](/especie/crex_crex/) — scarce elsewhere in Europe — is often heard. Two important migratory
      routes cross Vormsi: in spring and autumn barnacle geese and other wildfowl pour through, and in autumn
      cranes blanket the fields.


      Among 25 mammal species, [Eurasian lynx](/especie/lynx_lynx/) have become numerous, and [wild
      boar](/especie/sus_scrofa/) are plentiful. Protected species include the long-eared bat. Three reptile
      and three amphibian species complete the picture; among the rarest is the [natterjack
      toad](/especie/bufo_calamita/), which breeds in shallow coastal pools. The flora exceeds 900 species of
      trees, shrubs and herbs, some 60 of them protected.
    visit: >-
      You arrive by ferry from Rohuküla, which carries both foot passengers and vehicles. An RMK visitor
      survey found that day-trippers spent an average of 5.2 hours in the reserve.


      The Rumpo trail is the natural first choice: it passes through juniper heath, alvar and coastal meadow,
      skirts the lichen communities and opens views over Hullo Bay and its islets. In a separate sector lies
      Huitberg, the limestone outcrop with the fossil corals.
    history: >-
      From the thirteenth century until 1944, the island was inhabited mainly by coastal Swedes. In 1938 the
      population stood at around 2,600, the majority ethnic Swedes. Documents from 1391 contain the first
      written reference to the island. The Church of St Olaf at Hullo, originally built in wood in the
      thirteenth century, received a stone chancel in the fourteenth. The western villages, with their
      shipowners' and mariners' houses, were considered the wealthiest. Lighthouses define certain villages:
      that of Saxby, and the Norrby lighthouse built in 1935.
    before: >-
      Check access arrangements and restrictions for the reserve before you set out. Do not take dogs onto
      paths where livestock graze, and dispose of your waste at the designated collection points.
    around: >-
      [Kaina-Lahe-Kassari](/lugar/kaina-lahe-kassari-maastikukaitseala/) lies around twenty-three kilometres
      away, and [Osmussaar](/lugar/osmussaare-maastikukaitseala/) around twenty-eight.
  fr:
    intro: >-
      À l'automne 1944, Vormsi se vida presque entièrement : les Suédois côtiers qui avaient habité l'île
      depuis le XIIIe siècle étaient partis, et le bétail errait sans maître dans les champs. La réserve
      paysagère de Vormsi préserve ce qui rend unique cette île de la Baltique : un affleurement de calcaire à
      coraux fossiles, des landes de genévriers, des alvares et des prés côtiers, et un ciel traversé par deux
      routes migratoires importantes.
    landscape: >-
      Vormsi, quatrième île d'Estonie par la superficie, est née d'une île principale et d'une trentaine de
      petites îles, et il y a environ 3 000 ans ses parties les plus élevées ont commencé à émerger. À mesure
      que le terrain s'est soulevé, des baies se sont transformées en lacs Prästvike, Diby et Kersleti. Sous
      tout cela se trouve du calcaire si caractéristique qu'il a donné son nom à l'étage Vormsi de
      l'Ordovicien.


      L'île est plate : son point culminant est la colline de Huitberg, à 13 mètres au-dessus du niveau de la
      mer. Les côtes ouest et nord sont rocailleuses ; la seule plage de sable se trouve à Rumpo. Le paysage
      alterne alvares et landes de genévriers à l'ouest, et terrains bas et marécageux à l'est, plus de la
      moitié de la superficie étant couverte de forêt. Prés côtiers et prairies boisées sont le fruit d'une
      agriculture active et ne survivent que grâce à elle ; ils abritent des plantes et des animaux disparus
      ou menacés en Estonie et en Europe.


      Huitberg recèle un bioherm de calcaire ordovicien, et là où la mousse laisse la roche à découvert, on
      voit des coraux fossilisés. Dans la forêt, le long du chemin de Förby à Fällarna, se trouve le récif
      corallien de Hoitberg, et à Hullo un grand bloc erratique, le Parunikivi. La péninsule de Rumpo abrite
      des communautés de lichens singulières.
    wildlife: >-
      L'île recense 211 espèces d'oiseaux. Parmi les nicheurs, le [pygargue à queue
      blanche](/especie/haliaeetus_albicilla/) et la [grue cendrée](/especie/grus_grus/) se distinguent ; le
      [grand-duc d'Europe](/especie/bubo_bubo/) est également présent, et le chant caractéristique du [râle
      des genêts](/especie/crex_crex/), rare dans le reste de l'Europe, s'entend souvent. Deux routes
      migratoires importantes traversent Vormsi : au printemps et en automne passent les bernaches et autres
      oies, et en automne les grues couvrent les champs.


      Parmi 25 espèces de mammifères, les [lynx boréaux](/especie/lynx_lynx/) sont devenus nombreux, et les
      [sangliers](/especie/sus_scrofa/) abondent. L'oreillard figure parmi les espèces protégées. Trois
      reptiles et trois amphibiens complètent le tableau ; parmi les plus rares, le [crapaud
      calamite](/especie/bufo_calamita/) se reproduit dans les mares côtières peu profondes. La flore dépasse
      900 espèces d'arbres, arbustes et herbes, dont 60 sont protégées.
    visit: >-
      On accède à l'île par ferry depuis Rohuküla, qui accepte piétons et véhicules. Une enquête de RMK a
      révélé que les visiteurs à la journée passaient en moyenne 5,2 heures dans la réserve.


      Le sentier de Rumpo s'impose comme première visite : il traverse lande de genévriers, alvare et pré
      côtier, longe les communautés de lichens et ouvre des vues sur la baie de Hullo et ses îlots. Dans un
      autre secteur se trouve Huitberg, l'affleurement calcaire aux coraux fossiles.
    history: >-
      Du XIIIe siècle à 1944, l'île était habitée principalement par des Suédois côtiers. En 1938, la
      population atteignait environ 2 600 habitants, en majorité suédophones. Des documents de 1391 font pour
      la première fois mention de l'île. L'église Saint-Olaf de Hullo, érigée en bois au XIIIe siècle, reçut
      un chœur de pierre au XIVe. Les villages de l'ouest, aux maisons d'armateurs et de marins, passaient
      pour les plus riches. Des phares font la réputation de certains villages : celui de Saxby, et le phare
      de Norrby, construit en 1935.
    before: >-
      Vérifiez les accès et restrictions de la réserve avant de partir. N'emmenez pas de chiens sur les
      sentiers où paît du bétail et déposez vos déchets aux points de collecte prévus à cet effet.
    around: >-
      [Kaina-Lahe-Kassari](/lugar/kaina-lahe-kassari-maastikukaitseala/) se trouve à environ vingt-trois
      kilomètres, et [Osmussaar](/lugar/osmussaare-maastikukaitseala/), à environ vingt-huit.
  de:
    intro: >-
      Im Herbst 1944 wurde Vormsi fast menschenleer: Die Küstenschweden, die seit dem dreizehnten Jahrhundert
      auf der Insel gelebt hatten, waren gegangen, und das Vieh irrte herrenlos über die Felder. Das
      Landschaftsschutzgebiet Vormsi bewahrt, was diese Ostseeinsel einzigartig macht: einen
      Kalksteinaufschluss mit Fossilkorallen, Wacholderheiden, Alvar-Habitate und Küstenwiesen sowie einen
      Himmel, über den zwei wichtige Zugvogelrouten führen.
    landscape: >-
      Vormsi, die viertgrößte Insel Estlands, entstand aus einer Hauptinsel und rund dreißig kleinen Inseln,
      und vor etwa 3 000 Jahren begannen ihre höher gelegenen Teile aus dem Meer aufzutauchen. Als sich das
      Land hob, verwandelten sich Meeresbuchten in die Seen Prästvike, Diby und Kersleti. Darunter liegt
      Kalkstein, der so charakteristisch ist, dass er der Vormsi-Stufe des Ordoviziums seinen Namen gegeben
      hat.


      Es ist eine flache Insel: Ihr höchster Punkt ist der Hügel von Huitberg mit 13 Metern über dem
      Meeresspiegel. West- und Nordküste sind steinig, Sandstrand gibt es nur bei Rumpo. Die Landschaft
      wechselt zwischen Alvaren und Wacholderheiden im Westen und niedrigem, moorigem Gelände im Osten; mehr
      als die Hälfte der Fläche ist bewaldet. Küstenwiesen und Hainwiesen entstanden durch aktive
      Landwirtschaft und bestehen nur dank ihr weiter; sie beherbergen Pflanzen und Tiere, die in Estland und
      Europa erloschen oder bedroht sind.


      Huitberg birgt ein Ordovizium-Kalkriff, und wo das Moos den Fels freigibt, sieht man fossilisierte
      Korallen. Im Wald entlang des Weges von Förby nach Fällarna steht das Hoitberg-Korallenriff, und bei
      Hullo liegt ein großer Findling, der Parunikivi. Die Halbinsel Rumpo weist einzigartige
      Flechtengemeinschaften auf.
    wildlife: >-
      Die Insel verzeichnet 211 Vogelarten. Unter den Brutvögeln stechen
      [Seeadler](/especie/haliaeetus_albicilla/) und [Kranich](/especie/grus_grus/) hervor; auch der
      [Uhu](/especie/bubo_bubo/) kommt vor, und der charakteristische Ruf des
      [Wachtelkönigs](/especie/crex_crex/), der im übrigen Europa selten geworden ist, ist oft zu hören. Zwei
      wichtige Zugwege queren Vormsi: Im Frühjahr und Herbst ziehen Nonnengänse und andere Wildgänse durch,
      und im Herbst bedecken Kraniche die Felder.


      Unter 25 Säugetierarten sind [Eurasische Luchse](/especie/lynx_lynx/) zahlreich geworden, und
      [Wildschweine](/especie/sus_scrofa/) sind häufig. Das Langohr zählt zu den geschützten Arten. Drei
      Reptilien- und drei Amphibienarten vervollständigen das Bild; zu den seltensten gehört die
      [Kreuzkröte](/especie/bufo_calamita/), die in flachen Küstentümpeln laicht. Die Flora umfasst über 900
      Baum-, Strauch- und Krautarten, davon rund 60 unter Schutz.
    visit: >-
      Du erreichst die Insel per Fähre von Rohuküla, die sowohl Fußgänger als auch Fahrzeuge befördert. Eine
      RMK-Besucherbefragung ergab, dass Tagesgäste durchschnittlich 5,2 Stunden in der Reserve verbrachten.


      Der Rumpo-Pfad bietet sich als erste Wanderung an: Er führt durch Wacholderhaide, Alvar und Küstenwiese,
      tangiert die Flechtengemeinschaften und eröffnet Ausblicke auf die Hullo-Bucht und ihre Inseln. In einem
      anderen Bereich liegt Huitberg, der Kalksteinaufschluss mit den Fossilkorallen.
    history: >-
      Vom dreizehnten Jahrhundert bis 1944 lebten auf der Insel vor allem Küstenschweden. 1938 hatte die Insel
      rund 2 600 Einwohner, die Mehrheit schwedischsprachig. Dokumente von 1391 erwähnen die Insel erstmals.
      Die St.-Olaf-Kirche in Hullo, zunächst im dreizehnten Jahrhundert aus Holz errichtet, erhielt im
      vierzehnten Jahrhundert einen steinernen Chor. Die westlichen Dörfer mit ihren Reeder- und Marinehäusern
      galten als die wohlhabendsten. Leuchttürme geben manchen Dörfern ihren Ruf: der von Saxby und der 1935
      erbaute Norrby-Leuchtturm.
    before: >-
      Prüfe vor der Abfahrt die Zugangsbedingungen und Einschränkungen im Reservat. Bringe keine Hunde auf
      Wege mit Weidevieh und entsorge deinen Abfall an den vorgesehenen Sammelstellen.
    around: >-
      [Kaina-Lahe-Kassari](/lugar/kaina-lahe-kassari-maastikukaitseala/) liegt etwa dreiundzwanzig Kilometer
      entfernt, [Osmussaar](/lugar/osmussaare-maastikukaitseala/) etwa achtundzwanzig.
  it:
    intro: >-
      Nell'autunno del 1944 Vormsi rimase quasi deserta: gli svedesi costieri che avevano abitato l'isola dal
      XIII secolo se ne erano andati e il bestiame vagava senza padrone per i campi. La riserva paesaggistica
      di Vormsi custodisce ciò che rende unica questa isola baltica: un affioramento di calcare con coralli
      fossili, brughiere di ginepro, habitat alvar e prati costieri, e un cielo percorso da due importanti
      rotte migratorie.
    landscape: >-
      Vormsi, la quarta isola dell'Estonia, è nata da un'isola principale e da una trentina di isolotti, e
      circa 3 000 anni fa le sue parti più elevate cominciarono ad emergere dal mare. Man mano che il terreno
      si sollevava, le insenature marine divennero i laghi Prästvike, Diby e Kersleti. Sotto tutto c'è
      calcare, così caratteristico da dare il nome allo stadio Vormsi dell'Ordoviciano.


      È un'isola piatta: il punto più alto è la collina di Huitberg, a 13 metri sul mare. Le coste ovest e
      nord sono sassose; la sola spiaggia sabbiosa si trova a Rumpo. Il paesaggio alterna habitat alvar e
      brughiere di ginepro a ovest a terreni bassi e paludosi a est, con oltre la metà della superficie
      coperta da boschi. I prati costieri e i pascoli alberati sono frutto di un'agricoltura attiva e
      sopravvivono grazie a essa; ospitano piante e animali scomparsi o minacciati in Estonia e in Europa.


      Huitberg conserva un bioherm di calcare ordoviciano, e dove il muschio lascia la roccia allo scoperto si
      vedono coralli fossili. Nel bosco lungo il sentiero da Förby a Fällarna si trova la barriera corallina
      di Hoitberg, e a Hullo un grande masso erratico, il Parunikivi. La penisola di Rumpo ospita singolari
      comunità di licheni.
    wildlife: >-
      L'isola conta 211 specie di uccelli. Tra i nidificanti spiccano l'[aquila di
      mare](/especie/haliaeetus_albicilla/) e la [gru](/especie/grus_grus/); è presente anche il [gufo
      reale](/especie/bubo_bubo/), e il canto caratteristico del [re di quaglie](/especie/crex_crex/), raro
      nel resto d'Europa, si ode spesso. Due importanti rotte migratorie attraversano Vormsi: in primavera e
      autunno passano le oche facciabianca e altri anatidi, e in autunno le gru ricoprono i campi.


      Tra 25 specie di mammiferi, i [*Lynx lynx*](/especie/lynx_lynx/) sono diventati numerosi e i
      [cinghiali](/especie/sus_scrofa/) abbondano. Il pipistrello orecchione figura tra le specie protette.
      Tre rettili e tre anfibi completano il quadro; tra i più rari il [*Bufo
      calamita*](/especie/bufo_calamita/), che si riproduce in pozze costiere basse. La flora supera le 900
      specie di alberi, arbusti ed erbe, di cui 60 protette.
    visit: >-
      Si raggiunge l'isola in traghetto da Rohuküla, che accetta pedoni e veicoli. Un'indagine RMK ha rilevato
      che i visitatori in giornata trascorrevano in media 5,2 ore nella riserva.


      Il sentiero di Rumpo è la visita naturale: attraversa brughiera di ginepro, alvar e prato costiero,
      costeggia le comunità di licheni e apre viste sulla baia di Hullo e suoi isolotti. In un altro settore
      si trova Huitberg, l'affioramento calcareo con i coralli fossili.
    history: >-
      Dal XIII secolo al 1944 l'isola fu abitata principalmente da svedesi costieri. Nel 1938 la popolazione
      ammontava a circa 2 600 persone, la maggioranza di etnia svedese. Documenti del 1391 menzionano l'isola
      per la prima volta. La chiesa di Sant'Olaf a Hullo, eretta in legno nel XIII secolo, ricevette un coro
      in pietra nel XIV. I villaggi dell'ovest, con le case di armatori e marinai, erano considerati i più
      ricchi. I fari caratterizzano alcuni villaggi: quello di Saxby e il faro di Norrby, costruito nel 1935.
    before: >-
      Verifica gli accessi e le restrizioni della riserva prima di partire. Non portare cani sui sentieri con
      bestiame al pascolo e conferisci i rifiuti della visita nei punti di raccolta.
    around: >-
      [Kaina-Lahe-Kassari](/lugar/kaina-lahe-kassari-maastikukaitseala/) si trova a circa ventitré chilometri,
      [Osmussaar](/lugar/osmussaare-maastikukaitseala/) a circa ventotto.
  pt:
    intro: >-
      No outono de 1944, Vormsi ficou quase vazia: os suecos costeiros que habitavam a ilha desde o século
      XIII tinham partido e o gado vagava sem dono pelos campos. A Reserva Paisagística de Vormsi guarda o que
      torna única esta ilha do Báltico: um afloramento de calcário com corais fósseis, matagais de zimbro,
      habitats alvar e prados costeiros, e um céu atravessado por duas rotas migratórias importantes.
    landscape: >-
      Vormsi, a quarta ilha da Estónia, nasceu de uma ilha grande e umas trinta pequenas, e há cerca de 3 000
      anos as suas partes mais elevadas começaram a emergir. À medida que o terreno subia, enseadas marítimas
      tornaram-se os lagos Prästvike, Diby e Kersleti. Por baixo de tudo há calcário tão característico que dá
      nome ao Estágio Vormsi do Ordovícico.


      É uma ilha plana: o seu ponto mais alto é a colina de Huitberg, a 13 metros acima do mar. As costas
      oeste e norte são pedregosas e só há praia de areia em Rumpo. A paisagem alterna habitats alvar e
      matagais de zimbro a oeste com terrenos baixos e encharcados a leste, estando mais de metade da
      superfície coberta de floresta. Os prados costeiros e as pastagens arboladas resultam da agricultura
      ativa e só sobrevivem graças a ela; abrigam plantas e animais extintos ou ameaçados na Estónia e na
      Europa.


      Huitberg conserva um biohermo de calcário ordovícico, e onde o musgo deixa a rocha a descoberto veem-se
      corais fossilizados. Na floresta, ao longo do caminho de Förby para Fällarna, está o recife de coral de
      Hoitberg, e em Hullo um grande bloco errático, o Parunikivi. A península de Rumpo alberga comunidades de
      líquenes singulares.
    wildlife: >-
      A ilha tem 211 espécies de aves registadas. Entre os nidificantes destacam-se a
      [águia-rabalva](/especie/haliaeetus_albicilla/) e o [grou-comum](/especie/grus_grus/); está também
      presente o [bufo-real](/especie/bubo_bubo/), e o canto característico do
      [codornizão](/especie/crex_crex/) — raro no resto da Europa — ouve-se com frequência. Duas rotas
      migratórias importantes cruzam Vormsi: na primavera e no outono passam gansos-de-faces-brancas e outros
      anatídeos, e no outono os grous cobrem os campos.


      Entre 25 espécies de mamíferos, o [lince-euroasiático](/especie/lynx_lynx/) tornou-se numeroso e há
      muitos [javalis](/especie/sus_scrofa/). O morcego-oreludo figura entre as espécies protegidas. Três
      répteis e três anfíbios completam o quadro; um dos mais raros é o [*Bufo
      calamita*](/especie/bufo_calamita/), que se reproduz em charcos pouco fundos da costa. A flora
      ultrapassa as 900 espécies de árvores, arbustos e ervas, cerca de 60 das quais protegidas.
    visit: >-
      Chega-se de ferry a partir de Rohuküla, que aceita peões e veículos. Um inquérito da RMK revelou que os
      visitantes de um dia passavam em média 5,2 horas na reserva.


      O trilho de Rumpo é a visita natural: percorre matagais de zimbro, alvar e prado costeiro, passa junto
      às comunidades de líquenes e abre vistas sobre a baía de Hullo e os seus ilhéus. Noutro setor situa-se
      Huitberg, o afloramento calcário com os corais fósseis.
    history: >-
      Do século XIII a 1944, a ilha foi habitada principalmente por suecos costeiros. Em 1938 a população
      rondava os 2 600 habitantes, maioritariamente suecos. Documentos de 1391 mencionam a ilha pela primeira
      vez. A Igreja de São Olavo em Hullo, erguida em madeira no século XIII, recebeu uma nave de pedra no
      século XIV. As aldeias do oeste, com casas de armadores e marinheiros, eram consideradas as mais ricas.
      Faróis dão fama a algumas aldeias: o de Saxby e o de Norrby, construído em 1935.
    before: >-
      Verifica os acessos e restrições da reserva antes de partir. Não leves cães nos trilhos com gado e
      deposita os resíduos nos pontos de recolha indicados.
    around: >-
      [Kaina-Lahe-Kassari](/lugar/kaina-lahe-kassari-maastikukaitseala/) fica a uns vinte e três quilómetros,
      e [Osmussaar](/lugar/osmussaare-maastikukaitseala/), a uns vinte e oito.
