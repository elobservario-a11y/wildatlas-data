resumen:
  es: >-
    Espeleotemas de aragonito entre pizarras y arcillas, con visita guiada regulada y alternativa virtual en
    el centro de interpretación.
  en: >-
    Aragonite speleothems nestled among slates and clays, accessible via strictly regulated guided tours or
    virtual exhibits at the visitor centre.
  fr: >-
    Spéléothèmes d’aragonite nichés entre schistes et argiles, avec visite guidée hautement régulée et
    alternative virtuelle au centre d’interprétation.
  de: >-
    Aragonit-Speläotheme inmitten von Schiefern und Tonen, zugänglich über streng reglementierte Führungen
    oder virtuell im Infozentrum.
  it: >-
    Speleotemi di aragonite incastonati tra lavagne e argille, con visita guidata rigidamente contingentata e
    alternativa virtuale al centro visite.
  pt: >-
    Espeleotemas de aragonite entre xistos e argilas, com visitas guiadas estritamente reguladas e alternativa
    virtual no centro de interpretação.
unico:
  es: >-
    Aragonito claro, extremadamente fino y delicado, que contrasta con los tonos rojizos y oscuros de las
    pizarras y arcillas que lo rodean.
  en: >-
    Luminous, delicate needle aragonite contrasting dramatically with the dark, reddish slates and clays
    enclosing the subterranean chambers.
  fr: >-
    Une aragonite claire, d’une finesse extrême, tranchant avec les teintes sombres et rougeâtres des schistes
    et argiles encaissants.
  de: >-
    Heller, feinnadeliger Aragonit in faszinierendem Kontrast zu den dunklen, rötlichen Schiefern und
    Tonsteinen des Nebengesteins.
  it: >-
    Aragonite candida, straordinariamente sottile e delicata, che risalta a contrasto con i toni scuri e
    rossastri delle lavagne e argille circostanti.
  pt: >-
    Aragonite translúcida e de extrema delicadeza que contrasta vivamente com as tonalidades escuras e
    avermelhadas dos xistos e argilas circundantes.
observaciones:
  es: >-
    Para entrar en la visita guiada hay que inscribirse en la lista de visitas, mediante un correo
    electrónico. Las solicitudes deben hacerlas personas físicas, y cada persona puede hacer una sola
    solicitud al año, para un máximo de cinco personas. El acceso es muy estrecho y hay techos bajos: solo
    deberían entrar personas sanas y sin claustrofobia.
texto:
  es:
    intro: >-
      Bajo Castañar de Ibor hay una cueva que se visita en grupos de cinco personas como máximo más el guía,
      durante unos cincuenta minutos, y a la que se entra por una boca estrecha que baja unas escaleras de 9
      metros hasta la sala principal. No es un capricho: la de Castañar es un ambiente de extrema fragilidad y
      por eso solo puede visitarse bajo un estricto régimen de visitas.


      Fue descubierta en 1967, cerca del casco urbano de Castañar de Ibor, en Cáceres. Tras estudiarla, el
      Instituto Tecnológico Geominero de España la definió como una cavidad kárstica de gran valor científico,
      y en 1997 se declaró Monumento Natural para evitar un uso inadecuado de unos componentes muy frágiles.
    landscape: >-
      Esta cueva se abre en materiales precámbricos del Macizo Ibérico, de naturaleza pelítico-carbonatada. Es
      fruto de la karstificación de las dolomías del Grupo Ibor, formadas en el Ediacárico superior, que se
      alternan con pizarras y areniscas. La disolución de las rocas carbonatadas actuó junto con hundimientos
      de las areniscas y pizarras que había encima, y el resultado es una red de galerías con la misma
      orientación que la estructura geológica de la zona. Es una cueva de dimensiones reducidas, con 2135
      metros topografiados y salas y galerías de poca altura.


      Lo que la distingue está en las paredes. Las formas fibrosas, cristales de aragonito en forma de aguja,
      son los espeleotemas más característicos y abundantes. Las banderas o cortinas cuelgan de las paredes
      como velos y son esencialmente de calcita. Sobre otros espeleotemas se forma el moon-milk, un depósito
      globular de color blanco mate, y hay también minerales magnésicos como dolomita, magnesita,
      hidromagnesita y sepiolita. Aquí, además, el par aragonito y calcita fue el primer caso de polimorfismo
      mineral reconocido. Entre las salas, las más representativas son la roja, la del jardín y la blanca; en
      la Sala del Jardín se ven estalactitas, estalagmitas y columnas. El agua llega por infiltración de
      lluvia y forma pequeños lagos en las galerías.
    wildlife: >-
      La cueva no tiene especies ni estaciones que contar: su protagonista es la roca. Lo vivo que importa
      aquí es lo que no debe entrar. En agosto de 2008 un incidente en una visita turística aportó mucha
      materia orgánica a la cueva y desencadenó una colonización por hongos que se extendió por la zona
      visitada. Por eso esta cueva se cuida con tanto rigor y por eso las visitas son tan limitadas.
    visit: >-
      La visita empieza en el Centro de Interpretación de Castañar de Ibor, junto a la carretera EX-118 entre
      Guadalupe y Navalmoral de la Mata. El centro es accesible para autobuses y coches, tiene aparcamiento
      propio y sus salas de exposición son accesibles para personas con necesidades especiales. Desde allí
      sale un sendero hasta la entrada de la cueva. Dentro, el guía acompaña por el interior e interpreta los
      valores presentes en ella.


      Si no entras, el centro ofrece una alternativa virtual para conocer la cueva sin pisarla. El Geoparque
      Villuercas propone un turismo educativo y geológico entre sierras, valles, minas, cuevas, rutas y
      senderos.
    history: >-
      Tras el incidente de 2008 la cueva se cerró hasta controlar la dispersión de los hongos. Con los años,
      los estudios realizados con el CSIC mostraron que se podía abrir de nuevo, pero solo bajo un estricto
      régimen de visitas, y esa es la norma que sigue vigente.
    before: >-
      Para entrar en la visita guiada hay que inscribirse en la lista de visitas, mediante un correo
      electrónico. Las solicitudes deben hacerlas personas físicas, y cada persona puede hacer una sola
      solicitud al año, para un máximo de cinco personas. El acceso es muy estrecho y hay techos bajos: solo
      deberían entrar personas sanas y sin claustrofobia.
    around: A treinta kilómetros queda el [Parque Nacional de Monfragüe](/lugar/parque-nacional-de-monfrague/).
  en:
    intro: >-
      Beneath Castañar de Ibor lies a subterranean jewel visited in groups of at most five people plus a
      specialized guide, for roughly fifty minutes, accessed through a tight opening that descends 9 metres of
      stairs to the main chamber. This is no mere caprice: the subterranean climate of Castañar is
      extraordinarily fragile, which is why visits are permitted solely under a strict conservation protocol.


      Discovered in 1967 near the village of Castañar de Ibor in Cáceres, the cave was evaluated by the
      Spanish Geological and Mining Institute as a karst cavity of immense scientific value. In 1997 it was
      declared a Natural Monument to safeguard its exceptionally delicate crystal formations against improper
      exploitation.
    landscape: >-
      This cavity opens within Precambrian pelitic-carbonate strata of the Iberian Massif. It formed through
      the karstification of Upper Ediacaran dolomites of the Ibor Group, interbedded with slates and
      sandstones. Dissolution of carbonate bedrock coincided with gravity collapses of overlying sandstones
      and slates, generating a network of galleries aligned precisely with the regional geological strike. It
      is a compact cavity, featuring 2,135 surveyed metres with low-ceilinged chambers and passageways.


      Its distinction lies across its mineralised walls. Fibrous, needle-like aragonite crystals form its most
      iconic speleothems. Calcite draperies hang from walls like diaphanous veils. Across other formations
      forms moonmilk, a soft, matte-white globular deposit, alongside magnesium minerals such as dolomite,
      magnesite, hydromagnesite, and sepiolite. Significantly, the aragonite-calcite pairing here represents
      the first documented case of mineral polymorphism in history. Among the chambers, the most renowned are
      the Red Chamber, the White Chamber, and the Garden Chamber; the latter displays stalactites,
      stalagmites, and columns. Rain infiltration feeds small pristine subterranean pools.
    wildlife: >-
      The cave has no living wildlife or seasonal cycles to recount: its sole protagonist is the crystalline
      rock. The primary biological concern here is preventing contamination. In August 2008, a tourist visit
      inadvertently introduced high organic loads into the sealed cave atmosphere, triggering a catastrophic
      fungal bloom that swept across the tourist sector. That disaster prompted today’s stringent sanitary
      rules and tightly capped visiting quotas.
    visit: >-
      Visits convene at the Castañar de Ibor Interpretation Centre beside the EX-118 road between Guadalupe
      and Navalmoral de la Mata. The centre accommodates cars and buses, provides dedicated parking, and
      features fully accessible exhibition galleries for visitors with reduced mobility. A walking trail leads
      from the centre to the cave portal, where the official guide escorts visitors underground.


      For those who do not enter, the centre offers a high-resolution virtual tour to experience the interior
      without disturbing its climate. The surrounding Villuercas Geopark offers educational geo-tourism
      through mountain chains, valleys, historical mines, caves, and hiking trails.
    history: >-
      Following the 2008 biological contamination, the cave was sealed until fungal dispersal was eradicated.
      Long-term microclimatic research conducted alongside CSIC scientists demonstrated that visits could
      resume safely only under strict quota limits, a regulation that remains in force today.
    before: >-
      To join a guided underground tour you must register on the official waiting list via email. Applications
      must be submitted by private individuals, limited to one application per person per year for a maximum
      of five people. The entrance is tight with low ceilings: only physically fit visitors without
      claustrophobia should enter.
    around: Thirty kilometres away lies [Monfragüe National Park](/lugar/parque-nacional-de-monfrague/).
  fr:
    intro: >-
      Sous Castañar de Ibor se cache une cavité visitée par groupes de cinq personnes au maximum accompagnées
      d’un guide, pendant une cinquantaine de minutes, accessible par un goulet étroit descendant 9 mètres
      d’escaliers jusqu’à la salle principale. Ce n’est pas un caprice : la grotte de Castañar présente un
      équilibre d’une fragilité absolue, ce qui impose un protocole d’accès draconien.


      Découverte en 1967 près du bourg de Castañar de Ibor dans la province de Cáceres, elle a été qualifiée
      par l’Institut géologique et minier d’Espagne de cavité karstique d’intérêt scientifique majeur. En
      1997, elle a été classée Monument naturel afin de préserver ses délicates cristallisations de toute
      dégradation.
    landscape: >-
      Cette cavité s’ouvre au sein de formations précambriennes pélitiques et carbonatées du Massif ibérique.
      Elle résulte de la karstification des dolomies du groupe d’Ibor de l’Édiacarien supérieur, alternant
      avec schistes et grès. La dissolution des roches carbonatées s’est conjuguée à l’effondrement des bancs
      sus-jacents, créant un réseau calqué sur l’orientation tectonique locale. C’est une grotte aux
      dimensions modestes, comptant 2 135 mètres topographiés de galeries et de salles basses de plafond.


      Son trésor réside sur ses parois. Les aragonites aciculaires en touffes d’aiguilles forment les
      spéléothèmes les plus emblématiques. Des draperies de calcite pendent des voûtes tels des voiles
      translucides. Sur d’autres concrétions se dépose le moon-milk, un enduit globulaire blanc mat, aux côtés
      de minéraux magnésiens comme dolomite, magnésite, hydromagnésite et sépiolite. Fait historique : le
      couple calcite-aragonite y fut le premier cas reconnu de polymorphisme minéral. Parmi les salles
      figurent la Salle Rouge, la Salle Blanche et la Salle du Jardin, riche en stalactites, stalagmites et
      colonnes. L’eau d’infiltration forme de minuscules vasques limpides.
    wildlife: >-
      La cavité ne présente ni faune remarquable ni cycles saisonniers : l’unique vedette est la roche
      cristalline. L’enjeu biologique fondamental est d’en interdire l’accès aux polluants extérieurs. En août
      2008, une visite touristique a introduit des matières organiques qui ont provoqué une invasion fongique
      fulgurante dans le secteur visité. Depuis lors, la grotte est surveillée avec la plus grande rigueur et
      les entrées restent strictement contingentées.
    visit: >-
      La visite démarre au Centre d’interprétation de Castañar de Ibor, en bordure de la route EX-118 entre
      Guadalupe et Navalmoral de la Mata. Le centre est accessible aux voitures et autocars, dispose d’un
      parking et ses salles d’exposition sont aménagées pour les personnes à mobilité réduite. Un sentier
      relie le centre à l’entrée de la cavité, où le guide assure l’accompagnement sous terre.


      Pour les personnes ne descendant pas sous terre, le centre propose une visite virtuelle immersive. Le
      Géoparc Villuercas offre par ailleurs de superbes itinéraires de géotourisme entre crêtes de quartzites,
      vallées préservées, mines historiques et sentiers.
    history: >-
      Après la contamination de 2008, la cavité est restée fermée jusqu’à l’éradication complète des
      moisissures. Les recherches menées avec le CSIC ont démontré que les visites pouvaient reprendre
      uniquement sous un régime très strict, règle qui régit toujours l’accès aujourd’hui.
    before: >-
      Pour participer à la visite guidée, il faut obligatoirement s’inscrire sur liste d’attente par courriel.
      Les demandes sont strictement nominatives et limitées à une seule par personne et par an, pour un groupe
      maximal de cinq personnes. Les passages sont très étroits avec des plafonds bas : la visite est réservée
      à des personnes en bonne forme physique ne souffrant pas de claustrophobie.
    around: À trente kilomètres s’étend le [Parc national de Monfragüe](/lugar/parque-nacional-de-monfrague/).
  de:
    intro: >-
      Unter Castañar de Ibor liegt eine Höhlenwelt, die in Gruppen von maximal fünf Personen plus Höhlenführer
      für rund fünfzig Minuten betreten werden darf. Der Zugang erfolgt durch ein enges Einstiegsloch über
      eine 9 Meter lange Treppe in die Haupthalle. Das ist keine Willkür: Die Höhle von Castañar birgt ein
      Mikroklima von extremer Anfälligkeit und darf daher nur unter strengsten Auflagen besucht werden.


      Die 1967 nahe Castañar de Ibor in der Provinz Cáceres entdeckte Höhle wurde vom spanischen Geologischen
      Institut als Karsthöhle von herausragendem wissenschaftlichem Rang eingestuft. Um die hochgradig
      empfindlichen Kristallgebilde vor Zerstörung zu bewahren, wurde sie 1997 zum Naturdenkmal erklärt.
    landscape: >-
      Die Höhle öffnet sich in präkambrischen pelitisch-karbonatischen Schichten des Iberischen Massivs. Sie
      entstand durch Verkarstung ediacarischer Dolomite der Ibor-Gruppe im Wechsel mit Schiefern und
      Sandsteinen. Die Lösung von Karbonaten löste Nachbrüche der Hangendschichten aus, wodurch ein Kluftnetz
      parallel zum tektonischen Streichen entstand. Mit 2.135 vermessenen Metern und niedrigen Deckenhöhen ist
      die Höhle von kompakter Dimension.


      Ihre Einzigartigkeit offenbart sich an den Wänden. Büschelige, nadelförmige Aragonitkristalle bilden die
      typischsten Speläotheme. Calcitfahnen hängen wie zarte Schleier von den Decken. Auf anderen Sinterformen
      lagert Bergmilch (Moonmilk) als mattweiße Masse, begleitet von Magnesiummineralen wie Dolomit, Magnesit,
      Hydromagnesit und Sepiolith. Das Mineralpaar Aragonit-Calcit stellte hier historisch den ersten
      erkannten Fall von Mineralpolymorphie dar. Zu den Haupträumen zählen der Rote Saal, der Weiße Saal und
      der Gartensaal mit Stalaktiten, Stalagmiten und Sintersäulen. Sickerwasser speist winzige Höhlenseen.
    wildlife: >-
      In dieser Höhle gibt es weder Tierwelt noch Jahreszeiten zu beschreiben: Ihr einziger Protagonist ist
      das Kristallgestein. Biologisch zählt allein das, was draußen bleiben muss. Im August 2008 schleppten
      Besucher bei einer Führung organische Partikel ein, was eine Pilzverbreitung im Besuchsbereich auslöste.
      Aus diesem Grund wird die Höhle seither extrem penibel überwacht und der Zutritt rigoros beschränkt.
    visit: >-
      Ausgangspunkt ist das Besucherzentrum Castañar de Ibor an der Landstraße EX-118 zwischen Guadalupe und
      Navalmoral de la Mata. Es ist für Busse und Pkw erreichbar, bietet Parkplätze und barrierefreie
      Ausstellungsräume. Ein Fußweg führt zum Höhleneingang, wo der Höhlenführer die Gruppe übernimmt.


      Wer nicht einfahren kann, findet im Zentrum eine virtuelle Präsentation zur Erkundung ohne Störung des
      Höhlenklimas. Der umgebende Geopark Villuercas lädt zu Bildungs- und Geotourismus zwischen Bergzügen,
      Tälern, Bergwerken und Pfaden ein.
    history: >-
      Nach dem Pilzbefall von 2008 blieb die Höhle jahrelang geschlossen. Langzeitstudien mit dem
      Forschungsrat CSIC zeigten, dass eine Wiedereröffnung nur unter extrem restriktiven Besucherzahlen
      mikroklimatisch vertretbar ist – diese Regelung gilt bis heute unverändert.
    before: >-
      Für Führungen ist eine Voranmeldung per E-Mail auf der offiziellen Warteliste vorgeschrieben. Anträge
      dürfen nur von Privatpersonen gestellt werden, limitiert auf eine Anfrage pro Person und Jahr für
      maximal fünf Teilnehmer. Der Einstieg ist sehr eng mit niedrigen Decken: nur für sportliche Personen
      ohne Klaustrophobie geeignet.
    around: >-
      In dreißig Kilometern Entfernung liegt der [Nationalpark
      Monfragüe](/lugar/parque-nacional-de-monfrague/).
  it:
    intro: >-
      Sotto l’abitato di Castañar de Ibor si cela una grotta visitabile in gruppi di al massimo cinque persone
      più la guida per una durata di circa cinquanta minuti, a cui si accede tramite uno stretto pozzo
      d’ingresso scendendo 9 metri di scale fino alla sala principale. Non si tratta di un capriccio:
      l’ambiente sotterraneo di Castañar è di una fragilità estrema e può essere ammirato unicamente sotto un
      rigidissimo protocollo di tutela.


      Scoperta nel 1967 presso Castañar de Ibor, in provincia di Cáceres, venne definita dall’Istituto
      Geologico e Minerario di Spagna come cavità carsica di altissimo pregio scientifico. Nel 1997 fu
      dichiarata Monumento Naturale per proteggere le sue fragili formazioni da un turismo incontrollato.
    landscape: >-
      La cavità si sviluppa entro sedimenti pelitico-carbonatici precambriani del Massiccio Iberico. Trae
      origine dalla carsificazione delle dolomie del Gruppo Ibor dell’Ediacarano superiore, alternate a
      filladi e arenarie. La dissoluzione dei carbonati ha agito insieme a crolli gravitativi dei banchi
      superiori, originando un reticolo di gallerie impostato sulle linee tettoniche regionali. È una cavità
      raccolta, con 2.135 metri topografati e sale dalle volte basse.


      Il suo vanto risiede nelle concrezioni parietali. I cristalli aghiformi di aragonite costituiscono gli
      speleotemi più tipici e spettacolari. Cortine e vele di calcite scendono dalle pareti come veli
      traslucidi. Su altre forme si deposita il moonmilk, una pasta globulare bianco opaca, affiancata da
      minerali magnesiaci quali dolomite, magnesite, idromagnesite e sepiolite. Qui la coppia
      aragonite-calcite costituì il primo caso accertato di polimorfismo minerale. Tra i vani spiccano la Sala
      Rossa, la Sala Bianca e la Sala del Giardino, impreziosita da stalattiti, stalagmiti e colonne. L’acqua
      di stillicidio crea piccoli specchi limpidi.
    wildlife: >-
      La cavità non ospita fauna né ritmi stagionali: la sua protagonista assoluta è la roccia cristallina. La
      vita qui rappresenta una minaccia da scongiurare. Nell’agosto 2008 un incidente durante una visita
      turistica introdusse carica organica scatenando una proliferazione di funghi che intaccò il settore
      turistico. Da allora l’accesso è contingentato con meticolosa severità.
    visit: >-
      Il punto di ritrovo è il Centro d’Interpretazione di Castañar de Ibor, lungo la strada EX-118 tra
      Guadalupe e Navalmoral de la Mata. La struttura accoglie auto e pullman, dispone di parcheggio ed è
      accessibile a persone con ridotta mobilità. Un sentiero pedonale conduce all’imbocco della grotta dove
      la guida accompagna i visitatori.


      Per chi non può scendere in grotta, il centro offre un tour virtuale ad altissima definizione. Il
      Geoparco di Villuercas propone inoltre itinerari geologici ed educativi tra crinali di quarzite, miniere
      storiche e sentieri escursionistici.
    history: >-
      Dopo la contaminazione biologica del 2008 la grotta rimase chiusa fino al risanamento dei complessi
      sotterranei. Le ricerche coordinate con il CSIC hanno dimostrato che le visite potevano riprendere solo
      con rigidi tetti di presenze, parametro tuttora in vigore.
    before: >-
      Per partecipare alla visita guidata è obbligatorio iscriversi alla lista d’attesa tramite posta
      elettronica. Le richieste devono essere presentate da persone fisiche, nel limite di una sola richiesta
      all’anno per un massimo di cinque persone. I passaggi sono angusti e i soffitti bassi: visita adatta a
      persone agili e prive di claustrofobia.
    around: A trenta chilometri si trova il [Parco Nazionale di Monfragüe](/lugar/parque-nacional-de-monfrague/).
  pt:
    intro: >-
      Sob Castañar de Ibor esconde-se uma cavidade visitada em grupos de no máximo cinco pessoas acompanhadas
      por um guia, durante cerca de cinquenta minutos, acedida através de um estreito alçapão que desce 9
      metros de escadas até à sala principal. Não é um capricho: o ecossistema subterrâneo de Castañar
      apresenta uma fragilidade extrema, razão pela qual a entrada obedece a um regime de preservação
      rigorosíssimo.


      Descoberta em 1967 junto ao casco urbano de Castañar de Ibor, em Cáceres, foi classificada pelo
      Instituto Geológico e Mineiro de Espanha como uma cavidade cársica de supremo valor científico. Em 1997
      foi declarada Monumento Natural para evitar a degradação de cristais de irrepetível delicadeza.
    landscape: >-
      Esta gruta desenvolve-se em estratos precâmbricos pelítico-carbonatados do Maciço Ibérico. Resulta da
      carsificação de dolomitos do Grupo Ibor do Ediacariano superior, intercalados com xistos e arenitos. A
      dissolução das rochas carbonatadas conjugou-se com abatimentos dos estratos sobrejacentes, moldando uma
      rede de galerias orientada segundo a estrutura geológica regional. Apresenta dimensões modestas, com
      2.135 metros topografados e salas de teto rebaixado.


      A sua singularidade reluz nas paredes. Cristais aciculares de aragonite formam os espeleotemas mais
      emblemáticos. Varas e cortinas de calcite pendem das abóbadas como véus diáfanos. Noutros pontos
      acumula-se o moonmilk, um depósito globular branco mate, a par de minerais magnesianos como dolomite,
      magnesite, hidromagnesite e sepiolite. Historicamente, o par aragonite-calcite constituiu o primeiro
      caso documentado de polimorfismo mineral. Entre os recintos destacam-se a Sala Vermelha, a Sala Branca e
      a Sala do Jardim, ornamentada com estalagmites, estalactites e colunas. A água de infiltração alimenta
      pequenos lagos límpidos.
    wildlife: >-
      A cavidade não abriga fauna nem dinâmicas sazonais: a sua riqueza reside na mineralogia. A preocupação
      biológica centra-se em evitar a contaminação externa. Em agosto de 2008 uma visita turística introduziu
      matéria orgânica que despoletou um surto de fungos pelo setor visitado. Desde então o acesso é
      controlado com a máxima prudência.
    visit: >-
      O ponto de acolhimento situa-se no Centro de Interpretação de Castañar de Ibor, junto à estrada EX-118
      entre Guadalupe e Navalmoral de la Mata. O centro dispõe de estacionamento e acessibilidade para pessoas
      com mobilidade reduzida. Um trilho pedestre faz a ligação até ao portal da gruta, onde o guia
      especializado conduz o grupo ao interior.


      Quem não desce à gruta dispõe no centro de uma visita virtual imersiva. O Geoparque Villuercas
      proporciona turismo geológico entre cristas de quartzito, vales intocados, antigas minas e percursos
      pedestres.
    history: >-
      Após a contaminação fúngica de 2008 a gruta permaneceu encerrada até à total erradicação do surto.
      Estudos científicos com o CSIC determinaram que as visitas só poderiam ser retomadas sob
      contingenciamento estrito de visitantes, regra que vigora rigorosamente.
    before: >-
      Para participar na visita guiada é obrigatório o registo na lista de espera através de correio
      eletrónico. As inscrições devem ser efetuadas por pessoas singulares, com o limite de um pedido anual
      por pessoa para um máximo de cinco participantes. O acesso é estreito com tetos baixos: percurso
      reservado a pessoas ágeis e sem claustrofobia.
    around: A trinta quilómetros fica o [Parque Nacional de Monfragüe](/lugar/parque-nacional-de-monfrague/).
