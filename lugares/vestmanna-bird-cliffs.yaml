resumen:
  es: >-
    Paredes de basalto de 500 m cortadas a pique sobre el mar donde penetran barcos turísticos por estrechos
    gargantas y grutas marinas infestadas de miles de aves de acantilado.
  en: >-
    Sheer 500 m basalt walls dropping directly into the sea, where tour boats enter narrow gorges and sea
    grottos teeming with thousands of seabirds.
  fr: >-
    Parois de basalte de 500 m tombant à pic dans la mer où les bateaux touristiques pénètrent dans d’étroits
    goulets et des grottes marines peuplés de milliers d’oiseaux de falaise.
  de: >-
    Senkrecht ins Meer abfallende 500 m hohe Basaltwände, in deren enge Schluchten und Brandungshöhlen
    Ausflugsboote zu Tausenden Meeresvögeln vordringen.
  it: >-
    Pareti basaltiche di 500 m a picco sul mare dove le imbarcazioni turistiche penetrano in gole strette e
    grotte marine popolate da migliaia di uccelli marini.
  pt: >-
    Paredões basálticos de 500 m cortados a pique sobre o mar, onde embarcações turísticas entram em
    desfiladeiros estreitos e grutas marinhas repletas de milhares de aves marinhas.
unico:
  es: >-
    Acantilados y grutas donde, cada verano, anidan miles de aves marinas a las que el barco se acerca lo
    bastante para verlas.
  en: >-
    Towering cliffs and sea grottos where thousands of seabirds nest every summer, approachable close-up by
    boat.
  fr: >-
    Des falaises et grottes marines où nichent chaque été des milliers d’oiseaux marins que les bateaux
    approchent de très près.
  de: >-
    Steile Klippen und Meeresgrotten, an denen jeden Sommer Tausende Seevögel nisten, die man vom Boot aus
    nächster Nähe beobachten kann.
  it: >-
    Scogliere e grotte marine dove ogni estate nidificano migliaia di uccelli marini che le barche avvicinano
    a distanza ravvicinata.
  pt: >-
    Arribas e grutas marinhas onde nidificam todos os verões milhares de aves marinhas, observadas de muito
    perto a partir do barco.
observaciones:
  es: >-
    Las islas son ventosas, nubladas y frescas todo el año, con una media de doscientos diez días de lluvia o
    nieve, y las borrascas pueden traer viento fuerte y lluvia intensa en cualquier época. Lleva abrigo.


    Las excursiones solo salen entre mayo y septiembre, que es también la temporada de las aves en los
    acantilados.
texto:
  es:
    intro: >-
      Ponte en la proa de un barco pequeño, justo cuando entra en un estrecho: a un lado, la pared de roca; al
      otro, una grieta oscura por la que el agua se mete bajo el acantilado. Eso es Vestmannabjørgini, los
      «acantilados de Vestmanna», justo al norte del pueblo, en la costa oeste de Streymoy. Sus paredes
      superan los quinientos metros y la oficina de turismo feroesa las sitúa en setecientos. Se recorren en
      barco, entre grutas y estrechos, junto a las colonias de aves.
    landscape: >-
      Piensa en una escalera gigante. Las Feroe nacieron de una intensa actividad volcánica hace entre
      cincuenta y sesenta millones de años, y están hechas de capas de lava basáltica con finas capas de
      ceniza entre ellas. La ceniza, blanda, se erosiona deprisa; el basalto duro que queda encima se
      desprende, y de ahí salen las terrazas escalonadas. Después pasaron los glaciares y rebajaron las
      mesetas, sobre todo en las islas del norte.


      En Vestmanna el resultado es un paisaje de roca con acantilados escarpados donde anidan las aves, grutas
      profundas y peñascos exentos algo al norte del pueblo. Desde el barco pasas por estrechos y por cuevas
      hondas. Tierra adentro, el pueblo queda rodeado de montañas: Hægstafjall, Økslin, Loysingafjall y
      Moskurfjall. Toda Streymoy es montañosa, sobre todo en el noroeste, donde está su cumbre más alta,
      Kopsenni.
    wildlife: >-
      Las paredes y las cuevas son un lugar seguro de nidificación en los meses de verano para miles de aves
      marinas: [frailecillos](/especie/fratercula_arctica/), [alcas](/especie/alca_torda/),
      [araos](/especie/uria_aalge/) y [fulmares](/especie/fulmarus_glacialis/). Desde el barco se las ve en su
      hábitat natural, posadas en los acantilados, y por eso las excursiones se hacen en verano.


      Lo que se sabe del conjunto del archipiélago encaja con lo que ves: la avifauna está dominada por aves
      marinas y de terreno abierto, y los frailecillos son muy comunes. Algunas especies han desarrollado
      subespecies propias, como el eider común y el arao aliblanco.


      La gente de aquí no solo miraba las aves. Antes, y en parte todavía hoy, los vecinos bajaban por los
      acantilados a recoger huevos.
    visit: >-
      La visita es en barco. Salen varias excursiones al día entre mayo y septiembre, y duran aproximadamente
      dos horas. Vestmanna es un puerto activo, conocido por su fácil acceso a estos acantilados y grutas, y
      se la llama a menudo el pueblo turístico de las Feroe.


      Si te sobra tiempo en tierra, el pueblo tiene un centro turístico con un museo histórico que cuenta, con
      diecisiete figuras de cera, la historia de las Feroe desde los primeros pobladores. Desde Vestmanna se
      llega a Saksun, con casas de tejado de turba a lo largo del río Dalá y una laguna de marea, Pollurin,
      casi cerrada por acantilados. Un camino viejo une Saksun con Tjørnuvík, un pueblo a los pies de un valle
      glaciar circular, y antes de llegar se pasa por Fossá, la mayor cascada de las Feroe. En Kvívík, uno de
      los asentamientos más antiguos del archipiélago, se ven las ruinas de una casa vikinga y un establo,
      descubiertas en 1942.
    history: >-
      En diciembre de 1759, durante la guerra de los Siete Años, la escuadra de François Thurot se refugió del
      temporal en Vestmanna. La primera línea telefónica de las Feroe se tendió entre Tórshavn y Vestmanna. Y
      hasta que se inauguró el túnel submarino de Vágar, en diciembre de 2002, un transbordador unía el pueblo
      con Oyragjógv, en Vágar.
    before: >-
      Las islas son ventosas, nubladas y frescas todo el año, con una media de doscientos diez días de lluvia
      o nieve, y las borrascas pueden traer viento fuerte y lluvia intensa en cualquier época. Lleva abrigo.


      Las excursiones solo salen entre mayo y septiembre, que es también la temporada de las aves en los
      acantilados.
    around: >-
      El vecino más cercano del atlas es [Slættaratindur](/lugar/slaettaratindur/), a unos seis kilómetros;
      [Mykines](/lugar/mykines/) queda a unos diecisiete y [Kalsoy](/lugar/kalsoy/) a unos veintiuno. Lejos de
      aquí, comparten costa, arao común, alca y frailecillo la [Reserva Natural de las
      Sept-Îles](/lugar/reserve-naturelle-des-sept-iles/), [Fair Isle](/lugar/fair-isle/) y
      [Hornstrandir](/lugar/hornstrandir/); [Marwick Head](/lugar/marwick-head/) comparte el arao y la alca.
  en:
    intro: >-
      Stand in the bow of a small boat as it slips into a narrow channel: on one side rises a vertical basalt
      wall; on the other, a shadowed fissure where ocean swells surge into submerged sea caves. This is
      Vestmannabjørgini, the Vestmanna bird cliffs, situated immediately north of the settlement along
      Streymoy’s western coast. Its rock faces exceed five hundred metres, with local tourism offices
      measuring their crests at seven hundred. They are explored exclusively by sea, navigating sea stacks and
      caves right beneath active seabird colonies.
    landscape: >-
      Picture a monumental staircase. The Faroe Islands were born of volcanic eruptions between fifty and
      sixty million years ago, composed of thick flood basalt flows interleaved with fragile layers of
      volcanic ash. The soft ash erodes rapidly; unsupported basalt shelves collapse into the Atlantic,
      creating tiered landscape terraces. Later Pleistocene ice sheets planed down the high plateaus,
      particularly across the northern isles.


      At Vestmanna, this process created sheer sea bluffs, grottos, and isolated freestanding sea stacks just
      north of the village harbour. From the boat, you thread through narrow passages and deep fissures.
      Inland, the town is enclosed by an amphitheatre of fells: Hægstafjall, Økslin, Loysingafjall, and
      Moskurfjall. All of Streymoy is mountainous, culminating to the north-west in its highest summit,
      Kopsenni.
    wildlife: >-
      These towering cliffs and sea chasms provide a safe summer breeding citadel for thousands of pelagic
      seabirds: [Atlantic puffins](/especie/fratercula_arctica/), [razorbills](/especie/alca_torda/), [common
      murres](/especie/uria_aalge/), and [northern fulmars](/especie/fulmarus_glacialis/). From the boat deck,
      visitors observe them in their element, crowded onto narrow nesting ledges—which is why excursions
      operate in summer.


      The archipelago’s avifauna is dominated by open-country and pelagic species, with Atlantic puffins being
      particularly numerous. Certain island populations have evolved distinct subspecies, notably the common
      eider and black guillemot.


      Historically, islanders did not merely watch seabirds. For centuries, and continuing in part today,
      daring local fowlers abseiled down these cliffs on ropes to harvest seabird eggs.
    visit: >-
      The classic excursion is by passenger boat. Multiple departures operate daily between May and September,
      taking approximately two hours. Vestmanna is a bustling fishing port celebrated as the primary maritime
      gateway to these cliffs, widely hailed as the tourism capital of the Faroe Islands.


      If you have spare time ashore, the harbour visitor centre features a heritage museum illustrating
      Faroese history from Viking settlement through seventeen wax figures. From Vestmanna, a scenic road
      leads to Saksun, famous for turf-roofed stone crofts along the Dalá river and the tidal lagoon of
      Pollurin. An ancient walking track links Saksun to Tjørnuvík across a circular glacial cirque, passing
      Fossá, the highest waterfall in the Faroes. In nearby Kvívík, among the oldest settlements on the
      islands, lie the excavated stone foundations of a Viking longhouse and byre discovered in 1942.
    history: >-
      In December 1759, during the Seven Years’ War, a French naval squadron under Commodore François Thurot
      took refuge from fierce Atlantic gales in Vestmanna fjord. The archipelago’s first telegraph and
      telephone line was strung between Tórshavn and Vestmanna. Until the subsea Vágar tunnel opened in
      December 2002, a regular car ferry linked the harbour to Oyragjógv on Vágar.
    before: >-
      The Faroes are windy, overcast, and cool year-round, averaging two hundred and ten days of rain or snow,
      with maritime depressions bringing gales and driving rain across any season. Dress in warm, waterproof
      layers.


      Boat excursions operate only from May through September, coinciding with the seabird breeding season on
      the cliffs.
    around: >-
      The closest atlas neighbour is [Slættaratindur](/lugar/slaettaratindur/), roughly six kilometres away;
      [Mykines](/lugar/mykines/) lies some seventeen kilometres distant and [Kalsoy](/lugar/kalsoy/) about
      twenty-one kilometres. Farther across the North Atlantic, other maritime outposts share murres,
      razorbills, and puffins: the [Sept-Îles Nature Reserve](/lugar/reserve-naturelle-des-sept-iles/), [Fair
      Isle](/lugar/fair-isle/), and [Hornstrandir](/lugar/hornstrandir/); [Marwick Head](/lugar/marwick-head/)
      shares guillemots and razorbills.
  fr:
    intro: >-
      Installez-vous à la proue d’un bateau au moment où il s’engage dans un défilé rocheux : d’un côté, la
      falaise à pic ; de l’autre, une faille sombre où l’océan s’engouffre sous la montagne. C’est
      Vestmannabjørgini, les falaises d’oiseaux de Vestmanna, au nord du village sur la côte ouest de
      Streymoy. Leurs murailles dépassent cinq cents mètres de haut et l’office du tourisme les estime à sept
      cents. On les découvre en bateau, entre arches marines et grottes, au pied des colonies aviaires.
    landscape: >-
      Imaginez un escalier gigantesque. Les Féroé sont nées d’une intense activité volcanique il y a cinquante
      à soixante millions d’années, empilant des coulées de basalte entrecoupées de fins lits de cendres. La
      cendre meuble s’érode rapidement, provoquant l’effondrement du basalte supérieur en terrasses étagées.
      Les glaciers quaternaires ont ensuite raboté les reliefs, surtout dans les îles septentrionales.


      À Vestmanna, le résultat est un paysage côtier de falaises vertigineuses où nichent les oiseaux, de
      grottes profondes et de pitons rocheux isolés au nord du port. En bateau, vous franchissez des passes
      étroites et pénétrez sous des voûtes marines. Vers l’intérieur, le village est cerné de montagnes :
      Hægstafjall, Økslin, Loysingafjall et Moskurfjall. Toute l’île de Streymoy est escarpée, dominée au
      nord-ouest par son point culminant, le Kopsenni.
    wildlife: >-
      Ces parois et grottes marines offrent un havre de nidification estival à des milliers d’oiseaux marins :
      [macareux moines](/especie/fratercula_arctica/), [petits pingouins](/especie/alca_torda/), [guillemots
      de Troïl](/especie/uria_aalge/) et [fulmars boréaux](/especie/fulmarus_glacialis/). Depuis le pont du
      bateau, on les observe dans leur biotope, juchés sur les corniches rocheuses, d’où l’intérêt des visites
      estivales.


      L’avifaune de l’archipel est dominée par les espèces pélagiques et les landes ouvertes ; les macareux
      sont abondants. Certaines espèces ont évolué en sous-espèces insulaires distinctes, comme l’eider à
      duvet et le guillemot à miroir.


      La population locale n’était pas simple spectatrice : autrefois, et encore parfois aujourd’hui, les
      habitants descendaient en rappel le long des parois pour récolter les œufs.
    visit: >-
      La visite s’effectue en bateau. Plusieurs départs quotidiens ont lieu entre mai et septembre, pour une
      durée d’environ deux heures. Vestmanna est un port de pêche actif, réputé pour son accès commode à ces
      falaises et grottes marines, souvent qualifié de capitale touristique des Féroé.


      Si vous disposez de temps à terre, le village possède un musée historique retraçant les origines
      féringiennes à travers dix-sept statues de cire. Depuis Vestmanna, une route pittoresque conduit à
      Saksun, célèbre pour ses toits de tourbe le long de la rivière Dalá et sa lagune de marée de Pollurin.
      Un sentier pédestre relie Saksun à Tjørnuvík au fond d’un cirque glaciaire, en passant devant Fossá, la
      plus haute cascade des Féroé. À Kvívík subsistent les fondations d’une ferme et d’une étable vikings
      découvertes en 1942.
    history: >-
      En décembre 1759, pendant la guerre de Sept Ans, l’escadre française du corsaire François Thurot trouva
      refuge contre la tempête à Vestmanna. La première ligne téléphonique féringienne fut établie entre
      Tórshavn et Vestmanna. Jusqu’à l’inauguration du tunnel sous-marin de Vágar en décembre 2002, un ferry
      reliait le port à Oyragjógv sur l’île de Vágar.
    before: >-
      Le climat des Féroé est venteux, brumeux et frais, totalisant deux cent dix jours de pluie ou de neige
      par an ; des dépressions océaniques peuvent survenir en toute saison. Prévoyez des vêtements chauds et
      imperméables.


      Les sorties en mer ont lieu uniquement de mai à septembre, période qui correspond à la présence des
      colonies d’oiseaux nicheurs sur les parois.
    around: >-
      Le site le plus proche de l’atlas est [Slættaratindur](/lugar/slaettaratindur/), à environ six
      kilomètres ; [Mykines](/lugar/mykines/) se trouve à dix-sept kilomètres et [Kalsoy](/lugar/kalsoy/) à
      vingt et un kilomètres. Ailleurs, d’autres falaises septentrionales partagent guillemots, pingouins et
      macareux : la [réserve naturelle des Sept-Îles](/lugar/reserve-naturelle-des-sept-iles/), [Fair
      Isle](/lugar/fair-isle/) et [Hornstrandir](/lugar/hornstrandir/) ; [Marwick Head](/lugar/marwick-head/)
      accueille guillemots et petits pingouins.
  de:
    intro: >-
      Stell dir vor, du stehst am Bug eines kleinen Boots bei der Einfahrt in eine Meerenge: Auf der einen
      Seite ragt die nackte Basaltwand empor, auf der anderen gähnt eine dunkle Spalte, in die die Brandung
      drängt. Das sind die Vestmannabjørgini, die Vogelfelsen von Vestmanna nördlich der Ortschaft an der
      Westküste von Streymoy. Ihre Wände ragen über fünfhundert Meter hoch auf, die färöische Tourismusbehörde
      misst sie mit siebenhundert Metern. Man erkundet sie vom Boot aus zwischen Grotten und Felsentoren
      direkt bei den Vogelkolonien.
    landscape: >-
      Denke an eine gigantische Treppe. Die Färöer entstanden vor fünfzig bis sechzig Millionen Jahren durch
      Vulkanismus, aufgebaut aus Basaltschichten mit zwischengelagerten Aschenbändern. Die weiche Asche
      verwittert rasch, die überhängenden Basaltdecken brechen ab und hinterlassen abgestufte Felsterrassen.
      Spätere eiszeitliche Gletscher schliffen die Hochebenen ab, vor allem auf den Nordinseln.


      In Vestmanna schuf dies eine wilde Felsküste mit Klippen, Brandungshöhlen und freistehenden
      Brandungspfeilern nördlich des Orts. Mit dem Boot fährst du durch Meerengen und tiefe Grotten.
      Landeinwärts rahmen Berge den Ort ein: Hægstafjall, Økslin, Loysingafjall und Moskurfjall. Ganz Streymoy
      ist gebirgig, gekrönt im Nordwesten vom Kopsenni, dem höchsten Gipfel der Insel.
    wildlife: >-
      Die Klippen und Grotten bilden im Sommer eine geschützte Brutburg für Tausende Meeresvögel:
      [Papageitaucher](/especie/fratercula_arctica/), [Tordalken](/especie/alca_torda/),
      [Trottellummen](/especie/uria_aalge/) und [Eissturmvögel](/especie/fulmarus_glacialis/). Vom Boot aus
      siehst du sie in ihrem natürlichen Lebensraum auf den Felssimsen, weshalb Bootstouren im Sommer
      stattfinden.


      Die Vogelwelt der Färöer wird von Hochsee- und Tundrenarten geprägt; Papageitaucher sind allgegenwärtig.
      Manche Arten bildeten eigene Unterarten heraus, etwa Eiderente und Gryllteiste.


      Die Einheimischen beobachteten die Vögel früher nicht nur: Seit Jahrhunderten seilten sich Vogelfänger
      an den Klippen ab, um Eier für den Wintervorrat zu sammeln.
    visit: >-
      Die Besichtigung erfolgt per Ausflugsboot. Zwischen Mai und September starten täglich mehrere Fahrten,
      die etwa zwei Stunden dauern. Vestmanna ist ein geschäftiger Fischerhafen und bekanntester Ausgangspunkt
      zu diesen Klippen, oft als Tourismuszentrum der Färöer bezeichnet.


      Bleibt Zeit an Land, zeigt das Besucherzentrum ein kulturhistorisches Museum, das die Inselgeschichte
      anhand von siebzehn Wachsfiguren veranschaulicht. Von Vestmanna aus erreichst du Saksun mit seinen
      grassodenbedeckten Höfen am Fluss Dalá und der Gezeitenlagune Pollurin. Ein historischer Pfad verbindet
      Saksun über ein Trogtal mit Tjørnuvík, vorbei am Fossá, dem höchsten Wasserfall der Färöer. In Kvívík
      sind Ruinen eines Wikingergehöfts zu sehen, die 1942 freigelegt wurden.
    history: >-
      Im Dezember 1759, während des Siebenjährigen Krieges, suchte das französische Geschwader unter François
      Thurot in Vestmanna Schutz vor schweren Atlantstürmen. Die erste Telefonleitung der Färöer verband
      Tórshavn mit Vestmanna. Bis zur Eröffnung des Unterwassertunnels nach Vágar im Dezember 2002 verkehrte
      eine Autofähre nach Oyragjógv.
    before: >-
      Die Färöer sind ganzjährig windig, neblig und kühl mit durchschnittlich zweihundertzehn
      Niederschlagstagen; Stürme können jederzeit auftreten. Nimm warme, wetterfeste Kleidung mit.


      Bootsfahrten finden nur von Mai bis September statt, abgestimmt auf die Brutzeit der Seevögel an den
      Felswänden.
    around: >-
      Der nächste Nachbar im Atlas ist der [Slættaratindur](/lugar/slaettaratindur/) in rund sechs Kilometern
      Entfernung; [Mykines](/lugar/mykines/) liegt siebzehn und [Kalsoy](/lugar/kalsoy/) einundzwanzig
      Kilometer entfernt. Weitere Seevogelkolonien mit Lummen, Alken und Papageitauchern sind das
      [Naturreservat Sept-Îles](/lugar/reserve-naturelle-des-sept-iles/), [Fair Isle](/lugar/fair-isle/) und
      [Hornstrandir](/lugar/hornstrandir/); [Marwick Head](/lugar/marwick-head/) teilt Trottellummen und
      Tordalken.
  it:
    intro: >-
      Mettiti a prua di una piccola barca proprio mentre imbocca uno stretto passaggio: da un lato la parete a
      picco, dall’altro un anfratto buio in cui la risacca si infila sotto la scogliera. Questo è
      Vestmannabjørgini, le scogliere di Vestmanna, situate a nord del villaggio sulla costa occidentale di
      Streymoy. I loro dirupi superano i cinquecento metri e l’ufficio turistico li stima a settecento. Si
      visitano via mare, navigando tra archi naturali e grotte sotto le colonie di nidificazione.
    landscape: >-
      Immagina una scalinata titanica. Le Fær Øer nacquero dall’attività vulcanica tra cinquanta e sessanta
      milioni di anni fa, composte da colate di basalto intervallate da sottili strati di ceneri. Le ceneri
      friabili si erodono in fretta; il basalto sovrastante crolla in mare originando terrazze gradonate. I
      ghiacciai quaternari hanno poi levigato gli altipiani, specialmente nelle isole settentrionali.


      A Vestmanna il risultato è un paesaggio litoraneo di falesie verticali, profonde grotte e faraglioni
      isolati a nord del porto. In barca si attraversano gole d’acqua e cavità scure. Verso l’interno il borgo
      è cinto da rilievi: Hægstafjall, Økslin, Loysingafjall e Moskurfjall. Tutta l’isola di Streymoy è
      montuosa, culminando a nord-ovest con il Kopsenni.
    wildlife: >-
      Le scogliere e le grotte costituiscono un rifugio estivo sicuro per migliaia di uccelli marini:
      [pulcinelle di mare](/especie/fratercula_arctica/), [gazze marine](/especie/alca_torda/),
      [urie](/especie/uria_aalge/) e [fulmari](/especie/fulmarus_glacialis/). Dalla coperta del battello si
      ammirano nel loro habitat naturale, posati sui cornicioni rocciosi, ragione per cui i tour si svolgono
      in estate.


      L’avifauna dell’arcipelago è dominata da specie pelagiche e delle brughiere; le pulcinelle sono
      comunissime. Alcune popolazioni hanno sviluppato sottospecie insulari, come l’edredone comune e l’uria
      nera.


      In passato gli abitanti locali non si limitavano a guardare: per secoli i cacciatori si calavano con
      corde lungo le pareti per raccogliere uova di scogliera.
    visit: >-
      La visita si effettua in barca. Varie partenze giornaliere operano tra maggio e settembre, con tour di
      circa due ore. Vestmanna è un attivo porto peschereccio rinomato per l’accesso a queste scogliere,
      spesso definito il cuore turistico delle Fær Øer.


      Avendo tempo a terra, il paese offre un museo storico con diciassette statue di cera dedicate alle
      origini dell’arcipelago. Da Vestmanna si raggiunge Saksun, celebre per i tetti d’erba lungo il fiume
      Dalá e la laguna tidale di Pollurin. Un vecchio sentiero connette Saksun a Tjørnuvík in una conca
      glaciale, sfiorando la cascata di Fossá. A Kvívík sono visibili le vestigia di una fattoria vichinga
      scoperte nel 1942.
    history: >-
      Nel dicembre 1759, durante la guerra dei Sette Anni, la squadra navale francese guidata da François
      Thurot trovò scampo dalle tempeste nel fiordo di Vestmanna. La prima linea telefonica delle Fær Øer fu
      attivata tra Tórshavn e Vestmanna. Fino all’apertura del tunnel sottomarino di Vágar nel dicembre 2002,
      un traghetto collegava il porto a Oyragjógv.
    before: >-
      Le isole sono ventose, umide e fresche tutto l’anno, con una media di duecentodieci giorni di pioggia o
      neve; le perturbazioni oceaniche possono portare raffiche violente in ogni mese. Indossa abiti caldi e
      impermeabili.


      Le escursioni in mare si svolgono solo da maggio a settembre, in coincidenza con la nidificazione degli
      uccelli marini.
    around: >-
      Il sito più vicino nell’atlas è [Slættaratindur](/lugar/slaettaratindur/), a circa sei chilometri;
      [Mykines](/lugar/mykines/) dista diciassette chilometri e [Kalsoy](/lugar/kalsoy/) circa ventuno
      chilometri. Più lontano, condividono scogliere, urie, gazze marine e pulcinelle la [Riserva Naturale
      delle Sept-Îles](/lugar/reserve-naturelle-des-sept-iles/), [Fair Isle](/lugar/fair-isle/) e
      [Hornstrandir](/lugar/hornstrandir/); [Marwick Head](/lugar/marwick-head/) ospita urie e gazze marine.
  pt:
    intro: >-
      Coloca-te na proa de uma pequena embarcação quando penetra num desfiladeiro marinho: de um lado ergue-se
      a parede de basalto; do outro, uma fenda escura por onde a vaga se enfia sob a falésia. Isso é
      Vestmannabjørgini, as arribas de Vestmanna, imediatamente a norte da povoação na costa ocidental de
      Streymoy. As escarpas superam os quinhentos metros e o turismo feroês atribui-lhes setecentos.
      Percorrem-se de barco, entre grutas e canais, junto às colónias de aves marinhas.
    landscape: >-
      Pensa numa escadaria monumental. As Faroé resultaram de intensa atividade vulcânica há entre cinquenta e
      sessenta milhões de anos, formadas por bancadas de basalto intercaladas com finas camadas de cinza. A
      cinza branda desgasta-se rapidamente; o basalto superior tomba no mar, originando socalcos escalonados.
      Posteriormente, os glaciares aplanaram os planaltos, sobretudo nas ilhas do norte.


      Em Vestmanna o resultado traduz-se em arribas altíssimas, grutas profundas e farilhões isolados a norte
      do porto. Do barco atravessas passagens estreitas e furnas escuras. Para o interior, a povoação é
      cercada por montanhas: Hægstafjall, Økslin, Loysingafjall e Moskurfjall. Toda a ilha de Streymoy é
      montanhosa, culminando a noroeste no pico Kopsenni.
    wildlife: >-
      As escarpas e grutas constituem um reduto de nidificação seguro nos meses de verão para milhares de aves
      marinhas: [fradinhos](/especie/fratercula_arctica/), [tordas-comuns](/especie/alca_torda/),
      [airos-comuns](/especie/uria_aalge/) e [fulmares-glaciais](/especie/fulmarus_glacialis/). Do convés do
      barco observam-se no seu habitat natural empoleiradas nas saliências da rocha, razão pela qual os
      passeios ocorrem no verão.


      A avifauna do arquipélago é dominada por espécies marinhas e de charneca aberta; os fradinhos são
      abundantes. Algumas espécies desenvolveram subespécies insulares próprias, como o êider-edredão e o
      airo-de-asa-branca.


      Os habitantes locais não se limitavam a observar: durante séculos desciam as arribas presos por cordas
      para recolher ovos de aves marinhas.
    visit: >-
      A visita realiza-se de barco. Partem várias viagens por dia entre maio e setembro, demorando cerca de
      duas horas. Vestmanna é um porto piscatório dinâmico afamado pelo acesso a estas arribas, frequentemente
      considerada a capital turística das Faroé.


      Se tiveres tempo livre em terra, o centro de acolhimento exibe um museu histórico com dezassete figuras
      de cera sobre a história do arquipélago. De Vestmanna chega-se a Saksun, com casas de telhado de turfa
      junto ao rio Dalá e a lagoa costeira de Pollurin. Um trilho antigo une Saksun a Tjørnuvík num circo
      glaciar, passando por Fossá, a maior cascata das Faroé. Em Kvívík visitam-se ruínas de uma herdade e
      estábulo víquingues descobertas em 1942.
    history: >-
      Em dezembro de 1759, durante a Guerra dos Sete Anos, a esquadra francesa de François Thurot abrigou-se
      dos temporais em Vestmanna. A primeira linha telefónica das Faroé ligou Tórshavn a Vestmanna. Até à
      inauguração do túnel submarino de Vágar em dezembro de 2002, um ferry ligava o porto a Oyragjógv.
    before: >-
      O clima do arquipélago é ventoso, encoberto e fresco, registando uma média de duzentos e dez dias de
      chuva ou neve por ano; frentes atlânticas trazem temporais em qualquer estação. Leva roupa quente e
      impermeável.


      As excursões de barco realizam-se unicamente entre maio e setembro, coincidindo com a época de
      reprodução das aves nas arribas.
    around: >-
      O ponto mais próximo no atlas é [Slættaratindur](/lugar/slaettaratindur/), a cerca de seis quilómetros;
      [Mykines](/lugar/mykines/) fica a dezassete quilómetros e [Kalsoy](/lugar/kalsoy/) a vinte e um
      quilómetros. Noutras latitudes, acolhem airos, tordas e fradinhos a [Reserva Natural das
      Sept-Îles](/lugar/reserve-naturelle-des-sept-iles/), [Fair Isle](/lugar/fair-isle/) e
      [Hornstrandir](/lugar/hornstrandir/); [Marwick Head](/lugar/marwick-head/) acolhe airos e tordas.
