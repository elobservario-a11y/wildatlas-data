resumen:
  es: >-
    Monumentales acantilados calcáreos de creta blanca (134 m) mirando directamente a los acantilados de Dover
    en el Estrecho de Calais.
  en: >-
    Monumental white chalk cliffs (134 m) looking directly across the Strait of Dover towards the English
    cliffs.
  fr: >-
    Falaises monumentales de craie blanche (134 m) et de grès faisant directement face aux falaises de Douvres
    dans le détroit du Pas de Calais.
  de: >-
    Monumentale weiße Kreidefelsen (134 m) und Sandsteinklippen mit direktem Blick auf die Kreidefelsen von
    Dover an der Straße von Calais.
  it: >-
    Monumentali falesie calcaree di creta bianca (134 m) e arenaria prospicienti le bianche scogliere di Dover
    nello Stretto di Calais.
  pt: >-
    Arribas monumentais de cré branca (134 m) e arenito debruçadas sobre o Estreito de Calais defronte das
    falésias de Dover.
unico:
  es: >-
    Aquí conviven, a doce kilómetros uno de otro, un acantilado blanco de creta cretácica y otro gris del
    Jurásico, con la mayor ruta de aves migratorias del norte de Francia pasando por encima.
  en: >-
    Here, twelve kilometres apart, coexist a white cliff of Cretaceous chalk and a grey cliff of Jurassic
    clay, beneath northern France's busiest avian flyway.
  fr: >-
    Ici cohabitent, à douze kilomètres de distance, une falaise de craie blanche du Crétacé et un cap gris du
    Jurassique, sous le plus grand couloir migratoire d'oiseaux du nord de la France.
  de: >-
    Hier liegen zwölf Kilometer voneinander entfernt eine weiße Kreideklippe der Kreidezeit und ein graues
    Jurakap unter dem stärksten Zugvogelkorridor Nordfrankreichs.
  it: >-
    Qui convivono, a dodici chilometri l'una dall'altra, una falesia candida di creta cretacica e un capo
    grigio giurassico, sotto la principale rotta migratoria avifaunistica della Francia settentrionale.
  pt: >-
    Aqui coexistem, a doze quilómetros de distância, uma falésia de cré branca cretácica e um promontório
    cinzento jurássico, sob o maior corredor de aves migradoras do norte de França.
observaciones:
  es: >-
    Mira las mareas antes de salir. Algunos tramos del GR pasan por la playa y quedan inaccesibles con marea
    alta, y el Grand Site pide no entrar en las playas durante las dos horas anteriores y posteriores a la
    pleamar. Quédate en los senderos: el pisoteo es la principal amenaza del césped calcáreo.
texto:
  es:
    intro: >-
      Doce kilómetros de costa separan dos cabos, y en medio se abre la bahía de Wissant. En el Paso de
      Calais, el Grand Site de France de los Dos Cabos reúne el Cap Blanc-Nez, de creta blanca, y el Cap
      Gris-Nez, de arcilla y arenisca grises, y los trata como un solo paisaje: 23 km de litoral con
      acantilados, dunas, playas y campiña, que forman la fachada marítima del parque natural regional Caps et
      Marais d'Opale. Desde el Blanc-Nez, con tiempo claro, se distinguen al otro lado del estrecho los
      acantilados de Dover.
    landscape: >-
      La geología explica todo. El Gris-Nez, el más viejo, carga con sus 160 millones de años; el Blanc-Nez
      nació 70 millones de años después. Entre los dos hay una sucesión de acantilados grises de marga y
      arenisca del Jurásico, acantilados blancos de creta cretácica, dunas y grandes bahías abiertas entre los
      cabos. Al pie de la creta blanca quedan las huellas de una antigua orilla del Cuaternario, fosilizada
      bajo la llanura marítima.


      El viento marca la vegetación. Los arbustos del litoral, como el licio, el aligustre y el espino
      amarillo, crecen achaparrados y tumbados por el viento y la bruma salina, un efecto que el Grand Site
      llama anemomorfismo. Y en lo alto del Blanc-Nez hay algo que no se repite en toda la costa de
      Hauts-de-France: el único coteau calcáreo pegado al mar. Sus céspedes calcáreos guardan una flora
      excepcional, con la gentiana amarga, rarísima, y el col marino, antepasado de todas las coles
      cultivadas. El Grand Site asegura que el 80 % de las especies vegetales y animales de la región están
      representadas en este litoral.
    wildlife: >-
      La clave del año son las migraciones. En primavera y en otoño, millones de aves migratorias recorren o
      sobrevuelan esta costa, un corredor ecológico de importancia paneuropea. El estrecho es un paso
      obligado, y por eso el Gris-Nez es un lugar muy frecuentado por ornitólogos en esas dos épocas; desde su
      mirador, el equipo naturalista GON organiza actividades para seguir el paso de las aves.


      Fuera de las migraciones, los acantilados son una colonia. Las grietas y pequeñas cuevas de la creta
      sirven de nido a chovas, aviones comunes, [fulmares](/especie/fulmarus_glacialis/),
      [cernícalos](/especie/falco_tinnunculus/), charranes y gaviotas argénteas, y en el Blanc-Nez vive la
      mayor colonia europea de [gaviotas tridáctilas](/especie/rissa_tridactyla/). En los céspedes de arriba
      abundan los pájaros, entre ellos la tarabilla común. Con buenos prismáticos y paciencia, a veces se ven
      focas o pequeños cetáceos desde lo alto. Y en primavera florecen en los cabos orquídeas como la orquídea
      macho, la orquídea bufón y la de Fuchs.
    visit: >-
      Empieza por la Maison du Site des Deux-Caps, en el caserío de Haringzelle, en Audinghen: tiene un
      espacio de visita y alquila bicicletas, clásicas o eléctricas, por el día o la mitad del día.


      El gran paseo es la ruta de un cabo a otro, que se hace desde Wissant en dos idas y vueltas de doce
      kilómetros. Hacia el Gris-Nez rodeas el CROSS, el centro que vigila y rescata en uno de los estrechos
      más transitados del mundo, y con suerte ves la costa inglesa en su punto más cercano. Hacia el Blanc-Nez
      manda el mar: con marea baja puedes ir al pie de los acantilados; con marea alta, el GR120/E9 sube a más
      de 130 metros, con una vista de 360° desde la bahía de Wissant hasta Dunkerque. Elegir es lo difícil; si
      no quieres hacer las dos, ve una y vuelve en el autobús de la línea 427.


      Los senderos de interpretación cuentan la parte humana: el de los pescadores recorre Audresselles y
      explica el flobart, la barca de varada símbolo de la pesca costera, y el de los pintores de Wissant
      recuerda a los artistas que llegaron desde 1880 atraídos por la luz de la bahía.
    history: >-
      El Departamento del Paso de Calais obtuvo la etiqueta Grand Site de France el 29 de marzo de 2011, y el
      sitio agrupa cinco sitios clasificados y cuatro inscritos, unas 6.431 hectáreas, además de cinco áreas
      Natura 2000. La presión humana ha dejado huella: el pisoteo transforma el césped en prado, la roca madre
      aflora y la flora se empobrece. En 2005 se reestructuró el sitio y se suprimieron los aparcamientos del
      Blanc-Nez y del plan d'Escalles.


      La historia militar está escrita en las cumbres. Un obelisco levantado entre 1920 y 1922 en lo alto del
      Blanc-Nez recuerda a la patrulla de Dover de la Primera Guerra Mundial, y en la punta del Gris-Nez se
      instaló en 1805 el primer semáforo de la línea telegráfica óptica que Napoleón proyectó a través del
      Canal.
    before: >-
      Mira las mareas antes de salir. Algunos tramos del GR pasan por la playa y quedan inaccesibles con marea
      alta, y el Grand Site pide no entrar en las playas durante las dos horas anteriores y posteriores a la
      pleamar. Quédate en los senderos: el pisoteo es la principal amenaza del césped calcáreo.
    around: >-
      Los Dos Cabos no tienen vecinos catalogados en el atlas, pero sí lugares lejanos con los que comparten
      especies, como el halcón peregrino y la foca gris: la [Pointe du Raz en Cap
      Sizun](/lugar/pointe-du-raz-en-cap-sizun/) y [Lundy](/lugar/lundy/).
  en:
    intro: >-
      Twelve kilometres of dynamic coastline separate two headlands, embracing the sweeping bay of Wissant. In
      Pas-de-Calais, the Grand Site de France of the Two Capes unites Cap Blanc-Nez, made of pure white chalk,
      and Cap Gris-Nez, built of grey Jurassic sandstone and clay, treating them as a coherent coastal entity:
      23 km of dramatic coastline encompassing soaring sea cliffs, dune systems, sandy beaches, and farmland
      forming the coastal frontage of the Caps et Marais d'Opale Regional Nature Park. On clear days, the
      white cliffs of Dover stand out sharply across the narrow strait.
    landscape: >-
      Geology dictates the scenery. Cap Gris-Nez, the geologically older headland, dates back some 160 million
      years; Cap Blanc-Nez was laid down 70 million years later. Between them unfolds an undulating succession
      of grey Jurassic marl and sandstone bluffs, sheer white Cretaceous chalk precipices, coastal dunes, and
      wide bays cradled between the promontories. At the foot of the white chalk cliffs lie fossilized
      remnants of an ancient Quaternary shoreline buried beneath the modern marine plain.


      Winds shape the vegetation. Maritime scrub species including sea buckthorn, wild privet, and boxthorn
      grow prostrate and stunted, sculpted by prevailing gale-force sea spray—a physical phenomenon known as
      anemomorphosis. Atop Cap Blanc-Nez lies a botanical feature unique along the entire Hauts-de-France
      coastline: the only maritime chalk downland cliff. Its chalk grassland shelters exceptional flora,
      including the rare early gentian and wild sea cabbage, ancestor of all cultivated brassicas. The Grand
      Site records that 80% of regional plant and animal species are represented along this coastal strip.
    wildlife: >-
      Bird migration forms the paramount natural drama of the year. In spring and autumn, millions of
      migratory birds navigate over this headland corridor, a flyway of pan-European ecological significance.
      The narrow strait funnels migrants, making Cap Gris-Nez an international observation post during both
      passages, where the GON naturalist network coordinates migration counts from the cliff-top watchpoint.


      Outside peak migration periods, the cliffs support thriving breeding colonies. Fissures and ledges
      within the chalk provide nesting sites for Western jackdaws, common house martins, [northern
      fulmars](/especie/fulmarus_glacialis/), [common kestrels](/especie/falco_tinnunculus/), terns, and
      European herring gulls, while Cap Blanc-Nez hosts the largest mainland European breeding colony of
      [black-legged kittiwakes](/especie/rissa_tridactyla/). Across the upland downlands flit meadow pipits
      and European stonechats. With binoculars, seals or harbour porpoises are frequently spotted off the
      headlands. In spring, wild orchids bloom across the cliffs, including early purple, green-winged, and
      common spotted orchids.
    visit: >-
      Start your visit at the Maison du Site des Deux-Caps in the hamlet of Haringzelle at Audinghen: it
      features an interpretive discovery space and hires traditional and electric bicycles for day or half-day
      excursions.


      The classic walking route connects the two headlands, tackled from Wissant as two separate
      twelve-kilometre return walks. Walking toward Gris-Nez you skirt the CROSS maritime surveillance centre
      monitoring one of the world's busiest shipping straits, enjoying the closest views of the English coast.
      Walking toward Blanc-Nez the tides dictate logistics: at low water you can walk along the beach beneath
      the cliffs, while at high tide the coastal path GR120/E9 climbs to over 130 metres, rewarding walkers
      with a 360° panorama stretching from Wissant Bay to Dunkirk. For a linear route, take public bus line
      427 for the return.


      Interpretive walking trails explore cultural heritage: the fishermen's trail through Audresselles
      interprets the traditional flobart beach-launched wooden boat, while the painters' path in Wissant
      celebrates the impressionist art colony drawn here since 1880 by the exceptional marine light.
    history: >-
      The Pas-de-Calais Department achieved formal Grand Site de France designation on 29 March 2011,
      encompassing five classified and four registered cultural sites across roughly 6,431 hectares alongside
      five Natura 2000 designated reserves. Visitor pressure leaves visible scars: trampling degrades chalk
      turf to bare rock and diminishes rare flora. In 2005 the site was extensively redeveloped, eliminating
      informal cliff-top car parks at Blanc-Nez and the Plan d'Escalles.


      Military history crowns the capes. An obelisk erected between 1920 and 1922 atop Blanc-Nez honours the
      Dover Patrol of the First World War, while the tip of Gris-Nez was chosen in 1805 for the primary
      coastal semaphore station of Napoleon's planned optical telegraph network across the Channel.
    before: >-
      Always check local tide tables before setting out. Sections of the GR coastal path traverse the beach
      and become impassable at high tide; park authorities urge visitors to stay off the foreshore for two
      hours either side of high water. Stay strictly on waymarked cliff paths: pedestrian trampling is the
      primary existential threat to fragile chalk grasslands.
    around: >-
      The Two Capes have no catalogued immediate neighbours in the atlas, but share peregrine falcons and grey
      seals with distant coastal headlands: [Pointe du Raz in Cap Sizun](/lugar/pointe-du-raz-en-cap-sizun/)
      and [Lundy](/lugar/lundy/).
  fr:
    intro: >-
      Douze kilomètres de rivage séparent deux caps majeurs enserrant la vaste baie de Wissant. Dans le
      Pas-de-Calais, le Grand Site de France des Deux-Caps réunit le Cap Blanc-Nez, constitué de craie
      blanche, et le Cap Gris-Nez, d'argile et de grès jurassiques, traités comme une seule entité paysagère :
      23 km de littoral associant falaises monumentales, massifs dunaires, estrans sableux et bocage formant
      la façade maritime du parc naturel régional des Caps et Marais d'Opale. Par temps clair, les falaises de
      Douvres se dessinent nettement outre-Manche.
    landscape: >-
      La géologie commande les reliefs. Le Gris-Nez, le plus ancien, affiche 160 millions d'années ; le
      Blanc-Nez s'est déposé 70 millions d'années plus tard. Entre les deux s'étire une alternance de falaises
      jurassiques grises, d'escarpements blancs de craie crétacée, de cordons dunaires et de baies sableuses.
      Au pied de la craie subsistent les vestiges fossilisés d'une plage quaternaire enfouie sous la plaine
      maritime.


      Le vent façonne le couvert végétal. Les arbrisseaux maritimes tels l'argousier, le troène et le lyciet
      poussent prostrés et anémomorphosés par les embruns salés. Au sommet du Blanc-Nez se déploie l'unique
      coteau calcaire en prise directe avec la mer de tous les Hauts-de-France. Ses pelouses calcicoles
      abritent une flore remarquable, dont la gentianelle amère et le chou marin sauvage. Le Grand Site estime
      que 80 % de la biodiversité régionale se trouve représentée sur cette frange côtière.
    wildlife: >-
      Le phénomène marquant de l'année réside dans la migration des oiseaux. Au printemps et à l'automne, des
      millions de migrateurs longent ou franchissent ce littoral, couloir écologique d'envergure
      paneuropéenne. L'entonnoir du détroit en fait un passage obligé, le Gris-Nez devenant un haut lieu
      d'observation ornithologique où le Groupe Ornithologique et Naturaliste (GON) assure le suivi de la
      migration depuis la pointe.


      En dehors des passages migratoires, les parois rocheuses abritent de riches colonies nicheuses. Les
      anfractuosités de la craie accueillent choucas, hirondelles de fenêtre, [fulmars
      boréaux](/especie/fulmarus_glacialis/), [faucons crécerelles](/especie/falco_tinnunculus/), sternes et
      goélands argentés, tandis que le Blanc-Nez héberge la plus importante colonie de [mouettes
      tridactyles](/especie/rissa_tridactyla/) d'Europe continentale. Les pelouses sommitales grouillent de
      passereaux comme le tarier pâtre. Avec des jumelles, phoques gris et marsouins s'aperçoivent au large.
      Au printemps fleurissent l'orchis mâle, l'orchis bouffon et l'orchis de Fuchs.
    visit: >-
      Débutez par la Maison du Site des Deux-Caps au hameau d'Haringzelle à Audinghen : elle propose un espace
      muséographique et la location de vélos classiques ou électriques pour la journée ou la demi-journée.


      La randonnée maîtresse relie les deux caps au départ de Wissant, déclinée en deux allers-retours de
      douze kilomètres. Vers le Gris-Nez, vous longez le CROSS veillant sur le trafic maritime du détroit,
      avec vue rapprochée sur l'Angleterre. Vers le Blanc-Nez, la marée conditionne le parcours : à marée
      basse on longe le pied des falaises ; à marée haute, le GR120/E9 s'élève à plus de 130 mètres, offrant
      un panorama à 360° de la baie de Wissant jusqu'à Dunkerque. En cas de parcours linéaire, la ligne de bus
      427 assure le retour.


      Les sentiers de découverte valorisent le patrimoine humain : le sentier des pêcheurs d'Audresselles fait
      découvrir le flobart, bateau d'échouage traditionnel, tandis que le sentier des peintres de Wissant
      honore les artistes inspirés dès 1880 par la lumière des lieux.
    history: >-
      Le Département du Pas-de-Calais a obtenu le label Grand Site de France le 29 mars 2011, regroupant cinq
      sites classés et quatre inscrits couvrant 6 431 hectares, ainsi que cinq sites Natura 2000. La
      fréquentation intense a laissé des traces : le piétinement dégrade les pelouses jusqu'à la roche nue. En
      2005, le réaménagement du site a supprimé les parkings du sommet du Blanc-Nez et du plan d'Escalles pour
      restaurer la végétation.


      L'histoire militaire marque les sommets. Un obélisque érigé entre 1920 et 1922 au sommet du Blanc-Nez
      commémore la Dover Patrol de la Première Guerre mondiale, tandis qu'au Gris-Nez fut installé en 1805 le
      premier sémaphore de la ligne télégraphique voulue par Napoléon.
    before: >-
      Consultez scrupuleusement les horaires des marées avant de partir. Certains tronçons de plage deviennent
      infranchissables à marée haute, et le Grand Site déconseille l'accès au rivage durant les deux heures
      encadrant la pleine mer. Restez sur les sentiers balisés : le piétinement constitue la principale menace
      pour les pelouses calcaires.
    around: >-
      Les Deux-Caps ne comptent pas de sites voisins immédiats au sein de l'atlas, mais partagent le faucon
      pèlerin et le phoque gris avec d'autres caps atlantiques : la [Pointe du Raz en Cap
      Sizun](/lugar/pointe-du-raz-en-cap-sizun/) et l'île de [Lundy](/lugar/lundy/).
  de:
    intro: >-
      Zwölf Kilometer Küstenlinie trennen zwei markante Kaps, die die weite Bucht von Wissant einrahmen. Im
      Pas-de-Calais vereint die Grand Site de France der Zwei Kaps das weiße Kreidekap Cap Blanc-Nez und das
      aus grauem Sandstein und Ton aufgebaute Cap Gris-Nez zu einem geschlossenen Küstenraum: 23 km
      Steilküsten, Dünenfelder, Strände und Wiesen, die die maritime Front des Regionalen Naturparks Caps et
      Marais d'Opale bilden. Bei klarer Sicht zeichnen sich jenseits der Meerenge die weißen Klippen von Dover
      deutlich ab.
    landscape: >-
      Die Erdgeschichte erklärt das Profil der Küste. Das geologisch ältere Cap Gris-Nez blickt auf 160
      Millionen Jahre zurück; das Cap Blanc-Nez entstand 70 Millionen Jahre später. Dazwischen erstreckt sich
      eine Abfolge grauer Mergel- und Sandsteinklippen des Jura, schneeweißer Kreideabbrüche der Kreidezeit,
      Dünenkämme und weiter Sandbuchten. Am Fuß der Kreidefelsen lagern Reste fossiler Strände des Quartärs
      unter der Schwemmebene.


      Der Seewind formt die Pflanzengemeinschaft. Küstensträucher wie Sanddorn, Liguster und Bocksdorn wachsen
      windgeschoren und bodennah – ein Phänomen, das als Anemomorphose bezeichnet wird. Auf dem Blanc-Nez
      befindet sich zudem der einzige Kreide-Trockenrasen direkt am Meer in ganz Hauts-de-France. Er birgt
      botanische Seltenheiten wie Bitteren Enzian und Wilden Meerkohl. Nach Angaben des Schutzgebiets sind 80
      % aller Tier- und Pflanzenarten der Region auf diesem Küstenstreifen vertreten.
    wildlife: >-
      Das beherrschende Naturereignis ist der alljährliche Vogelzug. Im Frühjahr und Herbst ziehen Millionen
      von Zugvögeln an dieser Küstenlinie entlang oder überqueren die Meeresstraße – ein Korridor von
      paneuropäischer Bedeutung. Die Engstelle bündelt den Flugverkehr, weshalb das Cap Gris-Nez ein
      Treffpunkt für Ornithologen ist; der Naturschutzverband GON führt dort regelmäßig Zählungen durch.


      Außerhalb der Zugzeiten fungieren die Steilwände als Kolonien. Nischen in der Kreide bieten Dohlen,
      Mehlschwalben, [Eissturmvögeln](/especie/fulmarus_glacialis/),
      [Turmfalken](/especie/falco_tinnunculus/), Seeschwalben und Silbermöwen Nistplätze, während am Blanc-Nez
      die größte Brutkolonie der [Dreizehenmöwe](/especie/rissa_tridactyla/) auf dem europäischen Festland
      brütet. Auf den Hochflächen leben Singvögel wie das Schwarzkehlchen. Mit dem Fernglas lassen sich im
      Meer Kegelrobben und Schweinswale ausmachen. Im Frühjahr blühen Knabenkräuter wie das Stattliche, das
      Kleine und das Fuchs'sche Knabenkraut.
    visit: >-
      Beginne deinen Besuch im Besucherzentrum Maison du Site des Deux-Caps im Weiler Haringzelle bei
      Audinghen: Es bietet Ausstellungen und Fahrradverleih für Ganztages- oder Halbtagestouren.


      Die klassische Route verbindet beide Kaps von Wissant aus in zwei separaten Rundwegen von je zwölf
      Kilometern. Zum Gris-Nez wanderst du an der Küstenüberwachungszentrale CROSS vorbei, die eine der
      meistbefahrenen Schifffahrtsstraßen der Welt überwacht, mit freiem Blick auf England. Zum Blanc-Nez
      bestimmt die Gezeit den Weg: Bei Ebbe geht man am Strand unter den Klippen entlang; bei Flut steigt der
      Küstenweg GR120/E9 auf über 130 Meter an und belohnt mit 360°-Rundumblick von Wissant bis Dünkirchen.
      Für einfache Streckenverläufe verkehrt die Buslinie 427.


      Themenwege erläutern die Kulturlandschaft: Der Fischerpfad in Audresselles stellt das Flobart vor, das
      traditionelle Strandungsboot der Region, während der Malerpfad in Wissant an die Künstler erinnert, die
      ab 1880 vom Licht der Bucht angezogen wurden.
    history: >-
      Das Département Pas-de-Calais erhielt das Gütesiegel Grand Site de France am 29. März 2011 für ein Areal
      aus fünf denkmalgeschützten und vier registrierten Stätten mit 6.431 Hektar sowie fünf Natura
      2000-Gebieten. Starker Besucherdruck schädigte die Vegetation: Trittbelastung legte das Gestein frei. Im
      Jahr 2005 wurde das Areal grundlegend umgestaltet und Parkplätze auf den Kappen des Blanc-Nez und am
      Plan d'Escalles rückgebaut.


      Militärgeschichte prägt die Höhen. Ein zwischen 1920 und 1922 errichteter Obelisk auf dem Blanc-Nez
      erinnert an die Dover Patrol des Ersten Weltkriegs, während Napoleons optische Telegraphenlinie 1805 auf
      dem Gris-Nez ihre erste Küstenstation erhielt.
    before: >-
      Prüfe stets den Gezeitenkalender vor dem Aufbruch. Abschnitte am Strand sind bei Flut unpassierbar; die
      Parkverwaltung warnt davor, die Strände zwei Stunden vor und nach dem Gezeitenhöchststand zu betreten.
      Bleibe auf den Wegen: Trittschäden gefährden den empfindlichen Kreiderasen.
    around: >-
      Die Zwei Kaps haben keine unmittelbaren Nachbarn im Atlas, teilen jedoch Wanderfalke und Kegelrobbe mit
      atlantischen Kaps: der [Pointe du Raz am Cap Sizun](/lugar/pointe-du-raz-en-cap-sizun/) und der Insel
      [Lundy](/lugar/lundy/).
  it:
    intro: >-
      Dodici chilometri di litorale separano due promontori che abbracciano la vasta baia di Wissant. Nel
      Passo di Calais, il Grand Site de France dei Due Capi riunisce Cap Blanc-Nez, composto di creta candida,
      e Cap Gris-Nez, di arenarie e argille giurassiche, gestendoli come una sola entità geografica: 23 km di
      costa con falesie a picco, campi di dune, lidi sabbiosi e praterie che compongono il fronte marittimo
      del parco naturale regionale Caps et Marais d'Opale. Dal Blanc-Nez, nelle giornate terse, si stagliano
      nettamente le scogliere di Dover al di là della Manica.
    landscape: >-
      La geologia governa ogni scorcio. Cap Gris-Nez, il più antico, conta 160 milioni di anni; Cap Blanc-Nez
      si è originato 70 milioni di anni dopo. Tra i due promontori si susseguono scarpate grigie di marna e
      arenaria giurassica, muraglie verticali di creta cretacica, dune costiere e ampie insenature sabbiose.
      Ai piedi della creta bianca giacciono i sedimenti fossilizzati di un antico arenile quaternario sepolto
      sotto la piana costiera.


      Il vento modella il mantello vegetale. Gli arbusti litoranei come l'olivello spinoso, il ligustro e il
      licio crescono schiacciati e prostrati dalle raffiche salmastre, un fenomeno noto come anemomorfismo.
      Sulla sommità del Blanc-Nez affiora un biotopo unico per l'intera regione dell'Alta Francia: l'unico
      versante calcareo a contatto diretto col mare. Le sue praterie aride ospitano specie rare come la
      genzianella amara e il cavolo marino selvatico. L'ente gestore rileva che l'80% delle specie botaniche e
      faunistiche regionali trova rifugio su questo litorale.
    wildlife: >-
      L'evento culminante dell'anno è la migrazione ornitica. In primavera e in autunno milioni di uccelli
      solcano o sorvolano questa costa, corridoio biologico di rilevanza paneuropea. Lo stretto funge da
      imbuto naturale, trasformando Cap Gris-Nez in un rinomato punto di avvistamento ornitologico; dalla
      postazione di vetta l'associazione naturalistica GON monitora regolarmente i flussi migratori.


      Al di fuori dei passi, le falesie brulicano di colonie nidificanti. Le fessure della creta accolgono
      taccole, balestrucci, [fulmari](/especie/fulmarus_glacialis/), [gheppi](/especie/falco_tinnunculus/),
      sterne e gabbiani reali nordici, mentre sul Blanc-Nez nidifica la colonia più cospicua di [gabbiani
      tridattili](/especie/rissa_tridactyla/) dell'Europa continentale. Sui pascoli sommitali abbondano
      passeriformi come il saltimpalo. Con il binocolo si intravedono foche e focene al largo. In primavera
      sbocciano orchidee come l'orchidea maschia, la morio e l'orchidea di Fuchs.
    visit: >-
      La visita prende le mosse dalla Maison du Site des Deux-Caps nella frazione di Haringzelle ad Audinghen:
      include un'area museale e propone il noleggio di biciclette muscolari o a pedalata assistita per
      itinerari giornalieri o di mezza giornata.


      L'escursione primaria collega i due capi partendo da Wissant, suddivisa in due percorsi andata e ritorno
      di dodici chilometri ciascuno. Verso Cap Gris-Nez si costeggia la stazione CROSS che sorveglia la
      navigazione mercantile della Manica, godendo della vista più ravvicinata sulle coste inglesi. Verso Cap
      Blanc-Nez è la marea a dettare le regole: con la bassa marea si cammina sulla spiaggia sotto le falesie;
      con l'alta marea il sentiero costiero GR120/E9 risale a oltre 130 metri, svelando una vista a 360° da
      Wissant a Dunkerque. Per un itinerario solo andata, la linea autobus 427 garantisce il rientro.


      I sentieri tematici svelano le radici locali: il percorso dei pescatori ad Audresselles illustra il
      flobart, la tradizionale imbarcazione da sbarco litoranea, mentre il sentiero dei pittori a Wissant
      ricorda gli artisti richiamati qui fin dal 1880 dalla luce marina.
    history: >-
      Il Dipartimento del Passo di Calais ha ottenuto il riconoscimento Grand Site de France il 29 marzo 2011,
      accorpando cinque siti classificati e quattro registrati per complessivi 6.431 ettari, insieme a cinque
      zone della rete Natura 2000. L'eccessivo calpestio turistico aveva intaccato i prati calcarei portando
      la roccia a nudo. Nel 2005 il sito è stato riqualificato, smantellando i vecchi parcheggi posti in vetta
      al Blanc-Nez e al Plan d'Escalles.


      Le memorie belliche presidiano i punti più alti. Un obelisco eretto tra il 1920 e il 1922 sul Blanc-Nez
      commemora la Dover Patrol della Grande Guerra, mentre sulla punta del Gris-Nez fu installato nel 1805 il
      primo semaforo della linea telegrafica ottica voluta da Napoleone verso la Manica.
    before: >-
      Verifica attentamente la tavola delle maree prima di muoverti. Alcuni tratti di battigia vengono
      sommersi con l'alta marea e l'ente consiglia di non accedere alla spiaggia nelle due ore precedenti e
      successive al colmo della piena. Resta rigorosamente sui sentieri: il calpestio è la prima minaccia per
      i fragili prati calcarei.
    around: >-
      I Due Capi non hanno schede contigue nell'atlante, ma condividono falco pellegrino e foca grigia con
      altri capi atlantici: la [Pointe du Raz in Cap Sizun](/lugar/pointe-du-raz-en-cap-sizun/) e l'isola di
      [Lundy](/lugar/lundy/).
  pt:
    intro: >-
      Doze quilómetros de costa separam dois cabos que emolduram a ampla baía de Wissant. No Passo de Calais,
      o Grand Site de France dos Dois Cabos associa o Cap Blanc-Nez, esculpido em cré branca, e o Cap
      Gris-Nez, de argilas e arenitos cinzentos, gerindo-os como uma única unidade cénica: 23 km de orla
      costeira com arribas abruptas, sistemas dunares, praias e campos agrícolas que formam a fachada marítima
      do parque natural regional Caps et Marais d'Opale. A partir do Blanc-Nez, em dias claros, avistam-se
      nitidamente as falésias de Dover do outro lado da Mancha.
    landscape: >-
      A geologia dita a fisionomia do litoral. O Gris-Nez, o mais antigo, remonta a 160 milhões de anos; o
      Blanc-Nez consolidou-se 70 milhões de anos mais tarde. Entre ambos estende-se uma sucessão de arribas
      cinzentas de marga e arenito jurássicos, escarpas brancas de cré cretácica, dunas marítimas e baías de
      areia aberta. No sopé das falésias brancas preservam-se vestígios fossilizados de uma antiga praia
      quaternária soterrada pela planície litoral.


      O vento modela a vegetação. Arbustos como o espinheiro-marítimo, o ligustro e o licieto crescem
      rasteiros e prostrados pela salsugem marítima, fenómeno designado por anemomorfose. No cimo do Blanc-Nez
      surge algo único em toda a costa de Hauts-de-France: o único cabeço calcário em contacto direto com o
      mar. Os seus prados calcícolas abrigam flora excecional, com a genciana-amarga e a couve-marinha
      silvestre. A entidade gestora destaca que 80% das espécies florísticas e faunísticas da região ocorrem
      nesta orla litoral.
    wildlife: >-
      O grande momento anual centra-se nas rotas migratórias. Na primavera e no outono milhões de aves
      migradoras percorrem ou sobrevoam esta faixa marítima, corredor ecológico de alcance transeuropeu. O
      afunilamento do estreito torna a passagem obrigatória, fazendo do Gris-Nez um centro ornitológico
      concorrido; do miradouro da ponta a associação naturalista GON coordena censos diários de migração.


      Fora das épocas de passagem, as arribas abrigam colónias de nidificação vibrantes. As fendas da cré
      servem de refúgio a gralhas-de-nuca-cinzenta, andorinhas-dos-beirais,
      [fulmares-boreais](/especie/fulmarus_glacialis/),
      [peneireiros-de-dorso-malhado](/especie/falco_tinnunculus/), garajaus e gaivotas-argênteas, acolhendo o
      Blanc-Nez a mais expressiva colónia de [gaivotas-tridáctilas](/especie/rissa_tridactyla/) da Europa
      continental. Nos prados cimeiros abundam passeriformes como o cartaxo-comum. Com binóculos avistam-se
      focas-cinzentas e botos no mar. Na primavera desabrocham orquídeas como a orquídea-macho e a
      orquídea-palhaço.
    visit: >-
      Inicia o percurso na Maison du Site des Deux-Caps na aldeia de Haringzelle em Audinghen: dispõe de área
      museológica e aluguer de bicicletas convencionais ou elétricas para passeios de dia inteiro ou meio-dia.


      A caminhada de referência liga ambos os cabos a partir de Wissant, dividida em dois trajetos de ida e
      volta de doze quilómetros. Rumo ao Gris-Nez contorna-se o centro de vigilância marítima CROSS que
      monitoriza a navegação no estreito, com perspetiva próxima da costa inglesa. Rumo ao Blanc-Nez a maré
      define o itinerário: na maré baixa caminha-se pela areia junto às arribas; na maré alta o percurso
      pedestre GR120/E9 sobe a mais de 130 metros, oferecendo uma vista de 360° da baía de Wissant até
      Dunquerque. Em circuitos lineares, a carreira de autocarro 427 assegura o regresso.


      Os trilhos temáticos mostram a herança humana: o dos pescadores em Audresselles aborda o flobart,
      tradicional embarcação costeira, e o dos pintores em Wissant recorda os artistas atraídos a partir de
      1880 pela luminosidade da baía.
    history: >-
      O Departamento do Passo de Calais obteve a classificação Grand Site de France em 29 de março de 2011,
      reunindo cinco sítios classificados e quatro inscritos que somam 6 431 hectares, além de cinco zonas da
      rede Natura 2000. O pisoteio intensivo desgastara o coberto vegetal até à rocha viva. Em 2005 o sítio
      foi reestruturado, desmantelando-se os parques de estacionamento no topo do Blanc-Nez e no plan
      d'Escalles.


      A história militar coroa os promontórios. Um obelisco erigido entre 1920 e 1922 no topo do Blanc-Nez
      homenageia a Patrulha de Dover da Primeira Guerra Mundial, enquanto na ponta do Gris-Nez foi construído
      em 1805 o primeiro semáforo da linha telegráfica ordenada por Napoleão.
    before: >-
      Consulta com antecedência a tabela de marés. Certos troços de praia tornam-se intransitáveis na
      preia-mar, desaconselhando a gestão a permanência na praia durante as duas horas antes e depois da
      maré-cheia. Mantém-te nos trilhos sinalizados: o pisoteio desordenado é a principal ameaça aos prados
      calcários.
    around: >-
      Os Dois Cabos não têm registos imediatos contíguos no atlas, mas partilham o falcão-peregrino e a
      foca-cinzenta com outros cabos atlanticos: a [Pointe du Raz em Cap
      Sizun](/lugar/pointe-du-raz-en-cap-sizun/) e a ilha de [Lundy](/lugar/lundy/).
