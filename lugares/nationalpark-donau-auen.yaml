resumen:
  es: El último gran paisaje de franja fluvial no retenido de Europa Central entre Viena y Bratislava.
  en: Central Europe's last major free-flowing lowland river landscape between Vienna and Bratislava.
  fr: >-
    Le dernier grand paysage alluvial d’Europe centrale au cours libre et non régulé entre Vienne et
    Bratislava.
  de: Mitteleuropas letzte große, frei fließende Flussauenlandschaft zwischen Wien und Bratislava.
  it: >-
    L’ultimo grande paesaggio ripariale a corso libero e naturale dell’Europa centrale tra Vienna e
    Bratislava.
  pt: A última grande paisagem ripícola de curso livre e desimpedido da Europa Central entre Viena e Bratislava.
unico:
  es: >-
    Aquí el Danubio sigue siendo un río salvaje: sube y baja hasta siete metros y rehace el paisaje cada vez
    que lo hace.
  en: >-
    Here the Danube remains a wild river: fluctuating up to seven metres, remodelling the riverine landscape
    with every flood.
  fr: >-
    Ici le Danube demeure un fleuve sauvage : son niveau varie jusqu’à sept mètres, réinventant le paysage à
    chaque crue.
  de: >-
    Hier bleibt die Donau ein Wildfluss: Sie schwankt um bis zu sieben Meter und gestaltet die Auenlandschaft
    bei jedem Hochwasser neu.
  it: >-
    Qui il Danubio è ancora un fiume selvaggio: sale e scende fino a sette metri, rimodellando il paesaggio a
    ogni piena.
  pt: >-
    Aqui o Danúbio permanece um rio bravio: oscila até sete metros de nível, redesenhando a paisagem em cada
    cheia.
observaciones:
  es: >-
    Quédate en los senderos marcados; solo algunas rutas están autorizadas para bicicleta y solo algunas aguas
    para barcas sin motor. Las crecidas del Danubio cambian los programas y las rutas con poco aviso:
    comprueba el nivel del agua antes de ir y evita zonas donde pueda atraparte. Al caer la noche se pide
    dejar la actividad recreativa y evitar el ruido, para proteger a los animales de hábitos crepusculares o
    nocturnos. Desde la orilla sur se llega con el tren rápido S7 desde Viena en dirección Wolfsthal.
texto:
  es:
    intro: >-
      En diciembre de 1984, miles de personas de todas las edades y clases sociales ocuparon los bosques de
      ribera de Stopfenreuth para impedir que una central hidroeléctrica cortara el último tramo largo y libre
      del Danubio en Austria. La policía intentó desalojarlos varias veces, sin éxito, y el gobierno acabó
      parando las obras. Doce años después, el 27 de octubre de 1996, esos humedales se convirtieron en el
      Parque Nacional Donau-Auen. Hoy protege más de 9.600 hectáreas entre Viena y la desembocadura del río
      March, en la frontera con Eslovaquia.
    landscape: >-
      El Danubio austriaco se parece a un torrente alpino: baja unos 40 cm por cada kilómetro y corre de 1 a 3
      metros por segundo. En el parque recorre treinta y ocho kilómetros y, en su punto más ancho, mide solo
      unos 4 km; los humedales aparecen solo junto al río. El agua sube con el deshielo, de finales de
      primavera a mediados de verano, y vuelve a bajar. Esa danza es la que mantiene el paisaje vivo: nacen
      brazos nuevos, se forman islas, se cierran los brazos muertos, y donde el río deposita arena o grava
      empieza una sucesión de vegetación que va de las hierbas a los sauces y de ahí al bosque.


      Antes de su regulación en el siglo XIX, el Danubio formaba una red de brazos principales, secundarios y
      antiguos que cambiaba sin cesar. Se canalizó para facilitar la navegación y proteger de las inundaciones
      las tierras de cultivo de Marchfeld, y desde los años cincuenta una cadena casi ininterrumpida de
      centrales hidroeléctricas lo convirtió en una serie de embalses. Solo la Wachau y este parque se
      conservan libres.


      El resultado es un mosaico. Aproximadamente el 65 % del parque es bosque de ribera, el 15 % prado y
      cerca del 20 % está cubierto por agua. Sauces, álamos negros y alisos forman el bosque blando, que se
      inunda varias veces al año; más lejos del agua aparecen robles, arces, fresnos y tilos. Sobre la grava
      profunda hay incluso paisajes de tipo estepario, con espino, espino cerval, orquídeas y hierba de pluma,
      además de mantis religiosa. Y los prados, cultivados desde hace siglos, siguen en pie.
    wildlife: >-
      Ya no hay explotación forestal en los bosques del parque: el único leñador que se queda es el
      [castor](/especie/castor_fiber/). En las orillas escarpadas de Schönau, las tardes de finales de
      invierno ofrecen buenas oportunidades de verlo. En el sendero de Schönau se ven garzas en los carrizales
      y, en invierno, cormoranes y [pigargos europeos](/especie/haliaeetus_albicilla/). El pigargo, que
      llevaba tiempo sin criar en Austria, cría ahora en el parque con hasta seis parejas.


      Entre las aves están también el milano negro, una de las rapaces más escasas de Austria, y el [guion de
      codornices](/especie/crex_crex/), que pasa casi siempre oculto en prados húmedos de hierba alta y cuyo
      grito se oye de noche. El parque tiene la última población reproductora autóctona de [galápago
      europeo](/especie/emys_orbicularis/) de Austria. La [culebra de Esculapio](/especie/elaphe_longissima/)
      se ve a menudo en los bordes de los caminos de los bosques de la ladera sur.


      En total hay 39 especies de mamíferos, 100 aves reproductoras, ocho reptiles, trece anfibios y 67 peces,
      y 900 especies de plantas vasculares. La temporada recomendada va de primavera a otoño.
    visit: >-
      El parque se puede visitar libremente a pie o en bicicleta; no hay entrada. Hay una red de senderos
      señalizados, con rutas de longitudes distintas que empiezan en las entradas, y por el parque pasan el
      sendero de gran recorrido 07 y la ciclovía del Danubio, que viene de Passau y sigue hasta Hungría por
      Hainburg.


      Un buen primer paseo es el sendero circular de Schönau: dos kilómetros, una hora, y queda impracticable
      durante las crecidas. En Eckartsau todavía se pueden recorrer las huellas históricas de los cazadores
      Habsburgo en los bosques de ribera, y Hainburg une paisajes muy distintos en poco espacio, donde el
      Danubio se estrecha entre el Braunsberg y el castillo de Devín. El mirador de Auterrasse, cerca de
      Stopfenreuth, es una plataforma de dos pisos protegida de las inundaciones, con vistas al río.


      Para ir acompañado, los rangers organizan caminatas, que cambian de tema según la estación, el tiempo y
      el nivel del agua, y son fáciles porque el terreno es llano. Las salidas temáticas con fecha fija cubren
      desde el canto de las aves en primavera hasta marchas nocturnas a la berrea otoñal. También hay
      excursiones en barca, en bote de goma o en barco. Las visitas guiadas se hacen en alemán, inglés y
      eslovaco.


      El centro del parque está en el castillo de Orth an der Donau, a 15 km de Viena. Abrió como centro del
      parque en 2005 y tiene la exposición «Im Fluss», que explica cómo el río trabaja, da forma a su paisaje
      y crea hábitats. Cierra del 2 de noviembre al 20 de marzo.
    history: >-
      Los estudios que siguieron a las protestas de 1984 mostraron que los humedales merecían ser parque
      nacional y que una central no era compatible con él. Los humedales del Danubio, March y Thaya y la baja
      Lobau son humedales Ramsar desde 1983, y el parque es categoría II de la UICN. Se prevé ampliar su
      superficie.
    before: >-
      Quédate en los senderos marcados; solo algunas rutas están autorizadas para bicicleta y solo algunas
      aguas para barcas sin motor. Las crecidas del Danubio cambian los programas y las rutas con poco aviso:
      comprueba el nivel del agua antes de ir y evita zonas donde pueda atraparte. Al caer la noche se pide
      dejar la actividad recreativa y evitar el ruido, para proteger a los animales de hábitos crepusculares o
      nocturnos. Desde la orilla sur se llega con el tren rápido S7 desde Viena en dirección Wolfsthal.
    around: >-
      A unos veinte kilómetros están los [Bosques de Viena - Macizos Núcleo](/lugar/wienerwald-core-forests/)
      y a unos veinticinco el [Parque Nacional Neusiedler See -
      Seewinkel](/lugar/nationalpark-neusiedler-see-seewinkel/).
  en:
    intro: >-
      In December 1984, thousands of citizens from all backgrounds occupied the riparian forests of
      Stopfenreuth to prevent a hydroelectric dam from severing Austria's last long, free-flowing stretch of
      the Danube. Police attempted evictions several times without success, and the federal government
      eventually halted construction. Twelve years later, on 27 October 1996, these wetlands were protected as
      Donau-Auen National Park. Today it safeguards more than 9,600 hectares stretching between Vienna and the
      mouth of the March river at the Slovak border.
    landscape: >-
      The Austrian Danube behaves like an alpine torrent: it drops around 40 cm per kilometre and rushes at 1
      to 3 metres per second. Through the national park it flows for thirty-eight kilometres and, at its
      narrowest points, spans only some 4 km across; wetlands are confined to the immediate riparian corridor.
      Water levels surge with the spring snowmelt through mid-summer, then recede. That natural pulse keeps
      the floodplain dynamic: side-arms form, gravel bars accumulate into islands, old meanders detach, and
      bare sand or shingle initiates ecological succession from pioneering herbs to willow carrs and mature
      hardwood forest.


      Prior to nineteenth-century regulation, the Danube branched into an ever-shifting braided network of
      main channels and backwaters. It was canalised to improve navigation and shield the arable Marchfeld
      plain from flooding, and from the fifties onward an almost continuous chain of hydropower dams impounded
      the river into reservoirs. Only the Wachau and this national park remain free.


      The resulting habitat is an intricate mosaic. Approximately 65 % of the park is alluvial forest, 15 %
      meadowland, and nearly 20 % open water. Willows, black poplars, and alders constitute the softwood
      floodplain forest, inundated several times each year; higher terraces support oaks, maples, ashes, and
      lindens. Deep gravel terraces foster semi-arid steppe grasslands with hawthorn, buckthorn, wild orchids,
      and feather grass, alongside praying mantises. Hay meadows cultivated for centuries also endure.
    wildlife: >-
      Commercial logging has ceased throughout the national park: the sole lumberjack at work is the [Eurasian
      beaver](/especie/castor_fiber/). Along the undercut banks of Schönau, late winter afternoons provide
      prime opportunities to spot one. Walking the Schönau trail reveals grey herons among reedbeds and, in
      winter, cormorants and [white-tailed eagles](/especie/haliaeetus_albicilla/). Having long ceased
      breeding in Austria, the white-tailed eagle has returned to nest in the park with up to six resident
      pairs.


      Other notable birds include the black kite, one of Austria's rarest raptors, and the [corn
      crake](/especie/crex_crex/), which lurks hidden in tall, damp meadows and is betrayed by its rasping
      nocturnal call. The park shelters Austria's last native breeding population of the [European pond
      turtle](/especie/emys_orbicularis/). The [Aesculapian snake](/especie/elaphe_longissima/) is frequently
      encountered along sunny woodland trail verges on south-facing slopes.


      In total, 39 mammal species, 100 breeding birds, eight reptiles, thirteen amphibians, 67 fish species,
      and 900 vascular plant species inhabit the park. The recommended season spans from spring to autumn.
    visit: >-
      You can explore the park freely on foot or by bicycle; there is no admission fee. A well-marked trail
      network branches from various gateway villages, and both the long-distance hiking trail 07 and the
      Danube Cycle Path, originating in Passau and extending to Hungary via Hainburg, pass through the park.


      An excellent introductory outing is the Schönau circular trail: two kilometres, one hour, though it
      becomes impassable during high water. At Eckartsau you can trace historical Habsburg imperial hunting
      tracks through riverside glades, while Hainburg condenses diverse scenery into a compact space where the
      Danube constricts between the Braunsberg and Devín Castle. The Auterrasse viewpoint near Stopfenreuth
      offers a two-storey flood-proof observation platform overlooking the main river.


      For guided exploration, park rangers lead interpretive walks that change according to season, weather,
      and river levels, remaining accessible as the terrain is flat. Scheduled themed excursions range from
      spring birdsong dawn walks to nocturnal deer-rutting outings in autumn. Boat trips in canoes, inflatable
      rafts, or traditional flat-bottomed wooden boats are available. Guided tours are conducted in German,
      English, and Slovak.


      The park visitor centre is located in the castle of Orth an der Donau, 15 km from Vienna. Opened in
      2005, it houses the interactive exhibition «Im Fluss», which illustrates river dynamics and habitat
      creation. It closes from 2 November to 20 March.
    history: >-
      Scientific studies following the 1984 protests confirmed that the alluvial wetlands possessed national
      park quality and that a hydroelectric barrage was fundamentally incompatible with them. The Danube,
      March, and Thaya river floodplains and the lower Lobau have been Ramsar wetlands since 1983, and the
      park holds IUCN Category II status. Future expansions of its protected territory are planned.
    before: >-
      Stick strictly to marked trails; cycling is permitted only along designated routes and boating is
      restricted to non-motorised craft on designated watercourses. Danube floods can alter schedules and
      trail access on short notice: check current water levels before setting out and avoid low-lying riparian
      tracts where you might become trapped. After nightfall visitors are requested to cease recreational
      activities and avoid noise to protect crepuscular and nocturnal wildlife. From the south bank, access is
      convenient via the S7 suburban railway from Vienna toward Wolfsthal.
    around: >-
      Roughly twenty kilometres away lie the [Vienna Woods Core Forests](/lugar/wienerwald-core-forests/), and
      some twenty-five kilometres distant spreads the [Neusiedler See - Seewinkel National
      Park](/lugar/nationalpark-neusiedler-see-seewinkel/).
  fr:
    intro: >-
      En décembre 1984, des milliers de personnes de tous âges et de tous horizons occupèrent les forêts
      alluviales de Stopfenreuth pour empêcher qu’un barrage hydroélectrique ne tronçonne le dernier grand
      secteur à écoulement libre du Danube en Autriche. Les forces de l’ordre tentèrent vainement de les
      déloger, et le gouvernement fédéral finit par suspendre les travaux. Douze ans plus tard, le 27 octobre
      1996, ces zones humides devinrent le Parc national Donau-Auen. Il protège aujourd’hui plus de 9 600
      hectares entre Vienne et le confluent de la rivière March, à la frontière slovaque.
    landscape: >-
      Le Danube autrichien se comporte comme un torrent alpin : il perd environ 40 cm par kilomètre et file à
      une vitesse de 1 à 3 mètres par seconde. Dans le parc, il déroule son cours sur trente-huit kilomètres
      et, dans ses parties les plus resserrées, ne mesure que 4 km de large ; les milieux alluviaux ne
      s’épanouissent qu’aux abords immédiats du fleuve. Les eaux montent avec la fonte printanière des neiges
      alpines jusqu’au cœur de l’été, puis refluent. Cette pulsation entretient la dynamique du paysage : de
      nouveaux bras s’ouvrent, des îles de gravier émergent, d’anciens méandres se referment, et sur les
      sables ou graviers neufs s’amorce une succession végétale allant des herbes pionnières aux saulaies puis
      à la forêt alluviale mûre.


      Avant les grands aménagements du dix-neuvième siècle, le Danube formait un réseau anastomosé de bras
      principaux et secondaires en perpétuel remaniement. Il fut canalisé pour faciliter la navigation et
      protéger les terres agricoles du Marchfeld, puis à partir des années cinquante une chaîne ininterrompue
      de barrages hydroélectriques l’a transformé en une succession de retenues d’eau. Seules la Wachau et ce
      parc national demeurent libres.


      Le résultat est une mosaïque écologique. Environ 65 % du parc est constitué de forêt alluviale, 15 % de
      prairies et près de 20 % d’eaux libres. Saules, peupliers noirs et aulnes composent la ripisylve tendre,
      inondée plusieurs fois l’an ; plus haut s’installent chênes, érables, frênes et tilleuls. Sur les
      terrasses de graviers profonds s’étendent des pelouses steppiques sèches où croissent aubépine, nerprun,
      orchidées et stipes, en compagnie de la mante religieuse. Les prairies fauvelées depuis des siècles s’y
      maintiennent également.
    wildlife: >-
      L’exploitation forestière a totalement cessé dans le parc : le seul bûcheron en action est désormais le
      [castor d’Europe](/especie/castor_fiber/). Sur les berges abruptes de Schönau, les fins d’après-midi
      d’hiver offrent d’excellentes occasions de l’observer. Le sentier de Schönau permet d’apercevoir des
      hérons cendrés dans les roselières et, en hiver, cormorans et [pygargues à queue
      blanche](/especie/haliaeetus_albicilla/). Disparu d’Autriche en tant que nicheur, le pygargue s’y
      reproduit de nouveau avec jusqu’à six couples résidents.


      Parmi les oiseaux figurent le milan noir, l’un des rapaces les plus rares d’Autriche, et le [râle des
      genêts](/especie/crex_crex/), dissimulé dans les hautes herbes des prairies humides et dont le cri
      rauque s’entend la nuit. Le parc abrite la dernière population reproductrice indigène de [cistude
      d’Europe](/especie/emys_orbicularis/) d’Autriche. La [couleuvre d’Esculape](/especie/elaphe_longissima/)
      s’observe couramment le long des lisières ensoleillées des forêts de versant sud.


      Au total, on dénombre 39 espèces de mammifères, 100 oiseaux nicheurs, huit reptiles, treize amphibiens,
      67 espèces de poissons et 900 plantes vasculaires. La période conseillée s’étend du printemps à
      l’automne.
    visit: >-
      Le parc se visite librement à pied ou à vélo ; l’accès est gratuit. Un réseau de sentiers balisés part
      des différents villages portes, et le chemin de grande randonnée 07 ainsi que la véloroute du Danube,
      venant de Passau et filant vers la Hongrie par Hainburg, traversent l’espace protégé.


      Une excellente première balade est la boucle de Schönau : deux kilomètres, une heure, impraticable en
      période de crue. À Eckartsau, vous marcherez sur les traces historiques des chasses impériales des
      Habsbourg dans les bois alluviaux, tandis qu’Hainburg concentre des paysages très contrastés là où le
      Danube se resserre entre le Braunsberg et le château de Devín. Le belvédère de l’Auterrasse, près de
      Stopfenreuth, offre une plate-forme d’observation sur deux étages à l’abri des crues, plongeant sur le
      fleuve.


      Pour des sorties accompagnées, les rangers organisent des randonnées thématiques faciles adaptées au
      relief plat. Les sorties programmées couvrent du chant des oiseaux au printemps jusqu’au brame du cerf
      en automne. Des excursions en barque traditionnelle en bois, en canoë ou en canot pneumatique sont
      également proposées. Les visites guidées se déroulent en allemand, en anglais et en slovaque.


      La maison du parc se situe dans le château d’Orth an der Donau, à 15 km de Vienne. Ouverte en 2005, elle
      héberge l’exposition « Im Fluss », qui illustre la dynamique fluviale et la naissance des habitats
      alluviaux. Elle est fermée du 2 novembre au 20 mars.
    history: >-
      Les expertises menées à la suite des contestations de 1984 ont prouvé la haute valeur écologique des
      forêts alluviales et l’incompatibilité d’un aménagement hydroélectrique. Les zones humides du Danube, de
      la March et de la Thaya ainsi que la basse Lobau sont inscrites sur la liste Ramsar depuis 1983, et le
      parc relève de la catégorie II de l’UICN. Des extensions futures de son périmètre sont prévues.
    before: >-
      Restez strictement sur les chemins balisés ; le vélo n’est autorisé que sur les pistes dédiées et la
      navigation réservée aux embarcations sans moteur sur les chenaux indiqués. Les crues du Danube peuvent
      modifier les conditions d’accès sans préavis : vérifiez le niveau des eaux avant votre venue et évitez
      les cuvettes où vous risqueriez d’être cerné. À la tombée de la nuit, vous êtes invité à cesser toute
      activité récréative et à éviter le bruit pour ménager la faune crépusculaire. Sur la rive sud, l’accès
      est facile avec le train de banlieue S7 depuis Vienne en direction de Wolfsthal.
    around: >-
      À une vingtaine de kilomètres s’élèvent les [Forêts centrales du
      Wienerwald](/lugar/wienerwald-core-forests/) et à environ vingt-cinq kilomètres s’étend le [Parc
      national de Neusiedler See - Seewinkel](/lugar/nationalpark-neusiedler-see-seewinkel/).
  de:
    intro: >-
      Im Dezember 1984 besetzten Tausende Menschen aller Generationen und Gesellschaftsschichten die
      Stopfenreuther Au, um zu verhindern, dass ein Wasserkraftwerk die letzte freie Fließstrecke der
      österreichischen Donau zerstört. Die Räumungsversuche der Polizei scheiterten, und die Bundesregierung
      verfügte schließlich den Baustopp. Zwölf Jahre später, am 27. Oktober 1996, wurde das Feuchtgebiet als
      Nationalpark Donau-Auen feierlich gegründet. Heute schützt er mehr als 9.600 Hektar zwischen Wien und
      der Marchmündung an der Grenze zur Slowakei.
    landscape: >-
      Die österreichische Donau gleicht einem Gebirgsfluss: Sie fällt um rund 40 cm pro Kilometer ab und
      strömt mit 1 bis 3 Metern pro Sekunde. Im Nationalpark legt sie achtunddreißig Kilometer zurück und
      misst an ihrer engsten Stelle kaum 4 km Breite; die Auenlandschaft säumt den unmittelbaren
      Flusskorridor. Mit der alpinen Schneeschmelze steigt das Wasser vom späten Frühjahr bis in den
      Hochsommer an und fällt danach wieder ab. Diese Pegelschwankungen halten die Au lebendig: Seitenarme
      spülen sich frei, Schotterbänke werden zu Inseln, Altarme trennen sich ab, und auf frischen Sand- oder
      Kiesbänken setzt eine Pflanzensukzession von Pionierkräutern über Weidengebüsche bis zum Hartholzauwald
      ein.


      Vor der Donauregulierung im neunzehnten Jahrhundert bildete der Strom ein weit verzweigtes Netz aus
      Haupt- und Nebenarmen, das sich fortwährend verlagerte. Zum Hochwasserschutz des Marchfeldes und für die
      Schifffahrt wurde er begradigt, und ab den fünfziger Jahren wandelte eine Kette von Kraftwerken die
      Donau in Staustufen um. Nur die Wachau und dieser Nationalpark blieben frei fließend erhalten.


      Das Schutzgebiet bildet ein vielfältiges Mosaik: Rund 65 % der Fläche entfallen auf Auwald, 15 % auf
      Wiesen und fast 20 % auf Gewässer. Weiden, Schwarzpappeln und Erlen formen die weiche Au, die mehrmals
      im Jahr überflutet wird; auf höheren Terrassen wachsen Eichen, Ahorne, Eschen und Linden. Auf
      tiefgründigen Schotterkörpern breiten sich trockene Heißländen mit Weißdorn, Kreuzdorn, Knabenkräutern,
      Federgras und Gottesanbeterinnen aus. Auch jahrhundertealte Wiesen blieben bewahrt.
    wildlife: >-
      Im Nationalpark gibt es keine forstliche Nutzung mehr: Der einzige verbliebene Holzfäller ist der
      [Biber](/especie/castor_fiber/). An den Steilufern bei Schönau bieten die späten Nachmittage im Winter
      hervorragende Chancen, ihn zu beobachten. Entlang des Schönauer Rundwegs lassen sich Graureiher im
      Schilf und im Winter Kormorane sowie [Seeadler](/especie/haliaeetus_albicilla/) erspähen. Der Seeadler,
      der in Österreich lange Zeit als Brutvogel ausgestorben war, nistet wieder mit bis zu sechs Paaren im
      Park.


      Zu den Besonderheiten gehören auch der seltene Schwarzmilan und der [Wachtelkönig](/especie/crex_crex/),
      der in feuchten Hochgraswiesen brütet und nachts durch seinen knarrenden Ruf auffällt. Der Park birgt
      das letzte autochthone Brutvorkommen der [Europäischen Sumpfschildkröte](/especie/emys_orbicularis/) in
      Österreich. Die [Äskulapnatter](/especie/elaphe_longissima/) sonnt sich häufig an warmen Wegrändern
      südlich exponierter Auwälder.


      Insgesamt leben 39 Säugetierarten, 100 Brutvogelarten, acht Reptilien, dreizehn Amphibien, 67 Fischarten
      und 900 Gefäßpflanzenarten im Park. Die beste Besuchszeit reicht vom Frühling bis in den Herbst.
    visit: >-
      Du kannst den Nationalpark zu Fuß oder mit dem Fahrrad kostenfrei erkunden; Eintritt wird nicht erhoben.
      Ein beschildertes Wegenetz verbindet die Eingangsorte, und der Weitwanderweg 07 sowie der Donauradweg
      von Passau nach Hainburg und Ungarn queren das Areal.


      Ein lohnender Einstieg ist der Rundweg Schönau: zwei Kilometer lang, Gehzeit eine Stunde, bei Hochwasser
      jedoch unpassierbar. In Eckartsau wandelt man auf den Spuren kaiserlicher Habsburger Jagden, während
      Hainburg dort, wo sich der Strom zwischen Braunsberg und Burg Devín verengt, spektakuläre
      Landschaftskontraste bietet. Die Auterrasse bei Stopfenreuth bietet eine zweistöckige, hochwassersichere
      Aussichtsplattform mit Blick auf den Hauptstrom.


      Nationalpark-Ranger bieten geführte Wanderungen an, die im ebenen Gelände leicht zu bewältigen sind. Das
      Themenprogramm reicht von Frühlingsstimmen der Vogelwelt bis zur herbstlichen Hirschbrunft. Auch
      Exkursionen in traditionellen Holz-Zillen, Schlauchbooten oder Kanus werden durchgeführt. Führungen
      finden auf Deutsch, Englisch und Slowakisch statt.


      Das Nationalparkzentrum befindet sich im Schloss Orth an der Donau, 15 km von Wien entfernt. Es wurde
      2005 eröffnet und beherbergt die interaktive Ausstellung «Im Fluss», die Gewässerdynamik und
      Auwaldökologie anschaulich erklärt. Geöffnet ist bis 2. November und wieder ab 20. März.
    history: >-
      Wissenschaftliche Untersuchungen nach den Protesten von 1984 bewiesen den herausragenden Wert der Auen
      und die Unvereinbarkeit mit einem Staustufenprojekt. Die Donau-March-Thaya-Auen sowie die Untere Lobau
      sind seit 1983 Ramsar-Gebiete, und der Park ist als IUCN-Kategorie II anerkannt. Flächenerweiterungen
      sind in Vorbereitung.
    before: >-
      Bleibe stets auf den markierten Wegen; Radfahren ist nur auf dafür freigegebenen Routen gestattet und
      Boote ohne Motor dürfen nur bestimmte Gewässer befahren. Hochwässer der Donau erfordern kurzfristige
      Programmänderungen: Erkundige dich vorab nach dem Pegelstand und meide Senken, in denen du vom Wasser
      abgeschnitten werden könntest. Bei Einbruch der Dämmerung solltest du Freizeitaktivitäten einstellen und
      Lärm vermeiden, um dämmerungsaktive Tiere zu schonen. Am Südufer erreichst du den Park bequem mit der
      Schnellbahn S7 ab Wien Richtung Wolfsthal.
    around: >-
      Rund zwanzig Kilometer westlich liegen die [Kernbereiche des
      Wienerwaldes](/lugar/wienerwald-core-forests/) und etwa fünfundzwanzig Kilometer südöstlich der
      [Nationalpark Neusiedler See - Seewinkel](/lugar/nationalpark-neusiedler-see-seewinkel/).
  it:
    intro: >-
      Nel dicembre 1984, migliaia di cittadini di ogni età ed estrazione occuparono i boschi golenali di
      Stopfenreuth per impedire che una centrale idroelettrica sbarrasse l’ultimo lungo tratto a corso libero
      del Danubio in Austria. La polizia tentò più volte lo sgombero senza riuscirvi, e il governo federale
      decise infine di bloccare i cantieri. Dodici anni dopo, il 27 ottobre 1996, queste zone umide divennero
      il Parco Nazionale Donau-Auen. Oggi tutela più di 9.600 ettari tra Vienna e la foce del fiume March al
      confine con la Slovacchia.
    landscape: >-
      Il Danubio austriaco scorre con l’impeto di un torrente alpino: perde circa 40 cm per chilometro e corre
      a una velocità compresa tra 1 e 3 metri al secondo. Nel parco si snoda per trentotto chilometri e, nel
      suo tratto più stretto, misura appena 4 km di larghezza; le golene si sviluppano a ridosso dell’alveo.
      Le acque salgono con lo scioglimento primaverile delle nevi fino a metà estate per poi ritirarsi. Tale
      pulsazione mantiene vivo il paesaggio: si aprono nuovi bracci fluviali, banchi di ghiaia formano isole,
      i meandri morti si isolano e sui depositi vergini di sabbia o ghiaia prende avvio la successione
      vegetale dalle erbe pioniere ai saliceti fino alla foresta matura.


      Prima delle canalizzazioni del diciannovesimo secolo, il Danubio disegnava un fitto reticolo
      anastomosato in perenne mutamento. Venne regimato per favorire la navigazione e preservare dalle
      inondazioni i coltivi del Marchfeld, e a partire dagli anni cinquanta una teoria quasi ininterrotta di
      bacini idroelettrici lo trasformò in invasi artificiali. Solo la Wachau e questo parco si mantengono a
      corrente libera.


      Il territorio costituisce un mosaico: circa il 65 % del parco è bosco ripariale, il 15 % prato umido e
      quasi il 20 % specchi d’acqua. Salici, pioppi neri e ontani formano la foresta golenale tenera, inondata
      più volte l’anno; sulle terrazze rilevate crescono querce, aceri, frassini e tigli. Su profondi depositi
      ghiaiosi allignano persino aride radure steppiche con biancospino, spino cervino, orchidee, lino delle
      fate e la mantide religiosa. Anche le praterie sfalciate da secoli continuano a prosperare.
    wildlife: >-
      La gestione forestale è stata azzerata nei boschi del parco: l’unico boscaiolo all’opera è il [castoro
      europeo](/especie/castor_fiber/). Sulle sponde erose di Schönau, i pomeriggi di fine inverno regalano
      splendide occasioni di avvistamento. Lungo il sentiero di Schönau si osservano aironi cenerini nei
      canneti e, d’inverno, cormorani e [aquile di mare](/especie/haliaeetus_albicilla/). Dopo una lunga
      assenza come nidificante in Austria, l’aquila di mare è tornata a riprodursi nel parco con fino a sei
      coppie stabili.


      Tra i volatili spiccano il nibbio bruno, tra i rapaci più rari d’Austria, e il [re di
      quaglie](/especie/crex_crex/), che trascorre la stagione celato nei prati umidi a erba alta facendosi
      udire di notte con il suo verso ritmico. Il parco ospita l’ultima popolazione riproduttiva indigena di
      [testuggine palustre europea](/especie/emys_orbicularis/) d’Austria. Il
      [saettone](/especie/elaphe_longissima/) si incontra sovente ai margini soleggiati dei sentieri nei
      boschi esposti a sud.


      In totale vivono nel parco 39 specie di mammiferi, 100 uccelli nidificanti, otto rettili, tredici
      anfibi, 67 specie ittiche e 900 piante vascolari. Il periodo ideale per le visite va dalla primavera
      all’autunno.
    visit: >-
      Il parco è visitabile liberamente a piedi o in bicicletta; l’ingresso è gratuito. Una rete di percorsi
      segnati si dirama dagli accessi periferici, e attraverso il parco corrono sia il sentiero
      escursionistico a lungo percorso 07 sia la ciclovia del Danubio, che scende da Passau e prosegue verso
      l’Ungheria via Hainburg.


      Una passeggiata introduttiva ideale è l’anello di Schönau: due chilometri, un’ora di cammino,
      impraticabile nei periodi di piena. A Eckartsau si possono ripercorrere i tracciati storici delle
      battute di caccia asburgiche nei boschi golenali, mentre Hainburg accorpa paesaggi contrastanti nel
      punto in cui il Danubio si stringe tra il Braunsberg e il castello di Devín. Il belvedere
      dell’Auterrasse a Stopfenreuth è una terrazza a due piani protetta dalle piene con vista sul fiume.


      Per approfondire, i guardaparco guidano escursioni tematiche facili grazie al terreno pianeggiante. Il
      calendario spazia dai cori d’uccelli primaverili alle uscite notturne per il bramito autunnale dei
      cervi. Sono possibili uscite in canoa, gommone o sulle tradizionali imbarcazioni di legno Zille. Le
      visite guidate si tengono in tedesco, inglese e slovacco.


      Il centro visite si trova nel castello di Orth an der Donau, a 15 km da Vienna. Inaugurato nel 2005,
      accoglie l’esposizione «Im Fluss», che descrive la forza modellatrice del fiume e la nascita degli
      habitat. È chiuso dal 2 novembre al 20 marzo.
    history: >-
      Le ricerche scientifiche scaturite dalle mobilitazioni del 1984 dimostrarono l’immenso valore naturale
      delle golene e l’inconciliabilità con un impianto idroelettrico. Le golene del Danubio, March e Thaya e
      la bassa Lobau sono siti Ramsar dal 1983, e l’area è protetta come parco nazionale di categoria II della
      IUCN. Sono previsti futuri ampliamenti della superficie protetta.
    before: >-
      Resta rigorosamente sui sentieri tracciati; l’uso della bici è consentito unicamente sulle piste
      indicate e le imbarcazioni a remi possono navigare solo sulle acque autorizzate. Le piene del Danubio
      impongono modifiche di programma con scarso preavviso: controlla il livello delle acque prima di
      metterti in cammino ed evita gli avvallamenti dove potresti rimanere isolato. Con l’avanzare
      dell’oscurità si richiede di cessare le attività ricreative ed evitare rumori per non disturbare la
      fauna selvatica. La sponda sud è comodamente raggiungibile con il treno suburbano S7 da Vienna verso
      Wolfsthal.
    around: >-
      A circa venti chilometri sorgono le [Aree Nucleo del Bosco Viennese](/lugar/wienerwald-core-forests/) e
      a circa venticinque chilometri si estende il [Parco Nazionale Neusiedler See -
      Seewinkel](/lugar/nationalpark-neusiedler-see-seewinkel/).
  pt:
    intro: >-
      Em dezembro de 1984, milhares de cidadãos de todas as idades e estratos sociais ocuparam as matas
      ribeirinhas de Stopfenreuth para impedir que uma barragem hidroelétrica seccionasse o último grande
      troço livre do Danúbio na Áustria. A polícia tentou desocupar a área várias vezes sem êxito, e o governo
      acabou por cancelar as obras. Doze anos mais tarde, a 27 de outubro de 1996, estas zonas húmidas foram
      protegidas como Parque Nacional Donau-Auen. Atualmente salvaguarda mais de 9.600 hectares entre Viena e
      a foz do rio March, na fronteira com a Eslováquia.
    landscape: >-
      O Danúbio austríaco exibe características de torrente alpina: perde cerca de 40 cm de cota por cada
      quilómetro e corre a 1 a 3 metros por segundo. No parque percorre trinta e oito quilómetros e, nos
      pontos mais estreitos, mede apenas cerca de 4 km de largura; as várzeas aluviais confinam-se às margens
      contíguas. O caudal sobe com o degelo alpino do final da primavera a meados do verão, voltando a baixar.
      Essa pulsação mantém a paisagem viva: abrem-se novos braços, ilhas de cascalho emergem, meandros antigos
      fecham-se e sobre depósitos de areia ou seixo inicia-se a sucessão vegetal desde ervas pioneiras até
      salgueirais e floresta ripícola madura.


      Antes das regularizações fluviais do século XIX, o Danúbio desenhava uma malha entrelaçada de canais em
      contínua transformação. Foi retificado para facilitar a navegação e salvaguardar de cheias as várzeas
      agrícolas de Marchfeld, e a partir dos anos cinquenta uma cadeia quase contínua de albufeiras
      hidroelétricas fragmentou o curso fluvial. Apenas a Wachau e este parque se mantêm livres de barragens.


      O mosaico resultante é riquíssimo: cerca de 65 % do parque é composto por floresta aluvial, 15 % por
      prados e quase 20 % por superfícies aquáticas. Salgueiros, choupos-negros e amieiros constituem a mata
      aluvial macia, submersa repetidas vezes ao ano; em patamares mais elevados medram carvalhos, áceres,
      freixos e tílias. Em terraços de cascalho profundo desenvolvem-se prados estépicos secos com pilriteiro,
      cáscara, orquídeas e estepas-de-penas, além do louva-a-deus. Os prados de feno cultivados há séculos
      continuam preservados.
    wildlife: >-
      O abate madeireiro foi completamente banido das matas do parque: o único lenhador no terreno é o
      [castor-europeu](/especie/castor_fiber/). Nas margens escarpadas de Schönau, os finais de tarde de
      inverno proporcionam ótimas ocasiões para o avistar. Ao longo do trilho de Schönau avistam-se
      garças-reais nos caniçais e, no inverno, corvos-marinhos e
      [águias-rabalvas](/especie/haliaeetus_albicilla/). Tendo deixado de nidificar na Áustria durante
      décadas, a águia-rabalva voltou a procriar no parque com até seis casais reprodutores.


      Nas aves contam-se ainda o milhafre-preto, uma das rapinas mais escassas da Áustria, e o
      [codornizão](/especie/crex_crex/), que permanece oculto nos prados húmidos de erva alta e se denuncia
      pelo chamamento noturno. O parque alberga a derradeira população reprodutora indígena do
      [cágado-europeu](/especie/emys_orbicularis/) na Áustria. A
      [cobra-de-esculápio](/especie/elaphe_longissima/) surge com frequência nas orlas soalheiras dos caminhos
      em vertentes viradas a sul.


      No total habitam o parque 39 espécies de mamíferos, 100 aves nidificantes, oito répteis, treze anfíbios,
      67 espécies de peixes e 900 plantas vasculares. A melhor época para visitar decorre da primavera ao
      outono.
    visit: >-
      Podes visitar o parque livremente a pé ou em bicicleta; o acesso é gratuito. Existe uma rede de trilhos
      sinalizados com partida em várias aldeias ribeirinhas, e pelo parque passam o trilho de longo curso 07 e
      a ciclovia do Danúbio, procedente de Passau e com destino à Hungria via Hainburg.


      Um passeio introdutório clássico é o percurso circular de Schönau: dois quilómetros, uma hora de
      duração, ficando intransitável durante cheias. Em Eckartsau podes seguir os trilhos históricos de caça
      dos imperadores Habsburgo pelas matas ripícolas, enquanto Hainburg reúne contrastes cénicos marcantes
      onde o Danúbio se afunila entre o Braunsberg e o castelo de Devín. O miradouro de Auterrasse, perto de
      Stopfenreuth, consiste numa plataforma de dois pisos elevada a salvo de inundações com vista para o
      leito do rio.


      Para visitas acompanhadas, os vigilantes organizam caminhadas temáticas fáceis pelo terreno plano. As
      atividades programadas vão desde a observação de aves na primavera até às saídas noturnas para escutar a
      brama dos veados no outono. Há também passeios de barco em canoas, botes insufláveis ou barcos
      tradicionais de madeira Zille. As visitas guiadas realizam-se em alemão, inglês e eslovaco.


      O centro do parque está sediado no castelo de Orth an der Donau, a 15 km de Viena. Inaugurado em 2005,
      acolhe a exposição interativa «Im Fluss», que elucida sobre a dinâmica das águas e a criação de habitats
      fluviais. Encontra-se encerrado de 2 de novembro a 20 de março.
    history: >-
      As investigações científicas realizadas após as mobilizações cívicas de 1984 comprovaram o valor
      ambiental das zonas aluviais e a incompatibilidade com a central hidroelétrica. As várzeas do Danúbio,
      March e Thaya e a baixa Lobau são sítios Ramsar desde 1983, detendo o parque a classificação de
      Categoria II da UICN. Encontram-se em estudo ampliações da sua área protegida.
    before: >-
      Mantém-te estritamente nos trilhos assinalados; a bicicleta só é permitida em rotas designadas e a
      navegação restringe-se a embarcações a remos nos canais autorizados. As cheias do Danúbio obrigam a
      alterações súbitas: confirma os níveis de água antes de partir e evita depressões onde possas ficar
      isolado pelas águas. Ao anoitecer deves suspender atividades recreativas e evitar ruídos para proteger a
      fauna de hábitos crepusculares. Pela margem sul o acesso é facilitado através do comboio suburbano S7 a
      partir de Viena rumo a Wolfsthal.
    around: >-
      A cerca de vinte quilómetros situam-se os [Bosques Centrais de
      Wienerwald](/lugar/wienerwald-core-forests/) e a cerca de vinte e cinco quilómetros estende-se o [Parque
      Nacional Neusiedler See - Seewinkel](/lugar/nationalpark-neusiedler-see-seewinkel/).
