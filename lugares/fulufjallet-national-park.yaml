    Old Tjikko é um clone de espruce de 9.550 anos que sobrevive no planalto rebentando continuamente a partir
    das raízes.
observaciones:
  es: >-
    Se puede acampar en cualquier lugar de la meseta, pero no junto a refugios y senderos. Está prohibido
    arrancar plantas y recoger musgos, líquenes y hongos que viven en la madera. En la meseta no hay
    papeleras: toda la basura debe volver contigo. El parque limita con el parque nacional vecino de
    Fulufjellet.
texto:
  es:
    intro: >-
      Hay montañas que se levantan y montañas que se quedan. Fulufjället es de las segundas: una meseta de
      arenisca de 900 a 1.000 metros, salpicada de cumbres redondeadas, cortada en seco por el sur y el este
      hasta caer unos 600 metros sobre el valle del Fuluälven. Queda lejos del mar, en Dalarna, a unos 25 km
      al oeste de Särna, y por eso su clima es continental y la nieve se queda entre 175 y 200 días al año.


      El parque se creó en 2002, abarca 385 km² y es el mayor fuera del condado de Norrbotten. Aquí hay un
      salto de 93 metros y, sobre la meseta, un abeto conocido como el más antiguo del mundo.
    landscape: >-
      La historia empieza hace 900 millones de años, cuando esta parte de la placa báltica estaba cerca del
      ecuador. El clima era desértico y el viento arrastraba al mar enormes cantidades de arena de las dunas,
      que se compactó en estratos horizontales de arenisca. Esa roca, tan distinta del granito y el gneis
      habituales de Suecia, está cruzada por diabasa, más resistente a la erosión y mucho más fértil para las
      plantas: por eso donde aflora la vegetación es más rica.


      Ni siquiera en lo más duro de la glaciación el hielo se movió con fuerza sobre el macizo; la erosión más
      marcada ocurrió en el Terciario, bajo un clima tropical. El resultado es una meseta poco marcada por el
      hielo, con hendiduras como la del salto de Njupeskär, donde el agua ha abierto una garganta profunda en
      las capas de arenisca.


      El punto más alto del lado sueco es Brattfjället, con 1.042 metros, seguido de Storhön, con 1.039. Sobre
      las alturas, los brezales de matorral, hierba y líquenes son únicos en la cordillera escandinava porque
      no los pastan los renos.


      Una noche de 1997 enseñó cuánto puede el agua aquí. Una tormenta extrema descargó la mayor lluvia en 24
      horas registrada en Suecia y arrasó la vegetación de las orillas de los arroyos. Hoy las huellas de
      erosión en el valle del Göljån se consideran una atracción, aunque el sendero sea difícil a tramos.
    wildlife: >-
      La meseta es país de líquenes: vastas alfombras de liquen de los renos y de fönsterlav, que aquí no
      sufren el pastoreo de renos domésticos. En el parque hay 395 especies de musgos y 421 de líquenes, y
      junto a la cascada crecen musgos, líquenes y plantas raras que viven de la bruma constante del agua.


      En la fauna destacan los grandes: el [oso pardo](/especie/ursus_arctos/) hiberna en cubiles de la ladera
      y el [lince](/especie/lynx_lynx/) frecuenta estos terrenos, mientras que el
      [alce](/especie/alces_alces/) pasa el verano en la montaña y baja en invierno a zonas con menos nieve.
      El [castor](/especie/castor_fiber/), desaparecido por la caza, ha recuperado su población original en
      las aguas del parque.


      Para las aves, el símbolo del parque es el arrendajo siberiano. Sobre la meseta anidan mosquitero
      musical, bisbita común y collalba gris, y con suerte chorlito dorado, chorlito carambolo, escribano
      nival y escribano lapón. El lagópodo escandinavo es relativamente común, y el [lagópodo
      alpino](/especie/lagopus_muta/) solo está en las cumbres más altas. En las laderas con bosque viven
      mirlo capiblanco, cuervo y [águila real](/especie/aquila_chrysaetos/). Junio es el mejor mes para
      observar aves, cuando regresan las migratorias, y la mejor temporada para caminar va de junio a
      septiembre.
    visit: >-
      La entrada principal, Njupeskärsentrén, está unos 25 km al oeste de Särna, y hay seis entradas más; solo
      Gördalen se alcanza en transporte público, y es un servicio flexible, mientras que las demás exigen
      vehículo propio. En la entrada principal está el naturum, que ofrece exposiciones, conferencias,
      actividades, visitas guiadas y consejos de rutas, y desde él parten muchos senderos de verano.


      El salto de Njupeskär mide 93 metros, 70 de ellos de caída libre. El sendero de Njupeskär lleva hasta el
      salto, y desde el área de descanso una rampa permite acercarse a verlo.


      El sendero del arrendajo siberiano sale del naturum y está totalmente adaptado. Más allá, la red del
      parque suma 140 kilómetros de senderos señalizados y quince refugios. Los refugios de paso de la meseta
      tienen estufa, leña, hacha y sierra, pero no son para pernoctar.
    history: >-
      Quien subió a esta meseta antes que tú dejó huellas: en el borde hay túmulos funerarios de la Edad del
      Hierro. Un círculo de piedras en lo alto, el «altarringen», se usó probablemente para capturar halcones,
      y hasta el siglo XIX se cazaban los gerifaltes casi blancos. Hasta hace no mucho había majadas de verano
      en la ladera de la montaña, donde se soltaba el ganado a pastar.


      El parque se dividió en cuatro zonas con normas distintas para acomodar a la población local. La mayor
      parte de la meseta es zona intocada, sin actividades que afecten a la naturaleza.
    before: >-
      Se puede acampar en cualquier lugar de la meseta, pero no junto a refugios y senderos. Está prohibido
      arrancar plantas y recoger musgos, líquenes y hongos que viven en la madera. En la meseta no hay
      papeleras: toda la basura debe volver contigo. El parque limita con el parque nacional vecino de
      Fulufjellet.
  en:
    intro: >-
      There are mountains that rise up and mountains that remain. Fulufjället belongs to the second kind: a
      sandstone plateau from 900 to 1,000 metres high, dotted with rounded summits and abruptly sheared on the
      south and east to plunge some 600 metres down to the Fuluälven valley. It lies far from the sea in
      Dalarna, about 25 km west of Särna, giving it a continental climate where snow lingers between 175 and
      200 days a year.


      The national park was established in 2002, covers 385 km², and is the largest in Sweden outside
      Norrbotten County. Here you find a 93-metre waterfall and, up on the high plateau, a spruce celebrated
      as the oldest tree on Earth.
    landscape: >-
      The story began 900 million years ago when this part of the Baltic Shield lay near the equator. The
      climate was arid, and wind swept immense quantities of dune sand into the sea, where it compacted into
      horizontal sandstone beds. This rock, completely unlike Sweden's prevalent granites and gneisses, is
      threaded with diabase intrusions, which resist erosion and break down into fertile soils where
      vegetation flourishes.


      Even during the harshest Pleistocene glaciations, the ice sheet barely moved across the massif; the most
      prominent erosion occurred during the Tertiary under a tropical climate. The result is a plateau little
      modified by glaciers, notched by chasms like Njupeskär, where water has carved a sheer canyon through
      sandstone strata.


      The highest peak on the Swedish side is Brattfjället at 1,042 metres, followed by Storhön at 1,039.
      Across the heights, heathlands of dwarf shrubs, graminoids, and lichens are unique in the Scandes
      because they are never grazed by domestic reindeer.


      A single night in 1997 demonstrated the sheer power of water here. An extraordinary thunderstorm
      unloaded Sweden's heaviest 24-hour rainfall on record, stripping streamside vegetation bare. Today the
      erosional scars in the Göljån valley are an attraction, though the trail is challenging in parts.
    wildlife: >-
      The high plateau is a realm of lichens: expansive carpets of reindeer moss and *fönsterlav* (*Cladonia
      stellaris*), undamaged by reindeer grazing. The park hosts 395 moss species and 421 lichen species, and
      around the waterfall rare mosses, lichens, and vascular plants thrive in the constant mist.


      Prominent large mammals include the [brown bear](/especie/ursus_arctos/), which dens on the slopes, and
      the [Eurasian lynx](/especie/lynx_lynx/), which roams the terrain, while the
      [moose](/especie/alces_alces/) spends summers on high ground before retreating to lower valleys with
      less snow. The [Eurasian beaver](/especie/castor_fiber/), once exterminated by hunting, has reclaimed
      its original population in park waterways.


      Among birds, the park's emblem is the Siberian jay. Willow warblers, meadow pipits, and northern
      wheatears nest across the plateau, and with luck you may spot European golden plover, dotterel, snow
      bunting, and Lapland longspur. Willow ptarmigan is relatively common, whereas the [rock
      ptarmigan](/especie/lagopus_muta/) frequents only the highest windswept summits. Forested slopes shelter
      ring ouzel, raven, and the [golden eagle](/especie/aquila_chrysaetos/). June is prime time for
      birdwatching as migrants arrive, while the finest hiking season extends from June to September.
    visit: >-
      The main gateway, Njupeskärsentrén, lies about 25 km west of Särna, and there are six further entrances;
      only Gördalen has public transport (an on-demand bus), while the others require your own vehicle. At the
      main entrance stands the naturum visitor centre, offering exhibitions, talks, activities, guided walks,
      and trail advice, and serving as the trailhead for summer hikes.


      Njupeskär waterfall drops 93 metres, with 70 metres in uninterrupted free fall. The Njupeskär trail
      leads directly to the cascade, where a boardwalk and viewing platform provide close-up views.


      The Siberian Jay trail begins at the naturum and is fully accessible. In total, the park network
      features 140 kilometres of marked trails and fifteen shelter huts. Plateau day-shelters are equipped
      with wood stoves, firewood, axes, and saws, though overnight stays are not permitted.
    history: >-
      Those who walked this plateau before you left enduring traces: the plateau rim preserves Iron Age burial
      cairns. A stone circle high up, known as the «altarringen», was likely built to trap falcons, and
      almost-white gyrfalcons were hunted here until the nineteenth century. Until relatively recently, summer
      shielings operated on the slopes, where cattle were turned out to graze.


      The park was zoned into four distinct management areas to accommodate local traditions. Most of the
      plateau constitutes an untamed wilderness zone free from activities that alter natural processes.
    before: >-
      Wild camping is permitted anywhere on the plateau, but not right next to shelters or trailheads. Picking
      plants, mosses, lichens, and wood-decay fungi is forbidden. There are no rubbish bins on the plateau:
      carry all waste back with you. The park directly borders Fulufjellet National Park across the Norwegian
      boundary.
  fr:
    intro: >-
      Il y a des montagnes qui s'élèvent et d'autres qui restent. Fulufjället appartient à la seconde
      catégorie : un plateau de grès s'étageant de 900 à 1 000 mètres, parsemé de sommets arrondis et
      abruptement tronqué au sud et à l'est jusqu'à plonger d'environ 600 mètres vers la vallée du Fuluälven.
      Éloigné de la mer, en Dalécarlie, à environ 25 km à l'ouest de Särna, il connaît un climat continental
      où la neige persiste entre 175 et 200 jours par an.


      Créé en 2002, le parc couvre 385 km² et constitue le plus vaste parc national suédois en dehors du comté
      de Norrbotten. On y trouve une chute d'eau de 93 mètres et, sur les hauteurs du plateau, un épicéa
      réputé comme le plus ancien arbre au monde.
    landscape: >-
      L'histoire débute il y a 900 millions d'années, lorsque cette partie du bouclier scandinave se situait
      près de l'équateur. Le climat était désertique et les vents poussaient vers la mer d'immenses volumes de
      sable dunaire, qui se sont consolidés en strates horizontales de grès. Cette roche, si différente des
      granites et gneiss dominants en Suède, est recoupée de filons de diabase, plus résistants à l'érosion et
      bien plus fertiles pour la végétation : là où elle affleure, la flore y est nettement plus opulente.


      Même au paroxysme des glaciations, les calottes de glace se sont peu déplacées sur le massif ; l'érosion
      la plus marquée s'est produite au Tertiaire sous un climat tropical. Il en résulte un plateau peu raboté
      par les glaciers, entaillé de gorges comme celle de la cascade de Njupeskär, où les eaux ont creusé un
      canyon profond dans les bancs de grès.


      Le point culminant du côté suédois est le Brattfjället à 1 042 mètres, suivi du Storhön à 1 039. Sur les
      crêtes, les landes de sous-arbrisseaux, d'herbacées et de lichens sont uniques dans les Alpes
      scandinaves car les rennes n'y pâturent pas.


      Une nuit de 1997 a rappelé toute la force de l'eau. Un violent orage a déversé les précipitations les
      plus intenses en 24 heures jamais enregistrées en Suède, balayant la végétation ripisylve. Aujourd'hui,
      les traces de crue dans la vallée du Göljån constituent une curiosité géologique, bien que le sentier
      s'avère par endroits escarpé.
    wildlife: >-
      Le plateau est le royaume des lichens : d'immenses tapis de lichen des rennes et de *fönsterlav*
      (*Cladonia stellaris*), préservés du pâturage des troupeaux domestiques. Le parc abrite 395 espèces de
      mousses et 421 de lichens, et près de la cascade prospèrent des mousses et plantes rares nourries par
      les embruns permanents.


      Parmi les grands mammifères, l'[ours brun](/especie/ursus_arctos/) hiverne dans des tanières de versant
      et le [lynx boréal](/especie/lynx_lynx/) parcourt le massif, tandis que l'[élan](/especie/alces_alces/)
      passe l'été sur les hauteurs avant de redescendre en hiver vers les vallées moins enneigées. Le [castor
      d'Eurasie](/especie/castor_fiber/), jadis éradiqué par la chasse, a retrouvé ses effectifs d'origine
      dans les cours d'eau du parc.


      Pour l'avifaune, l'emblème du parc est le mésangeai imitateur. Pouillots fitis, pipits farlouses et
      traquets motteux nichent sur le plateau, accompagnés avec un peu de chance du pluvier doré, du guignard
      d'Eurasie, du plectrophane des neiges et du plectrophane lapon. Le lagopède des saules est assez commun,
      tandis que le [lagopède alpin](/especie/lagopus_muta/) se cantonne aux plus hauts sommets. Sur les
      pentes boisées vivent le merle à plastron, le grand corbeau et l'[aigle
      royal](/especie/aquila_chrysaetos/). Juin est le mois idéal pour observer les oiseaux à l'arrivée des
      migrateurs, et la meilleure saison de randonnée s'étend de juin à septembre.
    visit: >-
      L'entrée principale, Njupeskärsentrén, se trouve à environ 25 km à l'ouest de Särna, et il existe six
      autres accès ; seul Gördalen est desservi par les transports publics (sur réservation), les autres
      nécessitant un véhicule individuel. À l'entrée principale, le naturum propose des expositions, des
      conférences, des activités, des visites accompagnées et des conseils d'itinéraires, tout en servant de
      point de départ aux sentiers d'été.


      La cascade de Njupeskär atteint 93 mètres de haut, dont 70 mètres en chute libre. Le sentier de
      Njupeskär mène au pied du saut, où un platelage et un belvédère permettent de l'approcher de près.


      Le sentier du Mésangeai part du naturum et est entièrement accessible. Au-delà, le réseau du parc compte
      140 kilomètres de sentiers balisés et quinze refuges. Les abris du plateau disposent d'un poêle, de
      bois, d'une hache et d'une scie, mais ne sont pas destinés à y passer la nuit.
    history: >-
      Ceux qui ont parcouru ce plateau avant vous y ont laissé des traces : la bordure conserve des cairns
      funéraires de l'âge du fer. Un cercle de pierres en altitude, l'« altarringen », servait sans doute de
      piège à faucons, et des faucons gerfauts au plumage presque blanc y furent chassés jusqu'au XIXe siècle.
      Jusqu'à une époque récente, des chalets d'alpage estivaux fonctionnaient sur les versants de la montagne
      pour la mise à l'herbe du bétail.


      Le parc a été découpé en quatre zones de gestion distinctes pour concilier la protection et les usages
      locaux. La majeure partie du plateau constitue une zone sauvage intégrale exempte d'activités modifiant
      la nature.
    before: >-
      Le bivouac est autorisé partout sur le plateau, sauf à proximité immédiate des refuges et des sentiers.
      Il est interdit d'arracher des plantes et de prélever mousses, lichens et champignons lignicoles. Le
      plateau ne dispose d'aucune poubelle : emportez tous vos déchets. Le parc est contigu au parc national
      norvégien de Fulufjellet.
  de:
    intro: >-
      Es gibt Berge, die sich auftürmen, und Berge, die verharren. Fulufjället gehört zu den zweiten: Eine
      Sandsteinhochebene von 900 bis 1.000 Metern Höhe, übersät mit gerundeten Kuppen, die nach Süden und
      Osten unvermittelt abbricht und rund 600 Meter tief ins Fuluälven-Tal abfällt. Sie liegt weit vom Meer
      entfernt in Dalarna, rund 25 km westlich von Särna, weshalb ihr Klima kontinental ist und der Schnee an
      175 bis 200 Tagen im Jahr liegen bleibt.


      Der Nationalpark wurde 2002 eingerichtet, umfasst 385 km² und ist der größte Park Schwedens außerhalb
      der Provinz Norrbotten. Hier befinden sich ein Wasserfall von 93 Metern und auf der Hochfläche eine
      Fichte, die als ältester Baum der Welt gilt.
    landscape: >-
      Die Geschichte begann vor 900 Millionen Jahren, als dieser Teil des Baltischen Schildes nahe dem Äquator
      lag. Das Klima war wüstenhaft trocken, und Winde wehten ungeheure Mengen Dünensand ins Meer, die sich zu
      horizontalen Sandsteinbänken verfestigten. Dieses Gestein, so grundverschieden von den in Schweden
      üblichen Graniten und Gneisen, wird von Diabasgängen durchzogen, die widerstandsfähiger gegen
      Verwitterung sind und fruchtbare Böden bilden, auf denen die Vegetation üppiger gedeiht.


      Selbst während des Höhepunkts der Eiszeit bewegte sich das Inlandeis auf dem Massiv kaum; die stärkste
      Verwitterung geschah im Tertiär unter tropischem Klima. Das Ergebnis ist eine vom Eis wenig geschliffene
      Hochebene mit Einschnitten wie jenem am Njupeskär-Fall, wo das Wasser eine tiefe Schlucht in die
      Sandsteinlagen gegraben hat.


      Der höchste Punkt auf schwedischer Seite ist der Brattfjället mit 1.042 Metern, gefolgt vom Storhön mit
      1.039. Auf den Höhen sind Zwergstrauch-, Gras- und Flechtenheiden einzigartig im Skandinavischen
      Gebirge, weil sie nicht von Rentieren beweidet werden.


      Eine einzige Nacht im Jahr 1997 zeigte die Gewalt des Wassers. Ein extremes Unwetter brachte die
      stärksten Niederschläge innerhalb von 24 Stunden, die je in Schweden gemessen wurden, und riss die
      Ufervegetation der Bäche mit sich fort. Heute gelten die Erosionsspuren im Göljån-Tal als geologische
      Sehenswürdigkeit, auch wenn der Pfad abschnittsweise beschwerlich ist.
    wildlife: >-
      Die Hochebene ist Flechtenland: Weite Teppiche aus Rentierflechten und *fönsterlav* (*Cladonia
      stellaris*), die hier nicht durch Rentierherden zertrampelt werden. Im Park gibt es 395 Moosarten und
      421 Flechtenarten, und am Wasserfall gedeihen seltene Moose und Pflanzen in der ständigen Gischt.


      Unter den Großsäugern ragt der [Braunbär](/especie/ursus_arctos/) heraus, der in Hanghöhlen überwintert,
      und der [Eurasische Luchs](/especie/lynx_lynx/) streift durch das Gelände, während der
      [Elch](/especie/alces_alces/) den Sommer auf der Höhe verbringt und im Winter in schneeärmere Täler
      hinabzieht. Der [Biber](/especie/castor_fiber/), einst durch Jagd ausgerottet, hat seinen ursprünglichen
      Bestand an den Gewässern des Parks wiedererlangt.


      Das Wappentier des Parks ist der Unglückshäher. Fitis, Wiesenpieper und Steinschmätzer brüten auf der
      Hochfläche, mit etwas Glück auch Goldregenpfeifer, Mornellregenpfeifer, Schneeammer und Spornammer. Das
      Moorschneehuhn ist relativ häufig, während das [Alpenschneehuhn](/especie/lagopus_muta/) nur die
      höchsten Gipfel besiedelt. An den bewaldeten Hängen leben Ringdrossel, Kolkrabe und
      [Steinadler](/especie/aquila_chrysaetos/). Der Juni ist der beste Monat für die Vogelbeobachtung bei der
      Rückkehr der Zugvögel, und die beste Wanderzeit reicht von Juni bis September.
    visit: >-
      Der Haupteingang, Njupeskärsentrén, liegt etwa 25 km westlich von Särna, und es gibt sechs weitere
      Eingänge; nur Gördalen ist mit öffentlichen Verkehrsmitteln (Rufbus) erreichbar, während alle anderen
      ein eigenes Fahrzeug erfordern. Am Haupteingang bietet das naturum Ausstellungen, Vorträge, Führungen
      und Routenberatung und bildet den Ausgangspunkt der Sommerwege.


      Der Wasserfall Njupeskär stürzt 93 Meter in die Tiefe, davon 70 Meter im freien Fall. Der Njupeskär-Weg
      führt direkt zum Fall, wo eine Holzplattform und Rastplätze ein nahes Herantreten erlauben.


      Der Unglückshäher-Pfad beginnt am naturum und ist vollständig barrierefrei. Insgesamt umfasst das
      Wegenetz 140 Kilometer markierte Pfade und fünfzehn Rasthütten. Die offenen Schutzhütten der Hochfläche
      verfügen über Ofen, Brennholz, Axt und Säge, sind jedoch nicht zur Übernachtung gedacht.
    history: >-
      Wer diese Hochfläche vor dir betrat, hinterließ Spuren: Am Rand liegen Grabhügel aus der Eisenzeit. Ein
      Steinkreis in der Höhe, der «altarringen», diente vermutlich dem Fang von Jagdfalken, und fast weiße
      Gerfalken wurden hier bis ins neunzehnte Jahrhundert gejagt. Bis vor nicht allzu langer Zeit bestanden
      Almen an den Berghängen, auf denen das Vieh im Sommer weidete.


      Der Park wurde in vier Zonen mit abgestuften Regeln unterteilt, um den Bedürfnissen der örtlichen
      Bevölkerung Rechnung zu tragen. Der Großteil der Hochfläche ist unberührte Wildniszone ohne
      landschaftsverändernde Eingriffe.
    before: >-
      Zelten ist überall auf der Hochebene gestattet, jedoch nicht in unmittelbarer Nähe von Schutzhütten und
      Wegen. Das Ausreißen von Pflanzen sowie das Sammeln von Moosen, Flechten und holzbewohnenden Pilzen ist
      verboten. Auf der Hochebene gibt es keine Mülleimer: Nimm alle Abfälle wieder mit. Der Park grenzt
      direkt an den norwegischen Nationalpark Fulufjellet an.
  it:
    intro: >-
      Vi sono montagne che si innalzano e montagne che resistono immutabili. Fulufjället appartiene al secondo
      gruppo: un altopiano di arenaria tra 900 e 1.000 metri di quota, punteggiato da rilievi arrotondati,
      troncato di netto a sud e a est fino a precipitare per circa 600 metri sulla valle del Fuluälven. Sorge
      lontano dal mare, nel Dalarna, a circa 25 km a ovest di Särna, godendo di un clima continentale dove la
      neve permane tra 175 e 200 giorni all'anno.


      Il parco nazionale è stato istituito nel 2002, occupa 385 km² ed è il più esteso della Svezia al di
      fuori della contea di Norrbotten. Vi si trovano un salto d'acqua di 93 metri e, sull'altopiano, un abete
      rosso celebrato come il più antico del pianeta.
    landscape: >-
      La vicenda ebbe inizio 900 milioni di anni fa, quando questa porzione dello scudo baltico si trovava in
      prossimità dell'equatore. Il clima era desertico e il vento spazzava verso il mare immani volumi di
      sabbia dunare, poi cementatasi in strati orizzontali di arenaria. Questa roccia, così differente dai
      graniti e gneiss consueti in Svezia, è intersecata da filoni di diabase, più resistenti all'erosione e
      assai più fertili per i suoli vegetali: dove affiora, la flora è sensibilmente più rigogliosa.


      Nemmeno durante le fasi glaciali più severe la coltre di ghiaccio si mosse con forza sul massiccio;
      l'erosione più marcata risale al Terziario sotto un clima tropicale. Ne deriva un altopiano appena
      scalfito dai ghiacciai, inciso da forre come quella del salto di Njupeskär, dove l'acqua ha scavato una
      profonda gola nei banchi di arenaria.


      La vetta più alta sul versante svedese è il Brattfjället con 1.042 metri, seguito dallo Storhön con
      1.039. Sulle creste, le brughiere di arbusti nani, erbe e licheni sono uniche nella catena scandinava
      poiché non vengono pascolate dalle renne.


      Una sola notte del 1997 ha rammentato la potenza delle acque. Un nubifragio eccezionale ha scaricato le
      maggiori precipitazioni in 24 ore mai registrate in Svezia, spazzando via la vegetazione riparia. Oggi
      le tracce di piena nella valle del Göljån costituiscono una meta geologica, benché il sentiero presenti
      tratti impegnativi.
    wildlife: >-
      L'altopiano è il dominio dei licheni: sconfinati tappeti di lichene delle renne e di *fönsterlav*
      (*Cladonia stellaris*), risparmiati dal calpestio delle mandrie domestiche. Il parco ospita 395 specie
      di muschi e 421 di licheni, e accanto alla cascata prosperano muschi e specie rare alimentati dalla
      nebulizzazione continua delle acque.


      Tra i grandi mammiferi spiccano l'[orso bruno](/especie/ursus_arctos/), che sverna in cavità sui
      versanti, e la [lince eurasiatica](/especie/lynx_lynx/), mentre l'[alce](/especie/alces_alces/)
      trascorre l'estate in quota per poi scendere in inverno verso valli con meno neve. Il [castoro
      europeo](/especie/castor_fiber/), un tempo estirpato dalla caccia, ha ricostituito la consistenza
      originaria nei corsi d'acqua del parco.


      Tra i volatili, l'araldo del parco è la ghiandaia siberiana. Luì grossi, pispole e culbianchi nidificano
      sull'altopiano, affiancati con un po' di fortuna da piviere dorato, piviere tortolino, zigolo delle nevi
      e zigolo di Lapponia. La pernice bianca nordica è relativamente comune, mentre la [pernice
      bianca](/especie/lagopus_muta/) vive soltanto sulle creste rocciose più elevate. Lungo i versanti
      forestati compaiono merlo dal collare, corvo imperiale e [aquila reale](/especie/aquila_chrysaetos/).
      Giugno è il mese migliore per il birdwatching con l'arrivo dei migratori, e la stagione ideale per
      camminare va da giugno a settembre.
    visit: >-
      L'accesso principale, Njupeskärsentrén, si trova a circa 25 km a ovest di Särna, e vi sono altri sei
      punti di ingresso; solo Gördalen è raggiungibile con mezzi pubblici (servizio su prenotazione), mentre
      gli altri richiedono un veicolo privato. All'ingresso principale sorge il naturum, che propone mostre,
      conferenze, laboratori, visite guidate e consulenze escursionistiche, fungendo da snodo dei sentieri
      estivi.


      La cascata di Njupeskär è alta 93 metri, con 70 metri di salto libero nel vuoto. Il sentiero di
      Njupeskär conduce fin sotto il getto, dove una passerella in legno agevola l'avvicinamento.


      Il sentiero della Ghiandaia siberiana si sviluppa dal naturum ed è integralmente accessibile. Nel
      complesso, la rete conta 140 chilometri di tracciati segnati e quindici rifugi aperti. I bivacchi
      dell'altopiano dispongono di stufa, legna, scure e sega, ma non sono adibiti al pernottamento.
    history: >-
      Chi ha calpestato questo altopiano prima di te vi ha lasciato segni duraturi: lungo il ciglio si
      conservano tumuli funerari dell'età del ferro. Un circolo di pietre in quota, l'«altarringen», serviva
      verosimilmente alla cattura dei falchi, e i girfalchi dal piumaggio candido furono cacciati qui fino al
      XIX secolo. Fino a epoche recenti erano attivi alpeggi estivi sui fianchi della montagna per la
      monticazione del bestiame.


      Il parco è stato ripartito in quattro zone gestionali distinte per armonizzare la tutela con gli usi
      della popolazione locale. La massima parte dell'altopiano forma una riserva integrale priva di
      interventi che alterino i processi naturali.
    before: >-
      Il campeggio libero è consentito ovunque sull'altopiano, ma non nelle adiacenze immediate di rifugi e
      sentieri. È proibito strappare piante e raccogliere muschi, licheni o funghi lignicoli. Sull'altopiano
      non vi sono cestini: riporta a valle ogni rifiuto. Il parco confina direttamente con l'omologo parco
      nazionale norvegese di Fulufjellet.
  pt:
    intro: >-
      Há montanhas que se erguem e montanhas que permanecem. Fulufjället pertence ao segundo grupo: um
      planalto de arenito entre 900 e 1.000 metros de altitude, salpicado de cumes arredondados e abruptamente
      cortado a sul e a leste até cair cerca de 600 metros sobre o vale do Fuluälven. Fica distante do mar, em
      Dalarna, cerca de 25 km a oeste de Särna, gozando de um clima continental onde a neve permanece entre
      175 e 200 dias por ano.


      O parque nacional foi criado em 2002, abrange 385 km² e é o maior da Suécia fora do condado de
      Norrbotten. Aqui existe uma cascata de 93 metros e, no cimo do planalto, um espruce reputado como a
      árvore mais antiga do mundo.
    landscape: >-
      A história começou há 900 milhões de anos, quando esta parcela do escudo báltico se encontrava perto do
      equador. O clima era desértico e o vento arrastava para o mar volumes imensos de areia dunar, que se
      consolidaram em estratos horizontais de arenito. Esta rocha, tão distinta dos granitos e gnaisses
      habituais na Suécia, está entrecortada por diabases, mais resistentes à erosão e geradoras de solos
      férteis onde a vegetação medra com vigor.


      Nem no auge das glaciações o manto de gelo se moveu com força sobre o maciço; a erosão mais pronunciada
      ocorreu no Terciário sob clima tropical. O resultado é um planalto pouco desgastado pelos glaciares,
      talhado por gargantas como a da cascata de Njupeskär, onde a água rasgou um desfiladeiro fundo nos
      bancos de arenito.


      O ponto culminante no lado sueco é Brattfjället com 1.042 metros, seguido por Storhön com 1.039. Nas
      alturas, as charnecas de arbustos anões, gramíneas e líquenes são únicas na cordilheira escandinava por
      não serem pastadas por renas domésticas.


      Uma única noite de 1997 demonstrou o poderio das águas. Uma tempestade torrencial descarregou a maior
      precipitação em 24 horas alguma vez registada na Suécia, varrendo a vegetação ribeirinha. Hoje, os
      vestígios da cheia no vale do Göljån constituem uma atração geológica, embora o trilho se revele difícil
      em certos troços.
    wildlife: >-
      O planalto é o reino dos líquenes: vastos tapetes de líquen-das-renas e de *fönsterlav* (*Cladonia
      stellaris*), isentos de pisoteio por manadas domésticas. O parque acolhe 395 espécies de musgos e 421 de
      líquenes, e junto à cascata medram musgos e plantas raras sustentados pela pulverização contínua da
      água.


      Nos grandes mamíferos destacam-se o [urso-pardo](/especie/ursus_arctos/), que hiberna em covas nas
      encostas, e o [lince-euroasiático](/especie/lynx_lynx/), enquanto o [alce](/especie/alces_alces/) passa
      o verão nas terras altas e desce no inverno para vales com menos neve. O
      [castor-europeu](/especie/castor_fiber/), outrora extirpado pela caça, restabeleceu a sua população
      original nas linhas de água do parque.


      Nas aves, o símbolo do parque é o gaio-siberiano. Felosas-muscadas, petinhas-dos-prados e
      chasco-cinzento nidificam no planalto, avistando-se com sorte tarambola-dourada,
      tarambola-caranguejeira, escrevedeira-das-neves e escrevedeira-da-lapónia. A perdiz-dos-sauces é
      relativamente comum, ao passo que a [perdiz-nival](/especie/lagopus_muta/) habita exclusivamente os
      cumes mais expostos. Nas encostas arborizadas ocorrem melro-de-peito-branco, corvo-comum e a
      [águia-real](/especie/aquila_chrysaetos/). Junho é o mês ideal para observação de aves com a chegada das
      migradoras, estendendo-se a melhor época de caminhada de junho a setembro.
    visit: >-
      A entrada principal, Njupeskärsentrén, situa-se a cerca de 25 km a oeste de Särna, existindo outras seis
      entradas; apenas Gördalen é servida por transportes públicos (a pedido), exigindo as demais transporte
      próprio. Na entrada principal o naturum disponibiliza exposições, palestras, atividades, percursos
      guiados e recomendações de itinerários, funcionando como ponto de partida dos trilhos de verão.


      A cascata de Njupeskär mede 93 metros de desnível, 70 dos quais em queda livre. O trilho de Njupeskär
      conduz até à queda de água, onde passadiços e miradouros facultam uma aproximação segura.


      O trilho do Gaio-siberiano parte do naturum e está adaptado a mobilidade reduzida. No conjunto, a rede
      do parque soma 140 quilómetros de trilhos sinalizados e quinze abrigos de montanha. Os abrigos de
      passagem no planalto possuem fogão a lenha, lenha, machado e serra, mas não se destinam a pernoita.
    history: >-
      Quem subiu a este planalto antes de ti deixou pegadas: a bordadura conserva mamoas da Idade do Ferro. Um
      círculo de pedras no cimo, o «altarringen», serviu provavelmente para a captura de falcões, tendo-se
      caçado aqui gerifaltes de plumagem quase alva até ao século XIX. Até há pouco tempo mantinham-se
      pastagens de verão nas encostas, onde o gado subia para pastar.


      O parque foi estruturado em quatro zonas com normas diferenciadas para integrar as comunidades locais. A
      maior parte do planalto é zona virgem intocada, livre de atividades que interfiram com a natureza.
    before: >-
      É permitido acampar em qualquer ponto do planalto, exceto nas imediações diretas de abrigos e trilhos. É
      proibido arrancar plantas e colher musgos, líquenes ou fungos lignícolas. No planalto não há caixotes de
      lixo: traz todos os detritos contigo. O parque confina diretamente com o contíguo Parque Nacional
      Fulufjellet, na Noruega.
