resumen:
  es: >-
    Alberga *Old Tjikko* (el árbol clonal más antiguo conocido del planeta con casi 9.550 años de antigüedad)
    y la cascada Njupeskär (93 m).
  en: >-
    Home to *Old Tjikko* (the planet's oldest known clonal tree at nearly 9,550 years old) and the Njupeskär
    waterfall (93 m).
  fr: >-
    Abrite *Old Tjikko* (l'arbre clonal le plus ancien connu sur Terre avec près de 9 550 ans) et la cascade
    de Njupeskär (93 m).
  de: >-
    Beherbergt *Old Tjikko* (den mit fast 9.550 Jahren ältesten bekannten Klonbaum der Erde) und den
    Wasserfall Njupeskär (93 m).
  it: >-
    Custodisce *Old Tjikko* (l'albero clonale più antico conosciuto sulla Terra con quasi 9.550 anni) e la
    cascata Njupeskär (93 m).
  pt: >-
    Alberga *Old Tjikko* (a árvore clonal mais antiga conhecida no planeta com quase 9.550 anos) e a cascata
    Njupeskär (93 m).
