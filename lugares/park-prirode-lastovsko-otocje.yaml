resumen:
  es: >-
    Una de las islas habitadas más remotas de Croacia y decenas de islotes, con cielos oscuros y fondos
    marinos poco alterados.
  en: >-
    One of Croatia's most remote inhabited islands and dozens of islets, with pristine night skies and largely
    undisturbed seabed ecosystems.
  fr: >-
    L'une des îles habitées les plus isolées de Croatie entourée de dizaines d'îlots, avec des ciels nocturnes
    purs et des fonds marins préservés.
  de: >-
    Eine der entlegensten bewohnten Inseln Kroatiens und Dutzende Eilande mit unberührtem Nachthimmel und
    intakten Meeresgründen.
  it: >-
    Una delle isole abitate più remote della Croazia circondata da decine di isolotti, con cieli stellati
    purissimi e fondali marini intatti.
  pt: >-
    Uma das ilhas habitadas mais isoladas da Croácia e dezenas de ilhéus, com céus noturnos cristalinos e
    fundos marinhos intocados.
unico:
  es: >-
    Un archipiélago remoto de 46 islas, con una isla de bosque y maquis, uno de los cielos nocturnos más
    oscuros de Europa y colonias de pardelas y de gaviota de Audouin.
  en: >-
    A remote archipelago of 46 islands, featuring a forested island of lush maquis, one of Europe's darkest
    night skies, and major colonies of shearwaters and Audouin's gulls.
  fr: >-
    Un archipel reculé de 46 îles, une terre boisée couverte de maquis, l'un des ciels nocturnes les plus purs
    d'Europe et des colonies de puffins et de goélands d'Audouin.
  de: >-
    Ein abgeschiedener Archipel aus 46 Inseln, eine waldreiche Hauptinsel mit Macchia, einer der dunkelsten
    Nachthimmel Europas und Kolonien von Sturmtauchern und Korallenmöwen.
  it: >-
    Un arcipelago remoto di 46 isole, un'isola coperta da boschi e macchia, uno dei cieli notturni più limpidi
    d'Europa e colonie di berte e gabbiano corso.
  pt: >-
    Um arquipélago remoto de 46 ilhas, uma ilha coberta de floresta e maquis, um dos céus noturnos mais
    escuros da Europa e colónias de pardelas e de gaivota-de-audouin.
observaciones:
  es: >-
    Se pide atar el barco en vez de fondear y no fondear en las praderas de posidonia. Los meses recomendados
    son mayo, junio, septiembre y octubre.
texto:
  es:
    intro: >-
      En una noche de verano, en el islote de Zaklopatica, madres y crías de pardela se llaman por la voz en
      la oscuridad. Ese canto, algo inquietante y muy raro, es la banda sonora de Lastovo. Lastovo es una de
      las islas habitadas más remotas del Adriático, al sur de Korčula, y su parque natural, declarado por el
      Parlamento croata el 29 de septiembre de 2006, abarca 46 islas, islotes, rocas y arrecifes: 53 km² de
      tierra y 143 km² de mar. Las mayores son Lastovo y Sušac.
    landscape: >-
      Lastovo es una isla de roca antigua: capas del Jurásico y el Cretácico, sobre todo dolomías, caliza
      dolomitizada y caliza pura. Hum, de 417 m, es su cima y su mejor mirador. Bajo tierra, la cueva más
      conocida es Rača, protegida desde 1965; Medjedina, antiguo refugio de la foca monje, es hoy conocida por
      sus grandes poblaciones de murciélagos.


      El 70 % de las islas está cubierto de bosque, así que Lastovo es, junto a Mljet, la isla croata más
      boscosa. Domina el maquis, con madroño, encina y pinar de pino carrasco. Se han registrado 810 especies
      de plantas, entre ellas Aurinia leucadea y la gramínea Ampelodesmos mauretanica, que en Croacia solo
      crece en Lastovo. En la isla de Sušac hay 278 especies y ocho endemismos, entre ellos Brassica cazzae,
      que vive en las grietas de las rocas de la costa.


      El clima es mediterráneo suave, con unas 2700 horas de sol al año, y la nieve es una rareza.
    wildlife: >-
      Las aves son el espectáculo. El archipiélago es lugar de descanso de aves migratorias y de cría de la
      [pardela mediterránea](/especie/puffinus_yelkouan/) y la [pardela
      cenicienta](/especie/calonectris_diomedea/). En el islote de Zaklopatica anidan pardelas, y en las
      noches de verano se oye su canto cuando crías y padres se encuentran por la voz. Recorren más de 400 km
      al día para comer, viven entre 25 y 30 años y ponen un solo huevo al año. En los islotes de Lastovnjaci
      y Vrhovnjaci cría cerca del 70 % de la población croata de la [gaviota de
      Audouin](/especie/larus_audouinii/), amenazada a escala mundial, y en los acantilados de Struga cría el
      halcón de Eleonora, una especie rara.


      En las migraciones, el corredor Lastovo-Palagruža-Pelješac es un cuello de botella para el paso de
      rapaces y grullas: descansan allí con seguridad más de 700 abejeros y más de mil grullas.


      Bajo el agua, el fondo poco profundo junto a la costa está cubierto de praderas de
      [posidonia](/especie/posidonia_oceanica/), amenazadas y protegidas, que sirven de zona de cría y de
      refugio. Destacan las colonias de gorgonia, de coral rojo y el coral endémico de Hvar. En aguas abiertas
      se ven a menudo varias especies de delfines: [común](/especie/delphinus_delphis/),
      [mular](/especie/tursiops_truncatus/) y de Risso; también tortugas [boba](/especie/caretta_caretta/) y
      [verde](/especie/chelonia_mydas/). La [foca monje](/especie/monachus_monachus/) vivió en la cueva
      Medjedina, y algún encuentro de los isleños con la antigua inquilina mantiene la esperanza de su
      regreso. En tierra no hay serpientes venenosas; la única es la culebra Dolichophis caspius. En la cueva
      Medjedina se refugian tres especies de murciélagos amenazados, entre ellos el [murciélago grande de
      herradura](/especie/rhinolophus_ferrumequinum/).
    visit: >-
      La llegada a Lastovo se hace por ferri o catamarán. Una vez allí, hay tres tipos de recorrido: a pie, en
      barco y de noche.


      A pie, el sendero «Preko sadašnjosti u prošlost» mide 6,4 km, dura unas dos horas, es de dificultad
      media y tiene 11 paneles; pasa por pinar de pino carrasco y encinar, por campos con charcas, viñedos y
      olivares, y por el pueblo de Lastovo. El sendero «Artina» va de Zaklopatica a Lastovo, dura 45 minutos y
      tiene seis paneles sobre la gaviota de Audouin, la pardela mediterránea y la pardela cenicienta; su
      nombre es el que los lastoveses dan a la pardela. El «Camino de las ermitas» ofrece dos rutas por las
      iglesias de piedra de la isla: una de 1 hora y 30 minutos y otra de 3 horas. De las 46 ermitas, 21 están
      registradas como bien cultural protegido.


      Desde el mirador de Sozanj, en la carretera entre Ubli y Lastovo, se ve Zaklopatica y los islotes de
      Lastovnjaci; unos 300 m más arriba, la vista llega hasta Vis, Korčula y Mljet. La excursión educativa en
      barco sale a las 9:00 y dura unas 4 horas; hay que reservar plaza.


      Y de noche: un mirador del sur de la isla es buen puesto para ver el cielo nocturno de Lastovo, el
      segundo más oscuro de Europa, con la menor contaminación lumínica. El parque organiza de dos a tres
      veces por semana observaciones de estrellas desde Hum o desde otros lugares con panorámica, con puntero
      láser y telescopio, y el archipiélago es candidato a Parque de Cielo Oscuro, un título que concede
      DarkSky International. Las noches pueden ser frescas: lleva ropa de manga larga.
    history: >-
      En Ubli hay una basílica de San Pedro de nave única, del siglo VI. En la Edad Media, Lastovo siguió
      independiente bajo el dominio nominal de Bizancio mientras los croatas ocupaban la costa. El faro de
      Struga, de 1839, está a 90 m de altura sobre el mar.


      En el archipiélago se han registrado 175 especies de vertebrados, 71 de ellas amenazadas a escala
      nacional y 37 a escala europea. En el mar hay 330 especies de invertebrados, 20 de ellas amenazadas.
    before: >-
      Se pide atar el barco en vez de fondear y no fondear en las praderas de posidonia. Los meses
      recomendados son mayo, junio, septiembre y octubre.
    around: >-
      [Nacionalni park Mljet](/lugar/nacionalni-park-mljet/) está a quince kilómetros. A más distancia, [Parc
      national de Port-Cros](/lugar/parc-national-de-port-cros/), [Parco Nazionale dell'Arcipelago
      Toscano](/lugar/parco-nazionale-arcipelago-toscano/) y [Parc national des
      Calanques](/lugar/parc-national-des-calanques/) comparten pardela mediterránea, pardela cenicienta y
      posidonia, y el [Parc Natural del Cap de Creus](/lugar/parc-natural-del-cap-de-creus/) comparte pardela
      mediterránea, posidonia y delfín mular.
  en:
    intro: >-
      On a summer night on the islet of Zaklopatica, shearwater parents and chicks call to each other through
      the pitch darkness. That eerie, haunting cry is the signature soundtrack of Lastovo. Lastovo is one of
      the most remote inhabited islands in the Adriatic, lying south of Korčula, and its nature park,
      designated by the Croatian Parliament on 29 September 2006, encompasses 46 islands, islets, rocks, and
      reefs: 53 km² of land and 143 km² of sea. The largest are Lastovo and Sušac.
    landscape: >-
      Lastovo is built of ancient rock: Jurassic and Cretaceous strata, predominantly dolomite, dolomitised
      limestone, and pure limestone. Hum, at 417 m, is its highest point and finest viewpoint. Underground,
      the best-known cave is Rača, protected since 1965; Medjedina, a former refuge of the Mediterranean monk
      seal, is now known for its large bat colonies.


      About 70 % of the island group is cloaked in woodland, making Lastovo, together with Mljet, Croatia's
      most wooded island. Maquis dominates, featuring strawberry trees, holm oaks, and Aleppo pine woods. An
      impressive 810 plant species have been documented, including Aurinia leucadea and the grass Ampelodesmos
      mauretanica, which grows nowhere else in Croatia. On the outlying island of Sušac, 278 species and eight
      endemics thrive, notably Brassica cazzae, which clings to crevices in the coastal cliffs.


      The climate is mild Mediterranean, with around 2700 hours of sunshine annually, and snowfall is an
      extreme rarity.
    wildlife: >-
      Birds provide the greatest spectacle. The archipelago serves as a vital resting haven for migratory
      birds and a prime nesting ground for the [Yelkouan shearwater](/especie/puffinus_yelkouan/) and
      [Scopoli's shearwater](/especie/calonectris_diomedea/). On Zaklopatica shearwaters nest in burrows, and
      on summer nights their haunting voices ring out as parents reunite with chicks. They fly over 400 km a
      day foraging at sea, live between 25 and 30 years, and lay just a single egg each year. On the islets of
      Lastovnjaci and Vrhovnjaci nests around 70 % of Croatia's population of the globally threatened
      [Audouin's gull](/especie/larus_audouinii/), while the rare Eleonora's falcon nests on the cliffs of
      Struga.


      During seasonal migrations, the Lastovo-Palagruža-Pelješac flyway forms a bottleneck for raptors and
      cranes: more than 700 European honey buzzards and more than a thousand cranes reliably rest here.


      Underwater, shallow coastal shallows are draped in lush meadows of
      [posidonia](/especie/posidonia_oceanica/), protected and crucial as nursery and feeding grounds.
      Gorgonian fans, red coral, and the endemic Hvar coral thrive on reef walls. In open water, several
      dolphin species appear frequently: [short-beaked common](/especie/delphinus_delphis/),
      [bottlenose](/especie/tursiops_truncatus/), and Risso's; as do [loggerhead](/especie/caretta_caretta/)
      and [green](/especie/chelonia_mydas/) sea turtles. The [Mediterranean monk
      seal](/especie/monachus_monachus/) formerly inhabited Medjedina Cave, and sporadic sightings by
      islanders keep hope of its return alive. There are no venomous snakes on land; the only snake is the
      Caspian whipsnake (Dolichophis caspius). Medjedina Cave shelters three species of threatened bats,
      including the [greater horseshoe bat](/especie/rhinolophus_ferrumequinum/).
    visit: >-
      Arrival on Lastovo is by ferry or catamaran. Once on the island, there are three main ways to explore:
      on foot, by boat, and by night.


      On foot, the «Preko sadašnjosti u prošlost» trail measures 6.4 km, takes about two hours, has medium
      difficulty, and features 11 panels; it weaves through Aleppo pine woods and holm oak, past fields with
      ponds, vineyards, and olive groves, and through Lastovo village. The «Artina» path leads from
      Zaklopatica to Lastovo in 45 minutes with six panels on Audouin's gulls and both shearwater species; its
      name comes from the local islanders' word for the shearwater. The «Hermitage Trail» offers two walking
      routes among stone chapels: one taking 1 hour and 30 minutes and another of 3 hours. Of the 46 stone
      chapels, 21 are officially registered as protected cultural heritage.


      From the Sozanj viewpoint on the road between Ubli and Lastovo, you can see Zaklopatica and the
      Lastovnjaci islets; about 300 m higher, the panorama extends to Vis, Korčula, and Mljet. The park's
      guided educational boat trip departs at 9:00 and lasts around 4 hours; booking ahead is required.


      By night: a southern viewpoint is the prime spot to admire Lastovo's night sky, the second darkest in
      Europe with minimal light pollution. The park runs stargazing sessions two to three times a week from
      Hum or other panoramic viewpoints with laser pointers and telescopes; the archipelago is a candidate
      International Dark Sky Park. Nights can turn chilly: bring long-sleeved clothing.
    history: >-
      In Ubli stand the ruins of a single-nave sixth century basilica of Saint Peter. In the Middle Ages,
      Lastovo retained internal autonomy under nominal Byzantine rule while Croats settled the adjacent
      mainland. The Struga lighthouse, built in 1839, perches 90 m above the waves.


      Across the archipelago, 175 vertebrate species have been recorded, 71 of them nationally threatened and
      37 protected across Europe. The marine waters support 330 invertebrate species, 20 of which are
      threatened.
    before: >-
      Boats must moor to buoys rather than dropping anchor, and anchoring in posidonia seagrass meadows is
      strictly prohibited. The recommended months for visiting are May, June, September, and October.
    around: >-
      [Nacionalni park Mljet](/lugar/nacionalni-park-mljet/) is fifteen kilometres away. Further afield, [Parc
      national de Port-Cros](/lugar/parc-national-de-port-cros/), [Parco Nazionale dell'Arcipelago
      Toscano](/lugar/parco-nazionale-arcipelago-toscano/), and [Parc national des
      Calanques](/lugar/parc-national-des-calanques/) share Yelkouan shearwaters, Scopoli's shearwaters, and
      posidonia, while [Parc Natural del Cap de Creus](/lugar/parc-natural-del-cap-de-creus/) shares Yelkouan
      shearwaters, posidonia, and bottlenose dolphins.
  fr:
    intro: >-
      Par une nuit d'été, sur l'îlot de Zaklopatica, poussins et parents puffins s'appellent à travers
      l'obscurité. Ce cri singulier et envoûtant constitue la bande-son de Lastovo. Lastovo est l'une des îles
      habitées les plus isolées de l'Adriatique, au sud de Korčula, et son parc naturel, instauré par le
      Parlement croate le 29 septembre 2006, englobe 46 îles, îlots, écueils et récifs : 53 km² de terre et
      143 km² d'espace marin. Les plus grandes sont Lastovo et Sušac.
    landscape: >-
      Lastovo est faite de roches anciennes : des strates du Jurassique et du Crétacé, composées
      principalement de dolomies et de calcaires purs. Hum, haut de 417 m, forme son point culminant et son
      plus beau belvédère. Sous terre, la cavité la plus célèbre est la grotte de Rača, protégée depuis 1965 ;
      Medjedina, ancien repaire du phoque moine, est réputée pour ses importantes colonies de chauves-souris.


      Près de 70 % de la superficie insulaire est couverte de forêts, faisant de Lastovo, avec Mljet, l'île la
      plus boisée de Croatie. Le maquis prédomine, mariant arbousiers, chênes verts et pinèdes de pin d'Alep.
      On y recense 810 espèces végétales, dont Aurinia leucadea et la graminée Ampelodesmos mauretanica, qui
      ne pousse nulle part ailleurs en Croatie. Sur l'île de Sušac prospèrent 278 espèces dont huit
      endémiques, parmi lesquelles Brassica cazzae, réfugiée dans les failles des falaises marines.


      Le climat est méditerranéen et clément, avec quelque 2700 heures d'ensoleillement par an, et la neige y
      est exceptionnelle.
    wildlife: >-
      Les oiseaux offrent le spectacle majeur. L'archipel sert de halte migratoire et de site de reproduction
      privilégié pour le [puffin yelkouan](/especie/puffinus_yelkouan/) et le [puffin
      cendré](/especie/calonectris_diomedea/). Sur l'îlot de Zaklopatica nichent les puffins, dont le chant
      résonne lors des retrouvailles nocturnes entre parents et jeunes. Ils parcourent plus de 400 km par jour
      pour pêcher, vivent entre 25 et 30 ans et ne pondent qu'un seul œuf par an. Sur les îlots de Lastovnjaci
      et Vrhovnjaci se reproduit près de 70 % de la population croate du [goéland
      d'Audouin](/especie/larus_audouinii/), menacé mondialement, et les falaises de Struga abritent le rare
      faucon d'Éléonore.


      Lors des migrations, le couloir Lastovo-Palagruža-Pelješac forme un goulet d'étranglement pour rapaces
      et grues : plus de 700 bondrées apivores et plus d'un millier de grues y font escale avec certitude.


      Sous l'eau, les petits fonds côtiers sont tapissés d'herbiers de
      [posidonie](/especie/posidonia_oceanica/), protégés et essentiels comme frayères et refuges. Les
      tombants portent des colonies de gorgones, de corail rouge et le corail endémique de Hvar. Au large
      croisent fréquemment plusieurs dauphins : [commun](/especie/delphinus_delphis/), [grand
      dauphin](/especie/tursiops_truncatus/) et dauphin de Risso ; ainsi que les tortues
      [caouanne](/especie/caretta_caretta/) et [verte](/especie/chelonia_mydas/). Le [phoque moine de
      Méditerranée](/especie/monachus_monachus/) a longtemps vécu dans la grotte de Medjedina, et des
      observations sporadiques nourrissent l'espoir de son retour. Aucune couleuvre venimeuse ne vit sur l'île
      ; la seule espèce est Dolichophis caspius. La grotte de Medjedina abrite trois espèces de chauves-souris
      menacées, dont le [grand rhinolophe fer à cheval](/especie/rhinolophus_ferrumequinum/).
    visit: >-
      L'accès à Lastovo s'effectue en ferry ou en catamaran. Sur place, la découverte se décline selon trois
      approches : à pied, en mer et de nuit.


      À pied, le sentier « Preko sadašnjosti u prošlost » s'étend sur 6,4 km, dure environ deux heures,
      présente une difficulté moyenne et compte 11 panneaux ; il traverse pinèdes de pin d'Alep, chênaies,
      vignes, oliveraies et rejoint le village de Lastovo. Le sentier « Artina » relie Zaklopatica à Lastovo
      en 45 minutes avec six panneaux sur le goéland d'Audouin et les puffins ; son nom provient du mot
      désignant le puffin dans le parler local. Le « Chemin des ermitages » propose deux itinéraires parmi les
      chapelles médiévales : l'un de 1 heure et 30 minutes et l'autre de 3 heures. Sur les 46 chapelles de
      pierre, 21 sont classées monuments historiques.


      Depuis le belvédère de Sozanj, sur la route reliant Ubli à Lastovo, la vue embrasse Zaklopatica et les
      îlots de Lastovnjaci ; environ 300 m plus haut, l'horizon s'ouvre sur Vis, Korčula et Mljet. L'excursion
      pédagogique en bateau part à 9:00 et dure environ 4 heures ; la réservation préalable est obligatoire.


      De nuit : un belvédère au sud de l'île offre une vue exceptionnelle sur le ciel de Lastovo, le deuxième
      plus sombre d'Europe en raison de l'absence de pollution lumineuse. Le parc organise deux à trois fois
      par semaine des observations astronomiques depuis Hum ou d'autres points panoramiques avec pointeur
      laser et télescope ; l'archipel postule au label de parc de ciel étoilé auprès de DarkSky International.
      Les nuits pouvant être fraîches, prévoyez des vêtements à manches longues.
    history: >-
      À Ubli subsiste une basilique Saint-Pierre à nef unique remontant au VIe siècle. Au Moyen Âge, Lastovo
      conserva son autonomie communale sous suzeraineté byzantine nominale tandis que les Croates occupaient
      le littoral. Le phare de Struga, érigé en 1839, surplombe la mer à 90 m d'altitude.


      Dans l'archipel ont été recensées 175 espèces de vertébrés, dont 71 menacées au niveau national et 37 à
      l'échelle européenne. Le milieu marin abrite 330 espèces d'invertébrés, dont 20 menacées.
    before: >-
      Il est demandé d'amarrer son bateau aux bouées plutôt que de mouiller l'ancre, et le mouillage dans les
      herbiers de posidonie est rigoureusement interdit. Les mois recommandés pour le séjour sont mai, juin,
      septembre et octobre.
    around: >-
      [Nacionalni park Mljet](/lugar/nacionalni-park-mljet/) est à quinze kilomètres. Plus loin, le [Parc
      national de Port-Cros](/lugar/parc-national-de-port-cros/), le [Parco Nazionale dell'Arcipelago
      Toscano](/lugar/parco-nazionale-arcipelago-toscano/) et le [Parc national des
      Calanques](/lugar/parc-national-des-calanques/) partagent puffin yelkouan, puffin cendré et posidonie,
      tandis que le [Parc Natural del Cap de Creus](/lugar/parc-natural-del-cap-de-creus/) partage puffin
      yelkouan, posidonie et grand dauphin.
  de:
    intro: >-
      In einer Sommernacht auf dem Eiland Zaklopatica rufen sich Sturmtaucherküken und Altvögel in völliger
      Finsternis mit ihren Stimmen. Dieser unheimliche, weithin schallende Ruf bildet die Klangkulisse
      Lastovos. Lastovo ist eine der am weitesten abgelegenen bewohnten Inseln der Adria südlich von Korčula;
      ihr Naturpark, vom kroatischen Parlament am 29. September 2006 gegründet, umfasst 46 Inseln, Inselchen,
      Felsen und Riffe: 53 km² Landfläche und 143 km² Meeresgebiet. Die größten Inseln sind Lastovo und Sušac.
    landscape: >-
      Lastovo besteht aus uraltem Gestein: Schichten aus Jura und Kreide, vor allem Dolomite, dolomitisierte
      Kalke und reine Kalksteine. Der Hum mit 417 m Höhe ist der Gipfel und schönste Aussichtspunkt. Unter der
      Erde ist die Rača-Höhle die bekannteste, geschützt seit 1965; Medjedina, einst Zuflucht der
      Mittelmeer-Mönchsrobbe, beherbergt heute bedeutende Fledermausquartiere.


      Rund 70 % der Inselfläche sind bewaldet, weshalb Lastovo zusammen mit Mljet die waldreichste Insel
      Kroatiens ist. Es dominiert die Macchia mit Erdbeerbaum, Steineiche und Beständen der Aleppo-Kiefer. Es
      wurden 810 Pflanzenarten nachgewiesen, darunter Aurinia leucadea und das Dünengras Ampelodesmos
      mauretanica, das in Kroatien ausschließlich auf Lastovo wächst. Auf der Insel Sušac leben 278 Arten und
      acht Endemiten, unter ihnen Brassica cazzae in den Felsspalten der Steilküste.


      Das Klima ist mild-mediterran mit rund 2700 Sonnenstunden im Jahr; Schnee gehört zu den absoluten
      Seltenheiten.
    wildlife: >-
      Die Vogelwelt bietet das größte Schauspiel. Der Archipel ist Rastplatz für Zugvögel und Brutrevier des
      [Mittelmeer-Sturmtauchers](/especie/puffinus_yelkouan/) und des
      [Gelbschnabel-Sturmtauchers](/especie/calonectris_diomedea/). Auf Zaklopatica nisten Sturmtaucher, und
      in Sommernächten hallen ihre Rufe wider, wenn Eltern und Jungvögel einander an der Stimme erkennen. Sie
      legen täglich über 400 km auf Nahrungssuche zurück, werden 25 bis 30 Jahre alt und legen nur ein
      einziges Ei pro Jahr. Auf den Eilanden Lastovnjaci und Vrhovnjaci brüten rund 70 % des kroatischen
      Bestands der weltweit bedrohten [Korallenmöwe](/especie/larus_audouinii/), und an den Klippen von Struga
      nistet der seltene Eleonorenfalke.


      Auf dem Vogelzug bildet der Korridor Lastovo-Palagruža-Pelješac ein Nadelöhr: Mehr als 700
      Wespenbussarde und mehr als tausend Kraniche rasten hier verlässlich.


      Unter Wasser säumen Seegraswiesen aus [Neptungras](/especie/posidonia_oceanica/) die Küste; sie sind
      geschützt und dienen als Kinderstube. Korallenwände tragen Gorgonien, Edelkorallen und die endemische
      Hvar-Koralle. Im offenen Meer zeigen sich regelmäßig Delfine: [Gemeiner
      Delfin](/especie/delphinus_delphis/), [Großer Tümmler](/especie/tursiops_truncatus/) und Rundkopfdelfin;
      zudem [Unechte Karettschildkröte](/especie/caretta_caretta/) und [Grüne
      Meeresschildkröte](/especie/chelonia_mydas/). Die [Mittelmeer-Mönchsrobbe](/especie/monachus_monachus/)
      lebte einst in der Medjedina-Höhle, und vereinzelte Sichtungen nähren die Hoffnung auf ihre Rückkehr. An
      Land gibt es keine Giftschlangen; die einzige Art ist die Kaspische Pfeilnatter (Dolichophis caspius).
      In der Medjedina-Höhle suchen drei bedrohte Fledermausarten Zuflucht, darunter die [Große
      Hufeisennase](/especie/rhinolophus_ferrumequinum/).
    visit: >-
      Die Anreise nach Lastovo erfolgt per Fähre oder Katamaran. Vor Ort bieten sich drei Erkundungswege an:
      zu Fuß, per Boot und bei Nacht.


      Zu Fuß misst der Lehrpfad «Preko sadašnjosti u prošlost» 6,4 km, dauert rund zwei Stunden, weist
      mittlere Schwierigkeit auf und umfasst 11 Schautafeln; er führt durch Pinien- und Steineichenwälder, an
      Feuchtstellen, Weinbergen und Olivenhainen vorbei in den Hauptort Lastovo. Der Pfad «Artina» führt in 45
      Minuten von Zaklopatica nach Lastovo mit sechs Schautafeln zu Korallenmöwe und Sturmtauchern; sein Name
      leitet sich von der Inselbezeichnung für die Sturmtaucher ab. Der «Weg der Einsiedeleien» umfasst zwei
      Rundwege zu den Steinkapellen: einen von 1 Stunde und 30 Minuten und einen weiteren von 3 Stunden. Von
      den 46 Kapellen stehen 21 unter Denkmalschutz.


      Vom Aussichtspunkt Sozanj an der Straße zwischen Ubli und Lastovo blickt man auf Zaklopatica und die
      Lastovnjaci-Inseln; rund 300 m höher reicht das Panorama bis Vis, Korčula und Mljet. Die lehrreiche
      Bootstour startet um 9:00 Uhr und dauert etwa 4 Stunden; eine Voranmeldung ist erforderlich.


      Und bei Nacht: Ein Aussichtspunkt im Inselsüden erschließt den Nachthimmel Lastovos, den zweitdunkelsten
      Europas mit geringster Lichtverschmutzung. Der Park organisiert zwei- bis dreimal pro Woche
      Sternenbeobachtungen vom Hum oder anderen Höhenpunkten mit Laserpointer und Teleskop; der Archipel
      kandidiert als Dark Sky Park. Die Nächte können abkühlen: Nimm langärmelige Kleidung mit.
    history: >-
      In Ubli steht eine einschiffige Petersbasilika aus dem sechsten Jahrhundert. Im Mittelalter wahrte
      Lastovo kommunale Autonomie unter nomineller byzantinischer Oberhoheit, während Kroaten die Küste
      besiedelten. Der Leuchtturm von Struga aus dem Jahr 1839 ragt 90 m über dem Meer auf.


      Im Archipel wurden 175 Wirbeltierarten nachgewiesen, davon 71 landesweit gefährdet und 37 europaweit
      geschützt. Im Meer leben 330 Arten wirbelloser Tiere, 20 davon bedroht.
    before: >-
      Boote müssen an Bojen festgemacht werden; das Ankern auf den Neptungraswiesen ist streng verboten. Die
      empfohlenen Reisemonate sind Mai, Juni, September und Oktober.
    around: >-
      [Nacionalni park Mljet](/lugar/nacionalni-park-mljet/) ist fünfzehn Kilometer entfernt. In größerer
      Entfernung teilen [Parc national de Port-Cros](/lugar/parc-national-de-port-cros/), [Parco Nazionale
      dell'Arcipelago Toscano](/lugar/parco-nazionale-arcipelago-toscano/) und [Parc national des
      Calanques](/lugar/parc-national-des-calanques/) Mittelmeer-Sturmtaucher, Gelbschnabel-Sturmtaucher und
      Neptungras; der [Parc Natural del Cap de Creus](/lugar/parc-natural-del-cap-de-creus/) teilt
      Mittelmeer-Sturmtaucher, Neptungras und Großen Tümmler.
  it:
    intro: >-
      In una notte d'estate, sull'isolotto di Zaklopatica, piccoli e genitori di berta si richiamano a vicenda
      nel buio fitto. Quel verso misterioso e suggestivo è la colonna sonora di Lastovo. Lastovo è una delle
      isole abitate più appartate dell'Adriatico, a sud di Korčula; il suo parco naturale, sancito dal
      Parlamento croato il 29 settembre 2006, comprende 46 isole, scogli e rilievi affioranti: 53 km² di terra
      e 143 km² di acque marine. Le più ampie sono Lastovo e Sušac.
    landscape: >-
      Lastovo è un'isola di roccia antica: formazioni del Giurassico e del Cretaceo, composte prevalentemente
      da dolomie, calcari dolomitici e calcari puri. L'Hum, a quota 417 m, costituisce la sommità e il miglior
      belvedere. Nel sottosuolo la cavità più celebre è la grotta Rača, protetta dal 1965; Medjedina, antico
      rifugio della foca monaca, ospita oggi considerevoli colonie di chirotteri.


      Il 70 % della superficie insulare è rivestito da boschi, rendendo Lastovo, accanto a Mljet, l'isola
      croata più alberata. Prevale la macchia mediterranea, tra corbezzoli, lecci e pinete di pino d'Aleppo.
      Si contano 810 specie vegetali, tra cui Aurinia leucadea e la graminacea Ampelodesmos mauretanica, che
      in territorio croato prospera esclusivamente a Lastovo. Sull'isola di Sušac allignano 278 specie con
      otto endemismi, fra cui Brassica cazzae abbarbicata alle fessure rocciose litoranee.


      Il clima è tipicamente mediterraneo e temperato, con circa 2700 ore di sole all'anno, mentre la neve
      rappresenta un evento eccezionale.
    wildlife: >-
      L'avifauna offre spettacoli memorabili. L'arcipelago funge da sosta lungo le rotte migratorie e da
      santuario riproduttivo per la [berta minore](/especie/puffinus_yelkouan/) e la [berta maggiore
      mediterranea](/especie/calonectris_diomedea/). Sull'isolotto di Zaklopatica nidificano le berte, il cui
      canto echeggia nelle notti estive quando pulcini e adulti si riconoscono al buio. Compiono oltre 400 km
      al giorno per procacciarsi il cibo, vivono tra i 25 e i 30 anni e depongono un unico uovo per stagione.
      Sugli isolotti di Lastovnjaci e Vrhovnjaci si concentra circa il 70 % della popolazione croata del
      [gabbiano corso](/especie/larus_audouinii/), minacciato a scala globale, mentre le falesie di Struga
      ospitano il falco della regina.


      Durante le migrazioni il corridoio Lastovo-Palagruža-Pelješac canalizza il passaggio di rapaci e gru: vi
      sostano con certezza oltre 700 pecchiaioli e più di mille gru.


      Sott'acqua i fondali costieri poco profondi sono coperti da praterie di
      [posidonia](/especie/posidonia_oceanica/), tutelate e fondamentali quali nursery biologiche. Lungo le
      pareti sommerse risaltano gorgonie, corallo rosso e il corallo endemico di Hvar. In mare aperto
      incrociano regolarmente varie specie di delfini: [comune](/especie/delphinus_delphis/),
      [tursìope](/especie/tursiops_truncatus/) e grampo; oltre a tartarughe marine
      [comune](/especie/caretta_caretta/) e [verde](/especie/chelonia_mydas/). La [foca
      monaca](/especie/monachus_monachus/) frequentava la grotta Medjedina, e avvistamenti sporadici tengono
      viva la speranza del suo ritorno. Sulla terraferma non vivono serpenti velenosi; l'unico ofide presente
      è il biacco saettone (Dolichophis caspius). La grotta Medjedina accoglie tre specie di pipistrelli
      minacciati, fra cui il [ferro di cavallo maggiore](/especie/rhinolophus_ferrumequinum/).
    visit: >-
      L'arrivo a Lastovo avviene via traghetto o catamarano. Una volta sbarcati, l'esplorazione si articola su
      tre modalità: a piedi, via mare e di notte.


      A piedi, il tracciato didattico «Preko sadašnjosti u prošlost» misura 6,4 km, si compie in due ore con
      media difficoltà e 11 pannelli illustrativi; attraversa pinete di pino d'Aleppo, leccete, coltivi con
      stagni, vigne e oliveti fino al borgo di Lastovo. Il sentiero «Artina» unisce Zaklopatica a Lastovo in
      45 minuti con sei pannelli dedicati al gabbiano corso e alle berte; il nome deriva dall'appellativo con
      cui gli isolani chiamano la berta. Il «Cammino delle cappelle» propone due circuiti tra gli oratori
      medievali: uno da 1 ora e 30 minuti e l'altro da 3 ore. Delle 46 chiesette, 21 sono tutelate quali beni
      culturali d'interesse nazionale.


      Dal belvedere di Sozanj, lungo la strada tra Ubli e Lastovo, lo sguardo spazia su Zaklopatica e gli
      isolotti Lastovnjaci; circa 300 m più in quota la vista si allarga verso Vis, Korčula e Mljet.
      L'escursione naturalistica in barca salpa alle 9:00 e dura circa 4 ore; occorre prenotare in anticipo.


      E di notte: un punto panoramico nel settore meridionale dell'isola è la postazione ideale per ammirare
      il firmamento di Lastovo, il secondo più buio d'Europa per assenza d'inquinamento luminoso. Il parco
      programma da due a tre volte a settimana osservazioni astronomiche guidate dall'Hum o da altre alture
      con telescopi e puntatori laser; l'arcipelago è candidato al riconoscimento di Dark Sky Park
      internazionale. Le notti possono essere fresche: porta abiti a maniche lunghe.
    history: >-
      A Ubli si ammirano le vestigia di una basilica di San Pietro a navata unica risalente al VI secolo. Nel
      Medioevo Lastovo mantenne piena autonomia comunale sotto la formale autorità bizantina mentre le genti
      croate popolavano la costa antistante. Il faro di Struga, eretto nel 1839, domina il mare dall'alto di
      90 m.


      Nell'arcipelago sono state censite 175 specie di vertebrati, di cui 71 minacciate in Croazia e 37 a
      livello comunitario. Nelle acque vivono 330 specie di invertebrati, 20 delle quali a rischio.
    before: >-
      Si raccomanda di ormeggiare alle boe predisposte evitando l'ancoraggio libero, tassativamente vietato
      sulle praterie di posidonia. I mesi consigliati per il soggiorno sono maggio, giugno, settembre e
      ottobre.
    around: >-
      [Nacionalni park Mljet](/lugar/nacionalni-park-mljet/) dista quindici chilometri. A raggio più ampio, il
      [Parc national de Port-Cros](/lugar/parc-national-de-port-cros/), il [Parco Nazionale dell'Arcipelago
      Toscano](/lugar/parco-nazionale-arcipelago-toscano/) e il [Parc national des
      Calanques](/lugar/parc-national-des-calanques/) condividono berta minore, berta maggiore e posidonia,
      mentre il [Parc Natural del Cap de Creus](/lugar/parc-natural-del-cap-de-creus/) condivide berta minore,
      posidonia e tursiope.
  pt:
    intro: >-
      Numa noite de verão, no ilhéu de Zaklopatica, crias e progenitores de pardela chamam-se mutuamente na
      escuridão profunda. Esse chamamento misterioso e invulgar constitui a banda sonora de Lastovo. Lastovo é
      uma das ilhas habitadas mais isoladas do Adriático, a sul de Korčula; o seu parque natural, declarado
      pelo parlamento croata a 29 de setembro de 2006, engloba 46 ilhas, ilhéus, rochedos e recifes: 53 km² de
      terra e 143 km² de área marinha. As maiores ilhas são Lastovo e Sušac.
    landscape: >-
      Lastovo é composta por rochas antigas: estratos do Jurássico e do Cretáceo, sobretudo dolomitos,
      calcários dolomíticos e calcários puros. O monte Hum, com 417 m de altitude, é o cume culminante e o
      melhor miradouro. Sob o solo, a caverna mais afamada é a gruta de Rača, classificada desde 1965;
      Medjedina, antigo refúgio da foca-monge, é hoje conhecida pelas suas volumosas colónias de morcegos.


      Cerca de 70 % da superfície das ilhas está coberta por arvoredo, o que faz de Lastovo, a par de Mljet, a
      ilha croata mais florestada. Predomina o maquis mediterrânico, com medronheiros, azinheiras e pinhais de
      pinheiro-de-alepo. Foram catalogadas 810 espécies vegetais, entre as quais Aurinia leucadea e a gramínea
      Ampelodesmos mauretanica, que na Croácia apenas cresce em Lastovo. Na ilha de Sušac prosperam 278
      espécies e oito endemismos, com destaque para a Brassica cazzae instalada nas fendas rochosas da arriba
      marítima.


      O clima é mediterrânico ameno, com cerca de 2700 horas de sol anuais, sendo a neve um fenómeno
      raríssimo.
    wildlife: >-
      A avifauna proporciona o espetáculo dominante. O arquipélago constitui pouso de repouso nas rotas
      migratórias e área de nidificação fulcral para o
      [fura-bucho-do-mediterrâneo](/especie/puffinus_yelkouan/) e a [cagarra](/especie/calonectris_diomedea/).
      No ilhéu de Zaklopatica nidificam pardelas, escutando-se nas noites quentes os seus chamamentos quando
      adultos e crias se reencontram pela voz. Percorrem mais de 400 km por dia para se alimentar no mar,
      vivem entre 25 e 30 anos e põem um único ovo por ano. Nos ilhéus de Lastovnjaci e Vrhovnjaci reproduz-se
      perto de 70 % da população croata da [gaivota-de-audouin](/especie/larus_audouinii/), ameaçada a nível
      mundial, e nas escarpas de Struga nidifica o raro falcão-da-rainha.


      Durante os períodos migratórios, o corredor Lastovo-Palagruža-Pelješac funciona como funil para rapinas
      e grous: descansam ali com regularidade mais de 700 vespeiros-europeus e mais de mil grous.


      Sob a água, os fundos litorais pouco profundos encontram-se cobertos por pradarias de
      [posidónia](/especie/posidonia_oceanica/), protegidas e vitais enquanto viveiro e refúgio. Nas paredes
      rochosas destacam-se colónias de gorgónias, coral-vermelho e o coral endémico de Hvar. Em mar aberto
      cruzam-se com frequência várias espécies de golfinhos: [comum](/especie/delphinus_delphis/),
      [golfinho-comum](/especie/tursiops_truncatus/) e de Risso; bem como
      tartarugas-[comuns](/especie/caretta_caretta/) e [verdes](/especie/chelonia_mydas/). A
      [foca-monge-do-mediterrâneo](/especie/monachus_monachus/) habitou a gruta de Medjedina, e avistamentos
      esporádicos mantêm viva a esperança do seu regresso. Em terra não existem serpentes venenosas; a única
      espécie presente é o chicote-oriental (Dolichophis caspius). Na gruta de Medjedina abrigam-se três
      espécies de morcegos vulneráveis, incluindo o
      [morcego-de-ferradura-grande](/especie/rhinolophus_ferrumequinum/).
    visit: >-
      A chegada a Lastovo faz-se por ferry ou catamarã. Uma vez na ilha, existem três percursos recomendados:
      a pé, de barco e à noite.


      A pé, o percurso «Preko sadašnjosti u prošlost» tem 6,4 km, requer cerca de duas horas, apresenta
      dificuldade média e conta com 11 painéis; cruza pinhais de pinheiro-de-alepo e azinhais, campos com
      charcas, vinhas e olivais até à povoação de Lastovo. O trilho «Artina» liga Zaklopatica a Lastovo em 45
      minutos com seis painéis dedicados à gaivota-de-audouin e às duas espécies de pardelas; o seu nome
      recupera o vocábulo com que os insulares designam a ave marinha. O «Caminho das Ermidas» contempla duas
      opções de passeio pelas capelas de pedra: uma de 1 hora e 30 minutos e outra de 3 horas. Das 46 ermidas,
      21 estão classificadas como património cultural protegido.


      A partir do miradouro de Sozanj, na estrada entre Ubli e Lastovo, avista-se Zaklopatica e os ilhéus de
      Lastovnjaci; cerca de 300 m mais acima, a panorâmica abarca Vis, Korčula e Mljet. O passeio didático de
      barco sai às 9:00 e dura cerca de 4 horas, exigindo reserva antecipada.


      E à noite: um miradouro no sul da ilha proporciona um excelente enquadramento para contemplar o céu
      noturno de Lastovo, o segundo mais límpido da Europa face à ausência de poluição luminosa. O parque
      promove duas a três vezes por semana sessões de observação astronómica a partir do Hum ou de outros
      pontos elevados com apontador laser e telescópio; o arquipélago é candidato ao estatuto de Parque de Céu
      Escuro pela DarkSky International. As noites podem ser frescas: leva roupa de manga comprida.
    history: >-
      Em Ubli conservam-se os vestígios da basílica de São Pedro de nave única, datada do século VI. Na Idade
      Média, Lastovo manteve autonomia interna sob a tutela nominal de Bizâncio enquanto os croatas ocupavam a
      costa. O farol de Struga, edificado em 1839, ergue-se a 90 m acima do mar.


      No arquipélago foram registadas 175 espécies de vertebrados, das quais 71 se encontram ameaçadas no país
      e 37 à escala europeia. No meio marinho contam-se 330 espécies de invertebrados, 20 das quais sob
      ameaça.
    before: >-
      Solicita-se a amarração das embarcações às boias disponíveis em vez de fundear, sendo expressamente
      proibido largar âncora sobre as pradarias de posidónia. Os meses mais indicados para a visita são maio,
      junho, setembro e outubro.
    around: >-
      [Nacionalni park Mljet](/lugar/nacionalni-park-mljet/) fica a quinze quilómetros. A distância superior,
      o [Parc national de Port-Cros](/lugar/parc-national-de-port-cros/), o [Parco Nazionale dell'Arcipelago
      Toscano](/lugar/parco-nazionale-arcipelago-toscano/) e o [Parc national des
      Calanques](/lugar/parc-national-des-calanques/) partilham fura-bucho-do-mediterrâneo, cagarra e
      posidónia, enquanto o [Parc Natural del Cap de Creus](/lugar/parc-natural-del-cap-de-creus/) partilha
      fura-bucho-do-mediterrâneo, posidónia e golfinho-comum.
