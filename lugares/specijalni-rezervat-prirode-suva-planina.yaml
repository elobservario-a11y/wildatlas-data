resumen:
  es: >-
    La 'Montaña Seca', una monumental muralla caliza afilada de 45 km de longitud que se eleva sobre la meseta
    de Niš.
  en: >-
    The "Dry Mountain", a monumental, razor-sharp limestone ridge extending for 45 km rising dramatically
    above the Niš basin.
  fr: >-
    La « Montagne Sèche », une monumentale muraille calcaire effilée longue de 45 km dominant majestueusement
    le bassin de Niš.
  de: >-
    Der „Trockene Berg“, eine monumentale, messerscharfe Kalksteinmauer von 45 km Länge, die steil über dem
    Becken von Niš aufragt.
  it: >-
    La "Montagna Secca", una monumentale muraglia calcarea affilata lunga 45 km che si erge sull'altopiano di
    Niš.
  pt: >-
    A "Montanha Seca", uma monumental muralha calcária afiada com 45 km de comprimento erguendo-se sobre o
    planalto de Niš.
unico:
  es: >-
    Aquí viven dos plantas reliquia, Ramonda serbica y Ramonda nathaliae, y caballos asilvestrados que suben
    por encima de los 1600 metros.
  en: >-
    Two Tertiary relict plants, Ramonda serbica and Ramonda nathaliae, thrive here alongside feral horses that
    roam above 1600 metres.
  fr: >-
    Ici prospèrent deux plantes reliques, Ramonda serbica et Ramonda nathaliae, et des chevaux ensauvagés qui
    parcourent les crêtes au-dessus de 1600 mètres.
  de: >-
    Hier gedeihen zwei Reliktpflanzen des Tertiärs, Ramonda serbica und Ramonda nathaliae, sowie verwilderte
    Pferde, die Höhen über 1600 Metern beweiden.
  it: >-
    Qui allignano due piante relitte, Ramonda serbica e Ramonda nathaliae, e cavalli rinselvatichiti che
    salgono oltre i 1600 metri di altitudine.
  pt: >-
    Aqui subsistem duas plantas relíquia, Ramonda serbica e Ramonda nathaliae, e cavalos assilvestrados que
    sobem acima dos 1600 metros de altitude.
observaciones:
  es: >-
    Lleva el agua que necesites: en las cotas altas casi no hay manantiales, y en años secos los pocos se
    agotan. Las condiciones de acceso a la reserva estricta dependen del gestor.
texto:
  es:
    intro: >-
      Se llama «la Montaña Seca» y el nombre es literal: en las cotas altas casi no hay manantiales. Jovan
      Cvijić la llamó los «Alpes del sur de Serbia»: una cresta de 45 kilómetros de largo y hasta 15 de ancho
      que empieza en Niška Banja, a unos veinte kilómetros del centro de Niš, y acaba en la cuenca de Lužnica,
      con un desnivel de 250 a 1810 metros.


      Hoy es la Reserva Natural Especial Suva Planina, declarada en 2015, con 181 kilómetros cuadrados.
    landscape: >-
      Las cumbres más altas son Trem (1810 m), Golemo Stražište (1714), Litica (1683), Sokolov Kamen (1523) y
      Mosor (984). La cresta separa los valles de Sićevo, al noreste, y Zaplanje, al oeste. El macizo tiene un
      relieve kárstico notable y es un archivo de sedimentos de distintas edades ricos en flora y fauna
      fósiles; el Valožje se reconoce como un sector de karst de alta montaña.


      Los bosques caducifolios son de roble y haya, y el cinturón de coníferas termina en la zona del pino
      mugo. El relieve deja al descubierto algunos pastos incluso en los inviernos duros, cuando el viento
      forma ventisqueros. Y como el agua escasea, los pocos manantiales se vuelven puntos de encuentro: los
      dos mayores son Bojanine Vode, junto a Sokolov Kamen, a 860 metros, y Rakoš Česma, del lado de Bela
      Palanka, donde un pequeño lago sirve de abrevadero a los caballos asilvestrados.
    wildlife: >-
      La montaña es un jardín. Hay más de 1200 especies de plantas, 128 de ellas endémicas; las 1.261 especies
      registradas hasta 2015 son un tercio de la flora de Serbia. Las endémicas son la aguileña de Pančić y la
      rosa serbia. En la zona alpina, hacia los 1.400 metros, destacan Dryas octopetala, Androsace villosa y
      Gentiana verna.


      Entre los animales hay tritón crestado, tortuga mediterránea, víbora cornuda, [águila
      real](/especie/aquila_chrysaetos/), rata nival, [lobo](/especie/canis_lupus/), corzo y jabalí. Viven más
      de 139 especies de aves, 25 de mamíferos, 13 de reptiles, 259 de insectos y 86 de mariposas. El plan de
      la reserva nombra el alimoche, el águila real, el águila culebrera, el busardo moro, el gavilán chico y
      el halcón peregrino entre las aves del área estrictamente protegida.


      Los caballos son los protagonistas del año. Los de Divna Gorica también suben a las zonas más altas, por
      encima de 1600 m. Durante siglos los vecinos los guardaron en establos en invierno y los soltaban en
      primavera; hoy cientos de vacas y caballos pastan libres durante la estación cálida, hasta principios de
      noviembre. El último fin de semana de febrero se celebra la «Subida de invierno a Trem», que reúne a más
      de 600 montañeros de los Balcanes.
    visit: >-
      Desde Niš se llega por Niška Banja hasta el paraje de Bojanine Vode, donde empiezan los senderos hacia
      las cumbres y crestas. No hay autobús hasta allí: la caminata empieza en el pueblo de Gornja Studena.
      Además de Trem, el pico más alto, se organizan salidas a Sokolov Kamen y al rocoso Mosor, o la travesía
      de toda la cresta.


      El acceso a la reserva estricta contempla visitas educativas autorizadas por el gestor, y el plan
      propone que el refugio de montaña de Bojanine Vode incorpore un centro de visitantes. La autopista E-80
      entre Niš y la frontera búlgara atraviesa el norte de la zona del plan.
    history: >-
      Hay historia profunda aquí. En la cueva de Pešturina, al norte, se han hallado piezas del Paleolítico
      medio y superior desde 2006, y en abril de 2019 se anunció el primer hallazgo de restos de neandertal en
      Serbia. Desde la montaña aún se ven restos de la calzada militar romana Via Militaris, que unía
      Singidunum con Constantinopla.


      El plan organiza la montaña en tres niveles de régimen. El más alto cubre las zonas poco alteradas,
      desde el pico Mosor por Sokolov Kamen, Trem, Točila y Smrdan hasta Ržanca y Divna Gorica; el segundo
      incluye Valožje, el pico Golemo Stražište y el enclave de Rubovac-Cerje. La montaña es además parte de
      la red ecológica europea Emerald y área importante internacional para aves, plantas y mariposas.


      Desde los años setenta la población local mengua y los grandes rebaños de vacas y sobre todo de ovejas
      ya no existen. En 2021 el único manantial, Rakoš, se secó por completo en agosto, y fue la peor de las
      seis grandes sequías registradas desde 1990, porque la montaña es cada vez más seca.
    before: >-
      Lleva el agua que necesites: en las cotas altas casi no hay manantiales, y en años secos los pocos se
      agotan. Las condiciones de acceso a la reserva estricta dependen del gestor.
    around: >-
      A unos veinticinco kilómetros queda el [Parque Natural Stara
      Planina](/lugar/park-prirode-stara-planina/). Entre los lugares lejanos, [Els
      Ports](/lugar/parc-natural-dels-ports/) comparte alimoche, gato montés y halcón peregrino, con alta
      montaña y karst; [Vikos-Aoös](/lugar/vikos---aoos-national-park/) comparte alimoche y rebeco, con alta
      montaña y karst; y el [Verdon](/lugar/parc-naturel-regional-du-verdon---gorges/) y las [Hoces del
      Duratón](/lugar/parque-natural-hoces-del-rio-duraton/) comparten alimoche, halcón peregrino y águila
      real, también con karst.
  en:
    intro: >-
      It is called the "Dry Mountain", and the name is literal: at high elevations, springs are practically
      non-existent. Jovan Cvijić dubbed it the "Alps of Southern Serbia": a sheer limestone crest 45
      kilometres long and up to 15 wide, beginning at Niška Banja, some twenty kilometres from the centre of
      Niš, and terminating in the Lužnica basin, spanning an elevation gain from 250 to 1810 metres.


      Today it constitutes the Suva Planina Special Nature Reserve, designated in 2015 and covering 181 square
      kilometres.
    landscape: >-
      The highest summits are Trem (1810 m), Golemo Stražište (1714), Litica (1683), Sokolov Kamen (1523), and
      Mosor (984). The knife-edge ridge separates the Sićevo gorge to the northeast from Zaplanje to the west.
      The massif exhibits extraordinary karst topography and forms an exceptional sedimentary archive rich in
      fossil flora and fauna; the Valožje plateau is recognized as an outstanding high-mountain karst
      landscape.


      Deciduous forests are dominated by oak and beech, with the coniferous belt tapering off into dwarf
      mountain pine. The exposed topography keeps some pastures wind-scoured even during harsh winters when
      blizzards pile deep drifts. Because surface water is scarce, the few permanent springs become vital
      gathering points: the two largest are Bojanine Vode, nestled beneath Sokolov Kamen at 860 metres, and
      Rakoš Česma on the Bela Palanka flank, where a small pond serves as a watering hole for semi-feral
      horses.
    wildlife: >-
      The mountain is a botanical garden. Over 1200 plant species grow here, 128 of which are regional
      endemics; the 1,261 species inventoried up to 2015 represent a full third of Serbia's flora. Endemics
      include Pančić's columbine and Serbian rose. In the alpine belt around 1,400 metres, *Dryas octopetala*,
      *Androsace villosa*, and *Gentiana verna* flourish on rocky ledges.


      Fauna includes great crested newt, Hermann's tortoise, nose-horned viper, [golden
      eagle](/especie/aquila_chrysaetos/), European snow vole, [grey wolf](/especie/canis_lupus/), roe deer,
      and wild boar. More than 139 bird species, 25 mammals, 13 reptiles, 259 insects, and 86 butterflies
      inhabit the reserve. The reserve management plan highlights Egyptian vulture, golden eagle, short-toed
      snake eagle, long-legged buzzard, levant sparrowhawk, and peregrine falcon among the avifauna of the
      strictly protected core zone.


      Horses are the year-round icons of the plateau. The herds from Divna Gorica range into the highest zones
      above 1600 m. For generations, local villagers stabled livestock in winter and released them in spring;
      today hundreds of cattle and semi-feral horses graze freely across the ridges during the warm season
      until early November. On the last weekend of February, the annual "Winter Climb to Trem" convenes over
      600 mountaineers from across the Balkans.
    visit: >-
      From Niš, access leads through Niška Banja to the mountain retreat of Bojanine Vode, where hiking trails
      strike out toward the summits and ridges. There is no public bus service to the site; walking approaches
      begin in the village of Gornja Studena. Beyond Trem, the highest crest, guided outings tackle Sokolov
      Kamen, the rocky needle of Mosor, or the full ridge traverse.


      Access to the strict nature reserve core is restricted to educational and research visits authorized by
      the management body, and the management plan proposes developing a visitor centre at the Bojanine Vode
      mountain lodge. Motorway E-80 linking Niš to the Bulgarian border traverses the northern edge of the
      reserve planning zone.
    history: >-
      Human history runs deep here. Pešturina cave in the north has yielded Middle and Upper Paleolithic stone
      tools since 2006, and in April 2019 archaeologists announced the discovery of the first confirmed
      Neanderthal remains in Serbia. From the heights, remnants of the Roman military highway Via Militaris
      connecting Singidunum with Constantinople can still be traced across the plains below.


      The reserve zoning organizes the mountain into three conservation regimes. The first and strictest tier
      covers near-pristine crests, stretching from Mount Mosor across Sokolov Kamen, Trem, Točila, and Smrdan
      to Ržanca and Divna Gorica; the second includes the Valožje karst basin, Golemo Stražište peak, and the
      Rubovac-Cerje enclave. The mountain is also incorporated into the European Emerald network and
      recognized as an Important Bird Area, Important Plant Area, and Prime Butterfly Area.


      Since the nineteen-seventies the rural population has dwindled, and the massive herds of cattle and
      sheep have disappeared. In 2021 the mountain's primary high-altitude spring, Rakoš, dried up entirely in
      August, marking the worst of six severe droughts recorded since 1990 as the mountain becomes
      progressively drier.
    before: >-
      Carry all the drinking water you will need: natural springs are virtually non-existent at high altitudes
      and can dry up during arid seasons. Access regulations for the strict protection zone are set by the
      managing authority.
    around: >-
      Some twenty-five kilometres away lies [Stara Planina Nature Park](/lugar/park-prirode-stara-planina/).
      Among distant counterparts, [Els Ports](/lugar/parc-natural-dels-ports/) shares Egyptian vulture,
      wildcat, and peregrine falcon amidst karst mountain relief;
      [Vikos-Aoös](/lugar/vikos---aoos-national-park/) shares Egyptian vulture and chamois across high karst
      walls; while [Gorges du Verdon](/lugar/parc-naturel-regional-du-verdon---gorges/) and [Hoces del Río
      Duratón](/lugar/parque-natural-hoces-del-rio-duraton/) share Egyptian vulture, peregrine falcon, and
      golden eagle on dramatic limestone canyons.
  fr:
    intro: >-
      On l'appelle la « Montagne Sèche » et ce nom est rigoureusement exact : sur les crêtes sommitales, les
      sources sont quasiment absentes. Jovan Cvijić la surnommait les « Alpes du sud de la Serbie » : une
      arête calcaire de 45 kilomètres de long et jusqu'à 15 de large s'étirant de Niška Banja, à une vingtaine
      de kilomètres du centre de Niš, jusqu'au bassin de Lužnica, avec un dénivelé spectaculaire de 250 à 1810
      mètres.


      Aujourd'hui, elle forme la Réserve naturelle spéciale de Suva Planina, créée en 2015 sur 181 kilomètres
      carrés.
    landscape: >-
      Les plus hauts sommets sont le Trem (1810 m), le Golemo Stražište (1714), la Litica (1683), le Sokolov
      Kamen (1523) et le Mosor (984). La ligne de crête sépare les gorges de Sićevo au nord-est de la
      dépression de Zaplanje à l'ouest. Le massif présente un modelé karstique exceptionnel et constitue une
      formidable archive sédimentaire riche en fossiles ; le plateau de Valožje est reconnu comme un
      remarquable karst d'altitude.


      Les forêts de feuillus se composent de chênes et de hêtres, tandis que la ceinture de conifères s'achève
      dans la zone du pin mugo. Le relief venteux dégage certains alpages même lors des hivers rudes marqués
      par de gros congères. Et comme l'eau fait défaut, les rares points d'eau pérennes deviennent cruciaux :
      les deux plus notables sont Bojanine Vode au pied de Sokolov Kamen à 860 mètres, et Rakoš Česma du côté
      de Bela Palanka, où une mare abreuve les chevaux semi-sauvages.
    wildlife: >-
      La montagne forme un véritable jardin d'altitude. On y dénombre plus de 1200 espèces végétales, dont 128
      endémiques ; les 1 261 taxons répertoriés jusqu'en 2015 constituent un tiers de toute la flore de
      Serbie. Parmi les endémiques se distinguent l'ancolie de Pančić et la rose de Serbie. À l'étage alpin
      vers 1 400 mètres prospèrent *Dryas octopetala*, *Androsace villosa* et *Gentiana verna*.


      La faune comprend le triton crêté, la tortue d'Hermann, la vipère ammodyte, l'[aigle
      royal](/especie/aquila_chrysaetos/), le campagnol des neiges, le [loup](/especie/canis_lupus/), le
      chevreuil et le sanglier. On compte plus de 139 espèces d'oiseaux, 25 de mammifères, 13 de reptiles, 259
      d'insectes et 86 de papillons. Le plan de gestion mentionne le vautour percnoptère, l'aigle royal, le
      circaète Jean-le-Blanc, la buse féroce, l'épervier à pieds courts et le faucon pèlerin au sein de la
      zone de protection intégrale.


      Les chevaux sont les figures emblématiques des crêtes. Les hardes de Divna Gorica montent également sur
      les hauts plateaux au-dessus de 1600 m. Pendant des siècles, les habitants hivernaient leurs bêtes à
      l'étable avant de les relâcher au printemps ; de nos jours, des centaines de bovins et de chevaux errent
      librement en estive jusqu'à début novembre. Le dernier week-end de février accueille la traditionnelle «
      Ascension hivernale du Trem », qui réunit plus de 600 alpinistes venus de tous les Balkans.
    visit: >-
      Depuis Niš, l'accès passe par Niška Banja pour gagner le site de Bojanine Vode, d'où s'élancent les
      sentiers vers les cimes et les crêtes. Aucun autocar ne dessert les lieux : les marches d'approche
      partent du village de Gornja Studena. Outre le Trem, point culminant, des randonnées mènent à Sokolov
      Kamen, à la pointe rocheuse du Mosor ou à l'intégrale de l'arête.


      L'entrée dans la réserve intégrale est soumise à autorisation du gestionnaire pour les visites
      pédagogiques, et le plan prévoit l'aménagement d'un centre d'accueil des visiteurs au refuge de Bojanine
      Vode. L'autoroute E-80 reliant Niš à la frontière bulgare longe le secteur nord du périmètre de
      protection.
    history: >-
      Ce massif recèle une histoire humaine très ancienne. Dans la grotte de Pešturina, au nord, des outils du
      Paléolithique moyen et supérieur ont été mis au jour depuis 2006, et la découverte des premiers restes
      de Néandertal en Serbie y a été annoncée en avril 2019. Du haut de la montagne se devinent encore les
      traces de la voie militaire romaine Via Militaris reliant Singidunum à Constantinople.


      Le zonage organise le territoire en trois niveaux de protection. Le plus strict couvre les secteurs
      préservés du pic Mosor jusqu'à Divna Gorica en passant par Sokolov Kamen, Trem, Točila et Smrdan ; le
      second englobe le haut plateau de Valožje, le pic Golemo Stražište et l'enclave de Rubovac-Cerje. Le
      massif appartient au réseau européen Émeraude et figure comme zone d'importance majeure pour les
      oiseaux, les plantes et les papillons.


      Depuis les années soixante-dix, l'exode rural a réduit la population et les immenses troupeaux
      d'autrefois ont disparu. En 2021, la source principale de Rakoš s'est complètement tarie en août,
      marquant la plus grave des six sécheresses majeures relevées depuis 1990 dans un massif de plus en plus
      aride.
    before: >-
      Emportez toute l'eau nécessaire à votre progression : les sources sont presque inexistantes sur les
      hauteurs et tarissent en période de sécheresse. L'accès au cœur de réserve dépend de l'autorisation
      préalable du gestionnaire.
    around: >-
      Le [Parque Natural Stara Planina](/lugar/park-prirode-stara-planina/) se trouve à environ vingt-cinq
      kilomètres. Parmi les sites lointains, [Els Ports](/lugar/parc-natural-dels-ports/) partage le vautour
      percnoptère, le chat sauvage et le faucon pèlerin en contexte calcaire ; le parc de
      [Vikos-Aoös](/lugar/vikos---aoos-national-park/) partage le percnoptère et le chamois au cœur de grands
      karsts ; tandis que le [Verdon](/lugar/parc-naturel-regional-du-verdon---gorges/) et les [Hoces del
      Duratón](/lugar/parque-natural-hoces-del-rio-duraton/) abritent également percnoptère, faucon pèlerin et
      aigle royal dans leurs gorges vertigineuses.
  de:
    intro: >-
      Er wird „Trockener Berg“ genannt und dieser Name ist wörtlich zu nehmen: In den Hochlagen gibt es so gut
      wie keine Quellen. Jovan Cvijić bezeichnete ihn als die „Alpen Südserbiens“: ein 45 Kilometer langer und
      bis zu 15 Kilometer breiter Kalkgrat, der bei Niška Banja rund zwanzig Kilometer vor den Toren von Niš
      anhebt, im Becken von Lužnica ausläuft und einen Höhenunterschied von 250 bis 1810 Metern überwindet.


      Heute bildet er das Sondernaturschutzgebiet Suva Planina, das 2015 auf einer Fläche von 181
      Quadratkilometern ausgewiesen wurde.
    landscape: >-
      Die höchsten Erhebungen sind der Trem (1810 m), Golemo Stražište (1714), Litica (1683), Sokolov Kamen
      (1523) und Mosor (984). Der Grat trennt die Schlucht von Sićevo im Nordosten von der Region Zaplanje im
      Westen. Das Massiv zeichnet sich durch ausgeprägte Karstphänomene aus und birgt ein reiches
      Sedimentarchiv mit fossiler Flora und Fauna; das Valožje-Hochplateau gilt als Paradebeispiel für alpinen
      Karst.


      Laubwälder bestehen aus Eichen und Buchen, während der Nadelwaldgürtel in Krummholzkiefern übergeht. Der
      Wind hält einige Hänge selbst in schneereichen Wintern schneefrei, wenn Stürme mächtige Wehen auftürmen.
      Da Wasser rar ist, bilden die wenigen Bestandsquellen lebenswichtige Treffpunkte: Die zwei bedeutendsten
      sind Bojanine Vode unterhalb des Sokolov Kamen auf 860 Metern Höhe und Rakoš Česma bei Bela Palanka, wo
      ein kleiner Weiher den halbwilden Pferden als Tränke dient.
    wildlife: >-
      Der Gebirgsstock gleicht einem botanischen Garten. Mehr als 1200 Pflanzenarten wachsen hier, davon 128
      Endemiten; die 1.261 bis zum Jahr 2015 nachgewiesenen Arten machen ein Drittel der gesamten Flora
      Serbiens aus. Zu den Endemiten gehören die Pančić-Akelei und die Serbische Rose. In der alpinen Zone um
      1.400 Meter florieren *Dryas octopetala*, *Androsace villosa* und *Gentiana verna*.


      Zu den Tieren zählen Kammmolch, Griechische Landschildkröte, Sandotter,
      [Steinadler](/especie/aquila_chrysaetos/), Schneemaus, [Wolf](/especie/canis_lupus/), Reh und
      Wildschwein. Mehr als 139 Vogelarten, 25 Säugetiere, 13 Reptilien, 259 Insektenarten und 86
      Schmetterlingsarten bevölkern das Areal. Der Schutzgebietsplan hebt Schmutzgeier, Steinadler,
      Schlangenadler, Adlerbussard, Kurzfangsperber und Wanderfalke in der Kernzone hervor.


      Die Pferde prägen den Rhythmus des Jahres. Die Herden von Divna Gorica steigen bis in Hochlagen über
      1600 m auf. Über Jahrhunderte hielten die Dorfbewohner ihr Vieh im Winter im Stall und ließen es im
      Frühjahr frei; heute weiden hunderte Rinder und Pferde während der warmen Monate bis Anfang November
      frei auf den Kämmen. Am letzten Februarwochenende versammelt der traditionelle „Winteraufstieg zum Trem“
      mehr als 600 Bergsteiger aus dem gesamten Balkan.
    visit: >-
      Von Niš aus führt der Weg über Niška Banja zum Berggasthof Bojanine Vode, wo die Pfade zu den Gipfeln
      und Graten ansetzen. Es gibt keinen Linienbus; Wanderer ohne Fahrzeug beginnen den Aufstieg im Dorf
      Gornja Studena. Neben dem Trem als höchstem Gipfel werden Besteigungen des Sokolov Kamen, des
      Felszackens Mosor oder Überschreitungen des Gesamtkamms unternommen.


      Der Zutritt zur Kernzone ist Bildungs- und Forschungsgruppen mit Erlaubnis der Verwaltung vorbehalten;
      der Bewirtschaftungsplan sieht die Einrichtung eines Besucherzentrums an der Hütte Bojanine Vode vor.
      Die Autobahn E-80 zwischen Niš und der bulgarischen Grenze quert den Norden des Planungsgebiets.
    history: >-
      Die menschliche Besiedlung reicht weit zurück. In der Höhle Pešturina im Norden werden seit 2006
      Artefakte des Mittel- und Jungpaläolithikums geborgen; im April 2019 gelang dort die Entdeckung der
      ersten Neandertaler-Fossilien Serbiens. Vom Kamm aus lassen sich noch Spuren der römischen Heerstraße
      Via Militaris erkennen, die einst Singidunum mit Konstantinopel verband.


      Das Schutzregime gliedert den Berg in drei Schutzzonen. Die strengste umfasst die naturnahen Höhenzüge
      vom Mosor über Sokolov Kamen, Trem, Točila und Smrdan bis Ržanca und Divna Gorica; die zweite Zone
      schließt Valožje, das Golemo Stražište und die Enklave Rubovac-Cerje ein. Das Massiv gehört zum
      europäischen Smaragd-Netzwerk und ist als Important Bird Area, Pflanzen- und Schmetterlingsschutzgebiet
      ausgewiesen.


      Seit den siebziger Jahren schrumpft die Landbevölkerung und die einstigen Großherden von Rindern und
      Schafen sind verschwunden. Im August 2021 trocknete die Hauptquelle Rakoš gänzlich aus – die schlimmste
      von sechs Dürreperioden seit 1990 auf diesem zunehmend trockenen Gebirgsstock.
    before: >-
      Führe ausreichend Trinkwasser mit: In den Hochlagen gibt es kaum Wasser und in trockenen Sommern
      versiegen die wenigen Quellen rasch. Für das Betreten der Kernzone gelten die Vorgaben der
      Reservatsverwaltung.
    around: >-
      Etwa fünfundzwanzig Kilometer entfernt liegt der [Parque Natural Stara
      Planina](/lugar/park-prirode-stara-planina/). Unter fernen Gebieten teilt [Els
      Ports](/lugar/parc-natural-dels-ports/) Schmutzgeier, Wildkatze und Wanderfalke im Karst;
      [Vikos-Aoös](/lugar/vikos---aoos-national-park/) Schmutzgeier und Gämse in alpinen Schluchten; und der
      [Verdon](/lugar/parc-naturel-regional-du-verdon---gorges/) sowie die [Hoces del
      Duratón](/lugar/parque-natural-hoces-del-rio-duraton/) vereinen Schmutzgeier, Wanderfalke und Steinadler
      an schroffen Kalkwänden.
  it:
    intro: >-
      Viene chiamata la "Montagna Secca" ed è un nome fedele alla realtà: sulle creste elevate le sorgenti
      sono pressoché introvabili. Jovan Cvijić la battezzò le "Alpi della Serbia meridionale": una cresta
      calcarea di 45 chilometri di lunghezza e fino a 15 di larghezza che prende avvio a Niška Banja, a una
      ventina di chilometri dal cuore di Niš, per esaurirsi nel bacino di Lužnica, con un dislivello compreso
      tra 250 e 1810 metri.


      Oggi costituisce la Riserva Naturale Speciale di Suva Planina, istituita nel 2015 su una superficie di
      181 chilometri quadrati.
    landscape: >-
      Le vette principali sono Trem (1810 m), Golemo Stražište (1714), Litica (1683), Sokolov Kamen (1523) e
      Mosor (984). La dorsale affilata separa la gola di Sićevo a nord-est dalla piana di Zaplanje a ovest. Il
      massiccio sfoggia un carsismo pronunciato e rappresenta un prezioso archivio sedimentario ricco di
      fossili; il pianoro di Valožje è rinomato come settore di carsismo d'alta montagna.


      I boschi di latifoglie sono dominati da querce e faggi, mentre la fascia delle conifere sfuma nel pino
      mugo. La morfologia spazzata dal vento lascia scoperti diversi pascoli persino negli inverni rigidi,
      quando le bufere creano imponenti accumuli di neve. E data la carenza d'acqua, i pochi punti di sgorgo
      diventano snodi vitali: i due maggiori sono Bojanine Vode ai piedi di Sokolov Kamen a 860 metri, e Rakoš
      Česma sul versante di Bela Palanka, dove un laghetto alimenta i cavalli rinselvatichiti.
    wildlife: >-
      La montagna è un orto botanico ad alta quota. Vi allignano oltre 1200 specie vegetali, 128 delle quali
      endemiche; i 1.261 taxa censiti fino al 2015 costituiscono un terzo della flora serba complessiva. Tra
      gli endemismi spiccano l'aquilegia di Pančić e la rosa serba. Nella fascia alpina verso i 1.400 metri
      crescono *Dryas octopetala*, *Androsace villosa* e *Gentiana verna*.


      La fauna vanta il tritone crestato, la testuggine di Hermann, la vipera dal corno, l'[Aquila
      reale](/especie/aquila_chrysaetos/), l'arvicola delle nevi, il [Lupo grigio](/especie/canis_lupus/), il
      capriolo e il cinghiale. Vivono nell'area più di 139 specie di uccelli, 25 di mammiferi, 13 di rettili,
      259 di insetti e 86 di farfalle. Il piano di tutela cita il capovaccaio, l'aquila reale, il biancone, la
      poiana codabianca, lo sparviero levantino e il falco pellegrino tra i volatili della fascia di riserva
      integrale.


      I cavalli scandiscono le stagioni dell'altopiano. I branchi di Divna Gorica risalgono anch'essi le
      creste oltre i 1600 m. Per secoli la gente del posto li ricoverava nelle stalle d'inverno liberandoli in
      primavera; oggi centinaia di mucche e cavalli pascolano bradi nella stagione mite fino a inizio
      novembre. L'ultimo fine settimana di febbraio si svolge la classica "Salita invernale al Trem", che
      raduna oltre 600 alpinisti da tutti i Balcani.
    visit: >-
      Da Niš si transita per Niška Banja fino alla località di Bojanine Vode, da cui prendono il via i
      sentieri per cime e creste. Non ci sono linee di autobus dirette: l'avvicinamento a piedi comincia nel
      paese di Gornja Studena. Oltre al Trem, vetta regina, si compiono ascese a Sokolov Kamen, allo spuntone
      di Mosor o la traversata integrale della cresta.


      L'accesso alla zona di riserva integrale prevede visite a carattere didattico autorizzate dall'ente
      parco, e la pianificazione prospetta la nascita di un centro visitatori presso il rifugio di Bojanine
      Vode. L'autostrada E-80 tra Niš e il valico bulgaro attraversa il margine settentrionale dell'area
      protetta.
    history: >-
      Questo massiccio custodisce memorie arcaiche. Nella grotta di Pešturina, a nord, sono stati portati alla
      luce manufatti del Paleolitico medio e superiore sin dal 2006, e nell'aprile 2019 è stato annunciato il
      rinvenimento dei primi resti di uomo di Neanderthal in terra serba. Dalla montagna si scorgono tuttora
      le tracce dell'antica arteria romana Via Militaris che collegava Singidunum a Costantinopoli.


      La zonizzazione ripartisce il massiccio in tre fasce di tutela. Quella più rigorosa tutela i settori
      d'alta quota dal Mosor attraverso Sokolov Kamen, Trem, Točila e Smrdan sino a Ržanca e Divna Gorica; la
      seconda abbraccia il pianoro di Valožje, il Golemo Stražište e l'enclave di Rubovac-Cerje. La montagna
      appartiene alla rete ecologica europea Smeraldo ed è riconosciuta come Important Bird Area, riserva
      botanica ed entomologica.


      Dagli anni settanta la popolazione locale è progressivamente calata e le estese mandrie di mucche e
      pecore del passato sono scomparse. Nel 2021 la sorgente primaria di Rakoš si è prosciugata completamente
      ad agosto, registrando la siccità più acuta tra le sei rilevate dal 1990 su una montagna sempre più
      arida.
    before: >-
      Porta con te tutta la scorta d'acqua necessaria: in quota le sorgenti sono quasi inesistenti e nelle
      estati siccitose si esauriscono. Le modalità di accesso alla riserva integrale sono soggette
      all'autorizzazione del gestore.
    around: >-
      A circa venticinque chilometri sorge il [Parque Natural Stara
      Planina](/lugar/park-prirode-stara-planina/). Tra le zone affini, [Els
      Ports](/lugar/parc-natural-dels-ports/) condivide capovaccaio, gatto selvatico e falco pellegrino nel
      contesto carsico; [Vikos-Aoös](/lugar/vikos---aoos-national-park/) condivide capovaccaio e camoscio tra
      pareti rocciose calcaree; mentre il [Verdon](/lugar/parc-naturel-regional-du-verdon---gorges/) e le
      [Hoces del Duratón](/lugar/parque-natural-hoces-del-rio-duraton/) associano capovaccaio, falco
      pellegrino e aquila reale su maestosi canyon d'alta quota.
  pt:
    intro: >-
      Chamam-lhe a «Montanha Seca» e o nome é literal: nas cotas elevadas quase não brotam nascentes. Jovan
      Cvijić apelidou-a de «Alpes da Sérvia meridional»: uma crista calcária com 45 quilómetros de comprimento
      e até 15 de largura que arranca em Niška Banja, a cerca de vinte quilómetros do centro de Niš, e termina
      na bacia de Lužnica, vencendo um desnível de 250 a 1810 metros.


      Hoje constitui a Reserva Natural Especial Suva Planina, classificada em 2015 com 181 quilómetros
      quadrados.
    landscape: >-
      Os pontos culminantes são Trem (1810 m), Golemo Stražište (1714), Litica (1683), Sokolov Kamen (1523) e
      Mosor (984). A linha de crista separa o desfiladeiro de Sićevo a nordeste da depressão de Zaplanje a
      oeste. O maciço exibe um modelado cársico notável e constitui um arquivo sedimentar riquíssimo em
      fósseis; o planalto de Valožje é reconhecido como um setor exemplar de carste de alta montanha.


      Os bosques caducifólios são dominados por carvalhos e faias, terminando o cinturão de coníferas na faixa
      do pinheiro-anão. O relevo fustigado pelo vento mantém algumas pastagens a descoberto mesmo nos invernos
      rigorosos, quando os nevões geram bancos de neve profundos. E como a água escasseia, as raras nascentes
      tornam-se pontos vitais: as duas maiores são Bojanine Vode, junto a Sokolov Kamen a 860 metros, e Rakoš
      Česma na vertente de Bela Palanka, onde uma pequena lagoa sacia os cavalos semi-selvagens.
    wildlife: >-
      Esta montanha é um jardim botânico singular. Ocorrem mais de 1200 espécies de plantas, 128 das quais
      endémicas; os 1.261 táxons inventariados até 2015 constituem um terço de toda a flora da Sérvia. Entre
      as endémicas destacam-se a aquilégia de Pančić e a rosa-da-sérvia. No andar alpino em torno dos 1.400
      metros prosperam *Dryas octopetala*, *Androsace villosa* e *Gentiana verna*.


      A fauna inclui o tritão-de-crista, a tartaruga-mediterrânica, a víbora-de-chifres, a
      [águia-real](/especie/aquila_chrysaetos/), o rato-das-neves, o [lobo-cinzento](/especie/canis_lupus/), o
      corço e o javali. Estão recenseadas mais de 139 espécies de aves, 25 de mamíferos, 13 de répteis, 259 de
      insetos e 86 de borboletas. O plano de ordenamento cita o britango, a águia-real, a águia-cobreira, a
      bótia-moura, o gavião-pequeno e o falcão-peregrino na zona de proteção integral.


      Os cavalos são as figuras que marcam o ano. As manadas de Divna Gorica sobem também aos planaltos
      cimeiros acima dos 1600 m. Durante séculos os pastores recolhiam o gado nos estábulos no inverno
      libertando-o na primavera; hoje centenas de vacas e cavalos pastam em liberdade durante os meses quentes
      até ao início de novembro. No último fim de semana de fevereiro tem lugar a tradicional «Subida de
      Inverno a Trem», que reúne mais de 600 montanheiros de todos os Balcãs.
    visit: >-
      A partir de Niš o percurso faz-se via Niška Banja até ao refúgio de Bojanine Vode, onde se iniciam os
      trilhos para os cumes e cristas. Não há carreira de autocarro; a marcha apeada começa na aldeia de
      Gornja Studena. Para além do Trem, o cume mais alto, organizam-se subidas a Sokolov Kamen, ao picoto
      rochoso de Mosor ou a travessia de toda a crista.


      O acesso à zona de proteção integral reserva-se a visitas de cariz pedagógico autorizadas pela gestão,
      prevendo o plano a instalação de um centro de acolhimento no refúgio de Bojanine Vode. A autoestrada
      E-80 entre Niš e a fronteira búlgara rasga o norte da área delimitada.
    history: >-
      A ocupação humana aqui é antiquíssima. Na gruta de Pešturina, a norte, desenterram-se ferramentas do
      Paleolítico Médio e Superior desde 2006, e em abril de 2019 comunicou-se a descoberta dos primeiros
      fósseis de neandertal na Sérvia. Do cume da montanha ainda se avistam vestígios da estrada militar
      romana Via Militaris que conectava Singidunum a Constantinopla.


      O ordenamento reparte o território em três níveis de regime. O mais restrito abrange os setores
      prístinos desde o monte Mosor através de Sokolov Kamen, Trem, Točila e Smrdan até Ržanca e Divna Gorica;
      o segundo integra Valožje, o pico Golemo Stražište e o enclave de Rubovac-Cerje. A montanha faz parte da
      rede ecológica europeia Esmeralda e está classificada como área de relevo internacional para aves, flora
      e borboletas.


      Desde os anos setenta a população rural tem declinado e os grandes rebanhos de outrora já não existem.
      Em 2021 a nascente principal de Rakoš secou na totalidade em agosto, constituindo a mais severa de seis
      grandes secas registadas desde 1990 numa montanha cada vez mais árida.
    before: >-
      Leva contigo toda a água potável indispensável: nos pontos altos as nascentes são quase inexistentes e
      secam rapidamente em anos de seca. As condições de entrada na reserva estrita dependem de autorização da
      entidade gestora.
    around: >-
      A cerca de vinte e cinco quilómetros fica o [Parque Natural Stara
      Planina](/lugar/park-prirode-stara-planina/). Entre os sítios congéneres, [Els
      Ports](/lugar/parc-natural-dels-ports/) partilha britango, gato-bravo e falcão-peregrino no relevo
      cársico; [Vikos-Aoös](/lugar/vikos---aoos-national-park/) partilha britango e camurça em grandes
      escarpas; e o [Verdon](/lugar/parc-naturel-regional-du-verdon---gorges/) com as [Hoces del
      Duratón](/lugar/parque-natural-hoces-del-rio-duraton/) reúnem britango, falcão-peregrino e águia-real em
      profundos desfiladeiros cársicos.
