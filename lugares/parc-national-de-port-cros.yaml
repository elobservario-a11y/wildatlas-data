resumen:
  es: >-
    Uno de los parques marinos más antiguos de Europa (1963): una isla cubierta de bosque mediterráneo y
    fondos de posidonia protegidos durante sesenta años.
  en: >-
    One of the oldest marine parks in Europe (1963): an island cloaked in Mediterranean forest and posidonia
    seabed protected for sixty years.
  fr: >-
    L'un des plus anciens parcs marins d'Europe (1963) : une île couverte de forêt méditerranéenne et des
    herbiers de posidonie protégés depuis soixante ans.
  de: >-
    Einer der ältesten Meeresparks Europas (1963): eine von Mittelmeerwald bedeckte Insel und
    Posidonia-Meeresböden, die seit sechzig Jahren geschützt sind.
  it: >-
    Uno dei più antichi parchi marini d'Europa (1963): un'isola coperta di macchia mediterranea e fondali di
    posidonia protetti da sessant'anni.
  pt: >-
    Um dos parques marinhos mais antigos da Europa (1963): uma ilha coberta por bosque mediterrânico e fundos
    de posidónia protegidos há sessenta anos.
unico:
  es: >-
    Fue el primer parque nacional de Europa que unió zonas de protección terrestre y marina, y es el sitio
    donde nació el primer sendero submarino del Mediterráneo que se hace con tubo y gafas.
  en: >-
    It was the first national park in Europe to unite terrestrial and marine protection, and the birthplace of
    the Mediterranean's first snorkeling underwater trail.
  fr: >-
    Il fut le premier parc national d'Europe à unir protection terrestre et marine, et le berceau du premier
    sentier sous-marin du bassin méditerranéen.
  de: >-
    Er war der erste Nationalpark Europas, der Land- und Meeresschutz verband, und die Wiege des ersten
    Unterwasserpfades im Mittelmeer für Schnorchler.
  it: >-
    Fu il primo parco nazionale d'Europa a unire tutela terrestre e marina, e la culla del primo sentiero
    sottomarino del Mediterraneo da percorrere con maschera e boccaglio.
  pt: >-
    Foi o primeiro parque nacional da Europa a conjugar proteção terrestre e marinha, e o berço do primeiro
    trilho submarino do Mediterrâneo percorrido com tubo e máscara.
observaciones:
  es: >-
    La afluencia es alta en el puerto de Port-Cros y en Porquerolles en verano; los meses recomendados son
    mayo, junio, septiembre y octubre. Bagaud y la Gabinière están cerrados al público. Consulta las
    condiciones de visita y los sectores abiertos antes de organizar la salida.
texto:
  es:
    intro: >-
      Antes de que fuera un parque nacional, Port-Cros fue una isla en venta. En 1937, tras quince años de
      pleitos, salió a subasta, y la alternativa era un promotor inmobiliario. La compró Paule Desmarais, y
      con ella se salvó su belleza natural. Hoy el Parque Nacional de Port-Cros, en el archipiélago de las
      islas de Hyères, es un parque a la vez terrestre y marino: 1.700 ha de tierra y 2.900 ha de mar,
      repartidas entre Porquerolles, Port-Cros, Bagaud, el islote de la Gabinière y el roquedo del Rascas.
    landscape: >-
      Port-Cros es pequeña, de unos 4,2 km de largo y 2,4 km en su parte más ancha, pero escarpada y cubierta
      de vegetación. Su roca es la del macizo de los Maures: las islas de Porquerolles, Bagaud, Port-Cros y
      Levante, junto con la península de Giens, son la extensión sur de ese macizo que emerge del mar. En los
      últimos periodos glaciares el mar retrocedió y las islas llegaron a unirse al continente. Y bajo el agua
      hay un detalle excepcional: a menos de 10 km de la costa sur de Port-Cros el talud continental alcanza
      los 2.000 m de profundidad.


      La vegetación cuenta una historia de fuego. El encinar cubría antes casi toda la isla, salvo crestas y
      zonas rocosas demasiado áridas; en 1870 la isla casi se quemó por completo y hoy el bosque de encinas
      subsiste en los valles húmedos. La flora suma unas 700 especies, con rarezas como el Genêt à feuille de
      lin y endemismos como la Dauphinelle de Requien. En la costa, la vegetación adaptada a la sal es rica
      pero está muy amenazada por el pisoteo.


      Bajo el agua se alternan los grandes hábitats del Mediterráneo: praderas de
      [posidonia](/especie/posidonia_oceanica/) con salpas y obladas, coralígeno con meros, morenas y
      dentones, y fondos arenosos que bancos de salmonetes rastrean sin descanso en busca de comida.
    wildlife: >-
      La estrella del parque es el mero moreno, y tiene nombre y apellido artístico: Jojo el mero,
      protagonista involuntario de *El mundo del silencio*, la película de Cousteau que se rodó en Port-Cros.
      La especie estuvo amenazada. Tras desplomarse por la sobrepesca, desde los años ochenta crece y
      rejuvenece dentro del parque, y en sesenta años ha pasado de 40 a casi 1.000 individuos. El islote de la
      Gabinière es el sitio que conocen los buceadores por sus numerosos meros.


      En el mar se ven además el [delfín mular](/especie/tursiops_truncatus/), el calderón, las rayas mobula,
      la [tortuga boba](/especie/caretta_caretta/) y algún barracuda.


      Arriba, en los acantilados, anidan las aves marinas. La colonia de [pardela
      cenicienta](/especie/calonectris_diomedea/) de Porquerolles, una especie migratoria rara, es la mayor de
      las costas francesas, y casi el 90 % de los nidificantes de la [pardela
      mediterránea](/especie/puffinus_yelkouan/) residen en este tramo de costa. El [halcón
      peregrino](/especie/falco_peregrinus/) tiene su lugar y el [halcón de
      Eleonora](/especie/falco_eleonorae/) se ve a veces. En primavera y otoño numerosas aves migratorias se
      detienen en las islas. En total, el parque cuenta 144 especies de aves, 40 de ellas nidificantes.


      En tierra hay rarezas discretas: el discoglosso sardo, un pequeño anfibio, y el fílodáctilo europeo, un
      pequeño reptil en regresión. Se han detectado 13 especies de murciélagos.
    visit: >-
      Se llega en barco desde Hyères. Una vez en Port-Cros, el parque propone dos maneras de ver la isla: por
      tierra y por mar.


      Por tierra, el sendero llamado «de las Crestas» cruza la cala de la Fausse-Monnaie por la playa del Sur,
      recorre el valle de la Solitude y llega al mont Vinaigre, de 194 m, la cumbre de la isla. Por mar, el
      sendero submarino de la Palud tiene seis etapas y se recorre de forma autónoma con aletas, gafas y tubo,
      en la bahía de la Palud. La caminata alterna el senderismo por el bosque mediterráneo con el sendero
      submarino que parte de la playa de la Palud.
    history: >-
      Port-Cros fue durante siglos una isla de defensa. En 1531 Francisco I convirtió en marquesado las islas
      de Bagaud, Port-Cros y Levante por la amenaza de los piratas, con la obligación de construir
      fortificaciones, y Napoleón restauró las defensas en 1811 y puso guarnición en los fuertes de la isla.
      Más tarde la isla fue refugio de escritores: el fuerte de la Vigie acogió a creadores en residencia como
      Malraux, Gide, Saint-John Perse y Valéry.


      El parque nació en 1963, cuando André Malraux hizo declarar la isla parque nacional, que se benefició de
      las donaciones de Marceline Henry, figura central de la preservación de Port-Cros en el siglo XX, y de
      los herederos de Paule Desmarais. En 2012 se amplió a la mayor parte de la isla de Porquerolles. La isla
      de Bagaud y el islote de la Gabinière son reservas integrales con el acceso prohibido. Desde 1999 el
      parque anima además la parte francesa del acuerdo Pelagos, un santuario para los mamíferos marinos del
      Mediterráneo.


      Las amenazas son concretas. El riesgo de incendio es particularmente alto en verano, cuando el viento y
      la sequía se suman a la gran afluencia, y la garra de bruja, una planta exótica invasora, amenaza a las
      plantas autóctonas de las rocas. En 2023 el parque fue identificado como víctima de sobreturismo, por la
      necesidad de regular los flujos estacionales.
    before: >-
      La afluencia es alta en el puerto de Port-Cros y en Porquerolles en verano; los meses recomendados son
      mayo, junio, septiembre y octubre. Bagaud y la Gabinière están cerrados al público. Consulta las
      condiciones de visita y los sectores abiertos antes de organizar la salida.
    around: >-
      Port-Cros no tiene vecinos cercanos en el atlas, pero comparte aves y hábitats marinos con otros
      archipiélagos. El [Parque Nacional del Archipiélago Toscano](/lugar/parco-nazionale-arcipelago-toscano/)
      y el [Parque Natural del Archipiélago de Lastovo](/lugar/park-prirode-lastovsko-otocje/) comparten la
      pardela mediterránea, la pardela cenicienta y la posidonia. El [Parque Natural del Cabo de
      Creus](/lugar/parc-natural-del-cap-de-creus/) comparte la pardela mediterránea, la posidonia y el delfín
      mular.
  en:
    intro: >-
      Before becoming a national park, Port-Cros was an island for sale. In 1937, after fifteen years of
      lawsuits, it went to auction, with a property developer waiting in the wings. Paule Desmarais bought it,
      rescuing its pristine beauty. Today Port-Cros National Park, in the Hyères archipelago, is both a
      terrestrial and marine park: 1,700 ha of land and 2,900 ha of sea, spanning Porquerolles, Port-Cros,
      Bagaud, the islet of La Gabinière, and the Rascas rock.
    landscape: >-
      Port-Cros is a steep, forested rock rising from the Mediterranean. Only 4.2 km long and 2.4 km wide, its
      coastline alternates dramatic cliffs plunging into deep blue waters with small sheltered coves: the bay
      of Port-Cros, the bay of Port-Man, and the calanque de la Palud. Valleys converge toward the sea, fed by
      seasonal streams that support dense green woodlands. Less than 10 km from the southern shore of
      Port-Cros, the continental slope plunges to 2,000 m deep.


      The forest has a fiery past. Holm oak woods once cloaked virtually the entire island except for arid
      exposed ridges; in 1870 wildfire devastated almost the entire island, and today ancient holm oaks
      survive primarily in shaded valley bottoms. The flora counts some 700 species, including rarities such
      as Linum maritimum and narrow endemics like Delphinium requienii. Coastal halophytic vegetation is lush
      yet exceptionally vulnerable to trampling.


      Beneath the surface, the Mediterranean's foundational habitats unfold: expansive meadows of
      [posidonia](/especie/posidonia_oceanica/) harboring salema and saddled seabream, coralligenous drop-offs
      patrolled by dusky groupers, morays, and dentex, and sandy shoals relentlessly sifted by schools of red
      mullet.
    wildlife: >-
      The park's undisputed celebrity is the dusky grouper, with an artistic pedigree: Jojo the grouper, star
      of Cousteau's *The Silent World*, filmed right here at Port-Cros. Once decimated by spearfishing, the
      population has rebounded within the marine reserve since the nineteen-eighties, surging over sixty years
      from just 40 individuals to nearly 1,000. The islet of La Gabinière is renowned among divers worldwide
      for its dense congregations of groupers.


      In surrounding waters roam the [common bottlenose dolphin](/especie/tursiops_truncatus/), long-finned
      pilot whale, devil rays, [loggerhead sea turtle](/especie/caretta_caretta/), and occasional barracudas.


      High above, sea cliffs host thriving seabird colonies. The [Scopoli's
      shearwater](/especie/calonectris_diomedea/) colony on neighboring Porquerolles is the largest along
      French shores, and nearly 90 % of breeding [Yelkouan shearwaters](/especie/puffinus_yelkouan/) nest
      along this coastline. The [peregrine falcon](/especie/falco_peregrinus/) claims its cliff niches and
      [Eleonora's falcon](/especie/falco_eleonorae/) is a regular visitor. Across spring and autumn
      migrations, hordes of passerines make landfall. Overall, 144 bird species have been recorded, 40 of them
      breeding locally.


      Terrestrial rarities include the Tyrrhenian painted frog and the European leaf-toed gecko, a small
      nocturnal reptile in decline. Researchers have documented 13 bat species.
    visit: >-
      Access is by passenger ferry from Hyères. Once ashore on Port-Cros, the park invites exploration by land
      and by sea.


      On foot, the Sentier des Crêtes traverses the Fausse-Monnaie cove above the South Beach, ascends the
      Solitude valley, and reaches Mont Vinaigre at 194 m, the island's highest summit. By sea, the underwater
      trail of La Palud offers six interpretive buoys explored autonomously with fins, mask, and snorkel in
      the sheltered waters of La Palud bay. A classic day combines coastal hiking under shady pines with
      snorkeling along the underwater trail.


      All motorized vehicles and bicycles are strictly banned on Port-Cros: travel is exclusively on foot.
    history: >-
      For centuries Port-Cros served as a strategic military outpost. In 1531 Francis I established a
      marquisate over the Îles d'Hyères—Bagaud, Port-Cros, and Levant—to counter Barbary corsairs, mandating
      defensive fortifications; Napoleon upgraded the bastions in 1811 and garrisoned the island's stone
      forts. Later the island became a haven for writers: the Fort de la Vigie hosted creative residencies for
      Malraux, Gide, Saint-John Perse, and Valéry.


      The national park was established in 1963 through the advocacy of André Malraux, bolstered by land
      donations from Marceline Henry—the central champion of Port-Cros conservation in the twentieth
      century—and the heirs of Paule Desmarais. In 2012 protection expanded to encompass most of Porquerolles.
      The island of Bagaud and the islet of La Gabinière are designated strict nature reserves with all
      landing strictly prohibited. Since 1999 the park also coordinates the French sector of the Pelagos
      Sanctuary for Mediterranean marine mammals.


      Modern challenges are acute. Wildfire risk escalates in summer, when drought and Mistral winds coincide
      with tourist arrivals, while the invasive Hottentot-fig threatens native cliff-dwelling flora. In 2023
      the park was formally cited as vulnerable to overtourism, underscoring the urgent need to cap seasonal
      visitor flows.
    before: >-
      Summer crowds peak at Port-Cros harbor and on Porquerolles; the recommended visiting windows are
      May–June and September–October. Bagaud and La Gabinière are closed to the public. Always consult sailing
      guidelines, mooring zones, and open hiking sectors with the park office prior to visiting.
    around: >-
      Port-Cros has no immediate neighbors in the atlas, yet it shares pelagic seabirds and marine habitats
      with other Mediterranean archipelagos. [Tuscan Archipelago National
      Park](/lugar/parco-nazionale-arcipelago-toscano/) and [Lastovo Archipelago Nature
      Park](/lugar/park-prirode-lastovsko-otocje/) share Yelkouan shearwaters, Scopoli's shearwaters, and
      posidonia meadows. [Cap de Creus Natural Park](/lugar/parc-natural-del-cap-de-creus/) shares
      shearwaters, posidonia, and bottlenose dolphins.
  fr:
    intro: >-
      Avant de devenir un parc national, Port-Cros fut une île mise en vente. En 1937, après quinze années de
      litiges judiciaires, elle fut mise aux enchères, convoitée par des promoteurs immobiliers. Paule
      Desmarais l'acheta, sauvant ainsi sa beauté sauvage. Aujourd'hui, le Parc national de Port-Cros, dans
      l'archipel des îles d'Hyères, est un parc à la fois terrestre et marin : 1 700 ha de terre et 2 900 ha
      de mer, répartis entre Porquerolles, Port-Cros, Bagaud, l'îlot de la Gabinière et le rocher du Rascas.
    landscape: >-
      Port-Cros est un rocher boisé et abrupt surgissant des flots méditerranéens. Longue de seulement 4,2 km
      sur 2,4 km de large, son littoral alterne falaises spectaculaires plongeant dans le bleu profond et
      petites criques abritées : la baie de Port-Cros, celle de Port-Man et la calanque de la Palud. Les
      vallons convergent vers la mer, alimentés par des ruissellements qui entretiennent une couverture
      forestière remarquablement dense. À moins de 10 km de la côte sud de Port-Cros, le talus continental
      plonge à 2 000 m de profondeur.


      La forêt possède une mémoire de feu. La chênaie verte couvrait autrefois la quasi-totalité de l'île,
      hors crêtes rocheuses trop arides ; en 1870, un grand incendie ravagea presque toute l'île, et
      aujourd'hui les vieux chênes verts subsistent dans les vallons humides. La flore rassemble quelque 700
      espèces, avec des raretés comme le lin maritime et des endémiques stricts tels que la dauphinelle de
      Requien. La végétation halophile côtière est florissante mais très vulnérable au piétinement.


      Sous l'eau se succèdent les grands écosystèmes méditerranéens : de vastes herbiers de
      [posidonie](/especie/posidonia_oceanica/) abritant saupes et oblades, des fonds coralligènes où
      patrouillent mérous bruns, murènes et dentis, et des bancs de sable inlassablement fouillés par les
      rougets.
    wildlife: >-
      La star incontestée du parc est le mérou brun, doté d'une célébrité historique : Jojo le mérou, vedette
      involontaire du *Monde du silence*, le film de Cousteau tourné à Port-Cros. Naguère décimée par la
      chasse sous-marine, l'espèce a spectaculairement recolonisé les fonds depuis les années quatre-vingt,
      passant en soixante ans de 40 à près de 1 000 individus. L'îlot de la Gabinière est le spot mondialement
      réputé des plongeurs pour ses concentrations de mérous.


      Au large croisent également le [grand dauphin](/especie/tursiops_truncatus/), le globicéphale noir, les
      raies mobula, la [tortue caouanne](/especie/caretta_caretta/) et quelques barracudas.


      Sur les falaises côtières nichent les oiseaux marins. La colonie de [puffin
      cendré](/especie/calonectris_diomedea/) de Porquerolles est la plus importante des côtes françaises, et
      près de 90 % des couples reproducteurs de [puffin yelkouan](/especie/puffinus_yelkouan/) nichent sur ce
      littoral. Le [faucon pèlerin](/especie/falco_peregrinus/) y trouve ses parois et le [faucon
      d'Éléonore](/especie/falco_eleonorae/) s'y observe régulièrement. Au printemps et à l'automne, une foule
      de migrateurs fait escale sur les îles. Au total, le parc recense 144 espèces d'oiseaux, dont 40
      nicheuses.


      À terre vivent des raretés discrètes : le discoglosse sarde et le phyllodactyle d'Europe, un petit
      reptile nocturne menacé. On y a également répertorié 13 espèces de chauves-souris.
    visit: >-
      L'accès s'effectue en navette maritime depuis Hyères. Arrivé à Port-Cros, le parc propose deux approches
      complémentaires : à pied et sous l'eau.


      À terre, le sentier des Crêtes franchit la calanque de la Fausse-Monnaie par la plage du Sud, remonte le
      vallon de la Solitude et atteint le mont Vinaigre, point culminant de l'île à 194 m. En mer, le sentier
      sous-marin de la Palud compte six stations balisées que l'on parcourt en autonomie avec palmes, masque
      et tuba dans l'anse protégée de la Palud. L'excursion classique alterne marche sous la pinède et
      exploration du sentier palmé.


      Tout véhicule à moteur et vélo étant interdit à Port-Cros, la découverte s'effectue exclusivement à
      pied.
    history: >-
      Port-Cros fut pendant des siècles un avant-poste défensif. En 1531, François Ier érigea en marquisat les
      îles d'Hyères—Bagaud, Port-Cros et Levant—face à la menace barbaresque, imposant la construction de
      forts ; Napoléon restaura les remparts en 1811 et garnit les forteresses de l'île. Plus tard, l'île
      devint un havre littéraire : le fort de la Vigie accueillit des écrivains comme Malraux, Gide,
      Saint-John Perse et Valéry.


      Le parc national naquit en 1963 sous l'impulsion d'André Malraux, soutenu par les donations de Marceline
      Henry—figure centrale de la sauvegarde de l'île au XXe siècle—et des héritiers de Paule Desmarais. En
      2012, la protection s'étendit à la quasi-totalité de Porquerolles. L'île de Bagaud et l'îlot de la
      Gabinière sont des réserves intégrales d'accès formellement interdit. Depuis 1999, le parc anime
      également la partie française du Sanctuaire Pelagos pour les mammifères marins.


      Les enjeux contemporains sont prégnants. Le risque d'incendie est maximal en été sous l'effet du mistral
      et de la sécheresse, tandis que la griffe de sorcière menace la flore littorale indigène. En 2023, le
      parc a été reconnu vulnérable au surtourisme, imposant une régulation des flux de visiteurs.
    before: >-
      La fréquentation est très forte au port de Port-Cros et à Porquerolles en été ; privilégiez mai, juin,
      septembre et octobre. Bagaud et la Gabinière sont interdits d'accès. Renseignez-vous auprès des
      capitaineries et maisons du parc sur les zones de mouillage et les secteurs ouverts.
    around: >-
      Sans voisins immédiats dans l'atlas, Port-Cros partage oiseaux pélagiques et herbiers marins avec
      d'autres archipels. Le [Parc national de l'archipel toscan](/lugar/parco-nazionale-arcipelago-toscano/)
      et le [Parc naturel de l'archipel de Lastovo](/lugar/park-prirode-lastovsko-otocje/) partagent puffin
      yelkouan, puffin cendré et posidonie. Le [Parc naturel du Cap de
      Creus](/lugar/parc-natural-del-cap-de-creus/) partage puffins, posidonie et grand dauphin.
  de:
    intro: >-
      Bevor Port-Cros zum Nationalpark wurde, stand die Insel zum Verkauf. 1937, nach fünfzehn Jahren
      Rechtsstreitigkeiten, kam sie zur Versteigerung, und die Alternative war ein Immobilienentwickler. Paule
      Desmarais erwarb die Insel und rettete damit ihre unberührte Natur. Heute ist der Nationalpark Port-Cros
      im Archipel der Hyères-Inseln zugleich ein Land- und Meeresnationalpark: 1.700 ha Land und 2.900 ha
      Meer, verteilt auf Porquerolles, Port-Cros, Bagaud, das Eiland La Gabinière und die Rascas-Klippe.
    landscape: >-
      Port-Cros ist ein steil aus dem Mittelmeer aufragender, dicht bewaldeter Felsen. Bei nur 4,2 km Länge
      und 2,4 km Breite wechseln spektakuläre Steilklippen, die ins tiefe Blau abfallen, mit geschützten
      Buchten ab: der Bucht von Port-Cros, der Bucht von Port-Man und der Calanque de la Palud. Schmale Täler
      streben dem Meer zu, genährt von periodischen Bächen, die dichte Wälder erhalten. Weniger als 10 km von
      der Südküste von Port-Cros entfernt fällt der Kontinentalhang auf 2.000 m Tiefe ab.


      Der Wald hat eine Brandgeschichte. Steineichen bedeckten einst fast die gesamte Insel mit Ausnahme
      felsiger, karger Grate; 1870 verwüstete ein verheerender Großbrand nahezu das gesamte Eiland, und alte
      Eichen überdauerten nur in feuchten Talgründen. Die Flora zählt etwa 700 Arten mit Seltenheiten wie dem
      Meer-Lein und Endemiten wie Delphinium requienii. Die salztolerante Küstenflora ist üppig, leidet jedoch
      stark unter Trittbelastung.


      Unter Wasser breiten sich die Leitökosysteme des Mittelmeers aus: weitläufige Wiesen der
      [Posidonia](/especie/posidonia_oceanica/) mit Goldstriemen und Brandbrassen, Koralligène-Steilwände mit
      Braunen Zackenbarschen, Muränen und Zahnbrassen sowie Sandgründe, die von Meerbarbenschwärmen durchwühlt
      werden.
    wildlife: >-
      Der gefeierte Star des Meeresparks ist der Braune Zackenbarsch, bekannt durch eine filmische
      Berühmtheit: Jojo der Zackenbarsch aus Cousteaus Oscar-prämiertem Film *Die schweigende Welt*, der in
      Port-Cros gedreht wurde. Nach starker Überfischung durch Harpunenangler erholte sich der Bestand seit
      den achtziger Jahren und wuchs in sechzig Jahren von 40 auf fast 1.000 Tiere an. Das Inselchen La
      Gabinière ist unter Tauchern weltweit für seine dichten Barschschulen berühmt.


      Im offenen Meer ziehen [Großer Tümmler](/especie/tursiops_truncatus/), Grindwale, Teufelsrochen,
      [Unechte Karettschildkröte](/especie/caretta_caretta/) und Barrakudas vorüber.


      Auf den Klippen brüten zahlreiche Meeresvögel. Die Kolonie des
      [Gelbschnabel-Sturmtauchers](/especie/calonectris_diomedea/) auf Porquerolles ist die bedeutendste an
      Frankreichs Küsten, und fast 90 % der Brutpaare des
      [Mittelmeer-Sturmtauchers](/especie/puffinus_yelkouan/) nisten in diesem Küstenabschnitt. Der
      [Wanderfalke](/especie/falco_peregrinus/) nutzt Felsnischen, und der
      [Eleonorenfalke](/especie/falco_eleonorae/) wird regelmäßig beobachtet. Während des Frühjahrs- und
      Herbstzugs rasten unzählige Zugvögel. Insgesamt weist der Park 144 Vogelarten auf, 40 davon als
      Brutvögel.


      An Land leben verborgene Seltenheiten: der Tyrrhenische Scheibenzüngler und der Europäische
      Blattfingergecko. Forscher wiesen 13 Fledermausarten nach.
    visit: >-
      Die Anreise erfolgt mit Personenfähren ab Hyères. Auf Port-Cros angekommen, lässt sich die Insel an Land
      und unter Wasser erkunden.


      Zu Fuß quert der Kammweg (Sentier des Crêtes) die Calanque de la Fausse-Monnaie über den Südstrand,
      steigt durch das Solitude-Tal an und erreicht mit dem Mont Vinaigre (194 m) den höchsten Punkt der
      Insel. Unter Wasser führt der Unterwasserlehrpfad von La Palud über sechs Bojenstationen, die mit
      Flossen, Maske und Schnorchel in der geschützten Bucht von La Palud auf eigene Faust erkundet werden
      können. Ein klassischer Tagesausflug verbindet schattige Waldwanderungen mit Schnorcheln.


      Da Kraftfahrzeuge und Fahrräder auf Port-Cros verboten sind, bewegt man sich ausschließlich zu Fuß fort.
    history: >-
      Port-Cros diente über Jahrhunderte als befestigter militärischer Außenposten. 1531 erhob Franz I. die
      Îles d'Hyères—Bagaud, Port-Cros und Levant—zum Markgrafentum zur Abwehr barbaresker Piraten und
      verpflichtete zur Befestigung; Napoleon modernisierte die Wehranlagen 1811 und bemannte die Forts.
      Später wurde die Insel zum Refugium für Literaten: Das Fort de la Vigie beherbergte Künstlerresidenzen
      für Malraux, Gide, Saint-John Perse und Valéry.


      Der Nationalpark entstand 1963 auf Initiative von André Malraux, unterstützt durch Schenkungen von
      Marceline Henry—der Pionierin des Inselschutzes im zwanzigsten Jahrhundert—und den Erben von Paule
      Desmarais. 2012 dehnte sich der Schutz auf weite Teile von Porquerolles aus. Die Insel Bagaud und das
      Eiland La Gabinière sind Totalreservate mit absolutem Betretungsverbot. Seit 1999 betreut der Park zudem
      den französischen Teil des Pelagos-Heiligtums für Meeressäuger.


      Aktuelle Herausforderungen sind drängend: Die Waldbrandgefahr erreicht im Sommer bei Mistralwinden
      Spitzenwerte, während die invasive Mittagsblume Felsvegetation verdrängt. 2023 wurde der Park als durch
      Overtourismus gefährdet eingestuft, was Lenkungsmaßnahmen nötig machte.
    before: >-
      Der Besucherandrang ist im Hafen von Port-Cros und auf Porquerolles im Sommer extrem hoch;
      empfehlenswert sind Mai, Juni, September und Oktober. Bagaud und La Gabinière sind für die
      Öffentlichkeit gesperrt. Informiere dich vorab bei der Parkverwaltung über Ankerzonen und offene
      Wanderwege.
    around: >-
      Port-Cros hat keine direkten Nachbarn im Atlas, teilt aber Hochseevögel und marine Lebensräume mit
      anderen Mittelmeerarchipelen. Der [Nationalpark Toskanischer
      Archipel](/lugar/parco-nazionale-arcipelago-toscano/) und der [Naturpark
      Lastovo-Archipel](/lugar/park-prirode-lastovsko-otocje/) teilen Mittelmeer-Sturmtaucher,
      Gelbschnabel-Sturmtaucher und Seegraswiesen. Der [Naturpark Cap de
      Creus](/lugar/parc-natural-del-cap-de-creus/) teilt Sturmtaucher, Seegras und Großen Tümmler.
  it:
    intro: >-
      Prima di divenire un parco nazionale, Port-Cros fu un'isola messa all'asta. Nel 1937, dopo quindici anni
      di dispute giudiziarie, rischiò di finire nelle mani della speculazione edilizia. La acquistò Paule
      Desmarais, salvaguardandone la bellezza naturale. Oggi il Parco Nazionale di Port-Cros, nell'arcipelago
      delle Isole di Hyères, è un parco al contempo terrestre e marino: 1.700 ettari di terra e 2.900 ettari
      di mare, suddivisi tra Porquerolles, Port-Cros, Bagaud, l'isolotto della Gabinière e lo scoglio del
      Rascas.
    landscape: >-
      Port-Cros si presenta come un ripido sperone boscoso che emerge dalle acque del Mediterraneo. Con appena
      4,2 km di lunghezza per 2,4 km di larghezza, la costa alterna maestose scogliere a picco sul mare aperto
      a baie riparate: la rada di Port-Cros, la baia di Port-Man e la calanca de la Palud. Valloni ombrosi
      scendono verso il mare, alimentati da ruscelli stagionali che sostengono una copertura forestale densa e
      lussureggiante. A meno di 10 km dalla costa meridionale di Port-Cros la scarpata continentale sprofonda
      a 2.000 m di profondità.


      La selva reca i segni del fuoco. La lecceta copriva anticamente l'intera isola, eccezion fatta per i
      crinali rocciosi più aridi; nel 1870 un violento incendio arse quasi per intero l'isola, e oggi i lecci
      vetusti resistono nelle forre umide. La flora assomma circa 700 specie, con rarità quali il lino
      marittimo ed endemismi come Delphinium requienii. La vegetazione alofila litoranea è florida ma patisce
      il calpestio.


      Sotto la superficie marina prosperano gli habitat primari del Mediterraneo: estese praterie di
      [posidonia](/especie/posidonia_oceanica/) popolate da salpe e occhiate, fondali coralligeni sorvegliati
      da cernie brune, murene e dentici, e banchi sabbiosi scandagliati dalle triglie.
    wildlife: >-
      La regina indiscussa dei fondali è la cernia bruna, legata a una celebrità cinematografica: Jojo la
      cernia, protagonista del documentario *Il mondo del silenzio* di Jacques Cousteau, girato proprio a
      Port-Cros. Ridotta allo stremo dalla pesca subacquea, la specie ha conosciuto una formidabile ripresa a
      partire dagli anni ottanta, salendo in sessant'anni da 40 a quasi 1.000 esemplari. L'isolotto della
      Gabinière è celebre tra i subacquei di tutto il mondo per le sue spettacolari concentrazioni di cernie.


      In mare aperto si avvistano il [tursìope](/especie/tursiops_truncatus/), il globicefalo, le mobule, la
      [tartaruga comune](/especie/caretta_caretta/) e banchi di barracuda.


      Sulle falesie nidificano gli uccelli pelagici. La colonia di [berta maggiore
      mediterranea](/especie/calonectris_diomedea/) di Porquerolles è la più importante delle coste francesi,
      e quasi il 90 % delle coppie nidificanti di [berta minore](/especie/puffinus_yelkouan/) si riproduce
      lungo questo litorale. Trovano rifugio il [falco pellegrino](/especie/falco_peregrinus/) e
      occasionalmente il [falco della Regina](/especie/falco_eleonorae/). Durante i passi di primavera e
      autunno vi sostano innumerevoli migratori. Il parco registra complessivamente 144 specie ornitiche, di
      cui 40 nidificanti.


      Sulla terraferma vivono rarità discrete quali il discoglosso sardo e il fillodattilo europeo, un piccolo
      geco notturno minacciato. Sono state censite 13 specie di chirotteri.
    visit: >-
      Si accede con i battelli di linea in partenza da Hyères. Giunti a Port-Cros, l'esplorazione si articola
      su due fronti: a piedi e con maschera e boccaglio.


      A piedi, il sentiero delle Creste tocca la calanca della Fausse-Monnaie dalla spiaggia del Sud, risale
      la valle della Solitude e culmina sul mont Vinaigre a 194 m, vetta dell'isola. In mare, il percorso
      sottomarino della Palud offre sei boe didattiche da compiere in autonomia con pinne, maschera e
      boccaglio nelle acque calme della baia della Palud. La classica escursione giornaliera unisce il
      trekking tra i pini e lo snorkeling lungo il percorso marino.


      Su Port-Cros è vietato qualsiasi mezzo a motore o bicicletta: ci si sposta unicamente a piedi.
    history: >-
      Per secoli Port-Cros funse da bastione militare strategico. Nel 1531 Francesco I istituì il marchesato
      delle Isole di Hyères—Bagaud, Port-Cros e Levante—per contrastare i pirati barbareschi, imponendo la
      costruzione di torri; Napoleone ne restaurò le difese nel 1811 presidiandone i forti. In epoche
      successive l'isola divenne rifugio letterario: il forte della Vigie accolse residenze d'artisti per
      Malraux, Gide, Saint-John Perse e Valéry.


      Il parco fu istituito nel 1963 su impulso di André Malraux, grazie alle donazioni di Marceline
      Henry—figura cardine della tutela di Port-Cros nel Novecento—e degli eredi di Paule Desmarais. Nel 2012
      la protezione è stata estesa a gran parte di Porquerolles. L'isola di Bagaud e l'isolotto della
      Gabinière sono riserve integrali inaccessibili al pubblico. Dal 1999 il parco anima inoltre il settore
      francese del Santuario Pelagos per i mammiferi marini.


      Le minacce attuali impongono massima cura: il rischio d'incendio è elevatissimo in estate col maestrale,
      mentre il fico degli Ottentotti soffoca la flora autoctona delle scogliere. Nel 2023 il parco è stato
      annoverato tra i siti esposti a sovraffollamento turistico, rendendo necessaria una rigida gestione dei
      flussi stagionali.
    before: >-
      L'affluenza tocca vertici intensi al porto di Port-Cros e a Porquerolles nei mesi estivi; i periodi
      ideali sono maggio, giugno, settembre e ottobre. Bagaud e la Gabinière sono interdetti allo sbarco.
      Informati presso la sede del parco e le capitanerie su ormeggi consentiti e sentieri transitabili.
    around: >-
      Pur senza parchi contigui nell'atlante, Port-Cros condivide specie pelagiche e praterie sommerse con
      altri arcipelaghi. Il [Parco Nazionale Arcipelago Toscano](/lugar/parco-nazionale-arcipelago-toscano/) e
      il [Parco Naturale dell'Arcipelago di Lastovo](/lugar/park-prirode-lastovsko-otocje/) condividono berta
      minore, berta maggiore e posidonia. Il [Parco Naturale di Cap de
      Creus](/lugar/parc-natural-del-cap-de-creus/) condivide berte, posidonia e tursìope.
  pt:
    intro: >-
      Antes de se converter em parque nacional, Port-Cros foi uma ilha à venda. Em 1937, após quinze anos de
      litígios jurídicos, foi a leilão, tendo como alternativa a urbanização imobiliária. Paule Desmarais
      comprou-a, resgatando a sua beleza intacta. Hoje o Parque Nacional de Port-Cros, no arquipélago das
      ilhas de Hyères, é um parque em simultâneo terrestre e marinho: 1.700 ha de terra e 2.900 ha de mar,
      repartidos por Porquerolles, Port-Cros, Bagaud, o ilhéu da Gabinière e o rochedo de Rascas.
    landscape: >-
      Port-Cros ergue-se como um maciço rochoso íngreme e densamente arborizado no seio do Mediterrâneo. Com
      meros 4,2 km de comprimento por 2,4 km de largura, a sua orla costeira alterna falésias abruptas
      debruçadas sobre o mar profundo com pequenas enseadas abrigadas: a baía de Port-Cros, a de Port-Man e a
      calanque de la Palud. Vales confluem para o litoral, alimentados por linhas de água sazonais que
      sustentam bosques verdejantes. A menos de 10 km da costa sul de Port-Cros o talude continental atinge os
      2.000 m de profundidade.


      A floresta carrega cicatrizes de fogo. O sobreiral e azinhal recobria outrora quase toda a ilha, com
      exceção das cristas rochosas secas; em 1870 um devastador incêndio consumiu quase a totalidade do
      território insular, sobrevivendo hoje os velhos carvalhos nos vales frescos. A flora reúne cerca de 700
      espécies, integrando raridades como o linho-marítimo e endemismos como Delphinium requienii. A vegetação
      halófila costeira é viçosa, mas extremamente sensível ao pisoteio.


      Sob a água desdobram-se os habitats vitais do Mediterrâneo: vastas pradarias de
      [posidónia](/especie/posidonia_oceanica/) albergando salemas e dobradas, fundos coralígenos patrulhados
      por meros-legítimos, moreias e dentões, e fundos arenosos continuamente revolvidos por cardumes de
      salmonetes.
    wildlife: >-
      O vulto de maior destaque é o mero-legítimo, detentor de um percurso célebre: Jojo o mero, protagonista
      involuntário de *O Mundo do Silêncio*, filme de Jacques Cousteau rodado em Port-Cros. Outrora massacrada
      pela caça submarina, a espécie recuperou vigorosamente desde a década de oitenta no perímetro do parque,
      passando em sessenta anos de 40 para quase 1.000 espécimes. O ilhéu da Gabinière é o local de referência
      mundial para mergulhadores graças às densas concentrações de meros.


      No mar aberto avistam-se ainda o [golfinho-comum](/especie/tursiops_truncatus/), o piloto-baleia,
      mantas-diabo, a [tartaruga-comum](/especie/caretta_caretta/) e ocasionais barracudas.


      Nas escarpas litorais nidificam aves marinhas. A colónia de [cagarra](/especie/calonectris_diomedea/) de
      Porquerolles é a maior da orla costeira francesa, e perto de 90 % dos casais reprodutores de
      [fura-bucho-do-mediterrâneo](/especie/puffinus_yelkouan/) nidificam neste troço costeiro. O
      [falcão-peregrino](/especie/falco_peregrinus/) marca presença nas falesias e o
      [falcão-da-rainha](/especie/falco_eleonorae/) observa-se em certas épocas. Na primavera e no outono,
      legiões de migradores fazem escala no arquipélago. No total registam-se 144 espécies ornitológicas,
      sendo 40 nidificantes.


      Em terra vivem raridades discretas: o discoglosso-sardo e a osga-toupeira, um minúsculo réptil noturno
      em regressão. Estão identificadas 13 espécies de morcegos.
    visit: >-
      A travessia efetua-se em paquetes marítimos com partida de Hyères. Ao desembarcar em Port-Cros, o parque
      propõe duas formas de visita: por terra e pelo mar.


      A pé, o trilho das Cristas transpõe a calanque da Fausse-Monnaie junto à praia do Sul, sobe o vale da
      Solitude e alcança o monte Vinaigre, ponto culminante da ilha a 194 m. Pelo mar, o trilho submarino de
      La Palud inclui seis estações balizadas com boias que se percorrem de modo autónomo com barbatanas,
      máscara e tubo na baía abrigada de La Palud. O dia ideal combina caminhadas pelo pinhal e exploração
      submarina.


      Qualquer viatura a motor ou bicicleta está proibida em Port-Cros: a circulação processa-se unicamente a
      pé.
    history: >-
      Port-Cros foi durante séculos uma praça militar estratégica. Em 1531 Francisco I converteu as ilhas de
      Hyères—Bagaud, Port-Cros e Levant—em marquesado para conter os corsários berberes, estipulando a
      construção de baluartes; Napoleão renovou as fortificações em 1811 aquartelando tropas nos fortes. Mais
      tarde a ilha serviu de retiro a insignes escritores: o forte da Vigie abrigou residências de criação
      para Malraux, Gide, Saint-John Perse e Valéry.


      O parque nacional foi criado em 1963 sob a égide de André Malraux, beneficiando das doações de Marceline
      Henry—figura cimeira na conservação de Port-Cros no século vinte—e dos herdeiros de Paule Desmarais. Em
      2012 a área protegida expandiu-se à maior parte de Porquerolles. A ilha de Bagaud e o ilhéu da Gabinière
      constituem reservas integrais com desembarque estritamente vedado. Desde 1999 o parque coordena a secção
      francesa do Santuário Pelagos para a preservação dos mamíferos marinhos.


      As ameaças contemporâneas são evidentes: o risco de fogo atinge o zénite no verão sob ventos fortes e
      estiagem, enquanto o chorão-das-praias sufoca a flora dunar e rupícola autóctone. Em 2023 o parque foi
      apontado como exposto à sobrelotação turística, tornando vital o controlo da capacidade de carga
      estival.
    before: >-
      A procura turística atinge níveis muito elevados no porto de Port-Cros e em Porquerolles durante o
      verão; privilegia maio, junho, setembro e outubro. Bagaud e a Gabinière têm acesso vedado. Consulta
      previamente as capitanias e casas do parque sobre fundeadouros regulamentados e percursos pedestres
      abertos.
    around: >-
      Sem áreas limítrofes contíguas no atlas, Port-Cros partilha avifauna pelágica e pradarias marinhas com
      outros arquipélagos mediterrânicos. O [Parque Nacional do Arquipélago
      Toscano](/lugar/parco-nazionale-arcipelago-toscano/) e o [Parque Natural do Arquipélago de
      Lastovo](/lugar/park-prirode-lastovsko-otocje/) partilham fura-bucho-do-mediterrâneo, cagarra e
      posidónia. O [Parque Natural do Cabo de Creus](/lugar/parc-natural-del-cap-de-creus/) partilha
      fura-buchos, posidónia e golfinho-comum.
