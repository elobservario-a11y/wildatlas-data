resumen:
  es: >-
    Tundra ártica de baja altitud expuesta al mar de Barents en el extremo nororiental de Europa, célebre por
    sus dormideros marinos de eider de Fischer y eider real.
  en: >-
    Low-elevation Arctic tundra fronting the Barents Sea on Europe’s far northeastern edge, renowned for
    winter sea-duck roosts of Steller’s and king eiders.
  fr: >-
    Toundra arctique de basse altitude bordant la mer de Barents à l’extrême nord-est de l’Europe, célèbre
    pour ses rassemblements d’eiders de Steller et d’eiders à tête grise.
  de: >-
    Arktische Tiefland-Tundra an der Barentssee am äußersten Nordostrand Europas, weltbekannt für
    Winterschwärme von Scheckenten und Prachteiderenten.
  it: >-
    Tundra artica a bassa quota affacciata sul mare di Barents nell’estremo nord-est europeo, celebre per i
    dormitori marini di edredone di Steller e re degli edredoni.
  pt: >-
    Tundra ártica de baixa altitude exposta ao mar de Barents no extremo nordeste europeu, afamada pelos
    dormitórios marinhos de êider-de-steller e êider-real.
unico:
  es: >-
    La parte más ártica de la Noruega continental, donde el paisaje del corazón del parque se ve casi como
    antes de la última glaciación.
  en: >-
    The most arctic realm of mainland Norway, where the landscape of the park’s interior looks almost exactly
    as it did before the last ice age.
  fr: >-
    Le territoire le plus arctique de Norvège continentale, où les paysages du cœur du parc sont restés
    quasiment identiques à ce qu’ils étaient avant la dernière glaciation.
  de: >-
    Der arktischste Bereich des norwegischen Festlands, wo das Herz des Parks fast unverändert wie vor der
    letzten Eiszeit erscheint.
  it: >-
    L’angolo più artico della Norvegia continentale, dove il paesaggio interno appare pressoché identico a
    come si presentava prima dell’ultima glaciazione.
  pt: >-
    A porção mais ártica da Noruega continental, onde a paisagem do interior do parque permanece quase
    idêntica ao que era antes da última glaciação.
observaciones:
  es: >-
    Los perros van atados en la temporada de cría, y en la zona A del 1 de abril al 9 de septiembre. No se
    permiten drones, aeromodelos ni taladros de hielo motorizados. El reno es especialmente sensible a las
    molestias desde principios de abril hasta finales de junio, y las actividades organizadas en zonas con
    zorro ártico o rapaces necesitan permiso. Comprueba con el gestor las normas vigentes antes de ir.
texto:
  es:
    intro: >-
      En el extremo nororiental del país, entre el fiordo de Varanger, al sur, y el mar de Barents, al norte,
      la península de Varanger es el sitio donde la Noruega subártica se encuentra con el Ártico bajo. El
      Parque Nacional de Varangerhalvøya, creado en 2006, cubre 1804 km² y casi toda la península salvo la
      franja habitada de la costa, repartido entre Båtsfjord, Nesseby, Vadsø y Vardø. Aquí hay especies
      europeas continentales en su límite noroeste y especies árticas en su límite sur. Y también mucho
      espacio: las distancias son enormes, el tiempo es salvaje y variable, y el viajero es un punto en el
      paisaje.
    landscape: >-
      La clave es la antigüedad. El hielo de la última glaciación estaba congelado al suelo y apenas modificó
      el paisaje, así que el centro del parque conserva valles en V intactos, mesetas de campos de bloques y
      morrenas circulares. Una cresta baja, con Skipskjølen (633 m) como punto más alto, cruza la península de
      este a oeste y es la divisoria de aguas. Los valles en V los labraron las aguas de deshielo de los
      glaciares en retirada.


      La costa es otra cosa. En el nordeste hay un paisaje de acantilados con afloramientos dentados y capas
      de roca distorsionadas, y el frío persistente mantiene las rocas casi sin vegetación hasta el nivel del
      mar. En la costa exterior, la costa de abrasión deja acantilados verticales sobre playas llenas de
      troncos a la deriva, y también hay dunas y playas elevadas que muestran el rebote posglacial.


      La vegetación se reparte por pisos. El brezal de montaña, dominado por camarina negra, es el hábitat más
      común. En los valles que se adentran en la península hay prados con mucha más riqueza de especies que
      las mesetas áridas de alrededor: cientos de especies viven en estos pequeños oasis verdes. En el fondo
      de los valles hay franjas de sauces que alimentan al alce en invierno y dan hábitat de cría a las aves
      en verano. Entre un 5 y un 10 % de las plantas con flor son especialistas árticas. En una pequeña zona
      rica en calcio al oeste de Syltefjorddalen crece la amapola de Varanger, que solo se conoce en la costa
      exterior de Persfjorden-Syltefjorden, y el altaihaukeskjegg se redescubrió dentro del parque en 2008,
      tras darse por extinto en Noruega desde 1943.
    wildlife: >-
      El [zorro ártico](/especie/vulpes_lagopus/) y el lemming noruego son los mamíferos que definen el área.
      El parque tiene una población de zorro ártico de importancia nacional y varias medidas de gestión para
      ayudarla; un programa para reducir el zorro rojo dominante ha dado muy buenos resultados para esta
      pequeña población, el mamífero más amenazado de Noruega. También pueden verse la nutria, el armiño, el
      [glotón](/especie/gulo_gulo/), el [reno](/especie/rangifer_tarandus/) semidoméstico y el
      [alce](/especie/alces_alces/).


      Lo que cambia con los años son los lemmings. En los años de muchos lemmings, el págalo rabilargo anida
      en la tundra con matas, el busardo calzado prospera y, con suerte, puedes ver a un [búho
      nival](/especie/bubo_scandiacus/) cazando.


      Las aves son el gran reclamo. La región tiene la mayor población de Noruega de alondra cornuda, y a lo
      largo de la costa exterior el [pigargo](/especie/haliaeetus_albicilla/) abunda, con cifras especialmente
      altas en primavera; el [águila real](/especie/aquila_chrysaetos/) se ve más en el interior. En las
      mesetas altas, entre piedra y canchal, viven el [lagópodo alpino](/especie/lagopus_muta/), la collalba
      gris y el escribano nival; en las cotas más bajas anidan limícolas como el [chorlito
      dorado](/especie/pluvialis_apricaria/). Hasta 1000 gansos de tundra se reúnen cada año en las zonas de
      muda de la península antes de migrar al sur. El escaso ganso chico está presente en los humedales, y en
      primavera y otoño se ven gansos de muchas especies en la costa.
    visit: >-
      Varanger no tiene senderos: es una de las pocas zonas de Noruega sin una red extensa de sendas marcadas.
      En su lugar siguen las huellas abiertas por generaciones de renos semidomésticos, y tienes que
      orientarte por tu cuenta. Las entradas son Nattfjelldalen, Komagdalen y Ordo. En Nattfjelldalen un
      sendero marcado llega hasta el límite del parque; más allá no hay marcas. Desde Komagdalen sale un
      sendero de observación de aves de 4 km con paneles sobre las aves del valle, y tampoco hay marcas ni
      hitos más allá.


      Se puede ir a pie, a caballo y, en invierno, con kite; también en bicicleta no motorizada. Hay refugios
      y cabañas abiertos, pero para recorridos largos se recomienda llevar tienda propia, porque el tiempo
      puede cambiar rápido y obligar a buscar abrigo.
    history: >-
      Los santuarios sami, los lugares de ofrenda y las instalaciones de captura de reno salvaje cuentan la
      historia más antigua: los restos más viejos son anteriores al 4500 a.C. Las grandes instalaciones, con
      vallas guía de piedra de varios kilómetros, acaban en un gran círculo de piedras alrededor de una
      colina, colocado para que el reno no viera la valla del otro lado. Hoy el reno semidoméstico pasta en
      verano en rebaños grandes, y recuerda aquella caza de la Edad de Piedra, además de ser símbolo de la
      cría actual de reno.


      El parque se creó para conservar la parte más ártica de la Noruega continental, con sus formas del
      terreno de la Edad de Hielo y su flora y fauna oriental y ártica, y se considera un lugar clave para el
      zorro ártico y un patrimonio cultural sami único.
    before: >-
      Los perros van atados en la temporada de cría, y en la zona A del 1 de abril al 9 de septiembre. No se
      permiten drones, aeromodelos ni taladros de hielo motorizados. El reno es especialmente sensible a las
      molestias desde principios de abril hasta finales de junio, y las actividades organizadas en zonas con
      zorro ártico o rapaces necesitan permiso. Comprueba con el gestor las normas vigentes antes de ir.
    around: >-
      Varangerhalvøya no tiene vecinos cercanos en el atlas. Más lejos, el [Parque Nacional de
      Pallas-Yllästunturi](/lugar/pallas-yllastunturi-national-park/), el [Parque Nacional de
      Hardangervidda](/lugar/hardangervidda-national-park/) y la [Reserva Natural de
      Vindelfjällen](/lugar/vindelfjallens-naturreservat/) comparten con él el chorlito dorado o el zorro
      ártico y los humedales.
  en:
    intro: >-
      In the country's far northeastern corner, flanked by the Varanger Fjord to the south and the Barents Sea
      to the north, the Varanger Peninsula is where subarctic Norway meets the low Arctic. Varangerhalvøya
      National Park, established in 2006, encompasses 1804 km² across nearly the entire peninsula outside the
      populated coastal rim, shared between Båtsfjord, Nesseby, Vadsø, and Vardø. Here, continental European
      species reach their northwestern limits while arctic flora and fauna hit their southern boundary. Space
      is vast: distances are immense, the weather fierce and shifting, and the traveller feels like a tiny
      speck in the landscape.
    landscape: >-
      The defining factor is geological age. The ice sheet of the last glaciation was frozen hard to the
      bedrock and barely sculpted the surface, meaning the heart of the park preserves intact pre-glacial
      V-shaped valleys, blockfield plateaus, and circular moraines. A low central ridge, with Skipskjølen (633
      m) as its highest point, traverses the peninsula from east to west and marks the main watershed. The
      V-shaped ravines were incised by meltwaters from retreating glaciers.


      The coastline offers a stark contrast. In the northeast lies a rugged sea cliff landscape of jagged
      crags and twisted strata, where persistent arctic cold keeps rock surfaces almost barren down to sea
      level. Along the outer shores, wave abrasion carves sheer cliffs above beaches piled with Siberian
      driftwood, interspersed with sand dunes and raised beaches that record postglacial rebound.


      Vegetation arranges itself into distinct altitudinal belts. Mountain heath dominated by black crowberry
      constitutes the most widespread habitat. Valleys reaching into the peninsula's interior host lush
      meadows far richer in species than the barren plateaus around them: hundreds of species thrive in these
      green oases. Willow thickets along valley bottoms sustain moose in winter and provide nesting cover for
      songbirds in summer. Between 5 and 10 % of the flowering plants are arctic specialists. In a small
      calcium-rich pocket west of Syltefjorddalen grows the Varanger poppy, found nowhere else outside the
      Persfjorden-Syltefjorden coast, while Crepis multicaulis (*altaihaukeskjegg*) was rediscovered inside
      the park in 2008, having been presumed extinct in Norway since 1943.
    wildlife: >-
      The [Arctic fox](/especie/vulpes_lagopus/) and the Norwegian lemming are the mammals that define this
      land. The park harbours a nationally significant population of Arctic fox supported by targeted
      conservation measures; an active red fox control programme has yielded excellent results for this
      fragile population, Norway's most endangered mammal. You may also encounter otter, stoat,
      [wolverine](/especie/gulo_gulo/), semi-domesticated [reindeer](/especie/rangifer_tarandus/), and
      [moose](/especie/alces_alces/).


      Rodent cycles dictate the tempo of life. In peak lemming years, long-tailed jaegers nest densely across
      hummocky tundra, rough-legged buzzards thrive, and with luck you can spot a hunting [snowy
      owl](/especie/bubo_scandiacus/).


      Birdlife remains the prime attraction. The region supports Norway's largest population of horned larks,
      while along the outer coast the [white-tailed eagle](/especie/haliaeetus_albicilla/) is abundant,
      peaking in spring; the [golden eagle](/especie/aquila_chrysaetos/) hunts further inland. High scree
      plateaus shelter the [rock ptarmigan](/especie/lagopus_muta/), northern wheatear, and snow bunting;
      lower wetlands host breeding waders like the [European golden plover](/especie/pluvialis_apricaria/). Up
      to 1000 tundra bean geese gather each year in peninsular moulting grounds before migrating south. The
      scarce lesser white-fronted goose stops in wetlands, while diverse migratory geese line the shores in
      spring and autumn.
    visit: >-
      Varanger has no waymarked trail network: it is one of the few national parks in Norway without extensive
      marked routes. In their place you follow tracks forged by generations of semi-domesticated reindeer,
      relying entirely on self-navigation. Main entry portals are Nattfjelldalen, Komagdalen, and Ordo. At
      Nattfjelldalen a marked footpath leads to the park boundary, beyond which no markings exist. From
      Komagdalen, a 4 km birdwatching trail features interpretive signs about valley avifauna, also
      terminating without further waymarks.


      You can explore on foot, horseback, and in winter on skis or snowkites; non-motorised cycling is also
      allowed. Open wilderness cabins and emergency shelters exist, but for longer expeditions you must carry
      a sturdy four-season tent, as weather conditions change abruptly and require immediate shelter.
    history: >-
      Sacred Sámi sites, offering places (*sieidis*), and ancient wild reindeer hunting pits tell the
      peninsula's oldest human story, with the earliest remains dating back prior to 4500 BC. Large trapping
      systems with stone guiding fences running for several kilometres culminated in circular stone corrals
      around hillsides, designed so reindeer could not see the fences on the opposite side. Today,
      semi-domesticated reindeer herds graze here each summer, echoing that Stone Age tradition and
      symbolising modern Sámi pastoral culture.


      The park was established to protect mainland Norway's most arctic environment, with its pristine Ice Age
      landforms and unique eastern and arctic biodiversity, recognised as a critical refuge for the Arctic fox
      and exceptional Sámi cultural heritage.
    before: >-
      Dogs must be leashed during the bird breeding season, and within Zone A from 1 April to 9 September.
      Drones, model aircraft, and motorised ice drills are strictly prohibited. Reindeer are exceptionally
      sensitive to disturbance from early April through late June; organised group activities in areas
      frequented by Arctic foxes or raptors require prior permits. Check current park regulations with the
      management board before setting out.
    around: >-
      Varangerhalvøya has no immediate neighbours in this atlas. Further away, [Pallas-Yllästunturi National
      Park](/lugar/pallas-yllastunturi-national-park/), [Hardangervidda National
      Park](/lugar/hardangervidda-national-park/), and [Vindelfjällen Nature
      Reserve](/lugar/vindelfjallens-naturreservat/) share the European golden plover or Arctic fox alongside
      expansive wetlands.
  fr:
    intro: >-
      À l'extrême nord-est de la Norvège, entre le fjord de Varanger au sud et la mer de Barents au nord, la
      péninsule de Varanger marque la rencontre entre Norvège subarctique et bas-Arctique. Le parc national de
      Varangerhalvøya, créé en 2006, s'étend sur 1804 km² et englobe la quasi-totalité de la péninsule hors
      frange côtière habitée, réparti entre Båtsfjord, Nesseby, Vadsø et Vardø. Des espèces d'Europe
      continentale y atteignent leur limite nord-ouest et des espèces arctiques leur frange méridionale.
      L'espace y est immense : les distances sont vertigineuses, la météo rude et changeante, et le voyageur
      n'est qu'un point minuscule dans le paysage.
    landscape: >-
      Le secret tient à l'ancienneté géologique. La calotte glaciaire de la dernière glaciation était soudée
      au substrat rocheux par le gel et n'a presque pas érodé le relief, si bien que le cœur du parc conserve
      des vallées en V intactes, des plateaux de champs de blocs et des moraines circulaires. Une crête
      centrale peu élevée, culminant au Skipskjølen (633 m), traverse la péninsule d'est en ouest et forme la
      ligne de partage des eaux. Les vallées en V ont été incisées par les torrents de fonte des glaciers en
      retrait.


      Le littoral est tout autre. Au nord-est s'élève un relief de falaises marines aux pointes déchiquetées
      et couches rocheuses plissées, où le froid perpétuel laisse la roche nue jusqu'au rivage. Sur la côte
      ouverte, l'abrasion marine façonne des falaises verticales dominant des grèves chargées de tronques
      flottés, côtoyant dunes et plages surélevées témoins du rebond postglaciaire.


      La végétation s'organise en étages. La lande d'altitude à camarine noire compose l'habitat le plus
      étendu. Dans les vallées qui s'enfoncent à l'intérieur s'étendent des prairies bien plus riches en
      espèces que les plateaux dénudés voisins : des centaines d'espèces prospèrent dans ces petites oasis
      verdoyantes. Les saulaies de fond de vallée nourrissent l'élan en hiver et abritent les passereaux
      nicheurs en été. Entre 5 et 10 % des plantes à fleurs sont des spécialistes de l'Arctique. Dans une
      poche calcaire à l'ouest du Syltefjorddalen pousse le pavot de Varanger, endémique de la côte
      Persfjorden-Syltefjorden, tandis que Crepis multicaulis a été redécouvert dans le parc en 2008, après
      avoir été considéré comme éteint en Norvège depuis 1943.
    wildlife: >-
      Le [renard polaire](/especie/vulpes_lagopus/) et le lemming des toundras sont les mammifères
      emblématiques du territoire. Le parc abrite une population de renard polaire d'importance nationale
      bénéficiant de mesures actives de protection ; la régulation ciblée du renard roux a donné d'excellents
      résultats pour ce prédateur, le mammifère le plus menacé de Norvège. On peut également y croiser la
      loutre, l'hermine, le [glouton](/especie/gulo_gulo/), le [renne](/especie/rangifer_tarandus/)
      semi-domestique et l'[élan](/especie/alces_alces/).


      Le rythme des saisons dépend des lemmings. Lors des années d'abondance, le labbe à longue queue niche en
      nombre sur les buttes de tourbe, la buse pattue prospère et, avec de la chance, vous apercevrez un
      [harfang des neiges](/especie/bubo_scandiacus/) en chasse.


      L'avifaune constitue l'attrait majeur. La péninsule rassemble la plus importante population norvégienne
      d'alouette hausse-col, tandis que sur la côte le [pygargue à queue
      blanche](/especie/haliaeetus_albicilla/) abonde, surtout au printemps ; l'[aigle
      royal](/especie/aquila_chrysaetos/) chasse davantage à l'intérieur. Sur les plateaux d'éboulis vivent le
      [lagopède alpin](/especie/lagopus_muta/), le traquet motteux et le plectrophane des neiges ; dans les
      zones basses nichent des limicoles comme le [pluvier doré](/especie/pluvialis_apricaria/). Jusqu'à 1000
      oies des moissons se rassemblent chaque année sur la péninsule pour muer avant de migrer vers le sud. La
      rare oie naine fréquente les zones humides, et diverses oies migratrices animent le littoral au
      printemps et à l'automne.
    visit: >-
      Varanger ne dispose d'aucun réseau balisé : c'est l'un des rares parcs nationaux norvégiens dépourvus de
      sentiers balisés continus. On chemine le long des pistes tracées par des générations de rennes
      semi-domestiques, en s'orientant par ses propres moyens. Les accès principaux sont Nattfjelldalen,
      Komagdalen et Ordo. À Nattfjelldalen, un sentier balisé atteint la limite du parc, au-delà de laquelle
      tout repère disparaît. De Komagdalen part un sentier d'observation ornithologique de 4 km pourvu de
      panneaux d'information, s'arrêtant lui aussi sans balisage ultérieur.


      On s'y déplace à pied, à cheval et l'hiver en ski ou snowkite ; le vélo non motorisé est autorisé. Des
      abris de secours existent, mais pour les longues randonnées il est impératif d'emporter une tente quatre
      saisons, la météo pouvant virer brutalement et contraindre à s'abriter sur place.
    history: >-
      Lieux sacrés samis, sites sacrificiels (*sieidis*) et fosses de capture pour rennes sauvages témoignent
      d'une occupation très ancienne, les vestiges les plus reculés étant antérieurs à 4500 av. J.-C. De
      vastes pièges dotés de murets de guidage longs de plusieurs kilomètres se terminaient par un enclos
      circulaire de pierres sur une colline, empêchant les rennes d'apercevoir la clôture opposée. De nos
      jours, les rennes semi-domestiques y paissent en grands troupeaux l'été, perpétuant cette tradition
      issue de l'âge de la pierre et incarnant le pastoralisme sami contemporain.


      Le parc a été fondé pour sauvegarder la portion la plus arctique de la Norvège continentale, ses reliefs
      préservés de la glaciation ainsi que sa faune et sa flore boréales, tout en constituant un refuge clé
      pour le renard polaire et un patrimoine sami unique.
    before: >-
      Les chiens doivent être tenus en laisse pendant la période de nidification, et en zone A du 1 avril au 9
      septembre. Drones, aéromodèles et tarières à glace à moteur sont formellement interdits. Le renne est
      particulièrement sensible aux dérangements d'avril à fin juin ; les activités collectives dans les
      secteurs abritant renards polaires ou rapaces nécessitent une autorisation. Renseignez-vous auprès de la
      direction du parc avant votre départ.
    around: >-
      Varangerhalvøya n'a pas de voisins immédiats dans l'atlas. Plus loin, le [Parc national de
      Pallas-Yllästunturi](/lugar/pallas-yllastunturi-national-park/), le [Parc national de
      Hardangervidda](/lugar/hardangervidda-national-park/) et la [Réserve naturelle de
      Vindelfjällen](/lugar/vindelfjallens-naturreservat/) partagent avec lui le pluvier doré ou le renard
      polaire au cœur des grands espaces humides.
  de:
    intro: >-
      Am äußersten Nordostrand Norwegens, zwischen dem Varangerfjord im Süden und der Barentssee im Norden,
      trifft im Varanger-Gebiet die subarktische Taiga auf die Niederarktis. Der 2006 gegründete
      Varangerhalvøya-Nationalpark erstreckt sich über 1804 km² und schützt fast die gesamte Halbinsel abseits
      des besiedelten Küstenstreifens in den Kommunen Båtsfjord, Nesseby, Vadsø und Vardø. Hier stoßen
      mitteleuropäische Arten an ihre nordwestliche Verbreitungsgrenze, während arktische Arten ihr
      südlichstes Areal erreichen. Der Raum ist überwältigend: Die Distanzen sind gewaltig, das Wetter rau und
      wechselhaft, und der Wanderer wirkt wie ein winziger Punkt in der Landschaft.
    landscape: >-
      Ausschlaggebend ist das geologische Alter. Der Eisschild der letzten Kaltzeit war fest an den Felsgrund
      gefroren und schliff das Relief kaum ab, sodass das Parkinnere intakte präglaziale Kerbtäler, Blockmeere
      und Ringmoränen bewahrt hat. Ein flacher Zentralrücken mit dem Skipskjølen (633 m) als höchstem Punkt
      zieht sich von Ost nach West und bildet die Hauptwasserscheide. Die V-förmigen Täler schnitten die
      Schmelzwasserströme zurückweichender Gletscher ein.


      Die Küste präsentiert ein völlig anderes Bild. Im Nordosten ragt eine wilde Klippenlandschaft mit
      gezackten Felszähnen und verfalteten Schichten auf, wo anhaltende Kälte die Felsen bis auf Meereshöhe
      kahl hält. An der Außenküste formt die Brandung Steilwände über Stränden voller sibirischem Treibholz,
      gesäumt von Sanddünen und gehobenen Strandwällen, die die nacheiszeitliche Landhebung belegen.


      Die Vegetation staffelt sich in Höhenstufen. Zwergstrauchheiden mit vorherrschender Krähenbeere bilden
      den häufigsten Lebensraum. Die ins Landesinnere führenden Täler bergen üppige Wiesen, die weit
      artenreicher sind als die kargen Hochflächen ringsum: Hunderte Arten gedeihen in diesen grünen Oasen.
      Weidengebüsche am Talboden nähren Elche im Winter und bieten Brutvögeln im Sommer Deckung. Zwischen 5
      und 10 % der Blütenpflanzen sind arktische Spezialisten. In einem kalkreichen Bereich westlich des
      Syltefjorddalen wächst der seltene Varanger-Mohn, der nur an der Küste von Persfjorden-Syltefjorden
      vorkommt, während Crepis multicaulis 2008 im Park wiederentdeckt wurde, nachdem die Art in Norwegen seit
      1943 als verschollen galt.
    wildlife: >-
      [Polarfuchs](/especie/vulpes_lagopus/) und Berglemming sind die Charaktertiere dieser Tundra. Der
      Nationalpark beherbergt eine landesweit bedeutende Polarfuchspopulation, die durch gezielte
      Schutzmaßnahmen gestützt wird; die Bestandsregulierung des dominierenden Rotfuchses brachte große
      Erfolge für Norwegens am stärksten bedrohtes Landsäugetier. Zudem leben hier Fischotter, Hermelin,
      [Vielfraß](/especie/gulo_gulo/), halbwildes [Ren](/especie/rangifer_tarandus/) und
      [Elch](/especie/alces_alces/).


      Lemmingjahre bestimmen das Leben. In Massenvermehrungsjahren brütet die Schmarotzerraubmöwe zahlreich
      auf der Tundra, der Raufußbussard zieht erfolgreich Junge auf, und mit etwas Glück kannst du eine
      jagende [Schnee-Eule](/especie/bubo_scandiacus/) beobachten.


      Die Vogelwelt ist die Hauptattraktion. Die Halbinsel birgt Norwegens größte Ohrenlerchenpopulation, an
      der Außenküste ist der [Seeadler](/especie/haliaeetus_albicilla/) besonders im Frühjahr häufig, während
      der [Steinadler](/especie/aquila_chrysaetos/) im Binnenland jagt. Auf steinigen Hochplateaus brüten
      [Alpenschneehuhn](/especie/lagopus_muta/), Steinschmätzer und Schneeammer; in tieferen Lagen nisten
      Limikolen wie der [Goldregenpfeifer](/especie/pluvialis_apricaria/). Bis zu 1000 Tundrasaatgänse rasten
      alljährlich in Mausergebieten der Halbinsel vor dem Zug nach Süden. Die seltene Zwerggans rastet in
      Feuchtgebieten, und an den Küsten lassen sich im Frühjahr und Herbst ziehende Gänse vieler Arten
      beobachten.
    visit: >-
      Varanger besitzt kein markiertes Wegenetz: Es ist eines der wenigen Gebiete Norwegens ohne
      ausgeschilderte Pfade. Stattdessen folgst du Trampelpfaden, die Generationen halbwilder Rentiere
      hinterlassen haben, und orientierst dich eigenständig. Hauptausgangspunkte sind Nattfjelldalen,
      Komagdalen und Ordo. Im Nattfjelldalen führt ein markierter Pfad bis zur Parkgrenze, dahinter endet jede
      Markierung. Ab Komagdalen verläuft ein 4 km langer Vogelbeobachtungspfad mit Schautafeln, der ebenfalls
      ohne weitere Wegweiser ausläuft.


      Du kannst das Gebiet zu Fuß, zu Pferd und im Winter mit Skiern oder Snowkite erkunden; unmotorisiertes
      Radfahren ist erlaubt. Es gibt offene Schutzhütten, doch für längere Touren musst du ein sturmfestes
      Zelt mitführen, da das Wetter binnen Minuten umschlagen kann.
    history: >-
      Samische Opferplätze (*Sieidis*), Kultstätten und historische Fanggrubensysteme für Wildrentiere belegen
      eine frühe Besiedlung; die ältesten Funde datieren vor 4500 v. Chr. Große Fanganlagen mit
      kilometerlangen Steinleitwänden endeten in kreisförmigen Pferchen an Hanglagen, so angelegt, dass
      Rentiere die gegenüberliegende Absperrung nicht sehen konnten. Heute weiden halbwild geführte Rentiere
      im Sommer in großen Herden, die an die Jagdtraditionen der Steinzeit anknüpfen und moderne samische
      Rentierwirtschaft verkörpern.


      Der Park wurde gegründet, um das arktischste Ökosystem des norwegischen Festlands mit seinen intakten
      eiszeitlichen Reliefformen und seiner ostarktischen Flora und Fauna zu bewahren, als Kernlebensraum des
      Polarfuchses und als einzigartiges samisches Kulturerbe.
    before: >-
      Hunde sind während der Brutzeit und in Zone A vom 1. April bis 9. September an der Leine zu führen.
      Drohnen, Modellflugzeuge und motorisierte Eisbohrer sind verboten. Rentiere reagieren von Anfang April
      bis Ende Juni extrem empfindlich auf Störungen; geführte Gruppenaktivitäten in Lebensräumen von
      Polarfuchs oder Greifvögeln erfordern Genehmigungen. Informiere dich vorab bei der Parkverwaltung über
      geltende Vorschriften.
    around: >-
      Die Varanger-Halbinsel besitzt keine direkten Nachbarn in diesem Atlas. Weiter entfernt teilen der
      [Nationalpark Pallas-Yllästunturi](/lugar/pallas-yllastunturi-national-park/), der [Nationalpark
      Hardangervidda](/lugar/hardangervidda-national-park/) und das [Naturreservat
      Vindelfjällen](/lugar/vindelfjallens-naturreservat/) Goldregenpfeifer oder Polarfuchs in weiten Feucht-
      und Tundralandschaften.
  it:
    intro: >-
      Nell'estremo lembo nord-orientale della Norvegia, racchiusa tra il fiordo di Varanger a sud e il mare di
      Barents a nord, la penisola di Varanger costituisce il punto di incontro tra Norvegia subartica e basso
      Artico. Il Parco Nazionale Varangerhalvøya, istituito nel 2006, tutela 1804 km² e copre quasi l'intera
      penisola a eccezione della fascia costiera abitata, ripartito tra Båtsfjord, Nesseby, Vadsø e Vardø. Qui
      specie dell'Europa continentale toccano il limite nord-occidentale mentre specie artiche raggiungono la
      frontiera meridionale. Lo spazio è sconfinato: distanze immense, meteo severo e mutevole, e
      l'escursionista si sente un punto minuscolo nel territorio.
    landscape: >-
      Il fattore determinante è l'antichità geologica. La calotta dell'ultima era glaciale era saldata al
      suolo dal gelo perenne e non ha quasi rimodellato la roccia, così che il cuore del parco conserva
      intatte valli a V preglaciali, altopiani a pietraia e morene ad anello. Una dorsale centrale modesta,
      culminante nello Skipskjølen (633 m), attraversa la penisola da est a ovest e funge da spartiacque. Le
      forre a V sono state scavate dalle acque di fusione dei ghiacciai in ritiro.


      Il litorale mostra un volto del tutto diverso. A nord-est si stagliano falesie costiere con speroni
      frastagliati e strati rocciosi contorti, dove il gelo persistente lascia le rocce spoglie fino a riva.
      Sulla costa esterna l'azione del moto ondoso crea falesie ripide su spiagge ricoperte di tronchi alla
      deriva siberiani, assieme a dune e terrazzi marini sollevati dal rimbalzo postglaciale.


      La vegetazione si suddivide in fasce altitudinali. La brughiera di quota a empetro nero rappresenta
      l'habitat dominante. Nelle valli interne si aprono prati ben più ricchi di specie rispetto agli aridi
      altipiani circostanti: centinaia di specie prosperano in queste oasi verdeggianti. I saliceti di
      fondovalle nutrono l'alce in inverno e offrono siti di nidificazione ai passeriformi in estate. Tra il 5
      e il 10 % delle piante a fiore sono specialiste artiche. In una conca calcarea a ovest di
      Syltefjorddalen cresce il papavero di Varanger, esclusivo della costa Persfjorden-Syltefjorden, mentre
      Crepis multicaulis è stato riscoperto nel parco nel 2008, dopo essere stato considerato estinto in
      Norvegia dal 1943.
    wildlife: >-
      La [volpe artica](/especie/vulpes_lagopus/) e il lemming norvegese sono i mammiferi che caratterizzano
      l'area. Il parco ospita una popolazione di volpe artica di rilievo nazionale, sostenuta da misure di
      tutela mirate; il contenimento selettivo della volpe rossa ha portato ottimi risultati per questo
      carnivoro, il mammifero più minacciato di Norvegia. Si possono incontrare anche lontra, ermellino,
      [ghiottone](/especie/gulo_gulo/), [renna](/especie/rangifer_tarandus/) semidomestica e
      [alce](/especie/alces_alces/).


      I cicli dei lemming scandiscono i ritmi naturali. Nelle annate di picco, il labbo codalunga nidifica
      fitto sui cuscinetti di torba, la poiana calzata alleva con successo i piccoli e, con fortuna, puoi
      scorgere un [gufo delle nevi](/especie/bubo_scandiacus/) a caccia.


      L'avifauna attrae appassionati da tutto il mondo. La penisola vanta la maggiore popolazione norvegese di
      allodola golagialla, mentre lungo la costa esterna l'[aquila di mare](/especie/haliaeetus_albicilla/) è
      comunissima, specie in primavera; l'[aquila reale](/especie/aquila_chrysaetos/) caccia più all'interno.
      Sugli altopiani pietrosi vivono la [pernice bianca](/especie/lagopus_muta/), il culbianco e lo zigolo
      delle nevi; nelle zone umide inferiori nidificano caradriformi come il [piviere
      dorato](/especie/pluvialis_apricaria/). Fino a 1000 oche granaiole della tundra si radunano ogni anno
      per la muta prima di migrare a sud. La rara oca lombardella minore sosta nelle torbiere, e in primavera
      e autunno stormi di oche migratrici popolano le coste.
    visit: >-
      Varanger non ha una rete di sentieri segnati: è uno dei pochi parchi norvegesi privi di segnaletica
      escursionistica continua. Si cammina lungo le piste tracciate da generazioni di renne semidomestiche,
      orientandosi in totale autonomia. I punti di accesso primari sono Nattfjelldalen, Komagdalen e Ordo. A
      Nattfjelldalen un sentiero marcato giunge al limite del parco, oltre il quale non vi è alcun segnale. Da
      Komagdalen parte un percorso ornitologico di 4 km con pannelli illustrativi, che termina anch'esso senza
      ulteriori segnavia.


      L'esplorazione si effettua a piedi, a cavallo e d'inverno con sci o snowkite; è ammessa la bicicletta
      non motorizzata. Esistono bivacchi aperti, ma per traversate prolungate è indispensabile una tenda
      quattro stagioni, dato che il meteo può mutare repentinamente imponendo riparo immediato.
    history: >-
      Siti sacri sami, luoghi di offerta (*sieidis*) e fosse di cattura per renne selvatiche testimoniano le
      origini più remote, con reperti anteriori al 4500 a.C. Grandi sistemi di cattura con muretti di
      sbarramento in pietra lunghi vari chilometri confluivano in recinti circolari su alture, studiati
      affinché le renne non vedessero la palizzata opposta. Oggi le mandrie di renne semidomestiche pascolano
      d'estate richiamando le cacce dell'età della pietra e simboleggiando la cultura pastorale sami odierna.


      Il parco è nato per preservare la porzione più artica della Norvegia continentale, con le sue morfologie
      glaciali arcaiche e una preziosa biodiversità orientale e artica, fungendo da rifugio cardine per la
      volpe artica e da custode di un patrimonio sami inestimabile.
    before: >-
      I cani vanno tenuti al guinzaglio nella stagione riproduttiva degli uccelli, e nella zona A dal 1 aprile
      al 9 settembre. Droni, aeromodelli e trivelle motorizzate per ghiaccio sono rigorosamente vietati. Le
      renne sono vulnerabili al disturbo da inizio aprile a fine giugno; le attività organizzate nelle zone
      con volpe artica o rapaci richiedono preventiva autorizzazione. Verifica il regolamento aggiornato prima
      di partire.
    around: >-
      Varangerhalvøya non ha vicini prossimi nell'atlas. Più lontano, il [Parco nazionale di
      Pallas-Yllästunturi](/lugar/pallas-yllastunturi-national-park/), il [Parco nazionale di
      Hardangervidda](/lugar/hardangervidda-national-park/) e la [Riserva naturale di
      Vindelfjällen](/lugar/vindelfjallens-naturreservat/) condividono il piviere dorato o la volpe artica in
      vasti ambienti di tundra e torbiera.
  pt:
    intro: >-
      No extremo nordeste do país, entalada entre o fiorde de Varanger a sul e o mar de Barents a norte, a
      península de Varanger é o ponto de encontro entre a Noruega subártica e o baixo Ártico. O Parque
      Nacional de Varangerhalvøya, criado em 2006, protege 1804 km² e quase toda a península com exceção da
      faixa costeira habitada, repartido por Båtsfjord, Nesseby, Vadsø e Vardø. Aqui espécies europeias
      continentais alcançam o seu limite noroeste e espécies árticas atingem o seu extremo sul. O espaço é
      incomensurável: as distâncias são brutais, o clima rude e mutável, e o caminhante sente-se um mero ponto
      na imensidão.
    landscape: >-
      O segredo reside na antiguidade geológica. O manto de gelo da última glaciação estava soldado ao
      substrato rochoso pelo frio e quase não desgastou o relevo, pelo que o centro do parque preserva vales
      em V intactos, planaltos de blocos rochosos e moreias circulares. Uma crista central de baixa cota, com
      o Skipskjølen (633 m) como ponto culminante, cruza a península de leste a oeste servindo de divisória de
      águas. Os vales em V foram escavados pelas águas de degelo dos glaciares em recuo.


      A orla costeira é um mundo à parte. No nordeste ergue-se uma paisagem de falésias marinhas com cristas
      pontiagudas e camadas rochosas contorcidas, onde o frio incessante mantém as rochas despidas até ao
      nível do mar. Na costa exposta, a abrasão marinha desenha escarpas verticais sobre praias repletas de
      troncos flutuantes siberianos, a par de dunas e praias elevadas que documentam o levantamento
      pós-glaciar.


      A vegetação reparte-se por andares. As charnecas de altitude dominadas pela camarinha-negra formam o
      habitat predominante. Nos vales que penetram no interior existem prados muito mais diversificados do que
      os planaltos desérticos circundantes: centenas de espécies prosperam nestes pequenos oásis verdes. Os
      salgueirais de fundo de vale alimentam o alce no inverno e proporcionam refúgio de nidificação às aves
      no verão. Entre 5 e 10 % das plantas com flor são especialistas árticas. Numa mancha calcária a oeste de
      Syltefjorddalen medra a papoila-de-varanger, exclusiva da costa Persfjorden-Syltefjorden, enquanto
      Crepis multicaulis foi redescoberta no parque em 2008, após ter sido dada como extinta na Noruega desde
      1943.
    wildlife: >-
      A [raposa-do-ártico](/especie/vulpes_lagopus/) e o lemingue-norueguês são os mamíferos emblemáticos
      desta vastidão. O parque abriga uma população de raposa-do-ártico de relevância nacional, apoiada por
      medidas ativas de conservação; o controlo seletivo da raposa-vermelha gerou excelentes resultados para
      este pequeno núcleo, o mamífero mais ameaçado da Noruega. Também se avistam a lontra, o arminho, o
      [glutão](/especie/gulo_gulo/), a [rena](/especie/rangifer_tarandus/) semidoméstica e o
      [alce](/especie/alces_alces/).


      Os ciclos de lemingues pautam a vida selvagem. Nos anos de abundância de roedores, o
      moleiro-de-cauda-comprida nidifica em densidade nos montículos de turfa, o bútio-calçado prospera e, com
      sorte, podes avistar uma [coruja-das-neves](/especie/bubo_scandiacus/) a caçar.


      A avifauna é a grande atração. A península acolhe a maior população norueguesa de calhandra-cornuda,
      enquanto na costa exterior a [águia-rabalva](/especie/haliaeetus_albicilla/) é abundante, mormente na
      primavera; a [águia-real](/especie/aquila_chrysaetos/) caça preferencialmente no interior. Nos planaltos
      pedregosos habitam o [lagópode-branco](/especie/lagopus_muta/), o chasco-cinzento e a
      escrevedeira-das-neves; em cotas mais baixas nidificam limícolas como a
      [tarambola-dourada-europeia](/especie/pluvialis_apricaria/). Até 1000 gansos-campestres-da-tundra
      concentram-se anualmente em áreas de muda na península antes de migrarem para sul. O raro
      ganso-pequeno-de-testa-branca ocorre nas zonas húmidas, e bandos de gansos migradores povoam a orla
      costeira na primavera e outono.
    visit: >-
      Varanger não dispõe de qualquer rede de trilhos assinalados: é um dos raros parques nacionais
      noruegueses sem marcações contínuas no terreno. Caminha-se sobre os rastos abertos por gerações de renas
      semidomésticas, orientando-te por iniciativa própria. Os acessos principais situam-se em Nattfjelldalen,
      Komagdalen e Ordo. Em Nattfjelldalen um carreiro marcado alcança o limite do parque, findo o qual cessa
      qualquer balizagem. A partir de Komagdalen parte um percurso de observação de aves de 4 km com painéis
      interpretativos, que termina igualmente sem sinalização posterior.


      Podes circular a pé, a cavalo e, no inverno, com esquis ou snowkite; a bicicleta não motorizada é
      autorizada. Existem abrigos abertos de emergência, mas para travessias prolongadas é fundamental levar
      tenda de quatro estações, dado que a meteorologia muda repentinamente forçando a procurar resguardo.
    history: >-
      Santuários samis, locais de oferendas (*sieidis*) e fossas de captura para renas bravias narram a
      ocupação humana mais remota, com vestígios anteriores a 4500 a.C. Estruturas monumentais com muros-guia
      de pedra de vários quilómetros convergiam para currais circulares no topo de colinas, dispostos de forma
      a que a rena não avistasse a vedação contrária. Hoje, as manadas de renas semidomésticas pastam no verão
      perpetuando as caçadas da Idade da Pedra e simbolizando a cultura pastoril sami da atualidade.


      O parque foi criado para salvaguardar a porção mais ártica da Noruega continental, com as suas formas de
      relevo intocadas desde a Idade do Gelo e uma singular biodiversidade oriental e ártica, assumindo-se
      como refúgio vital da raposa-do-ártico e guardião de um património cultural sami sem paralelo.
    before: >-
      Os cães têm de circular com trela na época de reprodução das aves, e na zona A de 1 de abril a 9 de
      setembro. É expressamente interdito o uso de drones, aeromodelos e perfuradoras mecânicas de gelo. As
      renas são extremamente sensíveis a perturbações entre o início de abril e o final de junho; atividades
      coletivas em setores de raposa-do-ártico ou aves de rapina exigem licença prévia. Confirma os
      regulamentos em vigor junto da autoridade do parque antes de partir.
    around: >-
      Varangerhalvøya não tem vizinhos imediatos neste atlas. Mais longe, o [Parque Nacional de
      Pallas-Yllästunturi](/lugar/pallas-yllastunturi-national-park/), o [Parque Nacional de
      Hardangervidda](/lugar/hardangervidda-national-park/) e a [Reserva Natural de
      Vindelfjällen](/lugar/vindelfjallens-naturreservat/) partilham a tarambola-dourada-europeia ou a
      raposa-do-ártico por entre vastas zonas húmidas.
