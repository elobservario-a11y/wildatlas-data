resumen:
  es: >-
    Uno de los pocos deltas de agua dulce con mareas del mundo, formado tras la inundación de Santa Isabel en
    1421.
  en: >-
    One of the few freshwater tidal deltas in the world, formed in the aftermath of the St. Elizabeth flood of
    1421.
  fr: >-
    L'un des rares deltas d'eau douce à marée du monde, formé au lendemain de l'inondation de la
    Sainte-Élisabeth en 1421.
  de: >-
    Eines der wenigen Süßwasser-Gezeitendeltas weltweit, entstanden nach der verheerenden Elisabethenflut von
    1421.
  it: >-
    Uno dei rari delta d'acqua dolce con maree al mondo, originatosi in seguito all'alluvione di Santa
    Elisabetta del 1421.
  pt: >-
    Um dos raros deltas de água doce com marés do mundo, formado na sequência da cheia de Santa Isabel de
    1421.
unico:
  es: >-
    Un humedal de agua dulce donde la marea sigue entrando entre sauces y carrizales, y donde el pigargo
    europeo vuelve a ser residente del delta.
  en: >-
    A freshwater wetland where tides still ebb and flow through willow forests and reedbeds, and where
    white-tailed eagles nest once more.
  fr: >-
    Une zone humide d'eau douce où la marée pénètre encore entre saules et roselières, et où le pygargue à
    queue blanche est redevenu résident du delta.
  de: >-
    Ein Süßwasser-Feuchtgebiet, in dem die Gezeiten durch Weidenwälder und Röhrichte strömen und Seeadler
    wieder heimisch geworden sind.
  it: >-
    Una zona umida d'acqua dolce in cui la marea penetra tuttora tra saliceti e canneti, e dove l'aquila di
    mare è tornata stanziale.
  pt: >-
    Uma zona húmida de água doce onde a maré penetra por entre salgueirais e caniçais, e onde a águia-rabalva
    regressou como residente permanente.
observaciones:
  es: >-
    Los meses más recomendados para ir van de abril a octubre. El Biesbosch es de libre acceso desde la salida
    hasta la puesta del sol. Rige un descanso de cría del 1 de enero al 1 de agosto, en que no se puede
    molestar los nidos, y un descanso invernal del 1 de noviembre al 1 de marzo para las aves acuáticas,
    cuando algunos canales se cierran a la recreación acuática. En los canales solo se navega entre el
    amanecer y el anochecer. El nivel del agua cambia sin cesar con la marea, así que ten cuidado al amarrar o
    caminar fuera del dique. Los perros deben ir con correa y están prohibidas las hogueras y barbacoas fuera
    de zonas habilitadas.
texto:
  es:
    intro: >-
      En 1421 el agua se llevó un país entero. La inundación de Santa Isabel convirtió una zona de pólderes en
      un mar interior, y los juncos que luego crecieron en los bancos de arena le dieron nombre: Biesbosch, el
      bosque de juncos. Es un humedal de agua dulce influido por las mareas, un laberinto de canales, bosques
      de sauces y carrizales que ha ido cambiando con cada intervención humana, y desde 1994 es parque
      nacional.
    landscape: >-
      El Biesbosch nació de una catástrofe y del agua dulce de dos ríos: la confluencia del Maas y el Waal
      creó este humedal mareal. Durante siglos la gente lo trabajó: cortadores de sauce, segadores de carrizo
      y trenzadores de juncos, un oficio duro que daba poco. Después, la historia dio dos giros. Tras cerrarse
      el Haringvliet en 1970 las mareas casi desaparecieron del Biesbosch, con grandes consecuencias para la
      naturaleza, y como además se acabó la cultura del sauce, las antiguas plantaciones crecieron lentamente
      hasta ser bosques de sauces.


      Hoy el paisaje sigue en movimiento. Al secarse con frecuencia las zonas altas ganaron terreno la zarza,
      la ortiga grande y el bálsamo invasor, mientras en las zonas húmedas siguen creciendo plantas propias de
      la marea. Algunas tierras agrícolas se han devuelto a la naturaleza por la seguridad hídrica, de modo
      que la protección contra las inundaciones y la naturaleza avanzan juntas.
    wildlife: >-
      El Biesbosch es una posada para aves. Cada noche, decenas de miles de gansos, patos y gaviotas duermen
      en las aguas tranquilas, y las aves migratorias engordan aquí antes de seguir hacia sus zonas de cría o
      invernada. En islas tranquilas crían miles de gaviotas reidoras, charranes,
      [espátulas](/especie/platalea_leucorodia/) y avocetas, y hay una colonia de espátulas en la isla
      Sassenplaat, cerca de Moerdijk.


      La estrella es el [pigargo europeo](/especie/haliaeetus_albicilla/): con 2,40 m de envergadura le llaman
      la puerta voladora, y es residente fijo en el delta. El [águila pescadora](/especie/pandion_haliaetus/)
      cría en el Biesbosch desde 2016, cuando fue una nueva ave nidificante para la lista neerlandesa, y un
      buen puesto para buscarla es la mesa panorámica de Polder Hardenhoek. Entre los pequeños, los
      pechiazules llegan a mediados de marzo, crían cerca de mil y se van entre finales de julio y septiembre
      hacia la península ibérica y el oeste de África. Los ruiseñores comunes llegan hacia el Día del Rey y su
      canto se oye las veinticuatro horas. Y el [martín pescador](/especie/alcedo_atthis/) abandona el
      Biesbosch en inviernos duros, porque depende de los peces.


      En primavera, el Biesbosch es una taberna de néctar para insectos, entre ellos abejas silvestres; en
      verano, la salicaria y la flor del cisne tiñen de púrpura las zonas de paso. Entre los mamíferos hay
      zorro, marta europea y corzo, y el [castor](/especie/castor_fiber/) está de vuelta: se reintrodujo, y
      después se asentaron el pigargo y el águila pescadora.
    visit: >-
      El Biesbosch se vive sobre todo desde el agua. Staatsbosbeheer ha trazado rutas en canoa en la parte de
      Brabante y en la de Holanda Meridional, y el parque ofrece varias rutas a pie con distintos puntos de
      partida. Con un guía o un guarda se ve más: hay salidas para rastrear castores y buscar aves antes del
      amanecer.


      Los mejores puntos de partida son los centros. El Biesboschcentrum de Dordrecht tiene una exposición
      interactiva sobre el agua, las plantas, los castores y las aves, y desde el Biesbosch MuseumEiland salen
      rutas a pie, paseos en barco y safaris de castores.
    history: >-
      Con el castor reintroducido, el pigargo y el águila pescadora asentados y algunas tierras de cultivo
      devueltas a la naturaleza, el Biesbosch recupera espacio. En 1994 el área adquirió la categoría de
      parque nacional.
    before: >-
      Los meses más recomendados para ir van de abril a octubre. El Biesbosch es de libre acceso desde la
      salida hasta la puesta del sol. Rige un descanso de cría del 1 de enero al 1 de agosto, en que no se
      puede molestar los nidos, y un descanso invernal del 1 de noviembre al 1 de marzo para las aves
      acuáticas, cuando algunos canales se cierran a la recreación acuática. En los canales solo se navega
      entre el amanecer y el anochecer. El nivel del agua cambia sin cesar con la marea, así que ten cuidado
      al amarrar o caminar fuera del dique. Los perros deben ir con correa y están prohibidas las hogueras y
      barbacoas fuera de zonas habilitadas.
    around: >-
      A treinta kilómetros está la [Reserva Natural Slikken van de Heen](/lugar/slikken-van-de-heen/), otro
      paisaje de estuario y marisma. Más lejos, el [Parque Nacional Fertő-Hanság - Estepa de
      Hanság](/lugar/ferto-hansag-nemzeti-park---hansag/) comparte con el Biesbosch la salicaria y los
      humedales.
  en:
    intro: >-
      In 1421, a storm surge swallowed an entire landscape. The St. Elizabeth flood turned fertile polders
      into an inland sea, and the rushes that colonized its sandbanks lent it a new name: Biesbosch, the
      forest of rushes. It is a rare freshwater tidal wetland, an intricate labyrinth of creeks, willow
      woodlands, and reedbeds shaped by successive human interventions, established as a national park in
      1994.
    landscape: >-
      De Biesbosch was forged by catastrophic floods and the freshwater surge of two major rivers: the
      confluence of the Meuse and the Waal shaped this tidal wetland. For centuries, local people harvested
      its bounty: osier cutters, reed harvesters, and rush weavers endured arduous labour with meagre returns.
      Subsequent centuries brought profound transformations. Following the damming of the Haringvliet in 1970,
      tidal dynamics were largely dampened, transforming the ecology; as the commercial willow coppicing
      ceased, former willow beds developed into mature alluvial willow forests.


      Today the landscape continues to evolve. In areas that dry out regularly, bramble, stinging nettle, and
      Himalayan balsam have spread, while wetland plants persist where water fluctuations continue. Depoldered
      agricultural lands have been restored to dynamic wetland wilderness under national flood safety
      programmes, demonstrating how flood protection and nature restoration progress hand in hand.
    wildlife: >-
      De Biesbosch serves as a bustling sanctuary for birdlife. Each evening tens of thousands of geese,
      ducks, and gulls roost across its sheltered waters, while migratory waders rest and refuel. Undisturbed
      islands shelter breeding colonies of black-headed gulls, common terns, [Eurasian
      spoonbills](/especie/platalea_leucorodia/), and pied avocets, including a renowned spoonbill colony on
      Sassenplaat island near Moerdijk.


      The undisputed monarch of the delta is the [white-tailed eagle](/especie/haliaeetus_albicilla/): with
      its 2.40 m wingspan, dubbed 'the flying door', it is now a permanent resident. The
      [osprey](/especie/pandion_haliaetus/) has bred in De Biesbosch since 2016, marking its historic return
      as a Dutch breeding species, best spotted from the viewpoint at Polder Hardenhoek. Among smaller birds,
      bluethroats arrive in mid-March, numbering around a thousand breeding pairs before departing for Iberia
      and western Africa in late summer. Common nightingales arrive around King's Day, singing day and night.
      In hard winters, [common kingfishers](/especie/alcedo_atthis/) depart the delta when foraging waters
      freeze over.


      In spring, blooming willows offer abundant nectar for wild bees and insects; in summer, purple
      loosestrife and flowering rush carpet marshy edges in pink. Mammals include the red fox, pine marten,
      and roe deer, alongside the [Eurasian beaver](/especie/castor_fiber/), whose successful reintroduction
      preceded the natural return of sea eagles and ospreys.
    visit: >-
      De Biesbosch is best experienced from the water. Staatsbosbeheer maintains signposted canoe routes
      across both the Brabant and South Holland sectors, complemented by diverse walking trails with distinct
      starting points. Joining an expert ranger unlocks hidden wonders: early morning beaver tracking and dawn
      birdwatching tours are regular highlights.


      The principal gateways are dedicated visitor centres. The Biesboschcentrum in Dordrecht offers
      interactive exhibits on water ecology, beaver biology, and birdlife, while the Biesbosch MuseumEiland
      serves as a launchpad for guided boat cruises, walking circuits, and beaver safaris.
    history: >-
      With beavers thriving, white-tailed eagles and ospreys established, and reclaimed agricultural polders
      reconnected to tidal waters, De Biesbosch continues to reclaim wild space. In 1994, the wetland was
      officially designated a national park.
    before: >-
      Recommended visiting months run from April to October. De Biesbosch is open from sunrise to sunset.
      Breeding season restrictions apply from 1 January to 1 August to safeguard nesting birds, alongside a
      winter waterfowl resting period from 1 November to 1 March, when certain channels are closed to
      recreational boating. Boating is permitted solely between dawn and dusk. Water levels change
      continuously with the tide, requiring care when mooring or walking along unpaved banks. Dogs must remain
      on leashes, and open campfires are strictly prohibited.
    around: >-
      Ten kilometres away lies the [Slikken van de Heen](/lugar/slikken-van-de-heen/) coastal wetland reserve.
      Farther east across the continent, [Fertő-Hanság National Park -
      Hanság](/lugar/ferto-hansag-nemzeti-park---hansag/) shares with De Biesbosch extensive reedbeds,
      white-tailed eagles, and Eurasian spoonbills.
  fr:
    intro: >-
      En 1421, les flots engloutirent tout un pays. La crue de la Sainte-Élisabeth transforma des polders
      fertiles en une mer intérieure, et les joncs qui colonisèrent les bancs de sable lui donnèrent son nom :
      Biesbosch, la forêt de joncs. C'est une rare zone humide d'eau douce soumise aux marées, un dédale de
      chenaux, saulaies et roselières façonné par l'homme, classé parc national depuis 1994.
    landscape: >-
      Le Biesbosch est né d'un désastre hydraulique et de la rencontre de deux fleuves : la confluence de la
      Meuse et du Waal créa ce vaste delta marécageux. Des générations d'hommes l'ont exploité : coupeurs
      d'osier, faucheurs de roseaux et tresseurs de nattes, un métier rude aux maigres profits. Puis vinrent
      deux tournants majeurs. Après la fermeture du Haringvliet en 1970, le marnage diminua drastiquement,
      bouleversant l'écosystème ; l'abandon de l'osiériculture permit ensuite aux taillis de saules de grandir
      en forêts alluviales matures.


      Aujourd'hui, le paysage demeure en pleine dynamique. Dans les secteurs exondés, la ronce, l'ortie et la
      balsamine de l'Himalaya ont progressé, tandis que les plantes paludicoles colonisent les rives
      inondables. D'anciennes terres agricoles ont été rendues aux eaux pour sécuriser le débit des fleuves,
      alliant sécurité civile et ensauvagement.
    wildlife: >-
      Le Biesbosch constitue une halte migratoire majeure. Chaque soir, des dizaines de milliers d'oies,
      canards et mouettes dorment sur ses eaux abritées. Sur des îlots paisibles nichent des milliers de
      mouettes rieuses, sternes, [spatules blanches](/especie/platalea_leucorodia/) et avocettes, avec une
      colonie remarquable de spatules sur l'île de Sassenplaat, près de Moerdijk.


      Le souverain incontesté est le [pygargue à queue blanche](/especie/haliaeetus_albicilla/) : avec ses
      2,40 m d'envergure, il réside à l'année dans le delta. Le [balbuzard
      pêcheur](/especie/pandion_haliaetus/) niche dans le Biesbosch depuis 2016, date de sa première
      reproduction aux Pays-Bas, observable depuis le belvédère du Polder Hardenhoek. Parmi les passereaux,
      les gorgesbleues à miroir arrivent mi-mars, comptant près d'un millier de couples nicheurs avant leur
      départ automnal. Le rossignol philomèle chante jour et nuit, tandis que le [martin-pêcheur
      d'Europe](/especie/alcedo_atthis/) déserte les lieux lors des hivers glaciaux.


      Au printemps, les saules en fleur offrent un festin aux abeilles sauvages ; en été, la salicaire
      empourpre les berges. Les mammifères comptent renard, martre et chevreuil, ainsi que le [castor
      d'Europe](/especie/castor_fiber/), dont la réintroduction réussie a précédé le retour des grands
      rapaces.
    visit: >-
      Le Biesbosch se découvre d'abord au fil de l'eau. Staatsbosbeheer a balisé des itinéraires en canoë côté
      Brabant et côté Hollande-Méridionale, complétés par de nombreux sentiers pédestres. Accompagné d'un
      garde, vous maximisez vos chances d'observer castors au crépuscule ou oiseaux au lever du jour.


      Les centres d'accueil constituent d'excellents points de départ. Le Biesboschcentrum de Dordrecht
      propose une muséographie interactive sur l'eau, les saules et les castors, tandis que le Biesbosch
      MuseumEiland organise sorties pédestres, croisières électriques et safaris castors.
    history: >-
      Grâce à la réintroduction du castor, à la réinstallation du pygargue et du balbuzard, et à la
      dépoldérisation de terres agricoles, le Biesbosch retrouve sa pleine dimension sauvage. En 1994, la zone
      humide a accédé au rang de parc national.
    before: >-
      La période la plus agréable s'étend d'avril à octobre. Le Biesbosch est accessible du lever au coucher
      du soleil. Une période de tranquillité pour la reproduction s'applique du 1 janvier au 1 août, complétée
      d'une trêve hivernale du 1 novembre au 1 mars pour la sauvagine, fermant certains chenaux à la
      navigation de plaisance. La navigation est autorisée uniquement entre l'aube et le crépuscule. Le niveau
      de l'eau fluctue sans cesse avec la marée : soyez vigilants lors des amarrages. Chiens tenus en laisse
      et feux formellement interdits.
    around: >-
      À dix kilomètres s'étendent les [Slikken van de Heen](/lugar/slikken-van-de-heen/). Plus à l'est sur le
      continent, le [parc national de Fertő-Hanság - Hanság](/lugar/ferto-hansag-nemzeti-park---hansag/)
      partage avec le Biesbosch de vastes roselières, des spatules blanches et le pygargue à queue blanche.
  de:
    intro: >-
      Im Jahr 1421 verschlang das Wasser ein ganzes Land. Die Elisabethenflut verwandelte fruchtbare Polder in
      ein Binnenmeer, und die Binsen auf den Sandbänken gaben dem Gebiet seinen Namen: Biesbosch, der
      Binsenwald. Es ist ein vom Gezeitenspiel geprägtes Süßwasser-Feuchtgebiet, ein Labyrinth aus Prielen,
      Weidenurwäldern und Schilffeldern, seit 1994 als Nationalpark unter Schutz gestellt.
    landscape: >-
      Der Biesbosch entstand aus einer Naturkatastrophe und dem Süßwasser zweier Ströme: Der Zusammenfluss von
      Maas und Waal formte dieses Gezeitendelta. Jahrhundertelang nutzten Menschen die Wildnis:
      Weidenschneider, Schilfschneider und Binsenflechter fristeten ein karges Dasein. Dann brachten zwei
      Eingriffe die Wende. Nach der Schließung des Haringvliet 1970 verflachte die Tide im Biesbosch
      drastisch; mit dem Ende der Weidennutzung wuchsen die Pflanzungen allmählich zu dichten Auwäldern heran.


      Bis heute bleibt die Landschaft im Fluss. In trockeneren Lagen breiteten sich Brombeere, Brennnessel und
      Drüsiges Springkraut aus, während in Rinnen typische Gezeitenpflanzen gedeihen. Polderflächen wurden für
      den Hochwasserschutz rückgebaut, sodass Wassersicherheit und Naturdynamik Hand in Hand gehen.
    wildlife: >-
      Der Biesbosch ist ein Rastplatz erster Güte für Vögel. Nachts rasten zehntausende Gänse, Enten und Möwen
      auf den Stillgewässern. Auf ruhigen Inseln brüten Lachmöwen, Flussseeschwalben,
      [Löffler](/especie/platalea_leucorodia/) und Säbelschnäbler; auf der Insel Sassenplaat bei Moerdijk
      existiert eine bedeutende Löfflerkolonie.


      Der König des Deltas ist der [Seeadler](/especie/haliaeetus_albicilla/): Mit 2,40 m Spannweite
      'fliegende Tür' genannt, ist er fester Standvogel. Der [Fischadler](/especie/pandion_haliaetus/) brütet
      seit 2016 im Biesbosch, was die erste Brut für die Niederlande darstellte; er lässt sich gut vom
      Aussichtspunkt im Polder Hardenhoek beobachten. Das Blaukehlchen kehrt Mitte März mit rund tausend
      Brutpaaren zurück, die Nachtigall singt ab Ende April Tag und Nacht, während der
      [Eisvogel](/especie/alcedo_atthis/) in harten Wintern weicht.


      Im Frühling bieten blühende Weiden Nektar für Wildbienen; im Sommer färben Blutweiderich und
      Schwanenblume die Ufer rosa. Säugetiere wie Rotfuchs, Baummarder und Reh sind verbreitet, und der
      [Biber](/especie/castor_fiber/) kehrte nach erfolgreicher Wiederansiedlung dauerhaft zurück.
    visit: >-
      Der Biesbosch erschließt sich am eindrücklichsten vom Wasser aus. Staatsbosbeheer hat Kanurouten in
      Nordbrabant und Südholland ausgewiesen, ergänzt durch Wanderwege unterschiedlicher Länge. Mit
      Naturführern lassen sich Biberburgen und morgendliche Vogelzüge aufspüren.


      Ideale Ausgangspunkte sind die Besucherzentren. Das Biesboschcentrum in Dordrecht informiert interaktiv
      über Wasserhaushalt, Biber und Vögel; vom Biesbosch MuseumEiland starten Rundwanderungen, Elektroboote
      und Bibersafaris.
    history: >-
      Mit der erfolgreichen Wiederansiedlung des Bibers, der Rückkehr von Seeadler und Fischadler sowie der
      Öffnung ehemaliger Agrarpolder gewinnt die Wildnis neuen Raum. Im Jahr 1994 wurde das Areal offiziell
      zum Nationalpark erklärt.
    before: >-
      Empfohlene Besuchsmonate sind April bis Oktober. Der Biesbosch ist von Sonnenaufgang bis Sonnenuntergang
      frei zugänglich. Vogelschutzzeiten gelten vom 1. Januar bis zum 1. August für Brutvögel sowie eine
      Winterruhe vom 1. November bis zum 1. März, in der Kanäle für den Wassersport gesperrt sind.
      Bootsverkehr ist nur von Sonnenaufgang bis Einbruch der Dunkelheit erlaubt. Achte beim Festmachen auf
      Ebbe und Flut. Hunde anleinen; offenes Feuer ist verboten.
    around: >-
      Zehn Kilometer entfernt liegt das Feuchtgebiet [Slikken van de Heen](/lugar/slikken-van-de-heen/).
      Weiter östlich teilt der [Nationalpark Fertő-Hanság –
      Hanság](/lugar/ferto-hansag-nemzeti-park---hansag/) mit dem Biesbosch Röhrichte, Löffler und Seeadler.
  it:
    intro: >-
      Nel 1421 l'acqua spazzò via un intero territorio. L'alluvione di Santa Elisabetta trasformò fertili
      polder in un mare interno, e i giunchi che colonizzarono i banchi di sabbia gli diedero il nome:
      Biesbosch, il bosco di giunchi. È una singolare zona umida d'acqua dolce soggetta a marea, un dedalo di
      canali, saliceti e canneti modellato dalla storia umana, tutelato come parco nazionale dal 1994.
    landscape: >-
      Il Biesbosch è nato da una catastrofe e dall'incontro delle acque dolci di due fiumi: la confluenza
      della Mosa e del Waal forgiò questo delta tidale. Per secoli gli abitanti ne trassero il sostentamento:
      tagliatori di vimini, falciatori di canne e intrecciatori di giunco compivano fatiche immani per ricavi
      modesti. Due svolte hanno poi mutato il paesaggio. Con la chiusura dell'Haringvliet nel 1970 le maree si
      sono fortemente attenuate; venuta meno la coltura del salice, i vecchi ceppi sono cresciuti
      trasformandosi in fitti boschi golenali.


      Oggi il paesaggio prosegue la sua evoluzione. Nelle parti asciutte sono avanzati rovi, ortiche e
      balsamina, mentre nelle bassure resistono le piante pioniere delle maree. Diversi terreni agricoli sono
      stati depolderizzati per ragioni idrauliche, unendo sicurezza contro le alluvioni e rinaturazione.
    wildlife: >-
      Il Biesbosch è un fondamentale rifugio ornitologico. Ogni notte decine di migliaia di oche, anatre e
      gabbiani riposano sulle sue placide acque. Sugli isolotti tranquilli nidificano gabbiani comuni, sterne,
      [spatole](/especie/platalea_leucorodia/) e avocette, con una colonia storica sull'isola Sassenplaat
      vicino a Moerdijk.


      Il signore incontrastato è l'[aquila di mare](/especie/haliaeetus_albicilla/): con i suoi 2,40 m di
      apertura alare, detta 'la porta volante', è tornata nidificante stabile. Il [falco
      pescatore](/especie/pandion_haliaetus/) nidifica nel Biesbosch dal 2016, segnando la prima nidificazione
      per i Paesi Bassi; lo si osserva dal belvedere di Polder Hardenhoek. Tra i canneti il pettazzurro giunge
      a metà marzo con un migliaio di coppie, l'usignolo canta giorno e notte e il [martin
      pescatore](/especie/alcedo_atthis/) sverna altrove nelle annate più rigide.


      In primavera i salici in fiore offrono nettare alle api selvatiche; in estate la lisimachia tinge di
      rosa le sponde. Tra i mammiferi spiccano volpe, martora, capriolo e il
      [castoro](/especie/castor_fiber/), la cui reintroduzione ha preceduto il ritorno delle grandi aquile.
    visit: >-
      Il Biesbosch si assapora navigando sull'acqua. Staatsbosbeheer ha tracciato percorsi in canoa nel
      Brabante e nell'Olanda Meridionale, affiancati da diversi itinerari podistici. In compagnia dei
      guardaparco si scoprono tracce di castori e si avvistano uccelli alle prime luci dell'alba.


      I punti di partenza primari sono i centri visita. Il Biesboschcentrum di Dordrecht propone percorsi
      interattivi su idrologia, flora e fauna; dal Biesbosch MuseumEiland partono escursioni a piedi,
      navigazioni elettriche e safari dedicati al castoro.
    history: >-
      Con il castoro saldamente insediato, l'aquila di mare e il falco pescatore nidificanti e le terre
      agricole restituite alla dinamica fluviale, il Biesbosch amplia il proprio spazio selvaggio. Nel 1994
      l'area è stata ufficialmente istituita come parco nazionale.
    before: >-
      I mesi più indicati vanno da aprile a ottobre. L'accesso al Biesbosch è libero dall'alba al tramonto.
      Vige un periodo di rispetto per la nidificazione dal 1 gennaio al 1 agosto e una sosta invernale dal 1
      novembre al 1 marzo per l'avifauna acquatica, con canali chiusi alla navigazione turistica. La
      navigazione è permessa solo tra l'alba e l'imbrunire. Il livello delle acque muta con la marea: prudenza
      negli ormeggi. Cani al guinzaglio e divieto assoluto di fuochi liberi.
    around: >-
      A dieci chilometri sorgono le zone umide di [Slikken van de Heen](/lugar/slikken-van-de-heen/). Più a
      oriente nel continente, il [Parco Nazionale di Fertő-Hanság -
      Hanság](/lugar/ferto-hansag-nemzeti-park---hansag/) condivide con il Biesbosch canneti, spatole e
      l'aquila di mare.
  pt:
    intro: >-
      Em 1421 a água engoliu uma comarca inteira. A cheia de Santa Isabel converteu pólderes produtivos num
      mar interior, e os juncos que brotaram nos bancos de areia deram-lhe o nome: Biesbosch, a floresta de
      juncos. É uma zona húmida singular de água doce sujeita a marés, um labirinto de esteiros, matas de
      salgueiro e caniçais moldado pelo labor humano, protegido como parque nacional desde 1994.
    landscape: >-
      O Biesbosch nasceu de um cataclismo e do encontro de dois grandes rios: a confluência do Mosa e do Waal
      forjou este delta mareal. Durante séculos os homens trabalharam nele: ceifadores de vime, cortadores de
      caniço e tecedores de esteiras suportavam um labor agreste. Seguiram-se duas transformações decisivas.
      Após o encerramento do Haringvliet em 1970, as marés atenuaram-se fortemente; com o declínio da cultura
      do vime, os antigos talhões evoluíram para densas florestas aluviais de salgueiro.


      Hoje o relevo mantém-se em constante mutação. Nas zonas que secam com regularidade proliferam o silvado,
      a urtiga e o bálsamo-dos-himalaias, enquanto nos esteiros vicejam plantas de estepe mareal. Antigos
      pólderes agrícolas foram desmantelados para segurança das cheias, aliando a proteção territorial ao
      restauro ecológico.
    wildlife: >-
      O Biesbosch é um pouso fundamental de avifauna. Em cada noite, dezenas de milhares de gansos, patos e
      gaivotas dormem nas suas enseadas calmas. Em ilhotas sossegadas procriam guinchos-comuns,
      andorinhas-do-mar, [colhereiros](/especie/platalea_leucorodia/) e alfaiates, existindo uma colónia de
      colhereiros na ilha Sassenplaat, perto de Moerdijk.


      A ave rainha do delta é a [águia-rabalva](/especie/haliaeetus_albicilla/): com 2,40 m de envergadura, é
      apelidada de 'porta voadora' e reside todo o ano. A [águia-pesqueira](/especie/pandion_haliaetus/)
      nidifica no Biesbosch desde 2016, constituindo a primeira nidificação confirmada nos Países Baixos, com
      bom ponto de observação no Polder Hardenhoek. Pequenas aves como o pisco-de-peito-azul chegam em março
      somando cerca de mil casais, o rouxinol canta noite e dia, e o [guarda-rios](/especie/alcedo_atthis/)
      afasta-se nos invernos rigorosos.


      Na primavera os salgueiros oferecem néctar abundante a abelhas bravas; no verão a salgueirinha tinge as
      margens de rosa. Mamíferos como a raposa, a marta e o corço convivem com o
      [castor-europeu](/especie/castor_fiber/), cuja reintrodução abriu caminho à instalação de grandes
      águias.
    visit: >-
      O Biesbosch desfruta-se sobretudo a partir da água. A Staatsbosbeheer sinalizou percursos de canoagem em
      Brabante e na Holanda do Sul, complementados por itinerários pedestres com múltiplos acessos. Guias
      locais e guardas organizam saídas para rastrear castores ao entardecer e observar aves ao romper da
      alvorada.


      Os principais pontos de partida são os centros de visitantes. O Biesboschcentrum em Dordrecht exibe
      exposições interativas sobre a dinâmica hídrica e os castores, enquanto o Biesbosch MuseumEiland
      constitui o cais ideal para passeios de barco elétrico e trilhos ribeirinhos.
    history: >-
      Com o castor plenamente estabelecido, a águia-rabalva e a águia-pesqueira como reprodutoras e a
      renaturalização de pólderes, o Biesbosch amplia o seu domínio selvagem. Em 1994 a zona foi declarada
      parque nacional.
    before: >-
      A época recomendada vai de abril a outubro. O acesso ao Biesbosch é livre do nascer ao pôr do sol.
      Vigora um período de defeso da nidificação de 1 de janeiro a 1 de agosto, e uma pausa de inverno de 1 de
      novembro a 1 de março para a avifauna aquática, com canais interditos a recreio náutico. Navegação
      permitida apenas entre a aurora e o crepúsculo. O nível da água oscila com a maré: cuidado nas
      amarrações. Cães com trela e proibição de fogo.
    around: >-
      A dez quilómetros localiza-se a reserva de [Slikken van de Heen](/lugar/slikken-van-de-heen/). Mais a
      leste no continente, o [Parque Nacional de Fertő-Hanság -
      Hanság](/lugar/ferto-hansag-nemzeti-park---hansag/) partilha com o Biesbosch caniçais, colhereiros e a
      águia-rabalva.
