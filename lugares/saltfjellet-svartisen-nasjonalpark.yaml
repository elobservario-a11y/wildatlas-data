resumen:
  es: >-
    Del glaciar Svartisen, que baja casi al nivel del fiordo, a las mesetas de Saltfjellet en el círculo polar
    ártico.
  en: >-
    Gigantic coastal glaciers cascading from the Svartisen ice cap nearly to fjord level, across Saltfjellet
    alpine plateaus on the Arctic Circle.
  fr: >-
    Glaciers côtiers spectaculaires descendant de la calotte du Svartisen presque au niveau du fjord, sur les
    plateaux alpins du Saltfjellet.
  de: >-
    Riesige Küstengletscher, die von der Eiskappe des Svartisen fast auf Fjordniveau herabreichen, auf den
    alpinen Hochebenen des Saltfjellet.
  it: >-
    Ghiacciai costieri mastodontici che scendono dalla calotta dello Svartisen quasi al livello del fiordo,
    sugli altopiani alpini di Saltfjellet.
  pt: >-
    Glaciares costeiros colossais que descem da calota de gelo de Svartisen quase ao nível do fiorde, nos
    planaltos alpinos de Saltfjellet.
unico:
  es: >-
    Aquí el glaciar Engabreen acaba a 20 m sobre el nivel del mar, el punto más bajo de cualquier glaciar de
    la Europa continental.
  en: >-
    Here the Engabreen glacier tongue terminates at 20 m above sea level, the lowest elevation of any glacier
    in continental Europe.
  fr: >-
    Ici le glacier Engabreen s'achève à 20 m au-dessus du niveau de la mer, l'altitude la plus basse de tous
    les glaciers d'Europe continentale.
  de: >-
    Hier endet die Gletscherzunge Engabreen auf 20 m Meereshöhe, dem tiefsten Endpunkt aller Gletscher auf dem
    europäischen Festland.
  it: >-
    Qui la lingua glaciale dell'Engabreen termina a 20 m sul livello del mare, la quota più bassa di qualsiasi
    ghiacciaio dell'Europa continentale.
  pt: >-
    Aqui a língua glaciar de Engabreen termina a 20 m acima do nível do mar, a cota mais baixa de qualquer
    glaciar na Europa continental.
observaciones:
  es: >-
    La E6 y la línea de ferrocarril de Nordland siguen los bordes sur y este del parque. Comprueba el estado
    de los senderos tras la lluvia y las condiciones de visita de las granjas antes de ir.
texto:
  es:
    intro: >-
      El círculo polar ártico cruza el sur de este parque, y casi se nota. De un lado, el Svartisen: un
      casquete de hielo de 370 km² que ocupa más o menos el tercio occidental del parque y cuyos brazos bajan,
      en varios puntos, casi hasta el fiordo. Del otro, las mesetas de Saltfjellet, valles de abedul y tundra
      abierta. El Parque Nacional de Saltfjellet-Svartisen se creó en 1989 y recorre Nordland de la costa de
      Nordfjorden a la montaña por paisajes que cambian a cada paso, con unos 2192 km² entre seis comunas:
      Beiarn, Meløy, Rana, Rødøy, Saltdal y Bodø.
    landscape: >-
      No hay un macizo central. El paisaje son muchos valles frondosos que se cuelan entre cumbres, y la más
      alta es Ølfjellet, de 1751 m, en el nordeste. En el centro están Gilatinden, de 1415 m, y Semskfjellet,
      de 1531 m, y en el Svartisen occidental el Snøtinden, de 1594 m.


      El hielo manda en el oeste. El Svartisen es en realidad dos glaciares, hoy separados por Vesterdalen:
      Vestisen, de 221 km², el segundo mayor de la Noruega continental tras el Jostedalsbreen, y Østisen, de
      148 km², el cuarto. Existen por la nevada abundante de la región más que por el frío. El hielo viejo es
      bastante más oscuro que el nuevo y la nieve recién caída, y de ahí el nombre: svart es «negro». Una de
      sus lenguas, Engabreen, es la que llega más abajo.


      Hacia el centro del parque la roca es en muchos sitios caliza, con muchísimas cuevas de tipo kárstico.
      Esa caliza tiene un efecto en las plantas: da una flora frondosa y variada, sobre todo en algunos valles
      de abedul, con plantas raras o exigentes como la lapprose. Saltfjellet es, tradicionalmente, el límite
      norte o sur de muchas plantas.
    wildlife: >-
      El [glotón](/especie/gulo_gulo/) y el [lince](/especie/lynx_lynx/) tienen poblaciones estables en la
      zona, y el [alce](/especie/alces_alces/) vive en los valles. El reno es protagonista de la cultura: los
      distritos de pastoreo de Saltfjellet y Hestmannen/Strandtindene tienen derechos en el parque, y en julio
      y agosto pastan aquí tres comunidades sami suecas. En Granneset, la zona es muy rica botánica, geológica
      y biológicamente, y allí está el límite norte del bosque natural de abeto en Noruega.
    visit: >-
      El parque tiene 15 cabañas turísticas dentro y a su lado, y permite hacer senderismo, caminatas por
      glaciares y por cuevas.


      La ruta más conocida es la Bredekrunden con el Stormdalen. Pasa por cuatro granjas de montaña del siglo
      XIX: Granneset, Bredek, Inner-Bredek y Stormdalsgården. Empieza en el aparcamiento de Storvoll, cruza el
      Ranaelva por un puente colgante y sube por una ladera en parte empinada. A los veinte minutos de
      caminata entras en el parque, con vistas al Stormdalsåga y, más tarde, a Dunderlandsdalen. Desde
      Granneset hay un sendero marcado hacia el interior de Stormdalen, con un pequeño desvío a la cascada
      Bredekfossen. Tras días de lluvia sube rápido el nivel del Stormdalsåga y el sendero y las pasarelas
      pueden inundarse. Bredek, propiedad del museo de Helgeland, está cerrada con llave, pero su conjunto de
      granja suele abrir algunos días cada verano.


      El Centro de Visitantes de Parques Nacionales de Nordland, en Storjord (Saltdal), abrió en 2005 y está
      entre Saltfjellet-Svartisen y Junkerdal. Su exposición «Uerstattelig» da una visión de la geología, la
      fauna y la historia de la naturaleza de Nordland, y enlaza una red de rutas de la costa a la montaña.
    history: >-
      Los vestigios más antiguos del uso sami de la montaña datan del siglo IX: lugares de ofrenda, trampas
      para animales y vallas guía. Lønsdalen es el núcleo de la ganadería de reno de la zona, con raíces en el
      siglo XVI, y la concentración de monumentos sami aquí es excepcional. En los valles de montaña quedan
      huellas de la colonización del siglo XIX, con granjas y cabañas. Desde 1867, una línea telegráfica
      siguió el viejo camino entre Rana y Salten; de ella quedan varios refugios.
    before: >-
      La E6 y la línea de ferrocarril de Nordland siguen los bordes sur y este del parque. Comprueba el estado
      de los senderos tras la lluvia y las condiciones de visita de las granjas antes de ir.
    around: >-
      El [Parque Nacional de Junkerdal](/lugar/junkerdal-national-park/) es su vecino inmediato, y el centro
      de visitantes de Nordland está entre los dos. Más lejos, el [Parque Nacional de
      Reinheimen](/lugar/reinheimen-national-park/) y el [Parque Nacional de
      Jotunheimen](/lugar/jotunheimen-national-park/) comparten con él el glotón, el reno y los glaciares y la
      alta montaña.
  en:
    intro: >-
      The Arctic Circle cuts across the southern part of this park, and you can practically feel it. On one
      side, Svartisen: an ice cap of 370 km² occupying roughly the western third of the park, whose glacier
      arms descend in several places almost to the fjord. On the other, the Saltfjellet plateaus, birch
      valleys, and open arctic tundra. Saltfjellet-Svartisen National Park was established in 1989 and
      traverses Nordland from the shore of Nordfjorden to the high fells through constantly changing scenery,
      covering some 2192 km² across six municipalities: Beiarn, Meløy, Rana, Rødøy, Saltdal, and Bodø.
    landscape: >-
      There is no single central massif. The landscape consists of numerous lush valleys threading between
      alpine summits, the highest being Ølfjellet at 1751 m in the northeast. In the center stand Gilatinden
      at 1415 m and Semskfjellet at 1531 m, and in western Svartisen, Snøtinden at 1594 m.


      Ice rules the west. Svartisen is actually two separate glaciers today divided by Vesterdalen: Vestisen,
      covering 221 km², mainland Norway's second-largest after Jostedalsbreen, and Østisen, covering 148 km²,
      the fourth-largest. They exist because of the region's immense snowfall rather than extreme cold alone.
      Old glacial ice is noticeably darker than new ice and fresh snow, giving rise to the name: svart means
      'black'. One of its outlet tongues, Engabreen, reaches the lowest point.


      Toward the park's interior, bedrock in many areas is limestone, riddled with numerous karst caves. This
      limestone dramatically influences vegetation: it fosters a lush and diverse flora, particularly in
      sheltered birch valleys, with rare or demanding alpine plants like the lapland rosebay (lapprose).
      Saltfjellet marks, traditionally, the northern or southern limit of distribution for many plant species.
    wildlife: >-
      The [wolverine](/especie/gulo_gulo/) and the [Eurasian lynx](/especie/lynx_lynx/) maintain stable
      populations in the area, and [moose](/especie/alces_alces/) dwell in the valleys. Semi-domesticated
      reindeer are central to cultural life: the Saltfjellet and Hestmannen/Strandtindene reindeer herding
      districts hold grazing rights in the park, and in July and August three Swedish Sami communities graze
      herds here. Around Granneset, the area is exceptionally rich botanically, geologically, and
      biologically, marking the northern natural limit of spruce forest in Norway.
    visit: >-
      The park contains 15 tourist cabins within and adjacent to its borders, offering outstanding
      opportunities for hiking, glacier trekking, and caving.


      The best-known route is the Bredekrunden through Stormdalen. It passes four nineteenth-century mountain
      farmsteads: Granneset, Bredek, Inner-Bredek, and Stormdalsgården. Starting from the Storvoll car park,
      it crosses the Ranaelva via a suspension bridge and climbs a steep hillside. After twenty minutes of
      walking you enter the park, with scenic views over Stormdalsåga and later Dunderlandsdalen. From
      Granneset, a waymarked path leads deeper into Stormdalen with a short detour to the Bredekfossen
      waterfall. After heavy rain, the Stormdalsåga rises rapidly and the trail and footbridges can become
      flooded. Bredek, owned by the Helgeland Museum, is kept locked, but the farmstead opens to visitors on
      selected summer days.


      The Nordland National Park Visitor Center at Storjord (Saltdal) opened in 2005 between
      Saltfjellet-Svartisen and Junkerdal. Its exhibition 'Uerstattelig' offers an engaging overview of
      Nordland's geology, fauna, and natural history, linking a network of routes from the coast to the
      mountains.
    history: >-
      The oldest traces of Sami mountain use date back to the ninth century: sacrificial sites, pitfall traps,
      and drift fences. Lønsdalen is the core of traditional reindeer husbandry in the region, with roots in
      the sixteenth century, preserving an exceptional concentration of Sami cultural monuments. In the
      mountain valleys remain footprints of nineteenth-century settlement, with isolated homesteads and timber
      cabins. From 1867, a telegraph line followed the historic trail between Rana and Salten; several of its
      maintenance shelters still survive.
    before: >-
      The E6 highway and the Nordland Railway run along the southern and eastern margins of the park. Check
      trail conditions after rain and verify farmstead visiting hours before heading out.
    around: >-
      [Junkerdal National Park](/lugar/junkerdal-national-park/) is its immediate neighbor, with the Nordland
      visitor center situated between the two. Further afield, [Reinheimen National
      Park](/lugar/reinheimen-national-park/) and [Jotunheimen National
      Park](/lugar/jotunheimen-national-park/) share wolverines, reindeer, glaciers, and high-alpine
      landscapes with it.
  fr:
    intro: >-
      Le cercle polaire arctique traverse le sud de ce parc, et l'atmosphère en témoigne. D'un côté, le
      Svartisen : une calotte glaciaire de 370 km² occupant à peu près le tiers occidental du parc, dont les
      langues glaciaires s'abaissent en plusieurs points presque jusqu'au fjord. De l'autre, les plateaux
      d'altitude du Saltfjellet, leurs vallées de bouleaux et leur toundra découverte. Le parc national de
      Saltfjellet-Svartisen a été créé en 1989 et parcourt le Nordland depuis les rives du Nordfjorden
      jusqu'aux cimes alpines, couvrant environ 2192 km² répartis sur six communes : Beiarn, Meløy, Rana,
      Rødøy, Saltdal et Bodø.
    landscape: >-
      Il n'y a pas de massif central unique. Le paysage se compose de multiples vallées verdoyantes qui se
      faufilent entre les sommets, le plus élevé étant l'Ølfjellet à 1751 m dans le nord-est. Au centre se
      dressent le Gilatinden à 1415 m et le Semskfjellet à 1531 m, et dans le Svartisen occidental le
      Snøtinden à 1594 m.


      Les glaces dominent l'ouest. Le Svartisen est en réalité constitué de deux glaciers distincts,
      aujourd'hui séparés par la Vesterdalen : le Vestisen, étendu sur 221 km², deuxième glacier de Norvège
      continentale après le Jostedalsbreen, et l'Østisen, couvrant 148 km², le quatrième. Ils doivent leur
      existence à l'abondance des chutes de neige de la région plutôt qu'au seul froid. La glace ancienne est
      nettement plus sombre que la glace neuve et la neige fraîche, d'où le nom : svart signifie « noir ».
      L'un de ses émissaires, l'Engabreen, descend le plus bas.


      Vers le centre du parc, la roche est en maints endroits calcaire, creusée de nombreuses grottes
      karstiques. Ce calcaire transforme la végétation : il favorise une flore luxuriante et variée, en
      particulier dans certaines vallées de bouleaux, avec des plantes rares ou exigeantes comme le
      rhododendron de Laponie (lapprose). Le Saltfjellet constitue traditionnellement la limite septentrionale
      ou méridionale de nombreuses espèces végétales.
    wildlife: >-
      Le [glouton](/especie/gulo_gulo/) et le [lynx boréal](/especie/lynx_lynx/) maintiennent des populations
      stables dans la zone, et l'[élan](/especie/alces_alces/) peuple les vallées. Le renne est au cœur des
      traditions pastorales : les districts d'élevage de Saltfjellet et de Hestmannen/Strandtindene possèdent
      des droits de pâture dans le parc, et en juillet et août trois communautés samies suédoises y font
      paître leurs troupeaux. À Granneset, le milieu est d'une remarquable richesse botanique, géologique et
      biologique, marquant la limite nord de l'épicéa naturel en Norvège.
    visit: >-
      Le parc compte 15 refuges touristiques en son sein et en périphérie, permettant la randonnée pédestre,
      les courses sur glacier et la spéléologie.


      Le circuit le plus réputé est la Bredekrunden avec la vallée de Stormdalen. Il passe par quatre fermes
      montagnardes du XIXe siècle : Granneset, Bredek, Inner-Bredek et Stormdalsgården. L'itinéraire part du
      parking de Storvoll, franchit la Ranaelva sur une passerelle suspendue et gravit une pente raide. Après
      vingt minutes de marche, vous pénétrez dans le parc avec vue sur la Stormdalsåga et plus loin sur la
      Dunderlandsdalen. Depuis Granneset, un sentier balisé s'enfonce dans la Stormdalen avec un crochet vers
      la cascade de Bredekfossen. Après de fortes pluies, le niveau de la Stormdalsåga monte vite et sentiers
      ou passerelles peuvent être inondés. Bredek, propriété du musée de Helgeland, est fermée à clé mais le
      corps de ferme ouvre quelques jours chaque été.


      Le centre des parcs nationaux du Nordland à Storjord (Saltdal) a ouvert en 2005 entre
      Saltfjellet-Svartisen et Junkerdal. Son exposition « Uerstattelig » offre un aperçu captivant de la
      géologie, de la faune et de l'histoire naturelle du Nordland, reliant un réseau d'itinéraires de la mer
      à la montagne.
    history: >-
      Les vestiges les plus anciens de l'occupation samie des montagnes remontent au IXe siècle : sites
      sacrificiels, fosses de piégeage et barrières de guidage. La Lønsdalen est le berceau de l'élevage du
      renne dans la région, enraciné au XVIe siècle, abritant une densité exceptionnelle de vestiges samis.
      Dans les vallées alpines subsistent les traces de la colonisation paysanne du XIXe siècle, avec fermes
      et cabanes en bois. À partir de 1867, une ligne télégraphique emprunta le tracé de l'ancien sentier
      entre Rana et Salten ; plusieurs cabanes d'entretien ont été conservées.
    before: >-
      La route E6 et la ligne de chemin de fer du Nordland longent les lisières sud et est du parc. Vérifiez
      l'état des chemins après les pluies et renseignez-vous sur les ouvertures des fermes avant de partir.
    around: >-
      Le [parc national de Junkerdal](/lugar/junkerdal-national-park/) est son voisin direct, le centre de
      visiteurs du Nordland étant situé entre les deux. Plus loin, le [parc national de
      Reinheimen](/lugar/reinheimen-national-park/) et le [parc national de
      Jotunheimen](/lugar/jotunheimen-national-park/) partagent avec lui le glouton, le renne ainsi que les
      grands glaciers d'altitude.
  de:
    intro: >-
      Der Polarkreis schneidet den Süden dieses Parks, und das spürt man fast unmittelbar. Auf der einen Seite
      der Svartisen: eine Eiskappe von 370 km², die rund das westliche Drittel des Parks einnimmt und deren
      Gletscherzungen an mehreren Stellen fast bis zum Fjord hinabreichen. Auf der anderen Seite die
      Hochebenen des Saltfjellet, Birkenwälder und offene Tundra. Der Saltfjellet-Svartisen-Nationalpark wurde
      1989 gegründet und erstreckt sich in Nordland von der Küste des Nordfjorden bis in die alpinen Berge
      über rund 2192 km² auf dem Gebiet von sechs Kommunen: Beiarn, Meløy, Rana, Rødøy, Saltdal und Bodø.
    landscape: >-
      Es gibt kein einzelnes Zentralmassiv. Die Landschaft setzt sich aus zahlreichen üppigen Tälern zusammen,
      die sich zwischen Felsgipfeln hindurchwinden; der höchste ist der Ølfjellet mit 1751 m im Nordosten. Im
      Zentrum ragen der Gilatinden mit 1415 m und der Semskfjellet mit 1531 m auf, im westlichen Svartisen der
      Snøtinden mit 1594 m.


      Das Eis beherrscht den Westen. Der Svartisen besteht heute aus zwei getrennten Gletschern, geschieden
      durch das Tal Vesterdalen: Vestisen mit 221 km², Norwegens zweitgrößter Festlandgletscher nach dem
      Jostedalsbreen, und Østisen mit 148 km², der viertgrößte. Sie verdanken ihre Existenz den gewaltigen
      Schneemengen der Küstenregion mehr als extremer Kälte. Altes Gletschereis ist deutlich dunkler als
      Neuschnee, daher der Name: svart bedeutet 'schwarz'. Eine seiner Auslasszungen, der Engabreen, reicht am
      tiefsten hinab.


      Zum Parkinneren hin besteht das Gestein vielerorts aus Kalk mit zahlreichen Karsthöhlen. Dieser
      Kalkboden prägt die Vegetation: Er begünstigt eine üppige, artenreiche Flora in Birkenauen mit seltenen
      Alpenblumen wie der Lappland-Alpenrose (Lapprose). Das Saltfjellet bildet traditionell die Nord- oder
      Südgrenze für viele Pflanzenarten.
    wildlife: >-
      [Vielfraß](/especie/gulo_gulo/) und [Eurasischer Luchs](/especie/lynx_lynx/) verfügen über stabile
      Bestände im Gebiet, und der [Elch](/especie/alces_alces/) lebt in den Tälern. Das Rentier prägt die
      samische Kultur: Die Weidebezirke Saltfjellet und Hestmannen/Strandtindene besitzen Nutzungsrechte im
      Park, und im Juli und August weiden drei schwedische Samigemeinschaften hier ihre Tiere. Bei Granneset
      ist die Landschaft botanisch, geologisch und biologisch überaus artenreich; dort verläuft die nördliche
      Arealgrenze natürlicher Fichtenwälder in Norwegen.
    visit: >-
      Der Park zählt 15 Wanderhütten im und am Gebiet und bietet beste Voraussetzungen für Weitwanderungen,
      Gletschertouren und Höhlenbegehungen.


      Die bekannteste Rundwanderung ist die Bredekrunden durch das Stormdalen. Sie führt an vier
      Bergbauernhöfen aus dem neunzehnten Jahrhundert vorbei: Granneset, Bredek, Inner-Bredek und
      Stormdalsgården. Beginnend am Wanderparkplatz Storvoll überquert man den Ranaelva auf einer Hängebrücke
      und steigt einen steilen Hang empor. Nach zwanzig Minuten Gehzeit betrittst du den Nationalpark mit
      Blick auf die Stormdalsåga und später das Dunderlandsdalen. Von Granneset führt ein markierter Pfad ins
      Stormdalen mit Abstecher zum Wasserfall Bredekfossen. Nach Regentagen schwillt die Stormdalsåga rasch
      an; Pfade und Stege können überflutet sein. Bredek, im Besitz des Helgeland-Museums, ist verschlossen,
      öffnet aber an ausgewählten Sommertagen.


      Das Nordland-Nationalparkzentrum in Storjord (Saltdal) eröffnete 2005 zwischen Saltfjellet-Svartisen und
      Junkerdal. Seine Ausstellung 'Uerstattelig' vermittelt Einblicke in Geologie, Tierwelt und
      Naturgeschichte Nordlands und vernetzt Touren von der Küste bis ins Gebirge.
    history: >-
      Die ältesten Spuren samischer Bergnutzung stammen aus dem neunten Jahrhundert: Opferplätze, Fallgruben
      und Leitzäune. Das Lønsdalen ist das Kernland der Rentierwirtschaft mit Wurzeln im sechzehnten
      Jahrhundert und einer herausragenden Dichte an Kulturdenkmälern. In den Bergtälern finden sich Relikte
      der Besiedlung des neunzehnten Jahrhunderts mit Gehöften und Blockhütten. Ab 1867 folgte eine
      Telegrafenlinie dem alten Saumpfad zwischen Rana und Salten, von der mehrere Schutzhütten erhalten
      blieben.
    before: >-
      Die Europastraße E6 und die Nordlandbahn begleiten den Süd- und Ostrand des Parks. Erkundige dich nach
      Regenfällen über den Wegzustand und prüfe Öffnungszeiten der Gehöfte vorab.
    around: >-
      Der [Junkerdal-Nationalpark](/lugar/junkerdal-national-park/) ist direkter Nachbar, und das
      Nordland-Zentrum liegt genau zwischen beiden. Weiter entfernt teilen der
      [Reinheimen-Nationalpark](/lugar/reinheimen-national-park/) und der
      [Jotunheimen-Nationalpark](/lugar/jotunheimen-national-park/) Vielfraße, Rentiere sowie weite
      Hängegletscher und alpines Fjell mit dem Gebiet.
  it:
    intro: >-
      Il circolo polare artico attraversa il settore meridionale di questo parco, e lo si percepisce
      nell'aria. Da un lato lo Svartisen: una calotta glaciale di 370 km² che occupa all'incirca il terzo
      occidentale del parco e le cui lingue scendono in più punti quasi fino al fiordo. Dall'altro gli
      altopiani di Saltfjellet, valli di betulle e tundra aperta. Il Parco Nazionale Saltfjellet-Svartisen è
      stato istituito nel 1989 e attraversa il Nordland dalle coste del Nordfjorden fino alle vette alpine,
      estendendosi per circa 2192 km² ripartiti tra sei comuni: Beiarn, Meløy, Rana, Rødøy, Saltdal e Bodø.
    landscape: >-
      Non vi è un massiccio montuoso isolato. Il paesaggio si articola in numerose vallate boscose che si
      insinuano tra le cime, la più alta delle quali è l'Ølfjellet con 1751 m a nord-est. Al centro si elevano
      il Gilatinden a 1415 m e il Semskfjellet a 1531 m, e nello Svartisen occidentale lo Snøtinden a 1594 m.


      Il ghiaccio detta legge a occidente. Lo Svartisen è oggi suddiviso in due ghiacciai separati dalla
      Vesterdalen: il Vestisen, esteso per 221 km², il secondo della Norvegia continentale dopo lo
      Jostedalsbreen, e l'Østisen con 148 km², il quarto. La loro persistenza è dovuta alle imponenti
      precipitazioni nevose più che al freddo estremo. Il ghiaccio antico appare marcatamente più scuro
      rispetto al ghiaccio recente e alla neve fresca, da cui il nome: svart significa 'nero'. Una delle sue
      diramazioni, l'Engabreen, scende alla quota più bassa.


      Verso l'interno del parco la roccia è diffusamente calcarea, traforata da innumerevoli grotte carsiche.
      Il calcare trasforma la vegetazione: favorisce una flora rigogliosa e varia, specialmente in alcune
      valli di betulle, con specie alpine rare come il rododendro lappone (lapprose). Il Saltfjellet segna
      tradizionalmente il limite boreale o australe di distribuzione per molte piante.
    wildlife: >-
      Il [ghiottone](/especie/gulo_gulo/) e la [lince](/especie/lynx_lynx/) vantano popolazioni stabili nel
      comprensorio, mentre l'[alce](/especie/alces_alces/) frequenta i fondovalle. La renna occupa un ruolo
      centrale nella vita comunitaria: i distretti pastorali di Saltfjellet e Hestmannen/Strandtindene
      detengono diritti di pascolo nel parco, e tra luglio e agosto tre comunità sami svedesi vi conducono le
      proprie mandrie. Presso Granneset l'ambiente spicca per ricchezza botanica, geologica e faunistica,
      costituendo l'estremo limite settentrionale del bosco naturale di peccio in Norvegia.
    visit: >-
      Il parco mette a disposizione 15 rifugi alpini all'interno e lungo i suoi confini, offrendo
      straordinarie opportunità per il trekking, le traversate su ghiacciaio e la speleologia.


      L'itinerario più celebre è la Bredekrunden attraverso la Stormdalen. Tocca quattro fattorie d'alta quota
      del diciannovesimo secolo: Granneset, Bredek, Inner-Bredek e Stormdalsgården. Muovendo dal parcheggio di
      Storvoll, si supera il Ranaelva su un ponte sospeso e si rimonta un pendio a tratti ripido. Dopo venti
      minuti di cammino varchi i confini del parco, con scorci sul torrente Stormdalsåga e più avanti sulla
      Dunderlandsdalen. Da Granneset un sentiero segnato prosegue nella Stormdalen con deviazione verso la
      cascata Bredekfossen. Nei periodi piovosi il livello della Stormdalsåga cresce repentinamente e
      passerelle e tracciati possono allagarsi. Bredek, di proprietà del museo dell'Helgeland, è chiusa a
      chiave ma apre in alcune giornate estive.


      Il Centro Visite dei Parchi Nazionali del Nordland a Storjord (Saltdal) ha aperto nel 2005 tra
      Saltfjellet-Svartisen e Junkerdal. La sua mostra «Uerstattelig» offre una panoramica su geologia, fauna
      e storia del Nordland, raccordando una fitta rete di sentieri dalla costa alle vette.
    history: >-
      Le tracce più remote della frequentazione sami delle vette risalgono al nono secolo: siti cerimoniali,
      buche di cattura e recinti per renne. La Lønsdalen è la culla dell'allevamento della renna con radici
      nel sedicesimo secolo e una concentrazione eccezionale di testimonianze sami. Nei fondovalle montani
      affiorano i segni della colonizzazione rurale del diciannovesimo secolo, con masi e baite in legno. Dal
      1867 una linea telegrafica affiancò l'antico sentiero tra Rana e Salten; ne rimangono diversi ricoveri
      storici.
    before: >-
      La strada europea E6 e la ferrovia del Nordland costeggiano i margini meridionali e orientali del parco.
      Verifica la praticabilità dei sentieri dopo le piogge e gli orari di apertura delle fattorie prima di
      intraprendere l'escursione.
    around: >-
      Il [Parco Nazionale di Junkerdal](/lugar/junkerdal-national-park/) è il vicino immediato, con il centro
      visite del Nordland posizionato tra i due. Più a sud, il [Parco Nazionale di
      Reinheimen](/lugar/reinheimen-national-park/) e il [Parco Nazionale di
      Jotunheimen](/lugar/jotunheimen-national-park/) condividono con questo territorio il ghiottone, le renne
      selvatiche e i grandi paesaggi glaciali d'alta montagna.
  pt:
    intro: >-
      O círculo polar ártico corta o sul deste parque, e essa presença quase se sente no ar. De um lado, o
      Svartisen: uma calota de gelo de 370 km² que domina sensivelmente o terço ocidental do parque e cujos
      braços descem em vários pontos quase até ao fiorde. Do outro, os planaltos de Saltfjellet, vales de
      bétulas e tundra aberta. O Parque Nacional Saltfjellet-Svartisen foi criado em 1989 e cruza o Nordland
      desde a costa do Nordfjorden até às montanhas alpinas, estendendo-se por cerca de 2192 km² distribuídos
      por seis comunas: Beiarn, Meløy, Rana, Rødøy, Saltdal e Bodø.
    landscape: >-
      Não existe um maciço central isolado. A paisagem compõe-se de múltiplos vales viçosos que serpenteiam
      entre cumes montanhosos, sendo o mais elevado o Ølfjellet, com 1751 m no nordeste. Ao centro erguem-se o
      Gilatinden com 1415 m e o Semskfjellet com 1531 m, e no Svartisen ocidental o Snøtinden com 1594 m.


      O gelo reina no oeste. O Svartisen reparte-se hoje por dois glaciares separados pela Vesterdalen: o
      Vestisen, com 221 km², o segundo maior da Noruega continental a seguir ao Jostedalsbreen, e o Østisen
      com 148 km², o quarto. Devem a sua existência à queda de neve maciça da região mais do que ao frio
      extremo. O gelo antigo é bastante mais escuro do que o gelo novo e a neve fresca, daí o nome: svart
      traduz-se por 'preto'. Uma das suas línguas glaciares, Engabreen, desce até à cota mais baixa.


      Rumo ao interior do parque a rocha é frequentemente calcária, escavada por inúmeras grutas cársicas.
      Este calcário exerce forte influência nas plantas: sustenta uma flora viçosa e variada, sobretudo em
      certos vales de bétulas, com espécies raras de montanha como a rododentro-da-lapónia (lapprose). O
      Saltfjellet serve historicamente de limite norte ou sul para muitas plantas.
    wildlife: >-
      O [glutão](/especie/gulo_gulo/) e o [lince-euroasiático](/especie/lynx_lynx/) possuem populações firmes
      na região, e o [alce](/especie/alces_alces/) vive nos vales arborizados. A rena constitui uma trave
      mestra cultural: os distritos de pastoreio de Saltfjellet e Hestmannen/Strandtindene têm direitos de
      apascentação no parque, e em julho e agosto pastam aqui três comunidades sami suecas. Em Granneset, a
      área sobressai pela riqueza botânica, geológica e biológica, acolhendo o limite norte da floresta
      natural de espruce na Noruega.
    visit: >-
      O parque disponibiliza 15 cabanas turísticas no seu interior e junto aos limites, permitindo caminhadas
      pedestres, travessias em glaciares e visitas a grutas.


      O percurso mais afamado é o Bredekrunden através do vale de Stormdalen. Passa por quatro quintas
      montanhosas do século XIX: Granneset, Bredek, Inner-Bredek e Stormdalsgården. Tem início no
      estacionamento de Storvoll, cruza o rio Ranaelva por uma ponte suspensa e sobe uma encosta íngreme. Após
      vinte minutos de caminhada entras no parque, com vistas panorâmicas sobre o Stormdalsåga e mais adiante
      sobre Dunderlandsdalen. De Granneset parte um trilho marcado para o interior de Stormdalen com um
      pequeno desvio para a cascata Bredekfossen. Após dias de chuva forte, o nível do Stormdalsåga sobe
      depressa e o trilho ou passadiços podem alagar-se. Bredek, pertença do museu de Helgeland, está trancada
      mas abre nalguns dias durante o verão.


      O Centro de Visitantes dos Parques Nacionais de Nordland em Storjord (Saltdal) abriu em 2005 entre
      Saltfjellet-Svartisen e Junkerdal. A sua mostra «Uerstattelig» proporciona uma visão fascinante da
      geologia, fauna e história natural de Nordland, articulando uma rede de trilhos do mar às serras.
    history: >-
      Os vestígios mais remotos da presença sami nas montanhas remontam ao século IX: locais de sacrifício,
      covas de caça e paliçadas para renas. Lønsdalen é o centro da pastorícia de renas na zona com raízes no
      século XVI e uma densidade admirável de monumentos sami. Nos vales de altitude subsistem marcas do
      povoamento agrícola do século XIX, com quintas e cabanas de madeira. A partir de 1867, uma linha
      telegráfica acompanhou o antigo trilho entre Rana e Salten; dela subsistem vários refúgios de apoio.
    before: >-
      A estrada europeia E6 e a linha férrea de Nordland margeiam os limites sul e este do parque. Confirma as
      condições dos trilhos após chuvas e o horário de abertura das quintas antes de partir.
    around: >-
      O [Parque Nacional de Junkerdal](/lugar/junkerdal-national-park/) é o seu vizinho direto, situando-se o
      centro de visitantes de Nordland entre ambos. Mais longe, o [Parque Nacional de
      Reinheimen](/lugar/reinheimen-national-park/) e o [Parque Nacional de
      Jotunheimen](/lugar/jotunheimen-national-park/) partilham com ele o glutão, as renas selvagens e as
      vastas paisagens glaciares de montanha.
