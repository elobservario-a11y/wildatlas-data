resumen:
  es: >-
    Laberinto dantesco de monolitos calizos y simas kársticas profundas como Lukina Jama (1.431 m de
    profundidad).
  en: Dantesque labyrinth of limestone monoliths and abyssal karst pits such as Lukina Jama (1,431 m deep).
  fr: >-
    Labyrinthe dantesque de monolithes calcaires et de gouffres karstiques abyssaux comme Lukina Jama (1 431 m
    de profondeur).
  de: >-
    Danteskes Labyrinth aus Kalkstein-Monolithen und tiefen Karstschlünder wie der Lukina Jama (1.431 m
    Tiefe).
  it: >-
    Labirinto dantesco di monoliti calcarei e profondi abissi carsici come la Lukina Jama (1.431 m di
    profondità).
  pt: >-
    Labirinto dantesco de monólitos calcários e profundos abismos cársicos como Lukina Jama (1 431 m de
    profundidade).
unico:
  es: >-
    Los roquedos de los dos kukovi albergan la mayor concentración de plantas endémicas del parque y, bajo
    ellos, simas de más de mil metros.
  en: >-
    The cliffs of the two kukovi host the park's highest concentration of endemic plants and, beneath them,
    chasms plunging over a thousand metres.
  fr: >-
    Les falaises des deux kukovi concentrent la plus forte densité de plantes endémiques du parc et, sous
    leurs parois, des gouffres de plus de mille mètres.
  de: >-
    Die Felsen der beiden Kukovi beherbergen die größte Dichte endemischer Pflanzen des Parks und unter ihnen
    Klüfte von über tausend Metern Tiefe.
  it: >-
    Le rocce dei due kukovi ospitano la più alta concentrazione di piante endemiche del parco e, sotto di
    esse, abissi di oltre mille metri.
  pt: >-
    As escarpas dos dois kukovi acolhem a maior concentração de plantas endémicas do parque e, sob elas,
    abismos com mais de mil metros.
observaciones:
  es: >-
    En los sectores visitables del parque está prohibido abandonar las sendas marcadas, y recoger plantas y
    hongos. Las simas no se visitan: se conocen por la exposición de Velebit House.
texto:
  es:
    intro: >-
      Bajo los picos pelados de Velebit septentrional hay un bosque de roca y, debajo, otro mundo. En la
      reserva estricta de Hajdučki i Rožanski kukovi, 1220 hectáreas en el sector septentrional del parque
      nacional, se concentra un gran número de cavidades subterráneas. A finales de 2020 se habían descubierto
      en el parque más de 600, sobre todo simas, y una de ellas, el sistema Lukina jama–Trojama, en Hajdučki
      kukovi, es la sima más vertical del mundo: 1.431 metros de profundidad. Arriba, el paisaje es de agujas
      y bloques de caliza; abajo, la oscuridad. Y entre los dos, una senda construida a mano que te deja
      asomarte al corazón de todo esto.
    landscape: >-
      Los kukovi son los picos de caliza desnudos, el karst al aire. Dos grupos, Hajdučki y Rožanski,
      separados por el paso Lubenovačka vrata. En ellos crece la mayor cantidad de plantas endémicas del
      parque, y entre las rocas viven también algunos animales endémicos, como la lagartija de Horvath
      (Iberolacerta horvathi) y el topillo balcánico de las nieves (Dinaromys bogdanovi).


      El bosque tiene aquí carácter de alta montaña. En los bloques calcáreos escarpados de ambos kukovi
      domina la pícea común (Picea abies), con serbales de cazadores y, de vez en cuando, hayas achaparradas
      de porte retorcido. Las hayas forman también hayedos subalpinos, unos con ranúnculos y otros de la
      asociación Polysticho lonchitis-Fagetum, y todos soportan abundante nieve, temperaturas bajas, un
      periodo vegetativo corto y vientos fuertes.


      Bajo tierra hay otro mundo. El portal público de parques sitúa en las simas profundas de la reserva
      estricta a la sanguijuela endémica Croatobranchus mestrovi, y un artículo científico cuenta que
      Troglocladius hajdi fue recolectado en Lukina jama–Trojama a 980 metros de profundidad y que parece
      capaz de volar.
    wildlife: >-
      La vida aquí se cuenta en dos pisos. Arriba, entre los roquedos, la lagartija de Horvath y el topillo de
      las nieves. Abajo, en las simas, la sanguijuela y el insecto volador de las profundidades. Las plantas,
      como la Rosa pendulina o la Lonicera borbasiana, acompañan a la pícea en el bosque de los kukovi.


      Para ver floración, el jardín botánico de Velebit, fuera de la reserva estricta, recomienda junio y
      julio, cuando casi todas sus plantas están en flor. Allí las plantas se identifican con placas
      ilustradas, y paneles explican los principales valores naturales.
    visit: >-
      La reserva estricta es una figura que excluye las actividades económicas y otras actividades, aunque el
      ministerio contempla visitas e investigación cuando se autorizan. La puerta de entrada abierta a todos
      es el sendero Premužić, que da acceso a los sectores más abruptos e inaccesibles de Hajdučki i Rožanski
      kukovi. Dieciséis de sus kilómetros atraviesan el Parque Nacional de Velebit Septentrional.


      La travesía completa entre los refugios de Zavižan y Alan lleva unas cinco o seis horas. Y si quieres
      llegar al refugio Rossi, la subida por Premužić requiere unas dos horas desde Zavižan o tres desde Alan;
      el regreso añade su propio tiempo.


      La sima, en cambio, se visita sin entrar. En Velebit House puedes explorar Lukina jama sin acceder a su
      interior. La exposición sobre la montaña se reparte en cuatro plantas, y todas son accesibles para
      personas con movilidad reducida gracias a un ascensor.
    history: >-
      La protección de Hajdučki i Rožanski kukovi data de 1969, según el inventario de áreas protegidas de
      Naciones Unidas. La senda Premužić es anterior a esa protección: su construcción empezó en 1930 y
      terminó en el verano de 1933, y la trazó y construyó el ingeniero forestal Ante Premužić, de quien toma
      el nombre. En 2009 quedó protegida en toda su longitud como bien cultural de importancia nacional.
    before: >-
      En los sectores visitables del parque está prohibido abandonar las sendas marcadas, y recoger plantas y
      hongos. Las simas no se visitan: se conocen por la exposición de Velebit House.
    around: >-
      La [Rewilding Velebit Plains](/lugar/rewilding-velebit-plains/) queda a unos doce kilómetros. Entre los
      lugares afines, la [Prašuma Lom - Strogi rezervat prirode](/lugar/prasuma-lom-strogi-rezervat-prirode/)
      comparte la Rosa pendulina, la pícea y la haya. La [Rezervația Codrul Secular
      Slătioara](/lugar/rezervatia-codrul-secular-slatioara/) coincide en el serbal de cazadores, la haya y el
      lince; y el [Bukovské vrchy pralesový komplex - NP
      Poloniny](/lugar/bukovske-vrchy-pralesovy-komplex-np-poloniny/) y la [Prašuma Perućica - Nacionalni park
      Sutjeska](/lugar/prasuma-perucica---nacionalni-park-sutjeska/), en la haya, el lince y el lobo.
  en:
    intro: >-
      Beneath the barren crests of northern Velebit lies a stone forest, and beneath that, an entirely
      different world. In the Hajdučki and Rožanski kukovi strict reserve, 1220 hectares in the northern
      sector of the national park, an extraordinary number of subterranean cavities cluster together. By late
      2020 more than 600 caves had been discovered across the park, predominantly vertical shafts, and one of
      them—the Lukina jama–Trojama system in Hajdučki kukovi—is the world's most sheer vertical pit: 1,431
      metres deep. Above ground, pinnacles and white limestone boulders dominate the skyline; below lies sheer
      darkness. Strung between the two, a hand-crafted path allows you to peer right into the core of this
      wild terrain.
    landscape: >-
      The kukovi are bare limestone peaks, naked karst exposed to the elements. Two distinct groups, Hajdučki
      and Rožanski, are separated by the Lubenovačka vrata pass. They shelter the park's greatest
      concentration of endemic plants, and among the shattered rocks live rare endemic animals such as
      Horvath's rock lizard (Iberolacerta horvathi) and the Balkan snow vole (Dinaromys bogdanovi).


      The forest here takes on a rugged high-mountain character. On the steep limestone bluffs of both kukovi,
      Norway spruce (Picea abies) dominates, accompanied by rowan and occasional stunted, weather-twisted
      beech. Beech also forms subalpine woodlands, some featuring buttercups and others belonging to the
      Polysticho lonchitis-Fagetum association; all endure heavy snows, frigid temperatures, a short
      vegetative season, and ferocious mountain winds.


      Underground lies another dimension entirely. The official national parks portal notes that the deep
      abysses of the strict reserve harbour the endemic subterranean leech Croatobranchus mestrovi, while
      scientific papers document that the non-biting midge Troglocladius hajdi was collected deep inside
      Lukina jama–Trojama at a depth of 980 metres and appears capable of flight.
    wildlife: >-
      Life here unfolds across two tiers. Up high among the rocky crags live Horvath's rock lizard and the
      Balkan snow vole. Down below in the freezing shafts dwell the troglobitic leech and deep-cave flying
      midges. Plants such as Alpine rose (Rosa pendulina) or Borbás's honeysuckle (Lonicera borbasiana)
      accompany spruce in the open kukovi woodlands.


      To witness the peak of alpine blooms, the Velebit Botanical Garden outside the strict reserve recommends
      visiting in June and July, when almost all species are flowering. Plants there are marked with
      illustrated nameplates, and interpretive signs explain the main ecological features.
    visit: >-
      A strict nature reserve is a legal category that prohibits economic exploitation and other disruptive
      activities, though the ministry permits managed educational visits and scientific research when
      authorized. The universally open gateway into this realm is the Premužić Trail, which threads through
      the most rugged and otherwise inaccessible crags of Hajdučki and Rožanski kukovi. Sixteen of its
      kilometres cross Northern Velebit National Park.


      The complete hike between the mountain huts of Zavižan and Alan takes around five or six hours. If you
      wish to branch off to the Rossi hut, the climb along the Premužić path requires about two hours from
      Zavižan or three from Alan, with the return trip adding its own travel time.


      The deep abyss, by contrast, is visited without going underground. At Velebit House in Krasno you can
      explore Lukina jama virtually without descending into the chasm. The interpretive mountain exhibition
      spans four floors, all fully wheelchair-accessible via a lift.
    history: >-
      Statutory protection for Hajdučki and Rožanski kukovi dates back to 1969, according to United Nations
      protected planet inventories. The Premužić Trail predates formal nature reserve status: construction
      began in 1930 and concluded in the summer of 1933, surveyed and built by forestry engineer Ante
      Premužić, after whom it is named. In 2009 the trail was designated in its entirety as a cultural asset
      of national significance.
    before: >-
      Within accessible sectors of the park, leaving marked paths and collecting plants or mushrooms is
      strictly prohibited. The deep vertical shafts are closed to tourism: you explore them through the
      interactive exhibits at Velebit House.
    around: >-
      The [Rewilding Velebit Plains](/lugar/rewilding-velebit-plains/) lie roughly twelve kilometres away.
      Among comparable wild massifs, [Prašuma Lom - Strogi rezervat
      prirode](/lugar/prasuma-lom-strogi-rezervat-prirode/) shares Rosa pendulina, Norway spruce, and European
      beech. [Rezervația Codrul Secular Slătioara](/lugar/rezervatia-codrul-secular-slatioara/) coincides in
      rowan, beech, and Eurasian lynx; while [Bukovské vrchy pralesový komplex - NP
      Poloniny](/lugar/bukovske-vrchy-pralesovy-komplex-np-poloniny/) and [Prašuma Perućica - Nacionalni park
      Sutjeska](/lugar/prasuma-perucica---nacionalni-park-sutjeska/) share beech, lynx, and grey wolf.
  fr:
    intro: >-
      Sous les sommets dénudés du Velebit septentrional s'étend une forêt de pierre et, plus bas encore, un
      autre monde. Dans la réserve intégrale de Hajdučki i Rožanski kukovi, 1220 hectares nichés dans le
      secteur nord du parc national, se concentre un nombre prodigieux de cavités souterraines. À la fin de
      2020, plus de 600 cavités avaient été inventoriées dans le parc, principalement des gouffres verticaux,
      dont l'un—le système Lukina jama–Trojama dans les Hajdučki kukovi—constitue le gouffre le plus vertical
      de la planète avec 1 431 mètres de profondeur. En surface règne un univers d'aiguilles et de blocs
      calcaires ; en dessous, l'obscurité totale. Entre les deux, un sentier taillé à la main vous permet de
      contempler le cœur de ce paysage saisissant.
    landscape: >-
      Les kukovi désignent ces éperons calcaires dénudés, véritable karst à ciel ouvert. Deux groupes
      distincts, Hajdučki et Rožanski, sont séparés par le col de Lubenovačka vrata. Ils abritent la plus
      riche concentration de flore endémique du parc, ainsi que des espèces animales relictuelles inféodées
      aux pierriers, à l'instar du lézard d'Horvath (Iberolacerta horvathi) et du campagnol de Martino
      (Dinaromys bogdanovi).


      La végétation arborée revêt ici un caractère de haute montagne marqué. Sur les blocs calcaires abrupts
      des deux kukovi domine l'épicéa commun (Picea abies), flanqué de sorbiers des oiseleurs et, par
      endroits, de hêtres rabougris aux troncs tortueux. Le hêtre forme également des hêtraies subalpines,
      certaines à renoncules et d'autres rattachées à l'association Polysticho lonchitis-Fagetum, toutes
      habituées à un manteau neigeux persistant, des températures glaciales, une courte saison de végétation
      et des vents violents.


      Sous terre s'ouvre un univers à part. Le portail officiel des parcs croates répertorie dans les gouffres
      profonds de la réserve la sangsue cavernicole endémique Croatobranchus mestrovi, tandis qu'une étude
      scientifique relate la capture du chironomide Troglocladius hajdi dans le gouffre Lukina jama–Trojama à
      980 mètres de profondeur, semblant capable de voler dans le noir absolu.
    wildlife: >-
      Ici, la vie sauvage s'étage sur deux niveaux. En altitude, parmi les crêtes rocheuses, s'activent le
      lézard d'Horvath et le campagnol des neiges. Tout au fond des gouffres glaciaires subsistent la sangsue
      aveugle et l'insecte ailé des profondeurs. Des plantes montagnardes comme Rosa pendulina ou Lonicera
      borbasiana ponctuent le sous-bois d'épicéas des kukovi.


      Pour admirer la flore en pleine floraison, le jardin botanique du Velebit, situé en dehors de la réserve
      intégrale, conseille une visite en juin et juillet, lorsque la quasi-totalité des espèces s'épanouit.
      Les végétaux y sont répertoriés au moyen d'étiquettes illustrées, et des panneaux pédagogiques
      détaillent les trésors écologiques de la montagne.
    visit: >-
      Le statut de réserve intégrale exclut par définition toute exploitation économique et activité
      perturbatrice, bien que les autorités autorisent les démarches scientifiques et les visites strictement
      encadrées. L'axe de découverte ouvert à tous demeure le sentier Premužić, qui permet de franchir les
      zones les plus tourmentées et inaccessibles de Hajdučki i Rožanski kukovi. Seize kilomètres de cet
      itinéraire sillonnent le parc national du Velebit septentrional.


      La traversée intégrale entre les refuges de Zavižan et d'Alan demande environ cinq ou six heures de
      marche. Si vous souhaitez rejoindre le refuge Rossi, la montée par le sentier Premužić exige environ
      deux heures depuis Zavižan ou trois heures depuis Alan, sans compter le temps de retour.


      Le grand gouffre, pour sa part, se visite sans s'aventurer sous terre. À la Maison du Velebit (Velebit
      House) à Krasno, vous pouvez explorer Lukina jama au moyen d'installations muséographiques sans
      descendre dans l'abîme. L'exposition consacrée au massif se déploie sur quatre étages, tous rendus
      accessibles aux personnes à mobilité réduite par un ascenseur.
    history: >-
      La protection officielle des Hajdučki i Rožanski kukovi remonte à 1969, d'après les registres des
      Nations Unies. Le sentier Premužić est antérieur à ce classement : son chantier débuta en 1930 pour
      s'achever à l'été 1933, sous la direction de l'ingénieur forestier Ante Premužić dont il a conservé le
      nom. En 2009, l'ensemble de l'ouvrage pédestre a été classé monument culturel d'importance nationale.
    before: >-
      Dans les secteurs ouverts au public, il est rigoureusement interdit de quitter les sentiers balisés et
      de cueillir fleurs ou champignons. Les gouffres abyssaux ne se visitent pas sur le terrain : leur
      découverte s'effectue dans l'exposition de la Maison du Velebit.
    around: >-
      Le territoire de [Rewilding Velebit Plains](/lugar/rewilding-velebit-plains/) se situe à environ douze
      kilomètres. Parmi les massifs comparables, la [Prašuma Lom - Strogi rezervat
      prirode](/lugar/prasuma-lom-strogi-rezervat-prirode/) partage Rosa pendulina, l'épicéa et le hêtre. La
      [Rezervația Codrul Secular Slătioara](/lugar/rezervatia-codrul-secular-slatioara/) abrite le sorbier des
      oiseleurs, le hêtre et le lynx ; tandis que le [Bukovské vrchy pralesový komplex - NP
      Poloniny](/lugar/bukovske-vrchy-pralesovy-komplex-np-poloniny/) et la [Prašuma Perućica - Nacionalni
      park Sutjeska](/lugar/prasuma-perucica---nacionalni-park-sutjeska/) réunissent le hêtre, le lynx et le
      loup.
  de:
    intro: >-
      Unter den kahlen Kämmen des nördlichen Velebit erstreckt sich ein Wald aus Stein und darunter eine
      völlig andere Welt. Im strengen Naturreservat Hajdučki i Rožanski kukovi, das 1220 Hektar im Nordteil
      des Nationalparks umfasst, konzentriert sich eine außergewöhnliche Fülle an unterirdischen Hohlräumen.
      Bis Ende 2020 wurden im Park über 600 Höhlen entdeckt, vorwiegend senkrechte Schächte, und eine davon –
      das Höhlensystem Lukina jama–Trojama in den Hajdučki kukovi – gilt als tiefster Vertikalschacht der
      Welt: 1.431 Meter Tiefe. Oben prägen Felsnadeln und weiße Kalksteinblöcke das Bild; unten herrscht
      absolute Finsternis. Dazwischen ermöglicht dir ein von Hand angelegter Pfad den Einblick in das Herz
      dieser urwüchsigen Bergwelt.
    landscape: >-
      Die Kukovi sind kahle Kalkgipfel, nackter Karst unter freiem Himmel. Zwei Hauptgruppen, Hajdučki und
      Rožanski, werden durch den Pass Lubenovačka vrata getrennt. Hier wächst die größte Anzahl endemischer
      Pflanzenarten des gesamten Nationalparks, und im Felssturz leben seltene Endemiten wie die
      Horvath-Eidechse (Iberolacerta horvathi) und die Balkan-Schneemaus (Dinaromys bogdanovi).


      Der Baumbestand trägt ausgeprägt hochalpinen Charakter. Auf den schroffen Kalksteinblöcken beider Kukovi
      dominiert die Gemeine Fichte (Picea abies), vergesellschaftet mit Ebereschen und gedrungenen,
      windzerzausten Rotbuchen. Buchen bilden zudem subalpine Bestände, teils mit Hahnenfuß-Arten und teils
      aus der Pflanzengesellschaft Polysticho lonchitis-Fagetum, die an meterhohen Schnee, klirrenden Frost,
      eine kurze Vegetationsperiode und stürmische Winde angepasst sind.


      Unter Tage öffnet sich ein verborgener Kosmos. Das offizielle Portal der kroatischen Nationalparks
      verzeichnet in den tiefen Abgründen des Reservats den endemischen Höhlenegel Croatobranchus mestrovi,
      während eine wissenschaftliche Studie berichtet, dass die Zuckmücke Troglocladius hajdi in Lukina
      jama–Trojama in 980 Metern Tiefe gefangen wurde und offenbar im ewigen Dunkel fliegen kann.
    wildlife: >-
      Das Leben teilt sich hier in zwei Stockwerke. Oben in den Felsfluren tummeln sich Horvath-Eidechse und
      Balkan-Schneemaus. Unten in den eisigen Schächten verharren der blinde Höhlenegel und
      Tiefenfluginsekten. Pflanzen wie die Alpen-Heckenrose (Rosa pendulina) oder Borbás-Geißblatt (Lonicera
      borbasiana) begleiten die Fichten im Blockwald der Kukovi.


      Um den Höhepunkt der Gebirgsblüte zu erleben, empfiehlt der Botanische Garten Velebit außerhalb der
      Kernzone einen Besuch im Juni und Juli, wenn nahezu alle Arten blühen. Die Pflanzen sind dort mit
      Schautafeln beschriftet, die über die botanischen Besonderheiten informieren.
    visit: >-
      Ein strenges Naturreservat schließt wirtschaftliche Nutzung und störende Eingriffe grundsätzlich aus,
      wenngleich das Ministerium geregelte Besuche und Forschungsvorhaben gestattet. Das für alle offene Tor
      zu dieser Felswildnis ist der Premužić-Weg (Premužićeva staza), der die unwegsamsten Zonen von Hajdučki
      i Rožanski kukovi zugänglich macht. Sechzehn Kilometer dieses Weges durchziehen den Nationalpark
      Nördlicher Velebit.


      Die gesamte Wanderung zwischen den Berghütten Zavižan und Alan erfordert etwa fünf bis sechs Stunden
      Gehzeit. Möchtest du zur Rossi-Hütte abzweigen, benötigt der Aufstieg über den Premužić-Pfad rund zwei
      Stunden ab Zavižan oder drei Stunden ab Alan, zuzüglich Rückweg.


      Den Abgrund der Lukina jama erkundet man hingegen, ohne hinabzusteigen. Im Besucherzentrum Velebit House
      in Krasno kannst du die Höhle virtuell durch interaktive Exponate erforschen. Die Ausstellung über das
      Gebirge erstreckt sich über vier Etagen, die per Aufzug barrierefrei erreichbar sind.
    history: >-
      Die formelle Unterschutzstellung von Hajdučki i Rožanski kukovi geht auf das Jahr 1969 zurück, wie das
      Schutzgebietsinventar der Vereinten Nationen verzeichnet. Der Premužić-Weg entstand bereits vor diesem
      Status: Sein Bau begann 1930 und endete im Sommer 1933 unter der Leitung des Forstingenieurs Ante
      Premužić, nach dem die Trasse benannt ist. Im Jahr 2009 wurde der Pfad auf ganzer Länge als
      Kulturdenkmal von nationaler Bedeutung eingestuft.
    before: >-
      In den frei zugänglichen Bereichen des Parks ist das Verlassen markierter Pfade sowie das Pflücken von
      Pflanzen und Pilzen streng verboten. Die tiefen Schächte sind für Besucher unzugänglich: Ihre Erkundung
      erfolgt im Besucherzentrum Velebit House.
    around: >-
      Das Gebiet [Rewilding Velebit Plains](/lugar/rewilding-velebit-plains/) liegt rund zwölf Kilometer
      entfernt. Unter vergleichbaren Bergurwäldern teilt die [Prašuma Lom - Strogi rezervat
      prirode](/lugar/prasuma-lom-strogi-rezervat-prirode/) Rosa pendulina, Fichte und Rotbuche. Die
      [Rezervația Codrul Secular Slătioara](/lugar/rezervatia-codrul-secular-slatioara/) weist Eberesche,
      Buche und Luchs auf; während der [Bukovské vrchy pralesový komplex - NP
      Poloniny](/lugar/bukovske-vrchy-pralesovy-komplex-np-poloniny/) und die [Prašuma Perućica - Nacionalni
      park Sutjeska](/lugar/prasuma-perucica---nacionalni-park-sutjeska/) Rotbuche, Luchs und Wolf vereinen.
  it:
    intro: >-
      Sotto le creste spoglie del Velebit settentrionale si sviluppa una foresta di pietra e, ancora più
      sotto, un mondo completamente diverso. Nella riserva integrale di Hajdučki i Rožanski kukovi, 1220
      ettari nel settore settentrionale del parco nazionale, si concentra una straordinaria densità di cavità
      sotterranee. Alla fine del 2020 erano state censite nel parco oltre 600 grotte, principalmente voragini
      verticali, e una di queste—il sistema Lukina jama–Trojama nei Hajdučki kukovi—è l'abisso carsico più
      verticale al mondo: 1.431 metri di profondità. In superficie domina uno scenario di guglie e massi di
      calcare bianco; sotto regna il buio assoluto. Tra i due mondi, un sentiero lastricato a mano ti permette
      di affacciarti nel cuore più selvaggio della montagna.
    landscape: >-
      I kukovi sono vette calcaree scoperte, vero carso a cielo aperto. Due complessi montuosi distinti,
      Hajdučki e Rožanski, separati dal valico Lubenovačka vrata. Su queste rupi fiorisce la maggiore varietà
      di piante endemiche del parco, e tra gli sfasciumi di roccia vivono specie endemiche rare come la
      lucertola di Horvath (Iberolacerta horvathi) e l'arvicola delle nevi balcanica (Dinaromys bogdanovi).


      La copertura arborea assume qui lineamenti marcatamente d'alta quota. Sui dirupi calcarei scoscesi di
      entrambi i kukovi domina l'abete rosso (Picea abies), accompagnato da sorbi degli uccellatori e da faggi
      contorti e nani. I faggi costituiscono anche faggete subalpine, alcune con ranuncoli e altre ascrivibili
      all'associazione Polysticho lonchitis-Fagetum; tutte affrontano nevicate abbondanti, temperature rigide,
      una stagione vegetativa ridotta e venti tempestosi.


      Nel sottosuolo si spalanca un'altra realtà. Il portale ufficiale dei parchi croati segnala nei profondi
      abissi della riserva la sanguisuga cavernicola endemica Croatobranchus mestrovi, mentre ricerche
      scientifiche attestano che il moscerino Troglocladius hajdi è stato raccolto nella Lukina jama–Trojama a
      980 metri di profondità e appare in grado di volare nel buio sotterraneo.
    wildlife: >-
      La vita animale qui si distribuisce su due livelli distinti. In alto, tra le rocce battute dal vento,
      vivono la lucertola di Horvath e l'arvicola delle nevi. In basso, nelle voragini ghiacciate, resistono
      la sanguisuga cieca e l'insetto alato delle profondità. Arbusti d'alta quota come Rosa pendulina o
      Lonicera borbasiana affiancano l'abete rosso tra le pietraie dei kukovi.


      Per assistere al culmine delle fioriture montane, il giardino botanico del Velebit all'esterno della
      riserva consiglia i mesi di giugno e luglio, quando quasi tutte le piante sono in fiore. Lungo i
      vialetti le specie sono contrassegnate da targhette illustrate, e pannelli didattici descrivono il
      patrimonio naturale circostante.
    visit: >-
      La riserva integrale è una tipologia di tutela che vieta qualsiasi attività economica o invasiva, pur
      consentendo visite guidate autorizzate e ricerche scientifiche. Il punto di accesso aperto a tutti è il
      sentiero Premužić (Premužićeva staza), che consente di attraversare i settori più aspri e inaccessibili
      di Hajdučki i Rožanski kukovi. Sedici dei suoi chilometri solcano il Parco Nazionale del Velebit
      Settentrionale.


      La traversata completa tra i rifugi montani di Zavižan e Alan richiede circa cinque o sei ore di
      cammino. Se intendi raggiungere il rifugio Rossi, la salita lungo il tracciato Premužić richiede circa
      due ore partendo da Zavižan o tre ore da Alan, a cui va aggiunto il tragitto di ritorno.


      L'abisso carsico, al contrario, si visita senza addentrarsi nel sottosuolo. Presso la Velebit House di
      Krasno puoi esplorare la Lukina jama tramite ricostruzioni interattive. L'esposizione dedicata alla
      montagna si articola su quattro piani, tutti pienamente accessibili a persone con mobilità ridotta
      grazie a un ascensore.
    history: >-
      L'istituzione formale della protezione di Hajdučki i Rožanski kukovi risale al 1969, secondo
      l'inventario delle aree protette delle Nazioni Unite. Il sentiero Premužić è anteriore a questa tutela:
      i lavori iniziarono nel 1930 e si conclusero nell'estate del 1933 sotto la direzione dell'ingegnere
      forestale Ante Premužić, dal quale prende il nome. Nel 2009 l'intero tracciato è stato dichiarato bene
      culturale di rilevanza nazionale.
    before: >-
      Nelle zone aperte del parco è severamente vietato abbandonare i sentieri segnati e raccogliere piante o
      funghi. Gli abissi carsici non sono accessibili al pubblico: la loro scoperta avviene attraverso la
      mostra didattica della Velebit House.
    around: >-
      L'area di [Rewilding Velebit Plains](/lugar/rewilding-velebit-plains/) dista circa dodici chilometri.
      Tra le riserve forestali affini, la [Prašuma Lom - Strogi rezervat
      prirode](/lugar/prasuma-lom-strogi-rezervat-prirode/) presenta Rosa pendulina, abete rosso e faggio. La
      [Rezervația Codrul Secular Slătioara](/lugar/rezervatia-codrul-secular-slatioara/) include sorbo degli
      uccellatori, faggio e lince; mentre il [Bukovské vrchy pralesový komplex - NP
      Poloniny](/lugar/bukovske-vrchy-pralesovy-komplex-np-poloniny/) e la [Prašuma Perućica - Nacionalni park
      Sutjeska](/lugar/prasuma-perucica---nacionalni-park-sutjeska/) accomunano faggio, lince e lupo.
  pt:
    intro: >-
      Sob os cumes despidos de Velebit setentrional estende-se uma floresta de pedra e, sob ela, um universo
      inteiramente distinto. Na reserva integral de Hajdučki i Rožanski kukovi, 1220 hectares no setor
      setentrional do parque nacional, concentra-se uma densidade invulgar de cavidades subterrâneas. No final
      de 2020 tinham sido identificadas no parque mais de 600 grutas, essencialmente algares verticais, e uma
      delas—o sistema Lukina jama–Trojama, em Hajdučki kukovi—é o algar cársico mais vertical do planeta: 1
      431 metros de profundidade. À superfície impera um relevo de agulhas e blocos calcários; em baixo reina
      a escuridão absoluta. Entre ambos, um trilho talhado à mão permite contemplar o coração desta paisagem
      agreste.
    landscape: >-
      Os kukovi são picos calcários expostos, carso puro a céu aberto. Dois grupos cimeiros, Hajdučki e
      Rožanski, separados pelo colo de Lubenovačka vrata. Neles medra a maior diversidade de flora endémica do
      parque, convivendo nas escarpas com espécies animais relictuais como a lagartixa-de-horvath
      (Iberolacerta horvathi) e o rato-das-neves-balcânico (Dinaromys bogdanovi).


      A floresta assume feição marcadamente alpina. Nos blocos calcários escarpados de ambos os kukovi
      predomina o espruce-comum (Picea abies), acompanhado por tramazeiras e faias de porte retorcido e
      ananicadas pelo vento. As faias estruturam igualmente faiais subalpinos, uns com ranúnculos e outros da
      associação Polysticho lonchitis-Fagetum, todos adaptados a espessos mantos de neve, frio rigoroso,
      período vegetativo breve e ventos ciclónicos.


      No subsolo desdobra-se outra dimensão. O portal público dos parques croatas regista nas fossas abissais
      da reserva a sanguessuga cavernícola endémica Croatobranchus mestrovi, e estudos científicos relatam que
      o díptero Troglocladius hajdi foi colhido na Lukina jama–Trojama a 980 metros de profundidade, parecendo
      capaz de voar nas trevas subterrâneas.
    wildlife: >-
      A fauna e flora repartem-se por dois andares contrastantes. No topo, entre os penedos, movem-se a
      lagartixa-de-horvath e o rato-das-neves. No fundo dos algares gélidos sobrevivem a sanguessuga cega e os
      insetos alados das profundezas. Arbustos como Rosa pendulina ou Lonicera borbasiana acompanham o espruce
      nos bosques dos kukovi.


      Para apreciar o auge da floração de altitude, o jardim botânico de Velebit, situado fora da reserva
      integral, recomenda uma visita em junho e julho, período em que quase todas as espécies estão floridas.
      Ali as plantas encontram-se identificadas com placas ilustradas, e painéis temáticos expõem os valores
      ecológicos da montanha.
    visit: >-
      A reserva integral constitui um regime de proteção que interdita atividades económicas e outras
      explorações, admitindo contudo visitas e estudos científicos devidamente autorizados. A via de acesso
      aberta a todos é o trilho Premužić (Premužićeva staza), que permite cruzar os setores mais escarpados e
      inacessíveis de Hajdučki e Rožanski kukovi. Dezasseis dos seus quilómetros percorrem o Parque Nacional
      de Velebit Setentrional.


      A travessia integral entre os refúgios de montanha de Zavižan e Alan demora cerca de cinco ou seis horas
      de marcha. Se quiseres subir até ao refúgio Rossi, o desvio pelo trilho Premužić requer cerca de duas
      horas a partir de Zavižan ou três horas desde Alan, a que se junta o regresso.


      O grande algar cársico, por sua vez, visita-se sem descida ao subsolo. No centro de interpretação
      Velebit House, em Krasno, podes conhecer a Lukina jama através de módulos interativos. A exposição sobre
      a montanha reparte-se por quatro pisos, todos com acessibilidade garantida por elevador.
    history: >-
      A classificação protetora de Hajdučki i Rožanski kukovi remonta a 1969, de acordo com o inventário das
      Nações Unidas. O trilho Premužić é anterior a essa classificação: a sua abertura teve início em 1930 e
      terminou no verão de 1933, sob a orientação do engenheiro florestal Ante Premužić, que lhe deu o nome.
      Em 2009 o percurso foi classificado na totalidade como património cultural de interesse nacional.
    before: >-
      Nas zonas acessíveis do parque é rigorosamente proibido sair dos trilhos balizados, bem como colher
      plantas e cogumelos. As fossas abissais não são visitáveis no terreno: a sua exploração faz-se na
      exposição da Velebit House.
    around: >-
      A área de [Rewilding Velebit Plains](/lugar/rewilding-velebit-plains/) dista cerca de doze quilómetros.
      Entre as florestas com valores análogos, a [Prašuma Lom - Strogi rezervat
      prirode](/lugar/prasuma-lom-strogi-rezervat-prirode/) partilha Rosa pendulina, o espruce e a faia. A
      [Rezervația Codrul Secular Slătioara](/lugar/rezervatia-codrul-secular-slatioara/) reúne a tramazeira, a
      faia e o lince; enquanto o [Bukovské vrchy pralesový komplex - NP
      Poloniny](/lugar/bukovske-vrchy-pralesovy-komplex-np-poloniny/) e a [Prašuma Perućica - Nacionalni park
      Sutjeska](/lugar/prasuma-perucica---nacionalni-park-sutjeska/) acolhem faia, lince e lobo.
