resumen:
  es: >-
    El segundo bosque más grande de Podlaquia, refugio de una manada libre de bisontes europeos de origen
    espontáneo.
  en: >-
    The second-largest primeval forest complex in Podlasie, shelter to a wild free-ranging herd of European
    bison.
  fr: >-
    Le deuxième plus vaste massif forestier de Podlachie, refuge d'une harde libre de bisons d'Europe
    d'origine spontanée.
  de: Der zweitgrößte Urwaldkomplex Podlachiens, Zuflucht einer freilebenden Herde von Wisenten.
  it: >-
    Il secondo complesso forestale della Podlachia, rifugio di un branco libero di bisonti europei di origine
    spontanea.
  pt: >-
    O segundo maior complexo florestal da Podláquia, refúgio de uma manada livre de bisontes-europeus de
    origem espontânea.
unico:
  es: >-
    Un bosque de aire boreal, cercano a la taiga meridional, con unas cuatrocientas cincuenta surgencias y
    bisontes, lobos y linces.
  en: >-
    A forest of distinctly boreal character close to the southern taiga, with some four hundred and fifty
    natural springs, bison, wolves and lynx.
  fr: >-
    Une forêt d'ambiance boréale proche de la taïga méridionale, abritant quelque quatre cent cinquante
    résurgences, bisons, loups et lynx.
  de: >-
    Ein borealer Urwald nahe der südlichen Taiga, mit rund vierhundertfünfzig Quellen sowie Wisenten, Wölfen
    und Luchsen.
  it: >-
    Una foresta dal respiro boreale vicina alla taiga meridionale, con circa quattrocentocinquanta risorgive e
    bisonti, lupi e linci.
  pt: >-
    Uma floresta de feição boreal próxima da taiga meridional, acolhendo cerca de quatrocentas e cinquenta
    nascentes, bisontes, lobos e linces.
observaciones:
  es: >-
    Mejor de mayo a octubre. En las reservas no se puede circular a pie, en bici, esquiando ni a caballo salvo
    por los senderos y caminos destinados a ello. Está prohibido acampar fuera de los lugares designados y
    espantar o perseguir animales salvajes.
texto:
  es:
    intro: >-
      Mientras la vecina Puszcza Białowieska se llevaba todos los focos, la Puszcza Knyszyńska pasó décadas a
      un lado del interés de los naturalistas. La primera reserva, Budzisk, no se creó hasta 1970 y tenía
      apenas unas decenas de hectáreas; la segunda, Karczmisko, llegó dos años después. Eso cambió en 1988,
      cuando se creó el Parque Paisajístico de la Puszcza Knyszyńska, que al nacer recibió el nombre del
      profesor Witold Sławiński y era el mayor parque paisajístico del país. Hoy ocupa 74.447 hectáreas con
      terrenos de siete distritos forestales y tiene su sede en Supraśl.
    landscape: >-
      Aquí el hielo hizo de escultor. El relieve lo modeló la glaciación del centro de Polonia, con un mosaico
      de morrenas frontales, kames, eskers, depresiones de fusión y sandurs. Por el centro del parque corre,
      por un valle ancho, el río Supraśl.


      Pero lo que define el lugar es el agua que sale de la tierra. La administración forestal cuenta unas
      cuatrocientas cincuenta surgencias de agua subterránea, en forma de fuentes y manantiales difusos, que
      alimentan arroyos del bosque y grandes humedales muy naturales. Las muchas turberas y el predominio de
      coníferas dan al bosque un carácter boreal propio. En él dominan los pinares y los bosques de pino y
      pícea, un bosque monumental cercano a la taiga meridional, con árboles viejos y enormes que en algunos
      rodales llegan a los ciento setenta años, y el ecotipo local de pino de Supraśl. En el norte y el sur
      hay robledales-carpinares, y a lo largo de ríos y arroyos fresnedas-alisedas y alisedas.
    wildlife: >-
      El inventario forestal anota 844 plantas vasculares, 198 musgos y 280 líquenes. En los humedales viven
      plantas poco comunes: el helecho Matteuccia struthiopteris, reliquias boreales como Betula humilis y
      Salix lapponum, la drosera Drosera rotundifolia y orquídeas como Hammarbya paludosa, Dactylorhiza
      maculata y Corallorhiza trifida.


      El bosque es refugio de aves de importancia más que local y alberga [lince](/especie/lynx_lynx/),
      [lobo](/especie/canis_lupus/), [bisonte](/especie/bison_bonasus/) y la koszatka. En el parque viven 153
      especies de aves y cinco de reptiles. Hay [cigüeña negra](/especie/ciconia_nigra/), [halcón
      abejero](/especie/pernis_apivorus/), culebrera europea y águila calzada; grévol, [gallo
      lira](/especie/tetrao_tetrix/), [grulla](/especie/grus_grus/), [búho real](/especie/bubo_bubo/) y
      [mochuelo chico](/especie/glaucidium_passerinum/); y tres pitos de bosque antiguo: el
      [dorsiblanco](/especie/dendrocopos_leucotos/), el [tridáctilo](/especie/picoides_tridactylus/) y el
      [negro](/especie/dryocopus_martius/). Entre los reptiles figuran la lagartija ágil, la lución, la
      culebra de collar y la víbora Vipera berus.


      Si vas hacia la reserva de Krzemianka, fíjate en las zonas encharcadas que han creado los
      [castores](/especie/castor_fiber/). Y a principios de primavera, en la reserva Jesionowe Góry, el Szlak
      Puszczański atraviesa robledales-carpinares muy bellos, con anémonas y corídalis en flor.
    visit: >-
      La pasarela de madera de Krzemianka es la entrada fácil: cruza el corazón de la reserva, tiene dos
      plataformas panorámicas y paneles educativos, deja ver restos de minas prehistóricas de sílex de hace
      unos 3000 años y está adaptada a personas con discapacidad. Está abierta también en invierno. La reserva
      protege el valle pantanoso del río Krzemianka y numerosos manantiales.


      Budzisk ofrece otra escala: 341 ha, de las que 50,25 tienen protección estricta sin intervención humana
      directa. Allí se pasa de las fuentes junto al arroyo Migówka a juncales, turberas, prados y bosques de
      pino, aliseda, fresneda y robledal-carpinar, por un itinerario habilitado para ir a pie o en bici.


      Para jornadas largas, el parque tiene una red de senderos. El Szlak Borami Dorzecza Supraśli (36,5 km)
      pasa por el lago Komosa, la reserva Krasne, la Galería Forestal de Esculturas, Supraśl y el arboreto de
      Kopna Góra. El Szlak Królowej Bony es el más largo, con 75,5 km, y el Szlak Puszczański mide 30 km y
      casi siempre sigue pistas forestales. El Szlak Tatarski Duży (57 km) enlaza Bohoniki y Kruszyniany y
      permite conocer la cultura tártara asentada en la zona. El Szlak Napoleoński recuerda el camino por el
      que en 1812 volvió el ejército de Napoleón tras la fallida campaña de Moscú.
    history: >-
      El parque se creó por resolución del consejo provincial el 24 de mayo de 1988. Tiene 19 reservas
      naturales en su interior y 2 en la zona de amortiguación. En Budzisk hubo un campamento de insurgentes
      de 1863, y en el paraje Krzyże una galería forestal de esculturas dedicada a ellos y un roble
      pedunculado de 250 años. En cuanto a la cultura, esas tierras, la antigua economía de Grodno, se
      entregaron a los tártaros en 1679.
    before: >-
      Mejor de mayo a octubre. En las reservas no se puede circular a pie, en bici, esquiando ni a caballo
      salvo por los senderos y caminos destinados a ello. Está prohibido acampar fuera de los lugares
      designados y espantar o perseguir animales salvajes.
    around: >-
      A dieciocho kilómetros está el [Parque Nacional de Narew](/lugar/narwianski-park-narodowy/) y a
      veinticinco el [Parque Nacional de Biebrza](/lugar/biebrzanski-park-narodowy/). Más lejos, comparten
      bisonte, lince y lobo en bosque maduro el [Bosque de
      Borecka](/lugar/puszcza-borecka---obszar-natura-2000/) y el [Parque Nacional de
      Bieszczady](/lugar/bieszczadzki-park-narodowy---kompleks-lesny/).
  en:
    intro: >-
      While the neighboring Białowieża Forest captured worldwide attention, the Knyszyn Forest spent decades
      in the shadow of naturalists' notice. Its first nature reserve, Budzisk, was established only in 1970
      and spanned barely a few dozen hectares; the second, Karczmisko, followed two years later. That changed
      in 1988 with the founding of the Knyszyn Forest Landscape Park, initially dedicated to Professor Witold
      Sławiński, which became the largest landscape park in Poland. Today it covers 74,447 hectares across
      seven forestry districts, with headquarters in the historic town of Supraśl.
    landscape: >-
      Here ice acted as the master sculptor. The terrain was shaped during the Central Polish glaciation,
      leaving a mosaic of terminal moraines, kames, eskers, kettle holes, and glacial outwash plains. Through
      the heart of the park flows the Supraśl River along a broad, serene valley.


      Yet what truly defines this landscape is groundwater. Forestry managers count about four hundred and
      fifty springs and diffuse seepages feeding forest streams and extensive natural peatlands. Numerous peat
      bogs and the dominance of conifers impart a pronounced boreal aura. Scots pine and mixed pine-spruce
      woods dominate, forming monumental stands reminiscent of the southern taiga, with ancient trees reaching
      up to one hundred and seventy years in mature parcels, including the renowned Supraśl pine ecotype.
      Oak-hornbeam woods grow in the north and south, while ash-alder carr and riverine woodlands fringe the
      waterways.
    wildlife: >-
      Forest floristic surveys record 844 vascular plants, 198 moss species, and 280 lichens. The wetlands
      nurture botanical rarities: the ostrich fern (*Matteuccia struthiopteris*), boreal relicts such as
      *Betula humilis* and *Salix lapponum*, round-leaved sundew (*Drosera rotundifolia*), and delicate
      orchids including bog orchid (*Hammarbya paludosa*), heath spotted orchid (*Dactylorhiza maculata*), and
      coralroot (*Corallorhiza trifida*).


      The forest serves as a vital wildlife stronghold, sheltering the [Eurasian lynx](/especie/lynx_lynx/),
      [grey wolf](/especie/canis_lupus/), [European bison](/especie/bison_bonasus/), and the northern birch
      mouse. The park hosts 153 species of birds and five reptile species. Avian highlights include the [black
      stork](/especie/ciconia_nigra/), [European honey buzzard](/especie/pernis_apivorus/), short-toed snake
      eagle, and booted eagle; hazel grouse, [black grouse](/especie/tetrao_tetrix/), [common
      crane](/especie/grus_grus/), [Eurasian eagle-owl](/especie/bubo_bubo/), and [Eurasian pygmy
      owl](/especie/glaucidium_passerinum/); alongside three old-growth woodpeckers: the [white-backed
      woodpecker](/especie/dendrocopos_leucotos/), [three-toed woodpecker](/especie/picoides_tridactylus/),
      and [black woodpecker](/especie/dryocopus_martius/). Reptiles include sand lizard, slow worm, grass
      snake, and European adder.


      Heading toward the Krzemianka reserve, note the flooded wetlands engineered by [Eurasian
      beavers](/especie/castor_fiber/). In early spring within the Jesionowe Góry reserve, the Szlak
      Puszczański trail crosses splendid oak-hornbeam woods carpeted with blooming wood anemones and
      corydalis.
    visit: >-
      The raised timber boardwalk at Krzemianka provides an accessible gateway: crossing the heart of the
      reserve, it features two viewing platforms and educational panels, displays traces of prehistoric
      flint-mining pits from some 3000 years ago, and is wheelchair accessible. It remains open through the
      winter. The reserve protects the marshy valley of the Krzemianka stream and its copious springs.


      Budzisk provides immersion on a larger scale: 341 ha, of which 50.25 ha are under strict protection free
      of direct human management. The trail leads from springs along the Migówka stream through sedge fens,
      peat mosses, wet meadows, and pine, alder, ash, and oak-hornbeam woods, accessible on foot or by
      bicycle.


      For longer expeditions, the park maintains an extensive trail system. The Szlak Borami Dorzecza Supraśli
      (36.5 km) connects Lake Komosa, Krasne reserve, the Forest Sculpture Gallery, Supraśl, and the Kopna
      Góra arboretum. The Szlak Królowej Bony is the longest at 75.5 km, while the Szlak Puszczański spans 30
      km mostly along forest tracks. The Szlak Tatarski Duży (57 km) connects Bohoniki and Kruszyniany,
      exploring the regional Lipka Tatar cultural heritage. The Szlak Napoleoński follows the historic retreat
      route of Napoleon's Grande Armée in 1812 after the failed Moscow campaign.
    history: >-
      The landscape park was officially established by resolution of the provincial council on 24 May 1988. It
      encompasses 19 internal nature reserves and 2 in its surrounding buffer zone. At Budzisk stood a secret
      insurgent encampment during the 1863 January Uprising; nearby at the Krzyże site stands a forest
      sculpture gallery honouring the rebels, beside a pedunculate oak aged 250 years. Culturally, these
      former crown lands of the Grodno economy were granted to Lipka Tatar settlers in 1679.
    before: >-
      The best visiting window is from May to October. In nature reserves, travel on foot, bicycle, skis, or
      horseback is permitted exclusively on designated trails and roadways. Camping outside authorized sites
      and disturbing or harassing wild fauna are strictly prohibited.
    around: >-
      Eighteen kilometres away lies [Narew National Park](/lugar/narwianski-park-narodowy/), and twenty-five
      kilometres away is [Biebrza National Park](/lugar/biebrzanski-park-narodowy/). Further afield, European
      bison, lynx and wolf in mature wilderness are shared with the [Borecka
      Forest](/lugar/puszcza-borecka---obszar-natura-2000/) and [Bieszczady National
      Park](/lugar/bieszczadzki-park-narodowy---kompleks-lesny/).
  fr:
    intro: >-
      Tandis que la forêt voisine de Białowieża attirait toute l'attention, la Puszcza Knyszyńska resta des
      décennies en marge des naturalistes. La première réserve, Budzisk, ne vit le jour qu'en 1970 sur
      quelques dizaines d'hectares ; la seconde, Karczmisko, fut créée deux ans plus tard. Tout changea en
      1988 lors de la fondation du parc paysager de la forêt de Knyszyn, dédié au professeur Witold Sławiński,
      alors le plus étendu de Pologne. Il couvre aujourd'hui 74 447 hectares répartis sur sept districts
      forestiers, avec son siège à Supraśl.
    landscape: >-
      Ici, la glace a sculpté le relief. Le paysage fut modelé lors de la glaciation de la Pologne centrale,
      créant une mosaïque de moraines frontales, kames, eskers, dépressions de fonte et sandurs. La rivière
      Supraśl s'écoule en son centre le long d'une large vallée sereine.


      Mais la véritable marque du massif réside dans ses eaux souterraines. Les forestiers recensent environ
      quatre cent cinquante sources et suintements qui alimentent d'innombrables ruisseaux et de vastes
      tourbières naturelles. L'abondance de tourbières et la prédominance des conifères confèrent à la forêt
      un caractère boréal prononcé. Les pinèdes et pessières dominent, composant une futaie monumentale proche
      de la taïga méridionale, avec de très vieux arbres atteignant cent soixante-dix ans dans certains
      peuplements, notamment l'écotype renommé du pin de Supraśl. Chênaies-charmaies s'étendent au nord et au
      sud, tandis que frênaies-aulnaies bordent rivières et ruisseaux.
    wildlife: >-
      Les inventaires forestiers répertorient 844 plantes vasculaires, 198 mousses et 280 lichens. Les zones
      humides abritent des raretés : la fougère plume d'autruche (*Matteuccia struthiopteris*), des reliques
      boréales comme *Betula humilis* et *Salix lapponum*, la droséra à feuilles rondes (*Drosera
      rotundifolia*) et des orchidées menacées comme *Hammarbya paludosa*, *Dactylorhiza maculata* et
      *Corallorhiza trifida*.


      Le massif forestier forme un sanctuaire faunique majeur, abritant [lynx boréal](/especie/lynx_lynx/),
      [loup gris](/especie/canis_lupus/), [bison d'Europe](/especie/bison_bonasus/) et la siciste des
      bouleaux. Le parc recense 153 espèces d'oiseaux et cinq de reptiles. On y observe la [cigogne
      noire](/especie/ciconia_nigra/), la [bondrée apivore](/especie/pernis_apivorus/), le circaète
      Jean-le-Blanc et l'aigle botté ; la gélinotte des bois, le [tétras lyre](/especie/tetrao_tetrix/), la
      [grue cendrée](/especie/grus_grus/), le [grand-duc d'Europe](/especie/bubo_bubo/) et la [chevêchette
      d'Europe](/especie/glaucidium_passerinum/) ; ainsi que trois pics typiques des vieilles forêts : le [pic
      à dos blanc](/especie/dendrocopos_leucotos/), le [pic tridactyle](/especie/picoides_tridactylus/) et le
      [pic noir](/especie/dryocopus_martius/). Les reptiles comptent lézard agile, orvet, couleuvre à collier
      et vipère péliade.


      Vers la réserve de Krzemianka, remarquez les zones inondées façonnées par les [castors
      d'Eurasie](/especie/castor_fiber/). Au début du printemps dans la réserve de Jesionowe Góry, le sentier
      Szlak Puszczański sillonne de splendides chênaies-charmaies tapissées d'anémones et de corydales en
      fleur.
    visit: >-
      La passerelle en bois de Krzemianka constitue une porte d'accès facile : traversant le cœur de la
      réserve, elle compte deux plates-formes panoramiques et des panneaux d'interprétation, permet d'observer
      d'anciennes fosses d'extraction de silex préhistoriques datant d'environ 3000 ans et est accessible aux
      personnes à mobilité réduite. Elle reste ouverte l'hiver. La réserve protège la vallée marécageuse de la
      Krzemianka et ses sources jaillissantes.


      Budzisk propose une immersion à une autre échelle : 341 ha, dont 50,25 ha sous protection intégrale sans
      intervention humaine directe. On y chemine des sources du ruisseau Migówka aux cariçaies, tourbières,
      prairies humides et forêts d'aulnes, frênes et chênes, à pied ou à vélo.


      Pour les longues randonnées, le parc compte un vaste réseau balisé. Le Szlak Borami Dorzecza Supraśli
      (36,5 km) relie le lac Komosa, la réserve Krasne, la Galerie forestière de sculptures, Supraśl et
      l'arboretum de Kopna Góra. Le Szlak Królowej Bony est le plus long avec 75,5 km, tandis que le Szlak
      Puszczański mesure 30 km principalement sur pistes forestières. Le Szlak Tatarski Duży (57 km) relie
      Bohoniki et Kruszyniany à la découverte des traditions des Tatars de Podlachie. Le Szlak Napoleoński
      rappelle l'itinéraire de repli emprunté en 1812 par l'armée napoléonienne après la campagne de Russie.
    history: >-
      Le parc a été créé par arrêté du conseil provincial le 24 mai 1988. Il compte 19 réserves naturelles en
      son sein et 2 dans sa zone périphérique de protection. À Budzisk s'établit un campement d'insurgés lors
      du soulèvement de 1863, et au lieu-dit Krzyże une galerie forestière de sculptures leur rend hommage
      près d'un chêne pédonculé âgé de 250 ans. Sur le plan culturel, ces anciennes terres du domaine royal de
      Grodno furent concédées aux Tatars en 1679.
    before: >-
      Période conseillée de mai à octobre. Dans les réserves naturelles, il est interdit de circuler à pied, à
      vélo, à ski ou à cheval en dehors des pistes et sentiers balisés. Le bivouac hors des zones désignées et
      le dérangement de la faune sont strictement interdits.
    around: >-
      À dix-huit kilomètres se trouve le [parc national de la Narew](/lugar/narwianski-park-narodowy/) et à
      vingt-cinq le [parc national de la Biebrza](/lugar/biebrzanski-park-narodowy/). Plus loin, bisons, lynx
      et loups en forêt mature peuplent également la [forêt de
      Borecka](/lugar/puszcza-borecka---obszar-natura-2000/) et le [parc national de
      Bieszczady](/lugar/bieszczadzki-park-narodowy---kompleks-lesny/).
  de:
    intro: >-
      Während der benachbarte Białowieża-Urwald die weltweite Aufmerksamkeit auf sich zog, blieb die Puszcza
      Knyszyńska jahrzehntelang im Schatten des Interesses der Naturforscher. Das erste Reservat, Budzisk,
      entstand erst 1970 auf wenigen Dutzend Hektar; das zweite, Karczmisko, folgte zwei Jahre später. Das
      wendete sich 1988 mit der Gründung des Landschaftsparks Puszcza Knyszyńska, der anfangs nach Professor
      Witold Sławiński benannt wurde und damals der größte Landschaftspark des Landes war. Heute umfasst er
      74.447 Hektar auf dem Gebiet von sieben Forstbezirken mit Verwaltungssitz in Supraśl.
    landscape: >-
      Hier gestaltete das Eis das Relief. Die Landschaft wurde während der Mittelpolnischen Vergletscherung
      geformt und hinterließ ein Mosaik aus Endmoränen, Kames, Osern, Söllen und Sanderflächen. Durch das
      Zentrum des Parks windet sich der Supraśl-Fluss in einem breiten, naturnahen Tal.


      Das eigentliche Kennzeichen des Gebietes ist jedoch das aus dem Boden quellende Wasser. Die
      Forstverwaltung zählt rund vierhundertfünfzig Grundwasseraustritte und Sickerquellen, die Waldbäche und
      ausgedehnte natürliche Moore speisen. Zahlreiche Torfmoore und die Vorherrschaft der Nadelhölzer
      verleihen dem Wald ein ausgeprägt boreales Gepräge. Es dominieren Kiefernwälder sowie
      Kiefern-Fichten-Mischwälder, ein urwüchsiger Wald nah der südlichen Taiga mit uralten Bäumen, die in
      manchen Beständen bis zu einhundertsiebzig Jahre alt werden, darunter der renommierte
      Supraśl-Kiefernökotyp. Im Norden und Süden gedeihen Eichen-Hainbuchenwälder, an Flüssen und Bächen
      Eschen-Erlenauen.
    wildlife: >-
      Das forstliche Arteninventar verzeichnet 844 Gefäßpflanzen, 198 Moose und 280 Flechten. In den
      Feuchtgebieten wachsen floristische Raritäten: der Straußenfarn (*Matteuccia struthiopteris*), boreale
      Eiszeitrelikte wie *Betula humilis* und *Salix lapponum*, der Rundblättrige Sonnentau (*Drosera
      rotundifolia*) sowie seltene Orchideen wie *Hammarbya paludosa*, *Dactylorhiza maculata* und
      *Corallorhiza trifida*.


      Der Wald bietet überregional bedeutsamen Tierarten Zuflucht und beherbergt [Luchs](/especie/lynx_lynx/),
      [Wolf](/especie/canis_lupus/), [Wisent](/especie/bison_bonasus/) und die Birkenmaus. Im Park leben 153
      Vogelarten und fünf Reptilienarten. Es finden sich [Schwarzstorch](/especie/ciconia_nigra/),
      [Wespenbussard](/especie/pernis_apivorus/), Schlangenadler und Zwergadler; Haselhuhn,
      [Birkhuhn](/especie/tetrao_tetrix/), [Kranich](/especie/grus_grus/), [Uhu](/especie/bubo_bubo/) und
      [Sperlingskauz](/especie/glaucidium_passerinum/); sowie drei Altholzspechte:
      [Weißrückenspecht](/especie/dendrocopos_leucotos/), [Dreizehenspecht](/especie/picoides_tridactylus/)
      und [Schwarzspecht](/especie/dryocopus_martius/). Unter den Reptilien leben Zauneidechse,
      Blindschleiche, Ringelnatter und Kreuzotter.


      Auf dem Weg zum Reservat Krzemianka fallen die ausgedehnten, von [Bibern](/especie/castor_fiber/)
      aufgestauten Feuchtflächen auf. Im Vorfrühling führt der Pfad Szlak Puszczański im Reservat Jesionowe
      Góry durch blütenreiche Eichen-Hainbuchenwälder mit Buschwindröschen und Lerchensporn.
    visit: >-
      Der hölzerne Bohlensteg von Krzemianka bietet den bequemsten Zugang: Er durchquert das Herz des
      Reservats, besitzt zwei Aussichtsplattformen und Schautafeln, erschließt prähistorische Feuersteingruben
      von vor rund 3000 Jahren und ist barrierefrei angelegt. Er steht auch im Winter offen. Das Reservat
      schützt das anmoorig-feuchte Tal des Krzemianka-Baches und seine artesischen Quellaustritte.


      Budzisk eröffnet eine andere Dimension: 341 ha, davon 50,25 ha unter Totalreservatsschutz ohne
      menschliche Eingriffe. Dort gelangt man von den Quellen an der Migówka über Seggenriede, Torfmoore,
      Feuchtwiesen zu Kiefern-, Erlen-, Eschen- und Eichenmischwäldern zu Fuß oder per Rad.


      Für Tagestouren hält der Park ein markiertes Wegenetz bereit. Der Weg Szlak Borami Dorzecza Supraśli
      (36,5 km) führt vorbei am Komosa-See, dem Reservat Krasne, der Waldskulpturengalerie, Supraśl und dem
      Arboretum von Kopna Góra. Der Szlak Królowej Bony ist mit 75,5 km der längste, während der Szlak
      Puszczański 30 km misst und meist Forstwegen folgt. Der Szlak Tatarski Duży (57 km) verbindet Bohoniki
      und Kruszyniany und vermittelt Eindrücke der Kultur der Podlachien-Tataren. Der Szlak Napoleoński
      erinnert an den Rückzugsweg der napoleonischen Truppen 1812 nach dem Russlandfeldzug.
    history: >-
      Der Landschaftspark wurde am 24. Mai 1988 durch Beschluss des Woiwodschaftsrates gegründet. Er umfasst
      19 Naturschutzreservate im Kerngebiet und 2 in der Pufferzone. In Budzisk lag 1863 ein geheimer
      Stützpunkt der Aufständischen; im Forstort Krzyże ehrt sie eine Freiluftskulpturengalerie bei einer 250
      Jahre alten Stieleiche. Kulturell wurden diese Ländereien der ehemaligen Grodno-Ökonomie 1679 den
      Tataren übertragen.
    before: >-
      Beste Besuchszeit von Mai bis Oktober. In den Naturschutzgebieten ist das Wandern, Radfahren, Skilaufen
      und Reiten ausschließlich auf den dafür ausgewiesenen Pfaden gestattet. Das Zelten außerhalb bestimmter
      Plätze sowie die Beunruhigung von Wildtieren sind streng untersagt.
    around: >-
      Achtzehn Kilometer entfernt liegt der [Nationalpark Narew](/lugar/narwianski-park-narodowy/) und
      fünfundzwanzig Kilometer entfernt der [Biebrza-Nationalpark](/lugar/biebrzanski-park-narodowy/). Weiter
      entfernt teilen Wisent, Luchs und Wolf in urigen Altbeständen die
      [Borecka-Heide](/lugar/puszcza-borecka---obszar-natura-2000/) und der
      [Bieszczady-Nationalpark](/lugar/bieszczadzki-park-narodowy---kompleks-lesny/).
  it:
    intro: >-
      Mentre la vicina foresta di Białowieża attirava tutti gli sguardi, la Puszcza Knyszyńska rimase per
      decenni ai margini dell'interesse dei naturalisti. La prima riserva, Budzisk, vide la luce solo nel 1970
      su poche decine di ettari; la seconda, Karczmisko, fu istituita due anni più tardi. La svolta giunse nel
      1988 con l'istituzione del Parco paesaggistico della Puszcza Knyszyńska, intitolato al professor Witold
      Sławiński, all'epoca il più vasto parco paesaggistico polacco. Oggi si estende su 74.447 ettari
      distribuiti su sette distretti forestali, con sede amministrativa a Supraśl.
    landscape: >-
      Qui il ghiaccio ha operato come un grande scultore. Il territorio è stato modellato durante la
      glaciazione della Polonia centrale, generando un mosaico di morene frontali, kame, esker, conche di
      fusione e sandur. Lungo il cuore del parco scorre il fiume Supraśl in un'ampia valle serena.


      Ma a definire i luoghi è soprattutto l'acqua sorgiva. L'amministrazione forestale censisce circa
      quattrocentocinquanta scaturigini freatiche e risorgive diffuse che alimentano rivoli boschivi e grandi
      zone umide naturali. Le numerose torbiere e il predominio delle conifere imprimono alla foresta una
      netta impronta boreale. Prevalgono pinete e boschi misti di pino e abete rosso, una foresta monumentale
      affine alla taiga meridionale con patriarchi che in alcuni popolamenti toccano i centosettant'anni,
      incluso il rinomato ecotipo di pino di Supraśl. A nord e a sud allignano querco-carpineti, mentre lungo
      le sponde fluviali si allungano ontanete e frassineti.
    wildlife: >-
      Il censimento botanico conta 844 piante vascolari, 198 muschi e 280 licheni. Nelle zone acquitrinose
      dimorano rarità: la felce penna di struzzo (*Matteuccia struthiopteris*), relitti boreali quali *Betula
      humilis* e *Salix lapponum*, la drosera a foglie rotonde (*Drosera rotundifolia*) e orchidee rare come
      *Hammarbya paludosa*, *Dactylorhiza maculata* e *Corallorhiza trifida*.


      La foresta rappresenta un rifugio faunistico insostituibile, ospitando la [lince
      eurasiatica](/especie/lynx_lynx/), il [lupo grigio](/especie/canis_lupus/), il [bisonte
      europeo](/especie/bison_bonasus/) e il topo delle betulle. Nel parco convivono 153 specie di uccelli e
      cinque di rettili. Si contano la [cicogna nera](/especie/ciconia_nigra/), il [falco
      pecchiaiolo](/especie/pernis_apivorus/), il biancone e l'aquila minore; il francolino di monte, il
      [fagiano di monte](/especie/tetrao_tetrix/), la [gru cenerina](/especie/grus_grus/), il [gufo
      reale](/especie/bubo_bubo/) e il [civettino nano](/especie/glaucidium_passerinum/); insieme a tre picchi
      tipici dei boschi vetusti: il [picchio dorsobianco](/especie/dendrocopos_leucotos/), il [picchio
      tridattilo](/especie/picoides_tridactylus/) e il [picchio nero](/especie/dryocopus_martius/). Tra i
      rettili compaiono lucertola agile, orbettino, biscia dal collare e marasso.


      Avvicinandosi alla riserva di Krzemianka colpiscono gli allagamenti modellati dai
      [castori](/especie/castor_fiber/). All'inizio della primavera, nella riserva Jesionowe Góry, il sentiero
      Szlak Puszczański solca incantevoli querco-carpineti punteggiati da fioriture di anemoni e corydalis.
    visit: >-
      La passerella in legno di Krzemianka costituisce il varco d'accesso più agevole: attraversa il centro
      della riserva, offre due piattaforme panoramiche e pannelli didattici, permette di osservare resti di
      miniere preistoriche di selce risalenti a circa 3000 anni fa ed è accessibile a persone con disabilità
      motoria. È agibile anche nella stagione invernale. La riserva tutela il fondovalle palustre del torrente
      Krzemianka e le sue copiose scaturigini.


      Budzisk propone un'esplorazione su vasta scala: 341 ha, di cui 50,25 a tutela integrale senza interventi
      antropici diretti. Dai fontanili lungo il ruscello Migówka si attraversano canneti, torbiere, prati
      umidi e formazioni di pini, ontani, frassini e querce, a piedi o in bicicletta.


      Per lunghe escursioni il parco dispone di un reticolo sentieristico attrezzato. Lo Szlak Borami Dorzecza
      Supraśli (36,5 km) tocca il lago Komosa, la riserva Krasne, la Galleria forestale di sculture, Supraśl e
      l'arboreto di Kopna Góra. Lo Szlak Królowej Bony è il più esteso con i suoi 75,5 km, mentre lo Szlak
      Puszczański copre 30 km seguendo piste sterrate. Lo Szlak Tatarski Duży (57 km) congiunge Bohoniki e
      Kruszyniany valorizzando l'eredità dei Tatari di Podlachia. Lo Szlak Napoleoński ricalca la via percorsa
      nel 1812 dalle armate napoleoniche durante la ritirata dalla campagna di Russia.
    history: >-
      Il parco è stato istituito con delibera del consiglio provinciale il 24 maggio 1988. Raggruppa 19
      riserve naturali al proprio interno e 2 nella fascia di rispetto circostante. A Budzisk fu allestito un
      rifugio segreto dei patrioti insorti nel 1863; nella località di Krzyże una galleria lignea di sculture
      ne ricorda le gesta accanto a una farnia centenaria di 250 anni. Sul versante storico, queste proprietà
      terriere dell'antica economia di Grodno furono assegnate alla comunità tatara nel 1679.
    before: >-
      Stagione migliore da maggio a ottobre. Nelle riserve naturali è vietato transitare a piedi, in
      bicicletta, con gli sci o a cavallo al di fuori delle piste tracciate. È severamente vietato campeggiare
      fuori dalle aree attrezzate e molestare la fauna selvatica.
    around: >-
      A diciotto chilometri sorge il [Parco nazionale del Narew](/lugar/narwianski-park-narodowy/) e a
      venticinque il [Parco nazionale della Biebrza](/lugar/biebrzanski-park-narodowy/). Più lontano, bisonti,
      linci e lupi in foreste mature sono condivisi con la [Foresta di
      Borecka](/lugar/puszcza-borecka---obszar-natura-2000/) e il [Parco nazionale di
      Bieszczady](/lugar/bieszczadzki-park-narodowy---kompleks-lesny/).
  pt:
    intro: >-
      Enquanto a floresta vizinha de Białowieża concentrava as atenções mundiais, a Puszcza Knyszyńska
      permaneceu décadas à margem do interesse dos naturalistas. A primeira reserva, Budzisk, só foi criada em
      1970 com escassas dezenas de hectares; a segunda, Karczmisko, surgiu dois anos depois. O cenário
      transformou-se em 1988 com a criação do Parque Paisagístico da Puszcza Knyszyńska, dedicado inicialmente
      ao professor Witold Sławiński e à data o maior parque paisagístico da Polónia. Hoje estende-se por
      74.447 hectares abrangendo sete distritos florestais, com sede administrativa em Supraśl.
    landscape: >-
      Aqui o gelo atuou como grande modelador. O relevo formou-se durante a glaciação da Polónia Central,
      criando um mosaico de moreias terminais, kames, eskers, covas de degelo e planícies aluviais de sandur.
      Pelo centro do parque corre o rio Supraśl através de um vale largo e sereno.


      Contudo, o elemento definidor é a abundância de águas subterrâneas. A administração florestal regista
      cerca de quatrocentas e cinquenta nascentes e exsurgências difusas que alimentam regatos florestais e
      extensas turfeiras naturais. A profusão de turfeiras e a predominância de coníferas conferem à mata um
      vincado cunho boreal. Predominam os pinhais e as matas mistas de pinheiro e espruce, um arvoredo
      monumental afim da taiga meridional, com exemplares vetustos que em certos povoamentos atingem os cento
      e setenta anos, incluindo o prestigiado ecótipo do pinheiro de Supraśl. A norte e a sul ocorrem
      carvalhais-carpinais, surgindo amial-freixiais ripícolas ao longo dos cursos de água.
    wildlife: >-
      O inventário florestal anota 844 espécies de plantas vasculares, 198 musgos e 280 líquenes. Nas zonas
      húmidas habitam raridades botânicas: o feto-pluma-de-avestruz (*Matteuccia struthiopteris*), relíquias
      boreais como *Betula humilis* e *Salix lapponum*, a drósera-de-folhas-redondas (*Drosera rotundifolia*)
      e orquídeas raras como *Hammarbya paludosa*, *Dactylorhiza maculata* e *Corallorhiza trifida*.


      A floresta constitui um refúgio faunístico de relevância excecional, abrigando o
      [lince-euroasiático](/especie/lynx_lynx/), o [lobo-cinzento](/especie/canis_lupus/), o
      [bisonte-europeu](/especie/bison_bonasus/) e o rato-das-bétulas. O parque acolhe 153 espécies de aves e
      cinco de répteis. Destacam-se a [cegonha-preta](/especie/ciconia_nigra/), o
      [búteo-vespeiro](/especie/pernis_apivorus/), a águia-cobreira e a águia-calçada; o galinha-do-mato, o
      [galo-lira](/especie/tetrao_tetrix/), o [grou-comum](/especie/grus_grus/), o
      [bufo-real](/especie/bubo_bubo/) e o [mocho-pigmeu](/especie/glaucidium_passerinum/); juntamente com
      três pica-paus de matas maduras: o [pica-pau-de-dorso-branco](/especie/dendrocopos_leucotos/), o
      [pica-pau-tridáctilo](/especie/picoides_tridactylus/) e o [pica-pau-preto](/especie/dryocopus_martius/).
      Entre os répteis contam-se o lagarto-ágil, o licranço, a cobra-de-água-de-colar e a
      víbora-comum-europeia.


      Em direção à reserva de Krzemianka sobressaem as represas alagadas pelos
      [castores-europeus](/especie/castor_fiber/). No início da primavera, na reserva de Jesionowe Góry, o
      percurso Szlak Puszczański cruza admiráveis carvalhais-carpinais cobertos de anémonas e corídalis em
      flor.
    visit: >-
      O passadiço de madeira de Krzemianka representa o ponto de acesso mais convidativo: atravessa o núcleo
      da reserva, dispõe de duas plataformas panorâmicas e painéis interpretativos, exibe testemunhos de
      fossas pré-históricas de extração de sílex com cerca de 3000 anos e está adaptado a pessoas com
      mobilidade reduzida. Permanece transitável no inverno. A reserva protege o vale paludoso da ribeira
      Krzemianka e as suas copiosas nascentes.


      Budzisk proporciona uma experiência à escala ampla: 341 ha, dos quais 50,25 sob proteção rigorosa sem
      interferência humana direta. Percorrendo o itinerário a pé ou de bicicleta passa-se das nascentes junto
      ao ribeiro Migówka para caniçais, turfeiras, prados húmidos e matas de pinheiro, amieiro, freixo e
      carvalho-alvarinho.


      Para jornadas prolongadas, o parque oferece uma extensa rede de trilhos. O Szlak Borami Dorzecza
      Supraśli (36,5 km) passa pela lagoa Komosa, reserva Krasne, Galeria de Esculturas Florestais, Supraśl e
      arboreto de Kopna Góra. O Szlak Królowej Bony é o mais extenso com 75,5 km, enquanto o Szlak Puszczański
      perfaz 30 km quase sempre por caminhos florestais. O Szlak Tatarski Duży (57 km) une Bohoniki e
      Kruszyniany revelando a herança cultural dos tártaros da Podláquia. O Szlak Napoleoński evoca o
      itinerário percorrido em 1812 pelo exército napoleónico após a campanha de Moscovo.
    history: >-
      O parque foi criado por resolução do conselho provincial a 24 de maio de 1988. Integra 19 reservas
      naturais no seu interior e 2 na zona envolvente de amortecimento. Em Budzisk funcionou um acampamento
      secreto dos revoltosos da insurreição de 1863; no sítio de Krzyże uma galeria florestal de esculturas
      presta-lhes homenagem junto a um carvalho-alvarinho com 250 anos. Culturalmente, estas terras da antiga
      economia de Grodno foram doadas aos tártaros em 1679.
    before: >-
      A melhor época vai de maio a outubro. Nas reservas naturais não é consentida a circulação a pé, de
      bicicleta, de esquis ou a cavalo fora dos percursos sinalizados. É proibido acampar fora dos locais
      designados e perturbar a fauna selvagem.
    around: >-
      A dezoito quilómetros fica o [Parque Nacional de Narew](/lugar/narwianski-park-narodowy/) e a vinte e
      cinco o [Parque Nacional de Biebrza](/lugar/biebrzanski-park-narodowy/). Mais longe, partilham bisontes,
      linces e lobos em bosques maduros a [Floresta de Borecka](/lugar/puszcza-borecka---obszar-natura-2000/)
      e o [Parque Nacional de Bieszczady](/lugar/bieszczadzki-park-narodowy---kompleks-lesny/).
