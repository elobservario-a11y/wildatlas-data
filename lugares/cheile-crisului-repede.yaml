resumen:
  es: Cañón calizo meandriforme atravesado por la línea de ferrocarril histórica y salpicado de cavernas.
  en: Meandering limestone canyon crossed by the historic railway line and dotted with caves.
  fr: Canyon calcaire méandreux traversé par une voie ferrée historique et percé de nombreuses grottes.
  de: >-
    Mäandrierende Kalkschlucht, die von einer historischen Bahnstrecke durchquert wird und reich an Höhlen
    ist.
  it: Canyon calcareo meandriforme attraversato da una linea ferroviaria storica e costellato di caverne.
  pt: Canhão calcário meandriforme atravessado pela linha férrea histórica e repleto de cavernas.
unico:
  es: >-
    Un cañón calizo con tren, cascada, cuevas y miradores a pocos pasos de la parada, en la cuna del
    senderismo de Bihor.
  en: >-
    A limestone canyon with a passenger train, waterfall, show caves, and lookouts steps from the halt, in the
    cradle of Bihor hiking.
  fr: >-
    Un défilé calcaire alliant train, cascade, grottes aménagées et belvédères à quelques pas de la halte
    ferroviaire, berceau de la randonnée en Bihor.
  de: >-
    Eine Kalkklamm mit Bahnanschluss, Wasserfall, Schauhöhlen und Aussichtskanzeln direkt am Haltepunkt, in
    der Wiege des Bihor-Wandertourismus.
  it: >-
    Un canyon calcareo con treno, cascata, grotte turistiche e belvederi a pochi passi dalla fermata, culla
    dell'escursionismo di Bihor.
  pt: >-
    Um desfiladeiro calcário com comboio, cascata, grutas turísticas e miradouros a passos do apeadeiro, berço
    do montanhismo em Bihor.
observaciones:
  es: >-
    El circuito de la margen derecha se puede hacer todo el año, salvo con nieve helada. Los senderos están
    marcados con puntos, triángulos y cruces de colores: sigue la marca de tu ruta. La cueva de Vadu Crișului
    es el gran atractivo y está junto a la parada de tren.
texto:
  es:
    intro: >-
      En Cheile Crișului Repede el tren y el senderista comparten pasillo. La vía férrea que une Oradea y
      Cluj-Napoca atraviesa el norte de Pădurea Craiului por Vadu Crișului, Șuncuiuș, Bratca y Bulz, y en la
      parada de Peștera el viajero puede bajarse en mitad del cañón y echar a andar. Muchos de los senderos de
      la garganta nacen justo ahí, junto a la vieja cabaña de la cueva.


      La garganta es la «cuna del turismo de Bihor». Hace más de cien años, guiados por Czaran Gyula, empezó
      aquí el descubrimiento de los montes Pădurea Craiului, y el valle del Crișul Repede, «el Criș rápido»,
      sigue siendo la zona con más densidad de senderos de la sierra. El río atraviesa Oradea y desemboca en
      el Körös en Hungría.
    landscape: >-
      Aquí la piedra manda, y bajo las paredes de caliza hay cuevas de todos los tamaños.


      La cueva de Vadu Crișului se descubrió el 10 de noviembre de 1903 y se abrió a visitas en 1905; fue la
      primera cueva acondicionada para el turismo en Rumanía. Un río subterráneo la cruza y forma, a 40 metros
      de la entrada, una cascada de unos 6 metros. Junto al camino aparece el Tăul Fără Fund, el Lago Sin
      Fondo, que se alimenta de la Cueva del Agua, única fuente permanente de agua potable de la margen
      derecha. La cueva Casa Zmăului tiene un gran portal y, a su izquierda, una antigua atalaya de la aduana
      de la sal medieval. Las cuevas de Podireu son pequeñas cavidades excavadas en la caliza por manantiales;
      la mayor, Podireu II, mide unos 40 metros y se activa con las lluvias. La cueva Roșie tiene un portal de
      16 m de ancho y 4 m de alto en la pared de la margen derecha, buen sitio de refugio o descanso, y un
      desvío lleva a la cueva Fugarilor, pequeña, con una sala espaciosa tras la entrada estrecha.


      Arriba, los miradores. El de Peretele Zânelor ofrece el panorama de la garganta y, al oeste, parte del
      pueblo de Vadu Crișului. Y en la zona está la cascada de Boiului, que se ve desde el circuito de Valea
      Boiului.
    wildlife: >-
      El Crișul Repede es zona de interés para las aves: el área Defileul Crișului Repede–Valea Iadului figura
      como espacio Natura 2000 de la Directiva de Aves. Entre las especies que se citan están el [búho
      real](/especie/bubo_bubo/), el mochuelo boreal, el grévol común, el pico dorsiblanco, el pico mediano,
      el [pito negro](/especie/dryocopus_martius/), el [mochuelo chico](/especie/glaucidium_passerinum/), el
      cárabo uralense, el [guión de codornices](/especie/crex_crex/), el [halcón
      abejero](/especie/pernis_apivorus/), el [águila real](/especie/aquila_chrysaetos/), el [martín
      pescador](/especie/alcedo_atthis/), el alcaudón dorsirrojo, el papamoscas acollarado, el papamoscas
      papirrojo y la alondra totovía.


      Bajo tierra, la cueva de Vadu Crișului tiene una de las faunas cavernícolas más ricas de Rumanía:
      murciélagos, caracoles, gusanos, insectos y crustáceos.
    visit: >-
      Empieza en la cabaña Peștera, junto a la parada del mismo nombre. El circuito de la margen derecha mide
      9 km, tiene 137 metros de desnivel positivo y se hace en unas cuatro horas y media; se marca con punto
      azul. Pasa por la cueva de Vadu Crișului, cuatro cuevas pequeñas, tres miradores y la cascada. Tras
      cruzar el río por un puente de hormigón arqueado, el camino acompaña la vía del tren.


      El sendero de la cabaña de la cueva a Șuncuiuș mide 12 km, es de poca dificultad, apto para familias, y
      se hace en unas cuatro horas; se puede empezar desde la estación de Șuncuiuș para evitar el primer
      tramo. El circuito amarillo de siete kilómetros, fácil, une tres miradores y tres cuevas. Para más
      esfuerzo está el circuito de Valea Boiului, de nueve kilómetros y dificultad media. Un sendero con
      triángulo rojo mide 7 km y se recorre en menos de cuatro horas, y hay dos itinerarios de enlace de 8 km,
      uno con cruz azul y otro con banda azul.


      A la cueva se llega a pie desde Vadu Crișului o desde Șuncuiuș por el sendero marcado con doble punto
      rojo, o en el tren regional Cluj-Napoca-Oradea con parada en Halta Peștera. Hay un centro de información
      y promoción turística en Vadu Crișului.
    history: >-
      El valle tiene memoria de oficio y de historia. En la cueva Casa Zmăului, la atalaya de la aduana de la
      sal recuerda la aduana de la sal que funcionaba aquí en época medieval. Y la propia exploración del
      cañón es una historia: desde Czaran Gyula, hace más de un siglo, se abrieron los senderos que hoy
      recorres.
    before: >-
      El circuito de la margen derecha se puede hacer todo el año, salvo con nieve helada. Los senderos están
      marcados con puntos, triángulos y cruces de colores: sigue la marca de tu ruta. La cueva de Vadu
      Crișului es el gran atractivo y está junto a la parada de tren.
    around: >-
      A doce kilómetros está el [Macizo de Vlădeasa](/lugar/masivul-vladeasa/). Más lejos, el [Bosque Virgen
      de Boubín](/lugar/boubinsky-prales/), el [Parque Nacional de Velebit
      Norte](/lugar/nacionalni-park-sjeverni-velebit/) y el [Parque Paisajístico del Valle del
      Bóbr](/lugar/park-krajobrazowy-doliny-bobru/) comparten con el Crișul Repede aves como el mochuelo
      chico, el mochuelo boreal y el cárabo uralense.
  en:
    intro: >-
      In Cheile Crișului Repede, the passenger train and the hiker share the same corridor. The railway
      connecting Oradea and Cluj-Napoca threads through northern Pădurea Craiului via Vadu Crișului, Șuncuiuș,
      Bratca, and Bulz, and at the Peștera halt travelers can alight right in the middle of the canyon and
      begin walking. Many of the gorge trails start immediately beside the platform, next to the historic cave
      hut.


      The gorge is revered as the «cradle of Bihor tourism». Over a century ago, guided by Czaran Gyula,
      exploration of the Pădurea Craiului mountains began here, and the valley of the Crișul Repede—the «rapid
      Criș»—remains the sector with the highest trail density in the range. Downstream, the river flows
      through Oradea and empties into the Körös in Hungary.
    landscape: >-
      Limestone dominates the landscape, harboring subterranean cavities of every size beneath its cliffs.


      Vadu Crișului Cave was discovered on 10 November 1903, and opened to visitors in 1905, becoming the
      first show cave developed for tourism in Romania. An underground stream courses through it, plunging
      over a 6-meter subterranean waterfall 40 meters from the entrance. Beside the trail lies Tăul Fără Fund,
      the Bottomless Pool, replenished by the Water Cave—the sole permanent potable spring along the right
      bank. Casa Zmăului cave features a colossal entrance portal flanked on its left by an ancient masonry
      watchtower from the medieval salt custom post. The Podireu caves are smaller limestone cavities
      dissolved by springs; the largest, Podireu II, spans 40 meters and reactivates during heavy rains. Roșie
      Cave boasts an entrance 16 m wide and 4 m high carved into the right cliff, serving as a natural shelter
      and resting point, while a spur trail leads to Fugarilor Cave, featuring a narrow squeeze opening into a
      spacious hall.


      Perched atop the cliffs are panoramic viewpoints. The Peretele Zânelor belvedere offers commanding
      vistas over the gorge and, to the west, parts of Vadu Crișului village. In the surrounding hills lies
      Boiului waterfall, accessible via the Valea Boiului circular trail.
    wildlife: >-
      The Crișul Repede defile is of premier ornithological importance: the Defileul Crișului Repede–Valea
      Iadului tract is protected under the EU Birds Directive as a Natura 2000 site. Species recorded here
      include the [Eurasian eagle-owl](/especie/bubo_bubo/), boreal owl, hazel grouse, white-backed
      woodpecker, middle spotted woodpecker, [black woodpecker](/especie/dryocopus_martius/), [Eurasian pygmy
      owl](/especie/glaucidium_passerinum/), Ural owl, [corncrake](/especie/crex_crex/), [European honey
      buzzard](/especie/pernis_apivorus/), [golden eagle](/especie/aquila_chrysaetos/), [common
      kingfisher](/especie/alcedo_atthis/), red-backed shrike, collared flycatcher, red-breasted flycatcher,
      and woodlark.


      Subterranean ecosystems are equally rich: Vadu Crișului Cave shelters one of Romania's most diverse
      troglobitic and cavernicole faunas, spanning bats, cave snails, worms, troglobitic insects, and aquatic
      crustaceans.
    visit: >-
      Start your outing at the Peștera mountain hut beside the train halt of the same name. The right-bank
      circular trail spans 9 km with 137 meters of elevation gain and requires roughly four and a half hours;
      it is marked with blue dots. It passes Vadu Crișului Cave, four smaller caves, three cliff-edge
      viewpoints, and the waterfall. After crossing the river via an arched concrete bridge, the path
      parallels the railway line.


      The trail connecting the cave hut to Șuncuiuș spans 12 km, presents gentle gradients suitable for
      families, and takes about four hours; you can also start directly from Șuncuiuș railway station to
      bypass the initial section. The yellow-marked seven-kilometer circuit is an easy route linking three
      viewpoints and three caves. For a more strenuous excursion, the Valea Boiului loop covers nine
      kilometers with moderate difficulty. A red-triangle trail measures 7 km and is completed in under four
      hours, complemented by two 8 km connecting routes marked with a blue cross and blue stripe respectively.


      The show cave can be reached on foot from Vadu Crișului or Șuncuiuș via the double red dot trail, or by
      boarding the regional Cluj-Napoca–Oradea train stopping at Halta Peștera. A tourist information center
      operates in Vadu Crișului.
    history: >-
      The defile preserves memories of ancient trades and border defense. At Casa Zmăului cave, the stone
      watchtower recalls the medieval salt tax station that controlled cargo rafts floating down the Crișul
      Repede. Czaran Gyula, an impassioned pioneer of Transylvanian mountaineering, opened the gorge to hikers
      in the early twentieth century by laying out paths, naming rock formations, and popularizing its cave
      systems.
    before: >-
      The right-bank circuit can be completed year-round, except during periods of frozen snow or sheet ice.
      Trails are marked with colored dots, triangles, and crosses: follow your designated route marker
      closely. Vadu Crișului Cave is the premier highlight and sits directly adjacent to the railway halt.
    around: >-
      Twelve kilometers away stands the [Vlădeasa Massif](/lugar/masivul-vladeasa/). Further afield, [Boubín
      Virgin Forest](/lugar/boubinsky-prales/), [Northern Velebit National
      Park](/lugar/nacionalni-park-sjeverni-velebit/), and [Bóbr Valley Landscape
      Park](/lugar/park-krajobrazowy-doliny-bobru/) share with Crișul Repede bird species like the Eurasian
      pygmy owl, boreal owl, and Ural owl.
  fr:
    intro: >-
      Dans les Cheile Crișului Repede, le train de voyageurs et le randonneur partagent le même défilé. La
      ligne reliant Oradea à Cluj-Napoca traverse le nord des monts Pădurea Craiului par Vadu Crișului,
      Șuncuiuș, Bratca et Bulz, et à la halte de Peștera, le marcheur peut descendre au beau milieu du canyon
      et s'élancer sur les sentiers. Nombre d'itinéraires partent directement du quai, à côté du vieux refuge
      de la grotte.


      La gorge constitue le « berceau du tourisme de Bihor ». Il y a plus d'un siècle, sous l'impulsion de
      Czaran Gyula, débuta ici l'exploration des monts Pădurea Craiului, et la vallée du Crișul Repede (« le
      Criș rapide ») demeure le secteur le plus dense en sentiers pédestres du massif. En aval, la rivière
      traverse Oradea avant de rejoindre le Körös en Hongrie.
    landscape: >-
      Le calcaire règne en maître, dissimulant sous ses escarpements des cavités de toutes dimensions.


      La grotte de Vadu Crișului fut découverte le 10 novembre 1903 et ouverte au public en 1905, devenant la
      première grotte aménagée de Roumanie. Une rivière souterraine la traverse et forme, à 40 mètres de
      l'entrée, une cascade souterraine de 6 mètres. Près du chemin s'étend le Tăul Fără Fund, le Lac sans
      Fond, alimenté par la Grotte de l'Eau — unique source permanente d'eau potable de la rive droite. La
      grotte Casa Zmăului présente un vaste portail flanqué à gauche d'une ancienne tour de guet médiévale
      liée au péage du sel. Les grottes de Podireu sont de petites cavités creusées par des émergences ; la
      plus importante, Podireu II, mesure 40 mètres et s'active lors des fortes pluies. La grotte Roșie offre
      un porche de 16 m de large sur 4 m de haut dans la falaise droite, excellent abri naturel, tandis qu'une
      bifurcation mène à la grotte Fugarilor, dotée d'une entrée étroite débouchant sur une vaste salle.


      En hauteur, les belvédères dévoilent le canyon. Celui de Peretele Zânelor offre un panorama remarquable
      sur la gorge et, à l'ouest, sur le village de Vadu Crișului. Plus en amont, la cascade de Boiului se
      découvre via la boucle de Valea Boiului.
    wildlife: >-
      Le défilé présente une haute valeur ornithologique : le secteur Defileul Crișului Repede–Valea Iadului
      est classé en zone Natura 2000 au titre de la Directive Oiseaux. Parmi les espèces remarquables figurent
      le [grand-duc d'Europe](/especie/bubo_bubo/), la chouette de Tengmalm, la gélinotte des bois, le pic à
      dos blanc, le pic mar, le [pic noir](/especie/dryocopus_martius/), la [chevêchette
      d'Europe](/especie/glaucidium_passerinum/), la chouette de l'Oural, le [râle des
      genêts](/especie/crex_crex/), la [bondrée apivore](/especie/pernis_apivorus/), l'[aigle
      royal](/especie/aquila_chrysaetos/), le [martin-pêcheur d'Europe](/especie/alcedo_atthis/), la
      pie-grièche écorcheur, le gobe-mouche à collier, le gobe-mouche nain et l'alouette lulu.


      Sous terre, la grotte de Vadu Crișului abrite l'une des faunes cavernicoles les plus diversifiées de
      Roumanie : chauves-souris, gastéropodes, vers, insectes et crustacés troglobies.
    visit: >-
      Démarrez depuis le refuge Peștera, tout près de la halte ferroviaire éponyme. La boucle de la rive
      droite fait 9 km avec 137 mètres de dénivelé positif et s'effectue en environ quatre heures et demie ;
      elle est balisée d'un point bleu. Elle dessert la grotte de Vadu Crișului, quatre petites cavités, trois
      belvédères et la cascade. Après avoir franchi la rivière sur un pont d'arche en béton, le sentier côtoie
      la voie ferrée.


      Le parcours reliant le refuge à Șuncuiuș mesure 12 km, présente peu de difficultés, convient aux
      familles et prend quatre heures environ ; vous pouvez partir directement de la gare de Șuncuiuș pour
      éviter le premier tronçon. Le circuit jaune de sept kilomètres, facile, dessert trois belvédères et
      trois grottes. Pour plus d'effort physique, la boucle de Valea Boiului propose neuf kilomètres de
      difficulté moyenne. Un sentier balisé d'un triangle rouge fait 7 km en moins de quatre heures, complété
      par deux liaisons de 8 km balisées d'une croix bleue et d'une bande bleue.


      On accède à la grotte à pied depuis Vadu Crișului ou Șuncuiuș par le sentier double point rouge, ou par
      le train régional Cluj-Napoca–Oradea avec arrêt à Halta Peștera. Un centre d'information touristique est
      implanté à Vadu Crișului.
    history: >-
      La vallée conserve la mémoire des anciens métiers et du transport fluvial. À la grotte Casa Zmăului, la
      tour de garde rappelle l'ancien poste de douane qui taxait les radeaux de sel descendant le Crișul
      Repede. Czaran Gyula, figure pionnière de l'alpinisme transylvain, traça les premiers sentiers au début
      du XXe siècle, baptisant les rochers et aménageant les cavités.
    before: >-
      Le circuit de la rive droite se pratique toute l'année, sauf par neige verglacée. Les sentiers sont
      balisés de points, triangles et croix de couleur : conformez-vous à la marque de votre itinéraire. La
      grotte de Vadu Crișului constitue l'attraction phare et jouxte la halte ferroviaire.
    around: >-
      À douze kilomètres se dresse le [Massif de Vlădeasa](/lugar/masivul-vladeasa/). Plus loin, la [Forêt
      primaire de Boubín](/lugar/boubinsky-prales/), le [Parc national du Velebit du
      Nord](/lugar/nacionalni-park-sjeverni-velebit/) et le [Parc paysager de la vallée du
      Bóbr](/lugar/park-krajobrazowy-doliny-bobru/) partagent avec le défilé des rapaces comme la chevêchette
      d'Europe, la chouette de Tengmalm et la chouette de l'Oural.
  de:
    intro: >-
      In den Cheile Crișului Repede teilen sich Zug und Wanderer dieselbe Schluchtpassage. Die
      Eisenbahnstrecke von Oradea nach Cluj-Napoca quert den Norden des Pădurea-Craiului-Gebirges über Vadu
      Crișului, Șuncuiuș, Bratca und Bulz, und am Haltepunkt Peștera kann man mitten im Canyon aussteigen und
      unmittelbar loswandern. Viele Wanderpfade der Schlucht beginnen genau dort, direkt an der alten
      Höhlenhütte.


      Die Klamm gilt als «Wiege des Bihor-Tourismus». Vor über hundert Jahren begann hier unter der Führung
      von Czaran Gyula die touristische Erschließung des Pădurea-Craiului-Gebirges, und das Tal des Crișul
      Repede («Schnelle Kreisch») ist bis heute das Gebiet mit der höchsten Wanderwegdichte des Höhenzugs.
      Flussabwärts fließt das Gewässer durch Oradea und mündet in Ungarn in die Körös.
    landscape: >-
      Kalkstein prägt das Talbild, und unter den Felswänden verbergen sich Höhlen aller Größenordnungen.


      Die Höhle von Vadu Crișului wurde am 10. November 1903 entdeckt und 1905 für Besucher freigegeben; sie
      war die erste erschlossene Schauhöhle Rumäniens. Ein unterirdischer Fluss durchströmt sie und stürzt 40
      Meter hinter dem Eingang über einen 6 Meter hohen Wasserfall herab. Neben dem Wanderweg liegt der Tăul
      Fără Fund, der Grundlose See, gespeist von der Wasserhöhle, der einzigen ganzjährigen Trinkwasserquelle
      am rechten Flussufer. Die Höhle Casa Zmăului besitzt ein gewaltiges Felsportal, flankiert von einem
      mittelalterlichen steinernen Zollturm. Die Podireu-Höhlen sind kleinere Quellhöhlen; die größte, Podireu
      II, misst 40 Meter und schüttet bei starken Regenfällen Wasser aus. Die Roșie-Höhle weist ein 16 m
      breites und 4 m hohes Portal in der rechten Felswand auf, ein geschätzter Rast- und Unterstandsplatz,
      während ein Pfad zur Fugarilor-Höhle führt, deren enger Einstieg in einen geräumigen Saal mündet.


      Auf den Höhen thronen Aussichtspunkte: Die Kanzel Peretele Zânelor bietet einen Weitblick über die
      Schlucht und nach Westen auf Teile des Dorfes Vadu Crișului. In der Umgebung lockt zudem der
      Boiului-Wasserfall auf dem Rundweg Valea Boiului.
    wildlife: >-
      Das Tal des Crișul Repede besitzt herausragenden Wert für die Vogelwelt: Das Schutzgebiet Defileul
      Crișului Repede–Valea Iadului ist als europäisches Vogelschutzgebiet im Natura-2000-Netz verankert. Zu
      den nachgewiesenen Arten gehören [Uhu](/especie/bubo_bubo/), Raufußkauz, Haselhuhn, Weißrückenspecht,
      Mittelspecht, [Schwarzspecht](/especie/dryocopus_martius/),
      [Sperlingskauz](/especie/glaucidium_passerinum/), Habichtskauz, [Wachtelkönig](/especie/crex_crex/),
      [Wespenbussard](/especie/pernis_apivorus/), [Steinadler](/especie/aquila_chrysaetos/),
      [Eisvogel](/especie/alcedo_atthis/), Neuntöter, Halsbandschnäpper, Zwergschnäpper und Heidelerche.


      Unter Tage birgt die Höhle von Vadu Crișului eine der artenreichsten Höhlenfaunen Rumäniens mit
      Fledermäusen, Schnecken, Würmern, Höhleninsekten und Krebstieren.
    visit: >-
      Starte deine Tour an der Hütte Peștera neben dem gleichnamigen Bahnhalt. Der Rundweg am rechten Ufer
      misst 9 km bei 137 Höhenmetern und erfordert etwa viereinhalb Stunden; er ist mit einem blauen Punkt
      markiert. Er führt zur Höhle von Vadu Crișului, vier kleineren Höhlen, drei Aussichtspunkten und zum
      Wasserfall. Nach Überquerung des Flusses auf einer gewölbten Betonbrücke verläuft der Weg entlang der
      Bahntrasse.


      Der Weg von der Höhlenhütte nach Șuncuiuș ist 12 km lang, weist geringe Steigungen auf, eignet sich
      bestens für Familien und dauert etwa vier Stunden; man kann auch am Bahnhof Șuncuiuș starten. Die gelbe
      Sieben-Kilometer-Runde ist eine leichte Route zu drei Aussichtskanzeln und drei Höhlen. Für mehr
      Kondition empfiehlt sich die Runde Valea Boiului mit neun Kilometern mittlerer Schwierigkeit. Ein Weg
      mit rotem Dreieck umfasst 7 km in unter vier Stunden, ergänzt durch zwei je 8 km lange Verbindungswege
      mit blauem Kreuz bzw. blauem Band.


      Die Schauhöhle ist zu Fuß von Vadu Crișului oder Șuncuiuș über den mit rotem Doppelpunkt markierten Pfad
      oder mit der Regionalbahn Cluj-Napoca–Oradea mit Halt an der Halta Peștera erreichbar. In Vadu Crișului
      steht ein Touristeninformationszentrum bereit.
    history: >-
      Das Tal blickt auf alte Gewerbe und Flussgeschichte zurück. Bei der Höhle Casa Zmăului erinnert die
      steinerne Warte an die mittelalterliche Salzzollstation, an der die Flöße auf dem Crișul Repede
      kontrolliert wurden. Czaran Gyula, Pionier des Karpaten-Wandertourismus, legte zu Beginn des zwanzigsten
      Jahrhunderts die ersten Routen an, benannte Felsnadeln und machte die Höhlensysteme bekannt.
    before: >-
      Der Rundweg am rechten Ufer kann das ganze Jahr über begangen werden, außer bei gefrorenem Schnee und
      Vereisung. Die Pfade sind mit farbigen Punkten, Dreiecken und Kreuzen gekennzeichnet: Folge stets der
      Markierung deiner Route. Die Höhle von Vadu Crișului ist der Hauptanziehungspunkt und liegt direkt am
      Bahnhaltepunkt.
    around: >-
      Zwölf Kilometer entfernt erhebt sich das [Vlădeasa-Massiv](/lugar/masivul-vladeasa/). Weiter entfernt
      teilen der [Urwald Boubín](/lugar/boubinsky-prales/), der [Nationalpark Nördlicher
      Velebit](/lugar/nacionalni-park-sjeverni-velebit/) und der [Landschaftspark
      Bobertal](/lugar/park-krajobrazowy-doliny-bobru/) mit dem Crișul Repede Eulenarten wie Sperlingskauz,
      Raufußkauz und Habichtskauz.
  it:
    intro: >-
      Nelle Cheile Crișului Repede il treno e l'escursionista condividono lo stesso corridoio. La ferrovia che
      unisce Oradea a Cluj-Napoca taglia il nord dei monti Pădurea Craiului attraverso Vadu Crișului,
      Șuncuiuș, Bratca e Bulz, e alla fermata di Peștera chi viaggia può scendere a metà del canyon e iniziare
      a camminare. Molti dei sentieri della gola si dipartono proprio lì, accanto al vecchio rifugio della
      grotta.


      La forra è considerata la «culla del turismo di Bihor». Più di un secolo fa, guidata dall'opera di
      Czaran Gyula, cominciò qui la scoperta dei monti Pădurea Craiului, e la valle del Crișul Repede («il
      Criș rapido») resta la zona con la maggiore concentrazione di sentieri dell'intera catena. Verso valle
      il fiume lambisce Oradea e confluisce nel Körös in Ungheria.
    landscape: >-
      Il calcare domina il paesaggio, celando sotto le pareti dirupate cavità di ogni dimensione.


      La grotta di Vadu Crișului fu scoperta il 10 novembre 1903 e aperta alle visite nel 1905, prima grotta
      attrezzata per il turismo in Romania. Un torrente sotterraneo la percorre e forma, a 40 metri
      dall'ingresso, una cascata ipogea di circa 6 metri. Accanto al cammino compare il Tăul Fără Fund, il
      Lago Senza Fondo, alimentato dalla Grotta dell'Acqua, unica sorgente perenne potabile della riva destra.
      La grotta Casa Zmăului vanta un imponente portale d'accesso, affiancato a sinistra da un'antica torre di
      vedetta medievale della dogana del sale. Le grotte di Podireu sono piccole cavità sorgive; la maggiore,
      Podireu II, si sviluppa per 40 metri e si riattiva durante le piogge. La grotta Roșie presenta un
      vestibolo largo 16 m e alto 4 m nella rupe destra, ideale riparo naturale, mentre una deviazione conduce
      alla grotta Fugarilor, dotata di un passaggio angusto che sfocia in un'ampia sala.


      In quota si aprono i belvederi: quello di Peretele Zânelor regala uno scorcio spettacolare sulla gola e,
      a ovest, verso il borgo di Vadu Crișului. Nell'area circostante si ammira inoltre la cascata di Boiului
      percorrendo l'anello di Valea Boiului.
    wildlife: >-
      Il corso del Crișul Repede riveste un valore ornitologico di primo piano: l'area Defileul Crișului
      Repede–Valea Iadului è istituita come zona di protezione speciale Natura 2000. Tra le specie presenti
      spiccano il [gufo reale](/especie/bubo_bubo/), la civetta capogrosso, il francolino di monte, il picchio
      dorsobianco, il picchio rosso mezzano, il [picchio nero](/especie/dryocopus_martius/), la [civetta
      nana](/especie/glaucidium_passerinum/), l'allocco degli Urali, il [re di quaglie](/especie/crex_crex/),
      il [falco pecchiaiolo](/especie/pernis_apivorus/), l'[aquila reale](/especie/aquila_chrysaetos/), il
      [martin pescatore](/especie/alcedo_atthis/), la averla piccola, il pigliamosche dal collare, il
      pigliamosche pettirosso e la tottavilla.


      Nel sottosuolo, la grotta di Vadu Crișului ospita una fauna cavernicola tra le più variegate della
      Romania: pipistrelli, molluschi, vermi, insetti e crostacei troglobi.
    visit: >-
      Inizia l'escursione dal rifugio Peștera, presso l'omonima fermata ferroviaria. L'anello della riva
      destra misura 9 km con 137 metri di dislivello e si compie in circa quattro ore e mezza; è
      contrassegnato da punti blu. Raggiunge la grotta di Vadu Crișului, quattro cavità minori, tre belvederi
      e la cascata. Dopo aver traversato il fiume su un ponte arcuato in cemento, il sentiero affianca i
      binari.


      Il cammino dal rifugio a Șuncuiuș si sviluppa per 12 km con pendenze lievi, ideali per famiglie, e
      richiede quattro ore; si può anche partire dalla stazione di Șuncuiuș. Il circuito giallo di sette
      chilometri è facile e tocca tre punti panoramici e tre grotte. Per un impegno maggiore c'è l'anello di
      Valea Boiului, di nove chilometri e media difficoltà. Un tracciato a triangolo rosso misura 7 km in meno
      di quattro ore, affiancato da due collegamenti di 8 km marcati rispettivamente con croce blu e fascia
      blu.


      Alla grotta si accede a piedi da Vadu Crișului o Șuncuiuș col sentiero a doppio punto rosso, oppure col
      treno regionale Cluj-Napoca–Oradea scendendo alla Halta Peștera. Un centro visite opera nel borgo di
      Vadu Crișului.
    history: >-
      La valle conserva testimonianze di antichi mestieri e controllo fluviale. Presso la grotta Casa Zmăului,
      la torre di vedetta rammenta la dogana medievale che riscuoteva i dazi sui carichi di sale che
      scendevano lungo il Crișul Repede. Czaran Gyula, pioniere dell'escursionismo carpartico, tracciò qui i
      primi sentieri all'inizio del Novecento, battezzando formazioni rocciose e promuovendo la conoscenza
      delle cavità.
    before: >-
      L'anello della riva destra si può percorrere tutto l'anno, salvo in presenza di neve ghiacciata. I
      sentieri sono segnalati con punti, triangoli e croci colorate: segui attentamente la marcatura della tua
      rotta. La grotta di Vadu Crișului è l'attrazione principale e si trova proprio accanto alla fermata del
      treno.
    around: >-
      A dodici chilometri si erge il [Massiccio di Vlădeasa](/lugar/masivul-vladeasa/). Più distanti, la
      [Foresta Vergine di Boubín](/lugar/boubinsky-prales/), il [Parco Nazionale del Velebit
      Settentrionale](/lugar/nacionalni-park-sjeverni-velebit/) e il [Parco Paesaggistico della Valle del
      Bóbr](/lugar/park-krajobrazowy-doliny-bobru/) condividono con il Crișul Repede rapaci notturni come
      civetta nana, civetta capogrosso e allocco degli Urali.
  pt:
    intro: >-
      Nas Cheile Crișului Repede o comboio e o caminhante partilham o mesmo corredor. A via férrea que liga
      Oradea a Cluj-Napoca atravessa o norte das montanhas Pădurea Craiului por Vadu Crișului, Șuncuiuș,
      Bratca e Bulz, e no apeadeiro de Peștera o viajante pode descer em pleno desfiladeiro e começar a
      caminhar. Muitos dos trilhos da garganta arrancam exatamente ali, junto ao antigo refúgio da caverna.


      A garganta é considerada o «berço do turismo de Bihor». Há mais de cem anos, com o pioneirismo de Czaran
      Gyula, iniciou-se aqui a exploração das serras de Pădurea Craiului, e o vale do Crișul Repede («o Criș
      veloz») continua a ser o setor com maior densidade de percursos pedestres do maciço. A jusante, as águas
      cruzam Oradea e desaguam no Körös, na Hungria.
    landscape: >-
      O calcário molda a paisagem, abrigando sob as escarpas cavidades de todas as dimensões.


      A gruta de Vadu Crișului foi descoberta a 10 de novembro de 1903 e aberta a visitantes em 1905,
      tornando-se a primeira gruta turística estruturada da Roménia. Um curso de água subterrâneo atravessa-a
      e forma, a 40 metros da entrada, uma cascata subterrânea de cerca de 6 metros. Junto ao trilho surge o
      Tăul Fără Fund, o Lago Sem Fundo, abastecido pela Gruta da Água, única nascente perene potável da margem
      direita. A gruta Casa Zmăului ostenta um enorme portal ladeado à esquerda por uma antiga torre de vigia
      medieval da alfândega do sal. As grutas de Podireu são pequenas cavidades nascentes; a maior, Podireu
      II, mede 40 metros e debita água nas chuvadas. A gruta Roșie apresenta um pórtico com 16 m de largura e
      4 m de altura na falésia direita, excelente abrigo natural, enquanto um desvio leva à gruta Fugarilor,
      com uma entrada apertada que se abre numa ampla galeria.


      No topo das escarpas encontram-se miradouros panorâmicos: o de Peretele Zânelor domina o desfiladeiro e
      avista a oeste parte da aldeia de Vadu Crișului. Nas imediações desfruta-se ainda da cascata de Boiului
      pelo trilho circular de Valea Boiului.
    wildlife: >-
      O Crișul Repede constitui uma área de notável interesse ornitológico: o enclave Defileul Crișului
      Repede–Valea Iadului está integrado na rede Natura 2000 como Zona de Proteção Especial. Entre as aves
      registadas figuram o [bufo-real](/especie/bubo_bubo/), o mocho-funéreo, a galinha-do-mato, o
      pica-pau-de-dorso-branco, o pica-pau-médio, o [pica-pau-preto](/especie/dryocopus_martius/), o
      [mocho-pigmeu](/especie/glaucidium_passerinum/), a coruja-dos-urales, o
      [codornizão](/especie/crex_crex/), o [bútio-vespeiro](/especie/pernis_apivorus/), a
      [águia-real](/especie/aquila_chrysaetos/), o [guarda-rios-comum](/especie/alcedo_atthis/), o
      picanço-de-dorso-ruivo, o papa-moscas-de-colar, o papa-moscas-pequeno e a cotovia-arbórea.


      No subsolo, a gruta de Vadu Crișului encerra uma das faunas cavernícolas mais ricas da Roménia:
      morcegos, caracóis, vermes, insetos e crustáceos troglóbios.
    visit: >-
      Começa no refúgio Peștera, ao lado do apeadeiro com o mesmo nome. O circuito da margem direita mede 9 km
      com 137 metros de desnível acumulado e cumpre-se em cerca de quatro horas e meia; está assinalado com
      pontos azuis. Visita a gruta de Vadu Crișului, quatro pequenas cavidades, três miradouros e a cascata.
      Após cruzar o rio numa ponte em arco de betão, o caminho acompanha a linha férrea.


      O percurso do refúgio até Șuncuiuș tem 12 km, baixa exigência física, destina-se a famílias e faz-se em
      cerca de quatro horas; pode iniciar-se na estação de Șuncuiuș para poupar o primeiro troço. O trilho
      amarelo de sete quilómetros é fácil e liga três miradouros a três grutas. Para maior esforço há o
      circuito de Valea Boiului, de nove quilómetros e dificuldade média. Um caminho com triângulo vermelho
      mede 7 km em menos de quatro horas, existindo ainda duas ligações de 8 km assinaladas respetivamente com
      cruz azul e faixa azul.


      Chega-se à gruta a pé a partir de Vadu Crișului ou de Șuncuiuș pelo trilho de duplo ponto vermelho, ou
      apanhando o comboio regional Cluj-Napoca–Oradea descendo na Halta Peștera. Um posto de turismo opera em
      Vadu Crișului.
    history: >-
      O vale retém memórias de velhos ofícios e circulação de mercadorias. Na gruta Casa Zmăului, a torre de
      vigia testemunha o antigo controlo fiscal que taxava as jangadas de sal que desciam o Crișul Repede.
      Czaran Gyula, pioneiro das explorações na Transilvânia, abriu os caminhos no início do século XX,
      batizando relevos e popularizando as grutas.
    before: >-
      O circuito da margem direita pode percorrer-se ao longo de todo o ano, salvo com neve congelada ou gelo.
      Os trilhos estão marcados com pontos, triângulos e cruzes de cores: segue a marcação correspondente à
      tua rota. A gruta de Vadu Crișului é a principal atração e fica imediatamente ao lado do apeadeiro de
      comboio.
    around: >-
      A doze quilómetros ergue-se o [Maciço de Vlădeasa](/lugar/masivul-vladeasa/). Mais distantes, a
      [Floresta Virgem de Boubín](/lugar/boubinsky-prales/), o [Parque Nacional do Velebit do
      Norte](/lugar/nacionalni-park-sjeverni-velebit/) e o [Parque Paisagístico do Vale do
      Bóbr](/lugar/park-krajobrazowy-doliny-bobru/) partilham com o Crișul Repede aves como o mocho-pigmeu, o
      mocho-funéreo e a coruja-dos-urales.
