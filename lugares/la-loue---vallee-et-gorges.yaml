    Resurgencia kárstica espectacular y valle fluvial encajado que inspiró las célebres pinturas de Gustave
    Courbet.
  en: >-
    Spectacular karst resurgence and incised river canyon that inspired the celebrated paintings of Gustave
    Courbet.
  fr: >-
    Spectaculaire résurgence karstique et vallée fluviale encaissée ayant inspiré les chefs-d'œuvre de Gustave
    Courbet.
  de: >-
    Spektakuläre Karstquelle und tief eingeschnittenes Flusstal, das Gustave Courbet zu berühmten
    Meisterwerken inspirierte.
  it: Spettacolare risorgiva carsica e forra fluviale incassata che ispirò i celebri dipinti di Gustave Courbet.
  pt: >-
    Espetacular ressurgência cársica e desfiladeiro fluvial encaixado que inspirou as pinturas de Gustave
    Courbet.
unico:
  es: >-
    Un río que nace de golpe, al pie de un acantilado de 104 m, alimentado por el agua que el Doubs pierde
    bajo tierra.
  en: >-
    A river born in an instant at the foot of a 104 m amphitheatre cliff, fed by waters lost underground from
    the Doubs.
  fr: >-
    Une rivière qui jaillit d'un coup au pied d'une falaise en hémicycle de 104 m, alimentée par les pertes
    souterraines du Doubs.
  de: >-
    Ein Fluss, der schlagartig am Fuße einer 104 m hohen Halbkreisklippe entspringt, gespeist aus
    unterirdischen Flussverlusten des Doubs.
  it: >-
    Un fiume che sgorga all'improvviso ai piedi di una falesia a emiciclo di 104 m, alimentato dalle perdite
    sotterranee del Doubs.
  pt: >-
    Um rio que brota subitamente no sopé de uma arriba em hemiciclo de 104 m, alimentado pelas perdas
    subterrâneas do Doubs.
observaciones:
  es: >-
    El sendero en borde de acantilado es aéreo y puede resultar peligroso: está reservado a excursionistas con
    experiencia y buen equipo. Mira el estado de las crecidas antes de bajar al cauce. La mejor época va de
    mayo a octubre; en Ornans, el pueblo de Courbet, hay más gente.
texto:
  es:
    intro: >-
      En agosto de 1901 ardió en Pontarlier la fábrica de absenta Pernod, tras caerle un rayo. Los bomberos,
      para apagarla, vertieron un millón de litros de licor en un pozo perdido cerca del río. Dos días
      después, la Loue olía a anís. Así se supo, sin buscarlo, que parte del agua de la Loue viene de las
      pérdidas del Doubs, que se hunde bajo tierra y reaparece en la fuente.


      La Loue es eso: una resurgencia kárstica y afluente por la izquierda del Doubs que atraviesa los
      departamentos de Doubs y Jura. Nace a 530 m en Ouhans, en el fondo de una reculée, y entre peñascos y
      pueblos encajados va dejando un valle de caliza, de cascadas y de gargantas.
    landscape: >-
      En las mesetas calizas del Jura el agua se infiltra, ensancha las grietas, excava cuevas y reaparece más
      lejos en forma de resurgencias: eso es el karst. La fuente de la Loue es la principal. Está alimentada
      por una red subterránea de unos 600 km², con pérdidas del Doubs, del Drugeon, del val d'Usiers y de la
      cuenca de Arc-sous-Cicon, y brota al pie de un acantilado con forma de hemiciclo de 104 m. Su caudal
      oscila entre 1 y 100 m³/s, con una media de 6.


      Aguas abajo, la Loue forma una cascada en la propia resurgencia y 900 m más allá da un salto de 12 m en
      las gargantas de Nouailles. Los primeros cuarenta kilómetros del río discurren por el fondo de la
      reculée, y el agua va tan cargada de cal que las rupturas de pendiente forman nassis, presas naturales
      de travertino. Más allá de Arc-et-Senans el valle se ensancha tanto que cambia de nombre: Val d'Amour.
      El curso se divide en alta Loue, de la fuente a Cléron, Loue media hasta Quingey y baja Loue hasta la
      desembocadura en Parcey.
    wildlife: >-
      Las paredes son territorio de rapaces: el [halcón peregrino](/especie/falco_peregrinus/) y el [búho
      real](/especie/bubo_bubo/) anidan en los acantilados. El [lince boreal](/especie/lynx_lynx/) frecuenta
      la zona y el [lobo](/especie/canis_lupus/) pasa por ella. En los bosques crían el [milano
      real](/especie/milvus_milvus/), el milano negro, el aguilucho pálido, el [abejero
      europeo](/especie/pernis_apivorus/) y la culebrera europea. El [pito
      negro](/especie/dryocopus_martius/), el pito cano y el pico mediano son los pícidos del bosque, y el
      grévol también vive en él. En los pastos secos y los prados pobres, la alondra totovía, el alcaudón
      dorsirrojo y el chotacabras europeo.


      Entre los murciélagos de interés europeo figuran los de herradura, la barbastela y el murciélago de
      Bechstein. El espacio protegido de los valles de la Loue y del Lison cuenta con 36 especies de interés
      europeo y 18 grandes tipos de hábitats de interés comunitario, seis de ellos prioritarios.


      El agua manda en el calendario: las aguas altas llegan de noviembre a abril y las bajas, de verano, de
      julio a septiembre. El caudal medio en Vuillafans es de 5 m³/s, pero en las crecidas puede superar los
      100.
    visit: >-
      La visita empieza en la fuente. Desde el aparcamiento turístico se baja a la Source de la Loue, se sube
      por la margen derecha y se llega al mirador de Aiguillons de Brasse, con vistas a las gargantas de
      Nouailles y al valle. El circuito completo, Source de la Loue et Aiguillons de Brasse, mide 10 km, es
      difícil y lleva unas tres horas. Hay otro sendero panorámico en balcón sobre las gargantas.


      Más suave es el Sentier de Lods, un circuito fácil de 6,3 km entre huertos, prados y bosques, de Lods a
      Mouthier-Haute-Pierre, con unas dos horas y media. Cerca de Cademène y Lizine, los miradores de la
      Gouille Noire y de la Piquette dan a un valle encajado.


      En la Maison de la Source, del Pôle Courbet, hay un espacio de acogida y una proyección sobre el paraje
      visto por el pintor; abre cada verano.
    history: >-
      Gustave Courbet pintó más de catorce cuadros de la fuente: lo fascinaban sus cuevas. La fuerza del agua
      movió molinos desde muy pronto, ya en 1260 los hay mencionados. El paraje de la fuente está clasificado
      desde 1930 y el tramo de Lods a Quingey es sitio inscrito desde 1979.
    before: >-
      El sendero en borde de acantilado es aéreo y puede resultar peligroso: está reservado a excursionistas
      con experiencia y buen equipo. Mira el estado de las crecidas antes de bajar al cauce. La mejor época va
      de mayo a octubre; en Ornans, el pueblo de Courbet, hay más gente.
    around: >-
      A dos kilómetros está el [Bosque de Chaux](/lugar/foret-de-chaux/); a cinco, las [Gargantas del Río
      Doubs](/lugar/gorges-du-doubs---franco-suisses/) y el [Alto Valle del Río
      Ain](/lugar/haute-vallee-de-l-ain/); a veinticuatro, el [Parque Natural Regional del Alto
      Jura](/lugar/parc-naturel-regional-du-haut-jura/). Más lejos, el [Parque Nacional Pieniny - Garganta del
      Río Dunajec](/lugar/pieninski-park-narodowy---dunajec-gorge/) comparte con la Loue el mirlo acuático y
      el karst.
  en:
    intro: >-
      In August 1901, the Pernod absinthe distillery in Pontarlier caught fire after being struck by
      lightning. To douse the flames, firefighters drained one million litres of spirit into an abandoned
      ditch near the river. Two days later, the Loue smelled distinctly of anise. That accidental event proved
      that part of the Loue's flow originates from subterranean losses of the Doubs, sinking underground to
      reappear at the resurgence.


      The Loue is just that: a major karst resurgence and left-bank tributary of the Doubs winding through the
      departments of Doubs and Jura. Rising at 530 m in Ouhans at the head of a blind valley (*reculée*), it
      threads between crags and clustered villages in a landscape of limestone cliffs, waterfalls and gorges.
    landscape: >-
      Across the limestone plateaus of the Jura, rain infiltrates joints, widens fissures, hollows out caverns
      and re-emerges downstream as karst springs. The Source of the Loue is the most celebrated. Fed by an
      underground catchment of some 600 km² capturing losses from the Doubs, the Drugeon, the Val d'Usiers and
      the Arc-sous-Cicon basin, it gushes from the base of a 104 m semicircular cliff. Its discharge varies
      between 1 and 100 m³/s, averaging 6.


      Downstream, the Loue forms a waterfall at the resurgence itself, and 900 m further down plunges over a
      12 m cascade into the Nouailles gorges. The first forty kilometres of river run through the floor of the
      reculée, its waters so laden with dissolved lime that changes in slope create *nassis*, natural tufa
      dams. Beyond Arc-et-Senans the valley broadens into the peaceful Val d'Amour. The course divides into
      the upper Loue from source to Cléron, the middle Loue to Quingey, and the lower Loue to its confluence
      at Parcey.
    wildlife: >-
      The canyon walls belong to birds of prey: [peregrine falcon](/especie/falco_peregrinus/) and [Eurasian
      eagle-owl](/especie/bubo_bubo/) nest along the cliffs. The [Eurasian lynx](/especie/lynx_lynx/) hunts
      the limestone rim and the [grey wolf](/especie/canis_lupus/) ranges through. Woodlands shelter breeding
      [red kite](/especie/milvus_milvus/), black kite, hen harrier, [European honey
      buzzard](/especie/pernis_apivorus/) and short-toed snake eagle. Woodpeckers include [black
      woodpecker](/especie/dryocopus_martius/), grey-headed and middle spotted woodpecker, alongside hazel
      grouse. Dry pastures and limestone swards host woodlark, red-backed shrike and European nightjar.


      Notable bats include horseshoe bats, western barbastelle and Bechstein's bat. The protected landscape of
      the Loue and Lison valleys encompasses 36 species of European conservation concern and 18 major habitat
      types of Community interest, six of them priority.


      Water regimes set the seasonal pace: high flows run from November to April and summer low water from
      July to September. Average discharge at Vuillafans is 5 m³/s, though winter spates can exceed 100.
    visit: >-
      A visit begins at the spring. From the visitor car park, paths descend to the Source of the Loue, climb
      the right bank and reach the Aiguillons de Brasse belvedere, opening vistas over the Nouailles gorges
      and valley. The complete loop, Source de la Loue et Aiguillons de Brasse, measures 10 km, is rated
      demanding and requires roughly three hours. A separate clifftop trail hugs the gorge rim.


      A gentler option is the Sentier de Lods, an easy 6.3 km circuit through orchards, meadows and woods
      between Lods and Mouthier-Haute-Pierre, taking about two and a half hours. Near Cademène and Lizine,
      viewpoints at Gouille Noire and La Piquette look down into the gorge.


      At the Maison de la Source, run by the Pôle Courbet, a visitor centre offers introductory exhibits and
      screenings on the site as seen by Courbet, open each summer.
    history: >-
      Gustave Courbet painted more than fourteen canvases of the source, fascinated by its cavernous mouth.
      Water power drove mills here very early, with records dating back to 1260. The spring was classified as
      a natural monument in 1930, and the river stretch from Lods to Quingey was designated an inscribed
      landscape in 1979.
    before: >-
      The clifftop path is exposed and can be treacherous: reserve it for sure-footed walkers with proper
      footwear. Check river flow levels before descending into canyon sections. Best visiting months run from
      May to October; expect larger crowds in Ornans, Courbet's birthplace.
    around: >-
      Two kilometres away lies the [Chaux Forest](/lugar/foret-de-chaux/); five kilometres away are the [Doubs
      Gorges](/lugar/gorges-du-doubs---franco-suisses/) and the [Upper Ain
      Valley](/lugar/haute-vallee-de-l-ain/); twenty-four kilometres away sits the [Haut-Jura Regional Natural
      Park](/lugar/parc-naturel-regional-du-haut-jura/). Further afield, the [Pieniny National Park - Dunajec
      Gorge](/lugar/pieninski-park-narodowy---dunajec-gorge/) shares with the Loue its white-throated dipper
      and karst landscape.
  fr:
    intro: >-
      En août 1901, l'usine d'absinthe Pernod de Pontarlier prit feu après avoir été frappée par la foudre.
      Pour éteindre l'incendie, les pompiers déversèrent un million de litres de liqueur dans un puits perdu
      près de la rivière. Deux jours plus tard, la Loue sentait l'anis. On comprit ainsi que les eaux de la
      Loue proviennent en partie des pertes souterraines du Doubs, s'engouffrant sous terre pour reparaître à
      la source.


      La Loue est cela : une puissante résurgence karstique et affluent gauche du Doubs traversant les
      départements du Doubs et du Jura. Née à 530 m à Ouhans au fond d'une reculée, elle déroule entre
      falaises et villages comtois une vallée de calcaire, de cascades et de gorges.
    landscape: >-
      Sur les plateaux jurassiens, l'eau s'infiltre, élargit les failles, creuse des cavités et reparaît plus
      loin en résurgences : c'est le karst. La source de la Loue en est le joyau. Alimentée par un bassin
      souterrain de quelque 600 km² drainant les pertes du Doubs, du Drugeon, du val d'Usiers et du bassin
      d'Arc-sous-Cicon, elle jaillit au pied d'une falaise de 104 m. Son débit oscille entre 1 et 100 m³/s,
      avec une moyenne de 6.


      En aval, la Loue cascade dès sa résurgence puis franchit 900 m plus bas une chute de 12 m dans les
      gorges de Nouailles. Les quarante premiers kilomètres s'écoulent au fond de la reculée, et l'eau est si
      calcaire que les ruptures de pente forment des nassis, barrages naturels de travertin. Passé
      Arc-et-Senans, la vallée s'élargit dans le Val d'Amour. Le cours se divise en haute Loue jusqu'à Cléron,
      moyenne Loue jusqu'à Quingey, et basse Loue jusqu'à la confluence à Parcey.
    wildlife: >-
      Les parois appartiennent aux rapaces : le [faucon pèlerin](/especie/falco_peregrinus/) et le [grand-duc
      d'Europe](/especie/bubo_bubo/) nichent sur les falaises. Le [lynx boréal](/especie/lynx_lynx/) fréquente
      les corniches et le [loup](/especie/canis_lupus/) y transite. Dans les forêts se reproduisent le [milan
      royal](/especie/milvus_milvus/), le milan noir, le busard Saint-Martin, la [bondrée
      apivore](/especie/pernis_apivorus/) et le circaète Jean-le-Blanc. Le [pic
      noir](/especie/dryocopus_martius/), le pic cendré et le pic mar animent les sous-bois aux côtés de la
      gélinotte des bois. Sur les pelouses sèches chantent l'alouette lulu, la pie-grièche écorcheur et
      l'engoulevent d'Europe.


      Les chauves-souris d'intérêt européen comptent rhinolophes, barbastelle et murin de Bechstein. Le site
      classé des vallées de la Loue et du Lison réunit 36 espèces d'intérêt européen et 18 grands types
      d'habitats communautaires, dont six prioritaires.


      L'eau dicte le rythme : les hautes eaux courent de novembre à avril et l'étiage s'étend de juillet à
      septembre. Le débit moyen à Vuillafans est de 5 m³/s mais les crues peuvent dépasser 100.
    visit: >-
      La découverte commence à la source. Depuis le parking, on descend à la Source de la Loue, on remonte en
      rive droite jusqu'au belvédère des Aiguillons de Brasse ouvrant sur les gorges de Nouailles et la
      vallée. Le circuit complet Source de la Loue et Aiguillons de Brasse mesure 10 km, classé difficile,
      pour environ trois heures de marche. Un sentier en corniche domine le défilé.


      Plus accessible, le Sentier de Lods offre une boucle aisée de 6,3 km entre vergers, prés et forêts de
      Lods à Mouthier-Haute-Pierre en deux heures et demie. Près de Cademène et Lizine, les belvédères de la
      Gouille Noire et de la Piquette plongent sur la vallée.


      À la Maison de la Source, gérée par le Pôle Courbet, un espace d'accueil et des projections présentent
      le site peint par Courbet, ouvert chaque été.
    history: >-
      Gustave Courbet a peint plus de quatorze toiles de la source, fasciné par son porche sombre. L'énergie
      hydraulique anima très tôt des moulins, déjà mentionnés en 1260. Le site de la source est classé depuis
      1930 et le tronçon de Lods à Quingey est inscrit depuis 1979.
    before: >-
      Le sentier en balcon sur falaise est aérien et peut être dangereux : réservé aux marcheurs expérimentés
      bien chaussés. Vérifiez l'état des crues avant de descendre dans les gorges. La meilleure saison va de
      mai à octobre ; Ornans, ville natale de Courbet, connaît une affluence plus marquée.
    around: >-
      À deux kilomètres s'étend la [forêt de Chaux](/lugar/foret-de-chaux/) ; à cinq kilomètres les [gorges du
      Doubs](/lugar/gorges-du-doubs---franco-suisses/) et la [haute vallée de
      l'Ain](/lugar/haute-vallee-de-l-ain/) ; à vingt-quatre kilomètres le [parc naturel régional du
      Haut-Jura](/lugar/parc-naturel-regional-du-haut-jura/). Plus loin, le [parc national des Piénines -
      Gorges du Dunajec](/lugar/pieninski-park-narodowy---dunajec-gorge/) partage le cincle plongeur et les
      paysages karstiques.
  de:
    intro: >-
      Im August 1901 brannte in Pontarlier nach einem Blitzschlag die Absinthfabrik Pernod nieder. Um die
      Flammen zu ersticken, leiteten Feuerwehrleute eine Million Liter Likör in einen alten Brunnenschacht
      nahe dem Fluss. Zwei Tage später roch die Loue intensiv nach Anis. So wurde bewiesen, dass ein
      erheblicher Teil des Loue-Wassers aus unterirdischen Versickerungen des Doubs stammt, der versinkt und
      an der Quelle wieder ans Licht tritt.


      Die Loue ist genau das: eine mächtige Karstaufstiegsquelle und linker Nebenfluss des Doubs, der die
      Départements Doubs und Jura durchfließt. Sie entspringt auf 530 m bei Ouhans am Ende einer Reculée und
      formt zwischen Felsabstürzen und Winzerdörfern ein Tal aus Kalksteinfelsen, Wasserfällen und Klammen.
    landscape: >-
      Auf den Juraplateaus sickert Regenwasser ein, weitet Klüfte, wäscht Höhlen aus und tritt talabwärts als
      Karstquelle zutage. Die Source de la Loue ist die bedeutendste. Gespeist von einem unterirdischen
      Einzugsgebiet von rund 600 km², das Wasserverluste von Doubs, Drugeon, Val d'Usiers und Arc-sous-Cicon
      sammelt, entspringt sie am Fuß einer 104 m hohen Felswand. Ihre Schüttung schwankt zwischen 1 und 100
      m³/s bei einem Mittel von 6.


      Talabwärts bildet die Loue einen Wasserfall an der Quelle selbst und stürzt 900 m weiter über eine 12 m
      hohe Kaskade in die Gorges de Nouailles. Die ersten vierzig Flusskilometer verlaufen im Grund der
      Reculée; das Wasser ist so kalkreich, dass Gefällestufen Sinterbecken (*nassis*) bildeten. Hinter
      Arc-et-Senans weitet sich die Aue zum Val d'Amour. Der Lauf gliedert sich in obere Loue bis Cléron,
      mittlere Loue bis Quingey und untere Loue bis zur Mündung bei Parcey.
    wildlife: >-
      Die Felswände gehören den Greifvögeln: [Wanderfalke](/especie/falco_peregrinus/) und
      [Uhu](/especie/bubo_bubo/) brüten in den Steilwänden. Der [Eurasische Luchs](/especie/lynx_lynx/)
      streift durch die Höhenzüge und der [Wolf](/especie/canis_lupus/) quert das Tal. In den Wäldern brüten
      [Rotmilan](/especie/milvus_milvus/), Schwarzmilan, Kornweihe, [Wespenbussard](/especie/pernis_apivorus/)
      und Schlangenadler. [Schwarzspecht](/especie/dryocopus_martius/), Grauspecht und Mittelspecht bewohnen
      das Altholz, ebenso das Haselhuhn. Auf Trockenrasen leben Heidelerche, Neuntöter und Ziegenmelker.


      Zu den Fledermäusen von europäischem Rang zählen Hufeisennasen, Mopsfledermaus und Bechsteinfledermaus.
      Das Schutzgebiet der Täler von Loue und Lison umfasst 36 europäisch bedeutsame Arten und 18
      Lebensraumtypen, sechs davon prioritär.


      Der Wasserstand bestimmt die Jahreszeiten: Hochwasser herrscht von November bis April, Niedrigwasser im
      Sommer von Juli bis September. Der mittlere Abfluss bei Vuillafans beträgt 5 m³/s, kann bei Hochwasser
      aber 100 übersteigen.
    visit: >-
      Der Rundgang beginnt an der Quelle. Vom Parkplatz steigt man zur Source de la Loue hinab, folgt dem
      rechten Ufer und erreicht den Aussichtspunkt Aiguillons de Brasse mit Weitblick auf Gorges de Nouailles
      und Tal. Der gesamte Rundweg Source de la Loue et Aiguillons de Brasse misst 10 km, gilt als schwierig
      und beansprucht rund drei Stunden. Ein weiterer Pfad verläuft als Balkonweg über der Schlucht.


      Gemächlicher ist der Sentier de Lods, ein einfacher Rundweg von 6,3 km durch Obstgärten, Wiesen und
      Wälder von Lods nach Mouthier-Haute-Pierre in etwa zweieinhalb Stunden. Bei Cademène und Lizine blicken
      die Aussichtspunkte Gouille Noire und Piquette tief in die Klamm.


      In der Maison de la Source des Pôle Courbet informieren Ausstellungsräume und Filmbeiträge über Courbets
      Werk; geöffnet jeden Sommer.
    history: >-
      Gustave Courbet schuf über vierzehn Gemälde der Quelle, fasziniert von ihrer dunklen Höhlenpforte.
      Wasserkraft trieb früh Mühlen an, urkundlich belegt seit 1260. Das Quellareal ist seit 1930
      denkmalgeschützt und der Abschnitt von Lods nach Quingey seit 1979 als Landschaftsschutzgebiet
      eingetragen.
    before: >-
      Der Felsenpfad am Klippenrand ist ausgesetzt und kann gefährlich sein: nur für geübte Wanderer mit
      festem Schuhwerk. Informiere dich vor dem Abstieg über den Wasserstand. Die beste Zeit reicht von Mai
      bis Oktober; in Ornans herrscht regerer Besucherverkehr.
    around: >-
      Zwei Kilometer entfernt liegt der [Chaux-Wald](/lugar/foret-de-chaux/); fünf Kilometer entfernt liegen
      die [Doubs-Schluchten](/lugar/gorges-du-doubs---franco-suisses/) und das [Obere
      Ain-Tal](/lugar/haute-vallee-de-l-ain/); vierundzwanzig Kilometer entfernt der [Regionale Naturpark
      Haut-Jura](/lugar/parc-naturel-regional-du-haut-jura/). Weiter entfernt teilt der [Nationalpark Pieninen
      - Dunajec-Schlucht](/lugar/pieninski-park-narodowy---dunajec-gorge/) die Wasseramsel und die
      Karstlandschaft.
  it:
    intro: >-
      Nell'agosto del 1901 la distilleria d'assenzio Pernod a Pontarlier prese fuoco colpita da un fulmine.
      Per domare le fiamme i pompieri versarono un milione di litri di liquore in un pozzo perdente vicino al
      fiume. Due giorni dopo, la Loue odorava di anice. Si scoprì così che parte dell'acqua della Loue
      proviene dalle perdite sotterranee del Doubs, che s'inabissa sottoterra per riemergere alla sorgente.


      La Loue è proprio questo: una possente risorgiva carsica e affluente sinistro del Doubs che attraversa i
      dipartimenti del Doubs e del Giura. Nasce a 530 m a Ouhans sul fondo di una reculée, snodandosi tra
      balze rocciose e borghi pittoreschi in una valle di calcari, cascate e forre.
    landscape: >-
      Sugli altopiani calcarei del Giura l'acqua filtra, allarga le fessure, scava caverne e riemerge più a
      valle sotto forma di risorgive carsiche. La sorgente della Loue ne è l'esempio sommo. Alimentata da un
      bacino sotterraneo di circa 600 km² che capta le perdite del Doubs, del Drugeon, della Val d'Usiers e
      del bacino di Arc-sous-Cicon, scaturisce ai piedi di una falesia di 104 m. La sua portata oscilla tra 1
      e 100 m³/s, con una media di 6.


      A valle, la Loue forma una prima cascata alla risorgiva e 900 m più in là compie un salto di 12 m nelle
      gole di Nouailles. I primi quaranta chilometri del fiume scorrono sul fondo della reculée, e le acque
      ricche di calcare depositano barriere naturali di travertino (*nassis*). Oltre Arc-et-Senans la valle si
      apre nel Val d'Amour. Il corso si riparte in alta Loue fino a Cléron, media Loue fino a Quingey e bassa
      Loue sino alla confluenza a Parcey.
    wildlife: >-
      Le falesie appartengono ai rapaci: il [falco pellegrino](/especie/falco_peregrinus/) e il [gufo
      reale](/especie/bubo_bubo/) nidificano sulle pareti rocciose. La [lince europea](/especie/lynx_lynx/)
      frequenta i rilievi e il [lupo grigio](/especie/canis_lupus/) attraversa l'area. Nei boschi si
      riproducono il [nibbio reale](/especie/milvus_milvus/), il nibbio bruno, l'albanella reale, il [falco
      pecchiaiolo](/especie/pernis_apivorus/) e il biancone. Il [picchio nero](/especie/dryocopus_martius/),
      il picchio cenerino e il picchio rosso mezzano popolano le selve con il francolino di monte. Sulle
      praterie aride si incontrano tottavilla, averla piccola e succiacapre.


      Tra i chirotteri di valore comunitario figurano i ferri di cavallo, la barbastella e il vespertilio di
      Bechstein. Il sito protetto delle valli della Loue e del Lison conta 36 specie d'interesse europeo e 18
      grandi tipi di habitat comunitari, di cui sei prioritari.


      Il regime idrico scandisce le visite: le piene giungono da novembre ad aprile e le magre estive da
      luglio a settembre. La portata media a Vuillafans è di 5 m³/s, ma le piene possono superare i 100.
    visit: >-
      La visita prende avvio dalla sorgente. Dal parcheggio si scende alla Source de la Loue, si risale in
      destra orografica e si tocca il belvedere degli Aiguillons de Brasse affacciato sulle gole di Nouailles
      e sulla valle. Il circuito Source de la Loue et Aiguillons de Brasse misura 10 km, è impegnativo e
      richiede circa tre ore. Un altro sentiero panoramico costeggia la forra a mezzacosta.


      Più rilassante è il Sentier de Lods, anello agevole di 6,3 km tra frutteti, prati e boschi da Lods a
      Mouthier-Haute-Pierre in circa due ore e mezza. Vicino a Cademène e Lizine, i belvederi della Gouille
      Noire e della Piquette dominano la forra.


      Presso la Maison de la Source del Pôle Courbet, un centro accoglienza e proiezioni illustrano i dipinti
      di Courbet; aperto ogni estate.
    history: >-
      Gustave Courbet dipinse oltre quattordici tele della sorgente, affascinato dal suo antro oscuro. La
      forza idraulica mosse precocemente mulini, già documentati nel 1260. Il sito della sorgente è protetto
      dal 1930 e il tratto fluviale tra Lods e Quingey è iscritto dal 1979.
    before: >-
      Il sentiero a picco sulla falesia è esposto e può risultare pericoloso: riservato a camminatori esperti
      con scarponi adatti. Verifica il livello del fiume prima di scendere in forra. La stagione ideale va da
      maggio a ottobre; a Ornans, paese di Courbet, l'affluenza è maggiore.
    around: >-
      A due chilometri si estende la [Foresta di Chaux](/lugar/foret-de-chaux/); a cinque chilometri si
      trovano le [Gole del Fiume Doubs](/lugar/gorges-du-doubs---franco-suisses/) e l'[Alta Valle del Fiume
      Ain](/lugar/haute-vallee-de-l-ain/); a ventiquattro chilometri il [Parco Naturale Regionale dell'Alto
      Giura](/lugar/parc-naturel-regional-du-haut-jura/). Più distante, il [Parco Nazionale dei Pienini - Gola
      del Dunajec](/lugar/pieninski-park-narodowy---dunajec-gorge/) condivide il merlo acquaiolo e gli
      ambienti carsici.
  pt:
    intro: >-
      Em agosto de 1901 ardeu em Pontarlier a fábrica de absinto Pernod após ser atingida por um raio. Para
      debelar as chamas, os bombeiros verteram um milhão de litros de licor num poço abandonado junto ao rio.
      Dois dias depois, o Loue rescendia a anis. Ficou assim provado que parte das águas do Loue resulta de
      perdas subterrâneas do Doubs, que se infiltra no subsolo para reaparecer na nascente.


      O Loue é essa maravilha: uma imponente ressurgência cársica e afluente esquerdo do Doubs que cruza os
      departamentos de Doubs e Jura. Nasce a 530 m em Ouhans no fundo de uma reculée e desenha entre fragas e
      aldeias tradicionais um vale de calcário, cascatas e gargantas.
    landscape: >-
      Nos planaltos calcários do Jura a água infiltra-se, alarga as fendas, escava grutas e ressurge a
      jusante: é o relevo cársico. A nascente do Loue é o seu expoente. Alimentada por uma bacia subterrânea
      de cerca de 600 km² drenando perdas do Doubs, do Drugeon, do vale d'Usiers e de Arc-sous-Cicon, brota no
      sopé de uma escarpa de 104 m. O caudal oscila entre 1 e 100 m³/s, com média de 6.


      A jusante, o Loue forma uma cascata logo na ressurgência e 900 m adiante despenha-se numa queda de 12 m
      nas gargantas de Nouailles. Os primeiros quarenta quilómetros do rio correm no fundo da reculée, com
      águas tão ricas em calcário que as quebras de declive originaram represas naturais de travertino
      (*nassis*). Passado Arc-et-Senans, o vale alarga no Val d'Amour. O curso divide-se em alto Loue até
      Cléron, médio Loue até Quingey e baixo Loue até à foz em Parcey.
    wildlife: >-
      As escarpas são coutada de rapinas: o [falcão-peregrino](/especie/falco_peregrinus/) e o
      [bufo-real](/especie/bubo_bubo/) nidificam nas arribas. O [lince-euroasiático](/especie/lynx_lynx/)
      patrulha as cristas e o [lobo-cinzento](/especie/canis_lupus/) transita no vale. Nas matas nidificam o
      [milhafre-real](/especie/milvus_milvus/), o milhafre-preto, o tartaranhão-azulado, o
      [tartaranhão-apívoro](/especie/pernis_apivorus/) e a águia-cobreira. O
      [pica-pau-preto](/especie/dryocopus_martius/), o pica-pau-cinzento e o pica-pau-médio animam os
      arvoredos ao lado da galinha-do-mato. Nos pastos secos surgem a cotovia-arbórea, o
      picanço-de-dorso-ruivo e o noitibó-da-europa.


      Entre os morcegos destacam-se morcegos-de-ferradura, morcego-borboleta e morcego-de-bechstein. O sítio
      protegido dos vales do Loue e do Lison soma 36 espécies de interesse comunitário e 18 grandes tipos de
      habitats, seis deles prioritários.


      A água rege o calendário: caudais elevados ocorrem de novembro a abril e a estiagem de julho a setembro.
      O caudal médio em Vuillafans é de 5 m³/s, podendo ultrapassar os 100 nas cheias.
    visit: >-
      A visita arranca na nascente. Do parque desce-se à Source de la Loue, sobe-se pela margem direita e
      alcança-se o miradouro dos Aiguillons de Brasse sobre as gargantas de Nouailles e o vale. O percurso
      completo Source de la Loue et Aiguillons de Brasse tem 10 km, é exigente e dura cerca de três horas.
      Outro trilho em varanda segue sobre as gargantas.


      Mais suave é o Sentier de Lods, circuito fácil de 6,3 km entre pomares, prados e bosques de Lods a
      Mouthier-Haute-Pierre em cerca de duas horas e meia. Perto de Cademène e Lizine, os miradouros da
      Gouille Noire e da Piquette abrem vistas sobre o desfiladeiro.


      Na Maison de la Source, do Pôle Courbet, um espaço de acolhimento e projeções retratam a paisagem
      pintada por Courbet; aberto no verão.
    history: >-
      Gustave Courbet pintou mais de catorze quadros da nascente, fascinado pela sua lapa escura. A força
      motriz da água moveu moinhos desde cedo, documentados já em 1260. A nascente é monumento classificado
      desde 1930 e o troço entre Lods e Quingey é sítio inscrito desde 1979.
    before: >-
      O trilho na borda da escarpa é aéreo e pode ser perigoso: reservado a caminhantes experientes com
      calçado adequado. Confirma o caudal antes de descer ao leito. A melhor época decorre de maio a outubro;
      em Ornans, aldeia de Courbet, há mais movimento.
    around: >-
      A dois quilómetros situa-se a [Floresta de Chaux](/lugar/foret-de-chaux/); a cinco quilómetros ficam as
      [Gargantas do Rio Doubs](/lugar/gorges-du-doubs---franco-suisses/) e o [Alto Vale do Rio
      Ain](/lugar/haute-vallee-de-l-ain/); a vinte e quatro quilómetros o [Parque Natural Regional do Alto
      Jura](/lugar/parc-naturel-regional-du-haut-jura/). Mais distante, o [Parque Nacional Pieniny -
      Desfiladeiro do Rio Dunajec](/lugar/pieninski-park-narodowy---dunajec-gorge/) partilha o melro-d'água e
      o relevo cársico.
