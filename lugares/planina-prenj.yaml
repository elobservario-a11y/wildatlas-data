resumen:
  es: El 'Himalaya de Bosnia', un macizo alpino ultraconcarpado de crestas de caliza blanca y circos glaciares.
  en: The 'Bosnian Himalayas', an ultra-rugged alpine massif of white limestone ridges and glacial cirques.
  fr: >-
    L'« Himalaya bosnien », un massif alpin ultra-escarpé aux crêtes de calcaire blanc et aux cirques
    glaciaires.
  de: >-
    Der «bosnische Himalaya», ein extrem schroffes alpines Massiv mit weißen Kalksteinrippen und
    Gletscherkaren.
  it: >-
    L'«Himalaya bosniaco», un massiccio alpino estremamente impervio fatto di creste calcaree bianche e circhi
    glaciali.
  pt: >-
    Os «Himalaias da Bósnia», um maciço alpino ultra-escarpado de cristas de calcário branco e circos
    glaciares.
unico:
  es: >-
    Una cresta de caliza blanca con una pared de más de mil metros, y una salamandra que solo existe aquí y
    solo sale de noche o cuando llueve.
  en: >-
    A white limestone ridge with a wall over a thousand metres high, and a salamander found only here that
    emerges solely at night or during rainfall.
  fr: >-
    Une crête de calcaire blanc avec une paroi de plus de mille mètres, et une salamandre unique au monde qui
    ne sort que la nuit ou sous la pluie.
  de: >-
    Ein weißer Kalkkamm mit einer über tausend Meter hohen Steilwand und ein Salamander, der nur hier vorkommt
    und sich nur nachts oder bei Regen zeigt.
  it: >-
    Una cresta di calcare bianco con una parete di oltre mille metri, e una salamandra endemica che esce solo
    di notte o quando piove.
  pt: >-
    Uma crista de calcário branco com uma parede de mais de mil metros, e uma salamandra exclusiva deste
    maciço que só surge à noite ou à chuva.
observaciones:
  es: >-
    Hay minas y munición sin explotar, sobre todo al este de una línea que va de Čelebići a la cima de Zelena
    Glava y a la aldea de Ravni. La ruta es segura, pero cruza un tramo bajo sospecha de minas al salir de la
    carretera, y hay otros dos puntos, la fuente de Zakantar y cerca de Vrutak, bien señalizados: no te salgas
    de las marcas y respeta esas señales. El terreno es muy pedregoso y hay serpientes. El número de rescate
    es el 121, y parte de la montaña no tiene cobertura móvil. Muchos beben de las fuentes de Prenj, pero se
    recomienda usar filtros en las pequeñas.
texto:
  es:
    intro: >-
      Hay una pared de más de mil metros en Bosnia y Herzegovina. Es la pared de Cetina, en Prenj, un macizo
      de los Dinaridas donde la caliza y la dolomía se alzan en crestas afiladas por encima de 2.000 metros,
      con al menos 11 cumbres que pasan esa cota. Se llama el «Himalaya de Bosnia» porque su cresta, de unos
      15 km, parece de otro país: un muro de roca gris sobre valles verdes y bosques densos. Es un lugar
      salvaje, de escasa afluencia, y su protección como parque nacional está en trámite.
    landscape: >-
      Prenj es roca sedimentaria del Mesozoico y Cenozoico, sobre todo caliza y dolomía, con rasgos kársticos
      marcados. Y el karst manda: pese a las muchas precipitaciones, el agua casi no corre en superficie. Por
      eso, entre tantas cumbres, hay tan pocos arroyos.


      El relieve se ordena en tres pisos: el valle bajo, el karst intermedio y el glaciar alto. Abajo, hasta
      los 1.000 metros, crece un frondoso bosque de caducifolios con predominio de haya; hasta los 1.200
      domina el pino. En medio se extienden mesetas como la de Glogovo, en su mayor parte desnuda y kárstica,
      con algunos prados de siega. Arriba está la cresta, de unos 15 km de largo, de noroeste a sureste, con
      formas afiladas típicas de los Dinaridas.


      La cumbre más alta es Zelena Glava, y su altura varía según la fuente: los mapas antiguos dan 2103 m y
      en la propia cima figura 2155 m. Cerca está Otiš, de 2.093 metros según la ruta. En Tisovica, al pie,
      hay dos charcas, Gornje y Donje jezero, que se forman en otoño con las lluvias máximas y en primavera
      con el deshielo. Y en el flanco noreste, a 397 metros, queda el lago Boračko, de origen
      glaciar-tectónico y el mayor lago natural de su tipo del país.


      Aquí el nombre también cuenta: una hipótesis dice que Prenj debe su nombre a Perun, el dios del trueno
      de los antiguos eslavos.
    wildlife: >-
      Lo más singular es la salamandra de Prenj, endémica del macizo, que habita la meseta kárstica de
      Zakantar y solo se ve de noche o con lluvia. En el macizo viven también el
      [rebeco](/especie/rupicapra_rupicapra/), el [lobo](/especie/canis_lupus/) y el
      [oso](/especie/ursus_arctos/). Entre los árboles, la munika, el pino de Heldreich, figura entre los
      puntos de interés de la ruta.


      La mejor época va de junio a octubre, pero el tiempo cambia deprisa y de forma brusca: Prenj es «como
      una casa en un lugar azotado por el viento», y esos cambios han causado varios accidentes. En verano
      puede nevar y bajar de cero grados.
    visit: >-
      La gran travesía es la etapa de la Via Dinarica que cruza Prenj de oeste a sur: 58,1 km, unas 24 horas
      de marcha y 3.813 metros de ascenso acumulado, clasificada como difícil, con dificultad técnica T4.
      Empieza en Jablanica, en el centro, cruzando el puente y el túnel, y sigue el Neretva hasta Glogošnica.
      Desde allí el camino termina en una cresta expuesta, con vistas a la pared de Cetina.


      Después baja al paso verde de Medjuprenje, donde hay dos refugios y uno de ellos siempre está abierto, y
      gira al este por Zakantar hasta el valle de Tisovica, al pie de Zelena Glava. A media hora de Tisovica
      está el refugio Vrutak. La ruta cruza Zelena Glava, a 2.155 metros, el punto más alto, y Otiš, y
      continúa a Bijele Vode, donde hay otro refugio y una antigua cabaña de pastores que sirve de abrigo.


      También se puede subir desde Konjic por el valle de Bijela hasta Tisovica (ruta este) o desde Mostar
      hasta Grabovčići (ruta oeste).
    history: >-
      Aún se encuentran antiguas posiciones de combate hasta unos 2.000 metros, en las faldas de Otiš. Se han
      reabierto algunos refugios, como Bijele Vode y Hrasnica, y se han restablecido itinerarios marcados a
      las cimas principales. Una de las cumbres, Windy Peak, se escaló por primera vez en octubre de 2003 y
      era probablemente una de las últimas cimas vírgenes de 2.000 metros de Europa.


      La conservación tiene ahora dos frentes. Uno, su declaración como espacio protegido, en trámite. El
      otro, el túnel de Prenj, previsto en el macizo central y de 10,45 km, que será el primero de Bosnia y
      Herzegovina de más de seis kilómetros.
    before: >-
      Hay minas y munición sin explotar, sobre todo al este de una línea que va de Čelebići a la cima de
      Zelena Glava y a la aldea de Ravni. La ruta es segura, pero cruza un tramo bajo sospecha de minas al
      salir de la carretera, y hay otros dos puntos, la fuente de Zakantar y cerca de Vrutak, bien
      señalizados: no te salgas de las marcas y respeta esas señales. El terreno es muy pedregoso y hay
      serpientes. El número de rescate es el 121, y parte de la montaña no tiene cobertura móvil. Muchos beben
      de las fuentes de Prenj, pero se recomienda usar filtros en las pequeñas.
    around: >-
      A unos tres kilómetros están las [Montañas de Vran](/lugar/planina-vran/), y pegado a Prenj queda el
      [Parque Natural Blidinje - Macizo de Čvrsnica](/lugar/park-prirode-blidinje---cvrsnica/). También se
      solapa, aproximadamente, con las [Montañas de Čabulja](/lugar/planina-cabulja/).
  en:
    intro: >-
      There is a wall of over a thousand metres in Bosnia and Herzegovina. It is the Cetina wall in Prenj, a
      Dinaric massif where limestone and dolomite rise into razor-sharp crests above 2,000 metres, boasting at
      least 11 peaks that exceed that mark. It is known as the 'Bosnian Himalayas' because its crest,
      stretching about 15 km, looks as if it belongs to another land: a rampart of grey rock above green
      valleys and dense forests. It is an untamed, sparsely visited realm, and its designation as a national
      park is underway.
    landscape: >-
      Prenj consists of Mesozoic and Cenozoic sedimentary rock, predominantly limestone and dolomite,
      exhibiting pronounced karst features. And karst governs all: despite abundant precipitation, surface
      water barely flows. That is why, amidst so many peaks, there are so few streams.


      The topography unfolds in three levels: the lower valley, the intermediate karst, and the high glacial
      zone. Down below, up to 1,000 metres, grows a lush deciduous forest dominated by beech; up to 1,200
      metres pine prevails. In between extend plateaus like Glogovo, largely barren and karstic, with
      occasional hay meadows. High above stands the crest, about 15 km long, running northwest to southeast,
      with the sharp contours characteristic of the Dinarides.


      The highest peak is Zelena Glava, and its recorded altitude varies by source: old maps indicate 2103 m,
      whereas the summit marker itself reads 2155 m. Nearby rises Otiš, reaching 2,093 metres according to
      route descriptions. At Tisovica, below, two tarns, Gornje and Donje jezero, form during peak autumn
      rains and spring snowmelt. And on the northeastern flank, at 397 metres, lies Lake Boračko, of
      glacio-tectonic origin and the largest natural lake of its kind in the country.


      Names carry weight here too: one hypothesis holds that Prenj derives its name from Perun, the god of
      thunder of the ancient Slavs.
    wildlife: >-
      The most unique inhabitant is the Prenj salamander, endemic to the massif, which dwells on the karstic
      plateau of Zakantar and is only glimpsed at night or during rain. The massif is also home to the
      [chamois](/especie/rupicapra_rupicapra/), the [grey wolf](/especie/canis_lupus/), and the [brown
      bear](/especie/ursus_arctos/). Among trees, the munika, or Heldreich's pine, stands out among the
      botanical highlights along the route.


      The best season runs from June to October, but weather shifts swiftly and abruptly: Prenj is 'like a
      house set in a gale-swept place', and sudden changes have led to multiple accidents. In summer it can
      snow, and temperatures can plummet below zero degrees.
    visit: >-
      The great crossing is the Via Dinarica stage traversing Prenj from west to south: 58.1 km, about 24
      hours of hiking, and 3,813 metres of cumulative elevation gain, graded difficult with technical
      difficulty T4. It begins in Jablanica town centre, crossing the bridge and tunnel, and tracks the
      Neretva towards Glogošnica. From there the trail concludes on an exposed ridge with vistas towards the
      Cetina wall.


      It then drops to the green Medjuprenje pass, where two shelters stand with one always kept unlocked, and
      veers east across Zakantar into the Tisovica valley at the foot of Zelena Glava. Half an hour from
      Tisovica lies the Vrutak hut. The route crests Zelena Glava at 2,155 metres, the highest point, and
      Otiš, before continuing to Bijele Vode, home to another shelter and a former shepherd's cabin providing
      refuge.


      Ascents are also feasible from Konjic through the Bijela valley to Tisovica (eastern route) or from
      Mostar up to Grabovčići (western route).
    history: >-
      Old military combat positions can still be spotted up to about 2,000 metres on the flanks of Otiš.
      Several mountain huts have been reopened, including Bijele Vode and Hrasnica, and marked routes to the
      main summits have been restored. One peak, Windy Peak, was first climbed in October 2003 and was likely
      one of the last virgin 2,000-metre peaks in Europe.


      Conservation currently faces two battlegrounds. One is its designation as a protected area, currently
      pending. The other is the planned Prenj tunnel through the central massif, measuring 10.45 km, which
      will become Bosnia and Herzegovina's first tunnel exceeding six kilometres.
    before: >-
      Unexploded ordnance and landmines remain present, particularly east of a line connecting Čelebići to the
      summit of Zelena Glava and the village of Ravni. The main route is safe, yet it crosses a mine-suspected
      zone upon leaving the asphalt road, and two other points, the Zakantar spring and near Vrutak, are
      clearly signposted: never stray from the waymarkers and heed all warnings. The terrain is exceedingly
      rocky and snakes occur. The mountain rescue number is 121, and much of the massif lacks mobile
      reception. While many hikers drink from springs in Prenj, filtering water from smaller flows is strongly
      advised.
    around: >-
      About three kilometres away rise the [Vran Mountains](/lugar/planina-vran/), and adjoining Prenj lies
      the [Blidinje Nature Park - Čvrsnica Massif](/lugar/park-prirode-blidinje---cvrsnica/). It also roughly
      overlaps with the [Čabulja Mountains](/lugar/planina-cabulja/).
  fr:
    intro: >-
      Il existe en Bosnie-Herzégovine une paroi de plus de mille mètres. C'est la face de Cetina, dans le
      Prenj, un massif dinarique où le calcaire et la dolomie se dressent en crêtes acérées à plus de 2 000
      mètres, comptant au moins 11 cimes franchissant cette altitude. On le surnomme l'« Himalaya bosnien »
      car sa crête d'environ 15 km semble venue d'un autre monde : un rempart de roche grise surplombant des
      vallées verdoyantes et des forêts denses. C'est un territoire sauvage, très peu fréquenté, dont le
      classement en parc national est en cours d'instruction.
    landscape: >-
      Le Prenj est formé de roches sédimentaires du Mésozoïque et du Cénozoïque, essentiellement de calcaire
      et de dolomie, aux modelés karstiques marqués. Et le karst impose sa loi : malgré de copieuses
      précipitations, l'eau ne s'écoule presque pas en surface. C'est pourquoi, au milieu de tant de cimes, on
      trouve si peu de ruisseaux.


      Le relief s'organise en trois étages : la basse vallée, le karst intermédiaire et l'étage glaciaire
      sommital. En bas, jusqu'à 1 000 mètres, prospère une riche forêt de feuillus dominée par le hêtre ;
      jusqu'à 1 200 mètres le pin prend le relais. Au milieu s'étendent des plateaux comme celui de Glogovo,
      en grande partie dénudé et karstifié, parsemé de quelques prairies de fauche. Tout en haut court la
      crête, longue d'environ 15 km, du nord-ouest au sud-est, aux arêtes tranchantes emblématiques des Alpes
      Dinariques.


      Le point culminant est le Zelena Glava, dont l'altitude varie selon les sources : les cartes anciennes
      indiquent 2103 m alors que le sommet lui-même affiche 2155 m. Tout près s'élève l'Otiš, à 2 093 mètres
      selon les itinéraires. À Tisovica, au pied du pic, deux mares, Gornje et Donje jezero, se remplissent
      lors des pluies d'automne et à la fonte des neiges printanière. Et sur le flanc nord-est, à 397 mètres,
      dort le lac Boračko, d'origine glacio-tectonique et plus grand lac naturel de ce type du pays.


      Ici le toponyme a aussi son histoire : une hypothèse veut que le Prenj doive son nom à Péroun, le dieu
      slave du tonnerre.
    wildlife: >-
      L'habitant le plus singulier est la salamandre du Prenj, endémique du massif, qui hante le plateau
      karstique de Zakantar et ne s'observe que de nuit ou sous l'averse. Le massif abrite également le
      [chamois](/especie/rupicapra_rupicapra/), le [loup](/especie/canis_lupus/) et l'[ours
      brun](/especie/ursus_arctos/). Côté flore, le pin de Heldreich compte parmi les curiosités végétales
      majeures du parcours.


      La période idéale s'étend de juin à octobre, mais la météo change avec une extrême brutalité : le Prenj
      est « comme une maison posée en plein vent », et ces revirements ont causé plusieurs accidents mortels.
      En plein été, la neige peut faire son apparition et le thermomètre descendre sous zéro degré.
    visit: >-
      La grande traversée correspond à l'étape de la Via Dinarica franchissant le Prenj d'ouest en sud : 58,1
      km, environ 24 heures de marche et 3 813 mètres de dénivelé positif cumulé, classée difficile avec une
      technicité T4. Elle démarre au centre de Jablanica en franchissant le pont et le tunnel, puis longe la
      Neretva jusqu'à Glogošnica. De là, le sentier débouche sur une arête aérienne offrant des vues
      plongeantes sur la face de Cetina.


      Il descend ensuite vers le col verdoyant de Medjuprenje, qui abrite deux abris dont l'un reste toujours
      ouvert, puis oblique vers l'est à travers Zakantar pour rejoindre la vallée de Tisovica, au pied du
      Zelena Glava. À une demi-heure de Tisovica se dresse le refuge Vrutak. Le tracé franchit le Zelena Glava
      à 2 155 mètres, point culminant, puis l'Otiš, et se poursuit vers Bijele Vode où attendent un autre
      refuge et une ancienne cabane pastorale servant d'abri.


      On peut également monter depuis Konjic par la vallée de la Bijela jusqu'à Tisovica (voie est) ou depuis
      Mostar vers Grabovčići (voie ouest).
    history: >-
      On repère encore d'anciennes positions de combat jusqu'à près de 2 000 mètres sur les flancs de l'Otiš.
      Plusieurs refuges ont rouvert, comme Bijele Vode et Hrasnica, et les sentiers balisés menant aux sommets
      majeurs ont été remis en état. L'une des cimes, le Windy Peak, a été gravie pour la toute première fois
      en octobre 2003 ; c'était probablement l'un des derniers sommets vierges de 2 000 mètres d'Europe.


      La protection du site se joue aujourd'hui sur deux fronts. D'un côté, le classement en espace protégé,
      en cours d'instruction. De l'autre, le projet de tunnel autoroutier du Prenj sous le massif central,
      long de 10,45 km, qui deviendra le premier tunnel de Bosnie-Herzégovine de plus de six kilomètres.
    before: >-
      Des mines et munitions non explosées subsistent, notamment à l'est d'une ligne reliant Čelebići au
      sommet du Zelena Glava et au village de Ravni. L'itinéraire principal est sécurisé, mais il traverse une
      zone suspectée de mines en quittant la route, et deux autres secteurs, à la source de Zakantar et près
      de Vrutak, sont rigoureusement balisés : ne vous écartez jamais du sentier et respectez scrupuleusement
      les panneaux de danger. Le sol est très rocailleux et les serpents abondent. Le numéro des secours est
      le 121, et de larges pans du massif ne disposent d'aucune couverture téléphonique. Si beaucoup boivent
      aux sources du Prenj, il est conseillé de filtrer l'eau des filets d'eau modestes.
    around: >-
      À environ trois kilomètres s'élèvent les [Monts Vran](/lugar/planina-vran/), et contigu au Prenj s'étend
      le [Parc naturel de Blidinje - Massif de Čvrsnica](/lugar/park-prirode-blidinje---cvrsnica/). Il
      chevauche également en partie les [Monts Čabulja](/lugar/planina-cabulja/).
  de:
    intro: >-
      In Bosnien und Herzegowina gibt es eine über tausend Meter hohe Steilwand. Es ist die Cetina-Wand im
      Prenj, einem Dinariden-Massiv, in dem Kalkstein und Dolomit in messerscharfen Graten über 2.000 Meter
      emporragen, mit mindestens 11 Gipfeln oberhalb dieser Höhenmarke. Es wird auch «bosnischer Himalaya»
      genannt, weil sein rund 15 km langer Hauptkamm wie aus einer anderen Welt wirkt: eine Mauer aus grauem
      Fels über grünen Tälern und dichten Wäldern. Ein urwildes, kaum besuchtes Gebirge, dessen Ausweisung als
      Nationalpark vorbereitet wird.
    landscape: >-
      Der Prenj besteht aus mesozoischen und känozoischen Sedimentgesteinen, vor allem Kalkstein und Dolomit,
      mit ausgeprägten Karstformen. Und der Karst bestimmt alles: Trotz ergiebiger Niederschläge fließt an der
      Oberfläche kaum Wasser. Deshalb gibt es inmitten so vieler Gipfel so wenige Bäche.


      Das Relief gliedert sich in drei Stockwerke: die Talsohle, die Karst-Mittelstufe und die hochalpine
      Glazialzone. Unten, bis auf 1.000 Meter, wächst üppiger Laubwald mit Buchendominanz; bis 1.200 Meter
      übernimmt die Kiefer. Dazwischen dehnen sich Hochebenen wie die von Glogovo aus, weitgehend kahl und
      verkarstet, mit vereinzelten Mähwiesen. Ganz oben zieht sich der rund 15 km lange Grat von Nordwesten
      nach Südosten, mit den typisch scharfen Konturen der Dinariden.


      Höchster Gipfel ist der Zelena Glava, dessen Höhenangabe je nach Quelle variiert: Ältere Karten
      verzeichnen 2103 m, während auf dem Gipfel selbst 2155 m vermerkt sind. Nahebei erhebt sich der Otiš,
      laut Tourenbeschreibungen 2.093 Meter hoch. In Tisovica am Fuß bilden sich mit den Herbstregen und der
      Frühjahrsschneeschmelze zwei Bergseen, Gornje und Donje jezero. Und an der Nordostflanke liegt auf 397
      Metern der Boračko-See, glazial-tektonischen Ursprungs und der größte natürliche See dieser Art im Land.


      Auch der Name erzählt Geschichte: Einer Hypothese zufolge verdankt der Prenj seinen Namen Perun, dem
      Donnergott der alten Slawen.
    wildlife: >-
      Der bemerkenswerteste Bewohner ist der Prenj-Salamander, eine für das Massiv endemische Art, die auf der
      Karst-Hochebene Zakantar lebt und nur nachts oder bei Regen hervorkommt. Im Massiv leben außerdem die
      [Gämse](/especie/rupicapra_rupicapra/), der [Wolf](/especie/canis_lupus/) und der
      [Braunbär](/especie/ursus_arctos/). Bei den Gehölzen gehört die Munika, die Panzerkiefer, zu den
      Höhepunkten entlang der Routen.


      Die beste Reisezeit reicht von Juni bis Oktober, doch das Wetter schlägt rasch und unvermittelt um: Der
      Prenj sei «wie ein Haus auf windgepeitschtem Grund», und solche Wetterstürze haben schon manchen Unfall
      gefordert. Selbst im Hochsommer kann es schneien und unter null Grad abkühlen.
    visit: >-
      Die große Durchquerung ist die Etappe der Via Dinarica, die den Prenj von Westen nach Süden überquert:
      58,1 km, etwa 24 Stunden Gehzeit und 3.813 Höhenmeter Aufstieg, eingestuft als schwierig mit technischem
      Anspruch T4. Sie startet im Ortszentrum von Jablanica, quert Brücke und Tunnel und folgt der Neretva bis
      Glogošnica. Von dort leitet der Steig auf einen ausgesetzten Grat mit Blick auf die Cetina-Wand.


      Anschließend senkt er sich zum grünen Medjuprenje-Pass, wo zwei Hütten stehen und eine stets offen
      steht, und schwenkt nach Osten über Zakantar ins Tisovica-Tal am Fuß des Zelena Glava. Eine halbe Stunde
      von Tisovica entfernt liegt die Schutzhütte Vrutak. Die Route führt über den Zelena Glava auf 2.155
      Metern, den höchsten Punkt, und den Otiš, ehe sie nach Bijele Vode weiterläuft, wo eine weitere Hütte
      sowie eine alte Hirtenhütte als Unterstand dienen.


      Aufstiege sind auch ab Konjic durch das Bijela-Tal nach Tisovica (Ostroute) oder ab Mostar hinauf nach
      Grabovčići (Westroute) möglich.
    history: >-
      Alte Kampfstellungen lassen sich noch bis auf etwa 2.000 Meter an den Flanken des Otiš finden. Mehrere
      Berghütten wurden wiedereröffnet, darunter Bijele Vode und Hrasnica, und markierte Steige zu den
      Hauptgipfeln wieder instand gesetzt. Ein Gipfel, der Windy Peak, wurde erst im Oktober 2003 erstbegangen
      und zählte vermutlich zu den letzten unbestiegenen 2.000-Meter-Gipfeln Europas.


      Der Naturschutz bewegt sich derzeit an zwei Fronten. Die eine ist die angestrebte Ausweisung als
      Schutzgebiet. Die andere betrifft das Projekt des 10,45 km langen Prenj-Tunnels durch das Zentralmassiv,
      der der erste Tunnel in Bosnien und Herzegowina mit einer Länge von über sechs Kilometern sein wird.
    before: >-
      Es gibt Minen und Blindgänger, besonders östlich einer Linie von Čelebići über den Gipfel des Zelena
      Glava zum Weiler Ravni. Die Hauptroute ist sicher, kreuzt jedoch nach Verlassen der Straße einen
      minengefährdeten Abschnitt; zwei weitere Stellen, die Quelle von Zakantar und der Bereich nahe Vrutak,
      sind deutlich gekennzeichnet: Verlasse keinesfalls die Markierungen und beachte die Warnschilder. Das
      Gelände ist sehr steinig und es gibt Schlangen. Die Rettungsnummer lautet 121, und weite Teile des
      Gebirges haben keinen Mobilfunkempfang. Viele trinken aus den Quellen des Prenj, doch bei kleinen
      Austritten wird ein Wasserfilter dringend empfohlen.
    around: >-
      Rund drei Kilometer entfernt erhebt sich das [Vran-Gebirge](/lugar/planina-vran/), und direkt an den
      Prenj schließt der [Naturpark Blidinje – Čvrsnica-Massiv](/lugar/park-prirode-blidinje---cvrsnica/) an.
      Zudem überschneidet sich das Areal annähernd mit dem [Čabulja-Gebirge](/lugar/planina-cabulja/).
  it:
    intro: >-
      In Bosnia ed Erzegovina si erge una parete di oltre mille metri. È la parete di Cetina, nel Prenj, un
      massiccio delle Alpi Dinariche dove calcare e dolomia si innalzano in creste affilate sopra i 2.000
      metri, con almeno 11 vette che superano tale quota. Viene chiamato l'«Himalaya bosniaco» perché la sua
      dorsale, lunga circa 15 km, sembra appartenere a un altro continente: una muraglia di roccia grigia
      sopra vallate verdi e fitte foreste. È un luogo selvaggio, poco frequentato, la cui tutela come parco
      nazionale è in fase di approvazione.
    landscape: >-
      Il Prenj è costituito da rocce sedimentarie del Mesozoico e Cenozoico, soprattutto calcare e dolomia,
      con pronunciate forme carsiche. E il carso domina incontrastato: a dispetto delle abbondanti
      precipitazioni, in superficie l'acqua quasi non scorre. Ecco perché, tra così tante cime, vi sono così
      pochi torrenti.


      Il rilievo si articola in tre piani: il fondovalle, il carso intermedio e la zona glaciale sommitale. In
      basso, fino a 1.000 metri, cresce una lussureggiante foresta di latifoglie dominata dal faggio; fino a
      1.200 metri prevale il pino. Al centro si aprono altipiani come quello di Glogovo, in gran parte spoglio
      e carsificato, con qualche prato da sfalcio. In alto corre la cresta, lunga circa 15 km, da nord-ovest a
      sud-est, con i profili affilati tipici delle Dinaridi.


      La vetta più alta è la Zelena Glava, la cui quota varia a seconda delle fonti: le vecchie carte
      riportano 2103 m, mentre sulla vetta stessa è indicato 2155 m. Vicino si staglia l'Otiš, a 2.093 metri
      secondo le relazioni escursionistiche. A Tisovica, ai suoi piedi, ci sono due specchi d'acqua, Gornje e
      Donje jezero, che si formano in autunno con le massime piogge e in primavera con il disgelo. E sul
      versante nord-orientale, a 397 metri, giace il lago Boračko, di origine glaciale-tettonica e massimo
      lago naturale di questa tipologia nel paese.


      Anche il nome ha un suo fascino: secondo un'ipotesi, il Prenj deve il proprio nome a Perun, il dio del
      tuono degli antichi Slavi.
    wildlife: >-
      La creatura più singolare è la salamandra del Prenj, endemica del massiccio, che popola l'altopiano
      carsico di Zakantar e si lascia scorgere solo di notte o sotto la pioggia. Nel massiccio vivono anche il
      [camoscio alpino](/especie/rupicapra_rupicapra/), il [lupo grigio](/especie/canis_lupus/) e l'[orso
      bruno](/especie/ursus_arctos/). Tra le piante, il pino loricato figura tra i principali elementi di
      interesse botanico lungo il percorso.


      Il periodo migliore va da giugno a ottobre, ma il tempo cambia rapidamente e con estrema violenza: il
      Prenj è «come una casa esposta alla bufera», e simili mutamenti hanno provocato diversi incidenti.
      D'estate può nevicare e scendere sotto zero gradi.
    visit: >-
      La grande traversata è la tappa della Via Dinarica che attraversa il Prenj da ovest a sud: 58,1 km,
      circa 24 ore di cammino e 3.813 metri di dislivello positivo, classificata difficile con impegno tecnico
      T4. Prende il via nel centro di Jablanica, valica il ponte e il tunnel, e costeggia la Neretva fino a
      Glogošnica. Da lì la traccia approda su un crinale aereo con vedute sulla parete di Cetina.


      Scende poi al verde colle di Medjuprenje, dove sorgono due bivacchi di cui uno resta sempre aperto, e
      piega a est attraverso Zakantar verso la valle di Tisovica ai piedi della Zelena Glava. A mezz'ora da
      Tisovica si trova il rifugio Vrutak. L'itinerario supera la Zelena Glava a 2.155 metri, punto supremo, e
      l'Otiš, proseguendo per Bijele Vode dove si trovano un altro rifugio e una vecchia capanna di pastori
      adibita a ricovero.


      È altresì possibile salire da Konjic lungo la valle della Bijela fino a Tisovica (via orientale) o da
      Mostar fino a Grabovčići (via occidentale).
    history: >-
      Vecchie postazioni belliche si rinvengono ancora fino a circa 2.000 metri sui versanti dell'Otiš. Alcuni
      rifugi sono stati riaperti, come Bijele Vode e Hrasnica, e sono stati ripristinati gli itinerari segnati
      verso le cime principali. Una delle cime, Windy Peak, è stata scalata per la prima volta nell'ottobre
      2003 ed era probabilmente una delle ultime vette inviolate di 2.000 metri in Europa.


      La salvaguardia ha oggi due fronti aperti. Uno è l'istituzione dell'area protetta, tuttora in corso.
      L'altro è il traforo del Prenj, pianificato nel massiccio centrale per 10,45 km, che sarà la prima
      galleria della Bosnia ed Erzegovina a superare i sei chilometri.
    before: >-
      Sono presenti mine e ordigni inesplosi, in particolare a est della linea che congiunge Čelebići alla
      cima della Zelena Glava e al villaggio di Ravni. La via principale è sicura, ma attraversa un settore a
      rischio mine dopo aver lasciato la strada, e altri due punti, la sorgente di Zakantar e i pressi di
      Vrutak, sono chiaramente segnalati: non allontanarti dai segnavia e rispetta scrupolosamente i cartelli
      di allerta. Il suolo è assai pietroso e vi sono vipere. Il numero dei soccorsi è il 121 e gran parte
      della montagna è priva di segnale telefonico. Molti bevono dalle sorgenti del Prenj, ma è raccomandato
      filtrare l'acqua dei rigagnoli minori.
    around: >-
      A circa tre chilometri si ergono i [Monti Vran](/lugar/planina-vran/), e a ridosso del Prenj si trova il
      [Parco naturale di Blidinje - Massiccio della Čvrsnica](/lugar/park-prirode-blidinje---cvrsnica/). Si
      sovrappone inoltre, a grandi linee, ai [Monti Čabulja](/lugar/planina-cabulja/).
  pt:
    intro: >-
      Existe uma parede de mais de mil metros na Bósnia e Herzegovina. É a parede de Cetina, no Prenj, um
      maciço dos Alpes Dináricos onde o calcário e a dolomite se elevam em cristas afiadas acima dos 2.000
      metros, com pelo menos 11 cumes que superam essa cota. Chamam-lhe os «Himalaias da Bósnia» porque a sua
      crista, de cerca de 15 km, parece pertencer a outro país: uma muralha de rocha cinzenta sobre vales
      verdejantes e florestas densas. É um lugar selvagem, pouco frequentado, e a sua classificação como
      parque nacional está em tramitação.
    landscape: >-
      O Prenj é formado por rochas sedimentares do Mesozoico e Cenozoico, sobretudo calcário e dolomite, com
      traços cársticos muito vincados. E o carste manda: apesar da pluviosidade abundante, a água quase não
      corre à superfície. Por isso, entre tantos cumes, existem tão poucos ribeiros.


      O relevo organiza-se em três pisos: o vale inferior, o carste intermédio e a alta montanha glaciar. Em
      baixo, até aos 1.000 metros, cresce uma densa floresta caducifólia dominada pela faia; até aos 1.200
      metros predomina o pinheiro. A meio estendem-se planaltos como o de Glogovo, na sua maior parte
      desnudado e cárstico, com alguns prados de feno. No topo fica a crista, com cerca de 15 km de extensão,
      de noroeste a sudeste, ostentando as formas aguçadas emblemáticas dos Alpes Dináricos.


      O pico mais alto é o Zelena Glava, cuja altitude varia consoante a fonte: os mapas antigos apontam 2103
      m e no próprio cume figura a indicação de 2155 m. Próximo ergue-se o Otiš, com 2.093 metros segundo os
      itinerários. Em Tisovica, no sopé, formam-se duas lagoas, Gornje e Donje jezero, alimentadas no outono
      pelas chuvas e na primavera pelo degelo. E no flanco nordeste, a 397 metros, fica o lago Boračko, de
      origem glacio-tectónica e o maior lago natural do seu tipo no país.


      Aqui o topónimo também tem história: uma das hipóteses sugere que Prenj deve o seu nome a Perun, o deus
      do trovão dos antigos eslavos.
    wildlife: >-
      O habitante mais singular é a salamandra de Prenj, endémica do maciço, que vive no planalto cárstico de
      Zakantar e só se avista de noite ou com chuva. No maciço vivem também a
      [camurça](/especie/rupicapra_rupicapra/), o [lobo-cinzento](/especie/canis_lupus/) e o
      [urso-pardo](/especie/ursus_arctos/). Entre as árvores, o pinheiro-da-bósnia conta-se entre os destaques
      do itinerário.


      A melhor época estende-se de junho a outubro, mas o tempo muda com rapidez e violência: Prenj é «como
      uma casa num lugar fustigado pelo vento», e essas reviravoltas causaram vários acidentes. No verão pode
      nevar e as temperaturas descem abaixo de zero graus.
    visit: >-
      A grande travessia é a etapa da Via Dinarica que atravessa o Prenj de oeste a sul: 58,1 km, cerca de 24
      horas de marcha e 3.813 metros de desnível positivo acumulado, classificada como difícil com grau
      técnico T4. Começa no centro de Jablanica, atravessando a ponte e o túnel, e segue o Neretva até
      Glogošnica. A partir daí o carreiro culmina numa crista exposta com vistas desafogadas para a parede de
      Cetina.


      Depois desce até ao passo verdejante de Medjuprenje, onde existem dois refúgios e um deles se mantém
      sempre aberto, virando a leste por Zakantar até ao vale de Tisovica, no sopé do Zelena Glava. A meia
      hora de Tisovica encontra-se o refúgio Vrutak. A rota transpõe o Zelena Glava a 2.155 metros, o ponto
      culminante, e o Otiš, prosseguindo até Bijele Vode, onde há outro refúgio e uma antiga cabana de
      pastores que serve de abrigo.


      Também é possível subir a partir de Konjic pelo vale de Bijela até Tisovica (rota este) ou de Mostar até
      Grabovčići (rota oeste).
    history: >-
      Ainda se encontram antigas posições de combate até cerca de 2.000 metros, nas encostas do Otiš. Foram
      reabertos alguns refúgios, como Bijele Vode e Hrasnica, e restabeleceram-se itinerários sinalizados para
      os principais cumes. Um dos topos, o Windy Peak, foi escalado pela primeira vez em outubro de 2003 e
      constituía provavelmente um dos últimos cumes virgens de 2.000 metros da Europa.


      A conservação depara-se agora com duas frentes. Uma é a classificação como área protegida, em curso. A
      outra é o túnel de Prenj, projetado no maciço central com uma extensão de 10,45 km, que será o primeiro
      da Bósnia e Herzegovina com mais de seis quilómetros.
    before: >-
      Existem minas e munições por detonar, especialmente a leste de uma linha que liga Čelebići ao cume de
      Zelena Glava e à aldeia de Ravni. A rota é segura, mas atravessa um troço sob suspeita de minas ao sair
      da estrada, existindo outros dois pontos, a nascente de Zakantar e as imediações de Vrutak, devidamente
      sinalizados: não saias dos trilhos marcados e respeita esses sinais de perigo. O terreno é pedregoso e
      há cobras. O número de socorro é o 121 e grande parte da montanha não tem rede móvel. Muitos bebem das
      fontes do Prenj, mas recomenda-se o uso de filtros nas pequenas nascentes.
    around: >-
      A cerca de três quilómetros erguem-se as [Montanhas de Vran](/lugar/planina-vran/), e colado ao Prenj
      fica o [Parque Natural de Blidinje - Maciço de Čvrsnica](/lugar/park-prirode-blidinje---cvrsnica/).
      Sobrepõe-se igualmente, em traços gerais, às [Montanhas de Čabulja](/lugar/planina-cabulja/).
