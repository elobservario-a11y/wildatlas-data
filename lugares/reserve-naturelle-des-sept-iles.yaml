resumen:
  es: La mayor colonia de alcatraces de Francia y el último refugio del frailecillo en la costa francesa.
  en: France's largest colony of northern gannets and the puffin's last refuge on the French coast.
  fr: >-
    La plus grande colonie de fous de Bassan de France et le dernier refuge du macareux sur le littoral
    français.
  de: >-
    Frankreichs größte Basstölpelkolonie und die letzte Zuflucht des Papageitauchers an der französischen
    Küste.
  it: >-
    La maggiore colonia di sule della Francia e l'ultimo rifugio della pulcinella di mare sulla costa
    francese.
  pt: A maior colónia de gansos-patola de França e o último refúgio do fradinho no litoral francês.
