unico:
  es: >-
    Un macizo de más de mil especies de plantas, con decenas de endemismos, y un cañón, el de Rugova, abierto
    en caliza triásica con cuevas que llevan trece kilómetros de galerías exploradas.
  en: >-
    A massif harboring over a thousand plant species, dozens of endemics, and the Rugova Canyon carved in
    Triassic limestone with thirteen kilometres of explored cave galleries.
  fr: >-
    Un massif abritant plus de mille espèces végétales et des dizaines d'endémiques, et le canyon de Rugova
    taillé dans le calcaire triasique avec treize kilomètres de galeries spéléologiques.
  de: >-
    Ein Hochgebirge mit über tausend Pflanzenarten, Dutzenden Endemiten und der Rugova-Schlucht im Triaskalk
    mit dreizehn Kilometern erforschter Höhlengänge.
  it: >-
    Un massiccio con oltre mille specie vegetali, decine di endemismi e il canyon di Rugova scavato nei
    calcari triassici con tredici chilometri di gallerie esplorate.
  pt: >-
    Um maciço com mais de mil espécies botânicas, dezenas de endemismos e o canhão de Rugova talhado em
    calcário triássico com treze quilómetros de galerias espeleológicas exploradas.
observaciones:
