    La primera zona es de protección estricta, y fuera de ella solo caben las actividades compatibles con la
    conservación, como el ecoturismo y la agricultura tradicional.
texto:
  es:
    intro: >-
      En el extremo occidental de Kosovo, donde el país se pega a las fronteras de Albania y Montenegro, las
      montañas caen casi en vertical hacia los valles. Son las Bjeshkët e Nemuna, y su cumbre, Gjeravica,
      alcanza 2656 metros. Su parque nacional ocupa 62.488 hectáreas repartidas entre los municipios de
      Gjakovë, Junik, Deçan, Pejë e Istog, y reúne bosques bien conservados, especies endémicas y relictas, y
      un relieve, unas aguas y unos paisajes ricos. En sus bosques pueden verse el lince, el oso pardo, el
      lobo, el corzo y el águila real.
    landscape: >-
      Para el informe de la naturaleza de Kosovo, estas montañas son uno de los macizos balcánicos más
      característicos por la diversidad de su flora. Su relieve quebrado y el amplio rango de altitudes han
      creado condiciones favorables para una biodiversidad rica. Cerca del paso de Qafa e Morinës, a 1385
      metros, empieza el límite que describe la ley del parque.


      El cañón de Rugova es la gran obra del agua. Lo cavó la erosión vertical del río, sobre todo en caliza
      triásica, antes y después de la época glaciar. Es famoso por sus manantiales, sus cascadas y sus cuevas:
      dos cascadas y la cueva Gryka e Madhe son lo más visitado. La cueva se abre en el octavo kilómetro del
      cañón, en la margen izquierda del río Lumbardh, y los espeleólogos han explorado unos trece kilómetros
      de galerías. En la cueva Kallabe se hallaron restos arqueológicos de gente antigua.
    wildlife: >-
      La lista de fauna es larga: ocho especies de peces, trece de anfibios, diez de reptiles, 178 de aves, 37
      de mamíferos y 129 de mariposas. Las más representativas son el [lince](/especie/lynx_lynx/) balcánico,
      el [oso pardo](/especie/ursus_arctos/), el [corzo](/especie/capreolus_capreolus/), el
      [rebeco](/especie/rupicapra_rupicapra/), el [águila imperial](/especie/aquila_heliaca/), el [águila
      real](/especie/aquila_chrysaetos/), el [cernícalo primilla](/especie/falco_naumanni/) y el
      [urogallo](/especie/tetrao_urogallus/). También se citan el [lobo](/especie/canis_lupus/) y el
      [ciervo](/especie/cervus_elaphus/) entre las especies que habitan en sus bosques.


      Entre las plantas, el informe ha contado más de mil especies, 33 endémicas y seis subendémicas, y solo
      en la zona alpina y subalpina 128 endemismos balcánicos. Una de ellas es Sempervivum kosaninii, y entre
      las reliquias terciarias están el carpe negro y el carpe blanco.
    visit: >-
      La agencia de medioambiente propone elaborar y publicar un mapa detallado de senderismo del parque, con
      todas sus atracciones y senderos.


      En la zona de gestión activa la ley permite ecoturismo y agricultura tradicional, siempre que no
      contradigan los fines de la protección. La administración del parque tiene su sede en Pejë, y la agencia
      proyectó visitas educativas de protección de la naturaleza para comunidades y estudiantes.
    history: >-
      La ley declara el parque nacional porque combina un gran número de ecosistemas forestales importantes y
      otros ecosistemas conservados, con muchas especies endémicas y relictas. La primera zona comprende
      hábitats silvestres con plantas y animales raros o amenazados y goza de protección estricta. El cañón de
      Rugova se declaró monumento natural en 1985 y hoy está dentro del parque.


      El informe de la naturaleza señala los problemas: tala ilegal, construcciones ilegales, apertura de
      caminos, canteras y fuegos. Dentro del parque funcionan dos canteras, una a 500 metros y otra a 150
      metros del borde, y la fragmentación de hábitats por las carreteras puede dificultar la migración de
      muchas especies. El Instituto de Protección de la Naturaleza de Kosovo vigila de forma continua la
      fauna.
    before: >-
      La primera zona es de protección estricta, y fuera de ella solo caben las actividades compatibles con la
      conservación, como el ecoturismo y la agricultura tradicional.
    around: >-
      El [Parque Nacional de Prokletije](/lugar/nacionalni-park-prokletije-parku-kombetar-i/) y el [Parque
      Nacional de los Alpes Albaneses - Valbona y Theth](/lugar/parku-kombetar-i-alpeve-te-shqiperise/) están,
      según los datos, a un kilómetro de distancia. A seis kilómetros queda la [Reserva Natural Estricta del
      Río Gashi](/lugar/rezervati-natyror-i-strazuar-lumi-i/), a veinticuatro el [Monumento Natural de las
      Cascadas del Mirusha](/lugar/monumenti-i-natyres-ujvarat-e-mirushes/), a veinticinco el [Parque Natural
      de los Montes Komovi](/lugar/park-prirode-komovi/) y a veintisiete la [Meseta Kárstica de
      Sinjajevina](/lugar/sinjajevina-karst-plateau/).


      Más lejos, el [Parque Nacional Montañas de Măcin](/lugar/parcul-national-muntii-macinului/) y el [Parque
      Nacional del Bükk](/lugar/bukki-nemzeti-park/) comparten con él el águila imperial.
  en:
    intro: >-
      In the far western corner of Kosovo, where the national frontier abuts Albania and Montenegro, sheer
      mountain walls plunge vertically towards glacial valleys. These are the Bjeshkët e Nemuna, culminating
      at Gjeravica at 2656 metres. The national park encompasses 62,488 hectares spread across the
      municipalities of Gjakovë, Junik, Deçan, Pejë, and Istog, protecting pristine forests, glacial
      landforms, rare endemic and relict species, and dramatic gorges. These woodlands harbour Balkan lynx,
      brown bear, wolf, roe deer, and golden eagle.
    landscape: >-
      Kosovo's national nature reports highlight this massif as one of the most distinctive in the Balkans due
      to its extraordinary botanical diversity. Broken glacial relief and extensive vertical range foster
      exceptional microclimatic niches. Near Qafa e Morinës pass at 1385 metres begins the legal boundary
      defined by the national park statute.


      The Rugova Canyon represents the masterwork of water erosion. Carved through Triassic limestone by
      fluvial action before and after the Ice Age, it is renowned for resurgences, waterfalls, and caves: two
      prominent waterfalls and the Gryka e Madhe cavern are major visitor highlights. The cave opens at the
      eighth kilometre of the gorge on the left bank of the Lumbardh River, where speleologists have mapped
      some thirteen kilometres of subterranean galleries. Prehistoric human artefacts have been excavated
      within Kallabe Cave.
    wildlife: >-
      Faunal biodiversity is remarkable: eight fish species, thirteen amphibians, ten reptiles, 178 birds, 37
      mammals, and 129 butterflies. Flagship species include the Balkan [lynx](/especie/lynx_lynx/), [brown
      bear](/especie/ursus_arctos/), [roe deer](/especie/capreolus_capreolus/), [Balkan
      chamois](/especie/rupicapra_rupicapra/), [eastern imperial eagle](/especie/aquila_heliaca/), [golden
      eagle](/especie/aquila_chrysaetos/), [lesser kestrel](/especie/falco_naumanni/), and [western
      capercaillie](/especie/tetrao_urogallus/). The [grey wolf](/especie/canis_lupus/) and [red
      deer](/especie/cervus_elaphus/) inhabit the deep interior forests.


      Over one thousand vascular plant species have been documented, including 33 strictly endemic and six
      subendemic taxa; the alpine and subalpine belts alone harbour 128 Balkan endemics. Notable endemics
      include Sempervivum kosaninii, while Tertiary relicts include hop hornbeam and European hornbeam.
    visit: >-
      The national environmental agency plans a comprehensive hiking and topographic map detailing trails,
      trailheads, and alpine landmarks.


      Within the active management zone, legislation permits sustainable ecotourism and traditional pastoral
      farming, provided they do not conflict with conservation mandates. Park administration is based in Pejë,
      which coordinates educational outreach for local communities and visiting students.
    history: >-
      National park legislation protects the range for its complex mosaic of virgin forest ecosystems and rich
      glacial habitats. Zone I encompasses pristine wilderness with strictly protected rare species. Rugova
      Canyon was initially designated a natural monument in 1985 and is now incorporated within the national
      park.


      Conservation reports highlight recurring challenges: illegal logging, unauthorized construction,
      quarrying, and forest fires. Two active quarries operate within the park perimeter, one 500 metres and
      another 150 metres from the park boundary. The Kosovo Nature Protection Institute maintains systematic
      wildlife monitoring.
    before: >-
      Zone I is strictly protected; elsewhere, only conservation-compatible activities like ecotourism and
      traditional grazing are permitted.
    around: >-
      [Prokletije National Park](/lugar/nacionalni-park-prokletije-parku-kombetar-i/) and the [Albanian Alps
      National Park - Valbona and Theth](/lugar/parku-kombetar-i-alpeve-te-shqiperise/) lie just one kilometre
      away. Six kilometres away lies [Gashi River Strict Nature
      Reserve](/lugar/rezervati-natyror-i-strazuar-lumi-i/), twenty-four kilometres away is [Mirusha
      Waterfalls Natural Monument](/lugar/monumenti-i-natyres-ujvarat-e-mirushes/), twenty-five kilometres
      away is [Komovi Nature Park](/lugar/park-prirode-komovi/), and twenty-seven kilometres away is the
      [Sinjajevina Karst Plateau](/lugar/sinjajevina-karst-plateau/). Farther afield, [Măcin Mountains
      National Park](/lugar/parcul-national-muntii-macinului/) and [Bükk National
      Park](/lugar/bukki-nemzeti-park/) share eastern imperial eagles.
  fr:
    intro: >-
      À l'extrémité occidentale du Kosovo, là où le pays borde l'Albanie et le Monténégro, les falaises
      plongent à pic vers les vallées glaciaires. Ce sont les Bjeshkët e Nemuna, dont la cime, la Gjeravica,
      s'élève à 2656 mètres. Son parc national couvre 62 488 hectares répartis sur les communes de Gjakovë,
      Junik, Deçan, Pejë et Istog, abritant forêts primaires, flore endémique et relique, et reliefs
      spectaculaires. Ses forêts hébergent le lynx, l'ours brun, le loup, le chevreuil et l'aigle royal.
    landscape: >-
      Selon le rapport national sur la nature, ces montagnes forment l'un des massifs balkaniques les plus
      riches sur le plan floristique. Le relief accidenté et le fort étagement altitudinal créent des biotopes
      propices à une biodiversité exceptionnelle. Près du col de Qafa e Morinës, à 1385 mètres, débute la
      limite officielle fixée par la loi du parc.


      Le canyon de Rugova est l'œuvre majeure de l'érosion torrentielle. Creusé dans les calcaires triasiques
      avant et après les glaciations, il est renommé pour ses cascades et ses grottes : deux cascades et la
      cavité de Gryka e Madhe sont très prisées. Cette dernière s'ouvre au huitième kilomètre du défilé sur la
      rive gauche du Lumbardh, totalisant treize kilomètres de galeries explorées. La grotte de Kallabe a
      livré des vestiges archéologiques préhistoriques.
    wildlife: >-
      L'inventaire faunistique recense huit espèces de poissons, treize d'amphibiens, dix de reptiles, 178
      d'oiseaux, 37 de mammifères et 129 de papillons. Parmi les plus emblématiques figurent le
      [lynx](/especie/lynx_lynx/) des Balkans, l'[ours brun](/especie/ursus_arctos/), le
      [chevreuil](/especie/capreolus_capreolus/), le [chamois](/especie/rupicapra_rupicapra/), l'[aigle
      impérial](/especie/aquila_heliaca/), l'[aigle royal](/especie/aquila_chrysaetos/), le [faucon
      crécerellette](/especie/falco_naumanni/) et le [grand tétras](/especie/tetrao_urogallus/). Le [loup
      gris](/especie/canis_lupus/) et le [cerf élaphe](/especie/cervus_elaphus/) peuplent également ces
      forêts.


      On dénombre plus de mille espèces végétales, 33 endémiques et six subendémiques, les étages alpin et
      subalpin comptant à eux seuls 128 endémiques balkaniques, dont Sempervivum kosaninii, avec des reliques
      tertiaires comme l'ostryer et le charme.
    visit: >-
      L'agence environnementale préconise l'édition d'une carte détaillée des sentiers de randonnée pour
      valoriser les attraits du parc.


      Dans la zone de gestion active, la législation autorise l'écotourisme et le pastoralisme traditionnel
      dans le respect des objectifs de conservation. La direction du parc siège à Pejë et organise des actions
      de sensibilisation scolaire.
    history: >-
      Le parc national a été établi pour protéger ce vaste ensemble forestier et ses écosystèmes alpins
      préservés. La zone I englobe des milieux intouchés placés sous réserve intégrale. Le canyon de Rugova
      fut classé monument naturel en 1985 et s'intègre aujourd'hui au parc.


      Le bilan environnemental signale divers défis : coupes illégales, constructions sauvages, carrières et
      incendies. Deux carrières fonctionnent dans le parc, l'une à 500 mètres et l'autre à 150 mètres de la
      limite. L'Institut de protection de la nature assure un suivi régulier de la grande faune.
    before: >-
      La zone I est sous protection intégrale ; au-delà, seules les activités compatibles avec la
      conservation, comme l'écotourisme et l'élevage extensif, sont permises.
    around: >-
      Le [parc national de Prokletije](/lugar/nacionalni-park-prokletije-parku-kombetar-i/) et le [parc
      national des Alpes albanaises - Valbona et Theth](/lugar/parku-kombetar-i-alpeve-te-shqiperise/) ne sont
      qu'à un kilomètre. À six kilomètres s'étend la [réserve naturelle intégrale de la rivière
      Gashi](/lugar/rezervati-natyror-i-strazuar-lumi-i/), à vingt-quatre le [monument naturel des cascades de
      la Mirusha](/lugar/monumenti-i-natyres-ujvarat-e-mirushes/), à vingt-cinq le [parc naturel des monts
      Komovi](/lugar/park-prirode-komovi/) et à vingt-sept le [plateau karstique de
      Sinjajevina](/lugar/sinjajevina-karst-plateau/). Plus loin, le [parc national des monts
      Măcin](/lugar/parcul-national-muntii-macinului/) et le [parc national du
      Bükk](/lugar/bukki-nemzeti-park/) partagent l'aigle impérial.
  de:
    intro: >-
      Im äußersten Westen des Kosovo, wo das Land an Albanien und Montenegro grenzt, stürzen Felswände steil
      in die Täler ab. Dies sind die Bjeshkët e Nemuna, deren höchster Gipfel, die Gjeravica, 2656 Meter
      erreicht. Der Nationalpark umfasst 62.488 Hektar in den Gemeinden Gjakovë, Junik, Deçan, Pejë und Istog
      und schützt Urwälder, Endemiten, Relikte und Glaziallandschaften. In diesen Wäldern streifen
      Balkanluchs, Braunbär, Wolf, Reh und Steinadler.
    landscape: >-
      Im kosovarischen Naturschutzbericht gilt dieses Gebirge wegen seiner Pflanzenvielfalt als eines der
      bemerkenswertesten des Balkans. Schroffes Relief und enorme Höhenunterschiede schaffen ideale Nischen
      für Artenreichtum. Nahe dem Pass Qafa e Morinës auf 1385 Metern beginnt die gesetzliche Parkgrenze.


      Die Rugova-Schlucht ist das Meisterwerk der Tiefenerosion im Triaskalk, geformt vor und nach den
      Eiszeiten. Sie ist berühmt für Quellen, Kaskaden und Höhlen: Zwei Wasserfälle und die Höhle Gryka e
      Madhe sind Hauptanziehungspunkte. Die Höhle öffnet sich bei Kilometer acht der Schlucht am linken Ufer
      des Lumbardh mit rund dreizehn Kilometern erkundeter Gänge. In der Kallabe-Höhle wurden prähistorische
      Artefakte entdeckt.
    wildlife: >-
      Die Tierwelt ist artenreich: acht Fischarten, dreizehn Amphibien, zehn Reptilien, 178 Vogelarten, 37
      Säugetiere und 129 Schmetterlinge. Kennzeichnend sind der Balkan-[Luchs](/especie/lynx_lynx/),
      [Braunbär](/especie/ursus_arctos/), das [Reh](/especie/capreolus_capreolus/), die
      [Balkangämse](/especie/rupicapra_rupicapra/), der [Kaiseradler](/especie/aquila_heliaca/), der
      [Steinadler](/especie/aquila_chrysaetos/), der [Rötelfalke](/especie/falco_naumanni/) und das
      [Auerhuhn](/especie/tetrao_urogallus/). Auch [Wolf](/especie/canis_lupus/) und
      [Rothirsch](/especie/cervus_elaphus/) leben in den Wäldern.


      Über tausend Pflanzenarten wurden nachgewiesen, darunter 33 Endemiten und sechs Subendemiten; alpine
      Lagen zählen 128 balkanische Endemiten wie Sempervivum kosaninii, ergänzt durch tertiäre Relikte wie
      Hopfenbuche und Hainbuche.
    visit: >-
      Die Umweltagentur plant eine detaillierte Wanderkarte des Nationalparks mit allen Pfaden und
      Sehenswürdigkeiten.


      In der aktiven Managementzone erlaubt das Gesetz Ökotourismus und traditionelle Almwirtschaft im
      Einklang mit Schutzzielen. Die Parkverwaltung in Pejë führt Bildungsprojekte für Schulen und Gemeinden
      durch.
    history: >-
      Das Schutzgebiet wurde ausgewiesen, um Urwälder und alpine Habitate mit seltenen Arten dauerhaft zu
      sichern. Zone I unterliegt strengem Vollschutz. Die Rugova-Schlucht wurde bereits 1985 zum Naturdenkmal
      erklärt und ist heute Teil des Nationalparks.


      Der Umweltbericht benennt Gefährdungen: Holzdiebstahl, illegale Bauten und Steinbrüche. Zwei Steinbrüche
      arbeiten im Park, 500 Meter und 150 Meter vom Rand entfernt. Das Institut für Naturschutz des Kosovo
      überwacht die Wildtierbestände fortlaufend.
    before: >-
      Zone I steht unter strengem Vollschutz; andernorts sind nur naturverträgliche Nutzungen wie sanfter
      Tourismus und Beweidung gestattet.
    around: >-
      Der [Nationalpark Prokletije](/lugar/nacionalni-park-prokletije-parku-kombetar-i/) und der [Nationalpark
      Albanische Alpen – Valbona und Theth](/lugar/parku-kombetar-i-alpeve-te-shqiperise/) liegen nur einen
      Kilometer entfernt. Sechs Kilometer entfernt liegt das [Strenge Naturreservat
      Gashi-Fluss](/lugar/rezervati-natyror-i-strazuar-lumi-i/), vierundzwanzig Kilometer das [Naturdenkmal
      Mirusha-Wasserfälle](/lugar/monumenti-i-natyres-ujvarat-e-mirushes/), fünfundzwanzig der [Naturpark
      Komovi](/lugar/park-prirode-komovi/) und siebenundzwanzig das
      [Sinjajevina-Karstplateau](/lugar/sinjajevina-karst-plateau/). Weiter entfernt teilen der [Nationalpark
      Măcin-Gebirge](/lugar/parcul-national-muntii-macinului/) und der
      [Bükk-Nationalpark](/lugar/bukki-nemzeti-park/) den Kaiseradler.
  it:
    intro: >-
      All'estremità occidentale del Kosovo, dove il confine tocca Albania e Montenegro, le pareti rocciose
      precipitano verticali verso le valli glaciali. Sono le Bjeshkët e Nemuna, la cui vetta culminante,
      Gjeravica, tocca 2656 metri. Il parco nazionale tutela 62.488 ettari ripartiti tra i comuni di Gjakovë,
      Junik, Deçan, Pejë e Istog, custodendo foreste vetuste, endemismi botanici e forme glaciali. Nei suoi
      boschi vivono la lince, l'orso bruno, il lupo, il capriolo e l'aquila reale.
    landscape: >-
      Nel panorama naturalistico del Kosovo queste montagne costituiscono uno dei rilievi più singolari per
      ricchezza floristica. Il rilievo frastagliato e l'elevata escursione altimetrica favoriscono una
      biodiversità straordinaria. Presso il valico di Qafa e Morinës a 1385 metri inizia il perimetro
      stabilito dalla legge istitutiva.


      La forra di Rugova rappresenta il capolavoro dell'azione fluviale, incisa nei calcari triassici prima e
      dopo le glaciazioni. È celebre per risorgenze, cascate e caverne: due cascate e la grotta Gryka e Madhe
      sono i siti più celebri. La cavità si apre all'ottavo chilometro della forra lungo la sponda sinistra
      del torrente Lumbardh, con tredici chilometri di gallerie rilevate dagli speleologi. Nella grotta
      Kallabe sono riaffiorati reperti archeologici preistorici.
    wildlife: >-
      L'elenco faunistico comprende otto specie di pesci, tredici di anfibi, dieci di rettili, 178 di uccelli,
      37 di mammiferi e 129 di farfalle. Tra le specie focali spiccano la [lince](/especie/lynx_lynx/)
      balcanica, l'[orso bruno](/especie/ursus_arctos/), il [capriolo](/especie/capreolus_capreolus/), il
      [camoscio](/especie/rupicapra_rupicapra/), l'[aquila imperiale](/especie/aquila_heliaca/), l'[aquila
      reale](/especie/aquila_chrysaetos/), il [grillaio](/especie/falco_naumanni/) e il [gallo
      cedrone](/especie/tetrao_urogallus/). Nei boschi risiedono pure il [lupo](/especie/canis_lupus/) e il
      [cervo](/especie/cervus_elaphus/).


      Si contano oltre mille specie botaniche, con 33 endemismi e sei subendemismi; i piani alpino e subalpino
      accolgono 128 endemismi balcanici quali Sempervivum kosaninii, assieme a relitti terziari come il
      carpinella e il carpino bianco.
    visit: >-
      L'ente ambientale programma la pubblicazione di una carta escursionistica dettagliata con sentieri e
      attrattive.


      Nella zona di gestione attiva la legge autorizza l'ecoturismo e le pratiche agricole tradizionali
      conformi alla tutela. La sede amministrativa si trova a Pejë, attiva anche in percorsi didattici per
      scolaresche.
    history: >-
      Il parco è stato istituito per salvaguardare foreste primigenie e ambienti montani incontaminati. La
      zona I a protezione integrale tutela gli habitat più fragili. La forra di Rugova fu dichiarata monumento
      naturale nel 1985 ed è oggi parte integrante del parco.


      Il rapporto sullo stato dell'ambiente evidenzia criticità: tagli abusivi, costruzioni abusive e attività
      estrattive. Due cave operano all'interno, a 500 metri e a 150 metri dal margine. L'Istituto per la
      Protezione della Natura monitora costantemente la fauna.
    before: >-
      La zona I è sottoposta a riserva integrale; altrove sono ammesse soltanto attività ecocompatibili quali
      escursionismo e pastorizia.
    around: >-
      Il [Parco Nazionale di Prokletije](/lugar/nacionalni-park-prokletije-parku-kombetar-i/) e il [Parco
      Nazionale delle Alpi Albanesi - Valbona e Theth](/lugar/parku-kombetar-i-alpeve-te-shqiperise/) distano
      appena un chilometro. A sei chilometri si trova la [Riserva Naturale Integrale del Fiume
      Gashi](/lugar/rezervati-natyror-i-strazuar-lumi-i/), a ventiquattro il [Monumento Naturale delle Cascate
      della Mirusha](/lugar/monumenti-i-natyres-ujvarat-e-mirushes/), a venticinque il [Parco Naturale dei
      Monti Komovi](/lugar/park-prirode-komovi/) e a ventisette l'[Altopiano Carsico di
      Sinjajevina](/lugar/sinjajevina-karst-plateau/). Più a nord-est, il [Parco Nazionale Monti
      Măcin](/lugar/parcul-national-muntii-macinului/) e il [Parco Nazionale del
      Bükk](/lugar/bukki-nemzeti-park/) condividono l'aquila imperiale.
  pt:
    intro: >-
      No extremo ocidental do Kosovo, onde o território confina com a Albânia e o Montenegro, as vertentes
      rochosas descem em abismo para os vales glaciares. São as Bjeshkët e Nemuna, cujo pico supremo, a
      Gjeravica, atinge 2656 metros. O parque nacional resguarda 62.488 hectares repartidos pelos municípios
      de Gjakovë, Junik, Deçan, Pejë e Istog, protegendo matas pristinas, espécies endémicas e relíquias,
      relevo glaciar e desfiladeiros. Nestes bosques vivem o lince, o urso-pardo, o lobo, o corço e a
      águia-real.
    landscape: >-
      Nos relatórios ambientais kosovares, estas montanhas destacam-se como um dos maciços mais singulares dos
      Balcãs pela sua riqueza florística. O relevo acidentado e o grande desnível altitudinal geram condições
      ímpares de biodiversidade. Próximo do colo de Qafa e Morinës, a 1385 metros, tem início o perímetro
      traçado na lei de criação do parque.


      O desfiladeiro de Rugova é o expoente da erosão fluvial, escavado em calcários triássicos antes e depois
      das glaciações. Notabiliza-se pelas nascentes, cascatas e grutas: duas cascatas e a caverna Gryka e
      Madhe são os atrativos principais. A cavidade abre-se ao oitavo quilómetro da garganta, na margem
      esquerda do rio Lumbardh, com treze quilómetros de galerias mapeadas. Na gruta de Kallabe recolheram-se
      vestígios arqueológicos ancestrais.
    wildlife: >-
      A diversidade faunística soma oito espécies de peixes, treze de anfíbios, dez de répteis, 178 de aves,
      37 de mamíferos e 129 de borboletas. Sobressaem o [lince](/especie/lynx_lynx/) balcânico, o
      [urso-pardo](/especie/ursus_arctos/), o [corço](/especie/capreolus_capreolus/), a
      [camurça](/especie/rupicapra_rupicapra/), a [águia-imperial-oriental](/especie/aquila_heliaca/), a
      [águia-real](/especie/aquila_chrysaetos/), o [frisada](/especie/falco_naumanni/) e o
      [tetraz-grande](/especie/tetrao_urogallus/). O [lobo](/especie/canis_lupus/) e o
      [veado-vermelho](/especie/cervus_elaphus/) habitam os bosques profundos.


      Registam-se mais de mil espécies vegetais, 33 endémicas e seis subendémicas; os andares alpino e
      subalpino acolhem 128 endemismos balcânicos como Sempervivum kosaninii, além de relíquias terciárias
      como a carpa-oriental e o falso-marmeleiro.
    visit: >-
      A agência ambiental propõe editar uma carta pedestre pormenorizada com os trilhos e miradouros do
      parque.


      Na zona de gestão ativa a lei autoriza ecoturismo e agropecuária tradicional conformes com os desígnios
      ecológicos. A administração do parque localiza-se em Pejë, organizando ações de educação ambiental para
      escolas e comunidades.
    history: >-
      A classificação legal visa conservar florestas virgens e ecossistemas alpinos frágeis. A Zona I
      compreende áreas selvagens sob proteção integral estrita. O desfiladeiro de Rugova foi declarado
      monumento natural em 1985, integrando hoje o parque.


      O diagnóstico ambiental enumera pressões: abate clandestino de madeira, construções ilegais e exploração
      de inertes. Funcionam duas pedreiras no parque, a 500 metros e a 150 metros do limite exterior. O
      Instituto de Proteção da Natureza monitoriza a fauna de forma contínua.
    before: >-
      A Zona I constitui reserva integral; nas restantes áreas apenas se toleram atividades compatíveis com a
      preservação, como ecoturismo e pastoreio.
    around: >-
      O [Parque Nacional de Prokletije](/lugar/nacionalni-park-prokletije-parku-kombetar-i/) e o [Parque
      Nacional dos Alpes Albaneses - Valbona e Theth](/lugar/parku-kombetar-i-alpeve-te-shqiperise/) situam-se
      a apenas um quilómetro. A seis quilómetros fica a [Reserva Natural Integral do Rio
      Gashi](/lugar/rezervati-natyror-i-strazuar-lumi-i/), a vinte e quatro o [Monumento Natural das Cascatas
      de Mirusha](/lugar/monumenti-i-natyres-ujvarat-e-mirushes/), a vinte e cinco o [Parque Natural dos
      Montes Komovi](/lugar/park-prirode-komovi/) e a vinte e sete o [Planalto Cárstico de
      Sinjajevina](/lugar/sinjajevina-karst-plateau/). Mais longe, o [Parque Nacional das Montanhas de
      Măcin](/lugar/parcul-national-muntii-macinului/) e o [Parque Nacional de
      Bükk](/lugar/bukki-nemzeti-park/) partilham a águia-imperial.
