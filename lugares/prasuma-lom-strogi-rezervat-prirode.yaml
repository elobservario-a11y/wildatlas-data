texto:
  es:
    intro: >-
      En 1905, cuando casi nadie hablaba de proteger bosques, alguien propuso dejar en paz una ladera de la
      Klekovača. Es la idea más antigua de este tipo que se conoce en la región, e incluso fuera de ella. Más
      de un siglo después, el resultado es Lom: 297,8 hectáreas de bosque primario de haya, abeto y pícea en
      el oeste de la República Srpska, en los Dinaridas interiores, que forman una reserva natural estricta.
      Aquí no se trabaja ni se corta: la naturaleza decide.
    landscape: >-
      Lom está en las laderas del macizo de Klekovača, sobre la cresta de Lom-planina, entre 1.250 y 1.522
      metros de altitud. La Klekovača es una montaña de los Alpes Dináricos cuyo punto más alto, Velika
      Klekovača, llega a 1.969 metros. El sustrato es de caliza, y por eso el relieve está muy desarrollado y
      en parte muy karstificado, con muchos fenómenos kársticos. La caliza deja pasar el agua, pero aun así
      hay dos pequeños manantiales y varias cuevas, algunas con nieve perpetua.


      Sobre esa roca crece el bosque. El 75 % de la reserva es la mezcla típica de estas montañas dináricas:
      haya, abeto y pícea, entre 1250 y 1420 metros, sobre todo en laderas al norte y noroeste. Por masa de
      madera manda la pícea, con el 40 %, seguida del abeto, con el 38 %, y del haya, con el 22 %. Más arriba,
      entre 1420 y 1522 metros, ocupa el 18 % un hayedo subalpino con mucho arce sicómoro. El bosque está en
      el límite de la provincia ilírica, y aquí termina el área de distribución de algunas especies ilirias.
    wildlife: >-
      Lo que define a Lom no son los animales sino lo que crece sobre los árboles. Los hongos que cubren los
      troncos son prueba de que es un bosque primario: se han contado 306 especies de hongos, más de 1000 de
      plantas y 59 de aves. Entre los árboles figuran el [abeto blanco](/especie/abies_alba/), el arce real,
      el arce blanco, la haya común y la pícea común, y en el sotobosque hay anémona de bosque, ajuga y saúco
      negro.


      Entre los grandes mamíferos de la reserva figuran el [oso](/especie/ursus_arctos/) y el
      [lince](/especie/lynx_lynx/). La mejor época para acercarse va de junio a octubre.
    visit: >-
      Esta es una reserva estricta, no un parque con senderos. Está destinada exclusivamente a conservar la
      naturaleza original, los recursos genéticos y los procesos ecológicos, y a los estudios científicos que
      no alteren sus valores. Las condiciones de visita y los sectores abiertos al público dependen del
      gestor, la empresa Šume Republike Srpske, a través de la unidad forestal «Oštrelj-Drinić», con sede en
      Drinić.
    history: >-
      Las primeras ideas de proteger la Klekovača datan de 1905, y los primeros pasos se dieron en 1910, en
      una asamblea de la Sociedad Zoológico-Botánica de Austria. En 1956 se protegió como reserva natural
      estricta, donde se prohíbe cualquier actividad económica y cualquier obra que perturbe la libre acción
      de la naturaleza, aunque esa protección no tuvo continuidad jurídica. Cuando se declaró, en Drinić
      funcionaba una estación experimental del Instituto de Silvicultura e Industria de la Madera de Sarajevo.


      La reserva obtuvo su estatus actual el 23 de mayo de 2013, y desde entonces hay un plan de gestión para
      el periodo 2014-2029. Dentro de ella hay un núcleo separado, una reserva de vida salvaje de 55,8
      hectáreas, en la categoría Ia de la UICN. Desde 2008 se aplica además en el país un proyecto del Banco
      Mundial para reforzar la gestión sostenible de los recursos naturales de bosques y montañas.
    before: >-
      Antes de organizar la salida, pide al gestor las condiciones de visita y los sectores abiertos al
      público.
    around: >-
      A once kilómetros está el [Parque Nacional Una - Curso Alto y
      Cascadas](/lugar/nacionalni-park-una---gorji-tok/), y a veintiocho el [Nacimiento del Una — monumento
      natural](/lugar/vrelo-une/). Entre los bosques primarios lejanos, la [Reserva Natural Estricta
      Havešová](/lugar/narodna-prirodna-rezervacia-havesova/), la [Reserva Natural Integral de Sasso
      Fratino](/lugar/riserva-naturale-integrale-di-sasso-fratino/), el [Bosque Primario de
      Strâmbu-Băiuț](/lugar/codrul-secular-strambu-baiut/) y el [Bosque Virgen de
      Perućica](/lugar/prasuma-perucica---nacionalni-park-sutjeska/) comparten con Lom el abeto blanco, el
      haya y el hábitat de bosque primario.
  en:
    intro: >-
      In 1905, when almost no one spoke of preserving forests, someone suggested leaving a slope of Klekovača
      undisturbed. It is the earliest recorded idea of this kind in the region, and even beyond. More than a
      century later, the outcome is Lom: 297.8 hectares of primeval beech, fir, and spruce forest in western
      Republika Srpska, in the inner Dinarides, forming a strict nature reserve. No forestry or logging occurs
      here: nature decides.
    landscape: >-
      Lom clings to the slopes of the Klekovača massif, upon the crest of Lom-planina, between 1,250 and 1,522
      metres altitude. Klekovača is a Dinaric peak whose culminating point, Velika Klekovača, reaches 1,969
      metres. The substrate is limestone, resulting in well-developed and heavily karstified relief displaying
      numerous karst phenomena. Limestone is permeable, yet two small springs emerge alongside several caves,
      some holding perpetual snow.


      Upon this rock thrives the forest. Some 75% of the reserve consists of the typical Dinaric montane
      mixture: beech, fir, and spruce, between 1250 and 1420 metres, primarily on northern and northwestern
      aspects. By timber volume spruce dominates with 40%, followed by fir at 38%, and beech at 22%. Higher
      up, between 1420 and 1522 metres, subalpine beech forest rich in sycamore maple covers 18%. The forest
      stands at the threshold of the Illyrian province, marking the limit of distribution for several Illyrian
      species.
    wildlife: >-
      What defines Lom is not its fauna but what grows upon the trees. The fungi encrusting the trunks attest
      to its primeval nature: 306 species of fungi, over 1000 plant species, and 59 bird species have been
      recorded. Tree species include the [silver fir](/especie/abies_alba/), Norway maple, sycamore maple,
      European beech, and Norway spruce, with wood anemone, bugleweed, and black elder forming the
      undergrowth.


      Among the reserve's large mammals roam the [brown bear](/especie/ursus_arctos/) and the [Eurasian
      lynx](/especie/lynx_lynx/). The best period to visit is from June to October.
    visit: >-
      This is a strict nature reserve, not a recreation park equipped with trails. It is devoted exclusively
      to safeguarding pristine nature, genetic resources, and natural ecological processes, as well as to
      non-destructive scientific research. Visiting conditions and any sectors accessible to the public depend
      upon the managing entity, the public forestry enterprise Šume Republike Srpske, through its forestry
      unit 'Oštrelj-Drinić' based in Drinić.
    history: >-
      The initial ideas for protecting Klekovača date back to 1905, with formal groundwork laid in 1910 at an
      assembly of the Austro-Hungarian Zoological-Botanical Society. In 1956 it received protection as a
      strict nature reserve, barring all economic activity and development that might interfere with natural
      wilderness processes, though legal continuity subsequently lapsed. At the time of declaration, Drinić
      housed a research outpost of Sarajevo's Forestry and Timber Industry Institute.


      The reserve secured its present legal standing on 23 May 2013, guided since by a management plan for the
      2014-2029 period. Within it lies an isolated core, a wilderness sanctuary of 55.8 hectares designated
      under IUCN Category Ia. Since 2008, a World Bank project has additionally operated in the country to
      bolster sustainable natural resource management in forest and mountain ecosystems.
    before: >-
      Before organising an outing, request visiting terms and any areas accessible to the public directly from
      the managing authority.
    around: >-
      Eleven kilometres away lies [Una National Park - Upper Reaches and
      Waterfalls](/lugar/nacionalni-park-una---gorji-tok/), and twenty-eight kilometres away stands the
      [Spring of the Una — Natural Monument](/lugar/vrelo-une/). Among distant primeval forests, the [Havešová
      Strict Nature Reserve](/lugar/narodna-prirodna-rezervacia-havesova/), the [Sasso Fratino Integral Nature
      Reserve](/lugar/riserva-naturale-integrale-di-sasso-fratino/), the [Strâmbu-Băiuț Primeval
      Forest](/lugar/codrul-secular-strambu-baiut/), and the [Perućica Primeval
      Forest](/lugar/prasuma-perucica---nacionalni-park-sutjeska/) share with Lom the silver fir, European
      beech, and old-growth woodland habitat.
  fr:
    intro: >-
      En 1905, alors que presque personne n'évoquait la préservation des forêts, quelqu'un proposa de laisser
      en paix un versant de la Klekovača. C'est l'initiative de ce genre la plus ancienne connue dans la
      région, et sans doute au-delà. Plus d'un siècle après, le fruit en est Lom : 297,8 hectares de forêt
      primaire de hêtres, sapins et épicéas dans l'ouest de la République serbe de Bosnie, au cœur des Alpes
      Dinariques intérieures, constituant une réserve naturelle intégrale. Nul n'y abat d'arbre ni n'y
      travaille : la nature y règne sans partage.
    landscape: >-
      Lom s'étend sur les flancs du massif de la Klekovača, sur la crête de Lom-planina, entre 1 250 et 1 522
      mètres d'altitude. La Klekovača est une montagne des Alpes Dinariques dont le sommet, Velika Klekovača,
      culmine à 1 969 mètres. Le substrat est calcaire, engendrant un relief vigoureux et intensément
      karstifié où abondent les morphologies karstiques. Si le calcaire absorbe l'eau, on dénombre néanmoins
      deux petites sources et plusieurs cavités, certaines conservant des névés permanents.


      Sur cette roche pousse la forêt. Quelque 75 % de la réserve est formé du mélange dinarique classique :
      hêtre, sapin et épicéa, entre 1250 et 1420 mètres, surtout en exposition nord et nord-ouest. En volume
      de bois, l'épicéa domine avec 40 %, suivi du sapin avec 38 % et du hêtre avec 22 %. Plus haut, entre
      1420 et 1522 mètres, une hêtraie subalpine abondamment pourvue en érables sycomores occupe 18 %. Le
      massif borde la province illyrienne, marquant la limite de répartition de plusieurs taxons illyriens.
    wildlife: >-
      Ce qui caractérise Lom n'est pas tant sa faune que ce qui s'épanouit sur ses troncs. Les champignons
      colonisant les écorces prouvent le caractère primaire du peuplement : on recense 306 espèces de
      champignons, plus de 1000 espèces végétales et 59 espèces d'oiseaux. Parmi les arbres se distinguent le
      [sapin blanc](/especie/abies_alba/), l'érable plane, l'érable sycomore, le hêtre commun et l'épicéa
      commun, tandis que le sous-bois abrite l'anémone sylvie, l'ajuga et le sureau noir.


      Parmi les grands mammifères de la réserve figurent l'[ours brun](/especie/ursus_arctos/) et le [lynx
      boréal](/especie/lynx_lynx/). La période la plus favorable pour s'en approcher court de juin à octobre.
    visit: >-
      Il s'agit d'une réserve intégrale, non d'un parc aménagé avec des sentiers balisés. Elle est vouée
      exclusivement à la préservation de la nature vierge, des ressources génétiques et des dynamiques
      écologiques, ainsi qu'aux études scientifiques sans impact. Les modalités de visite et les éventuels
      secteurs autorisés au public dépendent du gestionnaire, l'entreprise Šume Republike Srpske, par le biais
      de son antenne forestière « Oštrelj-Drinić » sise à Drinić.
    history: >-
      Les premières réflexions visant à protéger la Klekovača remontent à 1905, et les premières démarches
      concrètes virent le jour en 1910 lors d'une assemblée de la Société zoologique et botanique d'Autriche.
      En 1956, le site fut classé en réserve naturelle intégrale, interdisant toute activité économique et
      tout aménagement susceptible d'entraver le libre cours de la nature, même si ce statut connut des
      vicissitudes juridiques. Lors du classement, Drinić accueillait une station d'expérimentation de
      l'Institut de sylviculture et de l'industrie du bois de Sarajevo.


      La réserve a acquis son statut actuel le 23 mai 2013, encadrée depuis par un plan de gestion pour la
      période 2014-2029. Elle englobe un noyau préservé, une réserve de vie sauvage de 55,8 hectares classée
      en catégorie Ia de l'UICN. Depuis 2008, un programme de la Banque mondiale est en outre déployé dans le
      pays pour renforcer la gestion durable des ressources naturelles des forêts et montagnes.
    before: >-
      Avant d'envisager tout déplacement, renseignez-vous auprès du gestionnaire sur les modalités d'accès et
      les secteurs éventuellement ouverts au public.
    around: >-
      À onze kilomètres se trouve le [Parc national de l'Una - Cours supérieur et
      cascades](/lugar/nacionalni-park-una---gorji-tok/), et à vingt-huit kilomètres la [Source de l'Una —
      Monument naturel](/lugar/vrelo-une/). Parmi les forêts primaires lointaines, la [Réserve naturelle
      intégrale de Havešová](/lugar/narodna-prirodna-rezervacia-havesova/), la [Réserve naturelle intégrale de
      Sasso Fratino](/lugar/riserva-naturale-integrale-di-sasso-fratino/), la [Forêt primaire de
      Strâmbu-Băiuț](/lugar/codrul-secular-strambu-baiut/) et la [Forêt primaire de
      Perućica](/lugar/prasuma-perucica---nacionalni-park-sutjeska/) partagent avec Lom le sapin blanc, le
      hêtre et l'habitat forestier séculaire.
  de:
    intro: >-
      Im Jahr 1905, als kaum jemand an Waldschutz dachte, schlug jemand vor, einen Hang der Klekovača
      unberührt zu lassen. Es ist der älteste überlieferte Gedanke dieser Art in der Region und weit darüber
      hinaus. Mehr als ein Jahrhundert später ist das Ergebnis Lom: 297,8 Hektar Urwald aus Buchen, Tannen und
      Fichten im Westen der Republika Srpska in den inneren Dinariden, geschützt als strenges Naturreservat.
      Hier wird weder gewirtschaftet noch gerodet: Die Natur entscheidet.
    landscape: >-
      Lom erstreckt sich an den Hängen des Klekovača-Massivs über den Kamm der Lom-planina zwischen 1.250 und
      1.522 Metern Seehöhe. Die Klekovača ist ein Berg der Dinariden, dessen höchster Punkt, Velika Klekovača,
      1.969 Meter erreicht. Der Untergrund besteht aus Kalkstein; daher ist das Relief ausgeprägt und stark
      verkarstet, mit zahlreichen Karstphänomenen. Der Kalkstein lässt Wasser rasch versickern, doch gibt es
      zwei kleine Quellen und etliche Höhlen, manche mit ewigem Schnee.


      Auf diesem Fels wächst der Wald. Rund 75 % des Schutzgebiets nimmt die für diese Dinarischen Gebirge
      typische Mischung ein: Buche, Tanne und Fichte zwischen 1250 und 1420 Metern, vor allem an Nord- und
      Nordwesthängen. Nach Holzmasse führt die Fichte mit 40 %, gefolgt von der Tanne mit 38 % und der Buche
      mit 22 %. Weiter oben, zwischen 1420 und 1522 Metern, nehmen subalpine Buchenwälder mit reichem
      Berg-Ahorn-Anteil 18 % ein. Der Wald liegt an der Grenze der illyrischen Florenprovinz, wo das
      Verbreitungsgebiet einiger illyrischer Arten endet.
    wildlife: >-
      Was Lom auszeichnet, sind weniger die Tiere als das, was auf den Stämmen wächst. Die Pilze, die das
      Totholz überziehen, belegen den Urwaldcharakter: 306 Pilzarten, über 1000 Pflanzenarten und 59
      Vogelarten wurden dokumentiert. Zu den Baumarten zählen die [Weiß-Tanne](/especie/abies_alba/),
      Spitz-Ahorn, Berg-Ahorn, Rotbuche und Gemeine Fichte; in der Krautschicht wachsen Buschwindröschen,
      Günsel und Schwarzer Holunder.


      Zu den Großsäugern des Schutzgebiets gehören der [Braunbär](/especie/ursus_arctos/) und der [Eurasischer
      Luchs](/especie/lynx_lynx/). Die beste Zeit für eine Annäherung reicht von Juni bis Oktober.
    visit: >-
      Dies ist ein strenges Naturreservat, kein mit Wanderwegen erschlossener Park. Es dient ausschließlich
      der Bewahrung der ursprünglichen Natur, der genetischen Ressourcen und der ökologischen Prozesse sowie
      wissenschaftlichen Forschungen, die seine Werte nicht beeinträchtigen. Die Zugangsbedingungen und
      eventuell für die Öffentlichkeit freigegebene Bereiche obliegen der Verwaltung, dem Forstunternehmen
      Šume Republike Srpske über die Forsteinheit «Oštrelj-Drinić» mit Sitz in Drinić.
    history: >-
      Erste Überlegungen zum Schutz der Klekovača stammen aus dem Jahr 1905; konkrete Schritte folgten 1910
      bei einer Versammlung der Zoologisch-Botanischen Gesellschaft in Wien. Im Jahr 1956 wurde das Gebiet als
      strenges Naturreservat ausgewiesen, in dem jede wirtschaftliche Nutzung und jeder Eingriff in die freie
      Naturentwicklung untersagt war, wenngleich der Schutz rechtlich zwischenzeitlich lückenhaft blieb. Zum
      Zeitpunkt der Unterschutzstellung unterhielt das Institut für Forst- und Holzwirtschaft aus Sarajevo
      eine Versuchsstation in Drinić.


      Seinen heutigen Status erhielt das Schutzgebiet am 23. Mai 2013, seither begleitet von einem
      Managementplan für den Zeitraum 2014-2029. Im Inneren liegt eine gesonderte Kernzone, ein
      Wildnisreservat von 55,8 Hektar der IUCN-Kategorie Ia. Seit 2008 läuft im Land zudem ein Projekt der
      Weltbank zur Stärkung der nachhaltigen Bewirtschaftung von Wald- und Gebirgsressourcen.
    before: >-
      Erkundige dich vor einer Tour bei der Verwaltung nach den Zugangsbedingungen und den für Besucher
      zugelassenen Bereichen.
    around: >-
      Elf Kilometer entfernt liegt der [Una-Nationalpark – Oberlauf und
      Wasserfälle](/lugar/nacionalni-park-una---gorji-tok/) und achtundzwanzig Kilometer entfernt die
      [Una-Quelle – Naturdenkmal](/lugar/vrelo-une/). Unter den fernen Urwäldern teilen das [Strenges
      Naturreservat Havešová](/lugar/narodna-prirodna-rezervacia-havesova/), das [Integrales Naturreservat
      Sasso Fratino](/lugar/riserva-naturale-integrale-di-sasso-fratino/), der [Urwald
      Strâmbu-Băiuț](/lugar/codrul-secular-strambu-baiut/) und der [Urwald
      Perućica](/lugar/prasuma-perucica---nacionalni-park-sutjeska/) mit Lom die Weiß-Tanne, die Rotbuche und
      den Urwaldlebensraum.
  it:
    intro: >-
      Nel 1905, quando quasi nessuno parlava di tutelare le foreste, qualcuno propose di lasciare intatto un
      versante della Klekovača. È la più antica testimonianza di questo tipo nota nella regione, e persino
      oltre confine. Più di un secolo dopo, il frutto di quell'idea è Lom: 297,8 ettari di foresta primordiale
      di faggio, abete e abete rosso nell'ovest della Republika Srpska, nelle Dinaridi interne, che compongono
      una riserva naturale integrale. Qui non si lavora né si taglia legna: la natura decide ogni cosa.
    landscape: >-
      Lom sorge sui pendii del massiccio della Klekovača, lungo la dorsale di Lom-planina, tra 1.250 e 1.522
      metri di quota. La Klekovača è una montagna delle Alpi Dinariche la cui vetta più alta, Velika
      Klekovača, raggiunge i 1.969 metri. Il substrato è calcareo, cosicché il rilievo risulta assai
      sviluppato e intensamente carsificato, ricco di fenomeni carsici. Il calcare lascia filtrare l'acqua, ma
      si contano comunque due piccole sorgenti e varie grotte, alcune con nevi perenni.


      Su questa roccia alligna la foresta. Il 75% della riserva ospita la tipica mescolanza dinarica: faggio,
      abete e abete rosso, tra 1250 e 1420 metri, soprattutto sui versanti settentrionali e nord-occidentali.
      In volume legnoso primeggia l'abete rosso col 40%, seguito dall'abete col 38% e dal faggio col 22%. Più
      in quota, tra 1420 e 1522 metri, una faggeta subalpina con abbondante acero di monte occupa il 18%. La
      foresta segna il confine della provincia illirica, arrestando l'areale di alcune specie illiriche.
    wildlife: >-
      Ciò che contraddistingue Lom non sono gli animali, bensì ciò che cresce sugli alberi. I funghi che
      ricoprono i fusti testimoniano l'autenticità primordiale del bosco: vi si contano 306 specie di funghi,
      oltre 1000 di piante e 59 di uccelli. Tra le essenze arboree figurano l'[abete
      bianco](/especie/abies_alba/), l'acero riccio, l'acero di monte, il faggio comune e l'abete rosso,
      mentre nel sottobosco allignano anemone dei boschi, bugula e sambuco nero.


      Tra i grandi mammiferi della riserva figurano l'[orso bruno](/especie/ursus_arctos/) e la [lince
      europea](/especie/lynx_lynx/). La stagione ideale per avvicinarsi va da giugno a ottobre.
    visit: >-
      Questa è una riserva naturale integrale, non un parco provvisto di sentieri. È destinata esclusivamente
      alla salvaguardia della natura vergine, delle risorse genetiche e dei processi ecologici, oltre a
      ricerche scientifiche che non ne alterino i valori. I criteri di accesso e gli eventuali settori aperti
      al pubblico dipendono dall'ente gestore, l'azienda Šume Republike Srpske, tramite l'unità forestale
      «Oštrelj-Drinić» con sede a Drinić.
    history: >-
      Le prime proposte di tutela della Klekovača risalgono al 1905, e i primi passi formali furono mossi nel
      1910 durante un'assemblea della Società Zoologico-Botanica d'Austria. Nel 1956 fu istituita la riserva
      naturale integrale, precludendo ogni attività economica e qualsiasi opera che alterasse il libero corso
      della natura, sebbene tale vincolo abbia subito interruzioni legali. All'atto della proclamazione, a
      Drinić operava una stazione sperimentale dell'Istituto di Selvicoltura e Industria del Legno di
      Sarajevo.


      La riserva ha conseguito l'assetto odierno il 23 maggio 2013, regolata da allora da un piano di gestione
      per il periodo 2014-2029. Al suo interno è compreso un nucleo separato, una riserva di vita selvatica di
      55,8 ettari ascritta alla categoria Ia della IUCN. Dal 2008 è inoltre attivo nel paese un progetto della
      Banca Mondiale volto a potenziare la gestione sostenibile delle risorse forestali e montane.
    before: >-
      Prima di pianificare l'uscita, richiedi all'ente gestore le condizioni di visita e gli eventuali settori
      accessibili al pubblico.
    around: >-
      A undici chilometri sorge il [Parco nazionale dell'Una - Corso superiore e
      cascate](/lugar/nacionalni-park-una---gorji-tok/), e a ventotto la [Sorgente dell'Una — Monumento
      naturale](/lugar/vrelo-une/). Tra le foreste primordiali remote, la [Riserva naturale integrale di
      Havešová](/lugar/narodna-prirodna-rezervacia-havesova/), la [Riserva naturale integrale di Sasso
      Fratino](/lugar/riserva-naturale-integrale-di-sasso-fratino/), la [Foresta primordiale di
      Strâmbu-Băiuț](/lugar/codrul-secular-strambu-baiut/) e la [Foresta primordiale di
      Perućica](/lugar/prasuma-perucica---nacionalni-park-sutjeska/) condividono con Lom l'abete bianco, il
      faggio e l'habitat di foresta vetusta.
  pt:
    intro: >-
      Em 1905, quando quase ninguém falava de proteger florestas, alguém propôs deixar intacta uma encosta da
      Klekovača. É a mais antiga iniciativa deste tipo registada na região, e inclusive além das suas
      fronteiras. Mais de um século depois, o resultado é Lom: 297,8 hectares de floresta primária de faia,
      abeto e espruce no oeste da República Sérvia, nos Alpes Dináricos interiores, formando uma reserva
      natural estrita. Aqui não se trabalha nem se abate madeira: a natureza decide.
    landscape: >-
      Lom estende-se pelas encostas do maciço de Klekovača, sobre a crista de Lom-planina, entre 1.250 e 1.522
      metros de altitude. A Klekovača é uma montanha dos Alpes Dináricos cujo ponto mais alto, Velika
      Klekovača, atinge 1.969 metros. O substrato é calcário, pelo que o relevo está muito desenvolvido e
      fortemente carsificado, exibindo múltiplos fenómenos cársticos. O calcário é permeável, mas ainda assim
      existem duas pequenas nascentes e várias cavernas, algumas com neves perpétuas.


      Sobre esta rocha desenvolve-se a floresta. Cerca de 75% da reserva acolhe a composição típica das
      montanhas dináricas: faia, abeto e espruce, entre 1250 e 1420 metros, sobretudo nas encostas viradas a
      norte e noroeste. Em volume de madeira predomina o espruce, com 40%, seguido do abeto, com 38%, e da
      faia, com 22%. Mais acima, entre 1420 e 1522 metros, um faial subalpino com abundante plátano-bastardo
      ocupa 18%. A floresta encontra-se no limite da província ilírica, onde termina a área de distribuição de
      algumas espécies ilíricas.
    wildlife: >-
      O que distingue Lom não são tanto os animais, mas o que prolifera sobre as árvores. Os fungos que
      recobrem os troncos comprovam a condição de floresta primária: foram identificadas 306 espécies de
      fungos, mais de 1000 de plantas e 59 de aves. Entre as árvores contam-se o
      [abeto-branco](/especie/abies_alba/), o bordo-da-noruega, o plátano-bastardo, a faia-europeia e o
      espruce, albergando o sub-bosque anémona-dos-bosques, búrgula e sabugueiro-preto.


      Entre os grandes mamíferos da reserva destacam-se o [urso-pardo](/especie/ursus_arctos/) e o
      [lince-euroasiático](/especie/lynx_lynx/). A melhor época para uma aproximação decorre de junho a
      outubro.
    visit: >-
      Esta é uma reserva estrita, não um parque com trilhos turísticos. Destina-se exclusivamente a conservar
      a natureza primitiva, os recursos genéticos e os processos ecológicos, bem como a investigações
      científicas que não afetem os seus valores. As condições de visita e os setores eventualmente acessíveis
      ao público dependem da entidade gestora, a empresa Šume Republike Srpske, através da unidade florestal
      «Oštrelj-Drinić», sediada em Drinić.
    history: >-
      As primeiras ideias de proteção da Klekovača datam de 1905, tendo sido dados passos concretos em 1910
      numa assembleia da Sociedade Zoológico-Botânica da Áustria. Em 1956 foi classificada como reserva
      natural estrita, interditando qualquer atividade económica ou intervenção suscetível de perturbar a
      dinâmica natural, ainda que essa proteção tenha sofrido descontinuidades jurídicas. Aquando da
      declaração, funcionava em Drinić uma estação experimental do Instituto de Silvicultura e Indústria da
      Madeira de Sarajevo.


      A reserva obteve o seu estatuto atual a 23 de maio de 2013, dispondo desde então de um plano de gestão
      para o período 2014-2029. No seu interior existe um núcleo autónomo, uma reserva de vida selvagem de
      55,8 hectares na categoria Ia da UICN. Desde 2008 vigora no país um projeto do Banco Mundial para
      reforçar a gestão sustentável dos recursos florestais e de montanha.
    before: >-
      Antes de planeares a deslocação, solicita à entidade gestora as condições de visita e os setores
      eventualmente acessíveis ao público.
    around: >-
      A onze quilómetros fica o [Parque Nacional de Una - Curso Superior e
      Cascatas](/lugar/nacionalni-park-una---gorji-tok/), e a vinte e oito a [Nascente do Una — Monumento
      Natural](/lugar/vrelo-une/). Entre as florestas primárias distantes, a [Reserva Natural Estrita de
      Havešová](/lugar/narodna-prirodna-rezervacia-havesova/), a [Reserva Natural Integral de Sasso
      Fratino](/lugar/riserva-naturale-integrale-di-sasso-fratino/), a [Floresta Primária de
      Strâmbu-Băiuț](/lugar/codrul-secular-strambu-baiut/) e a [Floresta Virgem de
      Perućica](/lugar/prasuma-perucica---nacionalni-park-sutjeska/) partilham com Lom o abeto-branco, a faia
      e o habitat de floresta primitiva.
