  es: Impresionante ladera montañosa cubierta de hayedos viejos con afloramientos graníticos declarada UNESCO.
  en: Spectacular mountain slope clothed in ancient beechwoods with granite outcrops, inscribed by UNESCO.
  fr: >-
    Versant montagneux spectaculaire couvert de vieilles hêtraies et d’affleurements granitiques, classé par
    l’UNESCO.
  de: Spektakuläre Berghänge mit uralten Buchenwäldern und Granitfelsen, von der UNESCO als Welterbe geschützt.
  it: >-
    Spettacolare versante montuoso rivestito da faggete vetuste e affioramenti granitici, dichiarato
    patrimonio UNESCO.
  pt: >-
    Vertente montanhosa espetacular coberta de faganais vetustos com afloramentos graníticos, declarada
    património UNESCO.
unico:
  es: >-
    Hayedos de ladera tan empinada que quedaron a salvo, hoy parte de los hayedos primarios que la UNESCO
    protege en Europa.
  en: >-
    Beech forests on slopes so precipitous that loggers could not touch them, now protected under UNESCO
    European primeval beech forests.
  fr: >-
    Des hêtraies de pente si abruptes qu’elles ont échappé aux coupes, intégrées aux forêts primaires de
    hêtres protégées par l’UNESCO en Europe.
  de: >-
    Steilhänge, die so unzugänglich waren, dass die Buchenwälder erhalten blieben und heute zum
    UNESCO-Welterbe der Buchenurwälder Europas zählen.
  it: >-
    Faggete di pendio talmente scoscese da essere scampate al disboscamento, oggi tutelate tra le faggete
    primarie europee dell’UNESCO.
  pt: >-
    Faganais de encosta tão íngremes que escaparam aos abates madeireiros, hoje integrados nas florestas
    primárias de faias protegidas pela UNESCO na Europa.
observaciones:
  es: >-
    En toda la reserva solo se puede andar por las rutas señalizadas, y salvo Viničná cesta, que admite
    bicicletas, es solo para peatones. Las pendientes son fuertes y el tiempo cambia en minutos; con nieve los
    caminos se vuelven impracticables. Se aconseja llegar en transporte público: hay estaciones de tren en
    Oldřichov v Hájích, Hejnice, Bílý Potok pod Smrkem y Raspenava.
texto:
  es:
    intro: >-
      Hay bosques que el ser humano no tocó porque no pudo. En el norte de los montes Jizera, las laderas son
      tan empinadas que los hayedos de Jizerskohorské bučiny se libraron de buena parte de la tala, y el
      resultado es una reserva de 27 km² que en julio de 2021 fue el primer sitio natural checo inscrito en la
      Lista del Patrimonio Mundial de la UNESCO. Aquí no encuentras un parque con paseos fáciles, sino un
      bosque mixto, sobre todo de haya, con cascadas, torres de roca y miradores a los que se llega por
      escaleras y escalas.
    landscape: >-
      La historia empieza bajo tierra. Hace unos 325 millones de años, durante la orogenia herciniana, el
      magma granítico subió desde las profundidades. Mucho después, los glaciares continentales de las
      glaciaciones Halstrovská y Sálská llegaron hasta estas montañas. Entre una cosa y otra, la meteorización
      fue labrando torres y murallas de roca desde finales del Terciario. Por eso hay tantos riscos y
      miradores: toda la reserva es una colección de formas de granito.


      El agua hace el resto. La precipitación media anual ronda los 1000 mm y las aguas van a la cuenca del
      Báltico. En esas pendientes caen cascadas: Velký Štolpich, de unos 30 m, es la mayor de los montes
      Jizera; la de Černý potok, de 8 m, es la de más caudal y la más empinada, con un gran bloque en el
      centro. La reserva va de 360 m, cerca de la casa forestal Dubina, a 1006 m en Polední kameny. Solo
      Šolcův rybník, de 7 ha y del siglo XVII, rompe el bosque con una lámina de agua.
    wildlife: >-
      Los árboles más abundantes en el pasado eran la pícea, el [abeto blanco](/especie/abies_alba/) y el
      haya, con la pícea en las zonas duras de montaña. Entre las plantas raras están Lunaria rediviva, el
      lirio martagón y Dentaria enneaphyllos. Las piceas con helecho necesitan clima frío y húmedo, y el
      helecho de montaña domina su sotobosque.


      Entre las aves de los hayedos figuran la [cigüeña negra](/especie/ciconia_nigra/), el azor, el halcón
      abejero, el [milano real](/especie/milvus_milvus/), el [pito negro](/especie/dryocopus_martius/), el
      mochuelo boreal y el papamoscas papirrojo. Las rocas y el borde del bosque acogen al [búho
      real](/especie/bubo_bubo/) y al cuervo, y en los arroyos viven el [mirlo
      acuático](/especie/cinclus_cinclus/) y la lavandera cascadeña. Hay también la [salamandra
      común](/especie/salamandra_salamandra/) y el lución, y entre los mamíferos, lirón gris, [murciélago de
      Bechstein](/especie/myotis_bechsteinii/), zorro, [marta](/especie/martes_martes/) y
      [ciervo](/especie/cervus_elaphus/). En Šolcův rybník sobrevive una población viable de cangrejo de río
      autóctono.


      La fauna actual se mantiene desde hace unos siete mil años, salvo los grandes depredadores que exterminó
      el ser humano.
    visit: >-
      Casi todo lo bueno son miradores y agua. Krásná Máří es un mirador con vista al valle de Štolpich y a
      Hejnice con su basílica; Ořešník es el rey de los miradores de roca. Polední kameny es la formación
      rocosa más alta de los hayedos, y Frýdlantské cimbuří debe su nombre a su parecido con las almenas del
      castillo de Frýdlant.


      Hay dos sendas interpretadas. El sendero didáctico Přirozený les recorre dos kilómetros solo a pie, con
      dificultad alta, con escaleras y escalas hasta miradores rocosos, y explica la naturaleza del extremo
      occidental de los montes Jizera. El sendero didáctico Oldřichovské bučiny va del collado de Oldřichov a
      Skalní hrad, pasando por la roca Gorila y Lysé skály, con 18 paradas interactivas. Y un tercer camino
      bordea el cercado de caza de Clam-Gallas, de mediados del siglo XIX, y lleva con seguridad desde
      Oldřichov v Hájích hasta el collado.
    history: >-
      El ser humano no entró en estos hayedos hasta el siglo XIV. En el siglo XVI llegaron los vidrieros, que
      usaban la madera para potasa y como combustible de sus hornos, hasta principios del siglo XX, y la tala
      dejó una huella que aún se lee en el bosque: muchos monumentos que recuerdan la muerte de leñadores.
      Buscar esos pomníčky, pequeños monumentos a leñadores caídos, a enfrentamientos entre furtivos y guardas
      o a suicidas, es una actividad popular. A finales de los años treinta se levantó además una línea de
      búnkeres que entra en el oeste de la reserva.


      La reserva nació el 16 de agosto de 1999 al fundirse siete reservas anteriores, y los núcleos de
      Poledník y Štolpichy, con una evolución natural desde 1960, forman el sitio UNESCO, de 634 ha con su
      zona de protección. No es un sitio aislado: se sumó a los bosques protegidos bajo el nombre de Hayedos
      primarios de los Cárpatos y otras regiones de Europa. El plan de gestión apunta a una gestión sin
      intervención en las zonas núcleo, dejando la madera muerta, útil para aves, invertebrados y hongos
      raros. Queda un problema: el exceso de ungulados impide la regeneración del bosque, y se quiere eliminar
      el muflón que se soltó en estas montañas.
    before: >-
      En toda la reserva solo se puede andar por las rutas señalizadas, y salvo Viničná cesta, que admite
      bicicletas, es solo para peatones. Las pendientes son fuertes y el tiempo cambia en minutos; con nieve
      los caminos se vuelven impracticables. Se aconseja llegar en transporte público: hay estaciones de tren
      en Oldřichov v Hájích, Hejnice, Bílý Potok pod Smrkem y Raspenava.
    around: >-
      El [Macizo de Krkonoše / Karkonosze](/lugar/krkonose---karkonosze-high-massif/) está a unos 18 km, y
      algo más lejos queda el [Parque Paisajístico del Valle del
      Bóbr](/lugar/park-krajobrazowy-doliny-bobru/). Con el [Bosque Virgen de
      Boubín](/lugar/boubinsky-prales/), Jizerskohorské bučiny comparte el mochuelo chico y el bosque primario
      de montaña.
  en:
    intro: >-
      There are forests that humankind left untouched simply because it was impossible to reach them. Across
      the northern flank of the Jizera Mountains, the slopes drop so steeply that the beechwoods of
      Jizerskohorské bučiny were spared from commercial felling, yielding a 27 km² nature reserve that in July
      2021 became Czechia’s very first natural UNESCO World Heritage Site. You will not find easy park
      pathways here, but rather a wild mixed forest dominated by beech, punctuated by cataracts, granite
      towers, and craggy outlooks accessible solely via steep stone stairways and metal ladders.
    landscape: >-
      The deep story began far beneath the surface. Roughly 325 million years ago, during the Variscan
      orogeny, molten granitic magma welled up from the depths. Much later, continental ice sheets from the
      Elsterian and Saalian glaciations advanced right up to these northern slopes. Between ice and frost,
      weathering has sculpted towers and ramparts of stone since late Tertiary times. That is why rocky crags
      and scenic lookouts abound: the entire reserve is an outdoor showcase of sculpted granite formations.


      Water does the rest. Mean annual precipitation hovers around 1000 mm, draining northward toward the
      Baltic Sea basin. Along these steep gradients, waterfalls plunge: Velký Štolpich, dropping around 30 m,
      is the grandest waterfall in the Jizera Mountains; Černý potok falls 8 m, boasting the strongest flow
      and steepest gradient around a giant granite boulder split down its centre. The reserve spans an
      elevation from 360 m near the Dubina forestry lodge up to 1006 m atop Polední kameny. Only the historic
      7 ha pond of Šolcův rybník, dating from the seventeenth century, opens up the continuous forest canopy
      with open water.
    wildlife: >-
      Historically, the most abundant canopy trees were Norway spruce, [silver fir](/especie/abies_alba/), and
      European beech, with spruce crowning the harsh montane crests. Botanical treasures include perennial
      honesty, martagon lily, and nine-leaved toothwort. Spruce-fern associations demand cold, wet
      microclimates, where mountain male fern carpets the forest floor.


      Avian life in these mature beech forests includes the [black stork](/especie/ciconia_nigra/), northern
      goshawk, European honey buzzard, [red kite](/especie/milvus_milvus/), [black
      woodpecker](/especie/dryocopus_martius/), boreal owl, and red-breasted flycatcher. Granite tors and
      forest clearings provide nesting cliffs for the [Eurasian eagle-owl](/especie/bubo_bubo/) and common
      raven, while rushing torrents harbour the [white-throated dipper](/especie/cinclus_cinclus/) and grey
      wagtail. Both the [fire salamander](/especie/salamandra_salamandra/) and slow worm are common, alongside
      mammals such as edible dormouse, [Bechstein's bat](/especie/myotis_bechsteinii/), red fox, [European
      pine marten](/especie/martes_martes/), and [red deer](/especie/cervus_elaphus/). Within Šolcův rybník, a
      viable population of native noble crayfish thrives.


      Except for apex predators eradicated by human hunting, the present faunal assemblage has endured
      virtually unchanged for some seven thousand years.
    visit: >-
      Most highlights combine rock outcrops and rushing water. Krásná Máří is a panoramic vantage point
      offering vistas across the Štolpich valley down to the basilica of Hejnice; Ořešník reigns as the
      grandest rock overlook. Polední kameny forms the highest granite formation in the beechwoods, while
      Frýdlantské cimbuří owes its name to its resemblance to the battlements of Frýdlant Castle.


      Two interpretive trails explore the reserve. The Přirozený les educational trail covers two kilometres
      exclusively on foot, featuring demanding sections with ladders and steep rock scrambles up to scenic
      lookouts that illuminate the wild western edge of the Jizera range. The Oldřichovské bučiny educational
      trail runs from the Oldřichov pass to Skalní hrad, passing Gorilla rock and Lysé skály across 18
      interactive interpretation stations. A third trail traces the perimeter of the mid-nineteenth-century
      Clam-Gallas game enclosure, guiding hikers safely from Oldřichov v Hájích up to the pass.
    history: >-
      Humankind did not venture into these primeval beechwoods until the fourteenth century. In the sixteenth
      century glassmakers arrived, cutting timber for potash and fueling glassworks until the dawn of the
      twentieth century. The forest retains haunting traces of those logging eras: numerous wayside monuments
      commemorating fallen woodsmen. Searching for these pomníčky—modest stone monuments commemorating
      woodsmen killed on the job, fatal skirmishes between gamekeepers and poachers, or suicides—is a
      cherished local tradition. In the late thirties a chain of border fortifications was erected, entering
      the western fringe of the reserve.


      The modern reserve was created on 16 August 1999 by consolidating seven older protected areas. Its
      strictly preserved cores at Poledník and Štolpichy, in natural succession since 1960, comprise the 634
      ha UNESCO World Heritage site and its protective buffer. It is part of the trans-European network
      Ancient and Primeval Beech Forests of the Carpathians and Other Regions of Europe. Active management
      prioritizes non-intervention throughout the core, leaving standing deadwood for birds, wood-boring
      insects, and fungi. One major challenge persists: overabundant ungulates browse young saplings, and
      efforts continue to cull non-native mouflon released into these mountains.
    before: >-
      Throughout the nature reserve you may hike solely on marked trails; with the exception of the Viničná
      cesta, which accommodates bicycles, all paths are strictly pedestrian. Gradients are steep and weather
      changes within minutes; under snow and ice, trails become treacherous. Arriving by public transport is
      recommended, with railway stations in Oldřichov v Hájích, Hejnice, Bílý Potok pod Smrkem, and Raspenava.
    around: >-
      The [Krkonoše / Karkonosze High Massif](/lugar/krkonose---karkonosze-high-massif/) lies some 18 km away,
      and slightly farther spreads the [Bóbr Valley Landscape Park](/lugar/park-krajobrazowy-doliny-bobru/).
      With the [Boubín Primeval Forest](/lugar/boubinsky-prales/), Jizerskohorské bučiny shares the Eurasian
      pygmy owl and primeval montane forest.
  fr:
    intro: >-
      Il existe des forêts que l’être humain n’a pas exploitées simplement parce qu’il ne le pouvait pas. Dans
      le nord des monts Jizera, les pentes sont si raides que les hêtraies de Jizerskohorské bučiny ont
      échappé à la majeure partie des coupes, formant une réserve de 27 km² devenue en juillet 2021 le premier
      site naturel tchèque inscrit sur la Liste du patrimoine mondial de l’UNESCO. Vous n’y trouverez pas
      d’allées douces, mais une forêt mixte dominée par le hêtre, ponctuée de cascades, de tours rocheuses et
      de belvédères accessibles par des escaliers abrupts et des échelles de fer.
    landscape: >-
      L’histoire commence sous terre. Il y a environ 325 millions d’années, durant l’orogenèse hercynienne, un
      magma granitique a surgi des profondeurs. Bien plus tard, les glaciers continentaux des glaciations de
      l’Elster et de la Saale ont atteint ces contreforts. Entre froid et gel, l’érosion a sculpté tours et
      murailles de pierre depuis la fin du Tertiaire. C’est pourquoi les falaises et miradors sont si nombreux
      : toute la réserve forme une collection de reliefs granitiques remarquables.


      L’eau façonne le reste. Les précipitations annuelles moyennes tournent autour de 1000 mm et s’écoulent
      vers le bassin de la Baltique. Sur ces pentes abruptes grondent des cascades : Velký Štolpich, haute
      d’environ 30 m, est la plus grande des monts Jizera ; celle de Černý potok, de 8 m, offre le débit le
      plus puissant et la plus forte inclinaison autour d’un bloc rocheux central. La réserve s’échelonne de
      360 m, près de la maison forestière de Dubina, jusqu’à 1006 m à Polední kameny. Seul l’étang de Šolcův
      rybník, couvrant 7 ha et datant du dix-septième siècle, perce le couvert forestier d’un plan d’eau.
    wildlife: >-
      Autrefois, les arbres les plus abondants étaient l’épicéa, le [sapin blanc](/especie/abies_alba/) et le
      hêtre, l’épicéa régnant sur les crêtes soumises au rude climat de montagne. Parmi les raretés botaniques
      figurent la lunaire vivace, le lis martagon et la dentaire à neuf folioles. Les pessières à fougères
      exigent un climat froid et humide, où la fougère de montagne domine le sous-bois.


      Parmi les oiseaux des hêtraies nichent la [cigogne noire](/especie/ciconia_nigra/), l’autour des
      palombes, la bondrée apivore, le [milan royal](/especie/milvus_milvus/), le [pic
      noir](/especie/dryocopus_martius/), la chouette de Tengmalm et le gobe-mouche nain. Les falaises et
      lisières abritent le [hibou grand-duc](/especie/bubo_bubo/) et le grand corbeau, tandis que les torrents
      accueillent le [cincle plongeur](/especie/cinclus_cinclus/) et la bergeronnette des ruisseaux. On y
      croise la [salamandre tachetée](/especie/salamandra_salamandra/) et l’orvet, ainsi que des mammifères
      tels que le loir gris, le [murin de Bechstein](/especie/myotis_bechsteinii/), le renard roux, la [martre
      des pins](/especie/martes_martes/) et le [cerf élaphe](/especie/cervus_elaphus/). Dans le Šolcův rybník
      survit une population florissante d’écrevisses à pattes blanches indigènes.


      À l’exception des grands carnivores éliminés par l’homme, la faune actuelle est demeurée inchangée
      depuis environ sept mille ans.
    visit: >-
      L’essentiel de la découverte réside dans les belvédères et les eaux vives. Krásná Máří est un
      promontoire surplombant la vallée de Štolpich et Hejnice avec sa basilique ; Ořešník trône au sommet des
      belvédères rocheux. Polední kameny constitue la formation granitique la plus élevée des hêtraies, tandis
      que Frýdlantské cimbuří tire son nom de sa ressemblance avec les créneaux du château de Frýdlant.


      Deux sentiers pédagogiques parcourent les lieux. Le sentier didactique Přirozený les s’étend sur deux
      kilomètres exclusivement à pied, de difficulté soutenue, muni d’échelles et d’escaliers menant à des
      belvédères rocheux pour expliquer la dynamique naturelle de l’ouest des monts Jizera. Le sentier
      didactique Oldřichovské bučiny relie le col d’Oldřichov à Skalní hrad en passant par le rocher du
      Gorille et les Lysé skály, jalonnant 18 stations thématiques interactives. Un troisième itinéraire longe
      la clôture de chasse de Clam-Gallas, du milieu du dix-neuvième siècle, menant en toute quiétude
      d’Oldřichov v Hájích jusqu’au col.
    history: >-
      L’homme n’a pénétré dans ces hêtraies qu’au quatorzième siècle. Au seizième siècle arrivèrent les
      verriers, exploitant le bois pour la potasse et pour alimenter leurs fours jusqu’au début du vingtième
      siècle ; l’exploitation laissa des stigmates visibles, notamment des stèles rappelant la mort de
      bûcherons. La quête de ces pomníčky—petits monuments érigés pour des bûcherons fauchés en forêt, des
      rixes sanglantes entre braconniers et gardes ou des suicides—est une tradition vivace. À la fin des
      années trente, une ligne de casemates défensives fut construite, pénétrant dans l’ouest de la réserve.


      La réserve a vu le jour le 16 août 1999 par la fusion de sept réserves antérieures. Les sanctuaires de
      Poledník et de Štolpichy, laissés en libre évolution depuis 1960, forment le bien UNESCO de 634 ha avec
      sa zone tampon. Elle s’intègre aux Forêts primaires de hêtres des Carpates et d’autres régions d’Europe.
      Le plan de gestion privilégie la non-intervention dans les zones centrales, laissant le bois mort pour
      les oiseaux, insectes et champignons rares. Un défi demeure : la surabondance de grands herbivores
      freine la régénération des jeunes pousses, incitant les gestionnaires à éliminer le mouflon introduit.
    before: >-
      Dans toute la réserve, la circulation n’est autorisée que sur les sentiers balisés, et à l’exception de
      la Viničná cesta ouverte aux vélos, l’ensemble est réservé aux marcheurs. Les pentes sont très fortes et
      la météo change en quelques minutes ; sous la neige, les passages deviennent impraticables. Il est
      recommandé de venir en transports publics : des gares ferroviaires desservent Oldřichov v Hájích,
      Hejnice, Bílý Potok pod Smrkem et Raspenava.
    around: >-
      Le [Massif de Krkonoše / Karkonosze](/lugar/krkonose---karkonosze-high-massif/) se trouve à environ 18
      km, et un peu plus loin s’étend le [Parc paysager de la vallée du
      Bóbr](/lugar/park-krajobrazowy-doliny-bobru/). Avec la [Forêt primaire de
      Boubín](/lugar/boubinsky-prales/), Jizerskohorské bučiny partage la présence de la chevêchette d’Europe
      et le caractère sauvage de la vieille forêt de montagne.
  de:
    intro: >-
      Es gibt Wälder, die der Mensch nicht anrührte, weil er es schlicht nicht konnte. An den Nordhängen des
      Isergebirges fallen die Flanken so steil ab, dass die Buchenwälder von Jizerskohorské bučiny weitgehend
      von Holzeinschlag verschont blieben. Das Ergebnis ist ein 27 km² großes Reservat, das im Juli 2021 als
      erstes Naturerbe Tschechiens in die UNESCO-Welterbeliste aufgenommen wurde. Hier erwarten dich keine
      bequemen Spazierwege, sondern ein wilder Mischwald, dominiert von Rotbuchen, durchsetzt von
      Wasserfällen, Felszacken und Aussichtspunkten, die nur über Steinstufen und Eisenleitern erreichbar
      sind.
    landscape: >-
      Die Entstehung reicht tief in die Erdgeschichte zurück. Vor rund 325 Millionen Jahren stieg während der
      variszischen Orogenese Granitmagma aus der Tiefe empor. Wesentlich später reichten die Eismassen der
      Elster- und Saale-Kaltzeit bis an diese Berge heran. Zwischen Frost und Verwitterung wurden seit dem
      ausgehenden Tertiär Felsburgen und Klippen aus dem Gestein herauspräpariert. Deshalb gibt es so viele
      Grate und Aussichtsfelsen: Das Reservat ist ein Freilichtmuseum bizarrer Granitformen.


      Das Wasser tut sein Übriges. Der mittlere Jahresniederschlag liegt um 1000 mm, und die Bäche fließen zur
      Ostsee. Über die Steilstufen stürzen Kaskaden: Der Velký Štolpich ist mit rund 30 m Fallhöhe der höchste
      Wasserfall des Isergebirges; die Kaskade am Černý potok stürzt 8 m in die Tiefe und gilt mit einem
      riesigen Felsblock im Zentrum als die wasserreichste und steilste. Das Reservat reicht von 360 m nahe
      dem Forsthaus Dubina bis auf 1006 m an den Polední kameny hinauf. Lediglich der 7 ha große Teich Šolcův
      rybník aus dem siebzehnten Jahrhundert unterbricht das geschlossene Kronendach mit einer Wasserfläche.
    wildlife: >-
      Früher dominierten Fichte, [Weißtanne](/especie/abies_alba/) und Rotbuche, wobei die Fichte die rauen
      Bergkammlagen beherrschte. Zu den seltenen Pflanzen zählen Ausdauerndes Silberblatt, Türkenbund-Lilie
      und Neunblättrige Zahnwurz. Farnreiche Fichtenbestände verlangen kühles, feuchtes Klima, und der
      Berg-Wurmfarn bedeckt dort den Waldboden.


      In den Buchenurwäldern nisten [Schwarzstorch](/especie/ciconia_nigra/), Habicht, Wespenbussard,
      [Rotmilan](/especie/milvus_milvus/), [Schwarzspecht](/especie/dryocopus_martius/), Raufußkauz und
      Zwergschnäpper. Die Felsabstürze bieten Lebensraum für [Uhu](/especie/bubo_bubo/) und Kolkrabe, während
      an den Bergbächen [Wasseramsel](/especie/cinclus_cinclus/) und Gebirgsstelze jagen. Heimisch sind auch
      [Feuersalamander](/especie/salamandra_salamandra/) und Blindschleiche; bei den Säugetieren begegnen
      einem Siebenschläfer, [Bechsteinfledermaus](/especie/myotis_bechsteinii/), Rotfuchs,
      [Baummarder](/especie/martes_martes/) und [Rothirsch](/especie/cervus_elaphus/). Im Šolcův rybník hat
      sich eine gesunde Population des heimischen Edelkrebses gehalten.


      Abgesehen von den vom Menschen ausgerotteten Großraubtieren hat die Tierwelt hier seit rund
      siebentausend Jahren nahezu unverändert überdauert.
    visit: >-
      Die Höhepunkte bestehen vor allem aus Felskanzeln und Wildbächen. Krásná Máří ist ein Aussichtspunkt mit
      Blick über das Štolpichtal und die Basilika von Hejnice; Ořešník ragt als König der Felsaussichten
      heraus. Die Polední kameny bilden die höchste Granitformation der Buchenwälder, während Frýdlantské
      cimbuří seinen Namen der Ähnlichkeit mit den Zinnen des Schlosses Frýdlant verdankt.


      Zwei Lehrpfade erschließen das Gebiet. Der Naturlehrpfad Přirozený les verläuft über zwei Kilometer
      ausschließlich zu Fuß, erfordert Trittsicherheit auf Leitern und Felssteigen und vermittelt die
      Waldökologie am Westrand des Isergebirges. Der Lehrpfad Oldřichovské bučiny führt vom Oldřichover Sattel
      zum Skalní hrad, vorbei am Gorillafelsen und den Lysé skály, ausgestattet mit 18 interaktiven Stationen.
      Ein dritter Pfad folgt der historischen Einfriedung des Wildparks Clam-Gallas aus der Mitte des
      neunzehnten Jahrhunderts und leitet Wanderer sicher von Oldřichov v Hájích auf den Bergsattel.
    history: >-
      Der Mensch drang erst im vierzehnten Jahrhundert in diese Bergwälder vor. Im sechzehnten Jahrhundert
      folgten Glasmacher, die Pottasche und Brennholz für ihre Hütten bis ins frühe zwanzigste Jahrhundert
      nutzten. Die Holzfällerei hinterließ sichtbare Spuren: zahlreiche Gedenksteine, die an den Tod von
      Holzknechten erinnern. Das Aufspüren dieser pomníčky—kleiner Monumente für verunglückte Holzfäller,
      blutige Gefechte zwischen Wilderern und Förstern oder Selbsttötungen—ist bei Wanderern sehr beliebt. In
      den späten dreißiger Jahren entstand zudem eine Linie von Betonbunkern, die den Westen des Gebiets
      durchquert.


      Das Reservat wurde am 16. August 1999 durch Zusammenlegung von sieben Schutzgebieten gegründet. Die
      Kernzonen Poledník und Štolpichy, die seit 1960 der freien Naturdynamik überlassen sind, bilden das 634
      ha große UNESCO-Areal samt Pufferzone. Es gehört zu den Alten Buchenwäldern und Buchenurwäldern der
      Karpaten und anderer Regionen Europas. Der Managementplan setzt auf Prozessschutz im Kernbereich und
      belässt Totholz für Vögel, Insekten und Pilze. Ein forstliches Problem bleibt der hohe Wildverbiss durch
      Huftiere, weshalb die hier einst ausgesetzten Mufflons reguliert werden sollen.
    before: >-
      Im gesamten Reservat darf man sich nur auf den markierten Wanderwegen bewegen; außer auf der Viničná
      cesta, die für Fahrräder freigegeben ist, sind die Pfade rein Fußgängern vorbehalten. Die Steilhänge
      sind extrem steil und das Wetter schlägt binnen Minuten um; bei Schnee werden viele Wege unpassierbar.
      Die Anreise mit öffentlichen Verkehrsmitteln wird empfohlen, Bahnstationen gibt es in Oldřichov v
      Hájích, Hejnice, Bílý Potok pod Smrkem und Raspenava.
    around: >-
      Das [Riesengebirgsmassiv / Krkonoše / Karkonosze](/lugar/krkonose---karkonosze-high-massif/) liegt etwa
      18 km entfernt, und etwas weiter breitet sich der [Landschaftspark
      Bobertal](/lugar/park-krajobrazowy-doliny-bobru/) aus. Mit dem [Urwald Boubín](/lugar/boubinsky-prales/)
      teilen die Buchenwälder des Isergebirges den Sperlingskauz und urwüchsige Bergwaldstrukturen.
  it:
    intro: >-
      Vi sono foreste che l’essere umano ha lasciato intatte semplicemente perché non riusciva a penetrarvi.
      Nel versante settentrionale dei monti Jizera, i pendii sono così ripidi che le faggete di Jizerskohorské
      bučiny furono risparmiate dai tagli forestali, dando vita a una riserva di 27 km² che nel luglio 2021 è
      divenuta il primo sito naturale della Cechia iscritto nella Lista del Patrimonio Mondiale UNESCO. Non
      troverai qui facili viali da parco, bensì un bosco misto dominato dal faggio, tra cascate scroscianti,
      torrioni di roccia e punti panoramici raggiungibili solo con scale di pietra e pioli metallici.
    landscape: >-
      La genesi affonda nel profondo della terra. Circa 325 milioni di anni fa, durante l’orogenesi ercinica,
      risalì dal mantello un imponente magma granitico. Molto tempo dopo, le calotte glaciali dell’Elster e
      della Saale lambirono queste montagne. Tra gelo e disgelo, l’erosione ha scolpito torri e bastioni di
      roccia fin dal tardo Terziario. Ecco perché guglie e belvederi sono così numerosi: l’intera riserva è
      una straordinaria rassegna di architetture granitiche.


      L’acqua compie il resto. Le precipitazioni medie annue si aggirano intorno ai 1000 mm, defluendo verso
      il bacino idrografico del Mar Baltico. Lungo questi versanti precipitano cascate: Velký Štolpich, alta
      circa 30 m, è il salto più maestoso dei monti Jizera; quella di Černý potok scende per 8 m, vantando la
      portata maggiore e la pendenza più aspra attorno a un gigantesco masso centrale. La riserva si estende
      dai 360 m, presso la guardia forestale di Dubina, fino ai 1006 m delle Polední kameny. Soltanto l’antico
      invaso di Šolcův rybník, esteso per 7 ha e risalente al diciassettesimo secolo, apre una superficie
      lacustre nel fitto del bosco.
    wildlife: >-
      Nel passato gli alberi più diffusi erano l’abete rosso, l’[abete bianco](/especie/abies_alba/) e il
      faggio, con l’abete rosso dominatore delle vette montane più aspre. Tra le rarità botaniche figurano la
      lunaria perenne, il giglio martagone e la dentaria a nove foglie. Le peccete felcite necessitano di
      clima fresco e umido, con la felce di montagna padrona del sottobosco.


      Tra i volatili delle faggete nidificano la [cicogna nera](/especie/ciconia_nigra/), l’astore, il falco
      pecchiaiolo, il [nibbio reale](/especie/milvus_milvus/), il [picchio nero](/especie/dryocopus_martius/),
      la civetta capogrosso e il pigliamosche pettirosso. Pareti rocciose e margini boschivi accolgono il
      [gufo reale](/especie/bubo_bubo/) e il corvo imperiale, mentre lungo i torrenti montani vivono il [merlo
      acquaiolo](/especie/cinclus_cinclus/) e la ballerina gialla. Frequenti sono pure la [salamandra
      pezzata](/especie/salamandra_salamandra/) e l’orbettino; tra i mammiferi popolano l’area il ghiro, il
      [vespertilio di Bechstein](/especie/myotis_bechsteinii/), la volpe, la
      [martora](/especie/martes_martes/) e il [cervo nobile](/especie/cervus_elaphus/). Nello specchio d’acqua
      di Šolcův rybník sopravvive una solida popolazione autoctona di gambero di fiume europeo.


      Ad eccezione dei grandi predatori sterminati dalla caccia umana, la fauna attuale vive indisturbata da
      circa settemila anni.
    visit: >-
      Quasi ogni punto d’interesse unisce rocce panoramiche e torrenti. Krásná Máří è un poggio panoramico che
      domina la valle dello Štolpich e la basilica di Hejnice; Ořešník svetta come il re dei belvederi di
      roccia. Polední kameny costituisce la formazione granitica più elevata delle faggete, mentre Frýdlantské
      cimbuří deve il proprio nome alla somiglianza con i merli del castello di Frýdlant.


      Due sentieri didattici solcano la riserva. Il percorso didattico Přirozený les si sviluppa per due
      chilometri percorribili solo a piedi, con tratti impegnativi tra scalinate e scale di ferro verso creste
      panoramiche per raccontare la natura dell’ala occidentale dei monti Jizera. Il sentiero didattico
      Oldřichovské bučiny sale dal valico di Oldřichov a Skalní hrad toccando la roccia del Gorilla e le Lysé
      skály, scandito da 18 tappe interattive. Un terzo tracciato segue il recinto di caccia di Clam-Gallas,
      risalente alla metà del diciannovesimo secolo, conducendo gli escursionisti in sicurezza da Oldřichov v
      Hájích fino al valico.
    history: >-
      L’uomo mise piede in queste faggete solo nel quattordicesimo secolo. Nel sedicesimo secolo giunsero i
      mastri vetrai, che tagliarono legname per la potassa e per alimentare le fornaci fino agli albori del
      ventesimo secolo. I tagli boschivi lasciarono memorie tangibili: numerosi cippi commemorativi che
      ricordano boscaioli deceduti sul lavoro. La ricerca di questi pomníčky—modesti monumenti dedicati a
      taglialegna caduti, tragici scontri tra guardiacaccia e bracconieri o suicidi—è un’attività classica del
      luogo. Sul finire degli anni trenta fu inoltre costruita una cortina difensiva di bunker che lambisce il
      settore occidentale dell’area protetta.


      La riserva è nata il 16 agosto 1999 dall’unione di sette riserve previgenti. I cuori integrali di
      Poledník e Štolpichy, tutelati a libera evoluzione naturale dal 1960, compongono il nucleo UNESCO di 634
      ha con relativa fascia di rispetto. È inclusa tra le antiche faggete primarie dei Carpazi e di altre
      regioni d’Europa. Il piano di tutela prescrive la totale non-ingerenza nei settori focali, lasciando
      alberi morti utili a uccelli, insetti e funghi rari. Persiste un problema gestionale: l’eccesso di
      ungulati frena il rinnovamento spontaneo del bosco e si lavora all’eradicazione del muflone introdotto
      artificialmente.
    before: >-
      In tutta la riserva è consentito transitare unicamente lungo i percorsi segnati e, a eccezione della
      pista Viničná cesta che consente l’uso della bici, l’itinerario è solo pedonale. Le pendenze sono
      ragguardevoli e il tempo muta in pochi minuti; in presenza di neve i tracciati diventano insidiosi. Si
      raccomanda l’uso dei mezzi pubblici: stazioni ferroviarie sono attive a Oldřichov v Hájích, Hejnice,
      Bílý Potok pod Smrkem e Raspenava.
    around: >-
      Il [Massiccio di Krkonoše / Karkonosze](/lugar/krkonose---karkonosze-high-massif/) dista circa 18 km e
      poco più a oriente si distende il [Parco Paesaggistico della Valle del
      Bóbr](/lugar/park-krajobrazowy-doliny-bobru/). Con la [Foresta Vergine di
      Boubín](/lugar/boubinsky-prales/), le faggete dei monti Jizera condividono la presenza della civetta
      nana e il pregio del bosco montano incontaminato.
  pt:
    intro: >-
      Há florestas que o ser humano não tocou simplesmente porque não conseguia chegar até elas. No setor
      setentrional dos montes Jizera, as encostas precipitam-se com tamanha inclinação que os faganais de
      Jizerskohorské bučiny ficaram a salvo do corte florestal, resultando numa reserva de 27 km² que em julho
      de 2021 se tornou o primeiro sítio natural checo inscrito na Lista do Património Mundial da UNESCO. Aqui
      não encontrarás um parque com passeios fáceis, mas sim um bosque misto dominado pela faia, repleto de
      cascatas, agulhas de granito e miradouros aos quais só se ascende por degraus de pedra e escadas de
      ferro.
    landscape: >-
      A génese geológica remonta às entranhas da terra. Há cerca de 325 milhões de anos, durante a orogenia
      hercínica, o magma granítico ascendeu das profundezas. Muito depois, as glaciações continentais de
      Elster e Saale avançaram até estas faldas montanhosas. Entre frio e gelo, a meteorização foi esculpindo
      torreões e muralhas pétreas desde o final do Terciário. É por isso que os penedos e miradouros são tão
      abundantes: toda a reserva constitui um mostruário de formas graníticas.


      A água encarrega-se do resto. A precipitação média anual ronda os 1000 mm e as linhas de água drenam
      rumo à bacia do Báltico. Por estas vertentes abruptas precipitam-se cascatas: Velký Štolpich, com cerca
      de 30 m de desnível, é a maior dos montes Jizera; a de Černý potok tomba 8 m, tendo o caudal mais
      copioso e o declive mais acentuado em redor de um bloco granítico central. A reserva abrange desde os
      360 m, junto ao posto florestal de Dubina, até aos 1006 m em Polední kameny. Apenas a lagoa histórica de
      Šolcův rybník, com 7 ha e criada no século XVII, rompe a copa florestal contínua com um espelho de água.
    wildlife: >-
      No passado as espécies arbóreas dominantes eram o espruce, o [abeto-branco](/especie/abies_alba/) e a
      faia, com o espruce senhor das cumeadas expostas. Entre as raridades botânicas destacam-se a
      lunária-perene, o lírio-martagão e Dentaria enneaphyllos. Os bosques de espruce com fetos exigem
      ambiente frio e húmido, dominando o feto-da-montanha o estrato herbáceo.


      Nas aves das florestas de faia nidificam a [cegonha-preta](/especie/ciconia_nigra/), o açor, o
      bútio-vespeiro, o [milhafre-real](/especie/milvus_milvus/), o
      [pica-pau-preto](/especie/dryocopus_martius/), o mocho-de-tengmalm e o papa-moscas-pequeno. Fragas e
      orlas de clareira acolhem o [bufo-real](/especie/bubo_bubo/) e o corvo, ao passo que nas correntes
      límpidas habitam o [melro-d'água](/especie/cinclus_cinclus/) e a alvéola-cinzenta. Surgem também a
      [salamandra-de-fogo](/especie/salamandra_salamandra/) e o licranço; entre os mamíferos encontram-se o
      leirão-cinzento, o [morcego-de-bechstein](/especie/myotis_bechsteinii/), a raposa, a
      [marta](/especie/martes_martes/) e o [veado-vermelho](/especie/cervus_elaphus/). Na albufeira de Šolcův
      rybník perdura uma população saudável do lagostim-de-rio autóctone.


      Com exceção dos grandes carnívoros extirpados pela perseguição humana, a fauna atual tem-se mantido sem
      alterações substanciais desde há cerca de sete mil anos.
    visit: >-
      Os pontos mais marcantes combinam miradouros alcantilados e cursos de água. Krásná Máří proporciona um
      panorama amplo sobre o vale de Štolpich e a basílica de Hejnice; Ořešník reina como o miradouro rochoso
      mais imponente. Polední kameny representa a formação granítica mais elevada das florestas de faia,
      enquanto Frýdlantské cimbuří deve o nome à semelhança com as ameias do castelo de Frýdlant.


      Dois trilhos interpretativos atravessam o território. O percurso didático Přirozený les estende-se por
      dois quilómetros exclusivamente pedestres, com desníveis acentuados e escadas metálicas até miradouros
      rochosos que desvendam a ecologia do setor ocidental de Jizera. O percurso didático Oldřichovské bučiny
      une o colo de Oldřichov a Skalní hrad, passando pela penha do Gorila e por Lysé skály, integrando 18
      pontos de interpretação. Um terceiro caminho contorna a antiga cerca de caça dos condes Clam-Gallas, de
      meados do século XIX, conduzindo com segurança desde Oldřichov v Hájích até ao colo.
    history: >-
      A presença humana nestas florestas só começou no século XIV. No século XVI instalaram-se vidreiros que
      cortavam arvoredo para potassa e para aquecer fornos até aos inícios do século XX; o abate de madeira
      deixou cicatrizes memoráveis no bosque: diversos monumentos evocativos de lenhadores que ali perderam a
      vida. Procurar estes pomníčky—pequenos marcos erigidos a trabalhadores mortos em serviço, confrontos
      fatais entre caçadores furtivos e guardas ou suicídios—é um costume arreigado. No final dos anos trinta
      ergueu-se também uma linha defensiva de casamatas que corta o setor ocidental da reserva.


      A reserva formalizou-se a 16 de agosto de 1999 pela união de sete reservas preexistentes. As zonas de
      proteção integral de Poledník e Štolpichy, mantidas sob livre evolução natural desde 1960, compõem o
      sítio UNESCO de 634 ha com a sua faixa de amortecimento. Integra a rede transnacional de Florestas
      Primárias de Faias dos Cárpatos e de Outras Regiões da Europa. A estratégia de gestão privilegia a
      não-intervenção nos núcleos, garantindo madeira morta essencial a aves, insetos xilófagos e fungos
      raros. Persiste a pressão excessiva de herbívoros sobre os rebentos novos, pretendendo-se erradicar o
      muflão introduzido na serra.
    before: >-
      Em toda a reserva só é permitido caminhar pelos trilhos assinalados; com exceção da Viničná cesta, apta
      para cicloturismo, os caminhos destinam-se em exclusivo a peões. As pendentes são abruptas e a
      meteorologia altera-se em escassos minutos; com neve os caminhos tornam-se intransitáveis. É
      aconselhável utilizar transportes públicos: existem estações de comboio em Oldřichov v Hájích, Hejnice,
      Bílý Potok pod Smrkem e Raspenava.
    around: >-
      O [Maciço de Krkonoše / Karkonosze](/lugar/krkonose---karkonosze-high-massif/) dista cerca de 18 km e um
      pouco mais distante situa-se o [Parque Paisagístico do Vale do
      Bóbr](/lugar/park-krajobrazowy-doliny-bobru/). Com a [Floresta Virgem de
      Boubín](/lugar/boubinsky-prales/), os faganais de Jizerskohorské bučiny partilham o mocho-pigmeu e os
      carateres ecológicos do bosque primário montanhoso.
