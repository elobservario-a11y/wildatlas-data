texto:
  es:
    intro: >-
      Tres montañas bajo un mismo nombre. Komovi une Kom Vasojevićki, Kom Kučki y Kom Ljevorečki, y entre las
      tres queda un solo valle glaciar, Međukomlje. Alrededor se abren las mesetas de Štavna, Ljuban, Rogam,
      Turjak y Carine. El macizo se extiende por el sureste de Montenegro, entre Bjelasica y Prokletije y
      entre los ríos Lim y Tara, y el parque natural abarca partes de Podgorica y de los municipios de
      Andrijevica y Kolašin.
    landscape: >-
      El macizo se lee por pisos. Abajo, en los valles, hay densos bosques de hoja caduca, mixtos y de
      coníferas; más arriba, prados y pastos de montaña, y en las cumbres, roquedos y pedreras. Las tres cimas
      son Vasojevićki Kom (2.460 m), Kučki Kom (2.487 m) y Ljevoriječki Kom (2.453 m); Kučki es la mayor.


      El bosque tiene carácter. El parque se distingue por los bosques de munika, el pino Pinus heldreichii,
      endémico y relicto del Terciario, protegido por la legislación nacional: crece en terrenos empinados,
      pedregosos y rocosos del piso subalpino. Junto a él hay hayedos de montaña, hayedos subalpinos y bosques
      de abeto y haya.


      En el flanco de los montes de Kuči, en Podgorica, el lago Bukumir es un lago glaciar a 1.443 m de
      altitud. Al lago Rikavac solo se llega en vehículo todoterreno o a pie.
    wildlife: >-
      Komovi tiene plantas que no existen en ningún otro lugar del mundo: Androsace komovensis, Arenaria
      halacsyi y Gentianella pevalekii crecen solo aquí. Entre las flores de alta montaña, el calderón
      amarillo, la amapola de Kerner y el lirio albanés. Hay también un musgo, Campylopus pyriformis, que en
      Montenegro solo se ha registrado en Komovi, y unas 100 especies de hongos; al pie del macizo se
      descubrió una especie nueva, Alpova komoviana, que vive en micorriza con el aliso.


      Los carnívoros del parque son el [lobo](/especie/canis_lupus/), el [oso pardo](/especie/ursus_arctos/),
      el zorro, la [marta](/especie/martes_martes/) y la comadreja. Entre los murciélagos figuran el
      [murciélago grande de herradura](/especie/rhinolophus_ferrumequinum/), el [murciélago de
      Bechstein](/especie/myotis_bechsteinii/) y el [murciélago ratonero grande](/especie/myotis_myotis/).
      Entre las aves, el [urogallo](/especie/tetrao_urogallus/) es una rareza especial, y también viven en el
      parque el [águila real](/especie/aquila_chrysaetos/) y el mochuelo boreal, una de las rapaces nocturnas
      más pequeñas de Europa, que habita en los bosques de coníferas y mixtos. Los ríos de Komovi abundan en
      trucha de arroyo.
    visit: >-
      El gestor indica que todas las sendas de montaña están bien señalizadas. Sobre las cumbres, Kučki Kom es
      la mayor, seguida de Vasojevićki y Ljevorečki.


      La ruta circular de Komovi sale de la meseta de Štavna, a 1.787 m, al pie del katun de Vulić, y cruza un
      hayedo hacia el katun de Varda. Entre Varda y Popović pasa por un pinar, y en Popović hay una fuente.
      Luego sube hacia Suvovrh y baja a la fuente Rogamsko vrelo, o Crni izvori, con los katuns de Pričelje,
      Margarita, Slana y Velika rupa. Termina en la meseta de Ljuban, el río Ljubaštica y la fuente Jankove
      vode, de vuelta en Štavna. El recorrido está señalizado, tiene cuatro fuentes y un desnivel de unos 540
      m.


      Del lado de los montes de Kuči, entre los puntos de interés figuran los lagos Bukumir y Rikavac, la
      vista desde Maglič, la subida a Žijovo, la vista desde Grlo sokolova y el cañón del río Mala. El gestor
      pide ir con ropa y calzado adecuados y con suficiente agua y comida, y consultar a los guardas y a los
      clubes de montaña locales.
    history: >-
      Los katuns son los asentamientos de verano de los pastores. Antes había en Komovi más de 35, con más de
      400 cabañas. Hoy quedan cada vez menos vivos; muchas cabañas son casas de fin de semana o están
      abandonadas. Se concentran en el este del parque (Rikavac, Širokar, Planinica, Bindža y Carine) y en el
      norte (Turjak, Strmenica y Rogam). Mantener el pastoreo tradicional es clave para que sobrevivan.


      Podgorica y Andrijevica declararon el parque en sus territorios en 2015, y Kolašin lo hizo en 2019. La
      gestión forestal contempla dejar árboles muertos en pie y aumentar la proporción de árboles maduros y
      con cavidades, importantes para los hongos y para otras especies.
    before: >-
      Lleva agua y comida suficientes y calzado de montaña. Pregunta a los guardas del parque o a los clubes
      de montaña por el estado de las rutas antes de salir.
    around: >-
      Pegado a Komovi, el [Parque Nacional de los Alpes Albaneses - Valbona y
      Theth](/lugar/parku-kombetar-i-alpeve-te-shqiperise/) queda pegado al parque. A 2 km está el [Cañón del
      Río Morača](/lugar/kanjon-morace/) y a 9 km el [Parque Nacional de
      Prokletije](/lugar/nacionalni-park-prokletije-parku-kombetar-i/). También cerca está el [Parque Nacional
      Biogradska Gora - Macizo de Bjelasica](/lugar/nacionalni-park-biogradska-gora-masiv-bjelasice/) y el
      [Cañón del Río Cijevna](/lugar/kanjon-cijevine/).
  en:
    intro: >-
      Three mountains under one name. Komovi unites Kom Vasojevićki, Kom Kučki and Kom Ljevorečki, and between
      them lies a single glacial valley, Međukomlje. Around it open the plateaus of Štavna, Ljuban, Rogam,
      Turjak and Carine. The massif extends across south-eastern Montenegro, between Bjelasica and Prokletije
      and between the Lim and Tara rivers, and the nature park covers parts of Podgorica and the
      municipalities of Andrijevica and Kolašin.
    landscape: >-
      The massif reads in tiers. Below, in the valleys, there are dense deciduous, mixed and coniferous
      forests; higher up, mountain meadows and pastures, and at the summits, crags and scree. The three peaks
      are Vasojevićki Kom (2,460 m), Kučki Kom (2,487 m) and Ljevoriječki Kom (2,453 m); Kučki is the highest.


      The forest has character. The park is distinguished by its munika stands — Pinus heldreichii, an endemic
      and Tertiary relict pine protected by national legislation, growing on steep, stony and rocky terrain in
      the subalpine belt. Alongside it grow mountain beech forests, subalpine beech forests and spruce-beech
      forests.


      On the Kuči mountain side in Podgorica, Lake Bukumir is a glacial lake at 1,443 m altitude. Lake Rikavac
      can only be reached by four-wheel drive or on foot.
    wildlife: >-
      Komovi has plants that exist nowhere else on Earth: Androsace komovensis, Arenaria halacsyi and
      Gentianella pevalekii grow only here. Among the high-mountain flowers, yellow globe-flower, Kerner's
      poppy and the Albanian lily. There is also a moss, Campylopus pyriformis, recorded in Montenegro only at
      Komovi, and some 100 species of fungi; at the foot of the massif a new species was discovered, Alpova
      komoviana, which lives in mycorrhiza with alder.


      The park's carnivores are the [wolf](/especie/canis_lupus/), [brown bear](/especie/ursus_arctos/), fox,
      [pine marten](/especie/martes_martes/) and weasel. Among the bats are the [greater horseshoe
      bat](/especie/rhinolophus_ferrumequinum/), [Bechstein's bat](/especie/myotis_bechsteinii/) and the
      [greater mouse-eared bat](/especie/myotis_myotis/). Among the birds, the
      [capercaillie](/especie/tetrao_urogallus/) is a special rarity, and also living in the park are the
      [golden eagle](/especie/aquila_chrysaetos/) and the boreal owl, one of the smallest nocturnal raptors in
      Europe, which inhabits coniferous and mixed forests. Komovi's rivers are rich in brook trout.
    visit: >-
      The management authority notes that all mountain trails are well marked. Among the summits, Kučki Kom is
      the highest, followed by Vasojevićki and Ljevorečki.


      The Komovi circular route starts from the Štavna plateau at 1,787 m, below the Vulić katun, and crosses
      a beech forest towards the Varda katun. Between Varda and Popović it passes through a pine forest, and
      at Popović there is a spring. It then climbs towards Suvovrh and descends to the Rogamsko vrelo spring,
      or Crni izvori, with the katuns of Pričelje, Margarita, Slana and Velika rupa. It ends at the Ljuban
      plateau, the Ljubaštica river and the Jankove vode spring, back at Štavna. The route is signposted, has
      four springs and an elevation gain of about 540 m.


      On the Kuči mountain side, points of interest include Lakes Bukumir and Rikavac, the view from Maglič,
      the ascent to Žijovo, the view from Grlo sokolova and the canyon of the Mala river. The management
      authority asks visitors to wear appropriate clothing and footwear, carry sufficient food and water, and
      consult the rangers and local mountain clubs.
    history: >-
      The katuns are the summer settlements of shepherds. There were once more than 35 at Komovi, with more
      than 400 huts. Today fewer and fewer remain active; many huts are weekend houses or abandoned. They are
      concentrated in the east of the park (Rikavac, Širokar, Planinica, Bindža and Carine) and in the north
      (Turjak, Strmenica and Rogam). Maintaining traditional pastoralism is key to their survival.


      Podgorica and Andrijevica declared the park in their territories in 2015, and Kolašin did so in 2019.
      Forest management includes leaving dead trees standing and increasing the proportion of mature and
      cavity-bearing trees, important for fungi and other species.
    before: >-
      Carry sufficient water and food and mountain footwear. Ask the park rangers or mountain clubs about
      trail conditions before setting out.
    around: >-
      Adjacent to Komovi, the [Albanian Alps National Park - Valbona and
      Theth](/lugar/parku-kombetar-i-alpeve-te-shqiperise/) borders the park. At 2 km is the [Morača River
      Canyon](/lugar/kanjon-morace/) and at 9 km the [Prokletije National
      Park](/lugar/nacionalni-park-prokletije-parku-kombetar-i/). Also nearby are the [Biogradska Gora
      National Park - Bjelasica Massif](/lugar/nacionalni-park-biogradska-gora-masiv-bjelasice/) and the
      [Cijevna River Canyon](/lugar/kanjon-cijevine/).
  fr:
    intro: >-
      Trois montagnes sous un même nom. Komovi unit Kom Vasojevićki, Kom Kučki et Kom Ljevorečki, et entre
      elles s'ouvre une seule vallée glaciaire, Međukomlje. Alentour s'étendent les plateaux de Štavna,
      Ljuban, Rogam, Turjak et Carine. Le massif s'étend au sud-est du Monténégro, entre Bjelasica et
      Prokletije et entre les rivières Lim et Tara, et le parc naturel couvre des parties de Podgorica et des
      municipalités d'Andrijevica et de Kolašin.
    landscape: >-
      Le massif se lit par étages. En bas, dans les vallées, de denses forêts de feuillus, mixtes et de
      conifères ; plus haut, prairies et pâturages de montagne, et au sommet, rochers et éboulis. Les trois
      cimes sont Vasojevićki Kom (2 460 m), Kučki Kom (2 487 m) et Ljevoriječki Kom (2 453 m) ; Kučki est le
      plus élevé.


      La forêt a du caractère. Le parc se distingue par ses peuplements de munika — Pinus heldreichii, pin
      endémique et relique du Tertiaire, protégé par la législation nationale, qui pousse sur des terrains
      escarpés, caillouteux et rocheux de l'étage subalpin. À ses côtés croissent des hêtraies de montagne,
      des hêtraies subalpines et des forêts mixtes d'épicéa et de hêtre.


      Sur le versant des montagnes de Kuči, à Podgorica, le lac Bukumir est un lac glaciaire à 1 443 m
      d'altitude. Le lac Rikavac n'est accessible qu'en véhicule tout-terrain ou à pied.
    wildlife: >-
      Komovi abrite des plantes qui n'existent nulle part ailleurs sur Terre : Androsace komovensis, Arenaria
      halacsyi et Gentianella pevalekii ne poussent que là. Parmi les fleurs de haute montagne, le trolle
      jaune, le coquelicot de Kerner et le lys albanais. On y trouve aussi une mousse, Campylopus pyriformis,
      enregistrée au Monténégro uniquement à Komovi, et quelque 100 espèces de champignons ; au pied du
      massif, une nouvelle espèce a été découverte, Alpova komoviana, qui vit en mycorhize avec l'aulne.


      Les carnivores du parc sont le [loup](/especie/canis_lupus/), l'[ours brun](/especie/ursus_arctos/), le
      renard, la [martre](/especie/martes_martes/) et la belette. Parmi les chauves-souris figurent le [grand
      rhinolophe](/especie/rhinolophus_ferrumequinum/), le [vespertilion de
      Bechstein](/especie/myotis_bechsteinii/) et le [grand murin](/especie/myotis_myotis/). Parmi les
      oiseaux, le [grand tétras](/especie/tetrao_urogallus/) est une rareté particulière, et vivent également
      dans le parc l'[aigle royal](/especie/aquila_chrysaetos/) et la chouette de Tengmalm, l'une des plus
      petites rapaces nocturnes d'Europe, qui habite les forêts de conifères et mixtes. Les rivières de Komovi
      regorgent de truites de rivière.
    visit: >-
      Le gestionnaire indique que tous les sentiers de montagne sont bien balisés. Parmi les sommets, Kučki
      Kom est le plus haut, suivi de Vasojevićki et de Ljevorečki.


      L'itinéraire circulaire de Komovi part du plateau de Štavna à 1 787 m, au pied du katun de Vulić, et
      traverse une hêtraie vers le katun de Varda. Entre Varda et Popović, il passe par une pinède, et à
      Popović il y a une source. Il monte ensuite vers Suvovrh et descend à la source Rogamsko vrelo, ou Crni
      izvori, avec les katuns de Pričelje, Margarita, Slana et Velika rupa. Il se termine au plateau de
      Ljuban, à la rivière Ljubaštica et à la source Jankove vode, de retour à Štavna. Le parcours est balisé,
      comporte quatre sources et un dénivelé d'environ 540 m.


      Du côté des montagnes de Kuči, parmi les points d'intérêt figurent les lacs Bukumir et Rikavac, la vue
      depuis Maglič, la montée à Žijovo, la vue depuis Grlo sokolova et le canyon de la rivière Mala. Le
      gestionnaire demande de venir avec des vêtements et chaussures adaptés, suffisamment d'eau et de
      nourriture, et de consulter les gardes et les clubs de montagne locaux.
    history: >-
      Les katuns sont les établissements d'été des bergers. Il y en avait jadis plus de 35 à Komovi, avec plus
      de 400 cabanes. Aujourd'hui, de moins en moins sont vivants ; de nombreuses cabanes sont des maisons de
      week-end ou sont abandonnées. Ils se concentrent à l'est du parc (Rikavac, Širokar, Planinica, Bindža et
      Carine) et au nord (Turjak, Strmenica et Rogam). Maintenir le pastoralisme traditionnel est essentiel à
      leur survie.


      Podgorica et Andrijevica ont déclaré le parc sur leurs territoires en 2015, et Kolašin l'a fait en 2019.
      La gestion forestière prévoit de laisser les arbres morts sur pied et d'augmenter la proportion d'arbres
      matures et à cavités, importants pour les champignons et d'autres espèces.
    before: >-
      Emportez suffisamment d'eau, de nourriture et des chaussures de montagne. Renseignez-vous auprès des
      gardes du parc ou des clubs de montagne sur l'état des sentiers avant de partir.
    around: >-
      Contigu à Komovi, le [Parc national des Alpes albanaises - Valbona et
      Theth](/lugar/parku-kombetar-i-alpeve-te-shqiperise/) borde le parc. À 2 km se trouve le [Canyon de la
      rivière Morača](/lugar/kanjon-morace/) et à 9 km le [Parc national de
      Prokletije](/lugar/nacionalni-park-prokletije-parku-kombetar-i/). Sont également proches le [Parc
      national de Biogradska Gora - Massif de
      Bjelasica](/lugar/nacionalni-park-biogradska-gora-masiv-bjelasice/) et le [Canyon de la rivière
      Cijevna](/lugar/kanjon-cijevine/).
  de:
    intro: >-
      Drei Berge unter einem Namen. Komovi vereint Kom Vasojevićki, Kom Kučki und Kom Ljevorečki, und zwischen
      ihnen liegt das einzige Gletschertal Međukomlje. Ringsum öffnen sich die Hochebenen Štavna, Ljuban,
      Rogam, Turjak und Carine. Das Massiv erstreckt sich im Südosten Montenegros, zwischen Bjelasica und
      Prokletije sowie zwischen den Flüssen Lim und Tara, und der Naturpark umfasst Teile von Podgorica und
      der Gemeinden Andrijevica und Kolašin.
    landscape: >-
      Das Massiv gliedert sich in Höhenstufen. Unten, in den Tälern, dichte Laub-, Misch- und Nadelwälder;
      weiter oben Bergwiesen und Weiden, und an den Gipfeln Felsen und Geröllhalden. Die drei Gipfel sind
      Vasojevićki Kom (2.460 m), Kučki Kom (2.487 m) und Ljevoriječki Kom (2.453 m); Kučki ist der höchste.


      Der Wald hat Charakter. Das Park zeichnet sich durch seine Munika-Bestände aus — Pinus heldreichii, eine
      endemische und tertiäre Relikt-Kiefer, die durch nationales Recht geschützt ist und auf steilem,
      steinigem und felsigem Gelände der subalpinen Stufe wächst. Daneben gedeihen Bergbuchenwälder, subalpine
      Buchenwälder und Fichten-Buchen-Wälder.


      Am Hang der Kuči-Berge in Podgorica liegt der Gletschersee Bukumir auf 1.443 m Höhe. Der Rikavac-See ist
      nur mit Allradantrieb oder zu Fuß erreichbar.
    wildlife: >-
      Komovi beherbergt Pflanzen, die nirgendwo sonst auf der Erde vorkommen: Androsace komovensis, Arenaria
      halacsyi und Gentianella pevalekii wachsen nur hier. Zu den Hochgebirgsblumen zählen die Trollblume,
      Kerners Mohn und die albanische Lilie. Es gibt auch ein Moos, Campylopus pyriformis, das in Montenegro
      nur in Komovi nachgewiesen wurde, sowie rund 100 Pilzarten; am Fuß des Massivs wurde eine neue Art
      entdeckt, Alpova komoviana, die in Mykorrhiza mit der Erle lebt.


      Die Raubtiere des Parks sind der [Wolf](/especie/canis_lupus/), der [Braunbär](/especie/ursus_arctos/),
      der Fuchs, der [Baummarder](/especie/martes_martes/) und das Wiesel. Zu den Fledermäusen zählen die
      [Große Hufeisennase](/especie/rhinolophus_ferrumequinum/), die
      [Bechstein-Fledermaus](/especie/myotis_bechsteinii/) und das [Große Mausohr](/especie/myotis_myotis/).
      Unter den Vögeln ist das [Auerhuhn](/especie/tetrao_urogallus/) eine besondere Rarität; im Park leben
      auch der [Steinadler](/especie/aquila_chrysaetos/) und der Sperlingskauz, einer der kleinsten
      nachtaktiven Greifvögel Europas, der Nadel- und Mischwälder bewohnt. Die Flüsse Komovis sind reich an
      Bachforellen.
    visit: >-
      Die Verwaltung gibt an, dass alle Bergwege gut beschildert sind. Unter den Gipfeln ist Kučki Kom der
      höchste, gefolgt von Vasojevićki und Ljevorečki.


      Die Komovi-Rundroute beginnt auf dem Štavna-Plateau auf 1.787 m, unterhalb des Vulić-Katun, und quert
      einen Buchenwald zum Varda-Katun. Zwischen Varda und Popović führt sie durch einen Kiefernwald; bei
      Popović gibt es eine Quelle. Dann steigt sie Richtung Suvovrh auf und hinunter zur Quelle Rogamsko vrelo
      oder Crni izvori, mit den Katuns Pričelje, Margarita, Slana und Velika rupa. Sie endet am
      Ljuban-Plateau, am Fluss Ljubaštica und an der Quelle Jankove vode, zurück auf der Štavna. Die Route ist
      beschildert, hat vier Quellen und einen Höhenunterschied von etwa 540 m.


      Auf der Seite der Kuči-Berge zählen zu den Sehenswürdigkeiten die Seen Bukumir und Rikavac, der Ausblick
      von Maglič, der Aufstieg nach Žijovo, der Blick von Grlo sokolova und die Schlucht des Mala-Flusses. Die
      Verwaltung bittet darum, geeignete Kleidung und Schuhwerk mitzubringen, ausreichend Wasser und
      Verpflegung dabei zu haben und vorher die Parkwächter und lokalen Bergsteigervereine zu befragen.
    history: >-
      Die Katuns sind die Sommersiedlungen der Hirten. Einst gab es in Komovi mehr als 35 davon mit mehr als
      400 Hütten. Heute sind immer weniger bewohnt; viele Hütten dienen als Wochenendhäuser oder stehen leer.
      Sie konzentrieren sich im Osten des Parks (Rikavac, Širokar, Planinica, Bindža und Carine) und im Norden
      (Turjak, Strmenica und Rogam). Die Erhaltung der traditionellen Viehwirtschaft ist für ihr Überleben
      entscheidend.


      Podgorica und Andrijevica erklärten den Park 2015 auf ihren Gebieten, Kolašin folgte 2019. Das
      Forstmanagement sieht vor, tote Bäume stehen zu lassen und den Anteil alter und höhlentragender Bäume zu
      erhöhen, die für Pilze und andere Arten wichtig sind.
    before: >-
      Nehmen Sie ausreichend Wasser und Verpflegung sowie Bergschuhe mit. Erkundigen Sie sich bei den
      Parkwächtern oder Bergsteigervereinen nach dem Zustand der Wege, bevor Sie aufbrechen.
    around: >-
      Direkt an Komovi angrenzend liegt der [Nationalpark Albanische Alpen - Valbona und
      Theth](/lugar/parku-kombetar-i-alpeve-te-shqiperise/). 2 km entfernt liegt der
      [Morača-Canyon](/lugar/kanjon-morace/) und 9 km entfernt der [Nationalpark
      Prokletije](/lugar/nacionalni-park-prokletije-parku-kombetar-i/). Ebenfalls in der Nähe befinden sich
      der [Nationalpark Biogradska Gora -
      Bjelasica-Massiv](/lugar/nacionalni-park-biogradska-gora-masiv-bjelasice/) und der
      [Cijevna-Canyon](/lugar/kanjon-cijevine/).
  it:
    intro: >-
      Tre montagne sotto un unico nome. Komovi unisce Kom Vasojevićki, Kom Kučki e Kom Ljevorečki, e tra loro
      si apre un'unica valle glaciale, Međukomlje. Intorno si estendono gli altopiani di Štavna, Ljuban,
      Rogam, Turjak e Carine. Il massiccio si estende nel Montenegro sud-orientale, tra Bjelasica e Prokletije
      e tra i fiumi Lim e Tara, e il parco naturale abbraccia parti di Podgorica e dei comuni di Andrijevica e
      Kolašin.
    landscape: >-
      Il massiccio si legge per fasce altitudinali. In basso, nelle valli, dense foreste di latifoglie, miste
      e di conifere; più in alto, prati e pascoli montani, e alle cime, rupi e ghiaioni. Le tre vette sono
      Vasojevićki Kom (2.460 m), Kučki Kom (2.487 m) e Ljevoriječki Kom (2.453 m); Kučki è la più alta.


      La foresta ha carattere. Il parco si distingue per i suoi boschi di munika — Pinus heldreichii, pino
      endemico e relitto del Terziario, protetto dalla legislazione nazionale, che cresce su terreni ripidi,
      sassosi e rocciosi della fascia subalpina. Accanto a esso crescono faggete montane, faggete subalpine e
      foreste miste di abete rosso e faggio.


      Sul versante dei monti Kuči, a Podgorica, il lago Bukumir è un lago glaciale a 1.443 m di altitudine. Il
      lago Rikavac è raggiungibile solo con un veicolo fuoristrada o a piedi.
    wildlife: >-
      Komovi ospita piante che non esistono in nessun altro luogo al mondo: Androsace komovensis, Arenaria
      halacsyi e Gentianella pevalekii crescono solo qui. Tra i fiori d'alta montagna, il botton d'oro, il
      papavero di Kerner e il giglio albanese. Vi è anche un muschio, Campylopus pyriformis, registrato in
      Montenegro solo a Komovi, e circa 100 specie di funghi; ai piedi del massiccio è stata scoperta una
      nuova specie, Alpova komoviana, che vive in micorriza con l'ontano.


      I carnivori del parco sono il [lupo](/especie/canis_lupus/), l'[orso bruno](/especie/ursus_arctos/), la
      volpe, la [martora](/especie/martes_martes/) e la donnola. Tra i pipistrelli figurano il [rinolofo
      maggiore](/especie/rhinolophus_ferrumequinum/), il [vespertilio di
      Bechstein](/especie/myotis_bechsteinii/) e il [vespertilio maggiore](/especie/myotis_myotis/). Tra gli
      uccelli, il [gallo cedrone](/especie/tetrao_urogallus/) è una rarità speciale, e nel parco vivono anche
      l'[aquila reale](/especie/aquila_chrysaetos/) e il civettino, uno dei rapaci notturni più piccoli
      d'Europa, che abita le foreste di conifere e miste. I fiumi di Komovi sono ricchi di trote di torrente.
    visit: >-
      Il gestore segnala che tutti i sentieri di montagna sono ben segnalati. Tra le vette, Kučki Kom è la più
      alta, seguita da Vasojevićki e Ljevorečki.


      L'itinerario circolare di Komovi parte dall'altopiano di Štavna a 1.787 m, ai piedi del katun di Vulić,
      e attraversa una faggeta verso il katun di Varda. Tra Varda e Popović attraversa una pineta, e a Popović
      c'è una sorgente. Sale poi verso Suvovrh e scende alla sorgente Rogamsko vrelo, o Crni izvori, con i
      katun di Pričelje, Margarita, Slana e Velika rupa. Termina all'altopiano di Ljuban, al fiume Ljubaštica
      e alla sorgente Jankove vode, di ritorno a Štavna. Il percorso è segnalato, ha quattro sorgenti e un
      dislivello di circa 540 m.


      Dal lato dei monti Kuči, tra i punti di interesse figurano i laghi Bukumir e Rikavac, la vista da
      Maglič, la salita allo Žijovo, la vista da Grlo sokolova e il canyon del fiume Mala. Il gestore chiede
      di venire con abbigliamento e calzature adeguati, con acqua e cibo sufficienti, e di consultare le
      guardie e i club di montagna locali.
    history: >-
      I katun sono gli insediamenti estivi dei pastori. Un tempo a Komovi ce ne erano più di 35, con più di
      400 capanne. Oggi ne rimangono sempre meno attivi; molte capanne sono case per il fine settimana o
      abbandonate. Si concentrano nell'est del parco (Rikavac, Širokar, Planinica, Bindža e Carine) e nel nord
      (Turjak, Strmenica e Rogam). Mantenere il pastoralismo tradizionale è essenziale per la loro
      sopravvivenza.


      Podgorica e Andrijevica hanno dichiarato il parco sui loro territori nel 2015, e Kolašin lo ha fatto nel
      2019. La gestione forestale prevede di lasciare gli alberi morti in piedi e di aumentare la proporzione
      di alberi maturi e con cavità, importanti per i funghi e per altre specie.
    before: >-
      Portare acqua e cibo sufficienti e calzature da montagna. Chiedere alle guardie del parco o ai club di
      montagna le condizioni dei sentieri prima di partire.
    around: >-
      Adiacente a Komovi, il [Parco nazionale delle Alpi Albanesi - Valbona e
      Theth](/lugar/parku-kombetar-i-alpeve-te-shqiperise/) confina con il parco. A 2 km si trova il [Canyon
      del fiume Morača](/lugar/kanjon-morace/) e a 9 km il [Parco nazionale di
      Prokletije](/lugar/nacionalni-park-prokletije-parku-kombetar-i/). Vicini sono anche il [Parco nazionale
      di Biogradska Gora - Massiccio di Bjelasica](/lugar/nacionalni-park-biogradska-gora-masiv-bjelasice/) e
      il [Canyon del fiume Cijevna](/lugar/kanjon-cijevine/).
  pt:
    intro: >-
      Três montanhas sob um único nome. Komovi une Kom Vasojevićki, Kom Kučki e Kom Ljevorečki, e entre elas
      abre-se um único vale glaciar, Međukomlje. Em redor estendem-se os planaltos de Štavna, Ljuban, Rogam,
      Turjak e Carine. O maciço prolonga-se pelo sudeste do Montenegro, entre Bjelasica e Prokletije e entre
      os rios Lim e Tara, e o parque natural abrange partes de Podgorica e dos municípios de Andrijevica e
      Kolašin.
    landscape: >-
      O maciço lê-se em andares. Em baixo, nos vales, densas florestas de folha caduca, mistas e de coníferas;
      mais acima, prados e pastagens de montanha, e nos cumes, penhascos e pedregulhos. Os três picos são
      Vasojevićki Kom (2.460 m), Kučki Kom (2.487 m) e Ljevoriječki Kom (2.453 m); Kučki é o mais alto.


      A floresta tem carácter. O parque distingue-se pelas suas matas de munika — Pinus heldreichii, pinheiro
      endémico e relíquia do Terciário, protegido pela legislação nacional, que cresce em terrenos inclinados,
      pedregosos e rochosos do andar subalpino. A par dele crescem fagedos montanos, fagedos subalpinos e
      florestas mistas de abeto e faia.


      No flanco dos montes de Kuči, em Podgorica, o lago Bukumir é um lago glaciar a 1.443 m de altitude. O
      lago Rikavac só é acessível de jipe ou a pé.
    wildlife: >-
      Komovi tem plantas que não existem em nenhum outro lugar do mundo: Androsace komovensis, Arenaria
      halacsyi e Gentianella pevalekii crescem apenas aqui. Entre as flores de alta montanha, o botão-de-ouro,
      a papoila de Kerner e o lírio albanês. Há também um musgo, Campylopus pyriformis, registado no
      Montenegro apenas em Komovi, e cerca de 100 espécies de fungos; aos pés do maciço foi descoberta uma
      nova espécie, Alpova komoviana, que vive em micorriza com o amieiro.


      Os carnívoros do parque são o [lobo](/especie/canis_lupus/), o [urso-pardo](/especie/ursus_arctos/), a
      raposa, a [marta](/especie/martes_martes/) e a doninha. Entre os morcegos figuram o
      [morcego-de-ferradura-grande](/especie/rhinolophus_ferrumequinum/), o [morcego de
      Bechstein](/especie/myotis_bechsteinii/) e o [morcego-rato-grande](/especie/myotis_myotis/). Entre as
      aves, o [galo-silvestre](/especie/tetrao_urogallus/) é uma raridade especial, e também vivem no parque a
      [águia-real](/especie/aquila_chrysaetos/) e o mocho-boreal, uma das rapinas noturnas mais pequenas da
      Europa, que habita florestas de coníferas e mistas. Os rios de Komovi abundam em trutas de rio.
    visit: >-
      O gestor indica que todos os trilhos de montanha estão bem assinalados. Entre os cumes, Kučki Kom é o
      mais alto, seguido de Vasojevićki e Ljevorečki.


      O circuito de Komovi parte do planalto de Štavna a 1.787 m, junto ao katun de Vulić, e atravessa um
      fajal em direção ao katun de Varda. Entre Varda e Popović passa por um pinheiro, e em Popović há uma
      nascente. Sobe depois para Suvovrh e desce à nascente Rogamsko vrelo, ou Crni izvori, com os katuns de
      Pričelje, Margarita, Slana e Velika rupa. Termina no planalto de Ljuban, no rio Ljubaštica e na nascente
      Jankove vode, de regresso a Štavna. O percurso está assinalado, tem quatro nascentes e um desnível de
      cerca de 540 m.


      Do lado dos montes de Kuči, entre os pontos de interesse figuram os lagos Bukumir e Rikavac, a vista de
      Maglič, a subida a Žijovo, a vista de Grlo sokolova e o canhão do rio Mala. O gestor pede que se vá com
      roupa e calçado adequados, com água e comida suficientes, e que se consulte os guardas e os clubes de
      montanhismo locais.
    history: >-
      Os katuns são os acampamentos de verão dos pastores. Outrora havia em Komovi mais de 35, com mais de 400
      cabanas. Hoje restam cada vez menos ativos; muitas cabanas são casas de fim de semana ou estão
      abandonadas. Concentram-se no leste do parque (Rikavac, Širokar, Planinica, Bindža e Carine) e no norte
      (Turjak, Strmenica e Rogam). Manter o pastoreio tradicional é fundamental para a sua sobrevivência.


      Podgorica e Andrijevica declararam o parque nos seus territórios em 2015, e Kolašin fê-lo em 2019. A
      gestão florestal prevê deixar árvores mortas de pé e aumentar a proporção de árvores maduras e com
      cavidades, importantes para os fungos e outras espécies.
    before: >-
      Leve água e comida suficientes e calçado de montanha. Pergunte aos guardas do parque ou aos clubes de
      montanhismo sobre o estado dos trilhos antes de partir.
    around: >-
      Colado a Komovi, o [Parque Nacional dos Alpes Albaneses - Valbona e
      Theth](/lugar/parku-kombetar-i-alpeve-te-shqiperise/) confina com o parque. A 2 km fica o [Canhão do Rio
      Morača](/lugar/kanjon-morace/) e a 9 km o [Parque Nacional de
      Prokletije](/lugar/nacionalni-park-prokletije-parku-kombetar-i/). Também perto estão o [Parque Nacional
      Biogradska Gora - Maciço de Bjelasica](/lugar/nacionalni-park-biogradska-gora-masiv-bjelasice/) e o
      [Canhão do Rio Cijevna](/lugar/kanjon-cijevine/).
