resumen:
  es: Bosque virgen de abeto y haya de montaña en el punto donde se unen tres fronteras carpatianas.
  en: Virgin mountain fir and beech forest at the meeting point of three Carpathian frontiers.
  fr: Forêt vierge montagnarde de sapins et de hêtres au point de rencontre de trois frontières carpatiques.
  de: Bergmisch-Urwald aus Tannen und Buchen am Zusammentreffen dreier Karpatengrenzen.
  it: Foresta vergine montana di abete e faggio nel punto di incontro tra tre frontiere carpatiche.
  pt: Floresta virgem de montanha de abeto e faia no ponto de convergência de três fronteiras carpáticas.
unico:
  es: >-
    Es un bosque primario de hayas, conservado sin alteraciones, en el mismo vértice donde se tocan las
    fronteras de tres países.
  en: >-
    A primeval beech forest, preserved without human alteration, right on the boundary marker where three
    countries touch.
  fr: >-
    Une hêtraie primaire préservée de toute altération humaine, située précisément au point de rencontre des
    frontières de trois pays.
  de: >-
    Ein naturbelassener Buchen-Urwald genau an jenem Grenzpunkt, an dem sich die Staatsgebiete dreier Länder
    berühren.
  it: >-
    Una foresta primaria di faggio, conservata senza alterazioni, proprio sul cippo di confine in cui si
    toccano tre nazioni.
  pt: >-
    Uma floresta primária de faia, conservada sem alterações, no vértice exato onde se tocam as fronteiras de
    três nações.
observaciones:
  es: >-
    El centro de Nová Sedlica permanece cerrado esta temporada estival por obras. Los perros solo pueden ir
    con correa y bozal, y no se debe dañar ni destruir plantas, árboles ni animales.
texto:
  es:
    intro: >-
      Hay un punto de los Cárpatos donde se juntan tres países, y un sendero que sube hasta él atravesando uno
      de los bosques mejor conservados de la cordillera. Sales de Nová Sedlica, la aldea más oriental de
      Eslovaquia, a 416 metros de altitud; cruzas la Národná prírodná rezervácia Stužica, un hayedo primario
      de los Cárpatos orientales exteriores; y llegas a Kremenec, a 1210 metros, donde se encuentran las
      fronteras de Eslovaquia, Polonia y Ucrania. Stužica está protegido desde 1908 y es hoy una reserva
      natural nacional.
    landscape: >-
      Este bosque se formó después de la glaciación, y desde entonces ha seguido su propio ritmo. El relieve
      sube de los 620 a los 1208 metros, y con la altura cambian las condiciones ecológicas: abajo y en las
      laderas, bosques primarios de hayas y de hayas con abetos; arriba, praderas montanas llamadas poloniny,
      que dan nombre al parque. El sustrato es de areniscas micáceas y pizarras, y la temperatura media anual
      se sitúa entre 5 y 6 °C.


      En el bosque mandan el haya, el fresno, el olmo de montaña y, sobre todo, el arce de montaña. Por la
      reserva corre la corriente Stužická, con su afluente Kamenistý potok. Y el bosque no se acaba en la
      frontera: continúa por el lado ucraniano, en Stužycia-Užok.
    wildlife: >-
      La reserva es territorio de grandes mamíferos. Entre los que se citan para Stužica están el
      [lobo](/especie/canis_lupus/), el [oso pardo](/especie/ursus_arctos/), el [lince](/especie/lynx_lynx/) y
      la [nutria](/especie/lutra_lutra/). En el apartado dedicado a Stužica, el gestor incluye también el
      [bisonte](/especie/bison_bonasus/) y el [alce](/especie/alces_alces/).


      Lo que más se ve, sin embargo, es el bosque mismo: hayas, fresnos y arces de montaña que han crecido sin
      que nadie los talara.
    visit: >-
      La administración del parque cuenta el bosque primario de Stužica entre los lugares más visitados de
      Poloniny, y se recorre por una ruta señalizada, la TCH 0918, que conecta Nová Sedlica, el bosque de
      Stužica y Kremenec. Es el sendero rojo del cordal de los Cárpatos: parte de Nová Sedlica, cruza la
      reserva y alcanza Kremenec, en la triple frontera.


      Desde Kremenec el rojo sigue por el cordal principal de los Bukovské vrchy, sobre las cumbres de Kamenná
      lúka (1201 m), Riaba skala (1167 m) y Pľaša (1162 m), hasta el collado de Ruské sedlo (797 m). Hay otra
      alternativa: la ruta amarilla del valle Hlboký potok termina en el mirador de Riaba skala, que ofrece,
      según el gestor, la mejor vista del parque nacional.


      En Nová Sedlica está el centro de información, que daba información y materiales del parque. Su
      exposición naturalista incluye al bisonte Arči disecado. Es un equipamiento regional, no está dentro de
      la reserva.
    history: >-
      El bosque lleva más de un siglo protegido: desde 1908, y en 1993 el área se elevó a reserva natural
      nacional. En 2007, Stužica y otros enclaves de la cordillera, incluidos seis componentes en Ucrania, se
      declararon Patrimonio Mundial de la UNESCO. Ojo: la reserva nacional y el componente UNESCO
      Stužica–Bukovské vrchy no ocupan el mismo territorio.


      La UNESCO pide que los componentes de la serie se gestionen sin intervención. Es decir, que el bosque
      siga siendo lo que es.
    before: >-
      El centro de Nová Sedlica permanece cerrado esta temporada estival por obras. Los perros solo pueden ir
      con correa y bozal, y no se debe dañar ni destruir plantas, árboles ni animales.
    around: >-
      Stužica casi toca el [Bieszczadzki Park Narodowy - Kompleks
      leśny](/lugar/bieszczadzki-park-narodowy---kompleks-lesny/), a un kilómetro. Algo más lejos están la
      [Národná prírodná rezervácia Rožok](/lugar/narodna-prirodna-rezervacia-rozok/), a unos once km, y la
      [Národná prírodná rezervácia Havešová](/lugar/narodna-prirodna-rezervacia-havesova/), a unos catorce km.
      Las dos forman, como Stužica, parte del [Bukovské vrchy pralesový komplex - NP
      Poloniny](/lugar/bukovske-vrchy-pralesovy-komplex-np-poloniny/).


      Entre los lugares afines, el [Białowieski Park Narodowy - Rezerwat
      ścisły](/lugar/bialowieski-park-narodowy---rezerwat-scisly/) y el [Belovezhskaya Pushcha - Sector
      Belaruso](/lugar/belovezhskaya-pushcha-sector-belaruso/) comparten bosque primario, bisonte y lince. Los
      [Munții Godeanu](/lugar/muntii-godeanu/) coinciden en el bisonte y el oso.
  en:
    intro: >-
      There is a spot in the Carpathians where three countries converge, and a trail that climbs up to it
      through one of the range's finest virgin woodlands. You set out from Nová Sedlica, Slovakia's
      easternmost village, at 416 metres above sea level; you cross the Národná prírodná rezervácia Stužica, a
      primary beech forest of the outer Eastern Carpathians; and you reach Mount Kremenec at 1210 metres,
      where the borders of Slovakia, Poland, and Ukraine meet. Stužica has enjoyed protection since 1908 and
      is today a national nature reserve.
    landscape: >-
      This forest took root in the wake of the last ice age, and has followed its own uninterrupted rhythms
      ever since. The terrain climbs from 620 to 1208 metres, and ecological conditions shift markedly with
      altitude: below and along slopes stretch primeval beech and mixed fir-beech woods; above emerge high
      mountain grasslands known as poloniny, which give the national park its name. The bedrock consists of
      micaceous sandstones and shales, while the mean annual temperature hovers between 5 and 6 °C.


      European beech, common ash, wych elm, and above all sycamore maple dominate the canopy. Through the
      reserve flows the Stužická stream, joined by its tributary Kamenistý potok. And the ancient woodland
      does not stop at the border: it continues uninterrupted into Ukraine as the Stužycia-Užok massif.
    wildlife: >-
      The reserve is prime habitat for large carnivores. Wildlife recorded for Stužica includes the [grey
      wolf](/especie/canis_lupus/), the [brown bear](/especie/ursus_arctos/), the [Eurasian
      lynx](/especie/lynx_lynx/), and the [Eurasian otter](/especie/lutra_lutra/). In its dedicated reserve
      inventory, the park authority also lists the [European bison](/especie/bison_bonasus/) and the
      [moose](/especie/alces_alces/).


      What dominates the senses, however, is the forest itself: monumental beeches, ashes, and sycamores that
      have grown through centuries without the touch of an axe.
    visit: >-
      Park authorities count the virgin forest of Stužica among the most visited destinations in Poloniny,
      explored along marked hiking route TCH 0918, which links Nová Sedlica, the Stužica forest, and Kremenec.
      This is the red-marked Carpathian ridge trail: departing Nová Sedlica, it bisects the reserve and climbs
      directly to Kremenec at the tripoint.


      From Kremenec, the red route follows the main crest of the Bukovské vrchy across the summits of Kamenná
      lúka (1201 m), Riaba skala (1167 m), and Pľaša (1162 m), leading down to the Ruské sedlo pass (797 m).
      An alternative option is the yellow-marked trail along the Hlboký potok valley, which climbs to the
      Riaba skala viewpoint—reputed by the park service to offer the finest panorama in the national park.


      In Nová Sedlica you will find the local information centre, providing park maps and regional background.
      Its small natural history display features Arči, a mounted European bison. This is a village facility,
      situated outside the actual reserve.
    history: >-
      The forest has been legally protected for more than a century: initial conservation dates to 1908, and
      in 1993 the territory was elevated to a national nature reserve. In 2007, Stužica and other ancient
      Carpathian sites, including six components in Ukraine, were inscribed as a UNESCO World Heritage
      property. Note that the Slovak national reserve and the UNESCO Stužica–Bukovské vrchy component cover
      slightly different administrative boundaries.


      UNESCO mandates strict non-intervention management for all component parts. In other words, leaving the
      forest entirely free to remain what it is.
    before: >-
      The visitor centre in Nová Sedlica is closed this summer season due to renovation works. Dogs must be
      kept on a leash and muzzled at all times, and damaging or disturbing plants, trees, or wildlife is
      strictly prohibited.
    around: >-
      Stužica almost borders [Bieszczadzki Park Narodowy - Kompleks
      leśny](/lugar/bieszczadzki-park-narodowy---kompleks-lesny/), situated just a kilometre away. A little
      further afield lie [Národná prírodná rezervácia Rožok](/lugar/narodna-prirodna-rezervacia-rozok/) at
      roughly eleven km, and [Národná prírodná rezervácia
      Havešová](/lugar/narodna-prirodna-rezervacia-havesova/) at about fourteen km. Both share with Stužica
      membership in the [Bukovské vrchy pralesový komplex - NP
      Poloniny](/lugar/bukovske-vrchy-pralesovy-komplex-np-poloniny/).


      Among comparable protected areas, [Białowieski Park Narodowy - Rezerwat
      ścisły](/lugar/bialowieski-park-narodowy---rezerwat-scisly/) and [Belovezhskaya Pushcha - Sector
      Belaruso](/lugar/belovezhskaya-pushcha-sector-belaruso/) share primeval forest ecosystems, European
      bison, and lynx. [Munții Godeanu](/lugar/muntii-godeanu/) coincide in bison and brown bear.
  fr:
    intro: >-
      Il existe dans les Carpates un sommet où se rejoignent trois pays, et un sentier qui y monte à travers
      l'une des forêts les mieux préservées de la chaîne. Vous partez de Nová Sedlica, le village le plus
      oriental de Slovaquie, à 416 mètres d'altitude ; vous traversez la Národná prírodná rezervácia Stužica,
      hêtraie primaire des Carpates orientales extérieures ; et vous atteignez le mont Kremenec à 1210 mètres,
      point de rencontre des frontières de Slovaquie, de Pologne et d'Ukraine. Stužica est protégée depuis
      1908 et possède aujourd'hui le statut de réserve naturelle nationale.
    landscape: >-
      Cette forêt s'est établie au lendemain de la dernière glaciation et suit depuis son propre tempo
      naturel. Le relief s'élève de 620 à 1208 mètres d'altitude, et les conditions écologiques se modifient
      avec la pente : en bas et sur les versants s'épanouissent des forêts primaires de hêtres purs ou mêlés
      de sapins ; sur les crêtes se déploient les pâturages montagnards appelés poloniny, qui ont donné leur
      nom au parc. Le substrat se compose de grès micacés et de schistes, et la température moyenne annuelle
      s'établit entre 5 et 6 °C.


      Dans la canopée dominent le hêtre, le frêne, l'orme de montagne et par-dessus tout l'érable sycomore. La
      réserve est baignée par le torrent Stužická et son affluent le Kamenistý potok. Cette forêt immémoriale
      ne s'arrête pas à la frontière : elle se prolonge en territoire ukrainien au sein du massif de
      Stužycia-Užok.
    wildlife: >-
      La réserve constitue le domaine privilégié des grands prédateurs. Parmi les mammifères répertoriés à
      Stužica figurent le [loup](/especie/canis_lupus/), l'[ours brun](/especie/ursus_arctos/), le [lynx
      boréal](/especie/lynx_lynx/) et la [loutre d'Europe](/especie/lutra_lutra/). Dans ses documents
      spécialisés, l'administration du parc recense également le [bison d'Europe](/especie/bison_bonasus/) et
      l'[élan](/especie/alces_alces/).


      Ce qui subjugue le regard reste néanmoins le sanctuaire forestier lui-même : hêtres, frênes et érables
      colossaux qui ont grandi sans jamais subir la cognée humaine.
    visit: >-
      La direction du parc classe la forêt primaire de Stužica parmi les sites les plus fréquentés des
      Poloniny, parcourue par un sentier balisé, le TCH 0918, qui relie Nová Sedlica, le bois de Stužica et le
      Kremenec. Il s'agit du sentier rouge de la crête carpatique : parti de Nová Sedlica, il traverse la
      réserve pour gagner le sommet du Kremenec au tripoint frontalier.


      Depuis le Kremenec, le tracé rouge longe la ligne de crête des Bukovské vrchy en franchissant les
      sommets de Kamenná lúka (1201 m), Riaba skala (1167 m) et Pľaša (1162 m), jusqu'au col de Ruské sedlo
      (797 m). Une alternative existe : le sentier balisé en jaune de la vallée du Hlboký potok, qui débouche
      au belvédère de Riaba skala, offrant d'après le parc la plus belle vue panoramique du massif.


      À Nová Sedlica se trouve la maison d'information, qui diffuse les cartes et documentations du parc. Son
      exposition présente le bison Arči naturalisé. C'est une structure d'accueil villageoise, située en
      dehors de la réserve.
    history: >-
      La forêt bénéficie d'une protection légale depuis plus d'un siècle : classée dès 1908, elle a accédé en
      1993 au statut de réserve naturelle nationale. En 2007, Stužica et plusieurs sanctuaires carpatiques,
      dont six composants en Ukraine, ont été inscrits au patrimoine mondial de l'UNESCO. Notez que la réserve
      nationale et le bien UNESCO Stužica–Bukovské vrchy présentent des limites légèrement divergentes.


      L'UNESCO préconise une gestion intégrale sans exploitation pour l'ensemble des sites de la série. En
      somme, laisser la forêt s'épanouir dans sa liberté originelle.
    before: >-
      Le point d'information de Nová Sedlica est fermé durant la saison estivale en raison de travaux de
      rénovation. Les chiens doivent être tenus en laisse et muselés en permanence, et il est formellement
      interdit de détruire ou perturber végétaux et animaux.
    around: >-
      Stužica jouxte presque le [Bieszczadzki Park Narodowy - Kompleks
      leśny](/lugar/bieszczadzki-park-narodowy---kompleks-lesny/), situé à seulement un kilomètre. Un peu plus
      loin s'étendent la [Národná prírodná rezervácia Rožok](/lugar/narodna-prirodna-rezervacia-rozok/) à
      environ onze km et la [Národná prírodná rezervácia
      Havešová](/lugar/narodna-prirodna-rezervacia-havesova/) à quatorze km environ. Toutes deux s'intègrent
      avec Stužica dans le [Bukovské vrchy pralesový komplex - NP
      Poloniny](/lugar/bukovske-vrchy-pralesovy-komplex-np-poloniny/).


      Parmi les espaces apparentés, le [Białowieski Park Narodowy - Rezerwat
      ścisły](/lugar/bialowieski-park-narodowy---rezerwat-scisly/) et le [Belovezhskaya Pushcha - Sector
      Belaruso](/lugar/belovezhskaya-pushcha-sector-belaruso/) partagent la forêt primaire, le bison et le
      lynx. Les [Munții Godeanu](/lugar/muntii-godeanu/) réunissent le bison et l'ours brun.
  de:
    intro: >-
      Es gibt in den Karpaten einen Punkt, an dem drei Länder zusammentreffen, und einen Bergpfad, der durch
      einen der besterhaltenen Urwälder des Gebirges dorthin hinaufsteigt. Du startest in Nová Sedlica, dem
      östlichsten Dorf der Slowakei, auf 416 Metern Seehöhe; durchquerst das strenge Reservat Národná prírodná
      rezervácia Stužica, einen Buchen-Urwald der äußeren Ostkarpaten; und erreichst den Kremenec auf 1210
      Metern Höhe, wo die Grenzen der Slowakei, Polens und der Ukraine aufeinandertreffen. Stužica steht
      bereits seit 1908 unter Schutz und ist heute ein Nationales Naturreservat.
    landscape: >-
      Dieser Urwald entstand nach der letzten Eiszeit und folgt seither ununterbrochen seinem eigenen
      Rhythmus. Das Gelände steigt von 620 auf 1208 Meter Seehöhe an, und mit der Höhe wandeln sich die
      ökologischen Verhältnisse: Unten und an den Hängen stocken Urwälder aus Rotbuche und Tanne; oben breiten
      sich baumfreie Bergwiesen aus, die poloniny genannt werden und dem Nationalpark seinen Namen gaben. Das
      Ausgangsgestein besteht aus glimmerreichen Sandsteinen und Tonschiefern, während die
      Jahresmitteltemperatur zwischen 5 und 6 °C liegt.


      Im Kronendach herrschen Rotbuche, Gemeine Esche, Berg-Ulme und vor allem Berg-Ahorn vor. Durch das
      Schutzgebiet fließt der Bergbach Stužická mit seinem Zufluss Kamenistý potok. Und der Urwald endet nicht
      am Grenzzaun: Er setzt sich jenseits der Staatsgrenze in der Ukraine im Massiv Stužycia-Užok fort.
    wildlife: >-
      Das Reservat ist Lebensraum großer Raubsäuger. Zu den für Stužica dokumentierten Arten zählen
      [Wolf](/especie/canis_lupus/), [Braunbär](/especie/ursus_arctos/), [Eurasischer
      Luchs](/especie/lynx_lynx/) und [Eurasischer Fischotter](/especie/lutra_lutra/). In ihren
      Schutzgebietsberichten führt die Nationalparkverwaltung zudem [Wisent](/especie/bison_bonasus/) und
      [Elch](/especie/alces_alces/) an.


      Das beherrschende Element bleibt jedoch der Urwald selbst: Jahrhundertealte Buchen, Eschen und
      Berg-Ahorne, die ohne jeden Axtschlag herangewachsen sind.
    visit: >-
      Die Nationalparkverwaltung zählt den Urwald Stužica zu den beliebtesten Ausflugszielen der Poloniny.
      Erschlossen wird er durch den markierten Wanderweg TCH 0918, der Nová Sedlica, den Wald Stužica und den
      Kremenec verbindet. Es ist der rot markierte Karpatenkammweg: Er beginnt in Nová Sedlica, durchschneidet
      das Schutzgebiet und steigt zum Kremenec am Dreiländereck an.


      Vom Kremenec folgt der rote Weg dem Hauptkamm der Bukovské vrchy über die Gipfel Kamenná lúka (1201 m),
      Riaba skala (1167 m) und Pľaša (1162 m) bis zum Pass Ruské sedlo (797 m). Eine lohnende Alternative
      bietet die gelbe Route durch das Tal Hlboký potok hinauf zum Aussichtspunkt Riaba skala, der laut
      Nationalparkverwaltung das schönste Panorama des gesamten Parks eröffnet.


      In Nová Sedlica befindet sich das Informationszentrum, das Wanderkarten und Auskünfte bereitstellt. In
      der Naturausstellung ist der präparierte Wisent Arči zu sehen. Es handelt sich um eine Einrichtung im
      Dorf außerhalb des eigentlichen Reservats.
    history: >-
      Der Wald ist seit mehr als einem Jahrhundert geschützt: Der erste Schutzstatus datiert von 1908, und
      1993 wurde das Gebiet zum Nationalen Naturreservat erhoben. Im Jahr 2007 wurden Stužica und weitere
      Karpaten-Urwälder, darunter sechs Teilgebiete in der Ukraine, als UNESCO-Weltnaturerbe ausgewiesen. Das
      slowakische Reservat und die Welterbekomponente Stužica–Bukovské vrchy weichen in ihren Grenzen leicht
      voneinander ab.


      Die UNESCO fordert für alle Teilgebiete ein striktes Prozessschutzmanagement ohne Eingriffe. Das
      bedeutet schlicht, den Wald ganz sich selbst zu überlassen.
    before: >-
      Das Informationszentrum in Nová Sedlica bleibt in dieser Sommersaison wegen Sanierungsarbeiten
      geschlossen. Hunde müssen ausnahmslos an der Leine geführt werden und einen Maulkorb tragen; das
      Beschädigen oder Entnehmen von Pflanzen, Pilzen und Tieren ist streng untersagt.
    around: >-
      Stužica grenzt fast an den [Bieszczadzki Park Narodowy - Kompleks
      leśny](/lugar/bieszczadzki-park-narodowy---kompleks-lesny/), der nur einen Kilometer entfernt liegt.
      Etwas weiter entfernt liegen das Schutzgebiet [Národná prírodná rezervácia
      Rožok](/lugar/narodna-prirodna-rezervacia-rozok/) in etwa elf km und [Národná prírodná rezervácia
      Havešová](/lugar/narodna-prirodna-rezervacia-havesova/) in rund vierzehn km Entfernung. Beide bilden
      gemeinsam mit Stužica den [Bukovské vrchy pralesový komplex - NP
      Poloniny](/lugar/bukovske-vrchy-pralesovy-komplex-np-poloniny/).


      Unter den verwandten Schutzgebieten weisen der [Białowieski Park Narodowy - Rezerwat
      ścisły](/lugar/bialowieski-park-narodowy---rezerwat-scisly/) und [Belovezhskaya Pushcha - Sector
      Belaruso](/lugar/belovezhskaya-pushcha-sector-belaruso/) Primärwald, Wisent und Luchs auf. Das Massiv
      [Munții Godeanu](/lugar/muntii-godeanu/) teilt Wisent und Braunbär.
  it:
    intro: >-
      Esiste un valico nei Carpazi in cui si incontrano tre nazioni, e un sentiero che vi sale attraversando
      una delle foreste vergini meglio preservate dell'intera catena montuosa. Si parte da Nová Sedlica, il
      villaggio più orientale della Slovacchia, a 416 metri di quota; si attraversa la Národná prírodná
      rezervácia Stužica, faggeta primaria dei Carpati orientali esterni; e si raggiunge il monte Kremenec a
      1210 metri, dove convergono i confini di Slovacchia, Polonia e Ucraina. Stužica gode di tutela fin dal
      1908 ed è oggi una riserva naturale nazionale.
    landscape: >-
      Questo bosco si è insediato all'indomani dell'era glaciale, seguendo da allora i propri ritmi naturali
      spontanei. La morfologia sale da 620 a 1208 metri di altitudine, e con la quota mutano gli orizzonti
      vegetazionali: in basso e lungo i versanti si estendono foreste primarie di faggio puro o associato
      all'abete bianco; in alto si aprono le praterie sommitali note come poloniny, che conferiscono il nome
      al parco nazionale. Il substrato geologico è formato da arenarie micacee e scisti argillosi, mentre la
      temperatura media annua si colloca tra 5 e 6 °C.


      Nel consorzio forestale dominano il faggio, il frassino maggiore, l'olmo montano e l'acero montano.
      All'interno della riserva scorre il torrente Stužická con il tributario Kamenistý potok. La foresta
      vetusta non si arresta alla linea di confine: prosegue oltre frontiera in territorio ucraino nel
      comprensorio di Stužycia-Užok.
    wildlife: >-
      La riserva costituisce l'habitat ideale per grandi mammiferi. Tra le specie documentate a Stužica
      figurano il [lupo grigio](/especie/canis_lupus/), l'[orso bruno](/especie/ursus_arctos/), la [lince
      euroasiatica](/especie/lynx_lynx/) e la [lontra europea](/especie/lutra_lutra/). Nelle relazioni
      specializzate l'ente gestore include inoltre il [bisonte europeo](/especie/bison_bonasus/) e
      l'[alce](/especie/alces_alces/).


      Ciò che colpisce maggiormente lo sguardo rimane tuttavia l'architettura stessa del bosco: faggi,
      frassini e aceri monumentali cresciuti indisturbati nei secoli senza mai conoscere il taglio dei
      boscaioli.
    visit: >-
      L'amministrazione del parco annovera la foresta primaria di Stužica tra le mete più battute di Poloniny,
      percorsa dal sentiero escursionistico segnalato TCH 0918 che unisce Nová Sedlica, la foresta di Stužica
      e il Kremenec. È il sentiero contrassegnato in rosso che percorre il crinale dei Carpati: prende il via
      da Nová Sedlica, taglia la riserva e sale fino al Kremenec sulla linea di confine tripartita.


      Dal Kremenec il percorso rosso prosegue lungo la cresta primaria dei Bukovské vrchy solcando le vette di
      Kamenná lúka (1201 m), Riaba skala (1167 m) e Pľaša (1162 m), fino a scendere al valico di Ruské sedlo
      (797 m). Un'opzione alternativa è offerta dal tracciato giallo della valle di Hlboký potok, che
      raggiunge il belvedere di Riaba skala, giudicato dal parco il miglior punto panoramico del comprensorio.


      A Nová Sedlica si trova il centro informazioni locale, che distribuisce cartografia e materiale
      divulgativo. Il percorso espositivo ospita l'esemplare impagliato del bisonte Arči. Si tratta di una
      struttura museale situata nel centro abitato, all'esterno della riserva naturale.
    history: >-
      La foresta vanta una storia di protezione ultrasecolare: le prime disposizioni di tutela risalgono al
      1908, e nel 1993 l'area è stata promossa a riserva naturale nazionale. Nel 2007 Stužica e altre faggete
      relitte dei Carpati, comprendenti sei componenti in territorio ucraino, sono state dichiarate Patrimonio
      Mondiale dell'UNESCO. Si segnala che la riserva statale slovacca e il bene UNESCO Stužica–Bukovské vrchy
      presentano perimetri lievemente differenziati.


      L'UNESCO prescrive per i siti inclusi nel bene seriale un regime di integrale non intervento. In breve,
      lasciare che la foresta permanga nella sua assoluta integrità.
    before: >-
      Il centro visite di Nová Sedlica resta chiuso durante la corrente stagione estiva per interventi di
      riqualificazione. I cani possono accedere unicamente se provvisti di guinzaglio e museruola, ed è
      severamente vietato danneggiare piante, alberi o disturbare la fauna.
    around: >-
      Stužica tocca quasi il confine con il [Bieszczadzki Park Narodowy - Kompleks
      leśny](/lugar/bieszczadzki-park-narodowy---kompleks-lesny/), distante appena un chilometro. A breve
      distanza sorgono la [Národná prírodná rezervácia Rožok](/lugar/narodna-prirodna-rezervacia-rozok/) a
      circa undici km e la [Národná prírodná rezervácia
      Havešová](/lugar/narodna-prirodna-rezervacia-havesova/) a quattordici km circa. Entrambe fanno parte con
      Stužica del [Bukovské vrchy pralesový komplex - NP
      Poloniny](/lugar/bukovske-vrchy-pralesovy-komplex-np-poloniny/).


      Tra le foreste affini, il [Białowieski Park Narodowy - Rezerwat
      ścisły](/lugar/bialowieski-park-narodowy---rezerwat-scisly/) e [Belovezhskaya Pushcha - Sector
      Belaruso](/lugar/belovezhskaya-pushcha-sector-belaruso/) condividono la foresta primaria, il bisonte e
      la lince. Il massiccio [Munții Godeanu](/lugar/muntii-godeanu/) ospita anch'esso bisonte e orso bruno.
  pt:
    intro: >-
      Existe um cume nos Cárpatos onde convergem três países, e um trilho de montanha que sobe até ele
      atravessando uma das florestas virgens mais pristinas da cordilheira. O ponto de partida é Nová Sedlica,
      a aldeia mais oriental da Eslováquia, a 416 metros de altitude; atravessas a Národná prírodná rezervácia
      Stužica, faial primário dos Cárpatos orientais exteriores; e alcanças o monte Kremenec a 1210 metros,
      onde se tocam as fronteiras de Eslováquia, Polónia e Ucrânia. Stužica beneficia de proteção desde 1908,
      detendo hoje o estatuto de reserva natural nacional.
    landscape: >-
      Esta floresta estabeleceu-se no termo da última era glaciar, seguindo desde então uma cadência biológica
      imperturbada. A orografia eleva-se dos 620 aos 1208 metros de altitude, e as condições ecológicas
      alteram-se com o ganho de cota: na base e nas encostas medram matas primárias de faia e de faia com
      abeto; nas cristas abrem-se prados alpinos conhecidos por poloniny, que emprestam o nome ao parque
      nacional. O substrato assenta em arenitos micáceos e xistos, situando-se a temperatura média anual entre
      5 e 6 °C.


      No estrato arbóreo predominam a faia, o freixo, o olmo-montano e o bordo-falso. Pela reserva corre o
      regato Stužická, alimentado pelo afluente Kamenistý potok. E a floresta ancestral não se interrompe na
      linha de fronteira: estende-se em solo ucraniano pelo maciço de Stužycia-Užok.
    wildlife: >-
      A reserva consubstancia um refúgio de eleição para os grandes carnívoros. Entre as espécies
      inventariadas em Stužica destacam-se o [lobo-cinzento](/especie/canis_lupus/), o
      [urso-pardo](/especie/ursus_arctos/), o [lince-euroasiático](/especie/lynx_lynx/) e a
      [lontra-europeia](/especie/lutra_lutra/). Nos relatórios específicos, a administração do parque menciona
      ainda o [bisonte-europeu](/especie/bison_bonasus/) e o [alce](/especie/alces_alces/).


      O elemento mais marcante permanece, contudo, o próprio templo florestal: faias, freixos e bordos
      centenários que se desenvolveram livres de qualquer abate.
    visit: >-
      Os serviços do parque incluem a mata primitiva de Stužica entre os destinos mais procurados de Poloniny,
      servida pelo percurso balizado TCH 0918 que conecta Nová Sedlica, o bosque de Stužica e o Kremenec.
      Trata-se do percurso pedestre assinalado a vermelho ao longo da crista dos Cárpatos: inicia-se em Nová
      Sedlica, cruza a reserva e sobe até ao cume do Kremenec na tríplice fronteira.


      A partir do Kremenec, a rota vermelha prossegue pela crista principal de Bukovské vrchy galgando os
      cumes de Kamenná lúka (1201 m), Riaba skala (1167 m) e Pľaša (1162 m), descendo depois até ao colo de
      Ruské sedlo (797 m). Uma rota alternativa é o caminho de marcas amarelas pelo vale de Hlboký potok, que
      conduz ao miradouro de Riaba skala, considerado pela equipa do parque a panorâmica mais arrebatadora do
      parque nacional.


      Em Nová Sedlica situa-se o posto informativo local, que facultava mapas e publicações da área protegida.
      O seu núcleo expositivo alberga o exemplar embalsamado do bisonte Arči. É uma instalação na aldeia,
      situada fora da reserva.
    history: >-
      A mata goza de proteção jurídica há mais de um século: foi classificada em 1908 e em 1993 foi
      reclassificada como reserva natural nacional. Em 2007, Stužica e outros núcleos carpáticos, abrangendo
      seis componentes na Ucrânia, integraram o Património Mundial da UNESCO. Cumpre notar que a reserva
      eslovaca e o bem UNESCO Stužica–Bukovské vrchy detêm delimitações cartográficas ligeiramente distintas.


      A UNESCO preconiza para os elementos deste bem serial uma gestão de integral não intervenção. Por outras
      palavras, garantir que o bosque perdure no seu estado pristino.
    before: >-
      O centro informativo de Nová Sedlica encontra-se encerrado durante a presente época estival para
      trabalhos de manutenção. Os cães devem circular sempre com trela e açaime, sendo absolutamente proibido
      colher plantas ou perturbar a fauna.
    around: >-
      Stužica confina praticamente com o [Bieszczadzki Park Narodowy - Kompleks
      leśny](/lugar/bieszczadzki-park-narodowy---kompleks-lesny/), distante apenas um quilómetro. A curta
      distância encontram-se a [Národná prírodná rezervácia Rožok](/lugar/narodna-prirodna-rezervacia-rozok/)
      a sensivelmente onze km e a [Národná prírodná rezervácia
      Havešová](/lugar/narodna-prirodna-rezervacia-havesova/) a perto de catorze km. Ambas partilham com
      Stužica a pertença ao complexo [Bukovské vrchy pralesový komplex - NP
      Poloniny](/lugar/bukovske-vrchy-pralesovy-komplex-np-poloniny/).


      Nos espaços congéneres, o [Białowieski Park Narodowy - Rezerwat
      ścisły](/lugar/bialowieski-park-narodowy---rezerwat-scisly/) e [Belovezhskaya Pushcha - Sector
      Belaruso](/lugar/belovezhskaya-pushcha-sector-belaruso/) partilham floresta primária, bisonte e lince.
      Os [Munții Godeanu](/lugar/muntii-godeanu/) reúnem igualmente o bisonte e o urso-pardo.
