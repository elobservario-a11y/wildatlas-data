resumen:
  es: >-
    Reserva de la Biosfera y Geoparque UNESCO que combina las gargantas kársticas del río Calore con los
    acantilados marinos de Cabo Palinuro.
  en: >-
    UNESCO Biosphere Reserve and Global Geopark uniting the karst gorges of the Calore River with the dramatic
    sea cliffs of Cape Palinuro.
  fr: >-
    Réserve de biosphère et géoparc UNESCO associant les gorges karstiques du fleuve Calore aux falaises
    maritimes du cap Palinuro.
  de: >-
    UNESCO-Biosphärenreservat und Geopark, der die Karstschluchten des Flusses Calore mit den Steilküsten von
    Capo Palinuro vereint.
  it: >-
    Riserva della Biosfera e Geoparco UNESCO che unisce le forre carsiche del fiume Calore alle falesie marine
    di Capo Palinuro.
  pt: >-
    Reserva da Biosfera e Geoparque UNESCO que conjuga as gargantas cársicas do rio Calore com as falésias
    marinhas do Cabo Palinuro.
unico:
  es: >-
    En un mismo parque hay una costa de acantilados con flores que solo crecen allí, cimas de casi dos mil
    metros con hayedos y gargantas con nutria, y por encima de todo, el Monte Sacro, quizá sagrado antes de
    que lo fuera para el cristianismo.
  en: >-
    Within a single park thrive sea cliffs harbouring flowers found nowhere else, summits nearing two thousand
    metres cloaked in beechwoods, and gorges with otters, dominated by Monte Sacro, revered long before the
    advent of Christianity.
  fr: >-
    Un seul parc réunit un littoral de falaises abritant des fleurs exclusives, des sommets de près de deux
    mille mètres couronnés de hêtraies, des gorges à loutres et, par-dessus tout, le Monte Sacro, vénéré bien
    avant l'ère chrétienne.
  de: >-
    In einem einzigen Park begegnen sich Steilküsten mit endemischen Blütenpflanzen, fast zweitausend Meter
    hohe Buchenberge, Otterschluchten und der Monte Sacro, der schon vor dem Christentum heilig war.
  it: >-
    In un unico parco convivono scogliere con fiori endemici esclusivi, vette di quasi duemila metri coperte
    da faggete, forre con la lontra e, su tutto, il Monte Sacro, venerato prima ancora della cristianità.
  pt: >-
    Num mesmo parque convergem falésias marítimas com flores exclusivas, cumes de quase dois mil metros
    coroados por faiais, desfiladeiros fluviais com lontras e o Monte Sacro, venerado muito antes do
    cristianismo.
observaciones:
  es: Consulta con el parque el estado de los senderos y los horarios de los museos antes de salir.
texto:
  es:
    intro: >-
      Bajar a la garganta del Sammaro es entrar en las entrañas de la tierra, solo que de allí, en lugar de
      fuego, brota agua limpia y fresca que pule las rocas calizas del fondo hasta dejarlas blancas y lisas.
      Esa imagen resume el Parque Nacional del Cilento, Vallo di Diano y Alburni: un territorio escarpado
      donde la montaña llega hasta la costa, con 181.048 hectáreas en el sur de la provincia de Salerno, entre
      la llanura del Sele, Basilicata y el mar.
    landscape: >-
      El relieve es marcado, a menudo áspero. Hay pocas zonas llanas, casi todas junto a los ríos principales,
      el Alento en la costa y el Tanagro en el Vallo di Diano. Las cumbres principales son el Cervati (1.898
      m), los Alburni (1.742 m), el Gelbison o Monte Sacro (1.705 m) y el Motola (1.743 m). La costa es baja y
      arenosa del Sele a Agropoli y entre Casal Velino y Ascea; en el resto, alta y rocosa, con grutas y
      calas.


      Dos rocas explican casi todo. Una es el flysch del Cilento, colorido y estratificado, en la cuenca del
      Alento y en la costa norte. La otra es la caliza con cavidades kársticas, que forma los macizos
      interiores Alburno-Cervati. Esa diversidad de rocas y de formas es lo que sostiene la variedad de la
      flora y la vegetación del parque, que distingue tres grandes áreas: el complejo Gelbison-Cervati, los
      montes Alburni y el Cilento costero.


      La vegetación sube del mar a la cumbre. En la costa, entre acantilados, viven el raro lirio marino, la
      endémica estátice salernitana y la primula de Palinuro, un raro endemismo costero que es el símbolo del
      parque. En el interior dominan los bosques de caducifolios, encinares, robles y arces, y por encima de
      los 1.000 m manda el haya, con el raro agracejo del Etna y saxífragas. Se han censado unas 1.800
      especies vegetales y 25 hábitats, y 254 de las 319 especies de orquídeas silvestres señaladas en toda
      Europa y la cuenca del Mediterráneo.
    wildlife: >-
      El agua es el hilo de la vida salvaje. En los cursos de agua viven nutrias, y cerca de los manantiales,
      salamandrinas de anteojos y [salamandras](/especie/salamandra_salamandra/) comunes; en ríos de aguas
      transparentes y oxigenadas pueden aparecer truchas macrostigma y [mirlos
      acuáticos](/especie/cinclus_cinclus/). En las Sorgenti del Sammaro la [nutria](/especie/lutra_lutra/)
      vive todavía sin ser molestada, y el parque recomienda la primavera y el otoño para ir.


      Por tierra, el [lobo](/especie/canis_lupus/) apenino vive en bosques colinares, también a gran altura,
      no muy cerca de los núcleos densamente poblados. Los [jabalíes](/especie/sus_scrofa/) son numerosísimos;
      el [ciervo](/especie/cervus_elaphus/) se reintrodujo en 2004 y el [corzo](/especie/capreolus_capreolus/)
      en 2003. El [gato montés](/especie/felis_silvestris/) es otra rareza natural de gran interés para el
      parque, y entre los murciélagos hay numerosas especies, entre ellas el murciélago rabudo, el de cueva,
      el ratonero grande, el patudo y el ratonero mediano.


      En el cielo, rapaces como el [águila real](/especie/aquila_chrysaetos/), la culebrera europea, el
      [halcón peregrino](/especie/falco_peregrinus/), el halcón borní, el cuervo, el [búho
      real](/especie/bubo_bubo/) y el cárabo; es de gran interés el azor. Junto a los cursos de agua viven el
      martín pescador, el mirlo acuático y el chorlitejo chico, y hay un núcleo invernante de la rara gaviota
      corsa. Y en el mar, la [tortuga boba](/especie/caretta_caretta/) se ha visto en las costas arenosas de
      Marina di Camerota, donde en 2020 se registró el último caso de nidificación; se han señalado también
      cetáceos como el [delfín mular](/especie/tursiops_truncatus/), el cachalote y el delfín listado. Los
      invertebrados prioritarios son Osmoderma eremita y [Rosalia alpina](/especie/rosalia_alpina/); las
      especies de interés comunitario son 63.
    visit: >-
      Por la vastedad del parque lo mejor es entrar por puntos distintos según el destino. Se llega bien desde
      Capaccio-Paestum o Sapri para el Cilento y desde Sala Consilina y Monte San Giacomo para el Vallo di
      Diano.


      Dos excursiones cuentan el parque entero. La del Monte Sacro sigue el torrente Torna entre vegetación
      densa, areniscas, pozas y pequeñas cascadas, pasa por la fuente de Fiumefreddo, donde brota agua limpia
      y fresca junto a una imagen de la Virgen, y llega a la cumbre del Gelbison; para ir se recomienda de
      abril a octubre. En las laderas se ven geositios estratigráficos como el olistostroma, la marga foliada
      y el stone stream. La otra es la de las Sorgenti del Sammaro: senderos y pequeños puentes de madera
      acompañan el agua por la garganta, el geositio 73.


      Entre los lugares que explican el parque, en Corleto Monforte está el Museo Naturalista de los Alburni y
      en Magliano Vetere el Museo Paleontológico del parque. El camino Magliano Nuovo-Postiglione es un
      sendero de trekking que pasa por el puente medieval de Magliano Nuovo y por entero por las Gole del
      Calore. En Casaletto Spartano están las cascadas Capelli di Venere, en Morigerati hay un oasis del WWF
      con grutas donde resurge el río Bussento, y en Petina un observatorio astronómico en la localidad de
      Aresta.
    history: >-
      Desde 1973 se hablaba de proteger el Cilento de la especulación urbanística y de un turismo de masas
      destructivo, en un congreso internacional en Castellabate. El parque se creó en 1991 con la ley marco de
      áreas protegidas, y su primer presidente fue el naturalista Vincenzo La Valva. Empezó con unas 36.000
      hectáreas y se amplió hasta las 181.048 de hoy.


      Gelbison significa en árabe «montaña del ídolo», y la montaña quizá era sagrada antes de que los monjes
      basilianos fundaran el santuario de la cima, en el siglo X. La UNESCO lo reconoció como Reserva de la
      Biosfera en junio de 1997, y lo incluye como Patrimonio de la Humanidad con los sitios arqueológicos de
      Paestum, Velia y la Certosa di Padula. La red Natura 2000 cubre 118.316 hectáreas, el 65 % del parque.
    before: Consulta con el parque el estado de los senderos y los horarios de los museos antes de salir.
    around: El [Parco Nazionale del Pollino](/lugar/parco-nazionale-del-pollino/) queda a veintiocho kilómetros.
  en:
    intro: >-
      Descending into the Sammaro Gorge feels like stepping into the interior of the earth, except that
      instead of fire, cool crystalline water surges forth, polishing bedrock into smooth white limestone
      ramparts. That vivid impression encapsulates the Cilento, Vallo di Diano and Alburni National Park: a
      rugged terrain where mountains meet the Tyrrhenian Sea, embracing 181,048 hectares across southern
      Salerno province between the Sele plain, Basilicata, and the sea.
    landscape: >-
      The relief is sharply defined and rugged. Lowlands are sparse, concentrated mainly along primary river
      valleys: the Alento on the Tyrrhenian coast and the Tanagro in the Vallo di Diano. The principal summits
      are Monte Cervati (1,898 m), the Monti Alburni (1,742 m), Monte Gelbison or Monte Sacro (1,705 m), and
      Monte Motola (1,743 m). The shoreline is low and sandy from the Sele to Agropoli and between Casal
      Velino and Ascea, but elsewhere rises into towering rocky cliffs riddled with caves and secluded coves.


      Two geological formations govern the landscape. One is the Cilento flysch—richly coloured, layered
      sandstone and shale lining the Alento basin and northern coast. The other is pure karst limestone,
      shaping the cavernous inland massifs of Alburno-Cervati. This geological diversity underpins the park's
      exceptional botanical variety, organized into three large ecological sectors: the Gelbison-Cervati
      complex, the Monti Alburni, and the coastal Cilento.


      Vegetation ascends from the shoreline to alpine crests. Along sea cliffs bloom the rare sea daffodil,
      the endemic Salerno sea lavender, and the Palinuro primrose—a rare coastal endemic chosen as the park's
      floral emblem. Inland, deciduous woodlands of downy oak, holm oak, and maple dominate, giving way above
      1,000 m to extensive beech forests hosting rare Etna barberry and alpine saxifrages. Botanists have
      recorded around 1,800 plant species across 25 habitat types, including 254 of the 319 wild orchid
      species documented in Europe and the Mediterranean basin.
    wildlife: >-
      Freshwater is the lifeblood of this wild territory. Rivers support otters, while spring-fed headwaters
      nurture spectacled salamanders and common [fire salamanders](/especie/salamandra_salamandra/); cold,
      well-oxygenated reaches hold macrostigma trout and [white-throated dippers](/especie/cinclus_cinclus/).
      At Sorgenti del Sammaro, the [Eurasian otter](/especie/lutra_lutra/) thrives undisturbed, with spring
      and autumn offering optimal conditions for exploration.


      On land, the Apennine [grey wolf](/especie/canis_lupus/) roams upland forests and mountain ridges away
      from dense human settlements. [Wild boar](/especie/sus_scrofa/) are exceptionally abundant; [red
      deer](/especie/cervus_elaphus/) were reintroduced in 2004 and [roe deer](/especie/capreolus_capreolus/)
      in 2003. The [European wildcat](/especie/felis_silvestris/) represents another secretive predator of
      high conservation value, alongside diverse bats such as European free-tailed bat, Schreiber's
      bent-winged bat, greater mouse-eared bat, long-fingered bat, and Geoffroy's bat.


      Skywards soar birds of prey including [golden eagle](/especie/aquila_chrysaetos/), short-toed snake
      eagle, [peregrine falcon](/especie/falco_peregrinus/), lanner falcon, common raven, [Eurasian
      eagle-owl](/especie/bubo_bubo/), and tawny owl, alongside northern goshawk. Riparian corridors shelter
      common kingfisher, dipper, and little ringed plover, with wintering flocks of rare Audouin's gulls along
      the coast. In marine waters, [loggerhead sea turtles](/especie/caretta_caretta/) visit sandy beaches
      around Marina di Camerota, where the last documented nesting occurred in 2020; cetaceans include the
      [common bottlenose dolphin](/especie/tursiops_truncatus/), sperm whale, and striped dolphin. Priority
      invertebrates feature the hermit beetle and [Rosalia longicorn](/especie/rosalia_alpina/); species of
      community interest total 63.
    visit: >-
      Given the park's immense scale, access points depend on your destination. Convenient gateways include
      Capaccio-Paestum or Sapri for the coastal Cilento, and Sala Consilina or Monte San Giacomo for the Vallo
      di Diano.


      Two signature hikes capture the park's dual nature. The Monte Sacro trail follows the Torna torrent
      through dense woodland, sandstone beds, pools, and small cascades, passing Fiumefreddo spring—where
      crisp water flows beside an effigy of the Virgin Mary—to reach the summit of Gelbison; recommended from
      April to October. Along the slopes appear distinctive geolithological sites including olistostromes,
      foliated marls, and stone streams. The second route explores the Sorgenti del Sammaro: boardwalks and
      footbridges shadow the river through the deep limestone canyon, designated geosite 73.


      Key cultural and natural institutions include the Alburni Natural History Museum in Corleto Monforte and
      the Paleontological Museum in Magliano Vetere. The Magliano Nuovo–Postiglione trail crosses the medieval
      bridge of Magliano Nuovo and traces the full length of the Gole del Calore. In Casaletto Spartano flow
      the Capelli di Venere waterfalls, Morigerati preserves a WWF oasis with caves where the Bussento River
      resurfaces, and Petina hosts an astronomical observatory in Aresta.
    history: >-
      Calls to protect the Cilento from property speculation and uncontrolled mass tourism began in 1973 at an
      international conference held in Castellabate. The national park was officially instituted in 1991 under
      Italy's framework law for protected areas, led by founding president and naturalist Vincenzo La Valva.
      Beginning with around 36,000 hectares, it progressively expanded to its current 181,048 hectares.


      Gelbison derives from Arabic meaning «mountain of the idol», hinting that the summit was sacred long
      before Basilian monks founded the mountaintop sanctuary in the tenth century. UNESCO recognized the park
      as a Biosphere Reserve in June 1997 and inscribed it as a World Heritage Site alongside the
      archaeological sites of Paestum, Velia, and the Certosa di Padula. The Natura 2000 network encompasses
      118,316 hectares, representing 65 % of the national park.
    before: >-
      Check with park authorities regarding seasonal museum opening times and the accessibility of trails
      before departing.
    around: >-
      The [Parco Nazionale del Pollino](/lugar/parco-nazionale-del-pollino/) lies twenty-eight kilometres
      away.
  fr:
    intro: >-
      Descendre dans les gorges du Sammaro revient à pénétrer au cœur de la terre, d'où jaillit, en lieu et
      place du feu, une eau limpide et fraîche qui polit les calcaires du fond jusqu'à les rendre lisses et
      immaculés. Ce tableau résume le parc national du Cilento, Vallo di Diano et Alburni : un territoire
      escarpé où la montagne rejoint la mer, s'étendant sur 181 048 hectares au sud de la province de Salerne,
      entre la plaine du Sele, la Basilicate et le littoral tyrrhénien.
    landscape: >-
      Le relief se révèle marqué et souvent âpre. Les plaines sont rares, cantonnées aux cours d'eau majeurs :
      l'Alento sur la côte et le Tanagro dans le Vallo di Diano. Les principaux sommets sont le Cervati (1 898
      m), les Alburni (1 742 m), le Gelbison ou Monte Sacro (1 705 m) et le Motola (1 743 m). La côte s'étire
      basse et sableuse du Sele à Agropoli et entre Casal Velino et Ascea ; partout ailleurs, elle s'élève en
      falaises abruptes percées de grottes marines et de calanques.


      Deux types de roches forgent les paysages. D'une part, le flysch du Cilento, grès et marnes multicolores
      et stratifiés du bassin de l'Alento et de la côte nord. D'autre part, le calcaire karstifié formant les
      massifs intérieurs de l'Alburno et du Cervati. Cette diversité géologique porte la richesse floristique
      du parc, structurée en trois grands secteurs : le complexe Gelbison-Cervati, les monts Alburni et le
      Cilento côtier.


      La végétation s'étage de la mer aux crêtes. Sur les falaises littorales prospèrent le lis maritime, la
      statice de Salerne et la primevère de Palinuro, rare endémique devenue le symbole du parc. À l'intérieur
      dominent chênes pubescents, chênes verts et érables, relayés au-dessus de 1 000 m par la hêtraie, mêlée
      à l'épine-vinette de l'Etna et aux saxifrages. On recense environ 1 800 espèces végétales et 25
      habitats, dont 254 des 319 espèces d'orchidées sauvages recensées dans toute l'Europe et le bassin
      méditerranéen.
    wildlife: >-
      L'eau tisse la trame de la faune sauvage. Dans les cours d'eau vivent des loutres, tandis que les
      sources hébergent salamandrines à lunettes et [salamandres tachetées](/especie/salamandra_salamandra/) ;
      les eaux fraîches abritent truite macrostigma et [cincles plongeurs](/especie/cinclus_cinclus/). Aux
      Sorgenti del Sammaro, la [loutre d'Europe](/especie/lutra_lutra/) vit en toute quiétude, le parc
      recommandant le printemps et l'automne pour la visiter.


      Sur la terre ferme, le [loup](/especie/canis_lupus/) des Apennins hante les forêts collinéennes et
      d'altitude, à distance des grands centres urbains. Les [sangliers](/especie/sus_scrofa/) foisonnent ; le
      [cerf élaphe](/especie/cervus_elaphus/) a été réintroduit en 2004 et le
      [chevreuil](/especie/capreolus_capreolus/) en 2003. Le [chat sauvage](/especie/felis_silvestris/)
      constitue un autre prédateur précieux, aux côtés de nombreux chiroptères tels que le molosse de Cestoni,
      le minioptère de Schreibers, le grand murin et le murin de Capaccini.


      Dans les airs patrouillent [aigle royal](/especie/aquila_chrysaetos/), circaète Jean-le-Blanc, [faucon
      pèlerin](/especie/falco_peregrinus/), faucon lanier, grand corbeau, [hibou
      grand-duc](/especie/bubo_bubo/) et chouette hulotte, sans oublier l'autour des palombes. Près des
      rivières vivent martin-pêcheur et petit gravelot, tandis qu'une colonie de goélands d'Audouin hiverne
      sur la côte. En mer, la [tortue caouanne](/especie/caretta_caretta/) fréquente les plages de Marina di
      Camerota, où a été enregistrée en 2020 sa dernière ponte ; au large s'observent le [grand
      dauphin](/especie/tursiops_truncatus/), le cachalot et le dauphin bleu et blanc. Parmi les insectes
      protégés figurent le pique-prune et la [rosalie des Alpes](/especie/rosalia_alpina/) ; les espèces
      d'intérêt communautaire atteignent 63.
    visit: >-
      Compte tenu de l'étendue du parc, les accès se choisissent selon votre destination : Capaccio-Paestum ou
      Sapri pour le Cilento maritime, Sala Consilina et Monte San Giacomo pour le Vallo di Diano.


      Deux randonnées emblématiques illustrent le territoire. Celle du Monte Sacro remonte le torrent Torna
      parmi grès, vasques et cascades, fait halte à la source de Fiumefreddo jaillissant près d'une statue
      mariale, et culmine au sommet du Gelbison ; à parcourir d'avril à octobre. Les pentes révèlent des
      géosites stratigraphiques comme olistostromes et marnes feuilletées. La seconde mène aux Sorgenti del
      Sammaro : passerelles et sentiers longent les gorges calcaires, classées géosite 73.


      Parmi les musées notables, Corleto Monforte accueille le musée naturaliste des Alburni et Magliano
      Vetere le musée paléontologique. Le chemin Magliano Nuovo-Postiglione franchit le pont médiéval de
      Magliano Nuovo et parcourt les gorges du Calore. À Casaletto Spartano jaillissent les cascades Capelli
      di Venere, Morigerati abrite une oasis WWF aux résurgences du Bussento, et Petina héberge un
      observatoire astronomique à Aresta.
    history: >-
      Dès 1973, un colloque international réuni à Castellabate réclamait la protection du Cilento face à la
      spéculation immobilière. Le parc national fut officialisé en 1991 par la loi-cadre sur les espaces
      protégés, avec pour premier président le naturaliste Vincenzo La Valva. Débutant avec environ 36 000
      hectares, il s'est étendu pour atteindre ses 181 048 hectares actuels.


      Gelbison signifie en arabe « montagne de l'idole », le sommet ayant été un sanctuaire païen bien avant
      l'édification du monastère basilien au Xe siècle. L'UNESCO a classé le site Réserve de biosphère en juin
      1997, puis au Patrimoine mondial aux côtés des cités antiques de Paestum et Vélia et de la chartreuse de
      Padula. Le réseau Natura 2000 couvre 118 316 hectares, soit 65 % du territoire du parc.
    before: Vérifiez auprès du parc l'état des sentiers et les horaires des musées avant votre départ.
    around: Le [Parco Nazionale del Pollino](/lugar/parco-nazionale-del-pollino/) est situé à vingt-huit kilomètres.
  de:
    intro: >-
      In die Sammaro-Schlucht hinabzusteigen gleicht einem Gang ins Innere der Erde: Doch statt Feuer
      entspringt hier kristallklares, kühles Quellwasser, das die Kalksteine zu glatten weißen Wänden poliert.
      Dieses Bild veranschaulicht den Nationalpark Cilento, Vallo di Diano und Alburni: ein zerklüftetes
      Bergland, das bis ans Meer reicht und 181.048 Hektar im Süden der Provinz Salerno zwischen Sele-Ebene,
      Basilikata und dem Meer umfasst.
    landscape: >-
      Das Relief ist steil und zerklüftet. Flachland findet sich fast nur entlang der Hauptflüsse: dem Alento
      an der Küste und dem Tanagro im Vallo di Diano. Die höchsten Gipfel sind Monte Cervati (1.898 m), die
      Monti Alburni (1.742 m), der Gelbison oder Monte Sacro (1.705 m) und der Monte Motola (1.743 m). Der
      Küstenstreifen ist flach und sandig vom Sele bis Agropoli sowie zwischen Casal Velino und Ascea;
      andernorts ragen steile Klippen mit Meeresgrotten und Buchten auf.


      Zwei Gesteinswelten prägen die Geologie. Einerseits der farbige, geschichtete Cilento-Flysch im
      Alento-Becken und an der Nordküste; andererseits reine Karstkalke in den Binnenmassiven von Alburno und
      Cervati. Diese Gesteinsvielfalt trägt den Reichtum der Pflanzenwelt in drei Zonen:
      Gelbison-Cervati-Massiv, Monti Alburni und Küstencilento.


      Die Vegetation steigt vom Meeresufer zu den Gipfeln an. An Felsküsten blühen Strandlilie, die endemische
      Salerno-Grasnelke und die Palinuro-Primel, ein seltener Endemit und Wappensymbol des Parks. Im
      Landesinneren dominieren Eichen- und Ahornwälder, ab 1.000 m Höhe die Buche, begleitet von
      Ätna-Sauerdorn und Steinbrech. Rund 1.800 Pflanzenarten und 25 Lebensraumtypen sind dokumentiert,
      darunter 254 der 319 europäischen und mediterranen Wildorchideenarten.
    wildlife: >-
      Das Wasser bildet die Lebensader der Natur. In den Flussläufen leben Fischotter, an Quellen
      Brillensalamander und [Feuersalamander](/especie/salamandra_salamandra/); in sauerstoffreichen
      Bergbächen schwimmen Forellen und tauchen [Wasseramseln](/especie/cinclus_cinclus/). An den Sorgenti del
      Sammaro überdauert der [Eurasische Fischotter](/especie/lutra_lutra/) ungestört; der Park empfiehlt
      Besuche im Frühjahr und Herbst.


      An Land streift der Apennin-[Wolf](/especie/canis_lupus/) durch hügelige und montane Wälder fernab
      dichter Siedlungen. [Wildschweine](/especie/sus_scrofa/) sind sehr zahlreich; der
      [Rothirsch](/especie/cervus_elaphus/) wurde 2004 und das [Reh](/especie/capreolus_capreolus/) 2003
      wiederangesiedelt. Die [Wildkatze](/especie/felis_silvestris/) bildet eine weitere Kostbarkeit,
      begleitet von Fledermausarten wie Europäischer Bulldoggfledermaus, Langflügelfledermaus, Großem Mausohr
      und Langfußfledermaus.


      Am Himmel jagen [Steinadler](/especie/aquila_chrysaetos/), Schlangenadler,
      [Wanderfalke](/especie/falco_peregrinus/), Lannerfalke, Kolkrabe, [Uhu](/especie/bubo_bubo/), Waldkauz
      und Habicht. Entlang der Flüsse leben Eisvogel und Flussregenpfeifer, während an der Küste Korallenmöwen
      überwintern. Im Meer besuchen [Unechte Karettschildkröten](/especie/caretta_caretta/) Sandstrände bei
      Marina di Camerota, wo 2020 die jüngste Eiablage dokumentiert wurde; zu den Meeressäugern zählen [Großer
      Tümmler](/especie/tursiops_truncatus/), Pottwal und Streifendelfin. Zu den prioritären Insekten gehören
      Eremit und [Alpenbock](/especie/rosalia_alpina/); insgesamt sind 63 Arten von gemeinschaftlichem
      Interesse vertreten.
    visit: >-
      Aufgrund der Parkgröße wählt man den Zugang nach dem Zielort: Capaccio-Paestum oder Sapri für den
      Küstencilento, Sala Consilina und Monte San Giacomo für das Vallo di Diano.


      Zwei Wanderungen erschließen den gesamten Charakter. Die Tour zum Monte Sacro folgt dem Torna-Bach durch
      Schluchten, Sandsteinwände und Kaskaden zur Fiumefreddo-Quelle mit Madonnenbildnis und hinauf zum
      Gelbison-Gipfel; empfohlen von April bis Oktober. An den Flanken liegen Geotope wie Olistostrome und
      Schiefermergel. Die zweite Route führt zu den Sorgenti del Sammaro: Stege begleiten das Wasser durch die
      Schlucht des Geotops 73.


      Besuchenswert sind das Naturkundemuseum der Alburni in Corleto Monforte und das Paläontologische Museum
      in Magliano Vetere. Der Weg Magliano Nuovo–Postiglione quert die mittelalterliche Brücke von Magliano
      Nuovo entlang der Calore-Schluchten. In Casaletto Spartano liegen die Capelli-di-Venere-Wasserfälle, in
      Morigerati eine WWF-Oase an den Bussento-Höhlen und in Petina eine Sternwarte bei Aresta.
    history: >-
      Bereits 1973 forderte eine internationale Fachtagung in Castellabate den Schutz des Cilento vor
      Bauspekulation. Der Nationalpark entstand 1991 mit dem Rahmengesetz über Schutzgebiete unter
      Gründungspräsident Vincenzo La Valva. Aus anfänglich 36.000 Hektar wuchs er auf die heutigen 181.048
      Hektar an.


      Gelbison bedeutet auf Arabisch «Berg des Idols», da der Gipfel schon vor Errichtung des basilianischen
      Klosters im zehnten Jahrhundert heilig war. Die UNESCO ernannte das Areal im Juni 1997 zum
      Biosphärenreservat und nahm es gemeinsam mit Paestum, Velia und der Kartause von Padula ins Welterbe
      auf. Natura 2000 umfasst 118.316 Hektar, entsprechend 65 % der Schutzgebietsfläche.
    before: Erkundige dich vor deiner Tour bei der Parkverwaltung über Wegesperrungen und Öffnungszeiten der Museen.
    around: >-
      Der [Parco Nazionale del Pollino](/lugar/parco-nazionale-del-pollino/) liegt achtundzwanzig Kilometer
      entfernt.
  it:
    intro: >-
      Scendere nella gola del Sammaro è come entrare nelle viscere della terra: da lì, anziché fuoco, sgorga
      un'acqua limpida e gelida che leviga i calcari del fondo rendendoli lisci e candidi. Quest'immagine
      sintetizza il Parco Nazionale del Cilento, Vallo di Diano e Alburni: una terra aspra dove la montagna
      tocca il mare, estesa su 181.048 ettari nel meridione della provincia di Salerno, tra la piana del Sele,
      la Basilicata e la costa tirrenica.
    landscape: >-
      Il rilievo è marcato e aspro. Le aree pianeggianti sono limitate, addossate ai corsi d'acqua principali:
      l'Alento lungo la costa e il Tanagro nel Vallo di Diano. Le vette maestre sono il Cervati (1.898 m), gli
      Alburni (1.742 m), il Gelbison o Monte Sacro (1.705 m) e il Motola (1.743 m). La fascia costiera è bassa
      e sabbiosa dal Sele ad Agropoli e tra Casal Velino e Ascea; altrove si alza in falesie scoscese incise
      da grotte e cale.


      Due formazioni rocciose spiegano il territorio. La prima è il flysch del Cilento, arenaceo e policromo,
      nel bacino dell'Alento e sulla costa settentrionale. La seconda è il calcare carsificato dei massicci
      montuosi di Alburno e Cervati. Tale varietà geomorfologica sostiene la flora del parco, divisa in tre
      macroaree: il massiccio Gelbison-Cervati, i monti Alburni e il Cilento costiero.


      La flora sale dal livello del mare ai crinali. Sulle rupi costiere vegetano giglio di mare, statice
      salernitana e primula di Palinuro, raro endemismo simbolo del parco. Nell'entroterra prevalgono boschi
      di roverella, leccio e acero, e oltre i 1.000 m domina la faggeta, arricchita da crespino dell'Etna e
      sassifraghe. Sono state censite circa 1.800 specie vegetali e 25 habitat, tra cui 254 delle 319 specie
      di orchidee selvatiche dell'intero bacino euro-mediterraneo.
    wildlife: >-
      L'acqua è la trama della vita selvatica. Nei fiumi dimora la lontra, presso le sorgenti salamandrina
      dagli occhiali e [salamandra pezzata](/especie/salamandra_salamandra/); nelle forre ossigenate nuotano
      trota macrostigma e [merlo acquaiolo](/especie/cinclus_cinclus/). Alle Sorgenti del Sammaro la [lontra
      europea](/especie/lutra_lutra/) prospera indisturbata, e il parco consiglia primavera e autunno per
      l'escursione.


      Sui rilievi il [lupo grigio](/especie/canis_lupus/) appenninico percorre boschi collinari e montani
      lontano dai centri abitati. I [cinghiali](/especie/sus_scrofa/) sono abbondanti; il
      [cervo](/especie/cervus_elaphus/) è stato reintrodotto nel 2004 e il
      [capriolo](/especie/capreolus_capreolus/) nel 2003. Il [gatto selvatico](/especie/felis_silvestris/) è
      un predatore di grande rilievo, affiancato da chirotteri quali molosso di Cestoni, miniottero,
      vespertilio maggiore e vespertilio di Capaccini.


      Nel cielo volteggiano [aquila reale](/especie/aquila_chrysaetos/), biancone, [falco
      pellegrino](/especie/falco_peregrinus/), lanario, corvo imperiale, [gufo reale](/especie/bubo_bubo/) e
      allocco, oltre all'astore. Lungo le acque nidificano martin pescatore e corriere piccolo, mentre
      d'inverno staziona il gabbiano corso. In mare la [tartaruga marina comune](/especie/caretta_caretta/)
      visita i lidi sabbiosi di Marina di Camerota, dove nel 2020 è stata registrata l'ultima nidificazione;
      tra i cetacei compaiono [tursìope](/especie/tursiops_truncatus/), capodoglio e stenella. Tra gli insetti
      protetti figurano scarabeo eremita e [Rosalia alpina](/especie/rosalia_alpina/); le specie d'interesse
      comunitario sono 63.
    visit: >-
      Data la vastità del parco, conviene scegliere l'accesso in base all'itinerario: Capaccio-Paestum o Sapri
      per il Cilento costiero, Sala Consilina e Monte San Giacomo per il Vallo di Diano.


      Due escursioni sintetizzano il territorio. Quella del Monte Sacro risale il torrente Torna tra arenarie,
      pozze e cascatelle, tocca la sorgente di Fiumefreddo con edicola votiva e sale in vetta al Gelbison;
      consigliata da aprile a ottobre. Sui fianchi affiorano geositi stratigrafici come olistostromi e marne
      fogliettate. L'altra risale le Sorgenti del Sammaro: passerelle in legno costeggiano l'acqua lungo la
      forra del geosito 73.


      Tra i poli museali spiccano il Museo Naturalistico degli Alburni a Corleto Monforte e il Museo
      Paleontologico a Magliano Vetere. Il sentiero Magliano Nuovo-Postiglione attraversa il ponte medievale
      di Magliano Nuovo e l'intera forra delle Gole del Calore. A Casaletto Spartano sgorgano le cascate
      Capelli di Venere, a Morigerati un'oasi WWF racchiude la risorgenza del Bussento, e a Petina opera
      l'osservatorio astronomico in località Aresta.
    history: >-
      Già nel 1973 un convegno internazionale a Castellabate pose la tutela del Cilento contro la speculazione
      edilizia. Il parco nazionale fu istituito nel 1991 con la legge quadro sulle aree protette, guidato dal
      presidente fondatore Vincenzo La Valva. Nato con circa 36.000 ettari, è cresciuto fino agli attuali
      181.048 ettari.


      Gelbison deriva dall'arabo «montagna dell'idolo», vetta sacra già prima dell'insediamento basiliano nel
      X secolo. L'UNESCO ha riconosciuto il parco Riserva della Biosfera nel giugno 1997 e Patrimonio Mondiale
      insieme a Paestum, Velia e alla Certosa di Padula. La rete Natura 2000 tutela 118.316 ettari, pari al 65
      % dell'area protetta.
    before: >-
      Verifica con l'ente parco la percorribilità dei sentieri e gli orari dei musei prima di metterti in
      cammino.
    around: Il [Parco Nazionale del Pollino](/lugar/parco-nazionale-del-pollino/) sorge a ventotto chilometri.
  pt:
    intro: >-
      Descer à garganta do Sammaro assemelha-se a entrar nas entranhas da terra: daqui, em vez de fogo, brota
      uma água límpida e gelada que lapida as rochas calcárias do leito até ficarem brancas e polidas. Essa
      imagem retrata o Parque Nacional do Cilento, Vallo di Diano e Alburni: um relevo alcantilado onde as
      serras mergulham no mar, abarcando 181.048 hectares no sul da província de Salerno, entre a planície do
      Sele, a Basilicata e a costa tirrena.
    landscape: >-
      O relevo é pronunciado e escarpado. As planuras são escassas, comprimidas junto aos rios principais: o
      Alento na costa e o Tanagro no Vallo di Diano. As cúpulas supremas são o Cervati (1.898 m), os Alburni
      (1.742 m), o Gelbison ou Monte Sacro (1.705 m) e o Motola (1.743 m). O litoral estende-se baixo e
      arenoso do Sele a Agropoli e entre Casal Velino e Ascea; no restante, ergue-se em arribas rochosas
      recortadas por grutas e enseadas.


      Duas formações litológicas moldam a paisagem. De um lado, o flysch do Cilento, arenítico e
      policromático, na bacia do Alento e no litoral setentrional. Do outro, o calcário com feições cársicas
      dos maciços do Alburno e do Cervati. Essa multiplicidade geológica sustenta a vegetação do parque em
      três grandes áreas: o maciço Gelbison-Cervati, os montes Alburni e o Cilento marítimo.


      A flora progride do nível do mar às cumeadas. Nas escarpas costeiras habitam o lírio-das-praias, a
      estátice-salernitana e a prímula-de-palinuro, endemismo raro tornado símbolo do parque. No interior
      sobressaem carvalhais de carvalho-cerquinho, azinhais e bordos, enquanto acima dos 1.000 m domina o
      faial com uva-espim-do-etna e saxífragas. Estão catalogadas cerca de 1.800 espécies vegetais e 25
      habitats, congregando 254 das 319 espécies de orquídeas selvagens inventariadas em toda a Europa e bacia
      mediterrânica.
    wildlife: >-
      A água tece o fio condutor da vida bravia. Nos leitos fluviais habitam lontras, e perto das nascentes
      salamandrinas-de-lunetas e [salamandras-de-fogo](/especie/salamandra_salamandra/); em ribeiras límpidas
      e oxigenadas surgem trutas e [melros-d'água](/especie/cinclus_cinclus/). Nas Sorgenti del Sammaro a
      [lontra-europeia](/especie/lutra_lutra/) permanece resguardada, recomendando o parque a primavera e o
      outono para visitas.


      Em terra, o [lobo-cinzento](/especie/canis_lupus/) apenínico vagueia pelas matas de colina e montanha
      longe das povoações densas. Os [javalis](/especie/sus_scrofa/) abundam; o
      [veado-vermelho](/especie/cervus_elaphus/) foi reintroduzido em 2004 e a
      [corça](/especie/capreolus_capreolus/) em 2003. O [gato-bravo](/especie/felis_silvestris/) personifica
      outra espécie de grande interesse conservacionista, a par de morcegos como o morcego-rabudo, o
      morcego-de-peluche, o morcego-rato-grande e o morcego-de-franja-do-sul.


      Nos céus plainam [águia-real](/especie/aquila_chrysaetos/), águia-cobreira,
      [falcão-peregrino](/especie/falco_peregrinus/), falcão-alfaneque, corvo-comum,
      [bufo-real](/especie/bubo_bubo/) e coruja-do-mato, além do açor. Junto às correntes nidificam
      guarda-rios e borrelho-pequeno, invernando no mar a rara gaivota-de-audouin. No oceano a
      [tartaruga-comum](/especie/caretta_caretta/) aporta aos areais de Marina di Camerota, onde em 2020 se
      assinalou a última desova; nos cetáceos surgem [golfinho-comum](/especie/tursiops_truncatus/), cachalote
      e golfinho-riscado. Nos insetos prioritários destacam-se o escaravelho-eremita e a [Rosalia
      alpina](/especie/rosalia_alpina/); as espécies de interesse comunitário somam 63.
    visit: >-
      Pela amplidão do parque, convém definir a porta de entrada segundo o roteiro: Capaccio-Paestum ou Sapri
      para o Cilento costeiro, e Sala Consilina ou Monte San Giacomo para o Vallo di Diano.


      Duas caminhadas espelham a integridade do território. A do Monte Sacro acompanha o torrente Torna entre
      arenitos, lagoas e cascatas, passa pela fonte de Fiumefreddo dotada de oratório e sobe à crista do
      Gelbison; ideal de abril a outubro. Nas vertentes surgem geossítios estratigráficos como olistóstromos e
      margas folheadas. A outra visita as Sorgenti del Sammaro: passadiços e pontilhões acompanham o curso
      fluvial ao longo da garganta do geossítio 73.


      Nos polos culturais figuram o Museu Naturalista dos Alburni em Corleto Monforte e o Museu Paleontológico
      em Magliano Vetere. O trilho Magliano Nuovo–Postiglione cruza a ponte medieval de Magliano Nuovo e
      percorre as Gole del Calore. Em Casaletto Spartano irrompem as cascatas Capelli di Venere, em Morigerati
      um oásis da WWF resguarda a ressurgência do rio Bussento, e em Petina funciona um observatório
      astronómico em Aresta.
    history: >-
      Já em 1973 um congresso internacional em Castellabate clamava pela preservação do Cilento contra a
      especulação imobiliária. O parque nacional foi criado em 1991 pela lei-quadro das áreas protegidas, sob
      a liderança do naturalista Vincenzo La Valva. Nascido com cerca de 36.000 hectares, expandiu-se até aos
      181.048 hectares atuais.


      Gelbison provém do árabe significando «montanha do ídolo», tendo sido um monte sagrado antes de os
      monges basilianos fundarem o santuário no século X. A UNESCO consagrou o parque como Reserva da Biosfera
      em junho de 1997 e integrou-o no Património Mundial com Paestum, Velia e a Cartuxa de Padula. A rede
      Natura 2000 abrange 118.316 hectares, equivalendo a 65 % do território.
    before: >-
      Verifica junto da autoridade do parque o estado dos caminhos e os horários dos museus antes de iniciares
      a viagem.
    around: O [Parco Nazionale del Pollino](/lugar/parco-nazionale-del-pollino/) dista vinte e oito quilómetros.
