unico:
  es: >-
    Una montaña que bebe su propia lluvia por dolinas y cuevas y la devuelve en los manantiales del borde, de
    donde sale gran parte del agua potable de Viena.
  en: >-
    A mountain that swallows its own rain through sinkholes and subterranean caverns, returning it in
    peripheral springs supplying Vienna's tap water.
  fr: >-
    Une montagne qui boit ses propres pluies par ses gouffres et grottes pour les restituer aux sources de
    piémont alimentant l'eau potable de Vienne.
  de: >-
    Ein Berg, der seinen eigenen Niederschlag durch Dolinen und Höhlen schluckt und über Quellen am Rand das
    Trinkwasser für Wien spendet.
  it: >-
    Una montagna che inghiotte le proprie piogge in doline e grotte restituendole alle sorgenti pedemontane
    che alimentano l'acqua potabile di Vienna.
  pt: >-
    Uma montanha que bebe a sua própria chuva através de algares e grutas, devolvendo-a em nascentes de sopé
    que fornecem grande parte da água potável de Viena.
observaciones:
  es: >-
    Es alta montaña caliza: sin arroyos en las alturas, lleva el agua que necesites. La parte alta tiene un
    clima duro, así que consulta antes de ir el estado de los refugios y los senderos.
texto:
  es:
    intro: >-
      Llueve, nieva, y no hay un arroyo en las alturas. Esa es la rareza del Hochschwab: una meseta de caliza
      tan agujereada que toda el agua desaparece bajo tierra y reaparece en los bordes, en grandes manantiales
      que acaban en los grifos de Viena. Es la Hochschwabgruppe, un macizo de unos 400 km² en el norte de
      Estiria, Austria, que culmina en el Hochschwab, de 2277 m, y que se recorre de abajo arriba entre
      paredes, circos, lapiaces y refugios.
    landscape: >-
      El Hochschwab es un macizo de los Alpes calizos del norte, una meseta de alta montaña formada sobre todo
      por caliza de Wetterstein, una roca que el agua disuelve con facilidad. De ahí viene el karst. Las
      superficies altas de la meseta se levantaron en el Mioceno, con la formación de los Alpes: por encima de
      unos 1330 m son suaves y onduladas, y en sus bordes rompen en paredes abruptas sobre los valles. La
      meseta queda delimitada por el collado de Seeberg al este y por el de Präbichl al oeste.


      La nieve y la lluvia se filtran por grietas y dolinas y fluyen por cuevas; bajo la caliza hay capas
      impermeables de Werfen que obligan al agua a salir en numerosos manantiales. Así se explica la
      superficie: extensos campos de lapiaz y dolinas, y una dolina, al norte del lago Sackwiesensee, que mide
      unos 600 × 300 m con 70 m de profundidad. Debajo hay 932 cuevas catalogadas, entre ellas el sistema
      Frauenmauer-Langstein, que supera los 45 km.


      El hielo y la roca también contaron su parte. Durante la glaciación de Würm una meseta de hielo cubrió
      el norte del macizo y dejó circos en los bordes. El valle de Obere Dullwitz lo modelaron los glaciares,
      y el lago Leopoldsteiner See, cerca de Eisenerz, conserva las huellas de esa erosión. Y entre el 3900 y
      el 3700 a. C. una enorme masa de roca se desprendió entre Ebenstein, Großer Griesstein y Brandstein y
      bajó por el valle del Salza más allá de Wildalpen. Otros dos desprendimientos prehistóricos, en Tragöß,
      represaron el Grüner See y el Pfarrerlacke.


      Algunos lagos, como el Leopoldsteiner See, el Brunnsee y el Grüner See de Tragöß, tienen calidad de agua
      potable. El Sackwiesensee y el Teufelssee, entre Eisenerz y Wildalpen, son otros lagos conocidos.
    wildlife: >-
      La fauna del macizo incluye la [marmota alpina](/especie/marmota_marmota/), la
      [gamuza](/especie/rupicapra_rupicapra/), el [íbice alpino](/especie/capra_ibex/) y el
      [urogallo](/especie/tetrao_urogallus/), además de salamandras y víbora común. La flora es especialmente
      variada: aurícula, zapatilla de dama, nigritela, edelweiss y varias especies de genciana.
    visit: >-
      Los refugios del Club Alpino, una amplia red de senderos y varias zonas de deportes de invierno hacen
      que el macizo esté preparado para el turismo. La ruta más clásica sube al Hochschwab desde Seewiesen, a
      974 m, por el valle Seetal, la Untere Dullwitz, el refugio Voisthaler Hut, la Obere Dullwitz y el
      Graf-Meran-Steig, hasta el Schiestlhaus. También se llega al Schiestlhaus desde el norte, por
      Weichselboden en el valle del Salza.


      Desde el Schiestlhaus, la cumbre del Hochschwab, una cúpula plana de roca y hierba, se alcanza en media
      hora. Y la pared sur es la gran escena del macizo: casi dos kilómetros de ancho y hasta 300 m de altura.
      Por la cumbre pasan el camino de gran recorrido Norte-Sur 05, que aquí alcanza su punto más alto, el
      Camino de los Alpes del Norte 01 y los senderos europeos E6 y E4.


      El Schiestlhaus, reabierto en 2005, es la casa pasiva más alta del mundo y sustituyó a un refugio de 120
      años. Cerca de Bodenbauer, en Thörl, hay un museo propio del Hochschwab.
    history: >-
      El nombre quizá venga del Schwabenboden, las zonas llanas junto a la cumbre, y luego pasó a la cima y a
      todo el macizo. La representación más antigua del Hochschwab, un dibujo de un cartógrafo, muestra dos
      cumbres con la leyenda «aquí siempre hay nieve».


      El macizo es clave para el agua de Viena: la ciudad toma sobre un 60 % de su agua potable de la Segunda
      Tubería de Manantiales, construida en 1910. Los manantiales de Kläffer son uno de los mayores grupos de
      manantiales de los Alpes orientales.
    before: >-
      Es alta montaña caliza: sin arroyos en las alturas, lleva el agua que necesites. La parte alta tiene un
      clima duro, así que consulta antes de ir el estado de los refugios y los senderos.
    around: >-
      A solo 3 km queda el [Parque Nacional Gesäuse](/lugar/nationalpark-gesause---enns-gorge/), y más allá el
      [Área Salvaje Dürrenstein-Lassingtal](/lugar/wildnisgebiet-durrenstein-lassingtal/) y el [Parque
      Nacional Kalkalpen](/lugar/nationalpark-kalkalpen---waldgebiete/). Más lejos, el [Parque Natural de
      Karwendel](/lugar/naturpark-karwendel/), el [Parque Natural
      Adamello-Brenta](/lugar/parco-naturale-adamello-brenta/), el [Grupo
      Ankogel](/lugar/ankogelgruppe---hohe-tauern/) y el [Parque Nacional de los
      Écrins](/lugar/parc-national-des-ecrins---massif/) comparten con el Hochschwab el íbice alpino y la
      gamuza.
  en:
    intro: >-
      It rains, it snows, yet not a single stream flows across the high plateau. That is the hydrological
      wonder of the Hochschwab: a limestone massif so riddled with fissures that every drop of surface
      moisture vanishes underground, re-emerging at the periphery in immense karst springs that feed the
      drinking taps of Vienna. This is the Hochschwabgruppe, a mountain massif of some 400 km² in northern
      Styria, Austria, culminating at the summit of Hochschwab at 2277 m, explored from base to crest amidst
      rock walls, cirques, limestone pavement, and alpine huts.
    landscape: >-
      The Hochschwab is a high mountain massif of the Northern Limestone Alps, a desert-like plateau primarily
      composed of Wetterstein limestone—a carbonate rock readily dissolved by acidic water. That is the
      genesis of its karst topography. The elevated plateau surfaces were uplifted during the Miocene with the
      Alpine orogeny: above some 1330 m they form rolling, undulating terrain that breaks abruptly into sheer
      peripheral precipices dropping into surrounding valleys. The plateau is bounded by the Seeberg Pass to
      the east and the Präbichl Pass to the west.


      Rain and snow melt seep through grikes and sinkholes into subterranean caverns; beneath the permeable
      limestone lie impervious Werfen geological strata forcing groundwater back out through powerful
      perimeter springs. This explains the barren surface: expansive limestone pavements (Karren) and deep
      dolines, including a giant sinkhole north of Lake Sackwiesensee measuring 600 × 300 m with a depth of 70
      m. Subterranean exploration has catalogued 932 caves, including the Frauenmauer-Langstein cave system
      extending over 45 km.


      Glacial ice and rockfalls also sculpted the terrain. During the Würm glaciation, an ice cap mantled the
      northern massif, leaving cirques along its flanks. Glacial erosion carved the Obere Dullwitz valley and
      left distinct morainic hallmarks around Lake Leopoldsteiner See near Eisenerz. Furthermore, between 3900
      and 3700 BC, a colossal rock avalanche detached between Ebenstein, Großer Griesstein, and Brandstein,
      thundering down the Salza valley well past Wildalpen. Two other prehistoric rockslides in Tragöß dammed
      the famous Grüner See and Pfarrerlacke.


      Several mountain lakes, such as Lake Leopoldsteiner See, Lake Brunnsee, and the emerald Grüner See in
      Tragöß, boast drinking-water clarity. Lake Sackwiesensee and Lake Teufelssee, nestled between Eisenerz
      and Wildalpen, are other well-known alpine waters.
    wildlife: >-
      The fauna of the massif includes the [alpine marmot](/especie/marmota_marmota/), the
      [chamois](/especie/rupicapra_rupicapra/), the [Alpine ibex](/especie/capra_ibex/), and the [western
      capercaillie](/especie/tetrao_urogallus/), along with alpine salamanders and the common viper. Plant
      life is exceptionally rich: mountain auricula, lady's slipper orchid, black vanilla orchid, edelweiss,
      and multiple gentian species.
    visit: >-
      Mountain huts operated by the Alpine Club, an extensive footpath network, and several winter sports
      zones make the massif well-equipped for mountain trekking. The classic route ascends the Hochschwab from
      Seewiesen at 974 m via the Seetal valley, the Untere Dullwitz, the Voisthaler Hut, the Obere Dullwitz,
      and the Graf-Meran-Steig trail to reach the Schiestlhaus. The Schiestlhaus can also be reached from the
      north via Weichselboden in the Salza valley.


      From the Schiestlhaus, the rounded plateau summit of the Hochschwab, crowned by rock and alpine meadows,
      is reached in just half an hour. The formidable South Face forms the massif's greatest mountaineering
      wall: nearly two kilometres wide and up to 300 m high. Crossing the summit are the North-South
      long-distance trail 05 (reaching its highest elevation here), the Northern Alpine Way 01, and the
      European long-distance paths E6 and E4.


      The modern Schiestlhaus, reopened in 2005, is the highest passive mountain house in the world, having
      replaced a venerable shelter dating back 120 years. Near Bodenbauer in Thörl, a dedicated museum
      illuminates the natural history of the Hochschwab.
    history: >-
      The name Hochschwab probably derives from the Schwabenboden, the high pastoral shelves flanking the
      summit, which later gave their name to the peak and the entire massif. The earliest known depiction of
      the Hochschwab, drawn by a Renaissance cartographer, portrays two snow-clad summits inscribed with the
      legend "snow lies here forever".


      The massif plays a crucial role in water supply: the city of Vienna draws about 60 % of its municipal
      drinking water through the Second Spring Water Pipeline, completed in 1910. The Kläffer springs along
      the Salza valley constitute one of the mightiest drinking spring discharges in the Eastern Alps.
    before: >-
      This is high limestone karst terrain: with no flowing streams on the high plateau, you must carry all
      the water you need. The upper plateau experiences severe mountain weather, so check hut openings and
      trail conditions before departing.
    around: >-
      Just 3 km away lies [Gesäuse National Park](/lugar/nationalpark-gesause---enns-gorge/), and slightly
      further the [Dürrenstein-Lassingtal Wilderness Area](/lugar/wildnisgebiet-durrenstein-lassingtal/) and
      [Kalkalpen National Park](/lugar/nationalpark-kalkalpen---waldgebiete/). Further afield, [Karwendel
      Nature Park](/lugar/naturpark-karwendel/), [Adamello-Brenta Nature
      Park](/lugar/parco-naturale-adamello-brenta/), the [Ankogel Group](/lugar/ankogelgruppe---hohe-tauern/),
      and [Écrins National Park](/lugar/parc-national-des-ecrins---massif/) share with the Hochschwab
      populations of Alpine ibex and chamois.
  fr:
    intro: >-
      Qu'il pleuve ou qu'il neige, aucun ruisseau ne coule sur les hauteurs. Telle est l'étrangeté du
      Hochschwab : un plateau calcaire si perforé que toute l'eau s'infiltre sous terre pour resurgir à ses
      bordures, dans de puissantes sources karstiques qui jaillissent jusqu'aux robinets de Vienne. C'est la
      Hochschwabgruppe, un massif d'environ 400 km² au nord de la Styrie, en Autriche, qui culmine au pic du
      Hochschwab à 2277 m et s'explore de bas en haut entre parois vertigineuses, cirques, lapiés et refuges
      d'altitude.
    landscape: >-
      Le Hochschwab est un haut massif des Alpes calcaires septentrionales, un plateau d'altitude formé
      essentiellement de calcaire du Wetterstein, roche soluble que les eaux dissolvent avec facilité. De là
      naît un karst spectaculaire. Les surfaces sommitales du plateau se sont soulevées au Miocène lors de
      l'orogenèse alpine : au-dessus de quelque 1330 m, elles ondulent en doux reliefs avant de rompre sur
      leurs flancs en murailles abruptes surplombant les vallées. Le plateau est délimité par le col du
      Seeberg à l'est et par celui de Präbichl à l'ouest.


      Pluies et fontes de neige s'engouffrent dans les diaclases et les dolines pour circuler dans des réseaux
      souterrains ; sous le calcaire reposent les couches imperméables de Werfen qui contraignent l'eau à
      jaillir en de multiples résurgences. Cela explique la physionomie de surface : des champs infinis de
      lapiés et de dolines, dont une doline géante au nord du lac Sackwiesensee mesurant 600 × 300 m pour 70 m
      de profondeur. Les entrailles du massif abritent 932 grottes répertoriées, parmi lesquelles le réseau
      Frauenmauer-Langstein qui dépasse 45 km.


      Les glaciers et les éboulements ont façonné le relief. Durant la glaciation de Würm, une calotte de
      glace coiffait le nord du massif, creusant des cirques sur ses marges. L'érosion glaciaire a sculpté la
      vallée d'Obere Dullwitz et marqué les abords du lac Leopoldsteiner See près d'Eisenerz. Entre 3900 et
      3700 av. J.-C., un titanesque éboulement rocheux s'est détaché entre l'Ebenstein, le Großer Griesstein
      et le Brandstein, dévalant la vallée de la Salza bien au-delà de Wildalpen. Deux autres éboulements
      préhistoriques à Tragöß ont formé le Grüner See et la Pfarrerlacke.


      Plusieurs lacs, dont le Leopoldsteiner See, le Brunnsee et le lac émeraude du Grüner See à Tragöß,
      offrent une eau d'une pureté potable. Le Sackwiesensee et le Teufelssee, blottis entre Eisenerz et
      Wildalpen, figurent également parmi les joyaux d'altitude.
    wildlife: >-
      La faune du massif rassemble la [marmotte des Alpes](/especie/marmota_marmota/), le
      [chamois](/especie/rupicapra_rupicapra/), le [bouquetin des Alpes](/especie/capra_ibex/) et le [grand
      tétras](/especie/tetrao_urogallus/), ainsi que des salamandres noires et la vipère péliade. La flore est
      remarquablement variée : primevère oreille-d'ours, sabot de Vénus, nigritelle noire, edelweiss et
      nombreuses espèces de gentianes.
    visit: >-
      Les refuges du Club alpin autrichien, un vaste réseau de sentiers et plusieurs stations hivernales
      rendent le massif très accueillant pour la randonnée. L'ascension classique gravit le Hochschwab depuis
      Seewiesen à 974 m par la vallée Seetal, l'Untere Dullwitz, le refuge Voisthaler Hut, l'Obere Dullwitz et
      le Graf-Meran-Steig pour rallier le Schiestlhaus. On peut également gagner le Schiestlhaus par le
      versant nord, depuis Weichselboden dans la vallée de la Salza.


      Depuis le Schiestlhaus, le sommet du Hochschwab, vaste croupe d'herbe et de roche, s'atteint en une
      demi-heure de marche. La face sud constitue le joyau d'escalade du massif : près de deux kilomètres de
      largeur et jusqu'à 300 m de hauteur verticale. Par la cime passent le sentier de grande randonnée
      Nord-Sud 05, qui atteint ici son point culminant, la Voie des Alpes du Nord 01 ainsi que les sentiers
      européens E6 et E4.


      Le Schiestlhaus, réaménagé en 2005, constitue le refuge passif le plus haut du monde, succédant à un
      bâtiment historique vieux de 120 ans. Près de Bodenbauer, à Thörl, un musée présente le patrimoine
      naturel du massif.
    history: >-
      Le toponyme proviendrait du Schwabenboden, les pâturages d'altitude proches de la crête, avant de
      désigner la cime puis tout le massif. La plus ancienne carte connue du Hochschwab, dessinée par un
      cartographe de la Renaissance, figure deux sommets enneigés assortis de la mention « il y a toujours de
      la neige ici ».


      Le massif joue un rôle vital pour l'approvisionnement viennois : la capitale puise environ 60 % de son
      eau potable dans la Seconde conduite d'adduction de sources alpines, édifiée en 1910. Les résurgences de
      Kläffer dans la vallée de la Salza forment l'un des groupes de sources les plus abondants des Alpes
      orientales.
    before: >-
      C'est un relief karstique de haute altitude : en l'absence de ruisseaux pérennes sur les crêtes,
      emportez toute l'eau nécessaire. Les conditions météorologiques y sont rudes ; vérifiez l'état des
      sentiers et des refuges avant de partir.
    around: >-
      À seulement 3 km s'étend le [Parque Nacional Gesäuse](/lugar/nationalpark-gesause---enns-gorge/), et
      plus loin l'[Área Salvaje Dürrenstein-Lassingtal](/lugar/wildnisgebiet-durrenstein-lassingtal/) et le
      [Parque Nacional Kalkalpen](/lugar/nationalpark-kalkalpen---waldgebiete/). Plus au loin, le [Parque
      Natural de Karwendel](/lugar/naturpark-karwendel/), le [Parque Natural
      Adamello-Brenta](/lugar/parco-naturale-adamello-brenta/), le [Grupo
      Ankogel](/lugar/ankogelgruppe---hohe-tauern/) et le [Parque Nacional de los
      Écrins](/lugar/parc-national-des-ecrins---massif/) partagent avec le Hochschwab le bouquetin et le
      chamois.
  de:
    intro: >-
      Es regnet, es schneit, doch kein einziger Bach plätschert über das Hochplateau. Das ist das Naturwunder
      des Hochschwabs: Ein Kalkmassiv, das so porös ist, dass alles Wasser im Untergrund versickert und an den
      Flanken in mächtigen Quellen wieder austritt, die das Trinkwasser für Wien liefern. Die Rede ist von der
      Hochschwabgruppe, einem rund 400 km² großen Gebirgsstock in der nördlichen Obersteiermark in Österreich,
      der im 2277 m hohen Hochschwavgipfel gipfelt und von Schluchten, Karen, Karrenfeldern und Hütten geprägt
      wird.
    landscape: >-
      Der Hochschwab ist ein Gebirgsmassiv der Nördlichen Kalkalpen, ein Hochplateau aus Wettersteinkalk, der
      durch kohlensäurehaltiges Wasser leicht aufgelöst wird. Daraus resultiert die ausgeprägte Verkarstung.
      Die Hochflächen hoben sich im Miozän bei der Alpenbildung heraus: Oberhalb von etwa 1330 m zeigen sie
      sanfte, kuppige Formen, die an ihren Rändern jäh in senkrechte Wände zu den Tälern abbrechen. Die
      Hochebene wird im Osten durch den Seebergsattel und im Westen durch den Präbichl begrenzt.


      Schnee und Regen versickern durch Klüfte und Dolinen in unterirdische Höhlensysteme; unter dem Kalk
      liegen wasserstauende Werfener Schichten, die das Wasser in zahllosen Quellen zutage treten lassen. So
      erklärt sich das Landschaftsbild: Ausgedehnte Karrenfelder und Dolinen, darunter eine Riesendoline
      nördlich des Sackwiesensees mit 600 × 300 m Ausdehnung und 70 m Tiefe. Im Berginneren sind 932 Höhlen
      erfasst, darunter das Frauenmauer-Langstein-System mit über 45 km Gesamtlänge.


      Auch Gletscher und Bergstürze formten das Gebirge. In der Würm-Eiszeit überdeckte eine
      Plateaugletscherkappe den Norden des Massivs und hinterließ Karkessel. Gletschereis schliff die Obere
      Dullwitz aus und schuf das Becken des Leopoldsteiner Sees bei Eisenerz. Zudem löste sich zwischen 3900
      und 3700 v. Chr. ein gewaltiger Bergsturz zwischen Ebenstein, Großem Griesstein und Brandstein, der
      durch das Salzatal bis weit über Wildalpen hinaus raste. Zwei weitere prähistorische Bergstürze in
      Tragöß stauten den Grünen See und die Pfarrerlacke auf.


      Mehrere Gebirgsseen wie der Leopoldsteiner See, der Brunnsee und der smaragdgrüne Grüne See in Tragöß
      besitzen Trinkwasserqualität. Auch der Sackwiesensee und der Teufelssee zwischen Eisenerz und Wildalpen
      zählen zu den bekannten Bergseen.
    wildlife: >-
      Die Tierwelt der Gruppe umfasst das [Alpenmurmeltier](/especie/marmota_marmota/), die
      [Gämse](/especie/rupicapra_rupicapra/), den [Alpensteinbock](/especie/capra_ibex/) und das
      [Auerhuhn](/especie/tetrao_urogallus/), dazu Alpensalamander und Kreuzottern. Die Flora ist
      außerordentlich artenreich: Petergstamm, Frauenschuh, Kohlröschen, Edelweiß sowie zahlreiche
      Enzianarten.
    visit: >-
      Alpenvereinshütten, ein dichtes Wegenetz und mehrere Wintersportgebiete erschließen das Massiv für
      Bergsteiger. Der klassische Normalweg führt von Seewiesen auf 974 m durch das Seetal, die Untere
      Dullwitz, an der Voisthaler Hütte vorbei über die Obere Dullwitz und den Graf-Meran-Steig zum
      Schiestlhaus. Auch von Norden lässt sich das Schiestlhaus von Weichselboden im Salzatal erreichen.


      Vom Schiestlhaus ist der Gipfel des Hochschwabs, eine grasig-felsige Kuppe, in einer halben Stunde
      erreichbar. Die Südwand ist die Paradeschauwand des Massivs: Fast zwei Kilometer breit und bis zu 300 m
      hoch. Über den Gipfel verlaufen der Nord-Süd-Weitwanderweg 05 (hier sein höchster Punkt), der
      Nordalpenweg 01 sowie die europäischen Fernwanderwege E6 und E4.


      Das 2005 neu errichtete Schiestlhaus ist das höchstgelegene Passivhaus der Welt und löste eine 120 Jahre
      alte Vorgängerhütte ab. Nahe dem Bodenbauer in Thörl informiert ein Hochschwabmuseum über das Massiv.
    history: >-
      Der Name geht vermutlich auf den Schwabenboden zurück, die ebenen Hochweiden nahe dem Gipfel, und
      übertrug sich dann auf den Berg und das Massiv. Die älteste kartografische Darstellung des Hochschwabs
      zeigt zwei Bergspitzen mit dem Vermerk „hier ligt allweg Schnee“.


      Das Gebirge ist von zentraler Bedeutung für Wiens Trinkwasser: Rund 60 % des Wiener Wassers stammen aus
      der II. Wiener Hochquellenleitung, die 1910 eröffnet wurde. Die Kläfferquellen im Salzatal bilden eine
      der größten Trinkwasserquellen der gesamten Ostalpen.
    before: >-
      Es handelt sich um hochalpinen Karst: Wegen des Mangels an Oberflächengewässern auf dem Hochplateau
      musst du ausreichend Trinkwasser mitführen. Das Hochgebirge verlangt alpine Erfahrung; prüfe vorab den
      Zustand der Wege und Hüttenöffnungszeiten.
    around: >-
      Nur 3 km entfernt liegt der [Parque Nacional Gesäuse](/lugar/nationalpark-gesause---enns-gorge/), etwas
      weiter das [Área Salvaje Dürrenstein-Lassingtal](/lugar/wildnisgebiet-durrenstein-lassingtal/) und der
      [Parque Nacional Kalkalpen](/lugar/nationalpark-kalkalpen---waldgebiete/). Weiter entfernt teilen der
      [Parque Natural de Karwendel](/lugar/naturpark-karwendel/), der [Parque Natural
      Adamello-Brenta](/lugar/parco-naturale-adamello-brenta/), die [Grupo
      Ankogel](/lugar/ankogelgruppe---hohe-tauern/) und der [Parque Nacional de los
      Écrins](/lugar/parc-national-des-ecrins---massif/) Steinbock- und Gämsenpopulationen mit dem Hochschwab.
  it:
    intro: >-
      Piove, nevica, ma non scorre un solo ruscello sulle alture. È questo il prodigio idrologico
      dell'Hochschwab: un altopiano calcareo così fessurato che l'acqua scompare interamente nel sottosuolo e
      riaffiora sui fianchi in enormi sorgenti carsiche che arrivano dritte ai rubinetti di Vienna. È la
      Hochschwabgruppe, un massiccio di circa 400 km² nella Stiria settentrionale, in Austria, che tocca la
      vetta dell'Hochschwab a 2277 m e si attraversa tra balze rocciose, circhi, campi carreggiati e rifugi
      alpini.
    landscape: >-
      L'Hochschwab è un massiccio delle Alpi Settentrionali Calcaree, un altopiano d'alta quota composto
      prevalentemente da calcare del Wetterstein, una roccia che l'acqua discioglie facilmente. Da qui si
      origina il fenomeno carsico. Le superfici sommitali dell'altopiano si sollevarono nel Miocene durante
      l'orogenesi alpina: al di sopra di circa 1330 m presentano ondulazioni dolci che sui bordi precipitano a
      strapiombo verso le valli sottostanti. L'altopiano è delimitato dal valico di Seeberg a est e da quello
      di Präbichl a ovest.


      Neve e pioggia si infiltrano in fessure e doline scorrendo in caverne ipogee; sotto i calcari si trovano
      gli strati impermeabili di Werfen che costringono le acque a sgorgare in copiose risorgive. Così si
      spiega l'aspetto superficiale: sterminati campi carreggiati e doline carsiche, tra cui una gigantesca
      cavità a nord del lago Sackwiesensee estesa per 600 × 300 m con 70 m di profondità. Nelle viscere del
      massiccio sono censite 932 grotte, tra cui il sistema Frauenmauer-Langstein lungo oltre 45 km.


      I ghiacciai e le grandi frane hanno impresso il loro segno. Durante la glaciazione di Würm una calotta
      glaciale ricoprì la parte settentrionale del massiccio, scavando circhi perimetrali. L'erosione glaciale
      ha modellato la valle dell'Obere Dullwitz e ha plasmato la conca del lago Leopoldsteiner See presso
      Eisenerz. Inoltre, tra il 3900 e il 3700 a.C., una gigantesca frana si staccò tra Ebenstein, Großer
      Griesstein e Brandstein, precipitando lungo la valle della Salza ben oltre Wildalpen. Altri due
      scoscendimenti preistorici a Tragöß sbarrarono il Grüner See e la Pfarrerlacke.


      Diversi bacini alpini, quali il Leopoldsteiner See, il Brunnsee e il celebre Grüner See a Tragöß,
      vantano acqua pura di qualità potabile. Il Sackwiesensee e il Teufelssee, posti tra Eisenerz e
      Wildalpen, sono altri noti laghi d'alta quota.
    wildlife: >-
      La fauna del massiccio comprende la [marmotta alpina](/especie/marmota_marmota/), il [camoscio
      alpino](/especie/rupicapra_rupicapra/), lo [stambecco delle Alpi](/especie/capra_ibex/) e
      l'[urogallo](/especie/tetrao_urogallus/), oltre a salamandre alpine e al marasso comune. La flora è
      assai variegata: orecchia d'orso, scarpetta di Venere, nigritella, stella alpina e varie specie di
      genziana.
    visit: >-
      I rifugi del Club Alpino, un'estesa rete di sentieri e diverse stazioni invernali rendono il massiccio
      perfettamente attrezzato per l'escursionismo. La salita classica raggiunge l'Hochschwab da Seewiesen a
      974 m attraverso la valle Seetal, l'Untere Dullwitz, il rifugio Voisthaler Hut, l'Obere Dullwitz e il
      Graf-Meran-Steig fino al rifugio Schiestlhaus. Si può percorrere anche l'itinerario settentrionale da
      Weichselboden lungo la valle della Salza.


      Dallo Schiestlhaus la vetta dell'Hochschwab, una calotta tondeggiante di sfasciumi ed erba, si raggiunge
      in mezz'ora di cammino. La formidabile parete sud costituisce la grande parete d'arrampicata del gruppo:
      larga quasi due chilometri e alta fino a 300 m. Sulla cima transitano il sentiero escursionistico
      Nord-Sud 05, che qui tocca il suo culmine altimetrico, la Via delle Alpi Settentrionali 01 e i sentieri
      europei E6 ed E4.


      Il moderno rifugio Schiestlhaus, inaugurato nel 2005, è la casa passiva a più alta quota del mondo,
      erede di un rifugio storico fondato 120 anni prima. Nei pressi di Bodenbauer, a Thörl, sorge un museo
      dedicato alle vicende dell'Hochschwab.
    history: >-
      Il nome deriva probabilmente dallo Schwabenboden, i pianori pascolivi prossimi alla cresta, prima di
      essere esteso alla vetta e all'intero comprensorio. La più antica testimonianza cartografica
      dell'Hochschwab illustra due cime innevate accompagnate dalla nota «qui c'è sempre neve».


      Il gruppo montuoso è vitale per l'approvvigionamento idrico della capitale: la città di Vienna ricava
      circa il 60 % della sua acqua potabile dal Secondo Acquedotto di Sorgente Alpina, completato nel 1910.
      Le sorgenti di Kläffer nella valle della Salza costituiscono uno dei massimi gruppi sorgentizi delle
      Alpi orientali.
    before: >-
      È un ambiente carsico d'alta quota: data la totale assenza di ruscelli in quota, porta con te tutta
      l'acqua occorrente. Il clima è severo; controlla le condizioni meteorologiche e l'apertura dei rifugi
      prima di salire.
    around: >-
      A soli 3 km si trova il [Parque Nacional Gesäuse](/lugar/nationalpark-gesause---enns-gorge/), e poco
      oltre l'[Área Salvaje Dürrenstein-Lassingtal](/lugar/wildnisgebiet-durrenstein-lassingtal/) e il [Parque
      Nacional Kalkalpen](/lugar/nationalpark-kalkalpen---waldgebiete/). Più distanti, il [Parque Natural de
      Karwendel](/lugar/naturpark-karwendel/), il [Parque Natural
      Adamello-Brenta](/lugar/parco-naturale-adamello-brenta/), il [Grupo
      Ankogel](/lugar/ankogelgruppe---hohe-tauern/) e il [Parque Nacional de los
      Écrins](/lugar/parc-national-des-ecrins---massif/) condividono con l'Hochschwab lo stambecco e il
      camoscio.
  pt:
    intro: >-
      Chove, neva, e contudo nenhum regato corre pelas alturas. Esse é o prodígio hidrológico do Hochschwab:
      um planalto calcário tão fissurado que toda a água se infiltra no subsolo e ressurge nas orlas em
      caudalosas nascentes cársticas que vão parar às torneiras de Viena. Trata-se da Hochschwabgruppe, um
      maciço com cerca de 400 km² no norte da Estíria, Áustria, que culmina no Hochschwab a 2277 m e se
      percorre entre paredes escarpadas, circos glaciares, campos de lapiás e refúgios alpinos.
    landscape: >-
      O Hochschwab é um maciço dos Alpes Calcários Setentrionais, um planalto de alta montanha moldado em
      calcário de Wetterstein, uma rocha facilmente dissolvida pela água ácida. Daí brota o carste. As
      superfícies cimeiras ergueram-se no Mioceno durante a orogenia alpina: acima de cerca de 1330 m formam
      um relevo suave e ondulado que nas orlas quebra em paredões abruptos sobre os vales. O planalto está
      delimitado pelo colo de Seeberg a leste e pelo de Präbichl a oeste.


      A chuva e o degelo escorrem por fendas e algares, fluindo em cavernas subterrâneas; por baixo do
      calcário assentam camadas impermeáveis de Werfen que forçam o líquido a emergir em profusas nascentes.
      Assim se explica a morfologia de superfície: lapiás extensos e dolinas profundas, incluindo uma dolina
      gigante a norte do lago Sackwiesensee com 600 × 300 m e 70 m de profundidade. No interior do maciço
      estão catalogadas 932 grutas, destacando-se o sistema Frauenmauer-Langstein com mais de 45 km.


      O gelo e os desmoronamentos também ditaram o relevo. Na glaciação de Würm uma calote glaciar cobriu o
      norte do maciço, escavando circos nas bordaduras. A erosão glaciar esculpiu o vale de Obere Dullwitz e
      modelou a bacia do lago Leopoldsteiner See junto a Eisenerz. Entre 3900 e 3700 a.C., deu-se um
      gigantesco colapso rochoso entre Ebenstein, Großer Griesstein e Brandstein, descendo pelo vale do Salza
      para lá de Wildalpen. Dois outros desabamentos pré-históricos em Tragöß represaram o Grüner See e a
      Pfarrerlacke.


      Vários lagos, tais como o Leopoldsteiner See, o Brunnsee e o Grüner See em Tragöß, têm água com
      qualidade potável. O Sackwiesensee e o Teufelssee, situados entre Eisenerz e Wildalpen, são outros lagos
      de montanha afamados.
    wildlife: >-
      A fauna do maciço abrange a [marmota alpina](/especie/marmota_marmota/), a
      [camurça](/especie/rupicapra_rupicapra/), o [íbex](/especie/capra_ibex/) e o
      [tetraz-grande](/especie/tetrao_urogallus/), além de salamandras-negras e da víbora-comum. A flora é
      especialmente abundante: orelha-de-urso, sapatinho-de-vénus, nigritela, edelvais e diversas espécies de
      genciana.
    visit: >-
      Os refúgios do Clube Alpino, uma extensa malha de veredas e diversas áreas de desportos de inverno
      preparam o maciço para o turismo de montanha. A ascensão clássica sobe ao Hochschwab a partir de
      Seewiesen a 974 m pelo vale Seetal, a Untere Dullwitz, o refúgio Voisthaler Hut, a Obere Dullwitz e o
      trilho Graf-Meran-Steig até ao Schiestlhaus. É igualmente possível atingir o Schiestlhaus pelo norte, a
      partir de Weichselboden no vale do Salza.


      A partir do Schiestlhaus, o cume do Hochschwab, uma cúpula suave de rocha e pasto alpino, atinge-se em
      meia hora de caminhada. A vertente sul constitui o grande cenário de escalada do maciço: quase dois
      quilómetros de largura e até 300 m de desnível vertical. Pelo topo passam o percurso de grande rota
      Norte-Sul 05, que aqui atinge a sua cota máxima, o Caminho dos Alpes do Norte 01 e os trilhos europeus
      E6 e E4.


      O Schiestlhaus, reconstruído em 2005, é o refúgio passivo a maior altitude do mundo e sucedeu a um
      abrigo histórico com 120 anos. Perto de Bodenbauer, em Thörl, existe um museu dedicado ao Hochschwab.
    history: >-
      O topónimo deriva presumivelmente do Schwabenboden, os planaltos de pastagem junto ao cume,
      estendendo-se posteriormente ao pico e a todo o maciço. O registo cartográfico mais antigo do Hochschwab
      ilustra dois cumes nevados com a anotação «aqui há sempre neve».


      O maciço desempenha um papel fulcral no abastecimento de água: a cidade de Viena capta cerca de 60 % da
      sua água potável através da Segunda Conduta de Nascentes Alpinas, construída em 1910. As nascentes de
      Kläffer no vale do Salza constituem um dos maiores caudais de nascentes cársticas de todos os Alpes
      Orientais.
    before: >-
      Trata-se de um meio cárstico de alta montanha: sem ribeiros nas zonas altas, deves transportar toda a
      água que consumires. O planalto superior enfrenta tempestades repentinas; verifica o estado dos caminhos
      e a abertura dos abrigos antes de subir.
    around: >-
      A apenas 3 km fica o [Parque Nacional Gesäuse](/lugar/nationalpark-gesause---enns-gorge/), e um pouco
      além a [Área Salvaje Dürrenstein-Lassingtal](/lugar/wildnisgebiet-durrenstein-lassingtal/) e o [Parque
      Nacional Kalkalpen](/lugar/nationalpark-kalkalpen---waldgebiete/). Mais distantes, o [Parque Natural de
      Karwendel](/lugar/naturpark-karwendel/), o [Parque Natural
      Adamello-Brenta](/lugar/parco-naturale-adamello-brenta/), o [Grupo
      Ankogel](/lugar/ankogelgruppe---hohe-tauern/) e o [Parque Nacional de los
      Écrins](/lugar/parc-national-des-ecrins---massif/) partilham com o Hochschwab o íbex e a camurça.
