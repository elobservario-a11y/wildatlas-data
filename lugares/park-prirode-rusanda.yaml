texto:
  es:
    intro: >-
      Un lago que a veces se seca y que vuelve a llenarse con las lluvias. Rusanda es un humedal somero, muy
      salino, un lago de sosa en el centro del Banato, a unos dieciséis kilómetros y medio al noroeste de
      Zrenjanin, entre Melenci y Kumane. El parque natural que lo rodea lo forman en su mayor parte el propio
      lago y los hábitats de saladar que lo envuelven: agua salada y vegetación que aguanta la sal.
    landscape: >-
      El lago se divide en dos: Velika Rusanda, la mayor, y Mala Rusanda, la menor, separadas por una
      carretera asfaltada. Su salinidad, tanto en el agua como en el barro, llega a un sesenta por ciento, y
      eso ha hecho pensar que fuera un resto del antiguo mar Panónico, aunque lo más probable es que sea un
      antiguo lecho del Tisza.


      Con Slano Kopovo y Okanj bara forma un complejo conservado de lagos y prados salinos en el Banato del
      Tisza. Es uno de los pocos lugares que combinan un lago salado, su vegetación halófita y un mosaico de
      prados esteparios, marismas y campos. El parque ocupa terrenos de los municipios de Novi Bečej y
      Zrenjanin, y tiene una zona de protección en su exterior para amortiguar las influencias externas.


      Y el lago no es fijo. Los hidrólogos explican que su desecación no es inusual, que ocurre de vez en
      cuando sin alterar el ecosistema, y que cuando empieza la estación de lluvias vuelve a llenarse.
    wildlife: >-
      La vegetación es de sal. Se han registrado doscientos treinta y cinco taxones de plantas vasculares,
      entre ellos la salicornia, la salsola y la *Suaeda pannonica*; esta última solo se ha confirmado en
      Serbia en Rusanda, Slano Kopovo y Okanj bara. También se citan *Bassia sedoides*, *Scorzonera
      parviflora*, *Silene viscosa* y *Trifolium ornithopodioides*.


      Las aves son el motivo para venir. Rusanda es una de las estaciones de paso más importantes de Vojvodina
      para las aves acuáticas, sobre todo las limícolas, en el corredor migratorio que sigue el Tisza. Entre
      las que crían en lagos salados y marismas salinizadas destacan la [avoceta
      común](/especie/recurvirostra_avosetta/) y la cigüeñuela común; el plan de protección cita también la
      aguja colinegra, el zampullín cuellinegro y la cerceta carretona. En los prados salinos de los
      alrededores vive el [suslik europeo](/especie/spermophilus_citellus/). Entre los invertebrados
      protegidos figuran *Eoleptestheria spinosa* e *Imnadia banatica*.
    visit: >-
      La visita lleva de medio día a un día. El parque está a unos dieciséis kilómetros y medio de Zrenjanin,
      entre Melenci y Kumane, y se extiende por los municipios de Novi Bečej y Zrenjanin. Lo gestiona la
      institución Rezervati prirode Zrenjanin.
    history: >-
      El parque se declaró área protegida provincial de categoría II el tres de julio de dos mil catorce.
      Protege estepas salinas y marismas panónicas consideradas prioritarias a escala nacional e
      internacional, y mantiene el corredor ecológico para las migraciones entre los hábitats naturales del
      entorno.
    before: La mejor época es la primavera y el otoño, y el gestor es Rezervati prirode Zrenjanin.
    around: >-
      A veintidós kilómetros está la [Reserva Natural Especial Carska
      Bara](/lugar/specijalni-rezervat-prirode-carska-bara/). Más lejos, otros humedales con la avoceta y el
      tarro blanco: el [Parque Natural de Ses Salines de Ibiza y
      Formentera](/lugar/parque-natural-de-ses-salines/), el [Parque Natural de la Ria
      Formosa](/lugar/parque-natural-da-ria-formosa/) y el [Parque Nacional del Mar de Wadden de Baja
      Sajonia](/lugar/nationalpark-niedersachsisches-wattenmeer/).
  en:
    intro: >-
      A lake that sometimes dries up completely and refills with the return of rains. Rusanda is a shallow,
      highly saline wetland, a soda lake set in the heart of Banat, roughly sixteen and a half kilometres
      north-west of Zrenjanin between Melenci and Kumane. The surrounding nature park consists predominantly
      of the lake itself and the saltmarsh habitats enclosing it: saltwater expanses and salt-tolerant
      vegetation.
    landscape: >-
      The lake is divided in two: Velika Rusanda, the larger water body, and Mala Rusanda, the smaller,
      separated by a paved road. Its salinity in both water and mud reaches up to sixty per cent, prompting
      suggestions that it might be a remnant of the ancient Pannonian Sea, though it is more likely an
      abandoned palaeochannel of the Tisza.


      Together with Slano Kopovo and Okanj bara, it forms a well-preserved complex of saline lakes and meadows
      in the Tisza basin of Banat. It stands as one of the few places blending a saltwater lake, halophytic
      flora and a mosaic of steppe pastures, marshes and arable fields. The park covers land within Novi Bečej
      and Zrenjanin municipalities, flanked by an external buffer zone to mitigate external impacts.


      Nor is the lake permanent in extent. Hydrologists note that drying out is not unusual, occurring
      periodically without disrupting the ecosystem, refilling naturally when the wet season begins.
    wildlife: >-
      The plant life is shaped by salt. Two hundred and thirty-five vascular plant taxa have been documented,
      among them glasswort, saltwort and *Suaeda pannonica*; the latter is confirmed in Serbia solely at
      Rusanda, Slano Kopovo and Okanj bara. Also recorded are *Bassia sedoides*, *Scorzonera parviflora*,
      *Silene viscosa* and *Trifolium ornithopodioides*.


      Birds provide the compelling reason to visit. Rusanda serves as one of Vojvodina's premier migratory
      stopovers for wetland avifauna, especially waders travelling the Tisza flyway. Among species breeding in
      saline lakes and brackish marshes, the [pied avocet](/especie/recurvirostra_avosetta/) and black-winged
      stilt are prominent; the conservation plan also records black-tailed godwit, black-necked grebe and
      garganey. In the surrounding alkaline meadows lives the [European ground
      squirrel](/especie/spermophilus_citellus/). Protected invertebrates include *Eoleptestheria spinosa* and
      *Imnadia banatica*.
    visit: >-
      A visit typically takes from half a day to a full day. The park lies some sixteen and a half kilometres
      from Zrenjanin, between Melenci and Kumane, spanning the territories of Novi Bečej and Zrenjanin
      municipalities. It is managed by the public institution Rezervati prirode Zrenjanin.
    history: >-
      The park was proclaimed a Category II provincial protected area on the third of July two thousand and
      fourteen. It safeguards Pannonian salt steppes and saltmarshes recognized as national and international
      conservation priorities, preserving the ecological corridor for migratory movements among surrounding
      natural habitats.
    before: >-
      The optimal visiting seasons are spring and autumn, and the managing authority is Rezervati prirode
      Zrenjanin.
    around: >-
      Twenty-two kilometres away lies the [Carska Bara Special Nature
      Reserve](/lugar/specijalni-rezervat-prirode-carska-bara/). Further afield, other wetlands home to the
      avocet and common shelduck include the [Ses Salines d'Eivissa i Formentera Natural
      Park](/lugar/parque-natural-de-ses-salines/), the [Ria Formosa Natural
      Park](/lugar/parque-natural-da-ria-formosa/) and the [Lower Saxony Wadden Sea National
      Park](/lugar/nationalpark-niedersachsisches-wattenmeer/).
  fr:
    intro: >-
      Un lac qui s'assèche parfois complètement pour se remplir à nouveau au gré des pluies. Rusanda est une
      zone humide peu profonde et hautement saline, un lac de soude au cœur du Banat, à environ seize
      kilomètres et demi au nord-ouest de Zrenjanin, entre Melenci et Kumane. Le parc naturel qui l'entoure se
      compose essentiellement du lac lui-même et des habitats halophiles périphériques : nappe d'eau salée et
      végétation tolérant le sel.
    landscape: >-
      Le lac se divise en deux bassins : Velika Rusanda, le plus étendu, et Mala Rusanda, le plus modeste,
      séparés par une route goudronnée. Sa salinité, tant dans l'eau que dans la boue, atteint jusqu'à
      soixante pour cent, ce qui a pu faire penser à un vestige de l'ancienne mer pannonienne, bien qu'il
      s'agisse plus vraisemblablement d'un ancien bras mort de la Tisza.


      Avec Slano Kopovo et Okanj bara, il constitue un ensemble préservé de lacs et prés salés dans le Banat
      de la Tisza. C'est l'un des rares sites combinant un lac salé, sa flore halophyte et une mosaïque de
      pelouses steppiques, marais et parcelles cultivées. Le parc s'étend sur les communes de Novi Bečej et
      Zrenjanin, bordé d'une zone tampon périphérique pour amortir les pressions extérieures.


      Le lac n'a rien d'immuable. Les hydrologues précisent que son assèchement n'a rien d'anormal, survenant
      périodiquement sans dégrader l'écosystème, le bassin se remplissant spontanément dès la saison des
      pluies.
    wildlife: >-
      La végétation est tout entière régie par le sel. Deux cent trente-cinq taxons de plantes vasculaires y
      ont été recensés, parmi lesquels la salicorne, la soude et *Suaeda pannonica* ; cette dernière n'est
      confirmée en Serbie qu'à Rusanda, Slano Kopovo et Okanj bara. Sont également signalées *Bassia
      sedoides*, *Scorzonera parviflora*, *Silene viscosa* et *Trifolium ornithopodioides*.


      Les oiseaux constituent la grande motivation d'une venue. Rusanda est l'une des haltes migratoires les
      plus capitales de Voïvodine pour les oiseaux d'eau, tout particulièrement les limicoles empruntant le
      couloir de la Tisza. Parmi les nicheurs des lagunes salées et marais saumâtres ressortent l'[avocette
      élégante](/especie/recurvirostra_avosetta/) et l'échasse blanche ; le document de gestion mentionne
      aussi la barge à queue noire, le grèbe à cou noir et la sarcelle d'été. Dans les prés salés d'alentour
      vit le [souslik d'Europe](/especie/spermophilus_citellus/). Parmi les invertébrés protégés figurent
      *Eoleptestheria spinosa* et *Imnadia banatica*.
    visit: >-
      Une visite demande généralement d'une demi-journée à une journée entière. Le parc se trouve à environ
      seize kilomètres et demi de Zrenjanin, entre Melenci et Kumane, réparti entre les municipalités de Novi
      Bečej et Zrenjanin. Il est placé sous la gestion de l'établissement public Rezervati prirode Zrenjanin.
    history: >-
      Le parc a été proclamé aire protégée provinciale de catégorie II le trois juillet deux mille quatorze.
      Il préserve des steppes salées et marais pannoniens considérés comme prioritaires aux échelons national
      et international, assurant le maintien du corridor écologique migratoire reliant les milieux naturels de
      la région.
    before: >-
      Les meilleures périodes correspondent au printemps et à l'automne, le gestionnaire étant Rezervati
      prirode Zrenjanin.
    around: >-
      À vingt-deux kilomètres se trouve la [Réserve naturelle spéciale de Carska
      Bara](/lugar/specijalni-rezervat-prirode-carska-bara/). Plus loin, d'autres zones humides abritant
      l'avocette et le tadorne de Belon comptent le [Parc naturel de Ses Salines d'Ibiza et
      Formentera](/lugar/parque-natural-de-ses-salines/), le [Parc naturel de la Ria
      Formosa](/lugar/parque-natural-da-ria-formosa/) et le [Parc national de la mer des Wadden de
      Basse-Saxe](/lugar/nationalpark-niedersachsisches-wattenmeer/).
  de:
    intro: >-
      Ein See, der zuweilen austrocknet und sich mit den Niederschlägen wieder füllt. Rusanda ist ein
      seichtes, hochgradig salziges Feuchtgebiet, ein Sodasee im Herzen des Banats, rund sechzehneinhalb
      Kilometer nordwestlich von Zrenjanin zwischen Melenci und Kumane gelegen. Der umgebende Naturpark
      besteht vor allem aus dem See selbst und den umgebenden Salzlebensräumen: Salzwasser und salzresistente
      Vegetation.
    landscape: >-
      Der See teilt sich in zwei Bereiche: Velika Rusanda, der größere Teil, und Mala Rusanda, der kleinere,
      getrennt durch eine asphaltierte Straße. Sein Salzgehalt in Wasser und Schlamm erreicht bis zu sechzig
      Prozent, was Vermutungen nährte, es handle sich um ein Relikt des einstigen Pannonischen Meeres,
      wenngleich ein verlassener Altarm der Theiß wahrscheinlicher ist.


      Gemeinsam mit Slano Kopovo und Okanj bara bildet er einen intakten Komplex aus Salzseen und Salzwiesen
      im Theiß-Banat. Es ist einer der wenigen Orte, die einen Salzsee, Halophytenvegetation und ein Mosaik
      aus Steppenwiesen, Sümpfen und Kulturland vereinen. Der Park umfasst Gemeindeflächen von Novi Bečej und
      Zrenjanin mit einer äußeren Pufferzone zur Dämpfung externer Einflüsse.


      Der See ist keine starre Wasserfläche. Hydrologen betonen, dass eine Austrocknung keineswegs
      ungewöhnlich ist, periodisch ohne Störung des Ökosystems stattfindet und sich das Becken bei Einsetzen
      der Regenzeit von selbst regeneriert.
    wildlife: >-
      Die Pflanzendecke ist salzgeprägt. Zweihundertfünfunddreißig Gefäßpflanzensippen wurden nachgewiesen,
      darunter Queller, Salzkraut und *Suaeda pannonica*; letztere ist in Serbien ausschließlich in Rusanda,
      Slano Kopovo und Okanj bara belegt. Zudem werden *Bassia sedoides*, *Scorzonera parviflora*, *Silene
      viscosa* und *Trifolium ornithopodioides* erwähnt.


      Die Vogelwelt liefert den Hauptgrund für einen Besuch. Rusanda fungiert als einer der bedeutendsten
      Rastplätze der Wojwodina für Wasservögel, insbesondere Watvögel auf der Theiß-Zugroute. Unter den
      Brutvögeln versalzter Lagunen stechen der [Säbelschnäbler](/especie/recurvirostra_avosetta/) und der
      Stelzenläufer hervor; der Schutzplan verzeichnet auch Uferschnepfe, Schwarzhalstaucher und Knäkente. In
      den umliegenden Salzwiesen lebt der [Europäische Ziesel](/especie/spermophilus_citellus/). Zu den
      geschützten Wirbellosen zählen *Eoleptestheria spinosa* und *Imnadia banatica*.
    visit: >-
      Ein Besuch nimmt einen halben bis ganzen Tag in Anspruch. Der Park liegt rund sechzehneinhalb Kilometer
      von Zrenjanin entfernt zwischen Melenci und Kumane auf Flächen der Gemeinden Novi Bečej und Zrenjanin.
      Er wird von der öffentlichen Einrichtung Rezervati prirode Zrenjanin betreut.
    history: >-
      Der Park wurde am dritten Juli zweitausendvierzehn zum provinziellen Schutzgebiet der Kategorie II
      erklärt. Er schützt pannonische Salzsteppen und Salzmarschen von nationaler und internationaler
      Priorität und sichert den ökologischen Wanderkorridor im Verbund benachbarter Naturräume.
    before: Die beste Reisezeit umfasst Frühling und Herbst; Ansprechpartner ist Rezervati prirode Zrenjanin.
    around: >-
      Zweiundzwanzig Kilometer entfernt liegt das [Sondernaturreservat Carska
      Bara](/lugar/specijalni-rezervat-prirode-carska-bara/). Weiter entfernt beherbergen auch der [Naturpark
      Ses Salines auf Ibiza und Formentera](/lugar/parque-natural-de-ses-salines/), der [Naturpark Ria
      Formosa](/lugar/parque-natural-da-ria-formosa/) und der [Nationalpark Niedersächsisches
      Wattenmeer](/lugar/nationalpark-niedersachsisches-wattenmeer/) Säbelschnäbler und Brandgans.
  it:
    intro: >-
      Un lago che talvolta si prosciuga del tutto per riempirsi nuovamente con l'arrivo delle piogge. Rusanda
      è una zona umida poco profonda e fortemente salina, un lago di soda nel cuore del Banato a circa sedici
      chilometri e mezzo a nord-ovest di Zrenjanin, tra Melenci e Kumane. Il parco naturale circostante è
      formato in gran parte dal lago stesso e dagli habitat alofili contigui: specchi d'acqua salata e flora
      resistente al sale.
    landscape: >-
      Il lago è diviso in due bacini: Velika Rusanda, il maggiore, e Mala Rusanda, il minore, separati da una
      strada asfaltata. La salinità di acque e fanghi tocca fino al sessanta per cento, inducendo a ipotizzare
      un relitto dell'antico mare Pannonico, sebbene sia più verosimile un antico paleoalveo abbandonato del
      Tibisco.


      Assieme a Slano Kopovo e Okanj bara compone un complesso integro di laghi e prati salmastri nel Banato
      del Tibisco. Rappresenta uno dei rari luoghi che uniscono un lago salato, vegetazione alofita e un
      mosaico di pascoli steppici, paludi e coltivi. Il parco interessa i territori comunali di Novi Bečej e
      Zrenjanin, munito di una fascia cuscinetto per attutire gli impatti esterni.


      Il lago non ha superficie fissa. Gli idrologi spiegano che il prosciugamento non è inconsueto,
      verificandosi periodicamente senza alterare l'equilibrio ecologico, per poi ricolmarsi spontaneamente
      all'avvio della stagione piovosa.
    wildlife: >-
      La coltre vegetale è forgiata dal sale. Sono stati censiti duecentotrentacinque taxa di piante
      vascolari, tra cui la salicornia, la salsola e *Suaeda pannonica*; quest'ultima è accertata in Serbia
      unicamente a Rusanda, Slano Kopovo e Okanj bara. Si segnalano inoltre *Bassia sedoides*, *Scorzonera
      parviflora*, *Silene viscosa* e *Trifolium ornithopodioides*.


      Gli uccelli rappresentano il motivo principale per una visita. Rusanda funge da scalo migratorio
      cruciale in Voivodina per l'avifauna acquatica, specie per i limicoli che risalgono la rotta del
      Tibisco. Tra le specie nidificanti in lagune salate ed estuari salmastri primeggiano l'[avocetta
      comune](/especie/recurvirostra_avosetta/) e il cavaliere d'Italia; la pianificazione cita anche la
      pittima reale, il svasso piccolo e la marzaiola. Nei pascoli salati vive il [citello
      europeo](/especie/spermophilus_citellus/). Tra gli invertebrati tutelati compaiono *Eoleptestheria
      spinosa* e *Imnadia banatica*.
    visit: >-
      Una visita impegna da mezza giornata a un'intera giornata. Il parco dista circa sedici chilometri e
      mezzo da Zrenjanin, tra Melenci e Kumane, estendendosi nei comuni di Novi Bečej e Zrenjanin. La gestione
      compete all'ente pubblico Rezervati prirode Zrenjanin.
    history: >-
      Il parco è stato proclamato area protetta provinciale di categoria II il tre luglio duemilaquattordici.
      Custodisce steppe salate e paludi pannoniche ritenute prioritarie a livello nazionale e internazionale,
      garantendo il corridoio ecologico per le migrazioni tra i biotopi dell'area.
    before: Le stagioni preferibili sono primavera e autunno; l'ente gestore è Rezervati prirode Zrenjanin.
    around: >-
      A ventidue chilometri sorge la [Riserva Naturale Speciale Carska
      Bara](/lugar/specijalni-rezervat-prirode-carska-bara/). Più lontano, altre zone umide che accolgono
      l'avocetta e la volpoca annoverano il [Parco Naturale di Ses Salines di Ibiza e
      Formentera](/lugar/parque-natural-de-ses-salines/), il [Parco Naturale della Ria
      Formosa](/lugar/parque-natural-da-ria-formosa/) e il [Parco Nazionale del Mare di Wadden della Bassa
      Sassonia](/lugar/nationalpark-niedersachsisches-wattenmeer/).
  pt:
    intro: >-
      Um lago que por vezes seca totalmente e volta a encher-se com o regresso das chuvas. Rusanda é uma zona
      húmida pouco profunda e fortemente salina, um lago de soda no centro do Banato, a cerca de dezasseis
      quilómetros e meio a noroeste de Zrenjanin, entre Melenci e Kumane. O parque natural envolvente é
      constituído na sua maior parte pelo próprio lago e pelos habitats halomórficos circundantes: águas
      salgadas e flora resistente ao sal.
    landscape: >-
      O lago reparte-se em dois corpos de água: Velika Rusanda, o maior, e Mala Rusanda, o menor, separados
      por uma estrada asfaltada. A sua salinidade, tanto na água como na vasa, chega aos sessenta por cento, o
      que levou a supor que fosse um vestígio do antigo mar Panónico, embora seja mais verosímil tratar-se de
      um antigo meandro abandonado do Tisza.


      Juntamente com Slano Kopovo e Okanj bara, forma um conjunto conservado de lagos e prados salgados no
      Banato do Tisza. É um dos raros locais que reúnem um lago salgado, vegetação halófita e um mosaico de
      prados estepários, pauis e terras agrícolas. O parque ocupa terrenos dos municípios de Novi Bečej e
      Zrenjanin, dispondo de uma faixa tampão externa para atenuar as perturbações exteriores.


      O lago não possui contorno imutável. Os hidrólogos esclarecem que a dessecação não é invulgar, ocorrendo
      periodicamente sem abalar o ecossistema, voltando a encher-se espontaneamente no arranque da época das
      chuvas.
    wildlife: >-
      O manto vegetal é modelado pelo sal. Foram identificados duzentos e trinta e cinco táxones de plantas
      vasculares, destacando-se a salicórnia, a barrilha e a *Suaeda pannonica*; esta última apenas está
      confirmada na Sérvia em Rusanda, Slano Kopovo e Okanj bara. Assinalam-se igualmente *Bassia sedoides*,
      *Scorzonera parviflora*, *Silene viscosa* e *Trifolium ornithopodioides*.


      As aves motivam uma deslocação ao local. Rusanda constitui uma das mais cruciais escalas migratórias da
      Voivodina para aves aquáticas, em particular limícolas ao longo da rota do Tisza. Entre as espécies que
      nidificam em lagoas salgadas e pauis salobros sobressaem o [alfaiate](/especie/recurvirostra_avosetta/)
      e o pernilongo; o documento de gestão regista também o maçarico-de-bico-direito, o
      mergulhão-de-pescoço-preto e a marreca-pardilheira. Nos prados salinos circundantes vive o
      [esquilo-terrestre-europeu](/especie/spermophilus_citellus/). Entre os invertebrados protegidos
      contam-se *Eoleptestheria spinosa* e *Imnadia banatica*.
    visit: >-
      Uma visita consome de meio dia a um dia inteiro. O parque dista cerca de dezasseis quilómetros e meio de
      Zrenjanin, entre Melenci e Kumane, estendendo-se pelos municípios de Novi Bečej e Zrenjanin. É
      administrado pela entidade pública Rezervati prirode Zrenjanin.
    history: >-
      O parque foi declarado área protegida provincial de categoria II a três de julho de dois mil e catorze.
      Salvaguarda estepes salgadas e sapais panónicos considerados prioritários a nível nacional e
      internacional, preservando o corredor ecológico migratório entre os biótopos vizinhos.
    before: A melhor época abrange a primavera e o outono, sendo o órgão gestor a Rezervati prirode Zrenjanin.
    around: >-
      A vinte e dois quilómetros situa-se a [Reserva Natural Especial Carska
      Bara](/lugar/specijalni-rezervat-prirode-carska-bara/). Mais longe, outras zonas húmidas com alfaiate e
      pato-tadorno englobam o [Parque Natural de Ses Salines de Ibiza e
      Formentera](/lugar/parque-natural-de-ses-salines/), o [Parque Natural da Ria
      Formosa](/lugar/parque-natural-da-ria-formosa/) e o [Parque Nacional do Mar de Wadden da Baixa
      Saxónia](/lugar/nationalpark-niedersachsisches-wattenmeer/).
