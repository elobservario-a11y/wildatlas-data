resumen:
  es: >-
    Colinas de cuarcita sobre el lago Pielinen: el «paisaje nacional» de Finlandia, con prados de pastoreo
    tradicional y bosque boreal.
  en: >-
    Quartzite ridges overlooking Lake Pielinen: Finland's iconic national landscape, blending heritage meadows
    with old-growth boreal forest.
  fr: >-
    Crêtes de quartzite surplombant le lac Pielinen : le « paysage national » de la Finlande, entre prairies
    traditionnelles et forêt boréale.
  de: >-
    Quarzitrücken über dem Pielinen-See: Finnlands bekannteste Nationallandschaft mit traditionellen
    Rodungswiesen und borealem Urwald.
  it: >-
    Dorsali di quarzite affacciate sul lago Pielinen: il «paesaggio nazionale» della Finlandia, tra pascoli
    tradizionali e taiga boreale.
  pt: >-
    Cristas de quartzito sobre o lago Pielinen: a «paisagem nacional» da Finlândia, conjugando lameiros
    tradicionais e floresta boreal.
unico:
  es: >-
    Aquí se sube a lo que fue una cordillera como el Himalaya y se baja a prados que todavía se siegan cada
    año, con el paisaje nacional de Finlandia abierto hacia el lago Pielinen.
  en: >-
    Ascend what was once a Himalayan-scale mountain range and descend into traditionally scythed meadows, with
    Finland's iconic panorama sweeping across Lake Pielinen.
  fr: >-
    Vous grimpez sur ce qui fut une chaîne comparable à l'Himalaya et redescendez vers des prés fauchés chaque
    année, avec le panorama national finlandais sur le lac Pielinen.
  de: >-
    Hier steigst du auf die Reste eines uralten Faltengebirges von der Höhe des Himalaya und hinab zu
    traditionell gemähten Wiesen vor der Kulisse des Pielinen.
  it: >-
    Qui puoi salire sui resti di un'antica catena montuosa imponente come l'Himalaya e scendere verso prati
    ancora falciati a mano, affacciati sul lago Pielinen.
  pt: >-
    Aqui sobes ao que outrora foi uma cordilheira como os Himalaias e desces a prados ainda ceifados à mão,
    com a panorâmica nacional finlandesa sobre o lago Pielinen.
observaciones:
  es: >-
    Los perros van atados. Acampa solo en los sitios señalados y enciende fuego solo en los hogares marcados;
    con aviso de incendio forestal, está prohibido. No hay papeleras: llévate todo lo que traes. Se pueden
    recoger bayas y setas comestibles, salvo en zonas restringidas, y no otras plantas. El snowboard y el
    esquí alpino están prohibidos en las laderas de los miradores de Ukko-Koli, Akka-Koli y Paha-Koli. En
    bicicleta solo puedes ir por carreteras, no por los senderos.
texto:
  es:
    intro: >-
      Los Himalayas no son tan viejos como estas colinas. Koli, a orillas del lago Pielinen, es el último
      resto de una cordillera que se levantó hace casi dos mil millones de años, cuando chocaron dos placas
      continentales y se plegaron las montañas Carelias, y que llegó a tener una altura parecida a la del
      Himalaya actual. Tras millones de años de erosión, solo quedan colinas de cuarcita dura, pulidas por las
      glaciaciones, en un parque nacional donde se pisa el lecho de roca más antiguo de Finlandia.
    landscape: >-
      El punto más alto es Ukko-Koli, a 347 metros, con la roca pulida por las glaciaciones. Desde su cima se
      abre hacia el Pielinen el icónico paisaje nacional de Koli. La cadena de colinas está en el límite entre
      dos áreas de roca de distinta edad: al este, gneis granítico de más de dos mil seiscientos millones de
      años; al oeste, cuarcitas más jóvenes. El Pielinen, cuarto lago de Finlandia, mide 93 kilómetros de
      largo y menos de diez metros de profundidad media.


      Sobre esa roca hay colinas ondulantes, bosques viejos, bosques de hierbas exuberantes y prados de
      colores. En las laderas de Ipatti, junto al sendero Kaskenkierros, el bosque lleva al menos un siglo sin
      talarse: abetos y álamos enormes, y madera muerta que da casa a insectos, musgos y hongos raros. En las
      laderas de las colinas crecen bosques de frondosas, húmedos y ricos en nutrientes, con plantas de gran
      porte, helechos, musgos e incluso orquídeas, que se recorren por el sendero Paimenenpolku. Se mantienen
      quitando los abetos, que bloquean la luz y acidifican el suelo.


      Y están los prados. Las tierras de cultivo abandonadas se mantienen abiertas con una siega anual, y
      ovejas, vacas y caballos pastan en los hábitats rurales tradicionales.
    wildlife: >-
      En el lago, las aves clave son el colimbo ártico y la rara gaviota de dorso negro; en el archipiélago de
      Koli, un [águila pescadora](/especie/pandion_haliaetus/) anida en un nido artificial. A principios de
      verano, en el norte del parque, cantan el petirrojo de cola azul, el mosquitero verdoso y el papamoscas
      papirrojo.


      En los bosques mixtos viejos, un visitante con suerte puede ver una ardilla voladora, que necesita
      álamos con agujeros de pájaro carpintero. Las muchas liebres atraen a los [linces](/especie/lynx_lynx/),
      y los prados atraen a pequeños mamíferos y a depredadores como la marta y el armiño. En las charcas
      viven el tritón liso y el rarísimo tritón crestado. En el Pielinen, el salmón de lago se extinguió en
      los años 1960 por las obras del río Lieksanjoki, y se intenta recuperarlo con salmón del Saimaa.


      En primavera y verano los prados se llenan de flores y mariposas. En invierno los senderos no tienen
      mantenimiento, pero la nieve de algunos suele quedar pisada, y hay un sendero para raquetas por las
      cumbres.
    visit: >-
      Hay unos 80 km de rutas señaladas, con guía o sin él. Las vistas más famosas son desde lo alto de
      Ukko-Koli; una ruta accesible exigente de 0,8 km sube al mirador desde el Centro de Naturaleza Ukko.


      El sendero natural Kasken Kierros (4,1 km) pasa por el paisaje de roza típico de la zona y es ideal para
      escolares y familias. Para los más curtidos, el Herajärvenkierros (de 30 a 61 km) cruza colinas
      boscosas, con tienda propia, refugio o cabaña. A doce kilómetros al sur de Koli está Pirunkirkko, una
      cueva de grieta en forma de Z de 33 metros, a la que se llega desde el Herajärvi por el sendero
      Kiehinen.
    history: >-
      Las primeras huellas humanas son de la Edad de Piedra, y la roza y quema empezó incluso antes de los
      asentamientos permanentes y moldeó el paisaje. Las colinas se poblaron de forma permanente a mediados
      del siglo XVIII. Koli sigue manteniendo la tradición: cada pocos años se practica la roza y quema para
      conservar las variedades de centeno y nabo que se cultivan así.


      Koli fue también el paisaje de los artistas. En la grieta de Uhrihalkeama, un antiguo lugar de
      sacrificio protegido por la ley de antigüedades, la roca está llena de monedas lanzadas durante el
      último siglo. El escritor Juhani Aho, el pintor Eero Järnefelt y Jean Sibelius pasaron por aquí: se cree
      que la cuarta sinfonía de Sibelius se inspiró en parte en su viaje, y Pekka Halonen pintó el invernal
      «Koli». El parque protege un área representativa de las colinas de Carelia del Norte, con sus bosques
      viejos.
    before: >-
      Los perros van atados. Acampa solo en los sitios señalados y enciende fuego solo en los hogares
      marcados; con aviso de incendio forestal, está prohibido. No hay papeleras: llévate todo lo que traes.
      Se pueden recoger bayas y setas comestibles, salvo en zonas restringidas, y no otras plantas. El
      snowboard y el esquí alpino están prohibidos en las laderas de los miradores de Ukko-Koli, Akka-Koli y
      Paha-Koli. En bicicleta solo puedes ir por carreteras, no por los senderos.
    around: >-
      Lejos de aquí, el [Parque Nacional de Aigüestortes y Lago de San
      Mauricio](/lugar/parc-nacional-d-aiguestortes-i-estany-de-sant-maurici/), la [Selva de
      Irati](/lugar/foret-d-irati---selva-de-irati/) y el [Parque Natural Fuentes del Narcea, Degaña e Ibias y
      Reserva de Muniellos](/lugar/fuentes-del-narcea-degana-e-ibias---muniellos/) comparten con Koli bosque
      maduro y especies como el pico negro y el urogallo.
  en:
    intro: >-
      The Himalayas are far younger than these worn ridges. Koli, rising beside Lake Pielinen, represents the
      eroded stump of an ancient mountain belt thrust upward almost two billion years ago when two continental
      plates collided to forge the Karelides, once rivaling today's highest ranges in altitude. Following eons
      of erosion, only hard quartzite peaks smoothed by Pleistocene glaciers survive, protecting Finland's
      oldest accessible bedrock within a celebrated national park.
    landscape: >-
      The highest summit is Ukko-Koli at 347 metres, its bare white quartzite bedrock polished gleaming smooth
      by retreating ice sheets. From its open crest unfolds Finland's definitive national landscape gazing out
      over Lake Pielinen. The ridge marks a sharp geological divide between two distinct bedrock ages: to the
      east lies Archaean granitic gneiss older than two billion six hundred million years, while younger
      Proterozoic quartzites dominate to the west. Pielinen itself, Finland's fourth-largest lake, stretches
      for 93 kilometres in length yet averages under ten metres in depth.


      Draped over this primordial rock is an undulating quilt of ancient woodland, lush herb-rich glades, and
      pastoral meadows. On the slopes of Ipatti along the Kaskenkierros trail, trees have stood unlogged for
      well over a century: towering spruces and aspen trunks supply deadwood vital for rare saproxylic
      beetles, mosses, and bracket fungi. Sheltered nutrient-rich hillside gullies support luxuriant deciduous
      woods with tall perennial herbs, ferns, and delicate orchids, explored along the Paimenenpolku trail.
      Rangers actively remove invading spruces to maintain sunlight and prevent soil acidification.


      Then come the historical heritage meadows. Former slash-and-burn farming clearings are preserved through
      annual scything, while native sheep, cattle, and horses graze traditionally maintained rural biotopes.
    wildlife: >-
      On the lake, iconic birds include the red-throated diver and the rare lesser black-backed gull, while on
      the Koli archipelago an [osprey](/especie/pandion_haliaetus/) breeds atop a specially erected artificial
      platform. In early summer, the northern forests echo with the fluting songs of red-flanked bluetails,
      greenish warblers, and red-breasted flycatchers.


      Within old-growth mixed stands, an observant visitor may glimpse the elusive Siberian flying squirrel,
      which depends on mature aspens with abandoned woodpecker cavities. Plentiful mountain hares sustain
      resident Eurasian [lynx](/especie/lynx_lynx/), while open meadows provide hunting grounds for pine
      martens and stoats. Clean forest pools shelter smooth newts alongside rare great crested newts. In Lake
      Pielinen, the landlocked salmon population was driven to extinction during the 1960s by
      hydro-engineering on the Lieksanjoki river, prompting current restoration initiatives with Lake Saimaa
      broodstock.


      In spring and summer the sunny meadows erupt in wildflowers and butterflies. Winter trails are not
      mechanically maintained, yet snowshoe tracks stay well trodden across scenic ridge crests.
    visit: >-
      Around 80 km of marked trails traverse the park, suitable for self-guided or ranger-led exploration. The
      most famous vantage point crowns Ukko-Koli; a short, demanding accessible trail of 0.8 km ascends to the
      summit lookout from the Ukko Nature Centre.


      The Kasken Kierros nature trail (4.1 km) loops through representative slash-and-burn succession
      landscapes, ideal for families and school groups. For seasoned backpackers, the Herajärvenkierros
      circuit (from 30 to 61 km) crosses rugged forested ridges with designated tent sites, lean-to shelters,
      and wilderness huts. Twelve kilometres south of Koli village lies Pirunkirkko, an intriguing 33-metre
      Z-shaped boulder crevice cave reached from Herajärvi along the Kiehinen trail.
    history: >-
      Human habitation traces back to the Stone Age, and slash-and-burn cultivation predated permanent
      settlements, fundamentally moulding the floral tapestry. Permanent farms were established across the
      hills in the mid-eighteenth century. Koli proudly preserves this heritage: traditional burn-beating is
      carried out every few seasons to safeguard heritage landraces of rye and turnip.


      Koli also inspired Finland's National Romantic cultural awakening. In the sacrificial fissure of
      Uhrihalkeama, protected under heritage law, visitors have tossed coins into the cleft for over a
      century. Novelist Juhani Aho, painter Eero Järnefelt, and composer Jean Sibelius found deep inspiration
      here: Sibelius's Fourth Symphony was partly conceived following his mountain trek, while Pekka Halonen
      captured the ridges in his masterwork "Koli in Winter". The park permanently safeguards these iconic
      North Karelian highlands and ancient forests.
    before: >-
      Dogs must remain on leashes at all times. Camp only at designated camping pitches and light campfires
      exclusively at official hearths; all fires are strictly prohibited during forest fire warnings. There
      are no refuse bins in the park, so carry out all waste. Foraging for edible berries and mushrooms is
      permitted except in restricted core zones, but picking wildflowers or other plants is unlawful. Downhill
      skiing and snowboarding are banned on the panoramic slopes of Ukko-Koli, Akka-Koli, and Paha-Koli.
      Cycling is allowed only on roadways, never along walking trails.
    around: >-
      Far to the south, [Aigüestortes i Estany de Sant Maurici National
      Park](/lugar/parc-nacional-d-aiguestortes-i-estany-de-sant-maurici/), the [Irati
      Forest](/lugar/foret-d-irati---selva-de-irati/), and the [Fuentes del Narcea, Degaña e Ibias Natural
      Park and Muniellos Reserve](/lugar/fuentes-del-narcea-degana-e-ibias---muniellos/) share with Koli
      mature boreal-temperate forests and specialist woodland fauna like the black woodpecker and
      capercaillie.
  fr:
    intro: >-
      L'Himalaya n'est pas aussi ancien que ces reliefs arrondis. Koli, au bord du lac Pielinen, est l'ultime
      vestige d'une cordillère soulevée il y a près de deux milliards d'années lors de la collision de deux
      plaques continentales plissant les montagnes caréliennes, dont l'altitude approchait celle de l'Himalaya
      contemporain. Après des ères d'érosion continue, seules subsistent des collines de quartzite induré,
      rabotées par les calottes glaciaires, au sein d'un parc national protégeant le plus ancien socle rocheux
      accessible de Finlande.
    landscape: >-
      Le point culminant est Ukko-Koli à 347 mètres, présentant un socle rocheux poli par les glaciers. Depuis
      sa cime s'ouvre sur le lac Pielinen le paysage national emblématique de Koli. L'alignement de crêtes
      chevauche la frontière entre deux provinces géologiques d'âges très contrastés : à l'est s'étend un
      gneiss granitique vieux de plus de deux milliards six cents millions d'années ; à l'ouest dominent des
      quartzites plus récents. Le Pielinen, quatrième lac de Finlande, déploie 93 kilomètres de longueur pour
      moins de dix mètres de profondeur moyenne.


      Sur cette roche affleurante s'épanouit une mosaïque de collines boisées, de forêts anciennes, de
      clairières herbacées luxuriantes et de prairies fleuries. Sur les pentes de l'Ipatti, le long du sentier
      Kaskenkierros, la forêt n'a subi aucune coupe depuis plus d'un siècle : épicéas et trembles imposants
      fournissent du bois mort indispensable aux coléoptères, mousses et lichens rares. Dans les ravins
      prospèrent des feuillus humides et fertiles garnis de fougères et d'orchidées, parcourus par le sentier
      Paimenenpolku. Les gardes y coupent les jeunes épicéas afin de préserver la clarté et d'éviter
      l'acidification.


      Enfin resplendissent les prairies patrimoniales. Les anciennes clairières défrichées par brûlis sont
      maintenues ouvertes par une fauche annuelle, où moutons, vaches et chevaux de race locale pâturent
      paisiblement.
    wildlife: >-
      Sur les eaux du lac, les oiseaux emblématiques sont le plongeon arctique et le rare goéland brun ; dans
      l'archipel de Koli, un [balbuzard pêcheur](/especie/pandion_haliaetus/) niche sur une plate-forme
      artificielle dédiée. Au tout début de l'été, les bois septentrionaux résonnent du chant du roselin
      cramoisi, du pouillot verdâtre et du gobe-mouche nain.


      Au cœur des forêts mixtes d'âge mûr, le visiteur attentif peut surprendre l'écureuil volant de Sibérie,
      inféodé aux vieux trembles creusés par les pics. L'abondance de lièvres variables attire le [lynx
      boréal](/especie/lynx_lynx/), tandis que les prés favorisent campagnols, martres des pins et hermines.
      Dans les mares forestières cohabitent le triton ponctué et le rare triton crêté. Dans le lac Pielinen,
      la variété dulcicole de saumon s'est éteinte durant les années 1960 suite aux barrages sur la rivière
      Lieksanjoki, suscitant des réintroductions actuelles à partir du lac Saimaa.


      Au printemps et en été les clairières s'émaillent de fleurs et de papillons. En hiver, les itinéraires
      ne bénéficient pas d'entretien mécanique, mais plusieurs sentiers restent damés par les raquettistes sur
      les crêtes.
    visit: >-
      Le parc compte environ 80 km d'itinéraires balisés, libres ou guidés. Le belvédère le plus célèbre
      couronne le sommet d'Ukko-Koli ; un sentier accessible exigeant de 0,8 km monte au promontoire depuis le
      centre d'accueil de la nature Ukko.


      Le sentier thématique de Kasken Kierros (4,1 km) serpente au milieu des paysages typiques de brûlis
      traditionnels, convenant parfaitement aux familles. Pour les randonneurs aguerris, le circuit du
      Herajärvenkierros (de 30 à 61 km) parcourt les crêtes boisées avec tente, abri ouvert ou refuge d'étape.
      À douze kilomètres au sud de Koli se dissimule Pirunkirkko, une faille rocheuse en Z longue de 33 mètres
      accessible depuis le lac Herajärvi par le sentier Kiehinen.
    history: >-
      Les premiers vestiges humains remontent à l'âge de la pierre, et la culture itinérante sur brûlis
      précéda les installations sédentaires, modifiant durablement la végétation. Les collines se peuplèrent
      durablement vers le milieu du XVIIIe siècle. Koli perpétue activement cette tradition : le brûlis
      agricole y est pratiqué périodiquement pour conserver les semences anciennes de seigle et de navet.


      Koli fut également la muse du romantisme national finlandais. Dans la faille sacrificielle
      d'Uhrihalkeama, protégée au titre des monuments historiques, les anfractuosités regorgent de pièces
      jetées au cours du dernier siècle. L'écrivain Juhani Aho, le peintre Eero Järnefelt et Jean Sibelius y
      séjournèrent : la quatrième symphonie de Sibelius s'inspira en partie de ces paysages, immortalisés
      aussi par la toile hivernale de Pekka Halonen. Le parc préserve aujourd'hui les crêtes et forêts les
      plus représentatives de Carélie du Nord.
    before: >-
      Les chiens doivent impérativement être tenus en laisse. Ne campez que sur les emplacements dédiés et
      n'allumez de feu que dans les foyers aménagés ; tout feu est strictement prohibé lors des alertes météo
      aux incendies de forêt. Il n'y a aucune poubelle : remportez la totalité de vos détritus. La cueillette
      de baies et de champignons comestibles est autorisée hors réserves intégrales, mais cueillir d'autres
      plantes est interdit. Le ski alpin et la planche à neige sont interdits sur les versants des belvédères
      d'Ukko-Koli, Akka-Koli et Paha-Koli. Le cyclisme est permis sur les routes carrossables, jamais sur les
      sentiers pédestres.
    around: >-
      Très loin d'ici, le [parc national d'Aigüestortes et lac
      Saint-Maurice](/lugar/parc-nacional-d-aiguestortes-i-estany-de-sant-maurici/), la [forêt
      d'Iraty](/lugar/foret-d-irati---selva-de-irati/) et le [parc naturel de Fuentes del Narcea, Degaña et
      Ibias et réserve de Muniellos](/lugar/fuentes-del-narcea-degana-e-ibias---muniellos/) partagent avec
      Koli de vénérables forêts boréo-montagnardes abritant le pic noir et le grand tétras.
  de:
    intro: >-
      Der Himalaya ist im Vergleich zu diesen Rundhöckern jung. Koli am Ufer des Pielinen-Sees ist der letzte
      Überrest eines Gebirges, das sich vor beinahe zwei Milliarden Jahren auftürmte, als zwei
      Kontinentalplatten kollidierten und die Kareliden auffalteten, die einst eine ähnliche Höhe wie der
      heutige Himalaya erreichten. Nach Jahrmillionen der Verwitterung blieben nur harte Quarzithügel übrig,
      vom Inlandeis blank geschliffen, in einem Nationalpark auf dem ältesten Felsgrund Finnlands.
    landscape: >-
      Der höchste Gipfel ist Ukko-Koli mit 347 Metern, dessen weißer Fels von den Gletschern glatt gehobelt
      wurde. Von seinem Aussichtspunkt eröffnet sich über den Pielinen die klassische Nationallandschaft von
      Koli. Der Höhenrücken markiert die Nahtstelle zweier geologischer Provinzen: Im Osten liegt Granitgneis,
      der über zwei Milliarden sechshundert Millionen Jahre alt ist; im Westen lagern jüngere
      Quarzitformationen. Der Pielinen, viertgrößter See Finnlands, erstreckt sich über 93 Kilometer Länge bei
      einer mittleren Tiefe von weniger als zehn Metern.


      Über dem Grundgestein wogt ein Mosaik aus bewaldeten Hügeln, Urwäldern, krautreichen Schluchtwäldern und
      bunten Wiesen. An den Hängen des Ipatti am Pfad Kaskenkierros steht der Wald seit über einem Jahrhundert
      unberührt: Riesige Fichten und Espen liefern Totholz für seltene Käfer, Moose und Pilze. In den
      Hangleiten gedeihen nährstoffreiche Laubmischwälder mit üppigen Hochstauden, Farnen und seltenen
      Orchideen, erschlossen über den Lehrpfad Paimenenpolku. Parkmitarbeiter entnehmen regelmäßig Fichten, um
      das Kronendach licht zu halten.


      Und da sind die Kulturwiesen. Die einstigen Brandrodungsflächen werden durch alljährliche Mahd
      offengehalten, beweidet von einheimischen Schafen, Kühen und Pferden alter Landrassen.
    wildlife: >-
      Auf dem See zählen Prachttaucher und die seltene Heringsmöwe zu den Leitarten; im Schärengarten von Koli
      brütet ein [Fischadler](/especie/pandion_haliaetus/) auf einer künstlichen Nisthilfe. Im Frühsommer
      erklingt in den Wäldern im Norden der Gesang von Blauschwanz, Grünlaubsänger und Zwergschnäpper.


      In alten Mischwaldbeständen kann ein aufmerksamer Wanderer das Gleithörnchen erspähen, das auf alte
      Espen mit Spechthöhlen angewiesen ist. Viele Schneeehasen ernähren den heimischen
      [Luchs](/especie/lynx_lynx/), während die Wiesenfluren Beute für Baummarder und Hermeline bieten. In
      Waldtümpeln leben Teichmolch und Kammmolch. Im Pielinen starb der Binnenlachs in den 1960er-Jahren
      infolge von Regulierungsbauten am Fluss Lieksanjoki aus; Auswilderungsprojekte versuchen ihn mit
      Saimaa-Lachsen wieder anzusiedeln.


      Im Frühling und Sommer stehen die Waldwiesen in voller Blüte. Im Winter werden die Wanderwege nicht
      geräumt, aber auf den Kämmen bilden Schneeschuhwanderer feste Spuren aus.
    visit: >-
      Rund 80 km markierte Pfade erschließen das Schutzgebiet auf eigene Faust oder geführt. Die berühmteste
      Aussicht bietet der Ukko-Koli; ein anspruchsvoller, barrierefreier Weg von 0,8 km Länge führt vom
      Naturzentrum Ukko hinauf zum Aussichtsfelsen.


      Der Naturlehrpfad Kasken Kierros (4,1 km) durchquert die typische Brandrodungsflur und eignet sich
      optimal für Familien. Für erfahrene Weitwanderer führt der Rundweg Herajärvenkierros (von 30 bis 61 km)
      durch bewaldete Felsrücken, mit Zeltplätzen, Schutzhütten und offenen Wildnishütten. Zwölf Kilometer
      südlich von Koli verbirgt sich Pirunkirkko, eine 33 Meter lange Z-förmige Felsspaltenhöhle, erreichbar
      vom See Herajärvi über den Kiehinen-Pfad.
    history: >-
      Erste Siedlungsspuren reichen in die Steinzeit zurück, und die Brandrodungswirtschaft prägte den Wald
      noch vor festen Siedlungen. Feste Höfe entstanden Mitte des achtzehnten Jahrhunderts. Koli führt diese
      Tradition fort: Alle paar Jahre wird eine Waldparzelle kontrolliert abgebrannt, um traditionelle
      Landsorten von Roggen und Rüben zu kultivieren.


      Koli war das Herzstück des finnischen Nationalromantizismus. In der Opferkluft Uhrihalkeama, einem
      gesetzlich geschützten Kultplatz, werfen Besucher seit über einem Jahrhundert Münzen in den Spalt. Der
      Schriftsteller Juhani Aho, der Maler Eero Järnefelt und Jean Sibelius weilten hier: Sibelius ließ sich
      bei seiner vierten Symphonie von Koli inspirieren, während Pekka Halonen das winterliche Meisterwerk
      schuf. Der Park schützt diese karelischen Höhenzüge dauerhaft.
    before: >-
      Hunde müssen ausnahmslos an der Leine geführt werden. Zelte ausschließlich auf ausgewiesenen Rastplätzen
      und entzünde Feuer nur an den offiziellen Feuerstellen; bei Waldbrandwarnungen gilt absolutes
      Feuerverbot. Es gibt keine Mülleimer im Park, nimm allen Abfall wieder mit. Das Sammeln von Beeren und
      Speisepilzen ist außerhalb von Kernzonen erlaubt, das Pflücken sonstiger Pflanzen untersagt. Skifahren
      und Snowboarden sind an den Aussichtshängen von Ukko-Koli, Akka-Koli und Paha-Koli verboten. Radfahren
      ist nur auf Straßen, nicht auf Fußwegen gestattet.
    around: >-
      Weit entfernt teilen der [Nationalpark Aigüestortes i Estany de Sant
      Maurici](/lugar/parc-nacional-d-aiguestortes-i-estany-de-sant-maurici/), der [Urwald von
      Irati](/lugar/foret-d-irati---selva-de-irati/) sowie der [Naturpark Fuentes del Narcea, Degaña e Ibias
      und das Muniellos-Reservat](/lugar/fuentes-del-narcea-degana-e-ibias---muniellos/) mit Koli alte Nadel-
      und Mischwaldbestände mit Schwarzspecht und Auerhuhn.
  it:
    intro: >-
      L'Himalaya è molto più giovane di queste colline arrotondate. Koli, affacciato sulle sponde del lago
      Pielinen, rappresenta l'ultimo relitto di una catena orogenetica sollevatasi quasi due miliardi di anni
      fa, quando la collisione tra due placche continentali corrugò le montagne careliane raggiungendo quote
      paragonabili all'odierno Himalaya. Dopo milioni di anni di inesorabile erosione, sopravvivono soltanto
      alture di durissima quarzite levigate dalle calotte glaciali, nel cuore di un parco nazionale che poggia
      sul basamento roccioso più antico della Finlandia.
    landscape: >-
      La quota sommitale appartiene a Ukko-Koli a 347 metri, con la roccia nuda finemente modellata dai
      ghiacciai. Dalla sua cima si schiude verso il lago Pielinen l'iconico paesaggio nazionale di Koli. La
      dorsale collinare sorge al confine tra due complessi geologici di età assai diversa: a est affiora uno
      gneiss granitico risalente a oltre due miliardi seicento milioni di anni fa; a ovest dominano quarziti
      proterozoiche più giovani. Il Pielinen, quarto lago per superficie della Finlandia, si estende per 93
      chilometri con una profondità media inferiore a dieci metri.


      Sopra questo basamento primordiale prospera una complessa trama di colline boscose, foreste vetuste,
      avvallamenti umidi e praterie colorate. Lungo i versanti di Ipatti, costeggiando il sentiero
      Kaskenkierros, il bosco non subisce abbattimenti da oltre un secolo: abeti monumentali e pioppi tremuli
      offrono legname marcescente vitale per coleotteri saproxilici, muschi e funghi rari. Nelle vallette
      fertili si sviluppano boschi misti ricchi di felci, erbe perenni e orchidee selvatiche, attraversati dal
      sentiero Paimenenpolku. I guardaparco rimuovono gli abeti per consentire alla luce di penetrare nel
      sottobosco.


      Spiccano infine i prati storici. Le antiche radure ricavate dal debbio agricolo vengono mantenute aperte
      tramite lo sfalcio annuale, mentre pecore, mucche e cavalli autoctoni pascolano negli habitat rurali
      tradizionali.
    wildlife: >-
      Sulle acque del lago le specie simbolo sono la strolaga mezzana e il raro zafferano; nell'arcipelago di
      Koli un [falco pescatore](/especie/pandion_haliaetus/) nidifica stabilmente su una piattaforma
      artificiale. All'inizio dell'estate, nei boschi settentrionali del parco risuonano i richiami del
      codazzurro, del luì verdastro e del pigliamosche pettirosso.


      Nelle foreste miste indisturbate, un osservatore attento può scorgere lo scoiattolo volante siberiano,
      legato alla presenza di pioppi maturi con cavità scavate dai picchi. Le numerose lepri bianche
      sostengono la popolazione residente della [lince europea](/especie/lynx_lynx/), mentre i prati aperti
      offrono prede a martore ed ermellini. Negli stagni acquitrinosi dimorano il tritone punteggiato e il
      raro tritone crestato. Nel Pielinen il salmone d'acqua dolce si estinse negli anni 1960 a causa degli
      sbarramenti fluviali sul Lieksanjoki; progetti conservazionistici tentano di ripristinarlo con ceppi del
      lago Saimaa.


      In primavera e in estate le radure si coprono di fioriture e farfalle. D'inverno i tracciati non vengono
      battuti meccanicamente, ma sulle creste si formano comode piste per racchette da neve.
    visit: >-
      Il parco racchiude circa 80 km di sentieri segnalati, percorribili in autonomia o con guide
      naturalistiche. Il panorama più celebre si ammira dalla sommità di Ukko-Koli; un sentiero accessibile ma
      ripido di 0,8 km sale alla terrazza panoramica partendo dal Centro visite Ukko.


      Il percorso didattico Kasken Kierros (4,1 km) attraversa i suggestivi paesaggi agricoli del debbio
      tradizionale ed è ideale per famiglie e scolaresche. Per gli escursionisti esperti, l'anello
      Herajärvenkierros (da 30 a 61 km) scavalca le creste boscose con piazzole per tende, tettoie aperte e
      rifugi d'appoggio. Dodici chilometri a sud di Koli si trova Pirunkirkko, una singolare caverna a fessura
      di 33 metri a forma di Z, raggiungibile dal lago Herajärvi lungo il sentiero Kiehinen.
    history: >-
      Le prime presenze umane risalgono all'Età della Pietra, e la pratica ancestrale del debbio precedette
      gli insediamenti stabili plasmandone la vegetazione. Le colline vennero colonizzate stabilmente alla
      metà del XVIII secolo. Koli custodisce ancora tale sapienza: a intervalli regolari viene incendiata una
      parcella di bosco per preservare le sementi rustiche di segale e rapa.


      Koli fu anche la musa del Romanticismo Nazionale finlandese. Nella spaccatura sacrificale di
      Uhrihalkeama, tutelata come bene archeologico, le rocce sono ricolme di monete votive gettate nel corso
      dell'ultimo secolo. Lo scrittore Juhani Aho, il pittore Eero Järnefelt e Jean Sibelius vi trovarono
      memorabili ispirazioni: la quarta sinfonia di Sibelius maturò in parte dopo il soggiorno a Koli, mentre
      Pekka Halonen ne dipinse la celebre veduta invernale. Il parco protegge perennemente queste alture della
      Carelia Settentrionale.
    before: >-
      I cani devono essere costantemente tenuti al guinzaglio. Campeggia unicamente nelle piazzole autorizzate
      e accendi fuochi solo nei focolari predisposti; in presenza di allerta incendi boschivi ogni fuoco è
      rigorosamente vietato. Non ci sono cestini dei rifiuti: riporta a valle qualsiasi residuo. La raccolta
      di frutti di bosco e funghi eduli è permessa eccetto nelle riserve integrali, mentre è proibito cogliere
      altre specie vegetali. Sci alpino e snowboard sono banditi sui pendii panoramici di Ukko-Koli, Akka-Koli
      e Paha-Koli. In bicicletta è consentito transitare solo sulle strade rotabili, mai sui sentieri
      escursionistici.
    around: >-
      Molto a sud, il [Parco nazionale di Aigüestortes e lago di Sant
      Maurici](/lugar/parc-nacional-d-aiguestortes-i-estany-de-sant-maurici/), la [Foresta di
      Irati](/lugar/foret-d-irati---selva-de-irati/) e il [Parco Naturale Fuentes del Narcea, Degaña e Ibias e
      Riserva di Muniellos](/lugar/fuentes-del-narcea-degana-e-ibias---muniellos/) condividono con Koli
      foreste vetuste boreo-alpine e specie forestali come il picchio nero e il gallo cedrone.
  pt:
    intro: >-
      Os Himalaias não são tão antigos como estas colinas erodidas. Koli, erguendo-se nas margens do lago
      Pielinen, é o derradeiro testemunho de uma cordilheira levantada há quase dois mil milhões de anos,
      quando duas placas continentais colidiram dobrando as montanhas carilianas, chegando a atingir altitudes
      semelhantes às dos Himalaias de hoje. Após eras de erosão contínua, restam apenas cristas de quartzito
      compacto, polidas pelas glaciações quaternárias, num parque nacional que pisa o substrato rochoso mais
      vetusto da Finlândia.
    landscape: >-
      O ponto mais elevado culmina em Ukko-Koli aos 347 metros, ostentando rocha nua modelada pelos glaciares.
      Do seu topo rasga-se sobre o Pielinen a paisagem nacional mais consagrada de Koli. A sucessão de relevos
      assenta no contacto geológico entre dois domínios temporais: a leste aflora gnaisse granítico com mais
      de dois mil e seiscentos milhões de anos; a oeste assentam quartzitos bem mais recentes. O Pielinen,
      quarto maior lago da Finlândia, mede 93 quilómetros de comprimento com menos de dez metros de
      profundidade média.


      Sobre este alicerce rochoso ondulam florestas maduras, bosques húmidos luxuriantes e prados rurais
      multicoloridos. Nas vertentes de Ipatti, ao longo do trilho Kaskenkierros, a mata permanece intocada sem
      cortes há mais de um século: abetos centenários e grandes álamos fornecem madeira morta imprescindível a
      escaravelhos xilófagos, musgos e fungos raros. Em ravinas abrigadas desdobram-se bosques de folhosas
      férteis com fetos e orquídeas selvagens, percorridos pelo trilho Paimenenpolku. Os guardas abatem abetos
      jovens para garantir insolação ao sub-bosque.


      Destacam-se ainda os prados culturais. As clareiras agrícolas abertas por queimadas tradicionais
      mantêm-se desprovidas de mato através de ceifas anuais, onde ovelhas, vacas e cavalos de raças
      autóctones pastam em harmonia.
    wildlife: >-
      Nas águas do lago as aves de referência são a mobelha-árctica e a rara gaivota-d'asa-escura; no
      arquipélago de Koli uma [águia-pesqueira](/especie/pandion_haliaetus/) nidifica num ninho artificial
      erguido pelo parque. No começo do verão, nas matas do norte ouvem-se os cantos límpidos do
      pintarroxo-de-cauda-azul, da felosa-esverdeada e do papa-moscas-pequeno.


      Nos bosques mistos vetustos, um olhar paciente pode deparar-se com o esquilo-voador-siberiano,
      dependente de velhos álamos furados por pica-paus. As abundantes lebres-variáveis alimentam o residente
      [lince-euroasiático](/especie/lynx_lynx/), enquanto os prados sustentam roedores para martas e arminhos.
      Em lagoachos florestais sobrevivem o tritão-comum e o raríssimo tritão-de-crista. No lago Pielinen, o
      salmão dulcícola extinguiu-se durante a década de 1960 devido a obras hidroelétricas no rio Lieksanjoki,
      existindo planos de recuperação com espécimes do lago Saimaa.


      Na primavera e no verão as clareiras transformam-se em tapetes floridos povoados por borboletas. No
      inverno os percursos não têm manutenção mecânica, mas abrem-se trilhos calcados para raquetes de neve
      nos cumes.
    visit: >-
      O parque oferece cerca de 80 km de trilhos balizados, realizáveis autonomamente ou com guias. A
      panorâmica mais célebre desfruta-se no cimo de Ukko-Koli; um trilho acessível de declive exigente com
      0,8 km sobe ao miradouro a partir do Centro de Natureza Ukko.


      O trilho interpretativo Kasken Kierros (4,1 km) percorre a paisagem tradicional de queimadas e
      pastoreio, revelando-se excelente para famílias. Para pedestrianistas experimentados, a grande rota de
      Herajärvenkierros (de 30 a 61 km) transpõe cristas rochosas arborizadas, com áreas de campismo, abrigos
      e cabanas de montanha. A doze quilómetros a sul de Koli esconde-se Pirunkirkko, uma fenda rochosa em Z
      de 33 metros de extensão, alcançada desde Herajärvi através do trilho Kiehinen.
    history: >-
      Os primeiros vestígios humanos remontam à Idade da Pedra, e as queimadas itinerantes precederam a
      fixação populacional definitiva, desenhando a fisionomia botânica. O povoamento permanente consolidou-se
      em meados do século XVIII. Koli mantém bem viva essa prática: em cada intervalo de poucos anos queima-se
      controladamente uma courela para perpetuar variedades agrícolas ancestrais de centeio e nabo.


      Koli foi também o berço do Romantismo Nacional finlandês. Na fenda cerimonial de Uhrihalkeama,
      classificada como sítio arqueológico, os recantos estão pejados de moedas arremessadas ao longo do
      último século. O escritor Juhani Aho, o pintor Eero Järnefelt e Jean Sibelius visitaram o lugar: crê-se
      que a quarta sinfonia de Sibelius brotou em parte desta travessia, tendo Pekka Halonen imortalizado a
      tela invernal de Koli. O parque protege de forma perpétua as cristas e florestas históricas da Carélia
      do Norte.
    before: >-
      Os cães devem caminhar sempre com trela. Acampa apenas nos locais autorizados e acende fogueiras
      exclusivamente nos fogareiros oficiais; sob alerta de risco de incêndio florestal é proibido fazer
      qualquer lume. Não existem caixotes do lixo: transporta todos os resíduos contigo. É autorizada a apanha
      de bagas e cogumelos comestíveis fora das reservas integrais, sendo interdito colher outras plantas. O
      esqui alpino e o snowboard são proibidos nas encostas viradas para os miradouros de Ukko-Koli, Akka-Koli
      e Paha-Koli. A circulação de bicicleta só é permitida em estradas, nunca nos trilhos pedonais.
    around: >-
      A grande distância, o [Parque Nacional de Aigüestortes e Lago de Sant
      Maurici](/lugar/parc-nacional-d-aiguestortes-i-estany-de-sant-maurici/), a [Selva de
      Irati](/lugar/foret-d-irati---selva-de-irati/) e o [Parque Natural Fuentes del Narcea, Degaña e Ibias e
      Reserva de Muniellos](/lugar/fuentes-del-narcea-degana-e-ibias---muniellos/) partilham com Koli matas
      maduras boreo-temperadas e espécies florestais como o pica-pau-preto e o tetraz.
