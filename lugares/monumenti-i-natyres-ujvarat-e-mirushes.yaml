resumen:
  es: Cañón calizo con una secuencia de 16 lagos y 12 cascadas escalonadas excavadas por el río Mirusha.
  en: Limestone canyon featuring a staircase of 16 lakes and 12 tiered waterfalls carved by the Mirusha River.
  fr: Canyon calcaire doté d'une enfilade de 16 lacs et de 12 cascades étagées façonnées par la rivière Mirusha.
  de: Kalksteinschlucht mit einer Kaskade aus 16 Seen und 12 gestuften Wasserfällen des Mirusha-Flusses.
  it: Canyon calcareo con una serie di 16 laghi e 12 cascate a gradoni scavate dal fiume Mirusha.
  pt: Canhão calcário com uma sequência de 16 lagoas e 12 cascatas em socalcos esculpidas pelo rio Mirusha.
unico:
  es: Dieciséis lagos encadenados por cascadas en un solo cañón, con cuevas a la orilla de varios de ellos.
  en: Sixteen lakes linked by cascading waterfalls in a single canyon, flanked by cliffside caves.
  fr: Seize lacs reliés par des cascades au fond d'un même canyon, bordés de grottes creusées dans la falaise.
  de: Sechzehn durch Wasserfälle verbundene Karseen in einer Schlucht, flankiert von Höhlen in den Felswänden.
  it: Sedici laghi collegati da cascate in un unico canyon, con grotte scavate lungo le pareti.
  pt: Dezasseis lagoas encadeadas por cascatas num único canhão, com grutas escavadas nas escarpas.
observaciones:
  es: >-
    Las rutas parten de la carretera Klina–Gjakova. Los lagos y las cuevas están en un entorno natural
    protegido: el informe nacional señala las construcciones ilegales y la falta de señales informativas como
    problemas. Cuida el entorno.
texto:
  es:
    intro: >-
      Un río pequeño, un cañón de unos 200 metros de profundidad y una escalera de dieciséis lagos que se
      descuelgan unos de otros por cascadas. Así es Mirusha, en el centro de Kosovo. El río Mirusha ha tallado
      en la caliza del Mesozoico un cañón en el que el agua baja de lago en lago, y el último, el más grande,
      es también el más fácil de alcanzar. El Gobierno de Kosovo lo declaró Monumento Natural de Especial
      Importancia en 2012, con 598,4 hectáreas.
    landscape: >-
      Hay doce cascadas y dieciséis lagos pequeños unidos entre sí. La más alta se encuentra entre el octavo y
      el noveno lago y mide veintiún metros. El cañón no es igual de ancho en todos sus tramos: es más ancho
      en el último lago y más estrecho en la zona del cuarto. El río nace al oeste de las montañas de
      Caraleva, y al final del cañón, tras el último lago, hay un manantial de agua kárstica junto a los
      acantilados.


      El relieve se completa con cuevas de formas y tamaños distintos: la de Dush, las de Great Church y Small
      Church y la del décimo lago. En el cañón hay también grietas y otras formas de roca modeladas por la
      erosión y otros agentes geológicos. Se puede recorrer un tramo de 180 metros en una de las cuevas.
    wildlife: >-
      Mirusha es un lugar de plantas. El inventario cuenta 330 especies de plantas vasculares y 44 de hongos
      superiores, y varias son endémicas: Aristolochia merxmuelleri y Stipa mayeri son plantas estenoendémicas
      del lugar. Los hábitats locales albergan también animales endémicos.


      Entre los mamíferos observados figuran el [lobo](/especie/canis_lupus/), el jabalí, el tejón, el [gato
      montés](/especie/felis_silvestris/) y la [marta](/especie/martes_martes/). En las cuevas viven
      murciélagos, y en la de Dushi se han registrado el [murciélago grande de
      herradura](/especie/rhinolophus_ferrumequinum/), Rh. blasii y el murciélago hortelano. El río está en
      buenas condiciones para anfibios y peces.
    visit: >-
      Las obras para abrir caminos hacia las cascadas partieron de la carretera Klina–Gjakova. En las cascadas
      inferiores los atractivos naturales son más accesibles para el visitante que en los tramos altos, que
      son escarpados. La cascada número trece, la mayor de Mirusha, es la más visitada.


      La agencia ambiental instaló paneles que explican la importancia ecológica, científica, estética e
      histórico-cultural de las cascadas.
    history: >-
      Las cascadas de Mirusha se declararon parque regional de naturaleza en 1982/83 y monumento natural en
      2012. Aun así, el informe nacional de la naturaleza constata varios problemas: falta un órgano de
      gestión, una financiación estable y señales informativas, y la ampliación de caminos ha dañado el
      paisaje y la vegetación. Abrir la carretera hasta cerca de los lagos permitió empezar construcciones
      ilegales. El informe pide crear un centro de información turística en el monumento y demoler esas
      construcciones.
    before: >-
      Las rutas parten de la carretera Klina–Gjakova. Los lagos y las cuevas están en un entorno natural
      protegido: el informe nacional señala las construcciones ilegales y la falta de señales informativas
      como problemas. Cuida el entorno.
    around: >-
      El [Parque Nacional de Bjeshkët e Nemuna](/lugar/parku-kombetar-bjeshket-e-nemuna/) queda a veinticuatro
      kilómetros.
  en:
    intro: >-
      A modest river, a canyon carved some 200 metres deep, and a descending flight of sixteen lakes linked by
      tiered waterfalls. This is Mirusha, in central Kosovo. The Mirusha River has incised a limestone gorge
      into Mesozoic bedrock where waters plunge from tarn to tarn, the final and largest pool being the
      easiest to reach. The Government of Kosovo designated it a Natural Monument of Special Importance in
      2012, encompassing 598.4 hectares.
    landscape: >-
      Twelve distinct waterfalls and sixteen small stepped lakes form this interconnected chain. The highest
      plunge drops twenty-one metres between the eighth and ninth lakes. The gorge varies in width: it
      broadens considerably around the final lake while constricting tightly at the fourth lake. Rising west
      of the Caraleva mountains, the river emerges from the canyon mouth beside sheer cliffs fed by cold karst
      springs.


      The limestone canyon is honeycombed with diverse caverns, including Dush Cave, Great Church and Small
      Church caves, and the cave beside the tenth lake. The canyon walls display erosion features and solution
      hollows sculpted by water and karst weathering. An underground passage of 180 metres can be explored
      inside one of these caves.
    wildlife: >-
      Mirusha is an exceptional botanical refuge. Botanical surveys document 330 species of vascular plants
      and 44 species of macrofungi, featuring rare endemics such as Aristolochia merxmuelleri and Stipa
      mayeri, which are stenoendemic to this specific limestone ravine. These undisturbed canyon niches also
      provide refuge for endemic invertebrates and cave dwellers.


      Recorded mammals include the [grey wolf](/especie/canis_lupus/), wild boar, European badger, [European
      wildcat](/especie/felis_silvestris/), and [European pine marten](/especie/martes_martes/). Caverns host
      maternity and hibernating bat colonies; within Dushi Cave, sightings include the [greater horseshoe
      bat](/especie/rhinolophus_ferrumequinum/), Blasius's horseshoe bat, and the serotine bat. The clean
      river waters support native amphibians and freshwater fish.
    visit: >-
      Access trails leading down to the waterfalls were opened from the main Klina–Gjakova highway. The lower
      waterfalls and pools are considerably easier for visitors to access than the upper cascade sectors,
      which involve steep scrambles along cliff ledges. Waterfall number thirteen, the largest cataract in
      Mirusha, attracts the highest number of visitors.


      Environmental agency panels along the trail explain the ecological, hydrological, aesthetic, and
      cultural significance of the gorge.
    history: >-
      The Mirusha waterfalls were originally declared a regional nature park in 1982/83 and designated a
      natural monument in 2012. Nevertheless, national conservation reports highlight operational challenges:
      the lack of a permanent management body, dedicated funding, and proper interpretive signage, alongside
      track expansion that impacted local vegetation. Opening road access close to the canyon sparked
      unauthorized building, which park advocates seek to remove alongside establishing a dedicated visitor
      information centre.
    before: >-
      Access paths branch off the Klina–Gjakova highway. The lakes and caves lie within a protected natural
      monument: national reports urge visitor caution regarding informal constructions and sparse signage.
      Please protect this fragile environment.
    around: >-
      [Bjeshkët e Nemuna National Park](/lugar/parku-kombetar-bjeshket-e-nemuna/) lies twenty-four kilometres
      away.
  fr:
    intro: >-
      Une modeste rivière, une gorge d'environ 200 mètres de profondeur et un escalier de seize lacs se
      déversant les uns dans les autres par des cascades. Tel est le site de Mirusha, au centre du Kosovo. La
      rivière Mirusha a entaillé les calcaires mésozoïques pour créer cette succession de vasques dont la
      dernière, la plus vaste, est aussi la plus facile d'accès. Le gouvernement du Kosovo l'a classé Monument
      naturel en 2012, sur 598,4 hectares.
    landscape: >-
      Douze cascades et seize petits lacs s'enchaînent dans ce défilé. La chute la plus haute s'élance de
      vingt et un mètres entre le huitième et le neuvième lac. Le canyon varie en largeur : resserré au niveau
      du quatrième lac, il s'évase nettement autour du dernier plan d'eau. Née à l'ouest des monts Caraleva,
      la rivière débouche au pied de falaises calcaires où jaillit une résurgence karstique.


      Le relief karstique s'enrichit de cavités variées : la grotte de Dush, celles de Great Church et Small
      Church et la cavité du dixième lac. Les parois rocheuses portent l'empreinte de l'érosion
      hydrogéologique. Il est possible d'explorer un tronçon de 180 mètres dans l'une de ces grottes.
    wildlife: >-
      Mirusha constitue un sanctuaire végétal remarquable. Les inventaires dénombrent 330 espèces de plantes
      vasculaires et 44 espèces de champignons supérieurs, avec de précieux endémiques : Aristolochia
      merxmuelleri et Stipa mayeri sont des plantes sténo-endémiques de cette gorge calcaire. Les biotopes
      préservés abritent également une faune cavernicole spécialisée.


      Parmi les mammifères observés figurent le [loup gris](/especie/canis_lupus/), le sanglier, le blaireau,
      le [chat sauvage](/especie/felis_silvestris/) et la [martre des pins](/especie/martes_martes/). Les
      grottes servent de refuge aux chauves-souris, notamment dans la cavité de Dushi avec le [grand
      rhinolophe](/especie/rhinolophus_ferrumequinum/), Rh. blasii et la sérotine commune. La rivière offre
      des eaux propices aux amphibiens et poissons.
    visit: >-
      Des voies d'accès ont été tracées depuis la route reliant Klina à Gjakova. Les cascades inférieures sont
      bien plus faciles d'accès pour les promeneurs que les gradins supérieurs, particulièrement escarpés. La
      cascade numéro treize, la plus spectaculaire de Mirusha, attire la majorité des visiteurs.


      Des panneaux de l'agence environnementale détaillent la valeur écologique, esthétique et géologique de
      ce monument naturel remarquable.
    history: >-
      Les cascades de Mirusha furent classées parc naturel régional en 1982/83 avant de devenir monument
      naturel en 2012. Le rapport national sur l'environnement souligne toutefois des défis de gestion :
      absence d'administration dédiée, financements fluctuants et signalétique sommaire. L'arrivée de pistes a
      favorisé des constructions illégales que les défenseurs du site souhaitent voir démolir au profit d'un
      centre d'accueil.
    before: >-
      Les accès partent de la route Klina–Gjakova. Les cascades forment un espace protégé vulnérable : le
      rapport national déplore quelques constructions non autorisées et le manque de panneaux. Respectez
      scrupuleusement la propreté du site.
    around: >-
      Le [parc national de Bjeshkët e Nemuna](/lugar/parku-kombetar-bjeshket-e-nemuna/) est situé à
      vingt-quatre kilomètres.
  de:
    intro: >-
      Ein kleiner Fluss, eine rund 200 Meter tiefe Schlucht und eine Treppe aus sechzehn Seen, die über
      Wasserfälle ineinanderfließen: Das sind die Mirusha-Wasserfälle in Zentralkosovo. Der Fluss hat eine
      Schlucht in mesozoischen Kalkstein gegraben, in der das Wasser von Becken zu Becken stürzt; der letzte
      und größte See ist am leichtesten erreichbar. Die kosovarische Regierung erklärte das Gebiet 2012 zum
      Naturdenkmal auf 598,4 Hektar.
    landscape: >-
      Zwölf Wasserfälle und sechzehn kleine Seen bilden diese zusammenhängende Kette. Der höchste Wasserfall
      stürzt mit einundzwanzig Metern zwischen dem achten und neunten See in die Tiefe. Die Schlucht variiert
      in der Breite: Beim vierten See verengt sie sich stark, beim letzten See weitet sie sich deutlich. Der
      Fluss entspringt westlich des Caraleva-Gebirges und tritt am Ausgang der Schlucht an steilen
      Felsabstürzen aus einer Karstquelle hervor.


      Die Karstlandschaft birgt Höhlen wie Dush, Great Church und Small Church sowie die Höhle am zehnten See.
      Das Wasser modellierte Auswaschungen und Felsformen. In einer der Höhlen kann ein Abschnitt von 180
      Metern begangen werden.
    wildlife: >-
      Mirusha ist ein bemerkenswerter Zufluchtsort für Pflanzen. Erhebungen zählen 330 Gefäßpflanzenarten und
      44 Großpilzarten; Aristolochia merxmuelleri und Stipa mayeri sind stenoendemische Raritäten dieses
      Canyons. Die geschützten Felshabitate beherbergen zudem spezialisierte Invertebraten.


      Unter den Säugetieren leben der [Wolf](/especie/canis_lupus/), das Wildschwein, der Dachs, die
      [Wildkatze](/especie/felis_silvestris/) und der [Baummarder](/especie/martes_martes/). In den Höhlen
      überwintern Fledermäuse; in der Dushi-Höhle wurden die [Große
      Hufeisennase](/especie/rhinolophus_ferrumequinum/), Rh. blasii und die Breitflügelfledermaus
      nachgewiesen. Der Fluss bietet Amphibien und Fischen sauberes Wasser.
    visit: >-
      Die Zugangswege zu den Wasserfällen zweigen von der Straße Klina–Gjakova ab. Die unteren Kaskaden sind
      wesentlich leichter erreichbar als die steilen oberen Abschnitte. Der Wasserfall Nummer dreizehn, der
      mächtigste des Mirusha-Laufs, zieht die meisten Besucher an.


      Infotafeln der Umweltbehörde erläutern die ökologische, hydrologische und geologische Bedeutung der
      Wasserfälle.
    history: >-
      Die Mirusha-Wasserfälle wurden 1982/83 zum regionalen Naturpark und 2012 zum geschützten Naturdenkmal
      erklärt. Berichte weisen jedoch auf Herausforderungen hin: Es fehlt an ständiger Verwaltung, stabiler
      Finanzierung und Beschilderung; neue Pisten zogen illegale Bauten nach sich, deren Rückbau zugunsten
      eines Informationszentrums gefordert wird.
    before: >-
      Die Pfade beginnen an der Straße Klina–Gjakova. Das Naturdenkmal ist ein empfindliches Ökosystem:
      Berichte erwähnen vereinzelte illegale Bauten und lückenhafte Schilder. Schütze die Natur.
    around: >-
      Der [Nationalpark Bjeshkët e Nemuna](/lugar/parku-kombetar-bjeshket-e-nemuna/) liegt vierundzwanzig
      Kilometer entfernt.
  it:
    intro: >-
      Un piccolo fiume, una forra profonda circa 200 metri e una scala di sedici laghetti che scivolano l'uno
      nell'altro attraverso spettacolari cascate. Questa è Mirusha, nel cuore del Kosovo. Il fiume Mirusha ha
      inciso i calcari mesozoici formando un canyon gradonato dove l'acqua passa di bacino in bacino; l'ultimo
      lago, il più grande, è anche il più facile da raggiungere. Nel 2012 il governo kosovaro lo ha proclamato
      Monumento Naturale su 598,4 ettari.
    landscape: >-
      Dodici cascate e sedici laghetti formano questa collana d'acqua. Il salto più alto misura ventuno metri
      tra l'ottavo e il nono lago. La gola muta ampiezza: strettissima presso il quarto lago, si allarga
      attorno all'ultimo specchio d'acqua. Nato a ovest dei monti Caraleva, il fiume esce dal canyon accanto a
      falesie rocciose alimentate da una copiosa risorgiva carsica.


      Il paesaggio include numerose cavità carsiche: la grotta di Dush, quelle di Great Church e Small Church
      e la grotta del decimo lago. L'erosione idrica ha modellato cavità e fessure. In una delle grotte è
      possibile percorrere un tratto sotterraneo di 180 metri.
    wildlife: >-
      Mirusha è un paradiso botanico. Le ricerche documentano 330 specie di piante vascolari e 44 specie di
      macromiceti; spiccano rari endemismi come Aristolochia merxmuelleri e Stipa mayeri, stenoendemismi di
      questa forra calcarea. Questi habitat isolati offrono rifugio a invertebrati rupicoli ed endemismi
      faunistici.


      Tra i mammiferi censiti figurano il [lupo](/especie/canis_lupus/), il cinghiale, il tasso, il [gatto
      selvatico](/especie/felis_silvestris/) e la [martora](/especie/martes_martes/). Le grotte ospitano
      colonie di chirotteri; nella cavità di Dushi sono presenti il [ferro di cavallo
      maggiore](/especie/rhinolophus_ferrumequinum/), Rh. blasii e il serotino comune. Le acque ospitano
      anfibi e pesci.
    visit: >-
      I sentieri d'accesso partono dalla direttrice Klina–Gjakova. I bacini inferiori risultano molto più
      accessibili rispetto alle cascate superiori, racchiuse da pareti ripide. La cascata numero tredici, la
      più imponente di Mirusha, è la più visitata e ammirata.


      Pannelli informativi dell'agenzia ambientale illustrano l'importanza ecologica, idrologica ed estetica
      del canyon.
    history: >-
      Le cascate di Mirusha vennero dichiarate parco naturale regionale nel 1982/83 e monumento naturale nel
      2012. I rapporti ambientali segnalano criticità nella gestione: carenza di personale dedicato, fondi
      discontinui e cartellonistica carente, con strade che hanno favorito costruzioni abusive di cui si
      auspica la demolizione per erigere un centro visite.
    before: >-
      I tracciati si staccano dalla statale Klina–Gjakova. I laghi e le forre ricadono in un'area naturale
      protetta: i rapporti segnalano costruzioni abusive e carenza di segnavia. Rispetta l'ambiente.
    around: >-
      Il [Parco Nazionale Bjeshkët e Nemuna](/lugar/parku-kombetar-bjeshket-e-nemuna/) sorge a ventiquattro
      chilometri di distanza.
  pt:
    intro: >-
      Um rio modesto, uma garganta com cerca de 200 metros de profundidade e uma escadaria de dezasseis lagoas
      interligadas por cascatas. Assim se apresenta Mirusha, no centro do Kosovo. O rio Mirusha escavou os
      calcários mesozoicos gerando um desfiladeiro onde as águas descem de lagoa em lagoa; a última, a mais
      extensa, é também a mais acessível. O Governo do Kosovo declarou o sítio Monumento Natural de
      Importância Especial em 2012, cobrindo 598,4 hectares.
    landscape: >-
      Doze cascatas e dezasseis lagoas formam esta cadeia fluvial. O salto mais alto atinge vinte e um metros
      entre a oitava e a nona lagoa. O canhão varia de largura: estreita no quarto lago e alarga na lagoa
      terminal. Nascendo a oeste dos montes Caraleva, o rio emerge do desfiladeiro junto a escarpas verticais
      onde brota uma nascente cárstica.


      A morfologia exibe diversas grutas: Dush, Great Church e Small Church e a caverna do décimo lago. As
      paredes rochosas ostentam formas de dissolução e fendas. É viável percorrer uma extensão subterrânea de
      180 metros numa das grutas.
    wildlife: >-
      Mirusha acolhe um património botânico notável. Os levantamentos inventariam 330 espécies de plantas
      vasculares e 44 de fungos superiores; salientam-se endemismos como Aristolochia merxmuelleri e Stipa
      mayeri, plantas estenoendémicas deste desfiladeiro calcário. Os biótopos abrigam também invertebrados
      cavernícolas.


      Entre os mamíferos registados contam-se o [lobo](/especie/canis_lupus/), o javali, o texugo, o
      [gato-bravo](/especie/felis_silvestris/) e a [marta](/especie/martes_martes/). Nas grutas abrigam-se
      colónias de morcegos; na gruta de Dushi foram assinalados o
      [morcego-de-ferradura-grande](/especie/rhinolophus_ferrumequinum/), Rh. blasii e o morcego-hortelão. As
      águas sustentam peixes e anfíbios.
    visit: >-
      Os trilhos de acesso partem da estrada que liga Klina a Gjakova. As cascatas e lagoas inferiores são
      bastante mais acessíveis do que os setores montantes, que exigem progressão por escarpas acentuadas. A
      cascata número treze, a mais imponente de Mirusha, é o ponto mais frequentado.


      Painéis da agência ambiental contextualizam a relevância ecológica, cénica e geológica deste monumento
      natural.
    history: >-
      As cascatas de Mirusha foram declaradas parque natural regional em 1982/83 e monumento natural em 2012.
      Os relatórios ambientais indicam todavia desafios de gestão: falta de organismo gestor próprio, verbas
      estáveis e sinalética, a par de pistas que facilitaram construções ilegais cuja demolição é reclamada
      para criar um posto de turismo.
    before: >-
      Os caminhos iniciam-se na estrada Klina–Gjakova. As lagoas integram um monumento natural protegido:
      relatórios apontam construções irregulares e escassez de sinalização. Preserva o ambiente.
    around: >-
      O [Parque Nacional de Bjeshkët e Nemuna](/lugar/parku-kombetar-bjeshket-e-nemuna/) localiza-se a vinte e
      quatro quilómetros.
