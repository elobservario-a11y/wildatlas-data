resumen:
  es: >-
    El corazón de los Alpes Albaneses (Prokletije), con cañones glaciares profundos, valles aislados y la
    torre de aislamiento de Theth.
  en: >-
    The heart of the Albanian Alps (Prokletije), featuring deep glacial canyons, isolated valleys, and the
    historic lock-in tower of Theth.
  fr: >-
    Le cœur des Alpes albanaises (Prokletije), avec de profondes gorges glaciaires, des vallées isolées et la
    tour de réclusion de Theth.
  de: >-
    Das Herz der Albanischen Alpen (Prokletije) mit tiefen eiszeitlichen Schluchten, abgeschiedenen Tälern und
    dem Wehrturm von Theth.
  it: >-
    Il cuore delle Alpi Albanesi (Prokletije), con profonde forre glaciali, valli appartate e la torre di
    reclusione di Theth.
  pt: >-
    O coração dos Alpes Albaneses (Prokletije), com desfiladeiros glaciares profundos, vales isolados e a
    torre de reclusão de Theth.
unico:
  es: >-
    Los glaciares dejaron aquí más huella que en ningún otro lugar de los Balcanes, y la caliza hizo el resto:
    cuevas, cañones y paredes.
  en: >-
    Glaciers carved deeper traces here than anywhere else in the Balkans, and limestone shaped the rest:
    caves, canyons, and sheer walls.
  fr: >-
    Les glaciers ont laissé ici plus de traces que partout ailleurs dans les Balkans, et le calcaire a façonné
    le reste : grottes, canyons et parois.
  de: >-
    Gletscher hinterließen hier tiefere Spuren als anderswo auf dem Balkan, und Kalkstein formte den Rest:
    Höhlen, Schluchten und Wände.
  it: >-
    I ghiacciai vi hanno impresso più tracce che in qualunque altro rilievo balcanico, e la roccia calcarea ha
    forgiato il resto: grotte, canyon e pareti.
  pt: >-
    Os glaciares deixaram aqui marcas mais profundas do que em qualquer outro ponto dos Balcãs, e o calcário
    moldou o resto: grutas, gargantas e escarpas.
observaciones:
  es: >-
    La agencia de áreas protegidas pide usar solo caminos y senderos designados y respetar las normas de
    conservación y visita. La ruta a Jezerca es muy exigente y solo se recomienda a personas con experiencia
    en montaña. En los senderos largos no hay fuentes de agua: llévala desde el inicio.
texto:
  es:
    intro: >-
      Theth está cercado por montañas de más de dos mil metros por los cuatro costados: Radohima al oeste,
      Arapi y Poplluka al norte, Jezerca al este. Es el corazón de un parque que desde 2022 une el valle de
      Theth, el valle de Valbona y la reserva estricta del río Gashi en una sola figura, el Parque Nacional de
      los Alpes Albaneses. Son 82.844,65 hectáreas de caliza, bosque y agua en el norte de Albania, junto a la
      frontera con Montenegro.
    landscape: >-
      Los Alpes Albaneses miden 64 km de largo y 60 de ancho, y la mayoría de las cumbres albanesas que pasan
      de los 2.000 m están aquí. La más alta, Jezerca, llega a 2.694 m. La roca es sobre todo caliza y
      dolomía, y el agua la ha trabajado de dos maneras: la ha disuelto por dentro, hasta abrir cuevas como la
      de Puci, de hasta 5 km, y la ha esculpido por fuera con el hielo. Después de los Alpes centroeuropeos,
      estas son las montañas más glaciadas de Europa al sur del casquete escandinavo, y en ningún otro lugar
      de los Balcanes dejaron los glaciares tanta huella de erosión. En el valle de Valbona, durante la
      glaciación de Würm, el hielo llegó a alargarse 9,5 km.


      El resultado se lee en el mapa. Hay cañones como el de Grunas, una pared sur del Arapi que se considera
      la mayor roca vertical de los Balcanes, unos treinta lagos glaciares agrupados en la sierra de Gashi, en
      Runicë y en el bloque de Jezerca, y ríos como el Shala, el Valbona, el Cem, el Kiri y el Gashi. La
      cascada de Grunas, en Theth, cae 30 m. Llueve y nieva mucho: estas montañas están entre las zonas más
      húmedas de Europa, con entre 2.000 y 2.500 mm al año.


      La vegetación se ordena en pisos, pero con una rareza. En Theth y en Valbona los pisos se invierten,
      porque el aire frío se acumula en el fondo del valle como en un lago. Los bosques cubren alrededor del
      36 % del parque. Entre los 900 y los 1.800 m manda el hayedo, que se mezcla con abeto blanco y pícea; y,
      más arriba, de 1.900 a 2.300 m, se abre el piso alpino de hierbas y arbustos, con enebro y sauce. Y como
      el territorio es tan aislado y tan fragmentado, aquí hay muchas plantas endémicas: Wulfenia baldaccii,
      Viola dukagjinica, Lilium albanicum, Gentianella albanica. Para Theth se calculan entre 1.500 y 1.650
      especies de plantas, 70 de ellas amenazadas.
    wildlife: >-
      Este es país de grandes mamíferos. Entre los protegidos y raros del parque están el
      [lince](/especie/lynx_lynx/), el [corzo](/especie/capreolus_capreolus/), el [oso
      pardo](/especie/ursus_arctos/), el [lobo](/especie/canis_lupus/) y el
      [rebeco](/especie/rupicapra_rupicapra/), que sube a las alturas, lejos de la actividad humana. El lince
      balcánico, muy amenazado, se concentra sobre todo en Theth, con unos 20 a 50 ejemplares, y la caza
      furtiva sigue siendo una amenaza. En los ríos alpinos vive la [nutria](/especie/lutra_lutra/), y entre
      los peces destaca la [trucha común](/especie/salmo_trutta/).


      Mira también al cielo y a la repisa de la roca. Entre las aves figuran el águila real, el
      [urogallo](/especie/tetrao_urogallus/), el [búho real](/especie/bubo_bubo/) y el águila imperial; en
      Valbona se han contado 145 especies, entre ellas el alimoche, el halcón borní y el halcón sacre. Entre
      los anfibios y reptiles comunes hay salamandra negra y [tritón alpino](/especie/triturus_alpestris/), y
      entre las serpientes, la víbora de cuernos.


      La mejor época para caminar va de junio a octubre.
    visit: >-
      Se llega a Theth por la carretera Shkodër–Theth, transitable para todo tipo de coches. De ahí salen los
      caminos.


      Para empezar, el sendero de Valbonë a Kukaj pasando por Bregu i rrethit: 5,4 km, fácil, desde los 950 m
      del pueblo hasta los 1.529 m, entre hayedos, bosques de coníferas y prados con plantas endémicas. En el
      camino no hay fuentes, así que sube con el agua que necesites. Más corta es la ruta de Valbonë a Kukaj y
      Maja e Rosit, de 2.542,59 m y unos 40 minutos, pero de dificultad alta.


      Y para quien tenga experiencia, el itinerario de Qafa e Pejës a Maja e Jezercës: 5 km por trayecto, unas
      dos horas y media, desde los 1.685 hasta los 2.664 m. Se llega por el camino de Theth a Vusanje, y en el
      trayecto aparece el Monumento Natural del circo de Gropa e Bukur de Jezerca. En Theth, un puente que
      construyó el proyecto Albanian Challenge conecta el pueblo con las cascadas de Grunas.
    history: >-
      Theth se protegió como parque nacional en 1966 y Valbona en 1996. En 2022 se juntaron, con la reserva de
      Gashi, en un parque único, y el río Gashi forma parte, además, del Patrimonio Mundial de los hayedos
      primarios de los Cárpatos y otras regiones de Europa.


      Los vecinos de Theth cuentan que se instalaron allí hace entre 300 y 350 años, para conservar su fe
      católica. Todavía queda una de las pocas torres de reclusión que sirvieron de refugio a las familias
      implicadas en venganzas de sangre. Hoy el pueblo se despuebla, y la mayoría de quienes siguen lo ocupan
      solo en verano. El Balkans Peace Park Project apuesta por un turismo sostenible y ha financiado el
      marcado de senderos, y está previsto un centro de información oficial junto al puente de Thethi.
    before: >-
      La agencia de áreas protegidas pide usar solo caminos y senderos designados y respetar las normas de
      conservación y visita. La ruta a Jezerca es muy exigente y solo se recomienda a personas con experiencia
      en montaña. En los senderos largos no hay fuentes de agua: llévala desde el inicio.
    around: >-
      Pegados a este parque, a apenas 1 km, están el [Parque Nacional de
      Prokletije](/lugar/nacionalni-park-prokletije-parku-kombetar-i/) y el [Parque Nacional Bjeshkët e
      Nemuna](/lugar/parku-kombetar-bjeshket-e-nemuna/). A unos 8 km queda el [Cañón del Río
      Morača](/lugar/kanjon-morace/) y a unos 11 el [Cañón del Río Cijevna](/lugar/kanjon-cijevine/) y la
      [Meseta Kárstica de Sinjajevina](/lugar/sinjajevina-karst-plateau/). La [Reserva Natural Estricta del
      Río Gashi](/lugar/rezervati-natyror-i-strazuar-lumi-i/) queda dentro del propio parque.
  en:
    intro: >-
      Theth is enclosed by mountains over two thousand metres on all four sides: Radohima to the west, Arapi
      and Poplluka to the north, Jezerca to the east. It is the heart of a park that since 2022 unites the
      Theth Valley, the Valbona Valley, and the Gashi River strict nature reserve under a single banner: the
      Albanian Alps National Park. It encompasses 82,844.65 hectares of limestone, forest, and water in
      northern Albania, along the border with Montenegro.
    landscape: >-
      The Albanian Alps measure 64 km long and 60 km wide, and most Albanian peaks rising above 2,000 m are
      concentrated here. The highest, Jezerca, reaches 2,694 m. The rock is predominantly limestone and
      dolomite, and water has worked it in two ways: dissolving it from within to create caves such as Puci,
      up to 5 km long, and sculpting it from outside with ice. After the Central European Alps, these are the
      most heavily glaciated mountains in Europe south of the Scandinavian ice sheet, and nowhere else in the
      Balkans did glaciers leave such extensive erosion marks. In the Valbona Valley during the Würm
      glaciation, ice extended up to 9.5 km.


      The result is clear on the map. There are gorges such as Grunas Canyon, the southern wall of Arapi
      considered the highest vertical rock face in the Balkans, around thirty glacial lakes clustered in the
      Gashi range, Runicë, and the Jezerca massif, and rivers like the Shala, Valbona, Cem, Kiri, and Gashi.
      The Grunas waterfall in Theth drops 30 m. Rain and snow are abundant: these mountains rank among the
      wettest places in Europe, receiving between 2,000 and 2,500 mm annually.


      Vegetation is layered into belts, but with a peculiarity. In Theth and Valbona the belts are inverted,
      as cold air settles in the valley bottom like a lake. Forests cover around 36 % of the park. Between 900
      and 1,800 m beech woodland dominates, mingled with silver fir and spruce; higher up, from 1,900 to 2,300
      m, an alpine belt of grasses and shrubs opens up, with juniper and willow. The terrain's extreme
      isolation and fragmentation have nurtured many endemic plants: Wulfenia baldaccii, Viola dukagjinica,
      Lilium albanicum, Gentianella albanica. For Theth alone, between 1,500 and 1,650 plant species are
      estimated, 70 of them threatened.
    wildlife: >-
      This is prime habitat for large mammals. Among the park's rare and protected residents are the [Eurasian
      lynx](/especie/lynx_lynx/), [roe deer](/especie/capreolus_capreolus/), [brown
      bear](/especie/ursus_arctos/), [grey wolf](/especie/canis_lupus/), and
      [chamois](/especie/rupicapra_rupicapra/), which heads up into the high crags far from human activity.
      The critically endangered Balkan lynx is concentrated mainly in Theth, with some 20 to 50 individuals,
      though poaching remains a persistent threat. In the alpine streams lives the [Eurasian
      otter](/especie/lutra_lutra/), and notable among fish is the [sea trout](/especie/salmo_trutta/).


      Look also to the skies and cliff ledges. Birds include the golden eagle, [western
      capercaillie](/especie/tetrao_urogallus/), [Eurasian eagle-owl](/especie/bubo_bubo/), and eastern
      imperial eagle; in Valbona 145 species have been recorded, including Egyptian vultures, lanner falcons,
      and saker falcons. Common amphibians and reptiles include the alpine salamander and [Alpine
      newt](/especie/triturus_alpestris/), while snakes include the horned viper.


      The best time for hiking runs from June to October.
    visit: >-
      You reach Theth via the Shkodër–Theth road, which is passable for all types of cars. Trails set out from
      there.


      To begin, the trail from Valbonë to Kukaj via Bregu i rrethit: 5.4 km, easy, rising from 950 m in the
      village to 1,529 m through beech woods, conifer forests, and meadows with endemic flora. There are no
      springs along the way, so carry all the water you need. Shorter is the route from Valbonë to Kukaj and
      Maja e Rosit, at 2,542.59 m and taking about 40 minutes, though difficult.


      For experienced hikers, the itinerary from Qafa e Pejës to Maja e Jezercës spans 5 km each way, taking
      about two and a half hours, ascending from 1,685 to 2,664 m. It follows the path from Theth to Vusanje,
      passing the Natural Monument of the Gropa e Bukur glacial cirque. In Theth, a footbridge built by the
      Albanian Challenge project links the village with the Grunas waterfalls.
    history: >-
      Theth was protected as a national park in 1966 and Valbona in 1996. In 2022 they were merged, alongside
      the Gashi reserve, into a single park; the Gashi River is also part of the UNESCO World Heritage
      primeval beech forests of the Carpathians and other regions of Europe.


      Residents of Theth trace their arrival back between 300 and 350 years, seeking to preserve their
      Catholic faith. One of the few historic lock-in towers that offered refuge to families caught in blood
      feuds still stands. Today the village suffers from depopulation, and most inhabitants remain only in
      summer. The Balkans Peace Park Project promotes sustainable tourism and has funded trail markings, and
      an official information centre is planned beside the Thethi bridge.
    before: >-
      The protected areas agency asks visitors to use only designated paths and respect conservation rules.
      The ascent of Jezerca is strenuous and recommended solely for experienced mountaineers. Long trails lack
      water sources: carry plenty from the start.
    around: >-
      Adjoining this park, just 1 km away, are [Parque Nacional de
      Prokletije](/lugar/nacionalni-park-prokletije-parku-kombetar-i/) and [Parque Nacional Bjeshkët e
      Nemuna](/lugar/parku-kombetar-bjeshket-e-nemuna/). About 8 km away lies [Cañón del Río
      Morača](/lugar/kanjon-morace/), and roughly 11 km away are [Cañón del Río
      Cijevna](/lugar/kanjon-cijevine/) and [Meseta Kárstica de
      Sinjajevina](/lugar/sinjajevina-karst-plateau/). The [Reserva Natural Estricta del Río
      Gashi](/lugar/rezervati-natyror-i-strazuar-lumi-i/) lies within the park itself.
  fr:
    intro: >-
      Theth est cerné de montagnes de plus de deux mille mètres sur ses quatre côtés : Radohima à l'ouest,
      Arapi et Poplluka au nord, Jezerca à l'est. C'est le cœur d'un parc qui réunit depuis 2022 la vallée de
      Theth, la vallée de Valbona et la réserve intégrale de la rivière Gashi sous une même entité : le parc
      national des Alpes albanaises. Ce sont 82 844,65 hectares de calcaire, de forêt et d'eau au nord de
      l'Albanie, le long de la frontière avec le Monténégro.
    landscape: >-
      Les Alpes albanaises mesurent 64 km de long et 60 de large, et la majorité des sommets albanais
      dépassant les 2 000 m sont rassemblés ici. Le plus élevé, le Jezerca, atteint 2 694 m. La roche se
      compose essentiellement de calcaire et de dolomie, façonnée par l'eau de deux manières : dissoute de
      l'intérieur jusqu'à creuser des grottes comme celle de Puci, longue de 5 km, et sculptée à l'extérieur
      par la glace. Après les Alpes d'Europe centrale, ce sont les montagnes les plus englacées d'Europe au
      sud du bouclier scandinave, et nulle part ailleurs dans les Balkans les glaciers n'ont laissé une telle
      empreinte d'érosion. Dans la vallée de Valbona, lors de la glaciation de Würm, les langues glaciaires
      ont atteint 9,5 km.


      Le relief se lit clairement sur la carte. On trouve des canyons comme celui de Grunas, une paroi sud de
      l'Arapi tenue pour la plus haute muraille rocheuse verticale des Balkans, une trentaine de lacs
      glaciaires groupés dans le massif de Gashi, à Runicë et sur le massif du Jezerca, et des rivières telles
      que la Shala, la Valbona, le Cem, le Kiri et le Gashi. La cascade de Grunas, à Theth, fait une chute de
      30 m. Il pleut et neige abondamment : ces cimes figurent parmi les zones les plus arrosées d'Europe,
      recevant entre 2 000 et 2 500 mm par an.


      La végétation s'étage en niveaux, avec une singularité remarquable. À Theth et à Valbona, les étages
      s'inversent car l'air froid stagne au fond de la vallée comme dans un lac. Les forêts couvrent environ
      36 % du parc. Entre 900 et 1 800 m règne la hêtraie, mêlée de sapin blanc et d'épicéa ; plus haut, de 1
      900 à 2 300 m, s'ouvre l'étage alpin d'herbacées et d'arbustes, avec genévrier et saule. Cet isolement
      prononcé a favorisé de nombreux endémismes : Wulfenia baldaccii, Viola dukagjinica, Lilium albanicum,
      Gentianella albanica. Pour Theth seul, on évalue entre 1 500 et 1 650 espèces végétales, dont 70
      menacées.
    wildlife: >-
      C'est un refuge pour les grands mammifères. Parmi les hôtes rares et protégés figurent le [lynx
      boréal](/especie/lynx_lynx/), le [chevreuil](/especie/capreolus_capreolus/), l'[ours
      brun](/especie/ursus_arctos/), le [loup](/especie/canis_lupus/) et le
      [chamois](/especie/rupicapra_rupicapra/), qui gagne les crêtes escarpées loin des hommes. Le lynx des
      Balkans, en danger critique, se concentre surtout à Theth avec environ 20 à 50 individus, le braconnage
      restant une menace. Dans les torrents d'altitude vit la [loutre d'Europe](/especie/lutra_lutra/), et
      parmi les poissons brille la [truite fario](/especie/salmo_trutta/).


      Regardez aussi vers le ciel et les falaises. Parmi les oiseaux figurent l'aigle royal, le [grand
      tétras](/especie/tetrao_urogallus/), le [hibou grand-duc](/especie/bubo_bubo/) et l'aigle impérial ; à
      Valbona, 145 espèces ont été recensées, dont le percnoptère, le faucon lanier et le faucon sacre. Parmi
      les amphibiens et reptiles communs se trouvent la salamandre noire et le [triton
      alpestre](/especie/triturus_alpestris/), et chez les serpents, la vipère ammodyte.


      La meilleure période pour randonner va de juin à octobre.
    visit: >-
      On accède à Theth par la route Shkodër–Theth, praticable pour toute voiture. De là partent les chemins.


      Pour débuter, l'itinéraire de Valbonë à Kukaj par Bregu i rrethit : 5,4 km, facile, montant de 950 m au
      village jusqu'à 1 529 m entre hêtraies, conifères et pelouses fleuries d'espèces endémiques. Il n'y a
      pas de sources en chemin, emportez donc toute l'eau nécessaire. Plus court mais raide, le sentier de
      Valbonë à Kukaj et Maja e Rosit culmine à 2 542,59 m en environ 40 minutes d'effort soutenu.


      Pour les marcheurs expérimentés, le trajet de Qafa e Pejës à Maja e Jezercës s'étend sur 5 km par sens,
      soit deux heures et demie, de 1 685 à 2 664 m. On l'aborde par le sentier Theth–Vusanje en longeant le
      monument naturel du cirque de Gropa e Bukur. À Theth, une passerelle construite par le projet Albanian
      Challenge relie le village aux cascades de Grunas.
    history: >-
      Theth a été protégé comme parc national en 1966 et Valbona en 1996. En 2022, ils ont été fusionnés avec
      la réserve de Gashi en un parc unique, la rivière Gashi étant inscrite au patrimoine mondial des forêts
      primaires de hêtres des Carpates et d'autres régions d'Europe.


      Les habitants de Theth racontent s'y être installés il y a entre 300 et 350 ans pour préserver leur foi
      catholique. Il subsiste l'une des rares tours de réclusion ayant servi de refuge lors des vendettas.
      Aujourd'hui le village se dépeuple et la plupart des résidents n'y séjournent qu'en été. Le Balkans
      Peace Park Project soutient l'écotourisme et a balisé des sentiers ; un centre officiel est prévu près
      du pont de Theth.
    before: >-
      L'organisme de gestion demande de n'emprunter que les itinéraires balisés et de respecter les règlements
      de conservation. L'ascension du Jezerca est très exigeante et réservée aux personnes chevronnées. Pas
      d'eau sur les longs sentiers : prévoyez vos gourdes dès le départ.
    around: >-
      Attenants à ce parc, à seulement 1 km, se trouvent le [Parque Nacional de
      Prokletije](/lugar/nacionalni-park-prokletije-parku-kombetar-i/) et le [Parque Nacional Bjeshkët e
      Nemuna](/lugar/parku-kombetar-bjeshket-e-nemuna/). À environ 8 km se dresse le [Cañón del Río
      Morača](/lugar/kanjon-morace/) et à environ 11 km le [Cañón del Río Cijevna](/lugar/kanjon-cijevine/) et
      la [Meseta Kárstica de Sinjajevina](/lugar/sinjajevina-karst-plateau/). La [Reserva Natural Estricta del
      Río Gashi](/lugar/rezervati-natyror-i-strazuar-lumi-i/) est comprise dans le parc.
  de:
    intro: >-
      Theth ist auf allen vier Seiten von über zweitausend Meter hohen Bergen umgeben: Radohima im Westen,
      Arapi und Poplluka im Norden, Jezerca im Osten. Es bildet das Herz eines Parks, der seit 2022 das
      Theth-Tal, das Valbonatal und das Totalreservat des Flusses Gashi zum Nationalpark Albanische Alpen
      vereint. Es sind 82.844,65 Hektar aus Kalkstein, Wald und Wasser im Norden Albaniens an der Grenze zu
      Montenegro.
    landscape: >-
      Die Albanischen Alpen sind 64 km lang und 60 km breit, und fast alle albanischen Gipfel über 2.000 m
      liegen hier. Der höchste, Jezerca, erreicht 2.694 m. Das Gestein besteht aus Kalk und Dolomit, vom
      Wasser auf zweierlei Weise geformt: im Inneren zu Höhlen wie der bis zu 5 km langen Puci-Höhle gelöst
      und außen vom Eis modelliert. Nach den Zentralalpen sind dies die am stärksten vergletscherten Berge
      Europas südlich des skandinavischen Inlandeises. Im Valbonatal erreichten die Gletscher der Würm-Eiszeit
      eine Länge von 9,5 km.


      Das Bild zeigt sich im Gelände: Schluchten wie der Grunas-Canyon, eine Südwand des Arapi als höchste
      Steilwand des Balkans, rund dreißig Gletscherseen in der Gashi-Kette, bei Runicë und am Jezerca sowie
      Gebirgsflüsse wie Shala, Valbona, Cem, Kiri und Gashi. Der Grunas-Wasserfall in Theth stürzt 30 m tief.
      Regen und Schnee fallen reichlich: Diese Berge zählen mit 2.000 bis 2.500 mm Jahresniederschlag zu den
      feuchtesten Europas.


      Die Vegetation gliedert sich in Höhenstufen, jedoch mit einer Umkehrung: In Theth und Valbona sammelt
      sich Kaltluft im Talboden wie in einem See. Wälder bedecken rund 36 % des Parks. Zwischen 900 und 1.800
      m dominieren Buchen mit Weißtanne und Fichte; darüber, von 1.900 bis 2.300 m, folgt die alpine
      Zwergstrauchstufe. Durch die Isolation gibt es viele Endemiten: Wulfenia baldaccii, Viola dukagjinica,
      Lilium albanicum, Gentianella albanica. Für Theth werden zwischen 1.500 und 1.650 Pflanzenarten
      geschätzt, 70 davon bedroht.
    wildlife: >-
      Das Gebiet ist ein Refugium großer Säugetiere. Zu den geschützten Arten zählen der [Eurasische
      Luchs](/especie/lynx_lynx/), das [Reh](/especie/capreolus_capreolus/), der
      [Braunbär](/especie/ursus_arctos/), der [Wolf](/especie/canis_lupus/) und die
      [Gämse](/especie/rupicapra_rupicapra/), die in unzugängliche Felsregionen flieht. Der Balkanluchs lebt
      vor allem um Theth mit 20 bis 50 Tieren, bedroht durch Wilderei. In Bergbächen lebt der [Eurasische
      Fischotter](/especie/lutra_lutra/), unter den Fischen die [Forelle](/especie/salmo_trutta/).


      Blicke auch zu den Felsbändern: Steinadler, [Auerhuhn](/especie/tetrao_urogallus/),
      [Uhu](/especie/bubo_bubo/) und Kaiseradler brüten hier; in Valbona wurden 145 Vogelarten erfasst,
      darunter Schmutzgeier, Lannerfalke und Würgfalke. Unter Amphibien und Reptilien leben Alpensalamander,
      [Bergmolch](/especie/triturus_alpestris/) und Hornotter.


      Die beste Wanderzeit ist von Juni bis Oktober.
    visit: >-
      Theth ist über die Straße Shkodra–Theth für alle Autos erreichbar. Dort beginnen die Wege.


      Für den Einstieg eignet sich der Weg von Valbonë nach Kukaj über Bregu i rrethit: 5,4 km, leicht, von
      950 m im Ort bis auf 1.529 m durch Buchen, Nadelhölzer und Wiesen. Quellen fehlen unterwegs, nimm Wasser
      mit. Kürzer und steil ist der Anstieg von Valbonë nach Kukaj und Maja e Rosit auf 2.542,59 m in rund 40
      Minuten.


      Für Erfahrene führt die Tour von Qafa e Pejës zur Maja e Jezercës über 5 km pro Strecke in rund
      zweieinhalb Stunden von 1.685 auf 2.664 m. Sie verläuft über den Theth-Vusanje-Pfad am Naturdenkmal des
      Zirkus Gropa e Bukur vorbei. In Theth verbindet eine Brücke das Dorf mit den Grunas-Fällen.
    history: >-
      Theth wurde 1966 als Nationalpark ausgewiesen, Valbona 1996. Im Jahr 2022 wurden sie mit dem
      Gashi-Reservat zu einem Park vereint; der Gashi gehört zum UNESCO-Welterbe der alten Buchenwälder
      Europas.


      Die Einwohner von Theth berichten, ihre Ahnen hätten sich vor 300 bis 350 Jahren hier angesiedelt, um
      ihren Glauben zu wahren. Ein Wehrturm der Blutrache steht noch heute. Heute schrumpft die Bevölkerung
      und Häuser werden meist nur im Sommer bewohnt. Das Balkans Peace Park Project fördert sanften Tourismus;
      eine Infostation ist an der Thethi-Brücke geplant.
    before: >-
      Die Parkverwaltung bittet darum, nur markierte Wege zu nutzen und Vorschriften einzuhalten. Die
      Jezerca-Route ist fordernd und erfordert alpine Erfahrung. Auf langen Wegen fehlen Quellen: Nimm
      Trinkwasser mit.
    around: >-
      Direkt benachbart, in nur 1 km Entfernung, liegen der [Parque Nacional de
      Prokletije](/lugar/nacionalni-park-prokletije-parku-kombetar-i/) und der [Parque Nacional Bjeshkët e
      Nemuna](/lugar/parku-kombetar-bjeshket-e-nemuna/). Rund 8 km entfernt liegt der [Cañón del Río
      Morača](/lugar/kanjon-morace/), rund 11 km entfernt liegen der [Cañón del Río
      Cijevna](/lugar/kanjon-cijevine/) und die [Meseta Kárstica de
      Sinjajevina](/lugar/sinjajevina-karst-plateau/). Die [Reserva Natural Estricta del Río
      Gashi](/lugar/rezervati-natyror-i-strazuar-lumi-i/) liegt im Park.
  it:
    intro: >-
      Theth è cinta su quattro lati da montagne di oltre duemila metri: Radohima a ovest, Arapi e Poplluka a
      nord, Jezerca a est. È il centro di un parco che dal 2022 unisce la valle di Theth, la valle di Valbona
      e la riserva integrale del fiume Gashi in un'unica area: il Parco Nazionale delle Alpi Albanesi.
      Comprende 82.844,65 ettari di calcare, boschi e acque nel nord dell'Albania, lungo il confine con il
      Montenegro.
    landscape: >-
      Le Alpi Albanesi si estendono per 64 km in lunghezza e 60 in larghezza, e quasi tutte le cime albanesi
      oltre i 2.000 m sorgono qui. La vetta culminante, la Jezerca, raggiunge 2.694 m. La roccia è calcarea e
      dolomitica, lavorata dall'acqua in due modi: scavata internamente in cavità come quella di Puci, lunga
      fino a 5 km, e incisa all'esterno dal ghiaccio. Dopo le Alpi dell'Europa centrale, sono le vette più
      glaciali d'Europa a sud della calotta scandinava. Nella valle di Valbona, durante la glaciazione di
      Würm, il ghiacciaio si spinse per 9,5 km.


      Il quadro emerge dalla mappa: orridi come il canyon di Grunas, la parete sud dell'Arapi considerata la
      maggiore parete verticale dei Balcani, una trentina di laghi glaciali nella catena di Gashi, a Runicë e
      sul blocco della Jezerca, e fiumi quali Shala, Valbona, Cem, Kiri e Gashi. La cascata di Grunas a Theth
      salta per 30 m. Piogge e nevi sono abbondanti: queste creste figurano tra le più piovose d'Europa, con
      apporti compresi tra 2.000 e 2.500 mm annui.


      La flora segue fasce altimetriche con una particolarità: a Theth e Valbona i piani vegetazionali si
      invertono per il ristagno di aria fredda sul fondovalle. Le foreste ricoprono circa il 36 % del parco.
      Tra 900 e 1.800 m domina il faggio con abete bianco e abete rosso; più in quota, da 1.900 a 2.300 m, si
      apre il piano alpino di brughiere con ginepro e salici nani. L'isolamento geologico conserva numerosi
      endemismi: Wulfenia baldaccii, Viola dukagjinica, Lilium albanicum, Gentianella albanica. Per la sola
      Theth si valutano tra 1.500 e 1.650 piante, 70 delle quali minacciate.
    wildlife: >-
      È il regno dei grandi mammiferi. Tra le specie protette e rare spiccano la [lince](/especie/lynx_lynx/),
      il [capriolo](/especie/capreolus_capreolus/), l'[orso bruno](/especie/ursus_arctos/), il [lupo
      grigio](/especie/canis_lupus/) e il [camoscio alpino](/especie/rupicapra_rupicapra/), che risale le
      pareti rocciose lontano dagli insediamenti. La lince balcanica, in pericolo critico, conta circa 20-50
      capi gravitanti su Theth, dove il bracconaggio resta un rischio. Nei torrenti nuota la [lontra
      europea](/especie/lutra_lutra/) e tra i pesci spicca la [trota atlantica](/especie/salmo_trutta/).


      Rivolgi lo sguardo anche alle falesie: vi nidificano aquila reale,
      [urogallo](/especie/tetrao_urogallus/), [gufo reale](/especie/bubo_bubo/) e aquila imperiale; a Valbona
      si contano 145 specie di volatili, compresi capovaccaio, lanario e falco sacro. Tra anfibi e rettili
      comuni si osservano salamandra nera, [tritone alpino](/especie/triturus_alpestris/) e vipera dal corno.


      Il periodo ideale per camminare va da giugno a ottobre.
    visit: >-
      Theth si raggiunge percorrendo la strada Shkodër–Theth, asfaltata e adatta a ogni autovettura. Da lì si
      snodano i sentieri.


      Per iniziare, la camminata da Valbonë a Kukaj via Bregu i rrethit: 5,4 km, facile, salendo dai 950 m del
      borgo fino a 1.529 m tra faggete, conifere e prati con endemismi. Lungo il cammino non ci sono fonti:
      parti con acqua sufficiente. Più corta ma ripida la salita da Valbonë a Kukaj e Maja e Rosit a 2.542,59
      m in circa 40 minuti di forte pendenza.


      Per gli escursionisti esperti, il percorso da Qafa e Pejës alla Maja e Jezercës copre 5 km per tratta in
      circa due ore e mezza, salendo da 1.685 a 2.664 m. Si percorre lungo il tracciato Theth–Vusanje lambendo
      il circo glaciale di Gropa e Bukur. A Theth, una passerella realizzata da Albanian Challenge unisce
      l'abitato alle cascate di Grunas.
    history: >-
      Theth è stato protetto come parco nazionale nel 1966 e Valbona nel 1996. Nel 2022 sono stati unificati
      assieme alla riserva del Gashi in un solo parco; il fiume Gashi appartiene inoltre alle antiche faggete
      europee del Patrimonio Mondiale UNESCO.


      Gli abitanti di Theth raccontano di essersi insediati qui tra 300 e 350 anni fa per mantenere la fede
      cattolica. Resta ancora in piedi una delle poche torri di reclusione che offrivano rifugio durante le
      faide di sangue. Oggi il borgo vive lo spopolamento e molti vi risiedono solo d'estate. Il Balkans Peace
      Park Project sostiene il turismo sostenibile e la segnaletica; un punto informativo è previsto al ponte
      di Thethi.
    before: >-
      L'ente parchi invita a seguire solo i percorsi segnati e a rispettare le regole di conservazione.
      L'itinerario per la Jezerca è arduo e richiede esperienza di alta montagna. Nei lunghi percorsi mancano
      sorgenti: porta con te adeguate riserve.
    around: >-
      Aderenti a questo parco, a solo 1 km, sorgono il [Parque Nacional de
      Prokletije](/lugar/nacionalni-park-prokletije-parku-kombetar-i/) e il [Parque Nacional Bjeshkët e
      Nemuna](/lugar/parku-kombetar-bjeshket-e-nemuna/). A circa 8 km si trova il [Cañón del Río
      Morača](/lugar/kanjon-morace/) e a circa 11 km il [Cañón del Río Cijevna](/lugar/kanjon-cijevine/) e la
      [Meseta Kárstica de Sinjajevina](/lugar/sinjajevina-karst-plateau/). La [Reserva Natural Estricta del
      Río Gashi](/lugar/rezervati-natyror-i-strazuar-lumi-i/) ricade all'interno del parco.
  pt:
    intro: >-
      Theth está cercado por montanhas de mais de dois mil metros nos quatro quadrantes: Radohima a oeste,
      Arapi e Poplluka a norte, Jezerca a leste. É o coração de um parque que desde 2022 une o vale de Theth,
      o vale de Valbona e a reserva integral do rio Gashi num único conjunto: o Parque Nacional dos Alpes
      Albaneses. São 82.844,65 hectares de calcário, floresta e água no norte da Albânia, junto à fronteira
      com Montenegro.
    landscape: >-
      Os Alpes Albaneses medem 64 km de comprimento e 60 de largura, concentrando a maioria das cimeiras
      albanesas acima dos 2.000 m. A mais elevada, Jezerca, atinge 2.694 m. A rocha é essencialmente calcário
      e dolomito, trabalhada pela água de duas formas: dissolvida interiormente em cavidades como a gruta de
      Puci, com até 5 km de extensão, e esculpida à superfície pelo gelo. A seguir aos Alpes centrais, são as
      montanhas mais glaciadas da Europa a sul da calota escandinava. No vale de Valbona, durante a glaciação
      de Würm, os glaciares atingiram 9,5 km de comprimento.


      O resultado destaca-se na cartografia: desfiladeiros como o de Grunas, a face sul do monte Arapi
      considerada a mais alta falésia vertical dos Balcãs, cerca de trinta lagos glaciares dispersos pela
      serra de Gashi, em Runicë e no maciço de Jezerca, além de rios como o Shala, o Valbona, o Cem, o Kiri e
      o Gashi. A cascata de Grunas, em Theth, precipita-se 30 m. A precipitação é abundante: estas serras
      contam-se entre as mais pluviosas da Europa, acumulando entre 2.000 e 2.500 mm anuais.


      A vegetação reparte-se por andares, mas com uma particularidade: em Theth e Valbona os andares
      invertem-se devido ao ar frio que se aloja no fundo do vale. As florestas ocupam cerca de 36 % do
      parque. Entre os 900 e os 1.800 m domina o faial misturado com abeto-branco e espruce; mais acima, dos
      1.900 aos 2.300 m, abre-se o andar alpino de matos com zimbro e salgueiro. O isolamento extremo deu
      origem a inúmeros endemismos: Wulfenia baldaccii, Viola dukagjinica, Lilium albanicum, Gentianella
      albanica. Só para Theth contabilizam-se entre 1.500 e 1.650 espécies de plantas, 70 das quais ameaçadas.
    wildlife: >-
      Este é território de grandes mamíferos. Entre as espécies protegidas e raras constam o
      [lince-euroasiático](/especie/lynx_lynx/), a [corça](/especie/capreolus_capreolus/), o
      [urso-pardo](/especie/ursus_arctos/), o [lobo-cinzento](/especie/canis_lupus/) e a
      [camurça](/especie/rupicapra_rupicapra/), que sobe às escarpas inacessíveis. O lince-dos-balcãs
      congrega-se em Theth com cerca de 20 a 50 exemplares, sendo a caça furtiva uma ameaça constante. Nas
      ribeiras alpinas habita a [lontra-europeia](/especie/lutra_lutra/) e entre os peixes destaca-se a
      [truta](/especie/salmo_trutta/).


      Repara também nas escarpas e no céu: avistam-se águias-reais, o
      [tetraz-grande](/especie/tetrao_urogallus/), o [bufo-real](/especie/bubo_bubo/) e a águia-imperial; em
      Valbona registaram-se 145 espécies de aves, incluindo o abutre-do-egito, o falcão-alfaneque e o
      falcão-sacre. A herpetofauna comum integra salamandra-negra,
      [tritão-alpino](/especie/triturus_alpestris/) e víbora-de-chifres.


      A melhor época para caminhar vai de junho a outubro.
    visit: >-
      Chega-se a Theth pela estrada Shkodër–Theth, transitável para qualquer automóvel. Dali partem os
      percursos.


      Para iniciar, o caminho de Valbonë a Kukaj via Bregu i rrethit: 5,4 km, acessível, subindo dos 950 m da
      povoação até aos 1.529 m entre faiais, coníferas e prados floridos com espécies endémicas. Não há fontes
      pelo caminho, pelo que deves levar a água necessária. Mais curto mas íngreme é o trilho de Valbonë a
      Kukaj e Maja e Rosit a 2.542,59 m em cerca de 40 minutos.


      Para caminhantes tarimbados, a subida de Qafa e Pejës a Maja e Jezercës cobre 5 km por sentido em cerca
      de duas horas e meia, subindo dos 1.685 aos 2.664 m. Segue o trilho Theth–Vusanje passando pelo
      Monumento Natural do circo de Gropa e Bukur. Em Theth, uma ponte do projeto Albanian Challenge liga o
      povoado às cascatas de Grunas.
    history: >-
      Theth foi protegido como parque nacional em 1966 e Valbona em 1996. Em 2022 foram fundidos com a reserva
      de Gashi num parque único, e o rio Gashi integra o Património Mundial da UNESCO das florestas primárias
      de faias da Europa.


      Os moradores de Theth contam ter-se fixado no vale há entre 300 e 350 anos para manter a sua fé
      católica. Subsiste uma das raras torres de reclusão que serviram de refúgio contra vinganças de sangue.
      Hoje a aldeia enfrenta o despovoamento e muitos só ali permanecem no verão. O Balkans Peace Park Project
      dinamiza o turismo sustentável e sinalizou trilhos; está previsto um posto oficial junto à ponte de
      Theth.
    before: >-
      A administração das áreas protegidas solicita a circulação apenas em trilhos sinalizados e o cumprimento
      das regras do parque. A rota para Jezerca é árdua e indicada apenas a quem tenha experiência de alta
      montanha. Nos percursos longos não há fontes: transporta água desde o início.
    around: >-
      Junto a este parque, a apenas 1 km, encontram-se o [Parque Nacional de
      Prokletije](/lugar/nacionalni-park-prokletije-parku-kombetar-i/) e o [Parque Nacional Bjeshkët e
      Nemuna](/lugar/parku-kombetar-bjeshket-e-nemuna/). A cerca de 8 km fica o [Cañón del Río
      Morača](/lugar/kanjon-morace/) e a cerca de 11 km situam-se o [Cañón del Río
      Cijevna](/lugar/kanjon-cijevine/) e o planalto [Meseta Kárstica de
      Sinjajevina](/lugar/sinjajevina-karst-plateau/). A [Reserva Natural Estricta del Río
      Gashi](/lugar/rezervati-natyror-i-strazuar-lumi-i/) está englobada no parque.
