resumen:
  es: >-
    Mosaico de praderas salinas, estepas pampásicas y bosques de ribera donde sobrevive la avutarda
    euroasiática en la Gran Llanura húngara.
  en: >-
    Mosaic of saline puszta grasslands, loess steppes, and riparian gallery forests harbouring Central
    Europe's premier great bustard stronghold.
  fr: >-
    Mosaïque de prairies salées, de steppes de loess et de forêts alluviales abritant le bastion central de la
    grande outarde.
  de: >-
    Mosaik aus Salzsteppen, Lössgrasfluren und Auwäldern mit dem wichtigsten zentraleuropäischen Vorkommen der
    Großtrappe.
  it: >-
    Mosaico di steppe saline, praterie di loess e foreste ripariali custode del principale nucleo di otarda
    comune dell'Europa centrale.
  pt: >-
    Mosaico de estepe salina, pastagens de loesse e florestas ripícolas que abriga o principal reduto de
    abetarda-comum da Europa Central.
unico:
  es: >-
    Un parque de islas verdes en un mar de campos donde, a la vez, bailan las avutardas, duermen decenas de
    miles de grullas y hasta pigargos se refugian en robledales viejos.
  en: >-
    An archipelago of wild islands within agricultural plains where displaying great bustards dance, tens of
    thousands of cranes roost, and white-tailed eagles winter.
  fr: >-
    Un archipel d'îlots sauvages au milieu des cultures où paradent les grandes outardes, dorment des dizaines
    de milliers de grues et hivernent les pygargues.
  de: >-
    Ein Archipel wilder Inseln inmitten weiter Agrarlandschaften, auf denen Großtrappen balzen, Zehntausende
    Kraniche rasten und Seeadler überwintern.
  it: >-
    Un arcipelago di oasi vergini tra le coltivazioni dove danzano le otarde, sostano decine di migliaia di
    gru e svernano le aquile di mare.
  pt: >-
    Um arquipélago de ilhas selvagens entre searas agrícolas onde cortejam abetardas, dormem dezenas de
    milhares de grous e invernam águias-rabalvas.
observaciones:
  es: >-
    El lago Blanco de Kardoskút y su entorno inmediato son zona de máxima protección: solo se entra con
    permiso. En las estepas de Dévaványa, las partes de máxima protección se visitan con acompañante o con
    permiso, sobre todo por especialistas.
texto:
  es:
    intro: >-
      En primavera, los viajeros que cruzaban las estepas de la cuenca de los Cárpatos veían de lejos unos
      puntos blancos que se movían sobre la hierba. Eran los machos de [avutarda](/especie/otis_tarda/) en
      plena danza de cortejo, la dürgés, una de las escenas más raras de la naturaleza europea. Hoy ya casi no
      se ve, pero aquí sí: el Parque Nacional Körös-Maros, en el sureste de Hungría, guarda la mayor población
      de avutarda de Europa central. Lo forman trece unidades dispersas por el sur de la Gran Llanura, entre
      estepas salinas, bosques de ribera y humedales, y es el parque nacional número siete de Hungría, creado
      el 16 de enero de 1997.
    landscape: >-
      Aquí todo es llano: el parque no pasa de los 100 metros de altitud y tiene el clima más cálido y seco de
      Hungría. Lo modelaron dos ríos que nacen en los Cárpatos, el Körös y el Maros, y siguen siendo los
      corredores por los que llegan las plantas y los animales.


      Desde mediados del siglo XIX la regulación de los ríos cambió el país entero, y de aquel paisaje de
      marismas solo quedaron fragmentos. Por eso el parque es un archipiélago. En las riberas quedan bosques
      de galería y prados húmedos; en las estepas, suelos salinos de relieve variado; y entre medias, restos
      de las antiguas marismas y manchas de estepa de loess. Las plantas de las estepas salinas y de loess
      recuerdan a las del este, como Adonis volgensis y Salvia nutans, y los animales de mayor valor para la
      conservación son también orientales y meridionales.


      Cada unidad tiene su carácter. En las estepas de Dévaványa, el Hortobágy-Berettyó conserva unos 33
      kilómetros sin cortar sus meandros y serpentea despacio por su cauce antiguo. El lago Blanco de
      Kardoskút es un lago temporal: se llena de una lámina somera en primavera y se seca a mediados o finales
      del verano. En el Kis-Sárrét, las crecidas del Sebes-Körös crearon una vasta tierra de agua entre
      Körösnagyharsány y Vésztő; en 1990 se protegieron allí 7899 hectáreas. En la llanura del Hármas-Körös
      hay prados de inundación, y el Maros es, de los afluentes del Tisza, el de mayor caída, caudal y carga
      de sedimentos.
    wildlife: >-
      Aquí el calendario lo marcan las aves.


      En primavera cortejan las avutardas, y cerca del centro de visitantes de Dévaványa se las puede conocer
      en cualquier época del año. El [cernícalo patirrojo](/especie/falco_vespertinus/) cría en el lago Blanco
      de Kardoskút, y el parque guarda otras dos rapaces amenazadas en todo el mundo, el [águila imperial
      oriental](/especie/aquila_heliaca/) y el [halcón sacre](/especie/falco_cherrug/). También crían allí la
      avoceta, el chorlitejo patinegro, la cigüeñuela, la aguja colinegra, el archibebe común y el guión de
      codornices.


      En otoño llega el espectáculo grande. A finales de octubre pueden pasar la noche hasta ochenta mil aves
      en el agua somera del lago de Kardoskút, y la entrada de las [grullas](/especie/grus_grus/) al anochecer
      es un espectáculo. Decenas de miles de aves acuáticas y limícolas descansan en las zonas húmedas en
      primavera y otoño, sobre todo en el lago Blanco, en los estanques de Biharugra y en Montág-puszta. En
      los robledales viejos de Kis-Sárrét duermen los [pigargos](/especie/haliaeetus_albicilla/) que invernan
      junto a los estanques. A finales de verano y principios de otoño, sobre las estepas de Csanád se ven con
      regularidad culebreras, ratoneros moros, águilas pomerinas y aguiluchos cenizo y papialbo.


      En los carrizales de Ugrai-rét y Sző-rét crían la [espátula](/especie/platalea_leucorodia/), la garcilla
      cangrejera y el morito común, y viven el [galápago europeo](/especie/emys_orbicularis/) y la rana
      campestre. En la llanura del Hármas-Körös cría la mayor población de [guión de
      codornices](/especie/crex_crex/) del parque, y los bosques de ribera acogen la [cigüeña
      negra](/especie/ciconia_nigra/) y el pigargo. Aquí está también la mayor colonia conocida de Europa del
      murciélago de estanques, y la [nutria](/especie/lutra_lutra/) encuentra refugio seguro en la llanura de
      inundación.
    visit: >-
      El parque se recorre por unidades. El sendero de Réhely sale y vuelve al centro de visitantes de la
      avutarda Sterbetz István, en Dévaványa, y se hace a pie en una hora; desde ese mismo centro hay rutas de
      bicicleta marcadas por las estepas, y allí se alquilan bicicletas.


      En el Kis-Sárrét, el sendero de Sző-rét mide cerca de dos kilómetros y sale y vuelve al Refugio de Aves
      de Bihar. En el valle del Körös, el sendero de Halásztelek presenta en diez paneles la flora, la fauna y
      la historia de la llanura de inundación del Hármas-Körös, y el sendero acuático del Martín Pescador solo
      se alcanza en canoa o barca: ocho boyas flotantes explican un kilómetro del brazo muerto Holt-Körös.


      En el valle del Maros, el sendero de Bökény recorre unos 7 km de la llanura inundable, pasa por el
      túmulo de Bekai, de 8 m, el dique, praderas antiguas y bosques, y se hace en dos horas a paso tranquilo.
      En la estepa de Kígyós, otra opción es un sendero de 5 km con siete estaciones que se recorre en dos
      horas.


      En Kardoskút, el Museo de la Migración de las Aves explica la migración, la flora y la fauna de la zona
      y las dos especies emblemáticas del lago, el cernícalo patirrojo y la grulla; dos torres de observación
      ayudan a ver las aves. En Csanád, la lámina de agua de Nagy-Zsombék luce más en primavera y a finales de
      otoño y se observa desde una torre mirador entre Tótkomlós y Makó-Rákos.
    history: >-
      Los túmulos son el patrimonio cultural más importante del parque; se estimaban en cuarenta mil en la
      cuenca de los Cárpatos. En la unidad de Mágor-puszta se conservan las ruinas de un monasterio de los
      siglos XI y XII, del linaje Csolt, primeros propietarios del condado de Békés.


      La protección de la avutarda es un trabajo con los agricultores: consiste en ordenar las labores del
      campo en el tiempo y en el espacio para que no pongan en peligro las puestas. La estepa de Csanád, de
      4057 hectáreas, está protegida desde 1989. El lago Blanco de Kardoskút, los estanques de Biharugra y
      Montág-puszta figuran entre los humedales de importancia internacional. Una tarea destacada del parque
      es mantener las poblaciones de erdélyi hérics y de bókoló zsálya, que en Hungría solo crecen aquí.
    before: >-
      El lago Blanco de Kardoskút y su entorno inmediato son zona de máxima protección: solo se entra con
      permiso. En las estepas de Dévaványa, las partes de máxima protección se visitan con acompañante o con
      permiso, sobre todo por especialistas.
    around: >-
      El parque se solapa con la llanura de [Dévaványa](/lugar/koros-maros-nemzeti-park---devavanyai/), una de
      sus unidades. Más lejos, otras estepas comparten especies con el Körös-Maros: [Munţii
      Măcinului](/lugar/parcul-national-muntii-macinului/) el águila imperial oriental, el halcón sacre y el
      [suslik](/especie/spermophilus_citellus/); [Bükk](/lugar/bukki-nemzeti-park/), las dos rapaces; y
      [Podișul Casimcea](/lugar/podisul-casimcea---podisul-dobrogean/) y [Deliblatska
      peščara](/lugar/specijalni-rezervat-prirode-deliblatska/), el suslik y el halcón sacre.
  en:
    intro: >-
      In springtime, travellers crossing the vast plains of the Carpathian Basin would spot pale white specks
      moving rhythmically above the grass. These were male [great bustards](/especie/otis_tarda/) performing
      their spectacular mating display, the dürgés, one of the rarest spectacles in European wildlife. Today,
      this ancient ritual has largely vanished across the continent, yet here it endures: Körös-Maros National
      Park in southeastern Hungary preserves the largest great bustard population in Central Europe.
      Comprising thirteen separate units scattered across the southern Puszta among saline grasslands,
      floodplain woodlands, and oxbow marshes, it was designated as Hungary's national park number seven on 16
      January 1997.
    landscape: >-
      The terrain is strikingly level: nowhere does the park exceed 100 metres in altitude, basking in
      Hungary's warmest and driest continental microclimate. The entire landscape was carved by two Carpathian
      rivers, the Körös and the Maros, which continue to function as vital ecological corridors for flora and
      fauna.


      From the mid-nineteenth century, systematic river canalisation transformed the countryside, leaving only
      disjointed remnants of once-limitless marshes. Thus the national park exists today as an ecological
      archipelago. Riparian corridors retain gallery forests and wet meadows; the steppes harbour mosaic
      solonetz and solonchak soils; while between them lie relic loess grasslands and marshy sinkholes. Rare
      flora of the saline and loess plains shows strong eastern affinities, featuring Adonis volgensis and
      nodding sage (Salvia nutans), matched by rare pontic-pannonian fauna.


      Each territorial unit possesses a distinct character. In the Dévaványa steppes, the Hortobágy-Berettyó
      meanders freely along roughly 33 kilometres of unstraightened riverbed. Lake Fehér at Kardoskút is a
      soda lake that fills with shallow water each spring before evaporating by mid or late summer. In the
      Kis-Sárrét, historic floodings of the Sebes-Körös created extensive wetlands between Körösnagyharsány
      and Vésztő, where 7899 hectares gained protection in 1990. The Hármas-Körös floodplain shelters lush
      meadows, while the Maros ranks as the swiftest and most sediment-laden tributary of the Tisza.
    wildlife: >-
      Bird migration and breeding cycles govern the seasonal rhythm of the park.


      Spring witnesses the grand courtship of great bustards, which can also be observed year-round at the
      Dévaványa visitor centre. The colonial [red-footed falcon](/especie/falco_vespertinus/) breeds around
      Lake Fehér in Kardoskút, while the park safeguards two globally threatened apex raptors: the [eastern
      imperial eagle](/especie/aquila_heliaca/) and the [saker falcon](/especie/falco_cherrug/). Avocets,
      Kentish plovers, black-winged stilts, black-tailed godwits, and common redshanks breed on the muds,
      alongside elusive corncrakes in wet meadows.


      Autumn unfurls an overwhelming migration spectacle. By late October, up to eighty thousand birds roost
      simultaneously on the shallow expanse of Kardoskút, heralded by the clamorous twilight arrival of
      [common cranes](/especie/grus_grus/). Tens of thousands of dabbling ducks, wild geese, and waders stage
      across the wetlands during migration, especially at Lake Fehér, the Biharugra fishponds, and
      Montág-puszta. In old oak groves of Kis-Sárrét, wintering [white-tailed
      eagles](/especie/haliaeetus_albicilla/) roost by the fishponds. In late summer, short-toed snake eagles,
      long-legged buzzards, lesser spotted eagles, and Montagu's harriers hunt over Csanád steppes.


      Reedbeds at Ugrai-rét and Sző-rét host breeding [Eurasian spoonbills](/especie/platalea_leucorodia/),
      squacco herons, and glossy ibises, alongside [European pond turtles](/especie/emys_orbicularis/) and
      moor frogs. The Hármas-Körös floodplains support Hungary's densest concentration of the
      [corncrake](/especie/crex_crex/), while riverine forests shelter nesting [black
      storks](/especie/ciconia_nigra/) and eagles. The area also conceals Europe's largest known nursery roost
      of pond bats, with [Eurasian otters](/especie/lutra_lutra/) thriving throughout the river network.
    visit: >-
      Exploration is organised by independent units. The Réhely interpretive trail begins and ends at the
      Sterbetz István Great Bustard Visitor Centre in Dévaványa, completing a gentle circuit on foot in one
      hour; marked cycling routes across the open steppes also start from the centre, with bike rentals
      available on site.


      In Kis-Sárrét, the Sző-rét trail extends for nearly two kilometres, starting and ending at the Bihar
      Bird Shelter. Along the Körös valley, the Halásztelek trail features ten interpretive panels explaining
      the wildlife and heritage of the Hármas-Körös floodplain, while the Kingfisher water trail is accessible
      solely by canoe or small rowboat, where eight floating buoys interpret a one-kilometre reach of the
      Holt-Körös oxbow.


      In the Maros valley, the Bökény trail covers some 7 km of floodplain landscape, leading past the 8 m
      Bekai kurgan mound, flood dykes, meadows, and gallery forests, walkable in two hours at a leisurely
      pace. On the Kígyós steppe, another 5 km trail with seven thematic stops takes two hours.


      At Kardoskút, the Museum of Bird Migration details local ecology and two flagship wetland species, the
      red-footed falcon and crane, with two elevated observation towers facilitating birdwatching. In Csanád,
      the Nagy-Zsombék wetland shines during spring and late autumn, observed from a public watchtower between
      Tótkomlós and Makó-Rákos.
    history: >-
      Ancient earthen burial mounds, or kurgans, constitute the most significant prehistoric cultural heritage
      in the park, with an estimated forty thousand once scattered across the Carpathian Basin. In the
      Mágor-puszta unit, archaeological excavations have preserved the monastic ruins of the Csolt clan from
      the eleventh and twelfth centuries, early feudal rulers of Békés County.


      Great bustard conservation requires close cooperation with local farmers, synchronising mowing and
      harvesting calendars to avoid destroying ground clutches. The 4057-hectare Csanád steppe has enjoyed
      legal protection since 1989. Lake Fehér at Kardoskút, the Biharugra ponds, and Montág-puszta are
      registered under the Ramsar Convention. A core botanical mission focuses on sustaining wild populations
      of Transylvanian pheasant's eye and nodding sage, which in Hungary grow nowhere else.
    before: >-
      Lake Fehér at Kardoskút and its surrounding buffer zone are strictly protected nature reserves
      accessible only with advance written permits. Across the Dévaványa steppes, core sanctuaries require
      official park accompaniment or research authorization.
    around: >-
      The park incorporates the [Dévaványa Plain](/lugar/koros-maros-nemzeti-park---devavanyai/) as one of its
      flagship sectors. Across the wider region, other steppes share rare wildlife with Körös-Maros: [Măcin
      Mountains](/lugar/parcul-national-muntii-macinului/) shares imperial eagles, saker falcons, and
      [European ground squirrels](/especie/spermophilus_citellus/); [Bükk National
      Park](/lugar/bukki-nemzeti-park/) shares the two apex raptors; while [Casimcea
      Plateau](/lugar/podisul-casimcea---podisul-dobrogean/) and [Deliblato
      Sands](/lugar/specijalni-rezervat-prirode-deliblatska/) also support ground squirrels and sakers.
  fr:
    intro: >-
      Au printemps, les voyageurs traversant les steppes du bassin des Carpates apercevaient de loin des
      taches blanches mouvantes sur l'herbe. C'étaient les mâles de [grande outarde](/especie/otis_tarda/) en
      pleine danse nuptiale, la dürgés, l'un des spectacles les plus rares de la faune européenne. Aujourd'hui
      rarissime sur le continent, cette parade survit ici : le parc national de Körös-Maros, dans le sud-est
      de la Hongrie, abrite la plus importante population de grandes outardes d'Europe centrale. Il rassemble
      treize unités disjointes réparties dans le sud de la Grande Plaine entre steppes salées, forêts galeries
      et marais, constituant le parc national numéro sept de Hongrie, créé le 16 janvier 1997.
    landscape: >-
      Ici tout est horizontal : le parc ne dépasse nulle part 100 mètres d'altitude et bénéficie du climat le
      plus chaud et sec de Hongrie. Il a été façonné par deux rivières nées dans les Carpates, le Körös et le
      Maros, qui demeurent les corridors écologiques majeurs de la flore et de la faune.


      À partir du milieu du XIXe siècle, les grands travaux d'endiguement ont bouleversé le pays, ne laissant
      que des lambeaux de marais. C'est pourquoi le parc prend la forme d'un archipel. Sur les berges
      subsistent forêts alluviales et prairies inondables ; dans les steppes s'étendent des sols salés variés
      ; et au milieu alternent bras morts et buttes de loess. La flore des steppes salines et de loess évoque
      l'Orient, à l'image d'Adonis volgensis et de Salvia nutans, tout comme la faune d'intérêt communautaire.


      Chaque unité possède son identité propre. Dans les steppes de Dévaványa, le cours du Hortobágy-Berettyó
      conserve environ 33 kilomètres de méandres naturels préservés. Le lac Blanc de Kardoskút est une lagune
      temporaire qui s'emplit d'eau au printemps avant de s'assécher au cœur de l'été. Dans le Kis-Sárrét, les
      crues du Sebes-Körös créèrent jadis une immense zone inondable entre Körösnagyharsány et Vésztő ; 7899
      hectares y furent protégés en 1990. La plaine du Hármas-Körös abrite de vastes prairies d'inondation,
      tandis que le Maros est le tributaire le plus impétueux et chargé d'alluvions de la Tisza.
    wildlife: >-
      Les saisons sont dictées par l'avifaune.


      Au printemps débute la parade des outardes, observables toute l'année au centre de Dévaványa. Le [faucon
      kobez](/especie/falco_vespertinus/) niche au lac Blanc de Kardoskút, et le parc veille sur deux autres
      rapaces mondialement menacés : l'[aigle impérial](/especie/aquila_heliaca/) et le [faucon
      sacre](/especie/falco_cherrug/). Y nichent également l'avocette, le pluvier à collier interrompu,
      l'échasse blanche, la barge à queue noire, le chevalier gambette et le râle des genêts.


      En automne se déploie le grand rassemblement migratoire. Fin octobre, jusqu'à quatre-vingt mille oiseaux
      peuvent passer la nuit sur les eaux peu profondes de Kardoskút, rejoints au crépuscule par le cortège
      majestueux des [grues cendrées](/especie/grus_grus/). Des dizaines de milliers d'oiseaux d'eau et de
      limicoles font escale au lac Blanc, aux étangs de Biharugra et dans la Montág-puszta. Dans les vieux
      chênaies du Kis-Sárrét dorment les [pygargues à queue blanche](/especie/haliaeetus_albicilla/) qui
      hivernent près des étangs. En fin d'été, circaètes, buses féroces et busards cendrés survolent
      régulièrement les steppes de Csanád.


      Dans les roselières d'Ugrai-rét et Sző-rét nichent la [spatule blanche](/especie/platalea_leucorodia/),
      le crabier chevelu et l'ibis falcinelle, aux côtés de la [cistude d'Europe](/especie/emys_orbicularis/)
      et de la grenouille des champs. La plaine du Hármas-Körös héberge la plus forte population de [râle des
      genêts](/especie/crex_crex/) du parc, tandis que les forêts rivulaires accueillent la [cigogne
      noire](/especie/ciconia_nigra/) et le pygargue. S'y trouve aussi la plus grande colonie européenne de
      murins des marais, et la [loutre d'Europe](/especie/lutra_lutra/) y trouve un havre de paix.
    visit: >-
      La visite s'organise par secteurs autonomes. Le sentier de Réhely commence et s'achève au centre
      d'accueil de la grande outarde Sterbetz István, à Dévaványa, formant une boucle à pied d'une heure ; des
      circuits cyclables balisés partent du centre avec vélos en location.


      Dans le Kis-Sárrét, le sentier de Sző-rét mesure près de deux kilomètres depuis le refuge ornithologique
      de Bihar. Dans la vallée du Körös, le sentier de Halásztelek détaille en dix panneaux la faune et les
      crues du Hármas-Körös, tandis que le sentier nautique du Martin-pêcheur n'est accessible qu'en canoë :
      huit bouées balisent un kilomètre sur le bras mort du Holt-Körös.


      Dans la vallée du Maros, le sentier de Bökény parcourt environ 7 km de plaine alluviale, passant par le
      kurgane de Bekai haut de 8 m, les digues et les boisements en deux heures de marche paisible. Sur la
      steppe de Kígyós, un sentier de 5 km avec sept étapes didactiques se découvre également en deux heures.


      À Kardoskút, le musée de la migration des oiseaux présente l'écologie locale et les deux espèces
      vedettes, le faucon kobez et la grue cendrée, secondé par deux tours d'observation. À Csanád, la lagune
      de Nagy-Zsombék s'observe depuis une tour panoramique entre Tótkomlós et Makó-Rákos.
    history: >-
      Les kurganes préhistoriques représentent le patrimoine archéologique majeur du parc, estimés à quarante
      mille dans l'ensemble du bassin carpatique. Dans l'unité de Mágor-puszta subsistent les ruines d'un
      monastère des XIe et XIIe siècles ayant appartenu au clan Csolt, premiers seigneurs du comitat de Békés.


      La sauvegarde de l'outarde implique une étroite concertation agricole pour décaler les fenaisons et
      épargner les pontes. La steppe de Csanád, d'une superficie de 4057 hectares, est classée depuis 1989. Le
      lac Blanc de Kardoskút, les étangs de Biharugra et la Montág-puszta sont inscrits sur la liste Ramsar.
      Une mission capitale consiste à préserver les stations d'Adonis volgensis et de Salvia nutans, uniques
      en Hongrie.
    before: >-
      Le lac Blanc de Kardoskút et ses rives forment une zone de réserve intégrale strictement accessible sur
      autorisation écrite préalable. Dans les steppes de Dévaványa, les parcelles les plus fragiles se
      découvrent impérativement avec un guide agréé ou autorisation.
    around: >-
      Le parc englobe la plaine de [Dévaványa](/lugar/koros-maros-nemzeti-park---devavanyai/). Plus loin,
      d'autres steppes partagent une faune remarquable avec Körös-Maros : les [monts
      Măcin](/lugar/parcul-national-muntii-macinului/) accueillent l'aigle impérial, le faucon sacre et le
      [souslik d'Europe](/especie/spermophilus_citellus/) ; le [parc national de
      Bükk](/lugar/bukki-nemzeti-park/) partage les deux rapaces ; enfin le [plateau de
      Casimcea](/lugar/podisul-casimcea---podisul-dobrogean/) et les sables de
      [Deliblato](/lugar/specijalni-rezervat-prirode-deliblatska/) hébergent également le souslik et le faucon
      sacre.
  de:
    intro: >-
      Im Frühling erblickten Reisende in den Steppen des Karpatenbeckens von weitem weiße Flecken, die sich
      rhythmisch über den Gräsern wiegten. Es waren balzende Hähne der [Großtrappe](/especie/otis_tarda/) bei
      ihrem imposanten Paarungstanz, der dürgés, einem der seltensten Naturschauspiele Europas. Heute ist
      dieses Phänomen fast überall erloschen, doch hier überlebt es: Der Körös-Maros-Nationalpark im Südosten
      Ungarns hütet die größte Großtrappenpopulation Mitteleuropas. Er setzt sich aus dreizehn Einheiten
      zusammen, die über die südliche Puszta verteilt sind, und wurde am 16. Januar 1997 als Nationalpark
      Nummer sieben Ungarns gegründet.
    landscape: >-
      Das Relief ist vollkommen eben: Der Park überschreitet nirgends 100 Meter Meereshöhe und besitzt das
      wärmste und trockenste Klima Ungarns. Geformt wurde er von zwei Karpatenflüssen, der Körös und der
      Maros, die als unverzichtbare Wanderkorridore für Flora und Fauna fungieren.


      Seit Mitte des neunzehnten Jahrhunderts veränderten Flussregulierungen die Landschaft grundlegend,
      sodass von den einstigen Sümpfen nur Fragmente blieben. Daher gleicht der Park einem ökologischen
      Archipel. An den Ufern stocken Galeriewälder und Feuchtwiesen; in den Steppen dominieren salzgeprägte
      Solonetzböden; dazwischen liegen Altwässer und Lössinseln. Die Pflanzenwelt der Salz- und Lössfluren
      weist starke östliche Züge auf, darunter Adonis volgensis und Nickender Salbei (Salvia nutans).


      Jedes Schutzgebiet besitzt ein eigenes Gesicht. In der Steppe von Dévaványa windet sich der Fluss
      Hortobágy-Berettyó über rund 33 Kilometer unbegradigt durch alte Mäander. Der Weiße See von Kardoskút
      ist ein temporäres Sodagewässer, das sich im Frühjahr flach füllt und im Hochsommer trockenfällt. Im
      Kis-Sárrét schufen Hochwässer der Sebes-Körös ein weites Feuchtland zwischen Körösnagyharsány und
      Vésztő, wo 1990 insgesamt 7899 Hektar unter Schutz gestellt wurden. Die Talaue der Hármas-Körös birgt
      artenreiche Wiesen, während die Maros der gefällereichste Zubringer der Theiß ist.
    wildlife: >-
      Der Jahreslauf wird vom Rhythmus der Vogelwelt geprägt.


      Im Frühjahr balzen die Großtrappen, die sich auch ganzjährig im Besucherzentrum Dévaványa beobachten
      lassen. Der [Rotfußfalke](/especie/falco_vespertinus/) brütet am Weißen See von Kardoskút, und der Park
      schützt zwei weltweit bedrohte Greifvögel: den [Kaiseradler](/especie/aquila_heliaca/) und den
      [Würgfalken](/especie/falco_cherrug/). Säbelschnäbler, Seeregenpfeifer, Stelzenläufer, Uferschnepfen,
      Rotschenkel und Wachtelkönige brüten in den Feuchtzonen.


      Im Herbst folgt der große Vogelzug. Ende Oktober übernachten bis zu achtzigtausend Vögel auf den
      seichten Wasserflächen von Kardoskút, gekrönt vom allabendlichen Einflug der
      [Kraniche](/especie/grus_grus/). Zehntausende Enten, Gänse und Limikolen rasten am Weißen See, an den
      Fischteichen von Biharugra und in der Montág-puszta. In alten Eichenwäldern des Kis-Sárrét schlafen
      überwinternde [Seeadler](/especie/haliaeetus_albicilla/). Im Spätsommer jagen Schlangenadler,
      Adlerbussarde und Wiesenweihen über den Steppen von Csanád.


      In den Röhrichten von Ugrai-rét und Sző-rét nisten [Löffler](/especie/platalea_leucorodia/),
      Rallenreiher und Braunsichler, begleitet von der [Europäischen
      Sumpfschildkröte](/especie/emys_orbicularis/) und dem Moorfrosch. Die Hármas-Körös-Aue beherbergt das
      stärkste Vorkommen des [Wachtelkönigs](/especie/crex_crex/) im Park, während die Auwälder
      [Schwarzstorch](/especie/ciconia_nigra/) und Seeadler beherbergen. Hier existiert die größte europäische
      Wochenstube der Teichfledermaus, und der [Fischotter](/especie/lutra_lutra/) findet sichere Zuflucht.
    visit: >-
      Die Erkundung erfolgt nach Teilgebieten. Der Lehrpfad von Réhely beginnt und endet am
      Sterbetz-István-Großtrappenzentrum in Dévaványa und lässt sich zu Fuß in einer Stunde bewältigen;
      markierte Radwege durch die Steppen starten direkt am Zentrum mit Fahrradverleih.


      Im Kis-Sárrét misst der Pfad von Sző-rét knapp zwei Kilometer ab der Vogelstation Bihar. Im Körös-Tal
      erläutert der Lehrpfad Halásztelek auf zehn Schautafeln Natur und Geschichte der Flussaue, während der
      Eisvogel-Wasserlehrpfad nur per Kanu zugänglich ist: Acht Bojen markieren einen Kilometer im Altwarm
      Holt-Körös.


      Im Maros-Tal erschließt der Lehrpfad Bökény rund 7 km Überflutungsaue, führt am 8 m hohen Grabhügel von
      Bekai vorbei und dauert zwei Stunden bei gemächlichem Gehen. Auf der Kígyós-Steppe führt ein 5 km langer
      Pfad mit sieben Stationen ebenfalls in zwei Stunden durch die Puszta.


      In Kardoskút widmet sich das Museum für Vogelzug der Ökologie und den zwei Wappenvögeln, Rotfußfalke und
      Kranich, ergänzt durch zwei Aussichtstürme. In Csanád lässt sich die Flachwasserzone Nagy-Zsombék von
      einem Beobachtungsturm zwischen Tótkomlós und Makó-Rákos überblicken.
    history: >-
      Die vorgeschichtlichen Kurgane zählen zu den bedeutendsten Kulturdenkmälern des Parks; einst gab es
      schätzungsweise vierzigtausend im Karpatenbecken. In Mágor-puszta liegen Klosterruinen aus dem elften
      und zwölften Jahrhundert, die dem Geschlecht der Csolt gehörten, den frühen Grundherren des Komitats
      Békés.


      Der Schutz der Großtrappe basiert auf Vereinbarungen mit Landwirten zur zeitlichen Abstimmung der Mahd.
      Die 4057 Hektar große Steppe von Csanád steht seit 1989 unter Schutz. Kardoskút, Biharugra und
      Montág-puszta sind Ramsar-Gebiete. Eine Kernaufgabe besteht im Erhalt der ungarischen Restvorkommen von
      Adonis volgensis und Salvia nutans.
    before: >-
      Der Weiße See von Kardoskút und seine Uferbereiche sind streng geschützte Kernzonen und dürfen nur mit
      Sondergenehmigung betreten werden. In Dévaványa erfordern sensible Kernzonen eine Führung oder
      Genehmigung.
    around: >-
      Der Park schließt die [Dévaványa-Ebene](/lugar/koros-maros-nemzeti-park---devavanyai/) ein. In der
      weiteren Region teilen andere Steppenarten mit Körös-Maros: Das
      [Măcin-Gebirge](/lugar/parcul-national-muntii-macinului/) teilt Kaiseradler, Würgfalke und
      [Ziesel](/especie/spermophilus_citellus/); der [Bükk-Nationalpark](/lugar/bukki-nemzeti-park/) die
      beiden Greifvögel; während das [Casimcea-Plateau](/lugar/podisul-casimcea---podisul-dobrogean/) und die
      Sanddünen von [Deliblatska peščara](/lugar/specijalni-rezervat-prirode-deliblatska/) ebenfalls Ziesel
      und Würgfalken beherbergen.
  it:
    intro: >-
      In primavera i viandanti che attraversavano le steppe del bacino pannonico scorgevano da lontano candide
      macchie ondeggiare tra le erbe. Erano i maschi di [otarda comune](/especie/otis_tarda/) impegnati nella
      spettacolare parata nuziale, la dürgés, una delle scene più rare della natura europea. Oggi pressoché
      scomparsa nel continente, questa danza primordiale sopravvive qui: il Parco nazionale di Körös-Maros,
      nel sud-est dell'Ungheria, custodisce la maggiore popolazione di otarda dell'Europa centrale. Si
      articola in tredici unità distinte sparse nella puszta meridionale tra steppe saline, boschi golenali e
      paludi, costituendo il parco nazionale numero sette d'Ungheria, istituito il 16 gennaio 1997.
    landscape: >-
      La morfologia è totalmente pianeggiante: il parco non oltrepassa mai i 100 metri di quota e vanta il
      clima più caldo e arido dell'Ungheria. È stato modellato da due fiumi originari dei Carpazi, il Körös e
      il Maros, tuttora arterie ecologiche primarie per la dispersione di flora e fauna.


      A partire dalla metà del XIX secolo, le grandiose opere di regimazione idraulica alterarono l'intera
      pianura, riducendo a frammenti le sterminate paludi originarie. Il parco si configura dunque come un
      vero arcipelago ecologico. Lungo le sponde sopravvivono foreste a galleria e prati umidi; nelle steppe
      prevalgono terreni salini solonetz; tra loro si intercalano lanche fluviali e dossi di loess. La
      vegetazione delle steppe saline e dei suoli di loess presenta marcate affinità orientali, annoverando
      Adonis volgensis e Salvia nutans.


      Ogni riserva possiede una distinta fisionomia. Nelle steppe di Dévaványa il fiume Hortobágy-Berettyó
      scorre lento lungo circa 33 chilometri di meandri intatti. Il lago Bianco di Kardoskút è un bacino
      sodico effimero che si colma d'acque basse a primavera prima di prosciugarsi a fine estate. Nel
      Kis-Sárrét le piene del Sebes-Körös generarono una vasta zona umida tra Körösnagyharsány e Vésztő, dove
      nel 1990 vennero protetti 7899 ettari. La golena del Hármas-Körös accoglie prati allagabili, mentre il
      Maros è il tributario del Tibisco con la maggiore pendenza e portata solida.
    wildlife: >-
      Il calendario naturale è scandito dal transito e dalla riproduzione dell'avifauna.


      In primavera comincia la parata delle otarde, osservabili tutto l'anno presso il centro visite di
      Dévaványa. Il [falco cuculo](/especie/falco_vespertinus/) nidifica al lago Bianco di Kardoskút, e il
      parco protegge altri due rapaci globalmente minacciati: l'[aquila imperiale
      orientale](/especie/aquila_heliaca/) e il [falco sacro](/especie/falco_cherrug/). Vi nidificano inoltre
      l'avocetta, il fratino, il cavaliere d'Italia, la pittima reale, la pettegola e il re di quaglie.


      In autunno va in scena il grandioso spettacolo migratorio. A fine ottobre fino a ottantamila uccelli
      possono pernottare negli specchi bassi di Kardoskút, dominati dall'arrivo crepuscolare delle [gru
      cenerine](/especie/grus_grus/). Decine di migliaia di anatidi e limicoli sostano nelle zone umide
      durante i passi, in particolare al lago Bianco, nei bacini ittici di Biharugra e a Montág-puszta. Nei
      querceti vetusti di Kis-Sárrét dormono le [aquile di mare](/especie/haliaeetus_albicilla/) svernanti. A
      fine estate bianconi, poiane codabianca e albanelle minori sorvolano costantemente le steppe di Csanád.


      Nei canneti di Ugrai-rét e Sző-rét nidificano la [spatola](/especie/platalea_leucorodia/), la sgarza
      ciuffetto e il mignattaio, insieme alla [testuggine palustre europea](/especie/emys_orbicularis/) e alla
      rana di palude. La piana alluvionale del Hármas-Körös ospita la più densa popolazione di [re di
      quaglie](/especie/crex_crex/) del parco, mentre i boschi ripariali danno rifugio alla [cicogna
      nera](/especie/ciconia_nigra/) e all'aquila di mare. Qui si riproduce la più grande colonia europea di
      vespertilio di palude, e la [lontra europea](/especie/lutra_lutra/) trova rifugi ideali nella golena.
    visit: >-
      La visita si articola attraverso i vari comprensori. Il sentiero didattico di Réhely parte e rientra al
      centro visite dell'otarda Sterbetz István a Dévaványa, compiendo un anello a piedi in un'ora; dal centro
      si diramano piste ciclabili segnalate nella steppa con noleggio bici disponibile.


      Nel Kis-Sárrét il sentiero di Sző-rét copre quasi due chilometri partendo dalla stazione ornitologica di
      Bihar. Nella valle del Körös il sentiero di Halásztelek illustra in dieci pannelli la fauna e la storia
      golenale, mentre l'itinerario acquatico del Martin pescatore si percorre unicamente in canoa: otto boe
      galleggianti raccontano un chilometro della lanca morta Holt-Körös.


      Nella valle del Maros il sentiero di Bökény si snoda per circa 7 km di piana alluvionale, toccando il
      kurgan di Bekai alto 8 m, gli argini e i boschi in due ore di tranquilla camminata. Nella steppa di
      Kígyós un itinerario di 5 km con sette stazioni divulgative si percorre parimenti in due ore.


      A Kardoskút il Museo della Migrazione Aviare spiega l'avifauna e le due specie simbolo, il falco cuculo
      e la gru, con due torri d'avvistamento panoramiche. A Csanád la conca d'acqua di Nagy-Zsombék si ammira
      da una torretta tra Tótkomlós e Makó-Rákos.
    history: >-
      I tumuli funerari, o kurgan, rappresentano il patrimonio archeologico più rilevante del parco; se ne
      contavano circa quarantamila nel bacino carpatico. A Mágor-puszta si ammirano le vestigia di un
      monastero dei secoli XI e XII appartenuto al casato dei Csolt, primi signori feudali della contea di
      Békés.


      La salvaguardia dell'otarda si fonda sulla cooperazione con il mondo agricolo per pianificare le
      sfalciate senza danneggiare i nidi. La steppa di Csanád, estesa su 4057 ettari, è protetta dal 1989.
      Kardoskút, gli specchi di Biharugra e Montág-puszta figurano nell'elenco internazionale Ramsar. Un
      compito primario consiste nella tutela delle popolazioni relitte di Adonis volgensis e Salvia nutans.
    before: >-
      Il lago Bianco di Kardoskút e il suo perimetro sono zona di riserva integrale accessibile unicamente
      dietro autorizzazione scritta. Nelle steppe di Dévaványa i settori più vulnerabili richiedono guide
      autorizzate o specifici permessi di studio.
    around: >-
      Il parco comprende la [Piana di Dévaványa](/lugar/koros-maros-nemzeti-park---devavanyai/). Più lontano,
      altre steppe condividono specie prioritarie con Körös-Maros: i [Monti
      Măcin](/lugar/parcul-national-muntii-macinului/) ospitano aquila imperiale, falco sacro e [citello
      europeo](/especie/spermophilus_citellus/); il [Parco nazionale di Bükk](/lugar/bukki-nemzeti-park/) le
      due specie di rapaci; mentre l'[Altopiano di Casimcea](/lugar/podisul-casimcea---podisul-dobrogean/) e
      le sabbie di [Deliblatska peščara](/lugar/specijalni-rezervat-prirode-deliblatska/) accolgono citelli e
      falchi sacri.
  pt:
    intro: >-
      Na primavera, quem atravessava as vastas estepes da bacia dos Cárpatos avistava ao longe pontos alvos
      ondulando sobre as ervas. Eram os machos de [abetarda-comum](/especie/otis_tarda/) na sua coreografia
      nupcial, a dürgés, um dos espetáculos mais raros da vida selvagem europeia. Hoje quase extinta no
      continente, esta parada sobrevive aqui: o Parque Nacional de Körös-Maros, no sudeste da Hungria,
      preserva a maior população de abetardas da Europa Central. Congrega treze unidades dispersas pela puszta
      meridional entre estepes salinas, matas de galeria e pauis, constituindo o parque nacional número sete
      da Hungria, criado a 16 de janeiro de 1997.
    landscape: >-
      O relevo é inteiramente plano: o parque não ultrapassa em ponto algum os 100 metros de altitude e
      desfruta do clima mais quente e seco da Hungria. Foi esculpido por dois rios nascidos nos Cárpatos, o
      Körös e o Maros, que permanecem como eixos vitais de migração faunística e dispersão botânica.


      A partir de meados do século XIX, as obras de regularização fluvial alteraram a planície, poupando
      apenas retalhos dos antigos pântanos. Daí que o parque funcione como um arquipélago ecológico. Nas
      margens subsistem matas ripícolas e prados aluviais; nas estepes predominam solos salinos solonetz; e
      entre eles alternam meandros abandonados e lombas de loesse. As plantas das estepes salinas e de loesse
      exibem forte afinidade oriental, com destaque para Adonis volgensis e Salvia nutans.


      Cada reserva preserva a sua identidade. Nas estepes de Dévaványa, o rio Hortobágy-Berettyó conserva
      cerca de 33 quilómetros de meandros intactos. A lagoa Branca de Kardoskút é uma bacia sódica efémera que
      se enche de águas rasas na primavera e seca no verão. No Kis-Sárrét, cheias do Sebes-Körös geraram
      vastos alagadiços entre Körösnagyharsány e Vésztő, onde em 1990 foram protegidos 7899 hectares. A
      planície do Hármas-Körös acolhe lameiros de inundação, sendo o Maros o afluente com maior declive e
      carga sólida do Tisza.
    wildlife: >-
      O ciclo das estações é ditado pelas aves.


      Na primavera desdobra-se o cortejo das abetardas, observáveis todo o ano no centro de Dévaványa. O
      [falcão-vespertino](/especie/falco_vespertinus/) nidifica na lagoa Branca de Kardoskút, protegendo o
      parque dois outros grandes predadores globais: a [águia-imperial-oriental](/especie/aquila_heliaca/) e o
      [falcão-sacre](/especie/falco_cherrug/). Aqui nidificam o alfaiate, o borrelho-de-coleira-interrompida,
      o pernilongo, o maçarico-de-bico-direito, o perna-vermelha-comum e o codornizão.


      No outono instala-se o grande fenómeno migratório. Nos finais de outubro até oitenta mil aves pernoitam
      nos lençóis rasos de Kardoskút, sob a entrada majestosa dos [grous-comuns](/especie/grus_grus/) ao cair
      da noite. Dezenas de milhares de patos e limícolas descansam nas zonas húmidas, sobretudo na lagoa
      Branca, nos açudes de Biharugra e em Montág-puszta. Nos velhos carvalhais de Kis-Sárrét dormem as
      [águias-rabalvas](/especie/haliaeetus_albicilla/) invernantes. Nos fins de verão, águias-cobreiras,
      búteos-mouros e tartaranhões-caçadores sobrevoam as estepes de Csanád.


      Nos caniçais de Ugrai-rét e Sző-rét nidificam o [colhereiro](/especie/platalea_leucorodia/), o garçote e
      o íbis-preto, coexistindo com o [cágado-de-carapaça-estriada](/especie/emys_orbicularis/) e a
      rã-dos-campos. A planície do Hármas-Körös alberga a maior densidade de [codornizão](/especie/crex_crex/)
      do parque, enquanto as matas ciliares acolhem a [cegonha-preta](/especie/ciconia_nigra/) e a
      águia-rabalva. Localiza-se aqui a maior maternidade europeia do morcego-das-águas, encontrando a
      [lontra-europeia](/especie/lutra_lutra/) refúgio nos meandros.
    visit: >-
      A visitação estrutura-se por polos. O trilho interpretativo de Réhely parte e regressa ao Centro de
      Visitantes da Abetarda Sterbetz István, em Dévaványa, cumprindo um circuito pedestre numa hora; do
      centro saem rotas cicláveis com aluguer de bicicletas.


      No Kis-Sárrét, o trilho de Sző-rét estende-se por quase dois quilómetros a partir do abrigo de aves de
      Bihar. No vale do Körös, o trilho de Halásztelek expõe em dez painéis a vida na planície do
      Hármas-Körös, ao passo que o trilho aquático do Guarda-rios só é acessível em canoa: oito boias
      flutuantes assinalam um quilómetro no braço morto Holt-Körös.


      No vale do Maros, o trilho de Bökény cobre cerca de 7 km de planície aluvial, passando pelo túmulo
      kurgan de Bekai com 8 m, diques e bosques em duas horas de marcha descontraída. Na estepe de Kígyós, um
      circuito de 5 km com sete paragens cumpre-se igualmente em duas horas.


      Em Kardoskút, o Museu da Migração das Aves esclarece a biologia e as duas espécies bandeira, o
      falcão-vespertino e o grou, com duas torres de observação. Em Csanád, a bacia aquática de Nagy-Zsombék
      contempla-se de uma torre entre Tótkomlós e Makó-Rákos.
    history: >-
      Os túmulos funerários kurgan constituem o património histórico mais notável do parque, outrora estimados
      em quarenta mil na bacia dos Cárpatos. Em Mágor-puszta subsistem ruínas monásticas dos séculos XI e XII
      pertencentes à linhagem Csolt, primeiros senhores feudais de Békés.


      A salvaguarda da abetarda exige um compromisso com os agricultores para harmonizar ceifas e poupar
      ninhos. A estepe de Csanád, abrangendo 4057 hectares, está protegida desde 1989. Kardoskút, Biharugra e
      Montág-puszta integram a Convenção de Ramsar. Constitui prioridade zelar pelos núcleos relíquia de
      Adonis volgensis e Salvia nutans.
    before: >-
      A lagoa Branca de Kardoskút e as suas margens formam uma reserva integral acessível apenas sob
      autorização escrita prévia. Nas estepes de Dévaványa as zonas estritas exigem acompanhamento oficial do
      parque.
    around: >-
      O parque inclui a [Planície de Dévaványa](/lugar/koros-maros-nemzeti-park---devavanyai/). Mais além,
      outras estepes partilham espécies com Körös-Maros: os [Montes
      Măcin](/lugar/parcul-national-muntii-macinului/) acolhem a águia-imperial, o falcão-sacre e o
      [esquilo-terrestre](/especie/spermophilus_citellus/); o [Parque Nacional de
      Bükk](/lugar/bukki-nemzeti-park/) partilha as duas rapinas; enquanto o [Planalto de
      Casimcea](/lugar/podisul-casimcea---podisul-dobrogean/) e as areias de
      [Deliblato](/lugar/specijalni-rezervat-prirode-deliblatska/) sustentam também o esquilo-terrestre e o
      falcão-sacre.
