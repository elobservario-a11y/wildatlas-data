resumen:
  es: Vasto humedal de retención de avenidas del río Sava conservado mediante pastoreo ganadero tradicional.
  en: Vast flood-retention wetland along the Sava River preserved through traditional livestock grazing.
  fr: Vaste zone humide de rétention des crues de la Save préservée par le pastoralisme traditionnel.
  de: Weitläufiges Überschwemmungsgebiet der Save, das durch traditionelle Beweidung erhalten wird.
  it: >-
    Vasta pianura alluvionale di laminazione delle piene della Sava, preservata attraverso il pascolo brado
    tradizionale.
  pt: >-
    Vasta planície de inundação e retenção de cheias do rio Sava, conservada pelo pastoreio tradicional
    extensivo.
unico:
  es: >-
    Aquí el río y el pueblo se reparten el espacio: casi el 70 % del parque son bosques de ribera, los
    animales de razas antiguas pastan sueltos y hay un pueblo con más cigüeñas que vecinos.
  en: >-
    Here the river and rural communities share space: nearly 70 % of the park is alluvial forest, ancient
    heritage livestock breeds graze freely, and one village has more storks than human residents.
  fr: >-
    Ici le fleuve et les villages se partagent l'espace : près de 70 % du parc sont des forêts alluviales, des
    races anciennes paissent en liberté et un village compte plus de cigognes que d'habitants.
  de: >-
    Hier teilen sich Fluss und Dorf den Raum: Fast 70 % des Parks sind Auwälder, alte Nutztierrassen weiden
    frei und ein Dorf zählt mehr Störche als Einwohner.
  it: >-
    Qui il fiume e i villaggi condividono lo spazio: quasi il 70 % del parco è coperto da boschi ripariali,
    razze rustiche pascolano libere e un borgo conta più cicogne che abitanti.
  pt: >-
    Aqui o rio e as aldeias partilham o espaço: quase 70 % do parque são matas ribeirinhas, raças autóctones
    pastam em liberdade e uma aldeia acolhe mais cegonhas do que moradores.
observaciones:
  es: >-
    Por ser una llanura inundable, comprueba antes si los caminos están transitables. Para entrar en las
    reservas ornitológicas y otros puntos de observación, preséntate en los centros de información de Krapje o
    Čigoč. El sendero Tena requiere guía y aviso previo al centro.
texto:
  es:
    intro: >-
      Cuando el río crece, aquí nadie se asusta: se hizo sitio. Lonjsko polje es una llanura inundable del
      Sava, en Croacia, donde durante siglos la gente ha vivido con el agua en lugar de pelearse con ella.
      Ocupa 50.650 hectáreas y es uno de los mayores humedales protegidos de la cuenca del Danubio. Cuando las
      aguas bajan, los cerdos, las vacas y los caballos vuelven a los pastos y se quedan hasta la primera
      nieve; encima, en los tejados de madera, anidan las cigüeñas.
    landscape: >-
      El agua lo manda todo. Casi el 70 % del parque está cubierto por bosques de ribera de roble pedunculado
      y fresno de hoja estrecha. Los pastizales inundables cubren cerca del 30 % de la superficie y se inundan
      total o parcialmente de 30 a 100 días casi todos los años.


      Y hay una planta que lo resume bien. El trébol de cuatro hojas, casi extinguido en Europa por la
      desaparición de los humedales, sigue extendido en los pastos inundables del Sava.
    wildlife: >-
      Lonjsko polje es un destino de primera para quien mira pájaros: en el parque se han registrado 250
      especies de aves, de las que 134 anidan. Desde 1989 forma parte de la lista de Áreas Importantes para
      las Aves.


      La reserva ornitológica de Krapje Đol fue la primera de Croacia. Allí se juntan la [espátula
      común](/especie/platalea_leucorodia/) y varias garzas: [garza real](/especie/ardea_cinerea/), [garza
      imperial](/especie/ardea_purpurea/), [garceta común](/especie/egretta_garzetta/), [garceta
      grande](/especie/egretta_alba/), [martinete](/especie/nycticorax_nycticorax/) y garcilla cangrejera.
      Anida cerca del 10 % de la población europea de espátula común. Hubo un tiempo en que la reserva casi se
      seca, porque se drenaron los terrenos de alrededor; con ayuda exterior se abrió un canal desde el Sava y
      en 1991 las aves volvieron a anidar.


      La segunda reserva, Rakita, tiene otra lectura: en los pasos de invierno se ven grandes grupos de patos
      salvajes. En la zona de retención de Mužilovčica pastan caballos y cerdos autóctonos, y se ven [cigüeña
      blanca](/especie/ciconia_ciconia/), [cigüeña negra](/especie/ciconia_nigra/), garza real y martinete.
      Las [cigüeñas](/especie/ciconia_ciconia/) tienen su aldea: Čigoč fue declarada en 1994 la primera aldea
      europea de las cigüeñas, con casi cien cigüeñas en unos treinta nidos activos entre sus casas y
      graneros.


      Arriba, el [pigargo europeo](/especie/haliaeetus_albicilla/) anida en los bosques cercanos a grandes
      aguas: 36 parejas, cerca del 15 % de la población croata. En los prados de siega y los prados naturales
      con juncias altas cría el [guión de codornices](/especie/crex_crex/). Y abajo, entre las charcas, viven
      la [nutria](/especie/lutra_lutra/), el [murciélago de Bechstein](/especie/myotis_bechsteinii/), el
      [galápago europeo](/especie/emys_orbicularis/) y la ranita de San Antonio; de las veinte especies de
      anfibios de Croacia, 16 viven en el parque.
    visit: >-
      Empieza por uno de los centros: el de Krapje, dominado por una sala multimedia donde un guía informa
      sobre el pueblo y el parque, o el de Čigoč, desde donde sale el programa de las cigüeñas (charla,
      observación con prismáticos y recuento de nidos). Para entrar en las reservas ornitológicas hay que
      presentarse antes en Krapje o en Čigoč, y allí te explican cómo hacerlo.


      Los senderos son sencillos y cada uno cuenta algo distinto. El Posavac, un circuito de 4,2 km con cinco
      paneles, lleva entre dos horas y dos horas y media y enseña cómo se aprovechaban campos, prados y pastos
      sin cerrar la puerta a lo salvaje; empieza en Čigoč y tiene una torre para ver aves y ganado. El
      Borderers’ Trail une Krapje y Orlinci con Krapje Đol, el mayor lugar de nidificación de la espátula
      común en Croacia, y tarda unas dos horas y media o tres. El Haymaker Trail, de 5 km, permite ver aves. Y
      el sendero forestal Tena es un circuito de 2,5 km con 16 paneles sobre el bosque de tierras bajas, que
      solo se hace con guías del parque.


      Hay otras formas de moverse. En el centro de Krapje se alquila una canoa para remar por el canal Veliki
      Strug, y la balsa educativa Vodomar, la excursión en barco más popular, pasa entre sauces y álamos. Para
      ir en bicicleta, la Ruta de Posavina es el itinerario más atractivo, con 77,8 km por la orilla izquierda
      del Sava. Por la entrada de Repušnica se llega en tren.
    history: >-
      El paisaje que ves nació en la Frontera Militar croata, entre la monarquía de los Habsburgo y el Imperio
      otomano, con un sistema de pastoreo comunal de varias especies. Hoy Lonjsko polje es una de las últimas
      zonas de Europa donde sigue el pastoreo tradicional, con el ganado suelto en grandes pastos. Las razas
      autóctonas son el caballo de Posavina, el caballo croata de sangre fría, el ganado podólico
      eslavo-sirmio, el ganso de Posavina, el perdiguero de Posavina y el cerdo de Turopolje, la más
      amenazada.


      Krapje es el único pueblo de Croacia con la categoría de pueblo de patrimonio arquitectónico. El parque
      natural se estableció como institución en 1998, con sede en Krapje, y figura como Humedal de Importancia
      Internacional del Convenio de Ramsar.
    before: >-
      Por ser una llanura inundable, comprueba antes si los caminos están transitables. Para entrar en las
      reservas ornitológicas y otros puntos de observación, preséntate en los centros de información de Krapje
      o Čigoč. El sendero Tena requiere guía y aviso previo al centro.
    around: >-
      Lonjsko polje no tiene lugares cercanos en el atlas, pero sí comparte humedal, ganado y caballos en
      libertad con otros. La [Puerta de Güeldres / Corredor del Rin](/lugar/gelderse-poort/) y la [Reserva
      Natural de Millingerwaard](/lugar/millingerwaard/) son corredores fluviales húmedos que comparten con él
      vacas y caballos, y el [Parque Nacional Kiskunság - Estepa de Bugac](/lugar/kiskunsagi---bugac-puszta/)
      comparte el ganado en pastoreo.
  en:
    intro: >-
      When the river rises here, nobody panics: room was made for it. Lonjsko polje is an expansive floodplain
      of the Sava in Croatia, where for centuries people have lived alongside the water rather than fighting
      it. It spans 50,650 hectares, ranking among the largest protected wetlands in the entire Danube basin.
      When the floodwaters recede, pigs, cattle, and horses return to the communal pastures and linger until
      the first snow; overhead, storks nest on wooden rooftops.
    landscape: >-
      Water governs everything. Nearly 70 % of the park is cloaked in riparian forests of pedunculate oak and
      narrow-leaved ash. The alluvial wet meadows cover about 30 % of the area and flood completely or
      partially for 30 to 100 days in almost every year.


      One humble plant encapsulates the system. The four-leaf water clover, nearly extinct across Europe due
      to wetland drainage, remains abundant throughout the flooded pastures of the Sava.
    wildlife: >-
      Lonjsko polje is a premier birdwatching destination: 250 bird species have been recorded in the park,
      134 of which nest here. Since 1989 it has been included on the list of Important Bird Areas.


      The ornithological reserve of Krapje Đol was the first established in Croatia. Here the [Eurasian
      spoonbill](/especie/platalea_leucorodia/) gathers with several herons: [grey
      heron](/especie/ardea_cinerea/), [purple heron](/especie/ardea_purpurea/), [little
      egret](/especie/egretta_garzetta/), [great egret](/especie/egretta_alba/), [black-crowned night
      heron](/especie/nycticorax_nycticorax/), and squacco heron. Nearly 10 % of the European spoonbill
      population breeds here. At one time the reserve nearly dried up when surrounding lands were drained;
      with external support a canal was dug from the Sava, and in 1991 the birds resumed nesting.


      The second reserve, Rakita, offers a different focus: large flocks of wild ducks assemble during winter
      migration. In the retention pasture of Mužilovčica, native horses and pigs graze freely, while [white
      stork](/especie/ciconia_ciconia/), [black stork](/especie/ciconia_nigra/), grey herons, and night herons
      forage. The [white storks](/especie/ciconia_ciconia/) have their own sanctuary: in 1994, Čigoč was
      declared the first European Stork Village, with almost a hundred storks in about thirty active nests
      atop houses and barns.


      Above, the [white-tailed eagle](/especie/haliaeetus_albicilla/) nests in forests close to open water: 36
      pairs, representing about 15 % of the Croatian population. In hay meadows and natural wet grasslands
      with tall sedges, the [corn crake](/especie/crex_crex/) breeds. Below, in pools and channels, live the
      [Eurasian otter](/especie/lutra_lutra/), [Bechstein's bat](/especie/myotis_bechsteinii/), [European pond
      turtle](/especie/emys_orbicularis/), and European tree frog; of Croatia's twenty amphibian species, 16
      live in the park.
    visit: >-
      Start at one of the visitor centres: Krapje, anchored by a multimedia hall where a guide explains the
      village and park, or Čigoč, where the stork programme begins (introductory talk, binocular observation,
      and nest counts). To enter the ornithological reserves you must register beforehand at Krapje or Čigoč,
      where staff explain how to visit.


      The trails are straightforward and each highlights a distinct theme. The Posavac trail, a 4.2 km loop
      with five panels, takes between two and two and a half hours, showing how fields, meadows, and pastures
      were farmed in harmony with nature; it begins in Čigoč and includes an observation tower for watching
      birds and livestock. The Borderers' Trail links Krapje and Orlinci with Krapje Đol, Croatia's largest
      spoonbill colony, taking about two and a half to three hours. The 5 km Haymaker Trail is excellent for
      birdwatching. The Tena forest trail is a 2.5 km circuit with 16 panels on lowland woodlands, accessible
      only with official park guides.


      There are other ways to travel around. At the Krapje centre you can hire a canoe to paddle along the
      Veliki Strug canal, and the educational raft Vodomar, the most popular boat excursion, glides past
      willows and poplars. For cycling, the Posavina Route is the most attractive itinerary, stretching 77.8
      km along the left bank of the Sava. The Repušnica entrance can be reached by train.
    history: >-
      The landscape you see originated along the Croatian Military Frontier between the Habsburg Monarchy and
      the Ottoman Empire, based on a communal multi-species grazing system. Today Lonjsko polje remains one of
      the last places in Europe where traditional grazing continues, with livestock roaming freely across vast
      pastures. Indigenous breeds include the Posavina horse, the Croatian cold-blooded horse, the
      Slavonian-Syrmian Podolian cattle, the Posavina goose, the Posavina hound, and the Turopolje pig, which
      is the most endangered.


      Krapje is the only village in Croatia designated as a village of architectural heritage. The nature park
      was formally established as an institution in 1998 with headquarters in Krapje, and is listed as a
      Wetland of International Importance under the Ramsar Convention.
    before: >-
      As this is an active floodplain, check beforehand whether the routes are passable. To enter the
      ornithological reserves and other observation points, check in at the Krapje or Čigoč information
      centres. The Tena trail requires a park guide and prior notice to the centre.
    around: >-
      Lonjsko polje has no immediate neighbours in the atlas, but shares wetlands, grazing cattle, and
      free-roaming horses with other areas. [Puerta de Güeldres / Corredor del Rin](/lugar/gelderse-poort/)
      and [Reserva Natural de Millingerwaard](/lugar/millingerwaard/) are wet river corridors that share
      cattle and horses, while [Parque Nacional Kiskunság - Estepa de
      Bugac](/lugar/kiskunsagi---bugac-puszta/) shares traditional open pasture grazing.
  fr:
    intro: >-
      Quand la rivière déborde, personne ne s'affole ici : on lui a fait de la place. Lonjsko polje est une
      plaine inondable de la Save, en Croatie, où depuis des siècles les riverains vivent avec l'eau plutôt
      que de la combattre. S'étendant sur 50 650 hectares, c'est l'une des plus vastes zones humides protégées
      du bassin du Danube. Quand les eaux se retirent, porcs, vaches et chevaux regagnent les pâturages
      jusqu'aux premières neiges ; au-dessus, les cigognes nichent sur les toits de bois.
    landscape: >-
      L'eau dicte sa loi. Près de 70 % du parc est recouvert de forêts alluviales de chêne pédonculé et de
      frêne à feuilles étroites. Les prairies inondables occupent environ 30 % de la superficie et sont
      submergées totalement ou en partie de 30 à 100 jours presque chaque année.


      Une plante résume parfaitement ce milieu. La fougère d'eau à quatre feuilles, presque éteinte en Europe
      en raison de la disparition des marais, demeure très répandue dans les prairies inondables de la Save.
    wildlife: >-
      Lonjsko polje est une destination majeure pour les ornithologues : 250 espèces d'oiseaux y sont
      recensées, dont 134 nicheuses. Depuis 1989, le site figure sur la liste des zones importantes pour la
      conservation des oiseaux.


      La réserve ornithologique de Krapje Đol fut la première de Croatie. S'y rassemblent la [spatule
      blanche](/especie/platalea_leucorodia/) et plusieurs hérons : [héron cendré](/especie/ardea_cinerea/),
      [héron pourpré](/especie/ardea_purpurea/), [aigrette garzette](/especie/egretta_garzetta/), [grande
      aigrette](/especie/egretta_alba/), [bihoreau gris](/especie/nycticorax_nycticorax/) et crabier chevelu.
      Près de 10 % de la population européenne de spatules blanches s'y reproduit. La réserve faillit
      s'assécher jadis lors du drainage des terres alentour ; avec une aide extérieure, un chenal fut creusé
      depuis la Save et en 1991 les oiseaux revinrent y nicher.


      La seconde réserve, Rakita, offre un autre intérêt : lors des passages d'hiver s'y rassemblent de grands
      vols de canards sauvages. Dans la zone de rétention de Mužilovčica paissent chevaux et porcs
      autochtones, côtoyant la [cigogne blanche](/especie/ciconia_ciconia/), la [cigogne
      noire](/especie/ciconia_nigra/), le héron cendré et le bihoreau. Les
      [cigognes](/especie/ciconia_ciconia/) ont leur village : Čigoč fut proclamé en 1994 premier village
      européen des cigognes, abritant près de cent cigognes dans une trentaine de nids actifs sur les toits et
      granges.


      Au sommet de la chaîne, le [pygargue à queue blanche](/especie/haliaeetus_albicilla/) niche dans les
      grands bois proches de l'eau : 36 couples, soit près de 15 % des effectifs croates. Dans les prairies de
      fauche et cariçaies niche le [râle des genêts](/especie/crex_crex/). Et dans les mares vivent la [loutre
      d'Europe](/especie/lutra_lutra/), le [murin de Bechstein](/especie/myotis_bechsteinii/), la [cistude
      d'Europe](/especie/emys_orbicularis/) et la rainette verte ; sur les vingt espèces d'amphibiens de
      Croatie, 16 vivent dans le parc.
    visit: >-
      Commencez par l'un des centres d'accueil : Krapje, doté d'une salle multimédia avec un guide présentant
      le village et le parc, ou Čigoč, point de départ du programme sur les cigognes (conférence, observation
      aux jumelles et comptage des nids). Pour pénétrer dans les réserves ornithologiques, vous devez vous
      inscrire au préalable à Krapje ou à Čigoč.


      Les sentiers sont faciles et variés. Le Posavac, boucle de 4,2 km dotée de cinq panneaux, s'effectue en
      deux heures à deux heures et demie et explique l'équilibre entre élevage et nature sauvage ; il part de
      Čigoč et possède un observatoire pour voir oiseaux et bétail. Le Borderers’ Trail relie Krapje et
      Orlinci à Krapje Đol, la plus grande colonie de spatules de Croatie, en deux heures et demie ou trois
      heures. Le Haymaker Trail, long de 5 km, permet d'observer les oiseaux. Et le sentier forestier Tena
      forme une boucle de 2,5 km avec 16 panneaux sur la forêt de plaine, accessible uniquement avec un guide
      du parc.


      D'autres modes de déplacement s'offrent à vous. À Krapje, vous pouvez louer un canoë pour pagayer sur le
      canal Veliki Strug, tandis que le bac pédagogique Vodomar, excursion la plus populaire, navigue entre
      saules et peupliers. Pour le vélo, la Route de Posavina est l'itinéraire le plus attrayant, avec 77,8 km
      longeant la rive gauche de la Save. L'entrée de Repušnica est desservie par le train.
    history: >-
      Le paysage que vous découvrez est né le long des Confins militaires croates, entre la monarchie des
      Habsbourg et l'Empire ottoman, grâce à un système pastoral communautaire multispécifique. Lonjsko polje
      demeure l'un des derniers bastions européens du pastoralisme traditionnel, où le bétail évolue librement
      dans de vastes communaux. Les races locales comprennent le cheval de Posavina, le cheval de trait
      croate, le bœuf podolique de Slavonie-Syrmie, l'oie de Posavina, le chien de Posavina et le porc de
      Turopolje, le plus menacé.


      Krapje est l'unique village de Croatie classé village du patrimoine architectural. Le parc naturel a été
      formellement institué en 1998, avec son siège à Krapje, et figure parmi les zones humides d'importance
      internationale de la convention de Ramsar.
    before: >-
      En raison du caractère inondable de la plaine, vérifiez l'état des chemins avant de partir. Pour accéder
      aux réserves ornithologiques et points d'observation, présentez-vous aux centres d'accueil de Krapje ou
      de Čigoč. Le sentier Tena nécessite un guide officiel et une réservation préalable.
    around: >-
      Lonjsko polje ne compte pas de voisins immédiats dans l'atlas, mais partage zones humides, bétail et
      chevaux en liberté avec d'autres sites. La [Puerta de Güeldres / Corredor del
      Rin](/lugar/gelderse-poort/) et la [Reserva Natural de Millingerwaard](/lugar/millingerwaard/) sont des
      couloirs alluviaux qui partagent vaches et chevaux, tandis que le [Parque Nacional Kiskunság - Estepa de
      Bugac](/lugar/kiskunsagi---bugac-puszta/) partage le pâturage traditionnel extensif.
  de:
    intro: >-
      Wenn der Fluss anschwillt, gerät hier niemand in Panik: Man hat ihm Raum gegeben. Lonjsko polje ist eine
      Flussaue der Save in Kroatien, in der die Menschen seit Jahrhunderten mit dem Wasser leben, statt
      dagegen anzukämpfen. Das Gebiet umfasst 50.650 Hektar und ist eines der größten geschützten
      Feuchtgebiete im Donaueinzugsgebiet. Weichen die Fluten zurück, kehren Schweine, Rinder und Pferde auf
      die Weiden zurück und bleiben bis zum ersten Schnee; oben auf den Holzdächern nisten die Störche.
    landscape: >-
      Das Wasser bestimmt alles. Fast 70 % des Parks sind von Auwäldern aus Stieleiche und Schmalblättriger
      Esche bedeckt. Die Überschwemmungswiesen nehmen rund 30 % der Fläche ein und stehen fast jedes Jahr an
      30 bis 100 Tagen ganz oder teilweise unter Wasser.


      Eine kleine Pflanze versinnbildlicht diesen Lebensraum: Der Vierblättrige Kleefarn, der in Europa
      infolge der Trockenlegung von Feuchtgebieten fast ausgestorben ist, gedeiht in den Überschwemmungsweiden
      der Save weiterhin verbreitet.
    wildlife: >-
      Lonjsko polje ist ein erstklassiges Ziel für Vogelbeobachter: 250 Vogelarten wurden im Park
      nachgewiesen, von denen 134 hier brüten. Seit 1989 gehört das Gebiet zu den Important Bird Areas.


      Das Vogelreservat Krapje Đol war das erste seiner Art in Kroatien. Dort versammeln sich der
      [Löffler](/especie/platalea_leucorodia/) und verschiedene Reiher: [Graureiher](/especie/ardea_cinerea/),
      [Purpurreiher](/especie/ardea_purpurea/), [Seidenreiher](/especie/egretta_garzetta/),
      [Silberreiher](/especie/egretta_alba/), [Nachtreiher](/especie/nycticorax_nycticorax/) und Rallenreiher.
      Fast 10 % des europäischen Löfflerbestands brüten hier. Einst drohte das Reservat durch Entwässerung der
      Umgebung auszutrocknen; mit externer Hilfe wurde ein Zuleitungskanal von der Save gegraben, und 1991
      kehrten die Vögel zum Brüten zurück.


      Das zweite Reservat, Rakita, zeigt einen anderen Aspekt: Auf dem Winterzug rasten dort große Schwärme
      von Wildenten. Im Flutpolder von Mužilovčica weiden heimische Pferde und Schweine, während
      [Weißstorch](/especie/ciconia_ciconia/), [Schwarzstorch](/especie/ciconia_nigra/), Graureiher und
      Nachtreiher nach Nahrung suchen. Die [Weißstörche](/especie/ciconia_ciconia/) haben ihr eigenes Zentrum:
      Čigoč wurde 1994 zum ersten Europäischen Storchendorf gekürt, mit fast hundert Störchen in rund dreißig
      aktiven Nestern auf den Hausdächern und Scheunen.


      Weiter oben nistet der [Seeadler](/especie/haliaeetus_albicilla/) in gewässernahen Wäldern: 36 Paare,
      rund 15 % der kroatischen Population. Auf Feuchtwiesen und Seggenrieden brütet der
      [Wachtelkönig](/especie/crex_crex/). In den Altwässern leben der [Eurasische
      Fischotter](/especie/lutra_lutra/), die [Bechsteinfledermaus](/especie/myotis_bechsteinii/), die
      [Europäische Sumpfschildkröte](/especie/emys_orbicularis/) und der Laubfrosch; von den zwanzig
      Amphibienarten Kroatiens leben 16 im Park.
    visit: >-
      Beginne in einem der Informationszentren: Krapje mit einem Multimediaraum und Führern oder Čigoč, wo das
      Storchenprogramm startet (Einführung, Fernglasbeobachtung und Nestzählung). Für den Zutritt zu den
      Vogelreservaten musst du dich zuvor in Krapje oder Čigoč anmelden.


      Die Wanderwege sind einfach und thematisch gegliedert. Der Posavac-Weg, ein 4,2 km langer Rundkurs mit
      fünf Schautafeln, dauert zwei bis zweieinhalb Stunden und veranschaulicht die naturverträgliche
      Weidewirtschaft; er beginnt in Čigoč und bietet einen Aussichtsturm. Der Borderers' Trail verbindet
      Krapje und Orlinci mit Krapje Đol, Kroatiens größter Löfflerkolonie, und dauert etwa zweieinhalb bis
      drei Stunden. Der Haymaker Trail über 5 km dient der Vogelbeobachtung. Der Waldlehrpfad Tena ist ein 2,5
      km langer Rundweg mit 16 Schautafeln, der nur mit Parkführern begangen werden darf.


      Es gibt weitere Fortbewegungsmöglichkeiten. Im Zentrum von Krapje kann man Kanus mieten, um auf dem
      Kanal Veliki Strug zu paddeln, und das Lehrfloß Vodomar als beliebteste Bootsfahrt zieht an Weiden und
      Pappeln vorbei. Für Radfahrer ist die Posavina-Route mit 77,8 km entlang des linken Save-Ufers der
      attraktivste Weg. Der Eingang Repušnica ist mit der Bahn erreichbar.
    history: >-
      Die Landschaft entstand an der kroatischen Militärgrenze zwischen der Habsburgermonarchie und dem
      Osmanischen Reich auf der Grundlage einer gemeinschaftlichen Mehrartenbeweidung. Heute ist Lonjsko polje
      eines der letzten Gebiete Europas mit traditioneller Weidewirtschaft, bei der das Vieh frei auf weiten
      Weiden grast. Zu den autochthonen Rassen zählen das Posavina-Pferd, das kroatische Kaltblut, das
      slawonisch-syrmische Podolische Rind, die Posavina-Gans, der Posavina-Schweißhund und das
      Turopolje-Schwein, die am stärksten bedrohte Rasse.


      Krapje ist das einzige Dorf Kroatiens mit dem Status eines baukulturellen Denkmalortes. Der Naturpark
      wurde 1998 als Institution mit Sitz in Krapje eingerichtet und ist als Feuchtgebiet von internationaler
      Bedeutung der Ramsar-Konvention ausgewiesen.
    before: >-
      Da es sich um eine Flussaue handelt, solltest du dich vorab erkundigen, ob die Wege passierbar sind.
      Melde dich für die Vogelreservate und Aussichtspunkte in Krapje oder Čigoč an. Der Tena-Lehrpfad
      erfordert eine Führung und rechtzeitige Voranmeldung.
    around: >-
      Lonjsko polje hat keine direkten Nachbarn im Atlas, teilt aber Feuchtgebiete, Weidevieh und frei lebende
      Pferde mit anderen Orten. [Puerta de Güeldres / Corredor del Rin](/lugar/gelderse-poort/) und die
      [Reserva Natural de Millingerwaard](/lugar/millingerwaard/) sind feuchte Flusskorridore mit Rindern und
      Pferden, während der [Parque Nacional Kiskunság - Estepa de Bugac](/lugar/kiskunsagi---bugac-puszta/)
      traditionelle Weidewirtschaft teilt.
  it:
    intro: >-
      Quando il fiume cresce, qui nessuno si allarma: gli è stato concesso spazio. Lonjsko polje è una vasta
      piana golenale della Sava, in Croazia, dove da generazioni si convive con le acque invece di
      ostacolarle. Si estende per 50.650 ettari ed è una delle maggiori zone umide protette del bacino
      danubiano. Al ritirarsi della piena maiali, mucche e cavalli tornano ai pascoli e vi restano fino alle
      prime nevicate; in alto, sui tetti in legno, nidificano le cicogne.
    landscape: >-
      L'acqua governa ogni dinamica. Quasi il 70 % del parco è ammantato da foreste ripariali di farnia e
      frassino meridionale. I prati umidi allagabili occupano circa il 30 % del territorio e rimangono
      sommersi, in tutto o in parte, da 30 a 100 giorni quasi ogni anno.


      Una pianta sintetizza l'unicità di questi suoli: la marsilea a quattro foglie, quasi scomparsa in Europa
      a causa della bonifica delle zone umide, vegeta abbondante nei pascoli allagati della Sava.
    wildlife: >-
      Lonjsko polje è un paradiso per gli ornitologi: vi sono state censite 250 specie di uccelli, delle quali
      134 nidificanti. Dal 1989 fa parte delle Important Bird Areas.


      La riserva ornitologica di Krapje Đol è stata la prima istituita in Croazia. Vi si radunano la
      [spatola](/especie/platalea_leucorodia/) e diversi aironi: [airone cenerino](/especie/ardea_cinerea/),
      [airone rosso](/especie/ardea_purpurea/), [garzetta](/especie/egretta_garzetta/), [airone bianco
      maggiore](/especie/egretta_alba/), [nitticora](/especie/nycticorax_nycticorax/) e sgarza ciuffetto. Vi
      nidifica quasi il 10 % della popolazione europea di spatola. La riserva rischiò il prosciugamento per le
      bonifiche contermini; grazie a fondi internazionali venne scavato un canale dalla Sava e nel 1991 gli
      uccelli tornarono a riprodursi.


      La seconda riserva, Rakita, offre altre osservazioni: nei passi invernali accoglie grandi branchi di
      anatre selvatiche. Nella golena di Mužilovčica pascolano cavalli e maiali autoctoni, e si avvistano
      [cicogna bianca](/especie/ciconia_ciconia/), [cicogna nera](/especie/ciconia_nigra/), airone cenerino e
      nitticora. Le [cicogne](/especie/ciconia_ciconia/) hanno il proprio borgo: Čigoč è stato proclamato nel
      1994 primo Villaggio Europeo delle Cicogne, con quasi cento cicogne ospitate in una trentina di nidi
      attivi su tetti e fienili.


      In alto, l'[aquila di mare](/especie/haliaeetus_albicilla/) nidifica nelle foreste prossime alle grandi
      acque: 36 coppie, pari a circa il 15 % della consistenza croata. Nei prati da sfalcio e nei cariceti
      nidifica il [re di quaglie](/especie/crex_crex/). Nelle lanche vivono la [lontra
      europea](/especie/lutra_lutra/), il [vespertilio di Bechstein](/especie/myotis_bechsteinii/), la
      [testuggine palustre europea](/especie/emys_orbicularis/) e la raganella; delle venti specie di anfibi
      della Croazia, 16 vivono nel parco.
    visit: >-
      Inizia da uno dei centri visita: Krapje, fornito di una sala multimediale con guide che illustrano
      villaggio e parco, oppure Čigoč, dove comincia il percorso sulle cicogne (presentazione, binocoli e
      censimento dei nidi). Per accedere alle riserve ornitologiche è richiesta la registrazione a Krapje o a
      Čigoč.


      I percorsi sono agevoli e tematici. Il Posavac, anello di 4,2 km con cinque pannelli, si percorre tra
      due ore e due ore e mezza mostrando la coesistenza tra agricoltura tradizionale e natura; parte da Čigoč
      e comprende una torre d'avvistamento su uccelli e bestiame. Il Borderers' Trail collega Krapje e Orlinci
      a Krapje Đol, la maggiore colonia di spatole della Croazia, in circa due ore e mezza o tre. L'Haymaker
      Trail di 5 km è ideale per il birdwatching. Il sentiero forestale Tena è un circuito di 2,5 km con 16
      pannelli sul bosco planiziale, accessibile solo con guida del parco.


      Ci sono altri modi di muoversi. Al centro di Krapje si noleggia una canoa per pagaiare lungo il canale
      Veliki Strug, e la zattera didattica Vodomar, l'uscita in battello più richiesta, scivola tra salici e
      pioppi. In bicicletta la Rotta della Posavina è l'itinerario più affascinante, con 77,8 km lungo la
      sponda sinistra della Sava. L'accesso di Repušnica è raggiungibile in treno.
    history: >-
      Il paesaggio che ammiri è sorto lungo i Confini Militari croati, tra la monarchia asburgica e l'Impero
      ottomano, con un sistema di pascolo promiscuo comunitario. Oggi Lonjsko polje è una delle ultime aree
      d'Europa in cui persiste il pascolo tradizionale con il bestiame libero su grandi praterie. Le razze
      autoctone sono il cavallo di Posavina, il cavallo da tiro croato, il bovino podolico di Slavonia-Sirmia,
      l'oca di Posavina, il segugio di Posavina e il maiale di Turopolje, la più minacciata.


      Krapje è l'unico villaggio della Croazia insignito del titolo di borgo di valore architettonico. Il
      parco naturale è stato istituito come ente nel 1998 con sede a Krapje, ed è riconosciuto quale Zona
      Umida d'Importanza Internazionale dalla Convenzione di Ramsar.
    before: >-
      Essendo una pianura alluvionale, verifica in anticipo la percorribilità delle strade e delle carrarecce.
      Per accedere alle riserve ornitologiche e agli altri osservatori presentati ai centri di Krapje o Čigoč.
      Il sentiero Tena richiede accompagnatore e prenotazione.
    around: >-
      Lonjsko polje non ha siti vicini nell'atlas, ma condivide zone umide, bestiame e cavalli allo stato
      brado con altre realtà. La [Puerta de Güeldres / Corredor del Rin](/lugar/gelderse-poort/) e la [Reserva
      Natural de Millingerwaard](/lugar/millingerwaard/) sono corridoi fluviali alluvionali con vacche e
      cavalli, mentre il [Parque Nacional Kiskunság - Estepa de Bugac](/lugar/kiskunsagi---bugac-puszta/)
      condivide il pascolo tradizionale all'aperto.
  pt:
    intro: >-
      Quando as águas sobem, ninguém se assusta por aqui: reservou-se-lhes espaço. Lonjsko polje é uma
      planície de inundação do rio Sava, na Croácia, onde há séculos a população convive com a água em vez de
      a combater. Abrange 50.650 hectares e é uma das maiores zonas húmidas protegidas da bacia hidrográfica
      do Danúbio. Ao baixarem as águas, porcos, vacas e cavalos voltam às pastagens até à primeira neve; no
      cimo dos telhados de madeira, nidificam as cegonhas.
    landscape: >-
      A água dita todas as regras. Quase 70 % do parque está coberto por florestas ripícolas de carvalho-roble
      e freixo-de-folha-estreita. As pastagens alagáveis ocupam cerca de 30 % da superfície e ficam submersas,
      total ou parcialmente, entre 30 e 100 dias quase todos os anos.


      Há uma planta que traduz bem este equilíbrio: o trevo-de-quatro-folhas aquático, praticamente extinto na
      Europa pela drenagem dos pauis, continua abundante nos prados inundáveis do Sava.
    wildlife: >-
      Lonjsko polje é um destino de referência para a observação de aves: foram identificadas 250 espécies no
      parque, das quais 134 nidificam. Desde 1989 integra a lista de Áreas Importantes para as Aves.


      A reserva ornitológica de Krapje Đol foi a pioneira na Croácia. Ali juntam-se o
      [colhereiro-europeu](/especie/platalea_leucorodia/) e diversas garças:
      [garça-real-europeia](/especie/ardea_cinerea/), [garça-vermelha](/especie/ardea_purpurea/),
      [garcinha-branca](/especie/egretta_garzetta/), [garça-branca-grande](/especie/egretta_alba/),
      [savacu](/especie/nycticorax_nycticorax/) e o papa-ratos. Nidifica aqui cerca de 10 % da população
      europeia de colhereiro. A reserva chegou a correr risco de secar por drenagens vizinhas; com apoio
      exterior abriu-se um canal a partir do Sava e em 1991 as aves regressaram para nidificar.


      A segunda reserva, Rakita, apresenta outro atrativo: nas migrações de inverno congrega grandes bandos de
      patos bravos. Na zona de retenção de Mužilovčica pastam cavalos e suínos autóctones, avistando-se a
      [cegonha-branca](/especie/ciconia_ciconia/), a [cegonha-preta](/especie/ciconia_nigra/), garças-reais e
      savacus. As [cegonhas](/especie/ciconia_ciconia/) têm a sua capital: Čigoč foi proclamada em 1994 a
      primeira Aldeia Europeia das Cegonhas, reunindo quase cem cegonhas em cerca de trinta ninhos ativos em
      casas e palheiros.


      Nas alturas, a [águia-rabalva](/especie/haliaeetus_albicilla/) nidifica nas matas adjacentes aos corpos
      de água: 36 casais, perto de 15 % da população croata. Nos prados de feno e tufos de ciperáceas cria o
      [codornizão](/especie/crex_crex/). E nas lagoas residem a [lontra-europeia](/especie/lutra_lutra/), o
      [morcego-de-bechstein](/especie/myotis_bechsteinii/), o
      [cágado-de-carapaça-estriada](/especie/emys_orbicularis/) e a rela; das vinte espécies de anfíbios da
      Croácia, 16 vivem no parque.
    visit: >-
      Começa por um dos centros de acolhimento: Krapje, provido de sala multimédia com guias que apresentam a
      aldeia e o parque, ou Čigoč, ponto de partida do programa das cegonhas (palestra, observação com
      binóculos e contagem de ninhos). Para aceder às reservas ornitológicas deves registar-te previamente em
      Krapje ou Čigoč.


      Os percursos pedestres são acessíveis e variados. O Posavac, circuito de 4,2 km com cinco painéis,
      requer entre duas horas e duas horas e meia, demonstrando como se geriam campos e pastos em harmonia com
      a vida selvagem; principia em Čigoč e inclui uma torre de observação. O Borderers' Trail liga Krapje e
      Orlinci a Krapje Đol, a maior colónia de colhereiros da Croácia, demorando cerca de duas horas e meia a
      três horas. O Haymaker Trail, com 5 km, é propício ao birdwatching. E o percurso florestal Tena é um
      circuito de 2,5 km com 16 painéis sobre a mata de planície, percorrível apenas com guias do parque.


      Existem outras formas de circulação. No centro de Krapje aluga-se uma canoa para remar pelo canal Veliki
      Strug, e a balsa educativa Vodomar, a excursão de barco mais requisitada, passa entre salgueiros e
      choupos. Para bicicleta, a Rota da Posavina é o percurso mais apelativo, com 77,8 km ao longo da margem
      esquerda do Sava. Pela entrada de Repušnica chega-se de comboio.
    history: >-
      A paisagem que contemplas nasceu na Fronteira Militar croata, entre a monarquia dos Habsburgos e o
      Império Otomano, com um regime comunitário de pastoreio multiespecífico. Hoje Lonjsko polje é uma das
      últimas paragens da Europa onde se mantém o pastoreio tradicional, com gado solto em pastagens infindas.
      Entre as raças autóctones contam-se o cavalo de Posavina, o cavalo de tração croata, o gado podólico da
      Eslavónia-Sírmia, o ganso de Posavina, o perdigueiro de Posavina e o porco de Turopolje, a mais
      ameaçada.


      Krapje é a única povoação da Croácia classificada como aldeia de património arquitetónico. O parque
      natural foi constituído como entidade gestora em 1998 com sede em Krapje, figurando como Zona Húmida de
      Importância Internacional da Convenção de Ramsar.
    before: >-
      Por ser uma planície de inundação, confirma antecipadamente a transitabilidade dos caminhos. Para entrar
      nas reservas ornitológicas e noutros observatórios, deves dirigir-te aos postos de Krapje ou Čigoč. O
      trilho Tena exige guia oficial e aviso prévio.
    around: >-
      Lonjsko polje não tem destinos imediatos no atlas, mas partilha zonas húmidas, gado e cavalos em
      liberdade com outros sítios. A [Puerta de Güeldres / Corredor del Rin](/lugar/gelderse-poort/) e a
      [Reserva Natural de Millingerwaard](/lugar/millingerwaard/) são corredores aluviais que partilham vacas
      e cavalos, enquanto o [Parque Nacional Kiskunság - Estepa de Bugac](/lugar/kiskunsagi---bugac-puszta/)
      partilha a pastorícia extensiva tradicional.
