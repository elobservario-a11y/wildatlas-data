resumen:
  es: El último gran río salvaje de cauce ancho trenzado no canalizado de los Alpes del Norte.
  en: The last unconstrained, wide braided wild river system of the Northern Limestone Alps.
  fr: Le dernier grand cours d’eau sauvage à chenaux tressés et lit large non endigué des Alpes du Nord.
  de: Der letzte große wilde Fluss mit breitem, unverbaute verzweigtem Flussbett der Nordalpen.
  it: >-
    L’ultimo grande fiume selvaggio dell’arco alpino settentrionale con alveo intrecciato ad ampia divagazione
    non arginato.
  pt: O último grande rio selvagem de leito entrelaçado largo e desimpedido dos Alpes do Norte.
unico:
  es: El único parque natural de Tirol en el fondo de un valle, con un río que aún se mueve a su antojo.
  en: Tyrol’s only nature park centered on a valley floor, where an alpine river still shapes its course freely.
  fr: Le seul parc naturel du Tyrol établi en fond de vallée, doté d’une rivière qui divague encore à son gré.
  de: Tirols einziger Talboden-Naturpark, in dem sich ein Wildfluss noch völlig ungehindert sein Bett sucht.
  it: >-
    L’unico parco naturale del Tirolo situato sul fondovalle, percorso da un corso d’acqua che scorre ancora
    in totale libertà.
  pt: >-
    O único parque natural do Tirol implantado no fundo de um vale alpino, dotado de um rio que ainda molda o
    seu leito em liberdade.
observaciones:
  es: >-
    No se permiten hogueras en el espacio protegido; hay zonas de parrilla señaladas. Los perros van con
    correa en todo el espacio protegido. Sobrevolar el espacio con drones sin excepción de la autoridad está
    prohibido. Fuera de las carreteras públicas hay una prohibición general de circular con vehículos a motor.
    Está prohibido llevarse animales, hongos y plantas.
texto:
  es:
    intro: >-
      En los Alpes casi todos los ríos tienen dueño: muros, diques, centrales. El Lech tirolés, no. Es el
      último río salvaje del norte de los Alpes, y cada crecida lo recuerda: tras las lluvias y en el deshielo
      puede cambiar de cara en pocas horas. El Naturpark Tiroler Lech protege ese cauce que baja entre los
      Alpes de Allgäu y los de Lechtal, y los bosques de ribera, bancos de grava y valles laterales que lo
      acompañan.
    landscape: >-
      Un río salvaje se reconoce por lo que hace con las piedras. El Lech tiene tramos de cauce cambiante,
      bancos de grava y anchos bosques de ribera de sauce, aliso gris y pino seco. Esa grava es su columna
      vertebral: si se detuviera el transporte de piedras, el Lech se encajaría, desaparecerían los bancos y
      sería un río recto por el valle. De lejos todas las piedras parecen grises; de cerca hay verdes, rojas,
      rosas y blancas, y cada una cuenta cómo se formó.


      El suelo de la región es antiguo. En el Triásico superior, hace unos 220 millones de años, se formaron
      las capas de Raibl en mares someros con arrecifes. El espacio protegido, muy fragmentado, abarca
      altitudes de 810 a 1780 m, y sus parcelas se reparten desde la frontera alemana hasta la cabecera del
      Lech. Más arriba se levantan las Lechtaler Alpen, que alcanzan su punto más alto en la Parseierspitze,
      de 3036 m, el único tresmil de los Alpes calizos del norte.


      Esa mezcla de río y bosque tiene una consecuencia botánica: ninguna otra llanura fluvial de los Alpes
      del Norte sirve tanto de puente para las plantas entre los Alpes y el Jura. Aquí crece un tercio de las
      plantas de Tirol, 1.116 especies, y un tercio de ellas (392) son muy valiosas y están amenazadas.
      Destacan los enebros ribereños y los bancos de tamariza alemana.
    wildlife: >-
      Los bancos de grava son lugar de cría del andarríos chico y del chorlitejo chico. Sus puestas,
      camufladas entre las piedras, están amenazadas por las crecidas, los depredadores y las personas o los
      perros. Por eso hay que mantenerse en los caminos.


      En Fallerschein hay un puesto de observación de fauna donde se ve el [ciervo](/especie/cervus_elaphus/)
      sin molestarlo. Entre las plantas, una orquídea de flor en forma de zapato es sensible y prefiere los
      bosques de ribera semisombreados, y en el lago Riedener See el agua turquesa y muy calcárea brota de
      manantiales dentro del propio lago.


      En invierno hay salidas con un guía del parque para buscar huellas de animales y, en el valle, una pista
      de esquí de fondo de casi 40 km de Forchach a Steeg.
    visit: >-
      La casa del parque, la Naturparkhaus Klimmbrücke, está sobre un puente sobre el Lech, junto a Elmen. Es
      la sede de la administración del parque y alberga la exposición «Abenteuer Wildfluss». La exposición
      lleva a recorrer el río por los bancos de grava, valles laterales y bosques de ribera hasta los últimos
      animales y plantas del Lech. Desde la casa salen visitas guiadas con los mediadores de naturaleza del
      parque.


      El sendero botánico Jöchelspitze está entre los Alpes de Lechtal y los Alpes de Allgäu. La excursión a
      Fallerschein lleva al puesto de observación de fauna. Y el Riedener See es una parada corta para ver el
      agua.
    history: >-
      Hacia el 15 a. C. llegaron los romanos de Augusto, que construyeron la Via Claudia Augusta. El antiguo
      nombre «Lic» podría venir de los likatios, una tribu celta. Siglos después, los «Schwabenkinder», los
      niños mayores de las familias, cruzaban las montañas hacia el Allgäu, a los mercados de niños de Kempten
      o Isny, para trabajar una temporada.


      Para vivir en el valle se encauzó el Lech con muros y diques, y fue un error: allí donde el río había
      conservado su lecho ancho, los daños de las crecidas fueron menores. Hoy se va liberando de sus
      encauzamientos y se considera un ejemplo europeo de renaturalización lograda. Se planeó un parque
      nacional en el Lechtal, pero se optó por un parque natural, entre otros motivos por conflictos con la
      caza. En 2004 el gobierno del Tirol decidió crear una reserva natural declarada a la vez parque natural,
      y el Lech es zona Natura 2000 desde junio de 2000.
    before: >-
      No se permiten hogueras en el espacio protegido; hay zonas de parrilla señaladas. Los perros van con
      correa en todo el espacio protegido. Sobrevolar el espacio con drones sin excepción de la autoridad está
      prohibido. Fuera de las carreteras públicas hay una prohibición general de circular con vehículos a
      motor. Está prohibido llevarse animales, hongos y plantas.
    around: >-
      Otros espacios fluviales con los que comparte el tipo de corredor fluvial son el [Parque Nacional
      Gesäuse](/lugar/nationalpark-gesause---enns-gorge/), la [Garganta Superior del Río
      Aqueronte](/lugar/acheron-river-wild-upper-gorge/), las [Gargantas del Río
      Doubs](/lugar/gorges-du-doubs---franco-suisses/) y el [Alto Valle del Río
      Ain](/lugar/haute-vallee-de-l-ain/).
  en:
    intro: >-
      Across the European Alps almost every river is hemmed in by stone walls, flood embankments or hydropower
      dams. The Tyrolean Lech is the magnificent exception. It remains the last wild braided river of the
      Northern Alps, a dynamic force reaffirmed with every seasonal flood: following heavy rainfall and during
      spring snowmelt, its landscape can transform completely within hours. The Naturpark Tiroler Lech
      protects this braided gravel river flowing between the Allgäu and Lechtal Alps, along with its riparian
      gallery forests, dynamic gravel bars and pristine tributary valleys.
    landscape: >-
      You recognize a wild river by what it does with gravel and stone. The Lech features dynamically shifting
      multiple channels, expansive gravel islands and broad floodplain woodlands of willow, grey alder and dry
      pine forest. That bedload sediment forms its structural spine: if the natural transport of bedload
      gravel were halted, the Lech would incise into its floor, its gravel bars would vanish, and it would
      become a sterile, canalised river through the valley. From a distance, all river pebbles appear
      monochrome grey; viewed up close they reveal greens, reds, pinks and whites, each stone telling the
      story of its geological origins.


      The regional bedrock is ancient. During the Late Triassic, roughly 220 million years ago, the Raibl
      strata formed in shallow tropical seas fringed by reefs. The protected territory, highly fragmented into
      linear corridors, encompasses elevations spanning 810 to 1780 m, with protected parcels extending from
      the German border up to the headwaters of the Lech. High above tower the Lechtaler Alpen, culminating at
      Parseierspitze at 3036 m, the only three-thousand-metre peak in the entire Northern Limestone Alps.


      This continuous interface of river and forest yields a remarkable botanical result: no other alpine
      river corridor in the Northern Alps serves so effectively as an ecological corridor for plant dispersal
      between the Alps and the Jura. Here grows one third of all Tyrolean flora—1,116 distinct plant
      species—and one third of them (392) are highly prized and threatened. Riverine dwarf junipers and gravel
      bars of German tamarisk are especially celebrated.
    wildlife: >-
      The open gravel bars provide critical nesting grounds for the common sandpiper and little ringed plover.
      Their clutches, laid directly in camouflaged scrapes among gravel stones, are constantly vulnerable to
      floods, natural predators, and disturbance from careless people or roaming dogs. This makes remaining
      strictly on waymarked trails imperative.


      At Fallerschein a dedicated wildlife viewing station allows visitors to observe [red
      deer](/especie/cervus_elaphus/) without causing disturbance. Among flora, a delicate slipper-shaped
      orchid thrives in the semi-shaded floodplain forests, while in lake Riedener See, strikingly turquoise,
      highly mineralised water wells up from sub-lacustrine springs within the lake bed itself.


      During winter, guided ranger walks offer wildlife tracking in the snow, and down in the valley floor a
      continuous cross-country ski trail stretches nearly 40 km from Forchach to Steeg.
    visit: >-
      The park visitor centre, Naturparkhaus Klimmbrücke, is perched atop a bridge spanning the Lech near
      Elmen. It houses the park administration and the permanent interactive exhibition "Abenteuer Wildfluss".
      The display guides visitors along the river system across gravel banks, side valleys and floodplain
      woods to highlight the rare flora and fauna of the Lech. Guided outings led by official nature
      interpreters set out directly from the centre.


      The Jöchelspitze botanical trail traverses ridges between the Lechtal and Allgäu Alps. The outing to
      Fallerschein leads to the wildlife observation hide. And Riedener See provides an easy stop to marvel at
      deep turquoise waters.
    history: >-
      Around 15 BC, the Roman legions of Augustus arrived, eventually constructing the Via Claudia Augusta.
      The ancient hydronym "Lic" may trace its roots to the Likatier, an early Celtic tribe. Centuries later,
      the "Schwabenkinder"—older children from impoverished alpine families—trekked over the mountains into
      the Allgäu towards child labour markets in Kempten or Isny to work seasonal contracts.


      To secure farmland and settlements, nineteenth-century engineers channelised the Lech behind stone
      dykes, which proved counterproductive: where the river had retained its broad braided bed, flood
      destruction was far less severe. Today those artificial training works are progressively removed in what
      is heralded as a European benchmark for river restoration. While an official national park was
      originally envisioned for the Lechtal, authorities settled on a nature park, partly due to hunting
      stakeholder concerns. In 2004 the Tyrolean provincial government established a nature reserve combined
      with nature park status, and the Lech has been designated a Natura 2000 protected zone since June 2000.
    before: >-
      Open fires are strictly prohibited throughout the nature park; designated barbecue areas are provided.
      Dogs must be kept on leashes at all times across the protected areas. Operating drones without written
      permit from nature conservation authorities is prohibited. Off public motorways, driving motor vehicles
      is banned. Harvesting flora, fungi or taking fauna is strictly forbidden.
    around: >-
      Other dynamic river systems that share this braided fluvial corridor character include [Gesäuse National
      Park](/lugar/nationalpark-gesause---enns-gorge/), [Acheron River Wild Upper
      Gorge](/lugar/acheron-river-wild-upper-gorge/), [Gorges du
      Doubs](/lugar/gorges-du-doubs---franco-suisses/) and [Haute Vallée de
      l'Ain](/lugar/haute-vallee-de-l-ain/).
  fr:
    intro: >-
      Dans les Alpes, presque chaque rivière est corsetée : enrochements, digues et barrages hydroélectriques.
      Le Lech tyrolien fait figure d’exception grandiose. C’est le dernier grand fleuve sauvage du versant
      nord des Alpes, et chaque crue le démontre : après les pluies d’orage et au moment de la fonte nivale,
      son lit change de visage en l’espace de quelques heures. Le Naturpark Tiroler Lech protège ce cours
      tressé qui s’écoule entre les Alpes d’Allgäu et celles du Lechtal, ainsi que ses ripisylves, ses bancs
      de graviers mobiles et ses vallées affluentes préservées.
    landscape: >-
      Une rivière sauvage s’identifie à sa façon de remanier les alluvions. Le Lech déploie des bras tressés
      mouvants, de vastes bancs de galets et d’épaisses forêts alluviales de saules, d’aulnes blancs et de
      pins sylvestres xérophiles. Ce lit de galets forme son armature : si le charriage sédimentaire
      s’interrompait, le Lech s’enfoncerait, les atterrissements s’évanouiraient et il se muerait en un canal
      rectiligne au milieu du val. De loin, tous les galets semblent uniformément gris ; de près, ils
      scintillent de vert, de rouge, de rose et de blanc, chaque roche racontant son histoire géologique.


      Le socle de la contrée remonte au fond des âges. Au Trias supérieur, il y a environ 220 millions
      d’années, les couches de Raibl se sont déposées dans des mers chaudes bordées de récifs. L’espace
      protégé, très morcelé, s’étage de 810 à 1780 m d’altitude, égrenant ses parcelles depuis la frontière
      allemande jusqu’aux sources d’altitude. Plus haut se dressent les Lechtaler Alpen, dont le point
      culminant est la Parseierspitze à 3036 m, l’unique sommet dépassant trois mille mètres de tous les Alpes
      calcaires septentrionales.


      Cette symbiose entre cours d’eau et forêt recèle une portée floristique capitale : nulle autre plaine
      alluviale des Alpes du Nord ne constitue un tel corridor d’échange pour les plantes entre les Alpes et
      le Jura. S’y concentre un tiers de toute la flore du Tyrol, soit 1 116 espèces végétales, dont un tiers
      (392) s’avère d’une haute valeur patrimoniale et menacé. Les formations de genévriers fluviatiles et les
      colonies de myricaire d’Allemagne figurent parmi ses trésors.
    wildlife: >-
      Les atterrissements de graviers accueillent la nidification du chevalier guignette et du petit gravelot.
      Leurs pontes, dissimulées à même les galets, restent très vulnérables aux crues subites, aux prédateurs
      et au dérangement causé par les promeneurs ou les chiens divagants. C’est pourquoi il convient
      d’emprunter exclusivement les chemins aménagés.


      À Fallerschein, un observatoire de la faune sauvage permet d’admirer le [cerf
      élaphe](/especie/cervus_elaphus/) sans perturber sa quiétude. Côté flore, une orchidée précieuse en
      forme de sabot privilégie les boisements alluviaux de mi-ombre, tandis qu’au lac Riedener See, des eaux
      turquoise fortement calcaires sourdent directement de sources sous-lacustres.


      En hiver, des sorties accompagnées par un garde permettent de relever les traces d’animaux dans la
      neige, et une piste de ski de fond s’étire dans le fond de vallée sur près de 40 km de Forchach à Steeg.
    visit: >-
      La maison du parc, Naturparkhaus Klimmbrücke, est édifiée au-dessus d’un pont enjambant le Lech, près
      d’Elmen. Elle abrite les services administratifs et l’exposition permanente « Abenteuer Wildfluss ». Le
      parcours invite à explorer le fonctionnement de la rivière, des bancs de galets aux forêts de berge,
      jusqu’aux espèces animales et végétales emblématiques. Des sorties thématiques partent du bâtiment avec
      les médiateurs scientifiques du parc.


      Le sentier botanique de la Jöchelspitze se déploie entre les Alpes du Lechtal et les Alpes d’Allgäu.
      L’excursion vers Fallerschein mène au mirador faunistique. Enfin, le Riedener See offre une halte
      paisible pour contempler ses eaux cristallines.
    history: >-
      Vers 15 av. J.-C., les légions romaines d’Auguste ont conquis la région, traçant la Via Claudia Augusta.
      L’ancien toponyme « Lic » dériverait des Licates, une tribu celtique locale. Bien plus tard, les «
      Schwabenkinder », les enfants plus âgés des familles démunies de montagne, franchissaient les crêtes
      vers l’Allgäu pour louer leurs bras sur les foires d’embauche de Kempten ou d’Isny.


      Pour coloniser le fond de vallée, les hommes ont corseté le Lech de digues en pierre, ce qui s’est
      révélé être une lourde erreur : là où la rivière avait gardé un lit large et tressé, les ravages des
      crues se sont montrés bien moins destructeurs. De nos jours, ces digues sont progressivement démantelées
      dans ce qui est regardé comme un modèle européen de renaturation fluviale. Un parc national avait été
      initialement projeté dans le Lechtal, mais un parc naturel lui fut préféré en raison notamment des
      usages cynégétiques. En 2004, le gouvernement tyrolien a décrété une réserve naturelle doublée du statut
      de parc naturel, et le cours du Lech est classé en zone Natura 2000 depuis juin 2000.
    before: >-
      Les feux en plein air sont formellement interdits dans le périmètre protégé, des aires de grillade
      aménagées étant prévues à cet effet. Les chiens doivent être tenus en laisse sur l’ensemble du parc. Le
      survol par drones sans dérogation préfectorale est prohibé. En dehors des voies publiques, la
      circulation des véhicules à moteur est strictement bannie. Il est interdit d’emporter faune, champignons
      et plantes.
    around: >-
      Parmi les autres cours d’eau qui partagent ce caractère de corridor sauvage préservé figurent le [Parc
      national de Gesäuse](/lugar/nationalpark-gesause---enns-gorge/), les [Gorges supérieures de
      l’Achéron](/lugar/acheron-river-wild-upper-gorge/), les [Gorges du
      Doubs](/lugar/gorges-du-doubs---franco-suisses/) et la [Haute Vallée de
      l’Ain](/lugar/haute-vallee-de-l-ain/).
  de:
    intro: >-
      In den Alpen sind fast alle Flüsse gezähmt: Ufermauern, Hochwasserdämme, Kraftwerke. Der Tiroler Lech
      ist die große Ausnahme. Er ist der letzte ungebändigte Wildfluss der Nordalpen, und jedes Hochwasser
      beweist es: Nach Starkregen und zur Schneeschmelze kann er binnen weniger Stunden sein Gesicht
      verwandeln. Der Naturpark Tiroler Lech schützt dieses verzweigte Flussbett zwischen Allgäuer und
      Lechtaler Alpen samt seinen Auwäldern, Schotterbänken und naturnahen Seitentälern.
    landscape: >-
      Einen echten Wildfluss erkennt man an seiner Umlagerungsdynamik. Der Lech besitzt dynamische
      Mehrbettgerinne, weite Schotterinseln und ausgedehnte Auwälder aus Weiden, Grauerlen und
      Schneeheide-Kiefern. Diese Geschiebefracht ist sein Rückgrat: Würde der Geschiebetransport unterbunden,
      würde sich der Lech eintiefen, die Schotterbänke verschwänden, und er verflachte zu einem kanalisierten
      Talfluss. Aus der Ferne wirken die Flusssteine eintönig grau; aus der Nähe zeigen sich grüne, rote, rosa
      und weiße Kiesel, von denen jeder seine erdgeschichtliche Entstehung erzählt.


      Das geologische Fundament ist uralt. In der Obertrias vor rund 220 Millionen Jahren lagerten sich die
      Raibler Schichten in flachen Riffmeeren ab. Das geschützte Gebiet, stark bandförmig gegliedert, umfasst
      Höhenlagen von 810 bis 1780 m, wobei sich die Schutzflächen von der deutschen Staatsgrenze bis zu den
      Quellbächen hinaufziehen. Hoch darüber erheben sich die Lechtaler Alpen mit ihrem höchsten Gipfel, der
      Parseierspitze mit 3036 m – dem einzigen Dreitausender der gesamten Nördlichen Kalkalpen.


      Aus diesem Zusammenspiel von Wildfluss und Wald resultiert eine botanische Besonderheit: Kein anderer
      alpiner Talraum der Nordalpen fungiert in diesem Maße als Ausbreitungsbrücke für Pflanzenarten zwischen
      den Alpen und dem Jura. Hier wächst ein Drittel der gesamten Tiroler Flora – 1.116 Pflanzenarten, von
      denen ein Drittel (392) als wertvoll und gefährdet eingestuft ist. Hervorzuheben sind die
      Ufer-Wacholderbestände und die Kolonien der Deutschen Tamariske.
    wildlife: >-
      Die Schotterbänke bilden unverzichtbare Brutbiotope für Flussuferläufer und Flussregenpfeifer. Ihre
      Gelege, perfekt getarnt zwischen den Steinen, sind durch Schwallwellen, Fressfeinde und unachtsame
      Spaziergänger oder freilaufende Hunde akut bedroht. Deshalb gilt das strikte Gebot, auf den markierten
      Wegen zu bleiben.


      In Fallerschein ermöglicht eine Wildbeobachtungsstation den Blick auf das
      [Rotwild](/especie/cervus_elaphus/), ohne die Tiere zu stören. In der Pflanzenwelt schätzt eine seltene
      Orchidee mit schuhförmiger Lippe halbschattige lichte Auwälder, während im Riedener See auffallend
      türkisblaues, kalkgesättigtes Quellwasser aus unterseeischen Trichtern zutage tritt.


      Im Winter bieten Rangerführungen Spurenlese im Schnee an, und im Talboden verläuft eine durchgehende
      Langlaufloipe von fast 40 km Länge von Forchach bis Steeg.
    visit: >-
      Das Naturparkhaus Klimmbrücke ruht auf einer Brückenkonstruktion direkt über dem Lech bei Elmen. Es ist
      Sitz der Naturparkverwaltung und beherbergt die interaktive Erlebnisausstellung „Abenteuer Wildfluss“.
      Die Schau führt Besucher durch das Flussbett über Kiesbänke, Nebentäler und Auwälder bis zu den
      seltensten Tieren und Pflanzen des Lechraums. Vom Naturparkhaus starten geführte Exkursionen mit
      ausgebildeten Naturführern.


      Der botanische Lehrpfad Jöchelspitze verläuft am Übergang zwischen Lechtaler und Allgäuer Alpen. Die
      Wanderung nach Fallerschein erschließt die Wildbeobachtungsstation. Der Riedener See eignet sich
      hervorragend für eine kurze Rast am türkisblauen Wasser.
    history: >-
      Um 15 v. Chr. zogen die römischen Legionen des Augustus ein und errichteten die Via Claudia Augusta. Der
      alte Flussname „Lic“ geht vermutlich auf den keltischen Stamm der Likatier zurück. Jahrhunderte später
      zogen die „Schwabenkinder“ – ältere Kinder armer Bergbauernfamilien – über die Pässe ins Allgäu, um sich
      auf den Gesindemärkten in Kempten oder Isny als Saisonarbeiter zu verdingen.


      Um den Talraum urbar zu machen, wurde der Lech im neunzehnten Jahrhundert durch Dämme eingeengt – ein
      fataler Irrtum, denn dort, wo der Fluss sein breites Bett behalten durfte, fielen spätere
      Hochwasserschäden deutlich geringer aus. Heute werden die alten Verbauungen schrittweise rückgebaut, was
      als europäisches Paradebeispiel gelungener Flussrenaturierung gilt. Ursprünglich war im Lechtal ein
      Nationalpark angedacht, doch man entschied sich unter anderem wegen Jagdinteressen für einen Naturpark.
      Im Jahr 2004 beschloss die Tiroler Landesregierung die Ausweisung als Naturschutzgebiet mit
      Naturparkprädikat, und seit Juni 2000 ist der Lech als Natura-2000-Gebiet geschützt.
    before: >-
      Offenes Feuer ist im gesamten Schutzgebiet verboten; dafür stehen gekennzeichnete Grillplätze bereit.
      Hunde sind im gesamten Schutzgebiet ausnahmslos an der Leine zu führen. Das Aufsteigenlassen von Drohnen
      ohne naturschutzbehördliche Ausnahmegenehmigung ist untersagt. Abseits öffentlicher Straßen herrscht ein
      generelles Fahrverbot für Kraftfahrzeuge. Das Entnehmen von Tieren, Pilzen und Pflanzen ist verboten.
    around: >-
      Zu den alpinen Flussläufen, die diesen Charakter eines dynamischen Flusskorridors teilen, zählen der
      [Nationalpark Gesäuse](/lugar/nationalpark-gesause---enns-gorge/), die [Wilde Obere
      Acheron-Schlucht](/lugar/acheron-river-wild-upper-gorge/), die
      [Doubs-Schluchten](/lugar/gorges-du-doubs---franco-suisses/) und das [Obere
      Ain-Tal](/lugar/haute-vallee-de-l-ain/).
  it:
    intro: >-
      Nelle Alpi quasi ogni corso d’acqua è imbrigliato: arginature in muratura, dighe, sbarramenti
      idroelettrici. Il Lech tirolese rappresenta la grandiosa eccezione. È l’ultimo fiume selvaggio a canali
      intrecciati delle Alpi settentrionali, come ogni piena stagionale ricorda: dopo violenti temporali o
      durante il disgelo primaverile, il suo letto può mutare aspetto nel giro di poche ore. Il Naturpark
      Tiroler Lech tutela questo letto fluviale ghiaioso che scorre tra le Alpi dell’Allgäu e le Alpi della
      Lechtal, assieme alle foreste golenali, ai banchi alluvionali e alle valli laterali rimaste intatte.
    landscape: >-
      Un corso d’acqua selvaggio si riconosce dalla sua incessante opera di trasporto e modellamento dei
      ciottoli. Il Lech presenta canali mutevoli e intrecciati, ampi isolotti ghiaiosi e dense fasce ripariali
      di salici, ontani bianchi e pinete a pino silvestre ed erica. Questo carico alluvionale costituisce la
      sua spina dorsale: se il trasporto solido venisse interrotto, il Lech si approfondirebbe nel substrato,
      i banchi ghiaiosi sparirebbero ed esso diverrebbe un canale rettilineo nel fondovalle. Da lontano i
      ciottoli sembrano uniformemente grigi; da vicino si svelano granuli verdi, rossi, rosa e bianchi, e
      ciascun sasso narra la propria genesi geologica.


      Il basamento geologico è antichissimo. Nel Triassico superiore, circa 220 milioni di anni fa, gli strati
      di Raibl si depositarono in mari caldi costellati di scogliere. L’area protetta, frammentata a nastro
      lungo il corso fluviale, copre quote comprese tra 810 e 1780 m, estendendosi dal confine di stato
      tedesco fino alle sorgenti montane. Più in alto svettano le Lechtaler Alpen, culminanti nella
      Parseierspitze a 3036 m, l’unica vetta di oltre tremila metri di tutte le Alpi Calcaree Settentrionali.


      Questo intreccio costante fra acque e boschi genera una rilevanza botanica straordinaria: nessun’altra
      piana alluvionale delle Alpi Settentrionali funge altrettanto da corridoio biogeografico per la
      propagazione floristica tra le Alpi e il Giura. Qui vegeta un terzo dell’intera flora del Tirolo, ossia
      1.116 specie vascolari, e un terzo di esse (392) possiede un alto valore di conservazione ed è
      considerato minacciato. Risaltano i gineprai ripariali e i banchi colonizzati dalla miricaria germanica.
    wildlife: >-
      I banchi di ghiaia offrono l’habitat ideale per la riproduzione del piro-piro piccolo e del corriere
      piccolo. Le loro covate, deposte senza nido tra i sassi, sono costantemente esposte a piene improvvise,
      predatori e al calpestio involontario di escursionisti o cani sciolti. Per questa ragione è
      indispensabile rimanere sempre sui tracciati segnalati.


      A Fallerschein un apposito capanno di osservazione faunistica permette di avvistare il [cervo
      nobile](/especie/cervus_elaphus/) senza recargli alcun disturbo. Tra le presenze botaniche spicca una
      delicata orchidea a forma di scarpetta, amante dei boschi golenali in mezz’ombra, mentre nel laghetto
      Riedener See acque straordinariamente turchesi e ricche di calcare scaturiscono da sorgenti subacquee
      nel fondale.


      In inverno i guardaparco guidano uscite didattiche per riconoscere le tracce sulla neve, e sul
      fondovalle si sviluppa una pista per lo sci di fondo di quasi 40 km che collega Forchach a Steeg.
    visit: >-
      Il centro del parco, Naturparkhaus Klimmbrücke, sorge su una struttura a ponte sopra il Lech, nei pressi
      di Elmen. Ospita gli uffici amministrativi e l’allestimento interattivo «Abenteuer Wildfluss». Il
      percorso museale illustra le dinamiche del fiume attraverso banchi ghiaiosi, valli tributarie e foreste
      riparie fino agli animali e alle piante più rari del comprensorio. Dal centro prendono il via escursioni
      guidate con gli educatori ambientali del parco.


      Il sentiero botanico della Jöchelspitze si snoda sullo spartiacque fra le Alpi della Lechtal e quelle
      dell’Allgäu. L’itinerario verso Fallerschein conduce alla postazione di osservazione dei cervi. Il
      Riedener See rappresenta una tappa consigliata per ammirare le acque limpide.
    history: >-
      Attorno al 15 a.C. giunsero le legioni romane di Augusto, che realizzarono la Via Claudia Augusta.
      L’antico idronimo «Lic» deriverebbe dai Licati, popolazione celtica della zona. Secoli più tardi, gli
      «Schwabenkinder» – i figli maggiori delle famiglie contadine povere – attraversavano i valichi verso
      l’Allgäu per essere ingaggiati nei mercati stagionali di manodopera infantile a Kempten o Isny.


      Per colonizzare il fondovalle, il corso del Lech venne arginato con muri e scogliere nel corso
      dell’Ottocento, rivelandosi un errore grave: dove il fiume aveva conservato il suo ampio letto naturale,
      i danni provocati dalle esondazioni furono notevolmente inferiori. Oggi tali opere artificiali vengono
      progressivamente rimosse, costituendo un modello europeo di rinaturazione fluviale. Originariamente era
      stato progettato un parco nazionale nella Lechtal, ma si optò infine per un parco naturale anche a causa
      delle istanze venatorie. Nel 2004 il governo tirolese ha istituito l’area protetta con la qualifica di
      parco naturale, e il Lech è riconosciuto zona protetta Natura 2000 fin dal giugno 2000.
    before: >-
      È vietato accendere fuochi liberi nell’area protetta; sono a disposizione aree attrezzate per il
      barbecue. I cani devono essere tenuti al guinzaglio in ogni settore. L’impiego di droni senza apposita
      deroga dell’autorità di tutela ambientale è interdetto. Al di fuori delle strade statali vige il divieto
      generale di circolazione per veicoli a motore. È proibito raccogliere funghi, piante o asportare
      animali.
    around: >-
      Altri bacini fluviali che condividono la tipologia di corridoio naturale continuo includono il [Parco
      Nazionale Gesäuse](/lugar/nationalpark-gesause---enns-gorge/), la [Gola Superiore del Fiume
      Acheronte](/lugar/acheron-river-wild-upper-gorge/), le [Gole del Fiume
      Doubs](/lugar/gorges-du-doubs---franco-suisses/) e l’[Alta Valle del Fiume
      Ain](/lugar/haute-vallee-de-l-ain/).
  pt:
    intro: >-
      Nos Alpes quase todos os cursos de água foram aprisionados: quebra-mares, diques, centrais
      hidroelétricas. O Lech tirolês é a magnífica exceção. Trata-se do último grande rio selvagem do norte
      dos Alpes, e cada enchente o confirma: a seguir às tempestades e na época do degelo, o seu perfil pode
      alterar-se totalmente em poucas horas. O Naturpark Tiroler Lech protege esta calha entrelaçada que desce
      entre os Alpes de Allgäu e os de Lechtal, bem como as galerias ripícolas, os bancos de cascalho e os
      vales tributários adjacentes.
    landscape: >-
      Um rio selvagem reconhece-se pela forma como mobiliza os inertes. O Lech possui braços fluviais em
      constante mutação, amplos bancos de seixos e extensas matas aluviais de salgueiros, amieiros-brancos e
      pinheiros-silvestres xerófilos. Esse cascalho solto constitui a sua coluna dorsal: se o arrastamento de
      sedimentos fosse travado, o Lech aprofundar-se-ia no substrato, os ilhéus de cascalho evaporar-se-iam e
      transformar-se-ia num canal artificial pelo vale adentro. Vistos de longe, todos os seixos parecem
      cinzentos; de perto cintilam em tons de verde, vermelho, rosa e branco, e cada calhau conta a história
      da sua formação geológica.


      O substrato rochoso é muito antigo. No Triássico Superior, há cerca de 220 milhões de anos,
      depositaram-se as camadas de Raibl em mares pouco profundos rodeados de recifes. O território protegido,
      muito fragmentado em faixas lineares, abrange cotas que vão dos 810 aos 1780 m, espalhando as suas
      parcelas desde a fronteira com a Alemanha até às nascentes de montanha. Mais acima elevam-se as
      Lechtaler Alpen, cujo cume culminante é a Parseierspitze com 3036 m, o único três mil de todos os Alpes
      Calcários Setentrionais.


      Esta simbiose contínua entre rio e floresta produz um efeito botânico de primeira grandeza: nenhuma
      outra planície de inundação dos Alpes do Norte serve com tanta eficácia de corredor de dispersão
      florística entre os Alpes e o Jura. Aqui vegeta um terço de toda a flora do Tirol, reunindo 1.116
      espécies vegetais, das quais um terço (392) exibe grande valor conservacionista e encontra-se ameaçado.
      Destacam-se os povoamentos ribeirinhos de zimbro e os bancos colonizados pela tamargueira-alemã.
    wildlife: >-
      Os bancos de cascalho constituem áreas de nidificação primordiais para o maçarico-das-rochas e o
      borrelho-pequeno-de-coleira. As suas posturas, camufladas no meio dos seixos soltos, estão sob
      permanente ameaça de cheias repentinas, predadores naturais e perturbação involuntária de caminhantes ou
      cães soltos. Daí a necessidade rigorosa de permanecer nos trilhos assinalados.


      Em Fallerschein existe um posto de observação de fauna que faculta o avistamento do
      [veado-vermelho](/especie/cervus_elaphus/) sem gerar inquietação. No reino vegetal, uma orquídea
      singular com flor em forma de sapatinho prefere as matas aluviais de meia-sombra, enquanto na lagoa de
      Riedener See águas de um turquesa luminoso e ricas em calcário borbulham a partir de nascentes
      subaquáticas no fundo do lago.


      No inverno organizam-se saídas com vigilantes da natureza para interpretar pegadas na neve, e no fundo
      do vale estende-se uma pista de esqui de fundo de quase 40 km entre Forchach e Steeg.
    visit: >-
      A sede interpretativa do parque, Naturparkhaus Klimmbrücke, ergue-se numa estrutura em ponte sobre o
      próprio rio Lech, junto a Elmen. Acolhe a equipa gestora e a exposição interativa «Abenteuer Wildfluss».
      A mostra conduz os visitantes através da dinâmica do leito, entre ilhotas fluviais, vales afluentes e
      matas ripícolas, até aos animais e plantas mais emblemáticos da bacia. A partir do centro partem visitas
      guiadas orientadas pelos monitores da natureza.


      O trilho botânico de Jöchelspitze serpenteia entre os Alpes de Lechtal e os Alpes de Allgäu. A caminhada
      até Fallerschein conduz ao posto de observação de cervídeos. E o Riedener See convida a uma pausa
      tranquila para apreciar as águas transparentes.
    history: >-
      Por volta de 15 a.C. chegaram as legiões de Augusto, que abriram a Via Claudia Augusta. O velho
      hidrónimo «Lic» poderá radicar nos Likatier, um povo celta local. Séculos mais tarde, as
      «Schwabenkinder» – crianças mais velhas de famílias desfavorecidas da montanha – cruzavam os
      desfiladeiros em direção a Allgäu para trabalhar por temporadas nas feiras de contratação de Kempten ou
      Isny.


      Para ocupar o vale, os habitantes canalizaram o Lech com muros e quebra-mares no século XIX,
      revelando-se um erro manifesto: onde o rio conservara o leito largo entrelaçado, as devastações
      provocadas pelas cheias foram consideravelmente menores. Hoje tais estruturas artificiais estão a ser
      gradualmente desmontadas, num processo tido como referência europeia de renaturalização fluvial. Foi
      equacionada a criação de um parque nacional no Lechtal, mas acabou por se aprovar um parque natural, em
      parte por conciliação com os setores cinegéticos. Em 2004 o governo do Tirol aprovou a classificação
      como reserva natural com estatuto de parque natural, integrando o Lech a rede Natura 2000 desde junho de
      2000.
    before: >-
      Fogueiras são proibidas no perímetro protegido; existem locais sinalizados para churrascos. Os cães têm
      de circular sempre com trela no parque. O voo de drones sem autorização prévia das autoridades de
      conservação é interdito. Fora das estradas públicas é expressamente proibido circular com veículos a
      motor. É proibido colher plantas, cogumelos ou recolher animais.
    around: >-
      Outros corredores fluviais que partilham a morfologia de leito dinâmico em montanha englobam o [Parque
      Nacional Gesäuse](/lugar/nationalpark-gesause---enns-gorge/), o [Desfiladeiro Superior do Rio
      Aqueronte](/lugar/acheron-river-wild-upper-gorge/), as [Gargantas do Rio
      Doubs](/lugar/gorges-du-doubs---franco-suisses/) e o [Alto Vale do Rio
      Ain](/lugar/haute-vallee-de-l-ain/).
