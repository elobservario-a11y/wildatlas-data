resumen:
  es: >-
    Unido al Parque Nacional francés del Mercantour, constituye un espacio transfronterizo alpino-mediterráneo
    gigantesco coronado por el Monte Argentera (3.297 m).
  en: >-
    United with France's Mercantour National Park, it forms a massive cross-border Alpine-Mediterranean
    wilderness crowned by Mount Argentera (3,297 m).
  fr: >-
    Uni au parc national français du Mercantour, il constitue un vaste espace transfrontalier
    alpino-méditerranéen dominé par le mont Argentera (3 297 m).
  de: >-
    Verbunden mit dem französischen Nationalpark Mercantour bildet er ein gewaltiges grenzüberschreitendes
    Schutzgebiet, gekrönt vom Monte Argentera (3.297 m).
  it: >-
    Unito al Parco Nazionale francese del Mercantour, costituisce uno spazio transfrontaliero
    alpino-mediterraneo maestoso coronato dal Monte Argentera (3.297 m).
  pt: >-
    Unido ao Parque Nacional francês de Mercantour, forma um imenso território transfronteiriço
    alpino-mediterrânico dominado pelo Monte Argentera (3.297 m).
unico:
  es: >-
    Aquí viven los glaciares más meridionales de los Alpes, a un paso del Mediterráneo, y a su sombra crece
    una flora de refugio con endemismos que no existen en ningún otro sitio.
  en: >-
    Here lie the southernmost glaciers in the Alps just steps from the Mediterranean, sheltering an endemic
    flora that exists nowhere else.
  fr: >-
    Ici subsistent les glaciers les plus méridionaux des Alpes, à deux pas de la Méditerranée, à l'ombre
    desquels s'épanouit une flore de refuge comptant des endémiques uniques au monde.
  de: >-
    Hier befinden sich die südlichsten Gletscher der gesamten Alpen unweit des Mittelmeers, in deren Schatten
    eine schutzwürdige Refugialflora mit einzigartigen Endemiten gedeiht.
  it: >-
    Qui resistono i ghiacciai più meridionali dell'intero arco alpino a breve distanza dal Mediterraneo,
    all'ombra dei quali vegeta una flora di rifugio ricca di endemismi.
  pt: >-
    Aqui resistem os glaciares mais meridionais de todos os Alpes a curta distância do Mediterrâneo,
    albergando uma flora relíquia com endemismos exclusivos.
observaciones:
  es: >-
    Los perros deben ir siempre atados y solo por los recorridos permitidos. Los aeromodelos están siempre
    prohibidos, y los drones solo se permiten con autorización por motivos profesionales. En el Parque Alpi
    Marittime se puede vivaquear desde una hora antes del ocaso hasta una hora después del alba. Está
    prohibido encender fuego en el suelo en cualquier época, salvo en las áreas equipadas, y dar comida o sal
    a los animales para atraerlos. Comprueba con el ente de gestión los centros y las rutas antes de salir.
texto:
  es:
    intro: >-
      Los reyes de Saboya cazaban aquí. En 1857 Víctor Manuel II creó la Reserva Real de caza de
      Valdieri-Entracque, y de aquella reserva, convertida en parque en 1980, nace hoy el área protegida más
      grande del Piamonte. Lo que antes era un coto cerrado es ahora un laberinto de valles estrechos, cumbres
      que llegan a 3.297 m y lagos glaciares que se pueden recorrer a pie, con la [cabra
      montés](/especie/capra_ibex/) como vecina y las [marmotas](/especie/marmota_marmota/) avisando con sus
      silbidos de que llegan caminantes.
    landscape: >-
      El parque ocupa el alto valle Gesso, el alto valle Grande di Palanfrè y los barrancos de la Valletta y
      del Reduc. Casi todo cae en la cuenca del torrente Gesso, que baja en línea casi recta unos 25 km hacia
      la llanura de Cuneo. El terreno sube desde los 750 m hasta los 3.297 m, entre los grupos del Gelàs y de
      la Argentera.


      Es un paisaje áspero. Casi la mitad de la superficie, un 47 %, son rocas y derrubios. Como la roca
      cristalina resiste muy bien la erosión, los valles son estrechos y encajados, las laderas muy empinadas
      y el bosque queda reducido. Los glaciares hicieron el resto: los valles principales tienen perfil en U
      y, en la cabecera de cada uno, un circo glaciar extinguido guarda lagos de origen glaciar. Quedan
      nevados perennes y unos pocos restos de glaciares de tipo pirenaico, y los del Monte Gelàs son los más
      meridionales de toda la cadena alpina.


      La vegetación sube por pisos. En el montano mandan los hayedos, que cubren la mayor parte del bosque,
      con abetales blancos en el valle Pesio y pinares de pino negro en el valle Carnino. En el subalpino
      aparecen rododendros, alisos y enebros entre los pastos, y los gias, los antiguos refugios del ganado en
      verano, dejan un suelo tan rico en materia orgánica que allí crece una vegetación propia. Más arriba, en
      el piso alpino, los neveros aguantan todo el año en algunos circos y canales orientados al norte.
    wildlife: >-
      El parque se ha ganado fama de zona de refugio de los Alpes: por su posición meridional y su cercanía al
      mar, su catálogo florístico llega a unas 1.800 especies, con trece endemismos y dos microendemismos.
      Entre las rocas del piso alpino crecen Saxifraga florulenta, Galium tendae y Silene cordifolia, y en los
      pedregales Viola valderia y Viola argenteria. En la zona de Valdieri sobrevive incluso una población
      relicta de sabina fenicia, testigo de una antigua penetración mediterránea.


      Entre los animales, el [rebeco](/especie/rupicapra_rupicapra/) es el símbolo del parque y el ungulado
      más extendido, con más de 4.000 ejemplares. La [cabra montés](/especie/capra_ibex/) volvió después de
      que desde 1920 se hicieran sueltas con animales del Gran Paradiso, y vive normalmente más alto que el
      rebeco. La [marmota](/especie/marmota_marmota/) es social y muy fácil de observar. Con el
      [lobo](/especie/canis_lupus/) de vuelta en los Alpes Marítimos, el muflón se ha vuelto presa fácil,
      sobre todo en la nieve, y eso frena su expansión.


      Para las aves, mira hacia arriba y hacia los pedregales. Unas ochenta especies pueblan el parque y 75
      crían aquí: el [águila real](/especie/aquila_chrysaetos/) entre las rapaces, la perdiz nival y el [gallo
      lira](/especie/tetrao_tetrix/) entre las gallináceas de montaña, y el
      [treparriscos](/especie/tichodroma_muraria/) en las paredes. Desde 1993 el parque colabora con el
      Mercantour en la reintroducción del [quebrantahuesos](/especie/gypaetus_barbatus/); hasta 2006 se
      soltaron ocho parejas de jóvenes en el Piamonte. También hay mariposas: unas cincuenta formas endémicas
      de los Alpes Marítimos y Cocios, y alguna exclusiva del valle Gesso, como Parnassius apollo
      valderiensis, en las Terme di Valdieri.
    visit: >-
      El Centro Uomini e Lupi tiene dos partes: el centro de visitantes en el pueblo de Entracque y el área
      faunística de Casermette. En las Terme di Valdieri hay otro centro con una exposición permanente sobre
      las áreas protegidas del valle Gesso, y junto a las termas, el Jardín Botánico Valderia reúne unas 500
      especies en catorce ambientes que representan los principales ecosistemas de los Alpes Marítimos. En
      Entracque, la exposición permanente Ultimi ghiacci cuenta el cambio climático en los Alpes del
      Mediterráneo, y en Sant'Anna di Valdieri el Museo della Civiltà della Segale reúne historias y
      tradiciones que tienen el centeno como hilo común.


      Para caminar, el ente de gestión remite al portal de excursionismo Trekking nelle Alpi del Mediterraneo:
      permite filtrar por localidad, longitud, duración y dificultad, y de cada ruta hay descripción y track
      GPS descargable. Los numerosos refugios del parque permiten excursiones de varios días, y las travesías
      pueden prolongarse hasta el Mercantour, al otro lado de la frontera.


      Y si ves una cabra montés o un rebeco con marcas auriculares o collar, anota dónde y de qué colores son
      las marcas y, si puedes, saca una foto: el parque pide ese aviso como ciencia ciudadana.
    history: >-
      El parque nació en 1980 como Parco Naturale dell'Argentera, y en 1993 recibió el Diploma Europeo de
      Áreas Protegidas. Comparte más de un tercio de sus límites, al sur y al suroeste, con el Parque Nacional
      francés del Mercantour, y los dos llevan más de treinta años hermanados.
    before: >-
      Los perros deben ir siempre atados y solo por los recorridos permitidos. Los aeromodelos están siempre
      prohibidos, y los drones solo se permiten con autorización por motivos profesionales. En el Parque Alpi
      Marittime se puede vivaquear desde una hora antes del ocaso hasta una hora después del alba. Está
      prohibido encender fuego en el suelo en cualquier época, salvo en las áreas equipadas, y dar comida o
      sal a los animales para atraerlos. Comprueba con el ente de gestión los centros y las rutas antes de
      salir.
    around: >-
      El [Parc National du Mercantour](/lugar/parc-national-du-mercantour/) está a unos 1 km al otro lado de
      la frontera, y es el gemelo del parque. Más lejos, el [Parco Nazionale Gran
      Paradiso](/lugar/parco-nazionale-gran-paradiso/), el [Parco Nazionale dello Stelvio / Nationalpark
      Stilfserjoch](/lugar/parco-nazionale-dello-stelvio/) y el [Parc national de la
      Vanoise](/lugar/parc-national-de-la-vanoise/) comparten con él la cabra montés, el rebeco y el
      quebrantahuesos, y los biomas de alta montaña y glaciares.
  en:
    intro: >-
      The kings of Savoy once hunted across these crags. In 1857, Victor Emmanuel II created the Royal Hunting
      Reserve of Valdieri-Entracque, from which the present park emerged in 1980 as the largest protected
      natural area in Piedmont. What was once an exclusive royal estate is now a maze of narrow glens, summits
      rising to 3,297 m, and glacial tarns accessible on foot, with [alpine ibex](/especie/capra_ibex/)
      traversing high ledges and [alpine marmots](/especie/marmota_marmota/) whistling at approaching walkers.
    landscape: >-
      The park encompasses the upper Gesso valley, the upper Grande di Palanfrè valley, and the rugged ravines
      of Valletta and Reduc. Nearly the entire territory drains into the Gesso torrent, which descends almost
      linearly for roughly 25 km toward the plains of Cuneo. The terrain climbs steeply from 750 m to 3,297 m
      between the Argentera and Gelàs massifs.


      It is a forbidding, rocky landscape. Almost half the surface area, some 47 %, consists of bare rock
      faces and scree slopes. Because crystalline basement rocks strongly resist erosion, valleys remain
      narrow and deeply incised, slopes are precipitous, and forests are restricted. Quaternary glaciers
      shaped the rest: major valleys display classic U-shaped cross-sections, with each headwall cradling
      tarns within extinct glacial cirques. Perennial snowfields and pocket glaciers of Pyrenean character
      linger, with those on Monte Gelàs standing as the southernmost glaciers in the entire Alpine chain.


      Vegetation ascends through distinct elevation zones. The montane belt is dominated by beech forests
      covering most woodland areas, accompanied by silver fir in the Pesio valley and mountain pine in the
      Carnino valley. Subalpine pastures are dotted with alpenrose, green alder, and dwarf juniper, while
      traditional summer livestock shelters (gias) foster organically enriched soils that support specialized
      nitrophilous plant communities. Higher still in the alpine belt, sheltered north-facing couloirs hold
      snow patches year-round.
    wildlife: >-
      The park is renowned as an Alpine glacial refuge: its southerly latitude and maritime proximity foster a
      rich flora of roughly 1,800 species, including thirteen endemics and two micro-endemics. Among alpine
      rocks bloom Saxifraga florulenta, Galium tendae, and Silene cordifolia, with Viola valderia and Viola
      argenteria colonizing scree slopes. Around Valdieri, an isolated relict population of Phoenicean juniper
      bears witness to prehistoric Mediterranean penetrations.


      Among wildlife, the [chamois](/especie/rupicapra_rupicapra/) is the park's emblem and its most
      widespread ungulate, numbering over 4,000 individuals. The [alpine ibex](/especie/capra_ibex/) returned
      through releases begun in 1920 using stock from Gran Paradiso, generally dwelling higher than chamois.
      The [alpine marmot](/especie/marmota_marmota/) is gregarious and readily observed. With the return of
      the [wolf](/especie/canis_lupus/) to the Maritime Alps, non-native mouflon have become easy prey in
      heavy snow, curbing their presence.


      For birds, scan cliffs and screes. Roughly eighty species inhabit the park, with 75 breeding locally:
      the [golden eagle](/especie/aquila_chrysaetos/) among raptors, rock ptarmigan and [black
      grouse](/especie/tetrao_tetrix/) among mountain galliformes, and the
      [wallcreeper](/especie/tichodroma_muraria/) on sheer walls. Since 1993, the park has partnered with
      Mercantour to reintroduce the [bearded vulture](/especie/gypaetus_barbatus/), releasing eight pairs of
      juveniles in Piedmont up to 2006. Butterflies feature some fifty endemic forms native to the Maritime
      and Cottian Alps, including Parnassius apollo valderiensis at Terme di Valdieri.
    visit: >-
      The Centro Uomini e Lupi operates in two sections: the town visitor centre in Entracque and the wildlife
      enclosure at Casermette. At Terme di Valdieri, an additional centre features a permanent exhibit on
      protected areas of the Gesso valley, flanked by the Valderia Botanical Garden showcasing roughly 500
      plant species across fourteen distinct Alpine habitats. In Entracque, the Ultimi ghiacci exhibit
      explores climate change across the Mediterranean Alps, while in Sant'Anna di Valdieri the Museo della
      Civiltà della Segale documents traditional rye farming.


      For walking routes, the managing authority hosts the portal Trekking nelle Alpi del Mediterraneo,
      featuring filters by village, distance, duration, and difficulty with downloadable GPS tracks. The
      park's staffed mountain refuges enable multi-day traverses connecting directly with Mercantour across
      the international border.


      If you spot an ibex or chamois with ear tags or a GPS collar, record the location, colours, and date,
      taking a photo if possible: the park collects these sightings for citizen-science monitoring.
    history: >-
      The park originated in 1980 as Parco Naturale dell'Argentera, receiving the European Diploma of
      Protected Areas in 1993. It shares more than one third of its boundary along its southern and
      southwestern perimeter with France's Mercantour National Park, with which it has been twinned for over
      thirty years.
    before: >-
      Dogs must always be kept on a leash and are restricted to designated trails. Model aircraft are
      forbidden, and drones require prior official authorisation for professional purposes. In the park
      bivouacking in lightweight tents is allowed from one hour before sunset until one hour after sunrise.
      Open campfires on the ground are prohibited year-round outside equipped barbecue sites, as is feeding or
      placing salt to lure wildlife. Check operating hours and trail conditions with park visitor centres
      before departing.
    around: >-
      France's [Parc National du Mercantour](/lugar/parc-national-du-mercantour/) lies roughly 1 km across the
      frontier crest as the park's twin reserve. Further away, [Parco Nazionale Gran
      Paradiso](/lugar/parco-nazionale-gran-paradiso/), [Parco Nazionale dello Stelvio / Nationalpark
      Stilfserjoch](/lugar/parco-nazionale-dello-stelvio/), and [Parc national de la
      Vanoise](/lugar/parc-national-de-la-vanoise/) share ibex, chamois, bearded vultures, and high-alpine
      glaciated biomes.
  fr:
    intro: >-
      Les souverains de Savoie venaient chasser ici. En 1857, Victor-Emmanuel II créa la Réserve royale de
      chasse de Valdieri-Entracque ; de cette réserve devenue parc en 1980 naît aujourd'hui le plus vaste
      espace protégé du Piémont. Ce qui fut un domaine réservé forme désormais un dédale de vallées
      resserrées, de cimes culminant à 3 297 m et de lacs glaciaires parcourus par le [bouquetin des
      Alpes](/especie/capra_ibex/) et signalés par les sifflements de la [marmotte des
      Alpes](/especie/marmota_marmota/).
    landscape: >-
      Le parc englobe la haute vallée du Gesso, la haute vallée Grande di Palanfrè et les gorges de la
      Valletta et du Reduc. L'essentiel des eaux s'écoule dans le bassin du torrent Gesso, descendant en ligne
      droite sur environ 25 km vers la plaine de Coni. Le relief s'élève de 750 m à 3 297 m entre les massifs
      du Gelàs et de l'Argentera.


      C'est un univers minéral austère. Près de la moitié du territoire, soit 47 %, est formée de parois
      rocheuses et d'éboulis. La roche cristalline résistant farouchement à l'érosion, les vallées sont
      étroites et encaissées, les versants abrupts et la forêt clairsemée. Les glaciers du Quaternaire ont
      façonné le reste : les vallées adoptent un profil en U et chaque cirque suspendu recèle des lacs
      d'altitude. Des névés permanents et de petits glaciers rocheux subsistent, ceux du mont Gelàs
      constituant les appareils glaciaires les plus méridionaux de toute la chaîne alpine.


      La végétation s'étage selon l'altitude. À l'étage montagnard dominent les hêtraies, complétées de
      sapinières dans le val Pesio et de pinèdes de pin à crochets dans le val Carnino. À l'étage subalpin se
      déploient rhododendrons, aulnes et genévriers parmi les estives, où les anciens enclos pastoraux (gias)
      forment des sols enrichis portant une flore nitrophile spécifique. Plus haut, dans l'étage alpin, des
      névés subsistent toute l'année dans les couloirs ombragés orientés au nord.
    wildlife: >-
      Le parc jouit d'une réputation méritée de refuge glaciaire alpin : sa situation méridionale et la
      proximité marine permettent de rassembler quelque 1 800 espèces végétales, dont treize endémiques et
      deux micro-endémiques. Sur les vires alpines fleurissent Saxifraga florulenta, Galium tendae et Silene
      cordifolia, tandis que Viola valderia et Viola argenteria colonisent les éboulis. Dans le secteur de
      Valdieri survit même un peuplement relique de genévrier de Phénicie, témoin d'anciennes pénétrations
      méditerranéennes.


      Côté faune, le [chamois](/especie/rupicapra_rupicapra/) est l'emblème du parc et l'ongulé le plus
      répandu, fort de plus de 4 000 individus. Le [bouquetin des Alpes](/especie/capra_ibex/) a été
      réintroduit à partir de 1920 grâce à des lâchers depuis le Grand-Paradis, colonisant les étages
      supérieurs. La [marmotte des Alpes](/especie/marmota_marmota/) est très commune. Avec le retour naturel
      du [loup gris](/especie/canis_lupus/) dans les Alpes maritimes, le mouflon est devenu une proie facile
      dans la neige, ce qui limite son expansion.


      Pour les oiseaux, observez les parois et les pierriers. Quelque quatre-vingts espèces fréquentent le
      parc et 75 s'y reproduisent : l'[aigle royal](/especie/aquila_chrysaetos/) parmi les prédateurs, la
      perdrix des neiges et le [tétras lyre](/especie/tetrao_tetrix/) sur les croupes d'altitude, et le
      [tichodrome échelette](/especie/tichodroma_muraria/) sur les falaises. Depuis 1993, le parc coopère avec
      le Mercantour pour la réintroduction du [gypaète barbu](/especie/gypaetus_barbatus/), avec huit couples
      de jeunes relâchés au Piémont jusqu'en 2006. Les papillons recensent une cinquantaine de formes
      endémiques, dont Parnassius apollo valderiensis aux Terme di Valdieri.
    visit: >-
      Le Centro Uomini e Lupi s'articule en deux pôles : le centre muséographique d'Entracque et l'enclos
      faunique de Casermette. Aux Terme di Valdieri, un autre espace présente les milieux protégés de la
      vallée du Gesso, flanqué du jardin botanique Valderia qui rassemble environ 500 espèces réparties en
      quatorze biotopes alpins. À Entracque, l'exposition Ultimi ghiacci aborde l'évolution glaciaire, tandis
      qu'à Sant'Anna di Valdieri le musée de la civilisation du seigle illustre les traditions locales.


      Pour les randonneurs, le portail Trekking nelle Alpi del Mediterraneo répertorie les itinéraires
      filtrables par durée et difficulté avec tracés GPS téléchargeables. Les nombreux refuges gardés
      facilitent les circuits de plusieurs jours et les traversées transfrontalières vers le Mercantour.


      Si vous rencontrez un bouquetin ou un chamois porteur d'une marque auriculaire ou d'un collier, notez
      les couleurs et la position, avec photo si possible, pour enrichir les programmes de sciences
      participatives.
    history: >-
      Le parc fut fondé en 1980 sous le nom de Parco Naturale dell'Argentera et reçut en 1993 le Diplôme
      européen des espaces protégés. Il partage plus d'un tiers de ses limites au sud et au sud-ouest avec le
      parc national français du Mercantour, formant un jumelage transfrontalier actif depuis plus de trente
      ans.
    before: >-
      Les chiens doivent impérativement être tenus en laisse et cantonnés aux sentiers autorisés. Les
      aéromodèles sont interdits et les drones soumis à autorisation professionnelle préalable. Le bivouac
      sous tente est toléré d'une heure avant le coucher du soleil à une heure après son lever. Les feux au
      sol sont interdits en tout temps hors des barbecues aménagés, de même que le nourrissage de la faune.
      Renseignez-vous auprès des maisons du parc avant toute excursion.
    around: >-
      Le [Parc National du Mercantour](/lugar/parc-national-du-mercantour/) se trouve à environ 1 km par-delà
      la crête frontière. Plus loin, le [Parco Nazionale Gran
      Paradiso](/lugar/parco-nazionale-gran-paradiso/), le [Parco Nazionale dello Stelvio / Nationalpark
      Stilfserjoch](/lugar/parco-nazionale-dello-stelvio/) et le [Parc national de la
      Vanoise](/lugar/parc-national-de-la-vanoise/) partagent bouquetins, chamois, gypaètes et glaciers
      d'altitude.
  de:
    intro: >-
      Einst jagten hier die Könige von Savoyen. Im Jahr 1857 gründete Viktor Emanuel II. das königliche
      Jagdrevier Valdieri-Entracque, aus dem 1980 das größte Schutzgebiet des Piemont hervorging. Wo sich
      einst ein königliches Jagdgebiet erstreckte, liegt heute ein Netz aus engen Tälern, 3.297 m hohen
      Gipfeln und Karseen, durchstreift vom [Alpensteinbock](/especie/capra_ibex/) und wachsam beobachtet von
      pfeifenden [Alpenmurmeltieren](/especie/marmota_marmota/).
    landscape: >-
      Der Park umfasst das obere Gesso-Tal, das obere Grande di Palanfrè-Tal sowie die Schluchten von Valletta
      und Reduc. Nahezu das gesamte Gebiet entwässert über den Wildbach Gesso, der über rund 25 km
      schnurgerade zur Ebene von Cuneo fließt. Das Gelände steigt steil von 750 m bis auf 3.297 m zwischen der
      Gelàs- und der Argentera-Gruppe an.


      Es ist eine karge Hochgebirgslandschaft: Nahezu die Hälfte der Fläche, rund 47 %, besteht aus
      Felsabstürzen und Geröllhalden. Da das kristalline Urgestein der Verwitterung trotzt, sind die Täler eng
      eingekerbt, die Hänge extrem steil und die Waldflächen begrenzt. Eiszeitliche Gletscher schufen
      U-förmige Trogtäler mit Karseen in den Talabschlüssen. Firnfelder und kleine Kargletscher überdauern,
      wobei die Eisfelder am Monte Gelàs die südlichsten Gletscher der gesamten Alpenkette darstellen.


      Die Vegetation gliedert sich in Höhenstufen: In der Montanstufe dominieren Buchenwälder, ergänzt durch
      Weißtannen im Pesio-Tal und Bergkiefern im Carnino-Tal. In der Subalpinstufe breiten sich Alpenrosen,
      Grünerlen und Zwergwacholder aus. Verlassene Almviehläger (Gias) mit stickstoffreichen Böden tragen eine
      charakteristische Spezialflora. In der alpinen Stufe halten sich Firnflecken in schattigen Nordkaren das
      ganze Jahr über.
    wildlife: >-
      Der Park gilt als herausragendes eiszeitliches Refugium: Dank südlicher Lage und Meeresnähe umfasst der
      Florenkatalog rund 1.800 Arten mit dreizehn Endemiten und zwei Mikro-Endemiten. Auf Felsbändern wachsen
      Saxifraga florulenta, Galium tendae und Silene cordifolia, während Viola valderia und Viola argenteria
      Schutthalden besiedeln. Bei Valdieri überdauert ein Reliktbestand des Phönizischen Wacholders.


      Bei den Wildtieren ist die [Gämse](/especie/rupicapra_rupicapra/) das Wappentier des Parks und mit über
      4.000 Tieren die häufigste Schalenwildart. Der [Alpensteinbock](/especie/capra_ibex/) kehrte durch
      Auswilderungen ab 1920 aus dem Gran Paradiso zurück. Die [Alpenmurmeltiere](/especie/marmota_marmota/)
      sind allgegenwärtig. Mit der Rückkehr des [Wolfes](/especie/canis_lupus/) in die Seealpen wurden
      eingeführte Mufflons im Schnee zu leichter Beute, was ihren Bestand dezimierte.


      Rund achtzig Vogelarten bewohnen den Park, von denen 75 hier brüten: der
      [Steinadler](/especie/aquila_chrysaetos/) unter den Greifvögeln, Schneehuhn und
      [Birkhuhn](/especie/tetrao_tetrix/) in alpinen Höhenlagen sowie der
      [Mauerläufer](/especie/tichodroma_muraria/) an Steilwänden. Seit 1993 kooperiert der Park mit Mercantour
      bei der Wiederansiedlung des [Bartgeiers](/especie/gypaetus_barbatus/); bis 2006 wurden acht Paare
      Jungvögel im Piemont freigelassen. Bei den Schmetterlingen finden sich rund fünfzig Endemiten wie
      Parnassius apollo valderiensis an den Thermen von Valdieri.
    visit: >-
      Das Centro Uomini e Lupi teilt sich in zwei Bereiche: das Besucherzentrum im Ort Entracque und das
      Freigehege bei Casermette. An den Terme di Valdieri informiert ein Zentrum über die Schutzgebiete des
      Gesso-Tals, flankiert vom Botanischen Garten Valderia mit rund 500 Pflanzenarten in vierzehn alpinen
      Biotopen. In Entracque widmet sich die Ausstellung Ultimi ghiacci dem Gletscherschwund, während in
      Sant'Anna di Valdieri das Roggenmuseum ländliche Bräuche beleuchtet.


      Wanderer finden im Portal Trekking nelle Alpi del Mediterraneo Tourenbeschreibungen mit GPS-Tracks. Die
      zahlreichen bewirtschafteten Berghütten ermöglichen Mehrtagestouren mit Übergängen hinüber in den
      Mercantour.


      Sichtungen markierter Steinböcke oder Gämsen mit Ohrmarken oder Sendern können mit Ortsangabe und Foto
      an die Parkverwaltung gemeldet werden.
    history: >-
      Der Park entstand 1980 als Parco Naturale dell'Argentera und erhielt 1993 das Europäische
      Schutzgebietsdiplom. Über ein Drittel seiner Süd- und Südwestgrenze teilt er mit dem französischen
      Nationalpark Mercantour, mit dem seit über dreißig Jahren eine enge Partnerschaft besteht.
    before: >-
      Hunde müssen ausnahmslos an der Leine geführt werden und dürfen nur freigegebene Wege nutzen.
      Modellflugzeuge sind verboten, Drohnen nur mit Genehmigung gestattet. Biwakieren im Zelt ist von einer
      Stunde vor Sonnenuntergang bis eine Stunde nach Sonnenaufgang gestattet. Offenes Bodenfeuer ist
      ganzjährig untersagt, ebenso das Füttern von Wildtieren. Erkundige dich vorab in den Besucherzentren
      über aktuelle Wegverhältnisse.
    around: >-
      Der [Parc National du Mercantour](/lugar/parc-national-du-mercantour/) liegt nur etwa 1 km jenseits der
      Grenzkämme als Zwillingspark. In weiterer Ferne teilen der [Parco Nazionale Gran
      Paradiso](/lugar/parco-nazionale-gran-paradiso/), der [Parco Nazionale dello Stelvio / Nationalpark
      Stilfserjoch](/lugar/parco-nazionale-dello-stelvio/) und der [Parc national de la
      Vanoise](/lugar/parc-national-de-la-vanoise/) Steinböcke, Gämsen, Bartgeier und Hochgebirgsbiotope.
  it:
    intro: >-
      I sovrani di Casa Savoia venivano a cacciare tra queste balze. Nel 1857 Vittorio Emanuele II istituì la
      Riserva Reale di caccia di Valdieri-Entracque, da cui nel 1980 ha preso vita l'area protetta più estesa
      del Piemonte. Quella che fu una riserva esclusiva è oggi un labirinto di valli incassate, vette che
      raggiungono 3.297 m e laghi d'alta quota calcati dallo [stambecco](/especie/capra_ibex/) e salutati dai
      fischi della [marmotta](/especie/marmota_marmota/).
    landscape: >-
      Il parco racchiude l'alta valle Gesso, l'alta valle Grande di Palanfrè e i valloni della Valletta e del
      Reduc. La quasi totalità del bacino appartiene al torrente Gesso, che discende per circa 25 km verso la
      pianura cuneese. La quota spazia repentinamente da 750 m a 3.297 m tra i massicci del Gelàs e
      dell'Argentera.


      È una morfologia aspra e severa: quasi metà della superficie, pari al 47 %, è costituita da pietraie,
      ghiaioni e pareti scoscese. La tenacia delle rocce cristalline all'erosione ha generato gole profonde,
      versanti dirupati e boschi contenuti. I ghiacciai quaternari modellarono vallate a U chiuse a monte da
      circhi sospesi che custodiscono laghi glaciali. Piccoli apparati glaciali pirenaici e nevai perenni
      resistono, con i bacini del Monte Gelàs a rappresentare i ghiacciai più a sud di tutte le Alpi.


      La copertura vegetale muta salendo di quota: nella fascia montana dominano le faggete, con abeti bianchi
      in val Pesio e pino uncinato in val Carnino. Nel piano subalpino si diffondono rododendri, ontani e
      ginepri tra i pascoli, dove gli antichi ricoveri pastorali (gias) lasciano suoli nitrofili su cui
      alligna una flora peculiare. Nel piano alpino i nevai persistono tutto l'anno nei valloni rivolti a
      settentrione.
    wildlife: >-
      Il parco vanta un ruolo storico di rifugio glaciale alpino: la posizione meridionale e gli influssi
      marini compongono un catalogo di circa 1.800 specie floristiche con tredici endemismi e due
      micro-endemismi. Tra le balze rocciose fioriscono Saxifraga florulenta, Galium tendae e Silene
      cordifolia, mentre Viola valderia e Viola argenteria ammantano le pietraie. Nei pressi di Valdieri
      sopravvive persino un nucleo relitto di ginepro fenicio.


      Nel regno animale il [camoscio alpino](/especie/rupicapra_rupicapra/) è l'emblema del parco e l'ungulato
      dominante con oltre 4.000 capi. Lo [stambecco](/especie/capra_ibex/) è ritornato grazie a rilasci
      intrapresi a partire dal 1920 con capi del Gran Paradiso. La [marmotta](/especie/marmota_marmota/) è
      comune e facile da scorgere. Con la ricomparsa del [lupo grigio](/especie/canis_lupus/) nelle Alpi
      Marittime, il muflone introdotto è divenuto preda vulnerabile sulla neve, vedendo frenata la sua
      espansione.


      Circa ottanta specie ornitiche frequentano il parco e 75 vi nidificano: l'[aquila
      reale](/especie/aquila_chrysaetos/) tra i rapaci, pernice bianca e [fagiano di
      monte](/especie/tetrao_tetrix/) in quota, e il [picchio muraiolo](/especie/tichodroma_muraria/) sulle
      pareti. Dal 1993 il parco collabora con il Mercantour per il [gipeto](/especie/gypaetus_barbatus/), con
      otto coppie di giovani liberate in Piemonte fino al 2006. Tra i lepidotteri si contano una cinquantina
      di forme endemiche, tra cui Parnassius apollo valderiensis alle Terme di Valdieri.
    visit: >-
      Il Centro Uomini e Lupi si struttura in due tappe: il centro espositivo di Entracque paese e l'area
      faunistica di Casermette. Alle Terme di Valdieri una sede permanente illustra gli habitat della valle
      Gesso accanto al Giardino Botanico Valderia, che raccoglie circa 500 specie distribuite in quattordici
      ambienti alpini. Ad Entracque la mostra Ultimi ghiacci documenta i cambiamenti climatici, mentre a
      Sant'Anna di Valdieri l'Ecomuseo della Segale illustra le tradizioni contadine montane.


      Per gli escursionisti il portale Trekking nelle Alpi del Mediterraneo cataloga itinerari con relazioni
      dettagliate e tracce GPS. I numerosi rifugi gestiti consentono traversate di più giorni con collegamenti
      diretti verso il Mercantour francese.


      Chi osserva stambecchi o camosci provvisti di marche auricolari o radiocollari è invitato a comunicarne
      posizione e scattare una fotografia a supporto della ricerca.
    history: >-
      Il parco fu istituito nel 1980 con la denominazione di Parco Naturale dell'Argentera e nel 1993 fu
      insignito del Diploma Europeo delle Aree Protette. Confina per oltre un terzo del suo perimetro a sud e
      sud-ovest con il Parco Nazionale francese del Mercantour, con cui è gemellato da più di trent'anni.
    before: >-
      I cani devono essere tenuti sempre al guinzaglio e condotti esclusivamente lungo i sentieri consentiti.
      Aeromodelli e droni sono vietati salvo permessi professionali. Il bivacco notturno in tenda è consentito
      da un'ora prima del tramonto a un'ora dopo l'alba. È vietato accendere fuochi all'aperto al di fuori
      delle aree attrezzate, nonché somministrare cibo agli animali selvatici. Verifica percorsi e rifugi
      aperti prima di partire.
    around: >-
      Il [Parc National du Mercantour](/lugar/parc-national-du-mercantour/) dista circa 1 km oltre il confine
      di stato ed è il parco gemello. Più lontano, il [Parco Nazionale Gran
      Paradiso](/lugar/parco-nazionale-gran-paradiso/), il [Parco Nazionale dello Stelvio / Nationalpark
      Stilfserjoch](/lugar/parco-nazionale-dello-stelvio/) e il [Parc national de la
      Vanoise](/lugar/parc-national-de-la-vanoise/) condividono stambecchi, camosci, gipeti e ambienti
      glaciali d'alta quota.
  pt:
    intro: >-
      Os reis de Saboia caçavam por entre estas escarpas. Em 1857, Vítor Emanuel II fundou a Real Reserva de
      caça de Valdieri-Entracque, dando origem em 1980 ao maior parque natural protegido do Piemonte. A antiga
      coutada régia converteu-se num labirinto de vales profundos, picos que atingem 3.297 m e lagos glaciares
      percorridos pelo [íbex](/especie/capra_ibex/) e pontuados pelos silvos da
      [marmota](/especie/marmota_marmota/).
    landscape: >-
      O parque abrange o alto vale Gesso, o alto vale Grande di Palanfrè e as gargantas de Valletta e Reduc.
      Quase toda a bacia drena para o torrente Gesso, que corre em linha reta cerca de 25 km em direção à
      planície de Cuneo. A topografia ascende vertiginosamente dos 750 m até aos 3.297 m entre os maciços do
      Gelàs e da Argentera.


      É um relevo austero e agreste: quase metade da superfície, cerca de 47 %, é constituída por lajes
      rochosas e cascalheiras. A resistência das rochas cristalinas à erosão originou vales apertados,
      vertentes escarpadas e coberturas florestais restritas. Os glaciares quaternários talharam perfis em U
      culminando em circos suspensos que retêm lagoas de altitude. Sobrevivem pequenos glaciares de tipo
      pirenaico e campos de neve permanentes, sendo os do Monte Gelàs os mais meridionais de toda a
      cordilheira alpina.


      A vegetação reparte-se por andares altitudinais: no piso montano imperam os faiais, com abetos-brancos
      no vale Pesio e pinhais de pinheiro-uncinado no vale Carnino. No piso subalpino desenvolvem-se
      rododendros, amieiros e zimbros entre os pastos, onde os antigos currais estivais (gias) enriquecem os
      solos com flora nitrófila própria. Acima, no andar alpino, os campos de neve perduram todo o ano em
      corredores sombrios expostos a norte.
    wildlife: >-
      O parque é justamente reputado como refúgio glaciar alpino: a sua latitude meridional e a influência
      marítima acolhem um catálogo de cerca de 1.800 espécies florísticas com treze endemismos e dois
      micro-endemismos. Nas fendas rochosas desabrocham Saxifraga florulenta, Galium tendae e Silene
      cordifolia, enquanto Viola valderia e Viola argenteria povoam as cascalheiras. Perto de Valdieri
      subsiste um núcleo relíquia de sabina-da-praia.


      Na fauna, a [camurça](/especie/rupicapra_rupicapra/) é o símbolo do parque e o ungulado mais abundante,
      superando os 4.000 exemplares. O [íbex](/especie/capra_ibex/) restabeleceu-se a partir de 1920 mediante
      solturas originárias do Gran Paradiso. A [marmota](/especie/marmota_marmota/) é comum e sociável. Com o
      regresso do [lobo](/especie/canis_lupus/) aos Alpes Marítimos, os muflões introduzidos tornaram-se
      presas fáceis sobre a neve, travando a sua multiplicação.


      Cerca de oitenta espécies avícolas habitam o território e 75 nidificam no parque: a
      [águia-real](/especie/aquila_chrysaetos/) nas alturas, a lagópode-branca e o
      [tetraz-lira](/especie/tetrao_tetrix/) nos cumes, e o [trepa-escarpas](/especie/tichodroma_muraria/) nas
      fragas. Desde 1993, o parque colabora com Mercantour no programa do
      [quebra-ossos](/especie/gypaetus_barbatus/), libertando oito casais juvenis no Piemonte até 2006. As
      borboletas acolhem cinquenta formas endémicas como a Parnassius apollo valderiensis nas Termas de
      Valdieri.
    visit: >-
      O Centro Uomini e Lupi compreende dois polos: o núcleo museológico de Entracque e o cercado faunístico
      de Casermette. Nas Termas de Valdieri funciona outro centro interpretativo, ao lado do Jardim Botânico
      Valderia, que reúne cerca de 500 espécies em catorze habitats alpinos. Em Entracque, a exposição Ultimi
      ghiacci aborda as alterações climáticas, enquanto em Sant'Anna di Valdieri o Museu do Centeio recorda
      saberes agrícolas tradicionais.


      O portal Trekking nelle Alpi del Mediterraneo oferece roteiros detalhados com ficheiros GPS
      descarregáveis. Os vários refúgios de montanha facilitam percursos pedestres de vários dias com ligação
      direta a Mercantour através da fronteira.


      Ao avistares um íbex ou camurça com marca auricular ou coleira de monitorização, anota as cores e local,
      tirando fotografia se possível para os projetos de ciência cidadã.
    history: >-
      O parque nasceu em 1980 sob o nome de Parco Naturale dell'Argentera e obteve em 1993 o Diploma Europeu
      das Áreas Protegidas. Partilha mais de um terço do seu perímetro a sul e sudoeste com o Parque Nacional
      francês de Mercantour, mantendo uma geminação transfronteiriça há mais de trinta anos.
    before: >-
      Os cães devem transitar sempre presos por trela e exclusivamente nos trilhos autorizados. Aeromodelos e
      drones são proibidos sem licença profissional. É permitido acampar em bivaque de tenda ligeira desde uma
      hora antes do pôr do sol até uma hora depois do amanhecer. É expressamente interdito acender fogueiras
      no solo fora dos grelhadores das áreas de lazer, bem como alimentar a fauna. Informa-te nos centros de
      acolhimento antes de iniciar a caminhada.
    around: >-
      O [Parc National du Mercantour](/lugar/parc-national-du-mercantour/) fica a cerca de 1 km além da linha
      de cumeada como parque-gémeo. Mais afastados, o [Parco Nazionale Gran
      Paradiso](/lugar/parco-nazionale-gran-paradiso/), o [Parco Nazionale dello Stelvio / Nationalpark
      Stilfserjoch](/lugar/parco-nazionale-dello-stelvio/) e o [Parc national de la
      Vanoise](/lugar/parc-national-de-la-vanoise/) partilham íbexes, camurças, quebra-ossos e glaciares
      alpinos.
