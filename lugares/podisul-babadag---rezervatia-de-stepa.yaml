observaciones:
  es: >-
    No hay senderos, observatorios ni centros de visitantes descritos específicamente para la meseta de
    Babadag. Ve en primavera o a comienzos de otoño, que es cuando pasan las aves, y consulta antes con el
    gestor del sitio, la asociación del Podișul Nord Dobrogean.
texto:
  es:
    intro: >-
      Los turcos lo llamaron Babadag, el Padre de las Montañas, porque creían que la colina bajo la que se
      asienta la ciudad era la más alta de Dobrogea. No lo es, pero el nombre da la medida del paisaje: una
      meseta baja de laderas inclinadas, cubierta de bosque de roble pubescente, en el sureste de Rumanía,
      dentro del macizo de Dobrogea del Norte. Por encima pasan, en primavera y otoño, cientos de miles de
      aves.
    landscape: >-
      Al sur, la meseta de Casimcea queda al otro lado del corredor tectónico Peceneaga-Camena; al oeste está
      la vega del Danubio, y al este el sistema lagunar Razim-Sinoe, hacia el que la meseta cae de golpe en
      cabos abruptos. Es una meseta sobre todo sedimentaria, de margas y areniscas del Cretácico. Las
      altitudes bajan de oeste a este, de unos 300-400 metros, y el punto más alto es el cerro Cârjelari, de
      402 metros. El bosque de Babadag, en concreto, se asienta en una meseta de laderas inclinadas que
      alcanza una altitud máxima de 220 metros, con sustrato calizo.


      Los robledales de roble pubescente (*Quercus pubescens*) son bosques submediterráneos termófilos, con
      frecuentes claros de pradera esteparia. Más del 44 por ciento de las estepas pontosármaticas, hábitat
      prioritario, que hay en Rumanía se encuentra en el sitio ROSCI0201 Podișul Nord Dobrogean, que incluye
      esta meseta. En los claros y las laderas pedregosas florece en mayo y junio la *Paeonia peregrina*, de
      flores grandes color sangre, una especie de interés para la conservación en la reserva natural
      Babadag-Codru.
    wildlife: >-
      Esta es tierra de rapaces. En el bosque crían poblaciones significativas de águila pomerana, culebrera
      europea, [busardo moro](/especie/buteo_rufinus/), águila calzada y gavilán griego. Los pájaros
      carpinteros son residentes todo el año, y entre los visitantes de verano que crían destacan la carraca
      europea, el bisbita campestre, el escribano hortelano y la curruca gavilana.


      Pero lo grande llega en los pasos. En primavera y en otoño la migración lleva cientos de miles de aves
      por el sitio, que enlaza Dobrogea y el delta del Danubio con otras zonas de Europa y África. Por la zona
      o sus inmediaciones pasan tres rutas migratorias: la este-elba, la Via Pontica y la sármata. Las
      bandadas de cigüeña blanca suman más de cien mil ejemplares, y hay miles de pelícanos comunes, [cigüeñas
      negras](/especie/ciconia_nigra/) y papamoscas papirrojos. Cruzan grandes contingentes de águila
      pomerana, [aguilucho lagunero](/especie/circus_aeruginosus/), [abejero
      europeo](/especie/pernis_apivorus/), [cernícalo patirrojo](/especie/falco_vespertinus/), aguilucho
      cenizo, culebrera y [pigargo europeo](/especie/haliaeetus_albicilla/), y varios aguiluchos pálidos pasan
      aquí el invierno. En total, sesenta y una especies migratorias usan el sitio para criar, invernar o
      pasar.


      La [tortuga mora](/especie/testudo_graeca/) vive en la zona: está muy extendida en Dobrogea, ligada a
      las praderas esteparias y a la silvoestepa, y no vive en el delta. Es diurna y termófila, las crías
      salen del huevo en septiembre y en invierno hiberna sola o en grupo en refugios con orientación sur.
    visit: >-
      Babadag, la ciudad al pie de colinas muy arboladas, sirve de puerta de entrada; al nordeste linda con el
      lago Babadag. En su término se solapan el sitio Podișul Nord Dobrogean, la zona de aves Pădurea Babadag
      y las reservas naturales Pădurea Babadag-Codru y Korum-Tarla. La ciudad guarda huellas de su pasado
      otomano: bajo ese dominio fue uno de los centros urbanos más importantes de Dobrogea, y se cita por
      primera vez en documentos en 1263.
    history: >-
      El bosque de Babadag es una zona de especial protección para las aves con ochenta y siete especies de
      aves protegidas, de las que treinta y seis son de interés comunitario y seis están amenazadas a escala
      global. Forma parte del conjunto Podișul Nord Dobrogean, que reúne veintiuna áreas naturales protegidas.
      En su paso por el bosque, las rapaces crían, invernan, se alimentan y descansan.
    before: >-
      No hay senderos, observatorios ni centros de visitantes descritos específicamente para la meseta de
      Babadag. Ve en primavera o a comienzos de otoño, que es cuando pasan las aves, y consulta antes con el
      gestor del sitio, la asociación del Podișul Nord Dobrogean.
    around: >-
      Pegado a la meseta queda el [Parque Nacional Montañas de
      Măcin](/lugar/parcul-national-muntii-macinului/). Más lejos, el [Parque Nacional
      Körös-Maros](/lugar/koros-maros-nemzeti-park/) comparte culebrera, cigüeña negra y pigargo europeo; el
      [Parque Nacional Körös-Maros - Llanura de Dévaványa](/lugar/koros-maros-nemzeti-park---devavanyai/),
      cernícalo patirrojo y aguilucho cenizo; y el [Parque Paisajístico del Bosque de
      Knyszyn](/lugar/park-krajobrazowy-puszczy-knyszynskiej/), águila calzada, abejero europeo y culebrera.
  en:
    intro: >-
      The Ottomans christened it Babadag, Father of Mountains, believing the rolling rise shadowing the town
      was the highest eminence in Dobrogea. It is not, yet the title captures the character of the landscape:
      an undulating low plateau clad in downy oak woodlands in southeastern Romania, set within the North
      Dobrogean Massif. Overhead, hundreds of thousands of migratory birds transit every spring and autumn.
    landscape: >-
      To the south, the Casimcea plateau extends across the Peceneaga-Camena tectonic fault corridor; to the
      west spreads the Danube floodplain, and to the east opens the Razim-Sinoe lagoon complex, toward which
      the plateau terminates in abrupt headlands. It is predominantly a sedimentary plateau formed from
      Cretaceous marls and sandstones. Elevations descend from west to east, ranging around 300-400 metres,
      culminating at the Cârjelari hill at 402 metres. The Babadag forest proper occupies a plateau of tilted
      flanks reaching a maximum elevation of 220 metres on limestone bedrock.


      Open woodlands of downy oak (*Quercus pubescens*) form thermophilous sub-Mediterranean habitats
      interspersed with frequent steppe grassland glades. More than 44 percent of Romania's priority
      Pontic-Sarmatic steppe habitat is sheltered within site ROSCI0201 Podișul Nord Dobrogean, which
      encompasses this plateau. In forest clearings and stony limestone slopes, blood-red blossoms of *Paeonia
      peregrina* unfurl in May and June, standing as a flagship conservation species in the Babadag-Codru
      nature reserve.
    wildlife: >-
      This is raptor territory. The forest supports breeding populations of lesser spotted eagle, short-toed
      snake eagle, [long-legged buzzard](/especie/buteo_rufinus/), booted eagle, and Levant sparrowhawk.
      Woodpeckers remain resident year-round, while summer breeding visitors include the European roller,
      tawny pipit, ortolan bunting, and barred warbler.


      Yet the true spectacle arrives during migratory passage. Every spring and autumn, migration funnels
      hundreds of thousands of birds through the area, linking Dobrogea and the Danube Delta with broader
      Europe and Africa. Three major flyways intersect here or nearby: the East-Elbe, the Via Pontica, and the
      Sarmatic route. White stork flocks exceed one hundred thousand individuals, accompanied by thousands of
      great white pelicans, [black storks](/especie/ciconia_nigra/), and red-breasted flycatchers. Significant
      contingents of lesser spotted eagle, [western marsh harrier](/especie/circus_aeruginosus/), [European
      honey buzzard](/especie/pernis_apivorus/), [red-footed falcon](/especie/falco_vespertinus/), Montagu's
      harrier, short-toed snake eagle, and [white-tailed eagle](/especie/haliaeetus_albicilla/) cross the
      skies, while hen harriers overwinter. In all, sixty-one migratory species rely on the site for breeding,
      wintering, or staging.


      The [spur-thighed tortoise](/especie/testudo_graeca/) thrives here: widespread across Dobrogea in steppe
      grasslands and forest-steppe, though absent from the Danube Delta. Diurnal and warmth-loving, hatchlings
      emerge in September, and adults hibernate individually or communally in south-facing shelters.
    visit: >-
      Babadag, a town tucked beneath densely wooded hills, serves as the main gateway; to the northeast it
      borders Lake Babadag. Its territory encompasses overlapping designations: the Podișul Nord Dobrogean
      site, the Pădurea Babadag Special Protection Area, and the Babadag-Codru and Korum-Tarla nature
      reserves. The town preserves traces of its Ottoman history: under Turkish rule it flourished as a major
      urban centre of Dobrogea, documented in records since 1263.
    history: >-
      The Babadag forest is a Special Protection Area for birds sheltering eighty-seven protected avian
      species, thirty-six of Community interest and six globally threatened. It belongs to the broader Podișul
      Nord Dobrogean network grouping twenty-one protected areas. Passing through these canopies, migratory
      raptors breed, overwinter, forage, and rest.
    before: >-
      There are no formal marked hiking trails, birdwatching towers, or dedicated visitor centres on the
      Babadag plateau. Visit in spring or early autumn during the peak migration window, and check beforehand
      with site managers at the Podișul Nord Dobrogean association.
    around: >-
      Adjacent to the plateau rises [Măcin Mountains National Park](/lugar/parcul-national-muntii-macinului/).
      Further away, [Körös-Maros National Park](/lugar/koros-maros-nemzeti-park/) shares short-toed eagles,
      black storks, and white-tailed eagles; [Körös-Maros National Park – Dévaványa
      Plain](/lugar/koros-maros-nemzeti-park---devavanyai/) shares red-footed falcons and Montagu's harriers;
      and [Knyszyn Forest Landscape Park](/lugar/park-krajobrazowy-puszczy-knyszynskiej/) shares booted
      eagles, honey buzzards, and short-toed eagles.
  fr:
    intro: >-
      Les Ottomans l'appelèrent Babadag, « Père des montagnes », croyant que la colline dominant la ville
      était la plus haute de Dobroudja. Elle ne l'est pas, mais ce nom traduit bien le paysage : un plateau
      bas aux pentes inclinées, couvert de forêts de chênes pubescents, dans le sud-est de la Roumanie, au
      cœur du massif de Dobrogea du Nord. Au-dessus passent, au printemps et à l'automne, des centaines de
      milliers d'oiseaux.
    landscape: >-
      Au sud, le plateau de Casimcea s'étend au-delà du couloir tectonique Peceneaga-Camena ; à l'ouest
      s'ouvre la plaine alluviale du Danube, et à l'est le complexe lagunaire de Razim-Sinoe, vers lequel le
      plateau plonge en falaises abruptes. C'est un plateau sédimentaire de marnes et de grès crétacés. Les
      altitudes s'abaissent d'ouest en est, autour de 300-400 mètres, le point culminant étant la colline de
      Cârjelari à 402 mètres. La forêt de Babadag occupe un plateau incliné atteignant 220 mètres d'altitude
      maximale sur substrat calcaire.


      Les chênaies de chêne pubescent (*Quercus pubescens*) forment des forêts subméditerranéennes
      thermophiles alternant avec des clairières steppiques. Plus de 44 pour cent des steppes
      ponto-sarmatiques de Roumanie, habitat prioritaire, se trouvent dans le site ROSCI0201 Podișul Nord
      Dobrogean englobant ce plateau. Dans les clairières et versants rocailleux éclot en mai et juin *Paeonia
      peregrina*, pivoine sauvage aux grandes fleurs rouge sang, espèce emblématique de la réserve naturelle
      Babadag-Codru.
    wildlife: >-
      C'est une terre de rapaces. En forêt nichent des populations remarquables d'aigle pomarin, de circaète
      Jean-le-Blanc, de [buse féroce](/especie/buteo_rufinus/), d'aigle botté et d'épervier à pieds courts.
      Les pics y résident toute l'année, tandis que les nicheurs estivaux comptent le rollier d'Europe, le
      pipit rousseline, le bruant ortolan et la fauvette épervière.


      Mais le phénomène majeur reste la migration. Au printemps et à l'automne, des centaines de milliers
      d'oiseaux survolent le site reliant la Dobroudja et le delta du Danube au reste de l'Europe et à
      l'Afrique. Trois grandes voies migratoires convergent ici : la route est-elbe, la Via Pontica et la voie
      sarmatique. Les volées de cigognes blanches dépassent cent mille individus, accompagnées de milliers de
      pélicans blancs, de [cigognes noires](/especie/ciconia_nigra/) et de gobe-mouches nains. Défilent
      d'importants contingents d'aigle pomarin, de [busard des roseaux](/especie/circus_aeruginosus/), de
      [bondrée apivore](/especie/pernis_apivorus/), de [faucon kobez](/especie/falco_vespertinus/), de busard
      cendré, de circaète et de [pygargue à queue blanche](/especie/haliaeetus_albicilla/), tandis que le
      busard Saint-Martin y hiverne. Au total, soixante et une espèces migratrices utilisent ce couloir.


      La [tortue mauresque](/especie/testudo_graeca/) est bien présente : répandue en Dobroudja dans les
      pelouses steppiques et les taillis, elle évite le delta. Diurne et thermophile, les jeunes éclosent en
      septembre et les adultes hivernent isolés ou groupés dans des terriers orientés au sud.
    visit: >-
      Babadag, petite ville au pied de collines boisées, constitue la porte d'entrée ; au nord-est elle borde
      le lac Babadag. Son territoire superpose le site Podișul Nord Dobrogean, la zone de protection spéciale
      Pădurea Babadag et les réserves naturelles Pădurea Babadag-Codru et Korum-Tarla. La cité conserve
      l'empreinte de son passé ottoman, ayant constitué l'un des pôles majeurs de Dobroudja mentionné dès
      1263.
    history: >-
      La forêt de Babadag est une zone de protection spéciale abritant quatre-vingt-sept espèces d'oiseaux
      protégées, dont trente-six d'intérêt communautaire et six menacées au niveau mondial. Elle fait partie
      de l'ensemble Podișul Nord Dobrogean qui regroupe vingt et une aires protégées. Lors de leur halte, les
      rapaces s'y reproduisent, hivernent, chassent et se reposent.
    before: >-
      Il n'existe ni sentiers balisés, ni observatoires, ni centre d'accueil spécifique sur le plateau de
      Babadag. Privilégiez le printemps ou le début de l'automne lors du passage des migrateurs, et contactez
      au préalable l'association de gestion du Podișul Nord Dobrogean.
    around: >-
      Contigu au plateau se trouve le [parc national des monts
      Măcin](/lugar/parcul-national-muntii-macinului/). Plus loin, le [parc national
      Körös-Maros](/lugar/koros-maros-nemzeti-park/) partage circaète, cigogne noire et pygargue ; le [parc
      national Körös-Maros – plaine de Dévaványa](/lugar/koros-maros-nemzeti-park---devavanyai/) partage
      faucon kobez et busard cendré ; et le [parc paysager de la forêt de
      Knyszyn](/lugar/park-krajobrazowy-puszczy-knyszynskiej/) aigle botté, bondrée apivore et circaète.
  de:
    intro: >-
      Die Osmanen nannten die Gegend Babadag, «Vater der Berge», in dem Glauben, der Hügel über der Stadt sei
      die höchste Erhebung der Dobrudscha. Das trifft zwar nicht zu, fängt aber den Landschaftscharakter
      treffend ein: eine sanfte Hochfläche mit Flaumeichenwäldern im Südosten Rumäniens innerhalb des
      Nord-Dobrudscha-Massivs. Im Frühjahr und Herbst ziehen hunderttausende Vögel darüber hinweg.
    landscape: >-
      Im Süden erstreckt sich die Casimcea-Hochebene jenseits der tektonischen Störungszone Peceneaga-Camena;
      im Westen breitet sich die Donauaue aus und im Osten das Lagunensystem Razim-Sinoe, zu dem das Plateau
      steil abfällt. Die Hochebene besteht überwiegend aus kreidezeitlichen Mergeln und Sandsteinen. Die
      Höhenlagen sinken von West nach Ost ab und liegen bei etwa 300-400 Metern, mit dem Cârjelari-Hügel als
      höchstem Punkt bei 402 Metern. Der eigentliche Babadag-Wald liegt auf einer geneigten
      Kalkstein-Hochfläche mit maximal 220 Metern Meereshöhe.


      Die Bestände der Flaumeiche (*Quercus pubescens*) bilden wärmeliebende submediterrane Wälder mit offenen
      Steppenrasen. Mehr als 44 Prozent der ponto-sarmatischen Steppen Rumäniens, ein prioritärer Lebensraum,
      liegen im Schutzgebiet ROSCI0201 Podișul Nord Dobrogean auf dieser Hochebene. Auf Lichtungen und
      steinigen Kalkhängen erblüht im Mai und Juni die Balkan-Pfingstrose *Paeonia peregrina* mit blutroten
      Blüten, eine Leitart des Naturschutzgebiets Babadag-Codru.
    wildlife: >-
      Dies ist ein Revier der Greifvögel. Im Wald brüten Schreiadler, Schlangenadler,
      [Adlerbussard](/especie/buteo_rufinus/), Zwergadler und Kurzfangsperber. Spechte sind ganzjährig
      standorttreu; Sommervögel sind Blauracke, Brachpieper, Ortolan und Sperbergrasmücke.


      Das wahre Schauspiel entfaltet sich während des Vogelzugs. Im Frühjahr und Herbst zieht eine riesige
      Zahl an Vögeln durch, die die Dobrudscha und das Donaudelta mit Europa und Afrika verbindet. Drei
      Zugrouten kreuzen sich hier: die Ost-Elbe-, die Via-Pontica- und die sarmatische Route. Weißstorchzüge
      zählen über einhunderttausend Tiere, begleitet von tausenden Rosapelikanen,
      [Schwarzstörchen](/especie/ciconia_nigra/) und Zwergschnäppern. Große Bestände von Schreiadler,
      [Rohrweihe](/especie/circus_aeruginosus/), [Wespenbussard](/especie/pernis_apivorus/),
      [Rotfußfalke](/especie/falco_vespertinus/), Wiesenweihe, Schlangenadler und
      [Seeadler](/especie/haliaeetus_albicilla/) ziehen durch, während Kornweihen überwintern. Insgesamt
      rasten oder brüten einundsechzig Zugvogelarten hier.


      Die [Maurische Landschildkröte](/especie/testudo_graeca/) ist in der Dobrudscha in Steppenrasen und
      Waldsteppen weit verbreitet, meidet jedoch das Delta. Sie ist tagaktiv und wärmeliebend; Jungtiere
      schlüpfen im September und überwintern einzeln oder in Gruppen in Südlagen.
    visit: >-
      Babadag am Fuß dicht bewaldeter Hügel dient als Ausgangspunkt; im Nordosten grenzt die Stadt an den
      Babadag-See. Hier überlagern sich das Schutzgebiet Podișul Nord Dobrogean, das Vogelschutzgebiet Pădurea
      Babadag sowie die Naturschutzgebiete Pădurea Babadag-Codru und Korum-Tarla. Die Stadt birgt osmanisches
      Erbe aus ihrer Blütezeit als Dobrudscha-Zentrum und wird seit 1263 urkundlich erwähnt.
    history: >-
      Der Wald von Babadag ist ein Vogelschutzgebiet mit siebenundachtzig geschützten Vogelarten, davon
      sechsunddreißig von gemeinschaftlichem Interesse und sechs weltweit gefährdet. Er gehört zum Netzwerk
      Podișul Nord Dobrogean mit einundzwanzig Schutzgebieten. Für wandernde Greifvögel bietet der Wald
      Brutraum, Rastplatz und Jagdrevier.
    before: >-
      Auf der Babadag-Hochebene gibt es weder markierte Wanderwege noch Beobachtungstürme oder
      Besucherzentren. Besuche das Gebiet im Frühling oder Frühherbst während des Vogelzugs und halte
      Rücksprache mit der Schutzgebietsverwaltung des Podișul Nord Dobrogean.
    around: >-
      Direkt benachbart liegt der [Nationalpark Măcin-Gebirge](/lugar/parcul-national-muntii-macinului/).
      Weiter entfernt teilt der [Nationalpark Körös-Maros](/lugar/koros-maros-nemzeti-park/) Schlangenadler,
      Schwarzstorch und Seeadler; die [Dévaványa-Ebene](/lugar/koros-maros-nemzeti-park---devavanyai/)
      Rotfußfalke und Wiesenweihe; und der [Landschaftspark
      Knyszyn-Urwald](/lugar/park-krajobrazowy-puszczy-knyszynskiej/) Zwergadler, Wespenbussard und
      Schlangenadler.
  it:
    intro: >-
      Gli ottomani lo chiamarono Babadag, «Padre dei Monti», convinti che il rilievo che domina l'abitato
      fosse il più alto della Dobrugia. Non lo è, ma il nome riflette il carattere del paesaggio: un basso
      altopiano dai versanti dolci, ammantato di boschi di roverella nel sud-est della Romania, nel massiccio
      della Dobrogea settentrionale. Sopra le sue chiome transitano in primavera e in autunno centinaia di
      migliaia di uccelli.
    landscape: >-
      A sud l'altopiano di Casimcea si estende oltre il solco tettonico Peceneaga-Camena; a ovest si allarga
      la pianura alluvionale del Danubio e a est il sistema lagunare Razim-Sinoe, verso cui l'altopiano scende
      con falesie ripide. È un altopiano sedimentario di marne e arenarie cretacee. Le quote degradano da
      ovest a est, attorno a 300-400 metri, toccando il culmine sul colle Cârjelari a 402 metri. La foresta di
      Babadag occupa un altopiano inclinato che raggiunge i 220 metri di altitudine su substrato calcareo.


      I boschi di roverella (*Quercus pubescens*) formano associazioni submediterranee termofile con ampie
      radure steppiche. Oltre il 44 per cento delle steppe ponto-sarmatiche della Romania, habitat
      prioritario, ricade nel sito ROSCI0201 Podișul Nord Dobrogean che racchiude l'altopiano. Nelle radure e
      sui pendii sassosi fiorisce a maggio e giugno la peonia selvatica *Paeonia peregrina* dai grandi fiori
      rosso sangue, specie di pregio nella riserva naturale Babadag-Codru.
    wildlife: >-
      Questa è terra di rapaci. Nei boschi nidificano popolazioni consistenti di aquila anatraia minore,
      biancone, [poiana codabianca](/especie/buteo_rufinus/), aquila minore e sparviero levantino. I picchi
      sono stanziali tutto l'anno, mentre tra i nidificanti estivi spiccano ghiandaia marina, calandro,
      ortolano e bigia padovana.


      Ma l'evento culminante è la migrazione. In primavera e in autunno i flussi migratori portano centinaia
      di migliaia di volatili attraverso l'area, connettendo la Dobrugia e il delta del Danubio con l'Europa e
      l'Africa. Vi convergono tre corridoi migratori: la rotta est-elbica, la Via Pontica e la rotta
      sarmatica. Gli stormi di cicogna bianca superano centomila esemplari, affiancati da migliaia di
      pellicani bianchi, [cicogne nere](/especie/ciconia_nigra/) e pigliamosche pettirosso. Transitano
      contingenti di aquila anatraia minore, [falco di palude](/especie/circus_aeruginosus/), [falco
      pecchiaiolo](/especie/pernis_apivorus/), [falco cuculo](/especie/falco_vespertinus/), albanella minore,
      biancone e [aquila di mare](/especie/haliaeetus_albicilla/), mentre l'albanella reale vi sverna. In
      totale, sessantuno specie migratrici usano il sito per nidificare, svernare o sostare.


      La [testuggine greca](/especie/testudo_graeca/) è diffusa in Dobrugia nelle praterie steppiche e nelle
      boscaglie, ma è assente nel delta. Diurna e termofila, i piccoli nascono a settembre e gli adulti
      svernano isolati o in gruppi in ripari esposti a sud.
    visit: >-
      Babadag, cittadina ai piedi di colline boscose, funge da accesso naturale; a nord-est lambisce il lago
      Babadag. Nel suo territorio si sovrappongono il sito Podișul Nord Dobrogean, la zona di protezione
      speciale Pădurea Babadag e le riserve naturali Pădurea Babadag-Codru e Korum-Tarla. La città conserva
      memorie del passato ottomano quale capoluogo storico della Dobrugia, attestata sin dal 1263.
    history: >-
      La foresta di Babadag è una zona di protezione speciale che tutela ottantasette specie aviarie protette,
      di cui trentasei di interesse comunitario e sei minacciate a livello globale. Fa parte del complesso
      Podișul Nord Dobrogean che riunisce ventuno aree protette. Nelle loro soste, i rapaci vi nidificano,
      svernano, si nutrono e riposano.
    before: >-
      Non vi sono sentieri segnati, capanni di avvistamento o centri visite dedicati sull'altopiano di
      Babadag. Visita la zona in primavera o a inizio autunno durante il passo migratorio, consultando prima
      l'associazione di gestione del Podișul Nord Dobrogean.
    around: >-
      A ridosso dell'altopiano sorge il [Parco nazionale dei Monti
      Măcin](/lugar/parcul-national-muntii-macinului/). Più distante, il [Parco nazionale
      Körös-Maros](/lugar/koros-maros-nemzeti-park/) condivide biancone, cicogna nera e aquila di mare; la
      [Piana di Dévaványa](/lugar/koros-maros-nemzeti-park---devavanyai/) falco cuculo e albanella minore; e
      il [Parco paesaggistico della foresta di Knyszyn](/lugar/park-krajobrazowy-puszczy-knyszynskiej/) aquila
      minore, falco pecchiaiolo e biancone.
  pt:
    intro: >-
      Os otomanos chamaram-lhe Babadag, «Pai das Montanhas», julgando que a colina alcandorada sobre a
      povoação era a mais elevada de Dobruja. Não o é, mas o nome espelha a feição do relevo: um planalto
      baixo de vertentes suaves, coberto de carvalhais pubescentes no sudeste da Roménia, no maciço da
      Dobrogea do Norte. Pelas suas alturas cruzam na primavera e outono centenas de milhares de aves.
    landscape: >-
      Para sul, o planalto de Casimcea prolonga-se para lá da falha tectónica Peceneaga-Camena; a oeste
      rasga-se a várzea aluvial do Danúbio e a leste o sistema lagunar Razim-Sinoe, para onde o planalto cai
      abruptamente em arribas. É um relevo sedimentar de margas e arenitos cretácicos. As altitudes decrescem
      de oeste para leste, rondando os 300-400 metros, culminando na colina Cârjelari a 402 metros. A mata de
      Babadag ocupa um planalto de encostas inclinadas que atinge 220 metros de cota máxima sobre substrato
      calcário.


      Os carvalhais de carvalho-pubescente (*Quercus pubescens*) constituem bosques submediterrânicos
      termófilos com clareiras de estepe aberta. Mais de 44 por cento das estepes ponto-sarmáticas da Roménia,
      habitat prioritário, situam-se no sítio ROSCI0201 Podișul Nord Dobrogean que abarca este planalto. Nas
      clareiras e vertentes pedregosas desabrocha em maio e junho a peónia-brava *Paeonia peregrina*, de
      corolas vermelho-sangue, espécie emblemática na reserva natural Babadag-Codru.
    wildlife: >-
      Este é território de rapinas. Na mata nidificam contingentes expressivos de águia-pomarina,
      águia-cobreira, [bútio-rabo-canela](/especie/buteo_rufinus/), águia-calçada e gavião-grego. Os pica-paus
      residem todo o ano; entre os nidificantes estivais sobressaem o rolieiro-europeu, a petinha-dos-campos,
      a sombria e a felosa-gavião.


      Contudo, o grande espetáculo reside nas rotas de migração. Na primavera e no outono, a passagem canaliza
      centenas de milhares de aves através da região, unindo Dobruja e o delta do Danúbio à Europa e África.
      Três rotas principais convergem aqui: a rota a leste do Elba, a Via Pontica e a via sarmática. Bandos de
      cegonha-branca superam os cem mil indivíduos, secundados por milhares de pelicanos-vulgares,
      [cegonhas-pretas](/especie/ciconia_nigra/) e papa-moscas-pequenos. Desfilam contingentes de
      águia-pomarina, [tartaranhão-ruivo-dos-pauis](/especie/circus_aeruginosus/),
      [tartaranhão-apívoro](/especie/pernis_apivorus/),
      [falcão-de-pés-vermelhos](/especie/falco_vespertinus/), tartaranhão-caçador, águia-cobreira e
      [águia-rabalva](/especie/haliaeetus_albicilla/), invernando o tartaranhão-azulado. Ao todo, sessenta e
      uma espécies migradoras recorrem ao sítio.


      A [tartaruga-grega](/especie/testudo_graeca/) encontra-se amplamente espalhada em Dobruja pelas
      pastagens de estepe e matagais, ausentando-se do delta. Diurna e termófila, as crias eclodem em setembro
      e os adultos hibernam isolados ou agrupados em abrigos virados a sul.
    visit: >-
      Babadag, localidade implantada no sopé de colinas densamente arborizadas, funciona como ponto de
      partida; a nordeste confina com o lago Babadag. No seu perímetro sobrepõem-se o sítio Podișul Nord
      Dobrogean, a zona de proteção especial Pădurea Babadag e as reservas naturais Pădurea Babadag-Codru e
      Korum-Tarla. A cidade preserva herança otomana dos tempos em que figurou como centro urbano de relevo em
      Dobruja, referenciada documentalmente desde 1263.
    history: >-
      A floresta de Babadag é uma zona de proteção especial que alberga oitenta e sete espécies de aves
      protegidas, trinta e seis de interesse comunitário e seis sob ameaça global. Integra a rede Podișul Nord
      Dobrogean que reúne vinte e uma áreas protegidas. Na sua rota, as rapinas nidificam, invernam, caçam e
      repousam.
    before: >-
      Não existem trilhos sinalizados, torres de observação ou centros de interpretação no planalto de
      Babadag. Visita o sítio na primavera ou início do outono durante os picos migratórios e aconselha-te com
      a associação gestora do Podișul Nord Dobrogean.
    around: >-
      Contíguo ao planalto ergue-se o [Parque Nacional dos Montes
      Măcin](/lugar/parcul-national-muntii-macinului/). Mais longe, o [Parque Nacional
      Körös-Maros](/lugar/koros-maros-nemzeti-park/) partilha águia-cobreira, cegonha-preta e águia-rabalva; a
      [Planície de Dévaványa](/lugar/koros-maros-nemzeti-park---devavanyai/) falcão-de-pés-vermelhos e
      tartaranhão-caçador; e o [Parque Paisagístico da Floresta de
      Knyszyn](/lugar/park-krajobrazowy-puszczy-knyszynskiej/) águia-calçada, tartaranhão-apívoro e
      águia-cobreira.
