resumen:
  es: >-
    Macizo volcánico anclado hace 7 a 9 millones de años en el nordeste de Tenerife, cubierto de selva de
    laurisilva, cresterías afiladas y caseríos aislados.
  en: >-
    Volcanic massif anchored 7 to 9 million years ago in north-eastern Tenerife, draped in laurel rainforest,
    razor-sharp ridges and isolated hamlets.
  fr: >-
    Massif volcanique ancré il y a 7 à 9 millions d'années dans le nord-est de Tenerife, drapé de forêt de
    laurisilve, d'arêtes vives et de hameaux isolés.
  de: >-
    Vor 7 bis 9 Millionen Jahren im Nordosten Teneriffas entstandenes Vulkanmassiv, bedeckt von Lorbeerwald,
    scharfen Graten und abgelegenen Weilern.
  it: >-
    Massiccio vulcanico formatosi tra 7 e 9 milioni di anni fa nel nord-est di Tenerife, ammantato da foresta
    di laurisilva, creste affilate e borghi isolati.
  pt: >-
    Maciço vulcânico erguido há 7 a 9 milhões de anos no nordeste de Tenerife, coberto por floresta de
    laurissilva, cristas escarpadas e aldeias isoladas.
unico:
  es: >-
    En su laurisilva viven la paloma rabiche y la paloma turqué, dos reliquias vivientes que solo existen en
    Canarias.
  en: >-
    Its ancient cloud forest shelters the laurel pigeon and Bolle's pigeon, two living relicts found nowhere
    else on earth outside the Canaries.
  fr: >-
    Sa forêt de nuages abrite le pigeon des lauriers et le pigeon de Bolle, deux reliques vivantes qui
    n'existent nulle part ailleurs en dehors des Canaries.
  de: >-
    In seinem Nebelwald leben Lorbeertaube und Bolles Lorbeertaube, zwei lebende Relikte, die nirgendwo sonst
    außerhalb der Kanaren vorkommen.
  it: >-
    Nella sua foresta primigenia vivono la colomba dei lauri e la colomba di Bolle, due autentici fossili
    viventi che non esistono in alcun altro luogo fuori dalle Canarie.
  pt: >-
    Na sua floresta de nuvens habitam o pombo-rabil e o pombo-turqueza, duas relíquias vivas que só existem no
    arquipélago das Canárias.
observaciones:
  es: >-
    Algunas rutas necesitan permiso previo. El Pijaral, escarpado y poco accesible, exige autorización previa
    por la fragilidad de su ecosistema, y en el entorno del Bosque de los Enigmas se regula el número de
    visitantes. Muchos senderos principales, como el de los Sentidos, se recorren sin reserva.
texto:
  es:
    intro: >-
      Sube de la costa a la niebla en pocos kilómetros. En el extremo nordeste de Tenerife, el macizo de Anaga
      levanta cumbres recortadas sobre barrancos tan profundos que llegan hasta el mar, y en lo alto guarda un
      bosque que lleva 40 millones de años aquí: la laurisilva, una reliquia viva. Son unas 14.500 hectáreas
      entre La Laguna, Santa Cruz de Tenerife y Tegueste, y desde 2015 son Reserva de la Biosfera de la
      UNESCO.
    landscape: >-
      Anaga es una de las áreas geológicamente más antiguas de Tenerife, y se nota en la forma. Los roques son
      antiguas chimeneas volcánicas; los diques, fisuras rellenas de magma solidificado; y entre los elementos
      más representativos destacan los pitones de Chinobre y Anambro, el arco de Taganana y los Roques de
      Anaga. De la cumbre bajan valles y barrancos profundos que alcanzan el mar y forman numerosas playas.


      Esa diferencia de altura, de clima y de suelo explica la variedad biológica pese a lo reducido de la
      superficie: están representados casi todos los ecosistemas de la isla, salvo el de alta montaña. Arriba,
      la laurisilva de cumbres. En las medianías, sabinares, dragos y palmeras. Abajo, los
      cardonales-tabaibales y la vegetación costera. Los alisios aportan la humedad: en las zonas altas de
      laurisilva es frecuente la niebla y las temperaturas frescas.
    wildlife: >-
      Los protagonistas de la fauna son los invertebrados, con casi un centenar de especies únicas en el
      mundo. Entre las aves hay emblemas como la pardela cenicienta, el cernícalo, el búho y las palomas
      [rabiche](/especie/columba_junoniae/) y [turqué](/especie/columba_bollii/). El bosque es hábitat vital
      de las palomas de laurisilva, y por eso Anaga es Zona de Especial Protección para las Aves.


      El mar también cuenta. Destacan el chucho, una especie de manta, la merluza canaria, la vieja y una
      anguila autóctona en peligro de extinción. En cuanto al calendario, se puede visitar todo el año, pero
      entre octubre y mayo es especialmente agradable, con temperaturas suaves y el paisaje más verde.
    visit: >-
      Se llega por la TF-12, que enlaza La Laguna con los accesos, miradores y núcleos rurales del macizo. En
      Cruz del Carmen está el centro de visitantes, donde se explica la geología, la biodiversidad y la
      historia del macizo y se informa de las rutas.


      Para empezar, el Sendero de los Sentidos: corto, accesible y muy representativo del bosque de
      laurisilva, ideal para una primera visita y de recorrido libre. Desde el Mirador Cruz del Carmen hacia
      Chinamada la ruta cruza bosques con vistas a barrancos y caseríos, y los senderos hacia Taganana
      combinan paisaje de montaña con la llegada a uno de los núcleos rurales más conocidos. Cruz de Taborno
      ofrece panorámicas abiertas y relieve abrupto. Si tienes tiempo, la pista de Las Hiedras es una ruta
      lineal de 4,48 km y una hora y media; empieza en la TF-143 y termina junto a Casas de El Río, entre
      laurisilva y fayal-brezal con bejeques, musgos y líquenes. Después de la lluvia, hay cascadas visibles
      en el Salto del Tornero, el Barranco de Afur y la Cascada de las Tres Cabezas.
    history: >-
      Anaga se declaró espacio protegido en 1987, y contiene tres reservas naturales integrales: El Pijaral,
      Ijuana y los Roques de Anaga. Su población es de unas 2500 personas repartidas en unos 26 asentamientos,
      y Taganana, rodeado de montañas, conserva un fuerte carácter tradicional. Antes de ellos, los aborígenes
      usaron la comarca para habitar y pastorear.
    before: >-
      Algunas rutas necesitan permiso previo. El Pijaral, escarpado y poco accesible, exige autorización
      previa por la fragilidad de su ecosistema, y en el entorno del Bosque de los Enigmas se regula el número
      de visitantes. Muchos senderos principales, como el de los Sentidos, se recorren sin reserva.
    around: >-
      A unos veintiún kilómetros queda el [Malpaís de Güímar](/lugar/malpais-de-guimar/), y a veintisiete, el
      [Parque Nacional del Teide](/lugar/parque-nacional-del-teide/). Fuera de Tenerife, el [Parque Nacional
      de Garajonay](/lugar/parque-nacional-de-garajonay/) comparte con Anaga la laurisilva y las dos palomas,
      rabiche y turqué.
  en:
    intro: >-
      Climb from sunny ocean beaches into sea mists in just a few kilometres. At the north-eastern tip of
      Tenerife, the Anaga Massif lifts serrated ridgelines over gorges dropping precipitously straight into
      the Atlantic, safeguarding a forest that has thrived here for 40 million years: the laurisilva, a living
      relic of the Tertiary. It covers some 14,500 hectares between La Laguna, Santa Cruz de Tenerife and
      Tegueste, designated a UNESCO Biosphere Reserve since 2015.
    landscape: >-
      Anaga is one of the geologically oldest volcanic shields on Tenerife, clearly revealed in its landforms.
      The roques are eroded volcanic necks; the dykes represent fissures packed with cooled magma; and
      prominent landmarks include the phonolitic plugs of Chinobre and Anambro, the sea arch of Taganana and
      the offshore Roques de Anaga. From the central ridge descend deep ravines reaching the sea and framing
      secluded volcanic beaches.


      This dramatic gradient in elevation, climate and soils accounts for high biological diversity within a
      compact area, representing almost every ecosystem on the island except alpine mountain peaks. On the
      highest ridges thrives laurel cloud forest. Across mid-altitudes grow Canary juniper, dragon trees and
      Canary Island date palms. Below on coastal slopes grow euphorbia cardón-tabaiba scrub and halophytic
      sea-cliff communities. North-east trade winds bring moisture: summit rainforests are often shrouded in
      mist with brisk temperatures.
    wildlife: >-
      The stars of Anaga's fauna are invertebrates, including nearly a hundred endemic species unique to this
      massif. Birds include Canarian emblems such as Cory's shearwater, common kestrel, long-eared owl and
      both laurel forest pigeons, the [laurel pigeon](/especie/columba_junoniae/) and [Bolle's
      pigeon](/especie/columba_bollii/). The cloud forest is vital habitat for these endemic columbids, which
      is why Anaga is protected as a Special Protection Area for birds.


      The coastal waters are equally rich, featuring the common stingray, Canarian hake, parrotfish and an
      endangered native eel. As for timing, you can visit year-round, though October to May is especially
      delightful with pleasant temperatures and luxuriant green landscapes.
    visit: >-
      Access is via the scenic TF-12 highway, connecting La Laguna with panoramic viewpoints and mountain
      hamlets. At Cruz del Carmen stands the visitor centre, explaining regional geology, biodiversity and
      heritage while providing hiking route advice.


      Start along the Path of the Senses: short, accessible and deeply representative of the laurel forest,
      ideal for a first encounter and free to explore. From Cruz del Carmen viewpoint towards Chinamada,
      trails cross woodlands with views into wild gorges and cave villages, while routes down to Taganana
      combine alpine hiking with arrival at one of the island's most picturesque historic hamlets. Cruz de
      Taborno provides expansive ridge panoramas over rugged relief. If you have time, the Las Hiedras track
      is a linear trail of 4.48 km taking about an hour and a half; it starts on the TF-143 and ends near
      Casas de El Río through laurel forest and heath draped in aeoniums, mosses and lichens. After heavy
      rains, waterfalls cascade at Salto del Tornero, Barranco de Afur and the Cascada de las Tres Cabezas.
    history: >-
      Anaga was declared a protected nature area in 1987, containing three strict nature reserves: El Pijaral,
      Ijuana and Roques de Anaga. Its human population numbers roughly 2500 residents scattered across some 26
      traditional settlements, with Taganana preserving a pronounced rural character. Long before them, the
      indigenous Guanches inhabited the ravines and pastured their goats across the ridges.
    before: >-
      Certain trails require advance permits. El Pijaral is rugged and fragile, requiring mandatory booking
      due to its sensitive fern ecosystem, while visitor numbers are restricted around the Bosque de los
      Enigmas. Many main trails, such as the Path of the Senses, can be enjoyed without permits.
    around: >-
      About twenty-one kilometres away lies the [Malpaís de Güímar Special Nature
      Reserve](/lugar/malpais-de-guimar/), and twenty-seven kilometres away is [Teide National
      Park](/lugar/parque-nacional-del-teide/). On the neighbouring island of La Gomera, [Garajonay National
      Park](/lugar/parque-nacional-de-garajonay/) shares with Anaga pristine laurel forests and both laurel
      pigeons, the laurel pigeon and Bolle's pigeon.
  fr:
    intro: >-
      Grimpez de l'océan aux brumes en seulement quelques kilomètres. À la pointe nord-est de Tenerife, le
      massif d'Anaga dresse des crêtes déchiquetées au-dessus de ravins si profonds qu'ils plongent dans
      l'Atlantique, abritant sur les hauteurs une forêt présente depuis 40 millions d'années : la laurisilve,
      relique vivante de l'ère tertiaire. Ce territoire couvre quelque 14 500 hectares entre La Laguna, Santa
      Cruz de Tenerife et Tegueste, et forme depuis 2015 une réserve de biosphère de l'UNESCO.
    landscape: >-
      Anaga est l'une des structures géologiques les plus anciennes de Tenerife, ce que révèle son relief
      tourmenté. Les roques sont d'anciennes cheminées volcaniques érodées ; les dykes, d'antiques fissures
      comblées de magma refroidi ; et parmi les édifices remarquables se distinguent les pitons de Chinobre et
      Anambro, l'arche de Taganana et les Roques de Anaga en mer. Des crêtes dévalent des ravins vertigineux
      qui rejoignent l'océan et dessinent de nombreuses criques sauvages.


      Ce fort gradient altitudinal, climatique et pédologique explique la profusion biologique sur une
      superficie restreinte : presque tous les écosystèmes insulaires y sont représentés, hormis la haute
      montagne. En altitude s'épanouit la laurisilve. À mi-pente poussent sabines, dragonniers et palmiers des
      Canaries. En bas règnent les landes à euphorbes candélabres et la flore des falaises côtières. Les
      alizés apportent une humidité constante : dans la laurisilve sommitale règnent brumes fréquentes et
      fraîcheur revigorante.
    wildlife: >-
      Les invertébrés constituent la part majeure de la faune, avec près d'une centaine d'espèces uniques au
      monde. Chez les oiseaux figurent des symboles locaux comme le puffin cendré, le faucon crécerelle, le
      hibou moyen-duc et les deux pigeons endémiques, le [pigeon des lauriers](/especie/columba_junoniae/) et
      le [pigeon de Bolle](/especie/columba_bollii/). La forêt constitue l'habitat vital de ces pigeons
      forestiers, raison pour laquelle Anaga est classée zone de protection spéciale pour les oiseaux.


      Le littoral sous-marin est tout aussi riche. On y observe la pastenague, le merlu canarien, la vieille
      et une anguille indigène menacée. Le site se visite toute l'année, mais la période d'octobre à mai est
      particulièrement agréable, offrant des températures douces et des paysages d'une grande fraîcheur
      végétale.
    visit: >-
      On y accède par la route TF-12, qui relie La Laguna aux belvédères et villages ruraux du massif. À Cruz
      del Carmen se dresse le centre d'accueil des visiteurs, où sont expliquées géologie, biodiversité et
      traditions agricoles tout en renseignant sur les sentiers de randonnée.


      Commencez par le Sentier des Sens : court, très bien aménagé et emblématique de la forêt de lauriers,
      idéal pour un premier contact en accès libre. Depuis le belvédère de Cruz del Carmen vers Chinamada, les
      chemins traversent de superbes boisements avec vue sur des ravins sauvages et des habitats
      troglodytiques, tandis que les sentiers vers Taganana marient marche en crête et découverte d'un village
      historique réputé. Cruz de Taborno propose des panoramas vertigineux sur un relief ciselé. Si vous
      disposez de temps, la piste de Las Hiedras offre un itinéraire linéaire de 4,48 km pour une heure et
      demie de marche ; elle commence sur la TF-143 et s'achève près de Casas de El Río au milieu de la
      laurisilve ornée de mousses et lichens. Après les pluies, des cascades apparaissent au Salto del
      Tornero, au Barranco de Afur et à la Cascada de las Tres Cabezas.
    history: >-
      Anaga a été protégé dès 1987 et renferme trois réserves naturelles intégrales : El Pijaral, Ijuana et
      les Roques de Anaga. Sa population compte environ 2500 habitants répartis dans quelque 26 hameaux de
      montagne, Taganana conservant une forte empreinte traditionnelle. Bien avant eux, les Guanches
      occupaient déjà ces vallons pour leurs campements et leurs troupeaux.
    before: >-
      Certains itinéraires requièrent un permis préalable. El Pijaral, escarpé et fragile, exige une
      autorisation obligatoire pour protéger sa fougeraie relique, tandis que la fréquentation est régulée
      autour du Bosque de los Enigmas. De nombreux chemins majeurs, comme le Sentier des Sens, se parcourent
      sans réservation.
    around: >-
      À environ vingt et un kilomètres se trouve la réserve naturelle spéciale du [Malpaís de
      Güímar](/lugar/malpais-de-guimar/), et à vingt-sept kilomètres le [Parc national du
      Teide](/lugar/parque-nacional-del-teide/). Sur l'île voisine de La Gomera, le [Parc national de
      Garajonay](/lugar/parque-nacional-de-garajonay/) partage avec Anaga la forêt de laurisilve ainsi que les
      deux pigeons endémiques, pigeon des lauriers et pigeon de Bolle.
  de:
    intro: >-
      Vom Meeresufer in die Passatnebel in nur wenigen Kilometern. An der Nordostspitze Teneriffas erhebt das
      Anaga-Gebirge schroffe Felsgrate über Schluchten, die steil ins Meer abfallen, und birgt in den
      Höhenlagen einen seit 40 Millionen Jahren bestehenden Wald: den Lorbeerwald, ein lebendes Relikt des
      Tertiärs. Es umfasst rund 14.500 Hektar zwischen La Laguna, Santa Cruz de Tenerife und Tegueste und ist
      seit 2015 ein UNESCO-Biosphärenreservat.
    landscape: >-
      Anaga gehört zu den geologisch ältesten Gebieten Teneriffas, was sich in seinen Landschaftsformen
      deutlich abzeichnet. Die Roques sind erodierte Vulkanschlote; die Dykes einstige, mit erstarrtem Magma
      gefüllte Spalten; zu den markantesten Landmarken zählen die Felsspitzen von Chinobre und Anambro, der
      Brandungsbogen von Taganana und die Felsinseln Roques de Anaga. Vom Kamm stürzen tiefe Schluchten zum
      Meer hinab und bilden einsame Buchten.


      Dieses Gefälle aus Höhenstufen, Mikroklimata und Böden erklärt die biologische Vielfalt auf kleinem
      Raum: Nahezu alle Inselbiotope mit Ausnahme des Hochgebirges sind hier vertreten. Oben gedeiht der
      Lorbeer-Nebelwald. In den mittleren Lagen wachsen Wacholder, Drachenbäume und Kanarische Dattelpalmen.
      Unten breiten sich Wolfsmilchheiden und die Küstenflora aus. Die Nordostpassate bringen Feuchtigkeit: In
      den Höhenlagen herrschen oft dichte Nebel und kühle Temperaturen.
    wildlife: >-
      Im Mittelpunkt der Tierwelt stehen Wirbellose mit fast hundert Arten, die weltweit einzigartig sind. Bei
      den Vögeln heben sich kanarische Wahrzeichen wie Gelbschnabel-Sturmtaucher, Turmfalke, Waldohreule sowie
      die [Lorbeertaube](/especie/columba_junoniae/) und [Bolles Lorbeertaube](/especie/columba_bollii/) ab.
      Der Wald ist lebenswichtig für die endemischen Taubenarten, weshalb Anaga als Europäisches
      Vogelschutzgebiet ausgewiesen ist.


      Auch der Meeresraum ist artenreich. Bemerkenswert sind Stechrochen, Kanarischer Seehecht, Papageifisch
      und ein bedrohter einheimischer Aal. Der Park lässt sich das ganze Jahr über bereisen, doch von Oktober
      bis Mai ist die Wanderung bei milden Temperaturen und üppigem Grün besonders reizvoll.
    visit: >-
      Die Anreise erfolgt über die TF-12, die La Laguna mit Aussichtspunkten und Bergdörfern verbindet. In
      Cruz del Carmen liegt das Besucherzentrum, das Geologie, Artenvielfalt und Geschichte des Massivs
      vermittelt und über Wanderwege informiert.


      Zum Einstieg empfiehlt sich der Sendero de los Sentidos: kurz, barrierearm und beispielhaft für den
      Lorbeerwald, frei zugänglich und ideal für den Erstbesuch. Vom Aussichtspunkt Cruz del Carmen nach
      Chinamada quert die Route Bergwälder mit Tiefblicken in Schluchten und Höhlendörfer, während die Wege
      hinab nach Taganana Bergwandern mit dem Besuch eines traditionsreichen Bergdorfs verbinden. Cruz de
      Taborno bietet weite Ausblicke über zerklüftete Bergrippen. Wer Zeit hat, wählt die Forststraße Las
      Hiedras: 4,48 km Gehstrecke und rund anderthalb Stunden Wanderzeit; sie beginnt an der TF-143 und endet
      bei Casas de El Río im Lorbeer- und Heidebuschwald. Nach Regen zeigen sich Wasserfälle am Salto del
      Tornero, im Barranco de Afur und an der Cascada de las Tres Cabezas.
    history: >-
      Anaga wurde 1987 als Naturschutzgebiet ausgewiesen und umfasst drei Naturreservate: El Pijaral, Ijuana
      und die Roques de Anaga. Die Bevölkerung umfasst rund 2500 Menschen in etwa 26 Weilern; Taganana hat
      seinen ländlichen Charakter bewahrt. Lange vor ihnen nutzten die Ureinwohner Guanchen die Täler zum
      Siedeln und Hüten.
    before: >-
      Einige Wanderungen erfordern eine Vorabanmeldung. Für El Pijaral ist wegen der Empfindlichkeit der
      Reliktfarne eine Genehmigung vorgeschrieben, und im Umfeld des Bosque de los Enigmas wird der
      Besucherzustrom reguliert. Viele Hauptwege wie der Sendero de los Sentidos können genehmigungsfrei
      begangen werden.
    around: >-
      Rund einundzwanzig Kilometer entfernt liegt das Schutzgebiet [Malpaís de
      Güímar](/lugar/malpais-de-guimar/) und siebenundzwanzig Kilometer entfernt der [Nationalpark
      Teide](/lugar/parque-nacional-del-teide/). Auf La Gomera teilt der [Nationalpark
      Garajonay](/lugar/parque-nacional-de-garajonay/) Lorbeerurwälder sowie Lorbeertaube und Bolles
      Lorbeertaube mit Anaga.
  it:
    intro: >-
      Si sale dalla costa marina alle nebbie in una manciata di chilometri. All'estremità nord-orientale di
      Tenerife, il massiccio di Anaga innalza creste scoscese sopra forre così profonde da tuffarsi
      nell'oceano, custodendo in quota una foresta che prospera qui da 40 milioni di anni: la laurisilva,
      preziosa reliquia del Terziario. Si estende su circa 14.500 ettari tra La Laguna, Santa Cruz de Tenerife
      e Tegueste, ed è Riserva della Biosfera UNESCO dal 2015.
    landscape: >-
      Anaga costituisce una delle strutture geologiche più arcaiche di Tenerife, come rivela il rilievo
      tormentato. I roques sono antichi condotti vulcanici dissepolti; i dicchi, fessure colmate di magma
      consolidato; e tra i tratti più celebri spiccano i pitoni di Chinobre e Anambro, l'arco marino di
      Taganana e i Roques de Anaga al largo. Dalla dorsale scendono valloni e gole profonde che toccano il
      mare aprendo suggestive spiaggette vulcaniche.


      Questo dislivello di quota, clima e suoli spiega la ricchezza biologica su un'area compatta: sono
      presenti quasi tutti gli habitat dell'isola tranne l'alta montagna. In vetta regna la laurisilva. Alle
      medie quote vegetano gineprai, alberi del drago e palme canarie. Più in basso allignano le formazioni di
      euforbie a candelabro e la flora litorale. Gli alisei apportano umidità: sui crinali della laurisilva
      dominano nebbie fitte e temperature fresche.
    wildlife: >-
      Gli invertebrati sono i veri sovrani della fauna, con quasi un centinaio di specie esclusive al mondo.
      Tra i volatili figurano simboli canari come la berta maggiore, il gheppio, il gufo comune e le due
      colombe boschive, la [colomba dei lauri](/especie/columba_junoniae/) e la [colomba di
      Bolle](/especie/columba_bollii/). La foresta umida costituisce l'habitat insostituibile di questi
      colombi endemici, motivo per cui Anaga è Zona di Protezione Speciale per l'avifauna.


      Il mare è altrettanto generoso. Si segnalano il trigone, il nasello canario, il pesce pappagallo e
      un'anguilla indigena a rischio di estinzione. La visita è praticabile in ogni mese, ma da ottobre a
      maggio il clima è particolarmente gradevole, con temperature miti e vegetazione rigogliosa.
    visit: >-
      Si raggiunge tramite la TF-12, che unisce La Laguna a punti panoramici e frazioni rurali del massiccio.
      A Cruz del Carmen ha sede il centro visitatori, dove vengono illustrate geologia, biodiversità e cultura
      locale fornendo mappe dei percorsi.


      Per iniziare, il Sendero de los Sentidos: breve, accessibile e fedele spaccato della laurisilva, a
      fruizione libera e ottimo come primo approccio. Dal Mirador Cruz del Carmen verso Chinamada il percorso
      attraversa fitti boschi con affacci su gole selvagge e case rupestri, mentre i tracciati verso Taganana
      accostano camminate montane all'arrivo in uno dei borghi più caratteristici. Cruz de Taborno riserva
      viste aeree su un profilo tormentato. Se disponi di tempo, la pista de Las Hiedras è un tracciato
      lineare di 4,48 km per un'ora e mezza di cammino; inizia sulla TF-143 e termina presso Casas de El Río
      tra laurisilva, felci e muschi. Dopo le piogge si formano cascate al Salto del Tornero, nel Barranco de
      Afur e alla Cascada de las Tres Cabezas.
    history: >-
      Anaga fu dichiarata spazio naturale protetto nel 1987 e comprende tre riserve naturali integrali: El
      Pijaral, Ijuana e i Roques de Anaga. La popolazione ammonta a circa 2500 residenti ripartiti in 26
      borgate montane, con Taganana fedele alle sue tradizioni contadine. Ben prima di loro, i guanci
      frequentavano queste valli per insediarsi e pascolare le greggi.
    before: >-
      Alcuni sentieri esigono permesso preventivo. El Pijaral, aspro e fragile, richiede prenotazione
      obbligatoria per tutelare le felci arborescenti, e l'afflusso è contingentato attorno al Bosque de los
      Enigmas. Molti itinerari principali, come il Sentiero dei Sensi, si percorrono liberamente.
    around: >-
      A circa ventuno chilometri si trova la riserva speciale del [Malpaís de
      Güímar](/lugar/malpais-de-guimar/), e a ventisette chilometri il [Parco Nazionale del
      Teide](/lugar/parque-nacional-del-teide/). Sull'isola di La Gomera, il [Parco Nazionale di
      Garajonay](/lugar/parque-nacional-de-garajonay/) condivide con Anaga la laurisilva e le due colombe dei
      lauri e di Bolle.
  pt:
    intro: >-
      Sobe-se da orla costeira até ao nevoeiro em escassos quilómetros. No extremo nordeste de Tenerife, o
      maciço de Anaga ergue cristas recortadas sobre ravinas tão profundas que desembocam no mar, resguardando
      nas alturas uma floresta que perdura aqui há 40 milhões de anos: a laurissilva, relíquia viva da Era
      Terciária. São cerca de 14.500 hectares repartidos entre La Laguna, Santa Cruz de Tenerife e Tegueste,
      classificados como Reserva da Biosfera da UNESCO desde 2015.
    landscape: >-
      Anaga constitui uma das áreas geologicamente mais antigas de Tenerife, o que transparece na sua
      fisionomia. Os roques são antigas chaminés vulcânicas desnudadas; os diques, fendas preenchidas com
      magma solidificado; e entre os relevos emblemáticos avultam os pitões de Chinobre e Anambro, o arco de
      Taganana e os Roques de Anaga em pleno oceano. Da crista central descem vales e barrancos abruptos que
      tocam o mar formando praias selvagens.


      Este forte desnível em altitude, clima e solos explica a proliferação biológica numa área contida:
      encontram-se representados quase todos os biomas da ilha com exceção da alta montanha. No cimo viceja a
      laurissilva de nevoeiro. Nas cotas médias surgem sabinais, dragoeiros e palmeiras-das-canárias. Em baixo
      imperam os cardonais e a vegetação costeira. Os ventos alísios trazem a humidade: nas matas de altitude
      são frequentes as névoas densas e as temperaturas frescas.
    wildlife: >-
      O maior destaque faunístico recai sobre os invertebrados, com perto de uma centena de espécies
      exclusivas no mundo. Entre as aves figuram símbolos canários como a cagarra, o francelho, o bufo-pequeno
      e os dois pombos da floresta, o [pombo-rabil](/especie/columba_junoniae/) e o
      [pombo-turqueza](/especie/columba_bollii/). A mata húmida constitui o reduto vital destas espécies
      florestais, razão pela qual Anaga é Zona de Proteção Especial para as Aves.


      O ecossistema marinho é igualmente riquíssimo. Destacam-se o uge, a pescada-canária, o peixe-papagaio e
      uma enguia autóctone em risco de extinção. Pode visitar-se em qualquer estação, sendo o período de
      outubro a maio especialmente prazenteiro, com temperaturas amenas e encostas verdejantes.
    visit: >-
      O acesso faz-se pela estrada TF-12, que liga La Laguna aos miradouros e aglomerados rurais do maciço. Em
      Cruz del Carmen situa-se o centro de visitantes, onde se dá a conhecer a geologia, a biodiversidade e a
      história local, prestando apoio sobre percursos pedestres.


      Para começar, o Sendero de los Sentidos: curto, acessível e muito fiel ao ambiente da laurissilva, de
      acesso livre e excelente para um primeiro contacto. Do Miradouro de Cruz del Carmen rumo a Chinamada a
      rota atravessa matas com vistas para barrancos e casas-cova, enquanto as veredas para Taganana combinam
      montanha com a chegada a uma das aldeias históricas mais emblemáticas. Cruz de Taborno abre amplas
      panorâmicas sobre o relevo fragoso. Se tiveres tempo, o trilho de Las Hiedras é uma rota linear de 4,48
      km que requer uma hora e meia; inicia-se na TF-143 e remata junto a Casas de El Río, cruzando
      laurissilva e urzais com musgos e líquenes. Após as chuvas avistam-se cascatas no Salto del Tornero, no
      Barranco de Afur e na Cascada de las Tres Cabezas.
    history: >-
      Anaga foi classificada como área protegida em 1987 e integra três reservas naturais integrais: El
      Pijaral, Ijuana e os Roques de Anaga. A sua população ronda as 2500 pessoas distribuídas por 26
      povoados, mantendo Taganana uma forte identidade rural. Muito antes deles, os aborígenes guanches
      ocupavam estas vertentes para habitar e pastorear.
    before: >-
      Certos trilhos exigem marcação prévia. El Pijaral, íngreme e vulnerável, requer autorização obrigatória
      devido à raridade dos seus fetos arborescentes, regulando-se o número de caminhantes junto ao Bosque de
      los Enigmas. A maioria dos caminhos principais, como o dos Sentidos, efetua-se sem reserva.
    around: >-
      A cerca de vinte e um quilómetros fica a reserva do [Malpaís de Güímar](/lugar/malpais-de-guimar/), e a
      vinte e sete o [Parque Nacional do Teide](/lugar/parque-nacional-del-teide/). Na ilha vizinha de La
      Gomera, o [Parque Nacional de Garajonay](/lugar/parque-nacional-de-garajonay/) partilha com Anaga a
      laurissilva e ambos os pombos, o pombo-rabil e o pombo-turqueza.
