resumen:
  es: >-
    El mayor espacio protegido marítimo-terrestre de origen volcánico de la Europa mediterránea, con
    acantilados de lava, dunas fósiles y praderas de Posidonia.
  en: >-
    The largest protected marine-terrestrial area of volcanic origin in Mediterranean Europe, featuring lava
    cliffs, fossil dunes and Posidonia meadows.
  fr: >-
    Le plus grand espace protégé maritime-terrestre d'origine volcanique d'Europe méditerranéenne, aux
    falaises de lave, dunes fossiles et herbiers de posidonie.
  de: >-
    Das größte maritim-terrestrische Schutzgebiet vulkanischen Ursprungs im mediterranen Europa mit
    Lavaklippen, fossilen Dünen und Posidonia-Seegraswiesen.
  it: >-
    La più vasta area protetta marittimo-terrestre di origine vulcanica dell'Europa mediterranea, con falesie
    laviche, dune fossili e praterie di Posidonia.
  pt: >-
    O maior espaço protegido marítimo-terrestre de origem vulcânica da Europa mediterrânica, com arribas de
    lava, dunas fósseis e pradarias de Posidonia.
unico:
  es: >-
    Un mismo parque reúne volcanes secos, salinas con flamencos todo el año y praderas de
    [Posidonia](/especie/posidonia_oceanica/) bajo un mar protegido de 63 km de costa.
  en: >-
    A single park brings together arid volcanoes, year-round flamingos in salt pans and
    [Posidonia](/especie/posidonia_oceanica/) meadows beneath a protected 63 km coastline.
  fr: >-
    Un même parc réunit volcans arides, salines aux flamants présents toute l'année et herbiers de
    [Posidonie](/especie/posidonia_oceanica/) sous un littoral protégé de 63 km de côtes.
  de: >-
    Ein einziger Park vereint aride Vulkane, ganzjährige Flamingos in Salinen und
    [Posidonia](/especie/posidonia_oceanica/)-Wiesen unter einem geschützten Meeresstreifen an 63 km Küste.
  it: >-
    Un solo parco racchiude vulcani aridi, saline popolate da fenicotteri tutto l'anno e praterie di
    [Posidonia](/especie/posidonia_oceanica/) sotto un mare protetto lungo 63 km di costa.
  pt: >-
    Um mesmo parque reúne vulcões áridos, salinas com flamingos todo o ano e pradarias de
    [Posidonia](/especie/posidonia_oceanica/) sob um mar protegido ao longo de 63 km de costa.
observaciones:
  es: >-
    En el sendero de Loma Pelada no siempre hay cobertura: lleva el móvil con batería para llamar al 112 si
    hace falta. No arrojes colillas ni nada que pueda provocar fuego.
texto:
  es:
    intro: >-
      Aquí no hay invierno climático. El clima es tan árido que Cabo de Gata-Níjar es el espacio natural más
      seco de toda Europa, y esa sequedad ha dejado un paisaje de lava, estepa y mar transparente. Fue el
      primer espacio protegido marítimo-terrestre de Andalucía, y la UNESCO lo reconoce como Reserva de la
      Biosfera y Geoparque Mundial.
    landscape: >-
      Todo parte de la roca. Dominan los sustratos volcánicos: coladas de lava, domos y playas fósiles que
      pintan el paisaje de ocres, negros y rojizos. Sobre ellos se extiende una orla costera de dunas, estepas
      y charcos salinos, y por delante corre una franja marina protegida paralela a la costa. Es un mosaico,
      no una postal única: cada kilómetro cambia de ecosistema.


      La flora responde a la dureza del lugar. Con apenas lluvia y un suelo pobre, el parque guarda uno de los
      conjuntos de flora más singulares de Europa, con más de 1.000 especies exclusivas. El palmito y el
      cornical trepan por las laderas volcánicas, y esparto, romero y azufaifos tapizan las llanuras. En la
      temprana primavera miles de margaritas de mar tiñen de amarillo los acantilados.


      Bajo el agua, la escena se repite en versión submarina. En los fondos crecen praderas de Posidonia,
      auténticos bosques sumergidos donde viven cangrejos, pulpos y peces, y la nacra, el bivalvo protegido
      más grande del Mediterráneo. En los fondos rocosos hay falsos corales, algas y el mero, al que llaman el
      rey del roquedo. Y la franja protegida tiene algo más raro: en ella conviven especies de uno y otro lado
      de las corrientes que separan el cabo de Gata del norte de África.
    wildlife: >-
      Las aves tienen dos escenarios muy distintos. El primero son las salinas de Cabo de Gata. Allí avocetas,
      cigüeñuelas y chorlitejos buscan alimento, y se ven gaviotas, ánades y flamencos. El
      [flamenco](/especie/phoenicopterus_roseus/) rosado está durante todo el año, una de las singularidades
      ornitológicas del sitio. Como no hay invierno térmico, muchas especies se quedan en esa estación, y las
      migratorias usan las salinas como punto de descanso. Entre las salinas y la cercana Rambla Morales se
      pueden ver más de 80 especies a lo largo del año.


      El segundo es la estepa de Las Amoladeras, al abrigo de espartales y tomillares, donde vive una
      comunidad de aves difíciles de ver: alcaravanes, cogujadas, terreras y la [alondra de
      Dupont](/especie/chersophilus_duponti/). Por eso el sendero que recorre el paraje, la ruta de las aves,
      entra en una Zona de Reserva.
    visit: >-
      Empieza por entender el terreno. El centro de visitantes de Las Amoladeras muestra los asentamientos
      humanos en el parque desde el Neolítico, y la Casa de los Volcanes fue el primer ecomuseo de Andalucía
      dedicado a interpretar los rasgos geológicos del territorio. El parque tiene 16 senderos de uso público
      que pasan por la mayoría de sus 33 georrecursos, con paneles que explican la geología. El Pocico-Las
      Marinas enseña las playas fósiles; La Vela Blanca, los acantilados volcánicos; La Molata, la cultura del
      viento y el agua; y Requena, cómo se vivía antes.


      El sendero de Loma Pelada mide 5.900 metros de ida, dura dos horas y media y tiene dificultad baja. Sale
      de Los Escullos, donde el castillo de San Felipe es uno de los bastiones levantados en el siglo XVIII
      para vigilar la costa, y se asoma a cortados y calas inaccesibles como cala Tomate, con el Cerro del
      Fraile como punto alto a la vista. En bicicleta hay una ruta que recorre el antiguo pueblo minero de
      Rodalquilar hasta el Cerro del Cinto, con buena panorámica.


      Y está el agua. Puedes bucear en aguas transparentes como las de La Isleta, entre formas coralinas,
      peces de colores y praderas de Posidonia, o salir en barco hasta calas abruptas como Cala Chica o San
      Pedro. En la costa también se practica piragüismo.
    history: >-
      El parque es también un paisaje humano. Cortijos abandonados, norias, aljibes y molinos, todos Bien de
      Interés Cultural, recuerdan el aprovechamiento tradicional de los recursos. Fenicios y romanos dejaron
      factorías de salazón de pescado y púrpura en Torregarcía, y los árabes, regadíos y las torres de
      vigilancia que jalonan la costa. De ellos se heredan además el esparto, las jarapas y la alfarería.


      La protección llegó pronto: el parque se creó en 1987, y la franja marina protegida recorre 63 km de
      costa, el mayor espacio marino protegido de la costa continental europea. Hay una paradoja que cuida a
      las aves: las salinas de Cabo de Gata siguen en explotación porque esa actividad es imprescindible para
      conservar su riqueza ornitológica.
    before: >-
      En el sendero de Loma Pelada no siempre hay cobertura: lleva el móvil con batería para llamar al 112 si
      hace falta. No arrojes colillas ni nada que pueda provocar fuego.
    around: >-
      A unos veintitrés kilómetros queda el [Paraje Natural Desierto de
      Tabernas](/lugar/paraje-natural-desierto-de-tabernas/), otro rincón árido del sureste. Lejos de aquí,
      otros espacios comparten con Cabo de Gata la costa y el mar con praderas de Posidonia: el [Parque
      Natural de Ses Salines](/lugar/parque-natural-de-ses-salines/), que además tiene flamencos, el [Parc
      Natural del Cap de Creus](/lugar/parc-natural-del-cap-de-creus/), el [Parc national de
      Port-Cros](/lugar/parc-national-de-port-cros/) y el [Nacionalni park
      Kornati](/lugar/nacionalni-park-kornati/).
  en:
    intro: >-
      There is no climatic winter here. The climate is so arid that Cabo de Gata-Níjar is the driest natural
      space in all of Europe, and that arid character has created a landscape of lava, steppe and crystalline
      seas. It was Andalusia's first protected maritime-terrestrial space, recognized by UNESCO as both a
      Biosphere Reserve and a Global Geopark.
    landscape: >-
      Everything starts with volcanic rock. Dark volcanic beds dominate: lava flows, domes and fossil beaches
      painting the landscape in ochre, black and reddish tones. Over them lies a coastal fringe of sand dunes,
      steppe and salt lagoons, bordered seaward by a marine reserve running parallel to the shore. It is a
      shifting mosaic rather than a single postcard view: every kilometre brings a change in ecosystem.


      The flora reflects this harsh environment. With negligible rainfall and poor soils, the park shelters
      one of the most singular botanical assemblages in Europe, with over 1,000 exclusive plant species.
      European fan palm and periploca climb volcanic hillsides, while esparto grass, rosemary and jujube trees
      carpet the plains. In early spring, thousands of sea daisies turn the cliffs bright yellow.


      Beneath the surface, the spectacle continues underwater. Submerged seabed hosts meadows of Posidonia,
      genuine submarine forests inhabited by crabs, octopuses and fish, alongside the noble pen shell, the
      largest protected bivalve in the Mediterranean. Rocky seabeds feature false corals, seaweeds and dusky
      groupers, known as kings of the reef. The marine reserve holds an even rarer wonder: species from both
      sides of the currents separating Cabo de Gata from North Africa thrive side by side.
    wildlife: >-
      Birds occupy two contrasting arenas. The first is the salt pans of Cabo de Gata. Here pied avocets,
      black-winged stilts and plovers forage, alongside gulls, wild ducks and flamingos. The greater
      [flamingo](/especie/phoenicopterus_roseus/) remains throughout the entire year, one of the site's
      ornithological marvels. Because there is no thermal winter, many birds overwinter here, while migratory
      flocks use the lagoons as a staging post. Between the salt pans and nearby Rambla Morales, over 80
      species can be observed across the year.


      The second setting is the steppe of Las Amoladeras, sheltered by esparto grass and thyme scrub, home to
      elusive birds: Eurasian stone-curlews, crested larks, short-toed larks and [Dupont's
      lark](/especie/chersophilus_duponti/). For this reason, the trail traversing this area, known as the
      bird route, enters a strict Nature Reserve.
    visit: >-
      Begin by understanding the terrain. The Las Amoladeras visitor centre traces human occupation in the
      park back to the Neolithic, and the Casa de los Volcanes was Andalusia's pioneering eco-museum
      interpreting regional geological features. The park maintains 16 marked walking trails visiting most of
      its 33 recognized geological landmarks, complete with explanatory signboards. El Pocico-Las Marinas
      showcases fossil beaches; La Vela Blanca highlights volcanic cliffs; La Molata explores traditional wind
      and water harvesting; and Requena reveals how early inhabitants lived.


      The Loma Pelada trail measures 5,900 metres one-way, takes two and a half hours and is graded easy. It
      sets out from Los Escullos, where the eighteenth-century San Felipe fort stands as one of the coastal
      watchposts, overlooking sheer cliffs and secluded coves such as Cala Tomate, with the Cerro del Fraile
      rising as a landmark peak. Cyclists can pedal through the historic mining village of Rodalquilar up to
      Cerro del Cinto for sweeping views.


      Then comes the sea. You can snorkel in crystal-clear waters like those of La Isleta amid coral-like
      reefs, colourful fish and Posidonia beds, or take boat excursions to remote coves such as Cala Chica or
      San Pedro. Kayaking is also popular along the sheltered shoreline.
    history: >-
      The park is equally a cultural landscape. Abandoned farmsteads, water wheels, cisterns and windmills,
      all designated Cultural Heritage Sites, reflect age-old stewardship of scarce resources. Phoenicians and
      Romans established fish-salting and purple-dye factories at Torregarcía, while the Moors introduced
      irrigation systems and watchtowers ringing the coast. Esparto weaving, traditional jarapa rugs and
      pottery are living crafts inherited from them.


      Legal protection arrived early: the park was established in 1987, and its marine reserve protects 63 km
      of coastline, making it the largest coastal marine reserve in continental Europe. An unexpected harmony
      protects wildlife: the Cabo de Gata salt pans remain commercially active, because ongoing salt
      extraction is indispensable for sustaining their birdlife.
    before: >-
      Along the Loma Pelada trail mobile phone coverage is intermittent: keep your battery charged to dial 112
      in emergencies. Never discard cigarette butts or anything that could ignite a wildfire.
    around: >-
      About twenty-three kilometres away lies the [Desierto de Tabernas Natural
      Area](/lugar/paraje-natural-desierto-de-tabernas/), another arid stronghold of south-eastern Spain.
      Farther away, other Mediterranean coastal reserves share marine areas with Posidonia beds: [Ses Salines
      Natural Park](/lugar/parque-natural-de-ses-salines/), which also hosts flamingos, [Cap de Creus Natural
      Park](/lugar/parc-natural-del-cap-de-creus/), [Port-Cros National
      Park](/lugar/parc-national-de-port-cros/) and [Kornati National Park](/lugar/nacionalni-park-kornati/).
  fr:
    intro: >-
      Ici, l'hiver climatique n'existe pas. Le climat est si aride que Cabo de Gata-Níjar constitue l'espace
      naturel le plus sec de toute l'Europe, forgeant un paysage de lave, de steppe et d'eaux cristallines. Ce
      fut le premier espace protégé maritime-terrestre d'Andalousie, reconnu par l'UNESCO comme réserve de
      biosphère et géoparc mondial.
    landscape: >-
      Tout commence par la roche volcanique. Les substrats volcaniques prédominent : coulées de lave, dômes et
      plages fossiles parant le paysage d'ocres, de noirs et de pourpres. Au-dessus s'étire un cordon côtier
      de dunes, de steppes et de lagunes salées, bordé au large par une bande marine protégée parallèle au
      rivage. C'est une mosaïque vivante, non une vue figée : chaque kilomètre dévoile un nouvel écosystème.


      La flore reflète l'extrême sécheresse des lieux. Sous des pluies dérisoires et sur un sol pauvre, le
      parc recèle l'une des flores les plus singulières d'Europe, avec plus de 1 000 espèces exclusives. Le
      palmier doum et le périploque colonisent les versants volcaniques, tandis que l'alfa, le romarin et le
      jujubier tapissent les plaines. Au tout début du printemps, des milliers de marguerites marines peignent
      les falaises d'un jaune éclatant.


      Sous l'eau, le spectacle se déploie en version sous-marine. Les fonds marins hébergent des herbiers de
      Posidonie, véritables forêts immergées où vivent crabes, poulpes et poissons, ainsi que la grande nacre,
      le plus grand bivalve protégé de Méditerranée. Sur les fonds rocheux prospèrent faux coraux, algues et
      mérous, souverains des hauts-fonds. La réserve marine abrite une autre particularité : s'y côtoient des
      espèces issues des deux rives des courants séparant Cabo de Gata de l'Afrique du Nord.
    wildlife: >-
      Les oiseaux évoluent dans deux décors très différents. Le premier rassemble les salines de Cabo de Gata.
      Avocettes, échasses blanches et grands gravelots y cherchent leur pitance, parmi les goélands, canards
      et flamants. Le [flamant](/especie/phoenicopterus_roseus/) rose y réside toute l'année, curiosité
      ornithologique majeure du site. En l'absence de véritable hiver thermique, de nombreuses espèces y
      séjournent en permanence, tandis que les migrateurs s'y reposent. Entre les salines et la Rambla Morales
      voisine, plus de 80 espèces s'observent au fil des saisons.


      Le second biotope est la steppe des Amoladeras, à l'abri des touffes d'alfa et de thym, refuge d'oiseaux
      discrets : œdicnèmes, cochesvis, alouettes calandrelles et l'[alouette de
      Dupont](/especie/chersophilus_duponti/). C'est pourquoi le sentier parcourant le site, la route des
      oiseaux, pénètre en zone de réserve intégrale.
    visit: >-
      Commencez par appréhender la géographie du parc. Le centre de visiteurs des Amoladeras retrace
      l'occupation humaine depuis le Néolithique, et la Casa de los Volcanes a constitué le premier écomusée
      d'Andalousie dédié à l'interprétation géologique. Le parc compte 16 sentiers balisés desservant la
      majorité de ses 33 géosites, dotés de pupitres explicatifs. El Pocico-Las Marinas dévoile les plages
      fossiles ; La Vela Blanca, les falaises volcaniques ; La Molata, les traditions du vent et de l'eau ; et
      Requena, la vie des anciens habitants.


      Le sentier de Loma Pelada mesure 5 900 mètres aller, dure deux heures et demie et présente une faible
      difficulté. Il part de Los Escullos, où le fort San Felipe compte parmi les bastions édifiés au XVIIIe
      siècle pour surveiller la côte, avant d'aborder des calanques sauvages comme cala Tomate, dominées par
      le Cerro del Fraile. À vélo, un itinéraire traverse l'ancien village minier de Rodalquilar jusqu'au
      Cerro del Cinto pour jouir d'un vaste panorama.


      Puis vient le royaume marin. Vous pouvez plonger dans des eaux translucides comme celles de La Isleta,
      entre récifs coralliens, poissons chamarrés et herbiers de Posidonie, ou voguer en bateau vers des
      criques reculées telles Cala Chica ou San Pedro. Le kayak de mer est également très prisé le long du
      rivage.
    history: >-
      Le parc forme également un paysage profondément humain. Fermes abandonnées, norias, citernes et moulins,
      tous classés biens d'intérêt culturel, témoignent d'une gestion ingénieuse des ressources. Phéniciens et
      Romains y installèrent des salaisons de poisson et des teintureries de pourpre à Torregarcía, relayés
      par les Maures avec leurs réseaux d'irrigation et tours de guet côtières. Le tressage de l'alfa, les
      tapis jarapas et la poterie constituent des savoir-faire hérités de ces civilisations.


      La protection a été précoce : le parc est né en 1987, et sa bande marine protégée s'étend sur 63 km de
      côtes, constituant la plus grande réserve marine de l'Europe continentale. Un paradoxe protège
      l'avifaune : les salines de Cabo de Gata restent exploitées, car cette activité salicole est
      indispensable à la préservation de leur richesse écologique.
    before: >-
      Sur le sentier de Loma Pelada, le réseau mobile fait parfois défaut : gardez votre téléphone chargé pour
      joindre le 112 en cas d'urgence. Ne jetez aucun mégot ni objet susceptible d'allumer un incendie.
    around: >-
      À environ vingt-trois kilomètres s'étend le [Paraje Natural Desierto de
      Tabernas](/lugar/paraje-natural-desierto-de-tabernas/), autre sanctuaire aride du sud-est. Plus au
      large, d'autres parcs partagent des côtes rocheuses et des herbiers de Posidonie : le [Parque Natural de
      Ses Salines](/lugar/parque-natural-de-ses-salines/), qui abrite aussi des flamants, le [Parc Natural del
      Cap de Creus](/lugar/parc-natural-del-cap-de-creus/), le [Parc national de
      Port-Cros](/lugar/parc-national-de-port-cros/) et le [Nacionalni park
      Kornati](/lugar/nacionalni-park-kornati/).
  de:
    intro: >-
      Hier gibt es keinen klimatischen Winter. Das Klima ist so trocken, dass Cabo de Gata-Níjar das
      niederschlagsärmste Schutzgebiet ganz Europas darstellt; diese Trockenheit hat eine Landschaft aus
      erstarrter Lava, Steppe und kristallklarem Meer geschaffen. Es war Andalusiens erstes
      maritim-terrestrisches Schutzgebiet und ist von der UNESCO als Biosphärenreservat und Globaler Geopark
      anerkannt.
    landscape: >-
      Alles wurzelt im Vulkangestein. Dunkle vulkanische Substrate dominieren: Lavaströme, Dome und fossile
      Strände färben die Szenerie in Ocker-, Schwarz- und Rottönen. Darüber legt sich ein Küstensaum aus
      Dünen, Steppen und Salzlagunen, dem seeseitig ein parallel zur Küste verlaufender mariner Schutzstreifen
      vorgelagert ist. Es ist ein dynamisches Mosaik statt eines starren Panoramas: Jeder Kilometer enthüllt
      ein neues Ökosystem.


      Die Pflanzenwelt trotzt der Härte des Standorts. Bei minimalen Niederschlägen und nährstoffarmem Boden
      birgt der Park eines der eigenständigsten Florenensembles Europas mit über 1.000 exklusiven Arten.
      Zwergpalme und Schlingstrauch klettern vulkanische Hänge empor, während Halfagras, Rosmarin und Jujuben
      die Ebenen bedecken. Im zeitigen Frühjahr überziehen Tausende Strandastern die Steilküsten mit
      leuchtendem Gelb.


      Unter der Wasseroberfläche setzt sich das Naturschauspiel fort. Auf dem Meeresgrund dehnen sich
      Posidonia-Seegraswiesen aus, wahre Unterwasserwälder voller Krebse, Kraken und Fische sowie der Edlen
      Steckmuschel, der größten geschützten Muschel des Mittelmeers. Auf felsigem Untergrund gedeihen
      Hornkorallen, Algen und Zackenbarsche, die Herrscher des Riffs. Der Meeresstreifen birgt zudem ein
      biologisches Phänomen: Hier begegnen sich Meeresarten von beiden Seiten der Strömungen, die Cabo de Gata
      von Nordafrika trennen.
    wildlife: >-
      Die Vögel verteilen sich auf zwei grundverschiedene Lebensräume. Der erste umfasst die Salinen von Cabo
      de Gata. Hier suchen Säbelschnäbler, Stelzenläufer und Regenpfeifer nach Nahrung, begleitet von Möwen,
      Enten und Flamingos. Der [Flamenco](/especie/phoenicopterus_roseus/) ist das ganze Jahr über anwesend –
      eine ornithologische Besonderheit. Da ein echter Winter ausbleibt, verweilen viele Arten dauerhaft,
      während Zugvögel die Lagunen zur Rast nutzen. Zwischen den Salinen und der nahen Rambla Morales lassen
      sich im Jahreslauf über 80 Arten beobachten.


      Der zweite Schauplatz ist die Steppe von Las Amoladeras im Schutz von Halfagras und Thymian, Heimat
      seltener Steppenvögel: Triel, Haubenlerche, Kurzzehenlerche und die scheue
      [Dupontlerche](/especie/chersophilus_duponti/). Daher führt der dortige Vogelbeobachtungsweg direkt in
      eine Kernschutzzone.
    visit: >-
      Beginne damit, die geologische Landschaft zu erfassen. Das Besucherzentrum Las Amoladeras zeichnet die
      menschliche Besiedlung seit dem Neolithikum nach, und die Casa de los Volcanes war Andalusiens erstes
      Ökomuseum zur Erdgeschichte. Der Park verfügt über 16 markierte Wanderwege zu den meisten seiner 33
      Geotope mit informativen Schautafeln. El Pocico-Las Marinas zeigt fossile Strände; La Vela Blanca
      vulkanische Steilküsten; La Molata die historische Wind- und Wassernutzung; und Requena das
      traditionelle Leben.


      Der Weg von Loma Pelada misst 5.900 Meter einfach, dauert zweieinhalb Stunden und ist leicht begehbar.
      Er startet in Los Escullos, wo das Kastell San Felipe aus dem achtzehnten Jahrhundert als Küstenfestung
      wacht, und erschließt unzugängliche Buchten wie Cala Tomate vor der Kulisse des Cerro del Fraile. Mit
      dem Fahrrad führt eine Rundtour durch das alte Bergmannsdorf Rodalquilar hinauf zum Cerro del Cinto mit
      weitem Rundblick.


      Und schließlich das Meer. Du kannst im glasklaren Wasser bei La Isleta zwischen Korallenformationen,
      bunten Fischen und Posidonia schnorcheln oder mit Booten zu versteckten Buchten wie Cala Chica oder San
      Pedro aufbrechen. Beliebt ist auch Seekajakfahren entlang der Felsküste.
    history: >-
      Der Park ist zugleich ein reiches Kulturland. Verlassene Landgüter, Schöpfräder, Zisternen und
      Windmühlen – allesamt geschützte Kulturgüter – bezeugen den sparsamen Umgang mit Ressourcen. Phönizier
      und Römer betrieben Fischsalzereien und Purpurfärbereien in Torregarcía, während die Mauren
      Bewässerungssysteme und Wehrtürme hinterließen. Die Verarbeitung von Halfagras, traditionelle
      Jarapa-Teppiche und Töpferei sind lebendiges Handwerk aus dieser Tradition.


      Der Schutzstatus griff frühzeitig: Der Park entstand 1987, und sein marines Schutzgebiet erstreckt sich
      über 63 km Küste – das größte Meeresschutzgebiet an der europäischen Festlandküste. Eine Besonderheit
      schützt die Vögel: Die Salinen von Cabo de Gata werden weiter bewirtschaftet, da die Salzgewinnung für
      den Erhalt des Feuchtgebiets unverzichtbar ist.
    before: >-
      Auf dem Pfad von Loma Pelada gibt es nicht überall Mobilfunkempfang: Führe ein aufgeladenes Mobiltelefon
      mit, um bei Bedarf den Notruf 112 zu wählen. Wirf niemals Zigarettenkippen weg und vermeide Brandgefahr.
    around: >-
      Rund dreiundzwanzig Kilometer entfernt liegt das [Paraje Natural Desierto de
      Tabernas](/lugar/paraje-natural-desierto-de-tabernas/), ein weiteres Trockenparadies im Südosten. Weiter
      entfernt teilen andere Küstenparks Felsufer und Posidonia-Seegraswiesen: der [Parque Natural de Ses
      Salines](/lugar/parque-natural-de-ses-salines/) mit Flamingos, der [Parc Natural del Cap de
      Creus](/lugar/parc-natural-del-cap-de-creus/), der [Parc national de
      Port-Cros](/lugar/parc-national-de-port-cros/) und der [Nacionalni park
      Kornati](/lugar/nacionalni-park-kornati/).
  it:
    intro: >-
      Qui l'inverno climatico non esiste. Il clima è talmente arido che Cabo de Gata-Níjar rappresenta lo
      spazio naturale più secco dell'intera Europa; questa siccità ha forgiato un paesaggio di lava, steppa e
      mare limpidissimo. È stata la prima area protetta marittimo-terrestre dell'Andalusia, riconosciuta
      dall'UNESCO come Riserva della Biosfera e Geoparco Mondiale.
    landscape: >-
      Tutto scaturisce dalla matrice vulcanica. Dominano i substrati eruttivi: colate di lava, duomi e spiagge
      fossili che colorano la costa di ocra, nero e ruggine. Sopra si stende una fascia litoranea di dune,
      steppe e lagune salmastre, lambita da una riserva marina che corre parallela alla battigia. È un mosaico
      cangiante: ogni chilometro muta il profilo dell'ecosistema.


      La flora testimonia la durezza delle condizioni climatiche. Con piogge scarse e suoli poveri, il parco
      vanta una flora tra le più esclusive d'Europa, forte di oltre 1.000 specie botaniche caratteristiche. La
      palma nana e il periploca scalano i declivi vulcanici, mentre sparto, rosmarino e giuggioli ammantano le
      pianure. All'inizio della primavera, miriadi di margherite di mare tingono le scogliere di un giallo
      acceso.


      Sott'acqua, lo scenario prosegue in versione marina. Nei fondali si sviluppano praterie di Posidonia,
      autentiche foreste sommerse popolate da granchi, polpi e pesci, oltre alla nacchera, il bivalve protetto
      più grande del Mediterraneo. Sui fondi rocciosi crescono falsi coralli, alghe e cernie brune, sovrane
      dei fondali. La riserva marina custodisce una peculiarità biologica: convivono specie provenienti da
      ambo i lati delle correnti che separano Cabo de Gata dall'Africa settentrionale.
    wildlife: >-
      Gli uccelli popolano due contesti molto differenti. Il primo è costituito dalle saline di Cabo de Gata.
      Qui avosette, cavalieri d'Italia e corrieri cercano cibo, affiancati da gabbiani, anatre e fenicotteri.
      Il [fenicottero](/especie/phoenicopterus_roseus/) rosa staziona stabilmente tutto l'anno, una rarità
      ornitologica notevole. Mancando una rigida stagione fredda, molte specie vi svernano stabilmente, mentre
      i migratori usano gli specchi d'acqua come scalo. Tra le saline e la vicina Rambla Morales si contano
      oltre 80 specie nell'arco dell'anno.


      Il secondo ambiente è la steppa delle Amoladeras, riparata da cespi di sparto e timo, rifugio di
      volatili elusivi: occhioni, cappellacce, calandrelle e l'[allodola di
      Dupont](/especie/chersophilus_duponti/). Per questo motivo il sentiero che attraversa la piana, la via
      degli uccelli, accede a una Zona di Riserva Integrale.
    visit: >-
      Inizia comprendendo la struttura geologica del territorio. Il centro visitatori di Las Amoladeras
      illustra la presenza umana fin dal Neolitico, e la Casa de los Volcanes è stata il primo ecomuseo
      dell'Andalusia per la divulgazione vulcanologica. Il parco offre 16 percorsi segnalati che toccano la
      gran parte dei suoi 33 georisorse, con pannelli didattici. El Pocico-Las Marinas mostra le spiagge
      fossili; La Vela Blanca le falesie vulcaniche; La Molata la cultura del vento e delle acque; e Requena
      la vita rurale del passato.


      Il sentiero di Loma Pelada misura 5.900 metri all'andata, richiede due ore e mezza ed è di facile
      percorrenza. Prende avvio da Los Escullos, dove sorge il castello di San Felipe eretto nel XVIII secolo
      a presidio costiero, e si affaccia su calette appartate come Cala Tomate, dominata dal Cerro del Fraile.
      In bicicletta un itinerario conduce dall'antico villaggio minerario di Rodalquilar al Cerro del Cinto
      per ammirare un ampio panorama.


      Infine c'è il mare. Puoi fare snorkeling in acque cristalline come quelle de La Isleta, tra formazioni
      coralligene, pesci variopinti e praterie di Posidonia, o salpare in battello verso cale recondite come
      Cala Chica o San Pedro. Lungo la costa è diffuso anche il kayak marino.
    history: >-
      Il parco è parimenti un paesaggio plasmato dall'uomo. Casali abbandonati, norie, cisterne e mulini a
      vento, tutti Beni di Interesse Culturale, attestano l'uso sapiente delle risorse idriche. Fenici e
      romani impiantarono manifatture di salagione e porpora a Torregarcía, seguiti dagli arabi che idearono
      canali irrigui e torri d'avvistamento litoranee. L'intreccio dello sparto, i tessuti jarapas e la
      ceramica sono attività tradizionali ereditate da queste genti.


      La salvaguardia è giunta tempestiva: il parco è stato istituito nel 1987 e la fascia marina protetta
      abbraccia 63 km di litorale, configurandosi come la maggiore riserva marina dell'Europa continentale.
      Un'interessante sinergia tutela l'avifauna: le saline di Cabo de Gata continuano a essere coltivate,
      poiché l'estrazione del sale è indispensabile per mantenere intatta la biodiversità lagunare.
    before: >-
      Lungo il tracciato di Loma Pelada il segnale cellulare è discontinuo: porta il telefono carico per
      comporre il 112 in caso di necessità. Non gettare mozziconi né inneschi d'incendio.
    around: >-
      A circa ventitré chilometri si estende il [Paraje Natural Desierto de
      Tabernas](/lugar/paraje-natural-desierto-de-tabernas/), altro paesaggio arido del sud-est. Più lontano,
      altre riserve costiere condividono scogliere vulcaniche e praterie di Posidonia: il [Parque Natural de
      Ses Salines](/lugar/parque-natural-de-ses-salines/), popolato anch'esso da fenicotteri, il [Parc Natural
      del Cap de Creus](/lugar/parc-natural-del-cap-de-creus/), il [Parc national de
      Port-Cros](/lugar/parc-national-de-port-cros/) e il [Nacionalni park
      Kornati](/lugar/nacionalni-park-kornati/).
  pt:
    intro: >-
      Aqui não existe inverno climático. O clima é tão árido que o Cabo de Gata-Níjar é o espaço natural mais
      seco de toda a Europa, gerando uma paisagem agreste de lava, estepe e águas transparentes. Foi a
      primeira área protegida marítimo-terrestre da Andaluzia, distinguida pela UNESCO como Reserva da
      Biosfera e Geoparque Mundial.
    landscape: >-
      Tudo nasce da rocha vulcânica. Predominam os substratos ígneos: escoadas lávicas, domos e praias fósseis
      que tingem o relevo em tons de ocre, negro e avermelhado. Sobre eles estende-se uma orla costeira de
      dunas, estepes e lagoas salgadas, ladeada por uma faixa marinha protegida paralela à costa. É um mosaico
      mutável: cada quilómetro revela um ecossistema distinto.


      A flora espelha a severidade do meio. Com chuva insignificante e solos pobres, o parque resguarda uma
      das comunidades botânicas mais singulares da Europa, com mais de 1.000 espécies exclusivas. O palmito e
      a cornualha trepam pelas encostas vulcânicas, enquanto o esparto, o alecrim e os açofeifeiros forram as
      planuras. No início da primavera, milhares de malmequeres-da-praia cobrem as arribas de amarelo vivo.


      Sob a superfície, o cenário desdobra-se no fundo do mar. No leito marinho vicejam pradarias de
      Posidonia, verdadeiras florestas submersas habitadas por caranguejos, polvos e peixes, além do nacarão,
      o maior bivalve protegido do Mediterrâneo. Nos fundos rochosos abundam falsos corais, algas e o mero,
      apelidado de senhor das rochas. A reserva marinha encerra outro aspeto invulgar: nela confluem espécies
      de ambos os lados das correntes que separam o cabo de Gata do norte de África.
    wildlife: >-
      As aves distribuem-se por dois palcos bem diferenciados. O primeiro reúne as salinas do Cabo de Gata.
      Alfaiates, pernilongos e borrelhos alimentam-se nas margens, junto a gaivotas, patos e flamingos. O
      [flamingo-comum](/especie/phoenicopterus_roseus/) permanece ao longo de todo o ano, uma das
      particularidades ornitológicas mais marcantes do local. Sem inverno térmico severo, muitas aves
      invernantes fixam-se aqui, enquanto as espécies migradoras usam as lagoas como escala. Entre as salinas
      e a vizinha Rambla Morales registam-se mais de 80 espécies durante o ano.


      O segundo ambiente é a estepe de Las Amoladeras, ao abrigo de espartais e tomilhais, onde habita uma
      comunidade de aves esquivas: alcaravões, cotovias-de-poupa, calhandrinhas e a
      [calhandra-de-dupont](/especie/chersophilus_duponti/). Por esse motivo, o trilho que cruza o local, a
      rota das aves, penetra numa Zona de Reserva Integral.
    visit: >-
      Começa por compreender a matriz geológica do território. O centro de visitantes de Las Amoladeras expõe
      a presença humana desde o Neolítico, e a Casa de los Volcanes foi o primeiro ecomuseu da Andaluzia
      dedicado à interpretação do património vulcânico. O parque dispõe de 16 trilhos assinalados que
      percorrem a grande maioria dos seus 33 georrecursos, providos de painéis interpretativos. El Pocico-Las
      Marinas exibe praias fósseis; La Vela Blanca arribas vulcânicas; La Molata o aproveitamento tradicional
      da água e do vento; e Requena os modos de vida ancestrais.


      O percurso de Loma Pelada estende-se por 5.900 metros de ida, dura duas horas e meia e apresenta baixa
      dificuldade. Arranca de Los Escullos, onde o forte de San Felipe é um dos baluartes erguidos no século
      XVIII para vigiar a costa, e debruça-se sobre enseadas inacessíveis como a cala Tomate, sob a imponência
      do Cerro del Fraile. Em bicicleta, um itinerário parte da antiga povoação mineira de Rodalquilar até ao
      Cerro del Cinto, descortinando amplas panorâmicas.


      E tens o mar. Podes praticar mergulho com tubo em águas límpidas como as de La Isleta, entre corais,
      peixes multicores e pradarias de Posidonia, ou navegar de barco até enseadas recônditas como Cala Chica
      ou San Pedro. A canoagem marítima é igualmente muito procurada na costa.
    history: >-
      O parque é também uma paisagem moldada pelo engenho humano. Montes alentejanos e cortiços abandonados,
      noras, cisternas e moinhos de vento, todos Bens de Interesse Cultural, ilustram o aproveitamento
      tradicional dos escassos recursos. Fenícios e romanos instalaram fábricas de salga de peixe e
      tinturarias de púrpura em Torregarcía, sucedidos pelos árabes com os seus sistemas de rega e torres de
      vigia litorais. O trabalho do esparto, as mantas jarapas e a olaria são expressões artesanais herdadas
      desses tempos.


      A classificação legal deu-se cedo: o parque foi criado em 1987 e a sua faixa marinha protegida abrange
      63 km de costa, correspondendo à mais vasta reserva marinha da costa continental europeia. Uma feliz
      coincidência favorece a avifauna: as salinas do Cabo de Gata mantêm a laboração comercial, dado que a
      extração do sal é indispensável para preservar o seu ecossistema aquático.
    before: >-
      No trilho de Loma Pelada nem sempre há cobertura móvel: mantém o telemóvel com bateria para ligar para o
      112 em caso de aflição. Não atires pontas de cigarro nem materiais inflamáveis.
    around: >-
      A cerca de vinte e três quilómetros estende-se o [Paraje Natural Desierto de
      Tabernas](/lugar/paraje-natural-desierto-de-tabernas/), outro reduto árido do sudeste. Mais longe,
      outros parques partilham falésias litorais e pradarias de Posidonia: o [Parque Natural de Ses
      Salines](/lugar/parque-natural-de-ses-salines/), que acolhe igualmente flamingos, o [Parc Natural del
      Cap de Creus](/lugar/parc-natural-del-cap-de-creus/), o [Parc national de
      Port-Cros](/lugar/parc-national-de-port-cros/) e o [Nacionalni park
      Kornati](/lugar/nacionalni-park-kornati/).
