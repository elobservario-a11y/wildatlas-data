texto:
  es:
    intro: >-
      Ciento veintiséis lagos entre bosques y colinas: así de simple es la receta de Aukštaitija. El parque
      nacional más antiguo de Lituania, creado en 1974, ocupa 410,56 km² en el nordeste del país, y más del 70
      % es bosque, sobre todo pinares, algunos de 200 años. Entre los árboles brillan lagos conectados por
      arroyos y canales, y de ahí que los lagos sean populares para el kayak.
    landscape: >-
      El parque está en la unión de tres regiones geográficas: una altura morrénica antigua y otra más joven,
      separadas por la llanura arenosa del Žeimena. El relieve de esas colinas forma, en el sendero de
      Meironys, un laberinto natural de «montañas rusas» donde se esconden estanques, lagos y arroyos.


      Los lagos cubren el 15,5 % del parque. El mayor es el Kretuonas, con 8,29 km², y el Tauragnas, con 60,5
      metros, es el más profundo de Lituania. Se pueden navegar unos 70 km por lagos y canales. Desde
      Ladakalnis, a 176 metros, parte de la cresta de Šilinškė, se abre uno de los panoramas más bellos de
      Lituania.
    wildlife: >-
      Los pinares dominan los bosques de Ažvinčiai y Mincia con un 81 %. La flora y la fauna son ricas: 992
      especies de plantas y 2961 de animales, entre ellas 54 de mamíferos, 41 de peces y 243 de aves. Sesenta
      y cuatro plantas, ocho hongos y 48 aves figuran en el Libro Rojo de Lituania.


      Los salmones suben a desovar al Žeimena y en los bosques viven lobos, linces, alces, ciervos y corzos;
      los osos llegan solo de paso. Hay grandes colonias de murciélagos, y en la isla grande del lago
      Kretuonas anidan grandes colonias de gaviotas de cabeza parda. Los mejores lagos para ver aves son el
      Asėkas y el Kretuonas. Entre las raras están la cigüeña negra, el águila pescadora y el pito tridáctilo.
      El parque tiene zonas de protección estricta, el 2,1 % del territorio, a las que solo se entra con un
      empleado.
    visit: >-
      Hay tantas rutas a pie que no basta una semana. El sendero educativo de Meironys, entre Palūšė y
      Meironys, bordea el lago Lūšiai en tres anillos de colores: el amarillo mide 3,7 km y sube a dos colinas
      con vistas al lago, y el verde amplía el paseo a 5 km y cruza una depresión pantanosa. Cada anillo
      enseña un hábitat distinto, y los paneles explican el paisaje y cuentan historias de plantas y animales.
      El sendero botánico P1, de tres kilómetros y medio, sale de Palūšė y atraviesa el bosque; sus siete
      paneles tratan del pinar, los humedales sombríos, las turberas, la pradera lacustre, la vegetación del
      lago, los hongos y los líquenes. El sendero botánico del lago Taramas, de 1984, empieza y termina junto
      a la guardería forestal de Palūšė. Otro itinerario marcado va de Palūšė por Meironys, Ginučiai y
      Stripeikiai hasta Tauragnai.


      Para los ciclistas, la ruta Pakretuonė–Palūšė–Ignalina mide 30 km y lleva unas dos horas. En el agua, la
      ruta acuática V2, Lake Loop, recorre 30 km y se calcula en tres horas y media; el centro turístico de
      Palūšė alquila barcas. La exposición del centro de visitantes de Palūšė presenta las formas antiguas y
      actuales de vida junto a los lagos y ayuda a planificar recorridos.
    history: >-
      El parque nació el 29 de marzo de 1974 sobre las reservas de Ignalina y Ažvinčiai y territorios vecinos,
      y se llamó al principio Parque Nacional de la RSS de Lituania. Guarda 106 monumentos arqueológicos y
      arquitectónicos y más de 6500 túmulos funerarios. El molino de agua de Ginučiai es el único de los seis
      del parque que conserva su equipo auténtico y funcionó hasta 1968. Hay 116 aldeas, la mayoría de pocas
      granjas; en Stripeikiai está el museo de apicultura antigua.
    before: >-
      Se puede acampar y encender fuego solo en las áreas señaladas, los campings. Comprueba antes de ir el
      horario del centro de visitantes de Palūšė.
    around: >-
      No hay vecinos publicados en el atlas. Con sus lagos, alces y lobos, se parece a
      [Soomaa](/lugar/soomaa-rahvuspark/), [Žemaitija](/lugar/zemaitijos-nacionalinis-parkas/),
      [Šumava](/lugar/narodni-park-sumava/) y [Ķemeri](/lugar/kemeru-nacionalais-parks/).
  en:
    intro: >-
      One hundred and twenty-six lakes scattered among hills and pine forests: that is the simple essence of
      Aukštaitija. Lithuania's oldest national park, established in 1974, encompasses 410.56 km² in the
      north-east of the country. More than 70% is clothed in woodland, predominantly Scots pine forests with
      ancient stands up to 200 years old. Between the trees gleam pristine glacial lakes interconnected by
      winding streams and channels, making the park a classic destination for paddling.
    landscape: >-
      The park occupies the confluence of three distinct glacial regions: ancient and younger morainic uplands
      separated by the sandy fluvioglacial plain of the Žeimena River. Along the Meironys nature trail, these
      kames and kettle holes form an undulating rollercoaster of forested knolls hiding secluded ponds and
      lakes.


      Water bodies cover 15.5% of the national park. The largest is Lake Kretuonas, spanning 8.29 km², while
      Lake Tauragnas reaches a depth of 60.5 metres, making it the deepest lake in Lithuania. Approximately 70
      km of continuous waterways can be paddled through linked lakes and connecting channels. From Ladakalnis
      hill, rising to 176 metres along the Šilinškė ridge, opens one of the most celebrated panoramic vistas
      in Lithuania.
    wildlife: >-
      Scots pine woodlands dominate the expansive forests of Ažvinčiai and Mincia, comprising 81% of tree
      cover. Biodiversity is remarkably rich: 992 plant species and 2961 animal species, including 54 mammals,
      41 freshwater fishes, and 243 birds. Sixty-four plant species, eight fungi, and 48 birds are listed in
      the Lithuanian Red Data Book.


      Atlantic salmon migrate up the Žeimena River to spawn, while the surrounding forests harbour grey
      wolves, Eurasian lynx, moose, red deer, and roe deer; brown bears appear only as rare wanderers.
      Substantial bat colonies inhabit hollow trees, while the large island in Lake Kretuonas supports
      extensive breeding colonies of black-headed gulls. The finest birdwatching waters are lakes Asėkas and
      Kretuonas. Notable rarities include the black stork, western osprey, and Eurasian three-toed woodpecker.
      Strict nature reserves comprise 2.1% of the territory, accessible solely when accompanied by park
      personnel.
    visit: >-
      The network of walking trails is vast. The Meironys educational trail, linking Palūšė and Meironys along
      Lake Lūšiai, offers three coloured loops: the yellow route spans 3.7 km over two panoramic hills, while
      the green extension reaches 5 km across boggy depressions. Each loop interprets distinct forest and
      wetland habitats. The P1 botanical trail covers three and a half kilometres from Palūšė through varied
      woodlands; its seven interpretive boards detail pine stands, shaded swamp woods, peat mires, and lake
      vegetation. The Lake Taramas botanical trail, laid out in 1984, begins and ends near the Palūšė forestry
      office. Another waymarked trail leads from Palūšė through Meironys, Ginučiai, and Stripeikiai to
      Tauragnai.


      For cyclists, the Pakretuonė–Palūšė–Ignalina circuit spans 30 km, taking about two hours. On the water,
      the V2 Lake Loop covers 30 km, requiring roughly three and a half hours; canoes and kayaks can be rented
      at the Palūšė water tourism base. The Palūšė visitor centre exhibition interprets traditional and modern
      lakeside culture, helping you plan your excursion.
    history: >-
      The park was officially established on 29 March 1974 based around the former Ignalina and Ažvinčiai
      nature reserves, originally designated the National Park of the Lithuanian SSR. It protects 106
      archaeological and architectural monuments and over 6500 ancient burial mounds. The historic Ginučiai
      watermill is the only mill among six in the park that preserves authentic working machinery, operating
      until 1968. The territory encompasses 116 traditional villages, mostly small homestead clusters;
      Stripeikiai houses the unique Museum of Ancient Beekeeping.
    before: >-
      Camping and campfires are strictly restricted to designated official campsites. Check operating hours at
      the Palūšė visitor centre before your visit.
    around: >-
      There are no direct neighbouring sites published in the atlas. With its maze of lakes, moose, and wolf
      packs, it shares ecological kinships with [Soomaa](/lugar/soomaa-rahvuspark/),
      [Žemaitija](/lugar/zemaitijos-nacionalinis-parkas/), [Šumava](/lugar/narodni-park-sumava/), and
      [Ķemeri](/lugar/kemeru-nacionalais-parks/).
  fr:
    intro: >-
      Cent vingt-six lacs enchâssés entre collines et forêts : telle est la formule d'Aukštaitija. Le plus
      ancien parc national de Lituanie, fondé en 1974, s'étend sur 410,56 km² dans le nord-est du pays. Plus
      de 70 % de sa surface est couverte de forêts, principalement des pinèdes dont certains peuplements
      atteignent 200 ans. Entre les arbres miroitent des chapelets de lacs reliés par des ruisseaux et des
      canaux, ce qui en fait un haut lieu du kayak.
    landscape: >-
      Le parc se situe au carrefour de trois ensembles géomorphologiques : deux arcs morainiques d'âges
      distincts séparés par la plaine sablonneuse fluvioglaciaire de la Žeimena. Le sentier de Meironys
      parcourt ce relief accidenté de kames et de cuvettes glaciaires où se nichent étangs et méandres.


      Les plans d'eau occupent 15,5 % du territoire. Le plus vaste est le lac Kretuonas avec 8,29 km², tandis
      que le lac Tauragnas, profond de 60,5 mètres, est le plus profond de Lituanie. Environ 70 km de voies
      d'eau navigables s'ouvrent aux pagayeurs. Depuis la colline de Ladakalnis, à 176 mètres d'altitude sur
      la crête de Šilinškė, se déploie l'un des plus beaux panoramas de Lituanie.
    wildlife: >-
      Les pinèdes dominent les massifs d'Ažvinčiai et de Mincia avec 81 % du couvert forestier. La
      biodiversité y est remarquable : 992 espèces végétales et 2961 espèces animales répertoriées, dont 54
      mammifères, 41 poissons et 243 oiseaux. Soixante-quatre plantes, huit champignons et 48 espèces
      d'oiseaux figurent au Livre rouge de Lituanie.


      Le saumon atlantique remonte frayer dans la Žeimena, tandis que les forêts abritent loups, lynx, élans,
      cerfs et chevreuils ; l'ours brun n'y fait que de rares incursions. Les cavités arboricoles accueillent
      d'importantes colonies de chauves-souris, et la grande île du lac Kretuonas abrite des colonies de
      mouettes rieuses. Les lacs Asėkas et Kretuonas sont les meilleurs sites ornithologiques. Parmi les
      raretés figurent la cigogne noire, le balbuzard pêcheur et le pic tridactyle. Les réserves intégrales
      occupent 2,1 % du territoire et ne se visitent qu'avec un agent du parc.
    visit: >-
      Les sentiers de découverte abondent. Le parcours didactique de Meironys, entre Palūšė et Meironys le
      long du lac Lūšiai, propose trois boucles balisées : le circuit jaune fait 3,7 km sur deux crêtes
      panoramiques, et le vert s'allonge sur 5 km à travers des dépressions tourbeuses. Le sentier botanique
      P1, long de trois kilomètres et demi, part de Palūšė et pénètre la forêt ; ses sept panneaux traitent
      des pinèdes, des tourbières, des champignons et des lichens. Le sentier botanique du lac Taramas,
      aménagé en 1984, débute près de la maison forestière de Palūšė. Un autre itinéraire relie Palūšė à
      Tauragnai via Meironys, Ginučiai et Stripeikiai.


      À vélo, la boucle Pakretuonė–Palūšė–Ignalina totalise 30 km en environ deux heures. Sur l'eau, la boucle
      nautique V2 couvre 30 km en près de trois heures et demie ; la base nautique de Palūšė loue embarcations
      et canoës. L'exposition du centre d'accueil de Palūšė illustre la vie lacustre traditionnelle et
      contemporaine.
    history: >-
      Le parc a été créé le 29 mars 1974 à partir des réserves d'Ignalina et d'Ažvinčiai, d'abord dénommé parc
      national de la RSS de Lituanie. Il conserve 106 monuments historiques et plus de 6500 tumulus funéraires
      anciens. Le moulin à eau de Ginučiai est le seul parmi les six moulins du parc à avoir conservé ses
      meules d'origine en activité jusqu'en 1968. On dénombre 116 villages traditionnels ; Stripeikiai abrite
      le musée de l'apiculture ancienne.
    before: >-
      Le bivouac et les feux sont autorisés exclusivement dans les campings officiellement aménagés. Vérifiez
      les horaires d'ouverture du centre d'accueil de Palūšė avant de partir.
    around: >-
      Aucun site voisin n'est publié dans l'atlas. Par ses lacs, ses élans et ses loups, il s'apparente à
      [Soomaa](/lugar/soomaa-rahvuspark/), [Žemaitija](/lugar/zemaitijos-nacionalinis-parkas/),
      [Šumava](/lugar/narodni-park-sumava/) et [Ķemeri](/lugar/kemeru-nacionalais-parks/).
  de:
    intro: >-
      Hundertsechsundzwanzig Seen zwischen Wäldern und Moränenhügeln: Das ist das unverwechselbare Gepräge von
      Aukštaitija. Der älteste Nationalpark Litauens, gegründet 1974, umfasst 410,56 km² im Nordosten des
      Landes. Mehr als 70 % der Fläche sind von Wald bedeckt, vor allem von Kiefernforsten mit bis zu 200
      Jahre alten Beständen. Dazwischen glitzern eiszeitliche Seen, die durch Fließe und Kanäle vernetzt sind
      und den Park zu einem beliebten Paddelrevier machen.
    landscape: >-
      Der Park liegt am Schnittpunkt von drei geomorphologischen Zonen: Alt- und Jungmoränenhügeln, getrennt
      durch die sandige Sander-Ebene der Žeimena. Auf dem Naturlehrpfad Meironys formen die Kames ein
      hügeliges Relief mit versteckten Moortümpeln und Seen.


      Seen bedecken 15,5 % des Schutzgebiets. Der größte ist der Kretuonas mit 8,29 km², während der Tauragnas
      mit 60,5 Metern der tiefste See Litauens ist. Rund 70 km Wasserwanderwege lassen sich auf vernetzten
      Seen befahren. Vom 176 Meter hohen Hügel Ladakalnis auf dem Šilinškė-Rücken eröffnet sich eines der
      weitesten Panoramen Litauens.
    wildlife: >-
      Kiefernwälder dominieren die Forste von Ažvinčiai und Mincia mit einem Anteil von 81 %. Die
      Artenvielfalt ist reich: 992 Pflanzenarten und 2961 Tierarten, darunter 54 Säugetiere, 41 Fische und 243
      Vögel. Vierundsechzig Pflanzen, acht Pilze und 48 Vogelarten sind im Roten Buch Litauens verzeichnet.


      Lachse wandern zum Laichen in die Žeimena, während die Wälder Wolf, Luchs, Elch, Rothirsch und Reh
      beherbergen; Braunbären ziehen nur vereinzelt durch. Höhlenbäume bieten Fledermäusen Quartiere, und auf
      der großen Insel des Kretuonas-Sees brüten Kolonien von Lachmöwen. Asėkas und Kretuonas sind die besten
      Vogelbeobachtungsseen. Zu den seltenen Brutvögeln gehören Schwarzstorch, Fischadler und Dreizehenspecht.
      Totalreservate machen 2,1 % der Fläche aus und dürfen nur in Begleitung von Parkpersonal betreten
      werden.
    visit: >-
      Die Auswahl an Wanderwegen ist groß. Der Lehrpfad Meironys zwischen Palūšė und Meironys am Lūšiai-See
      bietet drei Farbrouten: Die gelbe Route misst 3,7 km über zwei Aussichtshügel, die grüne Runde erweitert
      den Weg auf 5 km durch Moorwälder. Der botanische Lehrpfad P1 führt über dreieinhalb Kilometer ab Palūšė
      durch den Wald; seine sieben Stationen erläutern Kiefernwälder, Moorflächen, Flechten und Pilze. Der
      botanische Pfad am Taramas-See von 1984 beginnt an der Försterei Palūšė. Eine weitere Route führt von
      Palūšė über Meironys, Ginučiai und Stripeikiai nach Tauragnai.


      Für Radfahrer umfasst die Runde Pakretuonė–Palūšė–Ignalina 30 km bei rund zwei Stunden Fahrzeit. Auf dem
      Wasser misst die Seeroute V2 rund 30 km bei etwa dreieinhalb Stunden Paddelzeit; Boote vermietet die
      Station in Palūšė. Die Ausstellung im Besucherzentrum Palūšė informiert über Naturräume und historische
      Lebensweisen an den Seen.
    history: >-
      Der Nationalpark entstand am 29. März 1974 aus den Reservaten Ignalina und Ažvinčiai und hieß zunächst
      Nationalpark der Litauischen SSR. Er bewahrt 106 archäologische Denkmäler und mehr als 6500 Grabhügel.
      Die Wassermühle von Ginučiai ist die einzige von sechs Mühlen des Gebiets mit erhaltener historischer
      Mühlentechnik und arbeitete bis 1968. Es gibt 116 Dörfer; in Stripeikiai befindet sich das Museum für
      historische Imkerei.
    before: >-
      Zelten und offenes Feuer sind ausschließlich auf den offiziell ausgewiesenen Campingplätzen gestattet.
      Prüfe vorab die Öffnungszeiten des Besucherzentrums in Palūšė.
    around: >-
      Im Atlas gibt es keine direkten Nachbarn. Mit seinen Seen, Elchen und Wölfen ähnelt das Gebiet
      [Soomaa](/lugar/soomaa-rahvuspark/), [Žemaitija](/lugar/zemaitijos-nacionalinis-parkas/),
      [Šumava](/lugar/narodni-park-sumava/) und [Ķemeri](/lugar/kemeru-nacionalais-parks/).
  it:
    intro: >-
      Centoventisei laghi incastonati tra boschi e dossi morenici: questa è l'armonia di Aukštaitija. Il parco
      nazionale più antico della Lituania, istituito nel 1974, si estende per 410,56 km² nel nord-est del
      paese. Oltre il 70% del comprensorio è ammantato da boschi, in gran parte pinete con alberi vetusti che
      toccano i 200 anni. Tra le piante scintillano bacini lacustri collegati da rii e canali, rendendo il
      parco una meta d'elezione per la canoa.
    landscape: >-
      Il parco si trova alla convergenza di tre comprensori geomorfologici: due rilievi morenici di diversa
      epoca separati dalla piana alluvionale sabbiosa dello Žeimena. Lungo il sentiero di Meironys, questi
      dossi compongono un paesaggio ondulato che nasconde stagni e ruscelli.


      I laghi coprono il 15,5% della superficie protetta. Il bacino maggiore è il Kretuonas, con 8,29 km²,
      mentre il Tauragnas, con i suoi 60,5 metri, è il lago più profondo della Lituania. Circa 70 km di corsi
      d'acqua navigabili consentono lunghi itinerari a remi. Dalla collina di Ladakalnis, che svetta a 176
      metri sulla dorsale di Šilinškė, si apre uno dei panorami più celebri del paese.
    wildlife: >-
      Le pinete caratterizzano i complessi forestali di Ažvinčiai e Mincia con l'81% della copertura arborea.
      La biodiversità è cospicua: 992 specie di piante e 2961 specie animali, tra cui 54 mammiferi, 41 pesci e
      243 uccelli. Sessantaquattro piante, otto funghi e 48 specie di volatili figurano nel Libro Rosso della
      Lituania.


      I salmoni risalgono a deporre le uova lungo lo Žeimena, mentre le foreste ospitano lupi, linci, alci,
      cervi e caprioli; l'orso bruno compare solo come visitatore sporadico. Le cavità dei tronchi ospitano
      consistenti colonie di pipistrelli, e l'isola maggiore del lago Kretuonas accoglie colonie nidificanti
      di gabbiano comune. I laghi Asėkas e Kretuonas sono le mete d'elezione per il birdwatching. Tra le
      rarità spiccano la cicogna nera, il falco pescatore e il picchio tridattilo. Le riserve integrali
      rappresentano il 2,1% del territorio e sono accessibili solo se accompagnati dal personale.
    visit: >-
      La rete dei tracciati escursionistici è vastissima. Il sentiero didattico di Meironys, tra Palūšė e
      Meironys lungo il lago Lūšiai, si articola in tre anelli: il percorso giallo misura 3,7 km su due poggi
      panoramici, mentre il verde si sviluppa per 5 km attraverso torbiere. Il sentiero botanico P1 si snoda
      per tre chilometri e mezzo da Palūšė nel bosco; i suoi sette pannelli illustrano pinete, acquitrini,
      funghi e licheni. Il percorso botanico del lago Taramas, del 1984, parte e si conclude presso la
      forestale di Palūšė. Un altro tracciato unisce Palūšė a Tauragnai passando per Meironys, Ginučiai e
      Stripeikiai.


      In bicicletta, il circuito Pakretuonė–Palūšė–Ignalina misura 30 km e richiede circa due ore. In acqua,
      l'itinerario fluviale V2 copre 30 km per una pagaiata stimata in tre ore e mezza; il centro nautico di
      Palūšė noleggia canoe e imbarcazioni. L'esposizione del centro visite di Palūšė illustra le tradizioni
      della civiltà lacustre.
    history: >-
      Il parco fu istituito il 29 marzo 1974 accorpando le riserve di Ignalina e Ažvinčiai, assumendo in
      origine la denominazione di Parco Nazionale della RSS Lituana. Custodisce 106 monumenti storici e oltre
      6500 tumuli sepolcrali antichi. Il mulino ad acqua di Ginučiai è l'unico dei sei mulini del parco a
      conservare gli ingranaggi originali, rimasto in funzione sino al 1968. Si contano 116 villaggi
      tradizionali; a Stripeikiai sorge il museo dell'apicoltura antica.
    before: >-
      Il campeggio e l'accensione di fuochi sono consentiti esclusivamente nelle aree di sosta e campeggi
      segnalati. Verifica gli orari del centro visite di Palūšė prima di metterti in cammino.
    around: >-
      Non vi sono aree contigue nell'atlas. Per laghi, alci e lupi, presenta forti affinità con
      [Soomaa](/lugar/soomaa-rahvuspark/), [Žemaitija](/lugar/zemaitijos-nacionalinis-parkas/),
      [Šumava](/lugar/narodni-park-sumava/) e [Ķemeri](/lugar/kemeru-nacionalais-parks/).
  pt:
    intro: >-
      Cento e vinte e seis lagos disseminados entre matas e outeiros: esta é a essência de Aukštaitija. O mais
      antigo parque nacional da Lituânia, criado em 1974, abrange 410,56 km² no nordeste do país. Mais de 70%
      da superfície é constituída por floresta, sobretudo pinhais com talhões vetustos de até 200 anos. Entre
      o arvoredo luzem bacias lacustres conectadas por canais e esteiros, tornando o território ideal para o
      caiaque.
    landscape: >-
      O parque assenta no ponto de encontro de três domínios glaciares: duas elevações morenicas de idades
      distintas separadas pela planície arenosa da bacia do Žeimena. No trilho de Meironys, essas cristas e
      depressões formam um relevo acidentado que esconde pequenas lagoas e regatos.


      Os lagos cobrem 15,5% do parque. O maior é o Kretuonas, com 8,29 km², enquanto o Tauragnas, com 60,5
      metros de profundidade, é o lago mais profundo da Lituânia. Cerca de 70 km de esteiros navegáveis ligam
      as várias bacias lacustres. Do monte Ladakalnis, que atinge 176 metros na crista de Šilinškė,
      descortina-se uma das panorâmicas mais consagradas da Lituânia.
    wildlife: >-
      Os pinhais predominam nas florestas de Ažvinčiai e Mincia, perfazendo 81% da cobertura arbórea. A fauna
      e a flora são ricas: 992 espécies vegetais e 2961 animais, incluindo 54 mamíferos, 41 peixes e 243 aves.
      Sessenta e quatro plantas, oito fungos e 48 aves estão inscritos no Livro Vermelho da Lituânia.


      Os salmões sobem o Žeimena para a desova, enquanto nas matas vivem lobos, linces, alces, veados e
      corços; o urso-pardo surge apenas de passagem. O arvoredo antigo abriga importantes colónias de
      morcegos, e na ilha grande do lago Kretuonas nidificam colónias de guincho-comum. Os lagos Asėkas e
      Kretuonas são os melhores para observação ornitológica. Entre as raridades contam-se a cegonha-preta, a
      águia-pesqueira e o pica-pau-tridáctilo. As reservas integrais ocupam 2,1% da área, só sendo acessíveis
      com guia do parque.
    visit: >-
      Os trilhos pedestres são numerosos. O circuito didático de Meironys, entre Palūšė e Meironys ao longo do
      lago Lūšiai, oferece três anéis assinalados: o anel amarelo cobre 3,7 km sobre duas elevações
      panorâmicas, e o verde prolonga o passeio para 5 km através de depressões húmidas. O percurso botânico
      P1 estende-se por três quilómetros e meio a partir de Palūšė; os seus sete painéis abordam pinhais,
      turfeiras, cogumelos e líquenes. O trilho botânico do lago Taramas, de 1984, principia junto ao posto
      florestal de Palūšė. Outra rota marcada une Palūšė a Tauragnai via Meironys, Ginučiai e Stripeikiai.


      Para cicloturistas, o trajeto Pakretuonė–Palūšė–Ignalina atinge 30 km em cerca de duas horas. Na água, a
      rota náutica V2 perfaz 30 km em perto de três horas e meia; a base náutica de Palūšė aluga barcos e
      canoas. A exposição do centro de acolhimento de Palūšė retrata o modo de vida ribeirinho tradicional.
    history: >-
      O parque foi fundado a 29 de março de 1974 com base nas reservas de Ignalina e Ažvinčiai, chamando-se
      inicialmente Parque Nacional da RSS da Lituânia. Resguarda 106 monumentos históricos e arquitetónicos e
      mais de 6500 mamoas e túmulos funerários. O moinho de água de Ginučiai é o único entre os seis moinhos
      do parque que mantém o mecanismo de moagem intacto, tendo laborado até 1968. Conta com 116 aldeias
      históricas; em Stripeikiai funciona o museu da apicultura tradicional.
    before: >-
      Acampar e acender fogueiras só é permitido nos parques de campismo assinalados. Confirma o horário do
      centro de visitantes de Palūšė antes da partida.
    around: >-
      Não possui sítios vizinhos publicados no atlas. Pela rede de lagos, alces e lobos, assemelha-se a
      [Soomaa](/lugar/soomaa-rahvuspark/), [Žemaitija](/lugar/zemaitijos-nacionalinis-parkas/),
      [Šumava](/lugar/narodni-park-sumava/) e [Ķemeri](/lugar/kemeru-nacionalais-parks/).
