resumen:
  es: >-
    El Parque Nacional más antiguo de Lituania (1974), laberinto de 126 lagos glaciares interconectados por
    arroyos en pinares boreales.
  en: >-
    Lithuania's oldest National Park (1974), an intricate maze of 126 glacial lakes interconnected by clear
    streams through boreal pine woods.
  fr: >-
    Le plus ancien parc national de Lituanie (1974), dédale de 126 lacs glaciaires reliés par des rivières au
    sein de pinèdes boréales.
  de: >-
    Litauens ältester Nationalpark (1974), ein Labyrinth aus 126 Gletscherseen, die durch Wasserläufe in
    borealen Kiefernwäldern verbunden sind.
  it: >-
    Il parco nazionale più antico della Lituania (1974), labirinto di 126 laghi glaciali interconnessi da
    torrenti in pinete boreali.
  pt: >-
    O Parque Nacional mais antigo da Lituânia (1974), labirinto de 126 lagos glaciares interligados por
    ribeiros em pinhais boreais.
