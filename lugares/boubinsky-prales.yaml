  de: Ein seit 1858 geschützter Wald mit einem eingezäunten Kerngebiet, das ganz sich selbst überlassen bleibt.
  it: Una foresta protetta fin dal 1858, con un cuore recintato lasciato crescere, cadere e rigenerarsi da sé.
  pt: Uma mata protegida desde 1858, cujo núcleo vedado é deixado crescer, cair e recomeçar por si só.
observaciones:
  es: >-
    El 14 de abril de 2022 se cerró la entrada al sendero didáctico que rodea el núcleo, por el riesgo de
    caída de árboles secos tras la plaga de escarabajos de 2019, y el acceso por el camino Knížecí cesta sigue
    prohibido; la senda accesible llega hasta el dique del lago. El núcleo vallado no se visita. La reserva
    recibe unos cien mil turistas al año, así que cuenta con compañía en los tramos de la cumbre.
texto:
  es:
    intro: >-
      Hace doce mil años, cuando acabó la última glaciación, este bosque ya empezaba a ser bosque. Boubínský
      prales, el bosque virgen de Boubín, se extiende por la ladera del monte Boubín, de 1.362 m, en el Bosque
      de Bohemia, y en 1858 se convirtió en una reserva natural: la tercera más antigua de Chequia. Tiene
      hayas, píceas y abetos que llegan a los 400 años, un núcleo vallado donde nadie ha cortado un árbol en
      más de siglo y medio y un lago diminuto que se construyó para flotar madera.
    landscape: >-
      Boubín no es una sola cosa. Es un macizo de gneis, micacitas y granito de grano grueso donde la piedra
      apenas asoma, salvo en las crestas y en la cumbre. Lo demás lo tapa el bosque, y ese bosque cambia con
      la altura: en lo bajo, hayedos ricos en flores; más arriba, hayedos de montaña ácidos; y en lo alto,
      pícea climácica. Dentro del núcleo vallado, de 46,67 ha, la regeneración es abundante, sobre todo de
      haya: hasta 15.460 arbolitos por hectárea frente a 250-300 árboles adultos. El bosque se está rehaciendo
      solo.


      La rareza del bosque era el Rey de los Abetos Rojos, una pícea de 440 años, 57 m y 160 cm de diámetro
      que cayó en una tormenta de nieve el 4 de diciembre de 1970. Los árboles caídos se dejan donde están,
      salvo donde puedan ser un peligro para los visitantes.
    wildlife: >-
      Lo que ves en Boubín depende de a qué altura miras. En el sotobosque hay plantas protegidas como
      Cicerbita alpina, la hierba de París y Lycopodium annotinum, y en los últimos años se han vuelto a
      encontrar las orquídeas Epipogium aphyllum y Corallorhiza trifida y el helecho Botrychium multifidum,
      que se daba por extinguido. La reserva es rica en hongos, y Pseudorhizina sphaerospora solo se conoce en
      Chequia de tres localidades. En las cumbres se han contado 311 especies de invertebrados.


      Arriba, entre las ramas, se oye más que se ve. Entre las aves protegidas están el [pico
      dorsiblanco](/especie/dendrocopos_leucotos/), el grévol y el [cárabo
      uralense](/especie/strix_uralensis/); entre las rapaces nocturnas anidan también el mochuelo boreal y el
      [mochuelo chico](/especie/glaucidium_passerinum/); y entre las aves de cavidades, el [pito
      negro](/especie/dryocopus_martius/) y el [pico tridáctilo](/especie/picoides_tridactylus/).


      La historia de los mamíferos tiene una moraleja. Sin grandes depredadores, los ungulados se
      multiplicaron y se comen los brotes jóvenes, sobre todo de [abeto blanco](/especie/abies_alba/) y arce
      sicómoro. En los años 80 del siglo XX se reintrodujo el [lince](/especie/lynx_lynx/), que desde entonces
      se reproduce con éxito en la zona.
    visit: >-
      Se entra por Kubova Huť o por Zátoň. En Zátoň hay un apeadero de tren, Zátoň – Boubín, y una señal verde
      que lleva al aparcamiento bajo el Boubín y al centro de información de Idina Pila. De allí se llega al
      lago de Boubín, donde empieza el sendero didáctico de casi cuatro kilómetros y ocho paradas: informan
      sobre la flora, los árboles, las aves y los animales del bosque y de todo Šumava.


      Desde Kubova Huť, la marca azul pasa por los prados de Basum y la cumbre del Boubín, con su torre
      mirador de madera: 21 m y 109 escalones, con vistas sobre el este del Bosque de Bohemia. Otra marca azul
      lleva a la piedra de John, que lleva el nombre de quien impulsó la reserva. El sendero hasta el dique
      del lago es adecuado para sillas de ruedas y carritos infantiles.
    history: >-
      El forestal Josef John, jefe de los bosques de los Schwarzenberg en Vimperk, fue quien más hizo por su
      protección. Desde 1847 recorrió los rincones aún intactos y marcó ocho áreas de investigación. Una
      fuerte tormenta en 1870 y el miedo al escarabajo de la corteza llevaron a talar con dureza, y solo
      quedaron intactas unas 47 ha. Que el bosque no desapareciera tuvo algo de suerte: la vidriera de Kubova
      Huť necesitaba leña, pero había madera de sobra en los alrededores y las zonas de difícil acceso no se
      talaron. Por el bosque pasaban dos sendas de contrabandistas con sal, pólvora, ganado y cereal, y cerca
      se construyó entre 1789 y 1822 el canal Schwarzenberg, capaz de flotar madera hasta Praga y Viena. El
      pequeño lago, de 1836, también servía para eso.


      El resto de la historia es la de un lugar demasiado querido. En 1958, más de cien mil visitantes al año
      recorrían el camino hacia el lago y el Rey de los Abetos. Por eso el núcleo se cercó con una valla en
      1963 y desde 1979 está cerrado por completo al público. En 2007 el huracán Kyrill y, un año después, el
      temporal Ema dañaron las cumbres.
    before: >-
      El 14 de abril de 2022 se cerró la entrada al sendero didáctico que rodea el núcleo, por el riesgo de
      caída de árboles secos tras la plaga de escarabajos de 2019, y el acceso por el camino Knížecí cesta
      sigue prohibido; la senda accesible llega hasta el dique del lago. El núcleo vallado no se visita. La
      reserva recibe unos cien mil turistas al año, así que cuenta con compañía en los tramos de la cumbre.
    around: >-
      El [Parque Nacional de Šumava](/lugar/narodni-park-sumava/) está a unos 5 km, y el [Parque Nacional del
      Bosque Baviera](/lugar/nationalpark-bayerischer-wald/), a unos 15 km: juntos forman el gran bosque de
      montaña del Bosque de Bohemia. Los [Hayedos de las Montañas de
      Jizera](/lugar/narodni-prirodni-rezervace-jizerskohorske-buciny/) comparten con Boubín el mochuelo chico
      y el bosque primario de montaña, igual que el [Parque Nacional de Białowieża - Reserva
      Estricta](/lugar/bialowieski-park-narodowy---rezerwat-scisly/).
  en:
    intro: >-
      Twelve thousand years ago, as the last ice sheets receded, this forest was already coming into being.
      Boubínský prales, the primeval forest of Mount Boubín, drapes the slopes of the 1,362 m peak in the
      Bohemian Forest, and was set aside as a nature reserve in 1858: the third oldest in the Czech lands. It
      shelters beeches, spruces, and silver firs reaching 400 years of age, a fenced core where no axe has
      struck a trunk in more than a century and a half, and a miniature artificial lake built for timber
      rafting.
    landscape: >-
      Boubín is multifaceted. It is a massif of gneiss, mica schist, and coarse-grained granite where bedrock
      rarely surfaces except on high ridges and the summit tor. Everywhere else is cloaked in dense woodland
      that changes with elevation: rich herb-layer beechwoods in the lower zone, acidic mountain beech-fir
      forests further up, and climax spruce woodland at the top. Within the fenced core of 46.67 ha, natural
      regeneration is vigorous, particularly in beech: up to 15,460 saplings per hectare compared with 250-300
      mature canopy trees. The forest regenerates entirely without human aid.


      The iconic giant of the wood was the King of Spruces, a monumental Norway spruce of 440 years, 57 m in
      height and 160 cm in trunk diameter, which crashed down in a snowstorm on 4 December 1970. Fallen trunks
      remain exactly where they fall, except where they present an immediate hazard to visitor trails.
    wildlife: >-
      What you encounter in Boubín depends on the vertical layer you examine. In the understorey grow
      protected wildflowers including Cicerbita alpina, herb Paris, and Lycopodium annotinum; recent surveys
      have refound rare orchids like Epipogium aphyllum and Corallorhiza trifida, alongside the grape-fern
      Botrychium multifidum, once presumed locally extinct. The reserve is extraordinarily rich in fungi, with
      Pseudorhizina sphaerospora known in the Czech Republic from only three localities. Across the summit
      ridges, 311 invertebrate species have been catalogued.


      High in the canopy, wildlife is heard far more often than seen. Protected birds include the
      [white-backed woodpecker](/especie/dendrocopos_leucotos/), hazel grouse, and [Ural
      owl](/especie/strix_uralensis/); nesting nocturnal raptors include the boreal owl and [Eurasian pygmy
      owl](/especie/glaucidium_passerinum/); while hole-nesting specialists feature the [black
      woodpecker](/especie/dryocopus_martius/) and [three-toed woodpecker](/especie/picoides_tridactylus/).


      The mammalian history holds an ecological lesson. In the prolonged absence of apex predators, wild
      ungulates multiplied and heavily overbrowsed young saplings, hitting [silver fir](/especie/abies_alba/)
      and sycamore hardest. During the 80s of the twentieth century the [Eurasian lynx](/especie/lynx_lynx/)
      was reintroduced, successfully breeding throughout the region ever since.
    visit: >-
      Access is from Kubova Huť or Zátoň. Zátoň has a railway halt, Zátoň – Boubín, and green waymarks lead to
      the trailhead car park beneath Boubín and the Idina Pila visitor information point. From there a path
      reaches Boubín lake, starting point for an educational nature trail of nearly four kilometres with eight
      interpretive stops covering forest flora, veteran trees, birds, and animals across Šumava.


      From Kubova Huť, blue waymarks climb past the Basum meadows to the summit of Mount Boubín, crowned by a
      wooden lookout tower: 21 m high with 109 steps, offering panoramic vistas across the eastern Bohemian
      Forest. Another blue trail leads to John’s Stone, honouring the forester who championed the reserve. The
      gravel trail leading up to the lake dam is accessible for wheelchairs and all-terrain pushchairs.
    history: >-
      Forester Josef John, head of the Schwarzenberg forestry estate in Vimperk, was the driving visionary
      behind its protection. From 1847 onwards he surveyed the remaining pristine stands and marked out eight
      research plots. A severe gale in 1870 followed by salvage-logging fears over spruce bark beetle led to
      sweeping clearcuts, sparing only some 47 ha of intact old-growth core. That this wood survived was also
      a matter of circumstance: the glassworks at Kubova Huť required fuelwood, but timber was abundant closer
      to hand, leaving these rugged upper slopes unharvested. Two historic smugglers' trails carrying salt,
      gunpowder, livestock, and grain once crossed the ridge, and nearby between 1789 and 1822 the
      Schwarzenberg floating canal was engineered to raft timber towards Prague and Vienna. The small
      reservoir, dammed in 1836, served the same log-driving purpose.


      The subsequent chapter is that of a wilderness loved almost to destruction. By 1958, over one hundred
      thousand annual visitors trod the trail to the lake and the King of Spruces. Consequently, the core zone
      was fenced off in 1963 and has been entirely closed to public entry since 1979. In 2007 Cyclone Kyrill,
      and a year later Storm Emma, inflicted heavy blowdown across the summit ridges.
    before: >-
      On 14 April 2022 the circular educational trail encircling the core was closed due to the imminent
      hazard of falling snag trees following the 2019 bark beetle outbreak, and access along the Knížecí cesta
      road remains barred; the accessible path reaches only as far as the lake dam. The fenced core is
      strictly off-limits. The reserve draws some one hundred thousand visitors each year, so expect company
      along open summit stretches.
    around: >-
      The [Šumava National Park](/lugar/narodni-park-sumava/) lies some 5 km away, and the [Bavarian Forest
      National Park](/lugar/nationalpark-bayerischer-wald/) about 15 km: together they form the great
      cross-border mountain wilderness of the Bohemian Forest. The [Jizera Mountains Beech Forest National
      Nature Reserve](/lugar/narodni-prirodni-rezervace-jizerskohorske-buciny/) shares primeval mountain
      woodland and pygmy owls with Boubín, as does the [Białowieża National Park - Strict
      Reserve](/lugar/bialowieski-park-narodowy---rezerwat-scisly/).
  fr:
    intro: >-
      Il y a douze mille ans, à la fin de la dernière glaciation, cette forêt prenait déjà racine. Boubínský
      prales, la forêt primaire de Boubín, tapisse les flancs du mont Boubín, haut de 1 362 m, dans la forêt
      de Bohême, et devint en 1858 une réserve naturelle : la troisième plus ancienne des pays tchèques. Elle
      compte des hêtres, épicéas et sapins atteignant 400 ans, un cœur clôturé où aucun arbre n'a été abattu
      depuis plus d'un siècle et demi, et un petit étang artificiel jadis voué au flottage du bois.
    landscape: >-
      Boubín ne se résume pas à un seul visage. C'est un massif de gneiss, micaschistes et granit à gros
      grains où la roche affleure à peine, hormis sur les crêtes et le dôme sommital. Tout le reste disparaît
      sous la forêt, et cette couverture évolue avec l'altitude : vers le bas, des hêtraies fleuries ; plus
      haut, des hêtraies-sapinières acidophiles montagnardes ; et au sommet, l'épicéa climacique. Au sein du
      noyau clôturé, fort de 46,67 ha, la régénération naturelle est vigoureuse, en particulier pour le hêtre
      : jusqu'à 15 460 jeunes tiges par hectare face à 250-300 arbres adultes. La forêt se régénère
      entièrement par elle-même.


      La merveille du massif était le Roi des Épicéas, un conifère monumental de 440 ans, haut de 57 m et de
      160 cm de diamètre, qui s'est abattu lors d'une tourmente de neige le 4 décembre 1970. Les troncs tombés
      demeurent sur place, sauf lorsqu'ils menacent directement les cheminements ouverts.
    wildlife: >-
      Ce que l'on découvre à Boubín dépend de la hauteur où porte le regard. Le sous-bois abrite des espèces
      protégées telles que Cicerbita alpina, la parisette à quatre feuilles et Lycopodium annotinum ; ces
      dernières années ont vu réapparaître des orchidées très rares comme Epipogium aphyllum et Corallorhiza
      trifida, ainsi que la fougère Botrychium multifidum, que l'on croyait localement éteinte. La réserve
      regorge de champignons, et Pseudorhizina sphaerospora n'est connue en Tchéquie que dans trois localités.
      Sur les hauteurs sommitales, on a dénombré 311 espèces d'invertébrés.


      En altitude, sous la frondaison, on entend bien plus qu'on ne voit. Parmi les oiseaux protégés nichent
      le [pic à dos blanc](/especie/dendrocopos_leucotos/), la gélinotte des bois et la [chouette de
      l'Oural](/especie/strix_uralensis/) ; les rapaces nocturnes comptent la chouette de Tengmalm et la
      [chevêchette d'Europe](/especie/glaucidium_passerinum/) ; tandis que parmi les hôtes des cavités
      s'illustrent le [pic noir](/especie/dryocopus_martius/) et le [pic
      tridactyle](/especie/picoides_tridactylus/).


      Le sort des mammifères offre un enseignement écologique. Faute de grands prédateurs, les ongulés ont
      pullulé et broutent les jeunes pousses, compromettant le [sapin blanc](/especie/abies_alba/) et l'érable
      sycomore. Dans les années 80 du XXe siècle, le [lynx boréal](/especie/lynx_lynx/) a été réintroduit et
      se reproduit depuis avec succès dans la région.
    visit: >-
      L'accès s'effectue depuis Kubova Huť ou Zátoň. Zátoň dispose d'une halte ferroviaire, Zátoň – Boubín, et
      un balisage vert conduit au parking sous le Boubín et au chalet d'information d'Idina Pila. De là, on
      gagne l'étang de Boubín, point de départ d'un sentier pédagogique de près de quatre kilomètres et huit
      stations expliquant la flore, les arbres vénérables, l'avifaune et les mammifères de la Šumava.


      Depuis Kubova Huť, le balisage bleu franchit les prairies de Basum et rejoint le sommet du mont Boubín,
      pourvu d'une tour d'observation en bois : 21 m de hauteur et 109 marches, dévoilant un panorama sur
      l'est de la forêt de Bohême. Un autre chemin balisé en bleu mène à la pierre de John, dédiée au
      promoteur historique de la réserve. Le sentier jusqu'à la digue du plan d'eau est accessible aux
      fauteuils roulants et poussettes tout-terrain.
    history: >-
      Le forestier Josef John, régisseur des forêts des Schwarzenberg à Vimperk, fut le grand artisan de la
      sauvegarde du site. À partir de 1847, il parcourut les lambeaux encore vierges et délimita huit
      parcelles de recherche. Une violente tempête en 1870 et la hantise des scolytes entraînèrent des coupes
      massives, n'épargnant qu'environ 47 ha de forêt intacte. La préservation du site tint aussi à la chance
      : la verrerie de Kubova Huť exigeait du bois de chauffe, mais les peuplements périphériques suffirent et
      les pentes escarpées restèrent vierges. Par ce massif passaient deux sentiers de contrebande acheminant
      sel, poudre, bétail et céréales, et tout près fut aménagé entre 1789 et 1822 le canal de flottage de
      Schwarzenberg vers Prague et Vienne. Le petit lac de retenue, créé en 1836, servait au même flottage.


      La suite raconte la rançon du succès. En 1958, plus de cent mille visiteurs par an empruntaient le
      chemin du lac et du Roi des Épicéas. Le cœur fut alors ceint d'une clôture en 1963 et demeure totalement
      fermé au public depuis 1979. En 2007, l'ouragan Kyrill et, un an plus tard, la tempête Emma ont
      lourdement endommagé les crêtes.
    before: >-
      Le 14 avril 2022, le sentier pédagogique ceinturant la réserve intégrale a été fermé en raison du danger
      de chute d'arbres morts à la suite de la prolifération de scolytes de 2019, et la voie Knížecí cesta
      reste interdite ; le cheminement accessible s'arrête à la digue de l'étang. Le noyau clôturé ne se
      visite en aucun cas. La réserve accueille quelque cent mille touristes par an, attendez-vous donc à
      croiser du monde sur les sentiers ouverts du sommet.
    around: >-
      Le [Parc national de Šumava](/lugar/narodni-park-sumava/) se trouve à environ 5 km, et le [Parc national
      de la Forêt de Bavière](/lugar/nationalpark-bayerischer-wald/) à quelque 15 km : ensemble, ils forment
      le grand massif forestier montagnard de la forêt de Bohême. Les [Hêtraies des monts
      Jizera](/lugar/narodni-prirodni-rezervace-jizerskohorske-buciny/) partagent avec Boubín la chevêchette
      d'Europe et la forêt primaire d'altitude, tout comme le [Parc national de Białowieża - Réserve
      intégrale](/lugar/bialowieski-park-narodowy---rezerwat-scisly/).
  de:
    intro: >-
      Vor zwölftausend Jahren, als die letzte Eiszeit zu Ende ging, begann dieser Wald bereits zu wachsen.
      Boubínský prales, der Boubín-Urwald, erstreckt sich über die Flanken des 1.362 m hohen Berges Boubín im
      Böhmerwald und wurde 1858 zum Naturschutzgebiet erklärt: das drittälteste in den böhmischen Ländern. Er
      birgt bis zu 400 Jahre alte Buchen, Fichten und Tannen, ein eingezäuntes Kerngebiet, in dem seit über
      anderthalb Jahrhunderten kein Baum mehr gefällt wurde, und einen kleinen künstlichen Stausee, der für
      die Holztrift angelegt wurde.
    landscape: >-
      Boubín zeigt viele Gesichter. Es ist ein Gebirgsmassiv aus Gneis, Glimmerschiefer und grobkörnigem
      Granit, in dem Felsgestein fast nirgends zutage tritt, außer auf Graten und dem Gipfel. Alles andere
      bedeckt dichter Wald, der sich mit der Höhenlage wandelt: in tiefen Lagen blütenreiche Hangbuchenwälder,
      darüber saure montane Buchen-Tannenwälder und ganz oben klimaxgeprägte Fichtenwälder. Im eingezäunten
      Kerngebiet von 46,67 ha ist die Naturverjüngung enorm stark, namentlich bei der Buche: bis zu 15.460
      Jungbäume pro Hektar gegenüber 250-300 Altbäumen. Der Wald verjüngt sich völlig eigenständig.


      Das Wahrzeichen des Waldes war der Fichtenkönig, eine monumentale Fichte von 440 Jahren, 57 m Höhe und
      160 cm Stammdurchmesser, die in einem Schneesturm am 4. Dezember 1970 fiel. Umgestürzte Stämme bleiben
      ausnahmslos liegen, es sei denn, sie gefährden offizielle Wanderwege.
    wildlife: >-
      Was du im Boubín entdeckst, hängt von der Höhenstufe ab, die du erkundest. In der Krautschicht wachsen
      seltene Arten wie Cicerbita alpina, die Einbeere und Lycopodium annotinum; in den letzten Jahren wurden
      extrem seltene Orchideen wie Epipogium aphyllum und Corallorhiza trifida sowie die als verschollen
      gegoltene Farnart Botrychium multifidum wiedergefunden. Das Schutzgebiet ist herausragend pilzreich, und
      Pseudorhizina sphaerospora ist in Tschechien nur von drei Fundorten bekannt. Auf den Höhenkämmen wurden
      311 Wirbellosenarten erfasst.


      Oben im Kronendach hört man Vögel meist eher, als man sie sieht. Zu den geschützten Arten zählen
      [Weißrückenspecht](/especie/dendrocopos_leucotos/), Haselhuhn und
      [Habichtskauz](/especie/strix_uralensis/); unter den Eulen brüten Raufußkauz und
      [Sperlingskauz](/especie/glaucidium_passerinum/); unter den Höhlenbrütern fallen
      [Schwarzspecht](/especie/dryocopus_martius/) und [Dreizehenspecht](/especie/picoides_tridactylus/) auf.


      Die Geschichte der Säugetiere birgt eine ökologische Lehre. Da Großraubtiere fehlten, vermehrte sich das
      Schalenwild stark und verbiss junge Triebe, besonders von [Weißtanne](/especie/abies_alba/) und
      Bergahorn. In den 80er-Jahren des zwanzigsten Jahrhunderts wurde der [Luchs](/especie/lynx_lynx/)
      wiederangesiedelt, der sich seither im Böhmerwald erfolgreich fortpflanzt.
    visit: >-
      Der Zugang erfolgt ab Kubova Huť oder Zátoň. In Zátoň gibt es die Bahnstation Zátoň – Boubín; eine grüne
      Markierung führt zum Wanderparkplatz unter dem Berg und zur Infostelle Idina Pila. Von dort gelangt man
      zum Boubín-Teich, an dem ein fast vier Kilometer langer Lehrpfad mit acht Stationen beginnt, der über
      Flora, Altbäume, Vögel und Tiere im Böhmerwald informiert.


      Von Kubova Huť leitet die blaue Markierung über die Basum-Wiesen zum Gipfel des Boubín mit seinem
      hölzernen Aussichtsturm: 21 m hoch und 109 Stufen, mit weiter Aussicht über den östlichen Böhmerwald.
      Ein weiterer blau markierter Weg führt zum John-Gedenkstein, benannt nach dem Initiator des Reservats.
      Der Weg hinauf zum Damm des Weihers ist für Rollstühle und geländegängige Kinderwagen geeignet.
    history: >-
      Der fürstlich schwarzenbergische Forstmeister Josef John in Vimperk war der entscheidende Förderer des
      Schutzgedankens. Ab 1847 durchstreifte er die unberührten Restwälder und steckte acht Forschungsflächen
      ab. Ein verheerender Sturm im Jahr 1870 und die Furcht vor Borkenkäfermassenvermehrungen führten zu
      radikalen Kahlschlägen, sodass nur rund 47 ha Urwaldkern unangetastet blieben. Dass der Wald nicht ganz
      verschwand, war auch glücklichen Umständen zu verdanken: Die Glashütte in Kubova Huť benötigte
      Brennholz, fand aber genug Holz im Umland, sodass schwer zugängliche Hänge verschont blieben. Zwei
      historische Schmugglerpfade für Salz, Schießpulver, Vieh und Getreide querten den Felsrücken, und in der
      Nähe entstand zwischen 1789 und 1822 der Schwarzenbergische Schwemmkanal zur Holztrift nach Prag und
      Wien. Der kleine Stausee von 1836 diente ebenfalls diesem Zweck.


      Die jüngere Geschichte ist die eines überlaufenen Naturdenkmals. Im Jahr 1958 strömten jährlich über
      einhunderttausend Besucher zum Teich und zum Fichtenkönig. Daher wurde die Kernzone 1963 eingezäunt und
      ist seit 1979 vollständig für die Öffentlichkeit gesperrt. Im Jahr 2007 richtete Orkan Kyrill und ein
      Jahr später Sturmtief Emma schwere Schäden in den Kammlagen an.
    before: >-
      Am 14. April 2022 wurde der Rundweg um das Kerngebiet wegen akuter Gefahr umstürzender Dürrständer nach
      der Borkenkäferwelle von 2019 gesperrt, und die Knížecí cesta bleibt unpassierbar; der begehbare Weg
      endet am Teichdamm. Das eingezäunte Kerngebiet darf keinesfalls betreten werden. Das Schutzgebiet zieht
      jährlich rund einhunderttausend Besucher an; auf den Gipfelwegen triffst du verlässlich auf andere
      Wanderer.
    around: >-
      Der [Nationalpark Šumava](/lugar/narodni-park-sumava/) liegt etwa 5 km entfernt, der [Nationalpark
      Bayerischer Wald](/lugar/nationalpark-bayerischer-wald/) rund 15 km: Beide bilden zusammen das große
      Bergwaldmassiv des Böhmerwalds. Die [Buchenwälder des
      Isergebirges](/lugar/narodni-prirodni-rezervace-jizerskohorske-buciny/) teilen mit Boubín Sperlingskauz
      und urwaldartige montane Buchenwälder, ebenso wie der [Nationalpark Białowieża – Strenges
      Reservat](/lugar/bialowieski-park-narodowy---rezerwat-scisly/).
  it:
    intro: >-
      Dodicimila anni fa, al termine dell'ultima era glaciale, questa foresta cominciava già a formarsi.
      Boubínský prales, la foresta vergine del monte Boubín, riveste le pendici dell'omonima vetta di 1.362 m
      nella Selva Boema, e nel 1858 divenne riserva naturale: la terza più antica delle terre ceche. Conserva
      faggi, pecci e abeti che toccano i 400 anni d'età, un'area recintata dove nessuno abbatte un albero da
      oltre un secolo e mezzo e un laghetto artificiale costruito per la fluitazione del legname.
    landscape: >-
      Boubín racchiude molteplici ambienti. È un massiccio di gneiss, micascisti e graniti a grana grossa dove
      la roccia affiora raramente, se non sulle creste e sul picco sommitale. Tutto il resto è ammantato dal
      bosco, che varia con la quota: nelle fasce basali splendide faggete ricche di sottobosco; più in alto
      faggete montane acidofile; sulla cima la pecceta climacica. Nel nucleo recintato di 46,67 ha la
      rinnovazione naturale è rigogliosa, specialmente per il faggio: fino a 15.460 giovani alberelli per
      ettaro a fronte di 250-300 piante adulte. La foresta si rigenera interamente da sola.


      Il monumento vivente del bosco era il Re degli Abeti Rossi, un peccio di 440 anni, alto 57 m e con un
      diametro di 160 cm, schiantato da una tormenta di neve il 4 dicembre 1970. I tronchi caduti restano al
      suolo dove sono stramazzati, salvo quando intralciano i sentieri aperti.
    wildlife: >-
      Ciò che scopri a Boubín dipende dalla fascia altitudinale che osservi. Nel sottobosco crescono piante
      protette come Cicerbita alpina, l'uva di volpe e Lycopodium annotinum; negli ultimi anni sono state
      riscoperte orchidee rarissime come Epipogium aphyllum e Corallorhiza trifida, assieme alla felce
      Botrychium multifidum, ritenuta localmente estinta. La riserva è straordinariamente ricca di funghi, e
      Pseudorhizina sphaerospora è nota nella Repubblica Ceca in sole tre località. Sulle creste sommitali
      sono state censite 311 specie di invertebrati.


      Lassù tra le chiome, la fauna si ode più che scorgersi. Tra i volatili protetti nidificano il [picchio
      dorsobianco](/especie/dendrocopos_leucotos/), il francolino di monte e l'[allocco degli
      Urali](/especie/strix_uralensis/); tra i rapaci notturni figurano la civetta capogrosso e la [civetta
      nana](/especie/glaucidium_passerinum/); tra i nidificatori in cavità spiccano il [picchio
      nero](/especie/dryocopus_martius/) e il [picchio tridattilo](/especie/picoides_tridactylus/).


      La storia dei mammiferi cela una lezione ecologica. Mancando i grandi predatori, gli ungulati si sono
      moltiplicati brucando i giovani germogli di [abete bianco](/especie/abies_alba/) e acero di monte. Negli
      anni 80 del XX secolo è stata reintrodotta la [lince europea](/especie/lynx_lynx/), che da allora si
      riproduce stabilmente nella regione.
    visit: >-
      Si accede da Kubova Huť oppure da Zátoň. A Zátoň si trova la fermata ferroviaria Zátoň – Boubín, e una
      traccia verde guida al parcheggio ai piedi del monte e al punto informativo di Idina Pila. Da lì si
      raggiunge il laghetto di Boubín, dove parte un itinerario didattico di quasi quattro chilometri e otto
      tappe illustrative su flora, patriarchi arborei e fauna della Selva Boema.


      Da Kubova Huť i segnavia blu attraversano i prati di Basum fino alla vetta del monte Boubín, sormontata
      da una torre panoramica in legno: 21 m di altezza e 109 gradini con vista ampia sulla Selva Boema
      orientale. Un altro sentiero blu conduce alla pietra di John, che ricorda il fondatore della riserva. La
      pista battuta fino alla diga del lago è accessibile anche a passeggini e carrozzine.
    history: >-
      Il forestale Josef John, ispettore capo delle foreste dei principi Schwarzenberg a Vimperk, fu il padre
      nobile della riserva. A partire dal 1847 censì i settori vergini superstite e delimitò otto aree di
      studio. Un violento uragano nel 1870 e il terrore per le infestazioni di scolitidi provocarono massicce
      tagliate a raso, salvando intatti appena 47 ha di nucleo primario. La sopravvivenza del bosco fu dovuta
      anche alla sorte: la vetreria di Kubova Huť bruciava legna, ma ce n'era a sufficienza a quote inferiori
      e i pendii scoscesi non vennero disboscati. Due sentieri di contrabbandieri di sale, polvere da sparo,
      bestiame e cereali valicavano la cresta, e nelle vicinanze tra il 1789 e il 1822 fu scavato il canale di
      Schwarzenberg per fluitare tronchi verso Praga e Vienna. Il laghetto, sbarrato nel 1836, assolveva al
      medesimo scopo.


      Il resto è la vicenda di un luogo quasi soffocato dal turismo. Nel 1958 oltre centomila visitatori
      all'anno percorrevano la traccia verso il lago e il Re degli Abeti Rossi. Il nucleo fu così recintato
      nel 1963 e dal 1979 è totalmente interdetto al pubblico. Nel 2007 l'uragano Kyrill e un anno dopo la
      tempesta Emma hanno sferzato duramente le crinali.
    before: >-
      Il 14 aprile 2022 l'anello didattico attorno al nucleo vergine è stato interrotto per il pericolo di
      caduta di alberi secchi in seguito all'epidemia di bostrico del 2019, e il sentiero Knížecí cesta resta
      sbarrato; la via accessibile conduce fino alla diga del bacino. Il cuore recintato non è visitabile in
      alcun modo. La riserva accoglie circa centomila visitatori ogni anno: aspettati compagnia sui sentieri
      aperti di vetta.
    around: >-
      Il [Parco Nazionale di Šumava](/lugar/narodni-park-sumava/) sorge a circa 5 km, e il [Parco Nazionale
      della Foresta Bavarese](/lugar/nationalpark-bayerischer-wald/) a circa 15 km: assieme costituiscono la
      grande foresta montana della Selva Boema. Le [Faggete dei Monti
      Jizera](/lugar/narodni-prirodni-rezervace-jizerskohorske-buciny/) condividono con Boubín la civetta nana
      e la foresta vergine d'alta quota, così come il [Parco Nazionale di Białowieża - Riserva
      Integrale](/lugar/bialowieski-park-narodowy---rezerwat-scisly/).
  pt:
    intro: >-
      Há doze mil anos, no término do último período glaciar, esta floresta já começava a ganhar corpo.
      Boubínský prales, a floresta virgem de Boubín, estende-se pela encosta do monte Boubín, com 1.362 m de
      altitude, na Floresta da Boémia, tendo sido declarada reserva natural em 1858: a terceira mais antiga
      das terras checas. Abriga faias, espruces e abetos que chegam aos 400 anos de idade, uma área cercada
      onde ninguém abateu uma única árvore em mais de século e meio e uma lagoa diminuta construída para a
      flutuação de madeira.
    landscape: >-
      Boubín revela múltiplas facetas. É um maciço de gnaisse, micaxistos e granito grosseiro onde a rocha
      raramente aflora, exceto nos cumes e cristas escarpadas. Tudo o resto é coberto pelo bosque, que varia
      consoante a altitude: na base, faiais floridos; a meia encosta, faiais-abetais ácidos de montanha; e no
      cimo, o espruce climácico. No interior do núcleo vedado, de 46,67 ha, a regeneração espontânea é
      impressionante, sobretudo na faia: até 15.460 jovens rebentos por hectare frente a 250-300 árvores
      adultas. A floresta restaura-se inteiramente sem auxílio humano.


      O prodígio da mata era o Rei dos Espruces, um exemplar imponente com 440 anos, 57 m de altura e 160 cm
      de diâmetro de tronco, derrubado por uma tempestade de neve a 4 de dezembro de 1970. Os troncos caídos
      permanecem no sítio exato onde tombaram, salvo quando representem perigo para os trilhos autorizados.
    wildlife: >-
      O que encontras em Boubín depende do estrato em que fixas o olhar. No sub-bosque medram plantas raras
      como Cicerbita alpina, a erva-paris e Lycopodium annotinum; nos últimos anos redescobriram-se orquídeas
      raras como Epipogium aphyllum e Corallorhiza trifida, bem como o feto Botrychium multifidum, outrora
      tido como desaparecido. A reserva é abundantíssima em fungos, sendo o cogumelo Pseudorhizina
      sphaerospora conhecido na Chéquia em apenas três localidades. Nas cristas da cumeada contaram-se 311
      espécies de invertebrados.


      Mais acima, entre as copas, a passarada ouve-se muito mais do que se vê. Entre as aves protegidas
      nidificam o [pica-pau-de-dorso-branco](/especie/dendrocopos_leucotos/), a galinha-do-mato e a
      [coruja-dos-urales](/especie/strix_uralensis/); entre as rapinas noturnas ocorrem o mocho-fúnebre e o
      [mocho-pigmeu](/especie/glaucidium_passerinum/); e nas cavidades dos troncos operam o
      [pica-pau-preto](/especie/dryocopus_martius/) e o [pica-pau-tridáctilo](/especie/picoides_tridactylus/).


      A história dos mamíferos encerra uma lição ecológica. Sem grandes predadores, os ungulados
      multiplicaram-se e devastaram a renovação natural de [abeto-branco](/especie/abies_alba/) e
      bordo-bastardo. Nos anos 80 do século XX foi reintroduzido o [lince-euroasiático](/especie/lynx_lynx/),
      que desde então se reproduz regularmente na cordilheira.
    visit: >-
      A entrada faz-se por Kubova Huť ou Zátoň. Zátoň dispõe de apeadeiro ferroviário, Zátoň – Boubín, de onde
      marcas verdes conduzem ao parque de estacionamento no sopé do monte e ao centro de informação de Idina
      Pila. Dali atinge-se a lagoa de Boubín, onde começa o percurso interpretativo com quase quatro
      quilómetros e oito painéis explicativos sobre flora, árvores vetustas e fauna de Šumava.


      A partir de Kubova Huť, o trilho azul cruza os prados de Basum rumo ao cume do monte Boubín, coroado por
      uma torre miradouro de madeira: 21 m de altura e 109 degraus com vistas rasgadas sobre a Boémia
      Oriental. Outro percurso azul ruma à pedra de John, em homenagem ao mentor da reserva. O caminho até ao
      dique da lagoa é transitável para carrinhos de bebé e cadeiras de rodas.
    history: >-
      O silvicultor Josef John, administrador florestal da casa Schwarzenberg em Vimperk, foi o grande
      visionário da sua salvaguarda. A partir de 1847 percorreu os maciços intactos e demarcou oito talhões de
      investigação. Um violento vendaval em 1870 e o pânico perante surtos de escolitídeos ditaram abates
      desmedidos, restando intactos apenas cerca de 47 ha de núcleo virgem. O facto de o bosque não ter
      desaparecido deveu-se também ao acaso: a vidreira de Kubova Huť consumia lenha, mas havia bastante nas
      imediações e as escarpas íngremes foram poupadas. Pela serra passavam dois caminhos de contrabandistas
      com sal, pólvora, gado e cereais, e ali perto construiu-se entre 1789 e 1822 o canal de Schwarzenberg
      para transporte de madeira até Praga e Viena. A pequena lagoa, represada em 1836, servia ao mesmo
      propósito.


      O período posterior espelha a pressão da notoriedade. Em 1958 mais de cem mil visitantes por ano
      percorriam a vereda até à lagoa e ao Rei dos Espruces. O núcleo foi vedado em 1963 e encontra-se
      interdito ao público desde 1979. Em 2007 o furacão Kyrill e, um ano depois, a tempestade Emma castigaram
      duramente as cumeeiras.
    before: >-
      A 14 de abril de 2022 foi encerrado o trilho pedagógico circular em redor da reserva integral devido ao
      perigo iminente de queda de árvores secas após a praga de escolitídeos de 2019, permanecendo fechado o
      caminho Knížecí cesta; o troço acessível chega apenas até ao dique da lagoa. O núcleo vedado não pode
      ser visitado em caso algum. A reserva recebe cerca de cem mil caminhantes anualmente, pelo que
      encontrarás companhia nas secções abertas do cume.
    around: >-
      O [Parque Nacional de Šumava](/lugar/narodni-park-sumava/) fica a cerca de 5 km, e o [Parque Nacional da
      Floresta da Baviera](/lugar/nationalpark-bayerischer-wald/) a cerca de 15 km: em conjunto formam a
      grande mancha florestal de montanha da Floresta da Boémia. Os [Faiais das Montanhas de
      Jizera](/lugar/narodni-prirodni-rezervace-jizerskohorske-buciny/) partilham com Boubín o mocho-pigmeu e
      a floresta primária de montanha, à semelhança do [Parque Nacional de Białowieża - Reserva
      Estrita](/lugar/bialowieski-park-narodowy---rezerwat-scisly/).
