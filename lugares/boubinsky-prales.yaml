    Reserva virgen declarada protegida en 1858 para salvar sus abetos y hayas de 400 años de la explotación
    comercial.
  en: >-
    A virgin forest reserve designated in 1858 to rescue its 400-year-old firs and beeches from commercial
    exploitation.
  fr: Réserve intégrale créée en 1858 pour sauver ses sapins et hêtres de 400 ans de l'exploitation forestière.
  de: >-
    Bereits 1858 unter Schutz gestelltes Urwaldreservat zur Rettung seiner 400 Jahre alten Tannen und Buchen
    vor der Holzfällung.
  it: Riserva integrale istituita nel 1858 per salvare abeti e faggi di 400 anni dall'abbattimento commerciale.
  pt: Reserva virgem instituída em 1858 para salvar da exploração comercial os seus abetos e faias de 400 anos.
unico:
  es: Un bosque protegido desde 1858, con un núcleo que se deja crecer, caer y volver a empezar.
  en: >-
    A woodland protected since 1858, whose untouched core is left entirely to sprout, fall, and renew on its
    own.
  fr: >-
    Une forêt protégée depuis 1858, dont le cœur est laissé libre de croître, s'effondrer et renaître sans
