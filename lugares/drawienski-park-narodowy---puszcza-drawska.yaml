  en: Deep oak and beech forests protecting the pristine canyon of the Drawa River.
  fr: Forêts profondes de chênes et de hêtres protégeant le canyon préservé de la rivière Drawa.
  de: Tiefe Eichen- und Buchenwälder schützen den unberührten Canyon des Flusses Drawa.
  it: Foreste profonde di querce e faggi a tutela dell'incontaminato canyon del fiume Drawa.
  pt: Florestas profundas de carvalho e faia que protegem o desfiladeiro intocado do rio Drawa.
unico:
  es: >-
    En sus aguas rápidas viven 39 especies de peces y una de lamprea, y el salmón, que casi desapareció,
    vuelve a subir porque el parque lo repuebla cada año desde 1995.
  en: >-
    In its swift waters live 39 fish species and one lamprey species, and salmon, which had nearly vanished,
    run upriver again thanks to annual restocking since 1995.
  fr: >-
    Ses eaux vives abritent 39 espèces de poissons et une de lamproie, et le saumon, qui avait presque
    disparu, remonte à nouveau grâce aux réempoissonnements annuels menés depuis 1995.
  de: >-
    In seinen schnellen Gewässern leben 39 Fischarten und eine Neunaugenart, und der Lachs, der fast
    verschwunden war, zieht dank des jährlichen Besatzes seit 1995 wieder flussaufwärts.
  it: >-
    Nelle sue acque rapide vivono 39 specie di pesci e una di lampreda, e il salmone, che era quasi scomparso,
    torna a risalire la corrente grazie ai ripopolamenti annuali attivi dal 1995.
  pt: >-
    Nas suas águas rápidas vivem 39 espécies de peixes e uma de lampreia, e o salmão, que quase tinha
    desaparecido, volta a subir a corrente graças aos repovoamentos anuais desde 1995.
observaciones:
  es: >-
    Los senderos señalizados y los caminos didácticos están abiertos a pie todo el año, del amanecer al
    anochecer. El río es otra cosa: la navegación recreativa con embarcaciones de remo solo se autoriza de
    enero a mediados de marzo y de julio a diciembre, y solo de día, con un máximo de 750 personas a la vez en
    el Drawa dentro del parque. Comprueba las condiciones de acceso y los avisos del gestor antes de ir.
texto:
  es:
    intro: >-
      El Drawa no tiene un solo carácter. Empieza tranquilo, acelera, y en la corriente rápida aparecen de
      pronto árboles caídos; el cauce serpentea entre prados y bosques, socava orillas altas de arena y, más
      allá, se vuelve un hilo perezoso sobre fondos arenosos cubiertos de praderas submarinas. Ese río, uno de
      los más bellos de Polonia, es el eje del Parque Nacional de Drawa.


      Se creó el 1 de mayo de 1990 y hoy ocupa 11 535,66 ha del noroeste del país, en la llanura de Drawsko y
      dentro del complejo de la Puszcza Drawska. El bosque cubre el 83 % de su superficie: sobre todo hayedos
      y robledales con haya, además de pinares.
    landscape: >-
      El Drawa nace a 150 m de altitud en el Valle de los Cinco Lagos, cerca de Połczyn-Zdrój, y atraviesa dos
      regiones: primero la comarca lacustre de Drawsko, entre numerosos lagos, y después la llanura de
      Drawsko, serpenteando entre los bosques de Pomerania. Dentro del parque, el Drawa y su afluente
      Płociczna llevan una corriente viva sobre fondo de piedra, grava o arena y con buena oxigenación,
      condiciones ideales para los peces de corriente.


      Además del río, el parque tiene 20 lagos, entre ellos el Czarnka, único en el país, y el Ostrowite, el
      mayor. Las zonas más valiosas, 1391,62 ha, tienen protección estricta. Y el bosque no solo es extenso:
      junto al Drawa, en Barnimie, crecen hayas monumentales de tronco columnar, y en primavera florece el
      sotobosque de los parajes de Dębina y Grabowy Jar.


      La flora reúne unas 900 especies, con rarezas como la chamedafne, la masiega, el lirio martagón y
      numerosas orquídeas y droseras.
    wildlife: >-
      El pez que mejor cuenta el río es el salmón: nace y crece en ríos limpios, pasa años en el mar y vuelve
      a desovar. Hasta mediados de los años ochenta, el Drawa y el Płociczna tuvieron una población propia, la
      del salmón del Drawa, la de crecimiento más rápido de Polonia: en 1962 se pescó uno de 144 cm y 24 kg. A
      finales de aquella década la población prácticamente dejó de existir. En 1995 empezó el programa de
      restitución: se soltaron en el río más de veinte mil smolts criados con huevas de salmón del río
      Daugava, en Letonia, y las repoblaciones se repiten cada año. A los dos años ya se habían observado 32
      grandes nidos de freza.


      Con el salmón viven el tímalo, tres formas de trucha (la marina, la lacustre y la de río) y la vimba.
      Entre los peces raros están el *głowacz białopłetwy*, la *strzebla potokowa*, la *piekielnica*, la
      *różanka*, la *koza* y el *minóg strumieniowy*, una lamprea. En los lagos hay coregonos de aguas
      profundas y bien oxigenadas.


      Entre las aves, anidan unas 130 especies, entre ellas el pigargo, el águila pescadora, el águila
      pomerana, el búho real, la cigüeña negra y el martín pescador, que tiene en un tramo del Drawa, junto a
      la senda de Barnimie, su refugio. En los pasos de primavera y otoño llegan aves migratorias como la
      grulla, el cuco, el papamoscas papirrojo y el carricero.


      Los mamíferos suman unas 50 especies: ciervo, corzo, castor, jabalí, lobo y varios murciélagos. La
      nutria es el símbolo del parque. Y entre los invertebrados hay moluscos poco comunes, como la *szklarka
      zielonawa* y el caracol romano.


      El calendario es claro: de mayo a septiembre es la mejor época, y la primavera trae el sotobosque en
      flor. En invierno el esquí de fondo se practica por los itinerarios habilitados para caminar.
    visit: >-
      Hay cinco senderos didácticos, tres en el noroeste y dos en el sur, marcados con abetos verdes sobre un
      cuadrado blanco. El más completo es Barnimie, que permite recorrer de tres a siete kilómetros: la
      primera etapa, de tres, va desde el paraje Dębina hasta el área de acampada de Barnimie, y otros cuatro
      siguen por el río hasta Zatom. Se calculan unas cuatro horas para el itinerario completo. Allí se
      explican la historia geológica del terreno, los bloques erráticos, la protección de la naturaleza junto
      al Drawa y el uso antiguo del río para flotar madera.


      Más cortos son Drawnik, de 4 km y unas 2 horas, y Głusko, en el sur, de 3 km y unos 40 minutos; el del
      lago Ostrowieckie tiene una variante de 7 km y otra de 5 km. Un sendero geológico, «Petrografia terenów
      nad Drawą», recorre 3,8 km en unas 2 horas. En bicicleta, la ruta azul Pętla Barnimie mide 33,16
      kilómetros.


      En piragua, la primera etapa, del embarcadero de Drawnik al puente de Barnimie, mide 4,6 km. Los
      piragüistas son el grupo de visitantes más numeroso del parque.
    history: >-
      El río fue camino de la madera: en Barnimie se explica cómo se usó el Drawa para flotar troncos. Hoy el
      hilo conductor es la recuperación del salmón, que el parque sostiene desde 1995.
    before: >-
      Los senderos señalizados y los caminos didácticos están abiertos a pie todo el año, del amanecer al
      anochecer. El río es otra cosa: la navegación recreativa con embarcaciones de remo solo se autoriza de
      enero a mediados de marzo y de julio a diciembre, y solo de día, con un máximo de 750 personas a la vez
      en el Drawa dentro del parque. Comprueba las condiciones de acceso y los avisos del gestor antes de ir.
  en:
    intro: >-
      The Drawa does not have just one character. It starts calmly, speeds up, and fallen trees suddenly
      appear in the swift current; the riverbed meanders through meadows and forests, undercuts high sandy
      banks, and further downstream becomes a gentle trickle over sandy bottoms carpeted with underwater
      meadows. This river, one of Poland's most scenic, forms the backbone of Drawa National Park.


      Established on 1 May 1990, it now covers 11,535.66 ha in the northwest of the country, on the Drawsko
      Plain and within the Puszcza Drawska forest complex. Forest blankets 83 % of its area: predominantly
      beechwoods and oak-beech stands, alongside pine forests.
    landscape: >-
      The Drawa rises at an altitude of 150 m in the Valley of the Five Lakes near Połczyn-Zdrój and flows
      through two regions: first the Drawsko Lake District, winding among numerous lakes, and then across the
      Drawsko Plain, meandering through the Pomeranian forests. Within the park, the Drawa and its tributary
      Płociczna carry a swift current over stone, gravel, and sand bottoms with high oxygen levels—ideal
      conditions for rheophilic fish.


      Beyond the river, the park holds 20 lakes, including Lake Czarnka, unique in the country, and Lake
      Ostrowite, the largest. The most valuable areas, covering 1,391.62 ha, enjoy strict protection. The
      forest is not merely extensive: beside the Drawa at Barnimie stand monumental columnar beeches, and in
      spring the undergrowth blooms across the Dębina and Grabowy Jar tracts.


      The flora comprises around 900 species, including rarities such as leatherleaf, fen-sedge, martagon
      lily, and numerous orchids and sundews.
    wildlife: >-
      The fish that best tells the river's story is the salmon: it hatches and grows in pristine streams,
      spends years at sea, and returns to spawn. Until the mid-eighties, the Drawa and Płociczna sustained
      their own distinct salmon population—the fastest-growing in Poland: in 1962 an individual measuring 144
      cm and 24 kg was caught. By the end of that decade, the population had virtually collapsed. In 1995 the
      recovery programme was launched: over twenty thousand smolts reared from Daugava River salmon roe in
      Latvia were released, and restocking has continued each year. Within two years, 32 large redds were
      observed.


      Living alongside the salmon are grayling, three forms of trout (sea, lake, and brown trout), and vimba
      bream. Rare fishes include the bullhead (*głowacz białopłetwy*), Eurasian minnow (*strzebla potokowa*),
      riffle minnow (*piekielnica*), European bitterling (*różanka*), spined loach (*koza*), and the brook
      lamprey (*minóg strumieniowy*). Deep, well-oxygenated lakes harbour vendace and whitefish.


      Around 130 bird species nest here, including the white-tailed eagle, osprey, lesser spotted eagle,
      Eurasian eagle-owl, black stork, and common kingfisher, which finds a sanctuary along a stretch of the
      Drawa near the Barnimie trail. Migratory passage in spring and autumn brings common cranes, cuckoos,
      red-breasted flycatchers, and reed warblers.


      Mammals number around 50 species: red deer, roe deer, Eurasian beaver, wild boar, grey wolf, and several
      bats. The Eurasian otter is the park's symbol. Among invertebrates are uncommon molluscs such as
      *szklarka zielonawa* and the Roman snail.


      The seasonal rhythm is clear: May to September is the finest period, with spring bringing the forest
      floor into bloom. In winter, cross-country skiing is practised along the cleared walking trails.
    visit: >-
      There are five educational trails, three in the northwest and two in the south, marked with green spruce
      trees on a white square. The most comprehensive is Barnimie, allowing walks from three to seven
      kilometres: the first stage, three kilometres long, runs from the Dębina tract to the Barnimie campsite,
      and another four kilometres continue along the river to Zatom. Allow roughly four hours for the full
      route. Interpretive stops highlight geological history, erratic boulders, nature conservation along the
      Drawa, and the historical floating of timber down the river.


      Shorter walks include Drawnik (4 km, about 2 hours) and Głusko in the south (3 km, around 40 minutes);
      the Lake Ostrowieckie trail offers a 7 km and a 5 km variant. A geological route, «Petrografia terenów
      nad Drawą», covers 3.8 km in about 2 hours. For cyclists, the blue Pętla Barnimie circuit measures 33.16
      kilometres.


      By kayak, the first stage from the Drawnik slipway to Barnimie bridge spans 4.6 km. Kayakers form the
      park's largest visitor group.
    history: >-
      The river was once a timber highway: at Barnimie exhibits explain how logs were floated down the Drawa.
      Today the unifying theme is salmon recovery, supported continuously by the park since 1995.
    before: >-
      Marked hiking trails and educational paths are open year-round on foot from dawn to dusk. The river
      follows different rules: recreational paddling is only permitted from January to mid-March and from July
      to December, during daylight hours only, with a maximum of 750 people on the Drawa within the park at
      any one time. Check access conditions and park advisories before visiting.
  fr:
    intro: >-
      La Drawa ne montre pas un seul visage. Elle commence calmement, accélère, et dans le courant vif
      surgissent soudain des troncs d'arbres renversés ; le cours d'eau serpente entre prairies et forêts,
      sape de hautes berges sablonneuses et, plus loin, devient un filet nonchalant sur des fonds de sable
      tapissés d'herbiers aquatiques. Cette rivière, l'une des plus belles de Pologne, constitue l'axe central
      du parc national de la Drawa.


      Créé le 1er mai 1990, il couvre aujourd'hui 11 535,66 ha dans le nord-ouest du pays, sur la plaine de
      Drawsko au sein du complexe forestier de la Puszcza Drawska. La forêt recouvre 83 % de son territoire :
      avant tout des hêtraies et des chênaies à hêtres, ainsi que des pinèdes.
    landscape: >-
      La Drawa prend sa source à 150 m d'altitude dans la vallée des Cinq Lacs près de Połczyn-Zdrój et
      traverse deux régions : d'abord la région lacustre de Drawsko, au milieu de nombreux lacs, puis la
      plaine de Drawsko en se faufilant à travers les forêts de Poméranie. Dans le parc, la Drawa et son
      affluent la Płociczna offrent un courant soutenu sur fond de galets, de gravier ou de sable, avec une
      excellente oxygénation—conditions parfaites pour les poissons d'eau courante.


      Outre la rivière, le parc compte 20 lacs, dont le Czarnka, unique dans le pays, et l'Ostrowite, le plus
      vaste. Les secteurs les plus précieux, soit 1391,62 ha, bénéficient d'une protection intégrale. La forêt
      ne se contente pas d'être étendue : au bord de la Drawa, à Barnimie, s'élèvent des hêtres monumentaux
      aux troncs colonnaires, et au printemps le sous-bois s'épanouit dans les massifs de Dębina et de Grabowy
      Jar.


      La flore rassemble environ 900 espèces, avec des raretés telles que le cassandre caliculé, le marisque,
      le lis martagon ainsi que diverses orchidées et droséras.
    wildlife: >-
      Le poisson qui symbolise le mieux la rivière est le saumon : il naît et grandit dans des eaux pures,
      passe plusieurs années en mer et revient frayer. Jusqu'au milieu des années quatre-vingt, la Drawa et la
      Płociczna abritaient une souche propre, celle du saumon de la Drawa, à la croissance la plus rapide de
      Pologne : en 1962, on y a pêché un individu de 144 cm et 24 kg. À la fin de cette décennie, la
      population s'était quasiment éteinte. En 1995 a débuté le programme de restauration : plus de vingt
      mille smolts issus d'œufs de saumons de la Daugava en Lettonie ont été déversés, et les lâchers se
      poursuivent chaque année. Au bout de deux ans, on dénombrait déjà 32 grandes frayères.


      Aux côtés du saumon vivent l'ombre commun, trois formes de truite (de mer, de lac et de rivière) ainsi
      que la vimbe. Parmi les poissons rares figurent le chabot commun (*głowacz białopłetwy*), le vairon
      (*strzebla potokowa*), la spirlin (*piekielnica*), la bouvière (*różanka*), la loche de rivière (*koza*)
      et la lamproie de Planer (*minóg strumieniowy*). Les lacs profonds et bien oxygénés abritent des
      corégones.


      Environ 130 espèces d'oiseaux nichent sur place, dont le pygargue à queue blanche, le balbuzard pêcheur,
      l'aigle pomarin, le grand-duc d'Europe, la cigogne noire et le martin-pêcheur, qui trouve refuge sur un
      tronçon de la Drawa près du sentier de Barnimie. Les passages printaniers et automnaux amènent des
      migrateurs tels que la grue cendrée, le coucou, le gobe-mouche nain et la rousserolle.


      Les mammifères comptent environ 50 espèces : cerf, chevreuil, castor, sanglier, loup et plusieurs
      chauves-souris. La loutre d'Europe est l'emblème du parc. Parmi les invertébrés se trouvent des
      mollusques rares comme *szklarka zielonawa* et l'escargot de Bourgogne.


      Le calendrier est bien rythmé : mai à septembre est la période la plus agréable, le printemps voyant
      fleurir les sous-bois. En hiver, le ski de fond se pratique sur les pistes pédestres aménagées.
    visit: >-
      Cinq sentiers didactiques sont aménagés, trois au nord-ouest et deux au sud, balisés par des épicéas
      verts sur fond de carré blanc. Le plus complet est celui de Barnimie, qui propose des parcours de trois
      à sept kilomètres : la première étape, de trois kilomètres, relie le lieu-dit Dębina au camping de
      Barnimie, et quatre kilomètres supplémentaires longent la rivière jusqu'à Zatom. Comptez environ quatre
      heures pour l'itinéraire complet. On y découvre l'histoire géologique, les blocs erratiques, la
      protection de la nature le long de la Drawa et l'ancien flottage du bois.


      Plus courts sont le sentier de Drawnik (4 km, environ 2 heures) et celui de Głusko au sud (3 km, environ
      40 minutes) ; celui du lac Ostrowieckie propose une variante de 7 km et une de 5 km. Un sentier
      géologique, « Petrografia terenów nad Drawą », parcourt 3,8 km en 2 heures environ. À vélo, la boucle
      bleue Pętla Barnimie totalise 33,16 kilomètres.


      En canoë-kayak, le premier tronçon reliant l'embarcadère de Drawnik au pont de Barnimie fait 4,6 km. Les
      kayakistes représentent la catégorie de visiteurs la plus nombreuse du parc.
    history: >-
      La rivière servit longtemps au transport du bois : à Barnimie est retracée la manière dont la Drawa
      était utilisée pour le flottage des grumes. Aujourd'hui, la renaissance du saumon constitue le fil
      conducteur, soutenu sans relâche par le parc depuis 1995.
    before: >-
      Les sentiers balisés et les chemins didactiques sont accessibles à pied toute l'année, du lever au
      coucher du soleil. La rivière obéit à d'autres règles : la navigation de loisir à la rame n'est
      autorisée que de janvier à mi-mars et de juillet à décembre, exclusivement de jour, avec une jauge
      maximale de 750 personnes simultanément sur la Drawa dans l'enceinte du parc. Consultez les conditions
      d'accès et les avis du gestionnaire avant votre départ.
  de:
    intro: >-
      Die Drawa hat nicht nur ein einziges Wesen. Sie beginnt gemächlich, nimmt Fahrt auf, und in der
      schnellen Strömung tauchen plötzlich umgestürzte Bäume auf; das Flussbett mäandriert zwischen Wiesen und
      Wäldern, unterspült hohe Sandufer und wird weiter flussabwärts zu einem trägen Band über sandigen Böden
      mit dichten Unterwasserwiesen. Dieser Fluss, einer der schönsten Polens, ist das Rückgrat des
      Drawa-Nationalparks.


      Er wurde am 1. Mai 1990 gegründet und umfasst heute 11 535,66 ha im Nordwesten des Landes, in der
      Drawsko-Ebene und innerhalb des Waldkomplexes der Puszcza Drawska. Der Wald bedeckt 83 % seiner Fläche:
      vor allem Buchen- und Eichenmischwälder sowie Kiefernforste.
    landscape: >-
      Die Drawa entspringt auf 150 m Höhe im Tal der Fünf Seen nahe Połczyn-Zdrój und durchquert zwei
      Regionen: zuerst die Seenplatte von Drawsko inmitten zahlreicher Seen, danach die Drawsko-Ebene, sich
      durch die pommerschen Wälder schlängelnd. Im Park führen die Drawa und ihr Zufluss Płociczna eine
      lebhafte Strömung über Stein-, Kies- oder Sandgrund mit hohem Sauerstoffgehalt—ideale Bedingungen für
      strömungsliebende Fische.


      Neben dem Fluss birgt der Park 20 Seen, darunter den Czarnka-See, einzigartig im Land, und den
      Ostrowite-See als größten. Die wertvollsten Zonen, 1391,62 ha, stehen unter strengem Schutz. Der Wald
      ist nicht nur weitläufig: Entlang der Drawa bei Barnimie wachsen monumentale Säulenbuchen, und im
      Frühling erblüht der Unterwuchs in den Revieren Dębina und Grabowy Jar.


      Die Flora zählt rund 900 Arten mit Seltenheiten wie Torfgränke, Schneide, Türkenbund-Lilie sowie
      zahlreichen Orchideen und Sonnentau-Arten.
    wildlife: >-
      Der Fisch, der die Geschichte des Flusses am besten erzählt, ist der Lachs: Er schlüpft und wächst in
      sauberen Fließgewässern heran, verbringt Jahre im Meer und kehrt zum Laichen zurück. Bis Mitte der
      achtziger Jahre besaßen Drawa und Płociczna einen eigenen Stamm, den Drawa-Lachs mit dem schnellsten
      Wachstum in Polen: 1962 wurde ein Exemplar von 144 cm und 24 kg gefangen. Ende jenes Jahrzehnts erlosch
      der Bestand praktisch. 1995 begann das Wiederansiedlungsprogramm: Über zwanzigtausend Smolts aus
      lettischem Daugava-Lachslaich wurden ausgesetzt, und die Besatzmaßnahmen wiederholen sich alljährlich.
      Nach zwei Jahren wurden bereits 32 große Laichgruben gezählt.


      Mit dem Lachs leben Äsche, drei Forellenformen (Meer-, See- und Bachforelle) sowie die Zährte. Zu den
      seltenen Fischen gehören die Groppe (*głowacz białopłetwy*), Elritze (*strzebla potokowa*), Schneider
      (*piekielnica*), Bitterling (*różanka*), Schlammpeitzger bzw. Steinbeißer (*koza*) und das Bachneunauge
      (*minóg strumieniowy*). In den tiefen, sauerstoffreichen Seen kommen Maränen vor.


      Unter den Vögeln brüten etwa 130 Arten, darunter Seeadler, Fischadler, Schreiadler, Uhu, Schwarzstorch
      und Eisvogel, der an einem Abschnitt der Drawa nahe dem Barnimie-Pfad seinen Rückzugsort hat. Auf dem
      Zug im Frühjahr und Herbst rasten Kraniche, Kuckucke, Zwergschnäpper und Teichrohrsänger.


      Die Säugetiere zählen rund 50 Arten: Rothirsch, Reh, Biber, Wildschwein, Wolf und verschiedene
      Fledermäuse. Der Fischotter ist das Wappentier des Parks. Bei den Wirbellosen finden sich seltene
      Mollusken wie *szklarka zielonawa* und die Weinbergschnecke.


      Der Jahresablauf ist klar: Mai bis September ist die beste Reisezeit, und der Frühling bringt den
      blühenden Waldboden. Im Winter wird auf den Wanderrouten Skilanglauf betrieben.
    visit: >-
      Es gibt fünf Lehrpfade, drei im Nordwesten und zwei im Süden, markiert mit grünen Tannen auf weißem
      Quadrat. Am ergiebigsten ist Barnimie mit Routen von drei bis sieben Kilometern: Der erste Abschnitt von
      drei Kilometern führt von Dębina zum Zeltplatz Barnimie, weitere vier Kilometer folgen dem Fluss nach
      Zatom. Für die gesamte Strecke sind rund vier Stunden einzuplanen. Erläutert werden die geologische
      Entwicklung, Findlinge, der Naturschutz an der Drawa und die historische Flößerei.


      Kürzere Wege sind Drawnik (4 km, rund 2 Stunden) und Głusko im Süden (3 km, ca. 40 Minuten); der Pfad am
      Ostrowieckie-See bietet eine 7-km- und eine 5-km-Variante. Ein Geologielehrpfad, «Petrografia terenów
      nad Drawą», umfasst 3,8 km in etwa 2 Stunden. Mit dem Fahrrad misst die blaue Schleife Pętla Barnimie
      33,16 Kilometer.


      Im Kanu misst die erste Etappe von der Anlegestelle Drawnik bis zur Barnimie-Brücke 4,6 km. Kanuten
      stellen die größte Besuchergruppe des Parks.
    history: >-
      Der Fluss diente einst dem Holztransport: In Barnimie wird dargestellt, wie die Drawa zur Flößerei
      genutzt wurde. Heute bildet die Erholung des Lachses den roten Faden, die der Park seit 1995
      ununterbrochen fördert.
    before: >-
      Die markierten Wanderwege und Lehrpfade sind ganzjährig von Sonnenaufgang bis Sonnenuntergang zu Fuß
      begehbar. Für den Fluss gelten andere Bestimmungen: Freizeitsport mit Ruder- und Paddelbooten ist nur
      von Januar bis Mitte März sowie von Juli bis Dezember tagsüber gestattet, bei maximal 750 Personen
      gleichzeitig auf der Drawa im Parkgebiet. Informiere dich vor dem Aufbruch über aktuelle
      Zugangsbedingungen.
  it:
    intro: >-
      Il Drawa non ha un solo temperamento. Inizia placido, accelera e nella corrente rapida compaiono
      all'improvviso tronchi caduti; l'alveo serpeggia tra prati e boschi, scava alte sponde sabbiose e, più
      avanti, diventa un filo pigro su fondali di sabbia coperti da praterie sommerse. Questo fiume, uno dei
      più splendidi della Polonia, è l'asse portante del Parco nazionale della Drawa.


      È stato istituito il 1° maggio 1990 e oggi copre 11 535,66 ha nel nord-ovest del paese, nella pianura di
      Drawsko e nel complesso della Puszcza Drawska. Il bosco riveste l'83 % della sua superficie: soprattutto
      faggete e querceti misti a faggio, oltre a pinete.
    landscape: >-
      Il Drawa nasce a 150 m di quota nella Valle dei Cinque Laghi, vicino a Połczyn-Zdrój, e attraversa due
      regioni: prima il distretto lacustre di Drawsko, tra numerosi bacini, e in seguito la pianura di
      Drawsko, serpeggiando fra le foreste della Pomerania. Nel parco, il Drawa e il suo affluente Płociczna
      mantengono una corrente vivace su fondali di ciottoli, ghiaia o sabbia con eccellente
      ossigenazione—condizioni ideali per i pesci reofili.


      Oltre al corso d'acqua, il parco custodisce 20 laghi, tra cui il Czarnka, singolare in Polonia, e
      l'Ostrowite, il maggiore. Le aree più preziose, per 1391,62 ha, godono di tutela integrale. La foresta
      non è soltanto estesa: lungo il Drawa, a Barnimie, crescono faggi monumentali dal fusto colonnare, e in
      primavera fiorisce il sottobosco delle località Dębina e Grabowy Jar.


      La flora raccoglie circa 900 specie, con rarità come il falso mirto di palude, il falasco, il giglio
      martagone e numerose orchidee e drosere.
    wildlife: >-
      Il pesce che meglio racconta il fiume è il salmone: nasce e cresce in acque limpide, trascorre anni in
      mare e torna a riprodursi. Fino a metà degli anni ottanta, il Drawa e il Płociczna possedevano una
      propria popolazione, il salmone del Drawa, il più rapido nella crescita in Polonia: nel 1962 ne fu
      pescato uno di 144 cm e 24 kg. Verso la fine di quel decennio la popolazione era pressoché estinta. Nel
      1995 è partito il programma di ripristino: sono stati immessi oltre ventimila smolt allevati da uova di
      salmone del fiume Daugava in Lettonia, e i ripopolamenti si ripetono ogni anno. Dopo due anni si
      contavano già 32 grandi letti di frega.


      Insieme al salmone vivono il temolo, tre forme di trota (di mare, di lago e di torrente) e la vimba. Tra
      i pesci rari figurano lo scazzone (*głowacz białopłetwy*), la sanguinerola (*strzebla potokowa*), lo
      spirlizio (*piekielnica*), il rodeo amaro (*różanka*), il cobite (*koza*) e la lampreda di ruscello
      (*minóg strumieniowy*). Nei laghi profondi e ben ossigenati vivono i coregoni.


      Tra i volatili nidificano circa 130 specie, tra cui l'aquila di mare, il falco pescatore, l'aquila
      anatraia minore, il gufo reale, la cicogna nera e il martin pescatore, che trova rifugio in un tratto
      del Drawa vicino al sentiero di Barnimie. Durante i passi di primavera e autunno sostano migratori come
      la gru, il cuculo, il pigliamosche pettirosso e il cannareccione.


      I mammiferi assommano a circa 50 specie: cervo, capriolo, castoro, cinghiale, lupo e diversi chirotteri.
      La lontra europea è il simbolo del parco. Tra gli invertebrati spiccano molluschi rari come *szklarka
      zielonawa* e la chiocciola.


      La scansione stagionale è netta: da maggio a settembre è il periodo più favorevole, con la primavera che
      regala il sottobosco in fiore. In inverno si pratica lo sci di fondo lungo gli itinerari pedonali
      tracciati.
    visit: >-
      Vi sono cinque sentieri didattici, tre a nord-ovest e due a sud, contrassegnati da abeti verdi su
      riquadro bianco. Il più esauriente è Barnimie, con itinerari da tre a sette chilometri: la prima tappa,
      di tre chilometri, conduce dalla località Dębina al campeggio di Barnimie, mentre altri quattro
      chilometri proseguono lungo il fiume fino a Zatom. Si calcolano circa quattro ore per il tragitto
      completo. Lungo il percorso si illustrano la storia geologica, i massi erratici, la protezione della
      natura lungo il Drawa e l'antica fluitazione del legname.


      Più brevi sono Drawnik (4 km e circa 2 ore) e Głusko a sud (3 km e circa 40 minuti); il percorso del
      lago Ostrowieckie offre una variante di 7 km e una di 5 km. Un sentiero geologico, «Petrografia terenów
      nad Drawą», si sviluppa per 3,8 km in circa 2 ore. In bicicletta, l'anello blu Pętla Barnimie misura
      33,16 chilometri.


      In canoa, il primo tratto dall'imbarcadero di Drawnik al ponte di Barnimie è lungo 4,6 km. I canoisti
      compongono il contingente di visitatori più cospicuo del parco.
    history: >-
      Il fiume fu via di trasporto per il legname: a Barnimie si mostra come il Drawa venisse impiegato per la
      fluitazione dei tronchi. Oggi il filo conduttore è il recupero del salmone, garantito dal parco
      ininterrottamente dal 1995.
    before: >-
      I sentieri segnalati e i percorsi didattici sono aperti tutto l'anno a piedi dall'alba al tramonto. Il
      fiume risponde a regole distinte: la navigazione da diporto a remi è consentita solo da gennaio a metà
      marzo e da luglio a dicembre, unicamente di giorno, con una presenza simultanea massima di 750 persone
      sul Drawa all'interno del parco. Informati sulle condizioni di fruizione e sugli avvisi dell'ente prima
      di partire.
  pt:
    intro: >-
      O Drawa não tem um único temperamento. Começa plácido, acelera, e na corrente rápida surgem subitamente
      troncos caídos; o leito serpenteia entre prados e florestas, solapa arribas arenosas e, mais além,
      torna-se um fio preguiçoso sobre fundos de areia cobertos de pradarias subaquáticas. Este rio, um dos
      mais belos da Polónia, é o coração do Parque Nacional da Drawa.


      Criado a 1 de maio de 1990, ocupa hoje 11 535,66 ha no noroeste do país, na planície de Drawsko e dentro
      do complexo da Puszcza Drawska. A floresta cobre 83 % da sua área: sobretudo faiais e carvalhais
      misturados com faia, além de pinhais.
    landscape: >-
      O Drawa nasce a 150 m de altitude no Vale dos Cinco Lagos, perto de Połczyn-Zdrój, e atravessa duas
      regiões: primeiro o distrito lacustre de Drawsko, por entre numerosos lagos, e depois a planície de
      Drawsko, serpentina através dos bosques da Pomerânia. Dentro do parque, o Drawa e o seu afluente
      Płociczna mantêm uma corrente vigorosa sobre cascalho, saibro ou areia com excelente
      oxigenação—condições de eleição para os peixes de águas correntes.


      Além do rio, o parque alberga 20 lagos, entre eles o Czarnka, ímpar no país, e o Ostrowite, o maior. As
      zonas mais valiosas, 1391,62 ha, gozam de proteção estrita. A floresta não é apenas ampla: junto ao
      Drawa, em Barnimie, erguem-se faias monumentais de porte colunar, e na primavera floresce o sub-bosque
      nos sítios de Dębina e Grabowy Jar.


      A flora reúne cerca de 900 espécies, com raridades como a cássia-dos-pântanos, a
      cortadeira-das-marismas, o lírio-martagão e numerosas orquídeas e dróseras.
    wildlife: >-
      O peixe que melhor retrata o rio é o salmão: nasce e cresce em rios limpos, passa anos no mar e regressa
      para desovar. Até meados dos anos oitenta, o Drawa e o Płociczna conservavam uma linhagem própria, a do
      salmão da Drawa, a de crescimento mais rápido da Polónia: em 1962 foi capturado um exemplar com 144 cm e
      24 kg. No final dessa década a população praticamente colapsou. Em 1995 iniciou-se o programa de
      recuperação: foram libertados mais de vinte mil esguichos criados com ovas de salmão do rio Daugava, na
      Letónia, e os repovoamentos repetem-se anualmente. Passados dois anos já se contabilizavam 32 grandes
      ninhos de desova.


      Com o salmão convivem o tímalo, três formas de truta (marisca, lacustre e de rio) e a bimba. Entre os
      peixes raros contam-se o peixe-escorpião-de-água-doce (*głowacz białopłetwy*), a fula (*strzebla
      potokowa*), a alburnina (*piekielnica*), o peixe-amargo (*różanka*), a cobiça (*koza*) e a
      lampreia-de-riacho (*minóg strumieniowy*). Nos lagos profundos e bem oxigenados habitam corégonos.


      Entre as aves, nidificam perto de 130 espécies, incluindo a águia-rabalva, a águia-pesqueira, a
      águia-pomarina, o bufo-real, a cegonha-preta e o guarda-rios-comum, que encontra refúgio num troço do
      Drawa junto ao trilho de Barnimie. Nas passagens de primavera e outono chegam aves migradoras como o
      grou-comum, o cuco, o papa-moscas-pequeno e o rouxinol-pequeno-dos-canaviais.


      Os mamíferos totalizam cerca de 50 espécies: veado, corço, castor-europeu, javali, lobo-ibérico e vários
      morcegos. A lontra-europeia é o símbolo do parque. Nos invertebrados salientam-se moluscos invulgares
      como a *szklarka zielonawa* e o caracol-romano.


      O ciclo das estações é nítido: maio a setembro é o período mais convidativo, trazendo a primavera a
      floração do sub-bosque. No inverno pratica-se esqui de fundo nos trilhos pedestres desimpedidos.
    visit: >-
      Existem cinco percursos interpretativos, três a noroeste e dois a sul, assinalados com abetos verdes num
      quadrado branco. O mais completo é Barnimie, com etapas de três a sete quilómetros: o primeiro troço, de
      três quilómetros, vai de Dębina ao parque de campismo de Barnimie, seguindo outros quatro ao longo do
      rio até Zatom. Estima-se cerca de quatro horas para a caminhada integral. Ali elucidam-se a evolução
      geológica, os blocos erráticos, a conservação natural junto ao Drawa e a antiga flutuação de madeira.


      Mais curtos são Drawnik (4 km e cerca de 2 horas) e Głusko a sul (3 km e cerca de 40 minutos); o do lago
      Ostrowieckie tem uma variante de 7 km e outra de 5 km. Um itinerário geológico, «Petrografia terenów nad
      Drawą», perfaz 3,8 km em cerca de 2 horas. Em bicicleta, o circuito azul Pętla Barnimie totaliza 33,16
      quilómetros.


      De canoa, o primeiro troço do cais de Drawnik à ponte de Barnimie tem 4,6 km. Os canoístas formam o
      contingente de visitantes mais numeroso do parque.
    history: >-
      O rio foi autoestrada fluvial da madeira: em Barnimie explica-se de que forma o Drawa transportava toros
      de madeira em flutuação. Hoje o fio condutor é a recuperação do salmão, sustentada pelo parque desde
      1995.
    before: >-
      Os trilhos sinalizados e caminhos didáticos estão abertos a pé o ano inteiro, do nascer ao pôr do sol. O
      rio obedece a outras normas: a navegação recreativa a remos só é autorizada de janeiro a meados de março
      e de julho a dezembro, apenas durante o dia, com uma lotação máxima de 750 pessoas em simultâneo no
      Drawa dentro dos limites do parque. Confirma os avisos e regulamentos do parque antes de ires.
