  es: El 'Meandro perfecto' de Queuille y cañones graníticos profundos en el Macizo Central.
  en: The ‘perfect meander’ of Queuille and deep granitic canyons carved through the Massif Central.
  fr: Le « Méandre parfait » de Queuille et de profonds canyons granitiques entaillant le Massif central.
  de: Die „perfekte Flussschleife“ von Queuille und tiefe Granitschluchten im Massif Central.
  it: Il ‘Meandro perfetto’ di Queuille e profondi canyon granitici intagliati nel Massiccio Centrale.
  pt: O ‘Meandro perfeito’ de Queuille e desfiladeiros graníticos profundos no Maciço Central.
unico:
  es: >-
    Una garganta que empieza mansa en Ébreuil y se cierra sobre el río, con un castillo en el borde y un
    halcón peregrino en las paredes.
  en: >-
    A gorge starting placidly at Ébreuil before closing in tight on the river, watched over by a cliffside
    castle and nesting peregrines.
  fr: >-
    Une gorge débutant paisiblement à Ébreuil avant de se resserrer sur la rivière, dominée par un château
    perché et le vol du faucon pèlerin.
  de: >-
    Eine Schlucht, die sanft bei Ébreuil beginnt und sich eng um den Fluss schließt, bewacht von einer
    Felsenburg und nistenden Wanderfalken.
  it: >-
    Una forra che inizia placida a Ébreuil e si serra sulla corrente, dominata da un castello di roccia e dal
    falco pellegrino.
  pt: >-
    Uma garganta que começa plácida em Ébreuil e se estreita sobre a corrente, coroada por um castelo
    altaneiro e o falcão-peregrino.
observaciones:
  es: >-
    Las zonas acondicionadas a lo largo de la ruta facilitan descubrir la fauna y la flora de las gargantas.
    La carretera es sinuosa, de curvas cerradas, así que conduce con calma. Mayo a octubre es la época más
    cómoda; en la zona de Queuille es donde hay más gente.
texto:
  es:
    intro: >-
      En Ébreuil, el Sioule va tranquilo, casi manso, a los pies de una pequeña ciudad con carácter. Basta
      seguir la carretera hacia Chouvigny para que el paisaje se cierre: el río se estrecha, la roca se vuelve
      abrupta y el valle se hunde entre paredes verdes. Son las gargantas del Sioule, un tajo del Macizo
      Central que continúa, ya en el Puy-de-Dôme, hasta el famoso meandro de Queuille.
    landscape: >-
      El Sioule nace a 1093 m, cerca del lago de Servières, en los montes Dore. Es un río del norte del Macizo
      Central, de unos 164 km, afluente por la izquierda del Allier, y en su curso alto ha excavado una
      garganta profunda. Se puede remontar hasta su nacimiento; aguas abajo, las gargantas se prolongan hasta
      Queuille cuando el río pasa de Allier al Puy-de-Dôme.


      Hay dos meandros que merecen una parada. El de Queuille se ve desde el mirador del Paradis, junto al
      pueblo, y se llena de agua gracias a la presa de Queuille. La península de Saint-Cirgues es otro
      meandro, menos espectacular que el de Queuille pero interesante. En Chouvigny, el río corre entre
      paredes rocosas abruptas, y desde lo alto el castillo domina las gargantas desde hace más de ocho
      siglos.
    wildlife: >-
      En las paredes anidan el [halcón peregrino](/especie/falco_peregrinus/) y el [búho
      real](/especie/bubo_bubo/), y con un poco de suerte los verás volar sobre el río. Más abajo, la [trucha
      común](/especie/salmo_trutta/) domina entre Châteauneuf-les-Bains y Ébreuil, donde supone la mitad de
      los peces.


      Han vuelto especies que habían desaparecido: la [nutria europea](/especie/lutra_lutra/), el [castor
      europeo](/especie/castor_fiber/) y el salmón. Algunas presas, como las de Pontgibaud y Queuille, tienen
      pasos para nutrias. Sobre las gargantas, las landas de Péraclos, de 21 hectáreas, reúnen al alcaudón
      dorsirrojo y al chotacabras europeo. La temporada va de mayo a octubre.
    visit: >-
      La mejor manera de entenderlas es conducir: la carretera de las gargantas va de Ébreuil a Menat con
      paradas en cada panorámica y pasa por el único túnel del departamento de Allier.


      A pie, empieza por el Chemin des Murailles, un circuito moderado de dos kilómetros y medio que sale de
      Chouvigny y se hace en unos cincuenta minutos. Sube por una escalera junto al ayuntamiento hasta una
      cruz con vistas a las gargantas y al castillo. Más largo es Les Hauts de Chouvigny: nueve kilómetros de
      dificultad media, unas tres horas, con una de las vistas más emblemáticas del valle, el inicio de las
      gargantas bajo el castillo almenado. Hay una variante de 3,5 km. En la zona también se propone recorrer
      las gargantas en canoa.
    history: >-
      El castillo de Chouvigny, sobre el río, es el emblema del valle. La presa de Queuille, construida entre
      1901 y 1904, y la de Fades producen electricidad. Las gargantas están clasificadas como ZNIEFF y toda la
      cuenca del Sioule forma parte de Natura 2000. Las landas de Péraclos son espacio natural sensible desde
      2012.
    before: >-
      Las zonas acondicionadas a lo largo de la ruta facilitan descubrir la fauna y la flora de las gargantas.
      La carretera es sinuosa, de curvas cerradas, así que conduce con calma. Mayo a octubre es la época más
      cómoda; en la zona de Queuille es donde hay más gente.
    around: >-
      A veintinueve kilómetros está el [Parque Natural Regional de Millevaches en
      Limousin](/lugar/parc-naturel-regional-de-millevaches-en-limousin/). Lejos de allí, el [Parque Nacional
      de Słowiński](/lugar/slowinski-park-narodowy/) comparte con las gargantas la nutria europea y el milano
      real.
  en:
    intro: >-
      At Ébreuil, the Sioule flows gently at the foot of an atmospheric historic town. Following the scenic
      road towards Chouvigny, the scenery closes in rapidly: the river narrows, dark granite crags rise
      abruptly, and the valley plunges between verdant canyon walls. These are the Sioule Gorges, a deep chasm
      sliced through the Massif Central continuing into the Puy-de-Dôme as far as the celebrated Queuille
      meander.
    landscape: >-
      The Sioule rises at 1093 m near Lake Servières in the Monts Dore. A major left-bank tributary of the
      Allier stretching roughly 164 km through the northern Massif Central, it has carved an impressive canyon
      along its upper reach. Hikers can trace its course from the headwaters down through deep gorges past
      Queuille, crossing from the Allier department into Puy-de-Dôme.


      Two river loops deserve special attention. The famous Queuille meander unfolds from the Paradis
      belvedere beside the village, filled with emerald water backed by the Queuille reservoir. The
      Saint-Cirgues peninsula forms another graceful, quieter horseshoe bend. At Chouvigny, the river rushes
      through vertical granite jaws beneath an ancient feudal castle that has watched over the defile for more
      than eight centuries.
    wildlife: >-
      The crags provide secure nesting eyries for the [peregrine falcon](/especie/falco_peregrinus/) and the
      [Eurasian eagle-owl](/especie/bubo_bubo/), often observed wheeling above the water. Down in the current,
      native [brown trout](/especie/salmo_trutta/) thrive between Châteauneuf-les-Bains and Ébreuil,
      comprising nearly half of all fish biomass.


      Once-vanished fauna has staged a remarkable recovery: the [Eurasian otter](/especie/lutra_lutra/), the
      [Eurasian beaver](/especie/castor_fiber/), and Atlantic salmon have successfully recolonized the basin.
      Fish and otter bypass channels have been installed around several dams, including Pontgibaud and
      Queuille. High above the rim, the 21-hectare Péraclos heaths support red-backed shrikes and European
      nightjars. The optimal wildlife season spans May to October.
    visit: >-
      The most rewarding overview comes from driving the winding gorge road from Ébreuil to Menat, pulling off
      at panoramic turnouts and passing through the only road tunnel in the Allier department.


      On foot, begin with the Chemin des Murailles: a pleasant loop of two and a half kilometres departing
      Chouvigny, taking roughly fifty minutes. It ascends stone steps beside the town hall to an iron cross
      overlooking the castle and gorge. For a longer trek, Les Hauts de Chouvigny offers a moderate
      nine-kilometre route of roughly three hours, unveiling classic vistas of the canyon mouth beneath the
      crenellated fortress, with a shorter variant of 3.5 km. Canoe descents are also widely available in
      season.
    history: >-
      Perched upon a granite outcrop, the Château de Chouvigny serves as the historical emblem of the valley.
      Hydroelectric plants at Queuille, constructed between 1901 and 1904, and at Fades supply clean
      electricity. The gorges are classified as a ZNIEFF natural area and the entire river catchment is
      protected under Natura 2000. The Péraclos heaths have been designated a Sensitive Natural Area since
      2012.
    before: >-
      Lookout points and interpretive turnouts along the route make it easy to discover local wildlife and
      geology. The road is very winding with blind bends, so drive carefully. May to October is the most
      pleasant window; peak crowds gather around the Queuille viewpoint.
    around: >-
      Twenty-nine kilometres away lies the [Millevaches in Limousin Regional Natural
      Park](/lugar/parc-naturel-regional-de-millevaches-en-limousin/). Further afield, [Słowiński National
      Park](/lugar/slowinski-park-narodowy/) also harbors Eurasian otters and red kites across pristine
      waters.
  fr:
    intro: >-
      À Ébreuil, la Sioule s’écoule calmement, presque indolente, au pied d’une cité de caractère. Il suffit
      d’emprunter la route menant à Chouvigny pour que le décor se resserre : la rivière rétrécit, le granite
      devient abrupt et la vallée s’enfonce entre des parois boisées. Ce sont les gorges de la Sioule,
      entaille remarquable du Massif central qui se prolonge, côté Puy-de-Dôme, jusqu’au célèbre méandre de
      Queuille.
    landscape: >-
      La Sioule prend sa source à 1093 m près du lac de Servières, dans les monts Dore. Cours d’eau majeur du
      nord du Massif central long d’environ 164 km, affluent rive gauche de l’Allier, elle a creusé une
      profonde gorge le long de son cours supérieur. Le parcours s’explore depuis sa haute vallée jusqu’à
      Queuille, lorsque la rivière passe de l’Allier au Puy-de-Dôme.


      Deux boucles méritent un arrêt privilégié. Le méandre de Queuille s’admire depuis le belvédère du
      Paradis, près du village, formant un fer à cheval baigné par la retenue du barrage éponyme. La
      presqu’île de Saint-Cirgues dessine un autre méandre sauvage remarquable. À Chouvigny, la rivière
      franchit un défilé de rochers vertigineux surplombé par un château médiéval qui veille sur les gorges
      depuis plus de huit siècles.
    wildlife: >-
      Les falaises abritent la nidification du [faucon pèlerin](/especie/falco_peregrinus/) et du [hibou
      grand-duc](/especie/bubo_bubo/), que l’on observe parfois survoler les flots. En aval, la [truite
      fario](/especie/salmo_trutta/) prospère entre Châteauneuf-les-Bains et Ébreuil, où elle représente près
      de la moitié du peuplement piscicole.


      Plusieurs espèces autrefois disparues ont recolonisé la rivière : la [loutre
      d’Europe](/especie/lutra_lutra/), le [castor d’Europe](/especie/castor_fiber/) et le saumon atlantique.
      Des passes à loutres équipent d’ailleurs les barrages de Pontgibaud et de Queuille. Surplombant les
      gorges, les landes de Péraclos, sur 21 hectares, accueillent la pie-grièche écorcheur et l’engoulevent
      d’Europe. La période propice va de mai à octobre.
    visit: >-
      La meilleure manière de saisir l’ampleur du site consiste à parcourir la route touristique des gorges
      d’Ébreuil à Menat, jalonnée de belvédères et traversant le seul tunnel routier du département de
      l’Allier.


      À pied, le chemin des Murailles propose une boucle agréable de deux kilomètres et demi au départ de
      Chouvigny, bouclée en cinquante minutes environ. Un escalier près de la mairie monte vers une croix
      ouvrant sur le château et le défilé. Plus ambitieux, le circuit des Hauts de Chouvigny offre neuf
      kilomètres d’effort moyen en trois heures environ, dévoilant un panorama emblématique sur l’entrée des
      gorges sous la forteresse crénelée, avec une variante courte de 3,5 km. Les descentes en canoë sont très
      prisées en été.
    history: >-
      Le château de Chouvigny, juché sur son éperon, demeure l’emblème du défilé. Le barrage de Queuille,
      édifié entre 1901 et 1904, et celui des Fades produisent de l’hydroélectricité. Les gorges sont classées
      ZNIEFF et l’ensemble du bassin est intégré au réseau Natura 2000. Les landes de Péraclos bénéficient du
      statut d’espace naturel sensible depuis 2012.
    before: >-
      Des aires de stationnement jalonnent la route pour contempler le canyon en toute sécurité. La chaussée
      est sinueuse et étroite : roulez avec prudence. La période de mai à octobre est idéale ; le secteur de
      Queuille concentre l’essentiel des visiteurs.
    around: >-
      À vingt-neuf kilomètres se trouve le [parc naturel régional de Millevaches en
      Limousin](/lugar/parc-naturel-regional-de-millevaches-en-limousin/). Plus au nord, le [parc national de
      Słowiński](/lugar/slowinski-park-narodowy/) partage la présence de la loutre d’Europe et du milan royal
      au bord des eaux.
  de:
    intro: >-
      Bei Ébreuil fließt die Sioule ruhig und gelassen zu Füßen eines geschichtsträchtigen Städtchens. Folgt
      man der Straße flussaufwärts nach Chouvigny, wandelt sich das Bild dramatisch: Das Flussbett verengt
      sich, dunkle Granitwände steigen steil empor und das Tal gräbt sich zwischen waldreichen Flanken ein. Es
      sind die Schluchten der Sioule, ein markanter Einschnitt im Massif Central, der sich im Département
      Puy-de-Dôme bis zur berühmten Flussschleife von Queuille fortsetzt.
    landscape: >-
      Die Sioule entspringt auf 1093 m nahe dem Lac de Servières in den Monts Dore. Als rund 164 km langer
      linker Nebenfluss des Allier entwässert sie das nördliche Zentralmassiv und hat tiefen Granitfels
      durchschnitten. Die Schluchtenstrecke reicht vom Quellgebiet talwärts bis Queuille, wo der Fluss die
      Grenze vom Département Allier nach Puy-de-Dôme überquert.


      Zwei Flussmäander lohnen den Halt. Die weltberühmte Flussschleife von Queuille überblickt man vom
      Aussichtspunkt Paradis nahe dem Dorf, gespeist durch das Wasser der Queuille-Talsperre. Die Halbinsel
      Saint-Cirgues bildet eine weitere, urwüchsige Schleife. Bei Chouvigny braust der Fluss durch eine enge
      Felsklamm, überragt von einer Höhenburg, die seit über acht Jahrhunderten über das Tal wacht.
    wildlife: >-
      An den Steilwänden horsten [Wanderfalke](/especie/falco_peregrinus/) und [Uhu](/especie/bubo_bubo/), die
      regelmäßig über dem Flussbett kreisen. Im klaren Wasser dominiert die
      [Bachforelle](/especie/salmo_trutta/) zwischen Châteauneuf-les-Bains und Ébreuil, wo sie fast die Hälfte
      des Fischbestands stellt.


      Einst verschwundene Arten sind zurückgekehrt: [Eurasischer Fischotter](/especie/lutra_lutra/),
      [Europäischer Biber](/especie/castor_fiber/) und Lachs besiedeln wieder das Gewässersystem. Die Wehre
      von Pontgibaud und Queuille wurden mit Fischotterpassagen versehen. Oberhalb der Schlucht bieten die 21
      Hektar großen Heiden von Péraclos Lebensraum für Neuntöter und Ziegenmelker. Beste Beobachtungszeit ist
      Mai bis Oktober.
    visit: >-
      Am besten erschließt sich das Tal auf der Panoramastraße von Ébreuil nach Menat mit Halt an
      Aussichtsbuchten und Passage des einzigen Straßentunnels im Département Allier.


      Zu Fuß empfiehlt sich der Chemin des Murailles: ein Rundweg von zweieinhalb Kilometern ab Chouvigny, der
      in rund fünfzig Minuten zu bewältigen ist. Eine Treppe am Rathaus führt hinauf zu einem Aussichtskreuz
      mit Blick auf Schloss und Schlucht. Anspruchsvoller ist die Tour Les Hauts de Chouvigny: neun Kilometer
      von mittlerer Schwierigkeit in etwa drei Stunden mit Ausblicken auf das Burgtor, ergänzt durch eine 3,5
      km lange Variante. Im Sommer werden beliebte Kanutouren angeboten.
    history: >-
      Das Château de Chouvigny thront als trutziges Wahrzeichen auf einem Felssporn. Die Talsperre von
      Queuille, errichtet zwischen 1901 und 1904, sowie die Barrage des Fades erzeugen Strom. Die Schluchten
      sind als ZNIEFF-Naturraum geschützt und das gesamte Einzugsgebiet gehört zu Natura 2000. Die Heiden von
      Péraclos sind seit 2012 als sensibles Naturgebiet ausgewiesen.
    before: >-
      Aussichtspunkte entlang der Fahrstraße ermöglichen ein sicheres Naturerlebnis. Die Straße ist eng und
      kurvig: Fahre vorausschauend. Mai bis Oktober ist die angenehmste Reisezeit; am Aussichtspunkt Queuille
      herrscht der stärkste Andrang.
    around: >-
      Neunundzwanzig Kilometer entfernt liegt der [Regionale Naturpark Millevaches en
      Limousin](/lugar/parc-naturel-regional-de-millevaches-en-limousin/). Weit entfernt schützt auch der
      [Slowinzische Nationalpark](/lugar/slowinski-park-narodowy/) Fischotter und Rotmilan an naturnahen
      Gewässern.
  it:
    intro: >-
      A Ébreuil la Sioule scorre tranquilla, quasi pigra, ai piedi di un grazioso borgo storico. Basta
      imboccare la strada verso Chouvigny perché la scena muti repentinamente: l’alveo si stringe, il granito
      si fa verticale e la vallata sprofonda tra pendici selvose. Sono le gole della Sioule, una spettacolare
      spaccatura del Massiccio Centrale che prosegue nel Puy-de-Dôme fino al celebre meandro di Queuille.
    landscape: >-
      La Sioule sorge a 1093 m presso il lago di Servières, nei monti Dore. Principale tributario di sinistra
      dell’Allier, lungo circa 164 km, ha inciso una profonda forra nel basamento cristallino. Il percorso
      fluviale si segue dalla sorgente fino a Queuille, punto in cui il fiume varca il confine tra l’Allier e
      il Puy-de-Dôme.


      Due anse meritano una sosta. Quella celebre di Queuille si contempla dal belvedere del Paradis, presso
      il borgo, disegnando un anello perfetto alimentato dall’invaso della diga. La penisola di Saint-Cirgues
      traccia un altro meandro solitario. A Chouvigny le acque precipitano tra pareti a picco sovrastate da un
      castello medievale che presidia la gola da oltre otto secoli.
    wildlife: >-
      Le scogliere offrono rifugio al [falco pellegrino](/especie/falco_peregrinus/) e al [gufo
      reale](/especie/bubo_bubo/), visibili spesso in volo sopra il fiume. Nella corrente la [trota
      atlantica](/especie/salmo_trutta/) prospera tra Châteauneuf-les-Bains ed Ébreuil, dove costituisce quasi
      la metà della fauna ittica.


      Sono riapparse specie che erano scomparse per decenni: la [lontra europea](/especie/lutra_lutra/), il
      [castoro europeo](/especie/castor_fiber/) e il salmone atlantico. Diverse dighe, tra cui Pontgibaud e
      Queuille, sono state dotate di rampe per lontre. Sull’orlo delle gole, le brughiere di Péraclos, estese
      su 21 ettari, ospitano l’averla piccola e il succiacapre. La stagione ideale va da maggio a ottobre.
    visit: >-
      Il modo migliore per ammirare il canyon consiste nel percorrere la strada panoramica da Ébreuil a Menat,
      sostando ai belvedere e attraversando l’unico tunnel stradale del dipartimento dell’Allier.


      A piedi, il Chemin des Murailles offre un anello di due chilometri e mezzo con partenza da Chouvigny,
      della durata di circa cinquanta minuti. Una scalinata presso il municipio risale verso una croce
      panoramica con vista sul castello e sul fondo valle. Più esteso è l’itinerario Les Hauts de Chouvigny:
      nove chilometri di media difficoltà in circa tre ore con scorci magnifici sulla rocca merlata, con una
      variante di 3,5 km. In estate si praticano popolari discese in canoa.
    history: >-
      Il castello di Chouvigny, abbarbicato su uno sperone roccioso, è il simbolo feudale della forra. La diga
      idroelettrica di Queuille, costruita tra il 1901 e il 1904, e quella di Fades garantiscono energia
      pulita. Le gole sono tutelate come ZNIEFF e l’intero bacino fa parte di Natura 2000. Le brughiere di
      Péraclos sono classificate spazio naturale sensibile dal 2012.
    before: >-
      Le piazzole di sosta lungo la strada permettono di osservare la gola in sicurezza. La carreggiata è
      tortuosa: guida con prudenza. Da maggio a ottobre il clima è ideale; l’afflusso maggiore si concentra a
      Queuille.
    around: >-
      A ventinove chilometri si estende il [Parco Naturale Regionale di Millevaches in
      Limosino](/lugar/parc-naturel-regional-de-millevaches-en-limousin/). Più a nord, il [Parco Nazionale di
      Słowiński](/lugar/slowinski-park-narodowy/) condivide con la Sioule lontre europee e nibbi reali lungo
      acque protette.
  pt:
    intro: >-
      Em Ébreuil, o Sioule corre suave e sereno aos pés de uma vila senhorial cheia de caráter. Ao tomar a
      estrada rumo a Chouvigny, o relevo fecha-se rapidamente: o rio aperta-se, os blocos de granito tornam-se
      alcantilados e o vale afunda-se entre encostas verdes. São as gargantas do Sioule, uma fenda
      impressionante no Maciço Central que prossegue, já no Puy-de-Dôme, até ao afamado meandro de Queuille.
    landscape: >-
      O Sioule nasce a 1093 m junto ao lago de Servières, nos montes Dore. Afluente da margem esquerda do
      Allier com cerca de 164 km no norte do Maciço Central, cavou um desfiladeiro profundo no seu curso
      superior. O vale pode ser acompanhado desde a nascente até Queuille, onde o rio transita do departamento
      de Allier para o de Puy-de-Dôme.


      Há dois meandros de paragem obrigatória. O famoso meandro de Queuille contempla-se do miradouro do
      Paradis, junto à aldeia, formando um laço perfeito represado pela albufeira. A península de
      Saint-Cirgues desenha outro meandro selvagem. Em Chouvigny, as águas precipitam-se por uma garganta
      escarpada dominada por um castelo medieval que vela pelo desfiladeiro há mais de oito séculos.
    wildlife: >-
      Nas escarpas nidificam o [falcão-peregrino](/especie/falco_peregrinus/) e o
      [bufo-real](/especie/bubo_bubo/), avistados a planar sobre as águas. Mais abaixo, a
      [truta-fario](/especie/salmo_trutta/) abunda entre Châteauneuf-les-Bains e Ébreuil, perfazendo metade da
      população piscícola.


      Regressaram espécies há muito desaparecidas: a [lontra-europeia](/especie/lutra_lutra/), o
      [castor-europeu](/especie/castor_fiber/) e o salmão-do-atlântico. Várias barragens, como as de
      Pontgibaud e Queuille, foram apetrechadas com passagens para lontras. Acima do desfiladeiro, as
      charnecas de Péraclos, com 21 hectares, acolhem o picanço-de-dorso-ruivo e o noitibó-da-europa. A melhor
      época vai de maio a outubro.
    visit: >-
      A melhor forma de apreciar a garganta é conduzir pela estrada panorâmica de Ébreuil a Menat, parando nos
      miradouros e atravessando o único túnel rodoviário do departamento de Allier.


      A pé, o Chemin des Murailles oferece um circuito de dois quilómetros e meio a partir de Chouvigny, feito
      em cinquenta minutos. Uma escadaria junto à câmara sobe até uma cruz com vista sobre o castelo e as
      escarpas. Mais longo é o percurso Les Hauts de Chouvigny: nove quilómetros de dificuldade média em cerca
      de três horas, com vistas emblemáticas sobre a foz do desfiladeiro sob a fortaleza medieval, dispondo de
      uma variante curta de 3,5 km. No verão são populares as descidas em canoa.
    history: >-
      O castelo de Chouvigny, alcandorado na rocha sobre o rio, é o ex-líbris histórico do vale. A barragem de
      Queuille, edificada entre 1901 e 1904, e a de Fades geram eletricidade limpa. As gargantas estão
      classificadas como ZNIEFF e toda a bacia hidrográfica integra a rede Natura 2000. As charnecas de
      Péraclos são espaço natural sensível desde 2012.
    before: >-
      Os miradouros ao longo da estrada permitem desfrutar da paisagem em segurança. O traçado é estreito e
      sinuoso: conduz com moderação. De maio a outubro o clima é ideal; a maior afluência concentra-se em
      Queuille.
    around: >-
      A vinte e nove quilómetros fica o [Parque Natural Regional de Millevaches em
      Limousin](/lugar/parc-naturel-regional-de-millevaches-en-limousin/). Mais longe, o [Parque Nacional de
      Słowiński](/lugar/slowinski-park-narodowy/) partilha lontras-europeias e milhafres-reais em áreas
      fluviais resguardadas.
