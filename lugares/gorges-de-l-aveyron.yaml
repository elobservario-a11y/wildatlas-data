resumen:
  es: >-
    Desfiladero kárstico calizo esculpido por el río Aveyron salpicado de cavidades prehistóricas como
    Bruniquel.
  en: Limestone karst canyon carved by the Aveyron River dotted with prehistoric caverns such as Bruniquel.
  fr: Défilé karstique calcaire sculpté par l'Aveyron et ponctué de cavités préhistoriques comme Bruniquel.
  de: Vom Fluss Aveyron in den Kalkstein geschliffener Karstcanyon mit prähistorischen Höhlen wie Bruniquel.
  it: Canyon carsico calcareo scolpito dal fiume Aveyron e costellato di cavità preistoriche come Bruniquel.
  pt: >-
    Desfiladeiro cárstico calcário talhado pelo rio Aveyron e salpicado de cavidades pré-históricas como
    Bruniquel.
unico:
  es: >-
    Un río que ha tallado en la caliza acantilados y meandros salvajes, y bajo ellos una cueva donde los
    neandertales levantaron hace unos 176 500 años la construcción más antigua que se conoce.
  en: >-
    A river that carved wild cliffs and meanders through limestone, concealing a cavern where Neanderthals
    raised the oldest known structure some 176,500 years ago.
  fr: >-
    Une rivière qui a taillé dans le calcaire des falaises et des méandres sauvages, abritant une grotte où
    les Néandertaliens élevèrent il y a quelque 176 500 ans la plus ancienne structure connue.
  de: >-
    Ein Fluss, der steile Kalkfelsen und wilde Schleifen grub, und darunter eine Höhle, in der Neandertaler
    vor rund 176 500 Jahren das älteste bekannte Bauwerk errichteten.
  it: >-
    Un fiume che ha scavato nel calcare falesie e meandri selvaggi, celando una grotta dove i Neanderthal
    eressero circa 176 500 anni fa la più antica struttura conosciuta.
  pt: >-
    Um rio que esculpiu no calcário escarpas e meandros bravios, ocultando uma gruta onde neandertais ergueram
    há cerca de 176 500 anos a construção mais antiga que se conhece.
observaciones:
  es: >-
    Documéntate antes de salir: la geología, la naturaleza y la historia local que atraviesan las rutas dan
    sentido a lo que ves. En las bajadas en canoa, todos los recorridos son fáciles, pero hay que saber nadar
    y no quitarse el chaleco.
texto:
  es:
    intro: >-
      El Aveyron no se limita a atravesar la piedra: la talla. Entre Bruniquel, en Tarn y Garona, y
      Villefranche-de-Rouergue, el río, afluente del Tarn, ha esculpido en la caliza acantilados altos y
      meandros salvajes, y entre los dos extremos el tramo central, el que va de Saint-Antonin-Noble-Val a
      Laguépie, es el menos encajado. Desde arriba se ve cómo el río cava un paisaje contrastado de arenisca y
      caliza antes de unirse al Tarn. Es un lugar para bajar en canoa entre paredes, subir a un mirador y
      meterse, si se tercia, bajo tierra.
    landscape: >-
      El espacio protegido de las gargantas es una mezcla de gran valle dominado por acantilados, laderas de
      pastizal seco, mesetas secas, valles encajados y cavidades naturales. El Aveyron nace en Sévérac y, tras
      291 km, desemboca en el Tarn en Barry-d'Islemade.


      Saint-Antonin-Noble-Val ocupa la confluencia del Bonnette y el Aveyron, al pie de los acantilados del
      Roc d'Anglars, y es una de las ciudades medievales más antiguas que han sobrevivido.
    wildlife: >-
      Los acantilados son la casa de los [halcones peregrinos](/especie/falco_peregrinus/). En el bosque de
      Grésigne, vecino, crían siete especies de rapaces, entre ellas el halcón peregrino y el [búho
      real](/especie/bubo_bubo/). En los valles del Tarn, el Aveyron y el Viaur son de gran interés la
      [nutria](/especie/lutra_lutra/) y la [madreperla de río](/especie/margaritifera_margaritifera/).


      Las cavidades naturales de las gargantas son ricas en murciélagos, y en los pastizales secos hay buenas
      poblaciones de orquídeas. El territorio atrae a quienes observan fauna y flora, y la mejor época va de
      mayo a octubre; la navegación por el río se hace de mayo a septiembre, según el tiempo.
    visit: >-
      La puerta de entrada es Saint-Antonin-Noble-Val. Desde allí, el río es el protagonista: el descenso en
      canoa entre los acantilados es uno de los grandes clásicos, y los recorridos son fáciles, aptos para
      quien sepa nadar. Un operador de canoas ha firmado una carta de buenas prácticas para preservar las
      gargantas.


      A pie, los senderos cruzan mesetas calizas y bosques y llegan a miradores sobre las gargantas. En
      bicicleta, el circuito Rock It! enlaza las gargantas, las mesetas calizas del Quercy y el Terrefort del
      Rouergue, y figura como itinerario con asistencia eléctrica. Quien quiera subterráneos tiene la Grotte
      du Bosc, de unos doscientos diez metros desarrollados y con una gran variedad de concreciones; solo se
      visita con guía, en grupos de hasta 21 personas.
    history: >-
      La historia humana empieza muy atrás. En la cueva de Bruniquel, cerca del extremo occidental de las
      gargantas, se halló una estructura de unos cuatrocientos trozos de estalagmitas levantada por
      neandertales hace unos 176 500 años. La cueva está cerrada al público por estudios científicos y su
      localización exacta es secreta.


      Mucho después, la fuerza del agua movió los molinos del Aveyron, que molían grano, curtían cuero,
      abatanaban telas y fabricaban papel. El fosfato de las mesetas se exportaba hasta Inglaterra, y en el
      territorio llegaron a vivir 30 000 personas.
    before: >-
      Documéntate antes de salir: la geología, la naturaleza y la historia local que atraviesan las rutas dan
      sentido a lo que ves. En las bajadas en canoa, todos los recorridos son fáciles, pero hay que saber
      nadar y no quitarse el chaleco.
    around: >-
      A quince kilómetros está el [Valle del Célé](/lugar/vallee-du-cele/), el vecino más cercano de este
      valle en el atlas.
  en:
    intro: >-
      The Aveyron does not merely traverse the bedrock: it carves it. Between Bruniquel in Tarn-et-Garonne and
      Villefranche-de-Rouergue, this major tributary of the Tarn has hollowed out towering limestone crags and
      meandering wild loops, with its central reach—from Saint-Antonin-Noble-Val to Laguépie—presenting the
      gentlest relief. Viewed from the clifftops, the river cuts a dramatic transition across sandstone and
      limestone before joining the Tarn. It is prime country for canoeing between sheer cliffs, ascending
      panoramic belvederes, and venturing beneath the surface.
    landscape: >-
      The protected canyon reserve encompasses a grand valley framed by sheer cliffs, dry calcicolous
      grasslands, arid karst plateaus, deeply incised tributary vales, and natural subterranean chambers. The
      Aveyron rises in Sévérac and, after 291 km, empties into the Tarn at Barry-d'Islemade.


      Saint-Antonin-Noble-Val nestles at the confluence of the Bonnette and the Aveyron, beneath the soaring
      cliffs of Roc d'Anglars, standing as one of the oldest preserved medieval settlements in the region.
    wildlife: >-
      The towering rock escarpments provide sanctuary for [peregrine falcons](/especie/falco_peregrinus/). In
      the adjacent Grésigne forest, seven raptor species breed, including the peregrine falcon and the
      [Eurasian eagle-owl](/especie/bubo_bubo/). Along the valleys of the Tarn, Aveyron, and Viaur, the
      [Eurasian otter](/especie/lutra_lutra/) and the [freshwater pearl
      mussel](/especie/margaritifera_margaritifera/) represent key conservation priorities.


      The natural caves honeycombing the defile support diverse bat colonies, while the dry calcareous meadows
      sustain abundant orchid populations. The area is a prime destination for naturalists from May to
      October, with river paddling operating from May to September depending on water levels and seasonal
      weather.
    visit: >-
      The natural threshold to the defile is Saint-Antonin-Noble-Val. Here the river takes center stage:
      paddling down the gorge between limestone ramparts is a regional classic, offering gentle itineraries
      suitable for anyone who can swim. Local canoe outfitters have signed an environmental charter to
      safeguard river habitats.


      On foot, marked footpaths traverse limestone plateaus and oak woodlands to reach airy clifftop lookouts.
      For cyclists, the Rock It! route connects the gorges with the Quercy karst plateaus and the Rouergue
      Terrefort, well suited to e-bikes. Underground explorers can visit the Grotte du Bosc, extending for
      some two hundred and ten meters with varied speleothems; visits run exclusively with a guide in groups
      capped at 21 people.
    history: >-
      Human presence here stretches back into deep antiquity. In Bruniquel Cave, near the western gateway of
      the gorges, researchers discovered an oval ring of some four hundred stalagmite fragments constructed by
      Neanderthals around 176,500 years ago. The cavern remains closed to the public for scientific
      preservation, with its precise location kept confidential.


      Centuries later, river currents drove mills along the Aveyron to grind grain, tan leather, full cloth,
      and mill paper. Phosphate extracted from the plateaus was once exported as far as England, and the wider
      gorge country historically supported up to 30,000 residents.
    before: >-
      Read up on local geology, wildlife, and history before setting out to enrich your journey. On canoe
      trips, routes are placid but require basic swimming ability and life jackets kept securely fastened at
      all times.
    around: >-
      Fifteen kilometers away lies the [Célé Valley](/lugar/vallee-du-cele/), the closest neighboring
      landscape in the atlas.
  fr:
    intro: >-
      L'Aveyron ne se contente pas de traverser la roche : il la façonne. Entre Bruniquel, en Tarn-et-Garonne,
      et Villefranche-de-Rouergue, ce cours d'eau affluent du Tarn a entaillé le calcaire en falaises
      vertigineuses et en méandres sauvages ; entre ces deux extrémités, le tronçon central reliant
      Saint-Antonin-Noble-Val à Laguépie est le plus ouvert. Depuis les hauteurs, on contemple la rivière
      creusant un paysage contrasté de grès et de calcaire avant de rejoindre le Tarn. C'est un écrin idéal
      pour pagayer en canoë entre les parois, monter aux belvédères et s'aventurer sous terre.
    landscape: >-
      L'espace protégé des gorges forme une mosaïque associant une vaste vallée dominée par des falaises, des
      pelouses sèches de versant, des plateaux arides, des combes encaissées et des cavités naturelles.
      L'Aveyron prend sa source à Sévérac et, après 291 km, se jette dans le Tarn à Barry-d'Islemade.


      Saint-Antonin-Noble-Val occupe la confluence de la Bonnette et de l'Aveyron, au pied des parois du Roc
      d'Anglars, et compte parmi les plus anciennes cités médiévales conservées de la région.
    wildlife: >-
      Les falaises hébergent des couples de [faucons pèlerins](/especie/falco_peregrinus/). Dans la forêt
      voisine de Grésigne nichent sept espèces de rapaces, dont le faucon pèlerin et le [grand-duc
      d'Europe](/especie/bubo_bubo/). Dans les vallées du Tarn, de l'Aveyron et du Viaur, la [loutre
      d'Europe](/especie/lutra_lutra/) et la [moule perlière d'eau
      douce](/especie/margaritifera_margaritifera/) constituent des enjeux écologiques majeurs.


      Les grottes naturelles des gorges abritent d'importantes colonies de chauves-souris, tandis que les
      pelouses calcicoles recèlent de belles stations d'orchidées. Le secteur attire les naturalistes de mai à
      octobre ; les descentes de rivière s'effectuent de mai à septembre selon la météo.
    visit: >-
      La porte d'accès principale est Saint-Antonin-Noble-Val. De là, la rivière devient le fil conducteur :
      la descente en canoë au pied des parois constitue un grand classique, avec des parcours faciles adaptés
      à toute personne sachant nager. Des loueurs locaux ont signé une charte de bonnes pratiques afin de
      préserver les berges.


      À pied, les sentiers traversent les causses et les bois pour gagner des belvédères plongeant sur les
      méandres. À vélo, le circuit Rock It! relie les gorges, les causses du Quercy et le Terrefort du
      Rouergue, proposé comme parcours assisté électriquement. Les amateurs de monde souterrain exploreront la
      grotte du Bosc, qui développe quelque deux cent dix mètres de galeries très concrétionnées ; elle se
      visite uniquement avec guide par groupes limités à 21 personnes.
    history: >-
      L'histoire humaine plonge ici dans la nuit des temps. Dans la grotte de Bruniquel, vers l'extrémité
      occidentale des défilés, fut découverte une structure circulaire d'environ quatre cents tronçons de
      stalagmites édifiée par des Néandertaliens il y a 176 500 ans environ. La caverne demeure fermée au
      public pour la recherche scientifique et sa localisation exacte reste secrète.


      Bien plus tard, la force hydraulique anima les moulins de l'Aveyron pour moudre le grain, tanner les
      cuirs, fouler les draps et fabriquer du papier. Les phosphates extraits des causses furent exportés
      jusqu'en Angleterre, et les gorges ont compté jadis jusqu'à 30 000 habitants.
    before: >-
      Renseignez-vous avant de partir : la géologie, la biodiversité et l'histoire locale traversées par les
      sentiers éclairent la découverte. En canoë, les descentes sont aisées mais exigent de savoir nager et de
      garder son gilet ajusté.
    around: >-
      À quinze kilomètres s'ouvre la [Vallée du Célé](/lugar/vallee-du-cele/), voisine la plus proche de ces
      gorges dans l'atlas.
  de:
    intro: >-
      Der Aveyron fließt nicht nur durch den Fels: Er schnitzt ihn. Zwischen Bruniquel im Département
      Tarn-et-Garonne und Villefranche-de-Rouergue hat dieser Nebenfluss des Tarn hohe Kalkwände und
      ungebändigte Mäander geschaffen; der Mittelabschnitt von Saint-Antonin-Noble-Val nach Laguépie ist dabei
      am wenigsten eingeengt. Von oben blickt man auf ein kontrastreiches Relief aus Sandstein und Kalk, bevor
      sich das Gewässer mit dem Tarn vereint. Ein Ort, um im Kanu zwischen Felsabstürzen zu gleiten,
      Panoramapunkte zu erklimmen oder in Höhlen abzutauchen.
    landscape: >-
      Das Schutzgebiet der Schlucht umfasst ein weites, von Felswänden gesäumtes Tal, Trockenrasenhänge,
      verkarstete Hochflächen, enge Seitentäler und Naturhöhlen. Der Aveyron entspringt in Sévérac und mündet
      nach 291 km bei Barry-d'Islemade in den Tarn.


      Saint-Antonin-Noble-Val liegt am Zusammenfluss von Bonnette und Aveyron am Fuß der Steilwände des Roc
      d'Anglars und gehört zu den ältesten erhaltenen mittelalterlichen Städten der Region.
    wildlife: >-
      Die Felswände bieten dem [Wanderfalken](/especie/falco_peregrinus/) Brutplätze. Im benachbarten Wald von
      Grésigne nisten sieben Greifvogelarten, darunter Wanderfalke und [Uhu](/especie/bubo_bubo/). In den
      Tälern von Tarn, Aveyron und Viaur zählen [Fischotter](/especie/lutra_lutra/) und
      [Flussperlmuschel](/especie/margaritifera_margaritifera/) zu den herausragenden Tierarten.


      Die Karsthöhlen der Schlucht beherbergen artenreiche Fledermausquartiere, und auf den Magerwiesen
      gedeihen beachtliche Orchideenbestände. Naturbeobachter kommen von Mai bis Oktober auf ihre Kosten;
      Kanufahrten finden je nach Wasserstand von Mai bis September statt.
    visit: >-
      Hauptzugangspunkt ist Saint-Antonin-Noble-Val. Von dort aus bestimmt der Fluss das Geschehen: Die
      Kanutour unter den Felswänden ist ein Klassiker mit einfachen, für Schwimmer geeigneten Abschnitten.
      Lokale Verleiher haben eine Charta unterzeichnet, um das sensible Flusstal zu schützen.


      Zu Fuß führen Wanderpfade über Kalkplateaus und Eichenwälder zu Aussichtskanzeln über der Schlucht. Für
      Radfahrer verbindet die Route Rock It! die Schlucht mit den Karstflächen des Quercy und dem
      Rouergue-Terrefort, ideal für E-Bikes. Wer Höhlen schätzt, besucht die Grotte du Bosc, die sich über
      rund zweihundertzehn Meter mit vielfältigen Tropfsteinen erstreckt; sie ist nur im Rahmen geführter
      Gruppen mit bis zu 21 Personen zugänglich.
    history: >-
      Die menschliche Besiedlung reicht tief in die Vorgeschichte zurück. In der Höhle von Bruniquel am
      westlichen Schluchteingang wurde eine aus etwa vierhundert Stalagmitenstücken errichtete Struktur
      entdeckt, die Neandertaler vor rund 176 500 Jahren anlegten. Die Höhle bleibt für Forschungen gesperrt
      und ihre Lage geheim.


      Jahrhunderte später trieb die Wasserkraft des Aveyron Getreide-, Gerb-, Walk- und Papiermühlen an.
      Phosphat aus den Karstplateaus wurde bis nach England exportiert, und im Schluchtgebiet lebten zeitweise
      bis zu 30 000 Menschen.
    before: >-
      Informiere dich vorab: Die Geologie, Tierwelt und Kulturgeschichte entlang der Wege vertiefen das
      Erlebnis. Auf dem Wasser sind alle Strecken einfach, erfordern jedoch Schwimmkenntnisse und angelegte
      Schwimmwesten.
    around: >-
      Fünfzehn Kilometer entfernt liegt das [Célé-Tal](/lugar/vallee-du-cele/), der nächste Partner dieses
      Flusstals im Atlas.
  it:
    intro: >-
      L'Aveyron non si limita a scorrere nella roccia: la intaglia. Tra Bruniquel, nel Tarn-et-Garonne, e
      Villefranche-de-Rouergue, questo affluente del Tarn ha modellato nel calcare falesie imponenti e meandri
      appartati; la sezione centrale tra Saint-Antonin-Noble-Val e Laguépie risulta la più aperta. Dalle
      creste si osserva il fiume incidere un paesaggio contrastato di arenaria e calcare prima di confluire
      nel Tarn. È un ambiente ideale per pagaiare in canoa tra pareti verticali, salire a punti panoramici o
      scendere sottoterra.
    landscape: >-
      L'area protetta delle gole compone un mosaico di fondovalle dominato da rupi calcaree, versanti a
      pascolo arido, altopiani carsici, forre laterali e grotte naturali. L'Aveyron sorge a Sévérac e, dopo
      291 km, confluisce nel Tarn presso Barry-d'Islemade.


      Saint-Antonin-Noble-Val si raccoglie alla confluenza della Bonnette con l'Aveyron, sotto le rupi del Roc
      d'Anglars, conservando una delle trame urbane medievali più antiche del territorio.
    wildlife: >-
      Le pareti rocciose offrono rifugio al [falco pellegrino](/especie/falco_peregrinus/). Nella contigua
      foresta di Grésigne nidificano sette specie di rapaci, tra cui il pellegrino e il [gufo
      reale](/especie/bubo_bubo/). Nelle valli del Tarn, dell'Aveyron e del Viaur rivestono primaria
      importanza la [lontra europea](/especie/lutra_lutra/) e la [cozza perlifera d'acqua
      dolce](/especie/margaritifera_margaritifera/).


      Le grotte naturali accolgono colonie di pipistrelli, mentre le praterie xerofile ospitano ricche
      fioriture di orchidee selvatiche. L'area richiama naturalisti ed escursionisti da maggio a ottobre; la
      discesa fluviale si pratica da maggio a settembre a seconda del regime idrico.
    visit: >-
      Il varco principale è Saint-Antonin-Noble-Val. Da qui il fiume assume un ruolo centrale: la discesa in
      canoa sotto le falesie è un classico accessibile a chiunque sappia nuotare. Gli operatori locali hanno
      sottoscritto un accordo di buone pratiche a tutela degli argini.


      A piedi, i sentieri traversano causses e querceti raggiungendo belvederi aperti sulla forra. In
      bicicletta, l'itinerario Rock It! unisce le gole agli altopiani del Quercy e al Terrefort del Rouergue,
      tracciato per e-bike. Chi desidera esplorare il sottosuolo può visitare la Grotte du Bosc, che si
      sviluppa per circa duecentodieci metri con numerose concrezioni; l'accesso è consentito solo con guida
      in gruppi fino a 21 persone.
    history: >-
      La memoria umana affonda in tempi remoti. Nella grotta di Bruniquel, all'estremità occidentale della
      forra, venne alla luce una struttura anulare di circa quattrocento pezzi di stalagmiti costruita dai
      Neanderthal circa 176 500 anni or sono. La cavità è preclusa al pubblico per ragioni scientifiche e la
      sua collocazione resta riservata.


      Molti secoli dopo, l'energia idraulica mosse i mulini dell'Aveyron per macinare grano, conciare pelli,
      gualcare tessuti e produrre carta. I fosfati estratti dagli altopiani venivano esportati fino in
      Inghilterra, e la vallata giunse a ospitare circa 30 000 residenti.
    before: >-
      Raccogli informazioni prima di partire: geologia, habitat e vicende storiche arricchiscono il percorso.
      In canoa le tratte sono agevoli, ma richiedono abilità natatoria e giubbotto salvagente sempre
      indossato.
    around: >-
      A quindici chilometri si estende la [Valle del Célé](/lugar/vallee-du-cele/), il rilievo più vicino
      nell'atlante.
  pt:
    intro: >-
      O Aveyron não se limita a atravessar a rocha: esculpe-a. Entre Bruniquel, em Tarn-et-Garonne, e
      Villefranche-de-Rouergue, este afluente do Tarn rasgou no calcário penhascos imponentes e meandros
      selvagens, sendo o setor central entre Saint-Antonin-Noble-Val e Laguépie o mais desimpedido. Visto do
      alto, o rio talha uma paisagem contrastada de arenito e calcário antes de convergir no Tarn. É um
      cenário de eleição para descer em canoa entre paredões, subir a miradouros e explorar cavidades
      subterrâneas.
    landscape: >-
      O espaço protegido das gargantas combina um amplo vale ladeado por falésias, encostas de pastagens
      secas, planaltos cársticos, ravinas encaixadas e grutas naturais. O Aveyron nasce em Sévérac e, ao fim
      de 291 km, desagua no Tarn em Barry-d'Islemade.


      Saint-Antonin-Noble-Val ergue-se na confluência do Bonnette com o Aveyron, ao sopé das arribas do Roc
      d'Anglars, afirmando-se como uma das vilas medievais mais antigas e bem preservadas da região.
    wildlife: >-
      Os penhascos acolhem casais de [falcões-peregrinos](/especie/falco_peregrinus/). Na floresta vizinha de
      Grésigne nidificam sete espécies de rapinas, incluindo o falcão-peregrino e o
      [bufo-real](/especie/bubo_bubo/). Nos vales do Tarn, do Aveyron e do Viaur destacam-se a
      [lontra-europeia](/especie/lutra_lutra/) e o
      [mexilhão-perlífero-de-rio](/especie/margaritifera_margaritifera/).


      As grutas naturais do desfiladeiro abrigam colónias de morcegos, e as pastagens calcárias revelam ricas
      populações de orquídeas bravas. O território atrai naturalistas de maio a outubro; as descidas de rio
      ocorrem de maio a setembro conforme o caudal.
    visit: >-
      O ponto de partida predileto é Saint-Antonin-Noble-Val. A partir daí o rio comanda a experiência: descer
      em canoa junto às falésias é uma atividade clássica, com troços suaves indicados para quem sabe nadar.
      As empresas locais subscreveram um termo de boas práticas para resguardar as margens.


      A pé, os percursos pedestres cruzam planaltos calcários e bosques rumo a miradouros desafogados. De
      bicicleta, o circuito Rock It! une as gargantas, os planaltos do Quercy e o Terrefort do Rouergue, com
      apoio para bicicletas elétricas. Quem procura aventuras subterrâneas dispõe da Grotte du Bosc,
      desenvolvendo cerca de duzentos e dez metros com variados espeleotemas; visita-se unicamente com guia em
      grupos até 21 pessoas.
    history: >-
      A ocupação humana recua a épocas remotas. Na gruta de Bruniquel, junto ao extremo ocidental das
      gargantas, descobriu-se uma estrutura anelar com cerca de quatrocentos fragmentos de estalagmites
      edificada por neandertais há cerca de 176 500 anos. O acesso permanece vedado ao público para
      investigação científica e a sua localização exata é reservada.


      Séculos mais tarde, a força motriz das águas alimentou os moinhos do Aveyron, que moíam cereais, curtiam
      peles, pisoavam panos e produziam papel. O fosfato extraído dos planaltos chegou a ser exportado para
      Inglaterra, sustentando a região até 30 000 habitantes.
    before: >-
      Informa-te antes de partir: a geologia, a fauna e a história local ao longo dos trilhos dão sentido a
      cada recanto. Na canoagem, os percursos são acessíveis, mas requerem saber nadar e manter o colete
      salva-vidas ajustado.
    around: >-
      A quinze quilómetros estende-se o [Vale do Célé](/lugar/vallee-du-cele/), o vizinho mais próximo desta
      bacia no atlas.
