resumen:
  es: Garganta fluvial salvaje cortando los Cárpatos con hayedos de ladera no explotados.
  en: Wild river canyon slicing through the Carpathians with unlogged slope beech forests.
  fr: Gorge fluviale sauvage entaillant les Carpates couverte de hêtraies de pente inexploitées.
  de: Wilde Flussschlucht durch die Karpaten mit unberührten Buchenurwäldern an steilen Berghängen.
  it: Selvaggia gola fluviale attraverso i Carpazi ricoperta da faggete di pendio vergini e inesplorate.
  pt: Garganta fluvial bravia rasgando os Cárpatos com faiais de encosta virgens e inexplorados.
unico:
  es: Un desfiladero cubierto en más de un 80 % por hayedos y robledales, donde pasan oso, lobo y lince.
  en: A gorge covered over 80% by beech and oak woodlands where brown bear, wolf and lynx roam.
  fr: Un défilé boisé à plus de 80 % de hêtraies et de chênaies où circulent l'ours brun, le loup et le lynx.
  de: >-
    Eine zu über 80 % von Buchen- und Eichenwäldern bedeckte Schlucht, durch die Braunbär, Wolf und Luchs
    streifen.
  it: >-
    Una forra coperta per oltre l'80% da faggete e querceti secolari in cui transitano orso bruno, lupo e
    lince.
  pt: >-
    Um desfiladeiro coberto em mais de 80% por faiais e carvalhais onde vagueiam o urso-pardo, o lobo e o
    lince.
observaciones:
  es: >-
    El senderismo solo está permitido por los itinerarios temáticos existentes y respetando sus normas. Plan
    de uno a dos días. Se llega por la ruta europea E79, desde Târgu Jiu hasta Bumbești Jiu o desde Deva por
    Hațeg hasta Petroșani. La administración puede organizar visitas guiadas para fotografía de naturaleza.
texto:
  es:
    intro: >-
      Los romanos lo intentaron y desistieron. Querían abrir un camino por el valle del Jiu, pero se dieron
      cuenta de que excavarlo y mantenerlo en un valle tan salvaje habría exigido demasiado trabajo, y
      abandonaron el proyecto. Lo que ellos no se atrevieron a domar es hoy el Parque Nacional Defileul
      Jiului: un paso excavado entre los montes Retezat, Vâlcan, Parâng y Șureanu que une Transilvania con
      Oltenia, con roquedos, farallones calizos, pedreras, gargantas, cascadas, sumideros, pastos de montaña y
      bosques. Se declaró en 2005 y ocupa 11.127 ha a lo largo del río Jiu, entre los montes Vâlcan y Parâng.
    landscape: >-
      La carretera DN66, que une Deva con Filiași, atraviesa el parque, y el desfiladero lleva mucho tiempo
      siendo lugar de paso: la carretera por el desfiladero se terminó en 1890 y se inauguró el 4 de
      septiembre de 1894, y a mediados del siglo XIX había empezado la explotación industrial del carbón del
      valle del Jiu. Pero a ambos lados del río manda la montaña.


      Más del 80 % del parque está cubierto de bosques de haya y roble albar, y los senderos cruzan parte de
      los 22 hábitats de interés nacional y europeo. Entre ellos hay hayedos, robledales y bosques aluviales
      de aliso negro a ambas orillas del Jiu. Y entre las piedras, un monumento natural: la reserva Sfinxul
      Lainicilor, una formación geológica megalítica con forma de esfinge.
    wildlife: >-
      Es un lugar de carnívoros. Entre los grandes del parque figuran el [lobo](/especie/canis_lupus/), el
      [oso pardo](/especie/ursus_arctos/), el [lince](/especie/lynx_lynx/) y la
      [nutria](/especie/lutra_lutra/). También hay [rebeco](/especie/rupicapra_rupicapra/),
      [ciervo](/especie/cervus_elaphus/), [corzo](/especie/capreolus_capreolus/), gato montés y marta. Entre
      las aves hay [águila real](/especie/aquila_chrysaetos/), halcón peregrino, azor y [mirlo
      acuático](/especie/cinclus_cinclus/). Defileul Jiului forma uno de los principales corredores
      migratorios para aves.


      Entre los animales pequeños figuran el sapillo de vientre amarillo, el tritón crestado, la culebra de
      Esculapio, el escarabajo ermitaño y la [rosalía alpina](/especie/rosalia_alpina/). El parque registra
      más de novecientas especies de fauna en sus bosques naturales o casi primarios. Y en las plantas, el
      inventario cuenta novecientas cincuenta y ocho especies de plantas superiores y destaca sesenta y cinco
      de interés nacional o europeo; los especialistas sostienen que el parque alberga el 25 % de la flora de
      Rumanía. Entre las hierbas vive Tozzia carpathica, una planta de la directiva europea de hábitats que en
      rumano se llama iarba-gâtului.


      El mejor tiempo para ir va de mayo a octubre, y el sendero «Defileul Jiului și comorile sale» se recorre
      en verano e invierno.
    visit: >-
      El Centro de Visitantes de Bumbești Jiu se inauguró en 2014 para informar sobre turismo, biodiversidad e
      historia de las áreas protegidas. Tiene una maqueta 3D del parque con los elementos naturales,
      culturales e históricos más importantes y exposiciones de fotografía que cambian según la estación.


      Los senderos temáticos son la forma de entrar. El sendero Sfinxul Lainicilor queda al norte del
      monasterio de Lainici y se hace en unas dos horas, con dificultad media y botas obligatorias; mide tres
      kilómetros y medio, y desde su cresta se ve el río Jiu y el paso Surduc. «Defileul Jiului și comorile
      sale» lleva unas cinco horas, tiene 15 km ida y vuelta, de los cuales 9 se pueden hacer en vehículo.
      «Poveștile Pădurii» mide 5,8 km, es de dificultad media y se hace en cuatro o cinco horas; la ardilla
      Alunița cuenta secretos sobre la vida de los animales en el hayedo, la pradera y el arroyo de montaña. Y
      el más corto, «La Observator», de unos 250 metros, termina en una plataforma mirador sobre Bumbești Jiu
      y el parque.
    history: >-
      El gestor publica los objetivos de conservación del sitio de importancia comunitaria ROSCI0063 Defileul
      Jiului. En el parque está el monasterio ortodoxo de Lainici, construido en 1817, y cerca del parque, en
      Bumbești-Jiu, hay tres castros romanos.
    before: >-
      El senderismo solo está permitido por los itinerarios temáticos existentes y respetando sus normas. Plan
      de uno a dos días. Se llega por la ruta europea E79, desde Târgu Jiu hasta Bumbești Jiu o desde Deva por
      Hațeg hasta Petroșani. La administración puede organizar visitas guiadas para fotografía de naturaleza.
    around: >-
      A siete kilómetros están las [Montañas de Șureanu](/lugar/muntii-sureanu/), a diecisiete la [Garganta de
      Sohodol](/lugar/cheile-sohodolului/) y a veintiséis el [Parque Nacional
      Retezat](/lugar/parcul-national-retezat---masivul-muntos/). Más lejos, el [Parque Nacional Gargantas del
      Nera - Beușnița](/lugar/parcul-national-cheile-nerei---beusnita/) comparte con el Jiu los murciélagos de
      herradura grande y ratonero grande, y los hábitats de bosque primario y garganta.
  en:
    intro: >-
      The Romans tried and gave up. They wished to forge a passage through the Jiu valley, but realised
      carving and maintaining it in such a ferocious gorge demanded too much effort, so they abandoned the
      endeavour. What they did not dare tame is today Defileul Jiului National Park: a pass gouged between the
      Retezat, Vâlcan, Parâng and Șureanu ranges linking Transylvania with Oltenia, bristling with crags,
      limestone precipices, screes, ravines, cascades, sinkholes, alpine meadows and deep woods. It was
      declared in 2005 and spans 11,127 ha along the Jiu River, nestled between the Vâlcan and Parâng
      mountains.
    landscape: >-
      Highway DN66, linking Deva with Filiași, cuts straight through the park, and the defile has long served
      as a corridor: the road through the gorge was finished in 1890 and inaugurated on 4 September 1894,
      while industrial coal extraction in the Jiu valley had begun by the mid-nineteenth century. Yet on
      either flank of the river, pure wilderness prevails.


      Over 80% of the park is cloaked in European beech and sessile oak forests, with footpaths weaving
      through parts of 22 habitats of national and European importance. These include slope beechwoods, oak
      groves and alluvial black alder galleries along both riverbanks of the Jiu. Amid the rock formations
      stands a natural monument: the Sfinxul Lainicilor reserve, a megalithic natural sculpture evocative of a
      sphinx.
    wildlife: >-
      This is prime carnivore territory. Flagship predators roaming the park include the
      [wolf](/especie/canis_lupus/), the [brown bear](/especie/ursus_arctos/), the [Eurasian
      lynx](/especie/lynx_lynx/) and the [Eurasian otter](/especie/lutra_lutra/). Other residents include
      [chamois](/especie/rupicapra_rupicapra/), [red deer](/especie/cervus_elaphus/), [roe
      deer](/especie/capreolus_capreolus/), wildcat and pine marten. Avian life features the [golden
      eagle](/especie/aquila_chrysaetos/), peregrine falcon, goshawk and [white-throated
      dipper](/especie/cinclus_cinclus/). Defileul Jiului serves as a crucial migratory highway for birds
      crossing the Carpathians.


      Among lower fauna dwell yellow-bellied toads, crested newts, Aesculapian snakes, hermit beetles and the
      [Rosalia longicorn](/especie/rosalia_alpina/). The park records over nine hundred animal species within
      its virgin or near-natural old-growth forests. Botanical inventories catalogue nine hundred and
      fifty-eight vascular plant species, highlighting sixty-five of national or Community interest; botanists
      estimate the park shelters 25% of Romania's native flora. Herbaceous highlights include Tozzia
      carpathica, an alpine relic protected under the European Habitats Directive, known in Romanian as
      iarba-gâtului.


      The finest window for exploring spans from May to October, and the trail 'Defileul Jiului și comorile
      sale' remains practicable in summer and winter.
    visit: >-
      The Bumbești Jiu Visitor Centre was inaugurated in 2014 to showcase regional tourism, biodiversity and
      protected-area heritage. It houses a 3D relief model highlighting major geological and cultural
      landmarks, alongside rotating seasonal photography exhibits.


      Thematic trails offer the ideal immersion. The Sfinxul Lainicilor path starts north of Lainici
      Monastery, taking around two hours with moderate effort and requiring sturdy boots; it spans three and a
      half kilometres, offering ridge views over the Jiu River and Surduc Pass. 'Defileul Jiului și comorile
      sale' takes roughly five hours over 15 km round-trip, 9 of which can be driven by car. 'Poveștile
      Pădurii' covers 5.8 km, graded moderate over four to five hours, where Alunița the squirrel introduces
      forest ecology along beech slopes and rushing streams. The shortest trail, 'La Observator', spans
      roughly 250 metres to a panoramic lookout over Bumbești Jiu and the gorge entrance.
    history: >-
      Park authorities publish conservation targets for the Site of Community Importance ROSCI0063 Defileul
      Jiului. Within the park stands the Orthodox Lainici Monastery, constructed in 1817, while nearby in
      Bumbești-Jiu lie the ruins of three Roman castra.
    before: >-
      Hiking is permitted solely on designated thematic trails and following park regulations. Plan on one to
      two days. Access is via European route E79, driving from Târgu Jiu to Bumbești Jiu or from Deva through
      Hațeg towards Petroșani. Park rangers can arrange guided nature photography excursions upon request.
    around: >-
      Seven kilometres away lie the [Șureanu Mountains](/lugar/muntii-sureanu/), seventeen kilometres the
      [Sohodol Gorge](/lugar/cheile-sohodolului/) and twenty-six the [Retezat National
      Park](/lugar/parcul-national-retezat---masivul-muntos/). Further afield, [Nera Gorges – Beușnița
      National Park](/lugar/parcul-national-cheile-nerei---beusnita/) shares with the Jiu greater horseshoe
      and greater mouse-eared bats, alongside pristine old-growth beech and canyon habitats.
  fr:
    intro: >-
      Les Romains tentèrent l'aventure avant de renoncer. Désireux d'ouvrir une voie à travers la vallée du
      Jiu, ils comprirent qu'entailler et entretenir une route dans un défilé si escarpé exigerait des efforts
      démesurés, et abandonnèrent le chantier. Ce colosse indompté constitue aujourd'hui le parc national
      Defileul Jiului : une brèche creusée entre les monts Retezat, Vâlcan, Parâng et Șureanu reliant la
      Transylvanie à l'Olténie, riche de falaises calcaires, pierriers, ravins, cascades, gouffres, alpages et
      forêts anciennes. Établi en 2005, il s'étend sur 11 127 ha le long de la rivière Jiu, entre les massifs
      de Vâlcan et Parâng.
    landscape: >-
      La route nationale DN66, reliant Deva à Filiași, traverse le parc de part en part. Ce défilé est un axe
      historique : la chaussée des gorges fut achevée en 1890 et inaugurée le 4 septembre 1894, alors que
      l'extraction houillère industrielle battait déjà son plein au milieu du XIXe siècle. Mais sur chaque
      rive, la montagne sauvage reprend immédiatement ses droits.


      Plus de 80 % du parc est revêtu de hêtraies et de chênaies sessiliflores, et les sentiers sillonnent une
      partie des 22 habitats d'intérêt communautaire et national. On y découvre des hêtraies montagnardes, des
      chênaies et des aulnaies alluviales le long des berges du Jiu. Parmi les formations rocheuses se
      distingue la réserve du Sfinxul Lainicilor, monument naturel mégalithique rappelant la silhouette d'un
      sphinx.
    wildlife: >-
      C'est le royaume des grands carnivores. Le parc abrite des populations vigoureuses de
      [loup](/especie/canis_lupus/), d'[ours brun](/especie/ursus_arctos/), de [lynx
      boréal](/especie/lynx_lynx/) et de [loutre d'Europe](/especie/lutra_lutra/). Les ongulés comptent le
      [chamois](/especie/rupicapra_rupicapra/), le [cerf élaphe](/especie/cervus_elaphus/) et le
      [chevreuil](/especie/capreolus_capreolus/), accompagnés du chat sauvage et de la martre des pins. Parmi
      les oiseaux s'illustrent l'[aigle royal](/especie/aquila_chrysaetos/), le faucon pèlerin, l'autour des
      palombes et le [cincle plongeur](/especie/cinclus_cinclus/). Le défilé représente l'un des corridors
      migratoires majeurs pour l'avifaune transcarpatique.


      La petite faune compte le sonneur à ventre jaune, le triton crêté, la couleuvre d'Esculape, le
      pique-prune et la [rosalie des Alpes](/especie/rosalia_alpina/). Plus de neuf cents espèces animales
      peuplent ces forêts séculaires. Côté flore, l'inventaire recense neuf cent cinquante-huit espèces
      végétales supérieures et met en avant soixante-cinq taxons d'intérêt patrimonial ; les spécialistes
      estiment que le parc abrite 25 % de toute la flore de Roumanie. Parmi les curiosités figure Tozzia
      carpathica, plante boréo-alpine protégée, nommée localement iarba-gâtului.


      La meilleure période de visite s'étend de mai à octobre, et l'itinéraire « Defileul Jiului și comorile
      sale » est praticable été comme hiver.
    visit: >-
      Le centre des visiteurs de Bumbești Jiu a été inauguré en 2014 pour informer sur la biodiversité et
      l'histoire locale. Il propose une maquette 3D présentant le relief et les curiosités du défilé, ainsi
      que des expositions photographiques temporaires.


      Les sentiers thématiques constituent le moyen privilégié d'accès. Le parcours Sfinxul Lainicilor débute
      au nord du monastère de Lainici et demande environ deux heures de marche avec chaussures adaptées ; long
      de trois kilomètres et demi, il offre une vue plongeante sur le Jiu et le défilé de Surduc. « Defileul
      Jiului și comorile sale » nécessite cinq heures pour 15 km aller-retour, dont 9 peuvent être parcourus
      en véhicule. « Poveștile Pădurii » s'étend sur 5,8 km, de difficulté moyenne en quatre à cinq heures ;
      l'écureuil Alunița y raconte la vie des sous-bois et des torrents. Enfin, « La Observator », sentier
      court d'environ 250 mètres, débouche sur un belvédère surplombant Bumbești Jiu.
    history: >-
      L'administration du parc publie les objectifs de conservation du site d'importance communautaire
      ROSCI0063 Defileul Jiului. Le monastère orthodoxe de Lainici, érigé en 1817, se dresse dans le parc,
      tandis qu'à Bumbești-Jiu subsistent les vestiges de trois camps romains fortifiés.
    before: >-
      La randonnée est strictement réservée aux sentiers thématiques balisés. Prévoyez un à deux jours. On
      accède au parc par la route européenne E79, depuis Târgu Jiu vers Bumbești Jiu ou depuis Deva via Hațeg
      jusqu'à Petroșani. La direction peut organiser des sorties encadrées pour la photographie naturaliste.
    around: >-
      À sept kilomètres se dressent les [Monts Șureanu](/lugar/muntii-sureanu/), à dix-sept les [Gorges de
      Sohodol](/lugar/cheile-sohodolului/) et à vingt-six le [Parc national
      Retezat](/lugar/parcul-national-retezat---masivul-muntos/). Plus loin, le [Parc national des gorges de
      la Nera - Beușnița](/lugar/parcul-national-cheile-nerei---beusnita/) partage avec le Jiu chauves-souris
      forestières, forêts vierges et paysages de gorges calcaires.
  de:
    intro: >-
      Die Römer versuchten es und gaben auf. Sie wollten einen Verkehrsweg durch das Schiltal bahnen,
      erkannten jedoch rasch, dass Bau und Instandhaltung in einer solch unbezähmbaren Schlucht unlösbare
      Mühen bedeuteten. Was sie unberührt ließen, bildet heute den Nationalpark Defileul Jiului: einen
      zwischen den Retezat-, Vâlcan-, Parâng- und Șureanu-Gebirgen eingekerbten Durchbruch, der Siebenbürgen
      mit Oltenien verbindet – geprägt von Felswänden, Kalkabstürzen, Schutthalden, Schluchten, Wasserfällen,
      Dolinen, Almmatten und Wäldern. Er wurde 2005 ausgewiesen und umfasst 11.127 ha entlang des Flusses
      Schil zwischen den Vâlcan- und Parâng-Bergen.
    landscape: >-
      Die Nationalstraße DN66 von Deva nach Filiași quert das Schutzgebiet; der Schildurchbruch diente seit
      jeher als Alpenpassage: Die Chaussee durch das Tal wurde 1890 vollendet und am 4. September 1894
      eröffnet, nachdem ab Mitte des neunzehnten Jahrhunderts der Kohlebergbau im Schiltal aufgeblüht war.
      Abseits des Asphalts dominiert jedoch unberührte Berglandschaft.


      Über 80 % des Parks sind von Buchen- und Traubeneichenwäldern bedeckt; Wanderpfade berühren Abschnitte
      von 22 Lebensräumen von nationaler und europäischer Tragweite. Dazu zählen Hangbuchenwälder, Eichenhaine
      und Auwälder mit Schwarzerlen entlang beider Schilufer. Zu den Naturdenkmälern zählt das Reservat
      Sfinxul Lainicilor, eine sphinxartige megalithische Felsformation.
    wildlife: >-
      Das Tal ist ein Kernlebensraum für große Beutegreifer: [Wolf](/especie/canis_lupus/),
      [Braunbär](/especie/ursus_arctos/), [Luchs](/especie/lynx_lynx/) und [Fischotter](/especie/lutra_lutra/)
      durchstreifen die Hänge. Zu den Huftieren zählen [Gämse](/especie/rupicapra_rupicapra/),
      [Rothirsch](/especie/cervus_elaphus/) und [Reh](/especie/capreolus_capreolus/), begleitet von Wildkatze
      und Baummarder. Die Avifauna glänzt mit [Steinadler](/especie/aquila_chrysaetos/), Wanderfalke, Habicht
      und [Wasseramsel](/especie/cinclus_cinclus/). Das Schiltal fungiert als wichtiger Zugkorridor für Vögel
      über die Südkarpaten.


      Unter den kleineren Tieren finden sich Gelbbauchunke, Kammmolch, Äskulapnatter, Eremit und der
      [Alpenbock](/especie/rosalia_alpina/). Mehr als neunhundert Tierarten bevölkern diese naturnahen
      Buchenurwälder. Die Flora umfasst neunhundertachtundfünfzig Gefäßpflanzenarten, darunter fünfundsechzig
      Arten von europäischer Bedeutung; Botaniker betonen, dass der Park 25 % der gesamten rumänischen Flora
      beherbergt. Bemerkenswert ist die geschützte Gebirgspflanze Tozzia carpathica, rumänisch iarba-gâtului
      genannt.


      Die beste Besuchszeit reicht von Mai bis Oktober; der Themenweg 'Defileul Jiului și comorile sale' ist
      sommers wie winters begehbar.
    visit: >-
      Das Besucherzentrum in Bumbești Jiu wurde 2014 eingeweiht, um über Tourismus, Biodiversität und
      Naturgeschichte zu informieren. Es beherbergt ein 3D-Reliefmodell der Region sowie wechselnde saisonale
      Fotoausstellungen.


      Themenwanderwege erschließen die Landschaft. Der Pfad Sfinxul Lainicilor beginnt nördlich des Klosters
      Lainici und erfordert bei Bergschuhpflicht etwa zwei Stunden Gehzeit; er misst dreieinhalb Kilometer und
      gewährt Ausblicke auf den Schil und den Surduc-Pass. 'Defileul Jiului și comorile sale' beansprucht fünf
      Stunden für 15 km hin und zurück, wovon 9 km mit dem Auto befahrbar sind. 'Poveștile Pădurii' umfasst
      5,8 km von mittlerem Anspruch in vier bis fünf Stunden, wo das Eichhörnchen Alunița Geheimnisse der
      Urwaldtiere erklärt. Der kürzeste Pfad, 'La Observator', führt über etwa 250 Meter zu einer
      Aussichtsplattform über Bumbești Jiu.
    history: >-
      Die Nationalparkverwaltung veröffentlicht Schutzziele für das FFH-Gebiet ROSCI0063 Defileul Jiului. Im
      Schutzgebiet liegt das 1817 gegründete orthodoxe Kloster Lainici; nahe Bumbești-Jiu zeugen drei römische
      Kastelle von alter Grenzsicherung.
    before: >-
      Wanderungen sind ausschließlich auf den markierten Themenwegen und unter Einhaltung der Parkregeln
      gestattet. Rechnen Sie mit ein bis zwei Tagen. Die Anreise erfolgt über die Europastraße E79 von Târgu
      Jiu nach Bumbești Jiu oder von Deva über Hațeg nach Petroșani. Geführte Fotoexkursionen können
      arrangiert werden.
    around: >-
      Sieben Kilometer entfernt erheben sich die [Șureanu-Berge](/lugar/muntii-sureanu/), siebzehn Kilometer
      die [Sohodol-Schlucht](/lugar/cheile-sohodolului/) und sechsundzwanzig der [Nationalpark
      Retezat](/lugar/parcul-national-retezat---masivul-muntos/). Weiter entfernt teilt der [Nationalpark
      Nera-Schlucht – Beușnița](/lugar/parcul-national-cheile-nerei---beusnita/) mit dem Schil Hufeisennasen,
      Urwälder und Schluchtenbiotope.
  it:
    intro: >-
      I Romani ci provarono e desistettero. Volevano aprire un passaggio attraverso la valle del Jiu, ma si
      resero conto che scavare e mantenere una via in un canyon così aspro avrebbe richiesto fatiche
      insostenibili, e abbandonarono l'impresa. Ciò che non osarono domare è oggi il Parco nazionale Defileul
      Jiului: una breccia scavata tra i monti Retezat, Vâlcan, Parâng e Șureanu che collega la Transilvania
      all'Oltenia, costellata di rupi, bastioni calcarei, ghiaioni, gole, cascate, inghiottitoi, pascoli
      d'alta quota e fitti boschi. Fu istituito nel 2005 e occupa 11.127 ha lungo il fiume Jiu, serrato tra i
      monti Vâlcan e Parâng.
    landscape: >-
      La strada nazionale DN66, che collega Deva a Filiași, attraversa la riserva; la gola è stata a lungo una
      direttrice di passaggio: il tracciato carrabile fu ultimato nel 1890 e inaugurato il 4 settembre 1894,
      mentre l'estrazione carbonifera industriale nella valle del Jiu era avviata sin dalla metà del XIX
      secolo. Su entrambi i versanti del fiume, tuttavia, domina una natura incontaminata.


      Oltre l'80% del parco è coperto da faggete e boschi di rovere, e i percorsi attraversano porzioni di 22
      habitat di importanza comunitaria e nazionale. Tra questi spiccano faggete di pendio, querceti e foreste
      alluvionali di ontano nero lungo le rive del Jiu. Tra le formazioni rocciose emerge un monumento
      naturale: la riserva Sfinxul Lainicilor, una scultura megalitica naturale a forma di sfinge.
    wildlife: >-
      È il regno dei grandi carnivori europei. Il parco vanta popolazioni stabili di
      [lupo](/especie/canis_lupus/), [orso bruno](/especie/ursus_arctos/), [lince
      eurasiatica](/especie/lynx_lynx/) e [lontra](/especie/lutra_lutra/). La fauna ungulata comprende
      [camoscio](/especie/rupicapra_rupicapra/), [cervo nobile](/especie/cervus_elaphus/) e
      [capriolo](/especie/capreolus_capreolus/), affiancati da gatto selvatico e martora. Tra gli uccelli
      dominano l'[aquila reale](/especie/aquila_chrysaetos/), il falco pellegrino, l'astore e il [merlo
      acquaiolo](/especie/cinclus_cinclus/). La gola del Jiu funge da primaria rotta migratoria transcarpatica
      per l'avifauna.


      Tra gli animali minori si contano l'ululone dal ventre giallo, il tritone crestato, il colubro
      d'Esculapio, l'osmoderma e la [rosalia alpina](/especie/rosalia_alpina/). Il parco tutela oltre
      novecento specie faunistiche nelle sue foreste vetuste. Il catalogo botanico conta novecentocinquantotto
      specie vascolari superiori, di cui sessantacinque di alto pregio conservazionistico; gli studiosi
      stimano che l'area ospiti il 25% dell'intera flora della Romania. Tra le rarità spicca Tozzia
      carpathica, pianta relitta d'alta quota nota localmente come iarba-gâtului.


      Il periodo migliore va da maggio a ottobre, e l'itinerario 'Defileul Jiului și comorile sale' è fruibile
      sia d'estate che d'inverno.
    visit: >-
      Il Centro visite di Bumbești Jiu è stato inaugurato nel 2014 per illustrare natura e patrimonio storico.
      Ospita un plastico in rilievo 3D con le peculiarità geomorfologiche e storiche della gola, assieme a
      mostre fotografiche stagionali.


      I sentieri tematici rappresentano il modo migliore per esplorare l'area. Il percorso Sfinxul Lainicilor
      inizia a nord del monastero di Lainici e richiede due ore con scarponi obbligatori; lungo tre chilometri
      e mezzo, offre viste panoramiche sul Jiu e sulla gola di Surduc. 'Defileul Jiului și comorile sale'
      richiede cinque ore su 15 km tra andata e ritorno, 9 dei quali percorribili in automobile. 'Poveștile
      Pădurii' copre 5,8 km di media difficoltà in quattro o cinque ore; lo scoiattolo Alunița racconta le
      abitudini della fauna boschiva. Il più breve, 'La Observator', misura 250 metri e conduce a un belvedere
      affacciato su Bumbești Jiu.
    history: >-
      L'ente parco pubblica gli obiettivi di tutela per il Sito di Interesse Comunitario ROSCI0063 Defileul
      Jiului. All'interno dell'area sorge il monastero ortodosso di Lainici, eretto nel 1817; nei pressi di
      Bumbești-Jiu affiorano i resti di tre accampamenti romani fortificati.
    before: >-
      L'escursionismo è consentito unicamente lungo i tracciati tematici segnalati. Pianificate da uno a due
      giorni. Si giunge tramite la strada europea E79 da Târgu Jiu a Bumbești Jiu o da Deva via Hațeg verso
      Petroșani. L'ente parco può predisporre uscite guidate per fotografi naturalisti.
    around: >-
      A sette chilometri sorgono i [Monti Șureanu](/lugar/muntii-sureanu/), a diciassette la [Gola di
      Sohodol](/lugar/cheile-sohodolului/) e a ventisei il [Parco nazionale
      Retezat](/lugar/parcul-national-retezat---masivul-muntos/). Più distante, il [Parco nazionale Gole del
      Nera - Beușnița](/lugar/parcul-national-cheile-nerei---beusnita/) condivide con il Jiu chirotteri
      forestieri, faggete vetuste e orridi rupestri.
  pt:
    intro: >-
      Os romanos tentaram e desistiram. Pretendiam abrir uma passagem pelo vale do Jiu, mas perceberam que
      escavar e manter uma via num desfiladeiro tão agreste exigiria esforços descomunais, abandonando o
      projeto. O que eles não ousaram domar é hoje o Parque Nacional Defileul Jiului: um desfiladeiro
      esculpido entre as serras de Retezat, Vâlcan, Parâng e Șureanu que une a Transilvânia à Olténia,
      pontilhado de escarpas calcárias, taludes pedregosos, gargantas, cascatas, sumidouros, pastagens alpinas
      e matas antigas. Foi criado em 2005 e abrange 11.127 ha ao longo do rio Jiu, entalado entre os montes
      Vâlcan e Parâng.
    landscape: >-
      A estrada nacional DN66, ligando Deva a Filiași, cruza o parque; a garganta tem servido como rota
      histórica: a estrada pelo desfiladeiro foi concluída em 1890 e inaugurada a 4 de setembro de 1894, numa
      época em que a extração mineira de carvão já prosperava desde meados do século XIX. Mas em ambas as
      margens do rio, a montanha selvagem reina intacta.


      Mais de 80% do parque é revestido por florestas de faia e carvalho-roble, e os trilhos cruzam parcelas
      de 22 habitats de interesse nacional e comunitário. Destacam-se faiais montanos, carvalhais e florestas
      aluviais de amieiro-negro nas margens do Jiu. Entre as formações rochosas sobressai o monumento natural
      Sfinxul Lainicilor, uma formação megalítica esculpida em forma de esfinge.
    wildlife: >-
      É um santuário de grandes predadores. Entre os carnívoros do parque figuram o
      [lobo](/especie/canis_lupus/), o [urso-pardo](/especie/ursus_arctos/), o
      [lince-euroasiático](/especie/lynx_lynx/) e a [lontra](/especie/lutra_lutra/). Os ungulados incluem a
      [camurça](/especie/rupicapra_rupicapra/), o [veado-vermelho](/especie/cervus_elaphus/) e o
      [corço](/especie/capreolus_capreolus/), acompanhados pelo gato-bravo e pela marta. A avifauna ostenta a
      [águia-real](/especie/aquila_chrysaetos/), o falcão-peregrino, o açor e o
      [melro-d'água](/especie/cinclus_cinclus/). O desfiladeiro constitui um dos principais corredores
      migratórios transcarpáticos para aves.


      A fauna menor compreende o sapo-de-ventre-amarelo, o tritão-de-crista, a cobra-de-esculápio, o
      escaravelho-eremita e a [rosália-alpina](/especie/rosalia_alpina/). Mais de novecentas espécies de
      animais habitam estas florestas maduras. A flora contabiliza novecentas e cinquenta e oito espécies de
      plantas vasculares, ressaltando sessenta e cinco com estatuto de proteção; especialistas indicam que o
      parque concentra 25% da flora vascular da Roménia. Entre as raridades botânicas figura Tozzia
      carpathica, planta alpina protegida conhecida localmente como iarba-gâtului.


      A melhor época estende-se de maio a outubro, e o percurso 'Defileul Jiului și comorile sale' pode ser
      realizado no verão e no inverno.
    visit: >-
      O Centro de Visitantes de Bumbești Jiu abriu portas em 2014 para divulgar a biodiversidade e o
      património do vale. Inclui uma maquete 3D com a orografia e pontos de interesse, além de exposições
      fotográficas periódicas.


      Os trilhos temáticos proporcionam excelente contacto com a serra. O percurso Sfinxul Lainicilor arranca
      a norte do Mosteiro de Lainici e leva cerca de duas horas em terreno moderado, exigindo calçado de
      montanha; tem três quilómetros e meio, abrindo vistas sobre o rio Jiu e a garganta de Surduc. 'Defileul
      Jiului și comorile sale' requer cinco horas para 15 km de ida e volta, 9 dos quais transitáveis de
      automóvel. 'Poveștile Pădurii' estende-se por 5,8 km, de dificuldade média em quatro a cinco horas; o
      esquilo Alunița ensina as crianças sobre os segredos das faias e riachos. O mais curto, 'La Observator',
      percorre cerca de 250 metros até uma plataforma miradouro sobre Bumbești Jiu.
    history: >-
      A autoridade do parque publica os objetivos de conservação do Sítio de Importância Comunitária ROSCI0063
      Defileul Jiului. No parque encontra-se o mosteiro ortodoxo de Lainici, construído em 1817, enquanto em
      Bumbești-Jiu resistem as ruínas de três acampamentos militares romanos.
    before: >-
      O pedestrianismo só é autorizado nos itinerários temáticos oficiais. Preveja um a dois dias. O acesso
      faz-se pela estrada europeia E79, a partir de Târgu Jiu para Bumbești Jiu ou de Deva via Hațeg em
      direção a Petroșani. O parque organiza visitas guiadas para fotografia de natureza sob pedido.
    around: >-
      A sete quilómetros situam-se os [Montes Șureanu](/lugar/muntii-sureanu/), a dezassete as [Gargantas de
      Sohodol](/lugar/cheile-sohodolului/) e a vinte e seis o [Parque Nacional
      Retezat](/lugar/parcul-national-retezat---masivul-muntos/). Mais distante, o [Parque Nacional Gargantas
      do Nera – Beușnița](/lugar/parcul-national-cheile-nerei---beusnita/) partilha morcegos cavernícolas,
      florestas virgens e ravinas calcárias com o Jiu.
