resumen:
  es: >-
    Extensas dehesas de encina y alcornoque salpicadas de castañares centenarios en el extremo occidental de
    Sierra Morena.
  en: >-
    Sprawling holm and cork oak dehesas interspersed with centennial chestnut groves in the western reaches of
    Sierra Morena.
  fr: >-
    Vastes dehesas de chênes verts et de chênes-lièges parsemées de châtaigneraies centenaires à l’extrémité
    occidentale de la Sierra Morena.
  de: >-
    Weite Steineichen- und Korkeichen-Dehesas, durchsetzt mit jahrhundertealten Kastanienhainen am Westrand
    der Sierra Morena.
  it: >-
    Vaste dehesas di lecci e querce da sughero alternate a castagneti secolari all’estremità occidentale della
    Sierra Morena.
  pt: >-
    Extensas dehesas de azinheira e sobreiro pontuadas por soutos centenários de castanheiros no extremo
    ocidental da Sierra Morena.
unico:
  es: >-
    La sierra de Aracena tiene el sistema de pueblos y aldeas más extenso de toda Sierra Morena, unidos por
    una red de caminos que aún se puede caminar.
  en: >-
    Sierra de Aracena holds the most extensive network of historic mountain towns and hamlets in Sierra
    Morena, linked by ancient walkable stone trails.
  fr: >-
    La sierra d’Aracena possède le réseau de villages et hameaux le plus étendu de toute la Sierra Morena,
    reliés par d’anciens chemins pavés praticables à pied.
  de: >-
    Die Sierra de Aracena besitzt das dichteste Netz historischer Dörfer der gesamten Sierra Morena, verbunden
    durch begehbare alte Pflasterwege.
  it: >-
    La Sierra de Aracena vanta la rete di borghi montani più fitta di tutta la Sierra Morena, uniti da
    sentieri storici lastricati ancora percorribili a piedi.
  pt: >-
    A serra de Aracena possui a rede de aldeias e vilas históricas mais densa de toda a Sierra Morena, unidas
    por caminhos empedrados percorríveis a pé.
observaciones:
  es: >-
    No molestes ni des comida a los animales: alterarías su conducta. Infórmate de la posible actividad
    cinegética antes de salir, porque todos los equipamientos de uso público son zonas de seguridad. Consulta
    el tiempo y no te salgas del camino señalizado.
texto:
  es:
    intro: >-
      Aquí Sierra Morena se acaba, o empieza: el Parque Natural Sierra de Aracena y Picos de Aroche ocupa su
      extremo occidental, en el norte de la provincia de Huelva. Son cadenas de media altura donde el dominio
      de pizarras y cuarcitas da al suelo un color oscuro, y sobre ellas crece una masa forestal extensa, bajo
      una pluviosidad alta y un clima suave. Es un monte de dehesas, castañares y ríos con bosque de galería,
      salpicado de pueblos y aldeas.
    landscape: >-
      El paisaje cambia con la altitud y la humedad. Las dehesas pobladas de encinas dejan paso a los
      alcornoques en unas zonas, y en las más altas son frecuentes los bosques de robles rebollos, como en la
      Solana de los Bonales. Pasas por Fuenteheridos, Galaroza o Castaño del Robledo y el monte lo forman los
      castaños. Y en los cauces, como el del Múrtigas, aparecen bosques de galería con chopos, fresnos, sauces
      y alisos, junto con zarzas y plantas trepadoras.


      Las dehesas han favorecido la cría del cerdo ibérico, que sustenta la economía de pueblos como Cumbres
      Mayores o Jabugo. Entre la vegetación natural hay también zonas repobladas con eucaliptos, antes
      destinadas a pasta de papel y hoy aprovechadas como biomasa para energía.


      Tres cuencas hidrográficas surcan el parque: la del Guadalquivir, la del Guadiana, con el Múrtigas, y la
      del Odiel.
    wildlife: >-
      Esta variedad forestal da riqueza fáunica. Entre los mamíferos se pueden observar el meloncillo, la
      [gineta](/especie/genetta_genetta/) y la huidiza [nutria](/especie/lutra_lutra/). En el cielo, buitres,
      [milanos](/especie/milvus_milvus/) y [cigüeñas negras](/especie/ciconia_nigra/). Para verlos, el mirador
      del Castañuelo funciona como observatorio abierto de rapaces: destacan buitres, [águilas
      reales](/especie/aquila_chrysaetos/) y milanos.


      Las estaciones se notan en el bosque: del castañar a los robles de altura, los aprovechamientos
      tradicionales son la ganadería, las huertas, la recogida de castañas y setas y los antiguos molinos de
      agua.
    visit: >-
      Empieza por el centro de visitantes Cabildo Viejo, en la Plaza Alta de Aracena, un edificio histórico
      del siglo XVI que fue sede del primer ayuntamiento. Su exposición explica la geología y el relieve, la
      flora y la fauna, el clima suave y la alta pluviosidad, y da protagonismo a la dehesa, el castañar y el
      bosque de ribera. Desde allí parten senderos señalizados hacia Fuenteheridos, Linares de la Sierra y
      Corteconcepción.


      El sendero Alto del Chorrito es lineal, de casi cuatro kilómetros, de unas dos horas y media y
      dificultad baja. Parte de un punto cercano a Los Marines, baja al barranco del Valle del Silo y termina
      en Linares de la Sierra, entre castaños y alcornoques, huertas con olivos y muros de piedra poblados de
      helechos. Su nombre lo da un afloramiento de roca con un pequeño salto de agua. Los Marines debe el suyo
      a repobladores gallegos de apellido Marín del siglo XVI. Enlaza con el sendero de Aracena a Linares de
      la Sierra, que recorre el valle entre huertos y dehesas de encinas, cuyas bellotas alimentan a los
      cerdos ibéricos.


      Desde el mirador del Castañuelo se ve el mosaico de dehesas, alcornoques y robles, y al fondo, montes de
      Extremadura. A un kilómetro, un sendero señalizado lleva al yacimiento de El Castañuelo, un asentamiento
      de en torno al II milenio a. C. Bajo Aracena, la gruta de las Maravillas se abrió al público en 1914, la
      primera cueva de España en hacerlo; tiene 1400 m visitables, y su temperatura es constante todo el año,
      entre 16 y 19 grados.
    history: >-
      El parque se declaró en 1989. En 2001 se declaró dentro de él el Monumento Natural Encina y Alcornoque
      de la Dehesa de San Francisco; en 2002 pasó a formar parte de la Reserva de la Biosfera Dehesas de
      Sierra Morena, y en 2003 fue designado Zona de Especial Protección para las Aves. En 2004 se adhirió a
      la Carta Europea de Turismo Sostenible.


      En Alájar, la Peña de Arias Montano es el lugar donde se retiró el humanista Benito Arias Montano, y
      bajo ella se abre un entramado de cuevas, entre las que destaca el Palacio Oscuro.
    before: >-
      No molestes ni des comida a los animales: alterarías su conducta. Infórmate de la posible actividad
      cinegética antes de salir, porque todos los equipamientos de uso público son zonas de seguridad.
      Consulta el tiempo y no te salgas del camino señalizado.
    around: >-
      Lejos de aquí, el [Parque Natural Despeñaperros y Sierra Morena
      Oriental](/lugar/sierra-morena-oriental---despenaperros/), el [Parque Nacional de
      Cabañeros](/lugar/parque-nacional-de-cabaneros/) y la [Reserva Natural de la Sierra de
      Malcata](/lugar/reserva-natural-da-serra-da-malcata/) comparten con la sierra bosque mediterráneo maduro
      y especies como la cigüeña negra y el buitre negro.
  en:
    intro: >-
      Here Sierra Morena comes to an end, or begins: Sierra de Aracena and Picos de Aroche Natural Park
      occupies its westernmost reach in northern Huelva province. These medium-altitude mountain ranges
      feature dark schists and quartzites that tint the soil deep hues beneath dense forest cover, nourished
      by generous rainfall and a gentle microclimate. It is an undulating territory of dehesas, chestnut woods
      and river gallery corridors, sprinkled with whitewashed villages.
    landscape: >-
      The terrain shifts with elevation and moisture. Extensive holm oak dehesas yield to cork oaks in humid
      swales, while highest north-facing slopes host Pyrenean oak woodlands, such as at Solana de los Bonales.
      Around Fuenteheridos, Galaroza and Castaño del Robledo, centuries-old sweet chestnut groves mantle the
      hillsides. Along watercourses like the Múrtigas, verdant gallery forests thrive with black poplars,
      narrow-leaved ashes, willows and alders, intertwined with wild brambles and climbing ivy.


      Open oak savannas provide acorn pasture for the free-ranging Iberian pig, which underpins the rural
      economy of celebrated hamlets such as Cumbres Mayores and Jabugo. Alongside native forest, historical
      eucalyptus plantations formerly harvested for paper pulp now supply renewable biomass.


      Three distinct river basins drain the park: the Guadalquivir, the Guadiana via the Múrtigas river, and
      the Odiel.
    wildlife: >-
      Diverse forest formations support rich southern wildlife. Mammals include the Egyptian mongoose, the
      [common genet](/especie/genetta_genetta/) and the elusive [Eurasian otter](/especie/lutra_lutra/) along
      clean streams. In the skies soar griffon vultures, [kites](/especie/milvus_milvus/) and elusive [black
      storks](/especie/ciconia_nigra/). El Castañuelo viewpoint serves as an open-air raptor watchpoint for
      circling vultures, [golden eagles](/especie/aquila_chrysaetos/) and red kites.


      Passing seasons transform forest rhythms: from chestnut harvesting to acorn pannage and autumn
      mycological gatherings, traditional agroforestry coexists with ancient stone watermills.
    visit: >-
      Begin at Cabildo Viejo Visitor Centre in Plaza Alta in Aracena, housed in a historic sixteenth-century
      town hall. Exhibits detail local geology, flora and fauna, the temperate microclimate and high rainfall,
      highlighting the dehesa, chestnut groves and riparian galleries. Signposted walking trails depart
      directly toward Fuenteheridos, Linares de la Sierra and Corteconcepción.


      The Alto del Chorrito trail is a linear walk of nearly four kilometres, taking about two and a half
      hours of easy hiking. Starting near Los Marines, it descends into the Valle del Silo ravine to finish in
      Linares de la Sierra among chestnut and cork oak trees, olive orchards and fern-covered stone terraces.
      It takes its name from a rock outcrop with a small cascade. Los Marines owes its name to
      sixteenth-century Galician settlers surnamed Marín. It connects with the trail between Aracena and
      Linares de la Sierra, meandering past orchards and holm oak dehesas whose sweet acorns fatten Iberian
      pigs.


      From the Castañuelo viewpoint, take in the pastoral patchwork of dehesas and oak woods extending toward
      the mountains of Extremadura. One kilometre away, a trail leads to the archaeological settlement of El
      Castañuelo, dating back to the second millennium BC. Beneath Aracena, the Gruta de las Maravillas opened
      to the public in 1914 as the first show cave in Spain; it features 1400 m of visitable subterranean
      chambers, maintained at a constant year-round temperature between 16 and 19 degrees.
    history: >-
      The area was designated a natural park in 1989. In 2001, the monumental Holm Oak and Cork Oak of Dehesa
      de San Francisco was declared a Natural Monument; in 2002 the territory joined the UNESCO Dehesas de
      Sierra Morena Biosphere Reserve, and in 2003 it was classified as a Special Protection Area for birds.
      In 2004 the park was awarded the European Charter for Sustainable Tourism.


      At Alájar, the scenic crag of Peña de Arias Montano was the spiritual retreat of Renaissance humanist
      Benito Arias Montano, perched above a cavernous labyrinth including the Palacio Oscuro cave.
    before: >-
      Never disturb or offer food to wildlife, as this disrupts natural behaviour. Check local hunting
      calendar notices before setting out, as designated public recreation facilities remain safety zones.
      Consult weather forecasts and keep to marked footpaths.
    around: >-
      Further afield, [Despeñaperros and Eastern Sierra Morena Natural
      Park](/lugar/sierra-morena-oriental---despenaperros/), [Cabañeros National
      Park](/lugar/parque-nacional-de-cabaneros/) and [Serra da Malcata Nature
      Reserve](/lugar/reserva-natural-da-serra-da-malcata/) share mature Mediterranean oak woodlands, black
      vultures and black storks with Aracena.
  fr:
    intro: >-
      Ici s'achève, ou commence, la Sierra Morena : le parc naturel Sierra de Aracena y Picos de Aroche occupe
      son extrémité occidentale, dans le nord de la province de Huelva. Ce sont des massifs de moyenne
      altitude où les schistes et quartzites donnent au sol une couleur sombre sous un couvert forestier
      continu, nourri par des pluies abondantes et un climat océanique tempéré. C'est un territoire de
      dehesas, de châtaigneraies et de ripisylves sinueuses, constellé de bourgs blanchis à la chaux.
    landscape: >-
      Le relief s'étage en fonction de l'altitude et de l'humidité. Les dehesas de chênes verts cèdent la
      place aux chênes-lièges dans les vallées ombragées, tandis que les sommets portent des chênaies de
      chênes tauzins, notamment à la Solana de los Bonales. Autour de Fuenteheridos, Galaroza ou Castaño del
      Robledo, la montagne se couvre de châtaigneraies séculaires. Le long des cours d'eau comme le Múrtigas
      s'épanouit une ripisylve de peupliers noirs, frênes, saules et aulnes, entremêlée de ronces et de
      lianes.


      Ces savanes boisées ont favorisé l'élevage du porc ibérique nourri aux glands (*bellota*), pilier
      économique de bourgs comme Cumbres Mayores ou Jabugo. Aux côtés des forêts indigènes subsistent
      d'anciens reboisements d'eucalyptus, exploités autrefois pour la pâte à papier et valorisés aujourd'hui
      en biomasse.


      Trois bassins hydrographiques irriguent le massif : le Guadalquivir, le Guadiana via le Múrtigas, et
      l'Odiel.
    wildlife: >-
      Cette diversité forestière entretient une faune remarquable. Parmi les mammifères s'observent la
      mangouste ichneumon, la [genette commune](/especie/genetta_genetta/) et la discrète [loutre
      d'Europe](/especie/lutra_lutra/) au bord des eaux vives. Dans les airs patrouillent vautours,
      [milans](/especie/milvus_milvus/) et rares [cigognes noires](/especie/ciconia_nigra/). Le belvédère du
      Castañuelo constitue un observatoire naturel réputé pour contempler vautours fauves, [aigles
      royaux](/especie/aquila_chrysaetos/) et milans royaux.


      Le fil des saisons rythme la vie sylvicole : récolte des châtaignes en automne, ramassage des
      champignons et pâturage traditionnel près des anciens moulins à eau.
    visit: >-
      Commencez par le centre d'accueil Cabildo Viejo, sur la Plaza Alta d'Aracena, installé dans un édifice
      historique du XVIe siècle ayant servi de premier hôtel de ville. L'exposition permanente présente la
      géologie, la faune et la flore, le climat doux et les fortes pluies, tout en mettant à l'honneur dehesa,
      châtaigneraie et ripisylve. Plusieurs itinéraires balisés partent vers Fuenteheridos, Linares de la
      Sierra et Corteconcepción.


      Le sentier de l'Alto del Chorrito est un parcours linéaire de presque quatre kilomètres, d'environ deux
      heures et demie et de difficulté facile. Débutant près de Los Marines, il descend dans le ravin du Valle
      del Silo pour rejoindre Linares de la Sierra entre châtaigniers, chênes-lièges, vergers d'oliviers et
      murets de fougères. Son nom vient d'une cascade jaillissant d'une roche. Los Marines doit le sien à des
      colons galiciens nommés Marín au XVIe siècle. Il rejoint le chemin d'Aracena à Linares de la Sierra,
      serpentant entre potagers et dehesas de chênes dont les glands nourrissent les porcs ibériques.


      Depuis le mirador du Castañuelo, la vue embrasse la mosaïque de dehesas et chênaies jusqu'aux reliefs de
      l'Estrémadure. À un kilomètre, un sentier balisé permet de visiter le site archéologique d'El
      Castañuelo, village fortifié remontant au IIe millénaire av. J.-C. Sous Aracena, la Gruta de las
      Maravillas fut ouverte au public en 1914, pionnière des grottes touristiques espagnoles ; elle compte
      1400 m de galeries accessibles, avec une température constante tout au long de l'année entre 16 et 19
      degrés.
    history: >-
      Le parc a été créé en 1989. En 2001, le chêne vert et le chêne-liège de la dehesa de San Francisco ont
      été classés monument naturel ; en 2002, le territoire a intégré la réserve de biosphère Dehesas de
      Sierra Morena, puis a été classé zone de protection spéciale pour les oiseaux en 2003. En 2004, il a
      adhéré à la Charte européenne du tourisme durable.


      À Alájar, la Peña de Arias Montano marque le lieu de retraite de l'humaniste Benito Arias Montano,
      dominant un labyrinthe souterrain abritant la grotte du Palacio Oscuro.
    before: >-
      Ne dérangez pas les animaux et ne les nourrissez sous aucun prétexte. Renseignez-vous sur les battues de
      chasse avant de partir, les sentiers balisés constituant des zones de sécurité. Consultez la météo et
      demeurez sur les sentiers balisés.
    around: >-
      Plus à l'est, le [parc naturel de Despeñaperros et de la Sierra Morena
      orientale](/lugar/sierra-morena-oriental---despenaperros/), le [parc national de
      Cabañeros](/lugar/parque-nacional-de-cabaneros/) et la [réserve naturelle de la Serra da
      Malcata](/lugar/reserva-natural-da-serra-da-malcata/) partagent des dehesas méditerranéennes et des
      espèces emblématiques comme la cigogne noire.
  de:
    intro: >-
      Hier endet oder beginnt die Sierra Morena: Der Naturpark Sierra de Aracena y Picos de Aroche erstreckt
      sich am westlichen Rand des Gebirgszuges im Norden der Provinz Huelva. Es sind Mittelgebirgszüge, deren
      Schiefer- und Quarzitböden der Landschaft dunkle Töne verleihen, überzogen von geschlossenen Wäldern
      unter reichlichen Niederschlägen und mildem Klima. Es ist ein Land der Dehesas, Kastanienwälder und
      Flussgalerien, gesäumt von weißen Dörfern.
    landscape: >-
      Die Landschaft wandelt sich mit Höhenlage und Feuchtigkeit. Weitläufige Steineichen-Dehesas gehen in
      feuchteren Lagen in Korkeichenbestände über, während auf den feuchten Nordkämmen Pyrenäen-Eichen wie an
      der Solana de los Bonales wachsen. Um Fuenteheridos, Galaroza und Castaño del Robledo prägen alte
      Edelkastanien das Landschaftsbild. Entlang der Fließgewässer wie dem Múrtigas gedeihen Galeriewälder aus
      Pappeln, Eschen, Weiden und Erlen, durchrankt von Brombeeren und Kletterpflanzen.


      Die offenen Eichenhaine bilden die Grundlage für die Weidehaltung des iberischen Schweins, das den
      Wohlstand von Orten wie Cumbres Mayores und Jabugo begründet. Neben den Urwäldern existieren ehemalige
      Eukalyptusaufforstungen, die heute zur nachhaltigen Biomassegewinnung genutzt werden.


      Drei Flusseinzugsgebiete durchziehen den Park: jenes des Guadalquivir, des Guadiana über den Múrtigas
      und des Odiel.
    wildlife: >-
      Diese Waldvielfalt begünstigt eine reiche Fauna. Unter den Säugetieren leben die Ichneumon-Manguste, die
      [Kleinfleck-Ginsterkatze](/especie/genetta_genetta/) und der scheue [Fischotter](/especie/lutra_lutra/)
      an klaren Bächen. Am Himmel kreisen Geier, [Milane](/especie/milvus_milvus/) und seltene
      [Schwarzstörche](/especie/ciconia_nigra/). Der Aussichtspunkt Mirador del Castañuelo dient als
      hervorragende Warte zur Beobachtung von [Steinadler](/especie/aquila_chrysaetos/), Gänsegeiern und
      Rotmilanen.


      Der Wechsel der Jahreszeiten bestimmt die forstliche Nutzung: von der Kastanienernte über die Pilzsuche
      im Herbst bis zu historischen Wassermühlen am Flusslauf.
    visit: >-
      Beginne am Besucherzentrum Cabildo Viejo an der Plaza Alta in Aracena, untergebracht in einem
      historischen Rathausgebäude aus dem sechzehnten Jahrhundert. Die Dauerausstellung veranschaulicht
      Geologie, Flora, Fauna und das milde Regenreichtumsklima mit Schwerpunkt auf Dehesa, Kastanienwäldern
      und Ufervegetation. Von dort starten markierte Wanderwege nach Fuenteheridos, Linares de la Sierra und
      Corteconcepción.


      Der Weg Alto del Chorrito ist eine Streckenwanderung von fast vier Kilometern Länge mit rund zweieinhalb
      Stunden Gehzeit bei geringer Schwierigkeit. Nahe Los Marines beginnend führt er in den Talgrund des
      Valle del Silo und endet in Linares de la Sierra zwischen Kastanien, Korkeichen, Olivenhainen und
      farnbewachsenen Steinmauern. Seinen Namen verdankt er einem Felsvorsprung mit kleinem Wasserfall. Los
      Marines geht auf galicische Siedler namens Marín im sechzehnten Jahrhundert zurück. Der Weg knüpft an
      die Route von Aracena nach Linares de la Sierra an, die an Eichen-Dehesas vorbeiführt, deren Eicheln die
      iberischen Schweine mästen.


      Vom Mirador del Castañuelo schweift der Blick über das Mosaik aus Dehesas und Eichenwäldern bis zu den
      Bergen der Extremadura. Einen Kilometer entfernt erschließt ein Pfad die archäologische
      Ausgrabungsstätte El Castañuelo aus dem zweiten Jahrtausend v. Chr. Unter der Stadt Aracena wurde 1914
      die Tropfsteinhöhle Gruta de las Maravillas für Besucher geöffnet; sie bietet 1400 m begehbare Hallen
      bei einer ganzjährig konstanten Temperatur zwischen 16 und 19 Grad.
    history: >-
      Der Naturpark wurde 1989 gegründet. Im Jahr 2001 wurde die jahrhundertealte Eiche der Dehesa de San
      Francisco als Naturdenkmal geschützt; 2002 wurde das Gebiet Teil des UNESCO-Biosphärenreservats Dehesas
      de Sierra Morena und 2003 zum Europäischen Vogelschutzgebiet ernannt. Im Jahr 2004 trat der Park der
      Europäischen Charta für nachhaltigen Tourismus bei.


      In Alájar liegt die Felsformation Peña de Arias Montano, wohin sich der Humanist Benito Arias Montano
      zurückzog, über einem verzweigten Höhlensystem mit der Palacio-Oscuro-Grotte.
    before: >-
      Störe die Tiere nicht und füttere sie unter keinen Umständen. Informiere dich vorab über Jagdtermine, da
      ausgewiesene Wanderwege Sicherheitszonen darstellen. Prüfe den Wetterbericht und bleibe auf den
      markierten Pfaden.
    around: >-
      Weiter östlich teilen der [Naturpark Despeñaperros und östliche Sierra
      Morena](/lugar/sierra-morena-oriental---despenaperros/), der [Nationalpark
      Cabañeros](/lugar/parque-nacional-de-cabaneros/) und das [Naturschutzgebiet Serra da
      Malcata](/lugar/reserva-natural-da-serra-da-malcata/) mediterrane Eichenwälder und Arten wie den
      Schwarzstorch mit der Sierra.
  it:
    intro: >-
      Qui la Sierra Morena finisce, o comincia: il Parco Naturale Sierra de Aracena y Picos de Aroche occupa
      la sua propaggine occidentale nel nord della provincia di Huelva. Sono dorsali di media altitudine in
      cui scisti e quarziti scuriscono il terreno sotto una copertura forestale ininterrotta, favorita da
      piogge generose e da un clima temperato. È un territorio di pascoli alberati, castagneti e boschi
      ripariali, costellato di borghi bianchi.
    landscape: >-
      Il paesaggio varia con l'altitudine e l'umidità. Le estese dehesas di leccio lasciano spazio alla
      quercia da sughero nelle forre fresche, mentre sulle creste più elevate compaiono i roverelli, come a
      Solana de los Bonales. Attorno a Fuenteheridos, Galaroza e Castaño del Robledo la vegetazione è dominata
      da castagneti secolari. Lungo i corsi d'acqua come il Múrtigas si sviluppano boschi a galleria di pioppi
      neri, frassini, salici e ontani, intrecciati a rovi e piante rampicanti.


      I boschi radi di querce hanno favorito l'allevamento del maiale iberico, asse economico di località
      celebri come Cumbres Mayores e Jabugo. Accanto alla vegetazione autoctona compaiono vecchi
      rimboschimenti a eucalipto, un tempo piantati per la pasta di carta e oggi sfruttati per la biomassa.


      Tre bacini idrografici attraversano il parco: quello del Guadalquivir, quello del Guadiana tramite il
      Múrtigas, e quello dell'Odiel.
    wildlife: >-
      Questa diversità forestale accoglie una notevole ricchezza faunistica. Tra i mammiferi si possono
      avvistare la mangusta egiziana, la [genetta comune](/especie/genetta_genetta/) e la schiva [lontra
      europea](/especie/lutra_lutra/) nelle acque limpide. In cielo volteggiano avvoltoi,
      [nibbi](/especie/milvus_milvus/) e rare [cicogne nere](/especie/ciconia_nigra/). Il belvedere del
      Castañuelo funge da punto panoramico per osservare l’[aquila reale](/especie/aquila_chrysaetos/), i
      grifoni e i nibbi reali.


      Il mutare delle stagioni scandisce la vita agro-forestale: dalla raccolta autunnale delle castagne alla
      ricerca dei funghi e agli antichi mulini ad acqua lungo i fiumi.
    visit: >-
      Inizia dal centro visitatori Cabildo Viejo nella Plaza Alta di Aracena, ospitato in un edificio storico
      del XVI secolo che fu sede del primo municipio. L'esposizione illustra geologia, flora, fauna, clima
      mite e precipitazioni, valorizzando dehesa, castagneti e boschi di ripa. Da qui partono sentieri
      segnalati per Fuenteheridos, Linares de la Sierra e Corteconcepción.


      Il sentiero Alto del Chorrito è un itinerario lineare di quasi quattro chilometri, percorribile in circa
      due ore e mezza con difficoltà facile. Inizia nei pressi di Los Marines, scende nella forra del Valle
      del Silo e giunge a Linares de la Sierra tra castagni, querce da sughero, orti di olivi e muretti a
      secco coperti di felci. Prende il nome da un salto d'acqua su uno sperone roccioso. Los Marines deve il
      proprio toponimo a coloni galiziani di cognome Marín giunti nel XVI secolo. Si raccorda al tracciato da
      Aracena a Linares de la Sierra, attraversando pascoli di querce le cui ghiande nutrono i maiali iberici.


      Dal mirador del Castañuelo si contempla il mosaico agro-silvo-pastorale fino ai monti dell'Estremadura.
      A un chilometro un sentiero conduce al sito archeologico di El Castañuelo, insediamento fortificato
      risalente al II millennio a.C. Sotto l'abitato di Aracena, la Gruta de las Maravillas fu aperta al
      pubblico nel 1914, prima grotta turistica di Spagna; presenta 1400 m visitabili con una temperatura
      costante tra 16 e 19 gradi.
    history: >-
      Il parco è stato istituito nel 1989. Nel 2001 il leccio e la sughera monumentali della Dehesa de San
      Francisco sono stati dichiarati monumento naturale; nel 2002 il territorio è entrato nella Riserva della
      Biosfera Dehesas de Sierra Morena e nel 2003 è stato designato Zona di Protezione Speciale per
      l'avifauna. Nel 2004 ha aderito alla Carta Europea per il Turismo Sostenibile.


      Ad Alájar, la rupe di Peña de Arias Montano fu il rifugio dell'umanista Benito Arias Montano,
      sovrastante un reticolo di cavità carsiche tra cui spicca la grotta del Palacio Oscuro.
    before: >-
      Non disturbare e non nutrire in alcun modo gli animali per non alterarne i comportamenti. Informati
      sulle battute di caccia prima di partire, poiché le strutture ricreative costituiscono zone di
      sicurezza. Consulta il meteo e resta sui percorsi segnalati.
    around: >-
      Più a est, il [Parco Naturale Despeñaperros e Sierra Morena
      Orientale](/lugar/sierra-morena-oriental---despenaperros/), il [Parco Nazionale di
      Cabañeros](/lugar/parque-nacional-de-cabaneros/) e la [Riserva Naturale della Serra da
      Malcata](/lugar/reserva-natural-da-serra-da-malcata/) condividono boschi maturi di querce e specie come
      la cicogna nera.
  pt:
    intro: >-
      Aqui a Sierra Morena termina, ou principia: o Parque Natural da Serra de Aracena e Picos de Aroche ocupa
      o seu extremo ocidental no norte da província de Huelva. São serranias de média altitude onde xistos e
      quartzitos conferem tons escuros ao solo sob uma densa cobertura florestal, alimentada por chuvas
      copiosas e um clima ameno. É um território de montados, soutos e galerias ripícolas, pontilhado por
      típicas povoações caiadas.
    landscape: >-
      A paisagem varia com a altitude e a humidade. Os montados de azinheira dão lugar aos sobreiros nas
      encostas mais frescas, enquanto nas cumeadas elevadas surgem carvalhais de carvalho-negral, como na
      Solana de los Bonales. Em redor de Fuenteheridos, Galaroza ou Castaño del Robledo a floresta é dominada
      por castanheiros centenários. Nas linhas de água como o Múrtigas desenvolvem-se galerias de choupos,
      freixos, salgueiros e amieiros, entrelaçados com silvas e lianas.


      Estes montados abertos favoreceram a criação extensiva do porco ibérico de bolota, motor económico de
      aldeias como Cumbres Mayores e Jabugo. Paralelamente à floresta autóctone subsistem antigos povoamentos
      de eucalipto, outrora plantados para pasta de papel e hoje aproveitados para biomassa.


      Três bacias hidrográficas sulcam o parque: a do Guadalquivir, a do Guadiana através do Múrtigas, e a do
      Odiel.
    wildlife: >-
      Esta diversidade florestal sustenta uma fauna valiosa. Nos mamíferos encontram-se o sacarrabos, a
      [gineta](/especie/genetta_genetta/) e a esquiva [lontra-europeia](/especie/lutra_lutra/) nas águas
      limpas. No céu planam abutres, [milhafres](/especie/milvus_milvus/) e raras
      [cegonhas-pretas](/especie/ciconia_nigra/). O miradouro de El Castañuelo funciona como posto aberto para
      observação de [águias-reais](/especie/aquila_chrysaetos/), grifos e milhafres-reais.


      O ciclo das estações rege a vida serrana: da apanha da castanha e cogumelos no outono até ao labor dos
      moinhos de água históricos nas ribeiras.
    visit: >-
      Começa pelo centro de visitantes Cabildo Viejo, na Plaza Alta de Aracena, instalado num edifício
      histórico do século XVI que acolheu os primeiros paços do concelho. A exposição explica relevo, flora,
      fauna e pluviosidade, destacando o montado, os soutos e as galerias ripícolas. Daqui partem trilhos
      sinalizados para Fuenteheridos, Linares de la Sierra e Corteconcepción.


      O percurso pedestre Alto del Chorrito é linear, com quase quatro quilómetros de extensão e cerca de duas
      horas e meia de caminhada fácil. Parte de perto de Los Marines, desce ao barranco do Valle del Silo e
      termina em Linares de la Sierra entre castanheiros, sobreiros, olivais e muros de pedra cobertos de
      fetos. O nome provém de uma bancada rochosa com uma pequena cascata. Los Marines deve o seu topónimo a
      colonos galegos apelidados Marín no século XVI. Liga ao caminho de Aracena a Linares de la Sierra,
      atravessando dehesas de azinho cujas bolotas engordam os porcos ibéricos.


      Do miradouro de El Castañuelo avista-se o mosaico agroflorestal até às serras da Estremadura. A um
      quilómetro, um trilho conduz ao povoado arqueológico de El Castañuelo, datado de cerca do II milénio
      a.C. Sob a vila de Aracena, a Gruta de las Maravillas abriu ao público em 1914, pioneira no turismo
      subterrâneo em Espanha; conta com 1400 m visitáveis e temperatura constante todo o ano entre 16 e 19
      graus.
    history: >-
      O parque foi classificado em 1989. Em 2001, a azinheira e o sobreiro da Dehesa de San Francisco foram
      declarados monumento natural; em 2002 o território foi integrado na Reserva da Biosfera Dehesas de
      Sierra Morena e em 2003 foi designado Zona de Proteção Especial para as aves. Em 2004 aderiu à Carta
      Europeia de Turismo Sustentável.


      Em Alájar, a escarpa da Peña de Arias Montano acolheu o retiro do humanista Benito Arias Montano,
      debruçada sobre uma rede de grutas calcárias com destaque para o Palacio Oscuro.
    before: >-
      Não perturbes nem alimentes os animais para não alterar os seus hábitos naturais. Informa-te sobre
      montarias e caçadas antes de partir, mantendo-te nas zonas de segurança assinaladas. Consulta a previsão
      meteorológica e não saias dos trilhos oficiais.
    around: >-
      Mais a leste, o [Parque Natural de Despeñaperros e Sierra Morena
      Oriental](/lugar/sierra-morena-oriental---despenaperros/), o [Parque Nacional de
      Cabañeros](/lugar/parque-nacional-de-cabaneros/) e a [Reserva Natural da Serra da
      Malcata](/lugar/reserva-natural-da-serra-da-malcata/) partilham montados maduros e espécies emblemáticas
      como a cegonha-preta.
