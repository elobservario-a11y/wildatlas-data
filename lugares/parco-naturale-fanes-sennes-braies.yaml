resumen:
  es: >-
    El idílico Lago di Braies de aguas turquesa cristalinas y los desolados mesetones kársticos de Fanes y
    Sennes rodeados de anfiteatros de dolomía.
  en: >-
    The idyllic turquoise waters of Lago di Braies and the desolate karst plateaus of Fanes and Sennes
    encircled by dolomitic amphitheatres.
  fr: >-
    Le lac de Braies aux eaux turquoise cristallines et les hauts plateaux karstiques désolés de Fanes et
    Sennes ceinturés d'amphithéâtres de dolomie.
  de: >-
    Der idyllische Pragser Wildsee mit türkisblauem Wasser und die weiten Karsthochflächen von Fanes und
    Sennes, umrahmt von gewaltigen Dolomitenamphitheatern.
  it: >-
    L'idilliaco lago di Braies dalle acque turchesi cristalline e gli sconfinati altipiani carsici di Fanes e
    Sennes incorniciati da anfiteatri dolomitici.
  pt: >-
    O idílico lago de Braies de águas turquesa cristalinas e os planaltos cársicos desolados de Fanes e Sennes
    envolvidos por anfiteatros de dolomia.
unico:
  es: >-
    Aquí una cueva guarda el cementerio de una especie de oso que la ciencia no conocía, y una leyenda ladina
    dice que desde un lago se llegaba en barca al reino subterráneo de los Fanes.
  en: >-
    A cave here conceals the burial ground of an extinct bear unknown to science until recently, and Ladin
    legends tell of rowing across a mountain lake into the subterranean kingdom of Fanes.
  fr: >-
    Une grotte y abrite la nécropole d'une espèce d'ours alors inconnue de la science, et une légende ladine
    raconte qu'un lac menait jadis en barque au royaume souterrain des Fanes.
  de: >-
    Eine Höhle birgt hier den Friedhof einer der Wissenschaft zuvor unbekannten Bärenart, und eine ladinische
    Sage berichtet, wie man über einen Bergsee ins unterirdische Fanesreich gelangte.
  it: >-
    Qui una caverna custodisce la necropoli di una specie di orso ignota alla scienza fino a tempi recenti, e
    una leggenda ladina narra che da un lago si approdava in barca al regno sotterraneo dei Fanes.
  pt: >-
    Uma gruta preserva aqui a necrópole de uma espécie de urso desconhecida da ciência até recentemente, e
    lendas ladinas contam que de um lago se navegava em barco até ao reino subterrâneo de Fanes.
observaciones:
  es: >-
    El lago de Braies es uno de los más visitados del Tirol del Sur, aunque aparte de un hotel histórico, un
    cobertizo para barcas y algunos senderos casi no tiene infraestructuras turísticas. Comprueba con el
    gestor los horarios del centro de visitantes y el estado de los accesos y de los refugios antes de salir.
texto:
  es:
    intro: >-
      En 1987 un excursionista de Corvara se topó, en una cueva de las Conturines, con algo que nadie había
      visto: un cementerio de osos. Ahí, a unos 2.800 m, dormían los huesos de unos 60 animales de una especie
      desconocida, el oso ladino, de la que no se sabía nada. Esa cueva resume el Parque Natural
      Fanes-Sennes-Braies: unas altas mesetas calizas de los Dolomitas, rotas por el karst, sobre las que
      cuelgan cumbres cercanas a los 3.000 m y lagos tan fotografiados como el de Braies.
    landscape: >-
      Piensa en una escalera. Abajo, en los valles, el parque limita al norte con el valle Pusteria y al oeste
      con el valle Badia, y al este linda con el Parque Natural Tre Cime. Arriba, entre cumbres que rondan los
      3.000 m, se extienden las grandes mesetas de Fanes, Sennes, Fosses y Prato Piazza. La cima más alta es
      la Hohe Gaisl, de 3.146 m, al sureste.


      La roca es sobre todo del Jurásico y del Cretácico, y el agua la ha trabajado desde dentro: en Fanes y
      Sennes el karst deja surcos, grietas y dolinas. Los lagos nacieron de caídas de monte. El lago de
      Braies, a 1.496 m, con 33 hectáreas y 36 m de profundidad máxima, existe porque un desprendimiento de
      barro y piedras formó una presa natural. El de Dobbiaco se formó en la antigüedad por numerosos
      desprendimientos de las montañas de su orilla oeste.


      La vegetación sube con el relieve. En las cotas bajas hay bosque de coníferas, sobre todo abeto rojo,
      que más arriba se mezcla con alerces y pino cembro. En el límite del bosque aparece el pino mugo, y
      entre los 2.000 y los 2.800 m dominan los pastos calizos de gramíneas azuladas y carex siempreverde.
    wildlife: >-
      La [marmota](/especie/marmota_marmota/) es el símbolo del parque y está por todas partes. No la verás
      antes de oírla: su presencia se detecta por los silbidos de alarma. Entre los refugios Fanes y Lavarella
      hay un anfiteatro que se conoce como el «parlamento de las marmotas», y en las praderas de Fanes y
      Sennes y en Plätzwiese se pueden observar desde los senderos. En verano es relativamente fácil encontrar
      grupos de [rebecos](/especie/rupicapra_rupicapra/) en los circos herbosos. También hay cabras monteses,
      liebres variables, martas y garduñas.


      Los bosques de coníferas son un hábitat ideal para el [corzo](/especie/capreolus_capreolus/), y el
      [ciervo](/especie/cervus_elaphus/) ha reaparecido desde hace unas décadas. Entre las aves figuran el
      [gallo lira](/especie/tetrao_tetrix/), la grévol, el [urogallo](/especie/tetrao_urogallus/), el [búho
      real](/especie/bubo_bubo/), el mochuelo chico y el [águila real](/especie/aquila_chrysaetos/). Las
      praderas húmedas de la orilla sur del lago de Dobbiaco son hábitat de numerosas aves acuáticas.


      El oso y el lince, en cambio, ya no están: vivieron aquí y se extinguieron en el siglo XIX.
    visit: >-
      Hay varias puertas. Se entra por las dos ramas del valle de Braies, desde el lago o desde Prato Piazza,
      por el paso del Col de Locia desde San Cassiano in Badia o por el valle de Marebbe.


      El primer sitio al que ir es el centro de visitantes de San Vigilio di Marebbe, de acceso libre y en un
      edificio de madera. Allí se cuenta el ambiente, la geología, la paleontología y las actividades humanas
      del parque, y también la historia del oso de las cavernas de Conturines, los hábitats locales y el mundo
      de las leyendas ladinas. Para un paseo corto, el Lärchensteig, de cerca de un kilómetro, poco exigente,
      tiene dos estaciones generales y siete temáticas sobre los prados de alerces, los pastos, los bosques y
      los cursos de agua. Alrededor del lago de Dobbiaco hay otro sendero didáctico, de unas dos horas, con
      once paneles sobre flora, fauna y geomorfología.


      Para caminar más, dos circuitos clásicos. Del lago de Braies al Le de Fojedöra y vuelta son de seis a
      siete horas, con 800 m de desnivel y dificultad media. Desde la Capanna Alpina hasta el refugio Fanes y
      el Pederü son de cuatro a cinco horas, con 600 m de desnivel y dificultad medio-fácil, y pasas por ese
      anfiteatro de las marmotas. Para quien busque historia, la llamada «vía de la Paz» sigue los trazados de
      los soldados austrohúngaros de la Primera Guerra Mundial: unas cinco o seis horas, 900 m de desnivel y
      posiciones de guerra a la vista. Es un sendero equipado, con algunos tramos de vía ferrata.
    history: >-
      El parque se fundó en 1980, y en 2009 pasó a formar parte del Patrimonio Mundial de las Dolomitas, como
      parte de las Dolomitas Septentrionales. Pertenece a Natura 2000. Dentro del parque quedan huellas de la
      guerra, como el fuerte de Prato Piazza, un antiguo fuerte austrohúngaro de la Primera Guerra Mundial.
    before: >-
      El lago de Braies es uno de los más visitados del Tirol del Sur, aunque aparte de un hotel histórico, un
      cobertizo para barcas y algunos senderos casi no tiene infraestructuras turísticas. Comprueba con el
      gestor los horarios del centro de visitantes y el estado de los accesos y de los refugios antes de
      salir.
    around: >-
      El [Parque Natural Puez-Odle](/lugar/parco-naturale-puez-odle/) está a unos cuatro kilómetros y es el
      vecino inmediato; el [Parco Naturale Paneveggio - Pale di San
      Martino](/lugar/parco-naturale-paneveggio---pale-di-san-martino/) queda a veintisiete kilómetros y el
      [Parco Nazionale delle Dolomiti Bellunesi](/lugar/parco-nazionale-delle-dolomiti-bellunesi/) a
      veintiocho kilómetros.
  en:
    intro: >-
      In 1987, a hiker from Corvara stumbled upon an unprecedented find inside a cave on the Conturines: a
      prehistoric bear necropolis. There, at roughly 2,800 m, lay the skeletal remains of some 60 animals of a
      previously unknown species, the Ladin cave bear. That cave encapsulates the spirit of the
      Fanes-Sennes-Braies Natural Park: elevated limestone plateaus in the Dolomites, shattered by karst
      formations, beneath peaks approaching 3,000 m and photographic icons like Lake Braies.
    landscape: >-
      Picture a giant staircase. Below in the valleys, the park borders the Pusteria valley to the north and
      Val Badia to the west, meeting the Tre Cime Natural Park to the east. High above, nestled among peaks
      hovering around 3,000 m, stretch the vast undulating plateaus of Fanes, Sennes, Fosses, and Prato
      Piazza. The highest point is the Hohe Gaisl, reaching 3,146 m to the southeast.


      The rock is predominantly Jurassic and Cretaceous limestone, hollowed out by subterranean waters: across
      Fanes and Sennes, karstification has gouged ruts, crevices, and sinkholes. The lakes originated from
      catastrophic landslides. Lake Braies, resting at 1,496 m with a surface of 33 hectares and a maximum
      depth of 36 m, exists because a massive rockfall formed a natural dam. Lake Dobbiaco formed in antiquity
      through multiple rockslides tumbling from its western slopes.


      Vegetation ascends with topography: coniferous woodlands dominated by Norway spruce occupy lower
      elevations, mingling with larch and Swiss stone pine higher up. At the timberline, mountain pine
      dominates, while between 2,000 and 2,800 m calciphilous alpine grasslands of blue moor-grass and
      evergreen sedge prevail.
    wildlife: >-
      The [alpine marmot](/especie/marmota_marmota/) is the park's mascot and is ubiquitous. You will hear its
      piercing alarm whistles long before spotting it. Between the Fanes and Lavarella mountain huts lies a
      natural limestone hollow known as the «parliament of the marmots», and across the meadows of Fanes,
      Sennes, and Plätzwiese they are easily watched from the paths. In summer, herds of
      [chamois](/especie/rupicapra_rupicapra/) graze in high glacial cirques. Alpine ibex, mountain hares,
      pine martens, and stone martens also inhabit the territory.


      Coniferous woods provide an ideal haven for [roe deer](/especie/capreolus_capreolus/), and [red
      deer](/especie/cervus_elaphus/) have returned in recent decades. Avian fauna features [black
      grouse](/especie/tetrao_tetrix/), hazel grouse, [western capercaillie](/especie/tetrao_urogallus/),
      [Eurasian eagle-owl](/especie/bubo_bubo/), Eurasian pygmy owl, and the [golden
      eagle](/especie/aquila_chrysaetos/). Wetland meadows around the southern edge of Lake Dobbiaco provide
      nesting habitat for diverse waterfowl.


      Brown bears and lynx no longer dwell here, having been extirpated in the nineteenth century.
    visit: >-
      Several access portals serve the park. You can enter via both branches of the Braies valley—from the
      lake or Prato Piazza—, through the Col de Locia pass from San Cassiano in Badia, or via the Marebbe
      valley.


      The essential starting point is the visitor centre in San Vigilio di Marebbe, housed in a contemporary
      timber pavilion with free admission. It interprets the geology, paleontology, and traditional culture of
      the park, including the Conturines cave bear, fragile alpine habitats, and Ladin legends. For a gentle
      walk, the Lärchensteig is an undemanding route of about one kilometre featuring two general and seven
      themed stations on larch meadows, pastures, and streams. Around Lake Dobbiaco, another nature trail
      taking roughly two hours features eleven interpretive panels on local ecology.


      Two classic circuits offer full-day trekking. From Lake Braies to Le de Fojedöra and back requires six
      to seven hours, with 800 m of elevation gain at a moderate grade. From Capanna Alpina to the Fanes hut
      and Pederü spans four to five hours, with 600 m of ascent at an accessible grade, traversing the
      parliament of the marmots. For history buffs, the «Peace Trail» follows Austro-Hungarian troop lines
      from World War I: five to six hours, 900 m of ascent, passing fortified wartime positions along a via
      ferrata route.
    history: >-
      The park was founded in 1980, joining the UNESCO Dolomites World Heritage Site in 2009 as part of the
      Northern Dolomites component. It is integrated into the Natura 2000 network. War relics remain scattered
      throughout the terrain, including the Austro-Hungarian fortification at Prato Piazza dating to the First
      World War.
    before: >-
      Lake Braies is one of the most visited destinations in South Tyrol, yet apart from a historic hotel, a
      wooden boathouse, and footpaths, it retains a wild character. Check with the park authority regarding
      visitor centre operating hours, mountain road access, and hut opening dates prior to your trip.
    around: >-
      The [Parque Natural Puez-Odle](/lugar/parco-naturale-puez-odle/) lies roughly four kilometres away as
      the immediate neighbouring park; [Parco Naturale Paneveggio - Pale di San
      Martino](/lugar/parco-naturale-paneveggio---pale-di-san-martino/) is twenty-seven kilometres away and
      [Parco Nazionale delle Dolomiti Bellunesi](/lugar/parco-nazionale-delle-dolomiti-bellunesi/)
      twenty-eight kilometres away.
  fr:
    intro: >-
      En 1987, un randonneur de Corvara découvrit dans une grotte des Conturines une trouvaille sans précédent
      : une nécropole d'ours des cavernes. Là, vers 2 800 m d'altitude, reposaient les ossements d'environ 60
      animaux d'une espèce inconnue, l'ours ladin. Cette caverne illustre l'âme du parc naturel
      Fanes-Sennes-Braies : de vastes plateaux calcaires dolomitiques entaillés par le karst, dominés par des
      cimes frôlant les 3 000 m et des miroirs lacustres célèbres comme le lac de Braies.
    landscape: >-
      Imaginez un escalier géant. Dans les vallées, le parc est bordé au nord par le val Pusteria, à l'ouest
      par le val Badia et à l'est par le parc naturel Tre Cime. Plus haut, entre des sommets approchant 3 000
      m, s'étirent les grands plateaux de Fanes, Sennes, Fosses et Prato Piazza. Le point culminant est la
      Hohe Gaisl, atteignant 3 146 m au sud-est.


      La roche appartient au Jurassique et au Crétacé, et l'eau l'a sculptée de l'intérieur : sur Fanes et
      Sennes, le karst imprime rigoles, crevasses et dolines. Les lacs résultent d'effondrements rocheux. Le
      lac de Braies, situé à 1 496 m, avec 33 hectares de superficie et 36 m de profondeur maximale, est né
      d'un gigantesque éboulement ayant formé un barrage naturel. Le lac de Dobbiaco s'est formé dans
      l'Antiquité à la suite de glissements de terrain issus de sa rive ouest.


      La végétation s'étage avec le relief : à basse altitude domine la forêt d'épicéas, bientôt mêlée aux
      mélèzes et pins cembros. À la limite forestière s'impose le pin mugo, tandis qu'entre 2 000 et 2 800 m
      règnent les pelouses alpines calcicoles à seslérie bleue et laîche toujours verte.
    wildlife: >-
      La [marmotte des Alpes](/especie/marmota_marmota/) est l'emblème du parc et se rencontre partout. Vous
      entendrez ses sifflements stridents avant de la voir. Entre les refuges Fanes et Lavarella s'ouvre un
      cirque naturel dénommé « parlement des marmottes », et sur les estives de Fanes, Sennes et Plätzwiese on
      les observe aisément depuis les sentiers. En été, des hardes de [chamois](/especie/rupicapra_rupicapra/)
      fréquentent les couloirs herbeux. Bouquetins des Alpes, lièvres variables, martres et fouines peuplent
      aussi les lieux.


      Les forêts de conifères accueillent le [chevreuil](/especie/capreolus_capreolus/), tandis que le [cerf
      élaphe](/especie/cervus_elaphus/) a recolonisé le massif depuis quelques décennies. Parmi les oiseaux
      s'illustrent le [tétras lyre](/especie/tetrao_tetrix/), la gélinotte des bois, le [grand
      tétras](/especie/tetrao_urogallus/), le [hibou grand-duc](/especie/bubo_bubo/), la chevêchette d'Europe
      et l'[aigle royal](/especie/aquila_chrysaetos/). Les prairies humides de la rive sud du lac de Dobbiaco
      abritent une riche avifaune aquatique.


      L'ours et le lynx ont disparu du massif, chassés jusqu'à l'extinction au XIXe siècle.
    visit: >-
      Plusieurs accès s'ouvrent sur le parc. On y pénètre par les deux branches de la vallée de Braies —
      depuis le lac ou Prato Piazza —, par le col de Locia depuis San Cassiano in Badia ou par le val de
      Marebbe.


      Le point de départ recommandé est le centre des visiteurs de San Vigilio di Marebbe, en accès libre dans
      un édifice en bois. Il retrace la géologie, la paléontologie et les légendes ladines, ainsi que la
      découverte de l'ours des Conturines. Pour une courte balade, le Lärchensteig est un sentier facile
      d'environ un kilomètre doté de deux stations générales et sept thématiques sur les mélèzins et les
      pâturages. Autour du lac de Dobbiaco, un autre sentier didactique de deux heures comporte onze panneaux
      explicatifs.


      Deux grandes boucles s'offrent aux randonneurs : du lac de Braies au Le de Fojedöra, l'aller-retour
      demande de six à sept heures pour 800 m de dénivelé. De la Capanna Alpina au refuge Fanes et à Pederü,
      comptez de quatre à cinq heures et 600 m de montée à travers le cirque des marmottes. Pour les
      passionnés d'histoire, le chemin de la Paix suit les retranchements austro-hongrois de la Première
      Guerre mondiale en cinq ou six heures et 900 m de montée, jalonné de vestiges militaires.
    history: >-
      Le parc fut fondé en 1980 et intégré en 2009 au bien des Dolomites au Patrimoine mondial de l'UNESCO au
      titre des Dolomites septentrionales. Il s'inscrit dans le réseau Natura 2000. Des vestiges de guerre
      ponctuent le relief, comme le fort austro-hongrois de Prato Piazza datant du premier conflit mondial.
    before: >-
      Le lac de Braies est l'un des sites les plus renommés du Tyrol du Sud, bien que ses rives restent
      préservées de toute urbanisation lourde. Vérifiez auprès du gestionnaire les horaires du centre des
      visiteurs et les accès routiers avant de partir.
    around: >-
      Le [Parque Natural Puez-Odle](/lugar/parco-naturale-puez-odle/) s'étend à environ quatre kilomètres
      comme voisin immédiat ; le [Parco Naturale Paneveggio - Pale di San
      Martino](/lugar/parco-naturale-paneveggio---pale-di-san-martino/) se situe à vingt-sept kilomètres et le
      [Parco Nazionale delle Dolomiti Bellunesi](/lugar/parco-nazionale-delle-dolomiti-bellunesi/) à
      vingt-huit kilomètres.
  de:
    intro: >-
      Im Jahr 1987 stieß ein Wanderer aus Corvara in einer Höhle der Conturines-Spitzen auf einen
      spektakulären Fund: einen Höhlenbärenfriedhof. In rund 2.800 m Höhe lagen die Knochen von etwa 60 Tieren
      einer unbekannten Bärenart, des Ladinischen Höhlenbären. Diese Höhle spiegelt das Wesen des Naturparks
      Fanes-Sennes-Prags wider: weite, verkarstete Dolomiten-Hochflächen, überragt von fast 3.000 m hohen
      Felswänden und berühmten Bergseen wie dem Pragser Wildsee.
    landscape: >-
      Man kann sich das Schutzgebiet wie eine riesige Treppe vorstellen: In den Tälern grenzt der Park im
      Norden an das Pustertal, im Westen an das Gadertal und im Osten an den Naturpark Drei Zinnen. Oben
      dehnen sich zwischen knapp 3.000 m hohen Kämmen die weiten Hochflächen von Fanes, Sennes, Fosses und der
      Plätzwiese aus. Höchster Gipfel ist die Hohe Gaisl mit 3.146 m im Südosten.


      Das Gestein entstammt dem Jura und der Kreidezeit; unterirdisches Wasser hat es zu Karstformen mit
      Rillen, Spalten und Dolinen erodiert. Die Seen verdanken ihre Entstehung Bergstürzen: Der Pragser
      Wildsee auf 1.496 m Höhe mit 33 Hektar Fläche und 36 m Maximaltiefe entstand durch eine natürliche
      Murensperre. Der Toblacher See bildete sich im Altertum durch Felsstürze seiner Westflanke.


      Die Höhenstufen spiegeln sich im Bewuchs: Unten dominieren Fichtenwälder, die weiter oben von Lärchen
      und Zirben durchsetzt werden. An der Waldgrenze behauptet sich die Bergkiefer, während zwischen 2.000
      und 2.800 m alpine Polsterseggen- und Blaugrasrasen vorherrschen.
    wildlife: >-
      Das [Alpenmurmeltier](/especie/marmota_marmota/) ist das Wappentier des Naturparks und allgegenwärtig.
      Seine schrillen Warnpfiffe verraten es schon von Weitem. Zwischen den Schutzhütten Fanes und Lavarella
      öffnet sich ein natürlicher Felskessel, das «Murmeltierparlament», und auf den Wiesen von Fanes, Sennes
      und der Plätzwiese lassen sich die Tiere mühelos beobachten. Im Sommer weiden
      [Gämsen](/especie/rupicapra_rupicapra/) in den Hochkaren. Steinböcke, Schneehase, Baummarder und
      Steinmarder bewohnen ebenfalls das Gebiet.


      Nadelwälder bieten dem [Reh](/especie/capreolus_capreolus/) idealen Einstand, während der
      [Rothirsch](/especie/cervus_elaphus/) seit einigen Jahrzehnten wieder Fuß gefasst hat. Die Vogelwelt
      umfasst [Birkhuhn](/especie/tetrao_tetrix/), Haselhuhn, [Auerhuhn](/especie/tetrao_urogallus/),
      [Uhu](/especie/bubo_bubo/), Sperlingskauz und [Steinadler](/especie/aquila_chrysaetos/). Die
      Feuchtwiesen am Südufer des Toblacher Sees bieten Wasservögeln wichtige Rastplätze.


      Bär und Luchs sind hingegen verschwunden: Sie wurden im neunzehnten Jahrhundert ausgerottet.
    visit: >-
      Mehrere Eingänge erschließen den Park: von den beiden Ästen des Pragser Tals — vom See oder der
      Plätzwiese —, über das Limojoch vom Gadertal oder aus dem Ennebergtal.


      Erste Anlaufstelle ist das Besucherzentrum in St. Vigil in Enneberg bei freiem Eintritt in einem
      modernen Holzbau. Es informiert über Geologie, Paläontologie, den Conturines-Bären und die ladinische
      Sagenwelt. Ein kurzer Spaziergang ist der Lärchensteig: ein etwa ein Kilometer langer Themenweg mit zwei
      allgemeinen und sieben thematischen Stationen über Lärchenwiesen und Almwirtschaft. Rund um den
      Toblacher See verläuft ein etwa zweistündiger Naturlehrpfad mit elf Schautafeln.


      Für ausgedehnte Bergtouren bieten sich zwei Routen an: Vom Pragser Wildsee zur Fojedöra-Alm und zurück
      wandert man sechs bis sieben Stunden bei 800 Höhenmetern. Von der Capanna Alpina zur Faneshütte und nach
      Pederü geht man vier bis fünf Stunden bei 600 Höhenmetern am Murmeltierparlament vorbei.
      Geschichtsinteressierte wählen den «Friedensweg» entlang der Stellungen des Ersten Weltkriegs: fünf bis
      sechs Stunden Gehzeit, 900 Höhenmeter Aufstieg, mit gesicherten Klettersteigpassagen.
    history: >-
      Der Naturpark wurde 1980 gegründet und 2009 als Teil der Nördlichen Dolomiten in das
      UNESCO-Weltnaturerbe Dolomiten aufgenommen. Er ist Teil des Schutzgebietsnetzes Natura 2000. Zahlreiche
      Relikte erinnern an die Gebirgskämpfe des Ersten Weltkriegs, darunter das Werk Plätzwiese.
    before: >-
      Der Pragser Wildsee zählt zu den bekanntesten Ausflugszielen Südtirols, bewahrt jedoch abseits des
      Seehotels einen naturnahen Charakter. Erkundige dich vorab über Verkehrsregelungen, Besucherzentren und
      geöffnete Schutzhütten.
    around: >-
      Der [Parque Natural Puez-Odle](/lugar/parco-naturale-puez-odle/) liegt rund vier Kilometer entfernt als
      direkter Nachbarpark; der [Parco Naturale Paneveggio - Pale di San
      Martino](/lugar/parco-naturale-paneveggio---pale-di-san-martino/) liegt siebenundzwanzig Kilometer und
      der [Parco Nazionale delle Dolomiti Bellunesi](/lugar/parco-nazionale-delle-dolomiti-bellunesi/)
      achtundzwanzig Kilometer entfernt.
  it:
    intro: >-
      Nel 1987 un escursionista di Corvara si imbatté, in una grotta delle Conturines, in qualcosa di mai
      visto: un cimitero di orsi preistorici. Lì, a circa 2.800 m, giacevano le ossa di circa 60 esemplari di
      una specie sconosciuta, l'orso ladino. Quella caverna racchiude lo spirito del Parco Naturale
      Fanes-Sennes-Braies: vasti altipiani calcarei nelle Dolomiti, solcati dal carsismo, sovrastati da
      bastionate vicine ai 3.000 m e specchi d'acqua celebri come il lago di Braies.
    landscape: >-
      Immagina una gigantesca gradinata. In basso, nelle valli, il parco confina a nord con la val Pusteria, a
      ovest con la val Badia e a est con il Parco Naturale Tre Cime. In quota, incastonati tra cime che
      sfiorano i 3.000 m, si stendono gli altipiani di Fanes, Sennes, Fosses e Prato Piazza. La cima più
      elevata è la Croda Rossa d'Ampezzo (Hohe Gaisl), di 3.146 m, a sud-est.


      Le formazioni geologiche appartengono a Giurassico e Cretacico, modellate dall'azione corrosiva delle
      acque: a Fanes e Sennes il carsismo crea scanalature, fessure e doline. I laghi traggono origine da
      colossali frane. Il lago di Braies, a 1.496 m con 33 ettari di estensione e 36 m di profondità massima,
      deve la sua esistenza a uno sbarramento naturale da detrito. Il lago di Dobbiaco nacque in epoca antica
      a causa di ripetuti franamenti dal versante occidentale.


      La vegetazione riflette la quota: nelle valli allignano boschi di abete rosso, frammisti più in alto a
      larici e pino cembro. Al limite della foresta subentra il pino mugo, mentre tra 2.000 e 2.800 m
      prevalgono le praterie alpine su calcare a sesleria e carice sempreverde.
    wildlife: >-
      La [marmotta](/especie/marmota_marmota/) è l'animale simbolo del parco ed è ovunque. La percepirai dai
      fischi d'allarme prima ancora di scorgerla. Tra i rifugi Fanes e Lavarella si trova un anfiteatro
      carsico noto come «parlamento delle marmotte», e sui pascoli di Fanes, Sennes e Prato Piazza le si
      osserva agevolmente dai sentieri. In estate branchi di [camosci alpini](/especie/rupicapra_rupicapra/)
      pascolano nei circhi detritici. Stambecchi, lepri variabili, martore e faine popolano le alte quote.


      Le foreste di conifere ospitano il [capriolo](/especie/capreolus_capreolus/), mentre il
      [cervo](/especie/cervus_elaphus/) è tornato da qualche decennio. Tra gli uccelli nidificano [fagiano di
      monte](/especie/tetrao_tetrix/), francolino di monte, [urogallo](/especie/tetrao_urogallus/), [gufo
      reale](/especie/bubo_bubo/), civetta nana e [aquila reale](/especie/aquila_chrysaetos/). I prati umidi
      della riva meridionale del lago di Dobbiaco attirano numerose specie acquatiche.


      L'orso bruno e la lince sono invece scomparsi, eradicati dalla caccia nel corso dell'Ottocento.
    visit: >-
      Diversi accessi conducono al parco: dai due rami della valle di Braies — dal lago o da Prato Piazza —,
      dal Col de Locia da San Cassiano in Badia o dalla val di Marebbe.


      Il punto informativo primario è il centro visite di San Vigilio di Marebbe, a ingresso libero in un
      moderno edificio ligneo. Vi si approfondiscono geologia, paleontologia, l'orso delle Conturines e le
      leggende ladine. Per una breve passeggiata, il Lärchensteig si snoda per circa un chilometro con due
      stazioni generali e sette tematiche su lariceti e pascoli. Attorno al lago di Dobbiaco corre un
      itinerario didattico di circa due ore con undici pannelli esplicativi.


      Due classici anelli per il trekking: dal lago di Braies alla malga Fojedöra e ritorno occorrono da sei a
      sette ore con 800 m di dislivello. Dalla Capanna Alpina al rifugio Fanes e a Pederü si cammina per
      quattro o cinque ore con 600 m di salita passando dal parlamento delle marmotte. Per gli appassionati di
      storia, la «via della Pace» ricalca i camminamenti della Grande Guerra: da cinque a sei ore, 900 m di
      dislivello, con passaggi attrezzati e manufatti bellici.
    history: >-
      Il parco fu fondato nel 1980 e nel 2009 è stato inserito nel Patrimonio Mondiale UNESCO delle Dolomiti
      come parte del sistema delle Dolomiti Settentrionali. Fa parte della rete Natura 2000. Resti bellici
      segnano il paesaggio, come il forte di Prato Piazza risalente alla prima guerra mondiale.
    before: >-
      Il lago di Braies è una delle mete più famose dell'Alto Adige, ma al di là dell'albergo storico
      custodisce sponde d'alta valenza naturalistica. Verifica orari dei centri visita, accessi viari e
      apertura dei rifugi prima di intraprendere le gite.
    around: >-
      Il [Parque Natural Puez-Odle](/lugar/parco-naturale-puez-odle/) dista circa quattro chilometri ed è il
      vicino confinante; il [Parco Naturale Paneveggio - Pale di San
      Martino](/lugar/parco-naturale-paneveggio---pale-di-san-martino/) si trova a ventisette chilometri e il
      [Parco Nazionale delle Dolomiti Bellunesi](/lugar/parco-nazionale-delle-dolomiti-bellunesi/) a ventotto
      chilometri.
  pt:
    intro: >-
      Em 1987, um caminhante de Corvara deparou-se, numa caverna das Conturines, com um achado singular: uma
      necrópole de ursos pré-históricos. Aí, a cerca de 2.800 m, repousavam ossadas de cerca de 60 animais de
      uma espécie desconhecida, o urso-ladino. Essa gruta sintetiza o Parque Natural Fanes-Sennes-Braies:
      elevados planaltos calcários nas Dolomitas, fendidos pelo carso, encimados por picos a roçar os 3.000 m
      e lagos tão célebres como o de Braies.
    landscape: >-
      Imagina uma gigantesca escadaria alpina. Em baixo, nos vales, o parque confina a norte com o vale
      Pusteria, a oeste com o vale Badia e a leste com o Parque Natural Tre Cime. Em cima, entre cristas
      próximas dos 3.000 m, estendem-se os amplos planaltos de Fanes, Sennes, Fosses e Prato Piazza. O ponto
      culminante é a Hohe Gaisl, atingindo 3.146 m a sudeste.


      A rocha provém do Jurássico e do Cretácico, modelada internamente pela água: em Fanes e Sennes o relevo
      cársico desenha caneluras, fendas e algares. As lagoas brotaram de desabamentos montanhosos: o lago de
      Braies, situado a 1.496 m com 33 hectares e 36 m de profundidade máxima, existe porque uma derrocada
      monumental formou uma represa natural. O lago de Dobbiaco formou-se em tempos remotos através de
      sucessivos desmoronamentos da sua margem poente.


      A flora acompanha o relevo: nas cotas inferiores domina a floresta de abeto-falso, combinada mais acima
      com lariços e pinheiro-suíço. No limite da floresta instala-se o pinheiro-raso, ao passo que entre os
      2.000 e os 2.800 m prevalecem os pastos alpinos de sesléria-azul e ciperáceas perenes.
    wildlife: >-
      A [marmota](/especie/marmota_marmota/) é o ícone do parque e marca presença constante. Sentirás os seus
      silvos agudos de alarme antes mesmo de a vislumbrares. Entre os refúgios Fanes e Lavarella estende-se
      uma bacia natural conhecida como o «parlamento das marmotas», e nos prados de Fanes, Sennes e Plätzwiese
      avistam-se com facilidade a partir das veredas. No verão rebanhos de
      [camurças](/especie/rupicapra_rupicapra/) pastam nos circos herbosos. Íbexes-alpinos, lebres-variáveis,
      martas e fuinhas habitam igualmente as encostas.


      As florestas de coníferas facultam refúgio ao [corço](/especie/capreolus_capreolus/), enquanto o
      [veado](/especie/cervus_elaphus/) recolonizou o território nas últimas décadas. Entre as aves
      destacam-se o [tetraz-lira](/especie/tetrao_tetrix/), a galinha-do-mato, o
      [tetraz-grande](/especie/tetrao_urogallus/), o [bufo-real](/especie/bubo_bubo/), o mocho-pigmeu e a
      [águia-real](/especie/aquila_chrysaetos/). As margens húmidas a sul do lago de Dobbiaco acolhem aves
      aquáticas.


      O urso e o lince extinguiram-se nesta cordilheira no decurso do século XIX.
    visit: >-
      Diversos acessos conduzem ao parque: pelos dois ramos do vale de Braies — a partir do lago ou de Prato
      Piazza —, pelo passo de Col de Locia desde San Cassiano in Badia ou pelo vale de Marebbe.


      O ponto de partida ideal é o centro de visitantes de San Vigilio di Marebbe, de acesso gratuito num
      edifício moderno de madeira. Aborda a geologia, a paleontologia e as lendas ladinas, bem como o urso das
      Conturines. Para uma caminhada suave, o Lärchensteig é um trilho de cerca de um quilómetro com duas
      estações gerais e sete temáticas sobre lariçais e pastagens. Em redor do lago de Dobbiaco existe outro
      roteiro didático de cerca de duas horas com onze painéis.


      Para maiores desafios há dois circuitos pedestres emblemáticos: do lago de Braies ao Le de Fojedöra e
      regresso contam-se de seis a sete horas com 800 m de desnível. Da Capanna Alpina ao refúgio Fanes e
      Pederü anda-se quatro a cinco horas com 600 m de subida atravessando o parlamento das marmotas. Para
      quem procura história, a «Via da Paz» acompanha as linhas austro-húngaras da Primeira Guerra Mundial em
      cerca de cinco ou seis horas, 900 m de subida e trincheiras recuperadas.
    history: >-
      O parque foi instituído em 1980 e classificado em 2009 como Património Mundial da UNESCO integrado no
      bem das Dolomitas Setentrionais. Pertence à rede Natura 2000. No planalto subsistem vestígios do
      primeiro conflito mundial, como o forte austro-húngaro de Prato Piazza.
    before: >-
      O lago de Braies é um dos pontos mais procurados do Tirol do Sul, mas fora o hotel de montanha mantém um
      aspeto preservado. Consulta os horários dos centros de acolhimento e o estado das estradas e refúgios
      antes de viajares.
    around: >-
      O [Parque Natural Puez-Odle](/lugar/parco-naturale-puez-odle/) localiza-se a cerca de quatro quilómetros
      como vizinho contíguo; o [Parco Naturale Paneveggio - Pale di San
      Martino](/lugar/parco-naturale-paneveggio---pale-di-san-martino/) fica a vinte e sete quilómetros e o
      [Parco Nazionale delle Dolomiti Bellunesi](/lugar/parco-nazionale-delle-dolomiti-bellunesi/) a vinte e
      oito quilómetros.
