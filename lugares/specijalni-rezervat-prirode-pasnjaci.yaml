observaciones:
  es: >-
    Los sectores son de difícil acceso, sobre todo Kočovat y Siget, y las visitas son controladas. Cuenta con
    medio día o un día, y la mejor época va de abril a junio.
texto:
  es:
    intro: >-
      Se estima que a principios del siglo veinte vivían en Vojvodina más de mil
      [avutardas](/especie/otis_tarda/). Hoy quedan unas pocas decenas, y el último refugio de la especie en
      Serbia está aquí, en tres parcelas de pradera en el norte del Banato. No es un lugar de grandes vistas,
      sino de horizontes planos, saladar, pasto y pequeños humedales: un mosaico de estepa, suelo salino y
      marisma, en el extremo sudoriental del área centroeuropea de la avutarda.
    landscape: >-
      La reserva se reparte en tres sectores separados: Jaroš, el mayor, entre los pueblos de Mokrin y Jazovo;
      Siget, junto a Banatsko Aranđelovo, en el extremo norte del Banato y cerca de la frontera con Hungría,
      con unas dos mil ciento cuarenta hectáreas; y Kočovat, el más pequeño, junto a Vrbica y junto a la
      frontera rumana. Entre los tres suman, en la ampliación prevista, unas seis mil ochocientas hectáreas.


      Todo se asienta sobre la amplia llanura aluvial del río Zlatica, entre dos terrazas de loess. La mayor
      parte es suelo salino, y por eso la vegetación es de saladar: destaca el *Peucedanum officinale*, planta
      de saladar de importancia internacional.
    wildlife: >-
      Todo gira alrededor de la avutarda. El macho adulto es una de las aves voladoras más pesadas que
      existen, y ante una molestia prefiere correr antes que volar. Cría en marzo, y un macho puede aparearse
      con hasta cinco hembras; la hembra pone entre uno y tres huevos, de media dos, en mayo o junio. La
      pérdida de hábitat, las labores agrícolas, las molestias y los depredadores son los principales factores
      que la amenazan, y por eso el objetivo de la reserva es conservarla a ella y a su entorno.


      Pero la reserva da para más aves. Además de la avutarda, viven aquí el aguilucho cenizo, el [cernícalo
      patirrojo](/especie/falco_vespertinus/), la codorniz, la [grulla](/especie/grus_grus/), la abubilla y la
      lavandera boyera. Dos tercios de las aves que se pueden ver en la reserva tienen la condición de rareza
      natural.
    visit: >-
      La reserva dispone de un centro de visitantes con mirador y un sendero educativo marcado para llegar
      hasta él: es el lugar para mirar la pradera sin molestarla. La protección contempla visitas controladas,
      educación e investigación científica compatibles con la conservación.


      Llegar a los sectores exige paciencia. El acceso más cercano a Jaroš es el camino Naftaški, que parte de
      la carretera Mokrin–Crna Bara. A Kočovat se llega por caminos de verano de difícil tránsito desde
      Banatsko Aranđelovo y Vrbica, y a Siget por caminos de verano.
    history: >-
      El área de importancia para las aves de los pastizales de la avutarda abarca hoy veinte mil quinientas
      veintidós hectáreas, más que la reserva propiamente dicha. También se propuso como área botánica
      importante de Serbia, junto con el sector de Veliki Siget. El manejo se centra en las especies y sus
      hábitats.
    before: >-
      Los sectores son de difícil acceso, sobre todo Kočovat y Siget, y las visitas son controladas. Cuenta
      con medio día o un día, y la mejor época va de abril a junio.
    around: >-
      No hay lugares con ficha a distancia corta, pero sí lugares lejanos con la misma avutarda y el cernícalo
      patirrojo en estepa y humedal: el [Parque Nacional Körös-Maros - Llanura de
      Dévaványa](/lugar/koros-maros-nemzeti-park---devavanyai/) y el [Parque Nacional Kiskunság - Estepas
      Salinas](/lugar/kiskunsagi-nemzeti-park---szikes-pusztak/). Con la avutarda también comparten especie
      las [Lagunas de Villafáfila](/lugar/reserva-natural-lagunas-de-villafafila/) y el [Zona Especial de
      Conservación Humedal de La Nava](/lugar/zec-humedal-de-la-nava-y-campos-de-palencia/).
  en:
    intro: >-
      It is estimated that at the beginning of the twentieth century over one thousand [great
      bustards](/especie/otis_tarda/) lived across Vojvodina. Today only a few dozen remain, and the species'
      very last refuge in Serbia lies here, across three parcels of open grassland in northern Banat. This is
      not a landscape of dramatic panoramas, but one of boundless flat horizons, salt steppe, pastures and
      modest wetlands: an intricate mosaic of steppe, saline soils and marshes at the southeastern perimeter
      of the great bustard's Central European range.
    landscape: >-
      The reserve is divided into three separate sectors: Jaroš, the largest, stretching between the villages
      of Mokrin and Jazovo; Siget, beside Banatsko Aranđelovo in the northernmost corner of the Banat near the
      Hungarian border, covering some two thousand one hundred and forty hectares; and Kočovat, the smallest
      enclave, situated near Vrbica right along the Romanian frontier. Together the three sectors encompass,
      under planned expansions, around six thousand eight hundred hectares.


      The entire territory rests upon the broad alluvial floodplain of the Zlatica River, between two loess
      terraces. Saline soils dominate, sustaining characteristic halophytic vegetation dominated by hog's
      fennel (*Peucedanum officinale*), a salt-steppe plant of international conservation importance.
    wildlife: >-
      Everything revolves around the great bustard. The adult male ranks among the heaviest flying birds on
      Earth, and when disturbed prefers running across the grass to taking wing. Breeding begins in March,
      with a single cock displaying to up to five hens; females lay between one and three eggs, usually two,
      in May or June. Habitat fragmentation, intensive agriculture, disturbance and ground predators represent
      the primary threats, making the protection of the bustard and its surrounding steppe the reserve's
      central mission.


      Yet the grassland sustains far more than bustards. Montagu's harrier, [red-footed
      falcon](/especie/falco_vespertinus/), common quail, [common crane](/especie/grus_grus/), hoopoe and
      western yellow wagtail all breed or forage here. Fully two thirds of the bird species recorded within
      the reserve hold protected status as natural rarities.
    visit: >-
      The reserve maintains a visitor centre with a high observation tower and a waymarked educational trail
      leading to it: the optimal vantage point to observe the vast grassland without causing disturbance.
      Management guidelines allow strictly regulated visits, education and scientific research compatible with
      wildlife preservation.


      Reaching the individual sectors requires patience and planning. The closest access route to Jaroš is the
      Naftaški track, branching off the Mokrin–Crna Bara road. Kočovat is reached along unpaved seasonal dirt
      tracks from Banatsko Aranđelovo and Vrbica, while Siget is accessed via similar seasonal farm tracks.
    history: >-
      The Important Bird Area delineated for the great bustard pastures spans twenty thousand five hundred and
      twenty-two hectares, significantly exceeding the strictly protected reserve perimeter. The territory has
      likewise been proposed as an Important Plant Area of Serbia, encompassing the Veliki Siget sector.
      Conservation management focuses squarely on vulnerable species and habitat restoration.
    before: >-
      Access to the sectors is demanding, particularly for Kočovat and Siget, and all visits must be strictly
      controlled. Plan for half a day or a full day, and schedule your trip between April and June.
    around: >-
      While no other catalogued sites lie within immediate striking distance, distant protected areas conserve
      the same great bustard and red-footed falcon across steppe and marsh habitats: [Körös-Maros National
      Park - Dévaványa Plain](/lugar/koros-maros-nemzeti-park---devavanyai/) and [Kiskunság National Park -
      Saline Steppes](/lugar/kiskunsagi-nemzeti-park---szikes-pusztak/). The great bustard is also shared with
      [Villafáfila Lakes Nature Reserve](/lugar/reserva-natural-lagunas-de-villafafila/) and the [La Nava
      Wetland Special Area of Conservation](/lugar/zec-humedal-de-la-nava-y-campos-de-palencia/).
  fr:
    intro: >-
      On estime qu'au début du vingtième siècle plus de mille [grandes outardes](/especie/otis_tarda/)
      vivaient en Voïvodine. Aujourd'hui il n'en reste que quelques dizaines, et l'ultime refuge de l'espèce
      en Serbie subsiste ici, sur trois parcelles de prairies du nord du Banat. Ce n'est point un pays de
      reliefs spectaculaires, mais de plaines infinies, de steppes salées, de pâtures et de modestes zones
      humides : une mosaïque d'habitats salins à l'extrémité sud-orientale de l'aire centre-européenne de
      l'outarde.
    landscape: >-
      La réserve s'organise en trois secteurs distincts : Jaroš, le plus vaste, entre les villages de Mokrin
      et Jazovo ; Siget, près de Banatsko Aranđelovo, tout au nord du Banat près de la frontière hongroise,
      couvrant environ deux mille cent quarante hectares ; et Kočovat, le plus réduit, près de Vrbica contre
      la frontière roumaine. Les trois secteurs réunis totaliseront, avec l'extension prévue, environ six
      mille huit cents hectares.


      L'ensemble repose sur la vaste plaine alluviale de la rivière Zlatica, encadrée de deux terrasses de
      loess. Les sols salins dominent, accueillant une végétation halophile où abonde le peucédan officinal
      (*Peucedanum officinale*), plante de steppe salée d'intérêt international.
    wildlife: >-
      Tout ici tourne autour de l'outarde. Le mâle adulte compte parmi les oiseaux volants les plus lourds du
      globe, et face au danger il préfère courir plutôt que s'envoler. La parade commence en mars, un mâle
      pouvant s'accoupler avec jusqu'à cinq femelles ; la ponte compte un à trois œufs, le plus souvent deux,
      en mai ou juin. Perte d'habitats, travaux agricoles, dérangements et prédateurs terrestres forment les
      principales menaces, d'où l'urgence de protéger l'espèce et son biotope.


      Mais la réserve abrite d'autres oiseaux. Outre l'outarde y nichent le busard cendré, le [faucon
      kobez](/especie/falco_vespertinus/), la caille des blés, la [grue cendrée](/especie/grus_grus/), la
      huppe fasciée et la bergeronnette printanière. Les deux tiers des oiseaux observés sur place sont
      considérés comme des raretés naturelles protégées.
    visit: >-
      La réserve dispose d'un centre d'accueil avec tour panoramique et sentier pédagogique balisé : c'est
      l'endroit idéal pour contempler la prairie sans perturber la faune. Le statut permet des visites
      encadrées, des actions éducatives et une recherche scientifique respectueuse.


      Atteindre les secteurs demande de la patience. L'accès le plus aisé vers Jaroš emprunte la piste
      Naftaški depuis la route Mokrin–Crna Bara. Kočovat s'atteint par des chemins de terre estivaux malaisés
      depuis Banatsko Aranđelovo et Vrbica, et Siget par des pistes rurales similaires.
    history: >-
      La zone importante pour la conservation des oiseaux couvrant les pâturages de l'outarde s'étend sur
      vingt mille cinq cent vingt-deux hectares, bien au-delà de la réserve proprement dite. Le territoire a
      également été proposé comme zone d'importance botanique en Serbie, intégrant le secteur de Veliki Siget.
      La gestion est entièrement axée sur la sauvegarde des espèces et de leurs milieux.
    before: >-
      Les secteurs sont d'accès difficile, en particulier Kočovat et Siget, et les visites s'effectuent sous
      contrôle. Prévoyez une demi-journée ou une journée entière, entre avril et juin.
    around: >-
      Aucun site répertorié ne se trouve à faible distance, mais des espaces protégés lointains abritent
      également grande outarde et faucon kobez : le [parc national de Körös-Maros - Plaine de
      Dévaványa](/lugar/koros-maros-nemzeti-park---devavanyai/) et le [parc national de Kiskunság - Steppes
      salines](/lugar/kiskunsagi-nemzeti-park---szikes-pusztak/). La grande outarde est également partagée
      avec les [lagunes de Villafáfila](/lugar/reserva-natural-lagunas-de-villafafila/) et la [zone spéciale
      de conservation de La Nava](/lugar/zec-humedal-de-la-nava-y-campos-de-palencia/).
  de:
    intro: >-
      Man schätzt, dass zu Beginn des zwanzigsten Jahrhunderts mehr als eintausend
      [Großtrappen](/especie/otis_tarda/) in der Vojvodina lebten. Heute sind nur noch wenige Dutzend Vögel
      übrig, und die allerletzte Zuflucht der Art in Serbien liegt hier, auf drei Weideparzellen im Norden des
      Banats. Es ist keine Gegend spektakulärer Aussichten, sondern weiter flacher Horizonte, Salzsteppen,
      Grünland und kleiner Feuchtbiotope: ein Mosaik aus Steppenrasen und Salzböden am südöstlichen Rand des
      mitteleuropäischen Trappenareals.
    landscape: >-
      Das Reservat gliedert sich in drei getrennte Sektoren: Jaroš als größter Teilbereich zwischen den
      Dörfern Mokrin und Jazovo; Siget bei Banatsko Aranđelovo ganz im Norden des Banats nahe der ungarischen
      Grenze mit rund zweitausendeinhundertvierzig Hektar; und Kočovat als kleinster Sektor bei Vrbica direkt
      an der rumänischen Grenze. Zusammen umfassen die drei Bereiche mit der geplanten Erweiterung etwa
      sechstausendachthundert Hektar.


      Das Gebiet erstreckt sich über die breite Schwemmebene des Flusses Zlatica zwischen zwei Lössterrassen.
      Es überwiegen Salzböden mit charakteristischer Halophytenflora, darunter der Arznei-Haarstrang
      (*Peucedanum officinale*), eine Salzsteppenpflanze von internationaler Bedeutung.
    wildlife: >-
      Alles dreht sich um die Großtrappe. Der Altvogel zählt zu den schwersten flugfähigen Vögeln überhaupt
      und flieht bei Störungen lieber zu Fuß als aufzufliegen. Die Balz beginnt im März, wobei ein Männchen
      bis zu fünf Hennen begattet; das Weibchen legt im Mai oder Juni ein bis drei Eier, meistens zwei.
      Lebensraumverlust, Ackerbau, Beunruhigung und Bodenfeinde sind die Hauptbedrohungen, weshalb der Schutz
      der Trappe und ihres Umfelds im Zentrum steht.


      Doch das Grasland birgt weit mehr. Neben der Trappe leben hier Wiesenweihe,
      [Rotfußfalke](/especie/falco_vespertinus/), Wachtel, [Kranich](/especie/grus_grus/), Wiedehopf und
      Schafstelze. Zwei Drittel der im Reservat nachgewiesenen Vogelarten gelten als streng geschützte
      Naturraritäten.
    visit: >-
      Das Reservat bietet ein Besucherzentrum mit Beobachtungsturm und beschildertem Lehrpfad: der beste Ort,
      um das weite Weideland ungestört zu überblicken. Das Schutzregime erlaubt kontrollierte Besuche,
      Bildungsarbeit und wissenschaftliche Forschung im Einklang mit dem Artenschutz.


      Die Anreise zu den Teilflächen erfordert Ausdauer. Der nächste Zufahrtsweg nach Jaroš ist die Piste
      Naftaški an der Straße Mokrin–Crna Bara. Nach Kočovat gelangt man über holprige Sommerwege von Banatsko
      Aranđelovo und Vrbica, nach Siget ebenfalls über saisonale Feldwege.
    history: >-
      Das Important Bird Area der Trappenweiden erstreckt sich heute über
      zwanzigtausendfünfhundertzweiundzwanzig Hektar und geht weit über das eigentliche Kernreservat hinaus.
      Das Areal wurde zudem zusammen mit dem Sektor Veliki Siget als Important Plant Area Serbiens
      vorgeschlagen. Das Management zielt strikt auf den Schutz bedrohter Arten und Biotope ab.
    before: >-
      Die Sektoren sind schwer zugänglich, namentlich Kočovat und Siget, und Besuche finden kontrolliert
      statt. Plane einen halben oder ganzen Tag ein, am besten von April bis Juni.
    around: >-
      In direkter Nachbarschaft gibt es keine eingetragenen Ziele, doch entferntere Steppen- und Sumpfgebiete
      teilen Großtrappe und Rotfußfalke: der [Nationalpark Körös-Maros -
      Dévaványa-Ebene](/lugar/koros-maros-nemzeti-park---devavanyai/) und der [Nationalpark Kiskunság -
      Salzsteppen](/lugar/kiskunsagi-nemzeti-park---szikes-pusztak/). Mit der Großtrappe verbunden sind auch
      die [Salzlagunen von Villafáfila](/lugar/reserva-natural-lagunas-de-villafafila/) und das [Feuchtgebiet
      La Nava](/lugar/zec-humedal-de-la-nava-y-campos-de-palencia/).
  it:
    intro: >-
      Si stima che all'inizio del ventesimo secolo vivessero in Voivodina più di mille
      [otarde](/especie/otis_tarda/). Oggi ne rimangono poche decine, e l'ultimo rifugio della specie in
      Serbia si trova qui, in tre appezzamenti di prateria nel nord del Banato. Non è una terra di grandi
      rilievi, ma di orizzonti sconfinati, steppe salate, pascoli e piccoli specchi d'acqua: un mosaico di
      steppa, suoli salini e paludi al margine sud-orientale dell'areale centroeuropeo dell'otarda.
    landscape: >-
      La riserva si suddivide in tre settori distinti: Jaroš, il maggiore, tra i villaggi di Mokrin e Jazovo;
      Siget, presso Banatsko Aranđelovo nell'estremo nord del Banato vicino al confine ungherese, esteso per
      circa duemilacentoquaranta ettari; e Kočovat, il più piccolo, presso Vrbica a ridosso della frontiera
      romena. Insieme i tre comparti assommano, con l'ampliamento previsto, a circa seimilaottocento ettari.


      Il territorio poggia sull'ampia pianura alluvionale del fiume Zlatica, incastonata tra due terrazzi di
      loess. Prevalgono i suoli salini con tipica vegetazione alofila, tra cui spicca il finocchio porcino
      (*Peucedanum officinale*), pianta steppica di rilievo internazionale.
    wildlife: >-
      Tutto ruota attorno all'otarda. Il maschio adulto figura tra i volatili più pesanti al mondo capaci di
      volare e di fronte a un disturbo preferisce correre anziché alzarsi in volo. La parata nuziale comincia
      a marzo e un singolo maschio può accoppiarsi con un massimo di cinque femmine; la femmina depone da una
      a tre uova, in media due, a maggio o giugno. Distruzione dell'habitat, lavorazioni agricole, disturbo
      antropico e predatori terrestri sono le minacce primarie, e la riserva punta a salvaguardare l'uccello e
      il suo ambiente naturale.


      Ma la prateria accoglie molti altri alati. Oltre all'otarda vi nidificano o cacciano l'albanella minore,
      il [falco cuculo](/especie/falco_vespertinus/), la quaglia, la [gru](/especie/grus_grus/), l'upupa e la
      cutrettola. Due terzi degli uccelli osservabili vantano lo status di rarità naturale tutelata.
    visit: >-
      La riserva dispone di un centro visite con torretta panoramica e sentiero didattico segnalato: il punto
      ideale per contemplare la pianura senza arrecare disturbo agli animali. La tutela prevede visite guidate
      controllate, divulgazione e ricerca scientifica in armonia con la conservazione.


      Raggiungere i vari settori richiede tempo e calma. L'accesso più agevole verso Jaroš è la pista
      Naftaški, che devia dalla strada Mokrin–Crna Bara. Kočovat si raggiunge tramite piste campestri estive
      dissestate da Banatsko Aranđelovo e Vrbica, e Siget attraverso analoghi tracciati stagionali.
    history: >-
      L'area di importanza per la conservazione degli uccelli legata ai pascoli dell'otarda copre
      ventimilacinquecentoventidue ettari, ben più ampia della riserva naturale vera e propria. Il territorio
      è stato inoltre candidato quale area botanica di rilievo in Serbia includendo il settore di Veliki
      Siget. La gestione si focalizza sulla tutela attiva delle specie e degli habitat.
    before: >-
      I settori sono di difficile accesso, specialmente Kočovat e Siget, e le visite avvengono in forma
      controllata. Considera mezza giornata o un giorno intero, da aprile a giugno.
    around: >-
      Nelle immediate vicinanze non figurano mete schedate, ma aree protette lontane accolgono otarda e falco
      cuculo in contesti di steppa e palude: il [Parco nazionale Körös-Maros - Pianura di
      Dévaványa](/lugar/koros-maros-nemzeti-park---devavanyai/) e il [Parco nazionale di Kiskunság - Steppe
      saline](/lugar/kiskunsagi-nemzeti-park---szikes-pusztak/). Con l'otarda si collegano anche le [Lagune di
      Villafáfila](/lugar/reserva-natural-lagunas-de-villafafila/) e l'[Area speciale di conservazione Palude
      di La Nava](/lugar/zec-humedal-de-la-nava-y-campos-de-palencia/).
  pt:
    intro: >-
      Estima-se que no início do século vinte habitavam na Voivodina mais de mil
      [abetardas](/especie/otis_tarda/). Hoje restam apenas escassas dezenas, e o último santuário da espécie
      na Sérvia resiste aqui, em três parcelas de pastagem no norte do Banato. Não é terra de relevos
      imponentes, mas de horizontes rasos, estepe salina, pastos e pequenos pauis: um mosaico de estepe e
      solos salobros no limiar sudeste da distribuição centro-europeia da abetarda.
    landscape: >-
      A reserva desdobra-se em três setores autónomos: Jaroš, o mais extenso, entre as aldeias de Mokrin e
      Jazovo; Siget, junto a Banatsko Aranđelovo no extremo norte do Banato junto à fronteira húngara, com
      cerca de duas mil cento e quarenta hectares; e Kočovat, o mais diminuto, junto a Vrbica junto à raia
      romena. No cômputo geral os três núcleos somam, com a ampliação prevista, cerca de seis mil e oitocentos
      hectares.


      Tudo repousa sobre a ampla bacia aluvial do rio Zlatica, entre dois terraços de loesse. Predominam os
      solos salinos de vegetação halófila com destaque para o peucédano-oficinal (*Peucedanum officinale*),
      planta estépica de valor internacional.
    wildlife: >-
      Tudo orbita em torno da abetarda. O macho adulto figura entre as aves voadoras mais pesadas do planeta e
      em caso de alarme opta por correr velozmente em vez de levantar voo. O período reprodutor arranca em
      março, podendo um macho acasalar com até cinco fêmeas; a fêmea faz a postura de um a três ovos, em média
      dois, em maio ou junho. O recuo dos habitats, a lavoura intensiva, as perturbações e os predadores
      terrestres são as maiores ameaças, visando a reserva preservar a ave e a estepe circundante.


      Contudo o pasto abriga mais espécies. Além da abetarda nidificam aqui o tartaranhão-caçador, o
      [falcão-de-pés-vermelhos](/especie/falco_vespertinus/), a codorniz, o [grou-comum](/especie/grus_grus/),
      a poupa e a alvéola-amarela. Dois terços das aves assinaladas na reserva gozam do estatuto de raridade
      natural protegida.
    visit: >-
      A reserva oferece um centro de acolhimento com torre de vigia e trilho interpretativo sinalizado: o
      miradouro perfeito para avistar a pastagem sem perturbar a tranquilidade das aves. O regime de
      conservação prevê visitas orientadas, divulgação pedagógica e trabalhos científicos em consonância com o
      meio.


      A deslocação aos vários setores requer paciência. O trajeto mais direto para Jaroš faz-se pela pista
      Naftaški a partir da estrada Mokrin–Crna Bara. A Kočovat acede-se por caminhos de terra batida estivais
      desde Banatsko Aranđelovo e Vrbica, e a Siget por trilhos rurais análogos.
    history: >-
      A área importante para as aves desenhada sobre as pastagens da abetarda abrange vinte mil quinhentos e
      vinte e dois hectares, superando a delimitação estrita da reserva natural. O espaço foi igualmente
      indicado como área botânica de relevo na Sérvia englobando o setor de Veliki Siget. A ação de gestão
      concentra-se na defesa rigorosa dos habitats e das espécies.
    before: >-
      Os setores são de acesso exigente, em especial Kočovat e Siget, e as visitas decorrem sob supervisão.
      Reserva meio dia ou um dia inteiro, com época ideal entre abril e junho.
    around: >-
      Sem sítios com ficha a curta distância, reservas mais distantes acolhem a mesma abetarda e o
      falcão-de-pés-vermelhos em estepe e sapal: o [Parque Nacional Körös-Maros - Planície de
      Dévaványa](/lugar/koros-maros-nemzeti-park---devavanyai/) e o [Parque Nacional de Kiskunság - Estepes
      Salinas](/lugar/kiskunsagi-nemzeti-park---szikes-pusztak/). A abetarda é partilhada ainda com as [Lagoas
      de Villafáfila](/lugar/reserva-natural-lagunas-de-villafafila/) e a [Zona Especial de Conservação do
      Paul de La Nava](/lugar/zec-humedal-de-la-nava-y-campos-de-palencia/).
