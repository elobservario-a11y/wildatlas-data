resumen:
  es: >-
    Macizo kárstico de casi 2.000 m alzándose sobre el mar Tirreno en Sicilia, hábitat del abeto de Sicilia
    (*Abies nebrodensis*) en peligro crítico de extinción.
  en: >-
    A karst massif rising nearly 2,000 m above the Tyrrhenian Sea in Sicily, home to the critically endangered
    Sicilian fir (*Abies nebrodensis*).
  fr: >-
    Massif karstique de près de 2 000 m surplombant la mer Tyrrhénienne en Sicile, habitat du sapin de Sicile
    (*Abies nebrodensis*) en danger critique d’extinction.
  de: >-
    Karstmassiv von fast 2.000 m Höhe über dem Tyrrhenischen Meer auf Sizilien, Lebensraum der vom Aussterben
    bedrohten Sizilianischen Tanne (*Abies nebrodensis*).
  it: >-
    Massiccio carsico di quasi 2.000 m affacciato sul mar Tirreno in Sicilia, habitat dell’abete dei Nebrodi
    (*Abies nebrodensis*) in pericolo critico di estinzione.
  pt: >-
    Maciço cárstico de quase 2.000 m erguendo-se sobre o mar Tirreno na Sicília, habitat do abeto-da-sicília
    (*Abies nebrodensis*) criticamente ameaçado.
unico:
  es: >-
    Un macizo calcáreo donde crece un abeto casi extinto, vuelve a anidar el águila real y se camina sobre
    fósiles del Mioceno.
  en: >-
    A limestone massif where an almost extinct fir survives, the golden eagle nests once again, and trails
    cross Miocene fossils.
  fr: >-
    Un massif calcaire où subsiste un sapin presque éteint, où l’aigle royal niche de nouveau et où l’on
    marche sur des fossiles du Miocène.
  de: >-
    Ein Kalkmassiv, auf dem eine fast ausgestorbene Tannenart überlebt, der Steinadler wieder brütet und
    Wanderer auf miozänen Fossilien gehen.
  it: >-
    Un massiccio calcareo dove sopravvive un abete quasi estinto, torna a nidificare l’aquila reale e si
    cammina su fossili del Miocene.
  pt: >-
    Um maciço calcário onde sobrevive um abeto quase extinto, volta a nidificar a águia-real e se caminha
    sobre fósseis do Mioceno.
observaciones:
  es: >-
    Está prohibido recoger, destruir, dañar o llevarse plantas. Las cuevas del karst requieren ir con
    expertos. Mejor ir en primavera u otoño.
texto:
  es:
    intro: >-
      Se han censado menos de treinta abetos de su especie, y están concentrados en un solo barranco. El abeto
      de los Nebrodi, Abies nebrodensis, es la única especie de abeto mediterráneo espontáneo de Italia, y
      vive en las Madonie. Allí, en la costa norte de Sicilia, entre los ríos Imera y Pollina, el parque
      abarca quince municipios de la ciudad metropolitana de Palermo y el macizo de las Madonie. Es, según el
      propio parque, el lugar más rico en biodiversidad de Sicilia y uno de los más ricos de toda la cuenca
      mediterránea.
    landscape: >-
      Las Madonie son una montaña de caliza que empieza en el mar. El núcleo central, por encima de los 1600
      metros, es una meseta kárstica salpicada de dolinas, las «quarare», de varios cientos de metros de
      diámetro y hasta 25 de profundidad, a menudo pobladas de hayas. Allí domina el Pizzo Carbonara, de
      caliza coralina gris y muy dura. En el karst no hay red de agua superficial, pero sí una rica
      circulación subterránea: la Grotta Rossa, el Abbisso del Vento y el Inghiottitoio Battaglietta no están
      al alcance de todos y se visitan con expertos. Las depresiones de Piano Battaglia y Battaglietta, con
      sumideros en el fondo, forman uno de los paisajes kársticos más extensos y conocidos de Sicilia.


      Hacia la periferia, la roca cambia de carácter: el relieve central calcáreo, áspero, pasa a formas más
      suaves en las zonas de origen arcilloso-arenoso. Desde los años cincuenta los geólogos de la industria
      petrolera lo estudiaron y definieron numerosas formaciones, entre ellas las de Mufara, Scillato, Fanusi,
      Crisanti y Caltavuturo, aceptadas por la comunidad científica. El Madonie Geopark pertenece, como todos
      los geoparques de la Red Europea, a la red reconocida por la UNESCO.
    wildlife: >-
      El abeto de los Nebrodi es el caso más famoso. Antes cubría muchos montes sicilianos, pero la
      explotación intensa y el cambio de condiciones lo hicieron desaparecer rápido. El adulto no pasa de 15
      m; su copa en cruz le da nombres sicilianos como «arvuli cruci cruci». En 1958 se identificó un ejemplar
      de gran tamaño en un jardín privado de Polizzi Generosa, y en 1984 la Región de Sicilia creó una reserva
      natural para proteger los pocos supervivientes y los muchos endemismos de la zona. Hoy sigue entre las
      plantas mediterráneas más amenazadas según la UICN.


      En los bosques hay más. El acebo puede alcanzar quince metros y en Piano Pomo hay un núcleo excepcional.
      En el encinar del Monte Quacella la encina mediterránea se encuentra con la haya, algo insólito porque
      entre ambas suele interponerse otro tipo de bosque. En las Madonie la haya llega al límite meridional y
      occidental de su área. El astrágalo de los Nebrodi es una planta en forma de cojín espinoso exclusiva de
      las Madonie.


      Entre las aves, el [águila real](/especie/aquila_chrysaetos/) volvió a anidar hace unos años en las
      cumbres, y su envergadura supera los dos metros. El otoño es la mejor estación para buscarla, aunque el
      parque avisa de que no es fácil. También hay el águila de Bonelli, el [halcón
      peregrino](/especie/falco_peregrinus/) y el cernícalo vulgar. En las rocas viven la chova piquirroja, en
      grave descenso en Europa pero con población discreta aquí, y en invierno la chocha perdiz usa de noche
      los claros y pastos del bosque. Faltan ya el [quebrantahuesos](/especie/gypaetus_barbatus/), que aún
      criaba en la roca de Gonato en el siglo XIX, y el [buitre leonado](/especie/gyps_fulvus/), cuyos últimos
      ejemplares se vieron hace una veintena de años.


      Entre los mamíferos menores hay zorros, comadrejas, [puercoespines](/especie/hystrix_cristata/),
      liebres, lirones, gatos monteses y martas. En los años ochenta se reintrodujo el gamo.
    visit: >-
      El sendero del águila real es el mejor comienzo. Sale del aparcamiento de Piano Farina, a 1360 m, al que
      se llega por Petralia Sottana y la carretera provincial 54, unos tres kilómetros antes de Piano
      Battaglia. Mide 2 km, salva 45 m de desnivel y se hace en unas 2 horas. Pasa por un antiguo màrcato, un
      asentamiento de pastores todavía en uso, y por un mirador sobre el vallone Canna desde donde se ven al
      norte las islas Eolias, al este el Etna y al oeste el Monte Mufara y el Monte Ferro. Quien prefiera
      esperar sentado puede refugiarse en la cabina de observación de aves que montó el parque.


      En Petralia Sottana, el recorrido geológico urbano lleva por fósiles del Mioceno, corales fósiles en el
      portal de la iglesia de San Pietro, fuentes y una antigua nevera.
    history: >-
      El parque natural regional se instituyó con el decreto del 9 de noviembre de 1989. Dentro de un
      geoparque está prohibido extraer rocas de los afloramientos y comerciar con minerales y fósiles.
    before: >-
      Está prohibido recoger, destruir, dañar o llevarse plantas. Las cuevas del karst requieren ir con
      expertos. Mejor ir en primavera u otoño.
    around: A 20 km queda el [Parco dei Nebrodi](/lugar/parco-dei-nebrodi/).
  en:
    intro: >-
      Fewer than thirty trees of its kind have been censused, all clustered within a single ravine. The
      Sicilian fir, Abies nebrodensis, is the sole native Mediterranean fir species in Italy, found
      exclusively in the Madonie. There, along the northern coast of Sicily between the Imera and Pollina
      rivers, the park encompasses fifteen municipalities of the Metropolitan City of Palermo and the Madonie
      massif. According to the park itself, it represents the richest area of biodiversity in Sicily and one
      of the richest across the Mediterranean basin.
    landscape: >-
      The Madonie are limestone mountains that rise straight from the sea. The central core, above 1600
      metres, forms a karst plateau dotted with sinkholes known locally as «quarare», several hundred metres
      across and up to 25 deep, often sheltered by beech trees. Dominating this realm is Pizzo Carbonara,
      composed of hard grey coral limestone. The karst lacks surface watercourses but supports intricate
      subterranean hydrology: the Grotta Rossa, the Abisso del Vento and the Inghiottitoio Battaglietta are
      not for casual walkers and require expert guides. The depressions of Piano Battaglia and Battaglietta,
      with swallow-holes at their floor, form one of the most extensive karst landscapes in Sicily.


      Towards the periphery, the bedrock shifts: the rugged limestone core gives way to softer rolling forms
      in clay-sandstone terrain. From the nineteen-fifties onwards, petroleum geologists surveyed the area and
      established numerous geological formations, including Mufara, Scillato, Fanusi, Crisanti and
      Caltavuturo, all validated by international science. The Madonie Geopark belongs, like all European
      Geoparks, to the UNESCO Global Geoparks Network.
    wildlife: >-
      The Sicilian fir is the most renowned botanical story. It once clothed many Sicilian peaks, but heavy
      felling and environmental shifts drove it nearly to extinction. Mature trees do not exceed 15 m; their
      cruciform crown gave rise to the dialect name «arvuli cruci cruci». In 1958, a mature specimen was
      identified in a private garden in Polizzi Generosa, and in 1984 the Region of Sicily established a
      nature reserve to safeguard the surviving individuals and the area’s high endemism. Today it remains
      among the most threatened Mediterranean plants on the IUCN Red List.


      There is much more in these woodlands. Holly trees can reach fifteen metres, with an exceptional grove
      at Piano Pomo. In the oakwoods of Monte Quacella, evergreen holm oak meets deciduous beech—an unusual
      juxtaposition as other forest types usually separate them. In the Madonie, beech reaches the southern
      and western limits of its distribution. The Madonie milkvetch is a spiny cushion shrub found nowhere
      else.


      Among raptors, the [golden eagle](/especie/aquila_chrysaetos/) returned to nest on high crags some years
      ago, boasting a wingspan exceeding two metres. Autumn is the best season to watch for it, though the
      park notes sightings require patience. Bonelli's eagle, the [peregrine
      falcon](/especie/falco_peregrinus/) and common kestrel are also present. Red-billed choughs inhabit the
      cliffs, while in winter Eurasian woodcocks forage at night across forest glades. Missing now are the
      [bearded vulture](/especie/gypaetus_barbatus/), which nested on the Gonato cliffs in the nineteenth
      century, and the [griffon vulture](/especie/gyps_fulvus/), whose last individuals disappeared some
      twenty years ago.


      Smaller mammals include red foxes, least weasels, [crested porcupines](/especie/hystrix_cristata/),
      European hares, edible dormice, wildcats and pine martens. In the nineteen-eighties fallow deer were
      reintroduced.
    visit: >-
      The Golden Eagle Trail is the ideal introduction. It begins from the Piano Farina car park at 1360 m,
      reached via Petralia Sottana along provincial road 54, around three kilometres before Piano Battaglia.
      It measures 2 km, climbs 45 m of elevation gain and takes about 2 hours. It passes an ancient màrcato—a
      traditional shepherd settlement still in seasonal use—and reaches a panoramic viewpoint over Vallone
      Canna taking in the Aeolian Islands to the north, Mount Etna to the east, and Monte Mufara and Monte
      Ferro to the west. Hikers who prefer waiting quietly can use the park’s bird hide.


      In Petralia Sottana, the urban geological route leads past Miocene fossils, fossil corals set into the
      portal of the Church of San Pietro, historic fountains and a traditional icehouse.
    history: >-
      The regional natural park was established by decree on 9 November 1989. Within a geoparque it is
      strictly forbidden to quarry rocks from outcrops or trade in minerals and fossils.
    before: >-
      Collecting, damaging or removing wild plants is prohibited. Exploring karst caves requires experienced
      guides. Spring and autumn offer the most pleasant weather.
    around: At 20 km lies [Parco dei Nebrodi](/lugar/parco-dei-nebrodi/).
  fr:
    intro: >-
      Moins de trente sapins de cette espèce ont été recensés, tous confinés dans un unique vallon. Le sapin
      des Nebrodi, Abies nebrodensis, est la seule espèce de sapin méditerranéen spontané en Italie et ne
      survit que dans les Madonie. Sur la côte septentrionale de la Sicile, entre les fleuves Imera et
      Pollina, le parc regroupe quinze communes de la ville métropolitaine de Palerme et le massif des
      Madonie. Selon le parc lui-même, c’est le territoire le plus riche en biodiversité de Sicile et l’un des
      plus exceptionnels du bassin méditerranéen.
    landscape: >-
      Les Madonie sont une montagne calcaire qui surgit droit de la mer. Le cœur central, au-delà de 1600
      mètres, forme un haut plateau karstique ponctué de dolines, les « quarare », larges de plusieurs
      centaines de mètres et profondes jusqu’à 25 m, souvent colonisées par des hêtres. Là trône le Pizzo
      Carbonara, bâti d’un calcaire corallien gris très résistant. Sur le karst, il n’existe aucun réseau
      hydrographique de surface, mais une dense circulation souterraine : la Grotta Rossa, l’Abisso del Vento
      et l’Inghiottitoio Battaglietta ne sont pas ouverts à tous et exigent des guides spécialisés. Les
      dépressions de Piano Battaglia et Battaglietta, avec leurs pertes d’eau, constituent l’un des paysages
      karstiques les plus vastes de Sicile.


      Vers la périphérie, la roche s’adoucit : le relief calcaire abrupt cède la place à des modelés plus
      ondulés d’origine argilo-gréseuse. Dès les années cinquante, les géologues pétroliers étudièrent le
      sous-sol et identifièrent de multiples formations, comme Mufara, Scillato, Fanusi, Crisanti et
      Caltavuturo. Le Madonie Geopark appartient au réseau mondial des géoparcs UNESCO.
    wildlife: >-
      Le sapin des Nebrodi en est le symbole. Jadis abondant sur les cimes siciliennes, la surexploitation l’a
      presque anéanti. À l’âge adulte, il ne dépasse pas 15 m ; son houppier en croix lui vaut en dialecte le
      nom d’« arvuli cruci cruci ». En 1958, un grand sujet fut découvert dans un jardin de Polizzi Generosa,
      et en 1984 la Région Sicile créa une réserve naturelle pour protéger les rares rescapés et les nombreux
      endémismes. Il demeure parmi les espèces végétales méditerranéennes les plus menacées selon l’UICN.


      Les forêts réservent d’autres surprises. Le houx peut atteindre quinze mètres, formant à Piano Pomo un
      bosquet remarquable. Dans la chênaie du Monte Quacella, le chêne vert côtoie le hêtre, alliance
      surprenante alors qu’un autre étage forestier s’interpose habituellement. Le hêtre atteint ici sa limite
      méridionale et occidentale d’Europe. L’astragale des Madonie forme un buisson épineux en coussinet
      endémique exclusif.


      Côté oiseaux, l’[aigle royal](/especie/aquila_chrysaetos/) est revenu nicher sur les cimes il y a
      quelques années, son envergure dépassant deux mètres. L’automne est propice à son observation. On
      rencontre aussi l’aigle de Bonelli, le [faucon pèlerin](/especie/falco_peregrinus/) et le faucon
      crécerelle. Sur les parois rocheuses s’abrite le crave à bec rouge, tandis qu’en hiver la bécasse des
      bois exploite les clairières la nuit. Ont en revanche disparu le [gypaète
      barbu](/especie/gypaetus_barbatus/), qui nichait encore sur le rocher de Gonato au XIXe siècle, et le
      [vautour fauve](/especie/gyps_fulvus/), dont les derniers individus furent vus il y a une vingtaine
      d’années.


      Parmi les petits mammifères vivent renards, belettes, [porcs-épics](/especie/hystrix_cristata/),
      lièvres, loirs, chats forestiers et martres. Dans les années quatre-vingt, le daim a été réintroduit.
    visit: >-
      Le sentier de l’aigle royal constitue l’approche idéale. Il part du parking de Piano Farina, à 1360 m,
      accessible depuis Petralia Sottana par la route provinciale 54, environ trois kilomètres avant Piano
      Battaglia. Il mesure 2 km, surmonte 45 m de dénivelé et s’effectue en environ 2 heures. Il longe un
      ancien màrcato pastoral toujours utilisé et aboutit à un belvédère sur le vallone Canna d’où l’on
      contemple les îles Éoliennes au nord, l’Etna à l’est, ainsi que le Monte Mufara et le Monte Ferro à
      l’ouest. Un observatoire ornithologique aménagé permet de guetter les rapaces à l’abri.


      À Petralia Sottana, le sentier géologique urbain fait découvrir des fossiles du Miocène, des coraux
      incrustés dans le portail de l’église San Pietro, d’anciennes fontaines et une glacière historique.
    history: >-
      Le parc naturel régional a été fondé par décret le 9 novembre 1989. Dans un géoparc, il est strictement
      interdit d’extraire des pierres des affleurements rocheux et de faire commerce de minéraux ou de
      fossiles.
    before: >-
      Il est formellement interdit de cueillir ou détruire des plantes. L’exploration des cavités karstiques
      impose des guides agréés. Préférez les visites au printemps et à l’automne.
    around: À 20 km se situe le [Parco dei Nebrodi](/lugar/parco-dei-nebrodi/).
  de:
    intro: >-
      Weniger als dreißig Exemplare dieser Tannenart wurden gezählt, konzentriert in einer einzigen Schlucht.
      Die Nebrodi-Tanne (Abies nebrodensis) ist die einzige autochthone mediterrane Tanne Italiens und kommt
      nur in den Madonie vor. An der Nordküste Siziliens, zwischen den Flüssen Imera und Pollina, umfasst der
      Park fünfzehn Gemeinden der Metropolitanstadt Palermo und das Madonie-Gebirge. Nach Angaben der
      Parkverwaltung handelt es sich um den artenreichsten Naturraum Siziliens und einen der reichsten des
      gesamten Mittelmeerraums.
    landscape: >-
      Die Madonie sind ein Kalksteingebirge, das unmittelbar aus dem Meer aufsteigt. Das Herzstück oberhalb
      von 1600 Metern bildet eine verkarstete Hochebene mit Dolinen, den sogenannten «quarare», die mehrere
      hundert Meter Durchmesser und bis zu 25 Meter Tiefe erreichen und oft von Buchen gesäumt sind. Den
      Gipfelbereich beherrscht der Pizzo Carbonara aus hartem grauem Korallenkalk. Auf dem Karst gibt es kaum
      oberirdische Fließgewässer, dafür ein verzweigtes Höhlensystem: Die Grotta Rossa, der Abisso del Vento
      und der Inghiottitoio Battaglietta erfordern fachkundige Höhlenführer. Die Becken von Piano Battaglia
      und Battaglietta stellen eine der eindrucksvollsten Karstlandschaften Siziliens dar.


      Zur Peripherie hin verändert sich das Gestein: Der schroffe Kalk weicht sanfteren Formen aus Ton- und
      Sandsteinformationen. Seit den fünfziger Jahren erkundeten Geologen die Schichten und beschrieben
      Formationen wie Mufara, Scillato, Fanusi, Crisanti und Caltavuturo. Der Madonie-Geopark gehört zum
      UNESCO-Geopark-Netzwerk.
    wildlife: >-
      Die Nebrodi-Tanne ist die bekannteste botanische Besonderheit. Einst weit verbreitet, brachten
      Holznutzung und Klimawandel die Art an den Rand der Ausrottung. Ausgewachsen wird sie kaum höher als 15
      m; die kreuzförmige Krone trug ihr den volkstümlichen Namen «arvuli cruci cruci» ein. 1958 wurde ein
      stattlicher Baum in Polizzi Generosa nachgewiesen, und 1984 wies die Region Sizilien ein Schutzgebiet
      aus. Heute zählt sie zu den meistbedrohten Pflanzen der Roten Liste der IUCN.


      Die Bergwälder bergen weitere Schätze: Stechpalmen erreichen hier fünfzehn Meter Wuchshöhe, namentlich
      am Piano Pomo. Im Flaumeichen-Steineichenwald am Monte Quacella begegnen sich Steineiche und Buche in
      einer ungewöhnlichen Lebensgemeinschaft. Für die Rotbuche liegt hier die südwestliche Arealgrenze in
      Europa. Der Madonie-Tragant bildet stachelige Polsterpolster, die weltweit nur hier wachsen.


      Unter den Greifvögeln brütet der [Steinadler](/especie/aquila_chrysaetos/) seit einigen Jahren wieder an
      den Steilwänden, seine Flügelspannweite übertrifft zwei Meter. Der Herbst bietet die besten
      Beobachtungschancen. Zudem leben hier Habichtsadler, [Wanderfalke](/especie/falco_peregrinus/) und
      Turmfalke. An Felswänden nistet die Alpendohle, während im Winter die Waldschnepfe Waldlichtungen nutzt.
      Verschwunden sind der [Bartgeier](/especie/gypaetus_barbatus/), der im neunzehnten Jahrhundert noch am
      Gonato-Felsen brütete, und der [Gänsegeier](/especie/gyps_fulvus/), dessen letzte Vertreter vor rund
      zwanzig Jahren gesehen wurden.


      Zu den kleineren Säugetieren gehören Rotfuchs, Mauswiesel, [Stachelschwein](/especie/hystrix_cristata/),
      Schneehase, Siebenschläfer, Wildkatze und Baummarder. In den achtziger Jahren wurde Damwild wieder
      angesiedelt.
    visit: >-
      Der Steinadlerpfad bietet den idealen Einstieg. Er beginnt am Wanderparkplatz Piano Farina auf 1360 m
      Höhe, erreichbar über Petralia Sottana und die Provinzstraße 54 rund drei Kilometer vor Piano Battaglia.
      Der Weg misst 2 km, überwindet 45 Höhenmeter und beansprucht etwa 2 Stunden. Er passiert einen
      historischen Hirtenplatz (màrcato) und führt zu einem Aussichtspunkt über den Vallone Canna mit Blick
      auf die Äolischen Inseln im Norden, den Ätna im Osten sowie Monte Mufara und Monte Ferro im Westen. Eine
      Beobachtungshütte lädt zum Verweilen ein.


      In Petralia Sottana führt ein geologischer Stadtrundgang zu miozänen Fossilien, versteinerten Korallen
      am Portal der Kirche San Pietro und historischen Brunnenanlagen.
    history: >-
      Der regionale Naturpark wurde am 9. November 1989 per Dekret eingerichtet. Im Geopark ist das Entnehmen
      von Gestein sowie der Handel mit Mineralien und Fossilien streng verboten.
    before: >-
      Das Pflücken, Beschädigen oder Ausgraben von Pflanzen ist verboten. Karsthöhlen dürfen nur mit
      autorisierten Führern betreten werden. Frühling und Herbst bieten ideale Wanderbedingungen.
    around: In 20 km Entfernung liegt der [Parco dei Nebrodi](/lugar/parco-dei-nebrodi/).
  it:
    intro: >-
      Sono stati censiti meno di trenta abeti di questa specie, tutti raccolti in un solo vallone. L'abete dei
      Nebrodi, Abies nebrodensis, è l'unica specie di abete mediterraneo spontaneo d'Italia e vegeta
      unicamente sulle Madonie. Lungo la costa tirrenica settentrionale della Sicilia, tra i fiumi Imera e
      Pollina, il parco abbraccia quindici comuni della città metropolitana di Palermo e il massiccio
      montuoso. Secondo l'ente parco, è il distretto a maggior biodiversità della Sicilia e uno dei più ricchi
      dell'intero bacino mediterraneo.
    landscape: >-
      Le Madonie sono una montagna di calcare che sorge direttamente dal mare. Il cuore sommitale, sopra i
      1600 metri, forma un vasto altopiano carsico costellato di doline, le «quarare», larghe diverse
      centinaia di metri e profonde fino a 25 m, spesso rivestite di faggete. Qui svetta il Pizzo Carbonara,
      costituito da durissimo calcare corallino grigio. Sul massiccio carsico manca un reticolo idrografico
      superficiale, sostituito da una fitta circolazione sotterranea: la Grotta Rossa, l'Abisso del Vento e
      l'Inghiottitoio Battaglietta richiedono l'accompagnamento di speleologi esperti. Le conche di Piano
      Battaglia e Battaglietta compongono uno dei paesaggi carsici più estesi dell'isola.


      Verso i margini la morfologia muta: le pareti calcaree lasciano spazio a rilievi più dolci d'origine
      argilloso-arenacea. A partire dagli anni cinquanta i geologi dell'industria petrolifera studiarono il
      comprensorio definendo formazioni come Mufara, Scillato, Fanusi, Crisanti e Caltavuturo. Il Madonie
      Geopark fa parte della Rete Mondiale dei Geoparchi UNESCO.
    wildlife: >-
      L'abete dei Nebrodi ne è l'emblema. Un tempo ampiamente diffuso sulle cime siciliane, i disboscamenti lo
      portarono a un passo dalla totale scomparsa. L'albero adulto non supera i 15 m; la chioma con rami
      disposti a croce gli valse il nome dialettale di «arvuli cruci cruci». Nel 1958 ne fu individuato un
      esemplare rigoglioso a Polizzi Generosa e nel 1984 la Regione Siciliana istituì una riserva naturale per
      preservare i superstiti e gli endemismi locali. Oggi figura stabilmente fra le specie vegetali più
      minacciate della Lista Rossa IUCN.


      Nei boschi si incontrano altri tesori. L'agrifoglio può toccare i quindici metri d'altezza, con un
      nucleo monumentale a Piano Pomo. Nel lecceto di Monte Quacella il leccio convive direttamente con il
      faggio, combinazione rarissima che segna per il faggio il limite meridionale e occidentale d'Europa.
      L'astragalo delle Madonie forma cuscinetti spinosi esclusivi di queste vette.


      Fra i rapaci, l'[aquila reale](/especie/aquila_chrysaetos/) è tornata a nidificare sulle pareti più alte
      con un'apertura alare che supera i due metri. L'autunno offre le migliori possibilità di avvistamento.
      Sono presenti anche l'aquila di Bonelli, il [falco pellegrino](/especie/falco_peregrinus/) e il gheppio.
      Sulle rupi staziona il gracchio corallino, mentre d'inverno la beccaccia frequenta le radure boschive.
      Mancano ormai il [gipeto](/especie/gypaetus_barbatus/), che nidificava sulla rocca di Gonato
      nell'Ottocento, e il [grifone](/especie/gyps_fulvus/), i cui ultimi esemplari locali risalgono a una
      ventina di anni fa.


      Tra i mammiferi minori figurano volpi, donnole, [istrici](/especie/hystrix_cristata/), lepri
      appenniniche, ghiri, gatti selvatici e martore. Negli anni ottanta è stato reintrodotto il daino.
    visit: >-
      Il sentiero dell'aquila reale è l'itinerario introduttivo d'eccellenza. Prende avvio dal parcheggio di
      Piano Farina, a 1360 m di quota, raggiungibile da Petralia Sottana lungo la strada provinciale 54, circa
      tre chilometri prima di Piano Battaglia. Misura 2 km, supera 45 m di dislivello e si percorre in circa 2
      ore. Sfiora un antico màrcato pastorale tuttora utilizzato e raggiunge un belvedere panoramico sul
      vallone Canna, con vista sulle isole Eolie a nord, sull'Etna a est, e su Monte Mufara e Monte Ferro a
      ovest. Una capanna di birdwatching permette l'osservazione dei rapaci al riparo.


      A Petralia Sottana il percorso geologico urbano consente di ammirare fossili del Miocene, coralli
      incastonati nel portale della chiesa di San Pietro e una storica neviera.
    history: >-
      Il parco naturale regionale è stato istituito con decreto il 9 novembre 1989. All'interno del geopark è
      severamente vietato asportare rocce e commerciare minerali o fossili.
    before: >-
      È proibito raccogliere, danneggiare o asportare piante selvatiche. L'accesso agli inghiottitoi carsici
      richiede guide esperte. La primavera e l'autunno offrono il clima ideale.
    around: A 20 km sorge il [Parco dei Nebrodi](/lugar/parco-dei-nebrodi/).
  pt:
    intro: >-
      Foram recenseados menos de trinta abetos desta espécie, todos confinados a uma única ravina. O
      abeto-dos-nebrodi, Abies nebrodensis, é a única espécie de abeto mediterrânico autóctone de Itália e
      subsiste exclusivamente nas Madonie. Ao longo da costa norte da Sicília, entre os rios Imera e Pollina,
      o parque congrega quinze municípios da cidade metropolitana de Palermo e o maciço montanhoso. Segundo a
      própria instituição gestora, é o reduto com maior biodiversidade da Sicília e um dos mais expressivos de
      toda a bacia mediterrânica.
    landscape: >-
      As Madonie constituem uma montanha de calcário que nasce diretamente do mar. O núcleo central, acima dos
      1600 metros de altitude, forma um planalto cárstico semeado de dolinas, as «quarare», com centenas de
      metros de diâmetro e até 25 de profundidade, amiúde cobertas por faias. Aí sobressai o Pizzo Carbonara,
      talhado em calcário cinzento muito compacto. No carste não corre rede hidrográfica superficial,
      existindo em contrapartida uma circulação subterrânea rica: a Grotta Rossa, o Abisso del Vento e o
      Inghiottitoio Battaglietta exigem o acompanhamento de espeleólogos experimentados. As depressões de
      Piano Battaglia e Battaglietta compõem uma das paisagens cársticas mais amplas da Sicília.


      Rumo à periferia o relevo atenua-se: a imponência calcária cede lugar a formas mais suaves de origem
      argilo-arenosa. A partir dos anos cinquenta, geólogos do setor energético definiram formações como
      Mufara, Scillato, Fanusi, Crisanti e Caltavuturo. O Madonie Geopark integra a Rede Mundial de Geoparques
      da UNESCO.
    wildlife: >-
      O abeto-dos-nebrodi é a grande referência botânica. Outrora abundante, o corte sistemático levou-o quase
      ao desaparecimento. O exemplar adulto não passa de 15 m; a copa cruciforme valeu-lhe a designação
      tradicional de «arvuli cruci cruci». Em 1958 foi redescoberto um exemplar portentoso em Polizzi Generosa
      e em 1984 a Região da Sicília instituiu uma reserva natural para resguardar os sobreviventes e o elevado
      endemismo. Consta hoje entre as plantas mediterrânicas mais vulneráveis da Lista Vermelha da UICN.


      As florestas acolhem outras raridades. O azevinho chega a medir quinze metros, existindo um bosque
      memorável em Piano Pomo. No carvalhal de Monte Quacella a azinheira convive diretamente com a faia,
      consociação invulgar que marca para a faia o extremo meridional e ocidental na Europa. O
      astrágalo-das-madonie forma almofadas espinhosas exclusivas destas serras.


      Nas aves de rapina, a [águia-real](/especie/aquila_chrysaetos/) voltou a nidificar nas escarpas
      superiores, registando envergadura superior a dois metros. O outono propicia as melhores observações.
      Avistam-se igualmente a águia-perdigueira, o [falcão-peregrino](/especie/falco_peregrinus/) e o
      peneireiro-vulgar. Nas falésias reside a gralha-de-bico-vermelho, ao passo que no inverno a galinhola
      frequenta as clareiras florestais durante a noite. Desapareceram o
      [quebra-ossos](/especie/gypaetus_barbatus/), que ainda criava nas rochas de Gonato no século XIX, e o
      [grifo](/especie/gyps_fulvus/), cujos últimos registos datam de há cerca de vinte anos.


      Entre a fauna menor contam-se raposas, doninhas, [porcos-espinhos](/especie/hystrix_cristata/),
      lebres-ibéricas, arganazes, gatos-bravos e martas. Nos anos oitenta foi reintroduzido o gamo.
    visit: >-
      O trilho da águia-real é o percurso introdutório recomendado. Começa no parque de estacionamento de
      Piano Farina, a 1360 m de cota, acessível por Petralia Sottana pela estrada provincial 54, cerca de três
      quilómetros antes de Piano Battaglia. Tem 2 km de extensão, vence 45 m de desnível e cumpre-se em cerca
      de 2 horas. Cruza um antigo màrcato pastoril ainda ativo e atinge um miradouro sobre o vale Canna com
      vistas para as ilhas Eólias a norte, o Etna a leste, e o Monte Mufara e Monte Ferro a oeste. Um posto de
      observação de aves oferece abrigo para vigiar o céu.


      Em Petralia Sottana, o roteiro geológico urbano conduz por fósseis do Mioceno, corais fossilizados no
      pórtico da igreja de San Pietro e uma histórica casa da neve.
    history: >-
      O parque natural regional foi formalizado por decreto a 9 de novembro de 1989. No interior de um
      geoparque é terminantemente proibido extrair rochas dos afloramentos e comercializar minerais ou
      fósseis.
    before: >-
      É expressamente proibido colher, destruir ou retirar plantas. A incursão nas grutas cársticas depende de
      guias credenciados. A primavera e o outono oferecem a melhor época de visita.
    around: A 20 km estende-se o [Parco dei Nebrodi](/lugar/parco-dei-nebrodi/).
