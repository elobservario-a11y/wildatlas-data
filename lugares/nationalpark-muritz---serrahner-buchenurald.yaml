observaciones:
  es: >-
    A Zinow se llega en el autobús 619 entre Neustrelitz y Feldberg, y de vuelta se puede volver por el carril
    bici o con ese mismo autobús. El acceso desde Neustrelitz a Zinow está señalizado, a 10 km. En la zona
    núcleo y en la de cuidado no se puede salir de calles y caminos, y en la núcleo tampoco se recogen setas.
    Está prohibido hacer fuego en el bosque y a menos de 50 m de él.
texto:
  es:
    intro: >-
      Durante mucho tiempo, los bosques de Serrahn tuvieron la suerte de que a alguien le gustara demasiado la
      caza. La pasión cinegética de los grandes duques de Mecklemburgo-Strelitz dejó casi intactos los bosques
      de la zona, y así se salvaron las hayas más viejas del lugar, que más tarde fueron reserva natural y
      desde 1990, parte del parque nacional. Hoy forman parte del sector oriental del Parque Nacional de
      Müritz; su núcleo de hayedo antiguo es Patrimonio Mundial de la UNESCO desde 2011.
    landscape: >-
      El sector de Serrahn es la parte oriental del parque, entre la meseta de lagos de Mecklemburgo y la
      comarca de lagos de Feldberg. Es una zona de colinas boscosas: aquí están las mayores alturas de todo el
      parque, el Hirschberg, de 143,7 m, y el Warsberg, de 143,2 m. Entre los lagos grandes están el Große
      Fürstenseer See, el Schweingartensee y el Zwirnsee.


      Lo que manda es el haya. Si el hombre no hubiera talado los bosques, hoy toda esta tierra estaría
      cubierta de hayedo; solo en los sitios muy húmedos habría alisedas y fresnedas. En las colinas de
      Serrahn, un amplio rodal de hayas viejas conserva estructuras próximas a las de un bosque primario. Y el
      trayecto lo cuenta: el recorrido atraviesa pinares abiertos antes de internarse bajo viejas hayas de
      gran tamaño. Las depresiones entre los hayedos cerrados acumulan a menudo lagos de aire frío.
    wildlife: >-
      La fauna de Serrahn es la de un bosque y sus lagos. El [ciervo rojo](/especie/cervus_elaphus/) es el
      mayor mamífero de la zona protegida. En el aire, las [grullas](/especie/grus_grus/) y los
      [avetoros](/especie/botaurus_stellaris/) son aves típicas del paisaje forestal y acuático de Serrahn, y
      en el parque pueden verse [pigargos](/especie/haliaeetus_albicilla/), [águilas
      pescadoras](/especie/pandion_haliaetus/) y grullas durante sus desplazamientos estacionales. El parque
      dispone de 25 plataformas, torres y pantallas para observar aves acuáticas y rapaces.


      El sendero del bosque se disfruta en cualquier época del año, y por él se ve cómo nace la naturaleza
      salvaje.
    visit: >-
      La exposición multimedia Im Reich der Buchen está en plena zona de hayedos, en el pueblo de Serrahn. Es
      accesible sin barreras; confirma el horario con el punto de información antes de ir. Allí encontrarás
      también una exposición de fotos del fotógrafo de naturaleza Roman Vitt, y otra cuenta la historia del
      paisaje y el valor de los hayedos viejos.


      El sendero de experiencias Grünes Buchenblatt es la forma de entrar. La travesía desde Zinow hasta
      Dianenhof, pasando por Serrahn y el Schweingartensee, mide 6,5 km; incluye la pasarela sobre la turbera.
      Si vuelves desde Serrahn a Zinow por la pista, el circuito da 8 km. La variante que completa la vuelta
      desde Dianenhof por el carril bici junto a la carretera figura con 11 km en la propuesta alemana del
      parque. Desde Dianenhof, la ida y vuelta a Serrahn mide 5 km, se presenta como un recorrido de
      accesibilidad limitada para sillas de ruedas y cochecitos: hay tramos con pendientes fuertes.


      Si prefieres la bicicleta, el circuito Grüner Radfahrer rodea Zinow, Serrahn, Grünow y Carpin en 24 km.
      Desde Neustrelitz, la señal verde de bicicleta guía hacia Zinow a lo largo de unos diez kilómetros.
    history: >-
      Los bosques de Serrahn se libraron del hacha por la caza de los duques y se convirtieron en reserva
      natural y luego, en 1990, en parque nacional. El 25 de junio de 2011, una parte de estos hayedos entró
      en el Patrimonio Mundial.
    before: >-
      A Zinow se llega en el autobús 619 entre Neustrelitz y Feldberg, y de vuelta se puede volver por el
      carril bici o con ese mismo autobús. El acceso desde Neustrelitz a Zinow está señalizado, a 10 km. En la
      zona núcleo y en la de cuidado no se puede salir de calles y caminos, y en la núcleo tampoco se recogen
      setas. Está prohibido hacer fuego en el bosque y a menos de 50 m de él.
    around: >-
      Serrahn forma parte de [Bosques del Parque Nacional Müritz](/lugar/nationalpark-muritz-waldgebiete/). A
      unos 4 km están los [Bosques del Parque Natural Lagos de
      Uckermark](/lugar/uckermarkische-seen-forests/), y a unos 11 km, la [Reserva Natural de Heilige
      Hallen](/lugar/naturschutzgebiet-heilige-hallen-mecklenburg/).


      Más lejos, el [Bosque de Orient - Sectores Forestales](/lugar/foret-d-orient---secteurs-forestiers/), el
      [Parque Nacional de Ķemeri](/lugar/kemeru-nacionalais-parks/), el [Lago del
      Der-Chantecoq](/lugar/lac-du-der-chantecoq/) y el [Parque Nacional de Store
      Mosse](/lugar/store-mosse-national-park/) comparten la grulla y el pigargo.
  en:
    intro: >-
      For a long time, the woodlands of Serrahn were fortunate that someone was excessively fond of hunting.
      The hunting passion of the Grand Dukes of Mecklenburg-Strelitz left the local forests virtually
      untouched, sparing the area's oldest beech trees, which later became a nature reserve and, since 1990,
      part of the national park. Today they constitute the eastern sector of Müritz National Park; its ancient
      beech core has been a UNESCO World Heritage site since 2011.
    landscape: >-
      The Serrahn sector forms the eastern part of the park, between the Mecklenburg Lake Plateau and the
      Feldberg Lake District. It is a land of wooded hills: here rise the highest points in the entire
      national park, the Hirschberg at 143.7 m and the Warsberg at 143.2 m. Prominent large lakes include the
      Große Fürstenseer See, the Schweingartensee and the Zwirnsee.


      Beech reigns supreme. Had humans not cleared the woods, this entire landscape would today be shrouded in
      beech forest; only on waterlogged ground would alder and ash carrs prevail. Across the rolling ridges of
      Serrahn, a wide stand of ancient beeches preserves structures closely resembling those of a primeval
      forest. The approach tells that story: the trail traverses open pine woods before plunging beneath
      towering old beeches. Hollows nestled among dense beech stands often trap pools of cold air.
    wildlife: >-
      The fauna of Serrahn reflects this union of forest and water. The [red deer](/especie/cervus_elaphus/)
      is the largest mammal in the protected area. In the air, [common cranes](/especie/grus_grus/) and
      [Eurasian bitterns](/especie/botaurus_stellaris/) are signature birds of this forest-and-wetland mosaic,
      and across the park you can spot [white-tailed eagles](/especie/haliaeetus_albicilla/),
      [ospreys](/especie/pandion_haliaetus/) and cranes on their seasonal movements. The park maintains 25
      observation platforms, towers and hides for watching waterbirds and raptors.


      The forest trail can be enjoyed at any time of year, offering a front-row view of wild nature taking
      shape.
    visit: >-
      The multimedia exhibition Im Reich der Buchen sits in the heart of the beechwoods, in the hamlet of
      Serrahn. It is barrier-free; confirm opening times with the information office before setting out. There
      you will also find a photography exhibition by nature photographer Roman Vitt, while another display
      charts the history of the landscape and the ecological value of ancient beechwoods.


      The Grünes Buchenblatt nature experience trail is the classic route in. The traverse from Zinow to
      Dianenhof, passing through Serrahn and along the Schweingartensee, measures 6.5 km and includes a
      boardwalk across the mire. If you loop back from Serrahn to Zinow along the forest track, the circuit
      comes to 8 km. The longer variant returning from Dianenhof via the roadside cycle path is listed as 11
      km in official park guides. From Dianenhof, the out-and-back walk to Serrahn measures 5 km and is graded
      as having limited accessibility for wheelchairs and prams due to steep gradients.


      If you prefer cycling, the Grüner Radfahrer circular route links Zinow, Serrahn, Grünow and Carpin over
      24 km. From Neustrelitz, green cycle signage guides you toward Zinow along some ten kilometres.
    history: >-
      Saved from the axe by the ducal hunts, Serrahn's forests became a nature reserve and then, in 1990, a
      national park. On 25 June 2011, part of these beechwoods was inscribed onto the World Heritage list.
    before: >-
      Zinow is reached on bus 619 running between Neustrelitz and Feldberg; for the return journey you can
      cycle or catch the same bus. The approach from Neustrelitz to Zinow is signposted at 10 km. In core and
      management zones you must not leave marked roads and trails, and mushroom picking is prohibited in the
      core zone. Lighting fires is forbidden in the forest and within 50 m of it.
    around: >-
      Serrahn forms part of the [Müritz National Park Forests](/lugar/nationalpark-muritz-waldgebiete/).
      Around 4 km away lie the [Uckermark Lakes Nature Park Forests](/lugar/uckermarkische-seen-forests/), and
      about 11 km away is the [Heilige Hallen Nature
      Reserve](/lugar/naturschutzgebiet-heilige-hallen-mecklenburg/).


      Further afield, [Orient Forest - Forest Sectors](/lugar/foret-d-orient---secteurs-forestiers/), [Ķemeri
      National Park](/lugar/kemeru-nacionalais-parks/), [Lake Der-Chantecoq](/lugar/lac-du-der-chantecoq/) and
      [Store Mosse National Park](/lugar/store-mosse-national-park/) share the common crane with Serrahn.
  fr:
    intro: >-
      Pendant longtemps, les forêts de Serrahn ont eu la chance qu'une figure puissante voue une passion
      démesurée à la chasse. La passion cynégétique des grands-ducs de Mecklembourg-Strelitz a préservé
      presque intacts les massifs forestiers locaux, épargnant les plus vieux hêtres qui devinrent plus tard
      une réserve naturelle puis, dès 1990, partie intégrante du parc national. Ils forment aujourd'hui le
      secteur oriental du parc national de la Müritz ; leur cœur de hêtraie ancienne est inscrit au patrimoine
      mondial de l'UNESCO depuis 2011.
    landscape: >-
      Le secteur de Serrahn correspond à la portion orientale du parc, entre le plateau des lacs
      mecklembourgeois et la région des lacs de Feldberg. C'est un relief de collines boisées abritant les
      points culminants de tout le parc national : le Hirschberg, à 143,7 m, et le Warsberg, à 143,2 m. Parmi
      les grands plans d'eau se distinguent le Große Fürstenseer See, le Schweingartensee et le Zwirnsee.


      Le hêtre domine sans partage. Sans les défrichements historiques, tout ce territoire serait aujourd'hui
      couvert de hêtraies ; seuls les dépressions humides accueilleraient aulnaies et frênaies. Sur les
      collines de Serrahn, un vaste peuplement de vieux hêtres conserve des structures proches d'une forêt
      primaire. L'itinéraire en témoigne : le sentier traverse d'abord des pinèdes claires avant de s'enfoncer
      sous de grands hêtres vénérables. Les combes nichées entre les hêtraies denses piègent fréquemment des
      poches d'air froid.
    wildlife: >-
      La faune de Serrahn associe le milieu forestier aux étendues d'eau. Le [cerf
      élaphe](/especie/cervus_elaphus/) est le plus grand mammifère de cette zone protégée. Dans les airs, la
      [grue cendrée](/especie/grus_grus/) et le [butor étoilé](/especie/botaurus_stellaris/) sont
      emblématiques de cette mosaïque d'eaux et de forêts, tandis que le [pygargue à queue
      blanche](/especie/haliaeetus_albicilla/), le [balbuzard pêcheur](/especie/pandion_haliaetus/) et les
      grues s'observent lors de leurs migrations et trajets quotidiens. Le parc compte 25 plateformes, tours
      et observatoires pour contempler avifaune aquatique et rapaces.


      Ce chemin forestier s'apprécie en toute saison et dévoile la renaissance d'une nature pleinement
      sauvage.
    visit: >-
      L'exposition multimédia Im Reich der Buchen se dresse au cœur des hêtraies, dans le hameau de Serrahn.
      Elle est accessible sans obstacle ; vérifiez les horaires auprès du point d'information avant votre
      visite. Vous y découvrirez également une exposition photographique de Roman Vitt, tandis qu'un autre
      espace retrace l'histoire du paysage et la valeur patrimoniale des vieilles hêtraies.


      Le sentier d'interprétation Grünes Buchenblatt constitue la voie royale pour pénétrer les lieux. La
      traversée de Zinow à Dianenhof via Serrahn et le Schweingartensee compte 6,5 km et comprend une
      passerelle au-dessus de la tourbière. Si vous revenez de Serrahn à Zinow par la piste forestière, la
      boucle atteint 8 km. La variante bouclant le retour depuis Dianenhof par la piste cyclable le long de la
      route est évaluée à 11 km par le parc. Depuis Dianenhof, l'aller-retour jusqu'à Serrahn totalise 5 km ;
      il est signalé d'accessibilité restreinte pour fauteuils roulants et poussettes en raison de pentes
      accentuées.


      À vélo, le circuit balisé Grüner Radfahrer contourne Zinow, Serrahn, Grünow et Carpin sur 24 km. Depuis
      Neustrelitz, le balisage vert pour cyclistes conduit vers Zinow sur une dizaine de kilomètres.
    history: >-
      Épargnées par la cognée grâce aux chasses ducales, les forêts de Serrahn sont devenues une réserve
      naturelle puis, en 1990, un parc national. Le 25 juin 2011, une partie de ces hêtraies a rejoint le
      patrimoine mondial.
    before: >-
      On gagne Zinow par le bus 619 reliant Neustrelitz à Feldberg ; le retour s'effectue par la piste
      cyclable ou ce même autocar. L'accès depuis Neustrelitz jusqu'à Zinow est balisé sur 10 km. Dans la zone
      centrale et la zone de soins, il est interdit de quitter les voies autorisées, et la cueillette des
      champignons est proscrite en zone centrale. Il est interdit d'allumer du feu en forêt et à moins de 50 m
      des lisières.
    around: >-
      Serrahn fait partie des [Forêts du parc national de la Müritz](/lugar/nationalpark-muritz-waldgebiete/).
      À environ 4 km s'étendent les [Forêts du parc naturel des lacs de
      l'Uckermark](/lugar/uckermarkische-seen-forests/), et à environ 11 km se trouve la [Réserve naturelle
      des Heilige Hallen](/lugar/naturschutzgebiet-heilige-hallen-mecklenburg/).


      Plus loin, la [Forêt d'Orient - Secteurs forestiers](/lugar/foret-d-orient---secteurs-forestiers/), le
      [Parc national de Ķemeri](/lugar/kemeru-nacionalais-parks/), le [Lac du
      Der-Chantecoq](/lugar/lac-du-der-chantecoq/) et le [Parc national de Store
      Mosse](/lugar/store-mosse-national-park/) partagent la grue cendrée avec Serrahn.
  de:
    intro: >-
      Lange Zeit hatten die Wälder von Serrahn das Glück, dass jemand eine ausgeprägte Jagdleidenschaft hegte.
      Die Jagdlust der Großherzöge von Mecklenburg-Strelitz ließ die Forste weitgehend unberührt und
      verschonte die ältesten Buchen des Gebiets, die später Naturschutzgebiet und 1990 Teil des Nationalparks
      wurden. Heute bilden sie den Ostteil des Müritz-Nationalparks; ihr Buchenurwald-Kern gehört seit 2011
      zum UNESCO-Weltnaturerbe.
    landscape: >-
      Der Serrahner Teil ist der Ostsektor des Nationalparks zwischen der Mecklenburgischen Seenplatte und dem
      Feldberger Seenland. Er ist geprägt von bewaldeten Hügeln: Hier liegen die höchsten Erhebungen des
      gesamten Parks, der Hirschberg mit 143,7 m und der Warsberg mit 143,2 m. Zu den größeren Gewässern
      zählen der Große Fürstenseer See, der Schweingartensee und der Zwirnsee.


      Die Buche dominiert das Bild. Hätte der Mensch den Urwald nicht gerodet, wäre dieses Land heute
      flächendeckend von Buchenwald überzogen; nur an nassen Standorten behaupteten sich Erlen- und
      Eschenbrüche. Auf den Kuppen von Serrahn bewahrt ein ausgedehnter Altholzbestand Strukturen, die denen
      eines Primärwaldes sehr nahekommen. Der Wanderweg macht diesen Übergang spürbar: Du querst lichte
      Kiefernbestände, bevor du unter mächtige Altbuchen trittst. In Senken zwischen geschlossenen
      Buchenwäldern stauen sich oft Kaltluftseen.
    wildlife: >-
      Die Tierwelt von Serrahn spiegelt das Ineinandergreifen von Wald und Wasser wider. Der
      [Rothirsch](/especie/cervus_elaphus/) ist das größte Säugetier im Schutzgebiet. Am Himmel sind
      [Kranich](/especie/grus_grus/) und [Rohrdommel](/especie/botaurus_stellaris/) typische Bewohner dieser
      Wald- und Seenlandschaft; zudem lassen sich [Seeadler](/especie/haliaeetus_albicilla/),
      [Fischadler](/especie/pandion_haliaetus/) und Kraniche auf ihren Flügen beobachten. Der Park unterhält
      25 Beobachtungsplattformen, Türme und Kanzeln zur Vogelbeobachtung.


      Der Waldweg lohnt zu jeder Jahreszeit und lässt dich das Werden wilder Natur unmittelbar miterleben.
    visit: >-
      Die multimediale Ausstellung Im Reich der Buchen erwartet dich mitten im Buchengebiet im Ort Serrahn.
      Sie ist barrierefrei zugänglich; kläre die Öffnungszeiten vorab über die Information. Dort siehst du
      auch Fotografien des Naturfotografen Roman Vitt, während eine weitere Ausstellung Landschaftsgeschichte
      und Buchenwaldschutz beleuchtet.


      Der Erlebnispfad Grünes Buchenblatt erschließt das Herzstück. Die Wanderung von Zinow nach Dianenhof
      über Serrahn und den Schweingartensee misst 6,5 km und führt über einen Moorsteg. Wenn du von Serrahn
      auf dem Forstweg nach Zinow zurückkehrst, beträgt der Rundweg 8 km. Die Variante zurück ab Dianenhof auf
      dem straßenbegleitenden Radweg ist mit 11 km ausgewiesen. Der Hin- und Rückweg von Dianenhof nach
      Serrahn ist 5 km lang; wegen steiler Kuppen gilt er für Rollstühle und Kinderwagen nur als bedingt
      befahrbar.


      Für Radfahrer bietet sich die 24 km lange Rundroute Grüner Radfahrer um Zinow, Serrahn, Grünow und
      Carpin an. Von Neustrelitz aus weist ein grünes Radsymbol über rund zehn Kilometer den Weg nach Zinow.
    history: >-
      Von großherzoglichen Jagden vor dem Holzeinschlag bewahrt, wurden die Serrahner Wälder Naturschutzgebiet
      und 1990 Nationalpark. Am 25. Juni 2011 wurde ein Teil dieser Buchenwälder in das UNESCO-Weltnaturerbe
      aufgenommen.
    before: >-
      Zinow erreichst du mit der Buslinie 619 zwischen Neustrelitz und Feldberg; die Rückfahrt gelingt per Rad
      oder mit demselben Bus. Die Strecke ab Neustrelitz bis Zinow ist über 10 km beschildert. In Kern- und
      Pflegezone gilt striktes Wegegebot, und in der Kernzone ist Pilzesammeln untersagt. Offenes Feuer ist im
      Wald sowie im Abstand von weniger als 50 m verboten.
    around: >-
      Serrahn ist Teil des Gebiets [Nationalpark Müritz -
      Waldgebiete](/lugar/nationalpark-muritz-waldgebiete/). Rund 4 km entfernt liegen die [Wälder des
      Naturparks Uckermärkische Seen](/lugar/uckermarkische-seen-forests/), und etwa 11 km entfernt das
      [Naturschutzgebiet Heilige Hallen](/lugar/naturschutzgebiet-heilige-hallen-mecklenburg/).


      Weiter entfernt teilen [Wald von Orient - Waldgebiete](/lugar/foret-d-orient---secteurs-forestiers/),
      [Nationalpark Ķemeri](/lugar/kemeru-nacionalais-parks/), [Lac du
      Der-Chantecoq](/lugar/lac-du-der-chantecoq/) und [Nationalpark Store
      Mosse](/lugar/store-mosse-national-park/) den Kranich mit Serrahn.
  it:
    intro: >-
      Per lungo tempo le foreste di Serrahn hanno goduto del privilegio che una figura potente nutrisse una
      smodata passione venatoria. La passione per la caccia dei granduchi di Meclemburgo-Strelitz mantenne
      quasi intatti i boschi della zona, risparmiando i faggi più vetusti che in seguito divennero riserva
      naturale e, dal 1990, parte del parco nazionale. Oggi formano il settore orientale del Parco Nazionale
      di Müritz; il loro cuore di faggeta antica è Patrimonio Mondiale dell'UNESCO dal 2011.
    landscape: >-
      Il settore di Serrahn costituisce la porzione orientale del parco, compresa tra l'altopiano dei laghi
      del Meclemburgo e il distretto lacustre di Feldberg. È un territorio di colline boscose dove si trovano
      i rilievi maggiori dell'intero parco: l'Hirschberg, di 143,7 m, e il Warsberg, di 143,2 m. Tra gli
      specchi d'acqua principali spiccano il Große Fürstenseer See, lo Schweingartensee e lo Zwirnsee.


      Il faggio domina incontrastato. Senza i disboscamenti del passato, l'intera regione sarebbe coperta da
      faggete; solo nelle depressioni allagate prospererebbero ontaneti e frassineti. Sulle alture di Serrahn,
      un consistente popolamento di faggi vetusti conserva fisionomie vicine a quelle di una foresta primaria.
      Il sentiero ne racconta la transizione: il tracciato attraversa pinete rade prima di addentrarsi sotto
      maestosi faggi monumentali. Le conche tra le fitte faggete accumulano sovente ristagni di aria fredda.
    wildlife: >-
      La fauna di Serrahn riflette il legame indissolubile tra foresta e specchi d'acqua. Il [cervo
      nobile](/especie/cervus_elaphus/) è il mammifero più imponente dell'area protetta. Nei cieli, la
      [gru](/especie/grus_grus/) e il [tarabuso](/especie/botaurus_stellaris/) sono specie caratteristiche di
      questo mosaico boschivo e palustre, mentre nel parco si possono scorgere l'[aquila di
      mare](/especie/haliaeetus_albicilla/), il [falco pescatore](/especie/pandion_haliaetus/) e le gru lungo
      le loro rotte stagionali. Il parco dispone di 25 piattaforme, torri e capanni per il birdwatching.


      Il sentiero nel bosco si apprezza in qualsiasi stagione, mostrando da vicino il farsi della natura
      selvaggia.
    visit: >-
      La mostra multimediale Im Reich der Buchen sorge nel cuore delle faggete, nel villaggio di Serrahn. È
      accessibile senza barriere; verifica gli orari con il punto informativo prima di partire. Lì puoi
      ammirare anche una mostra del fotografo naturalista Roman Vitt, oltre a un allestimento sulla storia del
      paesaggio e sul valore delle faggete antiche.


      Il percorso didattico Grünes Buchenblatt rappresenta l'accesso ideale. La traversata da Zinow a
      Dianenhof via Serrahn e lo Schweingartensee misura 6,5 km e comprende una passerella sospesa sulla
      torbiera. Tornando da Serrahn a Zinow per la pista forestale, l'anello misura 8 km. La variante che
      chiude il giro da Dianenhof lungo la pista ciclabile adiacente alla strada è indicata come 11 km nelle
      guide ufficiali. Da Dianenhof l'andata e ritorno per Serrahn copre 5 km; è classificata ad accessibilità
      limitata per carrozzine e passeggini per via delle pendenze accentuate.


      In bicicletta, il circuito Grüner Radfahrer abbraccia Zinow, Serrahn, Grünow e Carpin lungo 24 km. Da
      Neustrelitz il segnavia ciclabile verde indirizza a Zinow lungo circa dieci chilometri.
    history: >-
      Scampate all'abbattimento grazie alle riserve di caccia ducali, le foreste di Serrahn divennero riserva
      naturale e poi, nel 1990, parco nazionale. Il 25 giugno 2011 una porzione di queste faggete è stata
      inclusa nel Patrimonio Mondiale.
    before: >-
      A Zinow si giunge con la linea bus 619 tra Neustrelitz e Feldberg; per il rientro si può usare la bici o
      la stessa linea. Il collegamento da Neustrelitz a Zinow è segnalato a 10 km. Nella zona centrale e nella
      zona di tutela vigono divieti rigidi di uscire dalle piste segnate, e nella zona centrale è vietata la
      raccolta dei funghi. È vietato accendere fuochi nel bosco e a meno di 50 m dal margine.
    around: >-
      Serrahn appartiene alle [Foreste del Parco Nazionale di
      Müritz](/lugar/nationalpark-muritz-waldgebiete/). A circa 4 km si trovano le [Foreste del Parco Naturale
      dei Laghi dell'Uckermark](/lugar/uckermarkische-seen-forests/), e a circa 11 km la [Riserva Naturale di
      Heilige Hallen](/lugar/naturschutzgebiet-heilige-hallen-mecklenburg/).


      Più lontano, la [Foresta d'Oriente - Settori forestali](/lugar/foret-d-orient---secteurs-forestiers/),
      il [Parco Nazionale di Ķemeri](/lugar/kemeru-nacionalais-parks/), il [Lago del
      Der-Chantecoq](/lugar/lac-du-der-chantecoq/) e il [Parco Nazionale di Store
      Mosse](/lugar/store-mosse-national-park/) condividono con Serrahn la gru.
  pt:
    intro: >-
      Durante muito tempo, os bosques de Serrahn tiveram a sorte de um governante nutrir uma enorme afeição
      pela caça. A paixão cinegética dos grão-duques de Mecklemburgo-Strelitz manteve praticamente intactas as
      matas locais, poupando as faias mais velhas da região, que mais tarde se tornaram reserva natural e,
      desde 1990, parte do parque nacional. Hoje integram o setor oriental do Parque Nacional de Müritz; o seu
      núcleo de faial antigo é Património Mundial da UNESCO desde 2011.
    landscape: >-
      O setor de Serrahn corresponde à porção oriental do parque, entre o planalto lacustre de Mecklemburgo e
      a região dos lagos de Feldberg. É uma terra de colinas arborizadas onde se erguem as maiores cotas de
      todo o parque: o Hirschberg, com 143,7 m, e o Warsberg, com 143,2 m. Entre as maiores massas de água
      destacam-se o Große Fürstenseer See, o Schweingartensee e o Zwirnsee.


      A faia reina incontestada. Não fossem os desbravamentos humanos, toda esta região estaria hoje revestida
      por faiais; apenas nos locais alagadiços medrariam amiais e freixiais. Nas colinas de Serrahn, um vasto
      povoamento de faias antigas preserva feições muito próximas das de uma floresta primária. O percurso
      evidencia-o: o trilho atravessa pinhais abertos antes de penetrar sob vetustas faias de grande porte. As
      depressões entre os faiais densos acumulam frequentemente bolsas de ar frio.
    wildlife: >-
      A fauna de Serrahn traduz o encontro entre o bosque e os lagos. O
      [veado-vermelho](/especie/cervus_elaphus/) é o maior mamífero da área protegida. No ar, o
      [grou-comum](/especie/grus_grus/) e o [abetouro-comum](/especie/botaurus_stellaris/) são aves
      emblemáticas desta paisagem florestal e aquática, podendo observar-se no parque a
      [águia-rabalva](/especie/haliaeetus_albicilla/), a [águia-pesqueira](/especie/pandion_haliaetus/) e
      grous durante as suas deslocações sazonais. O parque dispõe de 25 plataformas, torres e abrigos para
      observação de aves aquáticas e rapinas.


      O trilho na floresta desfruta-se em qualquer altura do ano, mostrando de perto como renasce a natureza
      selvagem.
    visit: >-
      A exposição multimédia Im Reich der Buchen situa-se no coração dos faiais, na aldeia de Serrahn.
      Apresenta acessibilidade sem barreiras; confirma o horário junto do ponto informativo antes da visita.
      Ali encontrarás também uma exposição fotográfica de Roman Vitt, e outro espaço aborda a evolução da
      paisagem e o valor ecológico dos faiais antigos.


      O percurso interpretativo Grünes Buchenblatt é a forma clássica de entrar. A travessia de Zinow a
      Dianenhof via Serrahn e Schweingartensee tem 6,5 km, incluindo passadiço sobre a turfeira. Se
      regressares de Serrahn a Zinow pelo caminho florestal, o circuito atinge 8 km. A variante de retorno a
      partir de Dianenhof pela ciclovia junto à estrada figura com 11 km nas publicações do parque. De
      Dianenhof, a ida e volta a Serrahn soma 5 km, sendo classificada com acessibilidade limitada para
      cadeiras de rodas e carrinhos de bebé devido a declives pronunciados.


      De bicicleta, a rota circular Grüner Radfahrer contorna Zinow, Serrahn, Grünow e Carpin ao longo de 24
      km. A partir de Neustrelitz, a sinalização verde para ciclistas orienta rumo a Zinow ao longo de cerca
      de dez quilómetros.
    history: >-
      Poupadas ao corte pelas coutadas de caça ducais, as florestas de Serrahn tornaram-se reserva natural e,
      em 1990, parque nacional. A 25 de junho de 2011, uma parcela destes faiais foi incluída no Património
      Mundial.
    before: >-
      A Zinow chega-se pelo autocarro 619 entre Neustrelitz e Feldberg; para regressar podes usar a bicicleta
      ou o mesmo transporte. O trajeto desde Neustrelitz até Zinow está balizado a 10 km. Na zona tampão e na
      zona estrita é obrigatório não sair das vias autorizadas, e na zona estrita é proibida a apanha de
      cogumelos. É interdito fazer fogo na mata e a menos de 50 m da orla florestal.
    around: >-
      Serrahn faz parte das [Florestas do Parque Nacional de Müritz](/lugar/nationalpark-muritz-waldgebiete/).
      A cerca de 4 km situam-se as [Florestas do Parque Natural dos Lagos de
      Uckermark](/lugar/uckermarkische-seen-forests/), e a cerca de 11 km a [Reserva Natural de Heilige
      Hallen](/lugar/naturschutzgebiet-heilige-hallen-mecklenburg/).


      Mais longe, a [Floresta de Orient - Setores Florestais](/lugar/foret-d-orient---secteurs-forestiers/), o
      [Parque Nacional de Ķemeri](/lugar/kemeru-nacionalais-parks/), o [Lago do
      Der-Chantecoq](/lugar/lac-du-der-chantecoq/) e o [Parque Nacional de Store
      Mosse](/lugar/store-mosse-national-park/) partilham o grou-comum com Serrahn.
