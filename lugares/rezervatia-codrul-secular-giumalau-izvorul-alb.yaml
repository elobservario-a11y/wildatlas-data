resumen:
  es: Bosque relicto de picea centenaria de alta montaña al pie de los bloques calizos de Rarău.
  en: Centuries-old relict subalpine spruce forest thriving beneath the limestone scarps of Rarău.
  fr: Forêt relictuelle d’épicéas centenaires de haute montagne au pied des blocs calcaires du Rarău.
  de: Jahrhundertealter subalpiner Relikt-Fichtenurwald am Fuß der Kalkstöcke des Rarău.
  it: Foresta relitta di abete rosso secolare d’alta quota ai piedi dei blocchi calcarei del Rarău.
  pt: Mata relíquia de espruces centenários de alta montanha no sopé dos blocos calcários de Rarău.
unico:
  es: >-
    Un bosque de picea que llega casi puro hasta el límite del pelado alpino, con árboles caídos cubiertos de
    musgo entre ejemplares sanos de todas las edades.
  en: >-
    A high-elevation spruce forest rising almost unbroken to the alpine timberline, strewn with moss-draped
    nurse logs alongside vigorous trees of every age class.
  fr: >-
    Une pessière subalpine quasi pure montant jusqu’à la limite des arbres, jonchée de troncs moussus mêlés à
    des arbres sains de toutes générations.
  de: >-
    Ein fast reiner Bergfichtenwald, der bis an die alpine Baumgrenze reicht, mit moosüberwachsenem Totholz
    zwischen gesunden Bäumen aller Altersstufen.
  it: >-
    Una foresta di pecci quasi pura che lambisce il limite della vegetazione arborea, cosparsa di tronchi
    caduti coperti di muschio tra alberi sani di ogni età.
  pt: >-
    Uma floresta de espruces quase pura que alcança o limite alpino, salpicada de troncos caídos cobertos de
    musgo entre árvores sadias de todas as idades.
observaciones:
  es: >-
    Los mejores meses van de mayo a octubre. Antes de la visita, pregunta al gestor, la Dirección Forestal de
    Suceava, qué sectores puedes recorrer.
texto:
  es:
    intro: >-
      En el valle del Putna Mare, en la vertiente noroeste del macizo Giumalău, el bosque sube casi hasta el
      pelado alpino y se detiene donde ya no pueden crecer árboles. Es el Codrul Secular Giumalău, una reserva
      forestal de la Academia Rumana: piceas a casi mil cuatrocientos metros de altitud, en la cuenca alta del
      Moldova, en un paisaje que ha conservado en gran medida su carácter silvestre y está poco alterado por
      la intervención humana.
    landscape: >-
      La reserva se asienta sobre esquistos cristalinos, y las cotas más altas se superponen a una franja de
      roca porfiroide dura. El relieve que la rodea es de lomos anchos y ondulados, típicos de los montes
      cristalinos, y muy rico en aguas superficiales: el arroyo Putna Mare recoge seis arroyos y varios
      regatos en una cuenca en forma de semiembudo.


      El bosque se mueve entre 1230 y 1680 metros, sobre todo a unos mil cuatrocientos. El desnivel general
      ronda los 450 metros en tramos cortos, con pendientes de entre 15 y 35 grados, y la parte alta penetra
      en el pelado alpino del macizo, cuya cima, el Giumalău, alcanza 1857 metros según el gestor. El paisaje
      combina el verde del bosque, el de los jnepenișuri (matorrales de pino mugo), mosaicos de pastos y
      bloques de piedra gris.


      El clima es duro. La temperatura media anual está entre 1,7 y 2,9 °C, valores propios de bosques de
      límite; enero es el mes más frío, con una media de -7,7 °C, y los días sin helada no pasan de 80 al año.
      La precipitación media anual es de 923,66 mm.
    wildlife: >-
      El bosque de picea es de una densidad que apenas deja pasar la luz, de modo que el sotobosque es muy
      pobre. Eso cambia cuando el viento abre un claro: en poco tiempo se instala una abundante flora herbácea
      propia del tipo de bosque, con Oxalis acetosella, Phegopteris dryopteris, Pirola uniflora, milenrama y
      azucena martagón, entre otras. Entre las plantas características del hábitat figuran los arándanos del
      género Vaccinium. En el bosque yacen piceas largas derribadas por el viento o la vejez, cubiertas de
      musgo, junto a ejemplares sanos de todas las edades.


      Viven aquí el [oso pardo](/especie/ursus_arctos/), el ciervo, el [jabalí](/especie/sus_scrofa/), el
      [lince](/especie/lynx_lynx/), el zorro, la [marta](/especie/martes_martes/), la ardilla, el
      [lobo](/especie/canis_lupus/) y el gato montés. Entre las aves se citan el carbonero común, el pito
      cano, la urraca, el [búho real](/especie/bubo_bubo/), el piquituerto común y el [acentor
      alpino](/especie/prunella_collaris/). Se subrayan dos especies protegidas por su número cada vez más
      reducido: el [urogallo](/especie/tetrao_urogallus/) y el cuervo.
    visit: >-
      La reserva se gestiona como espacio de protección, y no hay senderos señalizados ni centro de visitantes
      publicados. Los cerros entre arroyos, llamados picioare, son las vías más cortas para cruzarla; dos de
      ellos, Piciorul Stirparilor y Piciorul Anitan, son más accesibles que los demás.


      El acceso forestal parte de la carretera E576, que coincide con la DN17, hasta Valea Putnei. Desde allí
      se sigue el camino de Putna Mare y luego el de Sterparu.
    history: >-
      El viento ha marcado la historia reciente del bosque. Los derribos de 1964 afectaron a unas 12
      hectáreas, con unos 4500 m³ de madera; en el otoño de 1970 hubo otros en unas 4 hectáreas, con 1200 m³.
      Los árboles derribados en 1964 en el borde de la reserva se descortezaron y se sacaron con el visto
      bueno de la Academia Rumana.
    before: >-
      Los mejores meses van de mayo a octubre. Antes de la visita, pregunta al gestor, la Dirección Forestal
      de Suceava, qué sectores puedes recorrer.
    around: >-
      A nueve kilómetros queda la [Reserva del Bosque Primario de
      Slătioara](/lugar/rezervatia-codrul-secular-slatioara/) y a veintisiete el [Parque Nacional Călimani -
      Macizo Volcánico Forestal](/lugar/parcul-national-calimani---sumski-masiv/).


      Con azucena martagón, marta y urogallo en común, aunque más lejos, aparecen el [Bosque Virgen de
      Janj](/lugar/prasuma-janj-strogi-rezervat-prirode/), el [Parque Nacional Bucegi - Ladera
      Occidental](/lugar/parcul-national-bucegi---vertientes-occidentales/) y el [Parque Nacional Cozia -
      Bosques Primarios](/lugar/parcul-national-cozia---codrii-seculari/).
  en:
    intro: >-
      Along the Putna Mare valley on the northwestern flank of the Giumalău Massif, virgin forest ascends
      directly toward the alpine timberline, terminating only where harsh weather prevents tree growth. This
      is the Codrul Secular Giumalău, a strict forest reserve governed by the Romanian Academy: primeval
      Norway spruce stands at almost one thousand four hundred metres elevation in the upper Moldova basin,
      safeguarding an untamed mountain wilderness barely touched by human intervention.
    landscape: >-
      The reserve rests upon crystalline schists, capped on its highest slopes by a band of resilient
      porphyroid rock. Surrounding landforms feature broad, rolling ridges typical of crystalline massifs and
      run rich with surface waters: the Putna Mare torrent gathers six mountain brooks and several perennial
      rills within a funnel-shaped drainage basin.


      The forest spans between 1230 and 1680 metres, concentrating around one thousand four hundred metres.
      Elevational drops reach roughly 450 metres over short distances, along slopes tilted between 15 and 35
      degrees, with the highest margins penetrating the subalpine zone of Mount Giumalău, which summits at
      1857 metres according to management records. The landscape blends dark spruce canopies, dwarf mountain
      pine krummholz (jnepenișuri), upland grasslands, and grey crystalline boulders.


      The climate is severe. The mean annual temperature ranges between 1.7 and 2.9 °C, typical of timberline
      forests; January is the coldest month, averaging -7.7 °C, and frost-free days rarely exceed 80 per year.
      Mean annual precipitation averages 923.66 mm.
    wildlife: >-
      The dense spruce canopy admits very little direct sunlight, leaving the deep forest floor sparsely
      vegetated. However, whenever natural windfall tears open a canopy gap, a vigorous herb flora colonizes
      the ground: wood sorrel (*Oxalis acetosella*), oak fern (*Phegopteris dryopteris*), single delight
      (*Pirola uniflora*), yarrow, and Martagon lily quickly take root, alongside wild bilberry carpets
      (*Vaccinium*). Massive trunks toppled by windthrow or senescence lie across the mossy floor, slowly
      decomposing amidst healthy standing trees of every age.


      Mammals include the [brown bear](/especie/ursus_arctos/), red deer, [wild boar](/especie/sus_scrofa/),
      [Eurasian lynx](/especie/lynx_lynx/), red fox, [European pine marten](/especie/martes_martes/), Eurasian
      red squirrel, [grey wolf](/especie/canis_lupus/), and European wildcat. Avian residents feature the
      great tit, grey-headed woodpecker, Eurasian magpie, [Eurasian eagle-owl](/especie/bubo_bubo/), red
      crossbill, and [alpine accentor](/especie/prunella_collaris/). Foresters highlight two strictly
      protected species facing regional declines: the [western capercaillie](/especie/tetrao_urogallus/) and
      the common raven.
    visit: >-
      The reserve is strictly managed as a scientific sanctuary without waymarked public paths or visitor
      facilities. Interfluvial ridges between mountain torrents, known locally as picioare, offer the most
      direct routes across the terrain; two of these, Piciorul Stirparilor and Piciorul Anitan, are relatively
      more accessible than the others.


      Forest access leaves European route E576 (concurrent with national road DN17) at Valea Putnei, following
      the Putna Mare logging track and subsequently the Sterparu track.
    history: >-
      Windthrow events have shaped the modern history of the forest. Violent gales in 1964 leveled roughly 12
      hectares, felling around 4500 m³ of timber; in the autumn of 1970, further windfall downed an additional
      4 hectares, totaling 1200 m³. Fallen timber along the perimeter from 1964 was debarked and extracted
      with formal approval from the Romanian Academy.
    before: >-
      The most favorable visitation window spans May to October. Prior to entering the area, verify permitted
      perimeter sectors with the Suceava Forestry Directorate.
    around: >-
      Nine kilometres away sits the [Slătioara Ancient Beech and Spruce
      Forest](/lugar/rezervatia-codrul-secular-slatioara/), and twenty-seven kilometres distant lies the
      [Călimani National Park - Volcanic Forest Massif](/lugar/parcul-national-calimani---sumski-masiv/).


      Further afield, [Janj Strict Nature Reserve Primeval
      Forest](/lugar/prasuma-janj-strogi-rezervat-prirode/), [Bucegi National Park - Western
      Flank](/lugar/parcul-national-bucegi---vertientes-occidentales/), and [Cozia National Park - Primeval
      Forests](/lugar/parcul-national-cozia---codrii-seculari/) share Martagon lilies, pine martens, and
      capercaillies amidst old-growth montane forests.
  fr:
    intro: >-
      Dans la vallée du Putna Mare, sur le versant nord-ouest du massif du Giumalău, la forêt primitive
      s’élève presque jusqu’aux pelouses alpines pour s’arrêter là où les arbres ne peuvent plus survivre.
      C’est le Codrul Secular Giumalău, une réserve forestière de l’Académie roumaine : des pessières perchées
      à près de mille quatre cents mètres d’altitude dans le haut bassin de la Moldova, au cœur d’un relief
      sauvage préservé de toute exploitation humaine.
    landscape: >-
      La réserve repose sur des schistes cristallins, surmontés sur les plus hautes crêtes par une bande
      d’andésite porphyroïde très dure. Le relief environnant déploie de larges croupes ondulées typiques des
      massifs cristallins, sillonnées par de multiples cours d’eau : le Putna Mare draine six ruisseaux et
      plusieurs ravins dans un bassin en demi-entonnoir.


      La forêt s’étage entre 1230 et 1680 mètres, principalement autour de mille quatre cents mètres. Le
      dénivelé moyen avoisine 450 mètres sur de courtes distances, avec des pentes inclinées entre 15 et 35
      degrés, culminant dans la zone subalpine du mont Giumalău qui atteint 1857 mètres selon les
      gestionnaires. Le paysage entrelace la sombre pessière, les buissons de pin mugo (jnepenișuri), les
      clairières herbeuses et les éboulis cristallins.


      Le climat est rude. La température moyenne annuelle oscille entre 1,7 et 2,9 °C, caractéristique des
      forêts d’altitude extrême ; janvier est le mois le plus froid avec une moyenne de -7,7 °C, et les jours
      sans gel ne dépassent pas 80 par an. Les précipitations moyennes annuelles atteignent 923,66 mm.
    wildlife: >-
      La densité de la voûte d’épicéas laisse à peine filtrer la lumière, maintenant un sous-bois très
      clairsemé. Lorsque le vent ouvre un chablis, une riche flore herbacée s’installe rapidement : oxalis
      petite-oseille, fougère du chêne, pyrole à une fleur, achillée millefeuille et lis martagon, sans
      oublier les myrtilles du genre Vaccinium. De grands épicéas abattus par les tempêtes ou la vétusté
      dorment au sol, gainés de mousses, au milieu d’arbres vigoureux de tous âges.


      Ce sanctuaire abrite l’[ours brun](/especie/ursus_arctos/), le cerf élaphe, le
      [sanglier](/especie/sus_scrofa/), le [lynx boréal](/especie/lynx_lynx/), le renard roux, la [martre des
      pins](/especie/martes_martes/), l’écureuil roux, le [loup](/especie/canis_lupus/) et le chat forestier.
      Parmi les oiseaux s’observent la mésange charbonnière, le pic cendré, la pie bavarde, le [hibou
      grand-duc](/especie/bubo_bubo/), le bec-croisé des sapins et l’[accepteur
      alpin](/especie/prunella_collaris/). Deux espèces particulièrement vulnérables retiennent l’attention :
      le [grand tétras](/especie/tetrao_urogallus/) et le grand corbeau.
    visit: >-
      La réserve est gérée comme un espace scientifique intégral, dépourvue de sentiers balisés et de centre
      d’accueil. Les croupes boisées séparant les ravins, appelées picioare, constituent les itinéraires
      naturels les plus directs pour traverser le versant ; deux d’entre elles, Piciorul Stirparilor et
      Piciorul Anitan, s’avèrent un peu plus praticables.


      L’accès forestier quitte la route européenne E576 (qui correspond à la route nationale DN17) au niveau
      de Valea Putnei, avant d’emprunter la piste forestière du Putna Mare puis celle de Sterparu.
    history: >-
      Les tempêtes ont jalonné l’histoire contemporaine de la forêt. Les chablis de 1964 ont dévasté environ
      12 hectares, couchant près de 4500 m³ de bois ; à l’automne 1970, d’autres bourrasques ont frappé 4
      hectares pour un volume de 1200 m³. Les arbres tombés en 1964 en périphérie furent écorcés et évacués
      avec l’accord formel de l’Académie roumaine.
    before: >-
      La saison propice va de mai à octobre. Avant tout départ, renseignez-vous auprès de la direction
      forestière de Suceava pour connaître les périmètres autorisés.
    around: >-
      À neuf kilomètres se dresse la [réserve de la forêt primaire de
      Slătioara](/lugar/rezervatia-codrul-secular-slatioara/) et à vingt-sept kilomètres le [parc national
      Călimani - massif volcanique forestier](/lugar/parcul-national-calimani---sumski-masiv/).


      Partageant le lis martagon, la martre des pins et le grand tétras, on trouve également la [forêt
      primaire de Janj](/lugar/prasuma-janj-strogi-rezervat-prirode/), le [parc national Bucegi - versant
      occidental](/lugar/parcul-national-bucegi---vertientes-occidentales/) et le [parc national Cozia -
      forêts primaires](/lugar/parcul-national-cozia---codrii-seculari/).
  de:
    intro: >-
      Im Tal des Putna Mare, am Nordwesthang des Giumalău-Massivs, steigt der Bergurwald bis an die alpine
      Waldgrenze empor und endet dort, wo kein Baumwuchs mehr möglich ist. Es ist der Codrul Secular Giumalău,
      ein forstliches Totalreservat der Rumänischen Akademie: Fichtenwälder auf fast eintausendvierhundert
      Metern Höhe im Quellgebiet der Moldova in einer wilden, vom Menschen kaum beeinflussten
      Gebirgslandschaft.
    landscape: >-
      Das Schutzgebiet liegt auf kristallinen Schiefern, die in den höchsten Lagen von einem harten Band
      porphyrischen Gesteins überlagert werden. Die umgebenden Rücken sind breit und gewellt, wie für
      kristalline Massive typisch, und überaus wasserreich: Der Putna-Mare-Bach bündelt sechs Seitenbäche und
      mehrere Gerinne in einem trichterförmigen Einzugsgebiet.


      Der Wald erstreckt sich zwischen 1230 und 1680 Metern Höhe mit Schwerpunkt um eintausendvierhundert
      Meter. Der Höhenunterschied beträgt rund 450 Meter auf kurzen Distanzen bei Hangneigungen zwischen 15
      und 35 Grad. Die oberen Ränder gehen in die subalpine Krummholzzone des Giumalău-Gipfels über, der laut
      Schutzgebietsverwaltung 1857 Meter erreicht. Das Landschaftsbild vereint dunkle Fichten, Latschenfelder
      (jnepenișuri), Bergmatten und graue Felsblöcke.


      Das Gebirgsklima ist rau. Die Jahresmitteltemperatur liegt zwischen 1,7 und 2,9 °C, typisch für Bäume an
      der klimatischen Baumgrenze; der Januar ist mit durchschnittlich -7,7 °C der kälteste Monat, und
      frostfreie Tage übersteigen kaum 80 im Jahr. Der mittlere Jahresniederschlag beträgt 923,66 mm.
    wildlife: >-
      Das geschlossene Kronendach der Bergfichten lässt kaum Sonnenlicht durch, sodass der Unterwuchs am
      Waldboden schütter bleibt. Wo Windwurf jedoch Lichtungen reißt, siedelt sich rasch eine üppige
      Krautflora an: Wald-Sauerklee (*Oxalis acetosella*), Eichenfarn (*Phegopteris dryopteris*), Moosauge
      (*Pirola uniflora*), Gemeine Schafgarbe und Türkenbund-Lilie gedeihen hier neben Heidelbeersträuchern
      (*Vaccinium*). Uralte, von Windbruch gefällte Fichtenstämme liegen bemoost am Boden, umgeben von
      gesunden Exemplaren aller Generationen.


      Im Gebiet leben [Braunbär](/especie/ursus_arctos/), Rothirsch, [Wildschwein](/especie/sus_scrofa/),
      [Eurasischer Luchs](/especie/lynx_lynx/), Rotfuchs, [Baummarder](/especie/martes_martes/), Eichhörnchen,
      [Wolf](/especie/canis_lupus/) und Wildkatze. Unter den Vögeln finden sich Kohlmeise, Grauspecht, Elster,
      [Uhu](/especie/bubo_bubo/), Fichtenkreuzschnabel und [Alpenbraunelle](/especie/prunella_collaris/). Zwei
      streng geschützte Arten mit rückläufigen Beständen verdienen besondere Beachtung:
      [Auerhuhn](/especie/tetrao_urogallus/) und Kolkrabe.
    visit: >-
      Das Reservat dient streng wissenschaftlichen Schutzzwecken ohne markierte Wanderwege oder
      Besucherzentren. Die bewaldeten Geländerücken zwischen den Bächen, die sogenannten picioare, bilden die
      kürzesten Querverbindungen; zwei von ihnen, Piciorul Stirparilor und Piciorul Anitan, sind etwas
      gangbarer als das übrige Steilgelände.


      Die forstliche Zufahrt zweigt von der Europastraße E576 (zeitgleich Nationalstraße DN17) bei Valea
      Putnei ab und folgt der Forststraße Putna Mare und anschließend dem Sterparu-Weg.
    history: >-
      Sturmereignisse prägten die jüngere Geschichte des Schutzgebiets. Orkane im Jahr 1964 warfen rund 12
      Hektar Wald mit etwa 4500 m³ Holz; im Herbst 1970 fällten weitere Stürme rund 4 Hektar mit 1200 m³. Das
      1964 am Rand des Reservats angefallene Sturmholz wurde mit Genehmigung der Rumänischen Akademie
      entrindet und abtransportiert.
    before: >-
      Die beste Reisezeit umfasst Mai bis Oktober. Erkundige dich vorab bei der Forstdirektion Suceava nach
      den zugänglichen Randbereichen.
    around: >-
      Neun Kilometer entfernt liegt das [Urwaldreservat
      Slătioara](/lugar/rezervatia-codrul-secular-slatioara/) und siebenundzwanzig Kilometer entfernt der
      [Nationalpark Călimani - Bewaldetes Vulkanmassiv](/lugar/parcul-national-calimani---sumski-masiv/).


      Türkenbund-Lilie, Baummarder und Auerhuhn teilen in weiteren Urwäldern der [Urwald
      Janj](/lugar/prasuma-janj-strogi-rezervat-prirode/), der [Bucegi-Nationalpark -
      Westhänge](/lugar/parcul-national-bucegi---vertientes-occidentales/) und der [Nationalpark Cozia -
      Urwälder](/lugar/parcul-national-cozia---codrii-seculari/).
  it:
    intro: >-
      Nella valle del Putna Mare, sul versante nord-occidentale del massiccio del Giumalău, la foresta vergine
      sale fino alle praterie alpine arrestandosi là dove gli alberi non riescono più a vegetare. È il Codrul
      Secular Giumalău, riserva forestale dell’Accademia Romena: abetaie a quasi millequattrocento metri di
      quota nell’alto bacino della Moldova, custodi di una wilderness intatta e quasi del tutto priva di
      alterazioni antropiche.
    landscape: >-
      La riserva si sviluppa su scisti cristallini, sormontati lungo le quote sommitali da una fascia di rocce
      porfiroidee tenaci. I rilievi presentano dossi ampi e ondulati tipici dei massicci cristallini,
      ricchissimi di acque superficiali: il torrente Putna Mare riceve sei corsi d’acqua minori e svariati
      ruscelli in un bacino a semi-imbuto.


      Il bosco si estende tra 1230 e 1680 metri di altitudine, con maggiore densità attorno a quota
      millequattrocento. Il dislivello medio tocca circa 450 metri su tratti brevi, con pendenze comprese tra
      15 e 35 gradi; la fascia superiore sconfina nella tundra d’altitudine del monte Giumalău, la cui cima
      tocca 1857 metri secondo le perizie forestali. Il paesaggio intreccia il verde cupo dei pecci, le
      mughete (*jnepenișuri*), i pascoli e i massi cristallini.


      Il clima montano è rigido. La temperatura media annua oscilla tra 1,7 e 2,9 °C, tipica del limite
      altitudinale del bosco; gennaio è il mese più freddo con una media di -7,7 °C, e i giorni privi di gelo
      non superano gli 80 all’anno. Le precipitazioni medie annue si attestano a 923,66 mm.
    wildlife: >-
      La densità della volta dei pecci intercetta gran parte della luce solare, determinando un sottobosco
      assai rado. Quando le raffiche di vento aprono una radura, si sviluppa rapidamente una ricca flora
      erbacea tipica delle peccete: acetosella (*Oxalis acetosella*), felce quercina (*Phegopteris
      dryopteris*), pirola uniflora, millefoglio e giglio martagone, assieme a cespugli di mirtillo
      (*Vaccinium*). Al suolo giacciono enormi fusti abbattuti dal vento o dalla vecchiaia, rivestiti di
      muschio verdeggiante, accanto ad alberi vigorosi di tutte le generazioni.


      La fauna vanta l’[orso bruno](/especie/ursus_arctos/), il cervo, il [cinghiale](/especie/sus_scrofa/),
      la [lince boreale](/especie/lynx_lynx/), la volpe, la [martora](/especie/martes_martes/), lo scoiattolo,
      il [lupo grigio](/especie/canis_lupus/) e il gatto selvatico. Tra i volatili si osservano la
      cinciallegra, il picchio cenerino, la gazza, il [gufo reale](/especie/bubo_bubo/), il crociere e il
      [sordone](/especie/prunella_collaris/). Due specie tutelate risaltano per il numero ridotto:
      l’[urogallo](/especie/tetrao_urogallus/) e il corvo imperiale.
    visit: >-
      La riserva è tutelata a fini di ricerca scientifica e non dispone di sentieri segnati né di strutture
      ricettive. I crinali secondari tra i torrenti, detti *picioare*, costituiscono le vie naturali più
      dirette per traversare il versante; due di essi, Piciorul Stirparilor e Piciorul Anitan, risultano
      relativamente più percorribili degli altri.


      L’accesso carrabile stacca dalla strada europea E576 (coincidente con la statale DN17) all’altezza di
      Valea Putnei, imboccando la pista forestale di Putna Mare e successivamente quella di Sterparu.
    history: >-
      Gli eventi atmosferici estremi hanno segnato le vicende del bosco. Gli schianti da vento del 1964
      interessarono circa 12 ettari, atterrando quasi 4500 m³ di legname; nell’autunno del 1970 nuove
      burrasche abbatterono altri 4 ettari per un volume di 1200 m³. Gli alberi caduti nel 1964 lungo i
      margini vennero scortecciati ed esboscati con l’approvazione dell’Accademia Romena.
    before: >-
      Il periodo ideale per la visita comprende i mesi da maggio a ottobre. Prima di metterti in cammino
      contatta la Direzione Forestale di Suceava per verificare le aree aperte al transito.
    around: >-
      A nove chilometri si trova la [Riserva della Foresta Primaria di
      Slătioara](/lugar/rezervatia-codrul-secular-slatioara/) e a ventisette chilometri il [Parco Nazionale
      Călimani - Massiccio Vulcanico Forestale](/lugar/parcul-national-calimani---sumski-masiv/).


      Con giglio martagone, martora e urogallo in comune si segnalano inoltre la [Foresta Vergine di
      Janj](/lugar/prasuma-janj-strogi-rezervat-prirode/), il [Parco Nazionale Bucegi - Versante
      Occidentale](/lugar/parcul-national-bucegi---vertientes-occidentales/) e il [Parco Nazionale Cozia -
      Foreste Primarie](/lugar/parcul-national-cozia---codrii-seculari/).
  pt:
    intro: >-
      No vale do Putna Mare, na vertente noroeste do maciço de Giumalău, a floresta virgem galga a encosta
      quase até às pastagens alpinas, cessando onde a altitude impede o crescimento arbóreo. É o Codrul
      Secular Giumalău, uma reserva florestal da Academia Romena: espruces a quase mil e quatrocentos metros
      de altitude na bacia alta do Moldova, num recanto selvagem que preservou o seu perfil original livre de
      cortes florestais.
    landscape: >-
      A reserva assenta sobre xistos cristalinos, encimados nos cumes por uma faixa resistente de rochas
      porfiroides. O relevo desenha cristas largas e onduladas típicas dos maciços cristalinos, muito
      abundantes em águas correntes: o ribeiro Putna Mare recolhe seis afluentes e várias linhas de água numa
      bacia em forma de funil.


      A floresta desenvolve-se entre os 1230 e os 1680 metros de altitude, concentrando-se por volta dos mil e
      quatrocentos metros. O desnível médio ronda os 450 metros em curtas distâncias, com inclinações entre 15
      e 35 graus, atingindo no topo a zona alpina do monte Giumalău que ascende a 1857 metros segundo a
      administração florestal. A paisagem conjuga a mata cerrada de coníferas, matagais de pinheiro-raso
      (*jnepenișuri*), prados e penedos cristalinos.


      O clima é austero. A temperatura média anual situa-se entre 1,7 e 2,9 °C, valores típicos do limite
      térmico arbóreo; janeiro é o mês mais rigoroso com média de -7,7 °C, não passando os dias sem geada de
      80 por ano. A precipitação média anual cifra-se em 923,66 mm.
    wildlife: >-
      O denso dossel dos espruces barra a passagem da luz, mantendo o sub-bosque muito despovoado. Quando
      vendavais abrem clareiras, estabelece-se rapidamente uma flora herbácea típica destas matas:
      azedinha-dos-bosques (*Oxalis acetosella*), feto-dos-carvalhos (*Phegopteris dryopteris*),
      pirola-de-uma-flor, milfólio e lírio-martagão, a par de arbustos de mirtilo (*Vaccinium*). Grandes
      espruces caídos pelas tempestades ou decrepitude jazem no solo revestidos de musgo, ladeados por árvores
      viçosas de todas as faixas etárias.


      Encontram-se aqui o [urso-pardo](/especie/ursus_arctos/), o veado, o [javali](/especie/sus_scrofa/), o
      [lince-euroasiático](/especie/lynx_lynx/), a raposa, a [marta](/especie/martes_martes/), o esquilo, o
      [lobo-cinzento](/especie/canis_lupus/) e o gato-bravo. Entre as aves figuram o chapim-real, o
      pica-pau-cinzento, a pega-rabuda, o [bufo-real](/especie/bubo_bubo/), o cruza-bico e a
      [ferreirinha-alpina](/especie/prunella_collaris/). Realçam-se duas espécies com estatuto de proteção
      face à sua escassez: o [tetraz-grande](/especie/tetrao_urogallus/) e o corvo.
    visit: >-
      A reserva tem estatuto de proteção científica estrita, não dispondo de caminhos balizados nem de centro
      de interpretação. As lombas florestadas entre linhas de água, denominadas *picioare*, representam os
      acessos naturais mais curtos; duas delas, Piciorul Stirparilor e Piciorul Anitan, são mais acessíveis do
      que as restantes encostas.


      O acesso rodoviário parte da estrada europeia E576 (coincidente com a estrada nacional DN17) junto a
      Valea Putnei, seguindo pelo estradão de Putna Mare e depois pelo caminho de Sterparu.
    history: >-
      Os temporais moldaram a história contemporânea da mata. As tempestades de 1964 derrubaram cerca de 12
      hectares, totalizando perto de 4500 m³ de madeira; no outono de 1970 novos ventos fortes deitaram abaixo
      4 hectares com 1200 m³. A madeira caída em 1964 nos limites da reserva foi descascada e retirada com a
      autorização formal da Academia Romena.
    before: >-
      A melhor época para visitar a região vai de maio a outubro. Antes de qualquer caminhada, consulta a
      Direção Florestal de Suceava para conhecer os setores de acesso permitido.
    around: >-
      A nove quilómetros fica a [Reserva da Floresta Primária de
      Slătioara](/lugar/rezervatia-codrul-secular-slatioara/) e a vinte e sete quilómetros o [Parque Nacional
      Călimani - Maciço Vulcânico Florestal](/lugar/parcul-national-calimani---sumski-masiv/).


      Partilhando o lírio-martagão, a marta e o tetraz-grande contam-se ainda a [Floresta Virgem de
      Janj](/lugar/prasuma-janj-strogi-rezervat-prirode/), o [Parque Nacional Bucegi - Vertente
      Ocidental](/lugar/parcul-national-bucegi---vertientes-occidentales/) e o [Parque Nacional Cozia -
      Florestas Primárias](/lugar/parcul-national-cozia---codrii-seculari/).
