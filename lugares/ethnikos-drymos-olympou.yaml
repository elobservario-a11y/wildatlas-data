resumen:
  es: >-
    El primer parque nacional de Grecia (1938): la montaña más alta del país, cortada por la garganta de
    Enipeas y rica en flora endémica.
  en: >-
    Greece's inaugural national park (1938): the country's highest peak, incised by the Enipeas Gorge and
    renowned for endemic flora.
  fr: >-
    Le premier parc national de Grèce (1938) : le point culminant du pays, entaillé par les gorges de l'Énipée
    et riche d'une flore endémique.
  de: >-
    Der erste Nationalpark Griechenlands (1938): das höchste Gebirge des Landes, zerschnitten von der
    Enipeas-Schlucht und Heimat endemischer Pflanzen.
  it: >-
    Il primo parco nazionale della Grecia (1938): la vetta più alta del paese, solcata dalle gole dell'Enipeas
    e ricca di flora endemica.
  pt: >-
    O primeiro parque nacional da Grécia (1938): a montanha mais alta do país, talhada pela garganta de
    Enipeas e rica em endemismos botânicos.
unico:
  es: Una torre de roca junto al mar, con una flora donde 23 plantas no crecen en ningún otro lugar.
  en: A fortress of limestone rising straight from the sea, home to 23 plants found nowhere else on Earth.
  fr: Une citadelle calcaire dominant la mer, où 23 espèces végétales ne poussent nulle part ailleurs au monde.
  de: Eine Felsenfestung direkt am Meer mit einer Flora, von der 23 Arten nirgendwo sonst auf der Erde wachsen.
  it: >-
    Un baluardo calcareo affacciato sul mare, custode di 23 specie vegetali che non crescono in nessun altro
    luogo al mondo.
  pt: >-
    Uma cidadela de calcário junto ao mar, albergando 23 plantas que não crescem em mais nenhum recanto da
    Terra.
observaciones:
  es: >-
    Solo se puede entrar por los caminos existentes y se circula únicamente por senderos hechos, de sol a sol.
    No se permite la entrada de menores de 14 años sin acompañante. Está prohibido recoger o destruir nidos,
    huevos o pollos y molestar a la fauna.


    Por encima de los 2.000 metros escasean las fuentes: lleva siempre agua y ropa para cualquier tiempo. La
    nieve cubre las cumbres de septiembre a mayo.
texto:
  es:
    intro: >-
      Desde Litóchoro, la montaña dibuja una «V» en el horizonte, entre dos cumbres casi iguales. La de la
      izquierda es Mytikas, la más alta de Grecia, con 2.917,727 metros; la de la derecha, Stefani, es el
      Trono de Zeus. El Parque Nacional del Monte Olimpo protege ese macizo casi circular de unos 500
      kilómetros cuadrados, con 52 cumbres y profundas gargantas, y fue el primer parque nacional del país, en
      1938. Es también reserva de la biosfera, y el pueblo de Litóchoro es el punto de partida habitual.
    landscape: >-
      La montaña es roca sedimentaria depositada hace 200 millones de años en un mar poco profundo. Luego vino
      el hielo: hace un millón de años, los glaciares cubrieron el Olimpo y excavaron sus mesetas y
      depresiones. Después la lluvia y el viento tallaron lo demás, hasta dejar una torre aislada.


      Arriba se juntan las formas más duras. Desde Litóchoro se ve la «V» de Mytikas y Stefani, el Trono de
      Zeus, y al sur la garganta de Ziliana, de 13 km, separa el Olimpo del Bajo Olimpo.


      El clima cambia con cada metro que subes. Por encima de 2.000 metros la nieve cubre la montaña unos
      nueve meses, de septiembre a mayo. El tiempo puede cambiar varias veces en un día y, en verano, son
      frecuentes las tormentas de tarde, a menudo con granizo.
    wildlife: >-
      La vegetación sube en pisos. En el parque hay cerca de 1.700 especies y subespecies de plantas, un 25 %
      de la flora griega; 56 son endemismos griegos y 23 solo se encuentran aquí. Ramonda heldreichii, una
      planta relicta de la Edad de Hielo, interesa de forma especial a los botánicos. Más arriba, el [pino de
      Bosnia](/especie/pinus_heldreichii/) llega hasta 2.750 metros, uno de los límites forestales más altos
      de los Balcanes. En la garganta del Enipeas, en cambio, crece una variedad rica de árboles y arbustos,
      con tejo.


      Entre los mamíferos se han registrado treinta y dos especies, entre ellas el
      [rebeco](/especie/rupicapra_rupicapra/) balcánico, el [corzo](/especie/capreolus_capreolus/), el
      [jabalí](/especie/sus_scrofa/), el [gato montés](/especie/felis_silvestris/), la garduña, el zorro rojo
      y la [ardilla roja](/especie/sciurus_vulgaris/). Se han detectado 108 especies de aves, como el [buitre
      negro](/especie/aegypius_monachus/), el [águila real](/especie/aquila_chrysaetos/), la culebrera
      europea, el águila calzada y el [halcón peregrino](/especie/falco_peregrinus/); muchas rapaces son
      escasas. Hay además 22 especies de reptiles comunes de Grecia, ocho de anfibios en arroyos y charcas
      estacionales, y muchos insectos, sobre todo mariposas.
    visit: >-
      Para llegar a la montaña, casi todo el mundo sale de Litóchoro. Desde allí, una carretera lleva a
      Prionia, a 18 km, el punto más alto al que se llega en coche y donde empieza la caminata; allí nace el
      río Enipeas. En Litóchoro, el Centro de Información del Parque Nacional del Olimpo abrió en junio de
      2016 y explica geología, yacimientos, mitología, monasterios, plantas y animales; en Leptokarya, el
      Museo Geológico del Monte Olimpo da información detallada sobre la estructura de la montaña.


      La ruta clásica sube de Prionia, a 1100 m, al refugio Spilios Agapitos, a 2100 m, por el sendero más
      frecuentado del Olimpo, parte del E4. Va casi todo por bosque y tiene miradores. El tramo abierto de
      zigzags, expuesto al sol en verano, es duro; el refugio avisa del riesgo de deshidratación y de
      quemaduras. De ahí hasta la cima de Mytikas, la ruta completa mide 11,5 km, con 1830 m de desnivel y
      unas siete horas, y el refugio la califica de muy difícil.


      El camino sigue hasta Skala, a 2866 m, el primer pico y el cruce hacia Skolio y Mytikas. En su garganta
      pueden soplar vientos muy fríos aun con sol. Subir al Olimpo es una excursión sin técnica, salvo el
      último tramo de Skala a Mytikas, una trepada de roca de clase 3 YDS con mucha exposición; la pendiente
      junto a la subida es de grava suelta, y un resbalón supondría una caída de 1000 m. Si Mytikas se te hace
      demasiado, desde Skala hay una alternativa algo más fácil: la subida a Skolio, el segundo pico.


      Más de 10.000 personas visitan el Olimpo cada año, y la mayoría llega solo a las cumbres de Skala y
      Skolio.
    history: >-
      Aquí se mezclan la naturaleza y la historia. En la cima de Profitis Ilias, a 2.803 metros, hay una
      capilla del siglo XVI, la de mayor altitud de la cristiandad ortodoxa. El antiguo monasterio de Dionisio
      está en la garganta del Enipeas, a 820 m. La primera ascensión a Mytikas la hicieron los suizos
      Boissonnas y Baud-Bovy con el cazador de Litóchoro Christos Kakkalos, el 2 de agosto de 1913.


      El núcleo del parque, de unas 4.000 hectáreas en la vertiente este, prohíbe por ley toda forma de
      explotación. El parque cubre un área central de 40 km² y una superficie total de 240 km² con la zona
      periférica.
    before: >-
      Solo se puede entrar por los caminos existentes y se circula únicamente por senderos hechos, de sol a
      sol. No se permite la entrada de menores de 14 años sin acompañante. Está prohibido recoger o destruir
      nidos, huevos o pollos y molestar a la fauna.


      Por encima de los 2.000 metros escasean las fuentes: lleva siempre agua y ropa para cualquier tiempo. La
      nieve cubre las cumbres de septiembre a mayo.
  en:
    intro: >-
      Seen from Litochoro, the mountain carves a sharp "V" against the Aegean sky between twin companion
      peaks. To the left rises Mytikas, Greece's apex at 2,917,727 metres; to the right stands Stefani, the
      Throne of Zeus. Mount Olympus National Park encompasses this near-circular massif of roughly 500 square
      kilometres, bristling with 52 summits and cleft by deep ravines. Established in 1938, it was Greece's
      very first national park, later designated a UNESCO biosphere reserve, with the coastal town of
      Litochoro serving as its historic base.
    landscape: >-
      The massif is built of marine limestone deposited some 200 million years ago in a shallow tropical sea.
      Then came the ice: one million years ago, glaciers mantled Olympus, carving cirques, hanging valleys,
      and high plateaux. Rain, frost, and winds chiselled the remainder into an isolated mountain citadel.


      The most imposing rock architecture crowns the heights. From Litochoro the skyline reveals the cleft
      between Mytikas and Stefani, the Throne of Zeus, while to the south the 13 km Ziliana gorge cleanly
      separates Mount Olympus from Lower Olympus.


      The microclimate changes with every metre gained. Above 2,000 metres snow cloaks the crests for roughly
      nine months, from September through May. Weather shifts unpredictably within hours, and summer
      afternoons frequently trigger violent thunderstorms, often accompanied by heavy hail.
    wildlife: >-
      Vegetation zones layer the mountainsides. The park protects nearly 1,700 plant taxa, representing 25% of
      all Greek flora; 56 are endemic to Greece, and 23 occur nowhere else on the planet. Ramonda heldreichii,
      a delicate Tertiary relict from the Ice Age, holds special fame among botanists. Higher up, the [Bosnian
      pine](/especie/pinus_heldreichii/) climbs to 2,750 metres, forming one of the highest alpine treelines
      in the Balkans. In contrast, the humid depths of the Enipeas Gorge shelter deciduous diversity and
      ancient yews.


      Among mammals, thirty-two species are recorded, including Balkan
      [chamois](/especie/rupicapra_rupicapra/), European [roe deer](/especie/capreolus_capreolus/), [wild
      boar](/especie/sus_scrofa/), [wildcat](/especie/felis_silvestris/), stone marten, red fox, and [red
      squirrel](/especie/sciurus_vulgaris/). The avifauna numbers 108 species, featuring [cinereous
      vulture](/especie/aegypius_monachus/), [golden eagle](/especie/aquila_chrysaetos/), short-toed snake
      eagle, booted eagle, and [peregrine falcon](/especie/falco_peregrinus/); many raptors remain scarce.
      There are also 22 common Greek reptile species, eight amphibians inhabiting streams and snowmelt pools,
      and prolific butterflies.
    visit: >-
      Most hikers set out from Litochoro. From town, a paved road ascends 18 km to Prionia, the highest
      drivable point and the trail start, where the Enipeas River surfaces from karst springs. In Litochoro,
      the Olympus National Park Information Centre opened in June 2016 to interpret geology, archaeology,
      mythology, and wildlife; down in Leptokarya, the Olympus Geological Museum details mountain
      stratigraphy.


      The classic ascent climbs from Prionia at 1100 m to Refuge Spilios Agapitos at 2100 m along the E4
      international trail, shaded largely by black pine and beech. The upper zig-zags emerge onto open
      limestone exposed to intense summer heat; the refuge cautions against dehydration and heatstroke. From
      Prionia all the way to Mytikas, the full route spans 11.5 km with 1830 m of cumulative ascent taking
      roughly seven hours, graded very demanding.


      The path continues to Skala at 2866 m, the initial summit plateau and junction for Skolio and Mytikas.
      Bitter winds can scour this crest even in bright sun. Ascending Olympus is a straightforward mountain
      trek except for the final traverse from Skala across the Kakiskala gully to Mytikas, which involves a
      Class 3 YDS scramble with severe exposure; loose scree flanks the line, and a slip could result in a
      1000 m drop. If Mytikas feels daunting, an easier path from Skala ascends Skolio, the second summit.


      Over 10,000 climbers visit Olympus each year, though most turn around at Skala or Skolio.
    history: >-
      Myth and history merge across these crags. Atop the peak of Profitis Ilias at 2,803 metres perches a
      sixteenth-century stone chapel, the highest ecclesiastical shrine in the Orthodox Christian world. The
      ruined Old Monastery of St Dionysios lies lower in the Enipeas gorge at 820 m. The first recorded ascent
      of Mytikas was achieved by Swiss mountaineers Boissonnas and Baud-Bovy, led by Litochoro hunter Christos
      Kakkalos, on 2 August 1913.


      The strictly protected national park core covers roughly 4,000 hectares on the eastern face, where all
      commercial exploitation is barred by law. The park comprises a core zone of 40 km² and an overall
      perimeter of 240 km² including buffer areas.
    before: >-
      Visitors may only enter along recognised trails between sunrise and sunset. Children under 14 years of
      age must be accompanied by an adult. Disturbing nests, eggs, or chicks and molesting wildlife is
      strictly prohibited.


      Above 2,000 metres natural springs disappear: carry plenty of drinking water and clothing suited to
      sudden freezes. Snow blankets the upper summits from September until May.
  fr:
    intro: >-
      Depuis Litochoro, la montagne découpe un « V » net sur l'horizon entre deux cimes quasi jumelles. Celle
      de gauche est Mytikas, point culminant de la Grèce à 2 917,727 mètres ; celle de droite, Stefani, est le
      Trône de Zeus. Le parc national du mont Olympe englobe ce massif circulaire d'environ 500 kilomètres
      carrés hérissé de 52 sommets et d'abruptes gorges. Créé en 1938, il fut le tout premier parc national du
      pays, également reconnu réserve de biosphère, avec la bourgade de Litochoro comme camp de base
      traditionnel.
    landscape: >-
      La montagne est faite de calcaire sédimentaire déposé il y a 200 millions d'années au fond d'une mer peu
      profonde. Puis vinrent les glaciations : il y a un million d'années, les glaciers ont recouvert
      l'Olympe, façonnant hauts plateaux et cirques suspendus. Pluies et vents ont ciselé le reste pour isoler
      cette forteresse rocheuse.


      En haut se concentrent les reliefs les plus rudes. De Litochoro se détache le col en « V » entre Mytikas
      et Stefani, tandis qu'au sud les gorges de Ziliana, longues de 13 km, séparent l'Olympe du Bas-Olympe.


      Le climat se transforme à chaque palier. Au-delà de 2 000 mètres la neige recouvre la montagne environ
      neuf mois par an, de septembre à mai. Le temps change plusieurs fois dans la journée, et en été les
      orages d'après-midi sont fréquents, souvent accompagnés de grêle.
    wildlife: >-
      La flore s'organise par étages. Le parc abrite près de 1 700 espèces et sous-espèces végétales, soit 25
      % de la flore grecque ; 56 sont endémiques de Grèce et 23 ne poussent qu'ici. Ramonda heldreichii,
      relique préglaciaire de l'ère tertiaire, passionne les botanistes. Plus haut, le [pin de
      Bosnie](/especie/pinus_heldreichii/) s'élève jusqu'à 2 750 mètres, formant l'une des limites forestières
      les plus hautes des Balkans. Dans les gorges de l'Énipée foisonnent feuillus et ifs centenaires.


      Parmi les mammifères, trente-deux espèces ont été recensées, dont le
      [chamois](/especie/rupicapra_rupicapra/) des Balkans, le [chevreuil](/especie/capreolus_capreolus/), le
      [sanglier](/especie/sus_scrofa/), le [chat sauvage](/especie/felis_silvestris/), la fouine, le renard
      roux et l'[écureuil roux](/especie/sciurus_vulgaris/). On a dénombré 108 espèces d'oiseaux, parmi
      lesquels le [vautour moine](/especie/aegypius_monachus/), l'[aigle royal](/especie/aquila_chrysaetos/),
      le circaète Jean-le-Blanc, l'aigle botté et le [faucon pèlerin](/especie/falco_peregrinus/). S'y
      ajoutent 22 espèces de reptiles, huit d'amphibiens et une myriade de papillons.
    visit: >-
      Pour monter, presque tout le monde part de Litochoro. De là, une route goudronnée mène en 18 km à
      Prionia, terminus carrossable et point de départ des sentiers, où sourd l'Énipée. À Litochoro, le centre
      d'information du parc a ouvert en juin 2016 ; à Leptokarya, le musée géologique de l'Olympe détaille la
      tectonique du massif.


      La voie classique monte de Prionia à 1100 m jusqu'au refuge Spilios Agapitos à 2100 m par le chemin le
      plus fréquenté, maillon de l'E4. Le sentier chemine sous les pins et les hêtres avant d'attaquer des
      lacets découverts exposés à la chaleur estivale. De Prionia au sommet de Mytikas, la course affiche 11,5
      km et 1830 m de dénivelé pour environ sept heures d'effort, classée très difficile par les gardiens.


      La sente rejoint ensuite Skala à 2866 m, premier belvédère et carrefour vers Skolio et Mytikas. Le vent
      y souffle souvent glacial. L'ascension ne présente aucune difficulté technique majeure sauf le couloir
      final de Skala à Mytikas, qui relève de l'escalade facile en roche de classe 3 YDS très exposée ; le
      pierrier fuyant rend toute glissade fatale avec 1000 m de vide en contrebas. Si Mytikas semble trop
      vertigineux, l'accès à Skolio, le second sommet, est bien plus aisé.


      Plus de 10 000 personnes visitent l'Olympe chaque année, la majorité s'arrêtant aux cimes de Skala et
      Skolio.
    history: >-
      Ici se croisent la mythologie et l'histoire des hommes. Au sommet de Profitis Ilias, à 2 803 mètres, se
      dresse une chapelle du XVIe siècle, la plus haute de la chrétienté orthodoxe. Le vieux monastère de
      saint Dionysios gît au fond des gorges de l'Énipée à 820 m. La première ascension de Mytikas fut
      réalisée par les Suisses Boissonnas et Baud-Bovy, guidés par le chasseur de Litochoro Christos Kakkalos,
      le 2 août 1913.


      Le cœur du parc, fort d'environ 4 000 hectares sur le flanc est, interdit par la loi toute exploitation.
      Le parc réunit un noyau central de 40 km² et une surface globale de 240 km² avec sa zone périphérique.
    before: >-
      L'accès n'est autorisé que par les sentiers balisés, du lever au coucher du soleil. L'accès des mineurs
      de moins de 14 ans est soumis à accompagnement. Il est interdit de détruire nids et œufs ou de perturber
      la faune.


      Au-dessus de 2 000 mètres les points d'eau tarissent : emportez réserve d'eau et vêtements thermiques.
      La neige coiffe les crêtes de septembre à mai.
  de:
    intro: >-
      Von Litochoro aus schneidet der Gebirgskamm ein markantes „V“ in den Horizont zwischen zwei fast gleich
      hohen Zwillingsgipfeln. Links ragt der Mytikas auf, mit 2.917,727 Metern der höchste Berg Griechenlands;
      rechts erhebt sich der Stefani, der Thron des Zeus. Der Olymp-Nationalpark schützt dieses fast
      kreisrunde Massiv von rund 500 Quadratkilometern mit 52 Gipfeln und tiefen Schluchten. Er wurde 1938 als
      erster Nationalpark Griechenlands eingerichtet und später als UNESCO-Biosphärenreservat anerkannt, mit
      Litochoro als traditionellem Ausgangsort.
    landscape: >-
      Das Gebirge besteht aus marinem Kalkstein, der sich vor rund 200 Millionen Jahren in einem flachen Meer
      absetzte. Später formte das Eis die Landschaft: Vor einer Million Jahren bedeckten Gletscher den Olymp
      und schliffen Hochplateaus und Hängekare heraus. Danach vollendeten Regen, Frost und Wind das Werk bis
      zur isolierten Felsbastion.


      Oben ballen sich die schroffsten Formen. Von Litochoro aus zeichnet sich die Felskerbe zwischen Mytikas
      und Stefani ab, während im Süden die 13 km lange Ziliana-Schlucht den Hohen vom Niederen Olymp trennt.


      Das Gebirgsklima ändert sich mit jedem Höhenmeter. Oberhalb von 2.000 Metern bedeckt Schnee das Massiv
      rund neun Monate lang von September bis Mai. Das Wetter schlägt oft rasch um, und im Sommer entladen
      sich nachmittags schwere Gewitter mit Hagel.
    wildlife: >-
      Die Flora ist in Vegetationsstufen gegliedert. Im Park wachsen fast 1.700 Pflanzenarten und -unterarten,
      was 25 % der gesamten griechischen Flora entspricht; 56 sind griechische Endemiten und 23 kommen
      ausschließlich am Olymp vor. Ramonda heldreichii, ein Tertiärrelikt aus der Eiszeit, fasziniert
      Botaniker weltweit. Weiter oben klettert die [Schlangenhaut-Kiefer](/especie/pinus_heldreichii/) bis auf
      2.750 Meter und markiert eine der höchsten Baumgrenzen des Balkans. In der Enipeas-Schlucht wachsen
      feuchtigkeitsliebende Laubgehölze und Eiben.


      Unter den Säugetieren wurden zweiunddreißig Arten nachgewiesen, darunter
      Balkan-[Gämse](/especie/rupicapra_rupicapra/), [Reh](/especie/capreolus_capreolus/),
      [Wildschwein](/especie/sus_scrofa/), [Wildkatze](/especie/felis_silvestris/), Steinmarder, Rotfuchs und
      [Eichhörnchen](/especie/sciurus_vulgaris/). 108 Vogelarten wurden erfasst, darunter
      [Mönchsgeier](/especie/aegypius_monachus/), [Steinadler](/especie/aquila_chrysaetos/), Schlangenadler,
      Zwergadler und [Wanderfalke](/especie/falco_peregrinus/). Dazu kommen 22 Reptilienarten, acht
      Amphibienarten und unzählige Tagfalter.
    visit: >-
      Die meisten Bergsteiger starten in Litochoro. Eine 18 km lange Bergstraße führt hinauf nach Prionia, dem
      höchsten Straßenendpunkt und Wanderstart, wo der Enipeas entspringt. In Litochoro informiert das im Juni
      2016 eröffnete Nationalparkzentrum über Geologie, Archäologie und Natur; in Leptokarya zeigt das
      Olymp-Museum geologische Profile.


      Der Normalweg führt von Prionia auf 1100 m zur Hütte Spilios Agapitos auf 2100 m entlang des E4 durch
      Buchen- und Kiefernwälder. Der anschließende steile Serpentinenabschnitt liegt in der prallen
      Sommersonne; die Hütte warnt vor Dehydrierung. Von Prionia bis zum Mytikas-Gipfel misst die Route 11,5
      km bei 1830 m Höhenunterschied und rund sieben Stunden Gehzeit; sie gilt als sehr anspruchsvoll.


      Der Pfad führt weiter zum Skala auf 2866 m, dem ersten Gipfel und Abzweig zu Skolio und Mytikas. Hier
      weht oft eisiger Wind. Die Besteigung ist bis zum Skala eine reine Bergwanderung; die Querung von Skala
      über die Kakiskala-Rinne zum Mytikas erfordert jedoch ausgesetzte Kletterei im Schwierigkeitsgrad Klasse
      3 YDS über brüchigen Schotter mit 1000 m Tiefblick. Wem der Mytikas zu ausgesetzt ist, weicht vom Skala
      auf den einfacheren Skolio aus, den zweithöchsten Gipfel.


      Über 10.000 Menschen besteigen den Olymp jährlich, die meisten begnügen sich mit Skala und Skolio.
    history: >-
      Mythos und Geschichte verweben sich am Fels. Auf dem Gipfel des Profitis Ilias auf 2.803 Metern steht
      eine Kapelle aus dem sechzehnten Jahrhundert, das höchstgelegene Gotteshaus der orthodoxen Welt. Die
      Ruine des alten Dionysios-Klosters liegt in der Enipeas-Schlucht auf 820 m. Die Erstbesteigung des
      Mytikas glückte den Schweizern Boissonnas und Baud-Bovy am 2. August 1913, geführt vom einheimischen
      Jäger Christos Kakkalos.


      Die Kernzone umfasst rund 4.000 Hektar an der Ostflanke, in der jegliche wirtschaftliche Nutzung
      untersagt ist. Der Park misst im Kern 40 km² und dehnt sich mit Pufferzonen auf 240 km² aus.
    before: >-
      Das Betreten ist nur auf bestehenden Wegen von Sonnenaufgang bis Sonnenuntergang gestattet. Jugendlichen
      unter 14 Jahren ist der Zutritt nur in Begleitung Erwachsener erlaubt. Das Zerstören von Nestern und
      Eiern sowie das Stören von Wildtieren ist strengstens verboten.


      Oberhalb von 2.000 Metern gibt es keine Wasserquellen mehr: Nimm reichlich Trinkwasser und wetterfeste
      Kleidung mit. Schnee bedeckt die Kämme von September bis Mai.
  it:
    intro: >-
      Da Litóchoro la sagoma della montagna intaglia una «V» netta sull'orizzonte tra due cime quasi gemelle.
      Quella a sinistra è il Mytikas, la quota massima della Grecia con 2.917,727 metri; a destra svetta lo
      Stefani, il Trono di Zeus. Il Parco Nazionale del Monte Olimpo racchiude questo massiccio circolare di
      circa 500 chilometri quadrati, costellato di 52 vette e gole profonde. Istituito nel 1938, fu il primo
      parco nazionale ellenico, poi riconosciuto riserva della biosfera UNESCO, con il paese di Litóchoro a
      fare da base di partenza.
    landscape: >-
      Il massiccio è composto da rocce sedimentarie calcaree deposte 200 milioni di anni fa sui fondali di un
      mare poco profondo. Poi arrivarono le glaciazioni: un milione di anni fa i ghiacci ammantarono l'Olimpo
      modellando altopiani e circhi glaciali. In seguito piogge e venti hanno scolpito la roccia fino a
      isolare questo bastione titanico.


      In alto si concentrano le pareti più dirupate. Da Litóchoro si scorge la spaccatura tra Mytikas e
      Stefani, mentre a sud la gola di Ziliana, lunga 13 km, separa il massiccio principale dal Basso Olimpo.


      Il clima si trasforma a ogni curva di livello. Oltre i 2.000 metri la coltre nevosa permane per circa
      nove mesi all'anno, da settembre a maggio. Le condizioni meteorologiche mutano repentine nel corso del
      giorno e d'estate i temporali pomeridiani con grandine sono assai frequenti.
    wildlife: >-
      La vegetazione si articola per fasce altitudinali. Il parco custodisce circa 1.700 specie e sottospecie
      botaniche, pari al 25 % dell'intera flora ellenica; 56 sono endemismi greci e 23 crescono solo qui.
      Ramonda heldreichii, relitto terziario dell'era glaciale, attrae gli specialisti di tutta Europa. Più in
      alto, il [pino loricato](/especie/pinus_heldreichii/) sale fino a 2.750 metri, segnando uno dei limiti
      del bosco più elevati dei Balcani. Nelle forre umide dell'Enipeas allignano latifoglie e tassi
      centenari.


      Tra i mammiferi sono censite trentadue specie, tra cui il [camoscio](/especie/rupicapra_rupicapra/)
      balcanico, il [capriolo](/especie/capreolus_capreolus/), il [cinghiale](/especie/sus_scrofa/), il [gatto
      selvatico](/especie/felis_silvestris/), la faina, la volpe e lo [scoiattolo
      comune](/especie/sciurus_vulgaris/). Si contano 108 specie di uccelli, come l'[avvoltoio
      monaco](/especie/aegypius_monachus/), l'[aquila reale](/especie/aquila_chrysaetos/), il biancone,
      l'aquila minore e il [falco pellegrino](/especie/falco_peregrinus/). Vivono inoltre 22 specie di
      rettili, otto di anfibi e molteplici farfalle.
    visit: >-
      Per salire in vetta quasi tutti muovono da Litóchoro. Da lì una strada asfaltata sale per 18 km a
      Prionia, punto estremo raggiungibile in auto e via d'inizio dei sentieri, dove sgorga l'Enipeas. A
      Litóchoro il centro visite del parco ha aperto nel giugno 2016; a Leptokarya il museo geologico illustra
      la tettonica dell'Olimpo.


      La via classica sale da Prionia a 1100 m al rifugio Spilios Agapitos a 2100 m lungo il tracciato dell'E4
      tra pini neri e faggi. Il tratto superiore di tornanti su terreno scoperto è esposto al sole cocente
      estivo; il rifugio mette in guardia dal pericolo di disidratazione. Da Prionia al Mytikas l'itinerario
      misura 11,5 km per 1830 m di dislivello positivo e circa sette ore di cammino, classificato come molto
      impegnativo dai gestori.


      Il percorso tocca Skala a 2866 m, primo spallone panoramico e bivio per Skolio e Mytikas. Il vento può
      soffiare gelido anche sotto il sole. La salita all'Olimpo è priva di passaggi d'arrampicata fino a
      Skala; la traversata finale da Skala al Mytikas lungo il canale Kakiskala richiede però una progressione
      su roccia di classe 3 YDS molto aerea; la ghiaia mobile rende pericolosa ogni scivolata con 1000 m di
      vuoto. Se il Mytikas risulta troppo ardito, da Skala si sale agevolmente a Skolio, la seconda cima.


      Oltre 10.000 alpinisti ed escursionisti visitano l'Olimpo ogni anno, la maggior parte dei quali conclude
      la salita a Skala o Skolio.
    history: >-
      Mito e cronaca umana si fondono tra queste guglie. In vetta al Profitis Ilias, a 2.803 metri, sorge una
      cappella del XVI secolo, l'edificio sacro più elevato dell'ortodossia cristiana. Il vecchio monastero di
      San Dionisio si annida nelle gole dell'Enipeas a 820 m. La prima ascensione al Mytikas fu compiuta dagli
      svizzeri Boissonnas e Baud-Bovy assieme al cacciatore di Litóchoro Christos Kakkalos, il 2 agosto 1913.


      Il nucleo integrale del parco tutela circa 4.000 ettari sul versante orientale, dove ogni forma di
      sfruttamento è vietata per legge. Il parco racchiude una zona centrale di 40 km² e un comprensorio
      totale di 240 km² con l'area cuscinetto.
    before: >-
      L'accesso è consentito unicamente lungo i tracciati segnalati, dall'alba al tramonto. I minori di 14
      anni devono essere obbligatoriamente accompagnati. È severamente vietato disturbare nidi, uova o la
      fauna selvatica.


      Oltre i 2.000 metri scarseggiano le sorgenti d'acqua: porta abbondante scorta idrica e abbigliamento per
      repentini cali termici. La neve incappuccia le creste da settembre a maggio.
  pt:
    intro: >-
      A partir de Litóchoro, o relevo desenha um «V» nítido no horizonte entre dois cumes quase gémeos. O da
      esquerda é o Mytikas, o ponto mais alto da Grécia com 2.917,727 metros; o da direita, Stefani, é o Trono
      de Zeus. O Parque Nacional do Monte Olimpo protege este maciço quase circular de cerca de 500
      quilómetros quadrados, com 52 picos e gargantas abruptas. Criado em 1938, foi o primeiro parque nacional
      do país, consagrado reserva da biosfera pela UNESCO, servindo a vila de Litóchoro como porta de entrada
      tradicional.
    landscape: >-
      A montanha é constituída por calcário sedimentar depositado há 200 milhões de anos num mar pouco
      profundo. Mais tarde chegou o gelo: há um milhão de anos, glaciares cobriram o Olimpo e esculpiram
      circos e vales suspensos. A chuva e os ventos encarregaram-se do resto, isolando esta fortaleza rochosa.


      No topo convergem as cristas mais desnudadas. De Litóchoro avista-se a fenda entre o Mytikas e o
      Stefani, ao passo que a sul o desfiladeiro de Ziliana, com 13 km, demarca a fronteira entre o Alto e o
      Baixo Olimpo.


      O clima altera-se a cada metro de subida. Acima dos 2.000 metros o manto nival cobre os cumes cerca de
      nove meses por ano, de setembro a maio. O estado do tempo muda repetidamente num só dia e no verão são
      vulgares trovoadas vespertinas com granizo.
    wildlife: >-
      A flora distribui-se em andares altitudinais. O parque reúne quase 1.700 espécies e subespécies
      vegetais, correspondendo a 25 % da flora da Grécia; 56 são endemismos gregos e 23 ocorrem estritamente
      aqui. A Ramonda heldreichii, relíquia pré-glaciar da era terciária, atrai botânicos de todo o mundo. Em
      cotas superiores, o [pinheiro-da-bósnia](/especie/pinus_heldreichii/) ascende até aos 2.750 metros,
      definindo um dos limites arbóreos mais elevados dos Balcãs. Nas gargantas do Enipeas medram frondosas e
      teixos vetustos.


      Na classe dos mamíferos registam-se trinta e duas espécies, destacando-se a
      [camurça](/especie/rupicapra_rupicapra/) balcânica, o [corço](/especie/capreolus_capreolus/), o
      [javali](/especie/sus_scrofa/), o [gato-bravo](/especie/felis_silvestris/), a fuinha, a raposa e o
      [esquilo-vermelho](/especie/sciurus_vulgaris/). Foram recenseadas 108 espécies de aves, incluindo o
      [abutre-preto](/especie/aegypius_monachus/), a [águia-real](/especie/aquila_chrysaetos/), a
      águia-cobreira, a águia-calçada e o [falcão-peregrino](/especie/falco_peregrinus/). Contam-se ainda 22
      espécies de répteis, oito de anfíbios e grande diversidade de borboletas.
    visit: >-
      Para atingir a montanha a quase totalidade dos caminhantes parte de Litóchoro. Dali uma estrada
      asfaltada sobe 18 km até Prionia, o ponto mais alto com acesso automóvel e arranque dos trilhos, onde
      nasce o rio Enipeas. Em Litóchoro, o Centro de Informação do Parque abriu em junho de 2016; em
      Leptokarya, o Museu Geológico ilustra a história tectónica do maciço.


      A rota clássica sobe de Prionia a 1100 m até ao refúgio Spilios Agapitos a 2100 m pelo trilho balizado
      do E4 sob pinhais e faiais. O troço final de ziguezagues em terreno descoberto expõe-se ao calor
      implacável do verão; os guardas alertam para o perigo de desidratação. De Prionia ao topo do Mytikas o
      percurso integral tem 11,5 km, 1830 m de desnível e cerca de sete horas de subida contínua, classificado
      como muito difícil.


      O trilho prossegue até Skala a 2866 m, primeiro cume e bifurcação para Skolio e Mytikas. Sopram aqui
      rajadas glaciares mesmo sob sol aberto. A subida é uma caminhada acessível até Skala; contudo, a
      travessia final de Skala ao Mytikas pelo desfiladeiro Kakiskala envolve escalada fácil em rocha de
      classe 3 YDS muito exposta; o cascalho solto torna fatal qualquer escorregadela com 1000 m de
      precipício. Se o Mytikas for demasiado vertiginoso, a partir de Skala atinge-se facilmente o Skolio, o
      segundo cume.


      Mais de 10.000 montanhistas sobem o Olimpo anualmente, detendo-se a maioria nos picos de Skala e Skolio.
    history: >-
      Mito e cronologia humana fundem-se nestas escarpas. No topo do Profitis Ilias, a 2.803 metros, ergue-se
      uma capela do século XVI, o templo mais alto de todo o cristianismo ortodoxo. O antigo mosteiro de São
      Dionísio localiza-se na garganta de Enipeas a 820 m. A primeira ascensão documentada ao Mytikas foi
      protagonizada pelos suíços Boissonnas e Baud-Bovy, orientados pelo caçador local Christos Kakkalos, a 2
      de agosto de 1913.


      O núcleo central do parque abrange cerca de 4.000 hectares na vertente leste, onde a lei proíbe qualquer
      exploração. O parque engloba uma zona estrita de 40 km² e uma superfície total de 240 km² com a sua
      faixa periférica.
    before: >-
      A circulação só é permitida pelos trilhos demarcados, do nascer ao pôr do sol. Não é autorizada a
      entrada a menores de 14 anos sem acompanhamento de adultos. É proibido colher ou destruir ninhos, ovos
      ou crias e incomodar a fauna.


      Acima dos 2.000 metros as fontes de água são raras: leva sempre água abundante e agasalhos para frio
      súbito. A neve cobre os cumes de setembro a maio.
