resumen:
  es: Laboratorio vivo de rewilding en suelo ganado al mar con densas manadas de ciervos y caballos Heck.
  en: Living rewilding laboratory on land reclaimed from the sea with dense herds of red deer and Heck cattle.
  fr: >-
    Laboratoire vivant de réensauvagement sur des terres gagnées sur la mer, avec de denses hardes de cerfs et
    de chevaux Heck.
  de: >-
    Lebendes Rewilding-Labor auf dem Meer abgerungenem Land mit dichten Herden von Rothirschen und
    Heck-Pferden.
  it: Laboratorio vivo di rewilding su terre strappate al mare con dense mandrie di cervi e cavalli Heck.
  pt: Laboratório vivo de rewilding em solo conquistado ao mar com densas manadas de veados e cavalos Heck.
unico:
  es: >-
    Un humedal nacido por accidente en un pólder, donde caballos, vacas y ciervos pastan todo el año para
    mantener abierta la pradera de las aves.
  en: >-
    A wetland born by accident on a polder, where horses, cattle and deer graze year-round to keep the
    grassland open for birds.
  fr: >-
    Une zone humide née par hasard sur un polder, où chevaux, bovins et cerfs pâturent toute l'année pour
    garder la prairie ouverte aux oiseaux.
  de: >-
    Ein zufällig auf einem Polder entstandenes Feuchtgebiet, in dem Pferde, Rinder und Hirsche ganzjährig
    weiden, um die Wiese für Vögel offen zu halten.
  it: >-
    Una zona umida nata per caso su un polder, dove cavalli, bovini e cervi pascolano tutto l'anno per
    mantenere aperta la prateria per gli uccelli.
  pt: >-
    Uma zona húmida nascida por acaso num pólder, onde cavalos, vacas e veados pastam todo o ano para manter
    aberta a pradaria das aves.
observaciones:
  es: >-
    El núcleo de la reserva, donde viven las manadas de animales salvajes, solo se visita en excursiones
    guiadas fuera del invierno. Hollandse Hout, Kotterbos, Oostvaardersbos y Oostvaardersveld son, en
    principio, de libre acceso, pero en invierno, y a veces unas semanas de primavera, se cierran partes de De
    Driehoek, Oostvaardersbos y Kotterbos para dar descanso a los grandes herbívoros. El Buitencentrum y las
    rutas que parten de él no admiten perros.


    Para quien se mueve con dificultad, De Driehoek es accesible: desde el Buitencentrum sale una pasarela de
    madera entre el carrizo hasta el observatorio Blauwborst, y la ruta asfaltada Zeearend lleva a un
    observatorio accesible para sillas de ruedas.
texto:
  es:
    intro: >-
      Nadie planeó esto. El mar se retiró, la tierra quedó seca en el sur de Flevoland, y se pensaba llenarla
      de industria; pero el suelo, bajo y húmedo, no servía para cultivar. Entonces apareció el carrizo,
      sembrado desde avionetas, y detrás de él los gansos. Hoy las Oostvaardersplassen son un gran humedal de
      carrizales, pastizales ásperos, charcas, bosques y matorral, entre Lelystad y Almere, que forma parte
      del Parque Nacional Nieuw Land. Más de cincuenta años después de aquel nacimiento espontáneo, sigue
      siendo un lugar donde la naturaleza lleva la iniciativa.
    landscape: >-
      La reserva ocupa unos 56 km² a orillas del Markermeer, en el centro del Flevopolder, y se reparte en dos
      mitades. Al noroeste está la zona húmeda, con grandes carrizales sobre arcilla donde los gansos comunes
      buscan comida; al sureste, la zona seca, que antes de ser reserva era un vivero de sauces. Unas 3600 ha
      son de zona húmeda y unas 2000 ha, de zona seca.


      Esa pradera no se abre sola. Si nadie la pastara, el sauce la cerraría en bosque denso y las aves
      acuáticas perderían su hábitat. Por eso los gestores soltaron grandes herbívoros: en 1983 se liberaron
      32 vacas Heck, y un año después 20 caballos Konik. Hoy conviven con los
      [ciervos](/especie/cervus_elaphus/), y entre todos mantienen el paisaje abierto y los
      [caballos](/especie/equus_caballus/) y el ganado hacen lo mismo que ellos. En total son cuatro las zonas
      del espacio natural: Hollandse Hout, Kotterbos, Oostvaardersbos y Oostvaardersveld.
    wildlife: >-
      Este es un sitio de aves, y se nota desde el primer día. Los gansos, las
      [espátulas](/especie/platalea_leucorodia/) y los [cormoranes grandes](/especie/phalacrocorax_carbo/)
      llegaron pronto al nuevo humedal, igual que corzos, zorros, castores, murciélagos y mariposas. Entre las
      aves de la zona figuran también el martín pescador, la garza real y la [garceta
      grande](/especie/egretta_alba/). Y desde 2006 cría aquí el [pigargo
      europeo](/especie/haliaeetus_albicilla/).


      El año tiene su ritmo. Entre febrero y abril los ciervos machos pierden la cornamenta. El Moeraspad, que
      recorre el Oostvaardersveld, es un concierto de pájaros cantores, y las golondrinas anidan en los
      propios observatorios. Los mamíferos grandes se dejan ver: con un poco de suerte, ciervos, caballos
      Konik y vacas Heck; para el zorro, el corzo o la liebre hace falta más paciencia. En la reserva viven
      más de 40 zorros.
    visit: >-
      Hay dos puertas de entrada. En Lelystad, el Buitencentrum Oostvaardersplassen es el punto de partida de
      rutas a pie y en bici, excursiones y otras actividades. En Almere, el centro de visitantes De
      Oostvaarders deja prismáticos a mano, tiene una exposición interactiva, películas de realidad virtual
      (con un vuelo de 360 grados a lomos de un pigargo) y una sala panorámica con mirador alto desde donde
      observar la reserva.


      A pie hay dos paseos cortos. El Frans Vera Pad mide 3 km, bordea la pradera con vistas amplias y pasa
      junto a una antigua madriguera de zorro. El Moeraspad mide 3,5 km y atraviesa el Oostvaardersveld entre
      aguas llenas de aves. Además, a lo largo del borde de la reserva y de varias rutas hay observatorios y
      miradores con buena vista.
    history: >-
      Alguien tuvo que defender este humedal cuando amenazaba con secarse: un grupo de acción y algunos
      biólogos pidieron conservarlo. El núcleo tiene hoy estatus Natura 2000.


      La gestión ha sido polémica. Los grandes herbívoros viven en un área vallada, sin corredores que la
      conecten con otros espacios, y en el invierno de 2017-2018 murieron de hambre casi 3.300 ciervos,
      caballos y vacas, lo que dividió a la opinión pública neerlandesa. Desde 2018 la gestión cambió y se
      fija un número máximo de grandes herbívoros.
    before: >-
      El núcleo de la reserva, donde viven las manadas de animales salvajes, solo se visita en excursiones
      guiadas fuera del invierno. Hollandse Hout, Kotterbos, Oostvaardersbos y Oostvaardersveld son, en
      principio, de libre acceso, pero en invierno, y a veces unas semanas de primavera, se cierran partes de
      De Driehoek, Oostvaardersbos y Kotterbos para dar descanso a los grandes herbívoros. El Buitencentrum y
      las rutas que parten de él no admiten perros.


      Para quien se mueve con dificultad, De Driehoek es accesible: desde el Buitencentrum sale una pasarela
      de madera entre el carrizo hasta el observatorio Blauwborst, y la ruta asfaltada Zeearend lleva a un
      observatorio accesible para sillas de ruedas.
    around: >-
      A unos ocho kilómetros queda el [Archipiélago de Marker Wadden](/lugar/marker-wadden/), el vecino más
      cercano del atlas.
  en:
    intro: >-
      Nobody planned this. The sea retreated, the land dried out in southern Flevoland, and the plan was to
      fill it with industry; but the low, wet soil wasn't fit for farming. Then reed appeared, sown from light
      aircraft, and behind it came the geese. Today the Oostvaardersplassen form a large wetland of reedbeds,
      rough grasslands, pools, woodland and scrub between Lelystad and Almere, part of Nieuw Land National
      Park. More than fifty years after that spontaneous birth, it remains a place where nature takes the
      lead.
    landscape: >-
      The reserve covers around 56 km² on the shore of the Markermeer, in the middle of the Flevopolder, and
      is divided into two halves. To the north-west lies the wet zone, with vast reedbeds on clay where
      greylag geese come to feed; to the south-east lies the dry zone, which before becoming a reserve was a
      willow nursery. Around 3,600 ha are wet zone and around 2,000 ha are dry zone.


      That grassland doesn't stay open by itself. Without grazing, willow would close it into dense woodland
      and waterbirds would lose their habitat. That is why managers released large herbivores: 32 Heck cattle
      in 1983, and 20 Konik horses a year later. Today they live alongside [red
      deer](/especie/cervus_elaphus/), and together they keep the landscape open while the [feral
      horses](/especie/equus_caballus/) and cattle do the same work. In all there are four sectors to the
      reserve: Hollandse Hout, Kotterbos, Oostvaardersbos and Oostvaardersveld.
    wildlife: >-
      This is a bird place, and it shows from day one. Geese, [Eurasian
      spoonbills](/especie/platalea_leucorodia/) and [great cormorants](/especie/phalacrocorax_carbo/) soon
      arrived in the new wetland, along with roe deer, foxes, beavers, bats and butterflies. Other birds in
      the area include kingfisher, grey heron and [great egret](/especie/egretta_alba/). And since 2006 the
      [white-tailed eagle](/especie/haliaeetus_albicilla/) has bred here.


      The year follows its own rhythm. Between February and April the stags shed their antlers. The Moeraspad,
      which winds through Oostvaardersveld, is a concert of songbirds, and swallows nest right inside the
      hides. The large mammals show themselves readily: with a bit of luck you see red deer, Konik horses and
      Heck cattle; for fox, roe deer or hare you need more patience. More than 40 foxes live in the reserve.
    visit: >-
      There are two gateways. In Lelystad, the Buitencentrum Oostvaardersplassen is the starting point for
      walking and cycling routes, excursions and other activities. In Almere, the De Oostvaarders visitor
      centre keeps binoculars at hand, has an interactive exhibition, virtual reality films (including a
      360-degree flight on the back of a white-tailed eagle) and a panoramic room with a high viewpoint
      overlooking the reserve.


      On foot there are two short walks. The Frans Vera Pad is 3 km long, skirts the grassland with wide views
      and passes an old fox earth. The Moeraspad is 3.5 km long and crosses Oostvaardersveld through waters
      teeming with birds. In addition, along the reserve edge and several trails there are hides and
      viewpoints with good outlooks.
    history: >-
      Someone had to defend this wetland when it was threatened with drainage: an action group and several
      biologists called for its conservation. Today the core holds Natura 2000 status.


      Management has been controversial. The large herbivores live in a fenced area without corridors linking
      it to other sites, and in the winter of 2017-2018 nearly 3,300 deer, horses and cattle starved to death,
      dividing Dutch public opinion. Since 2018 management changed and a maximum number of large herbivores is
      set.
    before: >-
      The core of the reserve, where the wild herds live, can only be visited on guided excursions outside
      winter. Hollandse Hout, Kotterbos, Oostvaardersbos and Oostvaardersveld are in principle open access,
      though in winter, and sometimes for a few weeks in spring, parts of De Driehoek, Oostvaardersbos and
      Kotterbos are closed to give the large herbivores peace. The Buitencentrum and the trails starting from
      it do not allow dogs.


      For visitors with reduced mobility, De Driehoek is accessible: from the Buitencentrum a wooden boardwalk
      runs through the reeds to the Blauwborst hide, and the paved Zeearend trail leads to a
      wheelchair-accessible hide.
    around: >-
      Roughly eight kilometres away lies the [Marker Wadden Archipelago](/lugar/marker-wadden/), the reserve's
      closest neighbour in the atlas.
  fr:
    intro: >-
      Personne n'avait prévu cela. La mer s'est retirée, la terre s'est asséchée dans le sud du Flevoland, et
      l'on comptait y installer des industries ; mais le sol, bas et humide, ne convenait pas à la culture.
      Alors le roseau est apparu, semé par avion, et derrière lui les oies. Aujourd'hui, les
      Oostvaardersplassen forment une vaste zone humide de roselières, de prairies rudes, de mares, de bois et
      de fourrés entre Lelystad et Almere, au sein du parc national Nieuw Land. Plus de cinquante ans après
      cette naissance spontanée, la nature y garde l'initiative.
    landscape: >-
      La réserve couvre environ 56 km² au bord du Markermeer, au centre du Flevopolder, et se partage en deux
      moitiés. Au nord-ouest s'étend la zone humide, avec de grandes roselières sur argile où les oies
      cendrées viennent se nourrir ; au sud-est se trouve la zone sèche, qui était une pépinière de saules
      avant de devenir réserve. Environ 3 600 ha sont en zone humide et environ 2 000 ha en zone sèche.


      Cette prairie ne reste pas ouverte toute seule. Sans pâturage, le saule la refermerait en forêt dense et
      les oiseaux d'eau perdraient leur habitat. C'est pourquoi les gestionnaires ont relâché de grands
      herbivores : 32 bovins Heck ont été lâchés en 1983, puis 20 chevaux Konik un an plus tard. Aujourd'hui
      ils cohabitent avec les [cerfs élaphes](/especie/cervus_elaphus/), et ensemble ils maintiennent le
      paysage ouvert tandis que les [chevaux](/especie/equus_caballus/) et le bétail accomplissent le même
      travail. Au total, l'espace naturel comprend quatre secteurs : Hollandse Hout, Kotterbos,
      Oostvaardersbos et Oostvaardersveld.
    wildlife: >-
      C'est un site ornithologique, et cela se voit dès le premier jour. Les oies, les [spatules
      blanches](/especie/platalea_leucorodia/) et les [grands cormorans](/especie/phalacrocorax_carbo/) sont
      vite arrivés dans la nouvelle zone humide, tout comme les chevreuils, renards, castors, chauves-souris
      et papillons. Parmi les oiseaux figurent aussi le martin-pêcheur, le héron cendré et la [grande
      aigrette](/especie/egretta_alba/). Et depuis 2006, le [pygargue à queue
      blanche](/especie/haliaeetus_albicilla/) niche ici.


      L'année a son rythme. Entre février et avril, les cerfs mâles perdent leurs bois. Le Moeraspad, qui
      traverse l'Oostvaardersveld, est un concert d'oiseaux chanteurs, et les hirondelles nichent dans les
      observatoires mêmes. Les grands mammifères se laissent voir : avec un peu de chance, cerfs, chevaux
      Konik et bovins Heck ; pour le renard, le chevreuil ou le lièvre, il faut plus de patience. Plus de 40
      renards vivent dans la réserve.
    visit: >-
      Il y a deux portes d'entrée. À Lelystad, le Buitencentrum Oostvaardersplassen est le point de départ
      d'itinéraires à pied et à vélo, d'excursions et d'autres activités. À Almere, le centre d'accueil De
      Oostvaarders met des jumelles à disposition, propose une exposition interactive, des films en réalité
      virtuelle (avec un vol à 360 degrés sur le dos d'un pygargue) et une salle panoramique avec belvédère
      élevé pour observer la réserve.


      À pied, il existe deux courtes balades. Le Frans Vera Pad mesure 3 km, longe la prairie avec de larges
      vues et passe près d'un ancien terrier de renard. Le Moeraspad mesure 3,5 km et traverse
      l'Oostvaardersveld au milieu d'eaux riches en oiseaux. De plus, le long de la bordure de la réserve et
      de plusieurs sentiers se trouvent des observatoires et belvédères offrant de belles vues.
    history: >-
      Il a fallu défendre cette zone humide lorsqu'elle menaçait de s'assécher : un collectif et quelques
      biologistes ont demandé sa conservation. Le cœur bénéficie aujourd'hui du statut Natura 2000.


      La gestion a été controversée. Les grands herbivores vivent dans une zone clôturée, sans corridors la
      reliant à d'autres espaces, et durant l'hiver 2017-2018 près de 3 300 cerfs, chevaux et bovins sont
      morts de faim, ce qui a divisé l'opinion néerlandaise. Depuis 2018, la gestion a changé et un effectif
      maximal de grands herbivores est fixé.
    before: >-
      Le cœur de la réserve, où vivent les hardes d'animaux sauvages, ne se visite qu'en excursion guidée hors
      hiver. Hollandse Hout, Kotterbos, Oostvaardersbos et Oostvaardersveld sont en principe en libre accès,
      mais en hiver, et parfois quelques semaines au printemps, certaines parties de De Driehoek,
      Oostvaardersbos et Kotterbos ferment pour laisser reposer les grands herbivores. Le Buitencentrum et les
      sentiers qui en partent n'acceptent pas les chiens.


      Pour les personnes à mobilité réduite, De Driehoek est accessible : depuis le Buitencentrum part un
      caillebotis en bois dans les roseaux jusqu'à l'observatoire Blauwborst, et la piste asphaltée Zeearend
      mène à un observatoire accessible en fauteuil roulant.
    around: >-
      À environ huit kilomètres se trouve l'[Archipel de Marker Wadden](/lugar/marker-wadden/), le voisin le
      plus proche de l'atlas.
  de:
    intro: >-
      Niemand hat das geplant. Das Meer zog sich zurück, das Land im Süden von Flevoland fiel trocken, und man
      wollte es mit Industrie füllen; doch der tiefe, nasse Boden taugte nicht für Ackerbau. Dann erschien das
      Schilf, aus Kleinflugzeugen gesät, und hinter ihm kamen die Gänse. Heute sind die Oostvaardersplassen
      ein großes Feuchtgebiet aus Schilfröhrichten, rauen Weiden, Tümpeln, Wäldern und Gebüsch zwischen
      Lelystad und Almere, Teil des Nationalparks Nieuw Land. Über fünfzig Jahre nach dieser spontanen
      Entstehung gibt hier noch immer die Natur den Ton an.
    landscape: >-
      Das Reservat umfasst rund 56 km² am Ufer des Markermeers, mitten im Flevopolder, und teilt sich in zwei
      Hälften. Im Nordwesten liegt die Nasszone mit großen Schilfbeständen auf Tonboden, wo Graugänse Nahrung
      suchen; im Südosten liegt die Trockenzone, die vor der Unterschutzstellung eine Weidenplantage war. Rund
      3.600 ha sind Nasszone und rund 2.000 ha Trockenzone.


      Diese Graslandschaft bleibt nicht von allein offen. Ohne Beweidung würde die Weide sie in dichten Wald
      verwandeln und die Wasservögel verlören ihren Lebensraum. Deshalb setzten die Verwalter große
      Pflanzenfresser aus: 1983 wurden 32 Heckrinder freigelassen, ein Jahr später 20 Konik-Pferde. Heute
      leben sie zusammen mit den [Rothirschen](/especie/cervus_elaphus/), und gemeinsam halten sie die
      Landschaft offen, während die [Pferde](/especie/equus_caballus/) und Rinder dieselbe Arbeit leisten.
      Insgesamt umfasst das Naturgebiet vier Teilbereiche: Hollandse Hout, Kotterbos, Oostvaardersbos und
      Oostvaardersveld.
    wildlife: >-
      Dies ist ein Vogelparadies, und das merkt man vom ersten Tag an. Gänse,
      [Löffler](/especie/platalea_leucorodia/) und [Kormorane](/especie/phalacrocorax_carbo/) fanden sich
      rasch im neuen Feuchtgebiet ein, ebenso Rehe, Füchse, Biber, Fledermäuse und Schmetterlinge. Zu den
      Vögeln des Gebiets gehören auch Eisvogel, Graureiher und [Silberreiher](/especie/egretta_alba/). Und
      seit 2006 brütet hier der [Seeadler](/especie/haliaeetus_albicilla/).


      Das Jahr hat seinen eigenen Rhythmus. Zwischen Februar und April werfen die Hirsche ihr Geweih ab. Der
      Moeraspad durch das Oostvaardersveld ist ein Konzert von Singvögeln, und Schwalben nisten direkt in den
      Beobachtungshütten. Die großen Säugetiere zeigen sich oft: Mit etwas Glück sieht man Rothirsche,
      Konik-Pferde und Heckrinder; für Fuchs, Reh oder Hase braucht man mehr Geduld. Im Reservat leben mehr
      als 40 Füchse.
    visit: >-
      Es gibt zwei Eingänge. In Lelystad ist das Buitencentrum Oostvaardersplassen Ausgangspunkt für Wander-
      und Radwege, Exkursionen und weitere Aktivitäten. In Almere stellt das Besucherzentrum De Oostvaarders
      Ferngläser bereit, bietet eine interaktive Ausstellung, Virtual-Reality-Filme (mit einem 360-Grad-Flug
      auf dem Rücken eines Seeadlers) und einen Panoramasaal mit hohem Aussichtspunkt über das Reservat.


      Zu Fuß gibt es zwei kurze Spaziergänge. Der Frans Vera Pad ist 3 km lang, säumt die Wiese mit weiten
      Ausblicken und führt an einem alten Fuchsbau vorbei. Der Moeraspad ist 3,5 km lang und durchquert das
      Oostvaardersveld zwischen vogelreichen Gewässern. Außerdem stehen entlang des Reservatsrands und
      mehrerer Wege Beobachtungshütten und Aussichtspunkte mit guter Sicht.
    history: >-
      Jemand musste dieses Feuchtgebiet verteidigen, als ihm die Trockenlegung drohte: Eine Aktionsgruppe und
      einige Biologen forderten seinen Erhalt. Der Kern besitzt heute Natura-2000-Status.


      Das Management war umstritten. Die großen Pflanzenfresser leben in einem eingezäunten Gebiet ohne
      Korridore zu anderen Flächen, und im Winter 2017-2018 verhungerten fast 3.300 Hirsche, Pferde und
      Rinder, was die niederländische Öffentlichkeit spaltete. Seit 2018 wurde die Verwaltung geändert und
      eine Höchstzahl für große Pflanzenfresser festgelegt.
    before: >-
      Der Kern des Reservats, in dem die wilden Herden leben, darf außerhalb des Winters nur im Rahmen
      geführter Touren besucht werden. Hollandse Hout, Kotterbos, Oostvaardersbos und Oostvaardersveld sind
      grundsätzlich frei zugänglich, doch im Winter – und manchmal einige Wochen im Frühjahr – werden Teile
      von De Driehoek, Oostvaardersbos und Kotterbos gesperrt, um den großen Pflanzenfressern Ruhe zu gönnen.
      Im Buitencentrum und auf den dort startenden Wegen sind Hunde nicht erlaubt.


      Für Besucher mit eingeschränkter Mobilität ist De Driehoek barrierefrei: Vom Buitencentrum führt ein
      Holzsteg durch das Schilf zur Beobachtungshütte Blauwborst, und der asphaltierte Weg Zeearend führt zu
      einer rollstuhlgerechten Hütte.
    around: >-
      Etwa acht Kilometer entfernt liegt der [Archipel Marker Wadden](/lugar/marker-wadden/), der nächste
      Nachbar im Atlas.
  it:
    intro: >-
      Nessuno aveva pianificato tutto questo. Il mare si ritirò, la terra rimase asciutta nel sud del
      Flevoland e si pensava di riempirla di industrie; ma il suolo, basso e umido, non serviva per coltivare.
      Allora comparve la cannuccia di palude, seminata da piccoli aerei, e dietro di essa le oche. Oggi le
      Oostvaardersplassen sono una grande zona umida di canneti, pascoli rustici, stagni, boschi e macchie tra
      Lelystad e Almere, parte del Parco Nazionale Nieuw Land. Oltre cinquant'anni dopo quella nascita
      spontanea, resta un luogo in cui è la natura a prendere l'iniziativa.
    landscape: >-
      La riserva occupa circa 56 km² sulle rive del Markermeer, al centro del Flevopolder, ed è divisa in due
      metà. A nord-ovest si trova la zona umida, con grandi canneti su argilla dove le oche selvatiche cercano
      cibo; a sud-est la zona asciutta, che prima di diventare riserva era un vivaio di salici. Circa 3.600 ha
      sono zona umida e circa 2.000 ha zona asciutta.


      Questa prateria non resta aperta da sola. Se nessuno la pascolasse, il salice la chiuderebbe in un bosco
      fitto e gli uccelli acquatici perderebbero il loro habitat. Per questo i gestori liberarono grandi
      erbivori: nel 1983 furono rilasciati 32 bovini Heck, e un anno dopo 20 cavalli Konik. Oggi convivono con
      i [cervi](/especie/cervus_elaphus/), e insieme mantengono aperto il paesaggio mentre i
      [cavalli](/especie/equus_caballus/) e i bovini svolgono lo stesso lavoro. In totale l'area naturale
      conta quattro settori: Hollandse Hout, Kotterbos, Oostvaardersbos e Oostvaardersveld.
    wildlife: >-
      Questo è un luogo di uccelli, e si nota fin dal primo giorno. Le oche, le
      [spatole](/especie/platalea_leucorodia/) e i [cormorani comuni](/especie/phalacrocorax_carbo/)
      arrivarono presto nella nuova zona umida, così come caprioli, volpi, castori, pipistrelli e farfalle.
      Tra gli uccelli della zona figurano anche il martin pescatore, l'airone cenerino e l'[airone bianco
      maggiore](/especie/egretta_alba/). E dal 2006 nidifica qui l'[aquila di
      mare](/especie/haliaeetus_albicilla/).


      L'anno ha il suo ritmo. Tra febbraio e aprile i cervi maschi perdono il palco. Il Moeraspad, che
      percorre l'Oostvaardersveld, è un concerto di uccelli canori e le rondini nidificano negli stessi
      osservatori. I grandi mammiferi si lasciano vedere: con un po' di fortuna cervi, cavalli Konik e bovini
      Heck; per la volpe, il capriolo o la lepre serve più pazienza. Nella riserva vivono più di 40 volpi.
    visit: >-
      Ci sono due porte d'ingresso. A Lelystad, il Buitencentrum Oostvaardersplassen è il punto di partenza di
      percorsi a piedi e in bici, escursioni e altre attività. Ad Almere, il centro visite De Oostvaarders
      mette a disposizione binocoli, ospita una mostra interattiva, filmati in realtà virtuale (con un volo a
      360 gradi sul dorso di un'aquila di mare) e una sala panoramica con belvedere alto da cui osservare la
      riserva.


      A piedi ci sono due passeggiate brevi. Il Frans Vera Pad misura 3 km, costeggia la prateria con ampie
      vedute e passa accanto a una vecchia tana di volpe. Il Moeraspad misura 3,5 km e attraversa
      l'Oostvaardersveld tra acque ricche di uccelli. Inoltre, lungo il margine della riserva e di vari
      sentieri ci sono capanni e punti panoramici con buona visuale.
    history: >-
      Qualcuno dovette difendere questa zona umida quando rischiava di essere prosciugata: un gruppo d'azione
      e alcuni biologi chiesero di conservarla. Il nucleo gode oggi dello status Natura 2000.


      La gestione è stata controversa. I grandi erbivori vivono in un'area recintata, senza corridoi che la
      colleghino ad altri spazi, e nell'inverno 2017-2018 morirono di fame quasi 3.300 cervi, cavalli e
      bovini, dividendo l'opinione pubblica olandese. Dal 2018 la gestione è cambiata ed è stato fissato un
      numero massimo di grandi erbivori.
    before: >-
      Il nucleo della riserva, dove vivono le mandrie di animali selvatici, si visita solo con escursioni
      guidate fuori dall'inverno. Hollandse Hout, Kotterbos, Oostvaardersbos e Oostvaardersveld sono in linea
      di principio ad accesso libero, ma d'inverno, e talvolta per alcune settimane in primavera, si chiudono
      parti di De Driehoek, Oostvaardersbos e Kotterbos per dare quiete ai grandi erbivori. Il Buitencentrum e
      i sentieri che ne partono non ammettono cani.


      Per chi ha difficoltà motorie, De Driehoek è accessibile: dal Buitencentrum parte una passerella di
      legno tra le canne fino all'osservatorio Blauwborst, e il percorso asfaltato Zeearend porta a un
      osservatorio accessibile in sedia a rotelle.
    around: >-
      A circa otto chilometri si trova l'[Arcipelago di Marker Wadden](/lugar/marker-wadden/), il vicino più
      prossimo dell'atlante.
  pt:
    intro: >-
      Ninguém planeou isto. O mar recuou, a terra ficou seca no sul da Flevolândia, e pensava-se enchê-la de
      indústria; mas o solo, baixo e húmido, não servia para cultivar. Então apareceu o caniço, semeado de
      avionetas, e atrás dele os gansos. Hoje as Oostvaardersplassen são uma grande zona húmida de caniços,
      pastagens rústicas, charcos, bosques e matagal, entre Lelystad e Almere, que integra o Parque Nacional
      Nieuw Land. Mais de cinquenta anos após aquele nascimento espontâneo, continua a ser um lugar onde a
      natureza toma a iniciativa.
    landscape: >-
      A reserva ocupa cerca de 56 km² nas margens do Markermeer, no centro do Flevopolder, e divide-se em duas
      metades. A noroeste fica a zona húmida, com grandes caniços sobre argila onde os gansos-bravos procuram
      alimento; a sudeste, a zona seca, que antes de ser reserva era um viveiro de salgueiros. Cerca de 3.600
      ha são de zona húmida e cerca de 2.000 ha de zona seca.


      Essa pradaria não se abre sozinha. Se ninguém a pastasse, o salgueiro fechá-la-ia em bosque denso e as
      aves aquáticas perderiam o seu habitat. Por isso os gestores soltaram grandes herbívoros: em 1983 foram
      libertadas 32 vacas Heck, e um ano depois 20 cavalos Konik. Hoje convivem com os
      [veados-vermelhos](/especie/cervus_elaphus/), mantendo juntos a paisagem aberta, enquanto os
      [cavalos](/especie/equus_caballus/) e o gado fazem o mesmo trabalho. No total são quatro as zonas do
      espaço natural: Hollandse Hout, Kotterbos, Oostvaardersbos e Oostvaardersveld.
    wildlife: >-
      Este é um sítio de aves, e nota-se desde o primeiro dia. Os gansos, os
      [colhereiros-europeus](/especie/platalea_leucorodia/) e os
      [corvos-marinhos-de-faces-brancas](/especie/phalacrocorax_carbo/) chegaram cedo à nova zona húmida, tal
      como corços, raposas, castores, morcegos e borboletas. Entre as aves da zona figuram também o
      guarda-rios, a garça-real e a [garça-branca-grande](/especie/egretta_alba/). E desde 2006 nidifica aqui
      a [águia-rabalva](/especie/haliaeetus_albicilla/).


      O ano tem o seu ritmo. Entre fevereiro e abril os veados machos perdem as hastes. O Moeraspad, que
      percorre o Oostvaardersveld, é um concerto de aves canoras, e as andorinhas nidificam nos próprios
      observatórios. Os grandes mamíferos deixam-se ver: com um pouco de sorte, veados, cavalos Konik e vacas
      Heck; para a raposa, o corço ou a lebre é precisa mais paciência. Na reserva vivem mais de 40 raposas.
    visit: >-
      Há duas portas de entrada. Em Lelystad, o Buitencentrum Oostvaardersplassen é o ponto de partida de
      percursos a pé e de bicicleta, excursões e outras atividades. Em Almere, o centro de visitantes De
      Oostvaarders deixa binóculos à mão, tem uma exposição interativa, filmes de realidade virtual (com um
      voo de 360 graus às costas de uma águia-rabalva) e uma sala panorâmica com miradouro alto de onde
      observar a reserva.


      A pé há dois passeios curtos. O Frans Vera Pad mede 3 km, margeia a pradaria com vistas amplas e passa
      junto a uma antiga toca de raposa. O Moeraspad mede 3,5 km e atravessa o Oostvaardersveld entre águas
      cheias de aves. Além disso, ao longo da borda da reserva e de vários percursos há observatórios e
      miradouros com boa vista.
    history: >-
      Alguém teve de defender esta zona húmida quando ameaçava secar: um grupo de ação e alguns biólogos
      pediram a sua conservação. O núcleo tem hoje estatuto Natura 2000.


      A gestão foi polémica. Os grandes herbívoros vivem numa área vedada, sem corredores que a liguem a
      outros espaços, e no inverno de 2017-2018 morreram à fome quase 3.300 veados, cavalos e vacas, o que
      dividiu a opinião pública neerlandesa. Desde 2018 a gestão mudou e fixa-se um número máximo de grandes
      herbívoros.
    before: >-
      O núcleo da reserva, onde vivem as manadas de animais selvagens, só se visita em excursões guiadas fora
      do inverno. Hollandse Hout, Kotterbos, Oostvaardersbos e Oostvaardersveld são, em princípio, de acesso
      livre, mas no inverno, e por vezes algumas semanas na primavera, fecham-se partes de De Driehoek,
      Oostvaardersbos e Kotterbos para dar descanso aos grandes herbívoros. O Buitencentrum e os trilhos que
      dele partem não admitem cães.


      Para quem tem mobilidade reduzida, De Driehoek é acessível: do Buitencentrum parte um passadiço de
      madeira entre o caniço até ao observatório Blauwborst, e o percurso asfaltado Zeearend leva a um
      observatório acessível a cadeiras de rodas.
    around: >-
      A cerca de oito quilómetros fica o [Arquipélago de Marker Wadden](/lugar/marker-wadden/), o vizinho mais
      próximo do atlas.
