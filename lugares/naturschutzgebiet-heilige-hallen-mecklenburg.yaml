resumen:
  es: >-
    Hayedo en regeneración natural, con madera muerta y diversidad de estructuras en la reserva de
    Lüttenhagen.
  en: >-
    Naturally regenerating old-growth beech forest rich in coarse woody debris and structural diversity in
    Lüttenhagen reserve.
  fr: Hêtraie ancienne en régénération naturelle, riche en bois mort et diversité structurale à Lüttenhagen.
  de: Buchen-Naturwald in natürlicher Verjüngung mit reichem Totholz und Strukturvielfalt bei Lüttenhagen.
  it: >-
    Faggeta vetusta in rinnovazione naturale, con legno morto e ricchezza di strutture nella riserva di
    Lüttenhagen.
  pt: >-
    Faial primitivo em regeneração natural, com abundante madeira morta e diversidade de estratos em
    Lüttenhagen.
unico:
  es: 'Es un hayedo que se renueva solo: lo ves envejecer, caer y empezar de nuevo en el mismo paseo.'
  en: >-
    A primeval beech grove renewing itself unaided: you witness old trees senescing, falling and starting life
    anew along the same walk.
  fr: >-
    Une hêtraie qui se régénère sans intervention humaine : vous la voyez vieillir, s’effondrer et renaître au
    fil d’une même promenade.
  de: >-
    Ein Buchenwald, der sich ganz von selbst erneuert: Du erlebst sein Altern, Zusammenbrechen und neues
    Erwachen auf einem einzigen Rundweg.
  it: 'Una faggeta che si rigenera da sola: la vedi invecchiare, crollare e rinascere lungo il medesimo sentiero.'
  pt: >-
    Um faial que se regenera de forma autónoma: vês o seu envelhecimento, queda e renascimento num mesmo
    passeio pedestre.
observaciones:
  es: >-
    En las reservas naturales del parque hay que ir por los senderos señalizados. Pueden caer árboles y ramas,
    y se entra por cuenta y riesgo propios. Los perros van con correa; no se puede hacer fuego ni acampar.
    Recoger setas y bayas está permitido solo para consumo propio y fuera de las reservas, es decir, no aquí.
    El uso de drones en la reserva requiere autorización.
texto:
  es:
    intro: >-
      A mediados del siglo XIX, el bosque parecía una nave de catedral: troncos enormes, rectos como columnas,
      y arriba una bóveda de ramas. De ahí el nombre, Heilige Hallen, las «salas sagradas». Hoy sigue siendo
      un hayedo viejo en la Feldberger Seenlandschaft, a unos 3,5 km al oeste de Feldberg y al suroeste de
      Lüttenhagen, pero ya no parece una nave: entre los gigantes han crecido árboles más jóvenes, y muchos de
      los grandes están muriendo. Es una reserva natural, parte del parque natural Feldberger Seenlandschaft,
      y se visita caminando.
    landscape: >-
      El bosque no está sobre una llanura cualquiera. Se asienta en la morrena terminal principal de la
      glaciación del Weichsel, y el hielo dejó un relieve ondulado, de sedimentos acumulados, y varios hoyos
      de hielo muerto que se conservan hasta hoy. En esas depresiones, llamadas Sölle, se formaron charcas,
      turberas de cubeta y bosques pantanosos de abedul. Así que, junto a las hayas, la reserva guarda también
      otros paisajes pequeños, más húmedos.


      Los árboles tienen de 300 a más de 350 años, y algunos superan los 50 metros de altura y el metro de
      diámetro. Entre los viejos «Methusalems», han crecido árboles más jóvenes. Muchos de los grandes han
      llegado a su edad máxima y mueren de forma natural, y en los huecos nacen enseguida hayas jóvenes. El
      bosque pasa así de la fase de envejecimiento a la de regeneración natural, con una gran variedad de
      estructuras.
    wildlife: >-
      La vida aquí gira alrededor de la madera muerta. Su abundancia favorece una diversidad muy alta de
      hongos, insectos que viven en la madera muerta y aves que anidan en cavidades.


      Si quieres ver animales en el parque natural, ir en silencio y con respeto aumenta la probabilidad de
      verlos.
    visit: >-
      Se llega por la carretera de Feldberg a Lychen, pasado Lüttenhagen, donde está el aparcamiento forestal.
      De allí parte el recorrido circular por las Heilige Hallen, de unos 6 km, para el que el municipio
      aconseja entre dos y tres horas. Los caminos son transitables a pie; el sendero estrecho que cruza el
      bosque no es apto para bicicletas.


      Antes o después, merece la pena pasar por el museo forestal Lütt Holthus, en el patio de la oficina
      forestal de Lüttenhagen. Con ejemplares disecados muestra la fauna local y dedica secciones propias a la
      haya y al pino. Tiene un órgano de olores, una caja de sonidos y una madriguera de zorro por la que se
      puede entrar. Fuera hay una carreta antigua de leñadores, una cabaña de resineros y un pequeño vivero.


      En verano hay visitas guiadas con fechas fijas, organizadas por la oficina forestal y el parque, y las
      visitas de grupo se organizan bajo petición.
    history: >-
      A mediados del siglo XIX, el gran duque Georg de Mecklenburg-Strelitz, impresionado por los árboles
      enormes como columnas, ordenó proteger este bosque. El gestor la considera, de hecho, la reserva
      forestal más antigua de Alemania, protegida desde aproximadamente 1850. El núcleo de 25 hectáreas entró
      en 1908 en la lista de monumentos naturales de Mecklenburg y es reserva natural desde el 24 de febrero
      de 1938.


      Desde aproximadamente 1950 no se explota el bosque ni se retira la madera muerta: solo se despejan los
      caminos cuando cae un árbol. En 1998 la reserva entró en el programa de investigación de bosques
      naturales de la administración forestal regional y se amplió su zona sin gestión.
    before: >-
      En las reservas naturales del parque hay que ir por los senderos señalizados. Pueden caer árboles y
      ramas, y se entra por cuenta y riesgo propios. Los perros van con correa; no se puede hacer fuego ni
      acampar. Recoger setas y bayas está permitido solo para consumo propio y fuera de las reservas, es
      decir, no aquí. El uso de drones en la reserva requiere autorización.
    around: >-
      Hay tres bosques en el atlas a poca distancia. Los [Bosques del Parque Nacional
      Müritz](/lugar/nationalpark-muritz-waldgebiete/) están a unos 4 km. Los [Bosques del Parque Natural
      Lagos de Uckermark](/lugar/uckermarkische-seen-forests/) quedan a unos 6 km. Y el [Hayedo Antiguo de
      Serrahn](/lugar/nationalpark-muritz---serrahner-buchenurald/), del Parque Nacional Müritz, está a unos
      once kilómetros.
  en:
    intro: >-
      By the mid-nineteenth century, this ancient woodland resembled the majestic nave of a Gothic cathedral:
      colossal, pillar-straight trunks rising beneath a soaring vaulted canopy of boughs. Hence its name,
      Heilige Hallen, the "Sacred Halls". Today it remains a venerable old-growth beech forest nestled in the
      Feldberger Seenlandschaft, some 3.5 km west of Feldberg and southwest of Lüttenhagen, though it no
      longer resembles a solemn hall: younger cohorts have surged between the ancient giants, and many veteran
      trees are slowly dying. Protected as a nature reserve within the Feldberger Seenlandschaft Nature Park,
      it is best experienced on foot.
    landscape: >-
      The woodland does not occupy an ordinary plain. It is anchored upon the principal end moraine of the
      Weichselian glaciation, where melting ice sheets sculpted undulating hills of glacial till, leaving
      numerous kettle holes preserved to this day. In these waterlogged depressions, termed Sölle, vernal
      ponds, kettle bogs and birch carr mires formed. Alongside majestic beech stands, the nature reserve thus
      protects fine-grained, water-filled micro-landscapes.


      The oldest beeches span from 300 to over 350 years of age, with several canopy veterans soaring beyond
      50 metres in height and exceeding a metre in trunk diameter. Beneath these ancient "Methuselahs",
      younger generations have taken root. Having attained biological senescence, numerous giants die
      naturally, and natural canopy gaps are rapidly colonized by vigorous beech saplings. The forest is
      actively transitioning from late break-up into dynamic natural regeneration, displaying high structural
      richness.
    wildlife: >-
      Biological diversity here converges upon deadwood. The profusion of standing and fallen coarse woody
      debris underpins extraordinary fungal diversity, xylobiontic saproxylic beetles and cavity-nesting
      birds.


      To observe resident wildlife across the nature park, moving in quiet reverence substantially improves
      your chances of unhurried encounters.
    visit: >-
      Access is via the road from Feldberg to Lychen, continuing past Lüttenhagen to the designated woodland
      car park. From there commences the 6 km Heilige Hallen circular trail, for which municipal guides
      recommend allocating between two and three hours. The pathways are readily walkable on foot; the narrow
      footpath cutting through the old-growth interior is unsuitable for bicycles.


      Before or after your walk, a stop at the Lütt Holthus forestry museum in the courtyard of the
      Lüttenhagen forestry office is well worthwhile. Featuring preserved wildlife specimens, it interprets
      local fauna alongside dedicated exhibits on European beech and Scots pine. It boasts an olfactory scent
      organ, an interactive sound installation and a walk-through artificial fox den. Outdoors stand a
      traditional woodcutter’s timber wagon, a historic pitch-burner’s hut and a tree nursery.


      During summer, the forestry commission and park authority organize scheduled guided walks, with custom
      group tours available upon prior request.
    history: >-
      In the mid-nineteenth century, Grand Duke Georg of Mecklenburg-Strelitz, spellbound by the soaring,
      pillar-like beeches, issued orders to preserve the grove from felling. Park managers view it as the
      oldest dedicated woodland nature reserve in Germany, protected continuously since roughly 1850. The core
      area of 25 hectares was inscribed onto the Mecklenburg natural monuments registry in 1908 and formally
      designated a nature reserve on 24 February 1938.


      Since roughly 1950 commercial logging ceased completely and coarse woody debris is never extracted:
      rangers merely clear blocked footpaths when a fallen trunk obstructs passage. In 1998 the reserve was
      incorporated into the state forest administration’s strict natural forest research programme, expanding
      its non-intervention core.
    before: >-
      Visitors to nature reserves within the park are legally required to keep to waymarked trails. Dead limbs
      and aged trees may fall unexpectedly; entering is entirely at your own risk. Dogs must be kept on
      leashes; open fires and camping are prohibited. Gathering wild mushrooms and berries is restricted to
      personal consumption outside nature reserves, meaning it is strictly prohibited here. Flying civilian
      drones within the reserve requires formal permit approval.
    around: >-
      Three significant forested destinations in the atlas lie close by. The [Müritz National Park Forest
      Areas](/lugar/nationalpark-muritz-waldgebiete/) lie roughly 4 km away. The [Uckermark Lakes Nature Park
      Woodlands](/lugar/uckermarkische-seen-forests/) sit some 6 km away. And the primeval [Serrahn Ancient
      Beech Forest](/lugar/nationalpark-muritz---serrahner-buchenurald/) within Müritz National Park is
      located about eleven kilometres distant.
  fr:
    intro: >-
      Au milieu du XIXe siècle, ce massif forestier évoquait la nef monumentale d’une cathédrale gothique :
      des fûts rectilignes et gigantesques montant vers une voûte de branches majestueuse. D’où son
      appellation, Heilige Hallen, les « saintes halles ». De nos jours, cette vieille hêtraie de la
      Feldberger Seenlandschaft, sise à environ 3,5 km à l’ouest de Feldberg et au sud-ouest de Lüttenhagen, a
      perdu son ordonnance géométrique : une jeune génération s’est insinuée entre les géants, dont beaucoup
      meurent de vieillesse. Protégée au sein du parc naturel de la Feldberger Seenlandschaft, elle s’explore
      à pied.
    landscape: >-
      Cette forêt ne repose pas sur une plaine banale. Elle couronne la moraine frontale principale de la
      glaciation weichselienne, où les glaces ont sculpté un relief ondulé de moraines et plusieurs
      dépressions de culot de glace morte parvenues intactes jusqu’à nous. Dans ces cuvettes humides, nommées
      Sölle, se sont installées des mares temporaires, des tourbières bombées et des boulaies marécageuses.
      Ainsi, aux côtés des hêtres séculaires, la réserve abrite de minuscules paysages palustres pleins de
      fraîcheur.


      Les arbres sont âgés de 300 à plus de 350 ans, certains dépassant 50 mètres de haut pour plus d’un mètre
      de diamètre au tronc. Parmi ces vénérables « Mathusalems », des recrues vigoureuses ont germé. Parvenus
      au terme de leur longévité biologique, les géants meurent naturellement et les clairières sont
      promptement recolonisées par de jeunes hêtres. Le boisement passe ainsi d’une phase de sénescence à une
      dynamique de régénération naturelle, créant une remarquable variété de textures.
    wildlife: >-
      La biodiversité s’articule ici autour du bois mort. L’abondance de troncs sénescents ou abattus favorise
      un cortège exceptionnel de champignons décomposeurs, d’insectes saproxyliques et d’oiseaux cavicoles.


      Pour surprendre la grande faune dans le parc naturel, une marche discrète et respectueuse maximise vos
      opportunités de belles observations.
    visit: >-
      On y accède par la route reliant Feldberg à Lychen, au-delà de Lüttenhagen, où se trouve le parking
      forestier. De là part la boucle pédestre des Heilige Hallen, d’environ 6 km, pour laquelle la commune
      conseille de prévoir deux à trois heures. Les sentiers sont confortablement praticables à pied ; le
      chemin étroit qui traverse le cœur du sous-bois est en revanche interdit aux bicyclettes.


      Avant ou après votre marche, une halte s’impose au musée forestier Lütt Holthus, aménagé dans la cour de
      la maison forestière de Lüttenhagen. À l’aide d’animaux naturalisés, il présente la faune régionale et
      réserve des salles entières au hêtre et au pin sylvestre. Il propose un orgue à odeurs, une boîte à sons
      de la forêt et un terrier de renard artificiel accessible. À l’extérieur sont exposés un chariot de
      bûcheron ancien, une cabane de résinier et une pépinière didactique.


      En été ont lieu des sorties accompagnées à dates fixes par les agents de l’office forestier et du parc,
      et des visites pour groupes sont organisées sur demande préalable.
    history: >-
      Au milieu du XIXe siècle, le grand-duc Georges de Mecklembourg-Strelitz, saisi d’admiration devant ces
      arbres semblables à des colonnes de temple, ordonna la mise en défens du site. Les gestionnaires
      considèrent la forêt comme la plus ancienne réserve forestière d’Allemagne, protégée sans discontinuer
      depuis environ 1850. Le cœur de 25 hectares a été classé monument naturel du Mecklembourg en 1908, avant
      d’être promu réserve naturelle le 24 février 1938.


      Depuis environ 1950, toute exploitation sylvicole a cessé et aucun bois mort n’est prélevé : on se
      contente de scier les troncs en travers des allées de promenade. En 1998, la réserve a rejoint le
      programme d’étude des forêts naturelles intégrales de l’administration forestière régionale, confortant
      son périmètre d’évolution libre.
    before: >-
      Dans les réserves du parc naturel, vous devez obligatoirement rester sur les cheminements balisés. Des
      chutes de branches mortes ou d’arbres sénescents peuvent survenir à tout moment : l’accès se fait à vos
      risques et périls. Les chiens doivent impérativement être tenus en laisse ; les feux et le camping sont
      proscrits. La cueillette des baies et des champignons est strictement prohibée au sein des réserves.
      L’usage de drones nécessite une autorisation formelle.
    around: >-
      Trois massifs forestiers remarquables du guide se situent à proximité. Les [Forêts du Parc national de
      la Müritz](/lugar/nationalpark-muritz-waldgebiete/) sont à environ 4 km. Les [Forêts du Parc naturel des
      lacs d’Uckermark](/lugar/uckermarkische-seen-forests/) se trouvent à environ 6 km. Et l’antique [Hêtraie
      de Serrahn](/lugar/nationalpark-muritz---serrahner-buchenurald/), rattachée au Parc national de la
      Müritz, se dresse à environ onze kilomètres.
  de:
    intro: >-
      Mitte des neunzehnten Jahrhunderts glich dieser Wald dem Mittelschiff einer gotischen Kathedrale:
      riesige, säulengerade Stämme, die ein hohes Astgewölbe trugen. Daher stammt der Name Heilige Hallen. Bis
      heute stockt hier ein uralter Buchenwald in der Feldberger Seenlandschaft, rund 3,5 km westlich von
      Feldberg und südwestlich von Lüttenhagen, doch er gleicht keiner geordneten Halle mehr: Zwischen den
      Baumriesen ist eine junge Generation emporgewachsen, und viele der Altbäume sterben ab. Als
      Naturschutzgebiet im Naturpark Feldberger Seenlandschaft lässt sich dieser Urwald zu Fuß erkunden.
    landscape: >-
      Der Wald stockt auf keinem gewöhnlichen Flachland. Er ruht auf der Haupthöhenendmoräne der
      Weichsel-Kaltzeit, wo das Eis ein welliges Relief aus Geschiebe und mehrere Toteiskuten hinterließ, die
      bis heute unversehrt erhalten blieben. In diesen Senken, den sogenannten Söllen, bildeten sich
      Kleingewässer, Kesselmoore und Birken-Moorwälder. Neben den urigen Buchen birgt das Schutzgebiet somit
      kleinflächige, feuchte Moorlebensräume von hohem ökologischem Wert.


      Die Altbuchen weisen ein Alter von 300 bis über 350 Jahren auf, und manche Giganten überragen 50 Meter
      Höhe bei mehr als einem Meter Stammdurchmesser. Zwischen den knorrigen „Methusalems“ keimt dichter
      Nachwuchs. Zahlreiche Riesen haben ihre biologische Altersgrenze erreicht und sterben auf natürlichem
      Weg ab; in den entstehenden Kronenlücken wachsen junge Buchen rasch empor. So wandelt sich der Wald von
      der Zerfallsphase in eine vitale Naturverjüngung mit großer Strukturvielfalt.
    wildlife: >-
      Das Tier- und Pflanzenleben dreht sich hier um das Totholz. Sein außerordentlicher Reichtum begünstigt
      eine bemerkenswerte Vielfalt an holzbewohnenden Pilzen, xylobionten Käfern und höhlenbrütenden
      Vogelarten.


      Wer im Naturpark Wildtiere beobachten möchte, steigert durch leises und rücksichtsvolles Auftreten seine
      Chancen auf unvergessliche Naturerlebnisse erheblich.
    visit: >-
      Die Anreise erfolgt über die Landstraße von Feldberg nach Lychen, hinter Lüttenhagen liegt der
      Wanderparkplatz. Von dort beginnt der rund 6 km lange Rundweg durch die Heiligen Hallen, für den die
      Gemeinde zwei bis drei Stunden empfiehlt. Die Waldwege sind gut zu Fuß passierbar; der schmale Pfad
      mitten durch den Kernbereich eignet sich nicht für Fahrräder.


      Vor oder nach der Wanderung empfiehlt sich ein Besuch des Waldmuseums Lütt Holthus im Hof des Forstamtes
      Lüttenhagen. Anhand meisterhafter Tierpräparate veranschaulicht es die heimische Fauna und widmet Buche
      und Waldkiefer eigene Ausstellungsbereiche. Es bietet eine Duftorgel, eine Wald-Klangbox und einen
      begehbaren Fuchsbau. Im Außenbereich stehen ein historischer Holzabfuhrwagen, eine Harzerhütte und ein
      kleiner Baumgarten.


      Im Sommer veranstalten Forstamt und Naturparkverwaltung regelmäßige Themenführungen; Gruppenführungen
      werden auf Anfrage organisiert.
    history: >-
      Mitte des neunzehnten Jahrhunderts stellte Großherzog Georg von Mecklenburg-Strelitz, tief beeindruckt
      von den säulenartigen Baumriesen, den Wald vor dem Holzeinschlag unter Schutz. Die Forstverwaltung
      betrachtet ihn als das älteste Waldschutzgebiet Deutschlands, geschützt seit etwa 1850. Die 25 Hektar
      große Kernzone wurde 1908 in das mecklenburgische Naturdenkmalverzeichnis eingetragen und am 24. Februar
      1938 förmlich als Naturschutzgebiet ausgewiesen.


      Seit etwa 1950 ruht jede forstliche Nutzung und es wird kein Totholz mehr entnommen: Lediglich
      umgestürzte Bäume auf den Wanderwegen werden freigesägt. Im Jahr 1998 wurde das Areal in das
      Naturwald-Forschungsprogramm der Landesforstverwaltung aufgenommen und die nutzungsfreie Zone deutlich
      erweitert.
    before: >-
      In den Naturschutzgebieten des Naturparks gilt ein striktes Wegegebot. Herabstürzende Äste und
      umstürzende morsche Bäume sind ständige Begleiter: Das Betreten erfolgt auf eigene Gefahr. Hunde sind
      stets an der Leine zu führen; offenes Feuer und Zelten sind untersagt. Das Sammeln von Pilzen und Beeren
      ist nur außerhalb von Naturschutzgebieten für den Eigenbedarf gestattet, hier also verboten.
      Drohnenflüge bedürfen einer naturschutzrechtlichen Genehmigung.
    around: >-
      Drei bedeutende Waldlandschaften liegen in Reichweite. Die [Wälder des
      Müritz-Nationalparks](/lugar/nationalpark-muritz-waldgebiete/) liegen etwa 4 km entfernt. Die [Wälder
      des Naturparks Uckermärkische Seen](/lugar/uckermarkische-seen-forests/) finden sich in rund 6 km
      Distanz. Und der urwüchsige [Buchenurwald Serrahn](/lugar/nationalpark-muritz---serrahner-buchenurald/)
      im Müritz-Nationalpark breitet sich etwa elf Kilometer entfernt aus.
  it:
    intro: >-
      A metà dell’Ottocento questo bosco evocava la navata centrale di una cattedrale: fusti colossali,
      diritti come colonne, sormontati da una cupola di rami intrecciati. Da questa suggestione deriva il nome
      Heilige Hallen, le «sale sacre». Oggi resta una faggeta monumentale nella Feldberger Seenlandschaft, a
      circa 3,5 km a ovest di Feldberg e a sud-ovest di Lüttenhagen, sebbene non ricordi più una navata
      solenne: tra i giganti sono cresciuti alberi giovani e molti esemplari veterani stanno morendo. Tutelata
      come riserva naturale nel parco naturale Feldberger Seenlandschaft, si visita camminando.
    landscape: >-
      La foresta non si erge su una pianura qualunque. Si radica sulla morena frontale principale della
      glaciazione weichseliana, dove i ghiacci hanno modellato un rilievo ondulato di depositi morenici e
      varie depressioni di ghiaccio morto rimaste intatte fino a oggi. In queste conche umide, denominate
      Sölle, si sono formati stagni, torbiere di sprofondamento e boschi paludosi di betulla. Accanto ai faggi
      secolari, la riserva custodisce minuscoli ecosistemi palustri di grande valore biologico.


      I faggi più vetusti contano da 300 a oltre 350 anni, e diversi esemplari superano i 50 metri di altezza
      e il metro di diametro al fusto. Tra questi antichi «Matusalemme» sono cresciute nuove generazioni
      arboree. Molti grandi alberi hanno raggiunto la longevità biologica massima e muoiono per cause
      naturali, lasciando varchi nella volta prontamente colonizzati da giovani faggi. La foresta transita
      così dalla fase di senescenza a una dinamica di rinnovazione naturale ricca di complessità strutturale.
    wildlife: >-
      La biodiversità ruota per intero attorno al legno morto. L’abbondanza di tronchi caduti o deperienti
      sostiene una straordinaria ricchezza di funghi lignicoli, coleotteri saproxilici e uccelli che
      nidificano nelle cavità arboree.


      Se desideri osservare la fauna selvatica nel parco naturale, muoverti in silenzio e con discrezione
      aumenta notevolmente le probabilità di avvistamento.
    visit: >-
      Si arriva percorrendo la provinciale tra Feldberg e Lychen, superando Lüttenhagen dove sorge il
      parcheggio forestale. Da lì prende avvio l’anello escursionistico delle Heilige Hallen, lungo circa 6
      km, per il quale il comune consiglia di mettere in conto tra due e tre ore. I sentieri sono agevoli a
      piedi; la traccia stretta che penetra nella foresta vergine non è percorribile in bicicletta.


      Prima o dopo la passeggiata merita una sosta il museo forestale Lütt Holthus, allestito nella corte
      della stazione forestale di Lüttenhagen. Attraverso animali tassidermizzati illustra la fauna locale
      dedicando ampie sale al faggio e al pino silvestre. Dispone di un organo degli odori, un dispositivo
      acustico e una tana di volpe artificiale in cui ci si può infilare. All’esterno sono visibili un antico
      carro da boscaiolo, un capanno da resinatore e un vivaio didattico.


      In estate l’ufficio forestale e l’ente parco promuovono escursioni guidate a date fisse, mentre le
      visite per comitive vengono organizzate su richiesta.
    history: >-
      A metà del XIX secolo il granduca Giorgio di Meclemburgo-Strelitz, affascinato da questi faggi maestosi
      simili a colonne di pietra, dispose la salvaguardia integrale del bosco. L’ente gestore la considera la
      riserva forestale più antica della Germania, tutelata fin dal 1850 circa. Il settore nucleare di 25
      ettari entrò nel registro dei monumenti naturali del Meclemburgo nel 1908 ed è riserva naturale dal 24
      febbraio 1938.


      Dal 1950 circa non si pratica alcun taglio commerciale né si asporta legno marcescente: gli operai
      intervengono solo per liberare i sentieri dai tronchi schiantati. Nel 1998 la riserva è stata integrata
      nel programma di monitoraggio delle foreste naturali dell’amministrazione forestale regionale, ampliando
      la zona a evoluzione spontanea.
    before: >-
      Nelle riserve del parco vige l’obbligo di rimanere sui sentieri tracciati. Rami secchi e piante deperite
      possono cadere improvvisamente: l’accesso avviene a proprio rischio. I cani devono essere tenuti al
      guinzaglio; è vietato accendere fuochi e campeggiare. La raccolta di funghi e frutti di bosco è
      consentita solo per uso personale all’esterno delle riserve, risultando quindi qui interdetta. L’impiego
      di droni richiede specifica autorizzazione.
    around: >-
      Tre importanti foreste del repertorio sorgono nelle vicinanze. I [Boschi del Parco Nazionale
      Müritz](/lugar/nationalpark-muritz-waldgebiete/) distano circa 4 km. I [Boschi del Parco Naturale dei
      Laghi dell’Uckermark](/lugar/uckermarkische-seen-forests/) si trovano a circa 6 km. E la vetusta
      [Faggeta di Serrahn](/lugar/nationalpark-muritz---serrahner-buchenurald/), compresa nel Parco Nazionale
      Müritz, sorge a circa undici chilometri.
  pt:
    intro: >-
      Em meados do século XIX, este bosque evocava a nave imponente de uma catedral gótica: troncos colossais,
      aprumados como pilares, sustentando no alto uma cúpula frondosa de ramos. Daí a designação Heilige
      Hallen, as «salas sagradas». Hoje mantém-se como um faial secular na Feldberger Seenlandschaft, cerca de
      3,5 km a oeste de Feldberg e a sudoeste de Lüttenhagen, embora já não ostente a feição de uma nave
      uniforme: entre os velhos gigantes medraram árvores jovens e muitos exemplares veneráveis estão a
      fenecer. Protegido como reserva natural no Parque Natural Feldberger Seenlandschaft, visita-se a pé.
    landscape: >-
      O arvoredo não assenta numa planície qualquer. Enraíza-se na moreia terminal principal da glaciação de
      Weichsel, onde o degelo talhou um relevo ondulado de moreias e várias bacias de gelo morto perfeitamente
      preservadas. Nessas depressões, denominadas Sölle, formaram-se lagoas efémeras, turfeiras de bacia e
      bétulas palustres. A par dos faiais imponentes, a reserva abriga assim pequenas paisagens húmidas de
      elevado valor botânico.


      As faias mais antigas têm entre 300 e mais de 350 anos, atingindo algumas mais de 50 metros de altura e
      ultrapassando um metro de diâmetro de tronco. Entre estes vetustos «Matusaléns» despontaram novas
      gerações. Tendo atingido o limite biológico da idade, muitos exemplares morrem naturalmente e as
      clareiras resultantes são de imediato povoadas por faias jovens. O ecossistema transita assim da fase de
      senescência para uma regeneração natural pujante, com notável heterogeneidade estrutural.
    wildlife: >-
      A biodiversidade do sítio orbita em torno da madeira morta. A profusão de troncos em decomposição
      sustenta uma enorme riqueza de fungos lenhocícolas, escaravelhos saproxílicos e aves que nidificam em
      cavidades arbóreas.


      Se procuras observar fauna no parque natural, deslocar-te em silêncio e com postura discreta incrementa
      consideravelmente a probabilidade de avistamentos.
    visit: >-
      O acesso faz-se pela estrada entre Feldberg e Lychen, ultrapassando Lüttenhagen até ao parque de
      estacionamento florestal. Dali arranca o circuito pedestre de Heilige Hallen, com cerca de 6 km, para o
      qual a autarquia recomenda prever entre duas e três horas. Os caminhos fazem-se bem a pé; a vereda
      estreita que atravessa a mata não permite a circulação em bicicleta.


      Antes ou depois da caminhada vale a pena visitar o museu florestal Lütt Holthus, instalado no pátio dos
      serviços florestais de Lüttenhagen. Recorrendo a animais naturalizados, exibe a fauna autóctone
      dedicando núcleos próprios à faia e ao pinheiro-silvestre. Dispõe de um órgão de fragrâncias, uma caixa
      de sons da floresta e uma toca de raposa acessível aos visitantes. No exterior podem observar-se uma
      antiga carroça de lenhadores, uma cabana de resineiros e um viveiro florestal pedagógico.


      No verão realizam-se visitas guiadas com datas programadas pelos serviços florestais e pelo parque
      natural, agendando-se visitas de grupo mediante solicitação.
    history: >-
      Em meados do século XIX, o grão-duque Jorge de Mecklemburgo-Strelitz, maravilhado com o porte das
      árvores que se assemelhavam a colunas, determinou a proteção estrita deste bosque. A administração
      florestal considera-a, de resto, a reserva florestal mais antiga da Alemanha, protegida desde cerca de
      1850. O núcleo primordial de 25 hectares ingressou em 1908 no inventário de monumentos naturais de
      Mecklemburgo e foi homologado como reserva natural a 24 de fevereiro de 1938.


      Desde aproximadamente 1950 não se procede a cortes comerciais nem se remove madeira morta: apenas se
      desobstruem os trilhos quando tomba um tronco sobre a passagem. Em 1998 a reserva foi integrada no
      programa de investigação de florestas naturais da administração florestal regional, dilatando-se a zona
      de conservação integral.
    before: >-
      Nas reservas do parque natural é obrigatório permanecer nas veredas assinaladas. A queda espontânea de
      ramos e troncos carcomidos constitui um perigo real: o acesso decorre por conta e risco próprios. Os
      cães devem circular sempre com trela; é interdito foguear e acampar. A apanha de cogumelos e bagas só é
      permitida fora das reservas para consumo próprio, sendo aqui expressamente proibida. O voo de drones
      requer autorização administrativa.
    around: >-
      Existem três florestas do guia a curta distância. As [Florestas do Parque Nacional de
      Müritz](/lugar/nationalpark-muritz-waldgebiete/) situam-se a cerca de 4 km. As [Florestas do Parque
      Natural dos Lagos de Uckermark](/lugar/uckermarkische-seen-forests/) distam cerca de 6 km. E o milenar
      [Faial de Serrahn](/lugar/nationalpark-muritz---serrahner-buchenurald/), integrado no Parque Nacional de
      Müritz, ergue-se a cerca de onze quilómetros.
