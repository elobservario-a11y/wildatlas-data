resumen:
  es: Vasta masa forestal de pino y abeto con una red de lagos de origen glaciar conectada con Bielorrusia.
  en: Vast pine and spruce forest with a network of glacial ribbon lakes extending into Belarus.
  fr: Vaste massif de pins et d’épicéas parsemé de lacs d’origine glaciaire en continuité avec la Biélorussie.
  de: Riesiges Waldmassiv aus Kiefern und Fichten mit einem eiszeitlichen Rinnenseensystem bis nach Belarus.
  it: >-
    Vasta massa forestale di pini e abeti rossi con un sistema di laghi glaciali a nastro estesa fino alla
    Bielorussia.
  pt: >-
    Vasta massa florestal de pinheiro e espruce com uma rede de lagos de origem glaciar contígua à
    Bielorrússia.
unico:
  es: Un bosque de pinos y lagos que se prolonga sin cortes hasta Bielorrusia.
  en: A boundless taiga-like expanse of pines, bogs, and ribbon lakes extending unbroken into Belarus.
  fr: Un océan boréal ininterrompu de pins et de lacs glaciaires se prolongeant d’un seul tenant en Biélorussie.
  de: Ein zusammenhängender Kiefern- und Seengürtel, der sich ohne Unterbrechung bis nach Belarus erstreckt.
  it: Un oceano boreale di pini e laghi glaciali che prosegue senza cesure verso la Bielorussia.
  pt: >-
    Uma imensidão boreal contínua de pinhais e lagos glaciares que se prolonga sem barreiras até à
    Bielorrússia.
observaciones:
  es: >-
    La mejor época es de mayo a octubre. En bosques maduros como Kozi Rynek no entres cuando haya vientos
    fuertes o lluvias: pueden ser peligrosos.
texto:
  es:
    intro: >-
      Cuando el hielo se retiró, el inlandsis escandinavo dejó una llanura de arena, cubetas alargadas que se
      llenaron de agua y, poco a poco, un bosque. Hoy la Puszcza Augustowska reúne unas ciento sesenta mil
      hectáreas, más de ciento catorce mil de ellas en Polonia, y sigue hacia Bielorrusia. Es un mar de pinos
      y píceas salpicado de lagos, con una historia humana que empieza con los yotvingios y llega hasta los
      colmeneros del rey.
    landscape: >-
      El relieve, los suelos y las aguas del bosque los moldeó el inlandsis escandinavo, sobre todo en la
      última glaciación. De ahí sale la mayor parte del terreno: la llanura de arenas glaciares, el sandur de
      Augustów, sobre la que crecen los pinares. Lo cruza la divisoria entre las cuencas del Vístula (cerca
      del 40 %) y del Niemen (cerca del 60 %).


      Los pinos mandan: cubren el 85 % del bosque, con más del 70 % de pino, incluido el valioso pino de
      Augustów, y un 17 % de pícea. Mezclados aparecen abedules, arces, carpes, tilos, fresnos y alisos, y
      algunos rodales superan los 120 años, con árboles de entre 30 y 40 m. También hay alisedas encharcadas,
      sobre todo en el sur, y robledales-carpinares en algunos puntos. El clima duro conservó reliquias
      boreales: abedul bajo, tejo, arándano de turbera, linnea y droseras. Entre las plantas protegidas
      figuran Daphne mezereum, el lirio martagón, las pulsatillas, los licopodios y el tejo.
    wildlife: >-
      Se han registrado más de dos mil especies animales, la mayoría insectos, y viven casi todos los anfibios
      y reptiles del país y más de treinta especies de peces. Entre los mamíferos están el
      [lobo](/especie/canis_lupus/), el [lince](/especie/lynx_lynx/), el tejón, el ciervo, el
      [alce](/especie/alces_alces/), el corzo, el [castor](/especie/castor_fiber/) y la
      [nutria](/especie/lutra_lutra/). En el pasado vivieron aquí uros, bisontes, osos y glotones. Los
      bisontes han vuelto: en 2017 llegaron los cuatro primeros desde la Puszcza Borecka y en 2018 otros dos.


      Hasta 2011 se habían registrado 215 especies de aves. Entre las residentes forestales hay pigargo, azor,
      grévol, [urogallo](/especie/tetrao_urogallus/), cárabo común y varios pitos; entre las migratorias, el
      [águila pomerana](/especie/aquila_pomarina/), el halcón abejero, el milano negro, el milano real y la
      [cigüeña negra](/especie/ciconia_nigra/). En los lagos crían el avetoro, la garza real, el somormujo
      lavanco, el cisne vulgar y el cormorán. Entre los insectos destacan las mariposas y las libélulas, con
      varias especies protegidas.


      Para verlo, elige bien la época. De Pascua a principios de junio, y a comienzos del otoño, son las
      mejores: temperaturas buenas para andar, sin insectos molestos y con el sotobosque en flor.
    visit: >-
      Empieza por lo fácil. La senda Pomniki Przyrody, de tres kilómetros, sale y termina en Białobrzegi,
      junto al aparcamiento de la carretera a Dębowo, y se hace a pie o en bici. Junto a ella hay un grupo de
      alerces monumentales y el pino más grueso del bosque. En Studzieniczna, la senda hasta el monumento a
      los Forestales atraviesa una pasarela sobre los juncos del lago, con una plataforma desde la que mirar
      las aves acuáticas y fortificaciones de campaña reconstruidas de las últimas guerras.


      Para sentir el bosque antiguo, ve a la reserva de Kozi Rynek. Su sendero mide 1,8 km, arranca en el
      aparcamiento forestal y tiene paneles informativos. Los robles y fresnos viejos y la madera muerta dan
      sensación de bosque primigenio.


      Si prefieres rodar o caminar más, el tramo forestal del Szlak Papieski supera los veinte kilómetros. El
      Szlak Orła Białego mide unos 80 km y puede dividirse en tramos más cortos mediante enlaces; un bucle
      corto desde Lipowiec, junto al lago Biały, tiene 12 km y pasa por estaciones con paneles informativos.
      En el norte del bosque está el Parque Nacional de Wigry, con el lago Wigry y los bosques que lo rodean.
      Y hay senderos para ir en kayak.


      Los forestales de Augustów ofrecen guías educadores para grupos y varias sendas didácticas.
    history: >-
      Hasta el siglo XIII vivieron aquí los yotvingios; el bosque no se repobló hasta el siglo XV. Después se
      talaban árboles que se flotaban por los ríos hasta los puertos del Báltico, y se hacía brea, potasa y
      carbón vegetal. Los colmeneros que cuidaban las colmenas reales dieron origen a las aldeas de Bartniki y
      Rakowicze. En la reserva de Kozi Rynek hay tumbas de insurgentes caídos en una batalla de 1863.


      En 1986 una decisión ministerial fijó las reglas de gestión forestal del bosque, conocidas como el
      Estatuto del Bosque. Hoy hay trece reservas naturales en sus zonas más valiosas y 34 monumentos
      naturales en el distrito de Augustów, entre árboles sueltos y grupos de árboles. El distrito forestal
      mantiene trece zonas de protección de aves, de 835,67 hectáreas en total, para la cigüeña negra, el
      urogallo, el águila pomerana, el pigargo, el búho real y el mochuelo chico. Un espacio de la red europea
      Natura de 107068,70 ha cubre casi toda la parte polaca.
    before: >-
      La mejor época es de mayo a octubre. En bosques maduros como Kozi Rynek no entres cuando haya vientos
      fuertes o lluvias: pueden ser peligrosos.
    around: >-
      A cinco kilómetros queda el [Parque Nacional de Biebrza](/lugar/biebrzanski-park-narodowy/), el vecino
      más cercano del bosque en el atlas.
  en:
    intro: >-
      When the continental ice sheets retreated, the Scandinavian glacier left behind sandy outwash plains,
      ribbon troughs that filled with water, and gradually a continuous wild forest. Today Puszcza Augustowska
      spans some one hundred and sixty thousand hectares, over one hundred and fourteen thousand of which lie
      within Poland, extending seamlessly across the border into Belarus. It forms an ocean of Scots pine and
      Norway spruce dotted with glacial lakes, steeped in human history from early Yotvingian tribes to royal
      tree-beekeepers.
    landscape: >-
      The landforms, soils, and hydrology were moulded by the Scandinavian glacier during the final
      Weichselian glaciation. The vast majority of the terrain is a flat glacial outwash plain, the Augustów
      sandur, providing the sandy substrate favored by pine forests. The European watershed traverses the
      forest, dividing runoff between the Vistula basin (roughly 40%) and the Neman basin (roughly 60%).


      Conifers dominate the landscape: they carpet 85% of the woodland area, with pine accounting for over
      70%—including the famed, straight-trunked Augustów ecotype—and spruce comprising 17%. Mixed broadleaves
      include birch, Norway maple, hornbeam, linden, ash, and black alder; veteran stands exceed 120 years of
      age, with towering canopies reaching between 30 and 40 m in height. Waterlogged alder carr forests
      thrive in southern depressions, flanked by oak-hornbeam groves. The boreal climate preserves glacial
      relicts: dwarf birch, English yew, bog bilberry, twinflower, and sundews. Protected flora includes
      *Daphne mezereum*, martagon lily, pasqueflowers, and clubmosses.
    wildlife: >-
      More than two thousand animal species have been documented, mostly invertebrates, alongside nearly all
      Polish native amphibians, reptiles, and over thirty species of freshwater fish. Mammals include the
      [grey wolf](/especie/canis_lupus/), [Eurasian lynx](/especie/lynx_lynx/), European badger, red deer,
      [moose](/especie/alces_alces/), roe deer, [Eurasian beaver](/especie/castor_fiber/), and [Eurasian
      otter](/especie/lutra_lutra/). European bison have returned: in 2017 four pioneering animals arrived
      from Puszcza Borecka, joined in 2018 by two more.


      Surveys up to 2011 documented 215 bird species. Resident forest birds include white-tailed eagles,
      northern goshawks, hazel grouse, [western capercaillies](/especie/tetrao_urogallus/), tawny owls, and
      numerous woodpeckers; seasonal migrants feature the [lesser spotted eagle](/especie/aquila_pomarina/),
      European honey-buzzard, black kite, red kite, and [black stork](/especie/ciconia_nigra/). Lakes shelter
      breeding Eurasian bitterns, grey herons, great crested grebes, mute swans, and great cormorants. Rare
      dragonflies and butterflies thrive in peatlands.


      Ideal visiting windows are from Easter to early June and early autumn: pleasant walking temperatures,
      few biting insects, and vibrant woodland flora.
    visit: >-
      Start with an easy walk. The Pomniki Przyrody trail covers three kilometres, beginning and ending in
      Białobrzegi near the roadside car park towards Dębowo, suitable on foot or by bicycle, passing
      monumental larches and the forest’s thickest Scots pine. In Studzieniczna, the trail to the Foresters’
      Monument follows a wooden boardwalk over lake reedbeds, featuring an observation platform overlooking
      waterbirds and field fortifications preserved from past conflicts.


      To experience old-growth primeval conditions, head to the Kozi Rynek Nature Reserve. Its nature trail
      measures 1.8 km, starting at the forest car park with educational boards. Towering ancient oaks, ashes,
      and moss-draped coarse woody debris impart the atmosphere of an untouched primeval forest.


      For longer adventures, the forested section of the Papal Trail exceeds twenty kilometres. The Szlak Orła
      Białego spans some 80 km and can be divided into modular stages; a short loop from Lipowiec by Lake
      Biały covers 12 km with educational stations. The northern margin connects to Wigry National Park,
      centered on Lake Wigry. Waterborne canoe and kayak routes weave through connected channels.


      Augustów foresters provide certified guides for groups and manage multiple themed educational trails.
    history: >-
      Until the XIII century the forest was inhabited by Baltic Yotvingians; permanent recolonization only
      began in the XV century. Timber extraction saw felled logs rafted down rivers to Baltic ports, alongside
      traditional tar kilns, potash works, and charcoal pits. Traditional wild beekeepers tending royal
      hive-trees founded the historic villages of Bartniki and Rakowicze. In Kozi Rynek reserve stand the mass
      graves of Polish insurgents killed during an 1863 battle against Tsarist forces.


      In 1986, official ministerial regulations established the Forest Statute for sustainable management.
      Today thirteen nature reserves safeguard core ecosystems and 34 natural monuments protect veteran trees
      across the Augustów district. Forestry authorities maintain thirteen designated bird protection zones
      covering 835.67 hectares for black storks, capercaillies, lesser spotted eagles, and owls. A European
      Natura site spanning 107068.70 ha covers nearly the entire Polish portion.
    before: >-
      The prime season runs from May through October. Avoid entering veteran old-growth reserves like Kozi
      Rynek during high winds or heavy gales due to the danger of falling snags.
    around: >-
      Five kilometres away lies [Biebrza National Park](/lugar/biebrzanski-park-narodowy/), the forest’s
      closest ecological neighbour in the atlas.
  fr:
    intro: >-
      Au retrait des grands glaciers scandinaves est restée une vaste plaine d’épandage sableuse, des auges
      glaciaires devenues lacs et, peu à peu, une forêt sauvage. Aujourd’hui, la Puszcza Augustowska rassemble
      environ cent soixante mille hectares, dont plus de cent quatorze mille en Pologne, poursuivant sa course
      en Biélorussie. C’est un océan de pins et d’épicéas émaillé d’eaux calmes, habité dès les Yotvingiens et
      façonné par les apiculteurs d’arbres du roi.
    landscape: >-
      Le relief, les sols et le réseau hydrographique ont été sculptés par l’inlandsis scandinave lors de la
      dernière glaciation. La majeure partie du paysage est un sandur fluvioglaciaire sableux où s’enracinent
      les pinèdes. Le massif est traversé par la ligne de partage des eaux entre le bassin de la Vistule
      (environ 40 %) et celui du Niémen (environ 60 %).


      Le pin règne en maître : il couvre 85 % de la surface forestière, avec plus de 70 % de pin
      sylvestre—dont le célèbre pin d’Augustów—et 17 % d’épicéa. S’y mêlent bouleaux, érables, charmes,
      tilleuls, frênes et aulnes ; certaines parcelles dépassent 120 ans avec des arbres élancés de 30 à 40 m
      de haut. Les dépressions humides portent des aulnaies marécageuses. Le climat boréal rude conserve des
      reliques glaciaires : bouleau nain, if, myrtille des marais, linnée boréale et droséras. Parmi la flore
      protégée figurent le daphné bois-joli, le lis martagon et les lycopodes.
    wildlife: >-
      Plus de deux mille espèces animales y sont recensées, principalement des invertébrés, avec la
      quasi-totalité des amphibiens et reptiles polonais et plus de trente espèces de poissons. Les mammifères
      comptent le [loup gris](/especie/canis_lupus/), le [lynx boréal](/especie/lynx_lynx/), le blaireau, le
      cerf, [l’élan](/especie/alces_alces/), le chevreuil, le [castor d’Europe](/especie/castor_fiber/) et la
      [loutre d’Europe](/especie/lutra_lutra/). Le bison d’Europe y est réapparu : en 2017 sont arrivés quatre
      premiers pionniers de la forêt de Borecka, suivis en 2018 par deux autres.


      Jusqu’en 2011 avaient été recensées 215 espèces d’oiseaux. Les nicheurs forestiers comptent le pygargue,
      l’autour des palombes, la gélinotte, le [grand tétras](/especie/tetrao_urogallus/), la chouette hulotte
      et divers pics ; les migrateurs incluent [l’aigle pomarin](/especie/aquila_pomarina/), la bondrée
      apivore, les milans noir et royal et la [cigogne noire](/especie/ciconia_nigra/). Sur les lacs nichent
      butor étoilé, héron cendré, grèbe huppé, cygne tuberculé et cormoran.


      Les périodes les plus favorables vont de Pâques à début juin et au début de l’automne : températures
      agréables pour marcher, absence d’insectes piqueurs et sous-bois fleuri.
    visit: >-
      Commencez par une promenade facile. Le sentier Pomniki Przyrody fait trois kilomètres au départ de
      Białobrzegi sur la route de Dębowo, praticable à pied ou à vélo le long de mélèzes monumentaux et du
      plus vieux pin du massif. À Studzieniczna, une passerelle sur les roseaux mène à un observatoire
      ornithologique et à des tranchées historiques.


      Pour goûter à la forêt primaire, rendez-vous dans la réserve de Kozi Rynek. Son sentier didactique de
      1,8 km part du parking forestier : vieux chênes, frênes vénérables et bois mort au sol restituent
      l’ambiance d’un sanctuaire vierge.


      Pour de plus longues randonnées, la section forestière du Szlak Papieski dépasse vingt kilomètres. Le
      Szlak Orła Białego s’étend sur environ 80 km modulables ; une boucle balisée au départ de Lipowiec près
      du lac Biały totalise 12 km avec panneaux thématiques. Au nord s’étend le parc national de Wigry autour
      du lac éponyme. Des voies navigables se prêtent au kayak.


      Les forestiers d’Augustów organisent des sorties accompagnées et entretiennent plusieurs sentiers
      thématiques.
    history: >-
      Peuplée jusqu’au XIIIe siècle par les Yotvingiens, la forêt ne connut une recolonisation permanente
      qu’au XVe siècle. Le bois flotté descendait les cours d’eau vers les ports baltes, à côté de la poix et
      du charbonnage. Les apiculteurs soignant les ruches sauvages royales fondèrent les villages de Bartniki
      et Rakowicze. À Kozi Rynek reposent des insurgés polonais tombés lors d’un combat en 1863.


      En 1986, un statut ministériel fixa la charte de gestion durable du massif. Aujourd’hui, treize réserves
      protègent les biotopes rares et 34 monuments naturels distinguent des arbres remarquables. Les
      forestiers maintiennent treize zones de quiétude de 835,67 hectares pour la cigogne noire, le grand
      tétras et les rapaces. Un site du réseau européen Natura de 107068,70 ha couvre la quasi-totalité du
      massif polonais.
    before: >-
      La meilleure saison s’étend de mai à octobre. Dans les réserves de vieux bois comme Kozi Rynek, évitez
      d’entrer par grand vent en raison du risque de chute de branches.
    around: >-
      À cinq kilomètres s’étend le [parc national de la Biebrza](/lugar/biebrzanski-park-narodowy/), le plus
      proche voisin du massif dans l’atlas.
  de:
    intro: >-
      Als die Gletscher zurückwichen, hinterließ das skandinavische Inlandeis weite Sanderflächen,
      langgestreckte Rinnen, die sich mit Wasser füllten, und allmählich einen Urwald. Heute umfasst die
      Puszcza Augustowska rund einhundertsechzigtausend Hektar, davon über einhundertvierzehntausend in Polen,
      und setzt sich jenseits der Grenze in Belarus fort. Sie ist ein Meer aus Kiefern und Fichten voller
      Seen, geprägt von einer Siedlungsgeschichte, die von den Jatwingern bis zu königlichen Beutnern reicht.
    landscape: >-
      Relief, Böden und Gewässernetz wurden vom skandinavischen Inlandeis während der letzten Kaltzeit
      geformt. Der Großteil des Geländes ist eine weite fluvioglaziale Sanderebene, der Augustów-Sander, auf
      dem lichte Kiefernwälder stocken. Durch das Waldgebiet verläuft die europäische Hauptwasserscheide
      zwischen der Weichsel (rund 40 %) und der Memel (rund 60 %).


      Kiefern dominieren das Bild: Sie bedecken 85 % der Waldfläche, mit über 70 % Waldkiefer—darunter der
      wertvolle Augustów-Ökotyp—und 17 % Gemeiner Fichte. Eingestreut wachsen Birken, Ahorne, Hainbuchen,
      Linden, Eschen und Erlen; manche Bestände sind über 120 Jahre alt mit 30 bis 40 m hohen Wipfeln. In
      feuchten Senken gedeihen Erlenbruchwälder. Das boreale Klima bewahrte Eiszeitrelikte: Zwergbirke, Eibe,
      Moosbeere, Moosglöckchen und Sonnentau. Geschützt sind Seidelbast, Türkenbund-Lilie, Küchenschellen und
      Bärlappe.
    wildlife: >-
      Über zweitausend Tierarten wurden erfasst, überwiegend Insekten, dazu fast alle Amphibien- und
      Reptilienarten Polens und über dreißig Fischarten. Bei den Säugetieren leben
      [Wolf](/especie/canis_lupus/), [Eurasischer Luchs](/especie/lynx_lynx/), Dachs, Rothirsch,
      [Elch](/especie/alces_alces/), Reh, [Europäischer Biber](/especie/castor_fiber/) und
      [Fischotter](/especie/lutra_lutra/). Der Wisent ist zurückgekehrt: 2017 wanderten vier Tiere aus der
      Puszcza Borecka ein, 2018 folgten zwei weitere.


      Bis 2011 wurden 215 Vogelarten festgestellt. Unter den Brutvögeln finden sich Seeadler, Habicht,
      Haselhuhn, [Auerhuhn](/especie/tetrao_urogallus/), Waldkauz und Spechte; auf dem Durchzug rasten
      [Schreiadler](/especie/aquila_pomarina/), Wespenbussard, Schwarz- und Rotmilan sowie der
      [Schwarzstorch](/especie/ciconia_nigra/). An den Seen brüten Rohrdommel, Graureiher, Haubentaucher,
      Höckerschwan und Kormoran.


      Die beste Reisezeit reicht von Ostern bis Anfang Juni sowie im Frühherbst: milde Wandertemperaturen,
      wenig Insekten und blühender Waldboden.
    visit: >-
      Ein einfacher Einstieg ist der drei Kilometer lange Lehrpfad Pomniki Przyrody ab Białobrzegi an der
      Straße nach Dębowo, zu Fuß oder per Rad passierbar, vorbei an Riesenlärchen und der mächtigsten Kiefer
      des Forsts. In Studzieniczna führt ein Holzsteg über das Schilf zu einer Aussichtsplattform für
      Wasservögel und historischen Feldbefestigungen.


      Urwaldatmosphäre erlebst du im Reservat Kozi Rynek. Der 1,8 km lange Lehrpfad beginnt am Waldparkplatz:
      Alte Eichen, Eschen und moderndes Totholz vermitteln das Gefühl unberührter Natur.


      Für längere Touren bietet sich der waldreiche Papstweg über zwanzig Kilometer an. Der Szlak Orła Białego
      misst rund 80 km und lässt sich in Etappen wandern; eine 12 km lange Rundtour ab Lipowiec am Biały-See
      erschließt Schautafeln. Im Norden schließt der Nationalpark Wigry an. Zahlreiche Wasserwege laden zu
      Kanutouren ein.


      Das Forstamt Augustów bietet Führungen und Lehrpfade an.
    history: >-
      Bis ins XIII. Jahrhundert lebten hier Jatwinger; eine feste Wiederbesiedlung begann erst im XV.
      Jahrhundert. Geschlagenes Holz wurde über die Flüsse zu den Ostseehäfen geflößt, Teeröfen und
      Pottaschesiedereien rauchten im Forst. Die königlichen Beutner begründeten die Dörfer Bartniki und
      Rakowicze. Im Reservat Kozi Rynek liegen Gräber polnischer Aufständischer aus einer Schlacht von 1863.


      Im Jahr 1986 legte ein ministerieller Erlass die Bewirtschaftungsregeln fest. Heute schützen dreizehn
      Naturschutzgebiete Kernzonen und 34 Naturdenkmale altehrwürdige Baumgruppen im Forstamt Augustów.
      Dreizehn Vogelschutzzonen umfassen 835,67 Hektar für Schwarzstorch, Auerhuhn und Schreiadler. Ein
      europäisches Natura-Gebiet von 107068,70 ha bedeckt fast den gesamten polnischen Waldanteil.
    before: >-
      Die beste Zeit reicht von Mai bis Oktober. Betritt alte Waldbestände wie Kozi Rynek bei Sturm oder
      Starkregen wegen Astbruchgefahr nicht.
    around: >-
      Fünf Kilometer entfernt liegt der [Biebrza-Nationalpark](/lugar/biebrzanski-park-narodowy/), der engste
      ökologische Nachbar im Atlas.
  it:
    intro: >-
      Al ritirarsi dei ghiacci quaternari, l’inlandsis scandinavo lasciò pianure sabbiose d’oltraggio
      glaciale, fosse allungate colme d’acqua e, a poco a poco, una foresta fittissima. Oggi la Puszcza
      Augustowska raccoglie circa centosessantamila ettari, di cui oltre centoquattordicimila in Polonia,
      prolungandosi oltreconfine in Bielorussia. È una distesa di pini e abeti costellata di specchi lacustri,
      con radici storiche che dai Balti Jatvingi arrivano agli apicoltori degli alberi del re.
    landscape: >-
      Morfologia, suoli e acque vennero plasmati dall’inlandsis scandinavo durante l’ultima glaciazione. La
      maggior parte del territorio è formata da un sandur alluvionale sabbioso su cui poggiano le pinete. Il
      massiccio è attraversato dallo spartiacque tra i bacini della Vistola (circa il 40%) e del Nemunas
      (circa il 60%).


      I pini dominano incontrastati: coprono l’85% della foresta, con oltre il 70% di pino silvestre—incluso
      il pregiato ecotipo di Augustów—e il 17% di abete rosso. A essi si mescolano betulle, aceri, carpini,
      tigli, frassini e ontani; alcuni popolamenti superano i 120 anni con alberi alti tra 30 e 40 m. Nelle
      bassure allagificate allignano ontanete palustri. Il rigido clima continentale ha preservato relitti
      boreali: betulla nana, tasso, mirtillo di palude, linnea e drosere. Tra le piante protette figurano il
      fior di stecco, il giglio martagone e i licopodi.
    wildlife: >-
      Si contano oltre duemila specie animali, soprattutto insetti, con quasi tutti gli anfibi e rettili
      polacchi e oltre trenta specie di pesci. Nei boschi dimorano il [lupo](/especie/canis_lupus/), la [lince
      eurasiatica](/especie/lynx_lynx/), il tasso, il cervo, [l’alce](/especie/alces_alces/), il capriolo, il
      [castoro europeo](/especie/castor_fiber/) e la [lontra europea](/especie/lutra_lutra/). Il bisonte
      europeo è tornato: nel 2017 sono giunti quattro capi dalla foresta di Borecka, seguiti nel 2018 da altri
      due.


      Fino al 2011 erano censite 215 specie di uccelli. Tra i nidificanti spiccano aquila di mare, astore,
      francolino di monte, [gallo cedrone](/especie/tetrao_urogallus/), allocco comune e picchi; tra i
      migratori compaiono [l’aquila anatraia minore](/especie/aquila_pomarina/), il falco pecchiaiolo, nibbi e
      la [cicogna nera](/especie/ciconia_nigra/). Sui laghi nidificano tarabuso, airone cenerino, svasso
      maggiore, cigno reale e cormorano.


      I periodi più indicati vanno da Pasqua a inizio giugno e all’inizio dell’autunno: clima ideale per
      camminare, assenza di zanzare e sottobosco in fiore.
    visit: >-
      Inizia con percorsi agevoli. Il sentiero Pomniki Przyrody misura tre chilometri, con partenza e arrivo a
      Białobrzegi sulla provinciale per Dębowo, percorribile a piedi o in bicicletta tra larici monumentali e
      il pino più imponente della foresta. A Studzieniczna una passerella sui canneti lacustri conduce a un
      punto d’osservazione per uccelli acquatici e a trincee storiche.


      Per assaporare la foresta vetusta entra nella riserva di Kozi Rynek. Il sentiero didattico è lungo 1,8
      km e parte dal parcheggio forestale: querce secolari, frassini e tronchi caduti regalano l’atmosfera di
      un bosco intatto.


      Per escursioni più estese, il tratto forestale dello Szlak Papieski supera i venti chilometri. Lo Szlak
      Orła Białego misura circa 80 km ed è frazionabile; un anello di 12 km da Lipowiec presso il lago Biały
      tocca pannelli didattici. A nord il Parco Nazionale di Wigry racchiude il lago Wigry. Lungo i canali si
      praticano escursioni in kayak.


      Il corpo forestale di Augustów organizza percorsi guidati e gestisce vari sentieri didattici.
    history: >-
      Fino al XIII secolo la foresta fu dimora degli Jatvingi; il ripopolamento stabile avvenne solo nel XV
      secolo. I tronchi venivano fluitati verso il Baltico tra forni di pece e carbonaie. Gli apicoltori reali
      fondarono i borghi di Bartniki e Rakowicze. Nella riserva di Kozi Rynek riposano patrioti caduti in una
      battaglia del 1863.


      Nel 1986 un decreto ministeriale sancì le norme dello Statuto della Foresta. Oggi tredici riserve
      naturali presidiano gli ecosistemi primari e 34 monumenti naturali tutelano alberi vetusti. Il distretto
      include tredici zone di protezione faunistica di 835,67 ettari per cicogna nera, urogallo e rapaci. Un
      comprensorio della rete europea Natura di 107068,70 ha copre quasi l’intero settore polacco.
    before: >-
      La stagione ideale va da maggio a ottobre. Nelle riserve mature come Kozi Rynek evita le escursioni in
      caso di vento forte o temporali.
    around: >-
      A cinque chilometri si estende il [Parco Nazionale della Biebrza](/lugar/biebrzanski-park-narodowy/),
      contiguo ornitologico nel territorio dell’atlas.
  pt:
    intro: >-
      Quando os mantos glaciares recuaram, o inlandsis escandinavo deixou para trás planícies arenosas de
      sandur, calhas alongadas que se encheram de água e, gradualmente, uma floresta densa. Hoje a Puszcza
      Augustowska congrega cerca de cento e sessenta mil hectares, mais de cento e catorze mil dos quais na
      Polónia, estendendo-se em direção à Bielorrússia. É um oceano de pinheiros e espruces pontuado por lagos
      serenos, com memórias que vão dos povos bálticos aos apicultores das matas reais.
    landscape: >-
      O relevo, solos e linhas de água foram talhados pelo inlandsis escandinavo durante a última glaciação. A
      maior parte do território assenta numa planície fluvioglaciar arenosa, o sandur de Augustów, onde
      vicejam os pinhais. O maciço é atravessado pela linha de separação de águas entre a bacia do Vístula
      (cerca de 40%) e a do Neman (cerca de 60%).


      Os pinheiros predominam: ocupam 85% do coberto vegetal, com mais de 70% de pinheiro-silvestre—incluindo
      a variedade nobre de Augustów—e 17% de espruce. Misturam-se bétulas, áceres, cárpinos, tílias, freixos e
      amieiros; certos povoamentos superam os 120 anos com fustes aprumados de 30 a 40 m de altura. Em
      depressões húmidas ocorrem amiais pantanosos. O clima boreal preservou relíquias glaciares: bétula-anã,
      teixo, mirtilo-dos-pauis, linneia e dróseras. A flora protegida inclui o daphne, o lírio-martagão e os
      licopódios.
    wildlife: >-
      Estão recenseadas mais de duas mil espécies animais, na sua maioria insetos, ocorrendo quase todos os
      anfíbios e répteis polacos e mais de trinta espécies de peixes. Entre os mamíferos contam-se o
      [lobo](/especie/canis_lupus/), o [lince-euroasiático](/especie/lynx_lynx/), o texugo, o veado, o
      [alce](/especie/alces_alces/), o corço, o [castor-europeu](/especie/castor_fiber/) e a
      [lontra-europeia](/especie/lutra_lutra/). O bisonte-europeu regressou: em 2017 chegaram os primeiros
      quatro pioneiros da floresta de Borecka, secundados em 2018 por outros dois.


      Até 2011 estavam documentadas 215 espécies de aves. Entre as reprodutoras figuram a águia-rabalva, o
      açor, a galinha-do-mato, o [tetraz-grande](/especie/tetrao_urogallus/), a coruja-do-mato e pica-paus; as
      migradoras incluem a [águia-pomarina](/especie/aquila_pomarina/), o bútio-vespeiro, milhafres e a
      [cegonha-preta](/especie/ciconia_nigra/). Nas lagoas procriam o abetouro, a garça-real, o
      mergulhão-de-crista, o cisne-mudo e o corvo-marinho.


      As épocas ideais decorrem da Páscoa ao início de junho e no início do outono: temperaturas amenas,
      ausência de mosquitos e flora rasteira florida.
    visit: >-
      Começa por um percurso curto. O trilho Pomniki Przyrody percorre três quilómetros com início e fim em
      Białobrzegi na estrada para Dębowo, a pé ou de bicicleta, contornando lariços monumentais e o pinheiro
      mais espesso da mata. Em Studzieniczna, um passadiço sobre o caniçal conduz a um miradouro de aves
      aquáticas e trincheiras militares históricas.


      Para conhecer a mata virgem visita a reserva de Kozi Rynek. O seu percurso interpretativo mede 1,8 km a
      partir do estacionamento florestal: carvalhos vetustos, freixos e troncos caídos evocam uma floresta
      ancestral.


      Para passeios mais longos, o troço florestal do Szlak Papieski supera vinte quilómetros. O Szlak Orła
      Białego alcança cerca de 80 km moduláveis; um anel de 12 km a partir de Lipowiec junto ao lago Biały
      oferece painéis temáticos. A norte abre-se o Parque Nacional de Wigry no lago Wigry. Diversas vias
      fluviais prestam-se a descidas de caiaque.


      Os serviços florestais de Augustów disponibilizam monitores e mantêm trilhos pedagógicos.
    history: >-
      Povoada até ao século XIII pelos jatvíngios, a floresta só conheceu fixação humana duradoura no século
      XV. A madeira descia os rios até aos portos do Báltico, operando fornos de pez e carvoarias. Os
      apicultores tradicionais das colmeias reais fundaram as aldeias de Bartniki e Rakowicze. Na reserva de
      Kozi Rynek repousam combatentes tombados numa batalha de 1863.


      Em 1986 uma portaria governamental definiu as regras do Estatuto da Floresta. Hoje treze reservas
      naturais salvaguardam áreas nobres e 34 monumentos naturais protegem arvoredo notável. O distrito mantém
      treze reservas de refúgio de aves com 835,67 hectares para a cegonha-preta, o tetraz e rapinas. Um sítio
      da rede europeia Natura de 107068,70 ha abrange quase toda a parcela polaca.
    before: >-
      A melhor época vai de maio a outubro. Em matas maduras como Kozi Rynek não entres durante temporais com
      vento forte.
    around: >-
      A cinco quilómetros situa-se o [Parque Nacional de Biebrza](/lugar/biebrzanski-park-narodowy/), vizinho
      ornitológico imediato no atlas.
