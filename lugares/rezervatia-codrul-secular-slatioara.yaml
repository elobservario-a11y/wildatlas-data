resumen:
  es: La 'Catedral de los Abetos', uno de los bosques vírgenes mixtos de abeto y haya más antiguos de Rumanía.
  en: >-
    The 'Cathedral of the Firs', one of Romania's oldest mixed primeval forests of silver fir and European
    beech.
  fr: >-
    La « Cathédrale des Sapins », l'une des plus anciennes forêts primaires mixtes de sapins et de hêtres de
    Roumanie.
  de: Die 'Kathedrale der Tannen', einer der ältesten Urwälder aus Tanne und Buche in ganz Rumänien.
  it: >-
    La 'Cattedrale degli Abeti', una delle foreste vetuste miste di abete bianco e faggio più antiche della
    Romania.
  pt: A 'Catedral dos Abetos', uma das mais antigas florestas virgens mistas de abeto-falso e faia da Roménia.
unico:
  es: Un bosque de haya, abeto y pícea que se rige por sus propias reglas, protegido desde hace más de un siglo.
  en: A beech, fir, and spruce forest governed solely by its natural rhythms, protected for more than a century.
  fr: >-
    Une forêt de hêtres, sapins et épicéas obéissant à ses seules lois naturelles, protégée depuis plus d'un
    siècle.
  de: >-
    Ein von menschlicher Hand unberührter Bergmischwald aus Buche, Tanne und Fichte, der seit über einem
    Jahrhundert geschützt ist.
  it: >-
    Un bosco di faggio, abete bianco e abete rosso governato unicamente dalle proprie leggi, protetto da oltre
    un secolo.
  pt: >-
    Um bosque de faia, abeto-falso e espruce submetido apenas às suas próprias leis naturais, protegido há
    mais de um século.
observaciones:
  es: Quédate en los senderos señalizados. Encender fuego está estrictamente prohibido en el sitio.
texto:
  es:
    intro: >-
      La tradición local lo llama «Cămara Codrilor», un lugar donde la naturaleza ofrecía frescor, quietud y
      amparo. Hoy es la Rezervația Codrul Secular Slătioara, en la vertiente oriental del macizo Rarău, en el
      término del pueblo de Slătioara, condado de Suceava. Conserva uno de los bosques mixtos de haya, abeto y
      pícea mejor preservados de los Cárpatos, y en él los árboles viejos mueren en pie y se descomponen poco
      a poco, hasta que de ese final nace el bosque siguiente.
    landscape: >-
      Hay que mirar la montaña de abajo arriba. El bosque sube de los 790 a los 1.353 metros de altitud y
      ocupa casi toda la ladera sudeste del Rarău, desde el pie de la montaña hasta las cumbres de Todirescu.
      Se extiende por tres crestas grandes y paralelas, Bâtca Neagră, Bâtca cu Plai y Bâtca Lesă, y entre
      ellas el agua hace su trabajo: los arroyos Văiuga, Valea lui Ion, Valea Ursului y Valea Ceargaului se
      unen de dos en dos y dan origen al arroyo Slătioara.


      Debajo, la geología. El territorio pertenece a una cuenca marginal mesozoica, y entre sus rocas aparecen
      la caliza y las dolomías de las klippes.


      El bosque que cubre todo esto es la mezcla de haya, abeto y pícea. Su dinámica es la del bosque que
      nadie toca: los árboles viejos se secan de pie, se descomponen despacio y preparan el lecho de las
      nuevas generaciones. Entre los árboles y arbustos figuran el serbal de cazadores (Sorbus aucuparia) y el
      arce blanco (Acer pseudoplatanus). A ras de suelo, el Ministerio informa de 451 especies de musgos sobre
      las raíces de los árboles.
    wildlife: >-
      El Ministerio documenta en la reserva al [ciervo](/especie/cervus_elaphus/), el
      [lobo](/especie/canis_lupus/) y el [lince](/especie/lynx_lynx/). La página educativa oficial añade la
      [marta](/especie/martes_martes/) y el tejón entre los animales del bosque, y entre las aves se cita el
      [urogallo](/especie/tetrao_urogallus/).


      La ficha educativa oficial dice que el bosque se puede visitar en cualquier estación del año. No hay
      calendario de observación; lo que hay es un bosque que cambia con las estaciones, con la misma dinámica
      de siempre.
    visit: >-
      Las normas obligan a usar únicamente los senderos turísticos señalizados. El acceso senderista de la
      ficha educativa sigue una cruz azul, y hay paneles, flechas indicadoras y marcajes que ayudan a no
      perderse.


      Slătioara es, en realidad, la puerta de entrada: la reserva está en el territorio del pueblo del mismo
      nombre.
    history: >-
      La protección tiene una larga historia. La reserva figura en la Ley 5/2000 con el número 2.723, se
      declaró reserva forestal en 1941, y en 1955 el bosque fue reorganizado. En 2007 entró en Natura 2000,
      dentro del sitio de importancia comunitaria Rarău-Giumalău y de la zona de protección especial para aves
      de los montes Rarău-Giumalău, y en 2017 la UNESCO lo inscribió en el Patrimonio Mundial. La zona UNESCO
      ocupa 609,12 hectáreas, y su zona de amortiguamiento otras 429,43.


      Tiene protección integral: dentro de la reserva está prohibido cualquier aprovechamiento de madera u
      otros productos. La UNESCO describe el conjunto de componentes del bien como una reserva genética del
      haya, y exige para todos una gestión estricta sin intervención. Las amenazas principales del bien serial
      son la tala y la fragmentación del hábitat.
    before: Quédate en los senderos señalizados. Encender fuego está estrictamente prohibido en el sitio.
    around: >-
      Cerca están la [Rezervația Codrul Secular Giumalău - Izvorul
      Alb](/lugar/rezervatia-codrul-secular-giumalau-izvorul-alb/), a unos tres kilómetros, y la [Rezervația
      Naturală Codrul Secular Valea Mare](/lugar/rezervatia-naturala-codrul-secular-valea-mare/), a unos
      cinco. Más lejos, el [Hajdučki i Rožanski Kukovi - Strogi
      rezervat](/lugar/hajducki-i-rozanski-kukovi---stroga-rezervat/) comparte el serbal de cazadores, la haya
      y el lince, y la [Prašuma Lom - Strogi rezervat prirode](/lugar/prasuma-lom-strogi-rezervat-prirode/),
      el arce blanco, la haya y el lince. En
      [Muniellos](/lugar/fuentes-del-narcea-degana-e-ibias---muniellos/) coinciden la haya, el urogallo y el
      lobo, y en [Havešová](/lugar/narodna-prirodna-rezervacia-havesova/), el arce blanco, el lince y el lobo.
  en:
    intro: >-
      Local tradition calls it 'Cămara Codrilor', a sanctuary where pristine nature offered cool air,
      stillness, and shelter. Today it is the Rezervația Codrul Secular Slătioara, located on the eastern
      flanks of the Rarău Massif within the territory of Slătioara village, Suceava County. It preserves one
      of the most intact mixed beech, fir, and spruce old-growth forests in the Carpathians, where ancient
      trees die standing and decay gradually, feeding the emergence of the next forest generation.
    landscape: >-
      You need to look at this mountain from base to crest. The forest climbs from 790 to 1,353 metres in
      altitude, blanketing nearly the entire south-eastern flank of Rarău from the foothills up to the ridges
      of Todirescu. It unfolds across three broad parallel ridges—Bâtca Neagră, Bâtca cu Plai, and Bâtca
      Lesă—between which running waters do their work: the mountain streams Văiuga, Valea lui Ion, Valea
      Ursului, and Valea Ceargaului merge in pairs to give rise to the Slătioara stream.


      Beneath lies complex geology. The terrain belongs to a Mesozoic marginal trough, with limestone and
      dolomites forming prominent klippen outcrops.


      The forest blanket is a close-knit canopy of European beech, silver fir, and Norway spruce. Its dynamics
      are those of an unmanaged forest: veteran trees dry up standing, decay at their own pace, and create
      nurse logs for seedlings. Among the accompanying trees and shrubs are rowan (Sorbus aucuparia) and
      sycamore maple (Acer pseudoplatanus). At ground level, the Ministry reports 451 species of mosses
      thriving across tree roots and forest floor.
    wildlife: >-
      The Ministry documents [red deer](/especie/cervus_elaphus/), [grey wolf](/especie/canis_lupus/), and
      [Eurasian lynx](/especie/lynx_lynx/) within the reserve boundaries. The official educational
      documentation adds the [pine marten](/especie/martes_martes/) and European badger among resident forest
      fauna, while avian records feature the [western capercaillie](/especie/tetrao_urogallus/).


      The official guide notes that the forest can be visited in any season of the year. There is no rigid
      wildlife-watching timetable; what awaits you is a living forest that transitions across seasons with its
      timeless natural rhythm.
    visit: >-
      Regulations require you to remain strictly on waymarked tourist paths. The main hiking route highlighted
      in official resources follows a blue cross symbol, supported by informational panels, orientation
      arrows, and trail blazes to keep you on track.


      Slătioara village serves as the natural gateway: the nature reserve lies entirely within its communal
      boundaries.
    history: >-
      Protection here has a deep history. The reserve is recorded under Law 5/2000 as number 2,723, having
      been first designated a forest reserve in 1941, followed by a formal reorganization in 1955. In 2007 it
      was integrated into Natura 2000 as part of the Rarău-Giumalău Site of Community Importance and Special
      Protection Area, and in 2017 UNESCO inscribed it onto the World Heritage List. The UNESCO component
      spans 609.12 hectares, surrounded by a buffer zone of 429.43 hectares.


      It enjoys strict nature protection: any extraction of timber or forest products within the reserve is
      prohibited. UNESCO classifies the serial components as vital genetic reservoirs for beech, demanding
      non-intervention management. Primary threats monitored across the serial property include illegal
      felling and habitat fragmentation.
    before: Stay on the waymarked trails. Lighting campfires is strictly prohibited across the entire site.
    around: >-
      Nearby lie [Rezervația Codrul Secular Giumalău - Izvorul
      Alb](/lugar/rezervatia-codrul-secular-giumalau-izvorul-alb/), about three kilometres away, and
      [Rezervația Naturală Codrul Secular Valea Mare](/lugar/rezervatia-naturala-codrul-secular-valea-mare/),
      roughly five kilometres distant. Further afield, [Hajdučki i Rožanski Kukovi - Strogi
      rezervat](/lugar/hajducki-i-rozanski-kukovi---stroga-rezervat/) shares rowan, European beech, and
      Eurasian lynx, while [Prašuma Lom - Strogi rezervat
      prirode](/lugar/prasuma-lom-strogi-rezervat-prirode/) shares sycamore maple, beech, and lynx. In
      [Muniellos](/lugar/fuentes-del-narcea-degana-e-ibias---muniellos/), beech, western capercaillie, and
      wolf converge, and in [Havešová](/lugar/narodna-prirodna-rezervacia-havesova/), sycamore maple, lynx,
      and wolf coincide.
  fr:
    intro: >-
      La mémoire locale l'appelait « Cămara Codrilor », un garde-manger sylvestre où la nature offrait
      fraîcheur, sérénité et asile. C'est aujourd'hui la Rezervația Codrul Secular Slătioara, accrochée aux
      pentes orientales du massif du Rarău, sur le finage de la commune de Slătioara dans le județ de Suceava.
      Elle préserve l'un des massifs mixtes de hêtres, sapins et épicéas les plus remarquables des Carpates,
      où les arbres sénescents meurent debout et pourrissent lentement, jusqu'à faire germer la forêt future.
    landscape: >-
      Il convient de contempler la montagne de bas en haut. Le manteau boisé s'élève de 790 à 1 353 mètres
      d'altitude pour couvrir la quasi-totalité du versant sud-est du Rarău, du piémont jusqu'aux sommets de
      Todirescu. Il s'étire sur trois longues crêtes parallèles, Bâtca Neagră, Bâtca cu Plai et Bâtca Lesă,
      entre lesquelles le chevelu hydrographique s'active : les torrents Văiuga, Valea lui Ion, Valea Ursului
      et Valea Ceargaului confluent deux à deux pour donner naissance au ruisseau de Slătioara.


      En sous-sol affleure la géologie. La zone relève d'un bassin marginal mésozoïque, dont les roches
      sédimentaires dessinent des falaises calcaires et dolomitiques remarquables en klippes.


      Le peuplement qui chapeaute ce relief associe intimement le hêtre, le sapin pectiné et l'épicéa commun.
      Sa dynamique est celle d'un massif soustrait à la hache : les vieux fûts se dessèchent sur pied, se
      décomposent sans hâte et nourrissent le renouvellement forestier. Parmi les essences compagnes se
      remarquent le sorbier des oiseleurs (Sorbus aucuparia) et l'érable sycomore (Acer pseudoplatanus). Au
      sol, le ministère recense 451 espèces de mousses tapissant les racines et le terreau sylvestre.
    wildlife: >-
      Le ministère confirme la présence dans la réserve du [cerf élaphe](/especie/cervus_elaphus/), du [loup
      gris](/especie/canis_lupus/) et du [lynx boréal](/especie/lynx_lynx/). Les publications éducatives
      officielles y associent la [martre des pins](/especie/martes_martes/) et le blaireau d'Eurasie, tandis
      que la gent ailée compte le prestigieux [grand tétras](/especie/tetrao_urogallus/).


      Les fiches officielles précisent que le massif s'explore en toute saison. Il n'existe pas d'horaire
      d'observation fixe : vous pénétrez dans un écosystème qui évolue au fil des saisons selon une dynamique
      séculaire ininterrompue.
    visit: >-
      La réglementation vous impose d'emprunter exclusivement les sentiers touristiques balisés. L'itinéraire
      mis en valeur par la documentation officielle est marqué d'une croix bleue, relayée par des panneaux
      thématiques, des flèches et des balises régulières qui évitent tout égarement.


      Le village de Slătioara constitue la porte d'accès naturelle, la réserve étant enclavée sur son
      territoire communal.
    history: >-
      La protection s'enracine dans le temps long. La réserve figure dans la loi 5/2000 sous le numéro 2 723,
      après avoir été proclamée réserve forestière dès 1941 et réorganisée en 1955. En 2007, elle a été
      intégrée au réseau Natura 2000 au titre du site d'importance communautaire et de la zone de protection
      spéciale des monts Rarău-Giumalău, avant d'être inscrite en 2017 sur la liste du Patrimoine mondial de
      l'UNESCO. La zone centrale UNESCO couvre 609,12 hectares, complétée par une zone tampon de 429,43
      hectares.


      Elle bénéficie d'une protection intégrale : toute exploitation de bois ou de ressources ligneuses y est
      formellement bannie. L'UNESCO définit ces réserves comme un réservoir génétique essentiel pour le hêtre
      et impose une gestion de stricte non-intervention. L'abattage clandestin et la fragmentation des
      corridors naturels constituent les menaces majeures surveillées.
    before: >-
      Demeurez sur les sentiers balisés. Allumer du feu est rigoureusement interdit sur l'ensemble du
      périmètre.
    around: >-
      À proximité immédiate s'étendent la [Rezervația Codrul Secular Giumalău - Izvorul
      Alb](/lugar/rezervatia-codrul-secular-giumalau-izvorul-alb/), à environ trois kilomètres, et la
      [Rezervația Naturală Codrul Secular Valea Mare](/lugar/rezervatia-naturala-codrul-secular-valea-mare/),
      à environ cinq kilomètres. Plus au loin, les [Hajdučki i Rožanski Kukovi - Strogi
      rezervat](/lugar/hajducki-i-rozanski-kukovi---stroga-rezervat/) partagent le sorbier des oiseleurs, le
      hêtre et le lynx, et la [Prašuma Lom - Strogi rezervat
      prirode](/lugar/prasuma-lom-strogi-rezervat-prirode/) l'érable sycomore, le hêtre et le lynx. À
      [Muniellos](/lugar/fuentes-del-narcea-degana-e-ibias---muniellos/) se rencontrent le hêtre, le grand
      tétras et le loup, tandis qu'à [Havešová](/lugar/narodna-prirodna-rezervacia-havesova/) cohabitent
      l'érable, le lynx et le loup.
  de:
    intro: >-
      Der Volksmund nannte ihn einst «Cămara Codrilor», eine Waldkammer, die Kühle, Stille und Zuflucht
      spendete. Heute ist es die Rezervația Codrul Secular Slătioara an den Osthängen des Rarău-Massivs auf
      dem Gemeindegebiet von Slătioara im Kreis Suceava. Sie bewahrt einen der besterhaltenen Mischwälder aus
      Rotbuche, Weißtanne und Gemeiner Fichte in den Karpaten, in dem greise Baumriesen im Stehen absterben
      und langsam zerfallen, bis aus ihrem Holz der nächste Urwald erwächst.
    landscape: >-
      Man muss den Berg von unten nach oben betrachten. Der Wald steigt von 790 auf 1.353 Meter Höhe an und
      bedeckt fast die gesamte Südostflanke des Rarău vom Talboden bis zu den Kämmen von Todirescu. Er
      gliedert sich über drei breite, parallele Bergrücken – Bâtca Neagră, Bâtca cu Plai und Bâtca Lesă –,
      zwischen denen das Wasser fließt: Die Bäche Văiuga, Valea lui Ion, Valea Ursului und Valea Ceargaului
      vereinigen sich paarweise und bilden den Gebirgsbach Slătioara.


      Darunter liegt ein geologisches Fundament. Das Gebiet gehört zu einem mesozoischen Randbecken, dessen
      Klippen aus markanten Kalksteinen und Dolomiten hervortreten.


      Der Waldbestand darüber bildet eine urwüchsige Mischung aus Rotbuche, Weißtanne und Fichte. Seine
      Dynamik ist die eines unberührten Waldes: Uralte Bäume trocknen stehend ein, verrotten allmählich und
      bereiten den Nährboden für die Folgegeneration. Als Begleitgehölze treten Vogelbeere (Sorbus aucuparia)
      und Bergahorn (Acer pseudoplatanus) auf. Am Waldboden verzeichnet das Ministerium 451 Moosarten auf den
      Wurzeln und am Totholz.
    wildlife: >-
      Das Ministerium weist für das Reservat [Rothirsch](/especie/cervus_elaphus/),
      [Wolf](/especie/canis_lupus/) und [Eurasischen Luchs](/especie/lynx_lynx/) nach. Offizielle
      Bildungsdokumente nennen zudem [Baummarder](/especie/martes_martes/) und Dachs unter den Waldbewohnern,
      während bei den Vögeln das seltene [Auerhuhn](/especie/tetrao_urogallus/) verzeichnet ist.


      Offizielle Unterlagen betonen, dass der Wald zu jeder Jahreszeit besucht werden kann. Es gibt keine
      starren Beobachtungszeiten; was dich erwartet, ist ein Urwaldgefüge, das im Rhythmus der Jahreszeiten
      seiner eigenen Urkraft folgt.
    visit: >-
      Die Schutzvorschriften verpflichten dich, ausnahmslos auf den markierten Wanderwegen zu bleiben. Die
      offizielle Routenführung folgt einer blauen Kreuzmarkierung; Informationstafeln, Richtungspfeile und
      Wegweiser sorgen für klare Orientierung.


      Das Dorf Slătioara dient als Einstiegstor: Das Schutzgebiet liegt vollständig auf dessen Gemarkung.
    history: >-
      Der Schutzstatus hat eine lange Vorgeschichte. Das Reservat ist im Gesetz 5/2000 unter der Nummer 2.723
      eingetragen, wurde bereits 1941 zum forstlichen Bannwald erklärt und 1955 waldbaulich neu geordnet. 2007
      erfolgte die Eingliederung in das europäische Netz Natura 2000 im Rahmen des FFH- und Vogelschutzgebiets
      Rarău-Giumalău, und 2017 nahm die UNESCO das Waldgebiet in das Weltnaturerbe auf. Die Kernzone der
      UNESCO umfasst 609,12 Hektar, ergänzt um eine Pufferzone von 429,43 Hektar.


      Es gilt absoluter Totalreservatsschutz: Jede Entnahme von Holz oder anderen Waldprodukten ist strikt
      untersagt. Die UNESCO stuft die Teilgebiete als unverzichtbares Genreservoir der Rotbuche ein und
      verlangt ein konsequentes Prozessschutz-Management. Zu den primären Gefährdungsfaktoren des
      transnationalen Schutzguts zählen Rodungen und Biotopfragmentierung.
    before: Bleib stets auf den markierten Wegen. Offenes Feuer ist im gesamten Schutzgebiet streng verboten.
    around: >-
      Ganz in der Nähe liegen die [Rezervația Codrul Secular Giumalău - Izvorul
      Alb](/lugar/rezervatia-codrul-secular-giumalau-izvorul-alb/), etwa drei Kilometer entfernt, und die
      [Rezervația Naturală Codrul Secular Valea Mare](/lugar/rezervatia-naturala-codrul-secular-valea-mare/)
      nach etwa fünf Kilometern. Weiter entfernt teilen die [Hajdučki i Rožanski Kukovi - Strogi
      rezervat](/lugar/hajducki-i-rozanski-kukovi---stroga-rezervat/) Vogelbeere, Buche und Luchs, und die
      [Prašuma Lom - Strogi rezervat prirode](/lugar/prasuma-lom-strogi-rezervat-prirode/) Bergahorn, Buche
      und Luchs. In [Muniellos](/lugar/fuentes-del-narcea-degana-e-ibias---muniellos/) begegnen sich Buche,
      Auerhuhn und Wolf, und in [Havešová](/lugar/narodna-prirodna-rezervacia-havesova/) vereinen sich
      Bergahorn, Luchs und Wolf.
  it:
    intro: >-
      La memoria popolare lo chiamava «Cămara Codrilor», un forziere silvano dove la natura offriva frescura,
      quiete e rifugio. Oggi è la Rezervația Codrul Secular Slătioara, distesa sul versante orientale del
      massiccio del Rarău nel comune di Slătioara, distretto di Suceava. Custodisce una delle foreste miste di
      faggio, abete bianco e abete rosso meglio preservate dei Carpazi, dove i vecchi alberi muoiono in piedi
      e si decompongono lentamente, alimentando la rinascita del bosco.
    landscape: >-
      Bisogna contemplare la montagna dal fondovalle verso le creste. La foresta sale dai 790 ai 1.353 metri
      di quota, ammantando la quasi totalità del versante sud-orientale del Rarău, dalla base sino alle vette
      di Todirescu. Si sviluppa lungo tre ampie dorsali parallele, Bâtca Neagră, Bâtca cu Plai e Bâtca Lesă,
      tra le quali l'acqua scorre instancabile: i torrenti Văiuga, Valea lui Ion, Valea Ursului e Valea
      Ceargaului confluiscono a coppie originando il torrente Slătioara.


      Sotto la copertura vegetale pulsa la geologia. L'area appartiene a un bacino marginale mesozoico, con
      rilievi dirupati e falesie di calcari e dolomie nei klippen.


      La volta forestale è un fitto mosaico di faggio, abete bianco e abete rosso. La sua dinamica è quella di
      una selva non toccata dall'uomo: gli alberi vetusti deperiscono in piedi, marciscono lentamente e
      preparano il suolo fertile per le nuove generazioni. Tra alberi e arbusti compaiono il sorbo degli
      uccellatori (Sorbus aucuparia) e l'acero di monte (Acer pseudoplatanus). Al suolo, il Ministero
      documenta ben 451 specie di muschi sulle radici e sul legno marcescente.
    wildlife: >-
      Il Ministero segnala nella riserva il [cervo](/especie/cervus_elaphus/), il
      [lupo](/especie/canis_lupus/) e la [lince](/especie/lynx_lynx/). Le guide educative ufficiali aggiungono
      la [martora](/especie/martes_martes/) e il tasso tra i mammiferi del bosco, mentre l'avifauna annovera
      il raro [gallo cedrone](/especie/tetrao_urogallus/).


      I documenti didattici precisano che la foresta si può visitare in ogni stagione dell'anno. Non esistono
      calendari prefissati: ad accoglierti c'è un ecosistema primigenio che muta con le stagioni, fedele alla
      sua ancestrale dinamica naturale.
    visit: >-
      I regolamenti impongono di utilizzare unicamente i tracciati turistici segnalati. Il sentiero principale
      descritto nelle schede didattiche segue una croce blu, con tabelle informative, frecce direzionali e
      segnavia che guidano i tuoi passi.


      Il villaggio di Slătioara costituisce la naturale porta d'accesso, sorgendo la riserva entro i confini
      comunali.
    history: >-
      La tutela ha radici lontane. La riserva è catalogata nella Legge 5/2000 con il numero 2.723, fu
      istituita come riserva forestale già nel 1941 e riordinata nel 1955. Nel 2007 è confluita nella rete
      Natura 2000 come sito di interesse comunitario e zona di protezione speciale dei monti Rarău-Giumalău, e
      nel 2017 l'UNESCO l'ha iscritta nel Patrimonio Mondiale. La componente UNESCO copre 609,12 ettari,
      affiancata da una fascia tampone di 429,43 ettari.


      Gode di tutela integrale: all'interno della riserva è proibito qualsiasi prelievo di legname o di altri
      prodotti forestali. L'UNESCO definisce questi siti seriali riserve genetiche fondamentali per il faggio
      ed esige una gestione a non-intervento. Le minacce monitorate comprendono il taglio clandestino e
      l'isolamento degli habitat.
    before: >-
      Rimani rigorosamente sui percorsi segnati. Accendere fuochi è severamente vietato nell'intero
      comprensorio.
    around: >-
      Nelle immediate vicinanze sorgono la [Rezervația Codrul Secular Giumalău - Izvorul
      Alb](/lugar/rezervatia-codrul-secular-giumalau-izvorul-alb/), a circa tre chilometri, e la [Rezervația
      Naturală Codrul Secular Valea Mare](/lugar/rezervatia-naturala-codrul-secular-valea-mare/), a circa
      cinque chilometri. Più a distanza, gli [Hajdučki i Rožanski Kukovi - Strogi
      rezervat](/lugar/hajducki-i-rozanski-kukovi---stroga-rezervat/) condividono il sorbo degli uccellatori,
      il faggio e la lince, e la [Prašuma Lom - Strogi rezervat
      prirode](/lugar/prasuma-lom-strogi-rezervat-prirode/) l'acero di monte, il faggio e la lince. A
      [Muniellos](/lugar/fuentes-del-narcea-degana-e-ibias---muniellos/) si ritrovano il faggio, il gallo
      cedrone e il lupo, mentre a [Havešová](/lugar/narodna-prirodna-rezervacia-havesova/) coincidono l'acero
      montano, la lince e il lupo.
  pt:
    intro: >-
      A tradição popular chamava-lhe «Cămara Codrilor», uma despensa silvestre onde a natureza oferecia
      frescura, sossego e refúgio. É hoje a Rezervația Codrul Secular Slătioara, implantada nas encostas
      orientais do maciço de Rarău, na circunscrição da aldeia de Slătioara, no distrito de Suceava. Preserva
      uma das matas mistas de faia, abeto-falso e espruce mais intocadas dos Cárpatos, onde as árvores
      vetustas morrem de pé e se decompõem lentamente, até que desse termo brota a floresta vindoura.
    landscape: >-
      Importa olhar a montanha da base até aos cumes. A massa arbórea sobe dos 790 aos 1.353 metros de
      altitude, cobrindo quase toda a encosta sudeste de Rarău, desde a base orográfica até aos cumes de
      Todirescu. Desenvolve-se ao longo de três grandes cumeadas paralelas — Bâtca Neagră, Bâtca cu Plai e
      Bâtca Lesă —, entre as quais a hidrografia cumpre a sua função: os ribeiros Văiuga, Valea lui Ion, Valea
      Ursului e Valea Ceargaului confluem dois a dois, dando origem ao curso do Slătioara.


      Sob este manto vegetal, sobressai a geologia. A região integra uma bacia marginal mesozoica, despontando
      entre as suas rochas os calcários e dolomitos que moldam as cristas rochosas em klippes.


      O coberto florestal conjuga a faia, o abeto-falso e o espruce. A dinâmica é a de uma mata imune a
      machados: os troncos antigos secam de pé, desfazem-se sem pressa e preparam a germinação das novas
      gerações. Entre as árvores e arbustos acompanhantes surgem a tramazeira (Sorbus aucuparia) e o
      bordo-falso (Acer pseudoplatanus). Ao nível do solo, o Ministério assinala 451 espécies de musgos sobre
      o emaranhado radicular e a manta morta.
    wildlife: >-
      O Ministério documenta na reserva a presença de [veado-vermelho](/especie/cervus_elaphus/),
      [lobo](/especie/canis_lupus/) e [lince-euroasiático](/especie/lynx_lynx/). Os roteiros educativos
      oficiais somam a [marta](/especie/martes_martes/) e o texugo à fauna silvestre, figurando entre as aves
      o emblemático [tetraz-grande](/especie/tetrao_urogallus/).


      A documentação informativa salienta que a mata pode ser percorrida em qualquer estação do ano. Não há um
      calendário restrito para a observação da vida selvagem: o que encontras é um ecossistema que se
      transforma com as estações, fiel aos seus ciclos imemoriais.
    visit: >-
      As regras do parque impõem que utilizes estritamente os trilhos pedestres assinalados. O itinerário de
      visita sugerido na documentação acompanha a marcação de uma cruz azul, reforçada por painéis
      informativos, setas e marcas de percurso que impedem desvios inadvertidos.


      A aldeia de Slătioara serve como entrada natural no território, situando-se a reserva dentro dos limites
      da localidade.
    history: >-
      A salvaguarda deste património tem raízes antigas. A reserva vem inscrita na Lei 5/2000 sob o número
      2.723, tendo sido declarada reserva florestal logo em 1941 e reorganizada em 1955. Em 2007 foi acolhida
      na rede Natura 2000 como sítio de importância comunitária e zona de proteção especial dos montes
      Rarău-Giumalău, e em 2017 a UNESCO integrou-a no Património Mundial. A área nuclear da UNESCO abrange
      609,12 hectares, envolvida por uma zona de amortecimento com 429,43 hectares.


      Beneficia de proteção absoluta: no interior da reserva vigora a interdição total de cortes madeireiros
      ou colheita de produtos florestais. A UNESCO qualifica estes núcleos como reservas genéticas
      determinantes para a faia, reclamando uma política rigorosa de não intervenção. O corte ilegal de
      arvoredo e o isolamento dos habitats representam as principais ameaças sob vigilância.
    before: Mantém-te nos trilhos marcados. Fazer fogo é terminantemente proibido em toda a reserva.
    around: >-
      Nas imediações situam-se a [Rezervația Codrul Secular Giumalău - Izvorul
      Alb](/lugar/rezervatia-codrul-secular-giumalau-izvorul-alb/), a cerca de três quilómetros, e a
      [Rezervația Naturală Codrul Secular Valea Mare](/lugar/rezervatia-naturala-codrul-secular-valea-mare/),
      a perto de cinco quilómetros de distância. Mais longe, os [Hajdučki i Rožanski Kukovi - Strogi
      rezervat](/lugar/hajducki-i-rozanski-kukovi---stroga-rezervat/) acolhem igualmente a tramazeira, a faia
      e o lince-euroasiático, e a [Prašuma Lom - Strogi rezervat
      prirode](/lugar/prasuma-lom-strogi-rezervat-prirode/) o bordo-falso, a faia e o lince. Em
      [Muniellos](/lugar/fuentes-del-narcea-degana-e-ibias---muniellos/) coincidem a faia, o tetraz e o lobo,
      e em [Havešová](/lugar/narodna-prirodna-rezervacia-havesova/) associam-se o bordo, o lince e o lobo.
