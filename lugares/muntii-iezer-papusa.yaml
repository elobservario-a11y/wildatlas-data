resumen:
  es: Macizo montañoso que conecta el cinturón forestal del sur de Făgăraș con Piatra Craiului.
  en: Mountain massif connecting the southern forest belt of Făgăraș with Piatra Craiului.
  fr: Massif montagneux reliant la ceinture forestière sud des Făgăraș à Piatra Craiului.
  de: Gebirgsmassiv, das den südlichen Waldkorridor des Făgăraș mit dem Piatra-Craiului-Gebirge verbindet.
  it: Massiccio montuoso che unisce la fascia forestale meridionale del Făgăraș con Piatra Craiului.
  pt: Maciço montanhoso que liga o corredor florestal sul de Făgăraș a Piatra Craiului.
unico:
  es: >-
    Un macizo que une el cinturón forestal del sur de Făgăraș con Piatra Craiului, y donde los glaciares
    dejaron lagos de circo.
  en: >-
    A massif linking the southern forest corridor of Făgăraș with Piatra Craiului, where ancient glaciers left
    pristine tarns.
  fr: >-
    Un massif reliant le corridor forestier sud des Făgăraș à Piatra Craiului, où les anciens glaciers ont
    laissé des lacs de cirque.
  de: >-
    Ein Gebirgsstock, der den südlichen Waldgürtel des Făgăraș mit dem Piatra Craiului verbindet und
    unberührte Karseen birgt.
  it: >-
    Un massiccio che collega il corridoio boschivo meridionale del Făgăraș con Piatra Craiului, punteggiato da
    laghetti glaciali di circo.
  pt: >-
    Um maciço que une a cintura florestal sul de Făgăraș a Piatra Craiului, onde os glaciares deixaram lagoas
    de circo.
observaciones:
  es: Los mejores meses son de junio a octubre.
texto:
  es:
    intro: >-
      A 2.135 metros, bajo la cumbre Iezerul Mare, hay un lago glaciar en un circo guardado por cumbres
      peladas y salvajes. Es el lago Iezeru Mare, el corazón de los montes Iezer-Păpușa, un macizo de los
      Cárpatos Meridionales que pertenece al grupo de Făgăraș y queda por completo en el condado de Argeș.
      Ocupa 535 kilómetros cuadrados, entre Făgăraș, al noroeste, y Piatra Craiului, al este, y su cumbre más
      alta es Roșu, con 2.470 metros. Los ríos Dâmbovița y Râul Târgului nacen en estas montañas, y las
      cumbres pasan de los dos mil cuatrocientos metros en varios puntos: Roșu, Iezerul Mare y Iezerul Mic.
    landscape: >-
      Entre sus cumbres destacadas están Iezerul Mare, de 2.462 metros, Iezerul Mic, de 2.409, y Păpușa, de
      2.391. El macizo se extiende entre los ríos Dâmbovița, al este, y Râul Doamnei, al oeste, y en él nacen
      el Dâmbovița y el Râul Târgului. Por la loma Mezea-Oticu, donde nacen el Dâmbovița y el Râul Doamnei, el
      macizo se comunica con Făgăraș. Hay incluso una investigación geomorfológica sobre el permafrost en
      estas montañas, publicada en 2018. En el interior hay un embalse, el de Râușor, tras la presa del mismo
      nombre, alimentado por los ríos Râușor y Râul Târgului.


      La huella glaciar se ve en los lagos. Junto al Iezeru Mare hay un refugio de montaña. Además de él, al
      otro lado del macizo hay dos lagos glaciares menores, los Boarcăș, bajo la cumbre Roșu.
    wildlife: >-
      Lo que se sabe de la fauna viene del seguimiento de Conservation Carpathia, cuyas zonas de estudio
      incluyen Iezer-Păpușa. El primer censo genético de osos, en el este de Făgăraș, Piatra Craiului,
      Iezer-Păpușa y Leaota, identificó 283 [osos pardos](/especie/ursus_arctos/), con una densidad estimada
      de 17-18 por cada cien kilómetros cuadrados. La fundación midió también con ADN la población de
      [lobos](/especie/canis_lupus/) del sur de los Cárpatos en 1.400 km² que incluyen el este de Făgăraș,
      Piatra Craiului, Iezer-Păpușa y Leaota, y el macizo está en su programa de seguimiento genético no
      invasivo de lobos, iniciado en 2017.


      Conservation Carpathia exploró en Iezer-Păpușa la posibilidad de crear una travesía de varios días para
      observar [rebecos](/especie/rupicapra_rupicapra/).
    visit: >-
      No hay rutas, refugios ni centros de visitantes descritos para el macizo. La idea de la travesía de
      varios días centrada en el rebeco fue una propuesta estudiada, no una oferta vigente.
    history: El primer estudio genético de osos de la fundación abarcó también Iezer-Păpușa.
    before: Los mejores meses son de junio a octubre.
    around: >-
      A tres kilómetros está el [Parque Nacional Piatra Craiului](/lugar/parcul-national-piatra-craiului/). A
      ocho, el [Desfiladero del Río Olt](/lugar/defileul-oltului/) y el [Parque Nacional Cozia - Bosques
      Primarios](/lugar/parcul-national-cozia---codrii-seculari/). A diecinueve están las [Montañas de
      Leaota](/lugar/muntii-leaota/) y a veintiuno el [Parque Nacional Bucegi - Ladera
      Occidental](/lugar/parcul-national-bucegi---vertientes-occidentales/).
  en:
    intro: >-
      At 2,135 metres, cradled beneath the summit of Iezerul Mare, a glacial tarn rests inside a high cirque
      ringed by barren, rugged crags. This is Lake Iezeru Mare, the crystalline heart of the Iezer-Păpușa
      Mountains—a compact alpine massif in the Southern Carpathians belonging to the broader Făgăraș group and
      lying entirely within Argeș County. It covers 535 square kilometres between Făgăraș to the northwest and
      Piatra Craiului to the east, culminating at Mount Roșu at 2,470 metres. The Dâmbovița and Râul Târgului
      rivers have their headwaters here, with multiple crests exceeding two thousand four hundred metres:
      Roșu, Iezerul Mare, and Iezerul Mic.
    landscape: >-
      Prominent summits include Iezerul Mare at 2,462 metres, Iezerul Mic at 2,409 metres, and Păpușa at 2,391
      metres. The massif is bounded between the Dâmbovița river to the east and Râul Doamnei to the west.
      Along the Mezea-Oticu crest, where headwater springs of both rivers emerge, the range connects
      physically to the Făgăraș chain. Geomorphological field surveys on relict mountain permafrost were
      conducted here and published in 2018. In the interior valley sits the Râușor reservoir, impounded behind
      a concrete dam fed by the Râușor and Râul Târgului rivers.


      Glacial history is etched in mountain lakes. Beside Lake Iezeru Mare perches an alpine shelter. Across
      the opposite side of the range lie two smaller tarns, the Boarcăș lakes, nestled beneath the cliffs of
      Mount Roșu.
    wildlife: >-
      Faunal knowledge of the range derives primarily from research by Foundation Conservation Carpathia,
      whose study sector encompasses Iezer-Păpușa. An inaugural genetic census of brown bears across eastern
      Făgăraș, Piatra Craiului, Iezer-Păpușa, and Leaota identified 283 [brown bears](/especie/ursus_arctos/),
      estimating a regional density of 17-18 individuals per one hundred square kilometres. The foundation
      also surveyed the southern Carpathian [grey wolf](/especie/canis_lupus/) population across 1,400 km²
      including Iezer-Păpușa through non-invasive DNA monitoring initiated in 2017.


      Conservation Carpathia also evaluated the viability of developing a multiday wildlife viewing route in
      Iezer-Păpușa focused on observing [chamois](/especie/rupicapra_rupicapra/).
    visit: >-
      No formal marked tourist routes, staffed refuges, or visitor centres are officially maintained across
      the massif. The multiday wildlife watching concept remained an explored feasibility study rather than an
      active tourist offer.
    history: The foundation's inaugural genetic brown bear study also encompassed Iezer-Păpușa.
    before: The best months are from June to October.
    around: >-
      Three kilometres away lies [Piatra Craiului National Park](/lugar/parcul-national-piatra-craiului/).
      Eight kilometres distant are the [Olt River Gorge](/lugar/defileul-oltului/) and [Cozia National Park –
      Ancient Beech Forest](/lugar/parcul-national-cozia---codrii-seculari/). Nineteen kilometres away rise
      the [Leaota Mountains](/lugar/muntii-leaota/), and twenty-one kilometres distant is [Bucegi National
      Park – Western Slopes](/lugar/parcul-national-bucegi---vertientes-occidentales/).
  fr:
    intro: >-
      À 2 135 mètres d'altitude, sous le sommet de l'Iezerul Mare, un lac glaciaire repose au fond d'un cirque
      ceinturé de crêtes dénudées et sauvages. C'est le lac Iezeru Mare, cœur cristallin des monts
      Iezer-Păpușa, un massif des Carpates méridionales rattaché au groupe des Făgăraș et situé entièrement
      dans le județ d'Argeș. Il couvre 535 kilomètres carrés entre les Făgăraș au nord-ouest et Piatra
      Craiului à l'est, culminant au pic Roșu à 2 470 mètres. La Dâmbovița et le Râul Târgului y prennent leur
      source, et plusieurs cimes franchissent deux mille quatre cents mètres : Roșu, Iezerul Mare et Iezerul
      Mic.
    landscape: >-
      Parmi les cimes majeures figurent l'Iezerul Mare à 2 462 mètres, l'Iezerul Mic à 2 409 mètres et la
      Păpușa à 2 391 mètres. Le massif s'étend entre la Dâmbovița à l'est et le Râul Doamnei à l'ouest. Par
      l'échine de Mezea-Oticu, il se rattache directement à la chaîne des Făgăraș. Des recherches
      géomorphologiques sur le pergélisol résiduel de ces montagnes ont été publiées en 2018. Dans la vallée
      centrale s'étend la retenue de Râușor, alimentée par le Râușor et le Râul Târgului.


      L'empreinte glaciaire se lit dans ses lacs d'altitude. Près du lac Iezeru Mare s'élève un refuge de
      montagne. Sur l'autre versant dorment deux petits lacs de cirque, les Boarcăș, nichés sous le pic Roșu.
    wildlife: >-
      Les connaissances sur la faune proviennent des suivis scientifiques de la Fondation Conservation
      Carpathia. Un recensement génétique des ours mené dans l'est des Făgăraș, Piatra Craiului, Iezer-Păpușa
      et Leaota a identifié 283 [ours bruns](/especie/ursus_arctos/), avec une densité estimée à 17-18
      individus pour cent kilomètres carrés. La fondation a également étudié l'ADN des
      [loups](/especie/canis_lupus/) sur 1 400 km² incluant le massif grâce à un suivi non invasif débuté en
      2017.


      Conservation Carpathia a étudié dans l'Iezer-Păpușa la faisabilité d'un circuit d'observation de
      plusieurs jours dédié au [chamois](/especie/rupicapra_rupicapra/).
    visit: >-
      Il n'y a ni sentiers aménagés, ni refuges gardés, ni centres de visiteurs décrits pour ce massif. Le
      projet de traversée d'observation du chamois est resté à l'état d'étude.
    history: La première étude génétique de l'ours menée par la fondation a également englobé Iezer-Păpușa.
    before: Les meilleurs mois vont de juin à octobre.
    around: >-
      À trois kilomètres se dresse le [parc national Piatra
      Craiului](/lugar/parcul-national-piatra-craiului/). À huit kilomètres se trouvent le [défilé de
      l'Olt](/lugar/defileul-oltului/) et le [parc national
      Cozia](/lugar/parcul-national-cozia---codrii-seculari/). À dix-neuf kilomètres s'élèvent les [montagnes
      de Leaota](/lugar/muntii-leaota/) et à vingt-et-un le [parc national
      Bucegi](/lugar/parcul-national-bucegi---vertientes-occidentales/).
  de:
    intro: >-
      Auf 2.135 Metern Höhe ruht unter dem Gipfel des Iezerul Mare ein Gletschersee in einem Hochkar, umrahmt
      von kahlen, wilden Berggraten. Es ist der Iezeru-Mare-See, das Herz des Iezer-Păpușa-Gebirges – eines
      Massivs der Südkarpaten, das zur Făgăraș-Gruppe gehört und vollständig im Kreis Argeș liegt. Es
      erstreckt sich über 535 Quadratkilometer zwischen dem Făgăraș im Nordwesten und dem Piatra Craiului im
      Osten; sein höchster Gipfel ist der Roșu mit 2.470 Metern. Dâmbovița und Râul Târgului entspringen hier,
      und mehrere Kämme übersteigen zweitausendvierhundert Meter: Roșu, Iezerul Mare und Iezerul Mic.
    landscape: >-
      Zu den Haupterhebungen zählen Iezerul Mare (2.462 Meter), Iezerul Mic (2.409 Meter) und Păpușa (2.391
      Meter). Das Gebirge spannt sich zwischen Dâmbovița im Osten und Râul Doamnei im Westen. Über den
      Mezea-Oticu-Kamm ist es direkt mit dem Făgăraș-Hauptkamm verbunden. Geomorphologische Feldstudien zum
      Permafrost wurden hier 2018 publiziert. Im Talbecken liegt der Râușor-Stausee, gespeist von Râușor und
      Râul Târgului.


      Eiszeitliche Spuren zeigen sich in Karseen. Am Iezeru Mare steht eine Schutzhütte. Auf der anderen Seite
      des Massivs liegen unter dem Roșu-Gipfel zwei kleinere Karseen, die Boarcăș-Seen.
    wildlife: >-
      Die faunistischen Daten stammen von der Stiftung Conservation Carpathia. Eine genetische Bärenzählung im
      östlichen Făgăraș, Piatra Craiului, Iezer-Păpușa und Leaota wies 283
      [Braunbären](/especie/ursus_arctos/) nach, mit einer Dichte von 17-18 Tieren pro hundert
      Quadratkilometer. Die Stiftung erforschte zudem die [Wolfspopulation](/especie/canis_lupus/) auf 1.400
      km² mittels nicht-invasiven DNA-Monitorings seit 2017.


      Conservation Carpathia prüfte im Massiv die Machbarkeit einer mehrtägigen Naturbeobachtungstour für
      [Gämsen](/especie/rupicapra_rupicapra/).
    visit: >-
      Für das Massiv sind keine markierten Routen, bewirtschafteten Hütten oder Besucherzentren beschrieben.
      Das Konzept der mehrtägigen Gämsenbeobachtung war ein Projektvorschlag.
    history: Die erste genetische Bärenstudie der Stiftung erfasste auch das Iezer-Păpușa-Gebirge.
    before: Die besten Monate sind Juni bis Oktober.
    around: >-
      Drei Kilometer entfernt liegt der [Nationalpark Piatra
      Craiului](/lugar/parcul-national-piatra-craiului/). Acht Kilometer weit sind der
      [Schil-Durchbruch](/lugar/defileul-oltului/) und der [Nationalpark
      Cozia](/lugar/parcul-national-cozia---codrii-seculari/). Neunzehn Kilometer entfernt ragt das
      [Leaota-Gebirge](/lugar/muntii-leaota/) auf, und einundzwanzig Kilometer der [Nationalpark
      Bucegi](/lugar/parcul-national-bucegi---vertientes-occidentales/).
  it:
    intro: >-
      A 2.135 metri di quota, ai piedi dell'Iezerul Mare, un laghetto glaciale giace in un circo alpino chiuso
      da creste spoglie e selvagge. È il lago Iezeru Mare, cuore montano dei monti di Iezer-Păpușa, massiccio
      dei Carpazi Meridionali appartenente al gruppo dei Făgăraș e situato interamente nel distretto di Argeș.
      Copre 535 chilometri quadrati tra i Făgăraș a nord-ovest e Piatra Craiului a est, culminando nel monte
      Roșu a 2.470 metri. I fiumi Dâmbovița e Râul Târgului nascono qui, e diverse cime superano i
      duemilaquattrocento metri: Roșu, Iezerul Mare e Iezerul Mic.
    landscape: >-
      Tra le vette principali spiccano l'Iezerul Mare (2.462 metri), l'Iezerul Mic (2.409 metri) e la Păpușa
      (2.391 metri). Il massiccio si distende tra il fiume Dâmbovița a est e il Râul Doamnei a ovest. Tramite
      la cresta di Mezea-Oticu si collega direttamente ai Făgăraș. Ricerche geomorfologiche sul permafrost
      relitto sono state pubblicate nel 2018. Nella valle interna sorge l'invaso artificiale di Râușor,
      alimentato dal Râușor e dal Râul Târgului.


      L'eredità glaciale si riconosce nei laghetti. Accanto all'Iezeru Mare si trova un rifugio alpino. Sul
      versante opposto si annidano due piccoli specchi d'acqua di circo, i laghi Boarcăș, sotto il picco Roșu.
    wildlife: >-
      Le conoscenze faunistiche derivano dalle ricerche della Fondazione Conservation Carpathia. Un censimento
      genetico degli orsi nell'est dei Făgăraș, Piatra Craiului, Iezer-Păpușa e Leaota ha censito 283 [orsi
      bruni](/especie/ursus_arctos/), con una densità stimata di 17-18 individui ogni cento chilometri
      quadrati. La fondazione ha studiato il DNA dei [lupi](/especie/canis_lupus/) su 1.400 km² con
      monitoraggio non invasivo avviato nel 2017.


      Conservation Carpathia ha esaminato nell'Iezer-Păpușa la fattibilità di un percorso di osservazione di
      più giorni dedicato al [camoscio alpino](/especie/rupicapra_rupicapra/).
    visit: >-
      Non vi sono sentieri turistici segnalati, rifugi gestiti o centri visitatori descritti per il massiccio.
      L'idea della traversata per l'avvistamento del camoscio è rimasta una proposta di studio.
    history: Il primo studio genetico sull'orso bruno della fondazione ha compreso anche Iezer-Păpușa.
    before: I mesi migliori vanno da giugno a ottobre.
    around: >-
      A tre chilometri sorge il [Parco nazionale Piatra Craiului](/lugar/parcul-national-piatra-craiului/). A
      otto chilometri si trovano le [Gole del fiume Olt](/lugar/defileul-oltului/) e il [Parco nazionale
      Cozia](/lugar/parcul-national-cozia---codrii-seculari/). A diciannove chilometri si elevano i [Monti di
      Leaota](/lugar/muntii-leaota/) e a ventuno il [Parco nazionale
      Bucegi](/lugar/parcul-national-bucegi---vertientes-occidentales/).
  pt:
    intro: >-
      A 2.135 metros de altitude, sob o cume do Iezerul Mare, repousa uma lagoa glaciar num circo alpino
      ladeado por cristas despidas e bravias. É a lagoa Iezeru Mare, coração dos montes Iezer-Păpușa, um
      maciço dos Cárpatos Meridionais pertencente ao grupo de Făgăraș e situado integralmente no distrito de
      Argeș. Ocupa 535 quilómetros quadrados entre Făgăraș a noroeste e Piatra Craiului a leste, culminando no
      monte Roșu a 2.470 metros. Os rios Dâmbovița e Râul Târgului nascem nestas serras, e vários cumes
      ultrapassam os dois mil e quatrocentos metros: Roșu, Iezerul Mare e Iezerul Mic.
    landscape: >-
      Entre as elevações principais destacam-se Iezerul Mare (2.462 metros), Iezerul Mic (2.409 metros) e
      Păpușa (2.391 metros). O maciço estende-se entre o rio Dâmbovița a leste e o Râul Doamnei a oeste. Pela
      crista de Mezea-Oticu articula-se com a cordilheira de Făgăraș. Estudos geomorfológicos sobre o
      permafrost fóssil destas serras foram publicados em 2018. No vale interior situa-se a albufeira de
      Râușor, represada pelo paredão alimentado pelos rios Râușor e Râul Târgului.


      A herança glaciar perdura nas lagoas. Junto à Iezeru Mare ergue-se um abrigo alpino. Na vertente oposta
      aninham-se duas lagoas menores, as Boarcăș, sob o cume do Roșu.
    wildlife: >-
      O conhecimento da fauna decorre dos projetos da Fundação Conservation Carpathia. Um censo genético de
      ursos no leste de Făgăraș, Piatra Craiului, Iezer-Păpușa e Leaota identificou 283
      [ursos-pardos](/especie/ursus_arctos/), com densidade calculada em 17-18 espécimes por cada cem
      quilómetros quadrados. A fundação monitorizou igualmente a população de
      [lobos-cinzentos](/especie/canis_lupus/) em 1.400 km² incluindo este relevo através de estudos de ADN
      iniciados em 2017.


      A Conservation Carpathia avaliou a viabilidade de criar uma rota pedestre de vários dias dedicada à
      observação da [camurça](/especie/rupicapra_rupicapra/).
    visit: >-
      Não se encontram descritos percursos balizados, refúgios com guarda ou centros interpretativos. A ideia
      da travessia de vários dias em torno da camurça constituiu apenas uma proposta técnica.
    history: O primeiro estudo genético do urso promovido pela fundação abrangeu também Iezer-Păpușa.
    before: Os melhores meses vão de junho a outubro.
    around: >-
      A três quilómetros ergue-se o [Parque Nacional Piatra
      Craiului](/lugar/parcul-national-piatra-craiului/). A oito quilómetros ficam o [Desfiladeiro do Rio
      Olt](/lugar/defileul-oltului/) e o [Parque Nacional
      Cozia](/lugar/parcul-national-cozia---codrii-seculari/). A dezanove quilómetros situam-se as [Montanhas
      de Leaota](/lugar/muntii-leaota/) e a vinte e um o [Parque Nacional
      Bucegi](/lugar/parcul-national-bucegi---vertientes-occidentales/).
