resumen:
  es: >-
    Las montañas más altas de Moravia, coronadas por el Praděd y rodeadas de praderas subalpinas y cascadas en
    desfiladeros.
  en: >-
    Moravia's highest mountains, crowned by Praděd and encircled by subalpine meadows and cascading gorge
    waterfalls.
  fr: >-
    Les plus hautes montagnes de Moravie, couronnées par le Praděd et ceinturées de prairies subalpines et de
    cascades en défilés.
  de: >-
    Die höchsten Berge Mährens, gekrönt vom Praděd und umgeben von subalpinen Wiesen und tosenden
    Klammwasserfällen.
  it: >-
    Le montagne più alte della Moravia, incoronate dal Praděd e circondate da praterie subalpine e cascate in
    gole scoscese.
  pt: >-
    As montanhas mais altas da Morávia, coroadas pelo Praděd e rodeadas por prados subalpinos e cascatas em
    desfiladeiros.
unico:
  es: >-
    Velká kotlina es el único lugar de Jeseníky donde hubo un glaciar de montaña, y su circo sigue guardando
    plantas que no crecen en ningún otro sitio del mundo.
  en: >-
    Velká kotlina is the only place in Jeseníky that hosted a mountain glacier, and its glacial cirque still
    harbors plants found nowhere else in the world.
  fr: >-
    Velká kotlina est le seul endroit de Jeseníky à avoir abrité un glacier de montagne, et son cirque
    préserve des plantes que l'on ne trouve nulle part ailleurs sur Terre.
  de: >-
    Die Velká kotlina ist der einzige Ort im Altvatergebirge, an dem ein Kargletscher existierte, und ihr
    Karkessel birgt Pflanzen, die nirgendwo sonst auf der Erde vorkommen.
  it: >-
    Velká kotlina è l'unico luogo dei Jeseníky che ha ospitato un ghiacciaio alpino, e il suo circo custodisce
    piante che non crescono in nessun altro luogo al mondo.
  pt: >-
    Velká kotlina é o único local de Jeseníky onde existiu um glaciar de montanha, e o seu circo ainda alberga
    plantas que não crescem em mais nenhum lugar do planeta.
observaciones:
  es: >-
    En toda el área protegida está prohibido acampar y hacer fuego fuera de los lugares habilitados. En las
    reservas nacionales no se puede salir de los caminos señalizados, ni escalar, ni volar en paracaídas o ala
    delta, y está prohibido coger plantas y animales. El circo de Velká kotlina es la zona de aludes más
    activa de Jeseníky, y en las reservas la prohibición de salirse de las rutas marcadas vale todo el año,
    también para esquiadores.
texto:
  es:
    intro: >-
      Por encima de los bosques de Moravia hay una tundra. En las cumbres de Hrubý Jeseník, la segunda
      cordillera más alta de Chequia, las cimas más altas conservan una naturaleza de tipo tundra nórdica, con
      los últimos restos de plantas que solo viven sin bosque. Aquí el viento manda, la niebla ronda los 294
      días del año y la nieve se queda hasta bien entrada la primavera. Y aun así, o por eso mismo, es uno de
      los rincones botánicos más ricos del país.
    landscape: >-
      Todo empezó con el hielo. Un glaciar de montaña excavó el circo de Velká kotlina, el nacimiento del río
      Moravice, y todavía se ven restos de su morrena. Lo que no hizo el glaciar lo hizo la helada: en el
      Pleistoceno el frío rompió la roca y dejó Petrovy kameny, un tor de 1.447 m rodeado de suelos
      poligonales. En la Edad Media la gente temía este sitio, porque creía que allí vivían brujas.


      Después llegó la nieve, que sigue trabajando. Se acumula a sotavento y baja en aludes por la ladera, y
      esas condiciones impiden que crezca un bosque cerrado. Es el hueco que aprovechan las hierbas. Los
      hábitats son manantiales subalpinos, turberas, pastos alpinos barridos por el viento, neveros y pastos
      altos subalpinos. Por eso un territorio de 1 km² puede reunir hábitats tan distintos.


      El clima completa el cuadro. La temperatura media anual en la reserva de Praděd es de apenas 1,3 °C, y
      en las cumbres se han medido temperaturas bajo cero incluso en julio y agosto. En la cima del Praděd la
      nieve dura de media del 30 de noviembre al 19 de abril, y en las hondonadas puede aguantar hasta julio.
      Solo hay calma unos 5,5 días al año.
    wildlife: >-
      Si quieres ver flora rara, el sitio es Velká kotlina. Se conocen unas 360 especies de plantas vasculares
      y tiene 57 especies protegidas. Dos son endemismos exclusivos: jitrocel tmavý sudetský y hvozdík
      kartouzek sudetský. Cerca de Petrovy kameny crecen otros dos, Poa riphaea y Campanula gelida. La escarda
      siberiana se encontró aquí en 1826, de nuevo hacia 1947 y, tras años de búsqueda, otra vez en 1976; y
      Gentiana verna está críticamente amenazada en Chequia. Los musgos y líquenes suman varios cientos de
      especies.


      Entre los animales, el que más suena es un colémbolo: en Velká kotlina se describió el género Jesenikia.
      La mariposa Erebia sudetica es endémica de las cumbres, y la amenaza el avance del pino mugo sobre su
      hábitat. Entre las aves, el [halcón peregrino](/especie/falco_peregrinus/) anida en las repisas de roca;
      se han registrado el pechiazul y el chorlito carambolo; y el [urogallo](/especie/tetrao_urogallus/) y el
      [gallo lira](/especie/tetrao_tetrix/) son aves raras y cada vez más escasas. Entre los mamíferos, el
      [lince](/especie/lynx_lynx/) es una especie amenazada; el [rebeco](/especie/rupicapra_rupicapra/) no es
      nativo y, igual que el [ciervo](/especie/cervus_elaphus/), daña la vegetación al ramonear, así que se
      mantienen sus poblaciones bajas. Hay también sapo común, [tritón alpino](/especie/triturus_alpestris/),
      lagartija vivípara y víbora común.
    visit: >-
      El sendero didáctico de Velká kotlina parte de Karlov pod Pradědem, sigue la señal azul y termina en
      Ovčárna, junto al río Moravice. Son seis kilómetros exigentes con paradas sobre botánica, zoología y
      geología, y le hace de guía el colémbolo Jesenikia filiformis, descubierto aquí. Lo construyó en 1971 la
      administración del área protegida, se renovó en 1988 y tiene su forma actual desde 2011. En el circo
      nacen 45 manantiales, y el de más caudal es el del Moravice.


      Si prefieres otra cosa, hay más senderos didácticos: uno alrededor del Keprník y otro con río salvaje,
      cascadas y bosque de pícea primario. Y arriba, a 73 m de altura en la torre del Praděd, hay un mirador
      desde el que, con buen tiempo, se ven Sněžka, Lysá hora y, rara vez, los Altos Tatras.
    history: >-
      El paisaje de cumbre es en parte obra humana. Švýcárna, el edificio más antiguo de la reserva, se
      levantó en 1829 para pastorear vacas al estilo suizo, y aquel pastoreo mantuvo la variedad de los pastos
      de cumbre. Hoy el pino mugo invade esos pastos y se reduce poco a poco para recuperar los hábitats
      abiertos. El ganado vuelve a pastar en Švýcárna desde 2012 y las ovejas desde 2015. Entre 1919 y 1922 el
      ejército checoslovaco usó Vysoká hole y Velká kotlina como campo de tiro, con gran destrozo. La primera
      torre de piedra del Praděd se derrumbó el 2 de mayo de 1959, poco antes de ser reparada.


      La reserva natural nacional Praděd nació el 14 de diciembre de 1990 al unirse varias reservas estatales
      anteriores, y con 2.031,40 ha es la mayor de Chequia. Hoy los expertos coinciden en que hay que segar y
      pastorear mucha más superficie. Entre 2024 y 2029 la administración prevé segar y pastorear 50 hectáreas
      al año de pastizales de alta montaña.
    before: >-
      En toda el área protegida está prohibido acampar y hacer fuego fuera de los lugares habilitados. En las
      reservas nacionales no se puede salir de los caminos señalizados, ni escalar, ni volar en paracaídas o
      ala delta, y está prohibido coger plantas y animales. El circo de Velká kotlina es la zona de aludes más
      activa de Jeseníky, y en las reservas la prohibición de salirse de las rutas marcadas vale todo el año,
      también para esquiadores.
    around: >-
      El [Macizo de Králický Sněžník](/lugar/kralicky-sneznik---masyw-snieznika/) está a unos 12 km y es la
      otra reserva nacional que exige no salirse de las rutas señalizadas.
  en:
    intro: >-
      Above the Moravian forests lies an arctic-alpine tundra. On the crests of Hrubý Jeseník, the second
      highest mountain range in Czechia, the loftiest summits preserve a Nordic tundra-like ecosystem
      harboring relic flora that can only survive beyond the tree line. Here the wind reigns supreme, fog
      blankets the heights roughly 294 days a year, and snow lingers well into spring. Even so—or precisely
      for that reason—it stands as one of the most botanically diverse enclaves in the country.
    landscape: "It all began with glacial ice. A mountain glacier excavated the cirque of Velká kotlina, cradle of the Moravice River, where remnants of its terminal moraine remain evident. What the glacier left unfinished, severe frost weathering shaped: during the Pleistocene epoch, bitter cold shattered the bedrock to leave Petrovy kameny, a prominent tor at 1,447 m surrounded by patterned polygonal ground. In the Middle Ages, locals dreaded the crags, believing witches convened here.\r\n\r\nThen came snow, which continues its relentless sculpting today. Heavy drifts accumulate on the leeward slopes and unleash recurrent avalanches, preventing closed forest canopy from establishing. This creates the open niche where specialized herbs flourish: subalpine springs, high-altitude peat bogs, wind-swept alpine grasslands, snowbed hollows, and tall-herb communities. Thus, a compact territory of 1 km² can assemble astonishingly divergent habitats.\r\n\r\nClimate completes the picture. The mean annual temperature in the Praděd reserve is barely 1.3 °C, with sub-zero temperatures recorded on the summits even in July and August. Atop Praděd, snowpack persists on average from 30 November to 19 April, surviving in sheltered ravines until July. Wind-still calm occurs on only about 5.5 days each year."
    wildlife: "If you want to see rare flora, Velká kotlina is the destination. Around 360 vascular plant species are documented, including 57 protected species. Two are strict local endemics: Plantago atrata subsp. sudetica and Dianthus carthusianorum subsp. sudeticus. Near Petrovy kameny grow two additional endemics, Poa riphaea and Campanula gelida. The Siberian bellflower was discovered here in 1826, refound around 1947, and, following decades of searching, rediscovered again in 1976; Gentiana verna is critically endangered in Czechia. Bryophytes and lichens number several hundred species.\r\n\r\nAmong invertebrates, the most renowned is a springtail: the genus Jesenikia was first described in Velká kotlina. The butterfly Erebia sudetica is endemic to these summits, threatened by the spreading dwarf mountain pine. Among birds, the [peregrine falcon](/especie/falco_peregrinus/) nests on rock ledges; bluethroats and Eurasian dotterels have been recorded; and the [western capercaillie](/especie/tetrao_urogallus/) and [black grouse](/especie/tetrao_tetrix/) are rare, declining inhabitants. Mammals include the threatened [Eurasian lynx](/especie/lynx_lynx/); the introduced [chamois](/especie/rupicapra_rupicapra/), like the [red deer](/especie/cervus_elaphus/), damages fragile flora by overbrowsing, so herds are kept small. Common toads, [alpine newts](/especie/triturus_alpestris/), viviparous lizards, and common vipers also dwell here."
    visit: "The Velká kotlina educational trail begins in Karlov pod Pradědem, follows blue trail blazes, and finishes at Ovčárna beside the Moravice River. It is a demanding hike of six kilometres featuring interpretative stops on botany, zoology, and geology, guided by the endemic springtail Jesenikia filiformis discovered here. Built in 1971 by the protected landscape administration, it was refurbished in 1988 and took its current design in 2011. Some 45 freshwater springs issue from the cirque, the Moravice spring being the most copious.\r\n\r\nIf you prefer alternative routes, additional nature trails explore the slopes: one circling Mount Keprník and another following wild torrents, waterfalls, and primeval spruce stands. High above, at 73 m up the Praděd transmission tower, an enclosed viewing deck overlooks, in clear weather, Mount Sněžka, Lysá hora, and, on rare occasions, the High Tatras."
    history: "The summit landscape is partly the product of human history. Švýcárna, the oldest refuge in the reserve, was constructed in 1829 for Swiss-style dairy cattle herding, a pastoral tradition that maintained the floristic diversity of high-altitude grasslands. Today encroaching dwarf mountain pine is selectively culled to restore open alpine habitats. Cattle grazing returned to Švýcárna in 2012, followed by sheep in 2015. Between 1919 and 1922 the Czechoslovak military used Vysoká hole and Velká kotlina as an artillery firing range, causing severe damage. The original stone viewing tower on Praděd collapsed on 2 May 1959, shortly before scheduled repairs.\r\n\r\nThe Praděd National Nature Reserve was established on 14 December 1990 by merging earlier state reserves, and with 2,031.40 ha it stands as the largest of its kind in Czechia. Conservation biologists now agree that broader swaths require mowing and controlled grazing. Between 2024 and 2029 the administration plans to mow and pasture 50 hectares of alpine grasslands annually."
    before: >-
      Throughout the protected landscape area, wild camping and lighting fires outside designated sites are
      strictly prohibited. Within national nature reserves you may not step off marked trails, climb rocks, or
      launch hang gliders or paragliders, and gathering plants or capturing wildlife is banned. The cirque of
      Velká kotlina is the most active avalanche terrain in Jeseníky, and the requirement to remain on marked
      trails applies year-round, including for winter ski-tourers.
    around: >-
      [Králický Sněžník Massif](/lugar/kralicky-sneznik---masyw-snieznika/) lies about 12 km away,
      representing another national nature reserve that strictly prohibits departing from marked trails.
  fr:
    intro: >-
      Au-dessus des forêts de Moravie s'étend une véritable toundra. Sur les crêtes du Hrubý Jeseník, deuxième
      massif le plus élevé de Tchéquie, les cimes culminantes conservent un biotope de type toundra nordique,
      refuge d'espèces végétales reliques incapables de survivre sous couvert forestier. Ici le vent règne en
      maître, le brouillard enveloppe les sommets environ 294 jours par an et la neige persiste tard dans le
      printemps. Malgré cela — ou pour cette raison même —, c'est l'un des fleurons botaniques du pays.
    landscape: "Tout a commencé par les glaces. Un glacier alpin a creusé le cirque de Velká kotlina, berceau de la rivière Moravice, dont subsistent les traces d'une moraine frontale. Ce que le glacier n'a pas achevé, le gel intense s'en est chargé : au Pléistocène, la gélifraction a disloqué la roche pour former Petrovy kameny, un chaos rocheux culminant à 1 447 m cerné de sols polygonaux. Au Moyen Âge, la population redoutait ces lieux, persuadée que les sorcières s'y rassemblaient.\r\n\r\nPuis vint la neige, qui continue d'œuvrer au quotidien. Elle s'accumule sur les versants sous le vent et dévale en avalanches, empêchant tout reboisement continu. C'est l'espace qu'exploitent les herbacées montagnardes : sources subalpines, tourbières d'altitude, pelouses alpines battues par les vents, combes à neige et mégaphorbiaies. Un espace de seulement 1 km² parvient ainsi à juxtaposer des milieux si dissemblables.\r\n\r\nLe climat parcellise le tableau. La température moyenne annuelle dans la réserve du Praděd est d'à peine 1,3 °C, des gelées étant relevées sur les crêtes même en juillet et en août. Au sommet du Praděd, la neige tient en moyenne du 30 novembre au 19 avril, persistant dans les ravines abritées jusqu'en juillet. Le calme plat n'est observé qu'environ 5,5 jours par an."
    wildlife: "Si vous souhaitez observer une flore exceptionnelle, le cirque de Velká kotlina est l'étape incontournable. On y dénombre quelque 360 espèces de plantes vasculaires, dont 57 espèces protégées. Deux d'entre elles sont de stricts endémiques locaux : Plantago atrata subsp. sudetica et Dianthus carthusianorum subsp. sudeticus. Autour de Petrovy kameny poussent deux autres endémiques, Poa riphaea et Campanula gelida. La campanule de Sibérie y fut découverte en 1826, retrouvée vers 1947 puis, après des années de prospection, de nouveau en 1976 ; Gentiana verna est en danger critique en Tchéquie. Mousses et lichens comptent plusieurs centaines d'espèces.\r\n\r\nParmi la faune, la célébrité revient à un collembole : le genre Jesenikia a été décrit à Velká kotlina. Le papillon Erebia sudetica est endémique des crêtes, menacé par l'embroussaillement du pin mugo. Côté oiseaux, le [faucon pèlerin](/especie/falco_peregrinus/) niche sur les corniches rocheuses ; la gorgebleue à miroir et le pluvier guignard y sont observés ; le [grand tétras](/especie/tetrao_urogallus/) et le [tétras lyre](/especie/tetrao_tetrix/) sont devenus très rares. Chez les mammifères, le [lynx boréal](/especie/lynx_lynx/) est menacé ; le [chamois](/especie/rupicapra_rupicapra/), allochtone, comme le [cerf élaphe](/especie/cervus_elaphus/), abîme la flore par abroutissement, justifiant la régulation des effectifs. On y croise aussi le crapaud commun, le [triton alpestre](/especie/triturus_alpestris/), le lézard vivipare et la vipère péliade."
    visit: "Le sentier d'interprétation de Velká kotlina démarre à Karlov pod Pradědem, suit le balisage bleu et s'achève à Ovčárna le long de la Moravice. C'est un parcours exigeant de six kilomètres ponctué d'arrêts sur la botanique, la faune et la géologie, guidé par le collembole Jesenikia filiformis, découvert sur place. Aménagé en 1971 par l'administration de l'aire protégée, modernisé en 1988, il arbore sa configuration actuelle depuis 2011. Le cirque compte 45 sources pérennes, la plus vigoureuse alimentant la Moravice.\r\n\r\nSi vous préférez d'autres paysages, d'autres sentiers didactiques sont proposés : l'un contourne le mont Keprník, un autre suit une rivière impétueuse, ses cascades et une pessière primaire. Tout en haut, à 73 m au-dessus du sol dans la tour du Praděd, un belvédère offre par temps clair une vue sur la Sněžka, la Lysá hora et, rarement, les Hautes Tatras."
    history: "Le paysage sommital est pour partie le fruit de l'histoire humaine. Švýcárna, le plus ancien refuge de la réserve, a été bâti en 1829 pour l'estive de vaches selon la tradition helvétique, ce pâturage maintenant ouverts les alpages d'altitude. Aujourd'hui le pin mugo colonise ces pelouses et fait l'objet d'arrachages sélectifs pour réhabiliter les clairières. Les bovins ont repris le chemin de Švýcárna en 2012 et les ovins en 2015. Entre 1919 et 1922, l'armée tchécoslovaque a utilisé Vysoká hole et Velká kotlina comme champ de tir d'artillerie, occasionnant de lourdes dégradations. La première tour de pierre du Praděd s'est effondrée le 2 mai 1959, peu avant des réparations prévues.\r\n\r\nLa réserve naturelle nationale du Praděd est née le 14 décembre 1990 de la fusion de plusieurs réserves d'État antérieures ; avec ses 2 031,40 ha, c'est la plus vaste de Tchéquie. Les écologues s'accordent sur la nécessité de faucher et de faire paître des surfaces accrues. Entre 2024 et 2029, l'administration prévoit d'entretenir 50 hectares par an de pelouses d'altitude."
    before: >-
      Dans l'ensemble de l'aire protégée, le camping sauvage et les feux sont prohibés en dehors des
      emplacements habilités. Dans les réserves nationales, il est interdit de quitter les sentiers balisés,
      de pratiquer l'escalade ou le vol libre, et de prélever plantes et animaux. Le cirque de Velká kotlina
      est le secteur à avalanches le plus dynamique du massif, et l'obligation de demeurer sur les sentiers
      balisés s'applique toute l'année, y compris pour les skieurs.
    around: >-
      Le [massif de Králický Sněžník](/lugar/kralicky-sneznik---masyw-snieznika/) se trouve à environ 12 km et
      constitue l'autre grande réserve nationale imposant de ne pas dévier des sentiers balisés.
  de:
    intro: >-
      Oberhalb der mährischen Wälder erstreckt sich eine alpine Tundra. Auf den Kämmen des Hrubý Jeseník, dem
      zweithöchsten Gebirge Tschechiens, bewahren die höchsten Gipfel einen Tundracharakter nordischer Prägung
      mit den letzten Relikten einer waldfreien Flora. Hier herrscht rauer Wind, an rund 294 Tagen im Jahr
      liegt dichter Nebel und der Schnee hält sich bis weit ins Frühjahr. Und dennoch — oder gerade deshalb —
      zählt das Gebiet zu den botanisch artenreichsten Winkeln des Landes.
    landscape: "Alles begann mit dem Eis. Ein Kargletscher grub den Kessel der Velká kotlina aus, das Quellgebiet der Moravice, wo Reste der Endmoräne erhalten sind. Was der Gletscher nicht vollendete, besorgte die Frostverwitterung: Im Pleistozän sprengte die Kälte den Fels und hinterließ Petrovy kameny, eine 1 447 m hohe Klippe, umgeben von Frostmusterböden. Im Mittelalter fürchteten die Menschen diesen Ort als Hexentreffpunkt.\r\n\r\nDanach kam der Schnee, der die Hänge bis heute formt. Er sammelt sich auf den Leeseiten und geht in Lawinen ab, was die Entstehung eines geschlossenen Waldes verhindert. Das ist die Nische spezialisierter Kräuter: subalpine Quellfluren, Hochmoore, windgeschorene alpine Rasen, Schneetälchen und alpine Hochstaudenfluren. So vereint ein kompaktes Areal von 1 km² derart gegensätzliche Lebensräume.\r\n\r\nDas Klima vervollständigt das Bild. Die Jahresmitteltemperatur im Reservat Praděd liegt bei kaum 1,3 °C; Minusgrade wurden auf den Kämmen selbst im Juli und August gemessen. Auf dem Gipfel des Praděd liegt im Schnitt vom 30. November bis zum 19. April Schnee, in tiefen Rinnen teils bis in den Juli. Windstille herrscht nur an etwa 5,5 Tagen im Jahr."
    wildlife: "Wenn du seltene Flora sehen willst, ist die Velká kotlina das Ziel. Rund 360 Gefäßpflanzenarten sind hier nachgewiesen, darunter 57 geschützte Arten. Zwei sind streng endemisch: der Sudeten-Spitzwegerich (Plantago atrata subsp. sudetica) und die Sudeten-Karthäusernelke. Nahe Petrovy kameny wachsen zwei weitere Endemiten, Poa riphaea und Campanula gelida. Die Sibirische Glockenblume wurde hier 1826 entdeckt, um 1947 wiedergefunden und nach jahrelanger Suche 1976 erneut bestätigt; Gentiana verna gilt in Tschechien als vom Aussterben bedroht. Moose und Flechten zählen mehrere hundert Arten.\r\n\r\nUnter den Tieren ist ein Springschwanz berühmt: In der Velká kotlina wurde die Gattung Jesenikia wissenschaftlich erstbeschrieben. Der Falter Erebia sudetica ist gipfelendemisch und durch die Ausbreitung der Krummholzkiefer bedroht. Bei den Vögeln nistet der [Wanderfalke](/especie/falco_peregrinus/) an Felsbändern; Blaukehlchen und Mornellregenpfeifer wurden beobachtet; [Auerhuhn](/especie/tetrao_urogallus/) und [Birkhuhn](/especie/tetrao_tetrix/) sind selten geworden. Unter den Säugetieren ist der [Eurasische Luchs](/especie/lynx_lynx/) gefährdet; die allochthone [Gämse](/especie/rupicapra_rupicapra/) schädigt wie der [Rothirsch](/especie/cervus_elaphus/) durch Verbiss die Flora, weshalb die Bestände reguliert werden. Zudem leben hier Erdkröte, [Bergmolch](/especie/triturus_alpestris/), Waldeidechse und Kreuzotter."
    visit: "Der Lehrpfad Velká kotlina beginnt in Karlov pod Pradědem, folgt der blauen Markierung und endet an der Ovčárna nahe der Moravice. Es ist eine anspruchsvolle Wanderung von sechs Kilometern mit Informationstafeln zu Botanik, Zoologie und Geologie, begleitet vom Maskottchen des Springschwanzes Jesenikia filiformis. 1971 von der Schutzgebietsverwaltung angelegt, wurde der Weg 1988 erneuert und erhielt 2011 seine jetzige Gestalt. Im Karkessel entspringen 45 Quellen, die ergiebigste speist die Moravice.\r\n\r\nWenn du etwas anderes bevorzugst, stehen weitere Lehrpfade bereit: einer um den Keprník und ein anderer entlang wilder Bergbäche, Wasserfälle und urwüchsiger Fichtenwälder. Hoch oben in 73 m Höhe bietet die Aussichtsplattform des Praděd-Fernsehturms bei klarer Sicht Blicke auf Schneekoppe, Lysá hora und selten die Hohe Tatra."
    history: "Die Hochlagenlandschaft ist teils ein Werk des Menschen. Die Švýcárna, die älteste Hütte des Reservats, wurde 1829 für die Rinderweidewirtschaft nach Schweizer Vorbild erbaut, wodurch die Bergweiden offen blieben. Heute überwuchert die Krummholzkiefer diese Rasen und wird schrittweise zurückgedrängt, um offene Habitate wiederherzustellen. Seit 2012 weiden wieder Rinder an der Švýcárna, seit 2015 auch Schafe. Zwischen 1919 und 1922 nutzte das tschechoslowakische Militär Vysoká hole und Velká kotlina als Artillerie-Schießplatz mit schweren Flurschäden. Der erste steinerne Aussichtsturm auf dem Praděd stürzte am 2. Mai 1959 ein, kurz vor geplanten Sanierungsarbeiten.\r\n\r\nDas Nationale Naturreservat Praděd entstand am 14. Dezember 1990 durch Zusammenlegung älterer staatlicher Schutzgebiete und ist mit 2 031,40 ha das größte seiner Art in Tschechien. Fachleute fordern heute eine Ausweitung von Mahd und Beweidung. Zwischen 2024 und 2029 plant die Verwaltung, jährlich 50 Hektar Hochgebirgsweiden naturschutzgerecht zu bewirtschaften."
    before: >-
      Im gesamten Landschaftsschutzgebiet ist wildes Zelten und Feuermachen außerhalb ausgewiesener Plätze
      untersagt. In den Nationalen Naturreservaten darfst du die markierten Wege nicht verlassen; Klettern,
      Paragliding sowie das Entnehmen von Pflanzen oder Tieren sind verboten. Der Kessel der Velká kotlina ist
      das lawinenaktivste Gebiet im Altvatergebirge; das Wegegebot gilt ganzjährig auch für Skitourengeher.
    around: >-
      Das Massiv des [Králický Sněžník](/lugar/kralicky-sneznik---masyw-snieznika/) liegt etwa 12 km entfernt
      und ist das andere nationale Reservat mit absolutem Wegegebot.
  it:
    intro: >-
      Al di sopra dei boschi della Moravia si distende una tundra. Sulle creste dello Hrubý Jeseník, seconda
      catena montuosa della Cechia per elevazione, le cime più alte conservano un ecosistema assimilabile alla
      tundra nordica, rifugio degli ultimi relitti floristici incapaci di tollerare la copertura forestale.
      Qui il vento domina incontrastato, la nebbia avvolge le creste per circa 294 giorni all'anno e la neve
      resiste fino a primavera inoltrata. Ciononostante — o proprio per tale rigore —, è una delle oasi
      botaniche più ricche del Paese.
    landscape: "Tutto ebbe principio con i ghiacci. Un ghiacciaio montano scavò il circo di Velká kotlina, culla del fiume Moravice, dove affiorano tuttora i resti della morena terminale. Ciò che il ghiacciaio non portò a compimento fu modellato dal gelo severo: nel Pleistocene il freddo frantumò la roccia originando Petrovy kameny, una rupe isolata di 1 447 m cinta da suoli poligonali. Nel Medioevo la gente temeva questo dirupo, credendo fosse il ritrovo di sabba e streghe.\r\n\r\nPoi giunse la neve, che non cessa di plasmare il pendio. Si accumula sottovento e precipita in valanghe, impedendo alla foresta di insediarsi stabilmente. È la nicchia vitale sfruttata dalle specie erbacee: risorgenze subalpine, torbiere, pascoli alpini battuti dal vento, vallette nivali e megaforbie. È così che un compendio di appena 1 km² raccoglie consorzi vegetali così eterogenei.\r\n\r\nIl clima rifinisce il contesto. La temperatura media annua nella riserva del Praděd è di appena 1,3 °C, registrandosi gelate sulle cime persino in luglio e agosto. Sul culmine del Praděd la neve permane in media dal 30 novembre al 19 aprile, resistendo nei canaloni riparati fino a luglio. Condizioni di bonaccia si contano solo per circa 5,5 giorni all'anno."
    wildlife: "Se vuoi osservare una flora d'eccezione, Velká kotlina è la meta irrinunciabile. Vi sono censite circa 360 specie di piante vascolari, con 57 specie protette. Due sono endemismi esclusivi: Plantago atrata subsp. sudetica e Dianthus carthusianorum subsp. sudeticus. Presso Petrovy kameny vegetano altri due endemismi, Poa riphaea e Campanula gelida. La campanula siberiana fu scoperta qui nel 1826, ritrovata attorno al 1947 e, dopo anni di ricerche, individuata di nuovo nel 1976; Gentiana verna versa in pericolo critico in Cechia. Muschi e licheni contano diverse centinaia di specie.\r\n\r\nTra gli animali la massima notorietà spetta a un collembolo: a Velká kotlina è stato descritto il genere Jesenikia. La farfalla Erebia sudetica è endemica delle creste sommitali, minacciata dall'espansione del pino mugo. Tra gli uccelli, il [falco pellegrino](/especie/falco_peregrinus/) nidifica sui terrazzi rocciosi; sono stati segnalati il pettazzurro e il piviere tortolino; l'[urogallo](/especie/tetrao_urogallus/) e il [fagiano di monte](/especie/tetrao_tetrix/) sono divenuti molto rari. Tra i mammiferi, la [lince europea](/especie/lynx_lynx/) è specie minacciata; il [camoscio alpino](/especie/rupicapra_rupicapra/), alloctono, al pari del [cervo nobile](/especie/cervus_elaphus/), arreca danni alla flora rara con il brucamento, per cui le popolazioni sono mantenute contenute. Vi abitano anche rospo comune, [tritone alpestre](/especie/triturus_alpestris/), lucertola vivipara e marasso."
    visit: "Il sentiero didattico di Velká kotlina prende le mosse da Karlov pod Pradědem, segue i segnavia blu e termina a Ovčárna, affiancando il corso del Moravice. Si tratta di sei chilometri impegnativi con stazioni a tema botanico, zoologico e geologico, accompagnati dall'effigie del collembolo Jesenikia filiformis, scoperto sul posto. Realizzato nel 1971 dall'ente parco, rinnovato nel 1988, ha assunto l'assetto odierno nel 2011. Dal circo scaturiscono 45 sorgenti, la più cospicua delle quali alimenta il Moravice.\r\n\r\nSe preferisci altri percorsi, sono fruibili ulteriori sentieri tematici: un anello attorno al Keprník e un tragitto tra rapide, cascate e peccete primigenie. In vetta, a 73 m d'altezza nella torre del Praděd, una piattaforma panoramica consente di ammirare, con cielo limpido, la Sněžka, la Lysá hora e, raramente, gli Alti Tatra."
    history: "Il paesaggio delle creste è in parte plasmato dall'attività umana. Švýcárna, il fabbricato più antico della riserva, fu eretto nel 1829 per la monticazione bovina secondo la tradizione svizzera, pascolo che mantenne aperti i prati di vetta. Oggigiorno il pino mugo tende a invadere le praterie e viene tagliato selettivamente per recuperare i biotopi aperti. Il bestiame è tornato a pascolare a Švýcárna nel 2012 e le pecore nel 2015. Tra il 1919 e il 1922 l'esercito cecoslovacco utilizzò Vysoká hole e Velká kotlina come poligono di tiro per artiglieria, arrecando gravi dissesti. La primitiva torre in pietra del Praděd crollò il 2 maggio 1959, poco prima dei lavori di restauro.\r\n\r\nLa Riserva Naturale Nazionale Praděd è stata istituita il 14 dicembre 1990 accorpando precedenti riserve statali; con 2 031,40 ha costituisce la più estesa della Repubblica Ceca. Gli studiosi concordano sulla necessità di sfalciare e pascolare superfici ben più ampie. Tra il 2024 e il 2029 l'amministrazione programma di curare 50 ettari all'anno di praterie d'alta quota."
    before: >-
      In tutta l'area protetta è vietato campeggiare e accendere fuochi all'infuori dei punti predisposti.
      Nelle riserve naturali nazionali vige il divieto assoluto di abbandonare i sentieri segnati, arrampicare
      o decollare con deltaplani e parapendii, nonché raccogliere piante o molestare animali. Il circo di
      Velká kotlina è il settore a maggior rischio valanghe dei Jeseníky, e il divieto di uscire dalle tracce
      vale tutto l'anno, anche per lo scialpinismo.
    around: >-
      Il massiccio del [Králický Sněžník](/lugar/kralicky-sneznik---masyw-snieznika/) dista circa 12 km ed è
      l'altra riserva nazionale che impone di non deviare dai sentieri tracciati.
  pt:
    intro: >-
      Acima das florestas da Morávia estende-se uma verdadeira tundra. Nas cristas de Hrubý Jeseník, a segunda
      cordilheira mais elevada da Chéquia, os cumes cimeiros conservam um ecossistema com feição de tundra
      nórdica, albergando os últimos vestígios florísticos que dependem de espaços desprovidos de arvoredo.
      Aqui o vento comanda, o nevoeiro cobre as encostas cerca de 294 dias por ano e a neve permanece até
      avançada a primavera. Ainda assim — ou precisamente por essa crueza —, constitui um dos santuários
      botânicos mais pródigos do país.
    landscape: "Tudo principiou com os glaciares. Um glaciar de montanha cavou o circo de Velká kotlina, berço do rio Moravice, onde ainda se identificam restos da sua moreia terminal. O que o glaciar não consumou foi afeiçoado pelo gelo extremo: no Plistocénico, o gelo estilhaçou a rocha originando Petrovy kameny, um relevo ruiniforme de 1 447 m circundado por solos poligonais. Na Idade Média o povo temia este escarpado, julgando que ali se reuniam bruxas.\r\n\r\nDepois fixou-se a neve, que continua o seu lavor geológico. Acumula-se a sotavento e precipita-se em avalanches encosta abaixo, condições que inviabilizam a regeneração da floresta densa. É a oportunidade colonizada pela flora herbácea: nascentes subalpinas, turfeiras de altitude, pastagens alpinas fustigadas pela ventania, covões de neve e megaforbias. É assim que uma área compacta de 1 km² reúne habitats de extrema diversidade.\r\n\r\nO clima remata o quadro. A temperatura média anual na reserva de Praděd cifra-se em escassos 1,3 °C, registando-se temperaturas negativas nas cristas até em julho e agosto. No topo do Praděd a neve aguenta-se em média de 30 de novembro a 19 de abril, subsistindo nos barrancos fundos até julho. O ar mantém-se em calmaria apenas cerca de 5,5 dias ao ano."
    wildlife: "Se quiseres ver flora invulgar, o circo de Velká kotlina é paragem obrigatória. Catalogam-se cerca de 360 espécies de plantas vasculares, incluindo 57 espécies protegidas. Duas são endemismos locais absolutos: Plantago atrata subsp. sudetica e Dianthus carthusianorum subsp. sudeticus. Junto a Petrovy kameny vicejam outros dois endemismos, Poa riphaea e Campanula gelida. A campânula-da-sibéria foi assinalada aqui em 1826, reencontrada por volta de 1947 e, após décadas de busca, colhida novamente em 1976; Gentiana verna está em perigo crítico na Chéquia. Briófitas e líquenes somam várias centenas de espécies.\r\n\r\nEntre a fauna, o maior renome cabe a um colêmbolo: em Velká kotlina foi descrito para a ciência o género Jesenikia. A borboleta Erebia sudetica é endémica das cumeadas, ameaçada pelo avanço do pinheiro-anão-da-montanha. Entre as aves, o [falcão-peregrino](/especie/falco_peregrinus/) nidifica nas saliências das fragas; observam-se o pisco-de-peito-azul e o borrelho-ruivo; o [tetraz-grande](/especie/tetrao_urogallus/) e o [galo-lira](/especie/tetrao_tetrix/) são raridades em declínio. Nos mamíferos, o [lince-euroasiático](/especie/lynx_lynx/) encontra-se ameaçado; a [camurça](/especie/rupicapra_rupicapra/), exótica, a par do [veado-vermelho](/especie/cervus_elaphus/), depaupera a flora por pastoreio, mantendo-se os efetivos reduzidos. Ocorrem também o sapo-comum, o [tritão-alpino](/especie/triturus_alpestris/), a lagartixa-vivípara e a víbora-comum."
    visit: "O percurso didático de Velká kotlina parte de Karlov pod Pradědem, segue os marcos azuis e termina na Ovčárna, bordejando o rio Moravice. São seis quilómetros exigentes pontuados por painéis de botânica, zoologia e geologia, orientados pelo colêmbolo Jesenikia filiformis, descoberto neste circo. Implantado em 1971 pela direção da área protegida, renovado em 1988, possui o traçado atual desde 2011. No circo brotam 45 nascentes, sendo a do Moravice a mais copiosa.\r\n\r\nSe preferires outro itinerário, há mais trilhos temáticos: um circuito em torno do Keprník e outro ao longo de ribeiras impetuosas, cascatas e abetais primários. No cimo, a 73 m de altura na torre do Praděd, um miradouro descortina, em dias límpidos, a Sněžka, Lysá hora e, em raras ocasiões, os Altos Tatras."
    history: "A paisagem cimeira reflete a ação humana pretérita. Švýcárna, a cabana mais vetusta da reserva, foi erigida em 1829 para a pastorícia bovina de montanha ao estilo helvético, maneio que manteve desimpedidos os prados altos. Presentemente o pinheiro-anão expande-se sobre essas clareiras, sendo cortado gradualmente para recuperar as áreas abertas. O gado bovino regressou a Švýcárna em 2012 e as ovelhas em 2015. Entre 1919 e 1922 as forças armadas checoslovacas usaram Vysoká hole e Velká kotlina como campo de manobras de tiro, com vasta devastação. A torre primitiva de pedra do Praděd colapsou a 2 de maio de 1959, pouco antes das obras de restauro.\r\n\r\nA Reserva Natural Nacional de Praděd foi criada a 14 de dezembro de 1990 agregando reservas estatais preexistentes, totalizando 2 031,40 ha, o que a torna a maior da Chéquia. Os biólogos convergem quanto à urgência de ceifar e pastorear parcelas muito maiores. Entre 2024 e 2029 a administração planeia ceifar e pastorear 50 hectares anuais de pastagens alpinas."
    before: >-
      Em toda a área protegida é interdito acampar e fazer lume fora dos locais autorizados. Nas reservas
      naturais nacionais é proibido sair dos trilhos balizados, praticar escalada ou voo livre, bem como
      colher plantas e capturar fauna. O circo de Velká kotlina é a área com maior dinâmica de avalanches de
      Jeseníky, e a imposição de caminhar apenas pelas rotas demarcadas vigora o ano todo, abrangendo
      igualmente praticantes de esqui.
    around: >-
      O maciço de [Králický Sněžník](/lugar/kralicky-sneznik---masyw-snieznika/) situa-se a cerca de 12 km,
      constituindo a outra reserva nacional que proíbe desvios dos trilhos assinalados.
