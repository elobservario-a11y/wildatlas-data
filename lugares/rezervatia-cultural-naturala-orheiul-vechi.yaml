resumen:
  es: >-
    Meandros en forma de 'S' del río Răut excavando cañones calizos sobre laderas de estepa con monasterios
    rupestres medievales.
  en: >-
    S-shaped meanders of the Răut River carving limestone canyons into steppe bluffs lined with medieval cave
    monasteries.
  fr: >-
    Méandres en « S » du Răut creusant des défilés calcaires dans des falaises steppiques abritant des
    monastères troglodytiques.
  de: >-
    S-förmige Flussschleifen des Răut schneiden Kalksteincanyons in Steppenhänge mit mittelalterlichen
    Höhlenklöstern.
  it: >-
    Meandri a 'S' del fiume Răut che incidono forre calcaree su balze di steppa con monasteri rupestri
    medievali.
  pt: >-
    Meandros em forma de 'S' do rio Răut escavando desfiladeiros calcários em escarpas de estepe com mosteiros
    rupestres medievais.
unico:
  es: >-
    Un cañón calizo con meandros, estepa y cuevas-monasterio donde un río excavó la roca y luego los hombres
    excavaron la ladera.
  en: >-
    A limestone canyon with sweeping meanders, steppe and cave hermitages where a river carved the rock and
    humans then carved the canyon walls.
  fr: >-
    Un canyon calcaire aux méandres serrés, steppe et cellules monastiques où une rivière a creusé la roche
    avant que les hommes n'y taillent leurs sanctuaires.
  de: >-
    Ein Kalksteincanyon mit Mäandern, Steppe und Höhlenklöstern, wo ein Fluss den Fels schliff und Menschen
    anschließend die Steilwand aushöhlten.
  it: >-
    Un canyon calcareo con meandri, steppa ed eremi rupestri dove un fiume ha scavato la roccia e gli uomini
    hanno successivamente scavato le pareti.
  pt: >-
    Um desfiladeiro calcário com meandros, estepe e ermidas rupestres onde um rio esculpiu a rocha e os homens
    escavaram em seguida a encosta.
observaciones:
  es: >-
    La zona general se puede visitar a cualquier hora, pero el núcleo con los puntos de interés se recomienda
    de día, hasta las primeras horas del atardecer. Los vehículos y los visitantes solo pueden circular por
    las rutas establecidas y señalizadas. Está prohibido cortar o alterar la vegetación, grabar en árboles,
    rocas o paredes de cuevas y hacer fuego en lugares públicos. La mejor época va de primavera a otoño.
texto:
  es:
    intro: >-
      El Răut no baja recto: en Orheiul Vechi se retuerce en tres meandros, Mihăilașa, Peștera y Butuceni, y
      entre vuelta y vuelta ha tallado en la caliza un desfiladero de laderas verticales. Arriba, la estepa;
      abajo, el río; y en las paredes, cuevas donde hubo monjes y todavía los hay. La Reserva Cultural-Natural
      de Orheiul Vechi, a unos 60 km al noreste de Chisináu, junta en un mismo paisaje la naturaleza y la
      historia de Moldavia.
    landscape: >-
      La base es piedra del Sarmático, de unos 13 millones de años, con un marcado carácter rupestre. Sobre
      ella el Răut ha dibujado un valle con forma de desfiladero y garganta que no pasa de uno o dos
      kilómetros de ancho. Las vertientes abruptas alcanzan de media entre 100 y 130 m sobre el río y llegan a
      170-180 m en las cotas máximas.


      En esa caliza hay dolinas, uvalas y algunos relieves de karst cónico, únicos en Moldavia. La reserva
      mezcla bosques, praderas, estepas, roquedos, ríos, terrenos agrícolas y asentamientos rurales, y la
      vegetación, a caballo entre estepa y bosque-estepa, supera las 500 plantas. Las precipitaciones medias
      son de 500 mm al año.
    wildlife: >-
      El paisaje luce en las cuatro estaciones, sobre todo al amanecer y al atardecer. Entre las aves, en la
      reserva viven unas cien especies de aves, un tercio de las de Moldavia, y hay seis rutas pensadas para
      verlas. Con suerte aparecen la oropéndola, el abejaruco, el [martín pescador](/especie/alcedo_atthis/) y
      la garceta grande, entre las aves más raras de la reserva.


      El inventario recoge 144 especies de vertebrados, además de insectos y moluscos. Tres de sus plantas
      están en la Lista Roja europea: Genista tetragona, el lirio martagón y Schivereckia podolica. También se
      citan la fritilaria, la campanilla de invierno y el helecho macho; 62 de las 500 se consideran raras y
      protegidas, y 17 están en el Libro Rojo de Moldavia. Entre los mamíferos de los bosques figura el [gato
      montés](/especie/felis_silvestris/).
    visit: >-
      Los senderos están señalizados y se pueden recorrer por libre o en salidas de medio día o de un día. El
      circuito Following the Footsteps of the Past mide siete kilómetros y medio, es fácil y lleva unas tres
      horas. Más corto es el del paisaje protegido en Trebujeni, de 3,4 km y hora y media. La ermita de Bosie
      es un circuito de 3 km, de dificultad alta, que se hace en una hora.


      Quien venga por las aves tiene tres rutas con distinto carácter: Butuceni–Piatra, de 22,25 km y unas
      siete horas y media, es la que reúne más especies; el barranco de Morova mide 15 km y lleva unas seis
      horas; la Alameda de Piatra es un paseo fácil de 4 km y una hora. También hay rutas marcadas para
      bicicleta, con alquiler en el complejo administrativo a la entrada de Butuceni, y una ruta en kayak por
      el Răut de 16,5 km y entre cinco y seis horas.


      La visita empieza en el punto de información principal o en la plataforma de observación: allí se sacan
      entradas, se recogen folletos y se contrata un guía, que habla rumano, ruso, inglés, italiano o francés.
    history: >-
      Aquí hubo una ciudad. El paisaje calizo erosionado por el río se mezcla con restos de la civilización de
      Tripolie, una fortaleza getodacia, un fuerte de la Horda de Oro y una fortaleza moldava. A mediados del
      siglo XVI los habitantes abandonaron el lugar y fundaron la actual Orhei, 15 km al noroeste.


      Del monasterio ortodoxo quedan unos pocos monjes, que mantienen la iglesia en lo alto de la colina; las
      cuevas siguen siendo capillas con inscripciones en eslavo eclesiástico antiguo. La zona se declaró
      reserva natural el 15 de marzo de 1968, en época soviética, y en 2009 el Gobierno aprobó reorganizar el
      complejo museístico como Institución Pública de la Reserva Cultural-Natural.
    before: >-
      La zona general se puede visitar a cualquier hora, pero el núcleo con los puntos de interés se
      recomienda de día, hasta las primeras horas del atardecer. Los vehículos y los visitantes solo pueden
      circular por las rutas establecidas y señalizadas. Está prohibido cortar o alterar la vegetación, grabar
      en árboles, rocas o paredes de cuevas y hacer fuego en lugares públicos. La mejor época va de primavera
      a otoño.
    around: >-
      Lejos de allí, la [Meseta de Casimcea](/lugar/podisul-casimcea---podisul-dobrogean/) comparte con
      Orheiul Vechi la estepa, el karst y el halcón sacre.
  en:
    intro: >-
      The Răut River does not flow in a straight line: at Old Orhei it twists into three successive
      meanders—Mihăilașa, Peștera and Butuceni—carving a dramatic limestone defile of sheer vertical bluffs.
      Above lies open steppe; below winds the river; and in the canyon walls appear cave cells where Orthodox
      hermits once lived and still reside today. The Old Orhei Cultural-Natural Reserve, located roughly 60 km
      northeast of Chișinău, brings nature and history together in one striking Moldovan landscape.
    landscape: >-
      The underlying bedrock consists of Sarmatian limestone dating back some 13 million years, displaying
      pronounced cliff geology. Into this foundation the Răut has incised a gorge-like defile spanning no more
      than one or two kilometres across. The sheer valley bluffs rise on average between 100 and 130 m above
      the river, attaining 170–180 m at their highest promontories.


      Within this limestone plateau, dolines, uvalas and conical karst landforms develop, unique in Moldova.
      The reserve integrates broadleaved woodlands, dry grasslands, rocky screes, river corridors,
      agricultural parcels and rural villages; its flora, poised at the transition between steppe and
      forest-steppe, exceeds 500 plant species. Average annual precipitation stands around 500 mm.
    wildlife: >-
      The canyon reveals its beauty in all four seasons, especially at dawn and sunset. About one hundred bird
      species inhabit the reserve—a third of all birds recorded in Moldova—with six designated birdwatching
      routes. With patience you may encounter the Eurasian golden oriole, European bee-eater, [common
      kingfisher](/especie/alcedo_atthis/) and great egret among the rarer avian sightings.


      The faunal inventory includes 144 vertebrate species, alongside diverse insects and molluscs. Three
      plant species feature on the European Red List: *Genista tetragona*, the martagon lily and *Schivereckia
      podolica*. Other noteworthy herbs include wild fritillaries, snowdrops and male fern; 62 of the 500
      recorded plants are classified as rare and protected, with 17 appearing in the Red Data Book of Moldova.
      Forested slopes shelter mammals like the [European wildcat](/especie/felis_silvestris/).
    visit: >-
      Waymarked footpaths allow independent exploration on half-day or full-day excursions. The «Following the
      Footsteps of the Past» trail measures seven and a half kilometres, rated easy and taking about three
      hours. A shorter option explores the protected landscape around Trebujeni over 3.4 km in an hour and a
      half. The Bosie Hermitage circuit covers 3 km of demanding terrain in an hour.


      For birdwatchers, three dedicated itineraries offer distinct habitats: Butuceni–Piatra, spanning 22.25
      km in around seven hours and a half, records the highest species diversity; the Morova ravine trail
      extends 15 km over roughly six hours; the Piatra Alley provides an easy 4 km stroll taking an hour.
      Mountain biking trails are also waymarked, with rentals available at the visitor complex in Butuceni,
      and a 16.5 km kayak descent along the Răut requires five to six hours.


      Begin your visit at the main visitor centre or observation platform, where tickets are issued, maps
      collected and guided tours booked with multilingual guides speaking Romanian, Russian, English, Italian
      or French.
    history: >-
      A historic town once flourished here. River-cut limestone bluffs intertwine with remains of the ancient
      Cucuteni-Tripolye culture, a Geto-Dacian citadel, a Golden Horde fortress and a medieval Moldovan
      stronghold. In the mid-XVI century, residents abandoned the site to establish modern Orhei, 15 km to the
      northwest.


      From the ancient Orthodox monastery, a small brotherhood maintains the hillside church; cavern cells
      preserve stone inscriptions in Old Church Slavonic. The area was declared a nature reserve on 15 March
      1968 under Soviet administration, and in 2009 the Moldovan government reorganized the museum complex
      into the Public Institution of the Cultural-Natural Reserve.
    before: >-
      The open landscape can be visited at any hour, though visiting the heritage core is best done during
      daylight until early dusk. Vehicles and hikers must keep strictly to marked routes. It is forbidden to
      damage vegetation, carve into trees, rocks or cave walls, or light fires in public areas. The most
      favourable season runs from spring to autumn.
    around: >-
      Far to the south, the [Casimcea Plateau](/lugar/podisul-casimcea---podisul-dobrogean/) shares with Old
      Orhei its open steppe grasslands, karst topography and hunting saker falcons.
  fr:
    intro: >-
      Le Răut ne coule pas en ligne droite : à Orheiul Vechi, il dessine trois méandres successifs—Mihăilașa,
      Peștera et Butuceni—taillant dans le calcaire un défilé aux parois abruptes. Au sommet, la steppe ; en
      contrebas, la rivière ; et dans les falaises, des grottes jadis habitées par des moines ermites. La
      réserve culturelle et naturelle d'Orheiul Vechi, à environ 60 km au nord-est de Chișinău, unit en un
      seul paysage nature sauvage et mémoire historique de la Moldavie.
    landscape: >-
      Le soubassement rocheux est formé de calcaires sarmatiens vieux d'environ 13 millions d'années, au
      caractère rupestre prononcé. Le Răut y a sculpté un canyon sinueux ne dépassant pas un ou deux
      kilomètres de large. Les falaises vertigineuses s'élèvent en moyenne entre 100 et 130 m au-dessus des
      eaux, culminant à 170-180 m aux points les plus hauts.


      Ce calcaire abrite dolines, ouvalas et pitons de karst conique uniques en Moldavie. La réserve mêle
      forêts, pelouses steppiques, falaises, cours d'eau et terroirs agricoles ; sa végétation, entre steppe
      et forêt-steppe, compte plus de 500 espèces végétales. Les précipitations moyennes avoisinent 500 mm par
      an.
    wildlife: >-
      Le paysage séduit en toute saison, particulièrement aux aurores et au crépuscule. Environ cent espèces
      d'oiseaux y vivent, soit un tiers de l'avifaune moldave, avec six itinéraires d'observation balisés.
      Avec un peu de chance s'observent le loriot d'Europe, le guêpier, le [martin-pêcheur
      d'Europe](/especie/alcedo_atthis/) et la grande aigrette.


      L'inventaire recense 144 espèces de vertébrés ainsi que de nombreux invertébrés. Trois plantes figurent
      sur la Liste rouge européenne : *Genista tetragona*, le lis martagon et *Schivereckia podolica*. On y
      trouve aussi la fritillaire et la perce-neige ; 62 des 500 espèces sont considérées comme rares et
      protégées, et 17 figurent au Livre rouge de Moldavie. Les taillis boisés abritent des mammifères comme
      le [chat sauvage](/especie/felis_silvestris/).
    visit: >-
      Les sentiers sont balisés et se parcourent librement ou en excursions guidées. Le circuit « Sur les pas
      du passé » s'étend sur sept kilomètres et demi, facile et bouclé en environ trois heures. Plus court, le
      sentier de Trebujeni fait 3,4 km en une heure et demie. L'ermitage de Bosie propose une boucle de 3 km
      plus escarpée en une heure.


      Pour l'observation ornithologique, trois circuits se distinguent : Butuceni–Piatra, long de 22,25 km en
      sept heures et demie environ, concentre le plus d'espèces ; le ravin de Morova mesure 15 km en six
      heures ; l'allée de Piatra offre une promenade aisée de 4 km en une heure. Des pistes cyclables sont
      jalonnées avec location à Butuceni, et une descente en kayak de 16,5 km sur le Răut requiert entre cinq
      et six heures.


      La visite débute au pavillon d'accueil ou au belvédère panoramique pour retirer billets et plans ou
      réserver un guide parlant roumain, russe, anglais, italien ou français.
    history: >-
      Une véritable cité s'épanouit jadis ici. Les falaises érodées côtoient les vestiges de la culture de
      Cucuteni-Tripolie, une forteresse géto-dace, un poste de la Horde d'Or et une citadelle moldave. Au
      milieu du XVI siècle, les habitants délaissèrent le site pour fonder l'actuelle Orhei, 15 km au
      nord-ouest.


      Du couvent troglodytique subsistent quelques moines veillant sur l'église sommitale ; les grottes
      conservent des inscriptions en vieux-slave. Le site fut classé réserve naturelle le 15 mars 1968 sous
      l'administration soviétique, et en 2009 le gouvernement a réorganisé le complexe sous le statut
      d'institution publique de réserve culturelle et naturelle.
    before: >-
      Le site naturel est accessible en tout temps, mais la visite des cavités et monuments est conseillée de
      jour jusqu'au crépuscule. Véhicules et promeneurs doivent impérativement rester sur les pistes balisées.
      Il est interdit d'arracher la végétation, de graver roches et parois et d'allumer des feux. La meilleure
      saison s'étend du printemps à l'automne.
    around: >-
      Plus au sud, le [plateau de Casimcea](/lugar/podisul-casimcea---podisul-dobrogean/) partage avec Orheiul
      Vechi paysages de steppe, reliefs karstiques et faucons sacres.
  de:
    intro: >-
      Der Răut fließt nicht geradlinig: Bei Orheiul Vechi windet er sich in drei markanten
      Flussschleifen—Mihăilașa, Peștera und Butuceni—und hat eine enge Schlucht mit senkrechten
      Kalksteinwänden geschaffen. Oben erstreckt sich die Steppe, unten schlängelt sich der Fluss, und in den
      Felswänden verbergen sich Höhlen, in denen einst Mönche lebten und noch heute beten. Das Kultur- und
      Naturreservat Orheiul Vechi, rund 60 km nordöstlich von Chișinău gelegen, vereint Natur und moldawische
      Geschichte in einer spektakulären Kulisse.
    landscape: >-
      Das Fundament besteht aus sarmatischem Kalkstein, der rund 13 Millionen Jahre alt ist und schroffe
      Felswände bildet. Darin hat der Răut eine klammartige Schlucht von kaum ein bis zwei Kilometern Breite
      gegraben. Die senkrechten Steilhänge ragen im Schnitt 100 bis 130 m über den Fluss auf und erreichen an
      den höchsten Kuppen 170-180 m Höhe.


      In den Kalkschichten finden sich Dolinen, Uvalas und isolierte Kegelkarst-Formen, die in Moldawien
      einzigartig sind. Das Schutzgebiet umfasst Wälder, Steppenwiesen, Felsbänder, Auen und dörfliche
      Siedlungen; die Flora im Übergang von Steppe zu Waldsteppe zählt mehr als 500 Pflanzenarten. Der
      mittlere Jahresniederschlag liegt bei 500 mm.
    wildlife: >-
      Die Landschaft fasziniert zu allen vier Jahreszeiten, besonders bei Sonnenaufgang und Dämmerung. Rund
      einhundert Vogelarten leben im Reservat—ein Drittel aller Arten Moldawiens—erschlossen über sechs
      Beobachtungsrouten. Mit etwas Geduld lassen sich Pirol, Bienenfresser,
      [Eisvogel](/especie/alcedo_atthis/) und Silberreiher sichten.


      Das Inventar zählt 144 Wirbeltierarten sowie zahlreiche Insekten und Mollusken. Drei Pflanzen stehen auf
      der europäischen Roten Liste: *Genista tetragona*, die Türkenbund-Lilie und *Schivereckia podolica*.
      Auch Schachblumen und Schneeglöckchen gedeihen hier; 62 der 500 Pflanzenarten gelten als selten und
      geschützt, 17 sind im Roten Buch Moldawiens aufgeführt. In den Buschwäldern streift die
      [Wildkatze](/especie/felis_silvestris/).
    visit: >-
      Markierte Pfade laden zu halbtägigen oder ganztägigen Touren ein. Der Rundweg «Auf den Spuren der
      Vergangenheit» misst siebeneinhalb Kilometer, ist leicht begehbar und dauert rund drei Stunden. Kürzere
      Einblicke bietet der Weg bei Trebujeni mit 3,4 km in eineinhalb Stunden. Der Rundgang zur Einsiedelei
      Bosie überwindet 3 km steiles Terrain in einer Stunde.


      Für Vogelbeobachter gibt es drei Pfade: Butuceni–Piatra über 22,25 km in etwa siebeneinhalb Stunden mit
      der höchsten Artenvielfalt; die Morova-Schlucht über 15 km in sechs Stunden; die Piatra-Allee als
      bequemer Spaziergang über 4 km in einer Stunde. Auch Radwege sind ausgeschildert (Verleih in Butuceni),
      und eine Kajakfahrt über 16,5 km auf dem Răut erfordert fünf bis sechs Stunden.


      Der Besuch beginnt am Infozentrum oder der Aussichtsplattform: Hier erhältst du Karten und kannst
      Führungen buchen (auf Rumänisch, Russisch, Englisch, Italienisch oder Französisch).
    history: >-
      Einst blühte hier eine befestigte Stadt. Kalksteinfelsen verweben sich mit Spuren der Tripolje-Kultur,
      einer geto-dakischen Festung, einem Stützpunkt der Goldenen Horde und einer moldawischen Burg. Mitte des
      XVI Jahrhunderts verließen die Bewohner die Enge und gründeten das heutige Orhei, 15 km nordwestlich.


      Vom Felsenkloster betreuen wenige Mönche die Kirche; Felsenkapellen tragen Inschriften in
      Altkirchenslawisch. Das Areal wurde am 15. März 1968 unter sowjetischer Verwaltung zum Naturschutzgebiet
      erklärt; 2009 reorganisierte die Regierung den Museumskomplex als öffentliche Institution.
    before: >-
      Das Gelände steht ganztägig offen, doch der Besuch historischer Höhlen empfiehlt sich bei Tageslicht.
      Fahrzeuge und Wanderer dürfen markierte Wege nicht verlassen. Das Beschädigen von Pflanzen, Einritzen
      von Felswänden und Entfachen von Feuern ist verboten. Die beste Reisezeit reicht von Frühling bis
      Herbst.
    around: >-
      Weiter südlich teilt das [Casimcea-Plateau](/lugar/podisul-casimcea---podisul-dobrogean/) mit Orheiul
      Vechi Steppenfluren, Karstformationen und den Sakerfalken.
  it:
    intro: >-
      Il Răut non scorre diritto: a Orheiul Vechi si snoda in tre meandri successivi—Mihăilașa, Peștera e
      Butuceni—incidendo nel calcare una forra dalle pareti strapiombanti. In alto la steppa, in basso il
      fiume, e lungo i costoni grotte dove vissero e vivono tuttora monaci eremiti. La Riserva
      culturale-naturale di Orheiul Vechi, a circa 60 km a nord-est di Chișinău, riunisce in uno scenario
      armonioso la natura e la storia della Moldavia.
    landscape: >-
      L'ossatura geologica poggia su calcari sarmatici di circa 13 milioni di anni fa dal pronunciato profilo
      rupestre. Su questo substrato il Răut ha disegnato una gola sinuosa larga non più di uno o due
      chilometri. Le balze scoscese si innalzano mediamente tra 100 e 130 m sopra il greto, toccando i 170-180
      m sui crinali sommitali.


      Nel calcare si sviluppano doline, uvala e forme di carso conico inconsuete in Moldavia. La riserva
      accoglie boschi, praterie steppiche, falesie, corsi d'acqua e minuscoli villaggi; la flora di
      transizione tra steppa e foresta-steppa supera le 500 specie vegetali. Le piogge medie si attestano
      attorno a 500 mm annui.
    wildlife: >-
      Il paesaggio risplende nelle quattro stagioni, specie all'alba e al crepuscolo. Nel comprensorio vivono
      circa cento specie di uccelli—un terzo di tutta la Moldavia—con sei percorsi dedicati al birdwatching.
      Con un pizzico di fortuna si scorgono il rigogolo, il gruccione, il [martin
      pescatore](/especie/alcedo_atthis/) e l'airone bianco maggiore.


      L'inventario segnala 144 specie di vertebrati oltre a insetti e molluschi. Tre piante compaiono nella
      Lista Rossa europea: *Genista tetragona*, il giglio martagone e *Schivereckia podolica*. Sono presenti
      bucaneve e felce maschio; 62 delle 500 specie censite sono considerate rare e protette, e 17 figurano
      nel Libro Rosso della Moldavia. I boschi ospitano mammiferi schivi come il [gatto
      selvatico](/especie/felis_silvestris/).
    visit: >-
      I sentieri sono segnati e si prestano a gite di mezza giornata o di un'intera giornata. Il percorso
      «Sulle orme del passato» copre sette chilometri e mezzo, facile e percorribile in circa tre ore. Più
      breve è il tracciato paesaggistico di Trebujeni, di 3,4 km in un'ora e mezza. L'eremo di Bosie è un
      anello di 3 km su terreno ripido in un'ora.


      Per gli amanti dell'avifauna esistono tre itinerari: Butuceni–Piatra di 22,25 km in circa sette ore e
      mezza, il più ricco di specie; la gola di Morova di 15 km in circa sei ore; l'alberata di Piatra di 4 km
      in un'ora. Non mancano percorsi ciclabili segnalati (con noleggio a Butuceni) e una discesa in kayak sul
      Răut di 16,5 km tra cinque e sei ore.


      Il punto di partenza è il centro visite o la terrazza belvedere, dove reperire mappe e concordare guide
      parlanti rumeno, russo, inglese, italiano o francese.
    history: >-
      In passato qui sorgeva una fiorente città. Le rocce erose si fondono con vestigia della civiltà
      Cucuteni-Tripolye, una fortezza geto-dacica, un avamposto dell'Orda d'Oro e una cittadella moldava. A
      metà del XVI secolo gli abitanti abbandonarono il colle fondando l'attuale Orhei, 15 km a nord-ovest.


      Dell'antico complesso rupestre rimane un piccolo cenobio che custodisce la chiesa; le grotte serbano
      iscrizioni in antico slavo ecclesiastico. L'area è stata dichiarata riserva naturale il 15 marzo 1968
      sotto l'URSS e nel 2009 il governo ha formalizzato la riserva culturale-naturale.
    before: >-
      L'accesso all'area generale è libero in ogni momento, ma la visita ai monumenti rupestri è opportuna con
      luce diurna fino al tramonto. Veicoli ed escursionisti devono restare sulle vie tracciate. È vietato
      danneggiare la vegetazione, incidere rocce e accendere fuochi. La stagione ideale va da primavera ad
      autunno.
    around: >-
      Più a sud, l'[Altopiano di Casimcea](/lugar/podisul-casimcea---podisul-dobrogean/) condivide con Orheiul
      Vechi la steppa, i rilievi carsici e il falco sacro.
  pt:
    intro: >-
      O rio Răut não segue em linha reta: em Orheiul Vechi serpenteia em três meandros sucessivos—Mihăilașa,
      Peștera e Butuceni—esculpindo no calcário um desfiladeiro de vertentes a pique. No topo abre-se a
      estepe; no fundo corre o rio; e nas paredes rochosas escondem-se grutas onde monges habitaram e ainda
      habitam. A Reserva Cultural-Natural de Orheiul Vechi, cerca de 60 km a nordeste de Chișinău, conjuga num
      só cenário a natureza e a história viva da Moldávia.
    landscape: >-
      A base geológica é constituída por calcários do Sarmaciano com cerca de 13 milhões de anos, conferindo
      um vincado relevo de arribas. Nela o Răut desenhou uma garganta sinuosa que não ultrapassa um a dois
      quilómetros de largura. As escarpas elevam-se em média entre 100 e 130 m acima do rio, alcançando
      170-180 m nos cômoros mais altos.


      No calcário desenvolvem-se dolinas, uvalas e relevos de carso cónico singulares na Moldávia. A reserva
      abrange bosques, pradarias estépicas, escarpas, cursos de água e pequenos povoados; a flora, na
      transição entre estepe e floresta-estepe, supera as 500 espécies de plantas. A pluviosidade média
      situa-se nos 500 mm anuais.
    wildlife: >-
      A paisagem resplandece nas quatro estações, com especial encanto ao romper do dia e ao pôr do sol. Cerca
      de cem espécies de aves residem na reserva—um terço de toda a avifauna moldava—com seis percursos de
      observação balizados. Com alguma sorte avistam-se o papa-figos, o abelharuco, o
      [guarda-rios-comum](/especie/alcedo_atthis/) e a garça-branca-grande.


      O inventário totaliza 144 espécies de vertebrados, a par de insetos e moluscos. Três plantas integram a
      Lista Vermelha europeia: *Genista tetragona*, o lírio-martagão e *Schivereckia podolica*. Contam-se
      ainda a campainha-branca e o feto-macho; 62 das 500 espécies são consideradas raras e protegidas, e 17
      constam do Livro Vermelho da Moldávia. Nos matagais arborizados vagueia o
      [gato-bravo](/especie/felis_silvestris/).
    visit: >-
      Os trilhos encontram-se sinalizados e podem ser percorridos livremente ou em passeios de meio dia ou dia
      inteiro. O circuito «Nas pegadas do passado» estende-se por sete quilómetros e meio, fácil e cumprido em
      cerca de três horas. Mais curto é o roteiro paisagístico de Trebujeni, com 3,4 km em hora e meia. A
      ermida de Bosie faz-se num circuito de 3 km de maior declive em uma hora.


      Para observadores de aves existem três opções: Butuceni–Piatra, com 22,25 km em cerca de sete horas e
      meia, com a maior diversidade faunística; a ravina de Morova com 15 km em cerca de seis horas; a Alameda
      de Piatra num passeio acessível de 4 km em uma hora. Há circuitos de BTT balizados (com aluguer em
      Butuceni) e uma descida de caiaque no Răut de 16,5 km entre cinco e seis horas.


      O ponto de partida é o centro de acolhimento ou o miradouro, onde se adquirem bilhetes e se solicitam
      guias falantes de romeno, russo, inglês, italiano ou francês.
    history: >-
      Aqui floresceu outrora uma cidade histórica. As escarpas erodidas guardam vestígios da cultura
      Cucuteni-Tripolie, uma fortaleza geto-dácia, um reduto da Horda Dourada e um baluarte moldavo. A meados
      do século XVI a população abandonou o local para fundar a atual Orhei, 15 km a noroeste.


      Do mosteiro rupestre resta uma pequena comunidade monástica junto à igreja cimeira; as grutas conservam
      inscrições em antigo eslavo eclesiástico. A área foi declarada reserva natural a 15 de março de 1968 sob
      administração soviética, e em 2009 o governo instituiu a reserva cultural-natural.
    before: >-
      A área ampla pode ser visitada a qualquer hora, mas o núcleo monumental recomenda-se de dia até ao
      anoitecer. Veículos e pedestrianistas devem manter-se rigorosamente nos caminhos marcados. É proibido
      danificar plantas, gravar rochas ou fazer fogueiras. O melhor período decorre da primavera ao outono.
    around: >-
      Mais a sul, o [Planalto de Casimcea](/lugar/podisul-casimcea---podisul-dobrogean/) partilha com Orheiul
      Vechi paisagens de estepe, formações cársticas e o falcão-sacre.
