resumen:
  es: El mayor conjunto de bosques primarios de Eslovaquia contiguo a las praderas de cumbre (*poloniny*).
  en: >-
    Slovakia’s largest tract of virgin primeval beech forests contiguous with subalpine ridge meadows
    (*poloniny*).
  fr: >-
    Le plus grand ensemble de forêts primaires de hêtres de Slovaquie, contigu aux pelouses sommitales
    (*poloniny*).
  de: >-
    Größter zusammenhängender Komplex von Buchen-Urwäldern der Slowakei an den subalpinen Hochweiden
    (*Poloniny*).
  it: >-
    Il più grande complesso di faggete primordiali della Slovacchia contiguo ai pascoli alpini di crinale
    (*poloniny*).
  pt: >-
    O maior conjunto de florestas primárias de faias da Eslováquia contíguo aos prados de cumeada
    (*poloniny*).
unico:
  es: >-
    Reúne tres bosques primarios de haya declarados Patrimonio Mundial y la única manada libre de bisontes de
    Eslovaquia, bajo prados de cresta que no existen en ninguna otra parte del país.
  en: >-
    Brings together three World Heritage primeval beech forests and Slovakia’s only wild bison herd beneath
    subalpine ridge meadows found nowhere else in the country.
  fr: >-
    Rassemble trois forêts primaires de hêtres classées au patrimoine mondial et la seule harde de bisons
    libres de Slovaquie, sous des crêtes herbeuses uniques dans le pays.
  de: >-
    Vereint drei zum Weltnaturerbe zählende Buchenurwälder und die einzige freilebende Wisentherde der
    Slowakei unter einzigartigen Bergwiesen.
  it: >-
    Riunisce tre faggete primordiali dichiarate patrimonio mondiale e l’unica mandria libera di bisonti della
    Slovacchia, sotto praterie di cresta esclusive nel paese.
  pt: >-
    Reúne três florestas primárias de faias classificadas como Património Mundial e a única manada livre de
    bisontes da Eslováquia, sob prados de cumeada exclusivos no país.
observaciones:
  es: >-
    Ante el oso, el gestor aconseja evitar andar al anochecer y al amanecer, ir por los senderos marcados,
    avisar de tu presencia sin ruido y llevar al perro atado. Se puede hacer fuego solo en hogueras
    designadas, cerca de edificaciones y a menos de 10 metros de ellas. Havešová solo se visita acompañado por
    personal del parque: pregunta al gestor cómo y cuándo se organiza. Comprueba antes de ir el estado del
    centro de información de Nová Sedlica.
texto:
  es:
    intro: >-
      En el extremo oriental de Eslovaquia, donde el país toca Polonia y Ucrania, el bosque no se acaba en una
      frontera. Poloniny es el parque nacional más oriental del país y el de mayor concentración de bosques
      primarios de Eslovaquia: cerca del 80 % de su superficie es bosque, con predominio del hayedo y del
      hayedo-abetal, y en lo alto de las crestas se abren las poloniny, prados floridos de montaña que dan
      nombre al parque. Tres de sus bosques primarios, Stužica, Havešová y Rožok, son Patrimonio Mundial de la
      UNESCO desde el 28 de junio de 2007, y el parque es el único lugar de Eslovaquia donde vive en libertad
      el bisonte europeo.
    landscape: >-
      El parque pertenece a la unidad de Dukla de la zona de flysch: capas rítmicas de arcillas y areniscas
      que se depositaron entre hace 70 y 42 millones de años, cuando el mar Tetis cubría la zona. El relieve
      es de crestas largas y valles hondos, y la cresta fronteriza con Polonia es la divisoria de aguas
      europea entre el Báltico y el mar Negro. Los inviernos son largos: la nieve dura de noviembre a abril, y
      en las crestas, más de 160 días. En total caen entre 800 y 1 000 mm al año.


      Con tanto desnivel, el bosque cambia a medida que subes. En lo más bajo y cálido hay robledal-carpinar.
      El hayedo ocupa la mayor extensión, y el abeto blanco sube a las zonas altas y húmedas. Por encima de
      1000 m, bajo el límite del bosque, el clima áspero deja el haya y el arce bajos y retorcidos. Y más
      arriba están las poloniny, prados que en su mayoría son comunidades secundarias, surgidas por el
      pastoreo de ganado en las crestas.


      Poloniny es además la frontera botánica entre los Cárpatos Orientales y los Occidentales, con más de
      1000 especies de plantas superiores. El Ranunculus carpaticus, endémico de los Cárpatos Orientales, solo
      se conoce en Eslovaquia de un lugar del parque. La flor del logotipo es el eléboro purpúreo, porque
      cuando se creó el logo solo se conocía en Eslovaquia en este territorio. En los prados de las zonas
      bajas y medias crecen varias orquídeas.
    wildlife: >-
      El gran protagonista es el [bisonte europeo](/especie/bison_bonasus/), el mayor mamífero terrestre de
      Europa. En 2004 se inició la reintroducción de una población libre, y desde entonces se importaron 11
      bisontes (8 hembras y tres machos), y la manada se refuerza con ejemplares polacos. Se eligió el valle
      de Ruské, en la zona de protección del embalse de Starina, un lugar despoblado en los años 80 donde ya
      había rastros de bisonte. A finales de junio de 2006 nació el primer bisonte en libertad del parque.


      Aquí viven también el [oso pardo](/especie/ursus_arctos/), el [lobo](/especie/canis_lupus/), el
      [lince](/especie/lynx_lynx/), la [nutria](/especie/lutra_lutra/) y el [gato
      montés](/especie/felis_silvestris/). Entre las aves, Poloniny es una de las cinco mejores zonas de
      Eslovaquia para la cría del chotacabras, el [guión de codornices](/especie/crex_crex/) y el grévol, y
      anidan con regularidad el [águila pomerana](/especie/aquila_pomarina/), el [cárabo
      uralense](/especie/strix_uralensis/) y el [pico dorsiblanco](/especie/dendrocopos_leucotos/). Entre los
      reptiles destaca la [culebra de Esculapio](/especie/elaphe_longissima/).
    visit: >-
      Los tres bosques primarios se visitan de tres maneras distintas. Stužica, la reserva más extensa, se
      recorre por el sendero rojo de Nová Sedlica a Kremenec, que la atraviesa; el haya llega allí a 220-250
      años y el abeto, reina de los árboles, puede pasar de 400. Rožok tiene un sendero didáctico circular,
      marcado en verde, de dificultad media y con cinco paradas con paneles. Havešová, en cambio, no tiene
      ningún sendero turístico: solo se visita con personal del parque por un camino forestal antiguo sin
      acondicionar. Allí, en suelo arcilloso fértil, las hayas alcanzan tamaños récord, con troncos de hasta
      58 m según el gestor.


      El sendero rojo de la cresta sale de Nová Sedlica, el pueblo más oriental de Eslovaquia (416 m), cruza
      la reserva de Stužica y llega al Kremenec, donde se juntan Eslovaquia, Polonia y Ucrania. Desde Nová
      Sedlica, por el valle más largo del parque, se sube a Riaba skala, que da la mejor vista del parque.
      Desde Runina se sube a la collada Komúrny, donde están los mejores prados de poloniny del parque. Hay
      una ruta ciclista amarilla de 7,0 km de Nová Sedlica a Zboj, apta para bicicleta de montaña, y en
      invierno el parque está abierto con senderos de esquí de fondo.


      Y hay un sendero que une las iglesias de madera de Uličské Krivé (1718), Ruský Potok (1740) y Topoľa
      (1650).
    history: >-
      El Parque Nacional Poloniny se creó el 1 de octubre de 1997 y limita con el Parque Nacional de
      Bieszczady, en Polonia. En 1998 recibió el Diploma del Consejo de Europa. En 1993 se incluyó en la
      Reserva de la Biosfera Cárpatos Orientales junto con Polonia, y en 1999 se sumaron áreas de Ucrania: la
      primera reserva de la biosfera trilateral del mundo. Más de un tercio de los animales forestales y más
      de la mitad de los hongos del bosque dependen de la madera muerta, y es una de las claves de reservas
      como Havešová. En Rožok, el volumen de madera en fase óptima, 1029,42 m³/ha, es el máximo medido en los
      hayedos primarios de Eslovaquia.
    before: >-
      Ante el oso, el gestor aconseja evitar andar al anochecer y al amanecer, ir por los senderos marcados,
      avisar de tu presencia sin ruido y llevar al perro atado. Se puede hacer fuego solo en hogueras
      designadas, cerca de edificaciones y a menos de 10 metros de ellas. Havešová solo se visita acompañado
      por personal del parque: pregunta al gestor cómo y cuándo se organiza. Comprueba antes de ir el estado
      del centro de información de Nová Sedlica.
    around: >-
      El parque engloba tres reservas del atlas: [Havešová](/lugar/narodna-prirodna-rezervacia-havesova/),
      [Rožok](/lugar/narodna-prirodna-rezervacia-rozok/) y
      [Stužica](/lugar/narodna-prirodna-rezervacia-stuzica/). Justo al lado, a 1 km, está el [Parque Nacional
      de Bieszczady](/lugar/bieszczadzki-park-narodowy---kompleks-lesny/), en Polonia, que forma con él parte
      de la Reserva de la Biosfera Cárpatos Orientales, y a 11 km el [Bosque Virgen de
      Vihorlat](/lugar/prales-vihorlat---morske-oko/).


      Más lejos, hay lugares que comparten con él el haya, el lince y el lobo: la [Reserva del Bosque Primario
      de Slătioara](/lugar/rezervatia-codrul-secular-slatioara/), la [Reserva Estricta de Hajdučki i Rožanski
      Kukovi](/lugar/hajducki-i-rozanski-kukovi---stroga-rezervat/) y el [Bosque Virgen de
      Perućica](/lugar/prasuma-perucica---nacionalni-park-sutjeska/); y el [Parque Nacional de
      Białowieża](/lugar/bialowieski-park-narodowy---rezerwat-scisly/) comparte además el bisonte.
  en:
    intro: >-
      In Slovakia's easternmost corner, where the country touches Poland and Ukraine, the forest does not stop
      at a border. Poloniny is the nation's easternmost national park and harbours the greatest concentration
      of virgin primeval forests in Slovakia: nearly 80 % of its territory is forested, dominated by beech and
      mixed beech-fir stands, while along the high mountain crests unfurl the *poloniny*, flower-rich
      subalpine meadows that give the park its name. Three of its primeval forests—Stužica, Havešová, and
      Rožok—have been inscribed on the UNESCO World Heritage list since 28 June 2007, and the park is the only
      place in Slovakia where the European bison roams freely in the wild.
    landscape: >-
      The park belongs to the Dukla tectonic unit of the Flysch Belt: rhythmic strata of shales and sandstones
      deposited between 70 and 42 million years ago when the Tethys Ocean covered the region. The topography
      features long parallel ridges and deep valleys, and the border crest with Poland marks the European
      continental divide between the Baltic and Black seas. Winters are long: snow blankets the ground from
      November to April, lasting over 160 days on the windswept crests. Total annual precipitation ranges
      between 800 and 1,000 mm.


      With such relief, the vegetation shifts as you ascend. In the warmest lower reaches grow oak-hornbeam
      woods. Beech forest covers the largest expanse, while silver fir climbs into the high, humid valleys.
      Above 1000 m, beneath the upper timberline, the harsh mountain climate dwarfs beech and sycamore maple
      into gnarled, stunted forms. Higher still lie the *poloniny*, semi-natural subalpine meadows shaped by
      centuries of traditional livestock grazing along the ridges.


      Poloniny also marks the botanical boundary between the Eastern and Western Carpathians, boasting more
      than 1000 vascular plant species. The Carpathian buttercup (*Ranunculus carpaticus*), endemic to the
      Eastern Carpathians, is known in Slovakia from only a single station in this park. The park's emblem
      flower is the purple hellebore, chosen because when the logo was designed the plant was known in
      Slovakia exclusively from this territory. Lowland and mid-elevation meadows also nurture numerous wild
      orchids.
    wildlife: >-
      The undisputed star is the [European bison](/especie/bison_bonasus/), Europe's largest native land
      mammal. In 2004, a reintroduction project was launched to establish a free-ranging herd, initially
      importing 11 bison (8 females and three males), with subsequent animals introduced from Polish
      populations. The release site was the secluded Ruské valley within the Starina reservoir protection
      zone, an area depopulated in the 80s where wandering bison tracks had already been spotted. In late June
      2006, the first wild-born bison calf was born in the park.


      Other native inhabitants include the [brown bear](/especie/ursus_arctos/),
      [wolf](/especie/canis_lupus/), [Eurasian lynx](/especie/lynx_lynx/), [Eurasian
      otter](/especie/lutra_lutra/), and [European wildcat](/especie/felis_silvestris/). Poloniny ranks among
      the five most vital areas in Slovakia for breeding European nightjar, [corncrake](/especie/crex_crex/),
      and hazel grouse, while regular breeders include the [lesser spotted eagle](/especie/aquila_pomarina/),
      [Ural owl](/especie/strix_uralensis/), and [white-backed woodpecker](/especie/dendrocopos_leucotos/).
      Reptiles are represented by the rare [Aesculapian snake](/especie/elaphe_longissima/).
    visit: >-
      The three primeval forests are experienced in three distinct ways. Stužica, the largest reserve, is
      traversed by the red-marked ridge trail from Nová Sedlica to Mount Kremenec; here beech trees reach
      220-250 years of age, while majestic silver firs exceed 400 years. Rožok features a circular
      green-marked educational trail of moderate difficulty with five interpretive stops. Havešová, by
      contrast, has no tourist paths: it can be visited only on official park ranger excursions along an
      unpaved historical logging lane. There, on nutrient-rich clay soils, beeches achieve record dimensions,
      with trunks soaring up to 58 m according to park measurements.


      The red ridge trail departs from Nová Sedlica, Slovakia's easternmost settlement (416 m), crosses the
      Stužica reserve, and reaches Kremenec, the tripoint where Slovakia, Poland, and Ukraine meet. From Nová
      Sedlica, a trail through the park's longest valley ascends to Riaba Skala for panoramic vistas. From
      Runina, a route climbs to the Komúrny saddle, home to the park's finest *poloniny* meadows. A
      yellow-marked cycling trail runs 7.0 km from Nová Sedlica to Zboj for mountain biking, while in winter
      marked cross-country ski trails open across the snowbound landscape.


      A dedicated heritage trail links historic wooden churches at Uličské Krivé (1718), Ruský Potok (1740),
      and Topoľa (1650).
    history: >-
      Poloniny National Park was officially established on 1 October 1997, sharing its northern border with
      Bieszczady National Park in Poland. In 1998 it was awarded the Council of Europe Diploma. In 1993 it was
      incorporated into the East Carpathians Biosphere Reserve alongside Poland, and in 1999 Ukrainian sectors
      were added to create the world's first trilateral biosphere reserve. More than a third of woodland
      animal species and over half of forest fungi depend directly on deadwood, a crucial ecological pillar of
      reserves like Havešová. At Rožok, the volume of standing and lying deadwood during the climax phase
      reaches 1029.42 m³/ha, the highest recorded in any Slovak primeval beech forest.
    before: >-
      To avoid bear encounters, park authorities advise avoiding hiking at dawn and dusk, staying on marked
      trails, making presence known without shouting, and keeping dogs strictly leashed. Open campfires are
      permitted only at designated fire pits located within 10 metres of shelter buildings. Havešová may be
      visited only when accompanied by park rangers: contact the park administration in advance to arrange
      dates. Check the operational status of the Nová Sedlica information centre before setting out.
    around: >-
      The park encompasses three reserves detailed in this atlas:
      [Havešová](/lugar/narodna-prirodna-rezervacia-havesova/),
      [Rožok](/lugar/narodna-prirodna-rezervacia-rozok/), and
      [Stužica](/lugar/narodna-prirodna-rezervacia-stuzica/). Immediately adjacent, 1 km away, lies
      [Bieszczady National Park - Forest Complex](/lugar/bieszczadzki-park-narodowy---kompleks-lesny/) in
      Poland, sharing the trilateral biosphere reserve, while [Vihorlat Primeval Forest - Morské
      Oko](/lugar/prales-vihorlat---morske-oko/) lies 11 km to the southwest.


      Further afield, other ancient reserves share virgin beech woods, lynx, and wolves: [Slătioara Primeval
      Forest Reserve](/lugar/rezervatia-codrul-secular-slatioara/), [Hajdučki and Rožanski Kukovi Strict
      Reserve](/lugar/hajducki-i-rozanski-kukovi---stroga-rezervat/), and [Perućica Primeval
      Forest](/lugar/prasuma-perucica---nacionalni-park-sutjeska/); while [Białowieża National
      Park](/lugar/bialowieski-park-narodowy---rezerwat-scisly/) also shares the free-roaming European bison.
  fr:
    intro: >-
      À l'extrême est de la Slovaquie, là où le pays touche la Pologne et l'Ukraine, la forêt ne s'arrête pas
      à la frontière. Poloniny est le parc national le plus oriental du pays et celui qui concentre la plus
      forte densité de forêts primaires de Slovaquie : près de 80 % de sa surface est boisée, dominée par la
      hêtraie et la hêtraie-sapinière, tandis que sur les crêtes s'ouvrent les *poloniny*, ces pelouses
      d'altitude fleuries qui donnent leur nom au parc. Trois de ses forêts primaires, Stužica, Havešová et
      Rožok, sont inscrites au patrimoine mondial de l'UNESCO depuis le 28 juin 2007, et le parc constitue
      l'unique endroit de Slovaquie où vit le bison d'Europe en liberté.
    landscape: >-
      Le parc appartient à l'unité de Dukla de la zone des flyschs : une succession de bancs d'argiles et de
      grès déposés entre 70 et 42 millions d'années avant notre ère, quand la mer Téthys recouvrait la région.
      Le relief déploie de longues crêtes et des vallées profondes, la crête frontière avec la Pologne servant
      de ligne de partage des eaux continentale entre la Baltique et la mer Noire. Les hivers sont rudes : la
      neige persiste de novembre à avril, dépassant 160 jours sur les crêtes. Les précipitations totales
      oscillent entre 800 et 1 000 mm par an.


      Sous l'effet du dénivelé, la forêt se métamorphose avec l'altitude. Aux étages bas et tempérés croît la
      chênaie-charmaie. La hêtraie occupe la plus grande superficie, tandis que le sapin blanc gagne les
      hauteurs fraîches et humides. Au-delà de 1000 m, sous la limite des arbres, le climat montagnard
      rabougrit les hêtres et les érables. Plus haut encore s'étendent les *poloniny*, pelouses d'altitude
      nées pour l'essentiel du pastoralisme historique sur les crêtes.


      Poloniny forme en outre la frontière botanique entre Carpates orientales et occidentales, abritant plus
      de 1000 espèces de plantes supérieures. Le bouton d'or des Carpates (*Ranunculus carpaticus*), endémique
      des Carpates orientales, n'est connu en Slovaquie que dans une unique station du parc. L'emblème floral
      est l'hellébore pourpre, car à l'époque de la création du logo, il n'était répertorié en Slovaquie que
      sur ce territoire. Les prairies de piémont abritent également de nombreuses orchidées sauvages.
    wildlife: >-
      Le grand seigneur des lieux est le [bison d'Europe](/especie/bison_bonasus/), plus grand mammifère
      terrestre du continent. En 2004 fut lancé le programme de réintroduction d'une population libre, avec 11
      bisons importés (8 femelles et trois mâles), renforcés par des individus polonais. Le choix s'est porté
      sur la vallée de Ruské, zone de protection du réservoir de Starina, dépeuplée dans les années 80 et où
      des traces d'animaux errants avaient été relevées. Fin juin 2006 naissait le premier bisonneau sauvage
      du parc.


      Le massif abrite également l'[ours brun](/especie/ursus_arctos/), le [loup](/especie/canis_lupus/), le
      [lynx boréal](/especie/lynx_lynx/), la [loutre d'Europe](/especie/lutra_lutra/) et le [chat
      sauvage](/especie/felis_silvestris/). Côté oiseaux, Poloniny compte parmi les cinq meilleurs sites de
      Slovaquie pour l'engoulevent d'Europe, le [râle des genêts](/especie/crex_crex/) et la gélinotte des
      bois, avec nidification régulière de l'[aigle pomarin](/especie/aquila_pomarina/), de la [chouette de
      l'Oural](/especie/strix_uralensis/) et du [pic à dos blanc](/especie/dendrocopos_leucotos/). Parmi les
      reptiles se distingue la [couleuvre d'Esculape](/especie/elaphe_longissima/).
    visit: >-
      Les trois massifs primaires se découvrent de trois manières distinctes. Stužica, la plus vaste réserve,
      est traversée par le sentier rouge de crête reliant Nová Sedlica au mont Kremenec ; les hêtres y
      atteignent 220-250 ans et le sapin, roi de la forêt, dépasse 400 ans. Rožok dispose d'un sentier
      éducatif circulaire balisé en vert, de difficulté modérée, ponctué de cinq panneaux d'information.
      Havešová, en revanche, est dépourvue de tout sentier balisé : on ne la visite qu'accompagné par les
      gardes du parc sur une piste forestière brute. Sur ces sols argileux fertiles, les hêtres atteignent des
      tailles records avec des troncs s'élevant jusqu'à 58 m.


      Le sentier rouge de crête part de Nová Sedlica, village le plus oriental de Slovaquie (416 m), traverse
      Stužica et rejoint le Kremenec au tripoint réunissant Slovaquie, Pologne et Ukraine. Depuis Nová
      Sedlica, le vallon principal mène à Riaba skala pour le plus beau panorama du parc. De Runina, on gagne
      le col de Komúrny et ses pelouses de poloniny. Une piste cyclable balisée en jaune relie sur 7,0 km Nová
      Sedlica à Zboj, tandis qu'en hiver s'ouvrent des itinéraires de ski nordique.


      Un circuit culturel relie en outre les églises en bois traditionnelles d'Uličské Krivé (1718), Ruský
      Potok (1740) et Topoľa (1650).
    history: >-
      Le parc national des Poloniny a été créé le 1 octobre 1997, contigu au parc national de Bieszczady en
      Pologne. En 1998, il recevait le Diplôme européen des espaces protégés. Dès 1993, il fut inclus dans la
      réserve de biosphère des Carpates orientales avec la Pologne, rejointe en 1999 par l'Ukraine, forgeant
      la première réserve de biosphère trilatérale au monde. Plus d'un tiers de la faune forestière et plus de
      la moitié des champignons dépendent du bois mort, clé de voûte de réserves comme Havešová. À Rožok, le
      volume de bois mort en phase optimale atteint 1029,42 m³/ha, record absolu mesuré dans les hêtraies
      primaires de Slovaquie.
    before: >-
      Face à l'ours, le gestionnaire conseille d'éviter les sorties à l'aube et au crépuscule, de rester sur
      les chemins balisés, de signaler sa présence et de tenir son chien en laisse. Les feux de camp ne sont
      admis que sur les foyers désignés à moins de 10 mètres des abris. Havešová n'est accessible qu'avec les
      rangers du parc : renseignez-vous auprès de la direction. Vérifiez l'ouverture du centre d'accueil de
      Nová Sedlica avant de partir.
    around: >-
      Le parc englobe trois réserves documentées dans l'atlas :
      [Havešová](/lugar/narodna-prirodna-rezervacia-havesova/),
      [Rožok](/lugar/narodna-prirodna-rezervacia-rozok/) et
      [Stužica](/lugar/narodna-prirodna-rezervacia-stuzica/). À 1 km se trouve le [Parc national de Bieszczady
      - Complexe forestier](/lugar/bieszczadzki-park-narodowy---kompleks-lesny/) en Pologne, et à 11 km la
      [Forêt primaire de Vihorlat - Morské Oko](/lugar/prales-vihorlat---morske-oko/).


      Plus loin, d'autres sanctuaires partagent hêtres anciens, lynx et loups : la [Réserve de la forêt
      primaire de Slătioara](/lugar/rezervatia-codrul-secular-slatioara/), la [Réserve stricte de Hajdučki et
      Rožanski Kukovi](/lugar/hajducki-i-rozanski-kukovi---stroga-rezervat/) et la [Forêt primaire de
      Perućica](/lugar/prasuma-perucica---nacionalni-park-sutjeska/) ; tandis que le [Parc national de
      Białowieża](/lugar/bialowieski-park-narodowy---rezerwat-scisly/) partage également le bison d'Europe.
  de:
    intro: >-
      Im äußersten Osten der Slowakei, wo das Land an Polen und die Ukraine grenzt, endet der Wald nicht an
      der Staatsgrenze. Poloniny ist der östlichste Nationalpark des Landes und beherbergt die größte Dichte
      an Urwäldern in der Slowakei: Rund 80 % der Fläche sind bewaldet, überwiegend von Buchen- und
      Tannen-Buchenwäldern, während auf den Gebirgskämmen die *Poloniny* liegen, blumenreiche Hochweiden, die
      dem Schutzgebiet den Namen gaben. Drei seiner Urwälder – Stužica, Havešová und Rožok – gehören seit dem
      28. Juni 2007 zum UNESCO-Weltnaturerbe, und der Park ist der einzige Ort der Slowakei, an dem der
      europäische Wisent frei in der Wildnis lebt.
    landscape: >-
      Der Park gehört zur Dukla-Einheit der Flyschzone: rhythmisch geschichtete Tone und Sandsteine, die vor
      70 bis 42 Millionen Jahren im Thetys-Meer abgelagert wurden. Das Relief prägen langgezogene Rücken und
      tiefe Täler; der Grenzkamm zu Polen bildet die europäische Hauptwasserscheide zwischen Ostsee und
      Schwarzem Meer. Die Winter sind streng: Schnee liegt von November bis April, auf den Graten über 160
      Tage. Die Jahresniederschläge betragen 800 bis 1 000 mm.


      Durch das Relief wandelt sich der Wald mit der Höhe. In warmen Tieflagen wächst Eichen-Hainbuchenwald.
      Buchenwald nimmt den größten Raum ein, während Weißtannen in kühlere, feuchte Hochlagen aufsteigen.
      Oberhalb von 1000 m krüppelt das Gebirgsklima Buchen und Bergahorne zu bizarrem Krummholz. Darüber
      erstrecken sich die *Poloniny*, subalpine Bergwiesen, die einst durch Rodung und Beweidung der Kämme
      entstanden sind.


      Poloniny bildet zudem die floristische Grenze zwischen Ost- und Westkarpaten mit über 1000 höheren
      Pflanzenarten. Der Karpaten-Hahnenfuß (*Ranunculus carpaticus*) wächst slowakeiweit nur an einem
      einzigen Standort im Park. Die Wappenblume ist die Purpur-Nieswurz, die bei Entwurf des Logos landesweit
      nur von hier bekannt war. In den Wiesen blühen zahlreiche wilde Orchideen.
    wildlife: >-
      Das imposanteste Tier ist der [Wisent](/especie/bison_bonasus/), Europas größtes Landsäugetier. Im Jahr
      2004 begann die Wiederansiedlung einer freilebenden Herde mit 11 Tieren (8 Kühen und drei Stieren),
      ergänzt durch Tiere aus Polen. Als Auswilderungsort diente das Tal von Ruské im Einzugsgebiet des
      Starina-Stausees, ein in den 80er-Jahren geräumtes Gebiet. Ende Juni 2006 kam hier das erste in freier
      Wildbahn geborene Wisentkalb zur Welt.


      Im Park leben auch [Braunbär](/especie/ursus_arctos/), [Wolf](/especie/canis_lupus/), [Eurasischer
      Luchs](/especie/lynx_lynx/), [Fischotter](/especie/lutra_lutra/) und
      [Wildkatze](/especie/felis_silvestris/). Unter den Vögeln zählt Poloniny zu den fünf wichtigsten
      slowakischen Brutgebieten für Ziegenmelker, [Wachtelkönig](/especie/crex_crex/) und Haselhuhn;
      regelmäßig nisten [Schreiadler](/especie/aquila_pomarina/), [Habichtskauz](/especie/strix_uralensis/)
      und [Weißrückenspecht](/especie/dendrocopos_leucotos/). Unter den Reptilien fällt die
      [Äskulapnatter](/especie/elaphe_longissima/) auf.
    visit: >-
      Die drei Urwälder erschließen sich auf dreierlei Art. Stužica, das größte Reservat, durchquert der rote
      Kammweg von Nová Sedlica zum Kremenec; Buchen erreichen hier 220-250 Jahre, Tannen über 400 Jahre. Rožok
      besitzt einen grün markierten Lehrpfad mittlerer Schwierigkeit mit fünf Schautafeln. Havešová hingegen
      besitzt keine Wanderwege: Zutritt gibt es nur mit Parkpersonal über einen alten Forstweg. Auf
      nährstoffreichen Lehmböden erreichen Buchen hier Rekordhöhen mit Baumriesen bis zu 58 m.


      Der rote Kammweg startet in Nová Sedlica, dem östlichsten Dorf der Slowakei (416 m), durchquert Stužica
      und führt zum Dreiländereck Kremenec. Von Nová Sedlica führt ein Talweg zur Felskanzel Riaba skala mit
      weitem Rundblick. Ab Runina erreicht man den Pass Komúrny mit herrlichen Bergwiesen. Eine gelb markierte
      Radroute führt über 7,0 km von Nová Sedlica nach Zboj; im Winter sind Skilanglaufloipen gespurt.


      Ein Kulturwanderweg verbindet zudem die historischen Holzkirchen von Uličské Krivé (1718), Ruský Potok
      (1740) und Topoľa (1650).
    history: >-
      Der Nationalpark Poloniny wurde am 1. Oktober 1997 gegründet und grenzt direkt an den polnischen
      Bieszczady-Nationalpark. 1998 erhielt er das Europadiplom. Bereits 1993 wurde das Gebiet gemeinsam mit
      Polen in das Biosphärenreservat Ostkarpaten aufgenommen, das 1999 um ukrainische Flächen zum weltweit
      ersten trilateralen Biosphärenreservat erweitert wurde. Über ein Drittel aller Waldtierarten und mehr
      als die Hälfte der Waldpilze hängen von Totholz ab. Im Urwald Rožok erreicht das Holzvolumen in der
      Optimalphase 1029,42 m³/ha – slowakeiweiter Rekordwert in Buchenurwäldern.
    before: >-
      Verhalte dich bärengerecht: Meide Wanderungen in der Morgen- und Abenddämmerung, bleibe auf markierten
      Wegen, mache dich bemerkbar und führe Hunde an der Leine. Lagerfeuer sind nur an ausgewiesenen
      Feuerstellen innerhalb von 10 Metern um Schutzhütten gestattet. Havešová ist nur mit Parkrangern
      zugänglich: Stimme Besuche rechtzeitig mit der Verwaltung ab. Informiere dich vorab über die
      Öffnungszeiten des Besucherzentrums Nová Sedlica.
    around: >-
      Der Park umschließt drei im Atlas beschriebene Totalreservate:
      [Havešová](/lugar/narodna-prirodna-rezervacia-havesova/),
      [Rožok](/lugar/narodna-prirodna-rezervacia-rozok/) und
      [Stužica](/lugar/narodna-prirodna-rezervacia-stuzica/). In 1 km Entfernung liegt der
      [Bieszczady-Nationalpark - Waldkomplex](/lugar/bieszczadzki-park-narodowy---kompleks-lesny/) in Polen,
      und 11 km südwestlich der [Vihorlat-Urwald - Morské Oko](/lugar/prales-vihorlat---morske-oko/).


      Weiter entfernt teilen andere Schutzgebiete alte Buchen, Luchse und Wölfe: das [Naturreservat
      Slătioara-Urwald](/lugar/rezervatia-codrul-secular-slatioara/), das [Totalreservat Hajdučki und Rožanski
      Kukovi](/lugar/hajducki-i-rozanski-kukovi---stroga-rezervat/) und der
      [Perućica-Urwald](/lugar/prasuma-perucica---nacionalni-park-sutjeska/); der [Nationalpark
      Białowieża](/lugar/bialowieski-park-narodowy---rezerwat-scisly/) teilt zudem den Wisent.
  it:
    intro: >-
      Nell'estremo lembo orientale della Slovacchia, al confine con Polonia e Ucraina, il manto forestale non
      si arresta alla frontiera. Poloniny è il parco nazionale più a est del paese e racchiude la maggiore
      concentrazione di foreste vergini della Slovacchia: circa l'80 % del territorio è coperto da boschi, con
      prevalenza di faggete e abetine miste, mentre lungo le creste si aprono le *poloniny*, praterie d'alta
      quota che danno il nome al parco. Tre delle sue foreste primordiali (Stužica, Havešová e Rožok) sono
      patrimonio mondiale dell'UNESCO dal 28 giugno 2007, e il parco è l'unico comprensorio slovacco in cui
      vive allo stato brado il bisonte europeo.
    landscape: >-
      Il territorio appartiene all'unità di Dukla della zona del flysch: strati alternati di argille e
      arenarie depositatisi tra 70 e 42 milioni di anni fa nel mare della Tetide. Il paesaggio è modellato in
      dorsali parallele e profonde vallate; la cresta confinaria con la Polonia fa da spartiacque continentale
      tra bacino del Baltico e del Mar Nero. Gli inverni sono lunghi: la neve resiste da novembre ad aprile,
      superando 160 giorni sui crinali. Le precipitazioni annuali oscillano tra 800 e 1 000 mm.


      Il bosco muta con il gradiente altitudinale. Nelle zone basali temperate allignano querceti e carpineti.
      La faggeta domina la fascia media, mentre l'abete bianco sale nei valloni umidi d'alta quota. Oltre i
      1000 m, verso il limite della vegetazione arborea, il gelo modella faggi e aceri in forme contorte. Più
      in alto ancora si distendono le *poloniny*, pascoli alpini originatisi in gran parte dall'antico pascolo
      d'altura.


      Poloniny rappresenta inoltre la frontiera biogeografica tra Carpazi Orientali e Occidentali, accogliendo
      oltre 1000 specie di piante vascolari. Il ranuncolo dei Carpazi (*Ranunculus carpaticus*), endemismo
      orientale, è documentato in Slovacchia in un solo punto del parco. Il fiore simbolo è l'elleboro
      porporino, all'epoca dell'adozione noto nel paese solo qui. Nei prati collinari fioriscono molteplici
      orchidee spontanee.
    wildlife: >-
      Il protagonista indiscusso è il [bisonte europeo](/especie/bison_bonasus/), il maggiore mammifero
      terrestre europeo. Nel 2004 prese avvio il progetto di reintroduzione in libertà, importando
      inizialmente 11 bisonti (8 femmine e tre maschi), consolidati poi con esemplari polacchi. Venne
      prescelta la valle di Ruské nella fascia di salvaguardia del lago artificiale di Starina, svuotata negli
      anni 80. A fine giugno 2006 nacque il primo vitello di bisonte libero del parco.


      Nel massiccio vivono anche l'[orso bruno](/especie/ursus_arctos/), il [lupo
      grigio](/especie/canis_lupus/), la [lince boreale](/especie/lynx_lynx/), la [lontra
      europea](/especie/lutra_lutra/) e il [gatto selvatico](/especie/felis_silvestris/). L'avifauna conta
      Poloniny tra le cinque migliori zone slovacche per succiacapre, [re di quaglie](/especie/crex_crex/) e
      francolino di monte; nidificano con regolarità l'[aquila anatraia minore](/especie/aquila_pomarina/),
      l'[allocco degli Urali](/especie/strix_uralensis/) e il [picchio
      dorsobianco](/especie/dendrocopos_leucotos/). Tra i rettili spicca il [colubro
      d'Esculapio](/especie/elaphe_longissima/).
    visit: >-
      I tre complessi primordiali si visitano con tre approcci differenti. Stužica, la riserva maggiore, è
      percorsa dal sentiero rosso di cresta da Nová Sedlica al monte Kremenec; i faggi toccano 220-250 anni e
      gli abeti bianchi oltrepassano i 400. Rožok offre un anello didattico verde di media difficoltà con
      cinque pannelli. Havešová non possiede tracciati escursionistici aperti: è visitabile unicamente assieme
      al personale del parco lungo una vecchia pista forestale. Sui fertili suoli argillosi i faggi
      raggiungono quote record con tronchi dritti alti fino a 58 m.


      Il sentiero di cresta muove da Nová Sedlica, il comune più a est della Slovacchia (416 m), taglia
      Stužica e raggiunge il Kremenec al triplice confine tra Slovacchia, Polonia e Ucraina. Da Nová Sedlica
      una via di fondovalle sale a Riaba skala per la vista panoramica migliore del parco. Da Runina si sale
      al valico di Komúrny. Una ciclovia gialla collega per 7,0 km Nová Sedlica a Zboj, mentre in inverno si
      snodano percorsi per sci di fondo.


      Un tracciato escursionistico collega inoltre le caratteristiche chiese lignee di Uličské Krivé (1718),
      Ruský Potok (1740) e Topoľa (1650).
    history: >-
      Il Parco Nazionale Poloniny venne istituito il 1 ottobre 1997, confinando con il Parco Nazionale di
      Bieszczady in Polonia. Nel 1998 ricevette il Diploma Europeo delle Aree Protette. Nel 1993 fu incluso
      nella Riserva della Biosfera dei Carpazi Orientali assieme alla Polonia, estesa nel 1999 all'Ucraina
      come prima riserva trilaterale al mondo. Oltre un terzo degli animali forestali e più di metà dei funghi
      dipendono dal legno morto. A Rožok il volume di necromassa in fase ottimale raggiunge 1029,42 m³/ha,
      record assoluto misurato nelle faggete primarie slovacche.
    before: >-
      Per prevenire incontri con l'orso, si consiglia di evitare escursioni all'alba e al tramonto, rimanere
      sui sentieri tracciati, segnalare il proprio arrivo e tenere i cani legati. È consentito accendere
      fuochi solo nei bracieri autorizzati a meno di 10 metri dai rifugi. Havešová è accessibile solo con i
      guardaparco: richiedi modalità e permessi alla direzione. Controlla gli orari del centro informativo di
      Nová Sedlica prima di partire.
    around: >-
      Il parco comprende tre riserve illustrate nell'atlas:
      [Havešová](/lugar/narodna-prirodna-rezervacia-havesova/),
      [Rožok](/lugar/narodna-prirodna-rezervacia-rozok/) e
      [Stužica](/lugar/narodna-prirodna-rezervacia-stuzica/). A solo 1 km si trova il [Parco Nazionale di
      Bieszczady - Complesso Forestale](/lugar/bieszczadzki-park-narodowy---kompleks-lesny/) in Polonia, e a
      11 km la [Foresta Vergine di Vihorlat - Morské Oko](/lugar/prales-vihorlat---morske-oko/).


      Più a sud, altre foreste vetuste condividono faggi, linci e lupi: la [Riserva della Foresta Primaria di
      Slătioara](/lugar/rezervatia-codrul-secular-slatioara/), la [Riserva Integrale di Hajdučki e Rožanski
      Kukovi](/lugar/hajducki-i-rozanski-kukovi---stroga-rezervat/) e la [Foresta Vergine di
      Perućica](/lugar/prasuma-perucica---nacionalni-park-sutjeska/); mentre il [Parco Nazionale di
      Białowieża](/lugar/bialowieski-park-narodowy---rezerwat-scisly/) ospita anch'esso il bisonte.
  pt:
    intro: >-
      No extremo oriental da Eslováquia, no ponto de encontro com a Polónia e a Ucrânia, o manto vegetal não
      termina na fronteira. Poloniny é o parque nacional mais oriental do país e o que concentra a maior
      densidade de florestas virgens da Eslováquia: cerca de 80 % da sua superfície é florestal, dominada por
      faiais e matas mistas de faia e abeto, abrindo-se no cimo das cristas as *poloniny*, prados floridos de
      montanha que dão nome ao parque. Três das suas florestas primitivas — Stužica, Havešová e Rožok — são
      Património Mundial da UNESCO desde 28 de junho de 2007, sendo o parque o único território eslovaco onde
      o bisonte-europeu vive livre na natureza.
    landscape: >-
      O parque integra a unidade de Dukla da bacia de flysch: mantos ritmados de argilitos e arenitos
      depositados há entre 70 e 42 milhões de anos, quando o oceano Tétis cobria a região. O relevo desenha
      cristas alongadas e vales cavados, funcionando a linha de fronteira com a Polónia como divisória de
      águas entre as bacias do Báltico e do Mar Negro. Os invernos são rigorosos: a neve cobre o solo de
      novembro a abril, prolongando-se por mais de 160 dias nas cristas. A precipitação média anual varia
      entre 800 e 1 000 mm.


      Com tal desnível, a floresta transforma-se com a altitude. Nos vales basais mais quentes ocorrem
      carvalhais com carpinos. O faial ocupa a maior extensão, enquanto o abeto-branco conquista as encostas
      altas e húmidas. Acima dos 1000 m, no limite da vegetação arbórea, o frio de montanha torna faias e
      bordos retorcidos. Nos pontos mais elevados surgem as *poloniny*, prados de altitude resultantes em
      grande medida do pastoreio tradicional.


      Poloniny constitui ainda a charneira botânica entre os Cárpatos Orientais e Ocidentais, somando mais de
      1000 espécies de plantas vasculares. O ranúnculo-dos-cárpatos (*Ranunculus carpaticus*), endémico dos
      Cárpatos Orientais, só é conhecido na Eslováquia num único recanto do parque. O símbolo floral é o
      heléboro-púrpura, escolhido por ser outrora exclusivo deste território no país. Nos prados de média
      encosta florescem variadas orquídeas bravias.
    wildlife: >-
      A grande figura é o [bisonte-europeu](/especie/bison_bonasus/), o maior mamífero terrestre da Europa. Em
      2004 arrancou o projeto de reintrodução de uma manada livre com 11 bisontes (8 fêmeas e três machos),
      reforçada com animais polacos. Escolheu-se o vale isolado de Ruské na bacia da albufeira de Starina,
      despovoado nos anos 80. Nos finais de junho de 2006 nasceu a primeira cria em liberdade no parque.


      O território acolhe também o [urso-pardo](/especie/ursus_arctos/), o
      [lobo-cinzento](/especie/canis_lupus/), o [lince-euroasiático](/especie/lynx_lynx/), a
      [lontra-europeia](/especie/lutra_lutra/) e o [gato-bravo](/especie/felis_silvestris/). Nas aves,
      Poloniny figura entre os cinco melhores locais da Eslováquia para noitibó,
      [codornizão](/especie/crex_crex/) e galinha-do-mato, nidificando com frequência a
      [águia-pomarina](/especie/aquila_pomarina/), a [coruja-dos-urales](/especie/strix_uralensis/) e o
      [pica-pau-de-dorso-branco](/especie/dendrocopos_leucotos/). Entre os répteis avulta a
      [cobra-de-esculápio](/especie/elaphe_longissima/).
    visit: >-
      Os três núcleos primários exploram-se de três formas distintas. Stužica, a reserva mais extensa, é
      percorrida pelo trilho de crista vermelho de Nová Sedlica a Kremenec; as faias alcançam 220-250 anos e
      os abetos-brancos superam os 400. Rožok tem um percurso didático circular marcado a verde com cinco
      paragens interpretativas. Havešová não possui trilhos marcados: visita-se unicamente com os guardas do
      parque por um antigo caminho florestal. Nos solos argilosos férteis, as faias atingem portes recorde com
      fustes aprumados até 58 m.


      O trilho de crista parte de Nová Sedlica, a aldeia mais oriental da Eslováquia (416 m), atravessa
      Stužica e culmina no Kremenec, onde convergem Eslováquia, Polónia e Ucrânia. De Nová Sedlica sobe-se a
      Riaba skala para a melhor panorâmica do parque. De Runina ascende-se ao colo de Komúrny. Existe uma rota
      de BTT amarela com 7,0 km entre Nová Sedlica e Zboj, e no inverno abrem-se pistas de esqui de fundo.


      Um percurso cultural visita ainda as igrejas de madeira históricas de Uličské Krivé (1718), Ruský Potok
      (1740) e Topoľa (1650).
    history: >-
      O Parque Nacional Poloniny foi instituído a 1 de outubro de 1997, confinando com o Parque Nacional de
      Bieszczady na Polónia. Em 1998 recebeu o Diploma Europeu. Em 1993 foi integrado na Reserva da Biosfera
      dos Cárpatos Orientais conjuntamente com a Polónia, alargada em 1999 à Ucrânia como primeira reserva
      trilateral do mundo. Mais de um terço da fauna florestal e mais de metade dos cogumelos dependem da
      madeira morta. Em Rožok o volume de madeira morta na fase de clímax atinge 1029,42 m³/ha, valor recorde
      medido em faiais virgens eslovacos.
    before: >-
      Em relação ao urso, recomenda-se evitar caminhadas ao amanhecer e anoitecer, permanecer nos trilhos
      balizados, assinalar a presença com calma e levar o cão preso por trela. Só é permitido fazer fogo nos
      locais autorizados a menos de 10 metros dos abrigos. Havešová só pode visitar-se com acompanhamento do
      parque: informa-te com antecedência junto da administração. Confirma o funcionamento do posto de Nová
      Sedlica antes da visita.
    around: >-
      O parque integra três reservas deste atlas: [Havešová](/lugar/narodna-prirodna-rezervacia-havesova/),
      [Rožok](/lugar/narodna-prirodna-rezervacia-rozok/) e
      [Stužica](/lugar/narodna-prirodna-rezervacia-stuzica/). A apenas 1 km situa-se o [Parque Nacional de
      Bieszczady - Complexo Florestal](/lugar/bieszczadzki-park-narodowy---kompleks-lesny/) na Polónia, e a 11
      km a [Floresta Virgem de Vihorlat - Morské Oko](/lugar/prales-vihorlat---morske-oko/).


      Mais longe, outros santuários partilham faias virgens, linces e lobos: a [Reserva da Floresta Primária
      de Slătioara](/lugar/rezervatia-codrul-secular-slatioara/), a [Reserva Estrita de Hajdučki e Rožanski
      Kukovi](/lugar/hajducki-i-rozanski-kukovi---stroga-rezervat/) e a [Floresta Virgem de
      Perućica](/lugar/prasuma-perucica---nacionalni-park-sutjeska/); partilhando o [Parque Nacional de
      Białowieża](/lugar/bialowieski-park-narodowy---rezerwat-scisly/) igualmente o bisonte-europeu.
