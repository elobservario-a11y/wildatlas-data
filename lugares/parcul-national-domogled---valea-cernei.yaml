resumen:
  es: Cañón tectónico profundo bordeado de pino negro de Banato y cuencas con hayedos vírgenes de montaña.
  en: Deep tectonic canyon flanked by Banat black pine and catchments with virgin montane beech woods.
  fr: >-
    Canyon tectonique profond bordé de pins noirs du Banat et bassins abritant des hêtraies primaires
    montagnardes.
  de: >-
    Tiefe tektonische Schlucht, gesäumt von Banater Schwarzkiefern und Talschlüssen mit montanen
    Buchenurwäldern.
  it: Profondo canyon tettonico orlato da pini neri del Banato e valloni con faggete montane vergini.
  pt: Cânion tectónico profundo orlado por pinheiros-pretos-do-banato e bacias com fagetos montanos virgens.
unico:
  es: >-
    Un valle abierto al Mediterráneo, con calizas verticales, hayedos de la lista de la UNESCO y una flora que
    obligó a proteger el lugar por tres plantas europeas.
  en: >-
    A valley open to the Mediterranean, with vertical limestone walls, UNESCO-listed primeval beech woods, and
    a flora that prompted protection for three European plant species.
  fr: >-
    Une vallée ouverte sur la Méditerranée, aux falaises calcaires vertigineuses, hêtraies inscrites à
    l'UNESCO et une flore ayant motivé la protection du site pour trois plantes européennes.
  de: >-
    Ein zum Mittelmeerraum geöffnetes Tal mit senkrechten Kalkwänden, UNESCO-Buchenurwäldern und einer Flora,
    die wegen dreier europäischer Pflanzenarten unter Schutz gestellt wurde.
  it: >-
    Una valle aperta agli influssi mediterranei, con ripide falesie calcaree, faggete del patrimonio UNESCO e
    una flora che richiese la tutela per tre piante di interesse europeo.
  pt: >-
    Um vale exposto a influências mediterrânicas, com escarpas verticais de calcário, fagetos da lista da
    UNESCO e uma flora cuja raridade motivou a proteção por três plantas europeias.
observaciones:
  es: >-
    En la parte alta del macizo las fuentes de agua son escasas o inexistentes, así que hay que llevar agua
    para todo el recorrido. Quédate en los senderos oficiales señalizados. Los menores de 14 años solo pueden
    entrar acompañados por un adulto responsable o en grupos organizados. Los perros solo pueden ir por los
    senderos marcados y con correa. El fuego se enciende únicamente en las zonas de acampada y junto a las
    cabañas turísticas donde esté permitido.
texto:
  es:
    intro: >-
      El aire que sube por el valle del Cerna es de origen mediterráneo y oceánico, y se nota: las
      temperaturas son más altas que en el resto del país. Domogled-Valea Cernei ocupa 61.211 hectáreas en el
      suroeste del país, repartidas entre los condados de Caraș-Severin, Mehedinți y Gorj, y gira alrededor de
      un río que baja desde más de 2000 metros hasta los 168 m de Băile Herculane. Es un parque nacional de
      categoría II de la UICN con once reservas naturales dentro.
    landscape: >-
      El valle del Cerna es un pasillo que separa dos hileras de montañas muy distintas. A un lado, los montes
      de Godeanu, formados casi por completo de rocas metamórficas; al otro, los montes de Mehedinți, más
      bajos y de caliza. Entre medias, una franja calcárea que acompaña al río da lugar al rasgo más propio
      del valle: los ciuceve y los geanțuri, pequeños macizos de caliza que van saltando de una orilla a otra.


      La mayor superficie caliza de la región está entre Vf. lui Stan y el Domogled. Cae hacia el Cerna en un
      escarpe de 400 a 600 m, cortado por valles kársticos. Es una zona de roquedos, dolinas, cuevas, simas,
      gargantas y cascadas.


      El clima explica el resto. Por su posición, la cuenca recibe sobre todo aire del oeste y del suroeste;
      en invierno entran masas húmedas y cálidas de origen mediterráneo y oceánico, y los ciclones
      mediterráneos descargan lluvias abundantes en noviembre y diciembre. Por eso el relieve escalonado, de
      más de 2000 m a 168 m, es también un escalón de temperaturas.
    wildlife: >-
      La flora suma unas 1110 plantas vasculares, y 66 son taxones amenazados, raros o parcialmente endémicos.
      El lugar se declaró para proteger tres de ellas: Campanula serrata, Himantoglossum caprinum y
      Cypripedium calceolus, incluidas en el anexo II de la Directiva de hábitats. La fuente señala además
      como amenazadas globalmente dos Minuartia, Minuartia graminifolia y Minuartia hirsuta.


      Entre los mamíferos de interés destacan la [nutria](/especie/lutra_lutra/), el [oso
      pardo](/especie/ursus_arctos/), el [lince](/especie/lynx_lynx/), el [lobo](/especie/canis_lupus/) y el
      [gato montés](/especie/felis_silvestris/). También hay [marta](/especie/martes_martes/),
      [ciervo](/especie/cervus_elaphus/), [corzo](/especie/capreolus_capreolus/),
      [rebeco](/especie/rupicapra_rupicapra/) y jabalí. Hay diez especies de murciélagos de interés, entre
      ellas Myotis myotis y Rhinolophus ferrumequinum, y entre los reptiles figura la [tortuga
      mediterránea](/especie/testudo_hermanni/), Testudo hermanni, junto a Bombina variegata.


      Entre las aves de la lista aparecen el [águila real](/especie/aquila_chrysaetos/), el [búho
      real](/especie/bubo_bubo/), la culebrera europea (Circaetus gallicus) y el pico dorsiblanco (Dendrocopos
      leucotos).
    visit: >-
      Empieza por el centro de visitantes. En el sótano está el mundo de las cuevas, con maquetas 3D de seis
      de las más representativas del parque y una maqueta 3D del parque entero con sus rutas; la planta baja
      explica la localización, los límites, las rutas, las reservas y los hábitats Natura 2000; y la planta
      alta pone en el centro a las comunidades locales.


      La administración propone cinco rutas de montaña, con cascadas, cuevas, gargantas, aldeas aisladas,
      miradores y cumbres. Una sale de Băile Herculane por Coada Lacului hasta la cascada Vânturătoarea y la
      Poiana Cicilovete. Otra pasa por Motel Dumbrava, las gargantas de Țăsna, Moara Dracilor y Stâna Oprescu.
      Una más corta recorre la Grota Haiducilor, varios miradores y el manantial Munk hasta el Izvorul Diana
      III. La circular por Domogledu Mare mide 8,1 km, acumula 861 m de subida y 920 de bajada y lleva entre
      cinco y cinco horas y media. Pasa por la cueva Peştera de Sub Şărban, los picos Domogledu Mic y Mare y
      las gargantas Ferigari. Otra circular, por los montes Mehedinți hasta Vârful Ciolanu Mare y las
      gargantas de Țăsna, mide 8,6 km y lleva unas siete horas y media.


      También hay un guía especializado de la propia administración, y se puede observar flora y fauna y
      fotografiar el paisaje.
    history: >-
      Los romanos llamaron al río Tierna y luego Dierna; el nombre actual llegó con los eslavos. 


      En 2017 se amplió el sitio de la UNESCO «Bosques primarios de hayas de los Cárpatos y otras regiones de
      Europa». En Domogled-Valea Cernei hay 9.732,3 ha de esos bosques, entre ellas el componente
      Domogled-Coronini-Bedina, con 5.110,6 ha.
    before: >-
      En la parte alta del macizo las fuentes de agua son escasas o inexistentes, así que hay que llevar agua
      para todo el recorrido. Quédate en los senderos oficiales señalizados. Los menores de 14 años solo
      pueden entrar acompañados por un adulto responsable o en grupos organizados. Los perros solo pueden ir
      por los senderos marcados y con correa. El fuego se enciende únicamente en las zonas de acampada y junto
      a las cabañas turísticas donde esté permitido.
    around: >-
      Pegado a Domogled está el [Parque Nacional Retezat](/lugar/parcul-national-retezat---masivul-muntos/), a
      0 km, y a solo 1 km la [Meseta de Mehedinți](/lugar/rewilding-mehedinti-plateau/). A quince kilómetros
      queda el [Parque Nacional Đerdap - Puerta de
      Hierro](/lugar/nacionalni-park-djerdap---puerta-de-hierro/), a 22 km la [Garganta de
      Sohodol](/lugar/cheile-sohodolului/) y a veintinueve el [Parque Nacional Semenic - Gargantas del
      Caraș](/lugar/parcul-national-semenic---cheile-carasului/).
  en:
    intro: >-
      Air rising along the Cerna Valley carries Mediterranean and oceanic warmth, and it shows: temperatures
      run higher than across the rest of Romania. Domogled-Valea Cernei spans 61,211 hectares in southwestern
      Romania, divided between Caraș-Severin, Mehedinți, and Gorj counties, and revolves around a river
      plunging from above 2000 metres down to 168 m at Băile Herculane. It is an IUCN category II national
      park embracing eleven nature reserves within its bounds.
    landscape: >-
      The Cerna Valley forms a tectonic corridor separating two markedly contrasting mountain ranges. On one
      flank rise the Godeanu Mountains, composed almost entirely of metamorphic schists; on the other stand
      the lower, limestone-built Mehedinți Mountains. In between, a ribbon of limestone flanking the river
      creates the valley's signature landmarks: the ciuceve and geanțuri, isolated limestone crags vaulting
      from one riverbank to the other.


      The region's largest limestone expanse stretches between Vf. lui Stan and Mount Domogled. It falls
      toward the Cerna in sheer scarps of 400 to 600 m, carved by dry karst ravines—a world of limestone
      bluffs, sinkholes, caves, chasms, gorges, and waterfalls.


      Climate accounts for the rest. Due to its orientation, the basin primarily intercepts westerly and
      southwesterly air masses; in winter moist, mild air of Mediterranean and oceanic provenance pushes
      inland, while Mediterranean depressions unleash generous rains in November and December. Consequently,
      this terraced relief, dropping from over 2000 m to 168 m, functions simultaneously as a thermal
      staircase.
    wildlife: >-
      The vascular flora totals some 1110 species, of which 66 represent threatened, rare, or partly endemic
      taxa. The park was declared to safeguard three of them: *Campanula serrata*, *Himantoglossum caprinum*,
      and *Cypripedium calceolus*, catalogued under Annex II of the Habitats Directive. Survey records further
      identify two globally threatened sandworts, *Minuartia graminifolia* and *Minuartia hirsuta*.


      Mammals of conservation priority include the [Eurasian otter](/especie/lutra_lutra/), [brown
      bear](/especie/ursus_arctos/), [Eurasian lynx](/especie/lynx_lynx/), [grey wolf](/especie/canis_lupus/),
      and [European wildcat](/especie/felis_silvestris/). The [European pine marten](/especie/martes_martes/),
      [red deer](/especie/cervus_elaphus/), [roe deer](/especie/capreolus_capreolus/),
      [chamois](/especie/rupicapra_rupicapra/), and wild boar also roam here. Ten bat species of conservation
      interest inhabit caves, including *Myotis myotis* and *Rhinolophus ferrumequinum*, while reptiles
      feature [Hermann's tortoise](/especie/testudo_hermanni/), *Testudo hermanni*, alongside *Bombina
      variegata*.


      Avifauna highlights encompass the [golden eagle](/especie/aquila_chrysaetos/), [Eurasian
      eagle-owl](/especie/bubo_bubo/), short-toed snake eagle, and white-backed woodpecker.
    visit: >-
      Begin at the visitor centre. The basement explores the subterranean realm with 3D scale models of six of
      the park's most prominent caves alongside a 3D relief model of the entire park and its trail network;
      the ground floor details park geography, boundaries, hiking paths, nature reserves, and Natura 2000
      habitats; and the top floor highlights local communities.


      Park administration suggests five mountain routes showcasing waterfalls, caves, ravines, isolated
      hamlets, lookout crags, and summits. One departs Băile Herculane via Coada Lacului to Vânturătoarea
      waterfall and Poiana Cicilovete. Another traverses Motel Dumbrava, Țăsna gorge, Moara Dracilor, and
      Stâna Oprescu. A shorter loop visits Grota Haiducilor, several viewpoints, and Munk spring to Izvorul
      Diana III. The Domogledu Mare circular covers 8.1 km with 861 m of climb and 920 m of descent, requiring
      five to five and a half hours, visiting Peştera de Sub Şărban, Domogledu Mic and Mare peaks, and
      Ferigari gorge. Another loop through the Mehedinți Mountains to Vârful Ciolanu Mare and Țăsna gorge
      spans 8.6 km and takes about seven and a half hours.


      Specialized guide services are available through park administration for botanizing, wildlife watching,
      and landscape photography.
    history: >-
      Romans dubbed the river Tierna and subsequently Dierna; the modern name arrived with Slavic settlement.


      In 2017, the UNESCO serial property "Ancient and Primeval Beech Forests of the Carpathians and Other
      Regions of Europe" was expanded. Domogled-Valea Cernei includes 9,732.3 ha of these primeval beech
      reserves, notably the Domogled-Coronini-Bedina component encompassing 5,110.6 ha.
    before: >-
      On the upper karst massifs, water springs are scarce or non-existent, so carry adequate water for your
      entire outing. Stay strictly on official marked trails. Children under 14 years of age may enter only
      when accompanied by a responsible adult or within organized parties. Dogs must remain leashed on marked
      trails. Open fires are allowed strictly at designated camping sites and beside permitted tourist
      chalets.
    around: >-
      Bordering Domogled directly is [Retezat National Park](/lugar/parcul-national-retezat---masivul-muntos/)
      at 0 km, and only 1 km away lies the [Mehedinți Plateau](/lugar/rewilding-mehedinti-plateau/). Fifteen
      kilometres distant is [Đerdap National Park - Iron
      Gate](/lugar/nacionalni-park-djerdap---puerta-de-hierro/), at 22 km [Sohodol
      Gorge](/lugar/cheile-sohodolului/), and twenty-nine kilometres away [Semenic - Caraș Gorge National
      Park](/lugar/parcul-national-semenic---cheile-carasului/).
  fr:
    intro: >-
      L'air remontant la vallée de la Cerna porte des effluves méditerranéens et océaniques, et cela se
      ressent : les températures y sont plus douces qu'ailleurs en Roumanie. Domogled-Valea Cernei s'étend sur
      61 211 hectares dans le sud-ouest du pays, partagés entre les județe de Caraș-Severin, Mehedinți et
      Gorj, et s'articule autour d'une rivière dévalant de plus de 2000 mètres d'altitude jusqu'aux 168 m de
      Băile Herculane. C'est un parc national de catégorie II de l'UICN englobant onze réserves naturelles.
    landscape: >-
      La vallée de la Cerna forme un couloir tectonique séparant deux massifs aux caractères géologiques
      opposés. D'un côté s'élèvent les monts Godeanu, presque entièrement composés de roches métamorphiques ;
      de l'autre, les monts Mehedinți, d'altitude plus modeste et bâtis de calcaire. Entre les deux, une bande
      calcaire longeant le cours d'eau donne naissance aux curiosités emblématiques de la vallée : les ciuceve
      et geanțuri, éperons rocheux qui sautent d'une rive à l'autre.


      Le plus vaste ensemble calcaire de la région s'étend entre le Vf. lui Stan et le mont Domogled. Il
      plonge vers la Cerna par des parois abruptes de 400 à 600 m, découpées de vallons karstiques asséchés,
      composant un univers de falaises, dolines, grottes, gouffres, défilés et cascades.


      Le climat modèle le reste. Par son orientation, le bassin capte surtout les masses d'air d'ouest et de
      sud-ouest ; en hiver affluent des courants doux et humides d'origine méditerranéenne et océanique, et
      les perturbations méditerranéennes déversent de copieuses pluies en novembre et décembre. Ce relief
      étagé, tombant de plus de 2000 m à 168 m, constitue ainsi un véritable escalier thermique.
    wildlife: >-
      La flore vasculaire compte environ 1110 espèces, dont 66 taxons menacés, rares ou subendémiques. Le parc
      fut institué pour sauvegarder trois d'entre eux : *Campanula serrata*, *Himantoglossum caprinum* et
      *Cypripedium calceolus*, inscrits à l'annexe II de la directive Habitats. Les répertoires signalent en
      outre comme menacées à l'échelle mondiale deux sablines, *Minuartia graminifolia* et *Minuartia
      hirsuta*.


      Parmi les mammifères remarquables figurent la [loutre d'Europe](/especie/lutra_lutra/), l'[ours
      brun](/especie/ursus_arctos/), le [lynx boréal](/especie/lynx_lynx/), le [loup](/especie/canis_lupus/)
      et le [chat sauvage](/especie/felis_silvestris/). La [martre des pins](/especie/martes_martes/), le
      [cerf élaphe](/especie/cervus_elaphus/), le [chevreuil](/especie/capreolus_capreolus/), le
      [chamois](/especie/rupicapra_rupicapra/) et le sanglier hantent les lieux. Dix espèces de chauves-souris
      méritent attention, dont le grand murin et le grand rhinolophe, et les reptiles comptent la [tortue
      d'Hermann](/especie/testudo_hermanni/), *Testudo hermanni*, aux côtés du sonneur à ventre jaune.


      Les oiseaux rassemblent l'[aigle royal](/especie/aquila_chrysaetos/), le [hibou
      grand-duc](/especie/bubo_bubo/), le circaète Jean-le-Blanc et le pic à dos blanc.
    visit: >-
      Commencez par le centre de visiteurs. Le sous-sol est consacré au monde souterrain avec des maquettes en
      3D de six des cavités les plus spectaculaires du parc et une maquette en 3D de l'ensemble du massif et
      de ses sentiers ; le rez-de-chaussée présente la géographie, les limites, les chemins, les réserves et
      les habitats Natura 2000 ; le premier étage met à l'honneur les communautés locales.


      L'administration propose cinq circuits de montagne révélant cascades, grottes, défilés, hameaux isolés,
      belvédères et crêtes. Un sentier part de Băile Herculane via Coada Lacului vers la cascade Vânturătoarea
      et Poiana Cicilovete. Un autre traverse le motel Dumbrava, les gorges de Țăsna, Moara Dracilor et Stâna
      Oprescu. Une boucle plus brève explore la Grota Haiducilor, plusieurs points de vue et la source Munk
      jusqu'à Izvorul Diana III. Le tour du Domogledu Mare totalise 8,1 km avec 861 m de montée et 920 m de
      descente en cinq heures à cinq heures et demie, passant par Peştera de Sub Şărban, les pics Domogledu
      Mic et Mare et la gorge Ferigari. Un autre circuit dans les monts Mehedinți jusqu'au Vârful Ciolanu Mare
      et les gorges de Țăsna s'étend sur 8,6 km en sept heures et demie environ.


      Des visites guidées sont organisées par le personnel du parc pour l'observation botanique et faunistique
      et la photographie de paysage.
    history: >-
      Les Romains nommèrent la rivière Tierna puis Dierna ; son appellation contemporaine fut introduite par
      les Slaves.


      En 2017, le bien sériel de l'UNESCO consacré aux forêts primaires de hêtres d'Europe fut étendu.
      Domogled-Valea Cernei englobe 9 732,3 ha de ces hêtraies vierges, dont la composante
      Domogled-Coronini-Bedina totalisant 5 110,6 ha.
    before: >-
      Sur les hauts plateaux calcaires, les points d'eau sont extrêmement rares ou absents, aussi devez-vous
      emporter votre réserve intégrale pour la journée. Tenez-vous aux sentiers balisés officiels. Les enfants
      de moins de 14 ans doivent être accompagnés d'un adulte responsable ou voyager en groupe encadré. Les
      chiens doivent être tenus en laisse. Les feux sont cantonnés aux seuls campings et abords immédiats des
      chalets touristiques homologués.
    around: >-
      Attenant directement au Domogled se trouve le [parc national de
      Retezat](/lugar/parcul-national-retezat---masivul-muntos/) à 0 km, et à 1 km seulement s'étend le
      [plateau de Mehedinți](/lugar/rewilding-mehedinti-plateau/). À quinze kilomètres s'élève le [parc
      national Đerdap - Porte de Fer](/lugar/nacionalni-park-djerdap---puerta-de-hierro/), à 22 km les [gorges
      de Sohodol](/lugar/cheile-sohodolului/) et à vingt-neuf kilomètres le [parc national Semenic - Gorges du
      Caraș](/lugar/parcul-national-semenic---cheile-carasului/).
  de:
    intro: >-
      Die Luftströmungen im Cerna-Tal bringen mediterrane und ozeanische Wärme mit sich, und das ist spürbar:
      Die Temperaturen liegen merklich über dem Landesdurchschnitt. Domogled-Valea Cernei erstreckt sich über
      61.211 Hektar im Südwesten Rumäniens, aufgeteilt auf die Kreise Caraș-Severin, Mehedinți und Gorj, und
      ordnet sich um einen Fluss an, der von über 2000 Metern bis auf 168 m bei Băile Herculane herabrauscht.
      Es ist ein Nationalpark der IUCN-Kategorie II mit elf eingebetteten Naturreservaten.
    landscape: >-
      Das Cerna-Tal bildet einen tektonischen Graben zwischen zwei geologisch grundverschiedenen Gebirgszügen.
      Auf der einen Seite ragt das Godeanu-Gebirge auf, das fast vollständig aus metamorphen Gesteinen
      besteht; auf der anderen liegt das niedrigere, aus Kalkstein aufgebaute Mehedinți-Gebirge. Dazwischen
      bildet ein Kalkband entlang des Flusses die landschaftliche Signatur des Tals: die ciuceve und geanțuri,
      isolierte Kalkriffe, die scheinbar von Ufer zu Ufer springen.


      Das größte Kalkareal der Region erstreckt sich zwischen dem Vf. lui Stan und dem Domogled. Es stürzt zur
      Cerna in Steilwänden von 400 bis 600 m ab, zerfurcht von Karsttälern – eine Welt aus Felsabstürzen,
      Dolinen, Höhlen, Schlünden, Klammen und Kaskaden.


      Das Klima bewirkt das Übrige. Seiner Lage wegen fängt das Einzugsgebiet vor allem Luftströmungen aus
      West und Südwest ein; im Winter dringen milde Feuchtluftmassen mediterranen und ozeanischen Ursprungs
      vor, und Mittelmeertiefs bringen im November und Dezember ergiebige Regenfälle. Deshalb bildet das
      gestufte Relief von über 2000 m auf 168 m zugleich eine thermische Treppe.
    wildlife: >-
      Die Gefäßpflanzenflora zählt rund 1110 Arten, von denen 66 bedrohte, seltene oder subendemische Taxa
      darstellen. Das Schutzgebiet wurde ausgewiesen, um drei von ihnen zu sichern: *Campanula serrata*,
      *Himantoglossum caprinum* und *Cypripedium calceolus*, aufgeführt in Anhang II der FFH-Richtlinie.
      Fachberichte listen zudem zwei weltweit bedrohte Sandkräuter, *Minuartia graminifolia* und *Minuartia
      hirsuta*.


      Unter den bemerkenswerten Säugetieren leben [Eurasischer Fischotter](/especie/lutra_lutra/),
      [Braunbär](/especie/ursus_arctos/), [Eurasischer Luchs](/especie/lynx_lynx/),
      [Wolf](/especie/canis_lupus/) und [Wildkatze](/especie/felis_silvestris/). Auch
      [Baummarder](/especie/martes_martes/), [Rothirsch](/especie/cervus_elaphus/),
      [Reh](/especie/capreolus_capreolus/), [Gämse](/especie/rupicapra_rupicapra/) und Wildschwein streifen
      durch die Hänge. Zehn Fledermausarten von europäischem Interesse nutzen Höhlen, darunter Großes Mausohr
      und Große Hufeisennase; die Reptilienwelt vertritt die [Griechische
      Landschildkröte](/especie/testudo_hermanni/), *Testudo hermanni*, neben der Gelbbauchunke.


      Zu den Höhepunkten der Vogelwelt gehören [Steinadler](/especie/aquila_chrysaetos/),
      [Uhu](/especie/bubo_bubo/), Schlangenadler und Weißrückenspecht.
    visit: >-
      Der beste Einstieg gelingt im Besucherzentrum. Das Untergeschoss widmet sich der Höhlenwelt mit
      3D-Modellen von sechs der markantesten Höhlen sowie einem 3D-Relief des gesamten Parks und seiner Wege;
      das Erdgeschoss veranschaulicht Lage, Grenzen, Pfade, Reservate und Lebensräume von Natura 2000; das
      Obergeschoss stellt das Leben der lokalen Gemeinschaften vor.


      Die Parkverwaltung schlägt fünf Gebirgsrouten vor, gesäumt von Wasserfällen, Höhlen, Schluchten,
      abgelegenen Weilern und Aussichtskanzeln. Ein Weg führt von Băile Herculane über Coada Lacului zum
      Vânturătoarea-Wasserfall und zur Poiana Cicilovete. Ein anderer quert das Motel Dumbrava, die
      Țăsna-Schlucht, Moara Dracilor und Stâna Oprescu. Ein kürzerer Rundweg erschließt die Grota Haiducilor,
      Aussichtspunkte und die Munk-Quelle bis zur Quelle Izvorul Diana III. Die Domogledu-Mare-Runde misst 8,1
      km mit 861 m Aufstieg und 920 m Abstieg in fünf bis fünfeinhalb Stunden über die Höhle Peştera de Sub
      Şărban, den Kleinen und Großen Domogled und die Ferigari-Klamm. Eine weitere Runde durch das
      Mehedinți-Gebirge zum Vârful Ciolanu Mare und zur Țăsna-Klamm misst 8,6 km und beansprucht siebeneinhalb
      Stunden.


      Auf Anfrage bietet die Verwaltung Führungen zur Flora- und Faunabeobachtung sowie Landschaftsfotografie
      an.
    history: >-
      Die Römer nannten den Fluss Tierna und später Dierna; der heutige Name entstand mit der slawischen
      Besiedlung.


      Im Jahr 2017 wurde das UNESCO-Welterbe der Karpaten-Buchenurwälder erweitert. Domogled-Valea Cernei
      steuert 9.732,3 ha dieser Urwälder bei, darunter die Teilfläche Domogled-Coronini-Bedina mit 5.110,6 ha.
    before: >-
      In den oberen Karstlagen sind Wasserquellen äußerst spärlich oder versiegen ganz; führe daher stets
      ausreichend Trinkwasser mit. Bleibe auf den offiziell markierten Wegen. Jugendliche unter 14 Jahren
      dürfen den Park nur in Begleitung Erwachsener oder in geführten Gruppen betreten. Hunde müssen an der
      Leine geführt werden. Offenes Feuer ist ausschließlich an Campingplätzen und bewirtschafteten Berghütten
      gestattet.
    around: >-
      Direkt an den Domogled grenzt der [Nationalpark
      Retezat](/lugar/parcul-national-retezat---masivul-muntos/) bei 0 km, und nur 1 km entfernt liegt das
      [Mehedinți-Plateau](/lugar/rewilding-mehedinti-plateau/). Fünfzehn Kilometer entfernt erstreckt sich der
      [Nationalpark Đerdap - Eisernes Tor](/lugar/nacionalni-park-djerdap---puerta-de-hierro/), in 22 km
      Entfernung die [Sohodol-Schlucht](/lugar/cheile-sohodolului/) und neunundzwanzig Kilometer entfernt der
      [Nationalpark Semenic - Caraș-Klamm](/lugar/parcul-national-semenic---cheile-carasului/).
  it:
    intro: >-
      L'aria che risale la valle del Cerna reca una matrice mediterranea e oceanica, e il termometro lo
      conferma: le temperature superano quelle del resto della Romania. Domogled-Valea Cernei occupa 61.211
      ettari nel sud-ovest della Romania, suddivisi tra i distretti di Caraș-Severin, Mehedinți e Gorj,
      articolandosi attorno a un corso d'acqua che scende da oltre 2000 metri fino ai 168 m di Băile
      Herculane. È un parco nazionale di categoria II della IUCN comprendente undici riserve naturali.
    landscape: >-
      La valle del Cerna è una direttrice tettonica che separa due catene montuose dai lineamenti geologici
      opposti. Da una parte torreggiano i monti Godeanu, formati quasi per intero da scisti metamorfici;
      dall'altra si allungano i monti di Mehedinți, più modesti e composti da calcare. Nel mezzo, una fascia
      calcarea che costeggia il fiume crea gli elementi distintivi della valle: i ciuceve e i geanțuri,
      speroni calcarei isolati che sembrano rimbalzare da una sponda all'altra.


      La maggiore estensione calcarea del comprensorio corre tra il Vf. lui Stan e il Domogled. Precipita
      verso il Cerna con pareti di 400 - 600 m, solcate da forre carsiche: un dedalo di balze rupestri,
      doline, caverne, orridi e cascate.


      Il clima detta la fisionomia dell'ambiente. Per la sua configurazione, il bacino raccoglie soprattutto
      masse d'aria da ovest e sud-ovest; nei mesi invernali si insinuano correnti miti e umide atlantiche e
      mediterranee, e le perturbazioni meridionali scaricano piogge copiose a novembre e dicembre. Tale
      gradinata orografica, che dai più di 2000 m scende a 168 m, funge pertanto da vera scala termica.
    wildlife: >-
      La flora vascolare comprende circa 1110 specie, di cui 66 costituiscono entità minacciate, rare o
      parzialmente endemiche. L'area fu designata per tutelarne in primis tre: *Campanula serrata*,
      *Himantoglossum caprinum* e *Cypripedium calceolus*, incluse nell'allegato II della Direttiva Habitat.
      Le documentazioni citano inoltre come minacciate globalmente due specie di minuartia, *Minuartia
      graminifolia* e *Minuartia hirsuta*.


      Tra i mammiferi di primario interesse spiccano la [lontra europea](/especie/lutra_lutra/), l'[orso
      bruno](/especie/ursus_arctos/), la [lince](/especie/lynx_lynx/), il [lupo grigio](/especie/canis_lupus/)
      e il [gatto selvatico](/especie/felis_silvestris/). Frequenti sono pure la
      [martora](/especie/martes_martes/), il [cervo](/especie/cervus_elaphus/), il
      [capriolo](/especie/capreolus_capreolus/), il [camoscio alpino](/especie/rupicapra_rupicapra/) e il
      cinghiale. Dieci specie di pipistrelli animano le cavità ipogee, tra cui vespertilio maggiore e ferro di
      cavallo maggiore, mentre tra i rettili compare la [testuggine di Hermann](/especie/testudo_hermanni/),
      *Testudo hermanni*, assieme all'ululone dal ventre giallo.


      L'avifauna di rilievo comprende l'[aquila reale](/especie/aquila_chrysaetos/), il [gufo
      reale](/especie/bubo_bubo/), il biancone e il picchio dorsobianco.
    visit: >-
      La visita prende avvio dal centro accoglienza. Il piano interrato svela il mondo ipogeo con plastici in
      3D di sei delle caverne più rappresentative e una mappa in rilievo 3D dell'intero parco e dei suoi
      sentieri; il pianterreno espone confini, percorsi, riserve e gli habitat di Natura 2000; il primo piano
      approfondisce le comunità locali.


      L'ente gestore consiglia cinque itinerari montani che toccano cascate, caverne, orridi, borghi isolati e
      vette panoramiche. Un sentiero muove da Băile Herculane via Coada Lacului per la cascata Vânturătoarea e
      Poiana Cicilovete. Un secondo tocca Motel Dumbrava, le gole di Țăsna, Moara Dracilor e Stâna Oprescu. Un
      anello più breve collega la Grota Haiducilor, vari belvedere e la sorgente Munk fino all'Izvorul Diana
      III. Il periplo di Domogledu Mare misura 8,1 km con 861 m di dislivello positivo e 920 m di discesa in
      cinque - cinque ore e mezza, transitando per la Peştera de Sub Şărban, le cime Domogledu Mic e Mare e le
      gole Ferigari. Un'ulteriore traversata sui monti Mehedinți verso il Vârful Ciolanu Mare e le gole di
      Țăsna misura 8,6 km e dura circa sette ore e mezza.


      Guide ufficiali del parco sono a disposizione per escursioni botaniche, faunistiche e fotografiche.
    history: >-
      I Romani denominarono il fiume Tierna e successivamente Dierna; la denominazione odierna giunse con
      l'insediamento delle genti slave.


      Nel 2017 il sito seriale UNESCO delle faggete primarie dei Carpazi ha inglobato nuove parcelle. A
      Domogled-Valea Cernei ricadono 9.732,3 ha di queste foreste vetuste, tra cui la componente di
      Domogled-Coronini-Bedina con 5.110,6 ha.
    before: >-
      Sulle alte creste calcaree le sorgenti d'acqua sono scarse o inesistenti, per cui porta con te una
      congrua scorta idrica. Resta fedelmente sui sentieri ufficiali segnati. I minori di 14 anni possono
      accedere solo se accompagnati da adulti responsabili o in comitive guidate. I cani devono essere tenuti
      al guinzaglio sui tracciati. I fuochi sono consentiti esclusivamente nelle aree campeggio attrezzate e
      presso i rifugi autorizzati.
    around: >-
      Contiguo al Domogled si trova il [Parco Nazionale
      Retezat](/lugar/parcul-national-retezat---masivul-muntos/) a 0 km, e a solo 1 km l'[Altopiano di
      Mehedinți](/lugar/rewilding-mehedinti-plateau/). A quindici chilometri sorge il [Parco Nazionale Đerdap
      - Porta di Ferro](/lugar/nacionalni-park-djerdap---puerta-de-hierro/), a 22 km la [Gola di
      Sohodol](/lugar/cheile-sohodolului/) e a ventinove chilometri il [Parco Nazionale Semenic - Gole del
      Caraș](/lugar/parcul-national-semenic---cheile-carasului/).
  pt:
    intro: >-
      O ar que ascende pelo vale do Cerna tem proveniência mediterrânica e oceânica, e isso faz-se notar: as
      temperaturas registadas superam as do resto da Roménia. Domogled-Valea Cernei abrange 61.211 hectares no
      sudoeste do país, repartidos pelos distritos de Caraș-Severin, Mehedinți e Gorj, articulando-se em redor
      de um rio que precipita desde mais de 2000 metros de altitude até aos 168 m de Băile Herculane. É um
      parque nacional de categoria II da UICN integrando onze reservas naturais no seu interior.
    landscape: >-
      O vale do Cerna é um corredor tectónico que separa duas cordilheiras de traço geológico antitético. De
      um dos lados erguem-se os montes Godeanu, compostos quase em exclusivo por rochas metamórficas; do outro
      alinham-se os montes Mehedinți, de menor altitude e talhados em calcário. Pelo meio, uma faixa calcária
      que margeia o rio dá origem aos elementos mais singulares do vale: as ciuceve e os geanțuri, pequenos
      maciços calcários que parecem saltar de margem em margem.


      A mancha calcária mais contínua da região situa-se entre o Vf. lui Stan e o monte Domogled. Cai em
      direção ao Cerna em paredões abruptos de 400 a 600 m, rasgados por vales cársticos secos: um cenário de
      falésias, dolinas, grutas, algares, desfiladeiros e cascatas.


      O clima dita o resto. Pela sua orientação, a bacia recolhe primordialmente ventos de oeste e sudoeste;
      no inverno penetram massas de ar amenas e húmidas de génese mediterrânica e oceânica, e as depressões
      austrais descarregam chuvas fartas em novembro e dezembro. Daí que o relevo escalonado, caindo de mais
      de 2000 m até aos 168 m, funcione igualmente como uma escadaria de temperaturas.
    wildlife: >-
      A flora vascular totaliza cerca de 1110 espécies, contando 66 táxones ameaçados, raros ou parcialmente
      endémicos. A reserva foi instituída para salvaguardar três plantas em particular: *Campanula serrata*,
      *Himantoglossum caprinum* e *Cypripedium calceolus*, inscritas no anexo II da Diretiva Habitats. O
      inventário destaca ainda como ameaçadas à escala mundial duas arenárias, *Minuartia graminifolia* e
      *Minuartia hirsuta*.


      Nos mamíferos de relevo salientam-se a [lontra-europeia](/especie/lutra_lutra/), o
      [urso-pardo](/especie/ursus_arctos/), o [lince-euroasiático](/especie/lynx_lynx/), o
      [lobo-cinzento](/especie/canis_lupus/) e o [gato-bravo](/especie/felis_silvestris/). Ocorrem também a
      [marta do pinheiro europeia](/especie/martes_martes/), o [veado-vermelho](/especie/cervus_elaphus/), a
      [corça](/especie/capreolus_capreolus/), a [camurça](/especie/rupicapra_rupicapra/) e o javali. Dez
      espécies de morcegos de elevado interesse habitam as grutas, incluindo o morcego-rato-grande e o
      morcego-de-ferradura-grande, enquanto os répteis integram a
      [tartaruga-de-hermann](/especie/testudo_hermanni/), *Testudo hermanni*, a par do sapo-de-ventre-amarelo.


      A avifauna relevante acolhe a [águia-real](/especie/aquila_chrysaetos/), o
      [bufo-real](/especie/bubo_bubo/), a águia-cobreira e o pica-pau-de-dorso-branco.
    visit: >-
      Inicia o roteiro pelo centro de visitantes. Na cave encontra-se o domínio subterrâneo, com maquetes em
      3D de seis das cavernas mais notáveis e uma maquete em 3D de todo o relevo do parque e dos seus trilhos;
      o piso térreo esclarece limites, trajetos, reservas e os habitats da Rede Natura 2000; o piso superior
      enaltece as tradições das comunidades locais.


      A direção sugere cinco rotas de montanha, repletas de cascatas, grutas, canhões, aldeias serranas,
      miradouros e cumes. Um dos trilhos parte de Băile Herculane via Coada Lacului rumo à cascata
      Vânturătoarea e a Poiana Cicilovete. Outro atravessa o Motel Dumbrava, as gargantas de Țăsna, Moara
      Dracilor e Stâna Oprescu. Um traçado mais curto percorre a Grota Haiducilor, vários miradouros e a fonte
      Munk até ao Izvorul Diana III. O percurso circular de Domogledu Mare soma 8,1 km com 861 m de subida e
      920 m de descida, consumindo entre cinco e cinco horas e meia, passando pela cova Peştera de Sub Şărban,
      pelos cumes Domogledu Mic e Mare e pelas gargantas Ferigari. Outro anel nos montes Mehedinți rumo ao
      Vârful Ciolanu Mare e às gargantas de Țăsna mede 8,6 km e dura cerca de sete horas e meia.


      A administração disponibiliza guias especializados para observação de fauna e flora e fotografia de
      natureza.
    history: >-
      Os romanos designaram o rio como Tierna e mais tarde Dierna; o nome contemporâneo consolidou-se com o
      povoamento eslavo.


      Em 2017 ampliou-se o bem serial da UNESCO de florestas primárias de faia da Europa. Domogled-Valea
      Cernei aporta 9.732,3 ha de fagetos intactos, incluindo a parcela Domogled-Coronini-Bedina com 5.110,6
      ha.
    before: >-
      Nas plataformas calcárias superiores os mananciais de água são diminutos ou nulos, pelo que deves
      transportar água suficiente para a jornada inteira. Mantém-te nos trilhos sinalizados oficiais. Menores
      de 14 anos só podem aceder acompanhados por adultos responsáveis ou em grupos organizados. Os cães devem
      circular sempre com trela. Fogueiras só são consentidas nas áreas de acampamento e junto a abrigos
      turísticos com autorização expressa.
    around: >-
      Contíguo a Domogled situa-se o [Parque Nacional
      Retezat](/lugar/parcul-national-retezat---masivul-muntos/) a 0 km, e a apenas 1 km o [Planalto de
      Mehedinți](/lugar/rewilding-mehedinti-plateau/). A quinze quilómetros fica o [Parque Nacional Đerdap -
      Portas de Ferro](/lugar/nacionalni-park-djerdap---puerta-de-hierro/), a 22 km as [Gargantas de
      Sohodol](/lugar/cheile-sohodolului/) e a vinte e nove o [Parque Nacional Semenic - Gargantas do
      Caraș](/lugar/parcul-national-semenic---cheile-carasului/).
