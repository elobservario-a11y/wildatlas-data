resumen:
  es: >-
    Las 'Montañas Gigantes', la cordillera más alta de Europa Central al norte de los Alpes con tundras
    alpinas relictas de la Edad de Hielo.
  en: >-
    The 'Giant Mountains', Central Europe's highest range north of the Alps with alpine tundra relict from the
    Ice Age.
  fr: >-
    Les « Monts des Géants », la chaîne la plus élevée d'Europe centrale au nord des Alpes, avec des toundras
    alpines relictes de l'époque glaciaire.
  de: >-
    Das 'Riesengebirge', die höchste Gebirgskette Mitteleuropas nördlich der Alpen mit reliktären alpinen
    Tundren aus der Eiszeit.
  it: >-
    I 'Monti dei Giganti', la catena montuosa più alta dell'Europa centrale a nord delle Alpi con tundre
    alpine relitte dell'era glaciale.
  pt: >-
    As 'Montanhas dos Gigantes', a cordilheira mais alta da Europa Central a norte dos Alpes com tundras
    alpinas relíquias da Idade do Gelo.
unico:
  es: >-
    Una montaña media con rasgos de tundra, donde sobreviven plantas y animales que son reliquias de la
    glaciación.
  en: A mid-altitude mountain with tundra features, where plants and animals that are glacial relicts survive.
  fr: >-
    Une moyenne montagne aux allures de toundra, où survivent des plantes et des animaux qui sont des reliques
    glaciaires.
  de: Ein Mittelgebirge mit Tundracharakter, in dem Pflanzen und Tiere überleben, die Relikte der Eiszeit sind.
  it: Una media montagna dai tratti di tundra, dove sopravvivono piante e animali relitti dell'era glaciale.
  pt: >-
    Uma média montanha com feições de tundra, onde sobrevivem plantas e animais que são relíquias da
    glaciação.
observaciones:
  es: >-
    En las zonas tranquilas, que son ocho y cubren el 22,2 % del parque, solo se puede ir por los senderos
    señalizados. En invierno, los excursionistas deben caminar fuera de las pistas de esquí de fondo
    preparadas. El parque informa que en Krkonoše puede encontrarse ocasionalmente un lobo y recomienda
    mantenerse en los senderos y no acercarse.
texto:
  es:
    intro: >-
      Una línea invisible parte esta montaña en dos, y las nubes la cruzan sin pedir permiso. Krkonoše, o
      Karkonosze en polaco, es la cordillera más alta de Chequia y también la frontera con el país vecino. A
      cada lado hay un parque nacional: el polaco se creó el 16 de enero de 1959 y el checo el 17 de mayo de
      1963. En 1992 los dos entraron juntos en la red de reservas de la biosfera de la UNESCO, y en su cumbre,
      la Sněžka, de 1.603 m, se encuentra el punto más alto de Chequia.
    landscape: >-
      Para entender Krkonoše hay que imaginar el hielo. La última glaciación dejó circos, valles glaciares,
      morrenas, tors y mares de piedra por todo el parque, y todavía se leen en el relieve. La cresta
      principal la forma un plutón de granitoides, el de Krkonoše-Jizera, y en el este, cerca de Albeřice, hay
      incluso fenómenos kársticos.


      La altura ordena la vegetación en pisos. En lo bajo dominaban las hayas y los arces, pero los bosques
      nativos se talaron en gran parte y se sustituyeron por monocultivos de pícea. En el piso montano, desde
      el siglo XVIII, se formaron prados sin árboles con campanilla de Bohemia, violeta amarilla de los
      Sudetes, árnica y orquídeas. El límite del bosque alpino está entre 1.250 y 1.350 m, y por encima, en el
      piso subalpino, aparecen prados de inmortelas, turberas boreales y brezales bajos con plantas reliquia
      glaciar. Arriba del todo solo prosperan leñosas bajas, como el sauce de Silesia, el abedul de los
      Cárpatos y el pino mugo.


      El clima acompaña. En la Sněžka la temperatura media anual es de 0,2 °C y la nieve de las cumbres puede
      durar hasta 180 días. En otoño e invierno son frecuentes las inversiones térmicas, que a veces duran
      semanas. Además, el macizo está en la divisoria entre las cuencas del Elba y del Óder, es decir, entre
      el mar del Norte y el Báltico.
    wildlife: >-
      Las laderas rocosas y los circos glaciares de lo más alto, llamados a menudo jardines botánicos de
      Krkonoše, concentran la mayor diversidad de plantas. Entre las reliquias glaciares están la Pedicularis
      de los Gigantes, la saxífraga de las nieves, la mora ártica y el esfagno de Lindberg. El parque cuenta
      con unos 300 vertebrados y más de 1200 plantas vasculares.


      Entre los vertebrados destacados están el mirlo de collar, el [pechiazul](/especie/luscinia_svecica/),
      de hábitats parecidos a la tundra, y el [mirlo acuático](/especie/cinclus_cinclus/), adaptado a los
      arroyos rápidos. Varios invertebrados también son reliquias glaciares, como las libélulas Somatochlora
      alpestris y Aeshna coerulea, y Krkonoše tiene sus endemismos, como la efímera Rhithrogena corcontica.


      En el lado polaco viven unos 40 mamíferos, entre ellos castor, corzo y zorro, y 16 especies de
      murciélagos. El [lince](/especie/lynx_lynx/) volvió en 2006 pero desde marzo de 2018 no se constata, y
      los lobos aparecen desde 2014 y vuelven a criar. El muflón se introdujo a principios del siglo XX desde
      Córcega.
    visit: >-
      Los destinos clásicos son la Sněžka, el nacimiento del Elba, las cascadas de Pančava, del Elba y de
      Mumlava, el sendero de la turbera Černohorské rašeliniště, el valle Obří důl y el bosque antiguo de
      Dvorský les. En el lado polaco hay 112 km de senderos a pie, y una parte está abierta a bicicletas. En
      el lado checo hay unos 700 km de senderos señalizados. En invierno, los excursionistas deben caminar
      fuera de las pistas de esquí de fondo preparadas.


      La Sněžka fue una de las primeras montañas europeas visitadas por muchos turistas. De la primera subida
      que se conoce, en 1456, hay constancia por un mercader veneciano que buscaba piedras preciosas, y pronto
      surgieron en la montaña asentamientos mineros que explotaban cobre, hierro y arsénico.
    history: >-
      Las primeras reservas de Karkonosze, que protegían circos glaciares y monumentos naturales, se crearon
      en 1933. El parque checo se creó en 1963 y se redesignó en 1991. Las turberas del lado checo figuran
      entre los humedales Ramsar.


      La montaña paga su fama. En 2022 el parque registró más de 12,1 millones de visitas, un récord. Muchos
      visitantes se salen de los senderos en las zonas tranquilas, y en la cima de la Sněžka se han puesto
      barreras adicionales. Mientras tanto, en marzo de 2025 el parque inició un proyecto para recuperar el
      [abeto blanco](/especie/abies_alba/), reducido al 0,46 % del bosque.
    before: >-
      En las zonas tranquilas, que son ocho y cubren el 22,2 % del parque, solo se puede ir por los senderos
      señalizados. En invierno, los excursionistas deben caminar fuera de las pistas de esquí de fondo
      preparadas. El parque informa que en Krkonoše puede encontrarse ocasionalmente un lobo y recomienda
      mantenerse en los senderos y no acercarse.
    around: >-
      El [Parque Paisajístico del Valle del Bóbr](/lugar/park-krajobrazowy-doliny-bobru/) está a solo 1 km, y
      los [Hayedos de las Montañas de Jizera](/lugar/narodni-prirodni-rezervace-jizerskohorske-buciny/), a
      unos 18 km.
  en:
    intro: >-
      An invisible line cuts this mountain in two, and the clouds cross it without asking permission.
      Krkonoše, or Karkonosze in Polish, is the highest mountain range in Czechia and also the border with its
      neighbour. On each side lies a national park: the Polish park was established on 16 January 1959 and the
      Czech park on 17 May 1963. In 1992 both joined UNESCO's network of biosphere reserves, and at its
      summit, Sněžka, at 1,603 m, lies the highest point in Czechia.
    landscape: >-
      To understand Krkonoše one must imagine the ice. The last glaciation left cirques, glacial valleys,
      moraines, tors and blockfields across the range, all still clearly legible in the terrain. The main
      crest is formed by a granitoid pluton, the Krkonoše-Jizera pluton, and in the east, near Albeřice, karst
      phenomena even appear.


      Altitude organizes the vegetation into distinct belts. Beech and maple once dominated the lower slopes,
      but native woodlands were largely cleared and replaced by spruce monocultures. In the montane belt, from
      the eighteenth century onward, tree-free meadows emerged with Bohemian bellflower, Sudetic yellow
      violet, arnica and orchids. The alpine timberline lies between 1,250 and 1,350 m, and above it, in the
      subalpine belt, appear mountain avens grasslands, boreal bogs and dwarf-shrub heaths with glacial relict
      flora. At the very top only stunted woody plants survive, such as Silesian willow, Carpathian birch and
      mountain pine.


      The climate matches. On Sněžka the mean annual temperature is 0.2 °C and snow cover on the summits can
      persist for up to 180 days. In autumn and winter thermal inversions are common, sometimes lasting for
      weeks. Furthermore, the massif lies right on the main European watershed between the Elbe and Oder
      basins, that is, between the North Sea and the Baltic.
    wildlife: >-
      The rocky slopes and high glacial cirques, often termed the botanical gardens of Krkonoše, concentrate
      the highest plant diversity. Among the glacial relicts are the Bohemian lousewort, snow saxifrage,
      cloudberry and Lindberg's bogmoss. The park is home to around 300 vertebrates and more than 1200
      vascular plants.


      Notable vertebrates include the ring ouzel, the [Bluethroat](/especie/luscinia_svecica/), inhabiting
      tundra-like open expanses, and the [White-throated dipper](/especie/cinclus_cinclus/), adapted to swift
      mountain streams. Several invertebrates are also glacial relicts, such as the alpine emerald dragonfly
      and the azure hawker, while Krkonoše has its own endemics, such as the mayfly Rhithrogena corcontica.


      On the Polish side about 40 mammals live, including beaver, roe deer and red fox, along with 16 species
      of bats. The [Eurasian lynx](/especie/lynx_lynx/) returned in 2006, though none have been confirmed
      since March 2018, while wolves have appeared since 2014 and are once again breeding. The mouflon was
      introduced at the start of the twentieth century from Corsica.
    visit: >-
      Classic excursions include Sněžka summit, the source of the Elbe, the waterfalls of Pančava, the Elbe
      and Mumlava, the Černohorské rašeliniště peat bog trail, the Obří důl valley and the old-growth Dvorský
      les forest. On the Polish side there are 112 km of hiking trails, with portions open to mountain biking.
      On the Czech side there are some 700 km of marked trails. In winter, hikers must walk strictly outside
      groomed cross-country ski tracks.


      Sněžka was one of the earliest European mountains frequented by tourists. The first recorded ascent, in
      1456, was logged by a Venetian merchant prospecting for precious stones, and mining settlements
      extracting copper, iron and arsenic soon sprang up around the mountain.
    history: >-
      The earliest reserves in Karkonosze, created to safeguard glacial cirques and natural monuments, date
      from 1933. The Czech national park was created in 1963 and reorganized in 1991. The peatlands on the
      Czech side are recognized among Ramsar wetlands.


      The mountain pays for its popularity. In 2022 the park recorded over 12.1 million visits, an absolute
      record. Many visitors stray from paths in quiet zones, prompting additional protective fences on the
      Sněžka summit. Meanwhile, in March 2025 the park launched an initiative to restore the [Silver
      fir](/especie/abies_alba/), currently reduced to just 0.46 % of the forest.
    before: >-
      In the quiet zones, which are eight in number and cover 22.2 % of the park, you can only travel on
      marked trails. In winter, hikers must stay off prepared cross-country tracks. The park advises that
      wolves may occasionally be encountered in Krkonoše, recommending that you stay on marked paths and never
      approach wildlife.
    around: >-
      The [Parque Paisajístico del Valle del Bóbr](/lugar/park-krajobrazowy-doliny-bobru/) lies just 1 km
      away, and the [Hayedos de las Montañas de
      Jizera](/lugar/narodni-prirodni-rezervace-jizerskohorske-buciny/) about 18 km distant.
  fr:
    intro: >-
      Une ligne invisible sépare cette montagne en deux, et les nuages la franchissent sans demander la
      permission. Krkonoše, ou Karkonosze en polonais, est la chaîne la plus élevée de Tchéquie et marque
      aussi la frontière avec son voisin. De chaque côté s'étend un parc national : le parc polonais a été
      créé le 16 janvier 1959 et le parc tchèque le 17 mai 1963. En 1992, les deux ont été intégrés
      conjointement au réseau des réserves de biosphère de l'UNESCO, et sur son sommet, la Sněžka, à 1 603 m,
      se trouve le point culminant de la Tchéquie.
    landscape: >-
      Pour comprendre Krkonoše, il faut se représenter la glace. La dernière glaciation a laissé des cirques,
      des vallées glaciaires, des moraines, des tors et des mers de blocs à travers tout le massif, toujours
      parfaitement lisibles dans le relief. L'arête faîtière est constituée d'un pluton de granitoïdes, le
      pluton de Krkonoše-Jizera, et à l'est, près d'Albeřice, se développent même des phénomènes karstiques.


      L'altitude étage la végétation. En bas dominaient le hêtre et l'érable, mais les forêts originelles ont
      été en grande partie coupées et remplacées par des monocultures d'épicéas. À l'étage montagnard, à
      partir du XVIIIe siècle, se sont créées des prairies sans arbres peuplées de campanules de Bohême, de
      violettes jaunes des Sudètes, d'arnica et d'orchidées. La limite de la forêt alpine se situe entre 1 250
      et 1 350 m, et au-dessus, dans l'étage subalpin, apparaissent des pelouses à dryades, des tourbières
      boréales et des landes naines abritant des plantes relictes glaciaires. Tout au sommet ne prospèrent que
      des ligneux nains, tels le saule de Silésie, le bouleau des Carpates et le pin couché.


      Le climat est à l'avenant. Sur la Sněžka, la température moyenne annuelle est de 0,2 °C et l'enneigement
      sommital peut persister jusqu'à 180 jours. En automne et en hiver, les inversions thermiques sont
      fréquentes et durent parfois des semaines. De surcroît, le massif se dresse sur la ligne de partage des
      eaux entre l'Elbe et l'Oder, soit entre la mer du Nord et la Baltique.
    wildlife: >-
      Les versants rocheux et les cirques glaciaires sommaux, souvent qualifiés de jardins botaniques de
      Krkonoše, concentrent la plus remarquable diversité végétale. Parmi les reliques glaciaires figurent la
      pédiculaire des Géants, la saxifrage des neiges, la ronce petit-mûrier et la sphaigne de Lindberg. Le
      parc héberge environ 300 vertébrés et plus de 1200 plantes vasculaires.


      Parmi les vertébrés remarquables figurent le merle à plastron, la [Gorgebleue à
      miroir](/especie/luscinia_svecica/), inféodée aux étendues ouvertes d'aspect toundrique, et le [Cincle
      plongeur](/especie/cinclus_cinclus/), inféodé aux torrents rapides. Plusieurs invertébrés sont également
      des reliques glaciaires, comme la cordulie alpine et l'æschne bleue, tandis que Krkonoše possède ses
      propres endémiques, telle l'éphémère Rhithrogena corcontica.


      Côté polonais vivent environ 40 mammifères, parmi lesquels le castor, le chevreuil et le renard roux,
      ainsi que 16 espèces de chauves-souris. Le [Lynx boréal](/especie/lynx_lynx/) a fait son retour en 2006
      mais n'a plus été confirmé depuis mars 2018, tandis que le loup est réapparu en 2014 et s'y reproduit de
      nouveau. Le mouflon a été introduit au début du XXe siècle depuis la Corse.
    visit: >-
      Les destinations phares sont la Sněžka, la source de l'Elbe, les cascades de Pančava, de l'Elbe et de
      Mumlava, le sentier de la tourbière Černohorské rašeliniště, la vallée d'Obří důl et la forêt ancienne
      de Dvorský les. Côté polonais, vous disposez de 112 km de sentiers pédestres, dont une partie est
      accessible aux vélos. Côté tchèque, environ 700 km de sentiers balisés vous attendent. En hiver, les
      marcheurs doivent impérativement cheminer en dehors des pistes de ski de fond damées.


      La Sněžka fut l'une des toutes premières montagnes européennes arpentées par les voyageurs. La première
      ascension documentée remonte à 1456, consignée par un marchand vénitien en quête de pierres précieuses,
      et des hameaux miniers exploitant le cuivre, le fer et l'arsenic s'établirent rapidement sur ses pentes.
    history: >-
      Les premières réserves de Karkonosze, protégeant cirques glaciaires et curiosités naturelles, ont vu le
      jour en 1933. Le parc tchèque a été créé en 1963 et réorganisé en 1991. Les tourbières du versant
      tchèque comptent parmi les zones humides Ramsar.


      La montagne paie le tribut de sa renommée. En 2022, le parc a enregistré plus de 12,1 millions de
      visiteurs, un record absolu. De nombreux promeneurs quittent les sentiers dans les zones de quiétude,
      conduisant à installer des barrières supplémentaires au sommet de la Sněžka. Parallèlement, en mars
      2025, le parc a lancé un programme de sauvegarde du [Sapin blanc](/especie/abies_alba/), réduit à 0,46 %
      du peuplement forestier.
    before: >-
      Dans les zones de quiétude, au nombre de huit et couvrant 22,2 % du parc, il est formellement exigé de
      ne pas s'écarter des sentiers balisés. En hiver, les randonneurs doivent marcher hors des pistes de ski
      de fond préparées. Le parc signale que des loups peuvent être observés occasionnellement dans les
      Krkonoše et recommande de rester sur les chemins sans tenter de s'en approcher.
    around: >-
      Le [Parque Paisajístico del Valle del Bóbr](/lugar/park-krajobrazowy-doliny-bobru/) se situe à seulement
      1 km, et les [Hayedos de las Montañas de
      Jizera](/lugar/narodni-prirodni-rezervace-jizerskohorske-buciny/) à environ 18 km.
  de:
    intro: >-
      Eine unsichtbare Linie teilt diesen Berg in zwei Hälften, und die Wolken ziehen ungehindert hinüber. Das
      Krkonoše-Gebirge, polnisch Karkonosze, ist die höchste Kette Tschechiens und bildet zugleich die Grenze
      zum Nachbarland. Auf beiden Seiten liegt ein Nationalpark: Der polnische wurde am 16. Januar 1959 und
      der tschechische am 17. Mai 1963 gegründet. Im Jahr 1992 wurden beide gemeinsam in das UNESCO-Netz der
      Biosphärenreservate aufgenommen, und auf seinem Gipfel, der Sněžka, befindet sich auf 1.603 m der
      höchste Punkt Tschechiens.
    landscape: >-
      Um das Riesengebirge zu verstehen, muss man sich das Eis vergegenwärtigen. Die letzte Kaltzeit
      hinterließ Kare, Trogtäler, Moränen, Granitfelsen und Blockmeere im gesamten Gebirge, die das Relief bis
      heute prägen. Der Hauptkamm besteht aus einem Granitoid-Pluton, dem Riesengebirgs-Isergebirgs-Pluton,
      und im Osten bei Albeřice treten sogar Karstformen auf.


      Die Höhenlage gliedert die Vegetation in Gürtel. Im unteren Bereich herrschten einst Buchen und Ahorne
      vor, die Urwälder wurden jedoch weitgehend gerodet und durch Fichtenmonokulturen ersetzt. In der
      montanen Stufe bildeten sich ab dem achtzehnten Jahrhundert waldfreie Wiesen mit Böhmischer
      Glockenblume, Sudeten-Stiefmütterchen, Arnika und Orchideen. Die alpine Waldgrenze verläuft zwischen
      1.250 und 1.350 m, und darüber breiten sich in der subalpinen Stufe Silberwurz-Fluren, boreale Moore und
      Zwergstrauchheiden mit Eiszeitrelikten aus. Zuoberst überleben nur noch kriechende Gehölze wie
      Schlesische Weide, Karpaten-Birke und Bergkiefer.


      Das Klima ist rau. Auf der Sněžka beträgt die Jahresmitteltemperatur 0,2 °C und die Schneedecke der
      Gipfel kann bis zu 180 Tage überdauern. Im Herbst und Winter treten häufig Inversionswetterlagen auf,
      die mitunter wochenlang anhalten. Zudem liegt das Massiv genau auf der Wasserscheide zwischen Elbe und
      Oder, mithin zwischen Nordsee und Ostsee.
    wildlife: >-
      Die felsigen Hänge und Hochkare, oft als botanische Gärten des Riesengebirges bezeichnet, vereinen die
      größte Pflanzenvielfalt. Zu den Glazialrelikten zählen das Sudeten-Läusekraut, der Schnee-Steinbrech,
      die Moltebeere und das Lindberg-Torfmoos. Der Park beherbergt rund 300 Wirbeltierarten und mehr als 1200
      Gefäßpflanzen.


      Zu den bemerkenswerten Wirbeltieren gehören die Ringdrossel, das
      [Blaukehlchen](/especie/luscinia_svecica/) in tundraartigen Offenlandzonen und die an reißende
      Gebirgsbäche angepasste [Wasseramsel](/especie/cinclus_cinclus/). Mehrere wirbellose Tiere sind
      ebenfalls Eiszeitrelikte, darunter die Alpen-Smaragdlibelle und die Torf-Mosaikjungfer; zugleich weist
      das Gebirge Endemiten wie die Eintagsfliege Rhithrogena corcontica auf.


      Auf polnischer Seite leben rund 40 Säugetierarten, darunter Biber, Reh und Rotfuchs, sowie 16
      Fledermausarten. Der [Eurasische Luchs](/especie/lynx_lynx/) kehrte 2006 zurück, wurde jedoch seit März
      2018 nicht mehr nachgewiesen, während Wölfe seit 2014 wieder sesshaft sind und Junge aufziehen. Das
      Mufflon wurde zu Beginn des zwanzigsten Jahrhunderts aus Korsika angesiedelt.
    visit: >-
      Klassische Ziele sind die Sněžka, die Elbquelle, die Pančava-, Elb- und Mumlava-Wasserfälle, der
      Moorpfad Černohorské rašeliniště, das Riesengrundtal Obří důl und der alte Urwald Dvorský les. Auf
      polnischer Seite stehen dir 112 km Wanderwege offen, von denen Teile für Fahrräder freigegeben sind. Auf
      tschechischer Seite gibt es rund 700 km markierte Wanderwege. Im Winter müssen Wanderer strikt abseits
      der gespurten Langlaufloipen gehen.


      Die Sněžka war einer der ersten europäischen Berge, die von Reisenden erstiegen wurden. Die erste
      belegte Besteigung im Jahr 1456 ist durch einen venezianischen Kaufmann überliefert, der nach
      Edelsteinen suchte; bald darauf entstanden Bergbausiedlungen, die Kupfer, Eisen und Arsen förderten.
    history: >-
      Die ersten Schutzgebiete im Riesengebirge, die Gletscherkare und Naturdenkmale schützten, wurden 1933
      eingerichtet. Der tschechische Nationalpark entstand 1963 und wurde 1991 neu geordnet. Die Moore der
      tschechischen Seite zählen zu den Ramsar-Feuchtgebieten.


      Das Gebirge trägt schwer an seiner Bekanntheit. Im Jahr 2022 verzeichnete der Park mehr als 12,1
      Millionen Besucher, ein Rekordwert. Viele Gäste verlassen in den Ruhezonen die Wege, weshalb auf dem
      Gipfel der Sněžka zusätzliche Leitsysteme errichtet wurden. Unterdessen startete der Park im März 2025
      ein Projekt zur Wiederansiedlung der [Weiß-Tanne](/especie/abies_alba/), die auf 0,46 % des Waldes
      zurückgedrängt war.
    before: >-
      In den acht Ruhezonen, die 22,2 % der Parkfläche einnehmen, darfst du dich ausschließlich auf den
      markierten Wanderwegen bewegen. Im Winter müssen Wanderer außerhalb der präparierten Loipen bleiben. Die
      Parkverwaltung weist darauf hin, dass im Riesengebirge gelegentlich Wölfe angetroffen werden können, und
      empfiehlt, auf den Pfaden zu bleiben und Abstand zu halten.
    around: >-
      Der [Parque Paisajístico del Valle del Bóbr](/lugar/park-krajobrazowy-doliny-bobru/) ist nur 1 km
      entfernt, und die [Hayedos de las Montañas de
      Jizera](/lugar/narodni-prirodni-rezervace-jizerskohorske-buciny/) liegen in etwa 18 km Entfernung.
  it:
    intro: >-
      Una linea invisibile divide questa montagna in due, e le nuvole la attraversano senza chiedere il
      permesso. Krkonoše, o Karkonosze in polacco, è la catena più alta della Cechia e coincide con il confine
      con il paese vicino. Su ciascun versante sorge un parco nazionale: quello polacco fu istituito il 16
      gennaio 1959 e quello ceco il 17 maggio 1963. Nel 1992 entrambi sono entrati insieme nella rete delle
      riserve della biosfera dell'UNESCO, e sulla sua cima, la Sněžka, a 1.603 m, si trova il punto più alto
      della Cechia.
    landscape: >-
      Per comprendere Krkonoše bisogna immaginare il ghiaccio. L'ultima glaciazione ha impresso circhi, valli
      glaciali, morene, torrioni rocciosi e distese di massi in tutto il massiccio, elementi tuttora
      chiaramente visibili nel rilievo. La dorsale principale è formata da un plutone di granitoidi, quello di
      Krkonoše-Jizera, e a oriente, nei pressi di Albeřice, si manifestano persino fenomeni carsici.


      La quota organizza la vegetazione per fasce altitudinali. Più in basso dominavano faggi e aceri, ma le
      foreste originarie sono state in gran parte disboscate e sostituite da monocolture di abete rosso. Nella
      fascia montana, a partire dal XVIII secolo, si sono sviluppate praterie aperte arricchite da campanule
      di Boemia, viole dei Sudeti, arnica e orchidee. Il limite superiore del bosco si attesta tra 1.250 e
      1.350 m, e oltre, nella fascia subalpina, si aprono praterie a camedrio alpino, torbiere boreali e
      brughiere nane con flora relitta glaciale. Sulla sommità riescono a prosperare solo specie legnose nane,
      come il salice di Slesia, la betulla dei Carpazi e il pino mugo.


      Il clima riflette questa asprezza. Sulla Sněžka la temperatura media annua è di 0,2 °C e la neve sulle
      vette può persistere fino a 180 giorni. In autunno e in inverno sono frequenti le inversioni termiche,
      che a volte durano settimane. Inoltre il massiccio si colloca sullo spartiacque europeo tra i bacini
      dell'Elba e dell'Oder, ovvero tra il Mare del Nord e il Baltico.
    wildlife: >-
      I versanti dirupati e i circhi glaciali sommitali, spesso definiti giardini botanici di Krkonoše,
      concentrano la massima biodiversità vegetale. Tra i relitti glaciali si annoverano il pedicolare di
      Boemia, la sassifraga delle nevi, il camemoro e lo sfagno di Lindberg. Il parco ospita circa 300
      vertebrati e più di 1200 piante vascolari.


      Tra i vertebrati spiccano il merlo dal collare, il [Pettazzurro](/especie/luscinia_svecica/), legato ad
      ambienti aperti simili alla tundra, e il [Merlo acquaiolo](/especie/cinclus_cinclus/), specializzato nei
      torrenti impetuosi. Diversi invertebrati costituiscono altrettanti relitti glaciali, come la libellula
      alpina e l'aeshna azzurra, mentre Krkonoše vanta endemismi propri, tra cui l'efimera Rhithrogena
      corcontica.


      Sul versante polacco vivono circa 40 mammiferi, inclusi castoro, capriolo e volpe, oltre a 16 specie di
      pipistrelli. La [lince eurasiatica](/especie/lynx_lynx/) è tornata nel 2006 ma non viene documentata dal
      marzo 2018, mentre il lupo è ricomparso dal 2014 e ha ripreso a riprodursi. Il muflone fu introdotto
      all'inizio del XX secolo dalla Corsica.
    visit: >-
      Le mete irrinunciabili sono la vetta della Sněžka, le sorgenti dell'Elba, le cascate di Pančava,
      dell'Elba e di Mumlava, il sentiero della torbiera Černohorské rašeliniště, la valle Obří důl e la
      foresta secolare di Dvorský les. Sul versante polacco si sviluppano 112 km di sentieri a piedi, in parte
      accessibili in bicicletta. Sul lato ceco sono presenti circa 700 km di tracciati segnalati. In inverno
      gli escursionisti a piedi devono obbligatoriamente procedere al di fuori dei binari battuti per lo sci
      di fondo.


      La Sněžka è stata una delle prime vette europee raggiunte da visitatori ed esploratori. La prima
      ascensione documentata, avvenuta nel 1456, fu compiuta da un mercante veneziano alla ricerca di pietre
      preziose, e presto sorsero sulla montagna insediamenti minerari per l'estrazione di rame, ferro e
      arsenico.
    history: >-
      Le prime riserve di Karkonosze, nate per tutelare circhi glaciali e formazioni naturali, furono
      istituite nel 1933. Il parco ceco è stato creato nel 1963 e riordinato nel 1991. Le torbiere del
      versante ceco rientrano tra le zone umide Ramsar.


      La montagna sconta la propria notorietà. Nel 2022 il parco ha registrato oltre 12,1 milioni di
      visitatori, una cifra senza precedenti. Molti turisti escono dai sentieri nelle zone di quiete,
      inducendo a installare barriere protettive supplementari sulla cima della Sněžka. Nel frattempo, nel
      marzo 2025 il parco ha avviato un programma di ripristino dell'[Abete bianco](/especie/abies_alba/),
      ridotto allo 0,46 % del manto forestale.
    before: >-
      Nelle zone di quiete, otto in totale che occupano il 22,2 % del parco, è consentito camminare solo lungo
      i tracciati segnati. In inverno gli escursionisti devono camminare fuori dalle piste di fondo battute.
      L'amministrazione segnala che a Krkonoše è possibile imbattersi occasionalmente nel lupo e raccomanda di
      mantenersi sui sentieri evitando di avvicinarsi.
    around: >-
      Il [Parque Paisajístico del Valle del Bóbr](/lugar/park-krajobrazowy-doliny-bobru/) dista appena 1 km, e
      le [Hayedos de las Montañas de Jizera](/lugar/narodni-prirodni-rezervace-jizerskohorske-buciny/) sorgono
      a circa 18 km.
  pt:
    intro: >-
      Uma linha invisível divide esta montanha em duas, e as nuvens cruzam-na sem pedir licença. Krkonoše, ou
      Karkonosze em polaco, é a cordilheira mais alta da Chéquia e constitui também a fronteira com o país
      vizinho. De cada lado existe um parque nacional: o polaco foi criado a 16 de janeiro de 1959 e o checo a
      17 de maio de 1963. Em 1992 ambos integraram em conjunto a rede de reservas da biosfera da UNESCO, e no
      seu cume, o Sněžka, a 1603 m, situa-se o ponto mais alto da Chéquia.
    landscape: >-
      Para compreender Krkonoše é preciso imaginar o gelo. A última glaciação deixou circos, vales glaciares,
      moreias, relevos residuais e campos de blocos por todo o maciço, elementos que ainda se leem com clareza
      no relevo. A crista principal é formada por um plutão de granitoides, o de Krkonoše-Jizera, e a leste,
      perto de Albeřice, surgem inclusive formações cársticas.


      A altitude organiza a vegetação em andares. Nas cotas baixas dominavam as faias e os bordos, mas as
      florestas nativas foram largamente desbravadas e substituídas por monoculturas de abeto-falso. No andar
      montano, a partir do século XVIII, formaram-se prados abertos com campainhas-da-boémia,
      violetas-dos-sudetas, árnica e orquídeas. O limite superior da floresta alpina situa-se entre 1250 e
      1350 m, e acima, no andar subalpino, surgem prados de ávencas-da-montanha, turfeiras boreais e charnecas
      anãs com flora relíquia glaciar. No topo absoluto prosperam apenas espécies lenhosas rasteiras, como o
      salgueiro-da-silésia, o bétula-dos-cárpatos e o pinheiro-das-rochas.


      O clima acompanha este rigor. No Sněžka a temperatura média anual é de 0,2 °C e o manto de neve dos
      cumes pode perdurar até 180 dias. No outono e no inverno são frequentes as inversões térmicas, que por
      vezes se prolongam por semanas. Além disso, o maciço ergue-se na divisória de águas entre as bacias do
      Elba e do Óder, ou seja, entre o mar do Norte e o Báltico.
    wildlife: >-
      As encostas rochosas e os circos glaciares mais elevados, amiúde chamados jardins botânicos de Krkonoše,
      concentram a maior diversidade vegetal. Entre as relíquias glaciares contam-se a pedicular-dos-gigantes,
      a saxifraga-das-neves, a amora-ártica e o esfagno de Lindberg. O parque acolhe cerca de 300 vertebrados
      e mais de 1200 plantas vasculares.


      Entre os vertebrados de destaque encontram-se o melro-de-peito-branco, o
      [Pisco-de-peito-azul](/especie/luscinia_svecica/), ligado a habitats abertos semelhantes à tundra, e o
      [Melro-d'água](/especie/cinclus_cinclus/), adaptado a correntes fluviais impetuosas. Vários
      invertebrados são também relíquias glaciares, como as libélulas Somatochlora alpestris e Aeshna
      coerulea, e Krkonoše possui os seus próprios endemismos, como a efemérida Rhithrogena corcontica.


      No setor polaco habitam cerca de 40 mamíferos, entre eles o castor, o corço e a raposa, além de 16
      espécies de morcegos. O [Lince-euroasiático](/especie/lynx_lynx/) regressou em 2006, embora não haja
      registos confirmados desde março de 2018, ao passo que os lobos reapareceram a partir de 2014 e voltaram
      a reproduzir-se. O muflão foi introduzido no início do século XX a partir da Córsega.
    visit: >-
      Os destinos clássicos são o cume do Sněžka, a nascente do Elba, as cascatas de Pančava, do Elba e de
      Mumlava, o trilho da turfeira Černohorské rašeliniště, o vale Obří důl e a floresta secular de Dvorský
      les. No setor polaco há 112 km de trilhos pedestres, estando parte aberta a bicicletas. No lado checo
      existem cerca de 700 km de caminhos sinalizados. No inverno, os caminhantes devem caminhar estritamente
      fora das pistas de esqui de fundo preparadas.


      O Sněžka foi uma das primeiras montanhas europeias frequentadas por viajantes. A primeira ascensão
      documentada, em 1456, foi registada por um mercador veneziano que procurava pedras preciosas, e em breve
      se fixaram na montanha povoações mineiras que exploravam cobre, ferro e arsénico.
    history: >-
      As primeiras reservas de Karkonosze, criadas para resguardar circos glaciares e monumentos naturais,
      datam de 1933. O parque checo foi estabelecido em 1963 e reestruturado em 1991. As turfeiras do lado
      checo figuram entre as zonas húmidas Ramsar.


      A montanha paga o preço da sua popularidade. Em 2022 o parque registou mais de 12,1 milhões de visitas,
      um recorde histórico. Muitos visitantes afastam-se dos trilhos nas zonas de tranquilidade, o que levou à
      colocação de vedações adicionais no topo do Sněžka. Entretanto, em março de 2025 o parque lançou um
      projeto para recuperar o [abeto-branco](/especie/abies_alba/), reduzido a 0,46 % da mancha florestal.
    before: >-
      Nas zonas de tranquilidade, que são oito e ocupam 22,2 % do parque, só podes circular nos trilhos
      sinalizados. No inverno, os caminhantes devem circular fora das pistas preparadas para esqui de fundo. O
      parque adverte que em Krkonoše se pode encontrar ocasionalmente um lobo e recomenda que te mantenhas nos
      caminhos sem te aproximares.
    around: >-
      O [Parque Paisajístico del Valle del Bóbr](/lugar/park-krajobrazowy-doliny-bobru/) fica a apenas 1 km, e
      os [Hayedos de las Montañas de Jizera](/lugar/narodni-prirodni-rezervace-jizerskohorske-buciny/) a cerca
      de 18 km.
