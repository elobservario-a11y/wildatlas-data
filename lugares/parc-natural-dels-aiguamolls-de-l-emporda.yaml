resumen:
  es: >-
    Reserva de humedales costeros y marismas fluviales en la desembocadura de los ríos Muga y Fluvià en la
    Costa Brava.
  en: Coastal wetland and fluvial marsh reserve at the mouths of the Muga and Fluvià rivers on the Costa Brava.
  fr: >-
    Réserve de zones humides côtières et marécages fluviaux à l'embouchure des fleuves Muga et Fluvià sur la
    Costa Brava.
  de: >-
    Küstenfeuchtgebiet und fluvialer Sumpfreservat an den Mündungen der Flüsse Muga und Fluvià an der Costa
    Brava.
  it: Riserva di zone umide costiere e paludi fluviali alle foci dei fiumi Muga e Fluvià sulla Costa Brava.
  pt: Reserva de zonas húmidas costeiras e pântanos fluviais nas fozas dos rios Muga e Fluvià na Costa Brava.
unico:
  es: >-
    Uno de los últimos humedales de la Costa Brava, con las únicas playas vírgenes que quedan en ella y 338
    especies de aves observadas.
  en: >-
    One of the last wetlands of the Costa Brava, with the only remaining virgin beaches there and 338 observed
    bird species.
  fr: >-
    Une des dernières zones humides de la Costa Brava, avec les seules plages vierges qui y subsistent et 338
    espèces d'oiseaux observées.
  de: >-
    Eines der letzten Feuchtgebiete der Costa Brava, mit den einzigen verbliebenen unberührten Stränden und
    338 beobachteten Vogelarten.
  it: >-
    Una delle ultime zone umide della Costa Brava, con le uniche spiagge vergini rimaste e 338 specie di
    uccelli osservate.
  pt: >-
    Uma das últimas zonas húmidas da Costa Brava, com as únicas praias virgens que lá restam e 338 espécies de
    aves observadas.
observaciones:
  es: >-
    Más del 80 % del territorio es de propiedad privada y gran parte es agrícola: respeta cultivos y vecinos.
    No se permiten la captura ni la recolección de animales y plantas, la acampada libre ni el acceso con
    vehículos a los itinerarios. Lleva repelente de mosquitos todo el año, sin picaridina, que es muy tóxica
    para los anfibios. El horario de los centros cambia según la temporada, así que consúltalo antes de ir.
texto:
  es:
    intro: >-
      En 1976 alguien escribió el primer texto en defensa de unos humedales que estaban a punto de convertirse
      en urbanización. El plan de 1974 para la marina residencial de Port Llevant preveía 525 ha de canales
      navegables sobre las lagunas de Castelló d'Empúries, y de esa amenaza nació una campaña que acabó
      salvando lo que hoy es el Parque Natural dels Aiguamolls de l'Empordà. Quedan en la llanura ampurdanesa,
      entre las desembocaduras del Fluvià y la Muga, y son una de las principales zonas húmedas de Cataluña,
      junto con los deltas del Ebro y del Llobregat. Son los restos de un sistema pantanoso muy extenso que
      fue desapareciendo.
    landscape: >-
      La historia del agua está en cada rincón. Hubo un tiempo en que los humedales ocupaban casi toda la
      llanura de la bahía de Roses y del bajo Ter; la expansión agrícola, primero, y la construcción
      turística, después, los fueron reduciendo. Lo que sobrevive nació de un sistema deltaico: la interacción
      entre los aportes del Fluvià y la Muga y la dinámica marina creó las zonas húmedas.


      Los marjales son hábitats de transición, entre lo acuático y lo terrestre, con fronteras difíciles de
      identificar: pueden estar inundados, secos o a medias, con agua dulce, salobre o ligeramente salada. Una
      red viva de acequias, canales y regueras drena los terrenos inundables, regula el agua de arrozales y
      prados y transporta el agua de riego. Detrás de la playa están las llaunes, lagunas salobres del litoral
      entre las desembocaduras de la Muga y el Fluvià. Los estanques de agua dulce son restos del antiguo
      estanque de Castelló; el más emblemático es el de Vilaüt. Las closes son prados de pasto típicos,
      rodeados de acequias y arbolado de ribera, que ocupan antiguos estanques y se inundan en época de
      lluvias. En los terrenos más secos, los aspres, hay cultivos de secano y matorral.


      La flora lo refleja: hay plantas psamófilas, de suelos de arena, y halófilas, de suelos salados, además
      de especies exclusivas o poco comunes en los Países Catalanes. Se han registrado 1.098 taxones. Entre
      los hábitats, doce son de interés comunitario.
    wildlife: >-
      Se han observado 338 especies de aves, 82 de ellas nidificantes regulares. La [cigüeña
      blanca](/especie/ciconia_ciconia/), reintroducida, cría aquí desde 1987 y es muy habitual. Entre las que
      crían figuran el [avetoro común](/especie/botaurus_stellaris/), en lagunas con mucho carrizal, la [garza
      imperial](/especie/ardea_purpurea/), el [aguilucho lagunero](/especie/circus_aeruginosus/), el [calamón
      común](/especie/porphyrio_porphyrio/) y la cigüeñuela. El [morito](/especie/plegadis_falcinellus/) y la
      [espátula](/especie/platalea_leucorodia/) se ven en migración, siempre en cifras bajas, y grupos de
      [flamencos](/especie/phoenicopterus_roseus/) pasan el invierno o hacen escala. La [águila
      pescadora](/especie/pandion_haliaetus/) pasa por el parque, y siempre se queda algún invernante en el
      Fluvià o en los salicornares. En los terrenos secos con cultivos leñosos destaca la carraca, rara en el
      parque y en toda Cataluña; en la época de cría anidan el [martín pescador](/especie/alcedo_atthis/) y
      numerosas parejas de abejaruco.


      El invierno cambia el reparto: se concentran miles de ardeidos, como la [garcilla
      bueyera](/especie/bubulcus_ibis/), y miles de ánades reales, y entre las limícolas invernan grandes
      grupos de chorlito dorado común y avefría. Los censos sitúan a los Aiguamolls como la segunda zona de
      Cataluña en aves acuáticas invernantes, tras el delta del Ebro. La cerceta carretona, que se eligió como
      símbolo del parque porque era la única ave acuática de la península que criaba regularmente solo aquí,
      se considera hoy extinguida como nidificante: sus últimos intentos de cría fueron en 1997. En el río
      Fluvià, un tramo con la isla de Caramany es reserva parcial para proteger la nutria.
    visit: >-
      El Cortalet, un antiguo corral ganadero, junto a la carretera GIV-6216, es el centro de información e
      interpretación y el punto de partida de los principales itinerarios; allí se encuentran el aula de
      naturaleza y el centro de documentación. Entre El Cortalet y el Mas Matà hay un itinerario de 4,5 km,
      ida y vuelta, de una hora y cuarto y muy fácil. En Mas Matà, el observatorio Senillosa es una de las
      cuatro torres que servían para secar arroz; desde 1996 es un mirador sobre la franja más litoral de los
      humedales.


      El parque ha dispuesto 30 puntos de observación, de los que 14 son observatorios, desde donde se ve la
      fauna sin ser visto ni alterar su tranquilidad. Las mejores horas para ver aves son la mañana y el
      atardecer, y hay más especies en las migraciones, de marzo a mayo y de agosto a octubre.
    history: >-
      Los pueblos cuentan su propia versión del agua. En la zona costera el asentamiento tradicional son los
      corrales, patios cerrados para el ganado que luego se convirtieron en masías de los marjales. El arroz,
      el cultivo más adaptado a estas tierras inundables, se ha recuperado algo desde la creación del parque,
      aunque hoy es casi testimonial.


      En los años sesenta la especulación inmobiliaria puso en grave peligro lo que quedaba, con
      urbanizaciones como Empuriabrava y campings en las playas de Sant Pere Pescador. En julio de 1976
      apareció el primer texto de defensa, firmado por Jordi Sargatal, y se formó el Grup de Defensa dels
      Aiguamolls. El espacio se declaró el 28 de octubre de 1983, con una ley aprobada por unanimidad. En 1987
      fue designado zona de especial protección para las aves y en 1993 entró en la lista Ramsar. Hoy hay
      además reservas naturales integrales, el máximo nivel de protección de la legislación catalana: les
      Llaunes y els Estanys.
    before: >-
      Más del 80 % del territorio es de propiedad privada y gran parte es agrícola: respeta cultivos y
      vecinos. No se permiten la captura ni la recolección de animales y plantas, la acampada libre ni el
      acceso con vehículos a los itinerarios. Lleva repelente de mosquitos todo el año, sin picaridina, que es
      muy tóxica para los anfibios. El horario de los centros cambia según la temporada, así que consúltalo
      antes de ir.
    around: >-
      El [Parque Natural del Cap de Creus](/lugar/parc-natural-del-cap-de-creus/) está a unos diez kilómetros.
      Otros humedales comparten con los Aiguamolls algunas de sus aves: el [Parque Natural del Delta del
      Ebro](/lugar/parc-natural-del-delta-de-l-ebre/) tiene también morito y avetoro, el [Parque Natural de
      s'Albufera de Mallorca](/lugar/parc-natural-de-s-albufera-de-mallorca/) el aguilucho lagunero, y el
      [Parque Natural del Zwin](/lugar/het-zwin---zwin-nature-park/) la cigüeña blanca.
  en:
    intro: >-
      In 1976 someone wrote the first text in defence of wetlands that were on the verge of becoming a housing
      estate. The 1974 plan for the Port Llevant residential marina envisaged 525 ha of navigable canals over
      the lagoons of Castelló d'Empúries, and from that threat grew a campaign that ended up saving what is
      today the Aiguamolls de l'Empordà Natural Park. They lie in the Empordà plain, between the mouths of the
      Fluvià and the Muga, and are one of the main wetlands of Catalonia, together with the Ebro and Llobregat
      deltas. They are the remains of a very extensive marsh system that gradually disappeared.
    landscape: >-
      The story of water is in every corner. There was a time when the wetlands covered almost the entire
      plain of the Bay of Roses and the lower Ter; agricultural expansion first, then tourist construction,
      steadily reduced them. What survives was born from a deltaic system: the interaction between the flows
      of the Fluvià and the Muga and the marine dynamics created the wetland areas.


      The marshes are transitional habitats, between the aquatic and the terrestrial, with borders that are
      hard to identify: they can be flooded, dry or in between, with fresh, brackish or slightly salty water.
      A living network of ditches, canals and gullies drains the floodable land, regulates the water of rice
      fields and meadows and carries irrigation water. Behind the beach are the llaunes, coastal brackish
      lagoons between the mouths of the Muga and the Fluvià. The freshwater ponds are remnants of the old
      Castelló pond; the most emblematic is that of Vilaüt. The closes are typical pasture meadows, surrounded
      by drainage ditches and riparian trees, occupying old ponds that flood in the rainy season. On the drier
      ground, the aspres, there are dryland crops and scrub.


      The flora reflects this: there are psamophilous plants adapted to sandy soils and halophytes on salty
      soils, as well as species exclusive to or uncommon in the Catalan Countries. A total of 1,098 taxa have
      been recorded. Among the habitats, twelve are of community interest.
    wildlife: >-
      A total of 338 bird species have been observed, 82 of them regular breeders. The [white
      stork](/especie/ciconia_ciconia/), reintroduced, has bred here since 1987 and is very common. Among the
      breeding species are the [great bittern](/especie/botaurus_stellaris/), in lagoons with extensive
      reedbeds, the [purple heron](/especie/ardea_purpurea/), the [marsh
      harrier](/especie/circus_aeruginosus/), the [purple swamphen](/especie/porphyrio_porphyrio/) and the
      black-winged stilt. The [glossy ibis](/especie/plegadis_falcinellus/) and the
      [spoonbill](/especie/platalea_leucorodia/) are seen during migration, always in small numbers, and
      groups of [flamingos](/especie/phoenicopterus_roseus/) winter or stop over. The
      [osprey](/especie/pandion_haliaetus/) passes through the park, and there are always some winterers on
      the Fluvià or in the glasswort areas. In dry terrain with woody crops the roller stands out, rare in the
      park and throughout Catalonia; in the breeding season the [kingfisher](/especie/alcedo_atthis/) and
      numerous bee-eater pairs nest.


      Winter changes the pattern: thousands of herons including [cattle egrets](/especie/bubulcus_ibis/) and
      thousands of mallards concentrate, and among the waders large groups of golden plover and lapwing
      winter. Counts place the Aiguamolls as the second wetland in Catalonia for wintering waterbirds, after
      the Ebro delta. The garganey, chosen as the park's emblem because it was the only waterbird on the
      peninsula that bred regularly only here, is now considered extinct as a breeder: its last breeding
      attempts were in 1997. On the Fluvià river, a stretch with the Caramany island is a partial reserve to
      protect the otter.
    visit: >-
      El Cortalet, an old livestock pen, beside the GIV-6216 road, is the information and interpretation
      centre and the starting point for the main routes; there are the nature classroom and the documentation
      centre. Between El Cortalet and Mas Matà there is a route of 4.5 km, out and back, taking an hour and a
      quarter and very easy. At Mas Matà, the Senillosa observatory is one of the four towers that served for
      drying rice; since 1996 it has been a viewpoint over the most coastal strip of the wetlands.


      The park has set up 30 observation points, of which 14 are hides, from which wildlife can be seen
      without being seen or disturbing their peace. The best times to see birds are morning and evening, and
      there are more species during migration, from March to May and from August to October.
    history: >-
      The villages tell their own version of water. In the coastal area the traditional settlement is the
      corrals, enclosed livestock yards that later became farmhouses of the marshes. Rice, the crop most
      suited to these flood-prone lands, has recovered somewhat since the park was created, though today it is
      almost symbolic.


      In the sixties, real-estate speculation put what remained in serious danger, with developments like
      Empuriabrava and campsites on the beaches of Sant Pere Pescador. In July 1976 the first defence text
      appeared, signed by Jordi Sargatal, and the Grup de Defensa dels Aiguamolls was formed. The area was
      declared on 28 October 1983, with a law approved unanimously. In 1987 it was designated a special
      protection area for birds and in 1993 it was included in the Ramsar list. Today there are also integral
      nature reserves, the highest level of protection in Catalan law: les Llaunes and els Estanys.
    before: >-
      More than 80 % of the territory is privately owned and much of it is agricultural: respect crops and
      neighbours. The capture or collection of animals and plants, wild camping and vehicle access to the
      routes are not permitted. Carry mosquito repellent all year, without picaridin, which is very toxic to
      amphibians. The opening hours of the centres change according to the season, so check before visiting.
    around: >-
      The [Cap de Creus Natural Park](/lugar/parc-natural-del-cap-de-creus/) is about ten kilometres away.
      Other wetlands share some of the Aiguamolls' birds: the [Ebro Delta Natural
      Park](/lugar/parc-natural-del-delta-de-l-ebre/) also has glossy ibis and great bittern, [s'Albufera de
      Mallorca Natural Park](/lugar/parc-natural-de-s-albufera-de-mallorca/) the marsh harrier, and [Zwin
      Nature Park](/lugar/het-zwin---zwin-nature-park/) the white stork.
  fr:
    intro: >-
      En 1976, quelqu'un a écrit le premier texte en défense de zones humides qui étaient sur le point de
      devenir une zone résidentielle. Le plan de 1974 pour la marina résidentielle de Port Llevant prévoyait
      525 ha de canaux navigables sur les lagunes de Castelló d'Empúries, et de cette menace est née une
      campagne qui a fini par sauver ce qui est aujourd'hui le Parc Naturel dels Aiguamolls de l'Empordà. Ils
      s'étendent dans la plaine de l'Empordà, entre les embouchures du Fluvià et de la Muga, et constituent
      l'une des principales zones humides de Catalogne, avec les deltas de l'Èbre et du Llobregat. Ce sont les
      restes d'un très vaste système marécageux qui a peu à peu disparu.
    landscape: >-
      L'histoire de l'eau est dans chaque recoin. Il fut un temps où les zones humides couvraient presque
      toute la plaine de la baie de Roses et du bas Ter ; l'expansion agricole d'abord, puis la construction
      touristique, les ont progressivement réduites. Ce qui subsiste est né d'un système deltaïque :
      l'interaction entre les apports du Fluvià et de la Muga et la dynamique marine a créé les zones humides.


      Les marais sont des habitats de transition, entre l'aquatique et le terrestre, avec des frontières
      difficiles à identifier : ils peuvent être inondés, secs ou intermédiaires, avec de l'eau douce,
      saumâtre ou légèrement salée. Un réseau vivant de fossés, canaux et rigoles draine les terrains
      inondables, régule l'eau des rizières et des prairies et transporte l'eau d'irrigation. Derrière la
      plage se trouvent les llaunes, lagunes côtières saumâtres entre les embouchures de la Muga et du Fluvià.
      Les étangs d'eau douce sont des vestiges de l'ancien étang de Castelló ; le plus emblématique est celui
      de Vilaüt. Les closes sont des prairies de pâturage typiques, entourées de fossés et de boisements
      riverains, occupant d'anciens étangs qui s'inondent en période de pluies. Sur les terrains plus secs,
      les aspres, il y a des cultures sèches et du maquis.


      La flore le reflète : il y a des plantes psammophiles, à sols sableux, et halophiles, à sols salés,
      ainsi que des espèces exclusives ou peu communes dans les Pays Catalans. Un total de 1 098 taxons ont
      été répertoriés. Parmi les habitats, douze sont d'intérêt communautaire.
    wildlife: >-
      Un total de 338 espèces d'oiseaux ont été observées, dont 82 sont des nicheurs réguliers. La [cigogne
      blanche](/especie/ciconia_ciconia/), réintroduite, niche ici depuis 1987 et est très courante. Parmi
      celles qui nichent figurent le [butor étoilé](/especie/botaurus_stellaris/), dans les lagunes avec
      beaucoup de roselières, le [héron pourpré](/especie/ardea_purpurea/), le [busard des
      roseaux](/especie/circus_aeruginosus/), le [talève sultane](/especie/porphyrio_porphyrio/) et l'échasse
      blanche. L'[ibis falcinelle](/especie/plegadis_falcinellus/) et la [spatule
      blanche](/especie/platalea_leucorodia/) sont vus en migration, toujours en faibles effectifs, et des
      groupes de [flamants roses](/especie/phoenicopterus_roseus/) hivernent ou font escale. Le [balbuzard
      pêcheur](/especie/pandion_haliaetus/) traverse le parc, et il reste toujours quelque hivernant sur le
      Fluvià ou dans les salicornes. Sur les terrains secs avec cultures ligneuses se distingue le rollier
      d'Europe, rare dans le parc et en Catalogne entière ; en période de nidification nichent le
      [martin-pêcheur](/especie/alcedo_atthis/) et de nombreux couples de guêpiers.


      L'hiver change la répartition : des milliers d'ardéidés, comme l'[héron
      garde-bœufs](/especie/bubulcus_ibis/), et des milliers de canards colverts se concentrent, et parmi les
      limicoles de grands groupes de pluviers dorés et de vanneaux hivernent. Les recensements placent les
      Aiguamolls comme la deuxième zone de Catalogne en oiseaux aquatiques hivernants, après le delta de
      l'Èbre. La sarcelle d'été, choisie comme symbole du parc parce qu'elle était le seul oiseau aquatique de
      la péninsule à nicher régulièrement seulement ici, est aujourd'hui considérée comme éteinte comme
      nicheuse : ses dernières tentatives de nidification ont eu lieu en 1997. Sur le Fluvià, un tronçon avec
      l'île de Caramany est réserve partielle pour protéger la loutre.
    visit: >-
      El Cortalet, un ancien enclos à bétail, près de la route GIV-6216, est le centre d'information et
      d'interprétation et le point de départ des principaux itinéraires ; on y trouve la salle de nature et le
      centre de documentation. Entre El Cortalet et le Mas Matà il y a un itinéraire de 4,5 km, aller-retour,
      d'une heure et quart et très facile. Au Mas Matà, l'observatoire Senillosa est une des quatre tours qui
      servaient à sécher le riz ; depuis 1996 c'est un belvédère sur la bande la plus littorale des zones
      humides.


      Le parc a aménagé 30 points d'observation, dont 14 sont des observatoires, depuis lesquels on voit la
      faune sans être vu ni déranger sa tranquillité. Les meilleures heures pour observer les oiseaux sont le
      matin et le soir, et il y a plus d'espèces lors des migrations, de mars à mai et d'août à octobre.
    history: >-
      Les villages racontent leur propre version de l'eau. Dans la zone côtière l'installation traditionnelle
      est le corral, cours fermée pour le bétail qui est ensuite devenu des mas des marais. Le riz, la culture
      la plus adaptée à ces terres inondables, s'est un peu redressé depuis la création du parc, bien
      qu'aujourd'hui il soit presque symbolique.


      Dans les années soixante, la spéculation immobilière a mis en grave danger ce qui restait, avec des
      lotissements comme Empuriabrava et des campings sur les plages de Sant Pere Pescador. En juillet 1976
      est apparu le premier texte de défense, signé par Jordi Sargatal, et le Grup de Defensa dels Aiguamolls
      s'est formé. L'espace a été déclaré le 28 octobre 1983, avec une loi approuvée à l'unanimité. En 1987 il
      fut désigné zone de protection spéciale pour les oiseaux et en 1993 il entra dans la liste Ramsar.
      Aujourd'hui il y a aussi des réserves naturelles intégrales, le niveau de protection maximal de la
      législation catalane : les Llaunes et els Estanys.
    before: >-
      Plus de 80 % du territoire est en propriété privée et une grande partie est agricole : respectez
      cultures et voisins. La capture ou la cueillette d'animaux et de plantes, le camping sauvage et l'accès
      avec des véhicules aux itinéraires ne sont pas autorisés. Portez du répulsif anti-moustiques toute
      l'année, sans picaridine, qui est très toxique pour les amphibiens. Les horaires des centres changent
      selon la saison, alors vérifiez avant de partir.
    around: >-
      Le [Parc Naturel du Cap de Creus](/lugar/parc-natural-del-cap-de-creus/) est à environ dix kilomètres.
      D'autres zones humides partagent avec les Aiguamolls certains de leurs oiseaux : le [Parc Naturel du
      Delta de l'Ebre](/lugar/parc-natural-del-delta-de-l-ebre/) a aussi l'ibis falcinelle et le butor étoilé,
      le [Parc Naturel de s'Albufera de Mallorca](/lugar/parc-natural-de-s-albufera-de-mallorca/) le busard
      des roseaux, et le [Parc Naturel du Zwin](/lugar/het-zwin---zwin-nature-park/) la cigogne blanche.
  de:
    intro: >-
      Im Jahr 1976 schrieb jemand den ersten Text zur Verteidigung von Feuchtgebieten, die kurz davor standen,
      eine Wohnsiedlung zu werden. Der Plan von 1974 für die Wohnmarina Port Llevant sah 525 ha schiffbare
      Kanäle über den Lagunen von Castelló d'Empúries vor, und aus dieser Bedrohung entstand eine Kampagne,
      die letztlich das rettete, was heute der Naturpark Aiguamolls de l'Empordà ist. Sie liegen in der Ebene
      des Empordà, zwischen den Mündungen von Fluvià und Muga, und sind neben den Deltas des Ebro und des
      Llobregat eines der wichtigsten Feuchtgebiete Kataloniens. Sie sind die Überreste eines sehr
      ausgedehnten Sumpfsystems, das nach und nach verschwand.
    landscape: >-
      Die Geschichte des Wassers ist in jedem Winkel spürbar. Es gab eine Zeit, als die Feuchtgebiete fast die
      gesamte Ebene der Bucht von Roses und des unteren Ter bedeckten; zunächst die landwirtschaftliche
      Expansion, dann der touristische Bau reduzierten sie schrittweise. Was überlebt hat, entstand aus einem
      deltaischen System: das Zusammenwirken der Zuflüsse von Fluvià und Muga mit der Meeresdynamik schuf die
      Feuchtgebietszonen.


      Die Sümpfe sind Übergangsbiotope zwischen dem Aquatischen und dem Terrestrischen, mit schwer zu
      identifizierenden Grenzen: Sie können überschwemmt, trocken oder dazwischen liegen, mit Süß-, Brack-
      oder leicht salzhaltigem Wasser. Ein lebendiges Netz aus Gräben, Kanälen und Rinnen entwässert das
      überflutungsgefährdete Land, reguliert das Wasser von Reisfeldern und Wiesen und leitet
      Bewässerungswasser. Hinter dem Strand liegen die llaunes, küstennahe Brackwasserlagunen zwischen den
      Mündungen von Muga und Fluvià. Die Süßwasserteiche sind Überreste des alten Castelló-Sees; der
      emblematischste ist der von Vilaüt. Die closes sind typische Weideflächen, umgeben von
      Entwässerungsgräben und Ufergehölzen, die alte Teiche besetzen und in der Regenzeit überschwemmt werden.
      Auf dem trockeneren Gelände, den aspres, gibt es Trockenfeldbau und Gestrüpp.


      Die Flora spiegelt dies wider: Es gibt psammophile Pflanzen auf Sandböden und Halophyten auf Salzböden
      sowie Arten, die in den Katalanischen Ländern exklusiv oder selten sind. Insgesamt 1 098 Taxa wurden
      verzeichnet. Unter den Lebensräumen sind zwölf von gemeinschaftlichem Interesse.
    wildlife: >-
      Insgesamt 338 Vogelarten wurden beobachtet, davon 82 regelmäßige Brutvögel. Die
      [Weißstorch](/especie/ciconia_ciconia/), wiederangesiedelt, brütet hier seit 1987 und ist sehr häufig.
      Zu den Brutvögeln gehören die [Rohrdommel](/especie/botaurus_stellaris/) in Lagunen mit viel Schilf, der
      [Purpurreiher](/especie/ardea_purpurea/), der [Rohrweihe](/especie/circus_aeruginosus/), das
      [Purpurhuhn](/especie/porphyrio_porphyrio/) und der Stelzenläufer. Der
      [Sichler](/especie/plegadis_falcinellus/) und der [Löffler](/especie/platalea_leucorodia/) werden beim
      Zug gesehen, immer in kleinen Zahlen, und Gruppen von [Rosaflamingos](/especie/phoenicopterus_roseus/)
      überwintern oder rasten. Der [Fischadler](/especie/pandion_haliaetus/) durchquert den Park, und immer
      bleiben einige Wintergäste am Fluvià oder in den Quellerweiden. Auf trockenem Gelände mit Gehölzkulturen
      sticht die Blauracke hervor, selten im Park und in ganz Katalonien; in der Brutzeit nisten der
      [Eisvogel](/especie/alcedo_atthis/) und zahlreiche Bienenfresserpaare.


      Der Winter verändert das Bild: Tausende von Reihern, wie der [Kuhreiher](/especie/bubulcus_ibis/), und
      Tausende von Stockenten sammeln sich, und unter den Watvögeln überwintern große Gruppen von
      Goldregenpfeifern und Kiebitze. Zählungen platzieren die Aiguamolls als zweitwichtigstes Feuchtgebiet
      Kataloniens für überwinternde Wasservögel nach dem Ebro-Delta. Die Knäkente, als Park-Emblem gewählt,
      weil sie der einzige Wasservogel auf der Halbinsel war, der regelmäßig nur hier brütete, gilt heute als
      Brutvogel ausgestorben: Ihre letzten Brutversuche waren 1997. Am Fluvià schützt ein Abschnitt mit der
      Caramany-Insel als Teilreservat die Fischotter.
    visit: >-
      El Cortalet, ein altes Viehgehege neben der Straße GIV-6216, ist das Informations- und
      Interpretationszentrum und Ausgangspunkt der Hauptrouten; dort befinden sich das Naturklassenzimmer und
      das Dokumentationszentrum. Zwischen El Cortalet und Mas Matà gibt es einen Weg von 4,5 km, Hin- und
      Rückweg, von einer Stunde und einer Viertelstunde und sehr einfach. In Mas Matà ist der
      Senillosa-Aussichtsturm einer der vier Türme, die zum Restrocknen dienten; seit 1996 ist er ein
      Aussichtspunkt über den küstennahen Streifen der Feuchtgebiete.


      Der Park hat 30 Beobachtungspunkte eingerichtet, von denen 14 Beobachtungshütten sind, von denen aus
      Wildtiere gesehen werden können, ohne gesehen zu werden oder ihre Ruhe zu stören. Die besten Zeiten zur
      Vogelbeobachtung sind Morgen und Abend, und es gibt mehr Arten während der Zugzeiten von März bis Mai
      und August bis Oktober.
    history: >-
      Die Dörfer erzählen ihre eigene Version des Wassers. Im Küstenbereich ist die traditionelle Siedlung das
      corral, umfriedeter Viehof, der später zur Meierei der Sümpfe wurde. Der Reis, die für diese
      überflutungsgefährdeten Böden am besten geeignete Kultur, hat sich seit der Gründung des Parks etwas
      erholt, obwohl er heute fast symbolisch ist.


      In den sechziger Jahren gefährdete die Immobilienspekulation das Übriggebliebene ernsthaft, mit
      Siedlungen wie Empuriabrava und Campingplätzen an den Stränden von Sant Pere Pescador. Im Juli 1976
      erschien der erste Verteidigungstext, unterzeichnet von Jordi Sargatal, und die Grup de Defensa dels
      Aiguamolls wurde gegründet. Der Raum wurde am 28. Oktober 1983 mit einem einstimmig verabschiedeten
      Gesetz ausgewiesen. Im Jahr 1987 wurde er als Vogelschutzgebiet ausgewiesen und 1993 in die Ramsar-Liste
      aufgenommen. Heute gibt es auch integrale Naturschutzgebiete, die höchste Schutzstufe der katalanischen
      Gesetzgebung: les Llaunes und els Estanys.
    before: >-
      Mehr als 80 % des Gebiets ist Privateigentum und ein großer Teil landwirtschaftlich: Respektiere
      Kulturen und Nachbarn. Der Fang oder die Sammlung von Tieren und Pflanzen, wildes Campen und
      Fahrzeugzugang zu den Wegen sind nicht erlaubt. Trage das ganze Jahr über Mückenschutz, ohne Picaridin,
      das sehr giftig für Amphibien ist. Die Öffnungszeiten der Zentren ändern sich je nach Jahreszeit, also
      vorher prüfen.
    around: >-
      Der [Naturpark Cap de Creus](/lugar/parc-natural-del-cap-de-creus/) ist etwa zehn Kilometer entfernt.
      Andere Feuchtgebiete teilen mit den Aiguamolls einige ihrer Vögel: Der [Naturpark Delta des
      Ebro](/lugar/parc-natural-del-delta-de-l-ebre/) hat auch Sichler und Rohrdommel, der [Naturpark
      s'Albufera de Mallorca](/lugar/parc-natural-de-s-albufera-de-mallorca/) die Rohrweihe und der [Naturpark
      Zwin](/lugar/het-zwin---zwin-nature-park/) den Weißstorch.
  it:
    intro: >-
      Nel 1976 qualcuno scrisse il primo testo in difesa di zone umide che stavano per diventare un complesso
      residenziale. Il piano del 1974 per la marina residenziale di Port Llevant prevedeva 525 ha di canali
      navigabili sulle lagune di Castelló d'Empúries, e da quella minaccia nacque una campagna che alla fine
      salvò quello che oggi è il Parco Naturale degli Aiguamolls de l'Empordà. Si trovano nella pianura
      dell'Empordà, tra le foci del Fluvià e della Muga, e sono una delle principali zone umide della
      Catalogna, insieme ai delta dell'Ebro e del Llobregat. Sono i resti di un sistema palustre molto esteso
      che è andato scomparendo.
    landscape: >-
      La storia dell'acqua è in ogni angolo. C'era un tempo in cui le zone umide occupavano quasi tutta la
      pianura della baia di Roses e del basso Ter; l'espansione agricola prima e la costruzione turistica poi
      le hanno progressivamente ridotte. Ciò che sopravvive nacque da un sistema deltaico: l'interazione tra
      gli apporti del Fluvià e della Muga e la dinamica marina ha creato le zone umide.


      Le paludi sono habitat di transizione, tra l'acquatico e il terrestre, con confini difficili da
      identificare: possono essere inondate, asciutte o intermedie, con acqua dolce, salmastra o leggermente
      salata. Una rete vivente di fossi, canali e canaletti drena i terreni inondabili, regola l'acqua di
      risaie e prati e trasporta l'acqua di irrigazione. Dietro la spiaggia ci sono le llaunes, lagune
      costiere salmostre tra le foci della Muga e del Fluvià. Gli stagni d'acqua dolce sono resti dell'antico
      stagno di Castelló; il più emblematico è quello di Vilaüt. Le closes sono prati da pascolo tipici,
      circondati da fossi e alberature riparali, che occupano vecchi stagni e si allagano in periodo di
      piogge. Sui terreni più asciutti, gli aspres, ci sono colture asciutte e macchia.


      La flora lo riflette: ci sono piante psammofile, su suoli sabbiosi, e alofile, su suoli salati, oltre a
      specie esclusive o poco comuni nei Paesi Catalani. In totale sono stati censiti 1 098 taxa. Tra gli
      habitat, dodici sono di interesse comunitario.
    wildlife: >-
      In totale sono state osservate 338 specie di uccelli, 82 delle quali sono nidificanti regolari. La
      [cicogna bianca](/especie/ciconia_ciconia/), reintrodotta, nidifica qui dal 1987 ed è molto comune. Tra
      le nidificanti figurano il [tarabuso](/especie/botaurus_stellaris/), in lagune con molti canneti,
      l'[airone rosso](/especie/ardea_purpurea/), il [falco di palude](/especie/circus_aeruginosus/), il
      [pollo sultano](/especie/porphyrio_porphyrio/) e il cavaliere d'Italia.
      L'[mignattaio](/especie/plegadis_falcinellus/) e la [spatola](/especie/platalea_leucorodia/) si vedono
      in migrazione, sempre in piccoli numeri, e gruppi di [fenicotteri](/especie/phoenicopterus_roseus/)
      svernano o fanno sosta. Il [falco pescatore](/especie/pandion_haliaetus/) transita per il parco, e
      rimane sempre qualche svernante sul Fluvià o nelle salicornie. Sui terreni asciutti con colture legnose
      spicca la ghiandaia marina, rara nel parco e in tutta la Catalogna; in epoca di riproduzione nidificano
      il [martin pescatore](/especie/alcedo_atthis/) e numerose coppie di gruccioni.


      L'inverno cambia la distribuzione: si concentrano migliaia di ardeidi come l'[airone
      guardabuoi](/especie/bubulcus_ibis/), e migliaia di germani reali, e tra i limicoli grandi gruppi di
      pivieri dorati e pavoncelle svernano. I censimenti collocano gli Aiguamolls come la seconda zona della
      Catalogna per uccelli acquatici svernanti, dopo il delta dell'Ebro. La marzaiola, scelta come simbolo
      del parco perché era l'unico uccello acquatico della penisola che nidificava regolarmente solo qui, è
      oggi considerata estinta come nidificante: i suoi ultimi tentativi di nidificazione furono nel 1997. Sul
      Fluvià, un tratto con l'isola di Caramany è riserva parziale per proteggere la lontra.
    visit: >-
      El Cortalet, un antico recinto per il bestiame, lungo la strada GIV-6216, è il centro informazioni e
      interpretazione e il punto di partenza dei principali itinerari; lì si trovano l'aula natura e il centro
      di documentazione. Tra El Cortalet e Mas Matà c'è un itinerario di 4,5 km, andata e ritorno, di un'ora e
      un quarto e molto facile. A Mas Matà, l'osservatorio Senillosa è una delle quattro torri che servivano
      per essiccare il riso; dal 1996 è un belvedere sulla fascia più costiera delle zone umide.


      Il parco ha predisposto 30 punti di osservazione, di cui 14 sono capanni, da dove si osserva la fauna
      senza essere visti né disturbare la sua tranquillità. Le ore migliori per osservare gli uccelli sono il
      mattino e il tramonto, e ci sono più specie durante le migrazioni, da marzo a maggio e da agosto a
      ottobre.
    history: >-
      I paesi raccontano la loro versione dell'acqua. Nella zona costiera l'insediamento tradizionale sono i
      corrals, cortili chiusi per il bestiame che poi divennero le cascine delle paludi. Il riso, la coltura
      più adatta a queste terre inondabili, si è un po' ripreso dalla creazione del parco, anche se oggi è
      quasi simbolico.


      Negli anni sessanta la speculazione immobiliare ha messo in grave pericolo quello che restava, con
      insediamenti come Empuriabrava e campeggi sulle spiagge di Sant Pere Pescador. Nel luglio 1976 apparve
      il primo testo di difesa, firmato da Jordi Sargatal, e si formò il Grup de Defensa dels Aiguamolls. Lo
      spazio fu dichiarato il 28 ottobre 1983, con una legge approvata all'unanimità. Nel 1987 fu designato
      zona di protezione speciale per gli uccelli e nel 1993 entrò nella lista Ramsar. Oggi ci sono anche
      riserve naturali integrali, il massimo livello di protezione della legislazione catalana: les Llaunes e
      els Estanys.
    before: >-
      Più dell'80 % del territorio è di proprietà privata e gran parte è agricolo: rispetta colture e vicini.
      Non sono consentiti la cattura o la raccolta di animali e piante, il campeggio libero né l'accesso con
      veicoli agli itinerari. Porta repellente per zanzare tutto l'anno, senza picaridin, che è molto tossica
      per gli anfibi. L'orario dei centri cambia secondo la stagione, quindi consultalo prima di andare.
    around: >-
      Il [Parco Naturale del Cap de Creus](/lugar/parc-natural-del-cap-de-creus/) è a circa dieci chilometri.
      Altre zone umide condividono con gli Aiguamolls alcune delle loro specie: il [Parco Naturale del Delta
      dell'Ebro](/lugar/parc-natural-del-delta-de-l-ebre/) ha anche il mignattaio e il tarabuso, il [Parco
      Naturale di s'Albufera de Mallorca](/lugar/parc-natural-de-s-albufera-de-mallorca/) il falco di palude,
      e il [Parco Naturale dello Zwin](/lugar/het-zwin---zwin-nature-park/) la cicogna bianca.
  pt:
    intro: >-
      Em 1976 alguém escreveu o primeiro texto em defesa de zonas húmidas que estavam prestes a tornar-se numa
      urbanização. O plano de 1974 para a marina residencial de Port Llevant previa 525 ha de canais
      navegáveis sobre as lagoas de Castelló d'Empúries, e dessa ameaça nasceu uma campanha que acabou por
      salvar o que é hoje o Parque Natural dels Aiguamolls de l'Empordà. Ficam na planície do Empordà, entre
      as fozas do Fluvià e da Muga, e são uma das principais zonas húmidas da Catalunha, a par dos deltas do
      Ebro e do Llobregat. São os restos de um sistema pantanoso muito extenso que foi desaparecendo.
    landscape: >-
      A história da água está em cada canto. Houve um tempo em que as zonas húmidas ocupavam quase toda a
      planície da baía de Roses e do baixo Ter; a expansão agrícola primeiro, e a construção turística depois,
      foram-nas reduzindo. O que sobreviveu nasceu de um sistema deltaico: a interação entre os aportes do
      Fluvià e da Muga e a dinâmica marinha criou as zonas húmidas.


      Os pântanos são habitats de transição, entre o aquático e o terrestre, com fronteiras difíceis de
      identificar: podem estar inundados, secos ou intermédios, com água doce, salobra ou ligeiramente
      salgada. Uma rede viva de valas, canais e regueiros drena os terrenos inundáveis, regula a água dos
      arrozais e prados e transporta a água de rega. Atrás da praia estão as llaunes, lagoas salobras litorais
      entre as fozas da Muga e do Fluvià. Os lagos de água doce são restos do antigo estanque de Castelló; o
      mais emblemático é o de Vilaüt. As closes são prados de pastagem típicos, rodeados de valas e
      arborização ribeirinha, que ocupam antigos estanques e inundam-se em época de chuvas. Nos terrenos mais
      secos, os aspres, há culturas de sequeiro e mato.


      A flora reflete isso: há plantas psamófilas, de solos arenosos, e halófilas, de solos salgados, bem como
      espécies exclusivas ou pouco comuns nos Països Catalans. Foram registados em total 1 098 taxones. Entre
      os habitats, doze são de interesse comunitário.
    wildlife: >-
      Foram observadas em total 338 espécies de aves, 82 delas nidificantes regulares. A
      [cegonha-branca](/especie/ciconia_ciconia/), reintroduzida, cria aqui desde 1987 e é muito habitual.
      Entre as que criam figuram o [abetouro-comum](/especie/botaurus_stellaris/), em lagoas com muito
      caniçal, a [garça-vermelha](/especie/ardea_purpurea/), o
      [tartaranhão-ruivo](/especie/circus_aeruginosus/), o [camão-comum](/especie/porphyrio_porphyrio/) e o
      pernilongo. O [ibis-preta](/especie/plegadis_falcinellus/) e a
      [colhereiro](/especie/platalea_leucorodia/) veem-se em migração, sempre em números baixos, e grupos de
      [flamingos](/especie/phoenicopterus_roseus/) passam o inverno ou fazem escala. A
      [águia-pesqueira](/especie/pandion_haliaetus/) atravessa o parque, e fica sempre algum invernante no
      Fluvià ou nos salicornais. Nos terrenos secos com culturas lenhosas destaca-se o rolieiro, raro no
      parque e em toda a Catalunha; na época de cria nidificam o [guarda-rios](/especie/alcedo_atthis/) e
      numerosos casais de abelharuco.


      O inverno muda a distribuição: concentram-se milhares de ardeídeos, como a
      [garça-boieira](/especie/bubulcus_ibis/), e milhares de patos-reais, e entre os limícolas invernam
      grandes grupos de tarambola-dourada e abibe. Os censos colocam os Aiguamolls como a segunda zona da
      Catalunha em aves aquáticas invernantes, depois do delta do Ebro. A marrequinha-d'asa-azul, escolhida
      como símbolo do parque porque era a única ave aquática da península que criava regularmente só aqui,
      considera-se hoje extinta como nidificante: as suas últimas tentativas de cria foram em 1997. No rio
      Fluvià, um troço com a ilha de Caramany é reserva parcial para proteger a lontra.
    visit: >-
      El Cortalet, um antigo curral de gado, junto à estrada GIV-6216, é o centro de informação e
      interpretação e o ponto de partida dos principais itinerários; lá encontram-se a aula de natureza e o
      centro de documentação. Entre El Cortalet e Mas Matà há um itinerário de 4,5 km, ida e volta, de uma
      hora e um quarto e muito fácil. Em Mas Matà, o observatório Senillosa é uma das quatro torres que
      serviam para secar arroz; desde 1996 é um miradouro sobre a faixa mais litoral das zonas húmidas.


      O parque dispôs 30 pontos de observação, dos quais 14 são observatórios, de onde se vê a fauna sem ser
      visto nem alterar a sua tranquilidade. As melhores horas para ver aves são a manhã e o entardecer, e há
      mais espécies nas migrações, de março a maio e de agosto a outubro.
    history: >-
      As aldeias contam a sua própria versão da água. Na zona costeira o assentamento tradicional são os
      corrals, pátios fechados para o gado que depois se converteram em masies dos pântanos. O arroz, a
      cultura mais adaptada a estas terras inundáveis, recuperou um pouco desde a criação do parque, embora
      hoje seja quase simbólico.


      Nos anos sessenta a especulação imobiliária pôs em grave perigo o que restava, com urbanizações como
      Empuriabrava e campings nas praias de Sant Pere Pescador. Em julho de 1976 apareceu o primeiro texto de
      defesa, assinado por Jordi Sargatal, e formou-se o Grup de Defensa dels Aiguamolls. O espaço foi
      declarado a 28 de outubro de 1983, com uma lei aprovada por unanimidade. Em 1987 foi designado zona de
      proteção especial para as aves e em 1993 entrou na lista Ramsar. Hoje há também reservas naturais
      integrais, o nível máximo de proteção da legislação catalã: les Llaunes e els Estanys.
    before: >-
      Mais de 80 % do território é de propriedade privada e grande parte é agrícola: respeita as culturas e os
      vizinhos. Não se permitem a captura nem a recolha de animais e plantas, o campismo livre nem o acesso
      com veículos aos itinerários. Leva repelente de mosquitos durante todo o ano, sem picaridina, que é
      muito tóxica para os anfíbios. O horário dos centros muda conforme a temporada, por isso consulta-o
      antes de ir.
    around: >-
      O [Parque Natural do Cap de Creus](/lugar/parc-natural-del-cap-de-creus/) está a cerca de dez
      quilómetros. Outras zonas húmidas partilham com os Aiguamolls algumas das suas aves: o [Parque Natural
      do Delta do Ebro](/lugar/parc-natural-del-delta-de-l-ebre/) tem também ibis-preta e abetouro-comum, o
      [Parque Natural de s'Albufera de Mallorca](/lugar/parc-natural-de-s-albufera-de-mallorca/) o
      tartaranhão-ruivo, e o [Parque Natural do Zwin](/lugar/het-zwin---zwin-nature-park/) a cegonha-branca.
