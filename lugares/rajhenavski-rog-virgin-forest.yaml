resumen:
  es: >-
    La reserva forestal estricta de Kočevsko declarada en 1892 por los condes de Auersperg, con abetos blancos
    gigantescos de 50 m de altura (*Queen of Rog*).
  en: >-
    The strict forest reserve of Kočevsko set aside in 1892 by the Counts of Auersperg, featuring monumental
    silver firs soaring 50 m high (*Queen of Rog*).
  fr: >-
    Réserve forestière intégrale du Kočevsko créée en 1892 par les comtes d'Auersperg, abritant des sapins
    blancs géants de 50 m de haut (*Queen of Rog*).
  de: >-
    Das 1892 von den Grafen Auersperg begründete Totalreservat im Kočevsko mit 50 m hohen Riesen-Weisstannen
    (*Queen of Rog*).
  it: >-
    La riserva forestale integrale di Kočevsko istituita nel 1892 dai conti Auersperg, con abeti bianchi
    monumentali alti 50 m (*Queen of Rog*).
  pt: >-
    A reserva florestal integral de Kočevsko criada em 1892 pelos condes de Auersperg, com abetos-brancos
    colossais de 50 m de altura (*Queen of Rog*).
unico:
  es: >-
    Es un bosque que lleva más de un siglo sin que nadie lo toque, y lo único que se puede hacer es mirarlo
    desde el borde.
  en: >-
    It is a primeval forest left completely undisturbed by human hands for well over a century, which can only
    ever be contemplated from its outer perimeter.
  fr: >-
    Une forêt vierge laissée intacte depuis plus d'un siècle sans aucune intervention humaine, qu'on ne peut
    contempler que depuis sa lisière.
  de: >-
    Ein Urwald, der seit weit über einem Jahrhundert vollkommen unberührt geblieben ist und ausschliesslich
    von seinem Aussenrand aus betrachtet werden darf.
  it: >-
    Una foresta vergine inviolata da oltre un secolo senza alcun intervento umano, accessibile solo con lo
    sguardo dai suoi margini esterni.
  pt: >-
    É uma floresta intacta há mais de um século sem qualquer corte de madeira, que só pode ser contemplada a
    partir do seu perímetro exterior.
observaciones:
  es: >-
    No entres en el bosque primario y mira solo desde los senderos marcados. Lleva agua y comida para todo el
    recorrido. Si quieres entrar en el bosque con guía, el programa de las visitas cambia: comprueba antes
    cómo y cuándo se hacen.
texto:
  es:
    intro: >-
      En 1892 alguien escribió en un plan de gestión forestal que parte del bosque debía conservarse tal como
      estaba. Era Leopold Hufnagel, ingeniero forestal jefe de la finca del príncipe Auersperg, y su idea dio
      origen en Kočevski Rog al primer espacio natural protegido de Eslovenia y al segundo del mundo, solo
      veinte años después de Yellowstone. Más de un siglo después, el bosque primario de Rajhenavski Rog sigue
      ahí: 51 hectáreas de abetos y hayas gigantes en el corazón de una meseta kárstica, a las que no se
      entra. Se miran desde fuera.
    landscape: >-
      Kočevski Rog es una meseta kárstica de los Alpes Dináricos, muy boscosa, cuya parte central culmina en
      el Veliki Rog, de 1099 m. En medio queda el bosque primario de Rajhenavski Rog. Sus árboles, sobre todo
      [abetos](/especie/abies_alba/) y hayas, son gigantes centenarios que llegan a los 50 metros de altura, y
      algunos tienen hasta quinientos años. El abeto más majestuoso mide 51 metros y se llama Debela Jelka, la
      Reina de Rog.


      Lo que cuenta aquí no es solo el tamaño. En el bosque primario se entrelazan distintas fases de
      desarrollo en superficies muy pequeñas, y las existencias de madera son mucho mayores que en los bosques
      de aprovechamiento: llegan a 800 m³/ha. En toda la región de Kočevje los bosques primarios cubren solo
      218 hectáreas, y se conservaron porque nadie los tocó. Los más conocidos son Rajhenavski Rog y Krokar.
    wildlife: >-
      En Kočevsko se han conservado los tres grandes carnívoros: [oso](/especie/ursus_arctos/),
      [lobo](/especie/canis_lupus/) y [lince](/especie/lynx_lynx/). El oso es uno de los símbolos de la
      comarca y figura en la lista roja eslovena desde 1993. El lince casi desapareció de Eslovenia y se
      reintrodujo en los bosques de Kočevsko en la década de 1970. La población de lobo es una de las pocas
      autóctonas que quedan en Europa. También hay ciervo, corzo, zorro y jabalí.


      Es difícil ver a estos animales por tu cuenta. Para conocer al oso hay visitas guiadas por el bosque y
      observaciones nocturnas desde observatorios forestales, que son un refugio seguro. En otoño, el ciervo
      es especialmente interesante: se oyen los bramidos de la berrea.


      Si miras arriba, el pigargo europeo, muy raro, tiene más de 2 metros de envergadura; en verano se ven
      también el [cárabo uralense](/especie/strix_uralensis/) y el azor, bien representados en el bosque. Y en
      el lago de Kočevje viven más de 70 especies de aves.
    visit: >-
      No hay forma de entrar en el bosque primario: la entrada está estrictamente prohibida, y se observa
      desde el sendero Rog, que bordea el bosque. Es un sendero de unos 64 km que une el lago de Kočevje con
      el bosque de Rajhenavski Rog, marcado con una huella de oso. Pasa por praderas abandonadas y antiguos
      pueblos de Gottschee, y por bosques donde la naturaleza lleva siglos siguiendo sus propias reglas. Es
      apto para quien tenga una condición física de básica a moderada, y algunos tramos cortos sirven para
      familias. Hay que llevar líquidos y comida suficientes, porque no hay fuentes de agua. La guía del
      sendero se consigue en los centros de información turística de Kočevsko. Una excursión guiada incluye un
      paseo circular de 2 km hasta el borde del bosque primario.


      En las cercanías, las cuevas Željne forman un sistema horizontal de 1600 metros, fácil de recorrer y con
      luz natural que entra por ventanas del techo. En la Cueva del Gitano se hallaron más de 1400 objetos
      antiguos que prueban que hubo gente allí hace unos 20.000 años.
    history: >-
      La zona de Rog está hoy en gran parte despoblada, pero no siempre fue así. El aserradero de vapor de Rog
      funcionó de 1895 a 1932, y para abastecerlo se construyó un ferrocarril forestal de vía estrecha de 35
      kilómetros cuyos restos aún se ven. Y para conservar el bosque primario no se entra en él: solo se
      admira desde los senderos marcados.
    before: >-
      No entres en el bosque primario y mira solo desde los senderos marcados. Lleva agua y comida para todo
      el recorrido. Si quieres entrar en el bosque con guía, el programa de las visitas cambia: comprueba
      antes cómo y cuándo se hacen.
    around: >-
      El bosque primario forma parte del [Complejo Forestal de Kočevsko](/lugar/kocevski-gozdni-kompleks/). A
      unos veintidós kilómetros queda el [Bosque Primario de Krokar](/lugar/pragozd-krokar/), el otro gran
      bosque primario de Kočevsko, que está en la lista de patrimonio mundial de la UNESCO; y a veintiocho, el
      [Parque Nacional Risnjak](/lugar/nacionalni-park-risnjak---sumski-kompleks/).
  en:
    intro: >-
      In 1892, an insightful forester inscribed a visionary clause in a forest management plan: a portion of
      the wild forest was to be preserved completely untouched. That man was Leopold Hufnagel, head forest
      engineer of Prince Auersperg's estates, and his decision gave rise in Kočevski Rog to the first
      protected natural area in Slovenia and the second anywhere on Earth, barely twenty years after
      Yellowstone. More than a century later, the Rajhenavski Rog virgin forest endures: 51 hectares of
      colossal silver firs and beeches in the heart of a karst plateau, entered by no one. It can only be
      admired from the outside.
    landscape: >-
      Kočevski Rog is a heavily forested karst plateau of the Dinaric Alps, whose central sector culminates at
      Veliki Rog at 1099 m. Nestled within lies the virgin forest of Rajhenavski Rog. Its canopy trees,
      predominantly [silver firs](/especie/abies_alba/) and European beeches, are centuries-old giants
      reaching up to 50 metres in height, with venerable specimens aged up to five hundred years. The most
      magnificent fir measures 51 metres and is known as Debela Jelka, the Queen of Rog.


      Stature alone does not tell the full story. In this primeval ecosystem, diverse life cycles intertwine
      over micro-topographies, yielding standing wood biomass far exceeding that of managed forestry: up to
      800 m³/ha. Across the entire Kočevje region, intact primeval forest fragments encompass just 218
      hectares, surviving solely because human saws never touched them. The best known among them are
      Rajhenavski Rog and Krokar.
    wildlife: >-
      Kočevsko has retained all three European apex predators: [brown bear](/especie/ursus_arctos/),
      [wolf](/especie/canis_lupus/), and [Eurasian lynx](/especie/lynx_lynx/). The brown bear represents the
      living emblem of the region and has been listed in the Slovenian Red Data Book since 1993. The lynx,
      having vanished locally, was successfully reintroduced to the Kočevsko forests in the 1970s. The
      resident wolf pack is among the few purely indigenous lineages remaining in central Europe. Red deer,
      roe deer, red fox, and wild boar also thrive.


      Spotting these elusive carnivores independently is rare. To encounter bears responsibly, expert-led
      forest excursions and nocturnal watches from reinforced timber blinds offer secure viewing. In autumn,
      red deer stags animate the woods with resonant rutting bellows.


      Looking upward, the white-tailed eagle boasts a wingspan exceeding 2 metres; summer brings sightings of
      the [Ural owl](/especie/strix_uralensis/) and northern goshawk, both well represented across the canopy.
      Meanwhile, Lake Kočevje supports more than 70 species of wetland birds.
    visit: >-
      Entering the virgin forest interior is strictly prohibited; the reserve may only be observed from the
      perimeter Rog Trail. This trail covers some 64 km connecting Lake Kočevje to the virgin forest of
      Rajhenavski Rog, marked throughout with bear-paw blazes. It leads past abandoned meadows and historic
      Gottschee settlements, across ancient woods where natural succession has operated unhindered for
      centuries. It suits hikers with basic to moderate fitness, and short sections are family-friendly.
      Hikers must carry sufficient provisions, as no potable springs exist along the ridge. Trail guidebooks
      are available from Kočevsko tourist info centres. A popular guided tour includes a 2 km circular loop
      along the outer fringe of the reserve.


      Nearby, the Željne Caves form a horizontal subterranean network extending 1600 metres, easily walked
      thanks to natural skylights in the ceiling. In Gypsy Cave, excavations recovered more than 1400
      prehistoric artefacts proving human occupation dating back roughly 20,000 years.
    history: >-
      The Rog plateau is largely uninhabited today, but it was once heavily active. The industrial Rog steam
      sawmill operated from 1895 to 1932, supplied by a 35-kilometre narrow-gauge forest railway whose earthen
      embankments and culverts remain visible. To protect the primeval core, human entry remains forbidden: it
      is admired solely from designated boundary tracks.
    before: >-
      Never cross the boundary into the virgin forest; view the trees exclusively from waymarked trails. Carry
      all required water and food for the entire outing. Guided excursions operate on varying seasonal
      schedules: verify booking details with local authorities in advance.
    around: >-
      The virgin forest forms an integral component of the [Kočevsko Forest
      Complex](/lugar/kocevski-gozdni-kompleks/). Around twenty-two kilometres away lies [Krokar Primeval
      Forest](/lugar/pragozd-krokar/), Kočevsko's other great virgin beech enclave inscribed on the UNESCO
      World Heritage list; and at twenty-eight kilometres rises [Risnjak National
      Park](/lugar/nacionalni-park-risnjak---sumski-kompleks/).
  fr:
    intro: >-
      En 1892, un forestier visionnaire inscrivit dans un plan d'aménagement qu'une partie du massif devait
      être préservée telle quelle. C'était Leopold Hufnagel, ingénieur forestier en chef des domaines du
      prince Auersperg, et son initiative donna naissance dans le Kočevski Rog au premier espace naturel
      protégé de Slovénie et au deuxième au monde, vingt ans à peine après Yellowstone. Plus d'un siècle plus
      tard, la forêt primaire de Rajhenavski Rog subsiste : 51 hectares de sapins et de hêtres gigantesques au
      cœur d'un plateau karstique, impénétrables à l'homme. On ne les contemple que depuis l'extérieur.
    landscape: >-
      Le Kočevski Rog est un plateau karstique des Alpes dinariques, intensément boisé, dont la partie
      centrale culmine au Veliki Rog à 1099 m. En son sein se blottit la forêt primaire de Rajhenavski Rog.
      Ses arbres, essentiellement des [sapins blancs](/especie/abies_alba/) et des hêtres communs, sont des
      colosses séculaires s'élevant jusqu'à 50 mètres de hauteur, certains atteignant cinq cents ans. Le sapin
      le plus majestueux mesure 51 mètres et se nomme Debela Jelka, la Reine du Rog.


      La hauteur des fûts ne résume pas la valeur des lieux. Dans cette forêt primitive s'imbriquent toutes
      les phases de la dynamique sylvigénétique sur de très faibles surfaces, avec un volume de bois mort et
      sur pied très supérieur à celui des forêts exploitées : jusqu'à 800 m³/ha. À l'échelle de toute la
      région de Kočevje, les forêts primaires résiduelles ne couvrent que 218 hectares, préservées car nul ne
      les a exploitées. Les plus renommées sont Rajhenavski Rog et Krokar.
    wildlife: >-
      Le Kočevsko a conservé ses trois grands prédateurs : l'[ours brun](/especie/ursus_arctos/), le [loup
      gris](/especie/canis_lupus/) et le [lynx boréal](/especie/lynx_lynx/). L'ours est l'emblème de la région
      et figure sur la liste rouge slovène depuis 1993. Le lynx avait disparu de Slovénie avant d'être
      réintroduit dans ces forêts dans les années 1970. La meute de loups est l'une des rares populations
      véritablement indigènes d'Europe centrale. S'y ajoutent cerf élaphe, chevreuil, renard et sanglier.


      Observer ces grands carnivores par soi-même reste rare. Pour découvrir l'ours, des sorties guidées et
      des affûts sécurisés en miradors forestiers sont organisés. À l'automne, le brame du cerf résonne avec
      intensité.


      En levant les yeux, le pygargue à queue blanche déploie plus de 2 mètres d'envergure ; en été nichent
      également la [chouette de l'Oural](/especie/strix_uralensis/) et l'autour des palombes. Sur le lac de
      Kočevje stationnent plus de 70 espèces d'oiseaux aquatiques.
    visit: >-
      Il est formellement interdit de pénétrer au cœur de la forêt primaire : la découverte se fait uniquement
      depuis le sentier Rog qui en longe la lisière. Cet itinéraire d'environ 64 km relie le lac de Kočevje à
      la réserve de Rajhenavski Rog, balisé d'une empreinte d'ours. Il traverse clairières abandonnées et
      anciens villages des Gottscheers, dans une nature livrée à ses propres lois depuis des siècles.
      Accessible aux marcheurs de condition physique moyenne, certains tronçons se prêtent aux familles.
      Emportez vivres et eau en quantité suffisante en l'absence de sources. Des topo-guides sont disponibles
      auprès des offices de tourisme locaux. Une excursion guidée propose un parcours en boucle de 2 km en
      bordure de réserve.


      À proximité, les grottes de Željne forment un réseau horizontal de 1600 mètres, aisé et éclairé d'avens
      naturels. Dans la grotte des Tsiganes ont été exhumés plus de 1400 artefacts prouvant une occupation
      humaine il y a quelque 20 000 ans.
    history: >-
      Le plateau du Rog est aujourd'hui presque inhabité, mais il n'en fut pas toujours ainsi. La scierie à
      vapeur du Rog fonctionna de 1895 à 1932, alimentée par une voie ferrée forestière étroite de 35
      kilomètres dont les terrassements sont encore visibles. Pour sauvegarder la forêt primaire, nul n'y
      pénètre : elle s'admire exclusivement depuis les sentiers balisés périphériques.
    before: >-
      Ne franchissez sous aucun prétexte la limite de la forêt primaire et restez sur les chemins balisés.
      Emportez toute votre eau et votre nourriture. Les visites guidées thématiques obéissent à des protocoles
      précis : renseignez-vous au préalable.
    around: >-
      La forêt primaire s'intègre dans le [Complexe forestier de Kočevsko](/lugar/kocevski-gozdni-kompleks/).
      À environ vingt-deux kilomètres se trouve la [Forêt primaire de Krokar](/lugar/pragozd-krokar/), l'autre
      sanctuaire vierge de la région inscrit à l'UNESCO ; et à vingt-huit kilomètres s'étend le [Parc national
      Risnjak](/lugar/nacionalni-park-risnjak---sumski-kompleks/).
  de:
    intro: >-
      Im Jahr 1892 hielt ein weitsichtiger Forstmann in einem Wirtschaftsplan fest, dass ein Waldteil völlig
      unberührt bleiben solle. Es war Leopold Hufnagel, leitender Forstingenieur der Fürsten Auersperg, dessen
      Entschluss im Kočevski Rog das erste Naturschutzgebiet Sloweniens und das zweite weltweit schuf, nur
      zwanzig Jahre nach Yellowstone. Mehr als ein Jahrhundert später existiert der Urwald Rajhenavski Rog
      unverändert: 51 Hektar monumentale Tannen und Buchen im Herzen eines Karstplateaus, die von Menschen
      nicht betreten werden. Man betrachtet sie von aussen.
    landscape: >-
      Der Kočevski Rog ist ein dicht bewaldetes Karstplateau der Dinarischen Alpen, dessen Zentralmassiv im
      Veliki Rog mit 1099 m gipfelt. Inmitten liegt der Urwald Rajhenavski Rog. Seine Baumriesen, überwiegend
      [Weiss-Tannen](/especie/abies_alba/) und Rotbuchen, erreichen Höhen von bis zu 50 Metern, manche mit
      einem Alter von bis zu fünfhundert Jahren. Die gewaltigste Tanne ragt 51 Meter empor und trägt den Namen
      Debela Jelka, Königin des Rog.


      Nicht allein die Dimensionen zeichnen das Schutzgebiet aus. Im Urwald greifen sämtliche Phasen der
      Waldentwicklung auf engstem Raum ineinander, und das Totholz- und Stammvolumen liegt mit bis zu 800
      m³/ha weit über dem bewirtschafteter Wälder. Im gesamten Kočevje-Gebiet umfassen unberührte Urwaldreste
      lediglich 218 Hektar, gerettet, weil kein Holzschlag sie je berührte. Die bekanntesten sind Rajhenavski
      Rog und Krokar.
    wildlife: >-
      Im Kočevsko haben alle drei mitteleuropäischen Grossraubtiere überlebt:
      [Braunbär](/especie/ursus_arctos/), [Wolf](/especie/canis_lupus/) und [Eurasischer
      Luchs](/especie/lynx_lynx/). Der Bär gilt als Wahrzeichen der Landschaft und steht seit 1993 auf der
      Roten Liste Sloweniens. Der Luchs wurde nach seinem Erlöschen in den Wäldern des Kočevsko in den 1970er
      Jahren wiederangesiedelt. Das hiesige Wolfsrudel zählt zu den wenigen rein autochthonen Vorkommen
      Mitteleuropas. Daneben leben Rothirsch, Reh, Fuchs und Wildschwein.


      Auf eigene Faust sind diese scheuen Tiere selten auszumachen. Zur Bärenbeobachtung werden geführte
      Touren und Ansitze aus sicheren Beobachtungshütten angeboten. Im Herbst ist die Hirschbrunft weithin
      vernehmbar.


      Am Himmel erreicht der Seeadler über 2 Meter Spannweite; im Sommer nisten
      [Habichtskauz](/especie/strix_uralensis/) und Habicht in dichter Population. Am See von Kočevje wurden
      über 70 Vogelarten registriert.
    visit: >-
      Das Betreten des eigentlichen Urwalds ist streng verboten; Einblicke gewährt der Rog-Wanderweg, der am
      Waldrand entlangführt. Er verläuft über rund 64 km vom See von Kočevje zum Urwald Rajhenavski Rog,
      markiert mit einer Bärentatze. Er führt an verlassenen Gottscheer Siedlungen und Rodungsinseln vorbei
      durch Wälder, die seit Jahrhunderten eigenen Gesetzen folgen. Die Route eignet sich für Wanderer mit
      solider Grundkondition, kürzere Teilstrecken auch für Familien. Ausreichend Wasser und Verpflegung sind
      mitzuführen, da Quellen fehlen. Wanderkarten sind in den Infozentren erhältlich. Eine geführte Tour
      beinhaltet eine 2 km lange Rundwanderung am Reservatsrand.


      In der Nähe bilden die Željne-Höhlen ein horizontales Höhlensystem von 1600 Metern Länge, das durch
      Deckenfenster mit Tageslicht erhellt wird. In der Zigeunerhöhle belegen über 1400 Funde menschliche
      Anwesenheit vor rund 20.000 Jahren.
    history: >-
      Das Rog-Gebiet ist heute weitgehend unbesiedelt. Von 1895 bis 1932 arbeitete hier ein Dampfsägewerk,
      versorgt über eine 35 Kilometer lange schmalspurige Waldeisenbahn, deren Trassen noch im Gelände
      erkennbar sind. Um den Urwald zu schützen, darf er nicht betreten werden: Man bewundert ihn
      ausschliesslich von markierten Wegen aus.
    before: >-
      Betritt niemals den Urwald und bleibe ausschliesslich auf den markierten Wegen. Führe ausreichend Wasser
      und Proviant mit. Geführte Exkursionen unterliegen festen Programmen: Informiere dich vorab bei der
      Tourismusorganisation.
    around: >-
      Der Urwald ist Teil des [Waldkomplexes Kočevsko](/lugar/kocevski-gozdni-kompleks/). Rund zweiundzwanzig
      Kilometer entfernt liegt der [Urwald Krokar](/lugar/pragozd-krokar/), das UNESCO-Welterbegebiet der
      Region; achtundzwanzig Kilometer entfernt erstreckt sich der [Nationalpark
      Risnjak](/lugar/nacionalni-park-risnjak---sumski-kompleks/).
  it:
    intro: >-
      Nel 1892 un forestale lungimirante annotò in un piano di assestamento che una porzione di bosco doveva
      restare esattamente com'era. Era Leopold Hufnagel, capo forestale delle tenute del principe Auersperg, e
      la sua intuizione diede vita nel Kočevski Rog alla prima area naturale protetta della Slovenia e alla
      seconda al mondo, vent'anni appena dopo Yellowstone. Oltre un secolo dopo, la foresta vergine di
      Rajhenavski Rog è ancora lì: 51 ettari di abeti e faggi colossali nel cuore di un altopiano carsico, in
      cui nessuno può entrare. Si ammira soltanto dall'esterno.
    landscape: >-
      Il Kočevski Rog è un altopiano carsico delle Alpi Dinariche intensamente selvoso, culminante nel Veliki
      Rog a 1099 m. Al centro sorge la foresta vergine di Rajhenavski Rog. I suoi alberi, in prevalenza [abeti
      bianchi](/especie/abies_alba/) e faggi, sono colossi secolari che toccano i 50 metri di altezza, con
      esemplari che sfiorano i cinquecento anni. L'abete più imponente misura 51 metri ed è chiamato Debela
      Jelka, la Regina del Rog.


      Non è solo l'altezza a fare la differenza. Nella foresta primaria si compenetrano tutte le fasi dello
      sviluppo naturale su superfici ridotte, con una biomassa legnosa che tocca gli 800 m³/ha, di gran lunga
      superiore a quella dei boschi da taglio. Nell'intero comprensorio di Kočevje le foreste vergini relitte
      occupano appena 218 ettari, giunte a noi perché nessun boscaiolo vi mise mai mano. Le più celebri sono
      Rajhenavski Rog e Krokar.
    wildlife: >-
      Nel Kočevsko si sono preservati i tre grandi predatori europei: [orso bruno](/especie/ursus_arctos/),
      [lupo](/especie/canis_lupus/) e [lince europea](/especie/lynx_lynx/). L'orso è il simbolo del territorio
      ed è inserito nella lista rossa slovena dal 1993. La lince, scomparsa storicamente, fu reintrodotta nei
      boschi del Kočevsko nel corso degli anni 1970. Il branco di lupi rappresenta uno dei pochi nuclei
      indigeni relitti dell'Europa centrale. Abbondano cervo, capriolo, volpe e cinghiale.


      Avvistare questi animali in autonomia è assai difficile. Per conoscere l'orso si organizzano visite
      guidate e appostamenti serali da capanni sopraelevati sicuri. In autunno il bramito del cervo risuona
      spettacolare.


      Alzando lo sguardo, l'aquila di mare mostra oltre 2 metri di apertura alare; in estate nidificano
      l'[allocco degli Urali](/especie/strix_uralensis/) e l'astore. Sul lago di Kočevje stazionano più di 70
      specie di uccelli.
    visit: >-
      È severamente vietato entrare nella riserva integrale: la foresta si osserva unicamente dal sentiero Rog
      che ne costeggia il perimetro. È un tracciato di circa 64 km che unisce il lago di Kočevje al bosco di
      Rajhenavski Rog, segnalato con impronte d'orso. Attraversa radure abbandonate e antichi borghi dei
      Gottscheer, in boschi dove la natura segue da secoli i propri ritmi. Adatto a camminatori con
      preparazione di base o media, alcuni tratti brevi si prestano alle famiglie. Porta viveri e acqua a
      sufficienza poiché non vi sono sorgenti. La guida del sentiero si ritira presso gli uffici turistici del
      Kočevsko. Un tour guidato prevede un anello di 2 km fino al margine della foresta primaria.


      Nei dintorni, le grotte di Željne compongono un sistema orizzontale di 1600 metri, agevole e illuminato
      da lucernari naturali. Nella Grotta dello Zingaro furono rinvenuti oltre 1400 manufatti a testimonianza
      di presenze umane risalenti a circa 20.000 anni fa.
    history: >-
      L'area del Rog è oggi in gran parte disabitata. La segheria a vapore di Rog rimase attiva dal 1895 al
      1932, rifornita da una ferrovia forestale a scartamento ridotto di 35 chilometri i cui argini sono
      tuttora visibili. Per conservare la foresta primaria non vi si accede: si ammira esclusivamente dai
      tracciati escursionistici autorizzati.
    before: >-
      Non oltrepassare mai i confini della foresta vergine e rimani sui sentieri segnati. Porta con te acqua e
      provviste per l'intera escursione. Le visite guidate seguono calendari definiti: verifica in anticipo
      orari e disponibilità.
    around: >-
      La foresta primaria è parte integrante del [Complesso Forestale di
      Kočevsko](/lugar/kocevski-gozdni-kompleks/). A circa ventidue chilometri sorge la [Foresta Primordiale
      di Krokar](/lugar/pragozd-krokar/), l'altro grande sito UNESCO dell'area; e a ventotto si estende il
      [Parco Nazionale Risnjak](/lugar/nacionalni-park-risnjak---sumski-kompleks/).
  pt:
    intro: >-
      Em 1892 alguém redigiu num plano de ordenamento florestal que uma parcela da mata devia ser preservada
      tal como estava. Tratava-se de Leopold Hufnagel, engenheiro florestal chefe das propriedades do príncipe
      Auersperg, e a sua visão originou em Kočevski Rog a primeira área protegida da Eslovénia e a segunda em
      todo o mundo, escassos vinte anos após Yellowstone. Mais de um século volvido, a floresta primária de
      Rajhenavski Rog permanece intocada: 51 hectares de abetos e faias gigantes no coração de um planalto
      cárstico, onde ninguém penetra. Observa-se apenas de fora.
    landscape: >-
      Kočevski Rog é um planalto cárstico dos Alpes Dináricos densamente florestado, cuja cota culminante
      atinge 1099 m no Veliki Rog. No seu âmago resguarda-se a floresta virgem de Rajhenavski Rog. As suas
      árvores, sobretudo [abetos-brancos](/especie/abies_alba/) e faias-europeias, são gigantes centenários
      que atingem os 50 metros de altura, contando alguns espécimes até quinhentos anos. O abeto mais
      imponente atinge 51 metros e intitula-se Debela Jelka, a Rainha de Rog.


      O valor do ecossistema não se esgota no porte das árvores. Na mata virgem cruzam-se todas as fases do
      ciclo biológico florestal em áreas restritas, com um volume de biomassa lenhosa que chega a 800 m³/ha,
      superando largamente as matas exploradas. Em toda a região de Kočevje as florestas virgens cobrem
      somente 218 hectares, salvas pela ausência de machados. As mais emblemáticas são Rajhenavski Rog e
      Krokar.
    wildlife: >-
      Em Kočevsko conservaram-se os três grandes carnívoros europeus: o [urso-pardo](/especie/ursus_arctos/),
      o [lobo](/especie/canis_lupus/) e o [lince-euroasiático](/especie/lynx_lynx/). O urso é o símbolo
      heráldico da região, constando no livro vermelho esloveno desde 1993. O lince chegou a extinguir-se na
      Eslovénia, tendo sido reintroduzido nestas florestas durante a década de 1970. A alcateia de lobos é uma
      das escassas linhagens estritamente autóctones da Europa central. Ocorrem ainda veado, corço, raposa e
      javali.


      Avistar estes mamíferos por conta própria é muito improvável. Para conhecer o urso organizam-se roteiros
      guiados e esperas noturnas em abrigos florestais seguros. No outono a brama dos veados ecoa pela
      floresta.


      Nas alturas, a águia-rabalva atinge mais de 2 metros de envergadura; no verão nidificam a
      [coruja-dos-urales](/especie/strix_uralensis/) e o açor. No lago de Kočevje habitam mais de 70 espécies
      de aves aquáticas.
    visit: >-
      É expressamente interdito entrar na floresta primária: a visita limita-se ao trilho Rog, que contorna a
      periferia da reserva. Trata-se de um percurso de cerca de 64 km ligando o lago de Kočevje à floresta de
      Rajhenavski Rog, sinalizado com pegadas de urso. Passa por pastagens abandonadas e antigas aldeias dos
      Gottscheers, em matas onde a natureza atua há séculos sem entraves. Apresenta dificuldade física
      moderada, sendo alguns troços acessíveis a famílias. É indispensável transportar água e farnel, dada a
      carência de fontes no planalto. O guia do percurso está disponível nos postos de turismo. Uma visita
      guiada inclui um circuito circular de 2 km junto ao bordo da reserva.


      Nas imediações, as grutas de Željne formam uma galeria horizontal de 1600 metros, de progressão fácil e
      iluminada por claraboias naturais. Na Gruta do Cigano recolheram-se mais de 1400 vestígios comprovando
      presença humana há cerca de 20.000 anos.
    history: >-
      A área de Rog encontra-se hoje quase despovoada. A serração a vapor de Rog funcionou entre 1895 e 1932,
      abastecida por um caminho-de-ferro florestal de via estreita com 35 quilómetros cujos carris e taludes
      ainda se adivinham no terreno. Para salvaguardar a floresta virgem não se pisa o seu interior:
      contempla-se exclusivamente dos trilhos oficiais.
    before: >-
      Não ultrapasses os limites da floresta primária e caminha apenas pelos trilhos marcados. Leva água e
      mantimentos para toda a jornada. As excursões acompanhadas com guias têm horários fixos: informa-te com
      antecedência.
    around: >-
      A floresta primária integra o [Complexo Florestal de Kočevsko](/lugar/kocevski-gozdni-kompleks/). A
      cerca de vinte e dois quilómetros situa-se a [Floresta Primária de Krokar](/lugar/pragozd-krokar/), a
      outra grande mata virgem da região sob tutela da UNESCO; e a vinte e oito o [Parque Nacional
      Risnjak](/lugar/nacionalni-park-risnjak---sumski-kompleks/).
