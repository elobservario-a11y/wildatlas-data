resumen:
  es: >-
    La segunda cumbre más alta de los Montes Apuseni (Vlădeasa 1.836 m) rodeada de pinedas de montaña e
    insólitas formaciones rocosas.
  en: >-
    The second highest summit of the Apuseni Mountains (Vlădeasa 1,836 m) ringed by montane pine forests and
    singular rock formations.
  fr: >-
    Le deuxième plus haut sommet des monts Apuseni (Vlădeasa 1 836 m) ceinturé de pinèdes d'altitude et de
    curiosités rocheuses.
  de: >-
    Der zweithöchste Gipfel des Apuseni-Gebirges (Vlădeasa 1.836 m), umrahmt von Bergwäldern und bizarren
    Felsbildungen.
  it: >-
    La seconda cima più elevata dei Monti Apuseni (Vlădeasa 1.836 m), cinta da pinete montane e insolite
    formazioni rupestri.
  pt: >-
    O segundo cume mais alto dos Montes Apuseni (Vlădeasa 1.836 m), envolvido por pinhais de altitude e
    formações rochosas invulgares.
unico:
  es: >-
    Un macizo volcánico de cumbres redondas que esconde, a pocos kilómetros de sus pastos, un islote de caliza
    blanca llamado Pietrele Albe.
  en: >-
    A volcanic massif of rounded domes sheltering, just a few kilometres from its pastures, an isolated white
    limestone islet called Pietrele Albe.
  fr: >-
    Un massif volcanique aux crêtes moutonnantes abritant, à peu de distance de ses alpages, un îlot de
    calcaire blanc nommé Pietrele Albe.
  de: >-
    Ein vulkanisches Massiv mit kuppigen Hochflächen, das unweit seiner Almen eine weiße Kalksteininsel namens
    Pietrele Albe birgt.
  it: >-
    Un massiccio vulcanico dalle vette arrotondate che nasconde, a pochi chilometri dai pascoli, un rilievo di
    calcare candido chiamato Pietrele Albe.
  pt: >-
    Um maciço vulcânico de cumes arredondados que oculta, a poucos quilómetros das suas pastagens, um relevo
    de calcário branco chamado Pietrele Albe.
observaciones:
  es: >-
    La cueva Vârfurașu está cerrada al público. Las nieblas, frecuentes de noviembre a marzo, y las tormentas
    de mayo piden mirar el parte antes de salir. En la travesía de cresta hacia Padiș hay dificultades de
    orientación en invierno; Salvamont Cluj ofrece mapa y archivos de GPS de la zona.
texto:
  es:
    intro: >-
      Hay montañas que se levantan y montañas que se hunden para dejar salir el fuego. Vlădeasa es de las
      segundas: cuando el terreno se hundió, hace unos 150 millones de años, el magma subió por las grietas,
      primero en forma de andesitas y después de riolitas, riodacitas y dacitas. De esa herencia volcánica
      salen hoy las cumbres redondas del macizo, entre ellas la más alta, Vârful Vlădeasa, con 1.836 metros.
      Es una pieza de los montes Apuseni que se extiende por el norte hasta el río Crișul Repede.
    landscape: >-
      Por debajo de todo hay rocas cristalinas del Proterozoico superior, de hace unos 550 millones de años.
      Encima se extiende el volcán: cumbres anchas, crestas largas y picos redondeados, porque la roca es
      homogénea y la erosión ha trabajado sin sorpresas. Los valles de Iadului, Drăganului y Săcuieului lo
      parten en tres de norte a sur; recogen casi todas sus aguas y las llevan al Crișul Repede.


      Y luego está el contraste. Al oeste de Răchițele, entre 1100 y 1300 metros, afloran calizas jurásicas y
      paleocenas: Pietrele Albe, paredes blancas, gargantas y cuevas. Una de ellas, la cueva Vârfurașu, pasa
      de 2.420 metros de galerías, pero no está abierta a los visitantes. Otra, la cueva Ferice, al suroeste
      de Stâna de Vale, guardó huesos de oso de las cavernas.


      El agua remata el cuadro. Los arroyos rápidos abren gargantas como Cheile Iadului y Cheile Mișcu, y caen
      en cascadas con nombres de cuento: Iadolina, Săritoarea Ieduțului, Moara Dracului. La más famosa es la
      cascada de Răchițele, también llamada Vălul Miresei, el velo de la novia: salta más de treinta metros
      por el Valea Stanciului, a unos 1000 metros de altitud. En las cumbres, el hielo y la nieve dejaron
      pequeños circos en la vertiente este de Buteasa y terrazas de solifluxión.
    wildlife: >-
      El macizo funciona como barrera para las masas de aire del oeste, y por eso llueve mucho: Stâna de Vale
      es el lugar más lluvioso de Rumanía, con más de 1800 milímetros al año. Arriba, en la cima, caen unos
      1100 milímetros, porque las nubes ya han soltado buena parte de su carga en las alturas del oeste. Los
      inviernos son largos y fríos, con enero a -6 °C de media; los veranos, cortos y frescos, con julio entre
      12 y 13 °C.


      Eso ordena el año. Mayo trae buena visibilidad, pero las tormentas fuertes pueden estropear una salida.
      Junio es lluvioso. Agosto y septiembre son los meses recomendados para las excursiones, y octubre es el
      mes con menos días de niebla; entre noviembre y marzo es cuando más abundan.


      Los pisos de vegetación siguen la altura. Por encima de 1500 metros hay pastos subalpinos con matorrales
      de enebro y pino enano; por debajo mandan los hayedos y los abetales. En valles hondos como Stâna de
      Vale la inversión térmica cambia el orden y las coníferas quedan bajo el bosque caducifolio. En Pietrele
      Albe crecen plantas de roca caliza como Dryas octopetala, Ranunculus oreophilus, Anthyllis alpestris,
      Gentiana clusii, Gentiana utriculosa y Carex rupestris. En Dealul Domnului, en Săcuieu, hay pino negro,
      alerce y hasta una secuoya de unos 100 años.


      La fauna incluye al [lobo](/especie/canis_lupus/), el [gato montés](/especie/felis_silvestris/), la
      [marta](/especie/martes_martes/) y la [nutria](/especie/lutra_lutra/). Entre las aves se citan el
      [ratonero común](/especie/buteo_buteo/) y el [águila pomerana](/especie/aquila_pomarina/). En el bosque
      caducifolio viven la [salamandra común](/especie/salamandra_salamandra/) y la [culebra de
      Esculapio](/especie/elaphe_longissima/), y en los ríos de altura, la trucha y el piscardo, y más abajo,
      en aguas más tranquilas, el tímalo.
    visit: >-
      Salvamont Cluj publica la ruta Doda Pilii–Răchițele–Vlădeasa, con mapa y descarga de GPS. La clásica del
      macizo es el circuito que sale de la cabaña, sube a la cima, pasa por Pietrele Albe y vuelve a la
      cabaña. Para quien busque más, está la travesía de cresta Vlădeasa–Padiș, que pasa por Vlădeasa, Buteasa
      y el claro y la cueva de Onceasa. En invierno tiene dificultades de orientación.


      Otras opciones, más cortas: el circuito de la cascada de Răchițele, Rogojel con el valle de Alunișului,
      el arroyo Ordângușa, el valle de Iadului con las paredes de Remeți y el embalse de Leșu, o el valle de
      Drăganului hasta las fuentes y la cascada Moara Dracului.


      El acceso más fácil es en coche: desde Huedin hay una carretera asfaltada por Sâncrai y Călata hasta
      Răchițele. En tren solo se llega al valle del Crișul Repede, al norte; las estaciones más cercanas son
      Valea Drăganului y Bologa.
    history: >-
      El valle de Iadului se cerró en 1973 con el embalse de Leșu, de 147 hectáreas, y el de Drăganului con el
      de Floroiu, de 290.
    before: >-
      La cueva Vârfurașu está cerrada al público. Las nieblas, frecuentes de noviembre a marzo, y las
      tormentas de mayo piden mirar el parte antes de salir. En la travesía de cresta hacia Padiș hay
      dificultades de orientación en invierno; Salvamont Cluj ofrece mapa y archivos de GPS de la zona.
    around: >-
      A unos siete kilómetros está el [Valle de Someșul Rece](/lugar/somesul-rece-valley/), y a veintitrés la
      [Garganta del Crișul Repede](/lugar/cheile-crisului-repede/), el río que recoge las aguas de Vlădeasa.
      Lejos de aquí, el [Parque Nacional Călimani](/lugar/parcul-national-calimani---sumski-masiv/) comparte
      con el macizo el águila pomerana, la marta y el gato montés.
  en:
    intro: >-
      Some mountains are thrust upward by tectonic pressure, while others collapse inward to vent molten fire.
      Vlădeasa belongs to the latter: when the crust foundered roughly 150 million years ago, magma surged
      through fractures, cooling first as andesites and subsequently as rhyolites, rhyodacites, and dacites.
      From that ancient eruptive legacy stem the broad, domed summits characterizing the range today,
      culminating at Vârful Vlădeasa at 1,836 metres. It represents an imposing redoubt of the northern
      Apuseni Mountains reaching north toward the Crișul Repede valley.
    landscape: >-
      Deep at its core lie crystalline basement rocks of the upper Proterozoic, dating back some 550 million
      years. Above them spreads the volcanic edifice: expansive summits, long ridges, and smooth rounded
      crests sculpted uniformly by erosive forces across homogeneous rock. The valleys of Iadului, Drăganului,
      and Săcuieului cleave the massif into three main sectors from north to south, gathering nearly all
      runoff to feed the Crișul Repede.


      Then comes the stark geological contrast. West of Răchițele, between 1100 and 1300 metres, Jurassic and
      Paleocene limestones erupt into the landscape: Pietrele Albe, showcasing gleaming white cliffs, steep
      gorges, and caverns. One of these, Vârfurașu Cave, extends through more than 2,420 metres of underground
      galleries, though it remains closed to visitors. Another, Ferice Cave southwest of Stâna de Vale, once
      concealed fossilized cave bear remains.


      Water sculpts the final contours. Rushing mountain torrents carve narrow defiles such as Cheile Iadului
      and Cheile Mișcu, plunging over storybook cascades: Iadolina, Săritoarea Ieduțului, and Moara Dracului.
      The most celebrated is the Răchițele waterfall, also known as Vălul Miresei (the Bride's Veil), plunging
      more than thirty metres into the Valea Stanciului at roughly 1000 metres elevation. Along the high
      summits, glacial ice and snow carved small cirques on the eastern flanks of Buteasa alongside
      solifluction terraces.
    wildlife: >-
      The massif forms a stout orographic barrier against moist westerly weather fronts, producing copious
      precipitation: Stâna de Vale is Romania's wettest inhabited outpost, receiving over 1800 millimetres of
      annual rainfall. High on the apex rainfall moderates to around 1100 millimetres, clouds having shed
      their load on western escarpments. Winters are protracted and cold, averaging -6 °C in January; summers
      remain brief and fresh, with July temperatures hovering between 12 and 13 °C.


      This climate dictates the hiking season. May brings crisp clarity, though fierce thunderstorms can
      disrupt high routes. June is notoriously wet. August and September offer ideal trekking conditions,
      while October records the fewest foggy days; from November through March, fog blankets the peaks.


      Vegetation zones stratify strictly with altitude. Above 1500 metres, subalpine grasslands merge with
      dwarf juniper and mountain pine scrub; below, dense beech and silver fir woods hold sway. In sunken
      troughs like Stâna de Vale, severe thermal inversions reverse normal zoning, placing cold-hardy conifers
      below deciduous stands. At Pietrele Albe grow calciphile rupicolous treasures such as Dryas octopetala,
      Ranunculus oreophilus, Anthyllis alpestris, Gentiana clusii, Gentiana utriculosa, and Carex rupestris.
      On Dealul Domnului near Săcuieu thrive Austrian pine, European larch, and an introduced giant sequoia
      roughly 100 years old.


      Mammalian predators include the [grey wolf](/especie/canis_lupus/), European
      [wildcat](/especie/felis_silvestris/), European [pine marten](/especie/martes_martes/), and [Eurasian
      otter](/especie/lutra_lutra/). Avian observers record the [common buzzard](/especie/buteo_buteo/) and
      [lesser spotted eagle](/especie/aquila_pomarina/). Deciduous hollows harbor the [fire
      salamander](/especie/salamandra_salamandra/) and [Aesculapian snake](/especie/elaphe_longissima/), while
      upland streams support brown trout and common minnow, joined lower down by European grayling.
    visit: >-
      Salvamont Cluj maintains the marked Doda Pilii–Răchițele–Vlădeasa itinerary, complete with trail maps
      and downloadable GPS tracks. The classic massif route is the circular hike departing from the mountain
      cabana, ascending to the summit, traversing through Pietrele Albe, and returning to the hut. For
      seasoned trekkers, the high ridge traverse from Vlădeasa to Padiș crosses Vlădeasa summit, Buteasa peak,
      and the meadow and cave of Onceasa; winter travel poses serious navigational hazards.


      Shorter excursions include the Răchițele waterfall loop, Rogojel with the Alunișului valley, the
      Ordângușa gorge, the Iadului valley featuring the Remeți limestone bluffs and the Leșu reservoir, or the
      Drăganului valley leading to headwaters and Moara Dracului cascade.


      Access is easiest by road: from Huedin, a paved route leads via Sâncrai and Călata to Răchițele.
      Passenger trains only serve the Crișul Repede valley to the north, with the closest railway halts at
      Valea Drăganului and Bologa.
    history: >-
      The Iadului valley was impounded in 1973 by the Leșu dam, forming a 147-hectare reservoir, while the
      Drăganului valley was flooded behind the Floroiu dam across 290 hectares.
    before: >-
      Vârfurașu Cave is strictly closed to the general public. Pervasive fog between November and March as
      well as sudden violent thunderstorms in May demand careful weather checks prior to departure. The winter
      crest traverse toward Padiș entails severe orientation challenges; Salvamont Cluj provides verified
      cartography and GPS tracks.
    around: >-
      Roughly seven kilometres away lies the [Someșul Rece Valley](/lugar/somesul-rece-valley/), while
      twenty-three kilometres north sits the [Crișul Repede Gorge](/lugar/cheile-crisului-repede/), which
      collects the waters of Vlădeasa. Further afield, [Călimani National
      Park](/lugar/parcul-national-calimani---sumski-masiv/) shares lesser spotted eagles, pine martens, and
      wildcats.
  fr:
    intro: >-
      Il est des montagnes qui s'érigent et d'autres qui s'effondrent pour libérer le feu des profondeurs. Le
      Vlădeasa appartient à cette seconde catégorie : lorsque l'écorce s'affaissa il y a environ 150 millions
      d'années, le magma monta par les failles, d'abord sous forme d'andésites puis de rhyolites, de
      rhyodacites et de dacites. De cet héritage volcanique résultent les dômes arrondis du massif actuel,
      couronnés par le Vârful Vlădeasa à 1 836 mètres d'altitude. C'est un bastion septentrional des monts
      Apuseni s'étendant vers le nord jusqu'au défilé du Crișul Repede.
    landscape: >-
      Le socle profond se compose de roches cristallines du Protérozoïque supérieur vieilles de quelque 550
      millions d'années. Au-dessus s'étale l'édifice volcanique : cimes amples, longues échines et crêtes
      adoucies par une érosion régulière sur un substrat homogène. Les vallées d'Iadului, de Drăganului et de
      Săcuieului compartimentent le relief en trois secteurs du nord au sud, drainant les eaux vers le Crișul
      Repede.


      Puis surgit le contraste géologique. À l'ouest de Răchițele, entre 1100 et 1300 mètres, des calcaires
      jurassiques et paléocènes percent la verdure : les Pietrele Albe déploient falaises éclatantes, ravins
      et cavités. Parmi elles, la grotte Vârfurașu développe plus de 2 420 mètres de galeries mais demeure
      interdite au public. Plus au sud-ouest, près de Stâna de Vale, la grotte Ferice a livré de précieux
      ossements d'ours des cavernes.


      L'eau parfait ce décor sauvage. Des ruisseaux torrentiels incisent des gorges comme Cheile Iadului et
      Cheile Mișcu, tombant en cascades pittoresques : Iadolina, Săritoarea Ieduțului et Moara Dracului. La
      plus renommée est la cascade de Răchițele, dite Vălul Miresei (le voile de la mariée), plongeant de plus
      de trente mètres dans la Valea Stanciului à environ 1000 mètres d'altitude. Sur les cimes, névés et
      glaces quaternaires ont façonné de petits cirques orientés à l'est du Buteasa ainsi que des terrasses de
      solifluxion.
    wildlife: >-
      Faisant obstacle aux dépressions humides venues de l'ouest, le massif est copieusement arrosé : Stâna de
      Vale est le point habité le plus pluvieux de Roumanie avec plus de 1800 millimètres de précipitations
      annuelles. Au sommet, la pluviométrie baisse autour de 1100 millimètres, les nuages s'étant déchargés
      sur les premières pentes. Les hivers sont longs et rudes avec -6 °C en moyenne en janvier ; les étés
      restent brefs et frais avec un mois de juillet oscillant entre 12 et 13 °C.


      Ce climat rythme les saisons. Mai offre une atmosphère limpide mais des orages violents peuvent
      surprendre le marcheur. Juin est pluvieux. Août et septembre constituent les mois privilégiés pour
      randonner, et octobre compte le moins de brouillard ; de novembre à mars les brumes deviennent
      constantes.


      Les étages de végétation s'étagent rigoureusement. Au-dessus de 1500 mètres s'étendent les pelouses
      subalpines piquetées de genévriers nains et de pins mugos ; plus bas dominent hêtraies et sapinières.
      Dans les dépressions encaissées comme Stâna de Vale, les inversions thermiques placent les conifères
      sous le couvert feuillu. À Pietrele Albe s'accrochent des plantes saxicoles calcicoles : Dryas
      octopetala, Ranunculus oreophilus, Anthyllis alpestris, Gentiana clusii, Gentiana utriculosa et Carex
      rupestris. Au Dealul Domnului, à Săcuieu, poussent le pin noir, le mélèze et un séquoia géant âgé
      d'environ 100 ans.


      La faune compte le [loup](/especie/canis_lupus/), le [chat sauvage](/especie/felis_silvestris/), la
      [martre des pins](/especie/martes_martes/) et la [loutre d'Europe](/especie/lutra_lutra/). Côté
      avifaune, on observe la [buse variable](/especie/buteo_buteo/) et l'[aigle
      pomarin](/especie/aquila_pomarina/). Dans les bois humides vivent la [salamandre
      tachetée](/especie/salamandra_salamandra/) et la [couleuvre d'Esculape](/especie/elaphe_longissima/),
      tandis que les ruisseaux abritent truite fario, vairon et ombre commun.
    visit: >-
      Salvamont Cluj balise l'itinéraire Doda Pilii–Răchițele–Vlădeasa avec cartes et traces GPS. Le circuit
      emblématique part du refuge, monte au sommet, rejoint Pietrele Albe et boucle vers le refuge. Pour les
      marcheurs aguerris, la grande traversée de crête Vlădeasa–Padiș franchit le sommet, le Buteasa et la
      clairière d'Onceasa ; elle présente en hiver de sérieuses difficultés d'orientation.


      D'autres balades plus courtes mènent à la cascade de Răchițele, à Rogojel et au vallon d'Alunișului, aux
      gorges d'Ordângușa, à la vallée d'Iadului avec les falaises de Remeți et le lac de Leșu, ou à la vallée
      de Drăganului jusqu'à la cascade Moara Dracului.


      L'accès s'effectue aisément en voiture depuis Huedin par une route asphaltée via Sâncrai et Călata
      jusqu'à Răchițele. En train, la ligne ne dessert que la vallée du Crișul Repede au nord, les gares les
      plus proches étant Valea Drăganului et Bologa.
    history: >-
      La vallée d'Iadului fut barrée en 1973 pour créer la retenue de Leșu, couvrant 147 hectares, tandis que
      celle de Drăganului fut submergée par le barrage de Floroiu sur 290 hectares.
    before: >-
      La grotte de Vârfurașu est fermée à la visite. Le brouillard persistant de novembre à mars et les orages
      de mai imposent de consulter la météo avant de partir. La traversée hivernale vers Padiș réclame une
      grande prudence ; Salvamont Cluj met à disposition cartes et tracés GPS fiables.
    around: >-
      À sept kilomètres s'étend la [vallée de Someșul Rece](/lugar/somesul-rece-valley/), et à vingt-trois
      kilomètres au nord les [gorges du Crișul Repede](/lugar/cheile-crisului-repede/). Plus loin, le [parc
      national Călimani](/lugar/parcul-national-calimani---sumski-masiv/) partage avec le Vlădeasa l'aigle
      pomarin, la martre et le chat sauvage.
  de:
    intro: >-
      Manche Berge türmen sich durch Faltung auf, andere sacken ab, um dem Erdinneren ein Ventil zu bieten.
      Das Vlădeasa-Massiv gehört zum zweiten Typus: Als die Erdkruste vor rund 150 Millionen Jahren absank,
      stieg Magma durch Bruchspalten empor, zunächst als Andesit, später als Rhyolith, Rhyodacit und Dacit.
      Dieser vulkanischen Vorgeschichte verdanken die heutigen sanft geschwungenen Kuppen ihre Gestalt,
      gekrönt vom Vârful Vlădeasa mit 1.836 Metern Höhe. Es bildet den markanten Nordflügel des
      Apuseni-Gebirges, der bis an das Tal der Schnellen Kreisch (Crișul Repede) heranreicht.
    landscape: >-
      Die tiefste Basis bilden kristalline Gesteine des oberen Proterozoikums aus der Zeit vor etwa 550
      Millionen Jahren. Darüber wölbt sich der Vulkankörper: breite Bergrücken, langgezogene Grate und
      gerundete Kuppen, die durch gleichmäßige Verwitterung des homogenen Gesteins entstanden sind. Die Täler
      Iadului, Drăganului und Săcuieului gliedern das Massiv von Nord nach Süd in drei Züge und leiten das
      Wasser der Schnellen Kreisch zu.


      Und dann eröffnet sich ein faszinierender geologischer Kontrast. Westlich von Răchițele ragen zwischen
      1100 und 1300 Metern jurassische und paläozäne Kalke auf: Pietrele Albe zeigt weiße Felsabbrüche,
      Klammen und Höhlen. Die Höhle Vârfurașu besitzt über 2.420 Meter vermessene Gänge, ist für Besucher
      jedoch gesperrt. Eine andere Höhle, Peștera Ferice südwestlich von Stâna de Vale, barg fossile
      Höhlenbärenknochen.


      Das Wasser vollendet die Gebirgslandschaft. Wildbäche schneiden Schluchten wie Cheile Iadului und Cheile
      Mișcu ein und stürzen über Wasserfälle wie Iadolina, Săritoarea Ieduțului und Moara Dracului. Am
      berühmtesten ist der Răchițele-Wasserfall, auch Brautschleier (Vălul Miresei) genannt: Er fällt über
      mehr als dreißig Meter im Stanciului-Tal auf etwa 1000 Metern Höhe. An den Hochkämmen hinterließen
      eiszeitliche Gletscher kleine Kare an der Ostseite der Buteasa sowie periglaziale
      Solifluktionsterrassen.
    wildlife: >-
      Das Massiv wirkt als Wetterscheide für atlantische Westwinde, weshalb hier enorme Niederschläge fallen:
      Stâna de Vale gilt mit über 1800 Millimetern Jahresniederschlag als regenreichster Ort Rumäniens. Auf
      der Gipfelkuppe sinkt die Menge auf etwa 1100 Millimeter, da sich die Wolken an den vorgelagerten
      Westhängen abregnen. Die Winter sind lang und schneereich mit durchschnittlich -6 °C im Januar; die
      Sommer bleiben kühl mit Juli-Mittelwerten zwischen 12 und 13 °C.


      Dieser Rhythmus bestimmt das Wanderjahr. Der Mai bietet oft weite Fernsichten, birgt jedoch heftige
      Gewitter. Der Juni ist feucht. August und September gelten als beste Wanderzeit, und der Oktober weist
      die wenigsten Nebeltage auf; von November bis März herrscht oft dichter Nebel.


      Die Höhenstufen sind deutlich gegliedert. Oberhalb von 1500 Metern breiten sich subalpine Matten mit
      Wacholder und Bergkiefern aus; darunter herrschen Buchen- und Tannenwälder vor. In tiefen Senken wie
      Stâna de Vale kehrt eine Kaltluftinversion die Zonierung um, sodass Nadelbäume unterhalb des Laubwaldes
      wachsen. Bei Pietrele Albe gedeihen Kalkfels-Spezialisten wie Dryas octopetala, Ranunculus oreophilus,
      Anthyllis alpestris, Gentiana clusii, Gentiana utriculosa und Carex rupestris. Am Dealul Domnului bei
      Săcuieu wachsen Schwarzkiefer, Lärche und ein rund 100 Jahre alter Riesenmammutbaum.


      Unter den Säugetieren leben hier [Wolf](/especie/canis_lupus/), [Wildkatze](/especie/felis_silvestris/),
      [Baummarder](/especie/martes_martes/) und [Eurasischer Fischotter](/especie/lutra_lutra/). Bei den
      Vögeln sind [Mäusebussard](/especie/buteo_buteo/) und [Schreiadler](/especie/aquila_pomarina/)
      vertreten. Im Laubwald leben [Feuersalamander](/especie/salamandra_salamandra/) und
      [Äskulapnatter](/especie/elaphe_longissima/), während Gebirgsbäche Bachforelle, Elritze und Äsche
      beherbergen.
    visit: >-
      Der Bergrettungsdienst Salvamont Cluj markiert die Route Doda Pilii–Răchițele–Vlădeasa mit Wanderkarten
      und GPS-Daten. Der Klassiker ist die Rundwanderung ab der Schutzhütte über den Gipfel und Pietrele Albe
      zurück zur Hütte. Weitwanderer wählen die anspruchsvolle Gratüberschreitung Vlădeasa–Padiș über die
      Buteasa und die Onceasa-Lichtung; im Winter verlangt sie alpine Erfahrung und gute Orientierung.


      Kürzere Wanderungen führen zum Brautschleier-Wasserfall bei Răchițele, nach Rogojel ins Alunișului-Tal,
      in die Ordângușa-Schlucht, ins Iadului-Tal mit den Remeți-Wänden und dem Leșu-Stausee oder ins
      Drăganului-Tal zum Wasserfall Moara Dracului.


      Die Anreise erfolgt am einfachsten mit dem Auto ab Huedin über asphaltierte Straßen via Sâncrai und
      Călata nach Răchițele. Die Bahn verkehrt nur im Tal der Schnellen Kreisch im Norden mit Bahnhöfen in
      Valea Drăganului und Bologa.
    history: >-
      Das Iadului-Tal wurde 1973 durch den 147 Hektar großen Leșu-Stausee aufgestaut, das Drăganului-Tal durch
      die Floroiu-Talsperre mit 290 Hektar Wasserfläche.
    before: >-
      Die Höhle Vârfurașu ist für die Öffentlichkeit gesperrt. Häufige Nebel von November bis März sowie
      Mai-Gewitter erfordern vor dem Aufbruch einen genauen Wetterbericht. Bei der Winterüberschreitung nach
      Padiș ist Orientierungssinn gefragt; Salvamont Cluj bietet aktuelle GPS-Tracks.
    around: >-
      Rund sieben Kilometer entfernt liegt das [Someșul-Rece-Tal](/lugar/somesul-rece-valley/), und
      dreiundzwanzig Kilometer nördlich öffnet sich die [Klamm der Schnellen
      Kreisch](/lugar/cheile-crisului-repede/). Weiter entfernt teilt der [Nationalpark
      Călimani](/lugar/parcul-national-calimani---sumski-masiv/) Schreiadler, Baummarder und Wildkatzen mit
      dem Massiv.
  it:
    intro: >-
      Vi sono montagne che si innalzano per corrugamento e altre che sprofondano per dare sfogo al fuoco
      sotterraneo. Il Vlădeasa appartiene alla seconda categoria: quando la crosta sprofondò circa 150 milioni
      di anni fa, il magma risalì lungo le faglie, prima sotto forma di andesiti e in seguito di rioliti,
      riodaciti e daciti. Da questa genesi vulcanica derivano le ampie cupole arrotondate del massiccio
      odierno, culminanti nel Vârful Vlădeasa a 1.836 metri. È un massiccio dei monti Apuseni settentrionali
      che si prolunga a nord verso la valle del Crișul Repede.
    landscape: >-
      Alla base affiorano rocce cristalline del Proterozoico superiore risalenti a circa 550 milioni di anni
      fa. Al di sopra si distende l'apparato vulcanico: dorsali spaziose, creste allungate e vette
      tondeggianti modellate in modo uniforme dall'erosione su roccia omogenea. Le valli di Iadului,
      Drăganului e Săcuieului solcano il massiccio in tre tronconi da nord a sud, convogliando le acque verso
      il Crișul Repede.


      Spicca poi un netto contrasto geologico. A ovest di Răchițele, tra 1100 e 1300 metri, affiorano calcari
      giurassici e paleocenici: Pietrele Albe sfoggia pareti bianche, forre e caverne. Tra queste, la grotta
      Vârfurașu vanta oltre 2.420 metri di gallerie, ma resta preclusa al pubblico. Un'altra cavità, la grotta
      Ferice a sud-ovest di Stâna de Vale, ha restituito fossili di orso delle caverne.


      L'acqua arricchisce il rilievo. I torrenti scavano gole scoscese come Cheile Iadului e Cheile Mișcu,
      originando cascate scenografiche: Iadolina, Săritoarea Ieduțului e Moara Dracului. La più famosa è la
      cascata di Răchițele, detta Vălul Miresei (il velo della sposa), che compie un salto di oltre trenta
      metri nella Valea Stanciului a circa 1000 metri di quota. Sui crinali sommitali il gelo quaternario ha
      scavato piccoli circhi sul versante orientale della Buteasa e terrazzi di soliflusso.
    wildlife: >-
      Facendo da sbarramento alle correnti umide occidentali, il massiccio riceve piogge abbondanti: Stâna de
      Vale è la località più piovosa della Romania con oltre 1800 millimetri annui. In vetta le precipitazioni
      calano a circa 1100 millimetri, avendo le nubi scaricato gran parte dell'umidità sulle pendici
      occidentali. Gli inverni sono rigidi con -6 °C di media a gennaio; le estati rimangono brevi e fresche,
      con medie di luglio comprese tra 12 e 13 °C.


      Questo clima scandisce l'annata escursionistica. Maggio regala visibilità limpida ma temporali
      pomeridiani violenti. Giugno è piovoso. Agosto e settembre rappresentano i mesi più favorevoli per il
      trekking, e ottobre vanta il minor numero di giornate nebbiose; tra novembre e marzo la nebbia avvolge
      spesso le creste.


      I piani vegetazionali si susseguono regolarmente. Sopra i 1500 metri si estendono pascoli subalpini con
      ginepro nano e pino mugo; più in basso dominano faggete e abetine. In conche incassate come Stâna de
      Vale l'inversione termica posiziona le conifere al di sotto dei boschi decidui. A Pietrele Albe
      prosperano specie rupicole calcifile: Dryas octopetala, Ranunculus oreophilus, Anthyllis alpestris,
      Gentiana clusii, Gentiana utriculosa e Carex rupestris. Sul Dealul Domnului a Săcuieu crescono pino
      nero, larice e una sequoia monumentale di circa 100 anni.


      Tra i mammiferi si segnalano il [lupo grigio](/especie/canis_lupus/), il [gatto
      selvatico](/especie/felis_silvestris/), la [martora](/especie/martes_martes/) e la [lontra
      europea](/especie/lutra_lutra/). L'avifauna annovera la [poiana](/especie/buteo_buteo/) e l'[aquila
      anatraia minore](/especie/aquila_pomarina/). Nei boschi decidui vivono la [salamandra
      pezzata](/especie/salamandra_salamandra/) e il [colubro di Esculapio](/especie/elaphe_longissima/),
      mentre i torrenti ospitano trote, sanguinerole e temoli.
    visit: >-
      Il soccorso alpino Salvamont Cluj segnala l'itinerario Doda Pilii–Răchițele–Vlădeasa con cartografia e
      tracce GPS. L'anello classico parte dal rifugio Vlădeasa, sale alla cima, tocca Pietrele Albe e rientra
      al punto di partenza. Per escursionisti esperti c'è la traversata di cresta Vlădeasa–Padiș passando per
      la Buteasa e la radura di Onceasa; d'inverno richiede orientamento attento.


      Tra le opzioni più brevi: l'escursione alla cascata di Răchițele, Rogojel con la valletta di Alunișului,
      la forra di Ordângușa, la valle di Iadului con le pareti di Remeți e l'invaso di Leșu, oppure la valle
      di Drăganului fino alla cascata Moara Dracului.


      L'accesso più comodo avviene in automobile da Huedin lungo la strada asfaltata via Sâncrai e Călata fino
      a Răchițele. In treno si raggiunge solo la valle del Crișul Repede a nord, con stazioni a Valea
      Drăganului e Bologa.
    history: >-
      La valle di Iadului è stata sbarrata nel 1973 creando il lago artificiale di Leșu di 147 ettari, mentre
      la valle di Drăganului accoglie l'invaso di Floroiu esteso su 290 ettari.
    before: >-
      La grotta Vârfurașu è chiusa alle visite turistiche. Le fitte nebbie tra novembre e marzo e i temporali
      di maggio impongono di verificare le previsioni meteo prima dell'escursione. La traversata invernale
      verso Padiș comporta insidie di orientamento; Salvamont Cluj mette a disposizione mappe e tracce GPS.
    around: >-
      A circa sette chilometri si trova la [Valle di Someșul Rece](/lugar/somesul-rece-valley/), e a ventitré
      chilometri verso nord le [Gole del Crișul Repede](/lugar/cheile-crisului-repede/). Più lontano, il
      [Parco nazionale Călimani](/lugar/parcul-national-calimani---sumski-masiv/) condivide aquila anatraia
      minore, martora e gatto selvatico.
  pt:
    intro: >-
      Há montanhas que se erguem por impulso orogénico e montanhas que colapsam para libertar o magma
      profundo. O maciço de Vlădeasa pertence ao segundo grupo: quando a crosta abateu há cerca de 150 milhões
      de anos, a rocha fundida ascendeu pelas fendas, consolidando-se primeiro como andesitos e sucessivamente
      como riólitos, riodacitos e dacitos. Deste vulcanismo pretérito derivam os cumes boleados que hoje
      singularizam o relevo, coroados pelo Vârful Vlădeasa a 1.836 metros de altitude. Constitui um dos blocos
      setentrionais dos montes Apuseni, prolongando-se até ao desfiladeiro do Crișul Repede.
    landscape: >-
      Na base mais profunda jazem rochas cristalinas do Proterozoico superior com cerca de 550 milhões de
      anos. Sobre elas assenta o edifício vulcânico: cimos amplos, cristas extensas e picos suaves esculpidos
      uniformemente pelos agentes erosivos em rocha homogénea. Os vales de Iadului, Drăganului e Săcuieului
      retalham o maciço em três setores de norte a sul, encaminhando os caudais para o Crișul Repede.


      Surge então o contraste litológico. A oeste de Răchițele, entre os 1100 e os 1300 metros, emergem
      calcários jurássicos e paleocénicos: Pietrele Albe descortina escarpas alvas, gargantas e cavernas. Uma
      delas, a gruta Vârfurașu, prolonga-se por mais de 2.420 metros de galerias, permanecendo interdita a
      visitas. Outra cavidade, a gruta Ferice a sudoeste de Stâna de Vale, abrigou ossadas de
      urso-das-cavernas.


      A água completa o relevo. Cursos de água torrenciais cavam desfiladeiros como Cheile Iadului e Cheile
      Mișcu, despenhando-se em cascatas memoráveis: Iadolina, Săritoarea Ieduțului e Moara Dracului. A mais
      célebre é a cascata de Răchițele, conhecida como Vălul Miresei (o véu da noiva), com mais de trinta
      metros de queda no Valea Stanciului a cerca de 1000 metros de altitude. Nos cumes mais altos, os gelos
      quaternários formaram pequenos circos na vertente leste da Buteasa e terraços de solifluxão.
    wildlife: >-
      O maciço funciona como barreira orográfica às frentes húmidas de oeste, justificando chuvas intensas:
      Stâna de Vale é a povoação mais chuvosa da Roménia com mais de 1800 milímetros anuais. No topo, a
      pluviosidade desce para cerca de 1100 milímetros, pois as nuvens descarregaram grande parte da humidade
      nas encostas ocidentais. Os invernos são prolongados e gélidos, com -6 °C de média em janeiro; os verões
      mantêm-se breves e amenos, com médias de julho entre 12 e 13 °C.


      Este clima condiciona o calendário de caminhadas. Maio proporciona visibilidade desafogada, embora
      trovoadas repentinas possam surpreender os caminhantes. Junho é chuvoso. Agosto e setembro representam
      os meses mais favoráveis para travessias, e outubro apresenta o menor índice de nevoeiros; entre
      novembro e março o nevoeiro cobre frequentemente os cumes.


      Os andares de vegetação escalonam-se rigorosamente. Acima dos 1500 metros estendem-se pastagens
      subalpinas com zimbro-anão e pinheiro-asteca; abaixo reinam faiais e abetais. Em vales abrigados como
      Stâna de Vale, a inversão térmica faz com que as coníferas fiquem por baixo dos bosques caducifólios. Em
      Pietrele Albe medram espécies rupícolas calcícolas: Dryas octopetala, Ranunculus oreophilus, Anthyllis
      alpestris, Gentiana clusii, Gentiana utriculosa e Carex rupestris. No Dealul Domnului, em Săcuieu,
      ocorrem pinheiro-bravo, lariço e uma sequoia centenária com cerca de 100 anos.


      Entre os mamíferos contam-se o [lobo-cinzento](/especie/canis_lupus/), o
      [gato-bravo](/especie/felis_silvestris/), a [marta](/especie/martes_martes/) e a
      [lontra-europeia](/especie/lutra_lutra/). A avifauna compreende a
      [águia-de-asa-redonda](/especie/buteo_buteo/) e a [águia-pomarina](/especie/aquila_pomarina/). Nos
      bosques caducifólios vivem a [salamandra-de-fogo](/especie/salamandra_salamandra/) e a
      [cobra-de-Esculápio](/especie/elaphe_longissima/), enquanto as ribeiras sustentam trutas, bogas e
      tímalos.
    visit: >-
      O serviço de resgate Salvamont Cluj sinaliza o percurso Doda Pilii–Răchițele–Vlădeasa com cartografia e
      ficheiros GPS. O trilho clássico parte do refúgio Vlădeasa, sobe ao cume, passa por Pietrele Albe e
      regressa ao abrigo. Para caminhantes experientes, a travessia de crista Vlădeasa–Padiș passa pela
      Buteasa e pela clareira de Onceasa; no inverno acarreta sérias dificuldades de orientação.


      Outras caminhadas mais acessíveis conduzem à cascata de Răchițele, a Rogojel com o vale de Alunișului,
      ao canhão de Ordângușa, ao vale de Iadului com as fragas de Remeți e a albufeira de Leșu, ou ao vale de
      Drăganului até à cascata Moara Dracului.


      O acesso rodoviário faz-se a partir de Huedin por estrada asfaltada via Sâncrai e Călata até Răchițele.
      O transporte ferroviário alcança apenas o vale do Crișul Repede a norte, sendo as paragens mais próximas
      Valea Drăganului e Bologa.
    history: >-
      O vale de Iadului foi represado em 1973 para criar a albufeira de Leșu, com 147 hectares, enquanto o
      vale de Drăganului acolhe a barragem de Floroiu cobrindo 290 hectares.
    before: >-
      A gruta Vârfurașu encontra-se encerrada a visitas turísticas. Os nevoeiros frequentes entre novembro e
      março e as trovoadas de maio aconselham a consulta meteorológica prévia. A travessia invernal para Padiș
      exige atenção na rota; a Salvamont Cluj faculta mapas e ficheiros GPS.
    around: >-
      A cerca de sete quilómetros fica o [Vale de Someșul Rece](/lugar/somesul-rece-valley/), e a vinte e três
      quilómetros a norte o [Desfiladeiro do Crișul Repede](/lugar/cheile-crisului-repede/). Mais distante, o
      [Parque Nacional Călimani](/lugar/parcul-national-calimani---sumski-masiv/) partilha águias-pomarinas,
      martas e gatos-bravos.
