resumen:
  es: >-
    Una lengua de arena de casi cien kilómetros entre el Báltico y la laguna de Curlandia, con algunas de las
    dunas más altas de Europa.
  en: >-
    A sandy spit nearly a hundred kilometres long between the Baltic and the Curonian Lagoon, boasting some of
    Europe's highest dunes.
  fr: >-
    Un cordon sableux de près de cent kilomètres entre la Baltique et la lagune de Courlande, portant
    certaines des plus hautes dunes d'Europe.
  de: >-
    Eine fast einhundert Kilometer lange Sandzunge zwischen der Ostsee und dem Kurischen Haff mit einigen der
    höchsten Dünen Europas.
  it: >-
    Una lingua di sabbia lunga quasi cento chilometri tra il Baltico e la laguna di Curlandia, con alcune
    delle dune più alte d'Europa.
  pt: >-
    Uma língua de areia com quase cem quilómetros entre o Báltico e a lagoa da Curlândia, com algumas das
    dunas mais altas da Europa.
unico:
  es: >-
    Aquí las dunas más altas de Europa, vivas y en movimiento, conviven con un bosque plantado para frenarlas
    y con una de las rutas de migración más transitadas del Báltico.
  en: >-
    Here Europe's highest dunes, shifting and alive, coexist with a forest planted to tame them and one of the
    busiest bird migration flyways in the Baltic.
  fr: >-
    Ici, les plus hautes dunes d'Europe, vivantes et mouvantes, coexistent avec une forêt plantée pour les
    fixer et l'un des couloirs de migration les plus fréquentés de la Baltique.
  de: >-
    Hier koexistieren die höchsten Wanderdünen Europas, lebendig und in Bewegung, mit einem zu ihrer Bändigung
    gepflanzten Wald und einer der meistfrequentierten Vogelzugrouten des Ostseeraums.
  it: >-
    Qui le dune più alte d'Europa, vive e in continuo movimento, convivono con una foresta piantata per
    arrestarle e con una delle rotte migratorie più battute del Baltico.
  pt: >-
    Aqui as dunas mais altas da Europa, vivas e em movimento, convivem com uma floresta plantada para as
    travar e com uma das rotas de migração mais concorridas do Báltico.
observaciones:
  es: >-
    Para proteger el istmo no se permite destruir las dunas, montar tiendas de campaña ni encender fuego, y en
    las reservas solo se camina por los senderos de interpretación habilitados; en Grobštas y Nagliai está
    prohibido caminar fuera de los caminos. Si algún acceso o sector importa para tu visita, comprueba antes
    con el gestor qué está abierto.
texto:
  es:
    intro: >-
      Imagina una tira de arena de noventa y ocho kilómetros que el mar Báltico y una laguna se disputan desde
      hace unos cinco mil años. Eso es el istmo de Curlandia, y el Parque Nacional del Istmo de Curlandia
      guarda su mitad lituana: una franja estrecha, de entre cuatrocientos metros y casi cuatro kilómetros de
      ancho, donde las dunas se mueven, los pinos las sujetan y cada otoño pasan millones de aves. La leyenda
      báltica dice que la modeló una chica muy fuerte llamada Neringa mientras jugaba en la playa. Lo cierto
      es que fue arena traída por las corrientes, y que sigue cambiando.
    landscape: >-
      El istmo es un paisaje joven. Entre la laguna de Curlandia y el mar, la arena que traen las corrientes
      forma dunas que el viento empuja, hondonadas húmedas y playas. Las dunas miden de media treinta y cinco
      metros y algunas llegan a sesenta. La de Parnidis, junto a Nida, sube hasta cincuenta y dos y ha cruzado
      más de una vez el pueblo.


      Que el istmo siga en pie tiene mucho de esfuerzo humano. La deforestación dejó la arena sin freno y las
      dunas llegaron a enterrar pueblos enteros. En 1825 empezó una repoblación forestal a gran escala. Por
      eso hoy el bosque cubre el setenta y dos por ciento del parque, con el pino silvestre como árbol
      dominante, y la UNESCO lo incluyó en 2000 en la lista de Patrimonio Mundial: su supervivencia se debe a
      los constantes esfuerzos de estabilización y reforestación.


      El parque protege once monumentos naturales, entre ellos las dunas de Vecekrugas, Agila, Karvaičiai,
      Skirpstas y Vingis, y los cabos de Lydumas y Nagliai. Junto a las dunas vivas hay otras ya fijadas, las
      antiguas dunas parabólicas de Juodkrantė, y suelos que quedaron enterrados bajo la arena. En el bosque
      viejo, sobre todo cerca del mar, los árboles crecen inclinados por el viento.
    wildlife: >-
      La mejor estación es el paso migratorio. Por el istmo cruza una ruta entre el Mar Blanco y el Báltico
      por la que pasan, en primavera y otoño, unos quince millones de aves, y a unos treinta kilómetros de
      Klaipėda hay una estación de anillamiento. No es casualidad que allí se fundara el observatorio
      ornitológico de Rossitten, por la importancia del istmo como corredor de migración. En la época cálida
      crían unas doscientas cuarenta especies y, hacia el otoño, se pueden encontrar hasta trescientas.


      Junto a Juodkrantė, en pinos y abetos, hay una colonia mixta de [cormorán
      grande](/especie/phalacrocorax_carbo/) y [garza real](/especie/ardea_cinerea/): en 2020 criaron unos
      tres mil quinientos cormoranes y unas doscientas parejas de garza. Cada año crían además entre dos y
      cuatro parejas de [pigargo europeo](/especie/haliaeetus_albicilla/). Hay puestos de observación en la
      colina de Avinas, en las dunas grises de la reserva de Nagliai, en las dunas de Pervalka y sobre la duna
      de Parnidis, en Nida.


      En el bosque y las orillas viven [alces](/especie/alces_alces/), jabalíes y corzos. De vez en cuando
      aparece una foca gris en la costa, y entre los mamíferos destacan los murciélagos, con catorce especies.
      Viven también [castores](/especie/castor_fiber/) y [nutrias](/especie/lutra_lutra/). En la costa crecen
      plantas que no se ven en el resto de Lituania, como el cardo marino, y endemismos bálticos como Linaria
      loeselii.
    visit: >-
      Empieza por lo más fácil: el carril bici de cincuenta y tres kilómetros recorre el istmo, y se puede
      caminar por la costa de Nida a Juodkrantė, salvo el tramo de la reserva natural, o de Nida a Pervalka
      por la orilla de la laguna. La reserva de Nagliai tiene un sendero a pie, y los organizadores locales
      ofrecen conocerla en canoa por la orilla de la laguna.


      Los miradores merecen el desvío: Garnių kalnas, Nagliai, las dunas de Parnidis y Vecekrugas, la bahía de
      Pervalka y la duna Meškos galva. Para entender el lugar, el museo de la naturaleza del parque y el
      museo-acuario marino de Smiltynė cuentan el istmo desde dentro. Y en Nida y Juodkrantė el parque protege
      granjas etnográficas de pescadores y villas de finales del siglo XIX y principios del XX.
    history: >-
      La historia humana del istmo es una pelea con la arena. Entre los años 800 y 1016 allí estuvo Kaup, un
      gran centro comercial pagano que aún no se ha excavado. A finales del siglo XIX las dunas de Nida
      atrajeron a pintores de la academia de Königsberg.


      El parque se fundó en 1991 para guardar el paisaje costero lituano más valioso por su naturaleza y su
      cultura, con un cordón de dunas sin igual en Europa, y pertenece además a la red Natura 2000. Hoy se
      vigila también lo que llega de fuera: se han detectado unas dieciséis especies invasoras de plantas,
      entre ellas Rosa rugosa y Acer negundo.
    before: >-
      Para proteger el istmo no se permite destruir las dunas, montar tiendas de campaña ni encender fuego, y
      en las reservas solo se camina por los senderos de interpretación habilitados; en Grobštas y Nagliai
      está prohibido caminar fuera de los caminos. Si algún acceso o sector importa para tu visita, comprueba
      antes con el gestor qué está abierto.
    around: >-
      A siete kilómetros está el [Nemuno Deltos Regioninis Parkas](/lugar/nemuno-deltos-regioninis-parkas/),
      el vecino lituano más cercano. Lejos de aquí, con costa y laguna parecidas, el [Słowiński Park
      Narodowy](/lugar/slowinski-park-narodowy/) comparte la foca gris, el castor y el pigargo; [Ķemeru
      nacionālais parks](/lugar/kemeru-nacionalais-parks/), el alce, el castor y el pigargo; y [Slīteres
      nacionālais parks](/lugar/sliteres-nacionalais-parks/), la foca gris y el alce.
  en:
    intro: >-
      Imagine a ninety-eight-kilometre strip of sand that the Baltic Sea and a lagoon have contested for
      roughly five thousand years. That is the Curonian Spit, and the Curonian Spit National Park protects its
      Lithuanian half: a narrow ribbon, between four hundred metres and almost four kilometres wide, where
      dunes drift, pines hold them in place and millions of birds stream past each autumn. Baltic folklore
      tells that it was shaped by an extraordinarily strong giantess named Neringa playing along the shore.
      The scientific reality is sand swept along by currents, constantly evolving.
    landscape: >-
      The spit is a geologically youthful landscape. Between the Curonian Lagoon and the sea, sand carried by
      marine currents forms wind-driven dunes, humid hollows and beaches. The dunes average thirty-five metres
      in height, with some reaching sixty. Parnidis dune beside Nida rises to fifty-two and has historically
      drifted over the village more than once.


      That the spit survives at all owes much to human perseverance. Widespread deforestation left the sand
      uncontrolled and migrating dunes buried entire villages. In 1825 large-scale reforestation began. Today,
      forest covers seventy-two per cent of the park, with Scots pine as the dominant species, and UNESCO
      inscribed it in 2000 onto the World Heritage List: its preservation depends entirely on enduring
      stabilization and afforestation efforts.


      The park safeguards eleven natural monuments, including the dunes of Vecekrugas, Agila, Karvaičiai,
      Skirpstas and Vingis, and the capes of Lydumas and Nagliai. Alongside mobile dunes lie relict parabolic
      dunes at Juodkrantė, now stabilized, and paleosols buried deep beneath the sand. In mature woodland,
      especially near the sea, trees lean inland sculpted by prevailing winds.
    wildlife: >-
      The prime season is migration. The spit serves as a crucial segment of the White Sea–Baltic flyway,
      along which roughly fifteen million birds travel in spring and autumn, and about thirty kilometres from
      Klaipėda stands a dedicated bird ringing station. It was no coincidence that the historic Rossitten bird
      observatory was established here, honouring the spit's stature as a migratory highway. During the warm
      months around two hundred and forty species breed, and into autumn up to three hundred can be recorded.


      Near Juodkrantė, nesting in pines and spruces, is a mixed colony of [Great
      cormorant](/especie/phalacrocorax_carbo/) and [Grey heron](/especie/ardea_cinerea/): in 2020 around
      three thousand five hundred cormorants and about two hundred pairs of herons nested. Between two and
      four pairs of [White-tailed eagle](/especie/haliaeetus_albicilla/) also nest annually. Observation
      towers are stationed on Avinas hill, in the grey dunes of the Nagliai reserve, in the Pervalka dunes and
      atop Parnidis dune at Nida.


      Forests and shores shelter [moose](/especie/alces_alces/), wild boar and roe deer. Occasional grey seals
      haul out on the Baltic shore, while bats are well represented with fourteen species.
      [beavers](/especie/castor_fiber/) and [otters](/especie/lutra_lutra/) inhabit suitable waters. Along the
      coastal margin grow rare coastal plants absent elsewhere in Lithuania, such as sea holly, alongside
      Baltic endemics like Linaria loeselii.
    visit: >-
      Start with the simplest option: the fifty-three-kilometre cycle path traverses the spit, and you can
      walk along the coast from Nida to Juodkrantė, excluding the strict nature reserve sector, or from Nida
      to Pervalka along the lagoon shore. The Nagliai reserve features a dedicated walking trail, and local
      outfitters arrange canoe outings along the lagoon fringe.


      The scenic viewpoints justify every detour: Garnių kalnas, Nagliai, the dunes of Parnidis and
      Vecekrugas, Pervalka bay and the Meškos galva dune. To delve deeper into the region's heritage, the park
      nature museum and the Smiltynė marine museum and aquarium provide rich context. In Nida and Juodkrantė
      the park also protects ethnographic fishermen's homesteads and historic villas dating from the end of
      the nineteenth century and the early twentieth century.
    history: >-
      Human history on the spit has been an unceasing contest against drifting sand. Between the years 800 and
      1016 the site hosted Kaup, a major pagan trade centre that remains unexcavated. In the late nineteenth
      century the dramatic dunes of Nida drew painters from the Königsberg Academy of Arts.


      The national park was established in 1991 to safeguard Lithuania's most distinct coastal natural and
      cultural landscape, characterized by a dune ridge unique in Europe, and is designated within the Natura
      2000 network. Today vigilance extends to non-native flora: around sixteen invasive plant species have
      been identified, including Rosa rugosa and Acer negundo.
    before: >-
      To protect the fragile spit, destroying dunes, pitching tents and lighting fires are strictly forbidden,
      and within nature reserves you may only walk on designated interpretation trails; in Grobštas and
      Nagliai straying from the paths is prohibited. If any access point or sector is essential to your trip,
      confirm current access conditions in advance with park management.
    around: >-
      Seven kilometres away lies [Nemuno Deltos Regioninis Parkas](/lugar/nemuno-deltos-regioninis-parkas/),
      the closest Lithuanian counterpart. Further afield, sharing comparable coasts and lagoons, [Słowiński
      Park Narodowy](/lugar/slowinski-park-narodowy/) shares grey seals, beavers and white-tailed eagles;
      [Ķemeru nacionālais parks](/lugar/kemeru-nacionalais-parks/) shares moose, beavers and white-tailed
      eagles; and [Slīteres nacionālais parks](/lugar/sliteres-nacionalais-parks/) shares grey seals and
      moose.
  fr:
    intro: >-
      Imaginez un ruban de sable de quatre-vingt-dix-huit kilomètres que la mer Baltique et une lagune se
      disputent depuis environ cinq mille ans. Tel est l'isthme de Courlande, et le parc national de l'isthme
      de Courlande veille sur sa moitié lituanienne : une bande étroite, large de quatre cents mètres à près
      de quatre kilomètres, où les dunes se déplacent, les pins les retiennent et des millions d'oiseaux
      transitent chaque automne. Une légende balte raconte qu'elle fut façonnée par une jeune géante d'une
      force prodigieuse nommée Neringa jouant sur la plage. En réalité, ce sont les courants marins qui ont
      apporté ces sables, toujours en mouvement.
    landscape: >-
      L'isthme est un paysage d'une jeunesse géologique remarquable. Entre la lagune de Courlande et la mer,
      le sable apporté par les courants forme des dunes balayées par le vent, des dépressions humides et des
      plages. Les dunes s'élèvent en moyenne à trente-cinq mètres et certaines atteignent soixante mètres. La
      dune de Parnidis, près de Nida, culmine à cinquante-deux mètres et a jadis englouti le village plus
      d'une fois.


      La survie de l'isthme découle pour une large part d'un labeur humain acharné. Le déboisement jadis
      pratiqué laissa le sable sans entrave et les dunes mobiles ensevelirent des villages entiers. En 1825
      débuta un reboisement à grande échelle. C'est pourquoi la forêt couvre aujourd'hui soixante-douze pour
      cent du parc, avec le pin sylvestre pour essence dominante, et l'UNESCO l'a inscrit en 2000 sur la liste
      du Patrimoine mondial : sa préservation est le fruit d'efforts ininterrompus de stabilisation et de
      revégétalisation.


      Le parc protège onze monuments naturels, parmi lesquels les dunes de Vecekrugas, Agila, Karvaičiai,
      Skirpstas et Vingis, ainsi que les caps de Lydumas et Nagliai. Aux côtés des dunes vives subsistent
      d'anciennes dunes paraboliques fixées à Juodkrantė et des paléosols enfouis sous le sable. Dans la
      vieille forêt, surtout près de la mer, les arbres poussent inclinés sous la force constante du vent.
    wildlife: >-
      La saison reine est celle du passage migratoire. L'isthme forme un tronçon majeur de la voie migratoire
      mer Blanche-Baltique par lequel transitent, au printemps et à l'automne, quelque quinze millions
      d'oiseaux, et à environ trente kilomètres de Klaipėda se trouve une station de baguage réputée. Ce n'est
      pas un hasard si l'observatoire ornithologique de Rossitten fut fondé ici, confirmant l'importance de
      l'isthme comme couloir migratoire. Pendant la belle saison s'y reproduisent environ deux cent quarante
      espèces et, vers l'automne, on peut en dénombrer jusqu'à trois cents.


      Près de Juodkrantė, dans les pins et les épicéas, se niche une colonie mixte de [Grand
      cormoran](/especie/phalacrocorax_carbo/) et de [Héron cendré](/especie/ardea_cinerea/) : en 2020 s'y
      sont reproduits environ trois mille cinq cents cormorans et quelque deux cents couples de hérons. Chaque
      année y nichent en outre entre deux et quatre couples de [Pygargue à queue
      blanche](/especie/haliaeetus_albicilla/). Des postes d'observation sont établis sur la colline d'Avinas,
      sur les dunes grises de la réserve de Nagliai, dans les dunes de Pervalka et au sommet de la dune de
      Parnidis à Nida.


      Dans la forêt et sur les berges vivent [élans](/especie/alces_alces/), sangliers et chevreuils. De temps
      à autre un phoque gris fait son apparition sur la côte, tandis que les chauves-souris comptent quatorze
      espèces recensées. On trouve aussi des [castors](/especie/castor_fiber/) et des
      [loutres](/especie/lutra_lutra/). Sur le littoral poussent des plantes absentes du reste de la Lituanie,
      comme le panicaut maritime, et des endémiques baltiques telles que Linaria loeselii.
    visit: >-
      Commencez par la voie la plus aisée : la piste cyclable de cinquante-trois kilomètres parcourt
      l'ensemble de l'isthme, et vous pouvez marcher sur la côte de Nida à Juodkrantė, hormis le secteur de la
      réserve naturelle intégrale, ou de Nida à Pervalka le long de la lagune. La réserve de Nagliai propose
      un sentier pédestre aménagé, et les prestataires locaux permettent de la longer en canoë sur la lagune.


      Les belvédères justifient le détour : Garnių kalnas, Nagliai, les dunes de Parnidis et de Vecekrugas, la
      baie de Pervalka et la dune de Meškos galva. Pour saisir l'essence des lieux, le musée de la nature du
      parc et le musée-aquarium maritime de Smiltynė offrent un aperçu approfondi. À Nida et Juodkrantė, le
      parc préserve en outre d'anciennes fermes ethnographiques de pêcheurs et des villas balnéaires de la fin
      du XIXe siècle et du début du XXe siècle.
    history: >-
      L'histoire humaine de l'isthme se résume à une lutte séculaire contre le sable. Entre les années 800 et
      1016 s'élevait là Kaup, un grand comptoir commercial païen encore non fouillé. À la fin du XIXe siècle,
      les dunes spectaculaires de Nida séduisirent les peintres de l'académie des beaux-arts de Königsberg.


      Le parc a été fondé en 1991 pour protéger le paysage côtier lituanien le plus précieux par sa nature et
      sa culture, doté d'un cordon dunaire sans équivalent en Europe, et s'intègre au réseau Natura 2000.
      Aujourd'hui s'exerce aussi une surveillance attentive des espèces introduites : environ seize plantes
      envahissantes ont été identifiées, dont Rosa rugosa et Acer negundo.
    before: >-
      Afin de protéger l'isthme, il est formellement interdit de dégrader les dunes, de camper ou d'allumer du
      feu ; dans les réserves naturelles, vous devez impérativement vous limiter aux sentiers d'interprétation
      balisés. À Grobštas et Nagliai, tout déplacement hors sentier est proscrit. Si un point d'accès ou un
      secteur précis importe pour votre venue, renseignez-vous auprès du gestionnaire avant votre départ.
    around: >-
      À sept kilomètres se trouve le [Nemuno Deltos Regioninis
      Parkas](/lugar/nemuno-deltos-regioninis-parkas/), son plus proche voisin lituanien. Plus loin, pourvus
      d'un littoral et d'une lagune comparables, le [Słowiński Park Narodowy](/lugar/slowinski-park-narodowy/)
      abrite également le phoque gris, le castor et le pygargue ; le [Ķemeru nacionālais
      parks](/lugar/kemeru-nacionalais-parks/) l'élan, le castor et le pygargue ; et le [Slīteres nacionālais
      parks](/lugar/sliteres-nacionalais-parks/) le phoque gris et l'élan.
  de:
    intro: >-
      Stell dir einen achtundneunzig Kilometer langen Sandstreifen vor, um den die Ostsee und ein Haff seit
      rund fünftausend Jahren streiten. Das ist die Kurische Nehrung, und der Nationalpark Kurische Nehrung
      schützt deren litauische Hälfte: ein schmales Band von vierhundert Metern bis fast vier Kilometern
      Breite, auf dem Dünen wandern, Kiefern sie festhalten und jeden Herbst Millionen Vögel durchziehen. Der
      baltischen Sage nach formte das bärenstarke Mädchen Neringa die Nehrung beim Spiel am Strand. In
      Wirklichkeit wurde der Sand von Meeresströmungen herbeigetragen und wandelt sich bis heute.
    landscape: >-
      Die Nehrung ist eine geologisch junge Landschaft. Zwischen dem Kurischen Haff und dem offenen Meer formt
      der von Strömungen angelandete Sand windgetriebene Wanderdünen, feuchte Mulden und Strände. Die Dünen
      sind im Schnitt fünfunddreißig Meter hoch, einige erreichen sechzig Meter. Die Parnidis-Düne bei Nida
      ragt zweiundfünfzig Meter empor und ist im Laufe der Geschichte mehrfach über die Siedlung gewandert.


      Dass die Nehrung bis heute fortbesteht, ist menschlicher Beharrlichkeit zu verdanken. Frühere
      Kahlschläge ließen den Sand ungehindert wehen, und wandernde Dünen begruben ganze Dörfer. Im Jahr 1825
      begann eine großflächige Aufforstung. Heute bedeckt der Wald zweiundsiebzig Prozent der Parkfläche mit
      der Waldkiefer als Leitart, und die UNESCO nahm das Gebiet im Jahr 2000 in das Welterbe auf: Das
      Überleben dieses Landstrichs verdankt sich ununterbrochenen Befestigungs- und
      Wiederaufforstungsbemühungen.


      Der Park schützt elf Naturdenkmale, darunter die Dünen Vecekrugas, Agila, Karvaičiai, Skirpstas und
      Vingis sowie die Kaps Lydumas und Nagliai. Neben den aktiven Weißdünen finden sich stabilisierte alte
      Parabeldünen bei Juodkrantė und tief unter Sand vergrabene fossile Böden. Im Altwald, besonders in
      Meeresnähe, wachsen die Bäume vom Wind dauerhaft geneigt.
    wildlife: >-
      Die beste Jahreszeit ist die Zugperiode. Über die Nehrung verläuft ein Hauptast des
      Weißmeer-Ostsee-Zugwegs, auf dem im Frühjahr und Herbst rund fünfzehn Millionen Vögel wandern; etwa
      dreißig Kilometer von Klaipėda entfernt befindet sich eine traditionsreiche Beringungsstation. Nicht
      ohne Grund entstand hier einst die berühmte Vogelwarte Rossitten, die die Bedeutung der Nehrung als
      Zugkorridor dokumentierte. In den Sommermonaten brüten rund zweihundertvierzig Vogelarten, und zum
      Herbst hin können bis zu dreihundert nachgewiesen werden.


      Bei Juodkrantė existiert in Kiefern und Fichten eine gemischte Kolonie von
      [Kormoran](/especie/phalacrocorax_carbo/) und [Graureiher](/especie/ardea_cinerea/): Im Jahr 2020
      brüteten dort rund dreitausendfünfhundert Kormorane und etwa zweihundert Reiherpaare. Jedes Jahr nisten
      zudem zwischen zwei und vier Paare des [Seeadler](/especie/haliaeetus_albicilla/)s. Aussichtspunkte gibt
      es auf dem Avinas-Hügel, in den Graudünen des Nagliai-Reservats, auf den Dünen von Pervalka und auf der
      Parnidis-Düne in Nida.


      In den Wäldern und an den Haffufern leben [Elche](/especie/alces_alces/), Wildschweine und Rehe.
      Gelegentlich rasten Kegelrobben an der Küste, während die Fledermäuse mit vierzehn Arten vertreten sind.
      Auch [Biber](/especie/castor_fiber/) und [Fischotter](/especie/lutra_lutra/) bewohnen passende Gewässer.
      Am Ufersaum wachsen Pflanzen, die im restlichen Litauen fehlen, etwa die Stranddistel, sowie
      Ostsee-Endemiten wie Linaria loeselii.
    visit: >-
      Beginne am besten unkompliziert: Der dreiundfünfzig Kilometer lange Radweg erschließt die gesamte
      Nehrung, und du kannst an der Küste von Nida nach Juodkrantė wandern – ausgenommen der Kernbereich des
      Naturschutzgebiets – oder von Nida nach Pervalka entlang des Haffufers. Das Nagliai-Reservat verfügt
      über einen Bohlenweg, und lokale Anbieter ermöglichen Kanutouren entlang des Haffs.


      Die Aussichtspunkte lohnen den Abstecher: Garnių kalnas, Nagliai, die Dünen Parnidis und Vecekrugas, die
      Bucht von Pervalka und die Düne Meškos galva. Für ein tieferes Verständnis vermitteln das Naturmuseum
      des Parks und das Meeresmuseum mit Aquarium in Smiltynė wertvolle Einblicke. In Nida und Juodkrantė
      bewahrt der Park zudem historische Fischergehöfte und Sommervillen aus dem späten neunzehnten
      Jahrhundert und dem frühen zwanzigsten Jahrhundert.
    history: >-
      Die menschliche Besiedlung der Nehrung war stets ein Ringen mit den wandernden Sandmassen. Zwischen den
      Jahren 800 und 1016 florierte hier Kaup, ein bedeutender heidnischer Handelsplatz, der noch nicht
      ergraben ist. Gegen Ende des neunzehnten Jahrhunderts zog die archaische Dünenlandschaft von Nida Maler
      der Königsberger Kunstakademie an.


      Der Nationalpark wurde 1991 gegründet, um Litauens wertvollste Küstenlandschaft in Natur und Kultur mit
      einem europaweit einzigartigen Dünenzug zu bewahren, und ist Teil des Netzes Natura 2000. Heute gilt die
      Aufmerksamkeit auch gebietsfremden Pflanzen: Rund sechzehn invasive Pflanzenarten wurden registriert,
      darunter Rosa rugosa und Acer negundo.
    before: >-
      Zum Schutz der Nehrung ist das Zerstören von Dünen, Zelten und Entfachen von Feuer untersagt; in den
      Naturschutzgebieten darfst du ausschließlich auf den angelegten Lehrpfaden gehen. In Grobštas und
      Nagliai ist das Verlassen der Wege ausnahmslos verboten. Informiere dich vorab bei der Parkverwaltung
      über geöffnete Abschnitte, falls bestimmte Ziele für deinen Besuch entscheidend sind.
    around: >-
      Sieben Kilometer entfernt liegt der [Nemuno Deltos Regioninis
      Parkas](/lugar/nemuno-deltos-regioninis-parkas/), der engste litauische Nachbar. Weiter entfernt, mit
      ähnlicher Küsten- und Hafflandschaft, teilen Kegelrobbe, Biber und Seeadler den Lebensraum im [Słowiński
      Park Narodowy](/lugar/slowinski-park-narodowy/); der [Ķemeru nacionālais
      parks](/lugar/kemeru-nacionalais-parks/) teilt Elch, Biber und Seeadler; und der [Slīteres nacionālais
      parks](/lugar/sliteres-nacionalais-parks/) beherbergt Kegelrobbe und Elch.
  it:
    intro: >-
      Immagina una lingua di sabbia di novantotto chilometri che il mar Baltico e una laguna si contendono da
      circa cinquemila anni. Questo è l'istmo di Curlandia, e il Parco nazionale dell'istmo di Curlandia
      tutela la sua metà lituana: una sottile striscia, compresa tra quattrocento metri e quasi quattro
      chilometri di larghezza, dove le dune avanzano, i pini le ancorano e ogni autunno transitano milioni di
      uccelli. La leggenda baltica narra che fu modellata da una fanciulla fortissima di nome Neringa giocando
      sulla battigia. In verità si tratta di sabbia convogliata dalle correnti, in perenne trasformazione.
    landscape: >-
      L'istmo costituisce un paesaggio geologicamente giovanissimo. Tra la laguna di Curlandia e il mare, la
      sabbia trasportata dalle correnti marine origina dune sospinte dal vento, avvallamenti umidi e lidi
      sabbiosi. Le dune toccano in media trentacinque metri di quota e alcune raggiungono sessanta metri.
      Quella di Parnidis, presso Nida, si eleva fino a cinquantadue metri e ha sepolto più volte il borgo nel
      corso della storia.


      Il fatto che l'istmo resista fino a oggi è dovuto a una tenace opera umana. I disboscamenti del passato
      lasciarono i venti liberi di muovere la sabbia, e le dune migranti seppellirono interi villaggi. Nel
      1825 ebbe inizio un rimboschimento su vastissima scala. Per questa ragione il bosco ricopre oggi il
      settantadue per cento del parco, con il pino silvestre quale specie predominante, e l'UNESCO lo ha
      inserito nel 2000 nel Patrimonio Mondiale: la sua sopravvivenza dipende da costanti interventi di
      consolidamento e riforestazione.


      Il parco protegge undici monumenti naturali, tra cui le dune di Vecekrugas, Agila, Karvaičiai, Skirpstas
      e Vingis, insieme ai promontori di Lydumas e Nagliai. Accanto alle dune vive sopravvivono antiche dune
      paraboliche stabilizzate a Juodkrantė e paleosuoli sepolti in profondità sotto la coltre sabbiosa. Nel
      bosco maturo, in particolare in prossimità del mare, gli alberi crescono vistosamente inclinati dal
      vento.
    wildlife: >-
      Il periodo più straordinario coincide con i passaggi migratori. Sull'istmo transita un asse primario
      della rotta migratoria Mar Bianco-Baltico su cui transitano, in primavera e autunno, circa quindici
      milioni di uccelli; a una trentina di chilometri da Klaipėda opera una celebre stazione di
      inanellamento. Non fu casuale la nascita dello storico osservatorio ornitologico di Rossitten proprio in
      questo punto, a testimonianza del ruolo dell'istmo quale corridoio naturale. Nella bella stagione vi
      nidificano circa duecentoquaranta specie e, verso l'autunno, se ne possono contare fino a trecento.


      Nei pressi di Juodkrantė, tra pini e abeti rossi, si trova una colonia mista di [cormorano
      comune](/especie/phalacrocorax_carbo/) e [Airone cenerino](/especie/ardea_cinerea/): nel 2020 vi hanno
      nidificato circa tremilacinquecento cormorani e circa duecento coppie di aironi. Ogni anno nidificano
      inoltre tra due e quattro coppie di [Aquila di mare](/especie/haliaeetus_albicilla/). Punti di
      osservazione sono situati sulla collina di Avinas, sulle dune grigie della riserva di Nagliai, sulle
      dune di Pervalka e in vetta alla duna di Parnidis a Nida.


      Nei boschi e lungo le rive vivono [alci](/especie/alces_alces/), cinghiali e caprioli. Di tanto in tanto
      la foca grigia fa la sua comparsa sulla spiaggia, mentre tra i mammiferi spiccano quattordici specie di
      pipistrelli. Vi dimorano anche [castori](/especie/castor_fiber/) e [lontre](/especie/lutra_lutra/).
      Sulla costa vegetano specie assenti nel resto della Lituania, come la calcatreppola marittima, assieme a
      endemismi baltici quali Linaria loeselii.
    visit: >-
      Inizia dall'itinerario più agevole: la pista ciclabile di cinquantatré chilometri attraversa per intero
      l'istmo, e puoi camminare lungo la costa da Nida a Juodkrantė, escludendo il settore di riserva naturale
      integrale, oppure da Nida a Pervalka lungo la sponda lagunare. La riserva di Nagliai offre un sentiero
      pedonale attrezzato, e operatori locali propongono escursioni in canoa sul pelo dell'acqua della laguna.


      I punti panoramici meritano assolutamente la sosta: Garnių kalnas, Nagliai, le dune di Parnidis e
      Vecekrugas, la baia di Pervalka e la duna Meškos galva. Per una comprensione approfondita, il museo
      della natura del parco e il museo marino con acquario di Smiltynė offrono ricchi allestimenti. A Nida e
      Juodkrantė il parco tutela inoltre tipiche fattorie etnografiche di pescatori e ville storiche risalenti
      alla fine del XIX secolo e agli inizi del XX secolo.
    history: >-
      La storia umana dell'istmo è un'incessante contesa contro la sabbia. Tra gli anni 800 e 1016 vi sorgeva
      Kaup, un grande emporio commerciale pagano tuttora non scavato. Sul finire del XIX secolo le
      spettacolari dune di Nida attirarono i pittori dell'Accademia d'arte di Königsberg.


      Il parco fu istituito nel 1991 per salvaguardare il paesaggio costiero lituano più pregevole dal punto
      di vista naturale e culturale, caratterizzato da un cordone dunale senza eguali in Europa, ed è compreso
      nella rete Natura 2000. Oggi si tiene sotto controllo anche la flora aliena: sono state censite circa
      sedici specie vegetali invasive, tra cui Rosa rugosa e Acer negundo.
    before: >-
      A tutela dell'istmo è rigorosamente vietato danneggiare le dune, campeggiare e accendere fuochi; nelle
      riserve integrali puoi camminare esclusivamente lungo i sentieri didattici attrezzati. A Grobštas e
      Nagliai è assolutamente proibito allontanarsi dai percorsi segnati. Se qualche accesso o settore
      specifico è importante per la tua visita, informati prima con l'ente gestore sulle aperture effettive.
    around: >-
      A sette chilometri sorge il [Nemuno Deltos Regioninis Parkas](/lugar/nemuno-deltos-regioninis-parkas/),
      il più vicino vicino lituano. Più lontano, contraddistinto da litorale e laguna analoghi, lo [Słowiński
      Park Narodowy](/lugar/slowinski-park-narodowy/) condivide foca grigia, castoro e aquila di mare; il
      [Ķemeru nacionālais parks](/lugar/kemeru-nacionalais-parks/) condivide alce, castoro e aquila di mare; e
      lo [Slīteres nacionālais parks](/lugar/sliteres-nacionalais-parks/) ospita foca grigia e alce.
  pt:
    intro: >-
      Imagina uma faixa de areia de noventa e oito quilómetros que o mar Báltico e uma lagoa disputam há cerca
      de cinco mil anos. Isso é o istmo da Curlândia, e o Parque Nacional do Istmo da Curlândia resguarda a
      sua metade lituana: uma orla estreita, entre quatrocentos metros e quase quatro quilómetros de largura,
      onde as dunas se movem, os pinheiros as fixam e cada outono passam milhões de aves. A lenda báltica diz
      que foi moldada por uma donzela de força invulgar chamada Neringa enquanto brincava na praia. A
      realidade física assenta em areia transportada pelas correntes marinhas, em permanente mutação.
    landscape: >-
      O istmo é uma paisagem de juventude geológica. Entre a lagoa da Curlândia e o mar, a areia transportada
      pelas correntes marítimas forma dunas impelidas pelo vento, depressões húmidas e praias. As dunas medem
      em média trinta e cinco metros de altura e algumas alcançam sessenta metros. A de Parnidis, junto a
      Nida, ergue-se até aos cinquenta e dois metros e soterrou mais de uma vez a povoação ao longo da
      história.


      O facto de o istmo permanecer de pé deve-se grandemente à persistência humana. A desflorestação
      pretérita deixou as areias desimpedidas e as dunas móveis chegaram a sepultar aldeias inteiras. Em 1825
      teve início uma reflorestação em vasta escala. Por essa razão a floresta cobre hoje setenta e dois por
      cento do parque, com o pinheiro-silvestre como árvore dominante, e a UNESCO integrou-o em 2000 na lista
      do Património Mundial: a sua conservação assenta em esforços contínuos de estabilização e arborização.


      O parque protege onze monumentos naturais, entre eles as dunas de Vecekrugas, Agila, Karvaičiai,
      Skirpstas e Vingis, bem como os cabos de Lydumas e Nagliai. A par das dunas vivas subsistem antigas
      dunas parabólicas fixadas em Juodkrantė e paleossolos soterrados a grande profundidade sob a areia. Na
      floresta madura, sobretudo na proximidade do mar, as árvores crescem inclinadas pela ação do vento.
    wildlife: >-
      A época mais exuberante coincide com a passagem migratória. Pelo istmo cruza um dos ramos basilares da
      rota Mar Branco-Báltico pela qual transitam, na primavera e no outono, cerca de quinze milhões de aves;
      a cerca de trinta quilómetros de Klaipėda funciona uma conceituada estação de anilhagem. Não foi por
      acaso que aqui se fundou a célebre estação ornitológica de Rossitten, atestando o papel do istmo como
      corredor migratório. Na época estival nidificam cerca de duzentas e quarenta espécies e, com a chegada
      do outono, podem registar-se até trezentas.


      Junto a Juodkrantė, instalada em pinheiros e espruces, situa-se uma colónia mista de
      [Corvo-marinho-de-faces-brancas](/especie/phalacrocorax_carbo/) e
      [Garça-real-europeia](/especie/ardea_cinerea/): em 2020 nidificaram cerca de três mil e quinhentos
      corvos-marinhos e cerca de duzentos casais de garças. Todos os anos nidificam ainda entre dois e quatro
      casais de [Águia-rabalva](/especie/haliaeetus_albicilla/). Existem postos de observação na colina de
      Avinas, nas dunas cinzentas da reserva de Nagliai, nas dunas de Pervalka e no cimo da duna de Parnidis
      em Nida.


      Na floresta e nas margens habitam [alces](/especie/alces_alces/), javalis e corços. De tempos a tempos
      surge uma foca-cinzenta na costa, ao passo que entre os mamíferos sobressaem catorze espécies de
      morcegos. Ocorrem também [castores](/especie/castor_fiber/) e [lontras](/especie/lutra_lutra/). Na costa
      vegetam plantas ausentes no restante território lituano, como o cardo-marítimo, além de endemismos
      bálticos como Linaria loeselii.
    visit: >-
      Começa pelo caminho mais acessível: a ciclovia de cinquenta e três quilómetros percorre todo o istmo, e
      podes caminhar ao longo da costa de Nida a Juodkrantė, excetuando o setor da reserva natural integral,
      ou de Nida a Pervalka pela margem da lagoa. A reserva de Nagliai dispõe de um trilho pedestre
      estruturado, e empresas locais proporcionam a descoberta da orla lagunar em canoa.


      Os miradouros justificam plenamente a paragem: Garnių kalnas, Nagliai, as dunas de Parnidis e
      Vecekrugas, a baía de Pervalka e a duna Meškos galva. Para uma compreensão mais rica, o museu da
      natureza do parque e o museu-aquário marítimo de Smiltynė oferecem um olhar aprofundado. Em Nida e
      Juodkrantė o parque preserva ainda quintas etnográficas tradicionais de pescadores e palacetes de
      veraneio do final do século XIX e do início do século XX.
    history: >-
      A história humana do istmo traduz-se numa contenda sem tréguas contra a areia. Entre os anos 800 e 1016
      ergueu-se aqui Kaup, um grande entreposto comercial pagão que permanece por escavar. No final do século
      XIX as imponentes dunas de Nida atraíram pintores da Academia de Belas-Artes de Königsberg.


      O parque foi criado em 1991 para resguardar a paisagem litoral lituana mais valiosa em termos naturais e
      culturais, dotada de um cordão dunar ímpar na Europa, e integra a rede Natura 2000. Hoje vigia-se
      igualmente a vegetação exótica: foram identificadas cerca de dezasseis espécies de plantas invasoras,
      incluindo Rosa rugosa e Acer negundo.
    before: >-
      Para salvaguardar o istmo não é permitido danificar as dunas, acampar nem fazer lume; nas reservas
      naturais só podes caminhar pelos trilhos de interpretação assinalados. Em Grobštas e Nagliai é
      absolutamente proibido sair dos caminhos. Se algum acesso ou setor for determinante para a tua visita,
      confirma previamente junto da administração quais os troços abertos.
    around: >-
      A sete quilómetros fica o [Nemuno Deltos Regioninis Parkas](/lugar/nemuno-deltos-regioninis-parkas/), o
      vizinho lituano mais próximo. Longe daqui, com litoral e lagoa análogos, o [Słowiński Park
      Narodowy](/lugar/slowinski-park-narodowy/) partilha a foca-cinzenta, o castor e a águia-rabalva; o
      [Ķemeru nacionālais parks](/lugar/kemeru-nacionalais-parks/) partilha o alce, o castor e a
      águia-rabalva; e o [Slīteres nacionālais parks](/lugar/sliteres-nacionalais-parks/) acolhe a
      foca-cinzenta e o alce.
