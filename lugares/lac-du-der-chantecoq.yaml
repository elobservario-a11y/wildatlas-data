  en: A man-made lake created in 1974 where between 200,000 and 350,000 migrating cranes touch down each year.
  fr: Un lac créé par l’homme en 1974 où transitent chaque année entre 200 000 et 350 000 grues cendrées.
  de: >-
    Ein 1974 geschaffener Stausee, an dem jedes Jahr zwischen 200 000 und 350 000 durchziehende Kraniche
    rasten.
  it: Un lago artificiale creato nel 1974 dove transitano ogni anno tra le 200 000 e le 350 000 gru cenerine.
  pt: Um lago criado pela mão humana em 1974 onde escalam anualmente entre 200 000 e 350 000 grous-comuns.
observaciones:
  es: >-
    Para ver las grullas hay que usar los observatorios abiertos al público y los diques; si se ven en un
    campo junto a la carretera, no se debe salir del vehículo. El mejor puesto de observación es el coche, al
    que las grullas han aprendido a no temer. Hay que quedarse en la vía pública y no bajar a los fangos del
    lago, porque los caminos agrícolas son privados. La cuenca del lago donde duermen las grullas permanece
    cerrada al acceso durante la migración y en invierno. En los observatorios y diques hay que evitar los
    gritos, las exclamaciones y las fotos con flash.
texto:
  es:
    intro: >-
      Antes de que amanezca, el cielo del Der empieza a sonar. Las grullas que han pasado la noche en medio
      del lago lanzan su «Krou Krou», el clamor crece y, cuando sale el sol, despegan por centenares o por
      millares, rozando el agua y subiendo para pasar sobre el dique y los muchos espectadores. Es la escena
      que atrae al Lac du Der desde mediados de octubre hasta mediados de marzo. Entre 200 000 y 350 000
      [grullas comunes](/especie/grus_grus/) pasan cada año por este lago-embalse de la Champaña, y entre 20
      000 y 30 000 se quedan en invierno.
    landscape: >-
      El Lac du Der nació en 1974, tras diez años de obras gigantescas, y se construyó como embalse para
      regular el nivel del Marne, amortiguar las crecidas y alimentar los ríos en estiaje. Las obras empezaron
      en 1967, y el proyecto fue muy contestado por los habitantes del Der. Debajo del agua desaparecieron
      tres pueblos, Chantecoq, Nuisement-aux-Bois y Champaubert-aux-Bois, de los que solo queda la iglesia, en
      su península.


      El lago está sobre una antigua llanura pantanosa cubierta por un gran bosque de robles; de ahí el nombre
      Der, del celta dervos, «roble». Su ritmo es el del agua: se llena entre el 1 de noviembre y el 30 de
      junio y se vacía normalmente entre el 1 de julio y el 31 de octubre. Por eso en primavera, cuando el Der
      se llena del todo, sus colores se vuelven azulados y turquesa, y al final del otoño, cuando se vacía, la
      naturaleza ocupa los rincones que cubrían las aguas. En otoño e invierno el lago está casi vacío y deja
      grandes fangales que gustan mucho a las grullas.
    wildlife: >-
      **Otoño.** A principios de octubre la migración es más intensa y visible, sobre todo por los grandes
      vuelos de grullas. El Der está en el eje nordeste-suroeste que une el norte de Europa con España y
      África del Norte, un corredor ideal de migración. El 11 de noviembre de 2014 se contaron 206 582 grullas
      saliendo de los dormideros, récord del Der y de Europa. En la migración hacen escala en la reserva entre
      50000 y 450000 aves acuáticas.


      **Otoño e invierno, al amanecer.** Tras el descanso nocturno en el lago, las grullas van a comer a los
      campos vecinos, a decenas de kilómetros, o siguen su migración. Grandes viajeras como la golondrina
      común y el cisne cantor llegan al lago y a los estanques.


      **Primavera y verano.** De mediados de febrero a mediados de marzo, durante la época de «agrainage», se
      esparcen granos ecológicos en un campo junto a una vieja granja convertida en observatorio en 1990,
      cerca de Saint-Rémy-en-Bouzemont, y las grullas se ven comer desde una distancia respetable. En
      primavera es la época de cría de somormujos, fochas, garzas y patos; en julio y agosto las aves se
      concentran en las zonas de tranquilidad, su principal refugio. En total se han registrado 300 especies
      de aves.
    visit: >-
      Para ver las grullas, el mejor punto es el dique, al borde del lago, al amanecer. La Ferme aux Grues, en
      Saint-Rémy-en-Bouzemont, es una antigua explotación agrícola, principal zona de alimentación de las
      grullas, y tiene un observatorio para los visitantes. El lago tiene 5 observatorios y 16 puntos de
      observación.


      Los voluntarios de la LPO cuentan las grullas desde el dique todos los domingos por la mañana, de
      mediados de octubre a principios de marzo, y hay salidas, animaciones y cursos con guías y miembros de
      la Ligue de Protection des Oiseaux.


      Para caminar, el circuito de los estanques de Outines recorre casi ocho kilómetros por una zona
      tranquila para la fauna y tiene sendero señalizado; pertenece al Conservatoire du Littoral y tiene
      observatorios a lo largo del camino. Otra ruta de casi 10 km, a pie o en bici de montaña, discurre casi
      toda por el bosque estatal del Der, con vistas al lago, y una de 9 km pasa por el pueblo de
      Giffaumont-Champaubert. En bici, la vuelta al lago tiene 36 kilómetros y se puede completar en medio
      día; cruza el robledal del este del lago y, al oeste, el sitio de Chantecoq, muy frecuentado por
      ornitólogos.


      El Village Musée du Der cuenta quiénes vivían en los pueblos desaparecidos y la historia de su
      patrimonio.
    history: >-
      La zona está clasificada Natura 2000, Ramsar y ZICO, y el lago y sus estanques laterales forman parte de
      una zona Ramsar de 235 000 hectáreas y de un área importante para las aves de 56 000 hectáreas.
    before: >-
      Para ver las grullas hay que usar los observatorios abiertos al público y los diques; si se ven en un
      campo junto a la carretera, no se debe salir del vehículo. El mejor puesto de observación es el coche,
      al que las grullas han aprendido a no temer. Hay que quedarse en la vía pública y no bajar a los fangos
      del lago, porque los caminos agrícolas son privados. La cuenca del lago donde duermen las grullas
      permanece cerrada al acceso durante la migración y en invierno. En los observatorios y diques hay que
      evitar los gritos, las exclamaciones y las fotos con flash.
    around: >-
      A 30 km queda el [Bosque de Orient](/lugar/foret-d-orient---secteurs-forestiers/). Lejos de aquí, tres
      lugares comparten con el Der la grulla común y el pigargo europeo: el [Paisaje Forestal de
      Schorfheide-Chorin](/lugar/schorfheide-chorin-forest-landscape/), el [Parque Nacional de
      Słowiński](/lugar/slowinski-park-narodowy/) y el [Parque Nacional de
      Ķemeri](/lugar/kemeru-nacionalais-parks/), todos con lagos y humedales.
  en:
    intro: >-
      Before dawn breaks, the sky above the Der begins to resonate. The cranes that spent the night out on the
      open water let out their distinctive trumpeting «Krou Krou», the chorus builds, and as the first sunbeam
      strikes, they lift off by hundreds and thousands, skimming the water before banking over the dyke and
      the gathered onlookers. This is the captivating dawn drama that draws birdwatchers to Lac du Der from
      mid-October to mid-March. Between 200,000 and 350,000 [common cranes](/especie/grus_grus/) transit
      through this Champagne reservoir every year, and between 20,000 and 30,000 remain to spend the winter.
    landscape: >-
      Lac du Der was created in 1974 following a decade of colossal earthworks, engineered as a flood-control
      reservoir to regulate the Marne, temper seasonal Paris floods, and sustain river levels during summer
      drought. Excavation began in 1967 amidst passionate local resistance. Beneath the impounded waters lay
      three submerged villages—Chantecoq, Nuisement-aux-Bois, and Champaubert-aux-Bois—of which only
      Champaubert’s church survives, perched on a scenic peninsula.


      The lake occupies an ancient marshy plain formerly blanketed in dense oak forest; hence the name Der,
      rooted in the Celtic dervos, meaning «oak». Its rhythm follows the water: filling steadily between 1
      November and 30 June, then draining down between 1 July and 31 October. In spring when the reservoir
      reaches full capacity, its surface turns deep azure and turquoise; by late autumn, receding waters
      uncover vast muddy flats eagerly claimed by foraging wildlife. Through autumn and winter, the drawn-down
      basin reveals endless mudflats beloved by roosting cranes.
    wildlife: >-
      **Autumn.** In early October migration intensifies markedly, headlined by vast v-formations of
      trumpeting cranes. The Der lies directly along the northeast–southwest flyway connecting northern Europe
      with Spain and North Africa. On 11 November 2014, counters tallied a staggering 206,582 cranes lifting
      from communal roosts, an all-time record for the Der and across Europe. During peak passage between
      50,000 and 450,000 waterbirds touch down across the reserve.


      **Autumn and winter dawns.** Following their overnight rest in the shallows, cranes disperse across
      surrounding stubble fields tens of kilometres away to feed, or resume their long journey south. Seasoned
      migrants like barn swallows and whooper swans also congregate across the lake and adjacent ponds.


      **Spring and summer.** From mid-February to mid-March during supplemental feeding operations
      («agrainage»), organic grains are broadcast in fields beside a former farm converted into an observation
      post in 1990 near Saint-Rémy-en-Bouzemont, allowing visitors to watch cranes feed at a respectful
      distance. Spring brings nesting grebes, coots, herons, and diving ducks; in July and August waterbirds
      seek refuge in quiet sanctuary bays. In total, over 300 bird species have been recorded.
    visit: >-
      To watch the crane lift-off, the prime location is the crest of the main dyke at daybreak. The Ferme aux
      Grues in Saint-Rémy-en-Bouzemont, an old agricultural estate serving as the primary crane feeding
      station, houses an interpretive hide for visitors. The lake offers 5 observation hides and 16 designated
      vantage points.


      LPO volunteers conduct official Sunday morning crane counts from the dyke from mid-October to early
      March, complemented by guided outings, workshops, and nature walks led by the Ligue pour la Protection
      des Oiseaux.


      For walkers, the Outines ponds loop covers nearly eight kilometres through tranquil wildlife sectors on
      a clearly marked trail managed by the Conservatoire du Littoral, dotted with bird hides. Another trail
      of almost 10 km, suitable on foot or mountain bike, winds through the Der national forest with open lake
      vistas, while a 9 km path circles Giffaumont-Champaubert. By bicycle, the 36 km tour of the lake can be
      cycled in half a day, exploring eastern oak woodlands and western wetlands at Chantecoq.


      The Village Musée du Der chronicles the lost villages and the heritage of this submerged Champagne
      landscape.
    history: >-
      The site is designated Natura 2000, Ramsar, and ZICO; the lake and surrounding ponds form part of a
      Ramsar wetland covering 235,000 hectares and an Important Bird Area spanning 56,000 hectares.
    before: >-
      To observe cranes respectfully, remain within official hides and public dykes; if birds are feeding in
      roadside fields, stay inside your vehicle, as cranes tolerate cars far better than people on foot. Stick
      to public rights of way and never venture onto the exposed lakebed muds, as surrounding farm tracks are
      private. The inner lake basin where cranes roost remains strictly closed to public access during
      migration and winter. Avoid loud shouts, sudden gestures, or flash photography near roost sites.
    around: >-
      At 30 km lies the [Orient Forest](/lugar/foret-d-orient---secteurs-forestiers/). Further afield, three
      destinations share the common crane and white-tailed eagle with Lac du Der: [Schorfheide-Chorin Forest
      Landscape](/lugar/schorfheide-chorin-forest-landscape/), [Słowiński National
      Park](/lugar/slowinski-park-narodowy/), and [Ķemeri National Park](/lugar/kemeru-nacionalais-parks/),
      each combining lakes and wetland forests.
  fr:
    intro: >-
      Avant que l’aube ne paraisse, le ciel du Der commence à résonner. Les grues ayant passé la nuit au
      milieu des flots lancent leur « Krou Krou » caractéristique, la clameur s’enfle et, aux premiers rayons
      du soleil, elles s’élèvent par centaines et par milliers, rasant l’eau avant de franchir la digue
      au-dessus des nombreux spectateurs émerveillés. C’est le spectacle envoûtant qui attire les passionnés
      au lac du Der de la mi-octobre à la mi-mars. Entre 200 000 et 350 000 [grues
      cendrées](/especie/grus_grus/) font escale chaque année sur ce lac-réservoir de Champagne, et de 20 000
      à 30 000 y passent tout l’hiver.
    landscape: >-
      Le lac du Der est né en 1974 au terme de dix années de chantiers titanesques, conçu comme réservoir
      régulateur pour écrêter les crues de la Marne, protéger Paris des inondations et soutenir les débits
      estivaux. Les terrassements ont débuté en 1967, soulevant une vive contestation locale. Sous les eaux
      ont disparu trois villages entiers — Chantecoq, Nuisement-aux-Bois et Champaubert-aux-Bois —, dont ne
      subsiste que l’église de Champaubert sur sa presqu’île.


      Le lac noie une ancienne plaine marécageuse jadis couverte d’une immense chênaie ; d’où le nom Der, issu
      du celte dervos, « chêne ». Son rythme épouse celui de l’eau : remplissage du 1 novembre au 30 juin,
      puis vidange progressive du 1 juillet au 31 octobre. Au printemps, lorsque le Der fait le plein, ses
      eaux prennent des teintes turquoise ; à la fin de l’automne, l’assec libère d’immenses vasières très
      prisées par les oiseaux d’eau et les grues aux dortoirs.
    wildlife: >-
      **Automne.** Dès le début d’octobre, la migration s’accélère avec d’immenses vols en V. Le Der se situe
      sur le grand couloir de migration nord-est/sud-ouest reliant le nord de l’Europe à l’Espagne et
      l’Afrique du Nord. Le 11 novembre 2014, on a dénombré 206 582 grues quittant les dortoirs au lever du
      jour, record absolu du Der et d’Europe. Durant la migration, entre 50 000 et 450 000 oiseaux d’eau font
      halte dans la réserve.


      **Automne et hiver, à l’aube.** Après leur nuit sur l’eau, les grues partent glaner dans les chaumes de
      maïs à des dizaines de kilomètres à la ronde ou poursuivent leur vol. De grands migrateurs comme
      l’hirondelle rustique et le cygne chanteur fréquentent également les étangs.


      **Printemps et été.** De mi-février à mi-mars, pendant l’agrainage, des grains bio sont épandus dans un
      champ jouxtant une ferme réhabilitée en observatoire en 1990 près de Saint-Rémy-en-Bouzemont, offrant un
      spectacle grandiose à bonne distance. Au printemps nichent grèbes, foulques, hérons et canards ; en
      juillet et août, les oiseaux se replient dans les zones de quiétude. Au total, 300 espèces d’oiseaux ont
      été répertoriées.
    visit: >-
      Pour observer l’envol des grues, le meilleur poste est la digue au lever du jour. La Ferme aux Grues à
      Saint-Rémy-en-Bouzemont, ancien corps de ferme réaménagé au cœur de la zone de gagnage, dispose d’un
      observatoire abrité. Le lac compte 5 observatoires et 16 postes d’observation aménagés.


      Les bénévoles de la LPO effectuent le comptage dominical des grues depuis la digue de la mi-octobre au
      début mars, et des sorties accompagnées sont régulièrement organisées.


      Côté randonnée, le circuit des étangs d’Outines parcourt près de huit kilomètres balisés en zone de
      quiétude, géré par le Conservatoire du Littoral et équipé d’observatoires. Un autre itinéraire de près
      de 10 km, praticable à pied ou à VTT, serpente dans la forêt domaniale du Der avec des vues plongeantes
      sur le lac, tandis qu’un circuit de 9 km sillonne Giffaumont-Champaubert. À vélo, le tour complet du lac
      totalise 36 kilomètres sur voie verte et s’effectue en une demi-journée.


      Le Village Musée du Der retrace la mémoire des villages engloutis et les traditions locales.
    history: >-
      Le site bénéficie des classements Natura 2000, Ramsar et ZICO ; le lac et ses étangs satellites
      s’intègrent dans un site Ramsar de 235 000 hectares et une zone importante pour la conservation des
      oiseaux de 56 000 hectares.
    before: >-
      Pour observer les grues, privilégiez les observatoires publics et le sommet des digues ; si des oiseaux
      se nourrissent dans un champ au bord de la route, restez dans votre véhicule pour ne pas les
      effaroucher. Restez sur le domaine public et ne vous aventurez jamais sur les vasières asséchées, les
      pistes agricoles étant privées. La cuvette du lac où dorment les grues est strictement interdite d’accès
      en automne et en hiver. Évitez cris et flashs.
    around: >-
      À 30 km s’étend la [Forêt d’Orient](/lugar/foret-d-orient---secteurs-forestiers/). Plus loin, trois
      sites partagent avec le Der la grue cendrée et le pygargue à queue blanche : le [Paysage forestier de
      Schorfheide-Chorin](/lugar/schorfheide-chorin-forest-landscape/), le [Parc national de
      Słowiński](/lugar/slowinski-park-narodowy/) et le [Parc national de
      Ķemeri](/lugar/kemeru-nacionalais-parks/), riches en lacs et forêts humides.
  de:
    intro: >-
      Noch vor Sonnenaufgang erwacht der Himmel über dem Lac du Der. Die Kraniche, die die Nacht mitten auf
      dem See verbracht haben, stimmen ihr charakteristisches «Kru Kru» an; das Trompeten schwillt an, und
      sobald das erste Licht aufsteigt, heben sie zu Hunderten und Tausenden ab, streichen dicht über das
      Wasser und ziehen über den Deich und die Schaulustigen hinweg. Es ist das ergreifende Naturschauspiel,
      das Naturbegeisterte von Mitte Oktober bis Mitte März anlockt. Zwischen 200 000 und 350 000
      [Kraniche](/especie/grus_grus/) rasten alljährlich an diesem Stausee in der Champagne, und 20 000 bis 30
      000 überwintern vor Ort.
    landscape: >-
      Der Lac du Der entstand 1974 nach zehnjährigen monumentalen Bauarbeiten als Rückhaltebecken, um
      Hochwasserspitzen der Marne abzufangen, Paris vor Überflutung zu bewahren und den sommerlichen
      Niedrigwasserstand zu stützen. Die Erdarbeiten begannen 1967 gegen den erbitterten Widerstand der
      Bevölkerung. Im Stausee versanken drei Dörfer – Chantecoq, Nuisement-aux-Bois und Champaubert-aux-Bois
      –, von denen allein die Kirche von Champaubert auf einer Halbinsel überlebte.


      Der See bedeckt eine einstige Sumpfebene mit mächtigen Eichenwäldern; daher der keltische Name Der (von
      dervos, «Eiche»). Der Rhythmus wird vom Wasser bestimmt: Aufstau vom 1. November bis zum 30. Juni,
      regulärer Abstau vom 1. Juli bis zum 31. Oktober. Im Frühjahr bei Vollstau schimmert der See tiefblau
      und türkis; im Spätherbst legt der Abstau endlose Schlickflächen frei. Im Herbst und Winter bietet das
      Niedrigwasser ideale Schlafplätze für Kraniche.
    wildlife: >-
      **Herbst.** Anfang Oktober gewinnt der Zug gewaltig an Dynamik, wenn endlose V-Formationen eintreffen.
      Der Der liegt auf der großen Nordost-Südwest-Zugstraße zwischen Nordeuropa, Spanien und Nordafrika. Am
      11. November 2014 wurden 206 582 abfliegende Kraniche gezählt – Allzeitrekord für den See und ganz
      Europa. Während des Vogelzugs rasten zwischen 50000 und 450000 Wasservögel im Schutzgebiet.


      **Herbst und Winter, im Morgengrauen.** Nach der Nacht auf dem See fliegen die Kraniche auf abgeerntete
      Maisäcker im Umkreis von Dutzenden Kilometern oder ziehen weiter. Weitstreckenzieher wie Rauchschwalbe
      und Singschwan nutzen die Gewässer ebenfalls als Rastplatz.


      **Frühjahr und Sommer.** Von Mitte Februar bis Mitte März wird bei der Ablenkfütterung («agrainage»)
      Getreide auf einem Acker neben einem 1990 eingerichteten Beobachtungshof bei Saint-Rémy-en-Bouzemont
      ausgebracht, wo sich die Vögel rücksichtsvoll beobachten lassen. Im Frühling brüten Haubentaucher,
      Blässhühner, Reiher und Enten; im Hochsommer weichen die Vögel in die Ruhezonen aus. Insgesamt wurden
      300 Vogelarten nachgewiesen.
    visit: >-
      Zum Einflug und Abflug der Kraniche ist der Deichkamm im ersten Morgenlicht der beste Aussichtspunkt.
      Die Ferme aux Grues in Saint-Rémy-en-Bouzemont, ein ehemaliger Bauernhof an den Äsungsflächen, bietet
      Beobachtungsstände. Der See verfügt über 5 Beobachtungshütten und 16 ausgewiesene Aussichtspunkte.


      Ehrenamtliche des Vogelschutzbundes LPO zählen die Kraniche von Mitte Oktober bis Anfang März an jedem
      Sonntagmorgen; zudem werden Führungen und Exkursionen angeboten.


      Für Wanderer führt der markierte Rundweg um die Teiche von Outines über fast acht Kilometer durch ruhige
      Schutzzonen des Küstenschutzverbands mit mehreren Hütten. Ein Rundweg von knapp 10 km führt zu Fuß oder
      per Mountainbike durch den Staatswald mit Seeblick; eine weitere Runde von 9 km umrundet
      Giffaumont-Champaubert. Mit dem Rad misst die Seerunde 36 Kilometer auf asphaltiertem Deichweg und lässt
      sich in einem halben Tag bewältigen.


      Das Museumsdorf Village Musée du Der erinnert an die versunkenen Ortschaften und ihr architektonisches
      Erbe.
    history: >-
      Das Gebiet ist als Natura 2000-, Ramsar- und ZICO-Gebiet ausgewiesen; See und Satellitenteiche gehören
      zu einem Ramsar-Schutzgebiet von 235 000 Hektar und einem Europäischen Vogelschutzgebiet von 56 000
      Hektar.
    before: >-
      Nutze zur Kranichbeobachtung die offiziellen Beobachtungshütten und Deiche; stehen Vögel auf ufernahen
      Feldern, bleibe im Auto sitzen, da Kraniche an Fahrzeuge gewöhnt sind. Verlasse nicht die öffentlichen
      Wege und betrete keinesfalls die Schlickflächen. Das Schlafbecken der Kraniche ist im Herbst und Winter
      für Besucher gesperrt. Vermeide Lärm und Blitzlicht.
    around: >-
      In 30 km Entfernung liegt der [Wald von Orient](/lugar/foret-d-orient---secteurs-forestiers/). Weit
      entfernt teilen drei Gebiete den Grauen Kranich und den Seeadler mit dem Lac du Der: die [Waldlandschaft
      Schorfheide-Chorin](/lugar/schorfheide-chorin-forest-landscape/), der [Slowinzische
      Nationalpark](/lugar/slowinski-park-narodowy/) und der [Nationalpark
      Ķemeri](/lugar/kemeru-nacionalais-parks/).
  it:
    intro: >-
      Prima che albeggi, il cielo del Der comincia a vibrare. Le gru che hanno trascorso la notte in mezzo
      alle acque intonano il loro inconfondibile «Krou Krou», il frastuono cresce e, al sorgere del sole,
      decollano a centinaia e migliaia, sfiorando lo specchio lacustre per scavalcare l’argine sopra gli
      spettatori radunati. È la scena memorabile che attrae appassionati al Lac du Der da metà ottobre a metà
      marzo. Tra 200 000 e 350 000 [gru](/especie/grus_grus/) transitano ogni anno da questo bacino
      artificiale della Champagne, e tra 20 000 e 30 000 vi svernano stabilmente.
    landscape: >-
      Il Lac du Der vide la luce nel 1974 dopo dieci anni di cantieri titanici, realizzato come invaso di
      laminazione per regolare il corso della Marna, attutire le piene verso Parigi e sostenere le magre
      estive. I lavori presero avvio nel 1967 tra forti proteste locali. Sotto le acque scomparvero tre paesi:
      Chantecoq, Nuisement-aux-Bois e Champaubert-aux-Bois, di cui sopravvive solo la chiesa su una penisola.


      Il lago occupa un’antica piana acquitrinosa ammantata da una fitta foresta di querce; da qui il nome
      celtico Der (dervos, «quercia»). Il suo battito segue il regime idraulico: riempimento dal 1 novembre al
      30 giugno e svuotamento dal 1 luglio al 31 ottobre. In primavera a pieno carico le acque assumono
      sfumature turchesi; a fine autunno l’abbassamento del livello svela estese distese fangose molto gradite
      agli uccelli limicoli e alle gru per il riposo notturno.
    wildlife: >-
      **Autunno.** A inizio ottobre la migrazione entra nel vivo con grandi formazioni a cuneo. Il Der si
      colloca sul corridoio nord-est/sud-ovest che connette il nord Europa con Spagna e Nordafrica. L’11
      novembre 2014 vennero contate 206 582 gru in uscita dai dormitori, record assoluto per il Der e
      l’Europa. Durante i flussi migratori sostano nella riserva tra 50000 e 450000 uccelli acquatici.


      **Autunno e inverno, all’alba.** Dopo la sosta notturna, le gru si involano per pascolare nei campi di
      mais a decine di chilometri o riprendono il viaggio. Grandi volatili come la rondine comune e il cigno
      selvatico frequentano il lago e gli stagni.


      **Primavera ed estate.** Da metà febbraio a metà marzo, durante la distribuzione di granaglie biologiche
      presso una fattoria convertita in osservatorio nel 1990 a Saint-Rémy-en-Bouzemont, si assiste
      all’alimentazione delle gru a distanza di rispetto. In primavera nidificano svassi, folaghe, aironi e
      anatidi; a luglio e agosto gli stormi riparano nelle baie di quiete. Nel complesso sono state censite
      300 specie d’uccelli.
    visit: >-
      Per osservare le gru il punto privilegiato è il camminamento sull’argine al sorgere del sole. La Ferme
      aux Grues a Saint-Rémy-en-Bouzemont, antico podere nelle aree di pastura, dispone di un capanno
      d’avvistamento. Il lago conta 5 osservatori e 16 punti panoramici dedicati.


      I volontari della LPO effettuano i censimenti domenicali dall’argine da metà ottobre a inizio marzo, con
      visite guidate ed escursioni naturalistiche.


      Per gli escursionisti, l’anello degli stagni di Outines copre quasi otto chilometri segnalati in un
      settore tranquillo del Conservatoire du Littoral munito di capanni. Un altro itinerario di quasi 10 km,
      a piedi o in mountain bike, attraversa la foresta demaniale con affacci sull’invaso, mentre un percorso
      di 9 km tocca Giffaumont-Champaubert. In bicicletta, il periplo completo del lago misura 36 chilometri
      su pista ciclabile pianeggiante e richiede mezza giornata.


      Il Village Musée du Der tramanda la storia dei paesi sommersi e la cultura materiale locale.
    history: >-
      L’area è tutelata come sito Natura 2000, Ramsar e ZICO; il lago e gli stagni adiacenti rientrano in una
      zona umida Ramsar di 235 000 ettari e in un’area di protezione avifaunistica di 56 000 ettari.
    before: >-
      Per ammirare le gru bisogna utilizzare gli osservatori aperti al pubblico e i camminamenti sugli argini;
      se si scorgono uccelli in un campo lungo la carreggiata, non bisogna scendere dal veicolo. Il punto di
      osservazione migliore è proprio l’automobile, che le gru hanno imparato a non temere. È indispensabile
      rimanere sulle vie pubbliche e non addentrarsi nei fanghi scoperti del lago, tenendo presente che le
      stradine agricole sono private. La conca dell’invaso dove pernottano le gru resta rigorosamente chiusa a
      qualsiasi accesso durante la migrazione e in inverno. Negli osservatori e sugli argini occorre evitare
      schiamazzi, grida e fotografie con il flash.
    around: >-
      A 30 km si estende la [Foresta d’Orient](/lugar/foret-d-orient---secteurs-forestiers/). Più distante,
      tre riserve condividono la gru e l’aquila di mare con il Der: il [Paesaggio Forestale di
      Schorfheide-Chorin](/lugar/schorfheide-chorin-forest-landscape/), il [Parco Nazionale di
      Słowiński](/lugar/slowinski-park-narodowy/) e il [Parco Nazionale di
      Ķemeri](/lugar/kemeru-nacionalais-parks/).
  pt:
    intro: >-
      Antes de romper o dia, o céu do Der começa a ecoar. Os grous que pernoitaram nas águas do lago soltam o
      seu trompetear característico, o clamor intensifica-se e, ao surgir o sol, descolam às centenas e aos
      milhares, roçando a água para sobrevoarem o dique sobre os muitos observadores presentes. É a cena
      marcante que atrai visitantes ao Lac du Der de meados de outubro a meados de março. Entre 200 000 e 350
      000 [grous-comuns](/especie/grus_grus/) passam anualmente por esta albufeira da Champagne, e entre 20
      000 e 30 000 permanecem durante o inverno.
    landscape: >-
      O Lac du Der nasceu em 1974 após uma década de obras de engenharia colossais, construído para regular o
      rio Marne, amortecer cheias em direção a Paris e manter caudais de estiagem. Os trabalhos arrancaram em
      1967 com forte contestação popular. Debaixo das águas submergiram três aldeias inteiras — Chantecoq,
      Nuisement-aux-Bois e Champaubert-aux-Bois —, restando apenas a igreja de Champaubert numa península.


      O lago assenta numa antiga planície pantanosa coberta por uma grandiosa floresta de carvalhos; daí o
      étimo Der, do celta dervos («carvalho»). A sua pulsação segue o regime hídrico: enchimento entre 1 de
      novembro e 30 de junho e esvaziamento entre 1 de julho e 31 de outubro. Na primavera com a albufeira
      cheia as águas adquirem tons azul-turquesa; no final do outono a descida do nível revela extensos
      lodaçais muito procurados pelos grous.
    wildlife: >-
      **Outono.** No início de outubro a migração atinge o auge com voos maciços em V. O Der situa-se no
      corredor migratório nordeste-sudoeste entre o norte da Europa e a Península Ibérica. Em 11 de novembro
      de 2014 registaram-se 206 582 grous a partir dos dormitórios, recorde absoluto no Der e em toda a
      Europa. Durante as passagens fazem escala na reserva entre 50000 e 450000 aves aquáticas.


      **Outono e inverno, ao amanhecer.** Após pernoitarem no lago, os grous voam para se alimentarem nos
      campos agrícolas vizinhos a dezenas de quilómetros ou prosseguem viagem. Espécies viajantes como a
      andorinha-das-chaminés e o cisne-bravo frequentam o lago e as lagoas marginais.


      **Primavera e verão.** De meados de fevereiro a meados de março, durante a distribuição suplementar de
      grãos bio num campo contíguo a uma quinta recuperada em 1990 perto de Saint-Rémy-en-Bouzemont, é
      possível observar grous a alimentar-se a distância prudente. Na primavera nidificam mergulhões,
      galeirões, garças e patos; no verão as aves resguardam-se nas enseadas de tranquilidade. Ao todo
      contam-se 300 espécies de aves.
    visit: >-
      Para presenciar a partida matinal dos grous, o topo do dique constitui o melhor miradouro ao romper da
      aurora. A Ferme aux Grues em Saint-Rémy-en-Bouzemont, antiga herdade agrícola transformada em posto
      interpretativo, dispõe de abrigo envidraçado. O lago integra 5 abrigos e 16 postos de observação.


      Voluntários da LPO efetuam contagens dominicais a partir do dique de meados de outubro ao início de
      março, realizando saídas de campo guiadas.


      Para caminhar, o trilho das lagoas de Outines percorre quase oito quilómetros em zona de reserva
      biológica do Conservatoire du Littoral com abrigos de madeira. Outra rota de quase 10 km, a pé ou de
      BTT, serpenteia pela mata do Der com vistas rasgadas sobre a albufeira, enquanto um circuito de 9 km
      passa por Giffaumont-Champaubert. De bicicleta, a volta completa ao lago soma 36 quilómetros em ciclovia
      asfaltada e cumpre-se em meio dia.


      O Village Musée du Der preserva a memória das aldeias submersas e a arquitetura em enxaimel.
    history: >-
      A área está classificada como Natura 2000, Ramsar e ZICO; o lago e lagoas anexas integram um sítio
      Ramsar com 235 000 hectares e uma zona de proteção especial para aves com 56 000 hectares.
    before: >-
      Para observar os grous utiliza os observatórios públicos e os diques; se avistares aves nos campos junto
      à estrada, permanece no interior da viatura. Não saias dos caminhos públicos e nunca desças aos lodaçais
      da bacia. O leito do lago onde os grous pernoitam está estritamente interdito a visitantes no outono e
      inverno. Evita ruídos e fotografias com flash.
    around: >-
      A 30 km fica a [Floresta de Orient](/lugar/foret-d-orient---secteurs-forestiers/). Mais longe, três
      reservas partilham o grou-comum e a águia-rabalva com o Der: a [Paisagem Florestal de
      Schorfheide-Chorin](/lugar/schorfheide-chorin-forest-landscape/), o [Parque Nacional de
      Słowiński](/lugar/slowinski-park-narodowy/) e o [Parque Nacional de
      Ķemeri](/lugar/kemeru-nacionalais-parks/).
