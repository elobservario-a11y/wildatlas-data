    Uno de los embalses artificiales más grandes de Europa (4.800 ha), célebre por reunir hasta 130.000
    grullas en su migración.
  en: >-
    One of Europe’s largest artificial reservoirs (4,800 ha), renowned for congregating up to 130,000 common
    cranes during migration.
  fr: >-
    L’un des plus grands lacs-réservoirs artificiels d’Europe (4 800 ha), célèbre pour rassembler jusqu’à 130
    000 grues lors de leur migration.
  de: >-
    Einer der größten künstlichen Stauseen Europas (4.800 ha), berühmt für bis zu 130.000 rastende Kraniche
    auf dem Zugweg.
  it: >-
    Uno dei più grandi bacini artificiali d’Europa (4.800 ha), celebre per radunare fino a 130.000 gru durante
    le migrazioni.
  pt: >-
    Uma das maiores albufeiras artificiais da Europa (4.800 ha), célebre por concentrar até 130.000 grous
    durante a migração.
