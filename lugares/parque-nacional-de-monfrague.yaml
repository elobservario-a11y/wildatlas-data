resumen:
  es: >-
    La meca europea del avistamiento de aves rapaces, con la mayor colonia de buitre negro (*Aegypius
    monachus*) del mundo y el corte del Tajo en el Salto del Gitano.
  en: >-
    The European mecca for raptor watching, holding the largest cinereous vulture (*Aegypius monachus*) colony
    in the world and the dramatic Tagus breach at Salto del Gitano.
  fr: >-
    La mecque européenne de l'observation des rapaces, avec la plus grande colonie de vautour moine (*Aegypius
    monachus*) au monde et l'entaille du Tage au Salto del Gitano.
  de: >-
    Das europäische Mekka der Greifvogelbeobachtung mit der weltgrößten Kolonie des Mönchsgeiers (*Aegypius
    monachus*) und dem Felsdurchbruch des Tajo am Salto del Gitano.
  it: >-
    La mecca europea per il birdwatching di rapaci, con la più grande colonia di avvoltoio monaco (*Aegypius
    monachus*) al mondo e la gola del Tago al Salto del Gitano.
  pt: >-
    A meca europeia da observação de aves de rapina, acolhendo a maior colónia de abutre-preto (*Aegypius
    monachus*) do mundo e o corte do Tejo no Salto del Gitano.
unico:
  es: >-
    Aquí la mayor mancha de monte mediterráneo bien conservado de Europa se recorre con los buitres y las
    águilas a la vista, desde la propia carretera.
  en: >-
    Here the largest tract of well-preserved Mediterranean woodland in Europe can be explored with vultures
    and eagles in plain view right from the roadside.
  fr: >-
    Ici, la plus vaste tache de forêt méditerranéenne préservée d'Europe se découvre avec aigles et vautours
    en vol direct depuis le bord de la route.
  de: >-
    Hier lässt sich das größte zusammenhängende, intakte mediterrane Wald- und Buschlandgebiet Europas direkt
    von der Straße aus mit kreisenden Geiern und Adlern erleben.
  it: >-
    Qui la più estesa macchia di foresta mediterranea intatta d'Europa si esplora con avvoltoi e aquile in
    volo visibili direttamente dal bordo stradale.
  pt: >-
    Aqui a maior mancha de monte mediterrânico intacto da Europa pode ser percorrida observando abutres e
    águias em voo diretamente a partir da estrada.
observaciones:
  es: >-
    El parque queda en el norte de Cáceres, en el triángulo imaginario que forman Cáceres, Plasencia y
    Trujillo. Las rutas marrón (Serradilla), morada (Torrejón el Rubio) y negra (Barbaón) cruzan zona de
    reserva y exigen un permiso que debes llevar durante todo el recorrido. Las rutas guiadas y las salidas de
    aves requieren inscripción previa.
texto:
  es:
    intro: >-
      Hay pocos lugares en el mundo donde puedas observar a corta distancia algunas de las aves más buscadas
      sin salir de la carretera. Monfragüe es uno de ellos. Dos ríos, el Tajo y el Tiétar, atraviesan este
      parque nacional de la provincia de Cáceres, y entre sus orillas se extiende la mancha continua de bosque
      y matorral mediterráneo más grande y mejor conservada de Europa. Fue parque natural en 1979 y parque
      nacional en marzo de 2007.
    landscape: >-
      Monfragüe es uno de los mejores ejemplos de lo que se llama relieve apalachense. La receta es sencilla:
      capas de rocas resistentes, cuarcitas y areniscas, alternan con otras frágiles, las pizarras. Las duras
      forman las sierras; las blandas se hunden en los valles, y por ellos corre encajada la red fluvial. Por
      eso el Tajo, al cruzar el parque, se mete por el Salto del Gitano, una de las gigantescas puertas, o
      «portillas», que dan acceso a Monfragüe.


      Sobre ese esqueleto de roca crecen tres hábitats principales: el bosque y matorral mediterráneo con sus
      dehesas, los roquedos y las masas de agua, ríos y embalses. En la dehesa mandan encinas, alcornoques y
      quejigos; en el matorral, jaras, brezos y madroños, tan densos que las laderas son casi impenetrables.
      En los roquedos asoman enebros y cornicabra, junto a los ríos se alinean alisos y almez, y en las zonas
      más cálidas aparece el acebuche.


      Algunos árboles tienen nombre propio. Cerca de Villarreal de San Carlos, el almez u ojaranzo del Huerto
      del Ojaranzo se alza dieciocho metros. Y junto al antiguo camino de Serrejón vive el alcornoque Abuelo
      de El Toril, un viejísimo ejemplar de más de cuatrocientos años.
    wildlife: >-
      En el parque crían más de 200 especies de vertebrados, y otras hibernan o pasan en la migración. Las
      aves son las que mandan. El [buitre negro](/especie/aegypius_monachus/) suma 286 parejas, el [águila
      imperial ibérica](/especie/aquila_adalberti/) 12 y la [cigüeña negra](/especie/ciconia_nigra/) 30; hay
      entre 500 y 600 parejas de [buitre leonado](/especie/gyps_fulvus/), 35 de
      [alimoche](/especie/neophron_percnopterus/), 7 de [águila perdicera](/especie/aquila_fasciata/) y 6 de
      [águila real](/especie/aquila_chrysaetos/), además del [búho real](/especie/bubo_bubo/).


      La mejor escena está en el Salto del Gitano. Desde allí se ve un sinfín de aves, y entre ellas destaca
      la cigüeña negra, que anida entre las oquedades y, protegida por el río, enseña la ceba de sus crías. La
      carretera que atraviesa el parque permite llegar hasta allí a cualquier hora y en cualquier momento del
      año.


      Entre los mamíferos hay [nutria](/especie/lutra_lutra/), meloncillo, garduña, [gato
      montés](/especie/felis_silvestris/), tejón y [jineta](/especie/genetta_genetta/); el zorro es el más
      abundante de los carnívoros, y abundan los venados, los [jabalíes](/especie/sus_scrofa/) y los conejos.
      Entre los reptiles destacan la culebra bastarda, la culebra de herradura, el galápago leproso y el
      lagarto ocelado.


      El otoño trae el sonido más profundo del año. Durante los últimos días de septiembre se escucha la
      berrea del [ciervo](/especie/cervus_elaphus/), uno de los pocos momentos en que puedes contemplar a los
      grandes machos en estado salvaje. Con el frío y la humedad crecientes, monte y dehesas se llenan de
      berridos. Las crías llegan en mayo, tras ocho meses de gestación: una o dos crías, los gabatos o
      cervatillos.
    visit: >-
      Empieza por Villarreal de San Carlos. El centro de visitantes orienta sobre las rutas dentro y fuera del
      parque, y en la misma aldea el Centro de Interpretación de la Naturaleza explica las formaciones
      naturales y los valores culturales del parque. El Centro de Animales Naturalizados recrea con especies
      naturalizadas el roquedo, la ribera, el monte mediterráneo y la dehesa. Más al norte está el Centro de
      Visitantes Norte «Jesús Garzón», con una sala de audiovisuales, interactivos, paneles y maquetas, y un
      sendero interpretativo de 1 km con paneles sobre la fauna y la flora.


      Para caminar tienes rutas autoguiadas. La ruta roja es la mayor de las interiores: 16 km, dificultad
      media, tres tramos circulares que pasan por los lugares más emblemáticos. La verde, de 7,9 km y
      dificultad baja, es circular por el arroyo de Malvecino y el cerro Gimio y enseña los tipos de
      vegetación del parque. La amarilla, de 8,9 km y también baja, lleva al mirador de la Tajadilla entre
      pequeñas huertas, dehesa y matorral.


      Si prefieres ir acompañado, el parque ofrece rutas con educadores ambientales y observación de aves en
      los miradores principales: La Tajadilla, el Salto del Gitano y la Portilla del Tiétar. Son gratuitas y
      requieren inscripción previa, y se celebran de marzo a junio y en octubre. Y si te interesa la roca, la
      ruta geológica de 39 km, pensada para coche o bicicleta por carreteras y pistas asfaltadas, tiene nueve
      paradas con señales interpretativas.


      Con el cielo oscuro, hay otra razón para quedarse: en 2011 Monfragüe fue propuesto para el sello de
      calidad del cielo de la Iniciativa Starlight.
    history: >-
      El nombre es romano: Monsfragorum, monte fragoso, aludía a la riqueza y exuberancia del paisaje. Bajo
      dominio musulmán se llamó Al-Mofrag, «el abismo» o «el cruce de caminos». Antes, los primeros habitantes
      dejaron su impronta en las covachas y abrigos de las sierras.


      La protección llegó de la mano de una persona. En 1974 Jesús Garzón propuso por primera vez proteger
      Monfragüe y consiguió su declaración como Parque Natural. Villarreal de San Carlos era entonces una
      aldea en ruinas; se compraron los restos de casas y corrales y se reconstruyeron para recibir a los
      visitantes. En 2003 la UNESCO reconoció la Reserva de la Biosfera y el entorno pasó a ser Zona de
      Especial Protección para las Aves.


      El paisaje actual debe buena parte de su aspecto a actividades tradicionales como la ganadería, la
      apicultura o la extracción de corcho, y su mantenimiento forma parte de la conservación.
    before: >-
      El parque queda en el norte de Cáceres, en el triángulo imaginario que forman Cáceres, Plasencia y
      Trujillo. Las rutas marrón (Serradilla), morada (Torrejón el Rubio) y negra (Barbaón) cruzan zona de
      reserva y exigen un permiso que debes llevar durante todo el recorrido. Las rutas guiadas y las salidas
      de aves requieren inscripción previa.
    around: >-
      El [Monumento Natural Cueva de Castañar](/lugar/monumento-natural-cueva-de-castanar/) está a unos 30 km.
      Más lejos, el [Parque Nacional de Cabañeros](/lugar/parque-nacional-de-cabaneros/) comparte con
      Monfragüe águila imperial, buitre negro y cigüeña negra, y los mismos hábitats de bosque maduro y
      corredor fluvial. [Sierra Morena Oriental y
      Despeñaperros](/lugar/sierra-morena-oriental---despenaperros/) reúne las mismas tres especies entre
      bosque maduro y cañón.
  en:
    intro: >-
      There are few places in the world where you can watch some of the most sought-after raptors at close
      quarters without leaving the road. Monfragüe is one of them. Two rivers, the Tagus and the Tiétar,
      traverse this national park in Cáceres province, and between their banks stretches the largest and
      best-preserved continuous tract of Mediterranean forest and scrubland in Europe. It was designated a
      natural park in 1979 and became a national park in March 2007.
    landscape: >-
      Monfragüe is one of the world's finest examples of Appalachian-style relief. The mechanism is simple:
      resistant quartzite and sandstone layers alternate with soft, fragile shales. The tough strata form
      parallel ridges; the soft rocks weather down into valleys through which rivers cut entrenched courses.
      That is why the Tagus, carving through the park, cuts through the Salto del Gitano, one of the
      monumental rock portals (portillas) giving access to Monfragüe.


      Across this bedrock skeleton flourish three main habitats: Mediterranean woodland and dehesa pasture,
      dramatic quartzite crags, and open water bodies including rivers and reservoirs. In the dehesas, holm
      oaks, cork oaks, and Portuguese oaks dominate; dense cistus, tree heather, and strawberry trees cloak
      hillsides in almost impenetrable thickets. On rocky bluffs cling juniper and turpentine trees, while
      alders and nettle trees fringe waterways, accompanied by wild olives in warm microclimates.


      Certain trees carry personal history. Near Villarreal de San Carlos, the nettle tree of Huerto del
      Ojaranzo reaches eighteen metres in height. Alongside the old Serrejón road stands the Abuelo de El
      Toril cork oak, an ancient veteran over four hundred years old.
    wildlife: >-
      Over 200 vertebrate species breed in the park, with others overwintering or passing through during
      migration. Birds reign supreme. The [cinereous vulture](/especie/aegypius_monachus/) numbers 286
      breeding pairs, the [Spanish imperial eagle](/especie/aquila_adalberti/) 12 pairs, and the [black
      stork](/especie/ciconia_nigra/) 30 pairs; there are between 500 and 600 pairs of [griffon
      vulture](/especie/gyps_fulvus/), 35 pairs of [Egyptian vulture](/especie/neophron_percnopterus/), 7
      pairs of [Bonelli's eagle](/especie/aquila_fasciata/), and 6 pairs of [golden
      eagle](/especie/aquila_chrysaetos/), alongside the [Eurasian eagle-owl](/especie/bubo_bubo/).


      The most iconic viewpoint is Salto del Gitano. From there you can observe countless raptors, including
      black storks nesting in rock crevices above the river and feeding their young in plain view. The paved
      road across the park allows you to reach this spot at any hour year-round.


      Mammals include the [Eurasian otter](/especie/lutra_lutra/), Egyptian mongoose, stone marten, [European
      wildcat](/especie/felis_silvestris/), badger, and [common genet](/especie/genetta_genetta/); the red fox
      is the most abundant carnivore, alongside plentiful red deer, [wild boars](/especie/sus_scrofa/), and
      rabbits. Reptiles feature the Montpellier snake, horseshoe whip snake, Spanish terrapin, and ocellated
      lizard.


      Autumn brings the deepest resonance of the year. During late September, the rut of the [red
      deer](/especie/cervus_elaphus/) echoes across valleys, offering rare opportunities to watch mature
      stags. As chilly autumn mist gathers, woodlands resound with bellowing. Calves arrive in May after eight
      months of gestation: usually one or two fawns.
    visit: >-
      Start in Villarreal de San Carlos. The visitor centre provides maps of trails inside and outside the
      park, while the Nature Interpretation Centre illustrates geological formations and cultural history. The
      Wildlife Display Centre showcases taxidermy dioramas depicting crags, riparian zones, and dehesas. To
      the north stands the Northern Visitor Centre «Jesús Garzón», offering audiovisual exhibits, models, and
      an interpretive nature loop of 1 km explaining local biodiversity.


      For walking, several self-guided trails beckon. The red route is the most comprehensive interior hike:
      16 km, moderate difficulty, with three loop sections passing iconic landmarks. The green trail spans 7.9
      km with low difficulty, looping along the Malvecino stream and Cerro Gimio to showcase diverse plant
      communities. The yellow trail, 8.9 km and also gentle, winds toward the Tajadilla lookout through
      orchards, pastures, and scrub.


      For guided activities, the park provides free ranger-led excursions and birdwatching sessions at main
      viewpoints: La Tajadilla, Salto del Gitano, and Portilla del Tiétar. These are free with prior
      registration, running from March through June and in October. For geology enthusiasts, a 39 km driving
      or cycling route along paved roads features nine interpretive stops.


      Clear night skies offer another incentive to linger: in 2011 Monfragüe was proposed as an
      internationally certified Starlight Tourist Destination.
    history: >-
      The name is Roman: Monsfragorum, the rugged mountain, referring to its wild terrain. Under Islamic rule
      it was known as Al-Mofrag, meaning the chasm or the crossroads. Long before, prehistoric settlers left
      cave paintings in natural rock shelters.


      Modern protection arose through individual dedication. In 1974 naturalist Jesús Garzón first campaigned
      to protect Monfragüe, achieving its designation as a Natural Park. Villarreal de San Carlos was then an
      abandoned hamlet; ruined houses and folds were purchased and renovated to welcome visitors. In 2003
      UNESCO recognized Monfragüe as a Biosphere Reserve, integrated within a Special Protection Area for
      Birds.


      The living landscape reflects traditional pastoralism, beekeeping, and cork harvesting, whose
      continuation remains central to conservation.
    before: >-
      The park lies in northern Cáceres, framed by the triangle of Cáceres, Plasencia, and Trujillo. The brown
      (Serradilla), purple (Torrejón el Rubio), and black (Barbaón) routes enter strict reserve zones and
      require a written permit that you must carry at all times. Guided excursions and birdwatching activities
      require prior booking.
    around: >-
      Around 30 km away lies [Monumento Natural Cueva de
      Castañar](/lugar/monumento-natural-cueva-de-castanar/). Further afield, [Parque Nacional de
      Cabañeros](/lugar/parque-nacional-de-cabaneros/) shares with Monfragüe the Spanish imperial eagle,
      cinereous vulture, and black stork, alongside similar mature Mediterranean forest and riparian habitats.
      [Sierra Morena Oriental y Despeñaperros](/lugar/sierra-morena-oriental---despenaperros/) unites the same
      three bird species across rocky gorges and old-growth woodlands.
  fr:
    intro: >-
      Il existe peu d'endroits au monde où vous pouvez observer de près certains des oiseaux les plus
      recherchés sans quitter la route goudronnée. Monfragüe est de ceux-là. Deux fleuves, le Tage et le
      Tiétar, traversent ce parc national de la province de Cáceres, bordés par la bande continue de forêt et
      de matorral méditerranéens la plus grande et la mieux préservée d'Europe. Déclaré parc naturel en 1979,
      il est devenu parc national en mars 2007.
    landscape: >-
      Monfragüe offre l'un des exemples les plus remarquables de relief appalachien. Le principe est limpide :
      des couches de roches dures, quartzites et grès, alternent avec des roches friables, les schistes. Les
      premières arment les crêtes ; les secondes se creusent en vallées où s'encaisse le réseau
      hydrographique. C'est ainsi que le Tage s'engouffre dans le Salto del Gitano, l'une des monumentales
      portes rocheuses (« portillas ») donnant accès au cœur de Monfragüe.


      Sur cette ossature minérale se déploient trois habitats majeurs : la forêt et le matorral méditerranéens
      avec leurs dehesas, les falaises rocheuses et les plans d'eau, rivières et retenues. Dans la dehesa
      dominent chênes verts, chênes-lièges et chênes faginés ; dans le maquis prolifèrent cistes, bruyères et
      arbousiers si denses que les pentes en deviennent impénétrables. Sur les parois rocheuses s'accrochent
      genévriers et térébinthes, tandis qu'aulnes et micocouliers bordent les rives, complétés d'oléastres
      dans les combes les plus chaudes.


      Certains arbres possèdent leur propre histoire. Près de Villarreal de San Carlos, le micocoulier du
      Huerto del Ojaranzo s'élève à dix-huit mètres de hauteur. Et le long de l'ancien chemin de Serrejón
      veille le chêne-liège Abuelo de El Toril, un patriarche vénérable de plus de quatre cents ans.
    wildlife: >-
      Plus de 200 espèces de vertébrés se reproduisent dans le parc, sans compter les hivernants et
      migrateurs. Les oiseaux sont les maîtres des lieux. Le [vautour moine](/especie/aegypius_monachus/)
      rassemble 286 couples, l'[aigle ibérique](/especie/aquila_adalberti/) 12 et la [cigogne
      noire](/especie/ciconia_nigra/) 30 ; on recense entre 500 et 600 couples de [vautour
      fauve](/especie/gyps_fulvus/), 35 de [percnoptère](/especie/neophron_percnopterus/), 7 d'[aigle de
      Bonelli](/especie/aquila_fasciata/) et 6 d'[aigle royal](/especie/aquila_chrysaetos/), sans oublier le
      [hibou grand-duc](/especie/bubo_bubo/).


      Le Salto del Gitano offre le spectacle le plus saisissant. De là, vous embrassez un ballet ininterrompu
      d'ailes, où se distingue la cigogne noire nichant dans les anfractuosités et nourrissant ses aiglons
      au-dessus de l'eau. La route traversant le parc permet d'y accéder à toute heure et en toute saison.


      Les mammifères comptent la [loutre d'Europe](/especie/lutra_lutra/), la mangouste ichneumon, la fouine,
      le [chat sauvage](/especie/felis_silvestris/), le blaireau et la [genette
      commune](/especie/genetta_genetta/) ; le renard est le carnivore le plus commun, côtoyant cerfs élaphes,
      [sangliers](/especie/sus_scrofa/) et lapins de garenne. Parmi les reptiles figurent la couleuvre de
      Montpellier, la couleuvre à fer à cheval et le lézard ocellé.


      L'automne apporte la rumeur la plus envoûtante. Fin septembre résonne le brame du [cerf
      élaphe](/especie/cervus_elaphus/), rare occasion d'observer les grands mâles sauvages. Avec les
      premières fraîcheurs, dehesas et coteaux vibrent d'appels rauques. Les faons naissent en mai après huit
      mois de gestation : un ou deux petits par portée.
    visit: >-
      Commencez par Villarreal de San Carlos. Le centre d'accueil oriente vers les sentiers du parc, tandis
      que le centre d'interprétation de la nature en détaille la géologie et l'histoire rurale. L'espace
      muséographique présente des dioramas de la faune sauvage des falaises et des dehesas. Plus au nord, le
      centre de visiteurs Nord « Jesús Garzón » propose projection audiovisuelle, maquettes didactiques et un
      sentier d'interprétation de 1 km ponctué de panneaux botaniques et faunistiques.


      Pour marcher, plusieurs circuits balisés s'offrent à vous. L'itinéraire rouge est le plus vaste tracé
      intérieur : 16 km, difficulté moyenne, articulé en trois boucles rejoignant les belvédères phares. Le
      tracé vert, de 7,9 km et difficulté facile, longe le ruisseau de Malvecino et le cerro Gimio. Le sentier
      jaune, de 8,9 km, conduit au belvédère de la Tajadilla à travers dehesas et vergers traditionnels.


      Si vous souhaitez un accompagnement, le parc organise des sorties gratuites avec des éducateurs nature
      et des séances d'observation aux belvédères de La Tajadilla, Salto del Gitano et Portilla del Tiétar, de
      mars à juin et en octobre sur inscription préalable. Pour les passionnés de géologie, un circuit routier
      de 39 km praticable en voiture ou à vélo propose neuf étapes commentées.


      La pureté du ciel nocturne constitue un attrait supplémentaire : en 2011, Monfragüe a été proposé comme
      destination de tourisme astronomique Starlight.
    history: >-
      Le toponyme est romain : Monsfragorum, le mont escarpé, désignait le relief accidenté. Sous domination
      arabo-andalouse, le site devint Al-Mofrag, « l'abîme » ou « le carrefour ». Dès la Préhistoire, les
      premiers occupants peignirent les abris sous roche des sierras.


      La préservation moderne découle de l'engagement d'un pionnier. En 1974, Jesús Garzón initia la campagne
      de protection qui déboucha sur le classement en parc naturel. Villarreal de San Carlos n'était alors
      qu'un hameau délabré ; ses bâtisses furent rachetées et restaurées pour accueillir le public. En 2003,
      l'UNESCO consacra la réserve de biosphère, adossée à une zone de protection spéciale pour les oiseaux.


      Le paysage actuel reste façonné par les activités agropastorales traditionnelles comme l'élevage
      extensif, l'apiculture et la levée du liège, indispensables à son équilibre.
    before: >-
      Le parc se situe au nord de Cáceres, dans le triangle formé par Cáceres, Plasencia et Trujillo. Les
      itinéraires marron (Serradilla), violet (Torrejón el Rubio) et noir (Barbaón) traversent des zones de
      réserve intégrale et exigent une autorisation nominative à conserver sur vous. Les sorties
      ornithologiques guidées requièrent une réservation préalable.
    around: >-
      Le [Monumento Natural Cueva de Castañar](/lugar/monumento-natural-cueva-de-castanar/) se trouve à
      environ 30 km. Plus loin, le [Parque Nacional de Cabañeros](/lugar/parque-nacional-de-cabaneros/)
      partage avec Monfragüe l'aigle ibérique, le vautour moine et la cigogne noire au sein de massifs de
      forêt méditerranéenne et de cours d'eau. [Sierra Morena Oriental y
      Despeñaperros](/lugar/sierra-morena-oriental---despenaperros/) regroupe les mêmes trois espèces entre
      falaises et vieilles forêts.
  de:
    intro: >-
      Es gibt nur wenige Orte auf der Welt, an denen du begehrte Greifvögel aus nächster Nähe beobachten
      kannst, ohne das Straßennetz zu verlassen. Monfragüe ist einer dieser seltenen Orte. Zwei Flüsse, Tajo
      und Tiétar, durchqueren diesen Nationalpark in der Provinz Cáceres, eingebettet in das größte und
      besterhaltene geschlossene Areal mediterranen Bergwaldes und Buschlandes in Europa. Es wurde 1979 zum
      Naturpark erklärt und im März 2007 als Nationalpark ausgewiesen.
    landscape: >-
      Monfragüe gilt als herausragendes Schulbeispiel für appalachisches Relief. Das Prinzip ist bestechend:
      Schichten verwitterungsresistenter Quarzite und Sandsteine wechsellagern mit brüchigem Schiefer. Die
      harten Gesteine bilden schroffe Härtlingsrücken; die weicheren Gesteine wurden zu Tälern ausgeräumt, in
      die sich die Flussschlingen tief eingeschnitten haben. Aus diesem Grund zwängt sich der Tajo beim
      Durchbruch durch den Felssporn Salto del Gitano, eine jener riesigen Felspforten («portillas»), die den
      Zugang zum Park markieren.


      Auf diesem Gesteinsgerüst breiten sich drei Hauptlebensräume aus: der mediterrane Wald und die
      Dehesa-Hainfluren, zerklüftete Quarzitfelsen sowie Flüsse und Stauseen. In den Dehesas bestimmen
      Steineichen, Korkeichen und Portugiesische Eichen das Bild; im Buschwald wachsen Zistrosen, Baumheide
      und Erdbeerbäume so dicht, dass die Hänge schier undurchdringlich sind. An den Felswänden klammern sich
      Wacholder und Terpentin-Pistazie fest, während Schwarzerlen und Zürgelbäume die Ufer säumen.


      Manche Baumgestalten besitzen Berühmtheit. Nahe Villarreal de San Carlos ragt der Zürgelbaum des Huerto
      del Ojaranzo achtzehn Meter empor. Und am alten Weg nach Serrejón steht die Korkeiche Abuelo de El
      Toril, ein uralter Riese von mehr als vierhundert Jahren.
    wildlife: >-
      Über 200 Wirbeltierarten pflanzen sich im Park fort, während andere hier überwintern oder durchziehen.
      Vögel beherrschen den Luftraum. Der [Mönchsgeier](/especie/aegypius_monachus/) zählt 286 Brutpaare, der
      [Spanische Kaiseradler](/especie/aquila_adalberti/) 12 und der [Schwarzstorch](/especie/ciconia_nigra/)
      30 Paare; es gibt zwischen 500 und 600 Paare des [Gänsegeiers](/especie/gyps_fulvus/), 35 des
      [Schmutzgeiers](/especie/neophron_percnopterus/), 7 des [Habichtsadlers](/especie/aquila_fasciata/) und
      6 des [Steinadlers](/especie/aquila_chrysaetos/), flankiert vom [Uhu](/especie/bubo_bubo/).


      Der eindrucksvollste Beobachtungspunkt ist der Salto del Gitano. Von dort erblickt man unzählige
      Greifvögel; besonders hervorzuheben ist der Schwarzstorch, der in Felsnischen oberhalb der Flussschleife
      nistet und seine Jungen füttert. Die Straße durch den Park ermöglicht den Zugang zu jeder Tages- und
      Jahreszeit.


      Unter den Säugetieren leben [Fischotter](/especie/lutra_lutra/), Ichneumon, Steinmarder,
      [Wildkatze](/especie/felis_silvestris/), Dachs und [Kleinfleck-Ginsterkatze](/especie/genetta_genetta/);
      der Rotfuchs ist das häufigste Raubtier, neben reichem Vorkommen von Hirschen,
      [Wildschweinen](/especie/sus_scrofa/) und Wildkaninchen. Reptilien sind mit Eidechsennatter,
      Hufeisennatter und Perleidechse vertreten.


      Der Herbst bringt den markantesten Klang des Jahres. Ende September setzt die Brunft des
      [Rothirsches](/especie/cervus_elaphus/) ein, eine der seltenen Gelegenheiten, mächtige Hirsche im
      Freiland zu beobachten. Mit zunehmender Kühle hallen Röhren durch Wald und Dehesas. Die Kälber kommen im
      Mai nach acht Monaten Tragzeit zur Welt: meist ein oder zwei Jungtiere.
    visit: >-
      Beginne in Villarreal de San Carlos. Das Besucherzentrum gibt Auskunft über Wanderwege, während das
      Naturkundezentrum geologische Entstehung und Kulturgeschichte vermittelt. Das Tierpräparate-Zentrum
      veranschaulicht Lebensräume an Felsen, Flussläufen und Dehesas. Nördlich liegt das Besucherzentrum
      «Jesús Garzón» mit Kinosaal, Modellen und einem 1 km langen Naturlehrpfad zu Fauna und Flora.


      Für Wanderer stehen markierte Routen bereit. Die rote Route ist der längste Binnenweg: 16 km, mittlere
      Schwierigkeit, aufgeteilt in drei Rundabschnitte zu den berühmtesten Landmarken. Der grüne Rundweg über
      7,9 km (leichte Anforderung) folgt dem Malvecino-Bach und dem Cerro Gimio. Die gelbe Route misst 8,9 km
      und führt gemächlich zum Aussichtspunkt La Tajadilla durch Weideland und Gärten.


      Wer Führung wünscht, kann kostenlose Ranger-Touren und Vogelbeobachtungen an den Aussichtspunkten La
      Tajadilla, Salto del Gitano und Portilla del Tiétar nutzen; sie finden von März bis Juni und im Oktober
      nach Voranmeldung statt. Für Geologie-Interessierte bietet eine 39 km lange Asphalt-Fahrroute für Auto
      oder Fahrrad neun Schautafeln.


      Der reine Nachthimmel bietet einen weiteren Anreiz: 2011 wurde Monfragüe für das
      Starlight-Qualitätssiegel vorgeschlagen.
    history: >-
      Der Name geht auf die Römer zurück: Monsfragorum, der zerklüftete Berg, beschrieb das raue Gelände.
      Unter arabischer Herrschaft hieß die Gegend Al-Mofrag, «der Abgrund» oder «die Wegkreuzung». In
      prähistorischer Zeit hinterließen Ureinwohner Malereien in den Felsüberhängen.


      Der heutige Schutzstatus entsprang bürgerlichem Engagement. 1974 forderte Jesús Garzón erstmals die
      Unterschutzstellung von Monfragüe und erwirkte die Erklärung zum Naturpark. Villarreal de San Carlos war
      damals ein verfallenes Dorf; die Gebäude wurden erworben und für Besucher hergerichtet. 2003 erkannte
      die UNESCO das Biosphärenreservat an, eingebettet in ein Europäisches Vogelschutzgebiet.


      Das heutige Landschaftsbild verdankt seinen Charakter traditionellen Nutzungen wie extensiver
      Weidewirtschaft, Imkerei und Korkgewinnung.
    before: >-
      Der Park liegt im Norden von Cáceres im Dreieck zwischen Cáceres, Plasencia und Trujillo. Die braune
      (Serradilla), violette (Torrejón el Rubio) und schwarze Route (Barbaón) berühren Kernschutzzonen und
      erfordern eine Erlaubnis, die du mitführen musst. Geführte Exkursionen bedürfen vorheriger Buchung.
    around: >-
      Das [Monumento Natural Cueva de Castañar](/lugar/monumento-natural-cueva-de-castanar/) liegt rund 30 km
      entfernt. Weiter entfernt teilt der [Parque Nacional de Cabañeros](/lugar/parque-nacional-de-cabaneros/)
      mit Monfragüe Kaiseradler, Mönchsgeier und Schwarzstorch sowie alte mediterrane Wälder und
      Flusskorridore. [Sierra Morena Oriental y Despeñaperros](/lugar/sierra-morena-oriental---despenaperros/)
      versammelt dieselben drei Vogelarten zwischen Schluchten und Altholz.
  it:
    intro: >-
      Vi sono pochissimi luoghi al mondo dove puoi ammirare da vicino alcuni dei rapaci più ambiti senza
      allontanarti dalla carreggiata. Monfragüe è uno di questi. Due fiumi, il Tago e il Tiétar, solcano
      questo parco nazionale nella provincia di Cáceres, accogliendo tra le loro sponde la fascia ininterrotta
      di macchia e bosco mediterraneo più vasta e meglio preservata d'Europa. Divenne parco naturale nel 1979
      e fu proclamato parco nazionale nel marzo 2007.
    landscape: >-
      Monfragüe rappresenta uno degli esempi più limpidi al mondo di rilievo appalachiano. La struttura
      geologica è semplice: strati di rocce dure, quarziti e arenarie, si alternano a rocce tenere, le
      ardesie. Le prime formano i rilievi dorsali; le seconde si erodono originando vallate in cui scorre
      incassata la rete idrografica. Per questo il Tago, attraversando il parco, si infila nella gola del
      Salto del Gitano, una delle colossali porte rocciose («portillas») che introducono a Monfragüe.


      Su questa armatura litologica fioriscono tre habitat dominanti: il bosco e la macchia mediterranea con
      le dehesas, le falesie rocciose e gli specchi d'acqua di fiumi e invasi. Nella dehesa signoreggiano
      lecci, sughere e querce faginé; nel matorral cisti, eriche e corbezzoli crescono così compatti da
      rendere i versanti impenetrabili. Sugli speroni rocciosi attecchiscono ginepri e terebinti, lungo i
      corsi d'acqua prosperano ontani e bagolari, mentre nei settori più miti compare l'olivastro.


      Alcuni alberi hanno un valore storico. Presso Villarreal de San Carlos, il bagolaro dell'Huerto del
      Ojaranzo svetta per diciotto metri. Accanto al vecchio tracciato per Serrejón vive la sughera Abuelo de
      El Toril, un gigante millenario di oltre quattrocento anni.
    wildlife: >-
      Nel parco nidificano oltre 200 specie di vertebrati, mentre altre vi svernano o vi transitano durante i
      passi migratori. Gli uccelli sono i veri sovrani. L'[avvoltoio monaco](/especie/aegypius_monachus/)
      conta 286 coppie, l'[aquila imperiale iberica](/especie/aquila_adalberti/) 12 e la [cicogna
      nera](/especie/ciconia_nigra/) 30; si contano tra 500 e 600 coppie di [grifone](/especie/gyps_fulvus/),
      35 di [capovaccaio](/especie/neophron_percnopterus/), 7 di [aquila di
      Bonelli](/especie/aquila_fasciata/) e 6 di [aquila reale](/especie/aquila_chrysaetos/), oltre al [gufo
      reale](/especie/bubo_bubo/).


      Il colpo d'occhio migliore si coglie al Salto del Gitano. Da qui si osserva una moltitudine di rapaci,
      tra cui spicca la cicogna nera che nidifica negli anfratti rocciosi e alimenta i piccoli protetta dal
      fiume. La strada che taglia il parco consente di giungervi comodamente in ogni stagione.


      Tra i mammiferi si incontrano [lontra europea](/especie/lutra_lutra/), mangusta egiziana, faina, [gatto
      selvatico](/especie/felis_silvestris/), tasso e [genetta](/especie/genetta_genetta/); la volpe è il
      predatore più frequente, accanto a branchi di cervi, [cinghiali](/especie/sus_scrofa/) e conigli
      selvatici. I rettili annoverano il colubro lacertino, il colubro ferro di cavallo e la lucertola
      ocellata.


      L'autunno porta con sé l'evento sonoro più suggestivo. Negli ultimi giorni di settembre risuona il
      bramito del [cervo](/especie/cervus_elaphus/), un momento privilegiato per scorgere grandi maschi allo
      stato brado. Con l'aria fresca i versanti echeggiano di richiami. I cerbiatti nascono a maggio dopo otto
      mesi di gestazione: uno o due piccoli per nidiata.
    visit: >-
      Inizia il percorso da Villarreal de San Carlos. Il centro visitatori fornisce orientamento sugli
      itinerari, mentre il Centro di Interpretazione della Natura illustra la geologia e le tradizioni locali.
      Lo spazio didattico sulla fauna ricostruisce gli ambienti di falesia, fiume e dehesa. Verso nord sorge
      il Centro Visitatori Nord «Jesús Garzón», arricchito da una sala proiezioni, plastici e un sentiero
      didattico ad anello di 1 km con pannelli su flora e fauna.


      Per camminare vi sono vari percorsi autoguidati. La rotta rossa è la più estesa: 16 km, difficoltà
      media, suddivisa in tre anelli che toccano i punti più celebri. Quella verde, di 7,9 km e facile,
      costeggia il rio Malvecino e il cerro Gimio. La rotta gialla, di 8,9 km anch'essa agevole, porta al
      belvedere della Tajadilla tra muretti a secco e pascoli arborati.


      Se preferisci una visita guidata, il parco propone escursioni con educatori ambientali e punti di
      avvistamento con cannocchiali a La Tajadilla, al Salto del Gitano e a Portilla del Tiétar, gratuite su
      prenotazione da marzo a giugno e in ottobre. Per gli appassionati di geologia, un itinerario di 39 km su
      asfalto per auto o bici tocca nove fermate descrittive.


      Il cielo notturno straordinariamente terso offre un ulteriore motivo di visita: nel 2011 Monfragüe è
      stato candidato alla certificazione di riserva astronomica Starlight.
    history: >-
      Il toponimo deriva dal latino Monsfragorum, monte aspro e dirupato. Sotto i Mori prese il nome di
      Al-Mofrag, ossia «l'abisso» o «il bivio». In epoca preistorica i primi abitatori incisero pitture
      rupestri nei ripari sotto roccia.


      La salvaguardia moderna nacque dall'impegno di una singola figura: nel 1974 Jesús Garzón promosse la
      tutela di Monfragüe ottenendone l'istituzione a parco naturale. Villarreal de San Carlos era all'epoca
      un borgo semiabbandonato; i fabbricati vennero recuperati per accogliere i viaggiatori. Nel 2003
      l'UNESCO dichiarò la riserva della biosfera, integrata in una zona di protezione speciale per
      l'avifauna.


      L'equilibrio del territorio si deve alle economie rurali tradizionali come il pascolo brado,
      l'apicoltura e la decortica del sughero, la cui continuità è parte integrante della conservazione.
    before: >-
      Il parco è posizionato a nord di Cáceres, nel poligono compreso tra Cáceres, Plasencia e Trujillo. Gli
      itinerari marrone (Serradilla), viola (Torrejón el Rubio) e nero (Barbaón) attraversano zone a riserva
      integrale e richiedono un permesso nominativo da portare con sé. Le uscite guidate ornitologiche
      richiedono l'iscrizione telematica.
    around: >-
      Il [Monumento Natural Cueva de Castañar](/lugar/monumento-natural-cueva-de-castanar/) dista circa 30 km.
      Più lontano, il [Parque Nacional de Cabañeros](/lugar/parque-nacional-de-cabaneros/) condivide con
      Monfragüe aquila imperiale, avvoltoio monaco e cicogna nera, oltre a boschi vetusti e corsi d'acqua.
      [Sierra Morena Oriental y Despeñaperros](/lugar/sierra-morena-oriental---despenaperros/) accoglie le
      medesime tre specie tra gole rocciose e boschi maturi.
  pt:
    intro: >-
      Existem poucos recantos no mundo onde possas observar de perto algumas das aves mais emblemáticas sem
      saíres da berma da estrada. Monfragüe é um deles. Dois rios, o Tejo e o Tiétar, atravessam este parque
      nacional na província de Cáceres, abraçando a mancha contínua de bosque e matagal mediterrânico mais
      extensa e bem preservada da Europa. Foi classificado como parque natural em 1979 e elevado a parque
      nacional em março de 2007.
    landscape: >-
      Monfragüe constitui um dos exemplos mais nítidos de relevo apalachiano. A mecânica geológica é
      elementar: bancadas de rochas resistentes, quartzitos e arenitos, intercalam-se com rochas brandas, os
      xistos. As primeiras estruturam as cristas elevadas; as segundas desgastam-se em vales onde corre
      encaixada a rede hidrográfica. É por essa razão que o Tejo, ao cruzar o parque, se encosta ao Salto del
      Gitano, uma das monumentais gargantas ou «portillas» que dão passagem a Monfragüe.


      Sobre este esqueleto mineral estruturam-se três biótopos capitais: o bosque e mato mediterrânico com o
      montado, as escarpas quartzíticas e as massas de água fluviais e albufeiras. No montado imperam
      azinheiras, sobreiros e carvalhos-cerquinhos; nos matagais adensam-se estevas, urzes e medronheiros de
      tal modo que as encostas se tornam impenetráveis. Nas penedias sobressaem zimbros e cornicabras, ao
      longo dos rios alinham-se amieiros e lódãos, e nas encostas quentes surge o zambujeiro.


      Algumas árvores possuem valor singular. Perto de Villarreal de San Carlos, o lódão do Huerto del
      Ojaranzo atinge dezoito metros de altura. E junto ao caminho velho de Serrejón ergue-se o sobreiro
      Abuelo de El Toril, um espécime venerável com mais de quatrocentos anos.
    wildlife: >-
      Mais de 200 espécies de vertebrados nidificam no parque, acolhendo ainda migradores e invernantes. As
      aves dominam o espaço aéreo. O [abutre-preto](/especie/aegypius_monachus/) totaliza 286 casais, a
      [águia-imperial-ibérica](/especie/aquila_adalberti/) 12 e a [cegonha-preta](/especie/ciconia_nigra/) 30;
      registam-se entre 500 e 600 casais de [abutre-fouveiro](/especie/gyps_fulvus/), 35 de
      [abutre-do-egito](/especie/neophron_percnopterus/), 7 de [águia-de-bonelli](/especie/aquila_fasciata/) e
      6 de [águia-real](/especie/aquila_chrysaetos/), além do [bufo-real](/especie/bubo_bubo/).


      O miradouro do Salto del Gitano proporciona a vista mais imponente. Daí contempla-se uma miríade de aves
      rupícolas, destacando-se a cegonha-preta a nidificar nas fendas rochosas e a alimentar as crias junto ao
      rio. A estrada que cruza o parque permite chegar ao local em qualquer época do ano.


      Nos mamíferos destacam-se a [lontra-europeia](/especie/lutra_lutra/), o saca-rabos, a fuinha, o
      [gato-bravo](/especie/felis_silvestris/), o texugo e a [gineta](/especie/genetta_genetta/); a raposa é o
      carnívoro mais comum, sendo abundantes os veados, [javalis](/especie/sus_scrofa/) e coelhos-bravos.
      Entre os répteis avultam a cobra-rateira, a cobra-de-ferradura e o sardão.


      O outono transporta a sonoridade mais marcante. No final de setembro ecoa a brama do
      [veado-vermelho](/especie/cervus_elaphus/), momento singular para admirar os machos adultos. Com as
      primeiras noites frescas, serras e montados enchem-se de bramidos. As crias nascem em maio após oito
      meses de gestação: um ou dois filhotes.
    visit: >-
      Começa por Villarreal de San Carlos. O centro de acolhimento fornece mapas dos trilhos, enquanto o
      Centro de Interpretação da Natureza detalha o relevo e o património rural. O espaço de fauna exibe
      dioramas didáticos dedicados a escarpas, rios e montados. Mais a norte situa-se o Centro de Visitantes
      Norte «Jesús Garzón», com sala de projeções, maquetas e um percurso pedestre interpretativo de 1 km com
      painéis de fauna e flora.


      Para caminhar tens percursos autoguiados. A rota vermelha é a mais extensa: 16 km, dificuldade média,
      desenhada em três troços circulares que passam pelos marcos principais. A rota verde, de 7,9 km e nível
      fácil, percorre a ribeira de Malvecino e o cerro Gimio. A rota amarela, de 8,9 km, conduz ao miradouro
      da Tajadilla entre hortas e montados.


      Caso prefiras apoio especializado, o parque disponibiliza rotas com educadores ambientais e pontos de
      observação de aves na Tajadilla, Salto del Gitano e Portilla del Tiétar, gratuitas mediante inscrição de
      março a junho e em outubro. Para o visitante interessado em geologia, uma rota temática de 39 km por
      estrada para carro ou bicicleta contempla nove paragens explicativas.


      A obscuridade do céu noturno oferece outro atrativo: em 2011 Monfragüe foi proposto para o galardão de
      destino turístico Starlight.
    history: >-
      A designação provém do latim Monsfragorum, monte fragoso e acidentado. Sob domínio islâmico denominou-se
      Al-Mofrag, «o abismo» ou «o cruzamento». Na Pré-história, as primeiras comunidades gravaram pinturas nas
      grutas das serras.


      A preservação contemporânea deve-se à iniciativa individual: em 1974, Jesús Garzón liderou a campanha
      para salvar Monfragüe, obtendo a classificação como Parque Natural. Villarreal de San Carlos era então
      um lugarejo arruinado; as construções foram recuperadas para receber os viajantes. Em 2003 a UNESCO
      formalizou a Reserva da Biosfera, integrada em Zona de Proteção Especial para Aves.


      A paisagem vive das práticas rurais extensivas como o pastoreio tradicional, a apicultura e a tiragem de
      cortiça, cruciais para a sua salvaguarda.
    before: >-
      O parque situa-se no norte de Cáceres, no triângulo formado por Cáceres, Plasencia e Trujillo. Os
      percursos castanho (Serradilla), roxo (Torrejón el Rubio) e preto (Barbaón) atravessam zonas de reserva
      estrita e requerem uma autorização prévia que deves transportar. As saídas guiadas de observação exigem
      reserva online.
    around: >-
      O [Monumento Natural Cueva de Castañar](/lugar/monumento-natural-cueva-de-castanar/) fica a cerca de 30
      km. Mais longe, o [Parque Nacional de Cabañeros](/lugar/parque-nacional-de-cabaneros/) partilha com
      Monfragüe a águia-imperial-ibérica, o abutre-preto e a cegonha-preta, além de matas maduras e corredores
      fluviais. [Sierra Morena Oriental y Despeñaperros](/lugar/sierra-morena-oriental---despenaperros/) reúne
      as mesmas três espécies em gargantas rochosas e matas vetustas.
