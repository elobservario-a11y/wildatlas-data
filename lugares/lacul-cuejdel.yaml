resumen:
  es: >-
    El lago de presa natural por deslizamiento más grande de Rumanía (creado entre 1978 y 1991), con troncos
    de árboles petrificados emergiendo del agua.
  en: >-
    Romania's largest natural landslide dam lake (formed between 1978 and 1991), featuring petrified tree
    trunks emerging from the water.
  fr: >-
    Le plus grand lac de barrage naturel par glissement de terrain de Roumanie (formé entre 1978 et 1991),
    avec des troncs d'arbres pétrifiés émergeant de l'eau.
  de: >-
    Rumäniens größter natürlicher Erdrutschdammsee (entstanden zwischen 1978 und 1991), aus dessen Wasser
    versteinerte Baumstämme ragen.
  it: >-
    Il più grande lago di sbarramento naturale da frana della Romania (formatosi tra il 1978 e il 1991), con
    tronchi d'albero pietrificati che affiorano dall'acqua.
  pt: >-
    O maior lago de barragem natural por deslizamento da Roménia (formado entre 1978 e 1991), com troncos de
    árvores petrificados a emergir da água.
unico:
  es: Un lago de montaña que no existía antes de 1978 y que debe su cubeta a una ladera que se cayó.
  en: A mountain lake that did not exist before 1978, owing its basin to a collapsed mountainside.
  fr: >-
    Un lac de montagne qui n'existait pas avant 1978 et qui doit sa cuvette à l'effondrement d'un versant
    entier.
  de: Ein Gebirgssee, der vor 1978 nicht existierte und sein Becken einem abgerutschten Berghang verdankt.
  it: >-
    Un lago montano inesistente prima del 1978, che deve il proprio bacino al collasso di un intero versante
    montuoso.
  pt: >-
    Um lago de montanha que não existia antes de 1978 e que deve a sua bacia ao colapso de uma encosta
    inteira.
observaciones:
  es: >-
    El reglamento prohíbe entrar en el perímetro protegido de los sitios de interés geológico sin el permiso
    de acceso del custodio, así que pregunta al gestor las condiciones de visita antes de salir. La reserva
    está a veintiún kilómetros de Piatra Neamț. Cuenta con entre media jornada y un día.
texto:
  es:
    intro: >-
      Hasta 1978 aquí había un valle. Entonces la ladera izquierda del arroyo Cuejdel empezó a deslizarse, una
      y otra vez, y a taponar el curso. En 1991 un segundo corrimiento, probablemente provocado por el
      terremoto de 1990 y las lluvias intensas del año siguiente, bloqueó el valle entero y dejó una gran
      cantidad de agua detrás. Así nació el lago Cuejdel, también llamado lago de la Cruz, en los montes
      Stânișoarei, junto a Piatra Neamț: uno de los mayores lagos de presa natural de Rumanía y un lago joven,
      cuyo terreno aún no se ha estabilizado del todo.
    landscape: >-
      Visto de cerca, el lago es largo y estrecho. Las mediciones recogidas le dan poco más de un kilómetro de
      largo, 13,95 hectáreas de superficie, una profundidad máxima de 16,45 metros y una altitud de 669
      metros. Lo cierra una presa natural de entre 25 y 30 metros de altura y unos 80 metros de longitud, y el
      agua sale por una abertura de unos tres metros entre la presa y la ladera derecha. Aguas abajo hay otras
      cuatro lagunas pequeñas, de unos cientos de metros cuadrados, en los escalones que dejaron los
      corrimientos.


      Alrededor, la cuenca está cerrada por montes como el Tarnițelor, de 1.081 metros, al norte, y el
      Muncelul, de 1.067 metros, al este. El paisaje combina lomas, bosques caducifolios, pastos y rebaños de
      ovejas, y la zona está cubierta de bosques de haya pura que alternan con abeto rojo. El agua se
      clasifica en la primera clase de calidad y es oligosaprobia, con tendencia a mesotrófica, y allí se creó
      un microclima propio y una vegetación característica de ambientes lacustres.
    wildlife: >-
      El clima es de montaña baja: la temperatura media anual ronda los 7,5-8 grados y caen unos 650
      milímetros de precipitación al año. Los meses recomendados van de mayo a octubre.


      El reglamento de visita de la zona protege a todos los habitantes del lago: está prohibido recolectar,
      capturar, matar o dañar ejemplares de plantas y animales silvestres protegidos en su medio natural, y
      recoger flores y frutos o cortar y arrancar esas plantas. También se prohíbe molestar a propósito a las
      aves durante la cría, el crecimiento y la migración.
    visit: >-
      Cuejdel es un destino para caminantes que buscan un entorno silvestre. Hay dos maneras de llegar. Una
      sigue en coche el valle del Cracău desde Crăcăoani hasta la aldea de Cracăul Negru, y de ahí un tramo
      por el bosque lleva al lago, unos cuarenta kilómetros en total. La otra combina coche hasta la aldea de
      Cuiejdiu con una caminata de unos veinte kilómetros por la divisoria de aguas hasta la orilla derecha
      del lago.


      En la orilla, tres miradores de madera sobre pedestales vigilan otras tantas esquinas del lago.
    history: >-
      El lago es obra del hombre más de lo que parece. La causa principal de los corrimientos es humana: las
      talas de la ladera izquierda, sobre todo entre 1950 y 1960. La construcción de la antigua pista forestal
      cortó la base de la ladera y desencadenó el primer corrimiento, y una pista nueva, en 2003-2004, provocó
      otros. El terreno no está del todo estabilizado y podría reactivarse si continúan las talas.


      La protección empezó a impulsarse en el año 2000, con un equipo de doce investigadores de Iași y del
      museo de ciencias naturales de Piatra Neamț. En 2004 un decreto del Gobierno declaró el lago reserva
      natural, y el Consejo Comarcal de Neamț y el municipio vecino ejecutaron después un proyecto de gestión
      con fondos de la Unión Europea, cuyo plan aprobó el Ministerio de Medio Ambiente. La reserva abarca solo
      la lámina de agua y la zona del corrimiento, sin zona de amortiguación, por lo que las talas de los
      alrededores amenazan el ecosistema. La erosión junto a la pista y las talas masivas colmataron el lago
      en un tiempo sorprendentemente corto; por la colmatación, hoy ya no es el mayor lago de presa natural
      del país en volumen de agua: lo supera el Lacul Roșu.
    before: >-
      El reglamento prohíbe entrar en el perímetro protegido de los sitios de interés geológico sin el permiso
      de acceso del custodio, así que pregunta al gestor las condiciones de visita antes de salir. La reserva
      está a veintiún kilómetros de Piatra Neamț. Cuenta con entre media jornada y un día.
    around: >-
      A diecisiete kilómetros queda el [Parque Nacional Ceahlău - Macizo
      Forestal](/lugar/parcul-national-ceahlau---masivul-forestier/).
  en:
    intro: >-
      Until 1978, this was simply an ordinary mountain valley. Then the left flank of the Cuejdel brook began
      to slump repeatedly, choking the watercourse. In 1991, a second massive landslide—likely triggered by
      the 1990 earthquake and torrential rains the following year—completely dammed the valley, impounding an
      enormous volume of water. Thus Lake Cuejdel was born, also known as the Lake of the Cross, in the
      Stânișoarei Mountains near Piatra Neamț: one of Romania's largest natural dam lakes and a young body of
      water whose slopes have yet to fully settle.
    landscape: >-
      Seen up close, the lake is elongated and narrow. Recorded measurements credit it with just over one
      kilometer in length, 13.95 hectares of surface area, a maximum depth of 16.45 meters, and an elevation
      of 669 meters. It is held back by a natural earthen barrier between 25 and 30 meters high and around 80
      meters long, with overflow escaping through an outlet roughly three meters wide between the dam and the
      right valley wall. Downstream, four smaller lagoons of a few hundred square meters occupy terraced slump
      scars left by the landslips.


      The catchment is enclosed by peaks including Mount Tarnițelor (1,081 meters) to the north and Mount
      Muncelul (1,067 meters) to the east. The landscape weaves together rolling ridges, broadleaf woodlands,
      upland pastures, and grazing sheep, with the basin cloaked in pure beech forests alternating with Norway
      spruce. The water ranks in the first quality class and is oligosaprobic tending toward mesotrophic,
      having fostered its own microclimate and distinct lacustrine flora.
    wildlife: >-
      The climate is characteristic of lower montane belts: the mean annual temperature hovers around 7.5-8
      degrees, with roughly 650 millimeters of annual precipitation. Recommended visiting months run from May
      to October.


      Reserve regulations protect all lacustrine inhabitants: gathering, capturing, killing, or harming
      protected wild plants and animals in their natural habitat is prohibited, as is picking flowers,
      collecting fruit, or uprooting vegetation. Intentionally disturbing birds during nesting, rearing, and
      migration periods is likewise forbidden.
    visit: >-
      Cuejdel appeals to hikers seeking an untouched natural setting. There are two principal approaches. One
      follows the Cracău valley by car from Crăcăoani to the village of Cracăul Negru, from where a forest
      trail leads to the lake—around forty kilometers in total. The other combines driving to the village of
      Cuiejdiu with an approximate twenty-kilometer ridge walk along the watershed to the right bank of the
      lake.


      Along the lakeshore, three elevated wooden viewing platforms keep watch over different corners of the
      water.
    history: >-
      The lake owes its existence to human intervention more than it might seem. The primary cause of the
      slope instability was anthropogenic: intensive clear-cutting of the left bank, particularly between 1950
      and 1960. Construction of an old logging road undercut the slope toe and triggered the initial collapse,
      while a new logging track built in 2003-2004 set off further slides. The hillsides remain unstable and
      could reactivate if deforestation continues.


      Conservation efforts gained momentum in 2000, led by a team of twelve researchers from Iași and the
      natural sciences museum of Piatra Neamț. In 2004, a government decree established the lake as a nature
      reserve, followed by an EU-funded management project executed by the Neamț County Council and the local
      municipality under an environment ministry plan. The reserve encompasses only the open water and slide
      area without a buffer zone, leaving surrounding commercial felling as an ongoing threat. Trackside
      erosion and heavy logging caused rapid siltation; due to sediment buildup, it is no longer the country's
      largest landslide lake by water volume, having been surpassed by Lacul Roșu.
    before: >-
      Regulations prohibit entering the protected perimeter of geological sites without written access
      authorization from the managing body, so check visiting conditions with the administration before
      setting out. The reserve lies twenty-one kilometers from Piatra Neamț. Allow between half a day and a
      full day.
    around: >-
      To the southwest, twenty-one kilometers away, stands [Ceahlău National
      Park](/lugar/parcul-national-ceahlau---masivul-forestier/).
  fr:
    intro: >-
      Jusqu'en 1978, il n'y avait ici qu'un vallon ordinaire. C'est alors que le versant gauche du ruisseau
      Cuejdel commença à glisser par à-coups successifs, obstruant l'écoulement. En 1991, un second glissement
      massif, vraisemblablement provoqué par le séisme de 1990 et les pluies diluviennes de l'année suivante,
      barra entièrement la vallée en retenant une immense masse d'eau. Ainsi naquit le lac Cuejdel, également
      nommé lac de la Croix, dans les monts Stânișoarei près de Piatra Neamț : l'un des plus vastes lacs de
      barrage naturel de Roumanie, un plan d'eau encore jeune dont les versants n'ont pas totalement trouvé
      leur équilibre.
    landscape: >-
      Vu de près, le lac se présente long et étroit. Les relevés lui attribuent un peu plus d'un kilomètre de
      longueur, 13,95 hectares de superficie, une profondeur maximale de 16,45 mètres et une altitude de 669
      mètres. Il est retenu par une digue naturelle de 25 à 30 mètres de hauteur sur environ 80 mètres de
      long, l'exutoire s'écoulant par une brèche d'environ trois mètres entre le barrage et le flanc droit. En
      aval, quatre petites lagunes de quelques centaines de mètres carrés s'étagent sur les replats créés par
      les glissements.


      Le bassin versant est ceinturé par des sommets comme le mont Tarnițelor (1 081 mètres) au nord et le
      Muncelul (1 067 mètres) à l'est. Le paysage marie collines, forêts feuillues, alpages et troupeaux
      d'ovins, le vallon étant tapissé de hêtraies pures alternant avec l'épicéa commun. L'eau relève de la
      première classe de qualité, oligosaprobe tendant vers le mésotrophe, ayant généré un microclimat propre
      et une flore lacustre adaptée.
    wildlife: >-
      Le climat est de basse montagne : la température moyenne annuelle avoisine 7,5-8 degrés et les
      précipitations atteignent environ 650 millimètres par an. La période recommandée va de mai à octobre.


      Le règlement protège l'ensemble de la faune et de la flore : il est interdit de prélever, capturer, tuer
      ou détériorer les spécimens d'espèces sauvages protégées, de cueillir des fleurs ou des fruits et
      d'arracher des plantes. Il est également défendu de troubler intentionnellement les oiseaux pendant la
      nidification, l'élevage des poussins et la migration.
    visit: >-
      Cuejdel attire les marcheurs en quête d'espaces préservés. Deux voies d'accès principales existent.
      L'une remonte en voiture la vallée du Cracău depuis Crăcăoani jusqu'au hameau de Cracăul Negru, d'où un
      sentier forestier gagne le lac, soit une quarantaine de kilomètres au total. L'autre combine la route
      jusqu'à Cuiejdiu et une randonnée sur la ligne de crête d'environ vingt kilomètres jusqu'à la rive
      droite du lac.


      Sur les berges, trois belvédères en bois surélevés permettent d'admirer les différentes anses du plan
      d'eau.
    history: >-
      Ce lac doit à l'activité humaine bien plus qu'on ne l'imagine. La cause première des glissements de
      terrain est anthropique : les coupes à blanc sur le flanc gauche, particulièrement entre 1950 et 1960.
      Le percement d'une ancienne piste forestière a sapé la base du versant et provoqué le premier
      effondrement, tandis qu'une nouvelle piste tracée en 2003-2004 en a déclenché d'autres. Le terrain
      demeure instable et pourrait se réactiver en cas de nouvelles déforestations.


      La démarche de protection a été initiée en 2000 par une équipe de douze chercheurs de Iași et du musée
      des sciences naturelles de Piatra Neamț. En 2004, un décret gouvernemental a érigé le lac en réserve
      naturelle, suivi d'un programme de gestion mené avec le concours de fonds européens par le Conseil
      départemental de Neamț et la commune riveraine. La réserve n'englobe que la nappe d'eau et la zone de
      glissement sans périmètre tampon, laissant les coupes avoisinantes menacer l'écosystème. L'érosion le
      long des pistes et l'exploitation forestière ont entraîné un atterrissement rapide ; en raison de ce
      comblement, il n'est plus le premier lac de barrage naturel du pays en volume d'eau, dépassé désormais
      par le Lacul Roșu.
    before: >-
      Le règlement interdit de pénétrer dans le périmètre protégé des sites d'intérêt géologique sans
      autorisation écrite préalable du gestionnaire : renseignez-vous sur les conditions d'accès avant de
      partir. La réserve se trouve à vingt et un kilomètres de Piatra Neamț. Comptez entre une demi-journée et
      une journée complète.
    around: >-
      Au sud-ouest, à vingt et un kilomètres, se dresse le [Parc national de
      Ceahlău](/lugar/parcul-national-ceahlau---masivul-forestier/).
  de:
    intro: >-
      Bis 1978 lag hier ein gewöhnliches Bergtal. Dann geriet die linke Talflanke des Cuejdel-Bachs wiederholt
      ins Rutschen und blockierte den Abfluss. 1991 staute ein zweiter gewaltiger Bergrutsch—vermutlich
      ausgelöst durch das Erdbeben von 1990 und sintflutartige Regenfälle im Folgejahr—das Tal vollständig ab
      und schuf ein tiefes Gewässer. So entstand der Cuejdel-See, auch Kreuzsee genannt, in den
      Stânișoara-Bergen bei Piatra Neamț: einer der größten natürlichen Stauseen Rumäniens und ein geologisch
      junges Gebilde, dessen Hänge noch keineswegs zur Ruhe gekommen sind.
    landscape: >-
      Aus der Nähe wirkt der See lang gestreckt und schmal. Messungen belegen eine Länge von gut einem
      Kilometer, 13,95 Hektar Wasserfläche, eine Maximaltiefe von 16,45 Metern und eine Lage auf 669 Metern
      Höhe. Aufgestaut wird er durch einen natürlichen Fels- und Erddamm von 25 bis 30 Metern Höhe und rund 80
      Metern Länge, während das Wasser über eine etwa drei Meter breite Überlaufkerbe zwischen Damm und
      rechter Flanke abfließt. Talabwärts liegen vier kleinere Weiher von wenigen hundert Quadratmetern auf
      den Terrassenstufen der Erdrutsche.


      Das Einzugsgebiet wird von Gipfeln wie dem Tarnițelor (1.081 Meter) im Norden und dem Muncelul (1.067
      Meter) im Osten eingerahmt. Die Landschaft vereint sanfte Bergrücken, Laubmischwälder, Schafweiden und
      ausgedehnte reine Buchenbestände im Wechsel mit Fichten. Das Gewässer weist höchste Gewässergüte auf,
      ist oligosaprob mit mesotropher Tendenz und hat ein eigenes Mikroklima samt typischer Ufervegetation
      hervorgebracht.
    wildlife: >-
      Das Klima entspricht der montanen Mittelgebirgsstufe: Die Jahresmitteltemperatur liegt bei 7,5-8 Grad
      und die Niederschläge belaufen sich auf rund 650 Millimeter pro Jahr. Empfohlen werden die Monate von
      Mai bis Oktober.


      Die Schutzgebietsordnung stellt die gesamte Tier- und Pflanzenwelt unter Schutz: Das Sammeln, Fangen,
      Töten oder Beschädigen geschützter Arten in ihrem Lebensraum ist verboten, ebenso das Pflücken von
      Blumen, Früchten oder das Ausgraben von Wurzeln. Vorsätzliche Störungen der Vogelwelt während Brut,
      Aufzucht und Zugzeit sind streng untersagt.
    visit: >-
      Der Cuejdel ist ein Ziel für Wanderer, die ursprüngliche Einsamkeit schätzen. Zwei Wege führen hin.
      Einer folgt dem Cracău-Tal per Pkw von Crăcăoani bis zum Weiler Cracăul Negru, von wo ein Waldpfad zum
      See führt—insgesamt rund vierzig Kilometer. Die zweite Route verbindet die Anfahrt nach Cuiejdiu mit
      einer etwa zwanzig Kilometer langen Kammwanderung über die Wasserscheide bis ans rechte Seeufer.


      Am Ufer erheben sich drei hölzerne Aussichtsplattformen auf Stelzen, die Blicke über verschiedene
      Seearme gewähren.
    history: >-
      Der See ist weit stärker Menschenwerk, als es den Anschein hat. Die Hauptursache der Hangrutschungen ist
      anthropogen: massive Abholzungen am linken Hang, vor allem zwischen 1950 und 1960. Der Bau eines alten
      Forstwegs schnitt den Hangfuß an und löste die erste Bewegung aus; eine neue Trasse in den Jahren
      2003-2004 fachte weitere Rutschungen an. Das Gelände ist nicht dauerhaft stabil und könnte bei
      anhaltenden Schlägerungen erneut abgleiten.


      Der Schutzgedanke formierte sich im Jahr 2000 durch zwölf Wissenschaftler aus Iași und dem
      Naturkundemuseum Piatra Neamț. 2004 erklärte ein Regierungsdekret das Gewässer zum Naturschutzgebiet;
      danach setzten der Kreisrat von Neamț und die Anrainergemeinde ein EU-gefördertes Schutzkonzept um. Das
      Schutzgebiet umfasst nur die Wasserfläche und die Rutschzone ohne Pufferzone, sodass Kahlschläge im
      Umfeld das Biotop bedrohen. Wegerosion und Abholzung führten zu rascher Verlandung; durch den
      Sedimenteintrag ist der Cuejdel gemessen am Wasservolumen nicht mehr der größte Erdrutschsee Rumäniens,
      sondern wurde vom Lacul Roșu überholt.
    before: >-
      Die Schutzgebietsordnung untersagt das Betreten der geologischen Zonen ohne schriftliche Genehmigung der
      Verwaltung; informiere dich vorab über die Zugangsbedingungen. Das Schutzgebiet liegt einundzwanzig
      Kilometer von Piatra Neamț entfernt. Plane zwischen einem halben und einem ganzen Tag ein.
    around: >-
      Einundzwanzig Kilometer südwestlich ragt der [Nationalpark
      Ceahlău](/lugar/parcul-national-ceahlau---masivul-forestier/) empor.
  it:
    intro: >-
      Fino al 1978 qui si apriva una semplice valle montana. Poi il versante sinistro del torrente Cuejdel
      iniziò a franare a più riprese, ostruendo il corso d'acqua. Nel 1991 un secondo imponente
      smottamento—favorito dal terremoto del 1990 e dalle piogge insistenti dell'anno seguente—sbarrò
      completamente la valle trattenendo un'enorme massa d'acqua. Nacque così il lago Cuejdel, detto anche
      lago della Croce, sui monti Stânișoarei vicino a Piatra Neamț: uno dei maggiori laghi di frana della
      Romania e un bacino giovane, i cui pendii non hanno ancora raggiunto una stabilità definitiva.
    landscape: >-
      Osservato da vicino, il lago appare lungo e stretto. I rilevamenti gli attribuiscono poco più di un
      chilometro di sviluppo, 13,95 ettari di superficie, una profondità massima di 16,45 metri e una quota di
      669 metri. È trattenuto da uno sbarramento naturale tra 25 e 30 metri d'altezza e circa 80 metri di
      lunghezza, mentre il deflusso avviene da un varco di circa tre metri tra la frana e il versante destro.
      A valle si scaglionano altri quattro piccoli specchi d'acqua di poche centinaia di metri quadrati,
      adagiati sui terrazzi di scivolamento.


      Il bacino è racchiuso da vette quali il monte Tarnițelor (1.081 metri) a nord e il Muncelul (1.067
      metri) a est. Il paesaggio armonizza alture boscose, latifoglie, pascoli e greggi, con una copertura di
      faggete pure frammiste ad abeti rossi. L'acqua vanta una qualità di prima classe ed è oligosaprobia
      tendente al mesotrofico, avendo generato un proprio microclima e una rigogliosa vegetazione ripariale.
    wildlife: >-
      Il clima è tipico della media montagna: la temperatura media annua si attesta attorno a 7,5-8 gradi con
      circa 650 millimetri di precipitazioni l'anno. Il periodo migliore per la visita va da maggio a ottobre.


      Il regolamento tutela la fauna e la flora del bacino: è vietato raccogliere, catturare, abbattere o
      danneggiare specie protette nel loro ambiente naturale, cogliere fiori o frutti ed estirpare arbusti. È
      severamente proibito arrecare disturbo all'avifauna nei periodi di nidificazione, allevamento dei
      piccoli e migrazione.
    visit: >-
      Il Cuejdel attrae camminatori in cerca di solitudine e natura intatta. Si contano due vie d'accesso. La
      prima risale in auto la valle del Cracău da Crăcăoani fino alla frazione di Cracăul Negru, da cui una
      pista forestale conduce al lago per una quarantina di chilometri complessivi. La seconda unisce il
      tragitto su gomma fino a Cuiejdiu a una camminata in cresta di circa venti chilometri sullo spartiacque
      fino alla sponda destra.


      Lungo la riva, tre capanni panoramici in legno su palafitta sorvegliano diversi angoli dello specchio
      d'acqua.
    history: >-
      Il lago è frutto dell'azione dell'uomo più di quanto sembri. La causa primaria degli smottamenti è
      antropica: i tagli a raso del bosco sul versante sinistro, soprattutto tra il 1950 e il 1960. Lo scavo
      di una vecchia pista forestale intaccò il piede del pendio innescando la prima frana, mentre un nuovo
      tracciato nel 2003-2004 ne causò di ulteriori. Il terreno resta instabile e potrebbe riattivarsi in caso
      di nuovi disboscamenti.


      La salvaguardia prese avvio nel 2000 per opera di dodici ricercatori di Iași e del museo di scienze
      naturali di Piatra Neamț. Nel 2004 un decreto governativo istituì la riserva naturale, seguita da un
      piano di gestione con fondi europei promosso dal Consiglio provinciale di Neamț e dal comune limitrofo.
      La riserva protegge unicamente lo specchio d'acqua e l'area di frana senza zona cuscinetto, lasciando i
      tagli forestali limitrofi come minaccia costante. L'erosione delle piste e i disboscamenti hanno causato
      un rapido interrimento; a causa dei sedimenti accumulati, oggi il lago non è più il primo del paese per
      volume idrico, superato dal Lacul Roșu.
    before: >-
      Il regolamento vieta l'accesso all'area protetta dei siti di interesse geologico senza espressa
      autorizzazione del gestore: informati prima sulle condizioni di visita. La riserva dista ventuno
      chilometri da Piatra Neamț. Prevedi tra mezza giornata e un'intera giornata.
    around: >-
      A ventuno chilometri a sud-ovest si erge il [Parco Nazionale
      Ceahlău](/lugar/parcul-national-ceahlau---masivul-forestier/).
  pt:
    intro: >-
      Até 1978 existia aqui apenas um vale vulgar. Foi então que a encosta esquerda da ribeira de Cuejdel
      começou a ceder repetidamente, obstruindo o curso de água. Em 1991, um segundo desabamento em grande
      escala—favorecido pelo sismo de 1990 e pelas chuvadas intensas do ano seguinte—bloqueou integralmente o
      vale, represando um considerável volume de água. Nasceu assim o lago Cuejdel, igualmente chamado lago da
      Cruz, nas montanhas Stânișoarei junto a Piatra Neamț: um dos maiores lagos de represa natural da Roménia
      e um corpo aquático jovem, cujas vertentes ainda não estabilizaram por completo.
    landscape: >-
      Observado de perto, o lago apresenta-se comprido e estreito. As medições oficiais atribuem-lhe pouco
      mais de um quilómetro de extensão, 13,95 hectares de superfície, uma profundidade máxima de 16,45 metros
      e uma altitude de 669 metros. É contido por uma barreira natural entre 25 e 30 metros de altura e cerca
      de 80 metros de comprimento, escoando o excesso hídrico por uma fenda de cerca de três metros entre o
      dique e a vertente direita. A jusante sucedem-se outras quatro pequenas lagoas de escassas centenas de
      metros quadrados, instaladas nos patamares abertos pelas derrocadas.


      A bacia hidrográfica é rematada por cumes como o monte Tarnițelor (1.081 metros) a norte e o Muncelul
      (1.067 metros) a leste. A paisagem combina lombas onduladas, matas caducifólias, pastos e rebanhos,
      encontrando-se a bacia coberta por faiais puros em alternância com espruces. A água enquadra-se na
      primeira classe de qualidade, sendo oligossapróbia com tendência a mesotrófica, tendo originado um
      microclima próprio e uma vegetação lacustre característica.
    wildlife: >-
      O clima é de montanha média: a temperatura média anual ronda os 7,5-8 graus e precipitam-se cerca de 650
      milímetros de chuva por ano. A época recomendada vai de maio a outubro.


      O regulamento da reserva protege todas as espécies: é proibido colher, capturar, matar ou danificar
      espécimes protegidos no seu habitat, apanhar flores ou frutos e arrancar plantas. É igualmente interdito
      perturbar deliberadamente as aves durante a nidificação, a criação e os períodos migratórios.
    visit: >-
      Cuejdel atrai caminhantes em busca de natureza intocada. Contam-se dois acessos principais. O primeiro
      segue em viatura pelo vale do Cracău a partir de Crăcăoani até à aldeia de Cracăul Negru, seguindo
      depois por caminho florestal até ao lago, num total de cerca de quarenta quilómetros. O segundo combina
      automóvel até Cuiejdiu com uma caminhada de cerca de vinte quilómetros pela cumeada até à margem direita
      do lago.


      Nas margens erguem-se três miradouros de madeira sobre estacas que dominam diferentes recantos da massa
      de água.
    history: >-
      O lago resulta da ação humana bem mais do que aparenta. O fator detonador dos deslizamentos foi
      antrópico: os cortes rasos de arvoredo na encosta esquerda, sobretudo entre 1950 e 1960. A abertura de
      um antigo caminho florestal descalçou o sopé da encosta provocando o primeiro colapso, enquanto uma nova
      pista aberta em 2003-2004 desencadeou outros. O terreno não se encontra perfeitamente consolidado e
      poderá reativar-se se prosseguirem as desmatações.


      A proteção arrancou no ano 2000 por iniciativa de doze investigadores de Iași e do museu de ciências
      naturais de Piatra Neamț. Em 2004 um diploma governamental classificou o lago como reserva natural,
      tendo o Conselho Distrital de Neamț e o município confinante implementado um plano de gestão
      cofinanciado pela União Europeia. A reserva abrange estritamente a massa de água e a cicatriz de
      deslizamento, sem faixa de proteção envolvente, pelo que os abates vizinhos ameaçam o equilíbrio
      ecológico. A erosão dos caminhos e as desmatações provocaram um assoreamento acelerado; por essa perda
      de profundidade, deixou de ser o maior lago de retenção natural do país em volume de água, ultrapassado
      pelo Lacul Roșu.
    before: >-
      O regulamento proíbe entrar no perímetro protegido dos sítios geológicos sem a autorização de acesso do
      gestor, pelo que deves consultar as condições de visita previamente. A reserva dista vinte e um
      quilómetros de Piatra Neamț. Reserva entre meio dia e um dia inteiro.
    around: >-
      A sudoeste, a vinte e um quilómetros, destaca-se o [Parque Nacional
      Ceahlău](/lugar/parcul-national-ceahlau---masivul-forestier/).
