texto:
  es:
    intro: >-
      En Kamešnica la frontera no es una línea en un mapa: es el filo de la montaña. Croacia y Bosnia y
      Herzegovina se reparten esta prolongación de la cordillera Dinara, que se alza entre Sinj, en la Zagora,
      y Livno, en Završje. La cresta con las cumbres más altas, Konj, de 1856 metros, y Kurljaj, de 1809,
      queda en Bosnia y Herzegovina; en el lado croata destacan Divov brig y Glavaš, y por ese lado se sube
      hasta la cresta.
    landscape: >-
      Kamešnica es caliza en bruto: dolinas, cuevas, hondonadas y mesetas de origen geotectónico, y un macizo
      que se extiende desde el paso de Vaganj hasta el lago artificial de Buško Blato. Las cumbres están
      peladas, y por eso la fauna es modesta pero el paisaje, enorme. Desde la cima se ve el campo de Sinj y
      el resto de Dalmacia y, con buen tiempo, el Adriático y sus islas.


      La clave está en el clima. La montaña cae entre dos regiones climáticas: al norte, el continental, junto
      al campo de Livno, a unos 700 metros y con una temperatura media anual de 9 °C; al sur, el
      submediterráneo, junto al campo de Sinj, a unos 300 metros y doce grados y medio. Llueve entre 1200 y
      2500 milímetros al año, con el máximo en Konj, Kurljaj, Burnjaca y Gareta, y la nieve cubre la mayoría
      de las cumbres entre seis y siete meses al año.


      Cuando sopla la bura, el viento seco y frío del noreste, las cumbres se envuelven en una nube que se
      llama capa. Esas corrientes de aire, y el choque de las dos regiones, provocan cambios bruscos de
      tiempo.
    wildlife: >-
      La cara norte, aislada y rodeada de bosque denso, ha conservado por completo su ecosistema. Allí viven
      el [lobo](/especie/canis_lupus/), el zorro y el [jabalí](/especie/sus_scrofa/), y es posible, aunque
      poco frecuente, cruzarse con un [lince](/especie/lynx_lynx/) o un [oso pardo](/especie/ursus_arctos/).


      En las cumbres peladas dominan los reptiles: lagartos verdes, la [víbora
      cornuda](/especie/vipera_ammodytes/), la víbora de Orsini, que mide hasta 30 centímetros, y culebras
      como la de collar y la látigo. En las laderas crecen plantas aromáticas y medicinales: menta de montaña,
      ajenjo de monte, líquenes alpinos, tomillo, salvia, genciana y eléboro.


      El mejor momento para caminar es primavera y otoño.
    visit: >-
      Desde el sur, el lado croata, se llega por la carretera Sinj–Otok–Korita–Gornja Korita hasta unos 800
      metros de altitud. De ahí, el camino de montaña sube por una ladera limpia y pelada hasta Kurljaj y
      sigue unos kilómetros por las cumbres hasta Konj, la más alta.
    history: >-
      Kamešnica tiene historia de refugios: el Sklonište prof. Giromette, a 1500 metros, recibió 593
      visitantes en la temporada de 1935 a 1936.
    before: >-
      El tiempo puede cambiar de golpe por la exposición a las corrientes de aire y el encuentro de los dos
      climas: la oficina de turismo de Trilj pide ir siempre con cautela.
    around: >-
      A unos veinticinco kilómetros está el [Parque Natural Blidinje - Macizo de
      Čvrsnica](/lugar/park-prirode-blidinje---cvrsnica/), y a la misma distancia las [Montañas de
      Vran](/lugar/planina-vran/).
  en:
    intro: >-
      On Mount Kamešnica, the national frontier is not an arbitrary cartographic line: it follows the
      razor-sharp mountain crest. Croatia and Bosnia and Herzegovina share this southeastern continuation of
      the Dinara Alps, which rises steeply between Sinj in the Dalmatian Zagora and Livno in Završje. The
      highest summits along the crest, Konj at 1856 metres and Kurljaj at 1809 metres, stand on Bosnian soil;
      on the Croatian side rise Divov brig and Glavaš, providing the primary approaches to the high ridge.
    landscape: >-
      Kamešnica presents pure unadorned karst: collapse dolines, caves, tectonic depressions, and undulating
      high plateaus stretching from the Vaganj mountain pass down to the artificial reservoir of Buško Blato.
      The upper peaks are windswept and bald, supporting sparse vegetation but commanding immense panoramas.
      From the highest crags the vista takes in the Sinj polje, the Dalmatian hinterland, and under clear
      skies, the glittering Adriatic Sea and its offshore islands.


      Climate governs the mountain's character. Kamešnica sits poised between two contrasting climatic
      systems: to the north lies the continental regime of the Livno polje, situated at roughly 700 metres
      with an annual mean temperature of 9 °C; to the south spreads the sub-Mediterranean climate of the Sinj
      basin at roughly 300 metres with a mean of twelve and a half degrees. Annual precipitation ranges from
      1200 to 2500 millimetres, peaking over Konj, Kurljaj, Burnjača, and Gareta, with snow cloaking the
      crests for six to seven months each year.


      When the ferocious bura blows—the bone-dry, icy northeasterly wind—the highest crags become wrapped in a
      persistent cap cloud known locally as a kapa. These atmospheric collisions cause abrupt, violent weather
      swings.
    wildlife: >-
      The secluded northern slopes, cloaked in dense beech and fir forests, preserve an intact Dinaric
      ecosystem. Here roam the [grey wolf](/especie/canis_lupus/), red fox, and [wild
      boar](/especie/sus_scrofa/), alongside occasional sightings of the secretive [Eurasian
      lynx](/especie/lynx_lynx/) and [brown bear](/especie/ursus_arctos/).


      On the bald summits, reptiles reign supreme: green lizards, the [nose-horned
      viper](/especie/vipera_ammodytes/), the meadow viper (Vipera ursinii) reaching lengths of up to 30
      centimetres, grass snakes, and whip snakes. Along rocky slopes flourish wild medicinal and aromatic
      herbs including mountain mint, wild wormwood, alpine lichens, thyme, sage, gentian, and hellebore.


      The most pleasant seasons for hiking are spring and autumn.
    visit: >-
      From the southern Croatian approach, a road connects Sinj via Otok and Korita to Gornja Korita at
      roughly 800 metres elevation. From there, a marked mountain path ascends the open, grassy limestone
      slopes to Kurljaj, continuing along the panoramic crest for a few kilometres to Konj, the highest point.
    history: >-
      Kamešnica possesses a rich mountaineering legacy: the historic Sklonište prof. Giromette mountain
      refuge, standing at 1500 metres, registered 593 overnight visitors during the 1935 to 1936 season.
    before: >-
      Weather conditions can deteriorate abruptly due to the convergence of contrasting air masses: the Trilj
      tourist board advises hikers to exercise constant caution.
    around: >-
      Roughly twenty-five kilometres away sits [Blidinje Nature Park – Čvrsnica
      Massif](/lugar/park-prirode-blidinje---cvrsnica/), and at an equivalent distance rise the [Vran
      Mountains](/lugar/planina-vran/).
  fr:
    intro: >-
      Sur la Kamešnica, la frontière n'est pas un tracé artificiel : elle suit le fil de la crête rocheuse. La
      Croatie et la Bosnie-Herzégovine se partagent ce prolongement de la chaîne de la Dinara qui s'élève
      entre Sinj en Dalmatie intérieure et Livno en Završje. La crête portant les plus hauts sommets, le Konj
      à 1856 mètres et le Kurljaj à 1809 mètres, se trouve en territoire bosnien ; côté croate s'élèvent Divov
      brig et Glavaš, d'où partent les sentiers menant à la crête.
    landscape: >-
      La Kamešnica est un karst brut : dolines, cavernes, dépressions et plateaux d'origine tectonique,
      s'étirant du col de Vaganj jusqu'au lac de Buško Blato. Les sommets sont dénudés, offrant une vue
      immense. Du faîte, le regard embrasse le poljé de Sinj, l'arrière-pays dalmate et, par ciel clair, la
      mer Adriatique et ses îles.


      Le climat dicte sa loi. La montagne s'intercale entre deux domaines contrastés : au nord, le climat
      continental du poljé de Livno vers 700 mètres avec une température moyenne de 9 °C ; au sud, le climat
      subméditerranéen du bassin de Sinj vers 300 mètres avec douze degrés et demi de moyenne. Les
      précipitations annuelles s'échelonnent de 1200 à 2500 millimètres, culminant sur le Konj, le Kurljaj,
      Burnjača et Gareta, la neige recouvrant les cimes six à sept mois par an.


      Quand souffle la bura, vent catabatique sec et glacial du nord-est, les sommets s'enveloppent d'un nuage
      caractéristique appelé kapa. Ces chocs thermiques provoquent de brusques sautes de temps.
    wildlife: >-
      Le versant nord, isolé et ceinturé de forêts denses, conserve son écosystème intact. Y vivent le
      [loup](/especie/canis_lupus/), le renard et le [sanglier](/especie/sus_scrofa/), avec des passages
      occasionnels du [lynx boréal](/especie/lynx_lynx/) ou de l'[ours brun](/especie/ursus_arctos/).


      Sur les hauteurs dénudées règnent les reptiles : lézards verts, la [vipère
      ammodyte](/especie/vipera_ammodytes/), la vipère d'Orsini atteignant jusqu'à 30 centimètres, ainsi que
      des couleuvres. Sur les pentes rocheuses croissent des plantes aromatiques et médicinales : menthe des
      montagnes, armoise sauvage, lichens alpins, thym, sauge, gentiane et hellébore.


      Les saisons recommandées pour la randonnée sont le printemps et l'automne.
    visit: >-
      Depuis le versant croate, la route relie Sinj à Gornja Korita vers 800 mètres d'altitude via Otok et
      Korita. De là, un sentier balisé gravit les pentes herbeuses et pierreuses jusqu'au Kurljaj et suit la
      crête sur quelques kilomètres jusqu'au Konj, point culminant.
    history: >-
      La montagne a une longue tradition d'accueil : le refuge historique Sklonište prof. Giromette, situé à
      1500 mètres, accueillit 593 randonneurs durant la saison de 1935 à 1936.
    before: >-
      La météo peut basculer soudainement en raison de la confrontation des masses d'air : l'office de
      tourisme de Trilj recommande la plus grande prudence.
    around: >-
      À vingt-cinq kilomètres se trouve le [parc naturel de Blidinje – massif de
      Čvrsnica](/lugar/park-prirode-blidinje---cvrsnica/), et à égale distance s'élèvent les [montagnes de
      Vran](/lugar/planina-vran/).
  de:
    intro: >-
      Auf der Kamešnica ist die Landesgrenze keine bloße Linie auf der Landkarte: Sie verläuft über die
      scharfe Schneide des Felsgrats. Kroatien und Bosnien und Herzegowina teilen sich diese südöstliche
      Fortsetzung der Dinara-Kette, die zwischen Sinj im dalmatinischen Hinterland und Livno in Završje
      aufsteigt. Der Kamm mit den höchsten Gipfeln, dem Konj mit 1856 Metern und dem Kurljaj mit 1809 Metern,
      liegt auf bosnischem Gebiet; auf kroatischer Seite ragen Divov brig und Glavaš auf, von wo aus die
      Besteigung erfolgt.
    landscape: >-
      Die Kamešnica ist Karst in Reinform: Dolinen, Höhlen, Schluchten und Hochplateaus erstrecken sich vom
      Vaganj-Pass bis zum Stausee Buško Blato. Die Bergkämme sind kahl und baumlos, bieten dafür aber ein
      überwältigendes Panorama. Vom Gipfel überblickt man das Becken von Sinj, Mitteldalmatien und bei klarem
      Wetter das Adriatische Meer mit seinen Inseln.


      Das Gebirge liegt im Schnittpunkt zweier gegensätzlicher Klimaräume: Im Norden herrscht kontinentales
      Klima im Livno-Polje auf rund 700 Metern mit 9 °C Jahresmitteltemperatur; im Süden submediterranes Klima
      im Becken von Sinj auf rund 300 Metern mit zwölfeinhalb Grad. Jährlich fallen zwischen 1200 und 2500
      Millimeter Niederschlag, mit Spitzenwerten an Konj, Kurljaj, Burnjača und Gareta, und Schnee bedeckt die
      Kämme an sechs bis sieben Monaten im Jahr.


      Wenn die Bora bläst, der kalte Nordostwind, hüllt sich der Grat in eine Wolkenkappe namens Kapa. Diese
      Wetterfronten führen oft zu plötzlichen Temperaturstürzen.
    wildlife: >-
      Die einsame, dicht bewaldete Nordflanke hat ihr ursprüngliches Ökosystem bewahrt. Hier leben
      [Wolf](/especie/canis_lupus/), Fuchs und [Wildschwein](/especie/sus_scrofa/), und gelegentlich streifen
      [Eurasischer Luchs](/especie/lynx_lynx/) oder [Braunbär](/especie/ursus_arctos/) durch das Revier.


      Auf den kahlen Hochebenen dominieren Reptilien: Smaragdeidechsen, die [Europäische
      Hornotter](/especie/vipera_ammodytes/), die Wiesenotter mit bis zu 30 Zentimetern Körperlänge sowie
      Zornnattern. An den Hängen gedeihen Bergminze, Wermut, alpine Flechten, Thymian, Salbei, Enzian und
      Nieswurz.


      Die beste Wanderzeit ist das Frühjahr und der Herbst.
    visit: >-
      Von kroatischer Seite führt eine Straße von Sinj über Otok und Korita hinauf nach Gornja Korita auf rund
      800 Metern Höhe. Von dort führt ein markierter Steig über freie Grashänge zum Kurljaj und über den
      Panoramakamm zum Konj, dem höchsten Punkt.
    history: >-
      Die Kamešnica blickt auf eine frühe alpine Erschließung zurück: Die Schutzhütte Sklonište prof.
      Giromette auf 1500 Metern verzeichnete in der Saison von 1935 bis 1936 insgesamt 593 Übernachtungsgäste.
    before: >-
      Das Wetter kann durch den Zusammenstoß der Luftmassen schlagartig umschlagen: Der Tourismusverband von
      Trilj mahnt zu Vorsicht.
    around: >-
      Rund fünfundzwanzig Kilometer entfernt liegt der [Naturpark Blidinje –
      Čvrsnica-Massiv](/lugar/park-prirode-blidinje---cvrsnica/), und in gleicher Distanz ragt das
      [Vran-Gebirge](/lugar/planina-vran/) auf.
  it:
    intro: >-
      Sulla Kamešnica il confine di stato non è un tracciato astratto: ricalca il filo della cresta rocciosa.
      Croazia e Bosnia ed Erzegovina si dividono questa propaggine delle Alpi Dinariche che si innalza tra
      Sinj nella Zagora dalmata e Livno nello Završje. Il crinale con le cime più elevate, il Konj a 1856
      metri e il Kurljaj a 1809 metri, ricade in territorio bosniaco; sul versante croato svettano Divov brig
      e Glavaš, da dove salgono i sentieri di vetta.
    landscape: >-
      La Kamešnica è pietra viva carsica: doline, caverne, depressioni e altipiani che si allungano dal valico
      di Vaganj fino all'invaso di Buško Blato. Le cime sono completamente spoglie, donando orizzonti immensi.
      Dalla cima si dominano il campo di Sinj, l'entroterra dalmata e, a cielo terso, l'Adriatico con le sue
      isole.


      Il clima ne plasma la fisionomia. La montagna divide due aree contrapposte: a nord il clima continentale
      del polje di Livno a circa 700 metri con 9 °C di temperatura media; a sud il clima submediterraneo del
      campo di Sinj a circa 300 metri con dodici gradi e mezzo. Le precipitazioni spaziano da 1200 a 2500
      millimetri annui con picchi su Konj, Kurljaj, Burnjača e Gareta, e la neve copre le alture per sei o
      sette mesi all'anno.


      Quando infuria la bora, il vento freddo da nord-est, le creste si avvolgono in un cappuccio nuvoloso
      chiamato kapa. Tali dinamiche favoriscono improvvisi rovesci di tempo.
    wildlife: >-
      Il versante settentrionale, solitario e cinto da faggi e abeti, preserva intatto l'habitat originario.
      Vi albergano il [lupo grigio](/especie/canis_lupus/), la volpe e il [cinghiale](/especie/sus_scrofa/),
      con comparse sporadiche della [lince eurasiatica](/especie/lynx_lynx/) e dell'[orso
      bruno](/especie/ursus_arctos/).


      Sulle alture denudate abbondano i rettili: ramarri, la [vipera dal corno](/especie/vipera_ammodytes/),
      la vipera dell'Orsini lunga fino a 30 centimetri, bisce dal collare e biacchi. Sui pendii sassosi
      vegetano piante officinali come menta montana, assenzio alpino, licheni, timo, salvia, genziana ed
      elleboro.


      I periodi migliori per l'escursionismo sono primavera e autunno.
    visit: >-
      Dal versante croato si sale percorrendo la rotabile da Sinj via Otok e Korita fino a Gornja Korita a
      circa 800 metri di quota. Da qui il sentiero sale i pendii erbosi fino al Kurljaj e prosegue lungo la
      cresta fino al Konj, il punto più alto.
    history: >-
      La montagna ha una solida tradizione alpina: il rifugio storico Sklonište prof. Giromette, a quota 1500
      metri, registrò 593 presenze nella stagione dal 1935 al 1936.
    before: >-
      Il meteo può mutare rapidamente per lo scontro tra masse d'aria differenti: l'ufficio turistico di Trilj
      raccomanda costante prudenza.
    around: >-
      A circa venticinque chilometri si trova il [Parco naturale Blidinje – Massiccio del
      Čvrsnica](/lugar/park-prirode-blidinje---cvrsnica/), e alla medesima distanza sorgono i [Monti del
      Vran](/lugar/planina-vran/).
  pt:
    intro: >-
      Na serra de Kamešnica a fronteira não é uma mera linha no mapa: acompanha a crista afiada da montanha. A
      Croácia e a Bósnia e Herzegovina partilham este prolongamento dos Alpes Dináricos que se ergue entre
      Sinj no interior dalmata e Livno em Završje. Os cumes mais elevados ao longo da crista, Konj a 1856
      metros e Kurljaj a 1809 metros, pertencem à Bósnia e Herzegovina; do lado croata erguem-se Divov brig e
      Glavaš, pontos de partida habituais para as cristas.
    landscape: >-
      Kamešnica é calcário puro: dolinas, cavernas, covas e planaltos estendem-se desde o desfiladeiro de
      Vaganj até à albufeira de Buško Blato. Os topos são despidos de vegetação arbórea, descortinando
      panoramas soberbos. Do ponto mais alto avista-se a veiga de Sinj, a Dalmácia interior e, com atmosfera
      límpida, o mar Adriático e as suas ilhas.


      O clima comanda a montanha. Situa-se entre duas realidades distintas: a norte o clima continental do
      poljé de Livno a cerca de 700 metros com 9 °C de média anual; a sul o clima submediterrânico da bacia de
      Sinj a cerca de 300 metros com doze graus e meio. A precipitação oscila entre 1200 e 2500 milímetros por
      ano, com máximos em Konj, Kurljaj, Burnjača e Gareta, cobrindo a neve as cristas durante seis a sete
      meses anualmente.


      Quando sopra a bura, o vento gélido de nordeste, os cumes envolvem-se num manto nebuloso chamado kapa.
      Estas correntes opostas geram mudanças atmosféricas bruscas.
    wildlife: >-
      A vertente norte, isolada e envolvida por florestas cerradas de faia e abeto, preserva o ecossistema
      pristino. Aqui habitam o [lobo-cinzento](/especie/canis_lupus/), a raposa e o
      [javali](/especie/sus_scrofa/), cruzando ocasionalmente o [lince-euroasiático](/especie/lynx_lynx/) ou o
      [urso-pardo](/especie/ursus_arctos/).


      Nos topos desnudados dominam os répteis: sardões, a [víbora-cornuda](/especie/vipera_ammodytes/), a
      víbora-de-Orsini com até 30 centímetros de comprimento e cobras-rateiras. Nas encostas medram ervas
      aromáticas e medicinais: poejo-da-serra, absinto-alpino, líquenes, tomilho, salva, genciana e eléboro.


      A melhor época para caminhar é a primavera e o outono.
    visit: >-
      Pelo lado croata, a estrada parte de Sinj via Otok e Korita até Gornja Korita a cerca de 800 metros de
      altitude. A partir daí, o trilho de montanha sobe a encosta de pastagens até Kurljaj e segue pela crista
      durante alguns quilómetros até Konj, o ponto culminante.
    history: >-
      A serra de Kamešnica possui tradição de acolhimento montanhês: o abrigo histórico Sklonište prof.
      Giromette, a 1500 metros de altitude, acolheu 593 caminhantes na temporada de 1935 a 1936.
    before: >-
      O tempo pode deteriorar-se subitamente pelo encontro de massas de ar opostas: a delegação de turismo de
      Trilj aconselha precaução permanente.
    around: >-
      A cerca de vinte e cinco quilómetros situa-se o [Parque Natural de Blidinje – Maciço de
      Čvrsnica](/lugar/park-prirode-blidinje---cvrsnica/), e à mesma distância erguem-se as [Montanhas de
      Vran](/lugar/planina-vran/).
