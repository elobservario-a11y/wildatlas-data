unico:
  es: Una montaña pelada y ventosa que separa dos climas, el continental de Livno y el submediterráneo de Sinj.
  en: >-
    A barren and windswept mountain separating two contrasting climates, the continental domain of Livno and
    the sub-Mediterranean realm of Sinj.
  fr: >-
    Une montagne dénudée et battue des vents séparant deux climats : le domaine continental de Livno et le
    domaine subméditerranéen de Sinj.
  de: >-
    Ein kahler, windumwehten Gebirgsstock zwischen zwei gegensätzlichen Klimazonen: dem kontinentalen Livno
    und dem submediterranen Sinj.
  it: >-
    Una montagna spoglia e battuta dal vento che divide due climi: il dominio continentale di Livno e quello
    submediterraneo di Sinj.
  pt: >-
    Uma montanha nua e ventosa que separa dois climas contrastantes: o domínio continental de Livno e o
    submediterrânico de Sinj.
