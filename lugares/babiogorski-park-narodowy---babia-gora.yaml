resumen:
  es: >-
    La 'Reina de los Beskides' (Diablak 1.725 m), cumbre solitaria azotada por el viento con un gradiente
    altitudinal completo de vegetación de los Cárpatos.
  en: >-
    The 'Queen of the Beskids' (Diablak 1,725 m), an isolated windswept massif exhibiting a complete
    Carpathian altitudinal vegetation gradient.
  fr: >-
    La 'Reine des Beskides' (Diablak 1 725 m), sommet solitaire battu par les vents présentant l'étagement
    complet de la végétation des Carpates.
  de: >-
    Die 'Königin der Beskiden' (Diablak 1.725 m), ein windumtoster Inselberg mit vollständiger Höhenstufung
    der Karpatenflora.
  it: >-
    La 'Regina dei Beskidi' (Diablak 1.725 m), vetta isolata battuta dai venti con un completo gradiente
    altitudinale di vegetazione carpatica.
  pt: >-
    A 'Rainha dos Beskides' (Diablak 1.725 m), cume isolado fustigado pelo vento exibindo um gradiente
    altitudinal completo da vegetação dos Cárpatos.
unico:
  es: >-
    Aquí se ve la montaña entera en pisos, del bosque de hayas y abetos hasta un piso alpino con una planta,
    la rogownica alpejska, que solo existe en Babia Góra.
  en: >-
    Here the entire mountain unfolds in distinct vertical zones, from foothill beech and fir woods up to an
    alpine zone hosting Cerastium alpinum subsp. babiogorense, found nowhere else on Earth.
  fr: >-
    Ici se déploie la montagne dans toute sa verticalité, de la hêtraie-sapinière jusqu'à l'étage alpin
    abritant une plante endémique exclusive, la céraiste de Babia Góra.
  de: >-
    Hier lässt sich der Berg in allen Höhenstufen erleben, vom Buchenwald bis zur alpinen Matte mit dem
    Hornkraut Cerastium alpinum subsp. babiogorense, das weltweit nur hier vorkommt.
  it: >-
    Qui la montagna si manifesta per intero nei suoi piani vegetazionali, dal bosco di faggi e abeti sino a un
    piano alpino che custodisce la peverina di Babia Góra, esclusiva di questa cima.
  pt: >-
    Aqui a montanha desdobra-se em andares completos, desde o faial da base até ao andar alpino que alberga a
    orelha-de-rato de Babia Góra, planta exclusiva deste cume.
observaciones:
  es: >-
    El reglamento del parque establece que el senderismo debe hacerse por rutas peatonales señalizadas y
    senderos educativos. El tiempo en la cima cambia rápido por el viento frecuente, así que mira la previsión
    antes de salir.
texto:
  es:
    intro: >-
      A Babia Góra los polacos la llaman Matka Niepogód, la «madre del mal tiempo». El viento golpea el macizo
      con frecuencia, el tiempo cambia deprisa y la nieve puede cubrirlo más de 200 días al año. Es una
      montaña con carácter, y a su sombra, en el sur de Polonia, en la frontera con Eslovaquia, está el Parque
      Nacional de Babia Góra: 33,92 km², casi un 85 % de bosque, y una cumbre, Diablak, de 1725 m, el punto
      más alto de los Beskides de Orava. Es un parque pequeño, pero con una montaña completa: del hayedo del
      pie de monte a la roca alpina de la cima.
    landscape: >-
      La montaña es suave por el sur y empinada por el norte, y de su cima baja la divisoria entre las cuencas
      del mar Báltico y del mar Negro. Lo más llamativo es cómo cambia la vegetación con la altura. El bosque
      bajo, hasta 1150 m, es de haya, abeto rojo y abeto blanco. El bosque alto llega hasta 1390 m. Encima
      viene el piso de pino mugo, hasta 1650 m, y por último el piso alpino, hasta 1725 m.


      En ese piso alpino crece la rogownica alpejska, un endemismo babiogórski. El símbolo del parque es otra
      planta, el okrzyn jeleni, que durante mucho tiempo solo se conocía en Polonia aquí. En total se han
      descrito 650 especies de plantas vasculares y casi 280 de musgos; 70 son de alta montaña y 54 están
      protegidas.
    wildlife: >-
      El bosque guarda a los grandes depredadores. Viven de forma estable el [oso
      pardo](/especie/ursus_arctos/), el [lobo](/especie/canis_lupus/) y el [lince](/especie/lynx_lynx/), en
      un parque con 38 especies de mamíferos. El gato montés, en cambio, ya no está: la piel del último,
      cazado en la vertiente de Orava el 15 de enero de 1936, se guarda en el museo del parque. El topillo
      tatrense, endemismo de los Cárpatos occidentales, sube casi hasta la cumbre.


      Entre las aves, a comienzos del siglo XXI se citaban 115-119 especies, unas 100 de ellas nidificantes.
      El [urogallo](/especie/tetrao_urogallus/) vive en el piso alto del bosque y el [gallo
      lira](/especie/tetrao_tetrix/) llega hasta el pino mugo. Dos aves típicas de montaña, siwerniak y el
      rarísimo płochacz halny (nombres polacos), son las que anidan más alto, en las cumbres. Hay 6 especies
      de reptiles y 7 de anfibios; entre estos, la salamandra vive en el piso bajo. Y de los invertebrados se
      han determinado unas 3,5 mil especies, sobre todo escarabajos (unas 1500) y moluscos (92).
    visit: >-
      Solo se puede circular por los senderos turísticos señalizados, que en el lado polaco mantiene la PTTK.
      Hay una senda amarilla más difícil hasta la cima, la Perć Akademików, con cadenas y escalones de metal
      fijos en la roca, muy popular entre senderistas.


      El parque ha trazado ocho senderos educativos sobre naturaleza, cultura y arquitectura de los pueblos
      locales. El del valle de Rybny Potok mide 3,5 km y se recorre en una hora y media; interpreta los
      mamíferos, aves, peces, anfibios y reptiles del parque, la vegetación junto al arroyo y la sucesión
      ecológica secundaria. La ruta Echa pierwotnej puszczy karpackiej recorre 8,4 km desde Zawoja Czatoża
      hasta Fickowe Rozstaje, junto al bosque Czatoża, y explica los bosques primarios y las comunidades
      vegetales modificadas por las personas. La ruta Mokry Kozub tiene 11 paradas, sube hasta los 842 m antes
      de seguir hacia Zawoja Markowa y da vistas a Babia Góra y al valle del río Skawica, con estaciones sobre
      el río, el interior de la tierra y el bosque.


      En Zawoja, sede de la dirección, el Centro Educativo del Parque presenta los valores naturales de Babia
      Góra. En invierno, a comienzos de 2023 la dirección habilitó, a modo de prueba, senderos para
      esquiadores, con la condición de que haya nieve suficiente y se respeten las normas de protección de la
      fauna.
    history: >-
      La primera mención histórica del macizo es del siglo XV, en los escritos de Jan Długosz, y el primer
      refugio de montaña conocido se construyó en 1905. La cresta fue frontera estatal hasta 1918, y las
      comunidades de cada lado desarrollaron por separado arquitectura, folclore, vestimenta y dialectos
      distintos.


      En 1933 se creó una reserva natural, y el 30 de octubre de 1954 el parque nacional. Desde 1976 la UNESCO
      lo designa reserva de la biosfera. En 1997 el parque se amplió a 3391,55 ha y se creó una zona de
      amortiguación de 8437 ha. Babia Góra conserva además 18 hábitats valiosos a escala europea.
    before: >-
      El reglamento del parque establece que el senderismo debe hacerse por rutas peatonales señalizadas y
      senderos educativos. El tiempo en la cima cambia rápido por el viento frecuente, así que mira la
      previsión antes de salir.
  en:
    intro: >-
      In Poland, Babia Góra is known as Matka Niepogód, the 'Mother of Bad Weather'. Winds lash the massif
      with formidable regularity, conditions shift abruptly, and snow can cloak the upper slopes for over 200
      days a year. It is a mountain with fierce personality, and in its shadow on the Polish-Slovak border
      lies Babia Góra National Park: 33.92 km², nearly 85% forested, crowned by Diablak at 1725 m, the highest
      summit in the Orava Beskids. It is a compact park preserving a complete mountain profile: from foothill
      beechwoods to the alpine rock tundra atop the peak.
    landscape: >-
      The mountain rises with gentle southern slopes while plunging steeply on its northern face, with its
      summit ridge forming the continental drainage divide between Baltic and Black Sea catchments. Most
      striking is the strict vertical stratification of plant zones. The lower montane forest, extending to
      1150 m, comprises European beech, Norway spruce, and silver fir. The upper montane forest reaches up to
      1390 m. Above lies the dwarf mountain pine zone up to 1650 m, crowned finally by the alpine zone
      reaching 1725 m.


      Within that alpine zone flourishes Cerastium alpinum subsp. babiogorense (rogownica alpejska), a
      strictly local endemic. The official park emblem features Laserpitium archangelica (okrzyn jeleni),
      which was long known in Poland exclusively from this massif. In total, 650 vascular plant species and
      nearly 280 bryophytes have been catalogued; 70 are high-alpine specialists and 54 enjoy statutory
      conservation protection.
    wildlife: >-
      The mountain forest provides sanctuary for Europe's large carnivores. Permanent breeding populations of
      [brown bear](/especie/ursus_arctos/), [grey wolf](/especie/canis_lupus/), and [Eurasian
      lynx](/especie/lynx_lynx/) inhabit the park, which supports 38 mammal species. The European wildcat, by
      contrast, has disappeared: the pelt of the last recorded animal, taken on the Orava side on 15 January
      1936, is preserved in the park museum. The Tatra vole, a Western Carpathian endemic, ascends almost to
      the rocky summit.


      Bird life is equally diverse: early twenty-first-century surveys recorded 115-119 bird species, with
      around 100 breeding. The [western capercaillie](/especie/tetrao_urogallus/) inhabits upper montane
      spruce stands, while the [black grouse](/especie/tetrao_tetrix/) occupies the dwarf pine belt. Two
      characteristic mountain birds, the water pipit (siwerniak) and the rare alpine accentor (płochacz
      halny), nest on the windswept summit boulderfields. There are 6 reptile and 7 amphibian species; among
      the latter, the fire salamander populates the lower forest zone. Invertebrate surveys have catalogued
      some 3.5 thousand species, dominated by beetles (around 1500) and molluscs (92).
    visit: >-
      Hiking is permitted strictly along marked tourist paths, maintained on the Polish side by the PTTK
      alpine club. A classic demanding approach to the summit is the yellow-blazed Perć Akademików trail,
      equipped with fixed chains and iron rungs on the steep rock walls, highly popular among experienced
      hillwalkers.


      The park maintains eight educational nature trails interpreting the ecology, culture, and architecture
      of surrounding villages. The Rybny Potok valley trail spans 3.5 km, taking an hour-and-a-half to explore
      local mammals, birds, freshwater fish, and riparian succession. The Echa pierwotnej puszczy karpackiej
      route covers 8.4 km from Zawoja Czatoża to Fickowe Rozstaje beside ancient Czatoża woodland, contrasting
      pristine old-growth stands with human-modified secondary forests. The Mokry Kozub trail features 11
      interpretive stops, ascending to 842 m before descending toward Zawoja Markowa, with viewpoints
      overlooking Babia Góra and the Skawica River valley.


      In Zawoja, where park headquarters are located, the Park Education Centre interprets the natural wonders
      of the massif. In winter, since early 2023, park authorities have permitted ski-touring on designated
      winter routes, provided snow cover is adequate and wildlife quiet zones are respected.
    history: >-
      The earliest historical mention of the massif dates to the fifteenth century in the chronicles of Jan
      Długosz, and the first known mountain shelter was built in 1905. The summit ridge formed a state border
      until 1918, during which communities on either side developed distinct vernacular architecture, highland
      folklore, traditional attire, and local dialects.


      A nature reserve was established in 1933, followed by national park status on 30 October 1954. In 1976
      UNESCO designated Babia Góra a Biosphere Reserve. In 1997 the national park was expanded to 3391.55 ha,
      buffered by a peripheral zone of 8437 ha. Babia Góra protects 18 habitat types of European conservation
      priority.
    before: >-
      Park regulations require you to remain strictly on waymarked tourist paths and educational trails.
      Weather on the summit shifts with extreme speed due to fierce prevailing winds; check the mountain
      forecast before setting out.
  fr:
    intro: >-
      En Pologne, Babia Góra est surnommée Matka Niepogód, la « mère du mauvais temps ». Les bourrasques
      balayent le massif avec régularité, le temps y change à vive allure et le manteau neigeux peut subsister
      plus de 200 jours par an. C'est une montagne au relief affirmé, à l'ombre de laquelle, sur la frontière
      polono-slovaque, s'étend le parc national de Babia Góra : 33,92 km², près de 85 % de forêts et un point
      culminant, le Diablak, à 1725 m, sommet des Beskides d'Orava. Un parc ramassé mais complet : de la
      hêtraie du piémont aux pelouses alpines sommitales.
    landscape: >-
      La montagne présente des versants méridionaux adoucis et une face septentrionale abrupte, sa crête
      portant la ligne de partage des eaux entre mer Baltique et mer Noire. L'élément marquant réside dans la
      rigoureuse superposition des étages de végétation. La forêt montagnarde inférieure, jusqu'à 1150 m,
      associe hêtre, épicéa et sapin pectiné. L'étage montagnard supérieur grimpe jusqu'à 1390 m. Lui succède
      la ceinture de pin couché (mugo) jusqu'à 1650 m, couronnée enfin par l'étage alpin jusqu'à 1725 m.


      Dans ces pelouses sommitales s'épanouit la céraiste de Babia Góra (rogownica alpejska), endémique
      stricte du massif. L'emblème du parc est le laser à feuilles d'archangélique (okrzyn jeleni), qui fut
      longtemps considéré en Pologne comme exclusif à ce site. Au total sont recensées 650 espèces de plantes
      vasculaires et près de 280 mousses ; 70 sont alpines et 54 protégées.
    wildlife: >-
      Le massif forestier abrite les grands carnivores. L'[ours brun](/especie/ursus_arctos/), le [loup
      gris](/especie/canis_lupus/) et le [lynx boréal](/especie/lynx_lynx/) y maintiennent des populations
      sédentaires, au sein d'un cortège de 38 espèces de mammifères. Le chat forestier a en revanche disparu :
      la dépouille du dernier individu abattu sur le versant d'Orava le 15 janvier 1936 est conservée au musée
      du parc. Le campagnol des Tatras grimpe presque jusqu'aux crêtes.


      L'avifaune est tout aussi riche : au tournant du XXIe siècle, on recensait 115-119 espèces d'oiseaux,
      dont environ 100 nicheuses. Le [grand tétras](/especie/tetrao_urogallus/) peuple les pessières
      d'altitude tandis que le [tétras-lyre](/especie/tetrao_tetrix/) fréquente les landes de pins mugo. Deux
      passereaux d'altitude, le pipit spioncelle et le rare accenteur alpin, nichent sur les pierriers
      sommitaux. On dénombre 6 espèces de reptiles et 7 d'amphibiens ; parmi ces derniers, la salamandre
      tachetée habite les forêts inférieures. Chez les invertébrés, environ 3,5 milliers d'espèces ont été
      identifiées, dominées par les coléoptères (près de 1500) et les mollusques (92).
    visit: >-
      La circulation s'effectue exclusivement sur les sentiers balisés, entretenus côté polonais par le club
      alpin PTTK. L'itinéraire le plus spectaculaire est le tracé balisé en jaune de la Perć Akademików,
      équipé de chaînes et d'échelons métalliques scellés dans le roc.


      Le parc propose huit sentiers didactiques consacrés aux richesses naturelles et architecturales des
      villages d'alpage. Celui du vallon de Rybny Potok s'étend sur 3,5 km et se parcourt en une heure et
      demie, décrivant la faune aquatique et montagnarde. Le circuit Echa pierwotnej puszczy karpackiej
      déroule 8,4 km de Zawoja Czatoża à Fickowe Rozstaje pour illustrer la transition entre forêt primaire et
      peuplements modifiés. Le sentier de Mokry Kozub comporte 11 haltes, monte à 842 m et offre de beaux
      panoramas sur la vallée de la Skawica.


      À Zawoja, où siège la direction, le centre d'éducation à l'environnement présente la biodiversité du
      massif. En hiver, depuis début 2023, des itinéraires à ski de randonnée sont ouverts à l'essai lorsque
      l'enneigement le permet et que la quiétude hivernale de la faune est garantie.
    history: >-
      La première mention du massif remonte au XVe siècle dans les chroniques de Jan Długosz, et le premier
      refuge de montagne connu fut édifié en 1905. La crête formait une frontière d'État jusqu'en 1918,
      période durant laquelle les populations des deux versants ont forgé des traditions pastorales et
      dialectes distincts.


      Une réserve naturelle fut délimitée en 1933, suivie de la création du parc national le 30 octobre 1954.
      Dès 1976, l'UNESCO l'a consacré réserve de biosphère. En 1997, le parc a été agrandi à 3391,55 ha avec
      une zone tampon de 8437 ha. Babia Góra protège en outre 18 habitats d'intérêt communautaire européen.
    before: >-
      Le règlement impose de ne pas quitter les chemins balisés et sentiers didactiques. Les conditions
      météorologiques au sommet changent brusquement sous l'effet des vents ; consultez la météo avant de
      partir.
  de:
    intro: >-
      In Polen heißt die Babia Góra Matka Niepogód, die 'Mutter des schlechten Wetters'. Winde fegen
      regelmäßig über den Gebirgsstock, das Wetter schlägt unvermittelt um und an über 200 Tagen im Jahr kann
      Schnee die Hochlagen bedecken. Es ist ein weithin sichtbarer Charakterberg, an dessen Fuß an der
      polnisch-slowakischen Grenze der Nationalpark Babia Góra liegt: 33,92 km², fast 85 % Waldanteil und der
      Gipfel Diablak mit 1725 m Höhe als Krönung der Saybuscher und Arwa-Beskiden. Ein kompakter Park, der
      eine vollständige Gebirgslandschaft bewahrt: vom Buchenwald am Fuß bis zur Felsflur am Gipfel.
    landscape: >-
      Das Massiv fällt nach Norden steil ab, während die Südflanke sanfter geneigt ist; über den Hauptkamm
      verläuft die europäische Hauptwasserscheide zwischen Ostsee und Schwarzem Meer. Eindrucksvoll ist die
      vertikale Abfolge der Vegetationsgürtel: Die montane Waldstufe bis 1150 m besteht aus Rotbuche, Gemeiner
      Fichte und Weißtanne. Die hochmontane Stufe reicht bis 1390 m. Darüber schließt sich die Krummholzzone
      aus Bergkiefern bis 1650 m an, gefolgt von der alpinen Mattenstufe bis 1725 m.


      Auf diesen alpinen Felsen wächst das Babiagóra-Hornkraut (rogownica alpejska), ein strenger Endemit des
      Massivs. Als Wappenpflanze dient der Erzengelwurz-Laserkraut (okrzyn jeleni), der in Polen lange Zeit
      nur von hier bekannt war. Insgesamt wurden 650 Gefäßpflanzenarten und fast 280 Moosarten beschrieben; 70
      zählen zu den Hochgebirgsarten und 54 stehen unter Naturschutz.
    wildlife: >-
      Die Bergwälder bieten großen Raubtieren ein Refugium: [Braunbär](/especie/ursus_arctos/),
      [Wolf](/especie/canis_lupus/) und [Eurasischer Luchs](/especie/lynx_lynx/) sind hier ständige Bewohner
      in einem Park mit 38 Säugetierarten. Die Wildkatze ist dagegen verschollen: Der Balg des letzten
      Exemplars von der Arwa-Seite vom 15. Januar 1936 wird im Parkmuseum aufbewahrt. Die Tatra-Kleinwühlmaus
      klettert bis knapp unter den Gipfel.


      Zu Beginn des einundzwanzigsten Jahrhunderts wurden 115-119 Vogelarten verzeichnet, davon rund 100
      Brutvogelarten. Das [Auerhuhn](/especie/tetrao_urogallus/) bewohnt die oberen Nadelwälder, während das
      [Birkhuhn](/especie/tetrao_tetrix/) in den Latschenfeldern vorkommt. Bergpieper und die seltene
      Alpenbraunelle brüten in den Felsfluren der Gipfelzone. Man zählt 6 Reptilien- und 7 Amphibienarten; der
      Feuersalamander bewohnt die unteren Buchenwälder. Unter den Wirbellosen wurden rund 3,5 Tausend Arten
      erfasst, vor allem Käfer (rund 1500) und Weichtiere (92).
    visit: >-
      Das Wandern ist ausschließlich auf den markierten Wegen gestattet, die auf polnischer Seite vom
      Alpenverein PTTK betreut werden. Eine klassische, anspruchsvolle Route zum Gipfel ist der gelb markierte
      Steig Perć Akademików, der mit Ketten und Eisenklammern im Fels gesichert ist.


      Acht Lehrpfade erschließen Natur und Volkskultur. Der Lehrpfad im Rybny-Potok-Tal misst 3,5 km bei einer
      Gehzeit von eineinhalb Stunden und widmet sich der Fauna und Flora entlang des Bergbachs. Die Route Echa
      pierwotnej puszczy karpackiej führt über 8,4 km von Zawoja Czatoża nach Fickowe Rozstaje am Rand alter
      Urwaldbestände. Der Lehrpfad Mokry Kozub umfasst 11 Stationen, steigt auf 842 m Höhe an und eröffnet
      Ausblicke auf die Babia Góra und das Tal der Skawica.


      In Zawoja vermittelt das Bildungszentrum des Nationalparks vertiefte Einblicke. Im Winter öffnet die
      Verwaltung seit Anfang 2023 probeweise markierte Routen für Skitourengeher, sofern die Schneelage
      ausreicht und die Ruhezonen der Wildtiere gewahrt bleiben.
    history: >-
      Die früheste historische Erwähnung des Massivs stammt aus dem fünfzehnten Jahrhundert in Schriften von
      Jan Długosz; die erste Schutzhütte entstand 1905. Der Kamm bildete bis 1918 eine Staatsgrenze, sodass
      die Gemeinschaften beiderseits eigenständige Traditionen und Dialekte entwickelten.


      Ein erstes Naturschutzgebiet entstand 1933, gefolgt von der Nationalparkgründung am 30. Oktober 1954.
      Seit 1976 ist das Massiv UNESCO-Biosphärenreservat. 1997 wurde die Kernzone auf 3391,55 ha vergrößert,
      ergänzt um eine Pufferzone von 8437 ha. Die Babia Góra bewahrt zudem 18 europäische Schutzlebensräume.
    before: >-
      Bleib stets auf den markierten Wander- und Lehrpfaden. Das Wetter am Gipfel ändert sich sturmartig;
      prüfe vor dem Aufbruch unbedingt den Lawinen- und Wetterbericht.
  it:
    intro: >-
      In Polonia la Babia Góra è chiamata Matka Niepogód, la «madre del maltempo». Il vento spazza la dorsale
      con violenza, le condizioni mutano repentinamente e la neve può resistere oltre 200 giorni l'anno. È una
      montagna dalla marcata personalità, alla cui ombra lungo il confine polacco-slovacco sorge il Parco
      nazionale di Babia Góra: 33,92 km², quasi l'85% di superficie forestale e una cima, il Diablak, che
      tocca i 1725 m elevandosi sui Beskidi di Orava. Un parco raccolto ma completo: dalla faggeta basale sino
      alle zolle alpine di vetta.
    landscape: >-
      Il rilievo mostra versanti meridionali digradanti e una parete settentrionale dirupata; dalla cresta
      sommitale corre lo spartiacque tra i bacini del mar Baltico e del mar Nero. L'elemento distintivo è la
      regolare stratificazione delle fasce vegetazionali. Il bosco montano inferiore, fino a 1150 m, associa
      faggio, abete rosso e abete bianco. Il bosco montano superiore sale sino a 1390 m. Segue la fascia a
      pino mugo sino a 1650 m, conclusa dal piano alpino sino a 1725 m.


      Su queste zolle rupestri cresce la peverina alpina di Babia Góra (rogownica alpejska), endemismo
      esclusivo. Emblema del parco è il laserpizio a foglie d'angelica (okrzyn jeleni), per lungo tempo noto
      in Polonia solo su questo massiccio. Complessivamente si contano 650 specie vascolari e circa 280
      muschi; 70 sono specie d'alta quota e 54 godono di tutela formale.
    wildlife: >-
      Le fustaie offrono rifugio ai grandi predatori. L'[orso bruno](/especie/ursus_arctos/), il
      [lupo](/especie/canis_lupus/) e la [lince eurasiatica](/especie/lynx_lynx/) popolano stabilmente il
      parco, che conta 38 specie di mammiferi. Il gatto selvatico è invece scomparso: la pelle dell'ultimo
      esemplare abbattuto sul versante di Orava il 15 gennaio 1936 è esposta nel museo del parco. L'arvicola
      dei Tatra risale fin quasi in vetta.


      Tra i volatili, all'inizio del XXI secolo si recensivano 115-119 specie, con circa 100 nidificanti. Il
      [gallo cedrone](/especie/tetrao_urogallus/) abita la fascia a conifere e il [fagiano di
      monte](/especie/tetrao_tetrix/) i cespuglieti di mugo. Lo spioncello e il raro sordone nidificano sulle
      pietraie sommitali. Si registrano 6 specie di rettili e 7 di anfibi; la salamandra pezzata popola la
      fascia basale. Tra gli invertebrati sono note circa 3,5 mila specie, capeggiate da coleotteri (circa
      1500) e molluschi (92).
    visit: >-
      È consentito muoversi unicamente sui percorsi segnalati dalla PTTK. L'itinerario più impegnativo verso
      la vetta è la via gialla della Perć Akademików, attrezzata con catene e gradini metallici fissati nella
      parete rocciosa.


      Il parco ha allestito otto percorsi didattici. Quello della valle di Rybny Potok misura 3,5 km e si
      percorre in un'ora e mezza, illustrando la fauna e la vegetazione ripariale. Il sentiero Echa pierwotnej
      puszczy karpackiej si sviluppa per 8,4 km da Zawoja Czatoża a Fickowe Rozstaje illustrando la dinamica
      delle foreste vetuste. Il percorso Mokry Kozub conta 11 tappe, tocca gli 842 m e offre vedute sulla
      valle della Skawica.


      A Zawoja, sede direzionale, il Centro Didattico del Parco introduce alla biodiversità locale. In
      inverno, da inizio 2023, sono stati aperti tracciati per scialpinisti a condizione che il manto nevoso
      sia consistente e si rispettino le zone di quiete faunistica.
    history: >-
      La prima citazione storica risale al XV secolo nelle cronache di Jan Długosz, mentre il primo rifugio
      alpino sorse nel 1905. La cresta segnò una linea di confine statale sino al 1918, permettendo alle
      comunità locali di sviluppare architetture, costumi e parlate distinte.


      Nel 1933 fu istituita una riserva naturale, elevata a parco nazionale il 30 ottobre 1954. Nel 1976
      l'UNESCO lo ha proclamato Riserva della Biosfera. Nel 1997 il parco è stato esteso a 3391,55 ha con una
      fascia tampone di 8437 ha. Babia Góra conserva inoltre 18 habitat d'interesse comunitario.
    before: >-
      I visitatori devono mantenersi esclusivamente sui sentieri segnati. Il meteo in vetta muta
      repentinamente a causa dei venti; controlla sempre le previsioni prima di salire.
  pt:
    intro: >-
      Na Polónia, a Babia Góra é apelidada de Matka Niepogód, a «mãe do mau tempo». As rajadas de vento
      fustigam o maciço com regularidade, o clima altera-se depressa e a neve pode cobrir as cristas mais de
      200 dias por ano. É uma montanha de forte personalidade, sob cuja sombra, junto à fronteira
      polaco-eslovaca, se estende o Parque Nacional de Babia Góra: 33,92 km², quase 85% de área florestal e um
      cume, Diablak, com 1725 m de cota, o ponto mais alto dos Beskides de Orava. Um parque compacto com um
      relevo montanhoso integral: dos faiais da base às rochas alpinas do topo.
    landscape: >-
      O relevo tem vertentes meridionais suaves e uma escarpa setentrional abrupta; pelo espigão da crista
      passa a divisória entre as bacias do Báltico e do mar Negro. O elemento mais marcante é a nítida
      sucessão de andares botânicos. A floresta montana basal, até aos 1150 m, conjuga faia, espruce e
      abeto-falso. O bosque montano alto estende-se até aos 1390 m. Imediatamente acima surge a faixa de
      pinheiro-anão (mugo) até aos 1650 m, culminando no andar alpino até aos 1725 m.


      Nessas clareiras rochosas vegeta a orelha-de-rato de Babia Góra (rogownica alpejska), endemismo botânico
      exclusivo. O emblema do parque é a Laserpitium archangelica (okrzyn jeleni), que na Polónia apenas era
      conhecida deste maciço. No total estão catalogadas 650 espécies vasculares e perto de 280 musgos; 70 são
      de alta montanha e 54 gozam de proteção legal.
    wildlife: >-
      O coberto arbóreo abriga os grandes carnívoros. O [urso-pardo](/especie/ursus_arctos/), o
      [lobo](/especie/canis_lupus/) e o [lince-euroasiático](/especie/lynx_lynx/) residem de forma perene no
      parque, que acolhe 38 espécies de mamíferos. O gato-bravo extinguiu-se localmente: a pele do último
      espécime abatido na vertente de Orava a 15 de janeiro de 1936 está exposta no museu do parque. O
      rato-dos-tatra sobe até bem perto da crista.


      Na avifauna, no início do século XXI registavam-se 115-119 espécies, com cerca de 100 nidificantes. O
      [tetraz-grande](/especie/tetrao_urogallus/) habita as matas superiores e o
      [tetraz-lira](/especie/tetrao_tetrix/) ocupa o pinhal anão. O petinha-ribeirinho e a rara
      ferreirinha-alpina nidificam nos penedos da cumeada. Contam-se 6 espécies de répteis e 7 de anfíbios; a
      salamandra habita a encosta florestada inferior. Nos invertebrados estão catalogadas perto de 3,5 mil
      espécies, dominadas por escaravelhos (cerca de 1500) e moluscos (92).
    visit: >-
      A circulação é permitida unicamente através dos trilhos balizados mantidos pelo clube alpino PTTK. O
      traçado amarelo da Perć Akademików é uma rota escarpada até ao cume dotada de correntes e degraus de
      ferro cravados na rocha.


      O parque concebeu oito percursos interpretativos. O trilho do vale de Rybny Potok perfaz 3,5 km numa
      caminhada de uma hora e meia sobre a fauna e as margens ripícolas. O itinerário Echa pierwotnej puszczy
      karpackiej cobre 8,4 km de Zawoja Czatoża até Fickowe Rozstaje abordando a floresta virgem. A rota Mokry
      Kozub integra 11 paragens, sobe aos 842 m e proporciona amplas perspetivas sobre a Babia Góra e o vale
      do Skawica.


      Em Zawoja, onde se situa a sede, o Centro de Educação Ambiental apresenta os valores naturais da
      montanha. No inverno, desde o dealbar de 2023, foram abertos trilhos experimentais para esqui de
      montanha condicionados à espessura da neve e à proteção da vida bravia.
    history: >-
      A primeira referência histórica à montanha data do século XV nas crónicas de Jan Długosz, tendo o
      primeiro refúgio alpino sido erguido em 1905. A linha de cumeada foi fronteira de Estado até 1918, facto
      que permitiu o desenvolvimento diferenciado de tradições e trajes pastoris.


      Em 1933 instituiu-se uma reserva natural, formalizando-se o parque nacional a 30 de outubro de 1954. Em
      1976 a UNESCO consagrou-o como Reserva da Biosfera. Em 1997 o perímetro foi ampliado para 3391,55 ha com
      uma zona de proteção periférica de 8437 ha. Babia Góra acolhe ainda 18 habitats de interesse prioritário
      comunitário.
    before: >-
      As regras do parque impõem que não te desvies dos percursos sinalizados. O vento extremo provoca
      alterações meteorológicas repentinas; consulta as previsões antes de subir.
