resumen:
  es: >-
    El espacio protegido más extenso de Castilla-La Mancha (150.000 ha), inmensas dehesas de trashumancia
    histórica y bosques robledales intactos.
  en: >-
    The largest protected space in Castilla-La Mancha (150,000 ha), featuring vast historic transhumance
    wood-pastures and intact oak forests.
  fr: >-
    Le plus grand espace protégé de Castille-La Manche (150 000 ha), d'immenses dehesas de transhumance
    historique et des chênaies intactes.
  de: >-
    Das größte Schutzgebiet Kastilien-La Manchas (150.000 ha), weite historische Transhumanz-Hainweiden und
    unberührte Eichenwälder.
  it: >-
    La più vasta area protetta di Castiglia-La Mancia (150.000 ha), con immense dehesas di pascolo storico e
    foreste di querce intatte.
  pt: >-
    A área protegida mais extensa de Castela-La Mancha (150.000 ha), acolhendo vastos montados de transumância
    histórica e carvalhais intactos.
unico:
  es: >-
    En un mismo espacio, dehesas de pastoreo antiguo, bosques mediterráneos casi intactos y un refugio de
    rapaces amenazadas y de lince ibérico.
  en: >-
    Within a single space, ancient pastoral dehesas, near-pristine Mediterranean forests, and a vital
    sanctuary for threatened raptors and the Iberian lynx.
  fr: >-
    Dans un même espace, des dehesas pastorales séculaires, des forêts méditerranéennes remarquablement
    conservées et un refuge pour rapaces menacés et lynx pardelle.
  de: >-
    In einem einzigen Schutzgebiet vereinen sich jahrhundertealte Weidedehesas, intakte mediterrane Bergwälder
    und ein Refugium für bedrohte Großgreife und den Pardelluchs.
  it: >-
    In un unico comprensorio si uniscono dehesas di antica transumanza, foreste mediterranee pressoché vergini
    e un rifugio per rapaci minacciati e lince pardina.
  pt: >-
    Num mesmo território coexistem montados de pastoreio secular, bosques mediterrânicos intocados e um
    santuário para grandes rapinas ameaçadas e o lince-ibérico.
observaciones:
  es: No camines fuera de los senderos señalizados y lleva calzado adecuado todo el año.
texto:
  es:
    intro: >-
      A mediados de septiembre, en el sur de Ciudad Real, empieza a oírse algo que viene de muy atrás: el
      bramido de los ciervos. La berrea dura hasta mediados de octubre y es solo una de las razones por las
      que el Valle de Alcudia y Sierra Madrona merece una visita. El parque se declaró natural el 10 de marzo
      de 2011 y ocupa unas 149 463 ha repartidas entre Almodóvar del Campo, Brazatortas, Cabezarrubias del
      Puerto, Fuencaliente, Hinojosas de Calatrava, Mestanza, San Lorenzo de Calatrava y Solana del Pino. Es
      una franja al sur de Ciudad Real con sierras como Madrona, Umbría de Alcudia y San Andrés, y forma parte
      de la red Natura 2000 como ZEC-ZEPA Sierra Morena.
    landscape: >-
      Son dos paisajes que se miran. El valle de Alcudia es llano y pastoril, modelado por el uso ganadero
      tradicional: amplias extensiones de dehesas de encina, majadales, vallicares y otros pastizales anuales.
      En Sierra Madrona, en cambio, se han conservado bosques mediterráneos en buen estado: encinares en las
      áreas más cálidas y secas, quejigares en las navas, alcornocales en laderas templadas y rebollares en
      las umbrías altas. El parque reúne bosques, matorrales, dehesas y bosques de galería junto a los ríos.


      Hay rarezas. Quedan fragmentos relictos de quejigar de Quercus canariensis, galerías fluviales de
      alisedas, fresnedas, saucedas y tamujares, y turberas o bonales muy bien conservados. Entre los árboles,
      el roble el Abuelo es un ejemplar señorial en el corazón de Sierra Madrona, rodeado de madroños. En
      total el valle puede albergar más de 1065 especies vegetales, 65 de ellas amenazadas. Y entre los
      monumentos naturales del parque están los Castillejos Volcánicos de la Bienvenida, la Laguna Volcánica
      de La Alberquilla y el Volcán de Alhorín.
    wildlife: >-
      Se calculan unas 275 especies de vertebrados, seis de ellas en peligro de extinción, como el [buitre
      negro](/especie/aegypius_monachus/), el [águila imperial ibérica](/especie/aquila_adalberti/), el
      [águila perdicera](/especie/aquila_fasciata/), la [cigüeña negra](/especie/ciconia_nigra/) y el [lince
      ibérico](/especie/lynx_pardinus/). Sierra Madrona es zona sensible para la conservación del águila
      imperial, el buitre negro y la cigüeña negra, y es muy importante también para el [águila
      real](/especie/aquila_chrysaetos/), el alimoche, el buitre leonado, el halcón peregrino y el búho real.
      El parque alberga más de 160 especies de aves. La sierra es hábitat de poblaciones extremadamente
      amenazadas de [lobo](/especie/canis_lupus/) y lince; hay también [gato
      montés](/especie/felis_silvestris/), meloncillo y [gineta](/especie/genetta_genetta/).


      Los ríos conservan buenas poblaciones de nutria y peces endémicos como la bogardilla, la pardilla, el
      calandino, el barbo gitano y la boga. Y toda el área es importante para muchos murciélagos cavernícolas
      de los géneros Rhinolophus, Miniopterus y Myotis.


      El calendario tiene dos citas. La berrea, de mediados de septiembre a mediados de octubre, se observa
      mejor al amanecer o al anochecer. Y con las primeras lluvias los bosques pasan del verde a una gama de
      ocres, de amarillentos a rojizos; la mejor época para visitar es la primavera y el otoño. Las grullas en
      la dehesa forman parte del paisaje.
    visit: >-
      El programa Explora tu Espacio incluye una visita al centro de interpretación y una proyección antes de
      recorrer el parque. Hay senderos de todos los tamaños. La ruta interpretada de Ojuelos, desde
      Brazatortas, es un recorrido circular de 8,3 kilómetros que puede acortarse. El sendero del Estrecho de
      Valdoro recorre 6,90 kilómetros a pie y dura unas tres horas. Y el Camino de la Ermita de la Antigua
      parte de Solana del Pino, conecta el núcleo urbano con el puerto y la ermita y alcanza el puerto de la
      Antigua a 968 metros.
    history: >-
      El valle dispone de senderos trashumantes, de abrigos de arte prehistórico de 4.000 años de antigüedad y
      de poblados mineros que usaron los romanos. Hoy se protege como parque natural y como espacio Natura
      2000.
    before: No camines fuera de los senderos señalizados y lleva calzado adecuado todo el año.
    around: >-
      El [Parque Natural Sierra de Andújar](/lugar/parque-natural-sierra-de-andujar/) está a unos dos
      kilómetros y [Sierra Morena Oriental y Despeñaperros](/lugar/sierra-morena-oriental---despenaperros/) a
      unos quince. Más lejos, el [Parque Nacional de Cabañeros](/lugar/parque-nacional-de-cabaneros/) y la
      [ZEC Montes de Toledo](/lugar/zec-montes-de-toledo/) comparten lince ibérico, águila imperial y buitre
      negro con los mismos bosques maduros y corredores fluviales, y la [Reserva Natural da Serra da
      Malcata](/lugar/reserva-natural-da-serra-da-malcata/) comparte lince y buitre negro.
  en:
    intro: >-
      In mid-September across southern Ciudad Real, an ancient autumn sound echoes through the wooded hills:
      the bellowing rut of the red deer. The rut extends through mid-October and provides just one compelling
      reason to discover the Valle de Alcudia and Sierra Madrona. Designated a natural park on 10 March 2011,
      it spans some 149,463 ha across Almodóvar del Campo, Brazatortas, Cabezarrubias del Puerto,
      Fuencaliente, Hinojosas de Calatrava, Mestanza, San Lorenzo de Calatrava, and Solana del Pino. This
      southern belt of Ciudad Real encompasses ridges such as Sierra Madrona, Umbría de Alcudia, and San
      Andrés, forming part of the Natura 2000 network as the Sierra Morena special protection area.
    landscape: >-
      Two distinct landscapes gaze upon each other. The Valle de Alcudia is a gentle, pastoral plain sculpted
      by centuries of livestock grazing: vast expanses of holm oak dehesas and rich seasonal pastures. In
      contrast, Sierra Madrona preserves exceptionally intact Mediterranean forest belts: holm oak woods on
      warm, dry slopes, gall oak groves in moist depressions, cork oak woods on temperate hillsides, and
      Pyrenean oak forests across cooler northern heights. The park weaves together mature forests, dense
      scrub, wood-pastures, and riverine gallery woods.


      Botanical rarities abound. Relict stands of Algerian oak (Quercus canariensis) persist, alongside
      riparian galleries of alder, ash, willow, and tamujo, and well-preserved peat bogs (bonales). Among
      monumental trees, El Abuelo is a venerable oak rising majestically within Sierra Madrona surrounded by
      strawberry trees. In all, the valley can host more than 1065 plant species, 65 of which are threatened.
      Notable natural monuments include the volcanic formations of Castillejos de la Bienvenida, the La
      Alberquilla crater lagoon, and the Alhorín volcano.
    wildlife: >-
      Approximately 275 vertebrate species dwell here, six of them endangered, notably the [cinereous
      vulture](/especie/aegypius_monachus/), [Spanish imperial eagle](/especie/aquila_adalberti/), [Bonelli's
      eagle](/especie/aquila_fasciata/), [black stork](/especie/ciconia_nigra/), and [Iberian
      lynx](/especie/lynx_pardinus/). Sierra Madrona is a key conservation zone for the imperial eagle,
      cinereous vulture, and black stork, while supporting crucial breeding pairs of [golden
      eagle](/especie/aquila_chrysaetos/), Egyptian vulture, griffon vulture, peregrine falcon, and Eurasian
      eagle-owl. Over 160 bird species breed or winter in the park. The sierra also shelters critically
      endangered remnants of the [grey wolf](/especie/canis_lupus/), as well as [European
      wildcats](/especie/felis_silvestris/), Egyptian mongooses, and [common
      genets](/especie/genetta_genetta/).


      Streams retain healthy populations of otters and endemic fish like the bogardilla, Iberian arched-mouth
      nase, and southern Iberian barbel. The area is also essential for cave-dwelling bats of the genera
      Rhinolophus, Miniopterus, and Myotis.


      Two seasonal highlights stand out. The autumn deer rut, from mid-September to mid-October, is best
      experienced at dawn or dusk. With the first autumn rains, the canopy shifts from deep green to warm
      ambers, russets, and golds; spring and autumn offer optimal visiting windows, when wintering common
      cranes animate the dehesas.
    visit: >-
      The Explora tu Espacio park programme includes an introduction at the visitor centre and a short film
      before you venture onto the trails. Marked paths suit all abilities. The Ojuelos interpretive route from
      Brazatortas forms an 8.3 km circular walk that can be shortened. The Estrecho de Valdoro path covers
      6.90 km on foot in roughly three hours. The Camino de la Ermita de la Antigua starts from Solana del
      Pino, connecting the village to the mountain pass and sanctuary before reaching Puerto de la Antigua at
      968 metres.


      Take time to enjoy the peace of these vast horizons.
    history: >-
      The valley contains ancient transhumance drovers' routes, rock art shelters dating back 4,000 years, and
      historic mining settlements exploited by the Romans. Today it is protected as a natural park and a
      Natura 2000 conservation site.
    before: Stay on marked trails at all times and wear sturdy walking shoes year-round.
    around: >-
      [Parque Natural Sierra de Andújar](/lugar/parque-natural-sierra-de-andujar/) lies just two kilometres
      away and [Sierra Morena Oriental y Despeñaperros](/lugar/sierra-morena-oriental---despenaperros/) around
      fifteen. Further afield, [Parque Nacional de Cabañeros](/lugar/parque-nacional-de-cabaneros/) and [ZEC
      Montes de Toledo](/lugar/zec-montes-de-toledo/) share the Iberian lynx, imperial eagle, and cinereous
      vulture in mature Mediterranean woods and river corridors, while [Reserva Natural da Serra da
      Malcata](/lugar/reserva-natural-da-serra-da-malcata/) also shelters the lynx and vulture.
  fr:
    intro: >-
      À la mi-septembre, dans le sud de Ciudad Real, retentit un écho ancestral : le brame des cerfs. Cette
      clameur s'étend jusqu'à la mi-octobre et constitue l'une des nombreuses raisons de visiter la vallée
      d'Alcudia et la Sierra Madrona. Déclaré parc naturel le 10 mars 2011, il rassemble quelque 149 463 ha
      répartis entre Almodóvar del Campo, Brazatortas, Cabezarrubias del Puerto, Fuencaliente, Hinojosas de
      Calatrava, Mestanza, San Lorenzo de Calatrava et Solana del Pino. Cette frange méridionale de la
      province englobe les massifs de Madrona, Umbría de Alcudia et San Andrés, intégrée au réseau Natura 2000
      en tant que ZEC-ZEPA Sierra Morena.
    landscape: >-
      Deux paysages se font face. La vallée d'Alcudia est une plaine pastorale modelée par l'élevage
      transhumant traditionnel : de vastes étendues de dehesas de chênes verts et de pâturages saisonniers. En
      revanche, la Sierra Madrona conserve des massifs forestiers méditerranéens en excellent état : chênaies
      vertes sur les adrets chauds, chênaies faginées dans les combes, suberaies sur les versants tempérés et
      chênaies tauzins sur les hauteurs fraîches. Le parc réunit forêts, maquis, dehesas et ripisylves.


      Les curiosités botaniques abondent. On y trouve des lambeaux relictes de chênes zéens (Quercus
      canariensis), des galeries d'aulnes, frênes et saules, ainsi que des tourbières acides (bonales)
      intactes. Parmi les arbres remarquables, le chêne El Abuelo trône en majesté au cœur de la Sierra
      Madrona parmi les arbousiers. Au total, la vallée peut héberger plus de 1065 espèces végétales, dont 65
      menacées. Parmi les monuments naturels figurent les reliefs volcaniques des Castillejos de la
      Bienvenida, le cratère de La Alberquilla et le volcan d'Alhorín.
    wildlife: >-
      On estime à environ 275 le nombre d'espèces de vertébrés, dont six en danger d'extinction comme le
      [vautour moine](/especie/aegypius_monachus/), l'[aigle ibérique](/especie/aquila_adalberti/), l'[aigle
      de Bonelli](/especie/aquila_fasciata/), la [cigogne noire](/especie/ciconia_nigra/) et le [lynx
      pardelle](/especie/lynx_pardinus/). La Sierra Madrona constitue un sanctuaire vital pour ces grands
      oiseaux, accueillant également des couples d'[aigle royal](/especie/aquila_chrysaetos/), de percnoptère,
      de vautour fauve, de faucon pèlerin et de hibou grand-duc. Le parc abrite plus de 160 espèces d'oiseaux.
      Les sierras abritent des populations relictes de [loup](/especie/canis_lupus/), ainsi que le [chat
      sauvage](/especie/felis_silvestris/), la mangouste et la [genette commune](/especie/genetta_genetta/).


      Les rivières préservent d'excellentes populations de loutres et de poissons endémiques. La zone est
      également essentielle pour les chauves-souris cavernicoles des genres Rhinolophus, Miniopterus et
      Myotis.


      Deux périodes majeures ponctuent le calendrier : le brame du cerf en automne, observable à l'aube et au
      crépuscule, et l'embrasement des feuillus avec les premières pluies d'automne. Le printemps et l'automne
      sont idéaux pour explorer la région, animée par le vol des grues cendrées.
    visit: >-
      Le programme Explora tu Espacio comprend un accueil au centre d'interprétation et une projection
      didactique. Des sentiers balisés sillonnent le parc. L'itinéraire thématique d'Ojuelos au départ de
      Brazatortas forme une boucle de 8,3 kilomètres qui peut être raccourcie. Le sentier de l'Estrecho de
      Valdoro totalise 6,90 kilomètres à pied pour environ trois heures de marche. Enfin, le chemin de la
      Ermita de la Antigua relie Solana del Pino au col de la Antigua perché à 968 mètres d'altitude.


      Prenez le temps d'apprécier la quiétude des grands espaces.
    history: >-
      La vallée recèle d'antiques chemins de transhumance, des abris sous roche ornés de peintures rupestres
      vieilles de 4 000 ans et des exploitations minières romaines. Elle est aujourd'hui protégée comme parc
      naturel et site Natura 2000.
    before: Ne quittez pas les sentiers balisés et portez des chaussures de marche adaptées en toute saison.
    around: >-
      Le [Parque Natural Sierra de Andújar](/lugar/parque-natural-sierra-de-andujar/) se trouve à environ deux
      kilomètres et [Sierra Morena Oriental y Despeñaperros](/lugar/sierra-morena-oriental---despenaperros/) à
      une quinzaine. Plus loin, le [Parque Nacional de Cabañeros](/lugar/parque-nacional-de-cabaneros/) et la
      [ZEC Montes de Toledo](/lugar/zec-montes-de-toledo/) partagent le lynx pardelle, l'aigle ibérique et le
      vautour moine dans des forêts méditerranéennes et des corridors fluviaux similaires, tandis que la
      [Reserva Natural da Serra da Malcata](/lugar/reserva-natural-da-serra-da-malcata/) accueille également
      le lynx et le vautour moine.
  de:
    intro: >-
      Mitte September ertönt im Süden der Provinz Ciudad Real ein urzeitlicher Klang: das Röhren der Hirsche.
      Die Brunftzeit dauert bis Mitte Oktober und ist nur einer der Gründe für einen Besuch im Valle de
      Alcudia und der Sierra Madrona. Das Gebiet wurde am 10. März 2011 zum Naturpark erklärt und erstreckt
      sich über 149 463 ha in den Gemeinden Almodóvar del Campo, Brazatortas, Cabezarrubias del Puerto,
      Fuencaliente, Hinojosas de Calatrava, Mestanza, San Lorenzo de Calatrava und Solana del Pino. Dieser
      Gebirgszug im Süden von Ciudad Real umfasst Kämme wie die Sierra Madrona, Umbría de Alcudia und San
      Andrés und ist Teil des Schutznetzes Natura 2000 als ZEC-ZEPA Sierra Morena.
    landscape: >-
      Zwei unterschiedliche Landschaften stehen sich gegenüber. Das Valle de Alcudia ist eine offene, ebene
      Weidelandschaft, geprägt von traditioneller Viehzucht: weite Steineichen-Dehesas und saisonale Weiden.
      In der Sierra Madrona hingegen haben sich intakte mediterrane Bergwälder erhalten: Steineichenwälder an
      warmen Hängen, Portugiesische Eichen in Senken, Korkeichen an sonnigen Flanken und Pyrenäen-Eichen in
      schattigen Höhenlagen. Der Park vereint dichte Wälder, Buschland, Dehesas und Auwälder.


      Botanische Besonderheiten sind zahlreich: Relikte der Algerischen Eiche (Quercus canariensis),
      Flussgalerien aus Erlen, Eschen und Weiden sowie gut erhaltene Torfmoore (bonales). Unter den Bäumen
      ragt die monumentale Eiche El Abuelo inmitten von Erdbeerbäumen hervor. Insgesamt beherbergt das Tal
      mehr als 1065 Pflanzenarten, darunter 65 gefährdete Taxa. Zu den Naturdenkmälern zählen die vulkanischen
      Formationen von Castillejos de la Bienvenida, der Kratersee La Alberquilla und der Vulkan Alhorín.
    wildlife: >-
      Rund 275 Wirbeltierarten leben im Gebiet, von denen sechs vom Aussterben bedroht sind, darunter
      [Mönchsgeier](/especie/aegypius_monachus/), [Spanischer Kaiseradler](/especie/aquila_adalberti/),
      [Habichtsadler](/especie/aquila_fasciata/), [Schwarzstorch](/especie/ciconia_nigra/) und
      [Pardelluchs](/especie/lynx_pardinus/). Die Sierra Madrona ist Kerngebiet für Kaiseradler, Mönchsgeier
      und Schwarzstorch und beherbergt bedeutende Brutpaare von [Steinadler](/especie/aquila_chrysaetos/),
      Schmutzgeier, Gänsegeier, Wanderfalke und Uhu. Über 160 Vogelarten brüten oder überwintern hier. Die
      Bergzüge bieten gefährdeten Restvorkommen des [Wolfs](/especie/canis_lupus/) Schutz, zusammen mit
      [Wildkatze](/especie/felis_silvestris/), Ichneumon und
      [Kleinfleck-Ginsterkatze](/especie/genetta_genetta/).


      Die Flussläufe weisen stabile Fischotterpopulationen und endemische Fischarten auf. Das Gebiet ist zudem
      bedeutsam für höhlenbewohnende Fledermäuse der Gattungen Rhinolophus, Miniopterus und Myotis.


      Zwei Zeitfenster sind ideal: die herbstliche Hirschbrunft von Mitte September bis Mitte Oktober sowie
      das Frühjahr und der Spätherbst, wenn die Wälder warme Farben annehmen und Kraniche die Dehesas beleben.
    visit: >-
      Das Besucherprogramm Explora tu Espacio umfasst eine Einführung im Informationszentrum und einen
      Filmvortrag. Ausgeschilderte Wanderwege stehen bereit: Der Rundweg von Ojuelos ab Brazatortas misst 8,3
      Kilometer und kann verkürzt werden. Der Pfad durch den Estrecho de Valdoro erstreckt sich über 6,90
      Kilometer und dauert rund drei Stunden. Der Weg zur Ermita de la Antigua beginnt in Solana del Pino und
      führt zum Gebirgspass Puerto de la Antigua auf 968 Metern.


      Genieße die Ruhe und Weite dieser unberührten Naturlandschaft.
    history: >-
      Das Tal birgt historische Transhumanzwege, Felsmalereien mit einem Alter von 4.000 Jahren und alte
      römische Minensiedlungen. Heute ist das Areal als Naturpark und Natura-2000-Gebiet geschützt.
    before: Verlasse die markierten Wege nicht und trage ganzjährig festes Schuhwerk.
    around: >-
      Der [Parque Natural Sierra de Andújar](/lugar/parque-natural-sierra-de-andujar/) liegt nur rund zwei
      Kilometer entfernt, [Sierra Morena Oriental y
      Despeñaperros](/lugar/sierra-morena-oriental---despenaperros/) etwa fünfzehn. Weiter entfernt teilen der
      [Parque Nacional de Cabañeros](/lugar/parque-nacional-de-cabaneros/) und das [ZEC Montes de
      Toledo](/lugar/zec-montes-de-toledo/) Pardelluchs, Kaiseradler und Mönchsgeier in intakten Bergwäldern
      und Flusskorridoren, während die [Reserva Natural da Serra da
      Malcata](/lugar/reserva-natural-da-serra-da-malcata/) ebenfalls Luchs und Geier beherbergt.
  it:
    intro: >-
      A metà settembre, nel sud di Ciudad Real, risuona un richiamo che affonda nella notte dei tempi: il
      bramito dei cervi. La stagione degli amori si protrae fino a metà ottobre ed è solo una delle ragioni
      per scoprire la Valle de Alcudia e la Sierra Madrona. Il parco fu dichiarato naturale il 10 marzo 2011 e
      copre circa 149 463 ha ripartiti tra Almodóvar del Campo, Brazatortas, Cabezarrubias del Puerto,
      Fuencaliente, Hinojosas de Calatrava, Mestanza, San Lorenzo de Calatrava e Solana del Pino. Questa
      dorsale meridionale include rilievi come la Sierra Madrona, l'Umbría de Alcudia e San Andrés, inserita
      nella rete Natura 2000 come ZEC-ZEPA Sierra Morena.
    landscape: >-
      Due orizzonti visivi si fronteggiano. La Valle de Alcudia è pianeggiante e rurale, plasmata dalla
      transumanza tradizionale: estese dehesas di leccio e pascoli erbosi stagionali. Nella Sierra Madrona si
      conservano invece boschi mediterranei in ottimo stato ecologico: leccete sui versanti caldi, querceti
      misti nelle conche, sugherete sui pendii temperati e boschi di rovere melojo sulle alture fresche. Il
      parco unisce boschi fitti, macchia, pascoli alberati e foreste a galleria ripariali.


      Le rarità botaniche abbondano: lembi relitti di farnia nordafricana (Quercus canariensis), gallerie
      fluviali di ontani, frassini e salici, e torbiere acide (bonales) perfettamente integre. Tra gli alberi
      monumentali primeggia la quercia El Abuelo nel cuore della Sierra Madrona, attorniata da corbezzoli. Nel
      complesso la valle può ospitare oltre 1065 specie botaniche, di cui 65 minacciate. Tra i monumenti
      geologici risaltano i Castillejos vulcanici de la Bienvenida, la laguna vulcanica de La Alberquilla e il
      vulcano di Alhorín.
    wildlife: >-
      Si stimano circa 275 specie di vertebrati, con sei specie in via di estinzione tra cui l'[avvoltoio
      monaco](/especie/aegypius_monachus/), l'[aquila imperiale iberica](/especie/aquila_adalberti/),
      l'[aquila di Bonelli](/especie/aquila_fasciata/), la [cicogna nera](/especie/ciconia_nigra/) e la [lince
      pardina](/especie/lynx_pardinus/). La Sierra Madrona è territorio nevralgico per questi grandi rapaci e
      per la lince pardina, accogliendo inoltre l'[aquila reale](/especie/aquila_chrysaetos/), il capovaccaio,
      il grifone, il falco pellegrino e il gufo reale. Il parco ospita oltre 160 specie di uccelli. Le sierre
      custodiscono nuclei critici di [lupo grigio](/especie/canis_lupus/), insieme a [gatto
      selvatico](/especie/felis_silvestris/), mangusta e [genetta](/especie/genetta_genetta/).


      I fiumi mantengono buone popolazioni di lontra e pesci endemici iberici. La regione è cruciale per i
      pipistrelli cavernicoli dei generi Rhinolophus, Miniopterus e Myotis.


      Due momenti meritano il viaggio: il bramito dei cervi all'inizio dell'autunno e la primavera fiorita. In
      autunno le prime piogge accendono le chiome di toni ramati e le gru cenerine animano le dehesas.
    visit: >-
      Il programma didattico Explora tu Espacio prevede un'accoglienza al centro visite con proiezione
      introduttiva. I percorsi segnalati si adattano a ogni passo: l'itinerario di Ojuelos da Brazatortas è un
      circuito di 8,3 chilometri accorciabile a piacere. Il tracciato dell'Estrecho de Valdoro misura 6,90
      chilometri e si percorre a piedi in circa tre ore. Il sentiero della Ermita de la Antigua parte da
      Solana del Pino e sale fino al valico omonimo a 968 metri di quota.


      Muoviti con calma per assaporare l'ampiezza del paesaggio.
    history: >-
      La valle custodisce antiche vie armentizie della transumanza, ripari con pitture rupestri risalenti a
      4.000 anni fa e antichi insediamenti minerari romani. Oggi è tutelata come parco naturale e sito Natura
      2000.
    before: Resta sempre sui tracciati segnalati e calza scarponi da trekking in tutte le stagioni.
    around: >-
      Il [Parque Natural Sierra de Andújar](/lugar/parque-natural-sierra-de-andujar/) dista appena due
      chilometri e [Sierra Morena Oriental y Despeñaperros](/lugar/sierra-morena-oriental---despenaperros/)
      circa quindici. Più distante, il [Parque Nacional de Cabañeros](/lugar/parque-nacional-de-cabaneros/) e
      la [ZEC Montes de Toledo](/lugar/zec-montes-de-toledo/) condividono lince pardina, aquila imperiale e
      avvoltoio monaco in boschi maturi e forre fluviali, mentre la [Reserva Natural da Serra da
      Malcata](/lugar/reserva-natural-da-serra-da-malcata/) ospita anch'essa lince e avvoltoio monaco.
  pt:
    intro: >-
      A meados de setembro, no sul de Ciudad Real, começa a ecoar um bramido ancestral: a época de
      acasalamento dos veados. A brama prolonga-se até meados de outubro e é apenas um dos motivos para
      visitar o Vale de Alcudia e a Sierra Madrona. O parque foi classificado como natural a 10 de março de
      2011 e abrange cerca de 149 463 ha repartidos por Almodóvar del Campo, Brazatortas, Cabezarrubias del
      Puerto, Fuencaliente, Hinojosas de Calatrava, Mestanza, San Lorenzo de Calatrava e Solana del Pino. Esta
      cintura serrana integra elevações como Madrona, Umbría de Alcudia e San Andrés, pertencendo à rede
      Natura 2000 como ZEC-ZEPA Sierra Morena.
    landscape: >-
      Dois horizontes dialogam entre si. O vale de Alcudia é aplanado e agro-pastoril, moldado pela pastorícia
      transumante secular: extensos montados de azinho e pastagens anuais. Pelo contrário, na Sierra Madrona
      conservam-se matas mediterrânicas em excelente estado: azinhais nas encostas quentes, carvalhais nas
      depressões, sobreirais nas encostas amenas e negralhais nas cumeadas frescas. O parque congrega
      florestas densas, matagais, montados e galerias ripícolas.


      As raridades botânicas são notáveis: fragmentos relíquias de carvalho-das-canárias (Quercus
      canariensis), galerias de amieiros, freixos e salgueiros, e turfeiras ácidas (bonales) preservadas.
      Entre o arvoredo destaca-se o carvalho monumental El Abuelo, erguido no coração da Sierra Madrona
      rodeado de medronheiros. No conjunto, o vale pode albergar mais de 1065 espécies vasculares, 65 das
      quais ameaçadas. Entre os monumentos naturais salientam-se os relevos vulcânicos de Castillejos de la
      Bienvenida, a lagoa vulcânica de La Alberquilla e o vulcão de Alhorín.
    wildlife: >-
      Estimam-se cerca de 275 espécies de vertebrados, com seis em perigo crítico como o
      [abutre-preto](/especie/aegypius_monachus/), a [águia-imperial-ibérica](/especie/aquila_adalberti/), a
      [águia-de-bonelli](/especie/aquila_fasciata/), a [cegonha-preta](/especie/ciconia_nigra/) e o
      [lince-ibérico](/especie/lynx_pardinus/). A Sierra Madrona é território vital para a preservação destas
      espécies e do lince, albergando também casais de [águia-real](/especie/aquila_chrysaetos/),
      abutre-do-egito, abutre-fouveiro, falcão-peregrino e bufo-real. Mais de 160 espécies de aves habitam o
      parque. As serras mantêm núcleos muito frágeis de [lobo-cinzento](/especie/canis_lupus/), além de
      [gato-bravo](/especie/felis_silvestris/), saca-rabos e [gineta](/especie/genetta_genetta/).


      Os rios sustentam boas populações de lontra e peixes fluviais endémicos. A região é igualmente crucial
      para morcegos cavernícolas dos géneros Rhinolophus, Miniopterus e Myotis.


      O calendário destaca dois momentos: a brama dos veados no início do outono e a primavera florida. Com as
      primeiras chuvas outonais as folhas tingem-se de cobre e os grous-comuns povoam os montados.
    visit: >-
      O programa Explora tu Espacio inclui passagem pelo centro de acolhimento e projeção multimédia. Os
      percursos adaptam-se a vários níveis: o trilho interpretativo de Ojuelos a partir de Brazatortas perfaz
      um anel de 8,3 quilómetros que pode ser encurtado. O percurso do Estrecho de Valdoro soma 6,90
      quilómetros a pé em cerca de três horas. Já o caminho da Ermita de la Antigua parte de Solana del Pino e
      alcança o porto de montanha homónimo a 968 metros.


      Aprecia a serenidade e a amplitude destas serras.
    history: >-
      O vale conserva canadas reais de transumância, abrigos com arte rupestre de 4.000 anos de antiguidade e
      vestígios de mineração romana. Encontra-se hoje protegido como parque natural e território Natura 2000.
    before: Permanece sempre nos trilhos traçados e utiliza calçado de caminhada adequado ao longo de todo o ano.
    around: >-
      O [Parque Natural Sierra de Andújar](/lugar/parque-natural-sierra-de-andujar/) dista apenas cerca de
      dois quilómetros e [Sierra Morena Oriental y
      Despeñaperros](/lugar/sierra-morena-oriental---despenaperros/) cerca de quinze. Mais longe, o [Parque
      Nacional de Cabañeros](/lugar/parque-nacional-de-cabaneros/) e a [ZEC Montes de
      Toledo](/lugar/zec-montes-de-toledo/) partilham o lince-ibérico, a águia-imperial e o abutre-preto em
      matas maduras e corredores fluviais, enquanto a [Reserva Natural da Serra da
      Malcata](/lugar/reserva-natural-da-serra-da-malcata/) abriga igualmente lince e abutre-preto.
