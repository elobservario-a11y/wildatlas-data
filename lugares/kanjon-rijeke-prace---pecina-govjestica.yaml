resumen:
  es: >-
    Garganta profunda kárstica con un trazado de ferrocarril abandonado que alberga Pećina Govještica (la
    cueva más larga de Bosnia, de casi 10 km).
  en: >-
    Deep karst gorge following an abandoned narrow-gauge railway trace sheltering Pećina Govještica (Bosnia's
    longest cave, nearly 10 km).
  fr: >-
    Profonde gorge karstique empruntant une ancienne voie ferrée désaffectée abritant la Pećina Govještica (la
    plus longue grotte de Bosnie, près de 10 km).
  de: >-
    Tiefe Karstschlucht entlang einer stillgelegten Schmalspurbahntrasse mit der Pećina Govještica (Bosniens
    längste Höhle, fast 10 km).
  it: >-
    Profonda forra carsica lungo una ferrovia a scartamento ridotto dismessa che cela la Pećina Govještica (la
    grotta più lunga di Bosnia, quasi 10 km).
  pt: >-
    Garganta cárstica profunda ao longo de uma ferrovia desativada que alberga a Pećina Govještica (a gruta
    mais longa da Bósnia, quase 10 km).
unico:
  es: >-
    Un cañón al que se entra por una vía de tren abandonada y que esconde la cueva más larga del país, con un
    lago interior que se cruza en barca.
  en: >-
    A canyon entered along an abandoned railway track that hides the country's longest subterranean labyrinth,
    featuring an inner lake crossed by raft.
  fr: >-
    Un canyon auquel on accède par une voie de chemin de fer abandonnée, abritant la plus vaste grotte du pays
    avec un lac intérieur franchi en canot.
  de: >-
    Eine Schlucht, die man über eine verlassene Bahntrasse betritt und die das längste Höhlensystem des Landes
    birgt, mit einem Höhlensee, den man im Boot quert.
  it: >-
    Un canyon a cui si accede camminando sui binari dismessi e che nasconde la cavità più estesa del paese,
    con un lago interno da attraversare in gommone.
  pt: >-
    Um desfiladeiro acedido por uma linha férrea abandonada que encerra o maior labirinto subterrâneo do país,
    com um lago interior cruzado em bote.
observaciones:
  es: >-
    El acceso exige vadear el río, y el nivel del agua del lago de la cueva varía con las lluvias. Comprueba
    antes de ir el estado de los accesos y las condiciones de visita con la organización turística de la
    República Srpska.
texto:
  es:
    intro: >-
      Para llegar a las cuevas hay que vadear un río. Es el Prača, que ha tallado en el este de la República
      Srpska un cañón de más de 400 m de profundidad donde antes pasaba un ferrocarril de vía estrecha, y es
      por esa antigua vía, y por unos veinte túneles, por donde se llega a Govještica, la cueva más larga de
      Bosnia y Herzegovina, de casi diez kilómetros. El cañón del Prača es una garganta de caliza, cuevas,
      bosques y aguas limpias que el instituto de patrimonio de la República Srpska ha estudiado para
      proclamarla parque natural.
    landscape: >-
      El río Prača nace en el Vrelo Praće, en las laderas norte de Jahorina, a 1.540 m, y es afluente
      izquierdo del Drina, al que llega en Ustiprača. En su tramo medio ha excavado una garganta de 14,7 km,
      de los cuales 11,8 km quedan dentro del espacio protegido. Las paredes del valle son muy escarpadas y
      superan los 400 m de profundidad en algunos sectores. El parque natural Prača ocupa 4.067,89 ha en el
      municipio de Rogatica.


      El motivo es la roca. En la margen izquierda, las gruesas capas de caliza triásica han formado numerosas
      formas kársticas subterráneas, y la más importante es el sistema de Govještica. La cueva está en el
      cañón, a los pies del macizo de Romanija, unos 40 km al este de Sarajevo. Su entrada, a 580 m, es grande
      y a la vez un manantial; poco después el pasillo se bifurca. A menos de un kilómetro está Mračna Pećina
      o Banj Stijena, y la tercera del conjunto es Golubovićka.


      Por el valle pasó el ferrocarril de vía estrecha Sarajevo–Užice, construido por Austria-Hungría en 1903
      y suprimido en 1976. Hoy esa traza sirve de acceso: recorrerla es atravesar alrededor de veinte túneles.
    wildlife: >-
      El cañón es un refugio: gran número de plantas endémicas y relictas hacen de él un centro de
      biodiversidad. El estudio botánico registró 714 taxones en el sector investigado, y alrededor de 66 son
      endémicos. Entre los peces están la trucha de arroyo, el tímalo y otro más, y todas las especies indican
      aguas limpias y de buena calidad.


      Se registraron 85 especies de aves, 13 de ellas en el anexo I de la directiva europea de aves. En el
      campo de Batovo, en la meseta, se anotaron 45 especies de aves, el mayor número del área. De los 13
      mamíferos hallados, la [nutria](/especie/lutra_lutra/) es la más amenazada en la República Srpska, y el
      [oso pardo](/especie/ursus_arctos/) también vive en la zona.


      Bajo tierra viven una gran colonia de murciélagos, de unos mil individuos, y la especie cavernícola
      Anthroherpon cylindricollis; también se encontraron restos de oso de las cavernas en Govještica y Banja
      Stijena.
    visit: >-
      Desde varios miradores en los bordes de la meseta se ve el cañón del Prača, el rasgo más marcado del
      relieve. Para llegar a las cuevas hay que vadear el Prača, y el primer lago de Govještica se cruza en
      barca. Nada más entrar hay que cruzar un pequeño lago cuyo tamaño varía con las precipitaciones.


      Banja Stijena es una de las cuevas más bellas de la República Srpska por sus formaciones; tiene coladas,
      estalactitas, columnas y, al final del canal de entrada, leche de luna. En Govještica, la sala mayor se
      aproxima a 100 por 100 m, y entre las formas raras hay cristales de calcita y excéntricas.


      Govještica es peligrosa: tiene numerosas verticales, lagos, sifones y simas de más de 60 m de
      profundidad. No es una cueva para entrar sin equipo ni experiencia.
    history: >-
      Desde 2010 un equipo internacional de espeleólogos de Italia y Bosnia y Herzegovina explora la zona,
      incluida la meseta de Romanija. Italianos de Bolonia y Novara, con el Centro de Karst y Espeleología de
      Sarajevo, empezaron la exploración de la cueva.
    before: >-
      El acceso exige vadear el río, y el nivel del agua del lago de la cueva varía con las lluvias. Comprueba
      antes de ir el estado de los accesos y las condiciones de visita con la organización turística de la
      República Srpska.
    around: >-
      Hacia el otro lado queda el [Parque Nacional Tara](/lugar/nacionalni-park-tara---planinske-sume/), con
      sus bosques de montaña. Más lejos, el [Parque Nacional
      Pieniny](/lugar/pieninski-park-narodowy---dunajec-gorge/) comparte con el Prača la garganta, el karst y
      el tímalo.
  en:
    intro: >-
      To reach the caves, you must wade across a clear mountain river. This is the Prača, which has carved a
      limestone canyon over 400 m deep through eastern Republika Srpska where a steam railway once ran. Today,
      it is along that abandoned trackbed and through some twenty dark tunnels that you approach Govještica,
      the longest cave in Bosnia and Herzegovina, extending for nearly ten kilometres. The Prača Canyon is a
      wilderness of karst cliffs, caverns, virgin forests, and rushing waters surveyed by the heritage
      institute for designation as a nature park.
    landscape: >-
      The Prača River springs from Vrelo Praće on the northern slopes of Mount Jahorina at 1,540 m, flowing as
      a left tributary into the Drina at Ustiprača. Along its middle course it has incised a 14.7 km gorge, of
      which 11.8 km lie protected within the reserve boundaries. Its valley walls are exceptionally
      precipitous, dropping more than 400 m sheer in several sections. The Prača Nature Park encompasses
      4,067.89 ha within Rogatica municipality.


      The secret lies in the rock. On the left bank, thick strata of Middle Triassic limestone have nurtured
      extensive subterranean karst systems, foremost among them the Govještica complex. The cave sits within
      the canyon at the foot of the Romanija plateau, roughly 40 km east of Sarajevo. Its portal, positioned
      at 580 m, forms both a massive cavern mouth and an active periodic spring; just inside, the main conduit
      branches. Less than a kilometre away lies Mračna Pećina (Banj Stijena), with Golubovićka completing the
      three cavern portals.


      Through the gorge once ran the historic Sarajevo–Užice narrow-gauge railway, engineered under
      Austro-Hungarian rule in 1903 and dismantled in 1976. Today the abandoned gravel railway grade provides
      pedestrian access through approximately twenty unlit rock tunnels.
    wildlife: >-
      The gorge acts as an ecological refuge: a wealth of endemic and relict plant species establishes it as a
      major regional biodiversity hotspot. Botanical surveys identified 714 vascular plant taxa across the
      studied sector, around 66 of which are regional endemics. Fish fauna includes brown trout and European
      grayling, both demanding cold, highly oxygenated waters.


      Bird surveys documented 85 species, including 13 listed on Annex I of the EU Birds Directive. On the
      Batovo plateau above the canyon, 45 bird species were recorded, representing the area's richest avian
      diversity. Among 13 documented mammal species, the [Eurasian otter](/especie/lutra_lutra/) ranks as the
      most endangered in Republika Srpska, while [brown bears](/especie/ursus_arctos/) roam the higher forest
      slopes.


      Subterranean chambers shelter a maternity bat colony of some one thousand bats, alongside rare
      troglobitic beetles like Anthroherpon cylindricollis; fossilized remains of extinct cave bears have also
      been excavated in Govještica and Banja Stijena.
    visit: >-
      From several natural clifftop viewpoints along the canyon rim, you can survey the gorge of the Prača,
      the defining landform of the region. Reaching the cave portals requires wading across the riverbed, and
      exploring Govještica begins by paddling an inflatable raft across an initial subterranean lake whose
      depth varies with rainfall.


      Nearby Banja Stijena is celebrated as one of Republika Srpska's most ornate speleological jewels,
      adorned with flowstones, stalactites, draperies, and moonmilk deposits. Inside Govještica, the grand
      hall spans nearly 100 by 100 m, sheltering rare helictites and glistening calcite crystals.


      Govještica is hazardous: it features steep vertical drops, deep lakes, sumps, and abyssal pits exceeding
      60 m in depth. It must never be entered without professional caving equipment and technical training.
    history: >-
      Since 2010, an international team of speleologists from Italy and Bosnia and Herzegovina has been
      exploring the system beneath the Romanija plateau. Italian cavers from Bologna and Novara, working
      alongside the Center for Karst and Speleology in Sarajevo, spearheaded modern mapping of the cave.
    before: >-
      Accessing the cave portals requires wading the river, and the subterranean water level fluctuates
      dramatically with rainfall. Confirm trail conditions and current access permits with the Tourist
      Organization of Republika Srpska before travelling.
    around: >-
      To the east lies [Tara National Park](/lugar/nacionalni-park-tara---planinske-sume/) with its pristine
      montane forests. Further away, [Pieniny National Park](/lugar/pieninski-park-narodowy---dunajec-gorge/)
      shares with the Prača its limestone gorge, karst caves, and thriving grayling waters.
  fr:
    intro: >-
      Pour atteindre les grottes, il faut d'abord traverser une rivière à gué. C'est la Prača, qui a entaillé
      dans l'est de la République serbe de Bosnie un canyon de plus de 400 m de profondeur où passait jadis un
      train à voie étroite. C'est en suivant cette voie désaffectée et une vingtaine de tunnels obscurs que
      l'on parvient à Govještica, la plus longue cavité de Bosnie-Herzégovine avec près de dix kilomètres de
      galeries. Le canyon de la Prača est un sanctuaire de falaises calcaires, de grottes et d'eaux limpides
      étudié pour devenir parc naturel.
    landscape: >-
      La rivière Prača prend sa source au Vrelo Praće sur le versant nord du mont Jahorina à 1 540 m, pour
      rejoindre la Drina en rive gauche à Ustiprača. Dans son cours moyen, elle a creusé une gorge de 14,7 km,
      dont 11,8 km sont protégés au sein de la réserve. Ses parois rocheuses sont abruptes et dépassent 400 m
      de commandement par endroits. Le parc naturel de la Prača s'étend sur 4 067,89 ha dans la municipalité
      de Rogatica.


      Ce relief grandiose est dicté par le calcaire triasique de la rive gauche, propice à une intense
      karstification souterraine dont le réseau de Govještica forme le joyau. La cavité s'ouvre au pied du
      plateau de Romanija, à environ 40 km à l'est de Sarajevo. Son porche d'entrée à 580 m d'altitude fait
      également office d'émergence vauclusienne ; à l'intérieur, la galerie principale se dédouble. À moins
      d'un kilomètre se trouve Mračna Pećina (Banj Stijena), complétée par la grotte de Golubovićka.


      Par cette gorge transitait la ligne à voie étroite Sarajevo–Užice, bâtie sous l'Empire austro-hongrois
      en 1903 et fermée en 1976. L'ancienne plateforme sert aujourd'hui d'accès pédestre à travers une
      vingtaine de tunnels bruts.
    wildlife: >-
      Le canyon constitue un refuge majeur : un grand nombre d'espèces endémiques et reliques en font un haut
      lieu de biodiversité. Les inventaires botaniques recensent 714 taxons végétaux dans le secteur, dont
      environ 66 endémiques régionaux. Les eaux vives abritent la truite fario et l'ombre commun, gages d'une
      excellente qualité d'eau.


      On y a répertorié 85 espèces d'oiseaux, dont 13 inscrites à l'annexe I de la directive européenne
      Oiseaux. Le plateau de Batovo rassemble à lui seul 45 espèces aviennes. Parmi les 13 espèces de
      mammifères observées, la [loutre d'Europe](/especie/lutra_lutra/) est la plus menacée en République
      serbe de Bosnie, tandis que l'[ours brun](/especie/ursus_arctos/) hante les versants boisés.


      Sous terre réside une colonie d'environ un millier de chauves-souris ainsi que le coléoptère cavernicole
      Anthroherpon cylindricollis ; des ossements fossiles d'ours des cavernes ont également été mis au jour
      dans les salles de Govještica et Banja Stijena.
    visit: >-
      Plusieurs belvédères naturels sur le plateau dominent le canyon de la Prača. Pour gagner l'entrée des
      cavités, il faut traverser le lit de la Prača à gué, et la découverte de Govještica commence par la
      traversée en canot pneumatique d'un premier lac souterrain dépendant des crues.


      Banja Stijena est l'une des grottes les plus ornées de la région, riche en draperies, colonnes et dépôts
      de mondmilch. Dans Govještica, la salle principale s'approche de 100 mètres sur 100 m, abritant
      d'admirables excentriques et cristaux de calcite.


      Govještica demeure périlleuse : elle comprend des puits verticaux, des siphons et des gouffres de plus
      de 60 m de profondeur. Il est exclu d'y pénétrer sans équipement de spéléologie homologué et expérience
      technique.
    history: >-
      Depuis 2010, une équipe internationale de spéléologues italiens et bosniens explore ce complexe sous le
      plateau de Romanija. Des spécialistes de Bologne et Novare associés au Centre de karstologie de Sarajevo
      ont entrepris la topographie moderne du réseau.
    before: >-
      L'accès impose de traverser la rivière à gué, et le plan d'eau d'entrée réagit aux précipitations.
      Informez-vous auprès de l'Office de tourisme de la République serbe de Bosnie sur les conditions de
      sécurité avant toute excursion.
    around: >-
      De l'autre côté de la frontière s'élève le [Parc national de
      Tara](/lugar/nacionalni-park-tara---planinske-sume/) et ses forêts de montagne. Plus loin, le [Parc
      national des Piénines](/lugar/pieninski-park-narodowy---dunajec-gorge/) partage avec la Prača ses parois
      calcaires et ses cours d'eau à ombres.
  de:
    intro: >-
      Um die Höhlen zu erreichen, musst du einen Gebirgsfluss durchwaten. Es ist die Prača, die im Osten der
      Republika Srpska eine über 400 m tiefe Schlucht gegraben hat, durch die einst eine Schmalspurbahn
      dampfte. Entlang dieser Bahntrasse und durch rund zwanzig Felstunnel gelangt man zur Govještica, der mit
      fast zehn Kilometern Ausdehnung längsten Höhle von Bosnien und Herzegowina. Der Prača-Canyon ist eine
      wilde Schlucht aus Kalkwänden, Höhlen, Wäldern und klarem Wasser, die als Naturpark ausgewiesen wird.
    landscape: >-
      Die Prača entspringt an der Quelle Vrelo Praće an den Nordhängen der Jahorina auf 1.540 m und mündet bei
      Ustiprača von links in die Drina. Im Mittellauf hat sie eine 14,7 km lange Schlucht eingeschnitten, von
      der 11,8 km im Schutzgebiet liegen. Ihre Wände ragen steil empor und erreichen stellenweise über 400 m
      Wandhöhe. Der Naturpark Prača umfasst 4.067,89 ha im Gemeindegebiet von Rogatica.


      Grundlage ist das Gestein: Am linken Flussufer schufen mächtige triassische Kalksteine ein verzweigtes
      Karstsystem, dessen Herzstück die Govještica bildet. Die Höhle liegt am Fuß des Romanija-Massivs, etwa
      40 km östlich von Sarajevo. Ihr Portal auf 580 m Höhe dient zugleich als periodische Karstquelle; im
      Inneren teilt sich der Gang. Weniger als einen Kilometer entfernt liegt die Mračna Pećina (Banj
      Stijena), ergänzt durch die Golubovićka-Höhle.


      Durch das Tal führte die Schmalspurbahn Sarajevo–Užice, 1903 von Österreich-Ungarn erbaut und 1976
      stillgelegt. Heute dient das Schotterbett als Wanderzugang durch rund zwanzig unbeleuchtete Tunnel.
    wildlife: >-
      Die Schlucht dient als eiszeitliches Refugium: Zahlreiche endemische Pflanzenarten begründen ihren Ruf
      als Biodiversitäts-Hotspot. Botaniker erfassten 714 Pflanzenarten im Untersuchungsgebiet, darunter etwa
      66 regionale Endemiten. Im Fluss leben Bachforellen und Äschen als Zeigerarten exzellenter
      Wasserqualität.


      Man registrierte 85 Vogelarten, darunter 13 der EU-Vogelschutzrichtlinie. Auf dem Batovo-Plateau wurden
      45 Vogelarten nachgewiesen. Unter den 13 festgestellten Säugetierarten gilt der
      [Fischotter](/especie/lutra_lutra/) als am stärksten bedroht, während der
      [Braunbär](/especie/ursus_arctos/) die Bergwälder durchstreift.


      Im Höhleninneren überwintert eine Fledermauskolonie von rund tausend Tieren, und der blinde Höhlenkäfer
      Anthroherpon cylindricollis lebt im Dunkeln; zudem wurden Höhlenbärenknochen in Govještica und Banja
      Stijena geborgen.
    visit: >-
      Aussichtspunkte am Rand der Hochebene eröffnen weite Tiefblicke in den Prača-Canyon. Um die Höhlen zu
      erreichen, muss die Prača zu Fuß durchwatet werden; der erste See im Portalbereich der Govještica wird
      mit einem Schlauchboot befahren.


      Die Banja Stijena gilt dank prachtvoller Sinterbecken, Tropfsteine und Montmilch als Schauhöhle von
      seltener Schönheit. In der Govještica misst der größte Saal annähernd 100 mal 100 m und beherbergt
      bizarre Exzentriker und Calcitkristalle.


      Govještica birgt Gefahren: Schächte, Siphons und Abgründe von über 60 m Tiefe fordern alpine
      Höhlenerfahrung und professionelle Ausrüstung.
    history: >-
      Seit 2010 erforscht ein internationales Team von Höhlenforschern aus Italien und Bosnien das System
      unter der Romanija-Hochebene. Forscher aus Bologna und Novara kartierten die Gänge gemeinsam mit dem
      Zentrum für Karstologie in Sarajevo.
    before: >-
      Der Zugang verlangt das Durchwaten des Gebirgsflusses; der Wasserstand im Höhlensee schwankt
      wetterabhängig. Informiere dich vorab bei der Tourismusorganisation der Republika Srpska über die
      Wegeverhältnisse.
    around: >-
      Östlich erhebt sich der [Nationalpark Tara](/lugar/nacionalni-park-tara---planinske-sume/) mit
      Bergmischwäldern. Weiter entfernt teilt der
      [Pieninen-Nationalpark](/lugar/pieninski-park-narodowy---dunajec-gorge/) mit der Prača Karstschluchten
      und fischreiche Flüsse.
  it:
    intro: >-
      Per raggiungere le grotte occorre guadare un torrente montano. È la Prača, che nell'est della Republika
      Srpska ha scavato una forra profonda oltre 400 m dove un tempo correva una ferrovia a scartamento
      ridotto. Oggi è lungo quella massicciata abbandonata e attraversando una ventina di gallerie che si
      giunge a Govještica, la grotta più estesa della Bosnia ed Erzegovina, lunga quasi dieci chilometri. Il
      canyon della Prača è un corridoio selvaggio di calcare, cavità e acque cristalline studiato per
      l'istituzione a parco naturale.
    landscape: >-
      Il fiume Prača sorge al Vrelo Praće sulle pendici settentrionali della Jahorina a 1.540 m, confluendo da
      sinistra nella Drina a Ustiprača. Nel tratto mediano ha scavato una forra di 14,7 km, di cui 11,8 km
      protetti nella riserva. Le pareti rocciose sono vertiginose e superano i 400 m di dislivello in vari
      punti. Il parco naturale Prača copre 4.067,89 ha nel territorio di Rogatica.


      Il fenomeno si deve al substrato: sulla sponda sinistra, bancate di calcari triassici hanno originato
      complessi ipogei, tra cui spicca Govještica. La cavità si apre ai piedi del massiccio di Romanija, circa
      40 km a est di Sarajevo. L'ingresso, posto a 580 m, costituisce anche una risorgiva carsica attiva; poco
      oltre il corridoio si sdoppia. A meno di un chilometro si trova Mračna Pećina (Banj Stijena), a cui si
      affianca la grotta Golubovićka.


      Lungo la valle transitava la ferrovia Sarajevo–Užice, realizzata dall'Impero austro-ungarico nel 1903 e
      chiusa nel 1976. Oggi il tracciato ferrato fa da via d'accesso pedonale attraverso una ventina di tunnel
      scavati nella roccia.
    wildlife: >-
      La forra è un rifugio biologico: specie endemiche e relitte ne fanno un nodo primario di biodiversità.
      Le ricerche botaniche hanno censito 714 entità vegetali nell'area, di cui circa 66 endemiche. Nel fiume
      nuotano trote e temoli, sentinelle di purezza acquatica.


      Sono state rilevate 85 specie di uccelli, di cui 13 tutelate dalla direttiva europea. Sul pianoro di
      Batovo nidificano 45 specie avicole. Tra i 13 mammiferi riscontrati, la [lontra
      europea](/especie/lutra_lutra/) è la più minacciata nella Republika Srpska, mentre l'[orso
      bruno](/especie/ursus_arctos/) popola le boscaglie circostanti.


      Nelle profondità staziona una colonia di pipistrelli di circa mille individui insieme al coleottero
      cieco Anthroherpon cylindricollis; nelle sale di Govještica e Banja Stijena sono stati rinvenuti resti
      fossili di orso delle caverne.
    visit: >-
      Diversi punti panoramici sul bordo dell'altopiano dominano la gola della Prača. L'avvicinamento richiede
      di guadare il fiume a piedi, e la visita di Govještica inizia trasbordando su un gommone un primo lago
      sotterraneo soggetto alle piogge.


      Banja Stijena è celebre per le sue concrezioni, ricca di stalattiti, colonne e depositi di latte di
      luna. In Govještica il salone principale tocca quasi 100 per 100 m di ampiezza, celando rare eccentriche
      e cristalli di calcite.


      Govještica è un ambiente severo: presenta salti verticali, sifoni e pozzi profondi oltre 60 m. Non va
      mai affrontata senza dotazione speleologica completa.
    history: >-
      Dal 2010 una squadra italo-bosniaca di speleologi esplora il sistema sotto l'altopiano di Romanija.
      Speleologi di Bologna e Novara assieme al Centro per il Carsismo di Sarajevo hanno curato il rilievo
      topografico del complesso.
    before: >-
      L'accesso impone il guado del corso d'acqua e il livello del lago interno risente delle precipitazioni.
      Verifica le condizioni di sicurezza con l'organizzazione turistica locale prima dell'escursione.
    around: >-
      Sul versante opposto sorge il [Parco nazionale di Tara](/lugar/nacionalni-park-tara---planinske-sume/)
      con le sue abetaie. Più distante, il [Parco nazionale dei
      Pienini](/lugar/pieninski-park-narodowy---dunajec-gorge/) condivide con la Prača gole calcaree e acque a
      temoli.
  pt:
    intro: >-
      Para chegar às grutas terás de vadear um rio caudaloso. É o Prača, que rasgou no leste da República
      Sérvia da Bósnia um desfiladeiro com mais de 400 m de profundidade onde dantes corria um comboio a vapor
      de via estreita. É por essa ferrovia abandonada e através de cerca de vinte túneis escuros que se atinge
      Govještica, a maior gruta da Bósnia e Herzegovina, com quase dez quilómetros de galerias. O canhão do
      Prača é um santuário de escarpas calcárias, algares e águas puras estudado para classificação como
      parque natural.
    landscape: >-
      O rio Prača nasce em Vrelo Praće nas encostas norte do monte Jahorina a 1.540 m, desaguando pela margem
      esquerda no Drina em Ustiprača. No seu troço médio escavou uma garganta com 14,7 km, dos quais 11,8 km
      estão protegidos na reserva. As vertentes rochosas são escarpadas e superam 400 m de desnível vertical
      em vários pontos. O parque natural do Prača ocupa 4.067,89 ha no município de Rogatica.


      A causa reside no relevo: na margem esquerda, espessos estratos de calcário triásico formaram vastos
      sistemas cársticos, destacando-se o complexo de Govještica. A gruta abre-se no sopé do planalto de
      Romanija, cerca de 40 km a leste de Sarajevo. A entrada, a 580 m de altitude, funciona igualmente como
      nascente cárstica; pouco depois a galeria divide-se. A menos de um quilómetro situa-se Mračna Pećina
      (Banj Stijena), a que se junta a cavidade de Golubovićka.


      Pelo desfiladeiro passava a linha férrea de via estreita Sarajevo–Užice, construída pelo Império
      Austro-Húngaro em 1903 e suprimida em 1976. O leito de balastro serve hoje de acesso pedestre
      atravessando cerca de vinte túneis escavados na rocha.
    wildlife: >-
      O canhão funciona como refúgio biológico: plantas endémicas e relíquias fazem dele um foco de
      biodiversidade. Levantamentos botânicos registaram 714 taxa vegetais, dos quais cerca de 66 são
      endemismos regionais. Nos rios nadam trutas-fario e tímalos, indicadores de águas límpidas.


      Identificaram-se 85 espécies de aves, incluindo 13 inscritas na Diretiva Aves europeia. No planalto de
      Batovo registaram-se 45 espécies de aves. De entre 13 espécies de mamíferos, a
      [lontra-europeia](/especie/lutra_lutra/) é a mais ameaçada na República Sérvia, coexistindo com o
      [urso-pardo](/especie/ursus_arctos/) nas encostas florestadas.


      Nas profundezas abriga-se uma colónia de cerca de mil morcegos e o escaravelho cavernícola cego
      Anthroherpon cylindricollis; encontraram-se ossadas fósseis de ursos-das-cavernas em Govještica e Banja
      Stijena.
    visit: >-
      Diversos miradouros na orla do planalto dominam a imponente garganta do Prača. Chegar às grutas exige
      vadear o leito do rio, e a entrada em Govještica faz-se transpondo em bote insuflável um primeiro lago
      subterrâneo.


      Banja Stijena destaca-se pelas formações espeleológicas ornamentais, com estalactites, colunas e
      depósitos de leite-de-lua. Em Govještica, a grande sala atinge quase 100 por 100 m, abrigando cristais
      de calcite e raras excêntricas.


      Govještica encerra perigos sérios: tem poços verticais, sifões e abismos com mais de 60 m de
      profundidade. É desaconselhável entrar sem treino técnico e equipamento de espeleologia.
    history: >-
      Desde 2010 uma equipa internacional de espeleólogos de Itália e da Bósnia explora o sistema sob o
      planalto de Romanija. Espeleólogos de Bolonha e Novara associados ao Centro de Carstologia de Sarajevo
      elaboraram a topografia do complexo.
    before: >-
      A aproximação exige vadear o rio, e o nível das águas no lago de entrada sobe com as chuvas. Confirma as
      condições de segurança junto da organização de turismo antes da visita.
    around: >-
      Para lá da fronteira ergue-se o [Parque Nacional Tara](/lugar/nacionalni-park-tara---planinske-sume/)
      com as suas florestas montanhosas. Mais longe, o [Parque Nacional
      Pieniny](/lugar/pieninski-park-narodowy---dunajec-gorge/) partilha com o Prača desfiladeiros calcários e
      rios com tímalo.
