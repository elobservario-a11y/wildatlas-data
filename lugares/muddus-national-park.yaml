resumen:
  es: >-
    El reino primario de la taiga boreal y las turberas intactas en Laponia (Patrimonio Mundial UNESCO),
    célebre por pinos de más de 700 años sobrevivientes a incendios históricos.
  en: >-
    The pristine realm of boreal taiga and untouched peatlands in Laponia (UNESCO World Heritage), famous for
    pines over 700 years old that survived historical forest fires.
  fr: >-
    Le royaume primaire de la taïga boréale et des tourbières intactes en Laponie (Patrimoine mondial de
    l'UNESCO), célèbre pour ses pins de plus de 700 ans ayant survécu à des incendies historiques.
  de: >-
    Das Urwaldreich der borealen Taiga und intakten Moore in Laponia (UNESCO-Welterbe), berühmt für über 700
    Jahre alte Kiefern, die historische Waldbrände überstanden.
  it: >-
    Il regno primario della taiga boreale e delle torbiere intatte in Lapponia (Patrimonio Mondiale UNESCO),
    celebre per i pini di oltre 700 anni sopravvissuti a incendi storici.
  pt: >-
    O reino primário da taiga boreal e das turfeiras intactas na Lapónia (Património Mundial da UNESCO),
    célebre por pinheiros com mais de 700 anos sobreviventes a incêndios históricos.
unico:
  es: Un bosque antiguo de pinos gigantes, cruzado por turberas inmensas, cascadas y barrancos profundos.
  en: An ancient forest of giant pines, criss-crossed by immense mires, cascading waterfalls, and deep ravines.
  fr: Une forêt ancienne de pins géants, entrecoupée d'immenses tourbières, de cascades et de gorges profondes.
  de: Ein uralter Wald aus Riesskiefern, durchzogen von riesigen Mooren, Wasserfällen und tiefen Schluchten.
  it: Una foresta antica di pini giganti, attraversata da immense torbiere, cascate e profondi canyon.
  pt: >-
    Uma floresta antiga de pinheiros gigantes, entrecortada por imensas turfeiras, cascatas e desfiladeiros
    fundos.
observaciones:
  es: >-
    Está prohibido molestar a propósito a los renos que pastan o el trabajo de sus pastores, y dejar basura.
    La carretera de Skájdde puede cerrarse en primavera y principios de verano, cuando el terreno se vuelve
    blando e inestable. Consulta además los avisos de Laponia antes de salir. El Naturum anuncia temporada de
    primavera y verano hasta septiembre.
texto:
  es:
    intro: >-
      Casi la mitad de Muddus es turbera. Tenlo presente cuando mires el mapa: este parque de la Laponia
      sueca, al este de la cordillera y entre Jokkmokk y Gällivare, no es una sucesión de montañas sino un
      mosaico de agua quieta, bosque de coníferas y brezales abiertos, con un bosque antiguo de pinos gigantes
      y barrancos hondos intercalados. Los sami lo llaman Muttos. Es parque nacional desde 1942, y hoy forma
      parte del patrimonio mundial de Laponia.
    landscape: >-
      La base es de granito. Sobre él el hielo escribió lo demás. Cuando el casquete continental se fundía,
      enormes caudales de deshielo excavaron el barranco de Måskosgårsså, hoy seco y empinado, que se abre de
      pronto en medio del bosque. Y las crestas que atraviesan el parque, que siguieron como una cola al hielo
      en retirada, serpentean todavía por Muttos.


      Ese bosque no es uniforme. Hay pinares pobres, de tierra magra, y bosques pantanosos de pícea más
      productivos. En los húmedos de pícea la vegetación es rica, y allí viven las orquídeas *norna* y
      *skogsfru*: esta última, rara, crece en viejos bosques de pícea y puede pasar varios años sin florecer.
      En las turberas aparece una planta rara, la *myrbräcka*.


      En el sur, el río Muttosälven desemboca en Stora Luleälv. En el centro, la cascada Muddusfallet o
      Muttosagahtjaldak cae desde 42 metros de altura.
    wildlife: >-
      Las turberas abiertas son el mejor sitio para buscar [alces](/especie/alces_alces/) y
      [renos](/especie/rangifer_tarandus/): es más probable verlos cuando salen a campo abierto que dentro del
      bosque denso. En las turberas crían el cisne cantor, el ánsar campestre y el ánade rabudo.


      El bosque antiguo guarda un tesoro. La [marta](/especie/martes_martes/) y el
      [urogallo](/especie/tetrao_urogallus/) tienen aquí un reducto más firme de lo normal en Laponia. Entre
      los mamíferos de presencia bastante habitual figuran el armiño, la comadreja y la
      [nutria](/especie/lutra_lutra/). Y de las aves, aparecen con regularidad el azor, el aguilucho pálido y
      búhos como el *jorduggla* y el *lappuggla*.


      Mira también los troncos: las marcas rectangulares que dejan las antiguas extracciones de corteza
      muestran que alguien tomó corteza para comida o almacenaje.


      La regeneración del fuego tiene su propia escena. El último gran incendio fue en 2006, y desde la
      entrada de Skájdde hay un par de kilómetros a pie hasta la zona quemada, donde se ve cómo el bosque se
      recupera poco a poco. La temporada ideal va de junio a septiembre; en invierno se puede esquiar entre
      las cabañas.
    visit: >-
      La entrada principal es Skájdde, a la que se llega desde Jokkmokk por la E45. Allí hay puntos de
      información, fogones, aseos, pasarelas y rampas: una entrada nueva, accesible. La cascada queda a siete
      kilómetros. También se puede entrar por el este desde Sárggavárre y Urtimjaur o Urdávrre, junto a la
      carretera de Messaure.


      Hay dos circuitos. El corto, Muttosleden, atraviesa la cascada y el profundo barranco de Måskosgårsså.
      El largo, Muttosbálges o Muddusleden, pasa por la cascada, Muttosluoppal, Manson, Nammavárre y
      Måskosgårsså. Desde la torre de Muttosluoppal ves lagos, turberas que se extienden kilómetros y las
      montañas en el horizonte. El camino de Manson, junto a una pequeña cabaña roja, atraviesa brezales de
      pino y bosque antiguo, con huellas de gente que ha pasado por aquí durante miles de años.


      El centro de visitantes más completo es el Naturum Laponia, en Viedásnjárgga, ya dentro de Stora
      Sjöfallet. Explica montañas, bosques, humedales y estaciones, y por qué el reno es central en la cultura
      sami. Tiene visitas guiadas, préstamo de prismáticos y una exposición adaptada a la movilidad reducida.
    history: >-
      A mediados del siglo XIX alguien desbrozó la vegetación para asentarse junto a Muddusjaure. Los colonos
      aguantaron algo más de cincuenta años en un lugar durísimo, hasta que la casa se abandonó en 1909. Los
      pastores de renos, por su parte, llevaron cencerros: sin ellos no habrían podido mantener a sus animales
      en el bosque.


      Las decisiones importantes sobre el patrimonio de Laponia se toman por consenso. El plan Natura de
      Muddus busca mantener los hábitats de las aves que crían, descansan o se alimentan, de modo que no haya
      influencia humana que empeore sus condiciones.
    before: >-
      Está prohibido molestar a propósito a los renos que pastan o el trabajo de sus pastores, y dejar basura.
      La carretera de Skájdde puede cerrarse en primavera y principios de verano, cuando el terreno se vuelve
      blando e inestable. Consulta además los avisos de Laponia antes de salir. El Naturum anuncia temporada
      de primavera y verano hasta septiembre.
    around: >-
      Muddus comparte el patrimonio de Laponia con Sarek, Stora Sjöfallet y Padjelanta, pero pertenecer al
      mismo patrimonio no implica ser colindante, y en el atlas no tiene vecinos cercanos. Sí tiene lugares
      afines: el [Parque Nacional de Gutulia](/lugar/gutulia-national-park/), el [Parque Nacional de
      Hamra](/lugar/hamra-national-park/) y el [Parque Nacional Urho
      Kekkonen](/lugar/urho-kekkonen-national-park/) coinciden en pico tridáctilo, alce y oso pardo, y en
      bosque primario y turbera. El [Parque Nacional de Białowieża - Reserva
      Estricta](/lugar/bialowieski-park-narodowy---rezerwat-scisly/) comparte el pico tridáctilo, el oso pardo
      y el bosque primario.
  en:
    intro: >-
      Nearly half of Muddus is mire. Keep that in mind when you look at the map: this national park in Swedish
      Lapland, lying east of the high mountain chain between Jokkmokk and Gällivare, is not a sequence of
      alpine summits but a wilderness mosaic of still water, coniferous woodland, and open heath, studded with
      old-growth pine forests and sudden deep gorges. The Sámi call it Muttos. It has been a national park
      since 1942, and today forms an integral component of the Laponia World Heritage site.
    landscape: >-
      The foundation is Precambrian granite. Over this bedrock, glacial ice sculpted everything else. As the
      continental ice sheet receded, violent torrents of meltwater gouged the Måskosgårsså canyon, a
      steep-sided, dry chasm that opens abruptly in the middle of the woods. Sinuous esker ridges, formed
      along the tail of retreating glaciers, still snake across the Muttos landscape.


      This forest is far from uniform. Stunted pine woods grow on nutrient-poor sandy soils, while wetter
      spruce mire forests prove considerably more productive. In these damp spruce stands, understorey flora
      flourishes: here grow the calypso orchid (*norna*) and ghost orchid (*skogsfru*), the latter a rare
      inhabitant of ancient spruce groves that can remain dormant underground for years without flowering. The
      open mires shelter another botanical rarity, the yellow marsh saxifrage (*myrbräcka*).


      To the south, the Muttosälven River drains into the Stora Luleälv. In the park's heart, the Muddusfallet
      or Muttosagahtjaldak waterfall plunges 42 metres over a sheer rock shelf.
    wildlife: >-
      The expansive open mires provide your best opportunity to spot [moose](/especie/alces_alces/) and
      [reindeer](/especie/rangifer_tarandus/): you are far more likely to observe them out on the open bogs
      than hidden within dense timber. Nesting waterbirds on the mires include whooper swans, bean geese, and
      northern pintails.


      The ancient taiga harbours its own treasures. The [European pine marten](/especie/martes_martes/) and
      [western capercaillie](/especie/tetrao_urogallus/) maintain strongholds here that are unusually robust
      for Lapland. Regularly observed mammals include stoats, weasels, and the [Eurasian
      otter](/especie/lutra_lutra/). Among birds of prey and owls, northern goshawks, hen harriers,
      short-eared owls (*jorduggla*), and great grey owls (*lappuggla*) appear consistently.


      Inspect the older pine trunks as you hike: distinct rectangular scars tell of historical bark-harvesting
      by Sámi people, who gathered the nutrient-rich inner bark for food and storage.


      Fire ecology has its own living exhibit here. The last major wildfire struck in 2006; from the Skájdde
      trailhead, a walk of a couple of kilometres brings you into the burn zone, where you can watch the slow
      natural regeneration of the boreal forest. The prime visiting season runs from June to September; in
      winter, Nordic skiers travel between wilderness huts.
    visit: >-
      The main park entrance is Skájdde, accessible from Jokkmokk along the E45 highway. Facilities there
      include interpretive panels, campfire pits, compost toilets, boardwalks, and ramps, forming an
      accessible modern gateway. The waterfall lies seven kilometres from the trailhead. Alternative eastern
      access points are at Sárggavárre and Urtimjaur (Urdávrre), just off the Messaure road.


      There are two primary trail loops. The shorter Muttosleden trail leads past the waterfall and the sheer
      Måskosgårsså canyon. The longer circuit, Muttosbálges or Muddusleden, connects the waterfall with
      Muttosluoppal, Manson, Nammavárre, and Måskosgårsså. From the observation tower at Muttosluoppal you
      look out over lakes, peatlands stretching for kilometres, and distant mountain peaks. The trail by
      Manson passes a small red wilderness cabin through pine heaths and primeval woods marked by thousands of
      years of human passage.


      The regional visitor centre is Naturum Laponia at Viedásnjárgga inside Stora Sjöfallet. It illuminates
      the mountains, forests, wetlands, and seasonal cycles of Laponia, highlighting the central role of
      reindeer in Sámi culture. It provides guided walks, binocular rentals, and fully accessible exhibitions.
    history: >-
      In the mid-nineteenth century settlers cleared virgin ground to establish a homestead near Lake
      Muddusjaure. The settlers persevered for a little over fifty years in this demanding subarctic climate
      before the homestead was finally abandoned in 1909. Sámi reindeer herders, for their part, historically
      fitted bells to their animals; without bells, locating reindeer within the dense taiga would have been
      impossible.


      Key conservation decisions in the Laponia World Heritage area are reached through consensus. The Natura
      management plan for Muddus focuses on preserving undisturbed habitats for breeding, resting, and
      foraging birds, preventing human disturbances from degrading wilderness conditions.
    before: >-
      Intentionally disturbing grazing reindeer or interfering with the work of Sámi herders is strictly
      prohibited, as is leaving litter. The access road to Skájdde may be temporarily closed during spring and
      early summer thaw when the roadbed softens. Always consult Laponia management notices before visiting.
      The Naturum operates on a spring and summer schedule through September.
    around: >-
      Muddus shares Laponia World Heritage status with Sarek, Stora Sjöfallet, and Padjelanta, but shared
      heritage does not mean contiguity, and the park has no immediate neighbours within the atlas. It does,
      however, share close ecological parallels: [Gutulia National Park](/lugar/gutulia-national-park/),
      [Hamra National Park](/lugar/hamra-national-park/), and [Urho Kekkonen National
      Park](/lugar/urho-kekkonen-national-park/) all feature three-toed woodpecker, moose, brown bear, primary
      taiga, and intact mires. [Białowieża National Park - Strict
      Reserve](/lugar/bialowieski-park-narodowy---rezerwat-scisly/) shares the three-toed woodpecker, brown
      bear, and primeval woodland ecosystem.
  fr:
    intro: >-
      Près de la moitié de Muddus est faite de tourbières. Gardez-le à l'esprit en regardant la carte : ce
      parc national de Laponie suédoise, situé à l'est de la chaîne alpine entre Jokkmokk et Gällivare, n'est
      pas un alignement de sommets mais une vaste mosaïque d'eaux dormantes, de forêts boréales et de landes
      ouvertes, parsemée de pinèdes séculaires aux arbres colossaux et de défilés abrupts. Les Samis
      l'appellent Muttos. Il est érigé en parc national dès 1942 et fait aujourd'hui partie intégrante du bien
      sériel de Laponia inscrit au patrimoine mondial.
    landscape: >-
      Le socle est constitué de granite ancien. Sur cette roche, les glaciers quaternaires ont gravé le reste.
      Lors de la fonte de la calotte continentale, de gigantesques torrents de débâcle ont affouillé le canyon
      de Måskosgårsså, aujourd'hui une gorge sèche et abrupte qui s'ouvre de manière impromptue au milieu des
      résineux. Les crêtes d'eskers, abandonnées au fil du recul glaciaire, serpentent toujours à travers le
      territoire de Muttos.


      Ce manteau forestier est tout sauf homogène. Des pinèdes clairsemées s'accrochent aux sols sableux les
      plus pauvres, tandis que les pessières tourbeuses humides s'avèrent bien plus productives. Dans ces
      pessières d'ombre prospère une flore remarquable : on y croise la calypso bulbeuse (*norna*) et la
      racine-de-corail (*skogsfru*), cette dernière, rarissime, pouvant demeurer plusieurs années sous terre
      sans émettre de fleurs. Dans les tourbières ouvertes pousse une autre rareté botanique, la saxifrage
      jaune des tourbières (*myrbräcka*).


      Au sud, la rivière Muttosälven termine sa course dans le Stora Luleälv. En plein cœur du parc, la
      cascade de Muddusfallet ou Muttosagahtjaldak précipite ses eaux de 42 mètres de hauteur.
    wildlife: >-
      Les vastes tourbières ouvertes représentent le meilleur observatoire pour déceler
      l'[élan](/especie/alces_alces/) et le [renne](/especie/rangifer_tarandus/) : vous avez bien plus de
      chances de les apercevoir lorsqu'ils gagnent ces clairières marécageuses qu'au cœur de la forêt touffue.
      Sur les tourbières se reproduisent le cygne chanteur, l'oie des moissons et le canard pilet.


      La vieille taïga protège un trésor biologique. La [martre des pins](/especie/martes_martes/) et le
      [grand tétras](/especie/tetrao_urogallus/) y trouvent un sanctuaire d'une densité exceptionnelle pour la
      Laponie. Parmi les mammifères régulièrement observés figurent l'hermine, la belette et la [loutre
      d'Europe](/especie/lutra_lutra/). Chez les oiseaux de proie, l'autour des palombes, le busard
      Saint-Martin ainsi que la chouette épervière (*jorduggla*) et la chouette lapone (*lappuggla*) nichent
      régulièrement.


      Observez également les vieux troncs de pin : des cicatrices rectangulaires rappellent les prélèvements
      traditionnels d'écorce interne réalisés autrefois par les Samis pour la nourriture et la conservation.


      La régénération après incendie offre ici une scène saisissante. Le dernier grand feu de forêt est
      survenu en 2006 ; depuis l'entrée de Skájdde, une marche de deux kilomètres mène à la zone calcinée, où
      l'on constate la lente résilience de la taïga. La saison idéale s'étend de juin à septembre ; en hiver,
      le ski nordique permet de relier les refuges du parc.
    visit: >-
      L'accès principal est Skájdde, accessible depuis Jokkmokk en empruntant la route E45. On y trouve des
      points d'information, des aires de feu aménagées, des toilettes sèches, des passerelles et des rampes :
      un aménagement moderne et accessible. La cascade se trouve à sept kilomètres de là. Il est également
      possible d'entrer par l'est depuis Sárggavárre et Urtimjaur (Urdávrre), le long de la route de Messaure.


      Deux grands itinéraires balisés s'offrent au randonneur. La boucle courte, Muttosleden, dessert la chute
      d'eau et le défilé encaissé de Måskosgårsså. La longue boucle, Muttosbálges ou Muddusleden, relie la
      cascade, Muttosluoppal, Manson, Nammavárre et Måskosgårsså. Depuis la tour d'observation de
      Muttosluoppal, le regard embrasse les lacs, des tourbières s'étendant sur des kilomètres et les cimes
      lointaines. Le sentier de Manson, près d'une cabane en bois rouge, traverse des landes à pins et des
      massifs anciens empreints de millénaires de présence humaine.


      Le centre d'accueil de référence est le Naturum Laponia, situé à Viedásnjárgga au sein du parc de Stora
      Sjöfallet. Il retrace la vie des montagnes, des forêts et des zones humides au fil des saisons, et
      explique la place centrale du renne dans la culture samie. Il organise des sorties accompagnées, prête
      des jumelles et propose une muséographie accessible aux personnes à mobilité réduite.
    history: >-
      Au milieu du XIXe siècle, des colons défrichèrent la taïga pour implanter une ferme isolée près du lac
      Muddusjaure. Ces pionniers affrontèrent le rude climat subarctique pendant un peu plus de cinquante ans,
      jusqu'à l'abandon de l'exploitation en 1909. Les éleveurs de rennes samis ont pour leur part toujours
      muni leurs bêtes de sonnailles : sans elles, retrouver les hardes dans l'épaisseur des sous-bois boréaux
      aurait été impossible.


      Les décisions majeures relatives au patrimoine de Laponia sont arrêtées selon un principe de gestion
      concertée. Le plan de gestion Natura de Muddus s'attache à préserver la quiétude des aires de
      nidification, de repos et d'alimentation de l'avifaune afin qu'aucun impact humain ne vienne dégrader
      les milieux.
    before: >-
      Il est formellement interdit de perturber délibérément les troupeaux de rennes au pâturage ou d'entraver
      le travail des éleveurs samis, ainsi que d'abandonner des déchets. La piste d'accès à Skájdde peut être
      temporairement fermée au printemps et au début de l'été lorsque le dégel rend la chaussée trop meuble.
      Consultez les avis officiels de Laponia avant votre départ. Le Naturum fonctionne en horaires de haute
      saison estivale jusqu'en septembre.
    around: >-
      Muddus partage le classement UNESCO de Laponia avec Sarek, Stora Sjöfallet et Padjelanta, bien que cette
      reconnaissance commune n'implique pas de contiguïté directe et qu'il n'ait pas de voisins immédiats dans
      l'atlas. Il possède en revanche des équivalents écologiques manifestes : le [Parc National de
      Gutulia](/lugar/gutulia-national-park/), le [Parc National de Hamra](/lugar/hamra-national-park/) et le
      [Parc National Urho Kekkonen](/lugar/urho-kekkonen-national-park/) réunissent également le pic
      tridactyle, l'élan, l'ours brun ainsi que les écosystèmes de taïga primaire et de tourbières. Le [Parc
      national de Białowieża - Réserve intégrale](/lugar/bialowieski-park-narodowy---rezerwat-scisly/) partage
      pour sa part le pic tridactyle, l'ours brun et la forêt primaire.
  de:
    intro: >-
      Fast die Hälfte von Muddus besteht aus Moor. Behalte das im Hinterkopf, wenn du auf die Karte schaust:
      Dieser Nationalpark in Schwedisch-Lappland, östlich des Hochgebirges zwischen Jokkmokk und Gällivare
      gelegen, ist keine Abfolge von Berggipfeln, sondern ein Mosaik aus stillen Wassern, Nadelwäldern und
      offenen Heiden, durchsetzt von uralten Kiefernwäldern und unvermittelten Schluchten. Die Samen nennen
      das Gebiet Muttos. Seit 1942 ist es Nationalpark und heute fester Bestandteil des UNESCO-Welterbes
      Laponia.
    landscape: >-
      Das Fundament besteht aus Granit. Auf diesem Urgestein hat das Eis alles Übrige geformt. Als der
      Inlandeisschild abschmolz, gruben gewaltige Schmelzwassermassen die Schlucht Måskosgårsså aus, eine
      heute trockene, steile Klamm, die sich unvermittelt mitten im Wald auftut. Auch Oser-Rücken, die dem
      zurückweichenden Eis wie Schutzkämme folgten, ziehen sich bis heute durch Muttos.


      Dieser Wald ist keineswegs eintönig. Karge Kiefernwälder wachsen auf mageren Sandböden, während
      feuchtere Fichtenmoorwälder deutlich wüchsiger sind. In den feuchten Fichtenbeständen gedeiht eine
      reiche Krautschicht: Hier leben die Orchideenarten Norna (Calypso bulbosa) und Skogsfru (Epipogium
      aphyllum); Letztere ist selten, wächst in alten Fichtenwäldern und kann jahrelang im Boden verharren,
      ohne zu blühen. Auf den offenen Mooren kommt mit Myrbräcka (Saxifraga hirculus) eine weitere botanische
      Kostbarkeit vor.


      Im Süden mündet der Fluss Muttosälven in den Stora Luleälv. Im Herzen des Parks stürzt der Wasserfall
      Muddusfallet oder Muttosagahtjaldak aus 42 Metern Höhe in die Tiefe.
    wildlife: >-
      Die offenen Moorflächen sind der beste Ort, um nach [Elch](/especie/alces_alces/) und
      [Ren](/especie/rangifer_tarandus/) Ausschau zu halten: Im freien Gelände lassen sie sich weitaus eher
      blicken als im Dickicht des Waldes. Auf den Mooren brüten Singschwan, Saatgans und Spießente.


      Die alte Taiga hütet kostbare Vorkommen. [Baummarder](/especie/martes_martes/) und
      [Auerhuhn](/especie/tetrao_urogallus/) besitzen hier Bestände von für Lappland ungewöhnlicher Dichte.
      Unter den regelmäßig vorkommenden Säugetieren finden sich Hermelin, Mauswiesel und [Eurasischer
      Fischotter](/especie/lutra_lutra/). Bei den Vögeln sind Habicht, Kornweihe sowie Eulen wie Sumpfohreule
      (*jorduggla*) und Bartkauz (*lappuggla*) regelmäßige Gäste.


      Achte auch auf die Stämme der alten Kiefern: Rechteckige Schnittspuren zeugen von der historischen
      Rindengewinnung durch die Samen, die das nahrhafte Bastgewebe als Nahrungsmittel oder zur Vorratshaltung
      nutzten.


      Die Waldverjüngung nach Brandereignissen lässt sich hier eindrucksvoll beobachten. Das letzte Großfeuer
      loderte 2006; vom Parkeingang Skájdde aus führt eine Wanderung von zwei Kilometern zur Brandfläche, auf
      der sich der Taigawald Schritt für Schritt erholt. Die beste Besuchszeit reicht von Juni bis September;
      im Winter lässt sich das Schutzgebiet auf Skiern von Hütte zu Hütte erkunden.
    visit: >-
      Der Haupteingang ist Skájdde, den du von Jokkmokk aus über die E45 erreichst. Dort findest du
      Informationstafeln, Feuerstellen, Trockentoiletten, Holzstege und Zugangsrampen – ein moderner,
      barrierefreier Zugang. Der Wasserfall liegt sieben Kilometer entfernt. Weitere Zugänge von Osten bieten
      Sárggavárre und Urtimjaur (Urdávrre) an der Straße nach Messaure.


      Zwei markierte Hauptrouten stehen zur Wahl. Der kürzere Rundweg Muttosleden führt am Wasserfall und an
      der tiefen Schlucht Måskosgårsså vorbei. Der längere Weg, Muttosbálges oder Muddusleden, verknüpft
      Wasserfall, Muttosluoppal, Manson, Nammavárre und Måskosgårsså. Vom Aussichtsturm in Muttosluoppal
      blickst du über weite Seen, kilometerlange Moore und die fernen Berge am Horizont. Der Weg bei Manson
      führt an einer kleinen roten Wildnishütte vorbei durch Kiefernheiden und Urwald mit Spuren
      jahrtausendelanger menschlicher Präsenz.


      Das umfassendste Besucherzentrum ist das Naturum Laponia in Viedásnjárgga im Nationalpark Stora
      Sjöfallet. Es veranschaulicht Berge, Wälder, Feuchtgebiete und Jahreszeiten und zeigt, warum das Ren im
      Zentrum der samischen Kultur steht. Es bietet geführte Touren, Fernglasverleih und eine barrierefreie
      Ausstellung.
    history: >-
      Mitte des neunzehnten Jahrhunderts rodeten Siedler den Wald, um sich am See Muddusjaure niederzulassen.
      Die Kolonisten hielten unter den harten subarktischen Bedingungen etwas mehr als fünfzig Jahre lang
      durch, bis der Hof 1909 endgültig aufgegeben wurde. Samische Rentierzüchter wiederum statteten ihre
      Herden traditionell mit Glocken aus: Ohne deren Klang wäre es unmöglich gewesen, die Rentiere im dichten
      Nadelwald wiederzufinden.


      Bedeutende Entscheidungen über das Welterbe Laponia werden im Konsens getroffen. Der
      Natura-Managementplan für Muddus zielt darauf ab, ungestörte Lebensräume für brütende, rastende und
      nahrungssuchende Vögel dauerhaft zu sichern, damit keine menschlichen Störungen die natürlichen
      Verhältnisse verschlechtern.
    before: >-
      Es ist streng verboten, weidende Rentiere mutwillig zu stören, die Arbeit der Züchter zu behindern oder
      Abfälle zu hinterlassen. Die Zufahrtsstraße nach Skájdde kann im Frühjahr und Frühsommer vorübergehend
      gesperrt sein, wenn der Boden durch das Auftauen weich und instabil wird. Beachte vorab die aktuellen
      Meldungen der Laponia-Verwaltung. Das Naturum hat bis September geöffnet.
    around: >-
      Muddus teilt den Welterbestatus Laponia mit Sarek, Stora Sjöfallet und Padjelanta, doch eine gemeinsame
      Welterbestätte bedeutet keine unmittelbare Nachbarschaft, und im Atlas gibt es keine direkten Nachbarn.
      Dafür existieren enge landschaftliche Parallelen: Der [Gutulia National
      Park](/lugar/gutulia-national-park/), der [Hamra National Park](/lugar/hamra-national-park/) und der
      [Urho Kekkonen National Park](/lugar/urho-kekkonen-national-park/) weisen Dreizehenspecht, Elch,
      Braunbär sowie Urwald und intakte Moore auf. Der [Nationalpark Białowieża - Strenges
      Reservat](/lugar/bialowieski-park-narodowy---rezerwat-scisly/) teilt Dreizehenspecht, Braunbär und das
      Primärwaldökosystem.
  it:
    intro: >-
      Quasi la metà di Muddus è formata da torbiere. Tienilo presente quando osservi la mappa: questo parco
      nazionale della Lapponia svedese, situato a est della catena montuosa tra Jokkmokk e Gällivare, non è un
      susseguirsi di cime alpine ma un mosaico di acque calme, foreste di conifere e brughiere aperte,
      intervallato da boschi vetusti di pini maestosi e gole improvvise. I sami lo chiamano Muttos. È parco
      nazionale dal 1942 e oggi fa parte del patrimonio mondiale di Laponia.
    landscape: >-
      Il basamento geologico è di granito. Su questa roccia primaria, il ghiaccio ha scolpito tutto il resto.
      Durante il disgelo dell'immensa calotta continentale, violente piene erosero la gola di Måskosgårsså,
      oggi un canyon asciutto e scosceso che si spalanca inaspettatamente tra gli alberi. E i lunghi cordoni
      morenici degli esker, formati lungo la scia dei ghiacciai in arretramento, serpeggiano tuttora
      attraverso il territorio di Muttos.


      Questa distesa boscata non è affatto monotona. Pinete rade crescono su sabbie povere di nutrienti,
      mentre i boschi palustri di abete rosso risultano assai più produttivi. Nelle umide abetine la flora del
      sottobosco è rigogliosa: qui allignano rare orchidee selvatiche come la calipso (*norna*) e l'orchidea
      fantasma (*skogsfru*); quest'ultima, estremamente rara, cresce nelle vecchie foreste di abete rosso e
      può trascorrere molti anni sottoterra prima di fiorire. Nelle torbiere aperte compare un'altra rarità
      botanica, la sassifraga delle paludi (*myrbräcka*).


      A sud, il fiume Muttosälven confluisce nello Stora Luleälv. Nel centro del parco, la cascata di
      Muddusfallet o Muttosagahtjaldak compie un salto di 42 metri d'altezza.
    wildlife: >-
      Le ampie torbiere aperte sono il posto ideale per avvistare l'[alce](/especie/alces_alces/) e la
      [renna](/especie/rangifer_tarandus/): è molto più facile scorgerli quando escono in aperta pianura
      rispetto all'intrico del bosco fuso. Nelle torbiere nidificano il cigno selvatico, l'oca granaiola e il
      codone comune.


      La vecchia taiga cela valori faunistici straordinari. La [martora](/especie/martes_martes/) e
      l'[urogallo](/especie/tetrao_urogallus/) mantengono qui roccaforti di densità superiore rispetto alle
      medie della Lapponia. Tra i mammiferi avvistati abitualmente compaiono l'ermellino, la donnola e la
      [lontra europea](/especie/lutra_lutra/). Tra i rapaci stazionano regolarmente l'astore, l'albanella
      reale e rapaci notturni come il gufo di palude (*jorduggla*) e l'allocco di Lapponia (*lappuggla*).


      Osserva anche i tronchi dei pini secolari: evidenti incisioni rettangolari testimoniano l'antica
      asportazione della corteccia interna effettuata dai sami per l'alimentazione e la conservazione.


      La dinamica post-incendio ha qui un proprio teatro naturale. L'ultimo grande incendio boschivo risale al
      2006; dall'accesso di Skájdde una camminata di due chilometri conduce all'area bruciata, dove si
      apprezza la tenace rigenerazione spontanea della taiga. Il periodo consigliato va da giugno a settembre;
      d'inverno il parco si attraversa con gli sci tra i vari rifugi.
    visit: >-
      L'accesso principale è Skájdde, raggiungibile da Jokkmokk percorrendo la statale E45. Lì si trovano
      punti informativi, aree barbecue, servizi igienici a secco, passerelle e rampe: un ingresso moderno e
      accessibile. La cascata dista sette chilometri. È possibile accedere anche da oriente partendo da
      Sárggavárre e Urtimjaur (Urdávrre), lungo la provinciale di Messaure.


      I percorsi segnalati principali sono due. Il circuito breve, Muttosleden, costeggia la cascata e la
      profonda gola di Måskosgårsså. Il tracciato lungo, Muttosbálges o Muddusleden, collega la cascata con
      Muttosluoppal, Manson, Nammavárre e Måskosgårsså. Dalla torretta panoramica di Muttosluoppal la vista
      spazia su specchi d'acqua, torbiere sterminate e cime montuose all'orizzonte. Il sentiero presso Manson
      attraversa pinete e foreste primarie costellate di tracce umane millenarie.


      Il centro visitatori comprensoriale è il Naturum Laponia a Viedásnjárgga, situato nello Stora Sjöfallet.
      Illustra rilievi montuosi, foreste, acquitrini e cicli stagionali, approfondendo il ruolo cardine della
      renna nella civiltà sami. Offre escursioni con guida, noleggio cannocchiali e percorsi espositivi privi
      di barriere architettoniche.
    history: >-
      A metà del diciannovesimo secolo alcuni coloni dissodarono la taiga per stabilire una fattoria isolata
      vicino al lago Muddusjaure. I pionieri resistettero per poco più di cinquant'anni in un contesto
      subartico estremo, fino all'abbandono del podere nel 1909. I pastori di renne sami, dal canto loro,
      munivano le loro bestie di campanacci: senza quel suono sarebbe stato impossibile rintracciare gli
      animali nella fitta taiga.


      Le decisioni di tutela nel comprensorio di Laponia vengono deliberate per consenso unanime. Il piano di
      gestione Natura di Muddus tutela i quartieri riproduttivi, di sosta e di foraggiamento dell'avifauna,
      affinché nessuna interferenza umana ne comprometta l'equilibrio.
    before: >-
      È categoricamente vietato disturbare deliberatamente le renne al pascolo, ostacolare il lavoro dei
      pastori sami e disperdere rifiuti. La strada per Skájdde può restare temporaneamente chiusa in primavera
      o a inizio estate quando il fondo sterrato si ammorbidisce con il disgelo. Consulta i bollettini
      ufficiali di Laponia prima di partire. Il Naturum osserva orari estivi fino a settembre.
    around: >-
      Muddus condivide il riconoscimento UNESCO di Laponia con Sarek, Stora Sjöfallet e Padjelanta, benché la
      titolarità congiunta non implichi contiguità territoriale, e nell'atlas non conta confinanti immediati.
      Vanta però affinità ambientali evidenti: il [Parco Nazionale di Gutulia](/lugar/gutulia-national-park/),
      il [Parco Nazionale di Hamra](/lugar/hamra-national-park/) e il [Parco Nazionale Urho
      Kekkonen](/lugar/urho-kekkonen-national-park/) presentano picchio tridattilo, alce, orso bruno nonché
      taiga primaria e torbiere incontaminate. Il [Parco nazionale di Białowieża - Riserva
      integrale](/lugar/bialowieski-park-narodowy---rezerwat-scisly/) condivide il picchio tridattilo, l'orso
      bruno e l'ecosistema di foresta primaria.
  pt:
    intro: >-
      Quase metade de Muddus é turfeira. Lembra-te disso quando olhares para o mapa: este parque da Lapónia
      sueca, situado a leste da cordilheira alpina entre Jokkmokk e Gällivare, não é uma sucessão de montanhas
      escarpadas, mas um mosaico de águas paradas, taiga de coníferas e urzais abertos, intervalado por matas
      seculares de pinheiros gigantes e desfiladeiros abruptos. Os sami chamam-lhe Muttos. É parque nacional
      desde 1942 e integra hoje o sítio do património mundial de Laponia.
    landscape: >-
      A rocha de base é granito antigo. Sobre ele, o gelo glaciar moldou todo o relevo. Quando o manto de gelo
      continental derreteu, caudais colossais de degelo escavaram o desfiladeiro de Måskosgårsså, hoje uma
      garganta seca e inclinada que se abre de forma abrupta por entre a floresta. E os cômoros de esker que
      acompanharam a retração dos glaciares serpenteiam ainda hoje pelo território de Muttos.


      Esta floresta boreal está longe de ser uniforme. Matas abertas de pinheiro ocupam solos arenosos pobres,
      enquanto os bosques pantanosos de espruce se mostram bem mais produtivos. Nos setores húmidos de espruce
      a vegetação rasteira é exuberante: ali medram as orquídeas raras *norna* (Calypso bulbosa) e *skogsfru*
      (Epipogium aphyllum); esta última habita matas maduras de coníferas e pode passar anos seguidos no
      subsolo sem florescer. Nas turfeiras abertas surge outra espécie vegetal invulgar, a *myrbräcka*
      (Saxifraga hirculus).


      A sul, o rio Muttosälven desagua no Stora Luleälv. No centro do parque, a cascata de Muddusfallet ou
      Muttosagahtjaldak despenha-se de 42 metros de altura.
    wildlife: >-
      As vastas turfeiras abertas são o melhor local para avistar o [alce](/especie/alces_alces/) e a
      [rena](/especie/rangifer_tarandus/): é muito mais provável observá-los quando saem para a planície
      pantanosa do que no seio da taiga densa. Nas turfeiras nidificam o cisne-bravo, o ganso-campestre e o
      pato-arrabio.


      A floresta vetusta abriga valores faunísticos de peso. A [marta](/especie/martes_martes/) e o
      [tetraz-grande](/especie/tetrao_urogallus/) mantêm aqui núcleos reprodutores com solidez invulgar para o
      contexto da Lapónia. Entre os mamíferos de ocorrência regular contam-se o arminho, a doninha e a
      [lontra-europeia](/especie/lutra_lutra/). Quanto às aves, surgem com assiduidade o açor, o
      tartaranhão-azulado e corujas boreais como a coruja-do-nabal (*jorduggla*) e a coruja-lapónica
      (*lappuggla*).


      Examina também a casca dos pinheiros vetustos: incisões retangulares testemunham a recolha histórica de
      casca interior realizada pelos sami para alimentação e conservação.


      A dinâmica regenerativa do fogo tem aqui um mostruário expressivo. O último grande incêndio florestal
      lavrou em 2006; a partir do acesso de Skájdde, uma caminhada de dois quilómetros conduz à área queimada,
      onde se testemunha a recuperação paulatina da taiga. A época ideal vai de junho a setembro; no inverno é
      possível percorrer o parque em esquis entre os abrigos de montanha.
    visit: >-
      A entrada principal é Skájdde, com acesso a partir de Jokkmokk pela autoestrada E45. Aí encontras pontos
      de acolhimento, áreas de fogueira, sanitários secos, passadiços e rampas: uma infraestrutura moderna e
      acessível. A queda de água fica a sete quilómetros. Também se pode entrar por leste a partir de
      Sárggavárre e Urtimjaur (Urdávrre), junto à estrada de Messaure.


      Há dois circuitos pedestres principais. O mais curto, Muttosleden, ladeia a cascata e a funda garganta
      de Måskosgårsså. O percurso longo, Muttosbálges ou Muddusleden, percorre a cascata, Muttosluoppal,
      Manson, Nammavárre e Måskosgårsså. Do cimo da torre de vigia de Muttosluoppal avistam-se lagoas,
      turfeiras que se estendem por quilómetros e serranias no horizonte. O trilho de Manson passa junto a uma
      cabana tradicional de madeira vermelha, cruzando urzais e floresta virgem pontuada por milénios de
      presença humana.


      O centro de visitantes mais abrangente é o Naturum Laponia, em Viedásnjárgga, já dentro do parque de
      Stora Sjöfallet. Descreve montanhas, florestas, zonas húmidas e o ritmo das estações, contextualizando o
      papel fulcral da rena na cultura sami. Disponibiliza percursos guiados, binóculos e uma área expositiva
      sem barreiras arquitetónicas.
    history: >-
      Em meados do século XIX, pioneiros desbravaram a taiga para fundar uma exploração agrícola junto ao lago
      Muddusjaure. Os colonos resistiram pouco mais de cinquenta anos num meio subártico impiedoso, até à
      desocupação definitiva do local em 1909. Os pastores sami, por sua vez, sempre colocaram chocalhos nas
      renas: sem esse som teria sido impossível localizar o gado no emaranhado da floresta.


      As deliberações de salvaguarda em Laponia assentam no consenso mútuo. O plano de gestão Natura de Muddus
      visa manter inalterados os biótopos onde as aves nidificam, repousam e se alimentam, impedindo que
      interferências humanas degradem o estado selvagem.
    before: >-
      É expressamente proibido perturbar renas em pastoreio ou estorvar o trabalho dos criadores sami, bem
      como abandonar lixo no parque. A via de acesso a Skájdde pode sofrer encerramentos temporários na
      primavera e início do verão quando o solo amolece com o degelo. Confirma sempre os comunicados oficiais
      de Laponia antes de viajar. O Naturum mantém horário de época estival até setembro.
    around: >-
      Muddus partilha a classificação de Laponia com Sarek, Stora Sjöfallet e Padjelanta, embora a
      titularidade comum não signifique fronteira direta, não tendo vizinhos imediatos no atlas. Conta contudo
      com espaços afins: o [Parque Nacional de Gutulia](/lugar/gutulia-national-park/), o [Parque Nacional de
      Hamra](/lugar/hamra-national-park/) e o [Parque Nacional Urho
      Kekkonen](/lugar/urho-kekkonen-national-park/) coincidem na presença de pica-pau-tridáctilo, alce e
      urso-pardo, bem como na taiga virgem e turfeiras. O [Parque Nacional de Białowieża - Reserva
      Integral](/lugar/bialowieski-park-narodowy---rezerwat-scisly/) partilha o pica-pau-tridáctilo, o
      urso-pardo e o ecossistema florestal primário.
