resumen:
  es: >-
    Famoso mundialmente por las formaciones de nieve pesada e hielos acumulados sobre los abetos boreales
    (*tykky*) en las lomas altiplánicas.
  en: >-
    World-famous for heavy snow and hard frost formations on boreal spruce trees (*tykky*) across upland
    fells.
  fr: >-
    Mondialement réputé pour ses formations de givre et de neige lourde pétrifiant les épicéas boréaux
    (*tykky*) sur les crêtes de toundra.
  de: Weltberühmt für tonnenschwere Schnee- und Frostkronen auf borealen Fichten (*Tykky*) auf den Höhenrücken.
  it: >-
    Famoso in tutto il mondo per le formazioni di neve compatta e ghiaccio che ricoprono i rami dei pecci
    boreali (*tykky*) sulle colline.
  pt: >-
    Mundialmente famoso pelas formações de neve densa e geada pesada sobre os espruces boreais (*tykky*) nos
    cumes planálticos.
unico:
  es: 'Aquí la nieve no cae sobre el bosque: lo construye, árbol a árbol, hasta darle forma de escultura.'
  en: 'Here snow does not just fall on the forest: it builds it, tree by tree, sculpting it into living statues.'
  fr: >-
    Ici la neige ne tombe pas simplement sur la forêt : elle l'édifie, arbre après arbre, jusqu'à lui donner
    des allures de sculpture.
  de: >-
    Hier fällt der Schnee nicht bloß auf den Wald: Er baut ihn auf, Baum für Baum, und formt skurrile
    Skulpturen.
  it: >-
    Qui la neve non si limita a cadere sul bosco: lo costruisce, albero dopo albero, modellandolo come una
    scultura.
  pt: >-
    Aqui a neve não cai simplesmente sobre a floresta: edifica-a, árvore a árvore, esculpindo-a como uma
    estátua viva.
observaciones:
  es: >-
    Los senderos disponen de refugios abiertos con fogón y espacio para montar una tienda. Para pasar la noche
    puedes usar el refugio de monte al norte de Riisitunturi, un cobertizo o tu propia tienda.
texto:
  es:
    intro: >-
      Hay bosques que no se mantienen en pie por fuerza, sino por forma. En Riisitunturi, en cuanto llega el
      invierno, la humedad se condensa como escarcha y nieve sobre las ramas, y una pícea adulta puede cargar
      de tres a cuatro toneladas. Los finlandeses lo llaman tykky, y es lo que convierte este parque nacional
      de Posio, en la Laponia finlandesa. Fuera de esa estación, el parque es un territorio de colinas
      boscosas y turberas de ladera.
    landscape: >-
      Todo se debe al choque de dos cosas: las masas de aire húmedo y las colinas de la meseta de Kuusamo. Al
      subir, la humedad se vuelve escarcha y nieve sobre los árboles, y a la vez alimenta la abundancia de
      turberas. Riisitunturi representa la naturaleza de fell del sur: su cumbre mide 465 metros y hay otras
      de más de 400. Casi toda la zona se sitúa por encima de los 300 metros, y la divisoria de aguas de
      Maanselkä, la cadena de colinas suaves que separa los ríos del Báltico de los del Ártico, atraviesa el
      parque. El agua del oeste va al Kemijoki, y la del este, a los lagos Kitkajärvi.


      Las cumbres más altas son brezales casi sin árboles, el ejemplo típico de los brezales de fell del sur,
      y en ellas viven gayuba alpina (Arctostaphylos alpina), azalea rastrera (Loiseleuria procumbens) y
      licopodio alpino (Diphasiastrum alpinum). Más abajo, en las laderas, hay extensos bosques de pícea con
      madera muerta, y el límite del bosque lo marca la propia pícea: el tykky que se acumula en las copas
      limita el crecimiento de los árboles en las colinas. Las píceas delgadas del norte soportan mejor la
      carga de nieve que los pinos.


      Las turberas de ladera son la otra seña. Muchas llegan casi hasta las cumbres, son sobre todo pobres en
      nutrientes y las más ricas son menos frecuentes. Entre ellas corren numerosos arroyos y riachuelos.
    wildlife: >-
      La fauna del parque tiene su emblema en el símbolo del parque: un búho gavilán, hiiripöllö, junto a una
      pícea cargada de tykky. En cuanto a las plantas, la red europea Natura protege aquí dos especies,
      lettorikko (Saxifraga hirculus) y lapinleinikki (Ranunculus lapponicus).


      El invierno es la gran temporada. El bosque nevado de Riisitunturi, bajo la luz de la luna, atrae a
      senderistas y fotógrafos. En esa estación hay una ruta multiuso de 20 km para raquetas, esquí y
      bicicleta de ruedas anchas.
    visit: >-
      La zona de Riisitunturi ofrece más de 40 km de senderos señalizados. Las dos rutas de un día son Riisin
      rääpäsy, circular de 4,3 km, y Riisin rietas, de 10,9 km. Para más distancia, Riisitunturin reitti
      conecta Kirintövaara con Riisitunturi a lo largo de 26 km por sentido.


      Cerca de la doble cumbre de Riisitunturi, de 465,3 m, está el único refugio de monte del parque.
    history: >-
      Los naturalistas finlandeses conocían la zona a comienzos del siglo XX por sus turberas de ladera. En
      1971 Metsähallitus protegió más de 40 km² de bosque en Riisitunturi, y la ley del parque entró en vigor
      el 1 de enero de 1982. Hoy forma parte de los humedales de importancia internacional incluidos en
      Ramsar. Es una concentración importante de bosque natural boreal del norte y de turberas de ladera
      variadas, y su carácter salvaje es otra de sus señas. La naturaleza del lugar ha inspirado a
      naturalistas y sobre todo a investigadores de turberas, y es objeto de estudio de la estación de
      investigación de Oulanka.
    before: >-
      Los senderos disponen de refugios abiertos con fogón y espacio para montar una tienda. Para pasar la
      noche puedes usar el refugio de monte al norte de Riisitunturi, un cobertizo o tu propia tienda.
    around: >-
      El [Parque Nacional de Oulanka](/lugar/oulanka-national-park/) está a unos veinticinco kilómetros. Más
      lejos, el [Parque Nacional de Urho Kekkonen](/lugar/urho-kekkonen-national-park/) comparte con
      Riisitunturi el alce, el oso pardo, la alta montaña, los bosques primarios y los humedales.
  en:
    intro: >-
      Some forests stay upright not through raw strength, but through form. In Riisitunturi, as soon as winter
      sets in, moisture condenses as rime and heavy snow on branches, and an adult spruce can carry three to
      four tonnes. Finns call it tykky, and it is what transforms this national park in Posio, in Finnish
      Lapland. Outside that season, the park is an expansive landscape of wooded fells and sloping bogs.
    landscape: >-
      It all stems from the clash of two elements: moist air masses and the hills of the Kuusamo upland. As
      the air rises, moisture turns into frost and snow on trees, while feeding a wealth of peatlands.
      Riisitunturi represents southern fell nature: its highest summit reaches 465 meters, with others
      exceeding 400. Almost the entire area lies above 300 meters, and the Maanselkä drainage divide, a gentle
      chain of hills separating Baltic from Arctic watersheds, runs right through the park. Water to the west
      drains into the Kemijoki, and to the east into the Kitkajärvi lakes.


      The highest peaks are treeless heathlands, classic examples of southern fell heaths, home to alpine
      bearberry (Arctostaphylos alpina), trailing azalea (Loiseleuria procumbens), and alpine clubmoss
      (Diphasiastrum alpinum). Further down the slopes, extensive old-growth spruce forests feature abundant
      deadwood, with the tree line delineated by the spruce itself: tykky accumulating on crowns limits tree
      growth on the hills. Slender northern spruces bear the heavy snow load far better than pines.


      Sloping bogs are the park's other signature feature. Many reach almost to the summits; they are largely
      nutrient-poor, while richer fens occur less frequently. Numerous streams and brooks flow among them.
    wildlife: >-
      The park's wildlife is emblematized by its logo: a northern hawk owl, hiiripöllö, perched beside a
      spruce laden with tykky. As for plant life, the European Natura network protects two species here:
      yellow marsh saxifrage, lettorikko (Saxifraga hirculus), and Lapland buttercup, lapinleinikki
      (Ranunculus lapponicus).


      Winter is the peak season. Riisitunturi's snow-clad forest under moonlight draws hikers and
      photographers from across the world. During that season, a 20 km multi-use winter trail is maintained
      for snowshoeing, skiing, and fatbiking.
    visit: >-
      The Riisitunturi area offers over 40 km of marked trails. The two classic day hikes are Riisin rääpäsy,
      a 4.3 km circular trail, and Riisin rietas, measuring 10.9 km. For longer journeys, Riisitunturin reitti
      connects Kirintövaara to Riisitunturi across 26 km each way.


      Near the twin summit of Riisitunturi, at 465.3 m, sits the park's only wilderness hut.
    history: >-
      Finnish naturalists already knew the area at the beginning of the twentieth century for its hanging
      bogs. In 1971 Metsähallitus protected more than 40 km² of forest in Riisitunturi, and the national park
      act took effect on 1 January 1982. Today it forms part of internationally important wetlands designated
      under Ramsar. It represents a vital tract of northern boreal natural forest and varied sloping mires,
      renowned for its pristine wilderness character. The area's nature has long inspired naturalists and
      peatland researchers, serving as a study site for the Oulanka research station.
    before: >-
      Trails feature open wilderness shelters with campfire sites and designated space for pitching tents. For
      an overnight stay you can use the wilderness hut north of Riisitunturi, a lean-to shelter, or your own
      tent.
    around: >-
      [Oulanka National Park](/lugar/oulanka-national-park/) is about twenty-five kilometers away. Further
      afield, [Urho Kekkonen National Park](/lugar/urho-kekkonen-national-park/) shares moose, brown bear,
      fell highlands, primeval taiga forests, and vast wetlands with Riisitunturi.
  fr:
    intro: >-
      Il est des forêts qui tiennent debout non par la force, mais par leur forme. À Riisitunturi, dès que
      l'hiver s'installe, l'humidité se condense en givre et en neige lourde sur les branches, et un épicéa
      adulte peut porter de trois à quatre tonnes. Les Finlandais nomment ce phénomène tykky, et c'est ce qui
      métamorphose ce parc national de Posio, en Laponie finlandaise. En dehors de cette saison, le parc est
      un vaste domaine de collines boisées et de tourbières de pente.
    landscape: >-
      Tout procède de la rencontre de deux éléments : les masses d'air humide et les reliefs du plateau de
      Kuusamo. En s'élevant, l'humidité se fige en givre et en neige sur les arbres, tout en nourrissant une
      profusion de tourbières. Riisitunturi incarne la nature des fells du sud : son sommet culmine à 465
      mètres et d'autres dépassent 400 mètres. La quasi-totalité de l'espace se situe au-dessus de 300 mètres,
      et la ligne de partage des eaux de Maanselkä, chaîne de collines douces séparant les cours d'eau de la
      Baltique de ceux de l'Arctique, traverse le parc. Les eaux de l'ouest s'écoulent vers le Kemijoki,
      celles de l'est vers les lacs Kitkajärvi.


      Les cimes les plus élevées sont des landes quasi dénudées, archétypes des landes de fell méridionales,
      peuplées par la busserole des Alpes (Arctostaphylos alpina), l'azalée rampante (Loiseleuria procumbens)
      et le lycopode des Alpes (Diphasiastrum alpinum). Plus bas sur les versants s'étendent de vastes
      pessières à bois mort où la limite forestière est fixée par l'épicéa lui-même : le tykky accumulé sur
      les houppiers freine la croissance des arbres. Les fins épicéas boréaux supportent bien mieux la charge
      neigeuse que les pins.


      Les tourbières de pente constituent l'autre signature des lieux. Nombre d'entre elles grimpent presque
      jusqu'aux sommets ; elles sont majoritairement ombrotrophes, les tourbières plus riches étant moins
      fréquentes. Entre elles serpentent de multiples ruisseaux.
    wildlife: >-
      La faune est symbolisée par l'emblème officiel du parc : la chouette épervière, hiiripöllö, posée près
      d'un épicéa croulant sous le tykky. Du côté de la flore, le réseau européen Natura protège ici deux
      espèces remarquables : la saxifrage œil-de-bouc, lettorikko (Saxifraga hirculus), et la renoncule
      lapone, lapinleinikki (Ranunculus lapponicus).


      L'hiver est la grande saison touristique. La forêt enneigée de Riisitunturi, baignée de clarté lunaire,
      attire randonneurs et photographes. Durant cette période, une piste hivernale polyvalente de 20 km est
      tracée pour la raquette, le ski de fond et le fatbike.
    visit: >-
      Le secteur de Riisitunturi offre plus de 40 km de sentiers balisés. Les deux circuits d'une journée sont
      Riisin rääpäsy, une boucle de 4,3 km, et Riisin rietas, longue de 10,9 km. Pour une plus grande
      traversée, Riisitunturin reitti relie Kirintövaara à Riisitunturi sur 26 km par sens.


      Près du double sommet de Riisitunturi, à 465,3 m, se trouve l'unique refuge ouvert du parc.
    history: >-
      Les naturalistes finlandais connaissaient déjà la région au début du XXe siècle pour ses tourbières
      suspendues. En 1971 Metsähallitus protégea plus de 40 km² de forêt à Riisitunturi, et la loi créant le
      parc entra en vigueur le 1er janvier 1982. Le site est aujourd'hui classé zone humide d'importance
      internationale au titre de la convention de Ramsar. Il abrite une remarquable concentration de forêts
      boréales primaires et de tourbières de versant, sa naturalité sauvage étant l'une de ses marques
      distinctives. La nature environnante a inspiré naturalistes et chercheurs, constituant un terrain
      d'étude privilégié pour la station de recherche d'Oulanka.
    before: >-
      Les sentiers sont jalonnés d'abris ouverts dotés d'un foyer et d'emplacements pour bivouaquer. Pour
      passer la nuit, vous pouvez utiliser le refuge ouvert au nord de Riisitunturi, un abri sommaire ou votre
      propre tente.
    around: >-
      Le [parc national d'Oulanka](/lugar/oulanka-national-park/) est à environ vingt-cinq kilomètres. Plus
      loin, le [parc national Urho Kekkonen](/lugar/urho-kekkonen-national-park/) partage avec Riisitunturi
      l'élan, l'ours brun, les reliefs de fells, les forêts primaires et les tourbières.
  de:
    intro: >-
      Manche Wälder stehen nicht durch Kraft aufrecht, sondern durch ihre Gestalt. In Riisitunturi kondensiert
      die Luftfeuchtigkeit bei Wintereinbruch als Reif und Nassschnee an den Ästen, sodass eine ausgewachsene
      Fichte drei bis vier Tonnen tragen kann. Die Finnen nennen diese Schneelast Tykky, und sie verwandelt
      diesen Nationalpark in Posio im finnischen Lappland. Außerhalb des Winters ist der Park ein Reich
      bewaldeter Hügel und Hangmoore.
    landscape: >-
      Alles beruht auf dem Zusammentreffen zweier Faktoren: feuchter Luftmassen und der Erhebungen des
      Kuusamo-Hochlands. Beim Aufsteigen gefriert die Feuchtigkeit zu Reif und Schnee auf den Bäumen und
      speist zugleich reiche Moore. Riisitunturi verkörpert die Fjell-Natur des Südens: Sein Gipfel erreicht
      465 Meter, andere Kuppen über 400 Meter. Fast das gesamte Gebiet liegt über 300 Metern, und die
      Maanselkä-Wasserscheide, ein sanfter Hügelzug zwischen den Flusssystemen der Ostsee und des Eismeers,
      durchzieht den Park. Das Wasser im Westen fließt zum Kemijoki, das im Osten zu den Kitkajärvi-Seen.


      Die höchsten Kuppen sind baumlose Heiden, Musterbeispiele südlicher Fjellheiden, auf denen
      Alpen-Bärentraube (Arctostaphylos alpina), Alpenazalee (Loiseleuria procumbens) und Alpen-Flachbärlapp
      (Diphasiastrum alpinum) wachsen. Weiter unten an den Hängen dehnen sich totholzreiche Fichtenwälder aus;
      die Baumgrenze bestimmt die Fichte selbst: Der Tykky-Behang in den Kronen hemmt das Höhenwachstum. Die
      schlanken Nordfichten trotzen der Schneelast weit besser als Kiefern.


      Hangmoore bilden das zweite Wahrzeichen. Viele reichen fast bis an die Gipfel heran; sie sind
      überwiegend nährstoffarm, reichere Moorflächen seltener. Zwischen ihnen fließen zahlreiche Bäche und
      Rinnsale.
    wildlife: >-
      Das Wappentier des Parks ziert das offizielle Logo: eine Sperbereule, Hiiripöllö, auf einer tief
      verschneiten Tykky-Fichte. Unter den Pflanzen schützt das europäische Natura-Netzwerk hier zwei
      Leitarten: den Moor-Steinbrech, Lettorikko (Saxifraga hirculus), und den Lappland-Hahnenfuß,
      Lapinleinikki (Ranunculus lapponicus).


      Der Winter ist die Hauptsaison. Der tief verschneite Wald von Riisitunturi im Mondlicht zieht Wanderer
      und Fotografen magisch an. In dieser Jahreszeit wird eine 20 km lange Mehrzweckroute für
      Schneeschuhgänger, Skifahrer und Fatbiker gepflegt.
    visit: >-
      Das Riisitunturi-Gebiet bietet über 40 km markierte Wanderwege. Die zwei klassischen Tagestouren heißen
      Riisin rääpäsy, ein Rundweg von 4,3 km, und Riisin rietas mit 10,9 km Länge. Für längere Touren
      verbindet die Riisitunturin reitti Kirintövaara mit Riisitunturi über 26 km je Richtung.


      Nahe dem Doppelgipfel des Riisitunturi auf 465,3 m Höhe liegt die einzige offene Wildnishütte des Parks.
    history: >-
      Finnische Naturforscher schätzten das Gebiet bereits zu Beginn des zwanzigsten Jahrhunderts wegen seiner
      Hangmoore. 1971 stellte Metsähallitus mehr als 40 km² Wald am Riisitunturi unter Schutz, und das
      Nationalparkgesetz trat am 1. Januar 1982 in Kraft. Heute zählt das Areal zu den international
      geschützten Ramsar-Feuchtgebieten. Es schützt bedeutende Urwaldbestände der nördlichen Taiga und
      verschiedenartige Hangmoore; die unberührte Wildnis prägt seinen Charakter. Forscher der Biologischen
      Station Oulanka untersuchen die Moorökologie seit Jahrzehnten.
    before: >-
      Entlang der Routen gibt es offene Schutzhütten mit Feuerstellen und Zeltplätzen. Zur Übernachtung kannst
      du die Wildnishütte nördlich des Riisitunturi, einen Unterstand oder dein eigenes Zelt nutzen.
    around: >-
      Der [Oulanka-Nationalpark](/lugar/oulanka-national-park/) liegt etwa fünfundzwanzig Kilometer entfernt.
      Weiter entfernt teilt der [Urho-Kekkonen-Nationalpark](/lugar/urho-kekkonen-national-park/) Elche,
      Braunbären, Fjellhochland, Urwälder und Feuchtgebiete mit Riisitunturi.
  it:
    intro: >-
      Ci sono foreste che restano in piedi non per pura forza, ma per la loro forma. A Riisitunturi, non
      appena giunge l'inverno, l'umidità si condensa in galaverna e neve pesante sui rami, tanto che un peccio
      adulto può reggere da tre a quattro tonnellate. I finlandesi chiamano questo fenomeno tykky, ed è ciò
      che trasfigura questo parco nazionale a Posio, nella Lapponia finlandese. Al di fuori di quella
      stagione, il parco è una terra di rilievi boscosi e torbiere di pendio.
    landscape: >-
      Tutto nasce dall'incontro di due elementi: le masse d'aria umida e le alture dell'altopiano di Kuusamo.
      Salendo di quota, l'umidità gela in brina e neve sugli alberi, alimentando al contempo una profusione di
      torbiere. Riisitunturi rappresenta la tipica natura di fell meridionale: la sua cima tocca i 465 metri e
      altre vette superano i 400. Quasi tutta l'area si trova sopra i 300 metri, e lo spartiacque di
      Maanselkä, la dorsale collinare che separa i bacini idrografici del Baltico da quelli dell'Artico,
      taglia il parco. Le acque occidentali scendono verso il Kemijoki, quelle orientali verso i laghi
      Kitkajärvi.


      Le cime più elevate sono brughiere quasi spoglie, modello classico delle brughiere di fell del sud,
      abitate da uva ursina alpina (Arctostaphylos alpina), azalea strisciante (Loiseleuria procumbens) e
      licopodio alpino (Diphasiastrum alpinum). Più in basso lungo i versanti si allargano vaste foreste di
      abete rosso ricche di legno morto, dove il limite del bosco è segnato dal peccio stesso: il tykky che
      appesantisce le chiome frena lo sviluppo degli alberi in altezza. Gli affusolati pecci del nord
      sostengono il carico nevoso assai meglio dei pini.


      Le torbiere di pendio costituiscono l'altro tratto distintivo. Molte risalgono quasi fino alle vette;
      sono prevalentemente povere di nutrienti, mentre quelle più fertili sono meno comuni. Tra di esse
      scorrono innumerevoli ruscelli.
    wildlife: >-
      La fauna del parco ha il suo simbolo ufficiale nell'emblema del parco: un ulula, hiiripöllö, appollaiata
      su un peccio carico di tykky. Per quanto riguarda la flora, la rete europea Natura tutela qui due
      specie: la sassifraga delle torbiere, lettorikko (Saxifraga hirculus), e il ranuncolo di Lapponia,
      lapinleinikki (Ranunculus lapponicus).


      L'inverno rappresenta il momento culminante. Il bosco innevato di Riisitunturi sotto la luna attira
      escursionisti e fotografi da ogni dove. In quella stagione viene battuta una pista polivalente di 20 km
      per ciaspole, sci e fatbike.
    visit: >-
      L'area di Riisitunturi offre più di 40 km di sentieri tracciati. I due percorsi giornalieri classici
      sono Riisin rääpäsy, un anello di 4,3 km, e Riisin rietas, lungo 10,9 km. Per coprire distanze maggiori,
      la Riisitunturin reitti collega Kirintövaara a Riisitunturi lungo 26 km per tratta.


      Vicino alla doppia vetta del Riisitunturi, a quota 465,3 m, si trova l'unico rifugio aperto del parco.
    history: >-
      I naturalisti finlandesi conoscevano la zona già all'inizio del ventesimo secolo per le sue torbiere
      pensili. Nel 1971 Metsähallitus tutelò oltre 40 km² di foresta a Riisitunturi, e la legge istitutiva del
      parco entrò in vigore il 1 gennaio 1982. Oggi fa parte delle zone umide d'importanza internazionale
      della convenzione di Ramsar. Costituisce un notevole nucleo di taiga primaria boreale e di variegate
      torbiere di versante, celebre per la sua atmosfera remota. La natura del luogo ha ispirato studiosi e
      ricercatori, servendo come campo di lavoro per la stazione scientifica di Oulanka.
    before: >-
      Lungo i tracciati si trovano bivacchi aperti dotati di focolare e spiazzi per montare la tenda. Per
      pernottare puoi utilizzare il rifugio aperto a nord di Riisitunturi, una tettoia o la tua tenda
      personale.
    around: >-
      Il [Parco nazionale di Oulanka](/lugar/oulanka-national-park/) dista circa venticinque chilometri. Più
      distante, il [Parco nazionale Urho Kekkonen](/lugar/urho-kekkonen-national-park/) condivide con
      Riisitunturi alci, orsi bruni, altopiani di fell, foreste primordiali e torbiere.
  pt:
    intro: >-
      Há florestas que se mantêm eretas não pela força bruta, mas pela sua geometria. Em Riisitunturi, assim
      que o inverno desponta, a humidade condensa-se como sincelo e neve pesada nas ramagens, podendo um
      espruce adulto suportar de três a quatro toneladas. Os finlandeses chamam-lhe tykky, e é isso que
      transforma este parque nacional em Posio, na Lapónia finlandesa. Fora desse período, o parque
      converte-se num domínio de colinas arborizadas e turfeiras de encosta.
    landscape: >-
      Tudo decorre do choque entre dois fatores: as massas de ar marítimo húmido e as elevações do planalto de
      Kuusamo. Ao ascender, a humidade transforma-se em gelo e neve acumulada nas árvores, ao mesmo tempo que
      alimenta uma fartura de turfeiras. Riisitunturi personifica a natureza dos fells do sul: o seu pico
      atinge 465 metros e existem outros com mais de 400. Praticamente toda a área se situa acima dos 300
      metros, e a linha divisória de águas de Maanselkä, a suave cadeia de colinas que separa as bacias do
      Báltico das do Ártico, corta o parque. As águas do oeste correm para o Kemijoki, e as do leste para os
      lagos Kitkajärvi.


      Os cumes mais elevados formam charnecas quase desprovidas de arvoredo, exemplo típico das charnecas de
      fell meridionais, onde vivem a uva-ursina-alpina (Arctostaphylos alpina), a azálea-rasteira (Loiseleuria
      procumbens) e o licopódio-alpino (Diphasiastrum alpinum). Mais abaixo nas vertentes medram vastas matas
      de espruce ricas em madeira morta, onde o limite da floresta é delimitado pelo próprio espruce: o tykky
      que se aglomera nas copas trava o crescimento vertical das árvores. Os esguios espruces nórdicos
      aguentam o peso da neve muito melhor do que os pinheiros.


      As turfeiras de encosta são o outro grande traço identitário. Muitas sobem quase até aos cumes; são
      sobretudo pobres em nutrientes, sendo as turfeiras alcalinas menos frequentes. Por entre elas correm
      múltiplos regatos.
    wildlife: >-
      A fauna do parque tem a sua personificação no logótipo oficial: um mocho-gavião, hiiripöllö, pousado
      junto a um espruce vergado pelo tykky. No que toca às plantas, a rede europeia Natura protege aqui duas
      espécies raras: a saxífraga-dos-pauis, lettorikko (Saxifraga hirculus), e o ranúnculo-da-lapónia,
      lapinleinikki (Ranunculus lapponicus).


      O inverno é a grande época de visita. A floresta nevada de Riisitunturi sob o luar seduz caminhantes e
      fotógrafos de todo o mundo. Nessa estação fica traçado um trilho polivalente de 20 km para raquetes de
      neve, esqui e fatbike.
    visit: >-
      A zona de Riisitunturi proporciona mais de 40 km de trilhos sinalizados. Os dois percursos de um dia
      clássicos são Riisin rääpäsy, circular de 4,3 km, e Riisin rietas, com 10,9 km. Para travessias mais
      longas, a rota Riisitunturin reitti une Kirintövaara a Riisitunturi ao longo de 26 km por sentido.


      Perto do cume duplo de Riisitunturi, a 465,3 m de altitude, ergue-se o único abrigo de montanha aberto
      do parque.
    history: >-
      Os naturalistas finlandeses conheciam a área logo no início do século XX devido às suas turfeiras
      suspensas. Em 1971 o Metsähallitus colocou sob proteção mais de 40 km² de floresta em Riisitunturi, e a
      lei de criação do parque entrou em vigor a 1 de janeiro de 1982. Atualmente integra as zonas húmidas de
      relevância internacional catalogadas na convenção de Ramsar. Constitui uma importante reserva de taiga
      boreale intocada e de turfeiras declivosas, sendo a sua aura selvagem outro dos seus atributos. A
      natureza local tem inspirado botânicos e peritos em turfeiras, funcionando como laboratório para a
      estação de investigação de Oulanka.
    before: >-
      Os trilhos contam com abrigos abertos com lareira e terreno para montar tendas. Para pernoitar podes
      recorrer ao abrigo de montanha a norte de Riisitunturi, a um alpendre ou à tua própria tenda.
    around: >-
      O [Parque Nacional de Oulanka](/lugar/oulanka-national-park/) dista cerca de vinte e cinco quilómetros.
      Mais longe, o [Parque Nacional Urho Kekkonen](/lugar/urho-kekkonen-national-park/) partilha com
      Riisitunturi o alce, o urso-pardo, as altas montanhas de fell, as florestas primárias e as turfeiras.
