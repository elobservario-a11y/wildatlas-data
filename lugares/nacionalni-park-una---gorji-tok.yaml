unico:
  es: Un río que levanta sus propias cascadas con musgo y cal, con 24 metros de caída en Štrbački buk.
  en: >-
    A river that builds its own cascading waterfalls through moss and limestone, tumbling 24 metres at
    Štrbački buk.
  fr: >-
    Une rivière qui édifie ses propres cascades grâce aux mousses et au calcaire, franchissant 24 mètres de
    dénivellation au Štrbački buk.
  de: >-
    Ein Fluss, der aus Moosen und Kalk eigene Wasserfälle errichtet und am Štrbački buk 24 Meter tief
    hinabstürzt.
  it: >-
    Un fiume che innalza le proprie cascate attraverso muschi e calcare, compiendo un salto di 24 metri a
    Štrbački buk.
  pt: Um rio que ergue as suas próprias cascatas com musgo e calcário, despenhando-se 24 metros em Štrbački buk.
observaciones:
  es: La mejor época es de mayo a octubre, y Štrbački buk recibe más gente que el resto.
texto:
  es:
    intro: >-
      Un río puede construir su propio escenario. El Una lo hace con musgo y cal: el agua cae por saltos y
      cascadas, los musgos retienen la calcita que se precipita y, poco a poco, la roca crece, formando bancos
      de toba sobre los que el río vuelve a caer. El resultado es el tramo alto del Una, en el extremo
      noroeste de Bosnia y Herzegovina, donde el agua baja por Martin Brod, Štrbački buk, Troslap, Dvoslap y
      Ripač con un color verde azulado. Desde 2008 es parque nacional, el primero de la Federación de Bosnia y
      Herzegovina, y protege el Una, el Unac y el curso alto del Sana.
    landscape: >-
      El Una nace en el pueblo de Donja Suvaja, bajo el monte Stražbenica, ya en Croacia, en un manantial
      kárstico de color verde azulado. Hasta Bihać cae casi 3 metros por kilómetro, y por eso en el tramo alto
      tiene carácter de río de montaña: islas, rápidos y saltos.


      Aquí aparece el truco que da nombre al paisaje. Donde el agua cae por varias cascadas menores y mayores,
      como entre Martin Brod y Štrbački buk, se forman depósitos de toba calcárea. Los musgos del cauce,
      adecuados para retener la calcita, son el eslabón imprescindible del proceso. En las cascadas se
      encontraron 42 especies de plantas, 25 de algas y 17 de musgos, que participan en la construcción de la
      toba. La mayor del río es Štrbački buk; las de Martin Brod son las más famosas.


      El Unac entra por otro lado. Nace a 876 metros bajo el monte Šator, atraviesa el desfiladero de Pojila y
      llega a Martin Brod por una garganta estrecha que en algunos puntos alcanza 350 metros de profundidad.
      En verano puede secarse en un tramo, dejando pequeñas lagunas llenas de peces, porque corre bajo tierra,
      y brota por última vez en el Crno vrelo, a unos 3 km de su desembocadura en el Una. Y el Krka, un río
      corto de 5 km, fluye entero dentro del parque como frontera con Croacia.


      Todo el parque está a entre 200 y 450 metros de altitud, en un valle orientado de noroeste a sureste.
      Sus formas kársticas y su hidrografía, junto con las cuencas del Korana y el Krka, son únicas en Europa.
    wildlife: >-
      Más de 1.900 especies de plantas, el 52,19 % de las de Bosnia y Herzegovina, crecen aquí. Entre las
      endémicas están la campanilla del Una, que lleva el nombre del río, y el lirio bosnio, que prefiere los
      prados secos sobre roca caliza y serpentina; también crecen la genciana amarilla, la genciana manchada,
      el edelweiss y el pino mugo.


      El parque destaca por su biodiversidad: 30 especies de peces, 130 de aves y animales como el
      [lince](/especie/lynx_lynx/), el zorro, el [lobo](/especie/canis_lupus/), el
      [oso](/especie/ursus_arctos/) y el [rebeco](/especie/rupicapra_rupicapra/). Entre los peces, el [Hucho
      hucho](/especie/hucho_hucho/) figura entre las especies amenazadas del tramo alto. La temporada para
      visitar va de mayo a octubre.
    visit: >-
      La zona de visitantes de Štrbački buk y Lohovo dispone de caminos y senderos señalizados. El punto de
      salida y llegada de la carrera circular descrita por el parque es Štrbački buk, con un trazado por
      caminos y senderos forestales; en los paneles de Štrbački buk se explican la hidrología del salto y su
      evolución natural. En Martin Brod, un asentamiento de origen medieval, una visita guiada a pie recorre
      el pueblo. Por todo el parque hay buenas condiciones para caminar y para ir en bici, además de acampar.


      Para el agua, la Regata Internacional del Una, una competición de kayak, sale de Martin Brod, con
      Štrbački buk aguas abajo.
    history: >-
      Los japodes habitaron la zona en tiempos ilirios y romanos y levantaron poblados sobre pilotes en el
      Una, sobre todo en Ripač. Siglos después, la ciudad medieval de Rmanj se levantó a finales del siglo XIV
      o principios del XV en la confluencia del Unac y el Una, y el monasterio ortodoxo de Rmanj, en Martin
      Brod, es un centro espiritual importante en el cruce de Bosnia, Lika y Dalmacia. La fortaleza de
      Ostrovica, del siglo XV, era la plaza más fortificada del alto Una y pasó a los otomanos en 1523.


      El parque se creó el 29 de mayo de 2008, a partir de una iniciativa que surgió en gran parte de las
      comunidades locales, primero para una candidatura UNESCO y luego para proteger el área. Ocupa 19.800
      hectáreas. Se ha propuesto además un Parque de la Paz Plitvice-Una que una, a ambos lados de la
      frontera, el parque Una y los Lagos de Plitvice.
    before: La mejor época es de mayo a octubre, y Štrbački buk recibe más gente que el resto.
    around: >-
      A 3 km está el [Nacimiento del Una](/lugar/vrelo-une/), un monumento natural; a once kilómetros, el
      [Bosque Virgen de Lom](/lugar/prasuma-lom-strogi-rezervat-prirode/); y a veinticinco kilómetros, el
      [Parque Natural de Dinara](/lugar/park-prirode-dinara/). Más lejos, el [Cañón del Río
      Tara](/lugar/nacionalni-park-durmitor---kanjon-tare/) y el [Macizo Montañoso de
      Durmitor](/lugar/nacionalni-park-durmitor---masiv/) comparten con el Una el hucho, el lobo y el oso, y
      la [Garganta del Dunajec](/lugar/pieninski-park-narodowy---dunajec-gorge/) comparte el hucho y el
      hábitat de río y cañón.
  en:
    intro: >-
      A river can sculpt its own dramatic amphitheatre. The Una does so using moss and dissolved limestone: as
      water cascades over ledges, aquatic mosses precipitate calcite, slowly cementing limestone barriers and
      forming terraced tufa dams over which the river tumbles anew. The result is the upper course of the Una
      in north-western Bosnia and Herzegovina, where emerald-blue currents surge through Martin Brod, Štrbački
      buk, Troslap, Dvoslap, and Ripač. Designated a national park in 2008—the first in the Federation of
      Bosnia and Herzegovina—it safeguards the valleys of the Una, Unac, and upper Sana rivers.
    landscape: >-
      The Una surges from a deep karst siphon spring at the foot of Mount Stražbenica near Donja Suvaja across
      the border in Croatia. Downstream to Bihać, the riverbed drops nearly 3 metres per kilometre, imbuing
      the upper course with an energetic mountain character: gravel islands, wild rapids, and tumbling falls.


      Here lies the biological engine shaping the landscape. Where water spills over cascades, particularly
      between Martin Brod and Štrbački buk, massive deposits of porous calcareous tufa accumulate. Aquatic
      mosses coating the riverbed, adapted to trap calcium carbonate, form the indispensable catalyst.
      Botanists have identified 42 plant species, 25 algae taxa, and 17 aquatic bryophytes actively
      participating in building these living tufa barriers. Štrbački buk represents the tallest cataract; the
      cascade complex at Martin Brod is the most famous.


      The Unac enters from an adjacent valley. Originating at 876 metres beneath Mount Šator, it cuts through
      the Pojila defile before joining the Una at Martin Brod through a sheer canyon descending 350 metres in
      depth. In hot summers upper stretches run dry as waters dive underground, surfacing at Crno Vrelo
      roughly 3 km above its confluence with the Una. The Krka river, a pristine tributary flowing for 5 km,
      traces the international border with Croatia within the park.


      The entire park lies between 200 and 450 metres elevation, stretching along a north-west to south-east
      valley. Its tufa travertine cascades and hydrology, alongside the adjacent Korana and Krka river
      networks, are unique in Europe.
    wildlife: >-
      More than 1,900 plant species, representing 52.19 % of the flora of Bosnia and Herzegovina, flourish
      across the park. Notable endemics include the Una bellflower (Campanula unensis), named after the river,
      and the Bosnian lily, which graces dry limestone and serpentine meadows; yellow gentian, spotted
      gentian, edelweiss, and dwarf mountain pine also occur.


      The park boasts rich aquatic and terrestrial biodiversity: 30 fish species, 130 bird species, and large
      mammals including [Eurasian lynx](/especie/lynx_lynx/), red fox, [wolf](/especie/canis_lupus/), [brown
      bear](/especie/ursus_arctos/), and Balkan [chamois](/especie/rupicapra_rupicapra/). Among native
      ichthyofauna, the Danube salmon or [huchen](/especie/hucho_hucho/) represents a flagship endangered
      predator in the upper reaches. Visiting season spans May to October.
    visit: >-
      The visitor zones around Štrbački buk and Lohovo feature wooden walkways, viewing platforms, and marked
      nature trails. Štrbački buk serves as the starting and finishing hub for the circular trail route
      promoted by the park; interpretive signboards detail waterfall hydrology and living tufa accretion. At
      Martin Brod, a settlement of medieval origin, guided walking tours lead past historic watermills and
      cascades. Throughout the park terrain caters generously to hiking, mountain biking, and licensed
      camping.


      On the water, the International Una Regatta, a celebrated whitewater paddling event, launches from
      Martin Brod, running down through Štrbački buk.
    history: >-
      The Illyrian Iapydes settled the valley during ancient times, erecting pile dwellings along the
      riverbanks, particularly around Ripač. Centuries later, the medieval town of Rmanj arose in the late
      fourteenth or early fifteenth century at the confluence of the Unac and Una; Rmanj Orthodox Monastery at
      Martin Brod remains an important spiritual beacon at the crossroads of Bosnia, Lika, and Dalmatia. The
      fifteenth-century fortress of Ostrovica stood as the strongest stronghold of the upper Una before
      falling to the Ottomans in 1523.


      The national park was established on 29 May 2008, following grassroots conservation campaigns
      spearheaded by local communities, first pursuing UNESCO recognition and subsequently establishing
      statutory protection. It encompasses 19,800 hectares. A proposed transboundary Plitvice-Una Peace Park
      seeks to link Una National Park directly with Croatia’s Plitvice Lakes.
    before: >-
      The most rewarding period for visits is May to October, with Štrbački buk attracting the highest visitor
      volumes.
    around: >-
      Just 3 km away lies the [Source of the Una](/lugar/vrelo-une/), a declared natural monument; eleven
      kilometres away stands [Lom Primeval Forest](/lugar/prasuma-lom-strogi-rezervat-prirode/); and
      twenty-five kilometres away rises [Dinara Nature Park](/lugar/park-prirode-dinara/). Further afield,
      [Tara River Canyon](/lugar/nacionalni-park-durmitor---kanjon-tare/) and [Durmitor Mountain
      Massif](/lugar/nacionalni-park-durmitor---masiv/) share huchen, wolves, and bears with the Una, while
      [Dunajec Gorge](/lugar/pieninski-park-narodowy---dunajec-gorge/) shares huchen and a canyon river
      habitat.
  fr:
    intro: >-
      Une rivière est capable de façonner son propre décor. L’Una y parvient grâce à la mousse et au calcaire
      : l’eau franchit chutes et ressauts, les mousses retiennent le carbonate de calcium qui précipite et,
      pas à pas, la roche s’édifie, érigeant des barrages de travertin sur lesquels la rivière chute de
      nouveau. Le résultat est le cours supérieur de l’Una, à l’extrême nord-ouest de la Bosnie-Herzégovine,
      où des eaux émeraude dévalent à Martin Brod, Štrbački buk, Troslap, Dvoslap et Ripač. Érigé en parc
      national en 2008—le premier de la Fédération de Bosnie-et-Herzégovine—, il protège les vallées de l’Una,
      de l’Unac et du haut cours de la Sana.
    landscape: >-
      L’Una prend source au village de Donja Suvaja, sous le mont Stražbenica, en territoire croate, au creux
      d’une résurgence karstique turquoise. Jusqu’à Bihać, la rivière chute de près de 3 mètres par kilomètre,
      ce qui confère au cours supérieur un caractère impétueux de torrent montagnard : îles de graviers,
      rapides tumultueux et cascades.


      C’est ici qu’opère le phénomène façonnant ce paysage. Là où l’eau franchit des gradins rocheux,
      notamment entre Martin Brod et Štrbački buk, se créent de volumineux dépôts de tuf calcaire. Les mousses
      du lit, particulièrement aptes à piéger le calcaire, constituent le maillon indispensable de cette
      construction. Dans les cascades, on a dénombré 42 espèces de plantes, 25 espèces d’algues et 17 de
      mousses qui participent activement à la formation du travertin. Štrbački buk est la chute la plus haute
      ; les cascades de Martin Brod sont les plus réputées.


      L’Unac débouche d’une autre vallée. Né à 876 mètres d’altitude sous le mont Šator, il franchit le défilé
      de Pojila et rejoint Martin Brod par une gorge étroite atteignant par endroits 350 mètres de profondeur.
      En été, son lit s’assèche sur certains tronçons pour couler sous terre, laissant des poches d’eau
      poissonneuses, avant de resurgir à Crno vrelo, à quelque 3 km de sa confluence avec l’Una. La Krka, un
      cours d’eau de 5 km, s’écoule entièrement dans le parc servant de frontière avec la Croatie.


      Tout le parc s’étage entre 200 et 450 mètres d’altitude, au long d’une vallée orientée du nord-ouest au
      sud-est. Ses reliefs de tuf et son hydrographie sont uniques en Europe avec les bassins voisins de la
      Korana et de la Krka.
    wildlife: >-
      Plus de 1 900 espèces végétales, soit 52,19 % de la flore de Bosnie-Herzégovine, prospèrent dans le
      parc. Parmi les endémiques figurent la campanule de l’Una et le lis de Bosnie, qui recherche les
      pelouses sèches sur calcaire et serpentine ; croissent également gentiane jaune, gentiane ponctuée,
      edelweiss et pin mugo.


      Le parc s’illustre par sa remarquable biodiversité : 30 espèces de poissons, 130 espèces d’oiseaux et
      des mammifères majeurs comme le [lynx boréal](/especie/lynx_lynx/), le renard, le
      [loup](/especie/canis_lupus/), l’[ours](/especie/ursus_arctos/) et le
      [chamois](/especie/rupicapra_rupicapra/). Parmi les poissons, le [huchon](/especie/hucho_hucho/) compte
      parmi les prédateurs aquatiques emblématiques du cours supérieur. La saison de visite court de mai à
      octobre.
    visit: >-
      Les secteurs d’accueil de Štrbački buk et de Lohovo sont dotés de sentiers pédestres balisés. Le point
      de départ et d’arrivée de la boucle pédestre décrite par le parc se situe à Štrbački buk, cheminant par
      des pistes forestières ; des panneaux explicatifs dévoilent l’hydrologie du saut et la croissance du
      travertin. À Martin Brod, bourgade d’origine médiévale, une visite guidée permet de découvrir les vieux
      moulins. Tout le parc offre de magnifiques opportunités pour la marche, le VTT et le bivouac en camping
      officiel.


      Côté eau, la régate internationale de l’Una, réputée épreuve d’eau vive en kayak, part de Martin Brod et
      franchit Štrbački buk en aval.
    history: >-
      Les Iapydes occupèrent ces vallées aux époques illyrienne et romaine, érigeant des cités lacustres sur
      pilotis le long de l’Una, notamment à Ripač. Plus tard, la cité médiévale de Rmanj fut construite à la
      fin du quatorzième siècle ou au début du quinzième au confluent de l’Unac et de l’Una ; le monastère
      orthodoxe de Rmanj, à Martin Brod, demeure un pôle spirituel majeur au carrefour de la Bosnie, de la
      Lika et de la Dalmatie. La forteresse d’Ostrovica, du quinzième siècle, dominait le cours supérieur
      avant d’être prise par les Ottomans en 1523.


      Le parc national fut institué le 29 mai 2008, à l’initiative des communautés locales qui souhaitaient
      préserver le site. Il s’étend sur 19 800 hectares. Un projet de parc de la paix Plitvice-Una envisage
      d’unir le parc de l’Una et les lacs de Plitvice par-delà la frontière.
    before: La période idéale s’étend de mai à octobre, et le site de Štrbački buk concentre l’affluence majeure.
    around: >-
      À 3 km s’élève la [Source de l’Una](/lugar/vrelo-une/), monument naturel ; à onze kilomètres se trouve
      la [Forêt Vierge de Lom](/lugar/prasuma-lom-strogi-rezervat-prirode/) ; et à vingt-cinq kilomètres
      s’étend le [Parc Naturel de la Dinara](/lugar/park-prirode-dinara/). Plus loin, le [Canyon de la
      Tara](/lugar/nacionalni-park-durmitor---kanjon-tare/) et le [Massif du
      Durmitor](/lugar/nacionalni-park-durmitor---masiv/) partagent le huchon, le loup et l’ours avec l’Una,
      tandis que les [Gorges du Dunajec](/lugar/pieninski-park-narodowy---dunajec-gorge/) partagent le huchon
      et l’habitat de canyon fluvial.
  de:
    intro: >-
      Ein Fluss kann seine eigene Kulisse erbauen. Die Una vollbringt dies mithilfe von Moosen und Kalk: Das
      Wasser stürzt über Kaskaden, submerse Moose fällen den gelösten Kalk aus, und allmählich wachsen
      Tuffbarrieren heran, über die der Fluss erneut hinabstürzt. Das Ergebnis ist der Oberlauf der Una im
      äußersten Nordwesten von Bosnien und Herzegowina, wo türkisfarbenes Wasser über Martin Brod, Štrbački
      buk, Troslap, Dvoslap und Ripač tosend talwärts eilt. Seit 2008 als erster Nationalpark der Föderation
      Bosnien und Herzegowina ausgewiesen, schützt er die Una, den Unac und den oberen Sana-Fluss.
    landscape: >-
      Die Una entspringt im Dorf Donja Suvaja am Fuß des Stražbenica-Berges in Kroatien in einer tiefen
      Karstquelle von smaragdgrüner Farbe. Bis Bihać weist das Flussbett ein Gefälle von fast 3 Metern pro
      Kilometer auf, was dem Oberlauf wilden Wildwassercharakter verleiht: Kiesinseln, tosende Stromschnellen
      und Stufenfälle.


      Hier greift der biologische Prozess, der die Landschaft formt: Wo das Wasser über Kaskaden fällt,
      besonders zwischen Martin Brod und Štrbački buk, entstehen mächtige Kalktuffablagerungen. Moose im
      Flussbett, die Kalk anlagern, bilden das Schlüsselglied dieses Wachstums. An den Wasserfällen wurden 42
      Pflanzenarten, 25 Algenarten und 17 Moosarten nachgewiesen, die aktiv am Tuffaufbau mitwirken. Der
      Štrbački buk ist der höchste Einzelfall; die Kaskaden von Martin Brod sind die bekanntesten.


      Der Unac mündet von Osten her ein. Er entspringt auf 876 Metern Höhe unter dem Berg Šator,
      durchschneidet die Pojila-Klamm und erreicht Martin Brod durch eine enge Schlucht von bis zu 350 Metern
      Tiefe. Im Hochsommer fällt er stellenweise trocken, weil das Wasser unterirdisch fließt, und tritt bei
      Crno vrelo rund 3 km vor der Mündung wieder zutage. Die Krka, ein Nebenfluss von 5 km Länge, fließt
      vollständig im Park als Grenzfluss zu Kroatien.


      Das gesamte Schutzgebiet liegt zwischen 200 und 450 Metern Seehöhe in einem nordwest-südöstlich
      gestreckten Tal. Seine Tuffformationen und Gewässersysteme sind europaweit herausragend.
    wildlife: >-
      Über 1.900 Pflanzenarten, was 52,19 % der Flora von Bosnien und Herzegowina entspricht, wachsen im Park.
      Zu den Endemiten gehören die Una-Glockenblume und die Bosnische Lilie, die auf trockenen Kalk- und
      Serpentinrasen blüht; daneben gedeihen Gelber Enzian, Tüpfel-Enzian, Edelweiß und Bergkiefer.


      Der Park besticht durch reiche Artenvielfalt: 30 Fischarten, 130 Vogelarten sowie Säugetiere wie
      [Eurasischer Luchs](/especie/lynx_lynx/), Rotfuchs, [Wolf](/especie/canis_lupus/),
      [Braunbär](/especie/ursus_arctos/) und [Gämse](/especie/rupicapra_rupicapra/). Unter den Fischen zählt
      der [Huchen](/especie/hucho_hucho/) zu den geschützten Leitarten des Oberlaufs. Die beste Reisezeit
      reicht von Mai bis Oktober.
    visit: >-
      Die Besucherbereiche bei Štrbački buk und Lohovo verfügen über Holzstege und markierte Wanderpfade. Der
      Štrbački buk dient als Ausgangspunkt des Rundwegs, der über Waldwege führt; Schautafeln erläutern die
      Tuffbildung und Flussdynamik. In Martin Brod erschließt ein Rundgang den historischen Dorfkern mit
      seinen alten Wassermühlen. Im gesamten Parkgelände gibt es hervorragende Bedingungen zum Wandern,
      Mountainbiken und Camping.


      Auf dem Wasser startet die Internationale Una-Regatta, eine renommierte Wildwasser-Kajakveranstaltung,
      in Martin Brod und passiert den Štrbački buk flussabwärts.
    history: >-
      Die illyrischen Japoden besiedelten das Tal in der Antike und errichteten Pfahlbauten an der Una,
      namentlich bei Ripač. Jahrhunderte später entstand die mittelalterliche Stadt Rmanj im späten
      vierzehnten oder frühen fünfzehnten Jahrhundert am Zusammenfluss von Unac und Una; das
      serbisch-orthodoxe Kloster Rmanj in Martin Brod ist ein historisches geistliches Zentrum. Die Festung
      Ostrovica aus dem fünfzehnten Jahrhundert beherrschte den oberen Flussabschnitt, ehe sie 1523 an das
      Osmanische Reich fiel.


      Der Nationalpark wurde am 29. Mai 2008 auf Initiative lokaler Bürgervereinigungen gegründet. Er umfasst
      19.800 Hektar. Zudem besteht ein Vorschlag für einen grenzüberschreitenden Friedenspark Plitvice-Una.
    before: >-
      Die beste Besuchszeit liegt zwischen Mai und Oktober, wobei der Wasserfall Štrbački buk die meisten
      Besucher anzieht.
    around: >-
      Nur 3 km entfernt liegt die [Una-Quelle](/lugar/vrelo-une/), ein Naturdenkmal; elf Kilometer entfernt
      liegt der [Urwald Lom](/lugar/prasuma-lom-strogi-rezervat-prirode/); und fünfundzwanzig Kilometer
      entfernt erhebt sich der [Naturpark Dinara](/lugar/park-prirode-dinara/). Weiter entfernt teilen die
      [Tara-Schlucht](/lugar/nacionalni-park-durmitor---kanjon-tare/) und das
      [Durmitor-Gebirgsmassiv](/lugar/nacionalni-park-durmitor---masiv/) Huchen, Wolf und Bär mit der Una,
      während der [Dunajec-Durchbruch](/lugar/pieninski-park-narodowy---dunajec-gorge/) Huchen und
      Schluchtflusslebensräume teilt.
  it:
    intro: >-
      Un fiume è capace di costruire il proprio scenario. L’Una lo compie mediante muschi e calcare: l’acqua
      precipita tra salti e rapide, i muschi fluviali trattengono la calcite che precipita e, gradualmente, la
      roccia cresce formando terrazze di travertino su cui il corso d’acqua ricade spumeggiante. Il risultato
      è il tratto superiore dell’Una, nell’estremo nord-ovest della Bosnia ed Erzegovina, dove correnti
      turchesi scendono lungo Martin Brod, Štrbački buk, Troslap, Dvoslap e Ripač. Istituito nel 2008 come
      primo parco nazionale della Federazione di Bosnia ed Erzegovina, protegge le vallate dell’Una, dell’Unac
      e dell’alto Sana.
    landscape: >-
      L’Una nasce nel villaggio di Donja Suvaja, alle falde del monte Stražbenica in Croazia, da una profonda
      risorgiva carsica azzurro-verde. Fino a Bihać il fiume scende di quasi 3 metri per chilometro, assumendo
      un impetuoso carattere montano: isolotti di ghiaia, rapide furiose e cascate.


      Qui entra in gioco il fenomeno che genera questo paesaggio. Dove l’acqua scavalca dislivelli, in
      particolare tra Martin Brod e Štrbački buk, si formano massicci banchi di tufo calcareo. I muschi
      acquatici del fondo, ideali nel trattenere il carbonato di calcio, costituiscono l’elemento cardine del
      processo. Tra le cascate sono state identificate 42 specie di piante vascolari, 25 specie di alghe e 17
      di muschi che concorrono alla biocostruzione del travertino. Štrbački buk è il salto più alto; le
      cascate di Martin Brod sono le più celebri.


      L’Unac confluisce lateralmente. Sgorga a 876 metri sotto il monte Šator, varca la gola di Pojila e
      giunge a Martin Brod attraverso un forra che in certi punti sprofonda per 350 metri. D’estate il suo
      letto può prosciugarsi parzialmente poiché le acque scorrono nel sottosuolo, risorgendo a Crno vrelo a
      circa 3 km dalla confluenza nell’Una. Il fiume Krka, un breve corso d’acqua di 5 km, scorre per intero
      nel parco segnando il confine con la Croazia.


      L’intera area protetta è compresa tra 200 e 450 metri di altitudine lungo una valle allungata da
      nord-ovest a sud-est. Le formazioni di travertino e l’idrografia fluviale sono uniche in Europa.
    wildlife: >-
      Oltre 1.900 specie botaniche, pari al 52,19 % della flora della Bosnia ed Erzegovina, vegetano nell’area
      protetta. Tra gli endemismi spiccano la campanula dell’Una e il giglio bosniaco, che cresce sui prati
      aridi su calcare e serpentino; non mancano la genziana maggiore, la genziana punteggiata, la stella
      alpina e il pino mugo.


      Il parco accoglie una notevole biodiversità: 30 specie ittiche, 130 specie di uccelli e mammiferi quali
      la [lince eurasiatica](/especie/lynx_lynx/), la volpe, il [lupo](/especie/canis_lupus/), l’[orso
      bruno](/especie/ursus_arctos/) e il [camoscio alpino](/especie/rupicapra_rupicapra/). Tra i pesci, il
      [salmone del Danubio](/especie/hucho_hucho/) figura tra i predatori protetti dell’alto corso. Il periodo
      di visita va da maggio a ottobre.
    visit: >-
      I punti di accoglienza di Štrbački buk e Lohovo offrono passerelle e sentieri ben segnalati. Štrbački
      buk funge da capolinea del circuito ad anello illustrato dal parco; pannelli didattici descrivono
      l’idrologia del salto e la crescita del tufo. A Martin Brod, borgo di impronta medievale, una visita
      guidata tocca gli antichi mulini ad acqua. Nel parco vi sono ottime condizioni per escursioni a piedi,
      itinerari in bicicletta e aree attrezzate per il campeggio.


      Per gli amanti dell’acqua viva, l’annuale Regata Internazionale dell’Una, storica competizione di kayak,
      salpa da Martin Brod affrontando il salto di Štrbački buk a valle.
    history: >-
      Gli Iapodi abitarono la vallata in epoca preromana erigendo villaggi su palafitte lungo il fiume, in
      particolare a Ripač. Secoli dopo, la città fortificata di Rmanj sorse alla fine del quattordicesimo
      secolo o all’inizio del quindicesimo alla confluenza dell’Unac con l’Una; il monastero ortodosso di
      Rmanj a Martin Brod è uno storico riferimento spirituale. La fortezza di Ostrovica, del quindicesimo
      secolo, dominava l’alto bacino fluviale prima della conquista ottomana nel 1523.


      Il parco nazionale venne istituito il 29 maggio 2008 su forte impulso delle comunità locali. Si estende
      per 19.800 ettari. È stato proposto inoltre il Parco della Pace Plitvice-Una per collegare
      transfrontalieramente il parco dell’Una con i Laghi di Plitvice.
    before: >-
      La stagione migliore va da maggio a ottobre, e Štrbački buk registra la maggiore concentrazione di
      visitatori.
    around: >-
      A 3 km si trova la [Sorgente dell’Una](/lugar/vrelo-une/), monumento naturale protetto; a undici
      chilometri la [Foresta Vergine di Lom](/lugar/prasuma-lom-strogi-rezervat-prirode/); e a venticinque
      chilometri il [Parco Naturale del Dinara](/lugar/park-prirode-dinara/). Più lontano, il [Canyon del
      Fiume Tara](/lugar/nacionalni-park-durmitor---kanjon-tare/) e il [Massiccio del
      Durmitor](/lugar/nacionalni-park-durmitor---masiv/) condividono huchen, lupi e orsi con l’Una, mentre la
      [Gola del Dunajec](/lugar/pieninski-park-narodowy---dunajec-gorge/) condivide il salmone del Danubio e
      l’habitat di canyon fluviale.
  pt:
    intro: >-
      Um rio tem a capacidade de erigir o seu próprio cenário. O Una fá-lo com musgo e calcário: a água
      precipita-se em rápidos e cataratas, os musgos fixam o carbonato de cálcio e, paulatinamente, a rocha
      cresce, edificando diques de travertino sobre os quais o rio volta a precipitar-se. O resultado é o
      troço superior do Una, no extremo noroeste da Bósnia e Herzegovina, onde correntes azul-turquesa descem
      por Martin Brod, Štrbački buk, Troslap, Dvoslap e Ripač. Declarado parque nacional em 2008—o primeiro da
      Federação da Bósnia e Herzegovina—, salvaguarda as bacias do Una, do Unac e do alto Sana.
    landscape: >-
      O Una nasce na aldeia de Donja Suvaja, sob a serra de Stražbenica, já em território croata, numa
      ressurgência cárstica azul-esmeralda. Até Bihać o leito desce quase 3 metros por quilómetro, conferindo
      ao curso superior um perfil impetuoso de rio de montanha: ilhotas fluviais, rápidos e quedas de água.


      É aqui que opera o processo geomorfológico que esculpe a paisagem. Onde a água tomba sobre degraus, em
      especial entre Martin Brod e Štrbački buk, acumulam-se grandes depósitos de tufo calcário. Os musgos
      ripícolas, especialmente aptos a fixar o calcário, representam o elo basilar da dinâmica. Nas cascatas
      identificaram-se 42 espécies de plantas, 25 de algas e 17 de briófitos que participam na génese do
      travertino. Štrbački buk constitui a maior queda individual; as cascatas de Martin Brod são as mais
      famosas.


      O Unac conflui lateralmente. Nasce a 876 metros sob o monte Šator, rasga o desfiladeiro de Pojila e
      alcança Martin Brod através de uma garganta estreita que atinge 350 metros de profundidade. No verão
      seca em alguns troços porque corre no subsolo, ressurgindo em Crno vrelo a cerca de 3 km da foz no Una.
      O Krka, um afluente de 5 km, corre integralmente no parque servindo de fronteira com a Croácia.


      Todo o parque situa-se entre os 200 e os 450 metros de altitude, num vale alongado de noroeste a
      sudeste. As suas formações de travertino e a dinâmica fluvial são excecionais na Europa.
    wildlife: >-
      Mais de 1.900 espécies botânicas, correspondendo a 52,19 % da flora da Bósnia e Herzegovina, vicejam no
      parque. Entre os endemismos sobressaem a campainha-do-una e o lírio-bósnio, que coloniza prados secos
      sobre rocha calcária e serpentina; ocorrem ainda a genciana-amarela, a genciana-pontuada, a edelvaisse e
      o pinheiro-das-rochas.


      O parque encerra notável biodiversidade: 30 espécies de peixes, 130 de aves e grandes mamíferos como o
      [lince-euroasiático](/especie/lynx_lynx/), a raposa, o [lobo](/especie/canis_lupus/), o
      [urso](/especie/ursus_arctos/) e a [camurça](/especie/rupicapra_rupicapra/). Nos peixes, o
      [salmão-do-danúbio](/especie/hucho_hucho/) figura entre as espécies nobres ameaçadas do alto curso. A
      melhor época para visitar decorre de maio a outubro.
    visit: >-
      Os núcleos de acolhimento de Štrbački buk e Lohovo dispõem de passadiços de madeira e trilhos
      sinalizados. Štrbački buk é o ponto de partida do percurso circular do parque; painéis didáticos
      explicam a hidrologia e a génese do travertino. Em Martin Brod, povoação de fundação medieval, visitas a
      pé mostram os antigos moinhos de água. Em todo o parque há excelentes condições para caminhadas,
      passeios de bicicleta e campismo.


      No desporto fluvial, a Regata Internacional do Una, prestigiada descida em caiaque, tem início em Martin
      Brod e transpõe o Štrbački buk a jusante.
    history: >-
      Os iápodes habitaram a bacia em tempos pré-romanos, construindo palafitas ribeirinhas, sobretudo em
      Ripač. Séculos depois, a vila medieval de Rmanj ergueu-se no final do século XIV ou princípios do XV na
      confluência do Unac e do Una; o mosteiro ortodoxo de Rmanj, em Martin Brod, permanece um marco
      espiritual fundamental. A fortaleza de Ostrovica, do século XV, foi a fortificação mais imponente do
      alto Una antes da conquista otomana em 1523.


      O parque nacional foi criado a 29 de maio de 2008 por iniciativa das populações locais. Ocupa 19.800
      hectares. Foi ainda proposta a criação do Parque da Paz Plitvice-Una unindo transfronteiriçamente o
      parque de Una e os lagos de Plitvice.
    before: A melhor época para visitas vai de maio a outubro, concentrando Štrbački buk o maior afluxo.
    around: >-
      A 3 km situa-se a [Nascente do Una](/lugar/vrelo-une/), monumento natural protegido; a onze quilómetros
      ergue-se a [Floresta Virgem de Lom](/lugar/prasuma-lom-strogi-rezervat-prirode/); e a vinte e cinco
      quilómetros fica o [Parque Natural de Dinara](/lugar/park-prirode-dinara/). Mais além, o [Desfiladeiro
      do Rio Tara](/lugar/nacionalni-park-durmitor---kanjon-tare/) e o [Maciço de
      Durmitor](/lugar/nacionalni-park-durmitor---masiv/) partilham o salmão-do-danúbio, o lobo e o urso com o
      Una, enquanto a [Garganta do Dunajec](/lugar/pieninski-park-narodowy---dunajec-gorge/) partilha o
      salmão-do-danúbio e o habitat de rio em desfiladeiro.
