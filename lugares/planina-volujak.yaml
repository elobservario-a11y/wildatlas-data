observaciones:
  es: >-
    Volujak, como sus vecinas Bioč, Vlasulja y Lebršnik, queda fuera del alcance del excursionista corriente.
    La ruta atraviesa una zona de frontera.
texto:
  es:
    intro: >-
      Durante siglos, Volujak fue una línea en el mapa que se pisaba con botas. Por su cresta pasó la frontera
      entre el Imperio austrohúngaro y el otomano, y hoy sigue siendo el límite entre Bosnia y Herzegovina y
      Montenegro. En su cumbre más alta, Velika Vlasulja, de 2336 metros, todavía hay una marca de frontera de
      piedra de la época de la ocupación austrohúngara y, no lejos, un búnker también de piedra. Es la segunda
      cumbre más alta del país, y la más alta de Volujak.
    landscape: >-
      Volujak forma parte del macizo Maglić–Volujak–Bioč, entre los ríos Sutjeska, Drina, Piva y Vrbnica. Se
      extiende en dirección noroeste–sureste y el arroyo Suha lo separa de Maglić por el norte. Es una
      subcordillera de los Alpes Dináricos, de rocas sedimentarias, sobre todo caliza y dolomía, y forma una
      larga cresta al suroeste del valle de Suhja, con la frontera pegada a ella.


      Entre sus cumbres figuran Velika Vlasulja, Široka Točila, Studenac y Previja, y también Badnjine y
      Trnovački Durmitor; al pie norte de esta última queda el lago Trnovačko. La montaña se apoya en el cañón
      del Sutjeska, que nace en sus laderas y la separa de Zelengora, y al sureste enlaza con Bioč, ya en
      Montenegro. En la montaña hay muchas huellas de glaciación y, a 1.660 metros, el lago glaciar de
      Volujačko.


      Hasta los 1.600 metros la cubren hayas y coníferas; por encima, pastizales. Hay confusión sobre el
      nombre de la cordillera: unos autores llaman Vlasulja a la parte sur y otros la tratan toda como
      Volujak.
    wildlife: >-
      El Sutjeska ha excavado entre Zelengora y Maglić, Volujak y Bioč un cañón de 1200 metros de profundidad.
      En sus laderas, varios [osos pardos](/especie/ursus_arctos/) recorren las laderas, y es fácil ver
      [rebecos](/especie/rupicapra_rupicapra/) y grandes águilas. En el conjunto del parque se han avistado
      también el [lobo](/especie/canis_lupus/), la marta, el gato montés y el zorro. Los caballos que andan
      por Volujak no son salvajes, pero parecen saber sobrevivir sin cuidado regular.


      La excursión se recomienda de abril a noviembre. En mayo y junio hace falta protección solar o sombrero,
      y siempre algo de abrigo por si refresca.
    visit: >-
      La ruta de cumbre dura entre siete y ocho horas, con unas tres horas de marcha en cada sentido, y parte
      de Papin do, a 1450 metros. El ascenso es gradual y ofrece buena vista del macizo de Zelengora; en el
      camino hay una fuente de agua potable donde rellenar la cantimplora. A las dos horas y media de marcha,
      más o menos, se llega a Velika Vlasulja. Desde allí se ven Maglić, Bioč, Durmitor, Lebršnik y Zelengora.
      Después se baja por la cresta hacia Studenac, y de ahí al punto final. El circuito mide unos 14
      kilómetros.


      Lleva calzado y ropa de montaña, agua y comida para la pausa en la cumbre.
    history: >-
      Desde que los austriacos ocuparon Bosnia tras el Congreso de Berlín de 1878, la frontera quedó fijada en
      la cresta. Instalaron en la cumbre de Volujak un aparato de triangulación, cuyo pedestal aún se
      conserva. Hoy Volujak está en el Parque Nacional de Sutjeska, cuya flora incluye 2.600 especies de
      plantas vasculares, muchas raras y endémicas.
    before: >-
      Volujak, como sus vecinas Bioč, Vlasulja y Lebršnik, queda fuera del alcance del excursionista
      corriente. La ruta atraviesa una zona de frontera.
    around: >-
      Contigua queda la [Bosque Virgen de Perućica - Parque Nacional
      Sutjeska](/lugar/prasuma-perucica---nacionalni-park-sutjeska/) del Parque Nacional de Sutjeska. A un
      kilómetro están el [Parque Nacional Durmitor - Cañón del Río
      Tara](/lugar/nacionalni-park-durmitor---kanjon-tare/), el [Parque Nacional Durmitor - Macizo
      Montañoso](/lugar/nacionalni-park-durmitor---masiv/) y el [Parque Nacional Sutjeska - Macizo de
      Maglić](/lugar/nacionalni-park-sutjeska---maglic/).
  en:
    intro: >-
      For centuries, Volujak was a line on the map walked only in heavy boots. Along its ridge ran the border
      between the Austro-Hungarian and Ottoman empires, and today it remains the frontier between Bosnia and
      Herzegovina and Montenegro. On its highest summit, Velika Vlasulja at 2336 metres, a stone boundary
      marker from the Austro-Hungarian occupation era still stands, with a stone bunker nearby. It is the
      country's second highest summit and the highest peak in Volujak.
    landscape: >-
      Volujak forms part of the Maglić–Volujak–Bioč massif, cradled between the Sutjeska, Drina, Piva, and
      Vrbnica rivers. Extending northwest–southeast, the Suha stream separates it from Maglić to the north. It
      is a subrange of the Dinaric Alps composed of sedimentary rock, predominantly limestone and dolomite,
      forming a long ridge southwest of the Suhja valley with the international border tracing its crest.


      Prominent summits include Velika Vlasulja, Široka Točila, Studenac, and Previja, as well as Badnjine and
      Trnovački Durmitor; at the northern foot of the latter rests Lake Trnovačko. The mountain rises steeply
      above the Sutjeska canyon, which originates on its slopes and separates it from Zelengora, while to the
      southeast it joins Bioč in Montenegro. Marked glacial features indent the massif, including the glacial
      lake Volujačko at 1,660 metres.


      Up to 1,600 metres the slopes are covered in beech and conifer forests, transitioning above into high
      alpine pastures. Some cartographic ambiguity surrounds the name: some authors label the southern section
      Vlasulja, while others treat the entire chain as Volujak.
    wildlife: >-
      The Sutjeska has carved a canyon 1200 metres deep between Zelengora, Maglić, Volujak, and Bioč. Across
      its slopes, several [brown bears](/especie/ursus_arctos/) roam, and [Balkan
      chamois](/especie/rupicapra_rupicapra/) and large eagles are frequently sighted. Across the wider
      national park, the [grey wolf](/especie/canis_lupus/), pine marten, European wildcat, and red fox have
      been recorded. The semi-feral horses roaming Volujak are not truly wild, yet they thrive without regular
      human care.


      Hiking is best undertaken from April to November. In May and June sunscreen or a hat is essential, along
      with warm layers for sudden cold snaps.
    visit: >-
      The summit trail takes seven to eight hours, requiring about three hours of walking in each direction,
      starting from Papin do at 1450 metres. The ascent is steady and grants panoramic vistas across the
      Zelengora massif; a natural spring along the route allows water bottles to be refilled. After
      approximately two and a half hours, you reach Velika Vlasulja. From here you overlook Maglić, Bioč,
      Durmitor, Lebršnik, and Zelengora. You then descend along the ridge toward Studenac and back to the
      starting point. The entire loop measures around 14 kilometres.


      Bring sturdy mountain footwear, layered clothing, water, and lunch for the summit rest.
    history: >-
      Ever since Austro-Hungarian forces occupied Bosnia following the 1878 Congress of Berlin, the border was
      fixed along the ridge. An Austro-Hungarian survey triangulation station was erected on Volujak's summit,
      whose stone base survives today. Volujak now lies within Sutjeska National Park, home to 2,600 vascular
      plant species, including numerous rare and endemic taxa.
    before: >-
      Volujak, like neighbouring Bioč, Vlasulja, and Lebršnik, lies beyond the realm of casual day-hikers. The
      trail traverses a sensitive international border zone.
    around: >-
      Contiguous with the massif lies [Perućica Primeval Forest - Sutjeska National
      Park](/lugar/prasuma-perucica---nacionalni-park-sutjeska/). One kilometre away are [Durmitor National
      Park - Tara River Canyon](/lugar/nacionalni-park-durmitor---kanjon-tare/), [Durmitor National Park -
      Mountain Massif](/lugar/nacionalni-park-durmitor---masiv/), and [Sutjeska National Park - Maglić
      Massif](/lugar/nacionalni-park-sutjeska---maglic/).
  fr:
    intro: >-
      Pendant des siècles, le Volujak fut une ligne sur la carte arpentée en lourdes chaussures de marche. Sa
      crête porta la frontière entre les empires austro-hongrois et ottoman, et sépare aujourd'hui la
      Bosnie-Herzégovine du Monténégro. Sur son plus haut sommet, Velika Vlasulja, à 2336 mètres, subsiste une
      borne frontière en pierre de l'époque austro-hongroise et, non loin, un ancien blockhaus en pierre.
      C'est le deuxième plus haut sommet du pays et le point culminant du Volujak.
    landscape: >-
      Le Volujak s'intègre au massif Maglić–Volujak–Bioč, enchâssé entre la Sutjeska, la Drina, la Piva et la
      Vrbnica. Orienté nord-ouest–sud-est, le ruisseau Suha l'isole du Maglić au nord. Ce chaînon des Alpes
      dinariques est formé de roches sédimentaires, principalement calcaires et dolomies, traçant une longue
      crête au sud-ouest de la vallée de Suhja, bordée par la frontière d'État.


      Parmi ses cimes figurent Velika Vlasulja, Široka Točila, Studenac et Previja, ainsi que Badnjine et
      Trnovački Durmitor, au pied nord duquel repose le lac Trnovačko. La montagne domine le canyon de la
      Sutjeska, qui prend source sur ses pentes et la sépare de la Zelengora, et rejoint au sud-est le Bioč,
      au Monténégro. De nombreuses traces glaciaires marquent le massif, dont le lac de Volujačko à 1 660
      mètres.


      Jusqu'à 1 600 mètres dominent hêtraies et conifères, relayés plus haut par les alpages. Une hésitation
      toponymique persiste : certains auteurs réservent le nom de Vlasulja au secteur méridional, d'autres
      nomment l'ensemble Volujak.
    wildlife: >-
      La Sutjeska a taillé entre Zelengora, Maglić, Volujak et Bioč un canyon de 1200 mètres de profondeur.
      Sur ces versants, plusieurs [ours bruns](/especie/ursus_arctos/) circulent, et l'on aperçoit aisément
      des [chamois](/especie/rupicapra_rupicapra/) et de grands rapaces. Dans l'ensemble du parc national ont
      également été observés le [loup gris](/especie/canis_lupus/), la martre, le chat sauvage et le renard.
      Les chevaux qui arpentent le Volujak ne sont pas strictement sauvages, mais vivent en totale autonomie.


      La randonnée se pratique d'avril à novembre. En mai et juin, couvrez-vous la tête contre le soleil et
      prévoyez une polaire face aux brusques refroidissements.
    visit: >-
      L'itinéraire de crête demande sept à huit heures, avec environ trois heures d'ascension et autant de
      retour, au départ de Papin do à 1450 mètres. La montée est progressive et ouvre un vaste panorama sur la
      Zelengora ; une source potable permet de ravitailler la gourde en chemin. Après deux heures et demie de
      marche, on atteint Velika Vlasulja. La vue embrasse Maglić, Bioč, Durmitor, Lebršnik et Zelengora. On
      redescend par la crête vers Studenac pour clore la boucle. Le circuit totalise environ 14 kilomètres.


      Emportez chaussures de montagne, vêtements chauds, eau et pique-nique.
    history: >-
      Depuis l'occupation austro-hongroise de la Bosnie consécutive au congrès de Berlin de 1878, la frontière
      fut matérialisée sur l'arête. Une colonne de triangulation géodésique fut installée sur la cime du
      Volujak, dont le socle est intact. Le Volujak est inclus dans le parc national de Sutjeska, riche de 2
      600 espèces de plantes vasculaires, dont de précieux endémiques.
    before: >-
      Le Volujak, à l'instar du Bioč, de la Vlasulja et du Lebršnik, dépasse le cadre de la randonnée
      familiale. L'itinéraire chemine sur une frontière d'État isolée.
    around: >-
      Attenante s'étend la [forêt vierge de Perućica - parc national de
      Sutjeska](/lugar/prasuma-perucica---nacionalni-park-sutjeska/). À un kilomètre se trouvent le [parc
      national de Durmitor - canyon de la Tara](/lugar/nacionalni-park-durmitor---kanjon-tare/), le [parc
      national de Durmitor - massif montagneux](/lugar/nacionalni-park-durmitor---masiv/) et le [parc national
      de Sutjeska - massif du Maglić](/lugar/nacionalni-park-sutjeska---maglic/).
  de:
    intro: >-
      Jahrhundertelang war der Volujak eine Grenzlinie auf der Landkarte, die nur mit festem Schuhwerk
      begangen wurde. Über seinen Grat verlief die Grenze zwischen Österreich-Ungarn und dem Osmanischen
      Reich, und noch heute trennt er Bosnien und Herzegowina von Montenegro. Auf seinem höchsten Punkt, der
      Velika Vlasulja mit 2336 Metern, steht bis heute ein steinerner Grenzstein aus der k. u. k.
      Besatzungszeit, unweit davon ein Steinbunker. Er ist der zweithöchste Gipfel des Landes und die Krönung
      des Volujak.
    landscape: >-
      Der Volujak gehört zum Gebirgsstock Maglić–Volujak–Bioč zwischen Sutjeska, Drina, Piva und Vrbnica. Er
      verläuft von Nordwesten nach Südosten, wobei der Suha-Bach ihn im Norden vom Maglić trennt. Diese
      Untergruppe der Dinarischen Alpen besteht aus Sedimentgesteinen, vor allem Kalkstein und Dolomit, und
      bildet südwestlich des Suhja-Tals einen langen Grat, auf dem die Landesgrenze verläuft.


      Zu den Gipfeln zählen Velika Vlasulja, Široka Točila, Studenac und Previja sowie Badnjine und Trnovački
      Durmitor; am Nordfuß des Letzteren liegt der Trnovačko-See. Das Gebirge stützt sich auf die
      Sutjeska-Schlucht, die an seinen Hängen entspringt und es von der Zelengora trennt, während es im
      Südosten an den montenegrinischen Bioč anschließt. Das Gebirge weist glaziale Spuren auf, darunter den
      Karrsee Volujačko auf 1.660 Metern.


      Bis 1.600 Meter dominieren Buchen- und Nadelwälder, darüber Hochweiden. Bei der Namensgebung herrscht
      Uneinigkeit: Manche Autoren bezeichnen den Südteil als Vlasulja, andere das gesamte Massiv als Volujak.
    wildlife: >-
      Die Sutjeska hat zwischen Zelengora, Maglić, Volujak und Bioč eine 1200 Meter tiefe Schlucht gegraben.
      An den Hängen streifen mehrere [Braunbären](/especie/ursus_arctos/) umher, und
      [Balkangämsen](/especie/rupicapra_rupicapra/) sowie Steinadler lassen sich leicht beobachten. Im
      gesamten Nationalpark leben auch der [Wolf](/especie/canis_lupus/), Baummarder, die Wildkatze und der
      Rotfuchs. Die Pferde auf dem Volujak sind zwar nicht vollkommen wild, überleben aber ohne menschliche
      Obhut.


      Touren empfehlen sich von April bis November. Im Mai und Juni ist Sonnenschutz ratsam, ebenso warme
      Kleidung bei Wetterumschwüngen.
    visit: >-
      Die Gipfelroute erfordert sieben bis acht Stunden bei jeweils etwa drei Stunden Gehzeit pro Richtung,
      beginnend in Papin do auf 1450 Metern. Der Anstieg verläuft stetig mit freiem Blick auf das
      Zelengora-Massiv; unterwegs gibt es eine Trinkwasserquelle zum Auffüllen der Flaschen. Nach etwa
      zweieinhalb Stunden erreicht man die Velika Vlasulja. Von dort blickt man auf Maglić, Bioč, Durmitor,
      Lebršnik und Zelengora. Danach führt der Abstieg über den Grat nach Studenac und zurück. Die Rundtour
      misst etwa 14 Kilometer.


      Feste Wanderschuhe, wetterfeste Kleidung, Wasser und Proviant für die Gipfelrast mitnehmen.
    history: >-
      Seit der österreichisch-ungarischen Besetzung Bosniens infolge des Berliner Kongresses von 1878 war die
      Grenze am Grat festgelegt. Auf dem Gipfel des Volujak errichteten k. u. k. Geodäten eine
      Triangulationssäule, deren Sockel erhalten ist. Heute gehört der Volujak zum Sutjeska-Nationalpark,
      dessen Flora 2.600 Gefäßpflanzenarten umfasst, darunter viele seltene Endemiten.
    before: >-
      Der Volujak liegt, wie die Nachbarn Bioč, Vlasulja und Lebršnik, abseits klassischer Wanderwege. Die
      Route verläuft entlang einer einsamen Staatsgrenze.
    around: >-
      Direkt benachbart liegt der [Urwald Perućica – Nationalpark
      Sutjeska](/lugar/prasuma-perucica---nacionalni-park-sutjeska/). Einen Kilometer entfernt liegen der
      [Nationalpark Durmitor – Tara-Schlucht](/lugar/nacionalni-park-durmitor---kanjon-tare/), der
      [Nationalpark Durmitor – Gebirgsmassiv](/lugar/nacionalni-park-durmitor---masiv/) und der [Nationalpark
      Sutjeska – Maglić-Massiv](/lugar/nacionalni-park-sutjeska---maglic/).
  it:
    intro: >-
      Per secoli il Volujak è stato una linea di confine percorsa solo da soldati ed escursionisti provetti.
      Lungo la sua cresta correva il confine tra l'Impero austro-ungarico e quello ottomano, e ancora oggi
      separa la Bosnia ed Erzegovina dal Montenegro. Sulla sua vetta principale, Velika Vlasulja a 2336 metri,
      sopravvive un cippo confinario in pietra del periodo austro-ungarico e, poco distante, un fortino
      anch'esso in pietra. È la seconda cima più alta del paese e il culmine del Volujak.
    landscape: >-
      Il Volujak si inserisce nel gruppo Maglić–Volujak–Bioč, stretto tra i fiumi Sutjeska, Drina, Piva e
      Vrbnica. Sviluppato in direzione nord-ovest–sud-est, è separato a nord dal Maglić tramite il torrente
      Suha. È una sottocatena delle Alpi Dinariche costituita da rocce sedimentarie, in particolare calcare e
      dolomia, che genera una lunga dorsale a sud-ovest della valle di Suhja, percorsa dalla frontiera
      statale.


      Tra le sue cime spiccano Velika Vlasulja, Široka Točila, Studenac e Previja, oltre a Badnjine e
      Trnovački Durmitor; ai piedi settentrionali di quest'ultima giace il lago Trnovačko. La montagna si
      appoggia sul canyon della Sutjeska, che nasce dalle sue falde dividendola dalla Zelengora, mentre a
      sud-est si salda al Bioč, già in Montenegro. Il rilievo reca vive testimonianze glaciali, tra cui il
      lago di Volujačko a 1.660 metri.


      Fino a 1.600 metri il manto è fatto di faggi e conifere, lasciando spazio in alto alle praterie alpine.
      La toponomastica locale è discussa: alcuni autori limitano il nome Vlasulja al settore sud, mentre altri
      considerano l'intera catena come Volujak.
    wildlife: >-
      La Sutjeska ha scavato tra Zelengora, Maglić, Volujak e Bioč una forra profonda 1200 metri. Lungo le
      pendici si aggirano diversi [orsi bruni](/especie/ursus_arctos/), ed è frequente avvistare
      [camosci](/especie/rupicapra_rupicapra/) e grandi rapaci. Nel parco nazionale sono stati censiti anche
      il [lupo](/especie/canis_lupus/), la martora, il gatto selvatico e la volpe. I cavalli che pascolano sul
      Volujak non sono originariamente selvatici, ma vivono allo stato brado senza cure umane.


      Le escursioni sono consigliate da aprile a novembre. A maggio e giugno servono copricapo e crema solare,
      oltre a capi caldi per i cali termici.
    visit: >-
      La salita alla vetta impegna sette-otto ore, con circa tre ore di cammino per senso di marcia, partendo
      da Papin do a 1450 metri. L'ascesa è costante e schiude ampie vedute sul massiccio di Zelengora; lungo
      il sentiero si trova una sorgente d'acqua potabile dove riempire la borraccia. In circa due ore e mezza
      si tocca la Velika Vlasulja. Il panorama spazia su Maglić, Bioč, Durmitor, Lebršnik e Zelengora. Si
      discende lungo la cresta verso Studenac chiudendo l'anello. L'itinerario misura circa 14 chilometri.


      Porta scarponi da montagna, abbigliamento a strati, acqua e provviste per la cima.
    history: >-
      Fin dall'occupazione austro-ungarica della Bosnia conseguente al Congresso di Berlino del 1878, la
      frontiera fu stabilita lungo la linea di cresta. Sulla cima del Volujak fu collocato un pilastro di
      triangolazione geodetica, il cui basamento è intatto. Il Volujak fa parte del Parco Nazionale di
      Sutjeska, che vanta 2.600 specie di piante vascolari con molti endemismi rari.
    before: >-
      Il Volujak, al pari dei vicini Bioč, Vlasulja e Lebršnik, è riservato a escursionisti esperti. Il
      percorso si snoda lungo una frontiera di stato solitaria.
    around: >-
      Attigua si trova la [foresta vergine di Perućica - Parco Nazionale
      Sutjeska](/lugar/prasuma-perucica---nacionalni-park-sutjeska/). A un chilometro si estendono il [Parco
      Nazionale Durmitor - Canyon del Fiume Tara](/lugar/nacionalni-park-durmitor---kanjon-tare/), il [Parco
      Nazionale Durmitor - Massiccio Montuoso](/lugar/nacionalni-park-durmitor---masiv/) e il [Parco Nazionale
      Sutjeska - Massiccio del Maglić](/lugar/nacionalni-park-sutjeska---maglic/).
  pt:
    intro: >-
      Durante séculos, o Volujak foi uma linha de fronteira desbravada em botas pesadas. Pela sua crista
      passava a divisa entre os impérios austro-húngaro e otomano, continuando hoje a marcar a fronteira entre
      a Bósnia e Herzegovina e o Montenegro. No seu ponto culminante, Velika Vlasulja, a 2336 metros, resta um
      marco fronteiriço em pedra do período austro-húngaro e, nas imediações, um abrigo militar em pedra. É o
      segundo cume mais alto do país e o teto do Volujak.
    landscape: >-
      O Volujak integra o maciço Maglić–Volujak–Bioč, enquadrado pelos rios Sutjeska, Drina, Piva e Vrbnica.
      Estende-se no sentido noroeste–sudeste, com a ribeira Suha a separá-lo do Maglić a norte. Trata-se de um
      subsistema dos Alpes Dináricos constituído por rochas sedimentares, com predomínio de calcários e
      dolomias, erguendo uma crista alongada a sudoeste do vale de Suhja, sobre a qual assenta a linha de
      fronteira.


      Entre os cumes contam-se Velika Vlasulja, Široka Točila, Studenac e Previja, além de Badnjine e
      Trnovački Durmitor; na base norte deste último repousa a lagoa Trnovačko. A montanha domina o
      desfiladeiro do Sutjeska, que brota nas suas encostas e a separa de Zelengora, unindo-se a sudeste ao
      Bioč, no Montenegro. A orografia preserva marcas de glaciação, destacando-se a lagoa glaciar de
      Volujačko a 1.660 metros.


      Até aos 1.600 metros de altitude proliferam faias e coníferas, sucedendo-se prados alpinos nos cimos.
      Persiste debate quanto à toponímia: alguns autores chamam Vlasulja à secção sul, enquanto outros tratam
      todo o cordão como Volujak.
    wildlife: >-
      O Sutjeska cavou entre Zelengora, Maglić, Volujak e Bioč um desfiladeiro com 1200 metros de
      profundidade. Nas encostas circulam vários [ursos-pardos](/especie/ursus_arctos/), sendo frequente
      observar [camurças](/especie/rupicapra_rupicapra/) e águias de grande porte. Em todo o parque foram
      também assinalados o [lobo](/especie/canis_lupus/), a marta, o gato-bravo e a raposa. Os cavalos que
      pastam em Volujak não são selvagens natos, mas subsistem sem intervenção humana.


      A caminhada recomenda-se de abril a novembro. Em maio e junho impõe-se proteção solar, mantendo
      agasalhos de reserva perante aragens frias.
    visit: >-
      O percurso de cumeada requer entre sete e oito horas, com cerca de três horas de marcha em cada sentido,
      a partir de Papin do a 1450 metros. A ascensão é progressiva e descortina o maciço de Zelengora; no
      trajeto surge uma nascente de água potável para abastecer o cantil. Ao fim de duas horas e meia
      atinge-se Velika Vlasulja. O olhar alcança Maglić, Bioč, Durmitor, Lebršnik e Zelengora. A descida segue
      pela crista em direção a Studenac até fechar o circuito. O percurso totaliza cerca de 14 quilómetros.


      Leva calçado de montanha resistente, agasalhos, água e provisões para o cume.
    history: >-
      Desde que as tropas austro-húngaras ocuparam a Bósnia após o Congresso de Berlim de 1878, a fronteira
      ficou definida pela linha de cumeada. Instalaram no cimo de Volujak um marco de triangulação geodésica
      cuja base ainda subsiste. Hoje o Volujak integra o Parque Nacional Sutjeska, cuja flora soma 2.600
      espécies de plantas vasculares, incluindo preciosos endemismos.
    before: >-
      O Volujak, a exemplo dos vizinhos Bioč, Vlasulja e Lebršnik, exige experiência e boa condição física. O
      trilho acompanha uma fronteira isolada.
    around: >-
      Contígua encontra-se a [Floresta Virgem de Perućica - Parque Nacional
      Sutjeska](/lugar/prasuma-perucica---nacionalni-park-sutjeska/). A um quilómetro ficam o [Parque Nacional
      Durmitor - Desfiladeiro do Rio Tara](/lugar/nacionalni-park-durmitor---kanjon-tare/), o [Parque Nacional
      Durmitor - Maciço Montanhoso](/lugar/nacionalni-park-durmitor---masiv/) e o [Parque Nacional Sutjeska -
      Maciço de Maglić](/lugar/nacionalni-park-sutjeska---maglic/).
