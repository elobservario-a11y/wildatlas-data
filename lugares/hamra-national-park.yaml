resumen:
  es: Una isla de bosque primario de coníferas de 400 años con turberas intactas en la región de Orsa Finnmark.
  en: An island of 400-year-old primeval coniferous forest with untouched bogs in the Orsa Finnmark region.
  fr: Un îlot de forêt primaire de conifères de 400 ans cerné de tourbières intactes dans l'Orsa Finnmark.
  de: Eine Insel aus 400 Jahre altem Nadelurwald mit unberührten Mooren in der Region Orsa Finnmark.
  it: Un'isola di foresta primaria di conifere di 400 anni con torbiere intatte nella regione di Orsa Finnmark.
  pt: Uma ilha de floresta primária de coníferas de 400 anos com turfeiras intactas na região de Orsa Finnmark.
unico:
  es: >-
    Casi la mitad del parque es una turbera continua que ningún camino ni zanja ha partido, y el arroyo que la
    drena sigue como siempre.
  en: >-
    Nearly half the park is a continuous expanse of mire untouched by roads or ditches, and the stream
    draining it flows as freely as ever.
  fr: >-
    Près de la moitié du parc forme une tourbière continue qu'aucune route ni aucun fossé n'a morcelée, et le
    ruisseau qui la draine s'écoule comme autrefois.
  de: >-
    Fast die Hälfte des Parks ist ein zusammenhängendes Moor, das weder Wege noch Gräben je zerschnitten
    haben, und der entwässernde Bach fließt wie eh und je.
  it: >-
    Quasi metà del parco è un'ininterrotta distesa di torbiera che nessuna strada né canale ha mai intaccato,
    e il torrente che la drena scorre come un tempo.
  pt: >-
    Quase metade do parque é uma turfeira contínua que nenhuma estrada nem vala alguma vez fragmentou, e o
    ribeiro que a drena corre livremente.
observaciones:
  es: >-
    Está prohibido acampar en el parque original y dañar o llevarse plantas, musgos, líquenes y árboles, vivos
    o muertos. Fuera de ese núcleo se puede acampar dos noches en un mismo sitio, siempre fuera de la vista de
    las entradas y los senderos. Se pueden recoger bayas, flores y setas comestibles para consumo propio.
    Fuera de los senderos marcados hay que vigilar las turberas flotantes: una capa de vegetación cubre el
    agua y puedes atravesarla y caer al agua. Aterrizar con aeronaves exige solicitar dispensa a la
    Administración de Gävleborg.
texto:
  es:
    intro: >-
      Mide algo más de mil hectáreas y casi la mitad es una sola turbera. Hamra es un parque pequeño que se
      recorre despacio: un bosque de coníferas con árboles de más de 400 años, un arroyo que nunca se limpió
      para flotar troncos y una turbera abierta que se cruza por pasarelas de dos tablones. Está en la región
      de Orsa Finnmark, en el condado de Gävleborg.


      El parque nació en 1909 con apenas 28 hectáreas y se amplió en 2011, con tres entradas nuevas y senderos
      señalizados. Lo que protege es sobre todo lo que no se ve de lejos: bosque antiguo, humedales y cursos
      de agua que fluyen de forma natural.
    landscape: >-
      El núcleo original es una pequeña colina de morrena cubierta de bosque, de 19,5 hectáreas, rodeada de
      turbera y, al norte, de la laguna Svansjön. Alrededor, casi la mitad del parque ampliado es un único
      complejo de turberas, arroyos, pequeñas lagunas y bosques pantanosos. Todo ello lo drena el Svartån,
      cuyo valle largo, rodeado de bosque primario y natural, no se limpió nunca para la flotación de troncos,
      antes de desembocar en el Voxnan.


      El Svartån debe su nombre al agua, oscura por el humus, que parece casi negra sobre las piedras rojas
      del fondo. Y a diez minutos a pie de la entrada de Svartå, un puente cruza su mayor cubeta de roca,
      excavada por el agua de deshielo de la última glaciación. Es uno de los poquísimos cursos de agua de la
      región sin limpiar para el transporte de troncos.

       del parque domina el abeto rojo, y sobre sus ramas crece la barba de viejo, un liquen de bosque antiguo.
    wildlife: >-
      Hamra no presume de riqueza de especies; la excepción son los insectos, con 450 especies de escarabajos
      en el bosque original. Lo que sí ofrece son escenas de turbera.


      En abril, desde la torre de la entrada Myr, se ven los [gallos lira](/especie/tetrao_tetrix/) en su
      danza nupcial, y llegan las [grullas](/especie/grus_grus/) con sus gritos de primavera. Más abajo, las
      losas pulidas junto al Svartån sirven para parar a comer o para buscar [nutria](/especie/lutra_lutra/) y
      [mirlo acuático](/especie/cinclus_cinclus/) en los remolinos. Y arriba, el bosque: los pinos son cerca
      del 90 % de los árboles del parque y muchos superan los 300 años.
    visit: >-
      Las tres entradas son la principal en el norte, Myr en el centro y Svartå en el sur, y todas tienen
      letrinas secas, hogueras y mesas. A la entrada principal se llega desde la E45 por un desvío hacia el
      este en Fågelsjö, unos 5 kilómetros señalizados, y un camino de grava la une con la de Svartå pasando
      por la de Myr.


      Hay un sendero para cada ritmo. El del bosque primario, Urskogsslingan, sale de la entrada principal y
      tarda una hora; a los 2,5 km tiene un atajo que acorta el recorrido. Sus primeros 500 metros, hasta el
      mirador de Svansjön, tienen una ancha pasarela de madera accesible para sillas de ruedas y cochecitos, y
      el propio mirador, en el bosque viejo, ofrece una visión de la historia y los habitantes del lago.


      El paseo por la turbera abierta dura una hora y lleva pasarela de dos tablones donde el suelo está más
      húmedo; del mirador de la entrada Myr sale Långa myrslingan, de 3 kilómetros, y de la entrada principal
      la Lilla myrslingan, de 2,5. La Långa myrslingan atraviesa el reino de los gallos lira, las grullas y
      los esfagnos.


      La travesía mayor es la Hamraleden, que cruza el parque entero en unas seis horas y se recomienda
      empezar por la entrada de Svartå. Algunos tramos exigen trepar por piedras y vadear el río, por lo que
      se recomiendan botas; hay que cruzar el Svartån sin puente.
    history: >-
      Tras la ampliación de 2011 el parque absorbió las reservas naturales de Långsvedjan, Svartågrenen y
      Svartåvallen.
    before: >-
      Está prohibido acampar en el parque original y dañar o llevarse plantas, musgos, líquenes y árboles,
      vivos o muertos. Fuera de ese núcleo se puede acampar dos noches en un mismo sitio, siempre fuera de la
      vista de las entradas y los senderos. Se pueden recoger bayas, flores y setas comestibles para consumo
      propio. Fuera de los senderos marcados hay que vigilar las turberas flotantes: una capa de vegetación
      cubre el agua y puedes atravesarla y caer al agua. Aterrizar con aeronaves exige solicitar dispensa a la
      Administración de Gävleborg.
    around: >-
      Hamra tiene primos lejanos con los que comparte especies y hábitats. El [Parque Nacional de
      Gutulia](/lugar/gutulia-national-park/), el [Parque Nacional de Muddus /
      Muttos](/lugar/muddus-national-park/) y el [Parque Nacional Urho
      Kekkonen](/lugar/urho-kekkonen-national-park/) tienen en común con él el alce, el oso y el pico
      tridáctilo, además del bosque primario con humedal. La [Reserva Estricta de
      Białowieża](/lugar/bialowieski-park-narodowy---rezerwat-scisly/) comparte el bosque primario, el oso y
      el pico tridáctilo.
  en:
    intro: >-
      It spans just over a thousand hectares, and almost half is an unbroken mire. Hamra is an intimate park
      best explored at a slow pace: an old-growth coniferous forest with pines exceeding 400 years old, a
      meandering stream never cleared for log-driving, and an open peatland crossed via two-plank boardwalks.
      It lies within the Orsa Finnmark region of Gävleborg County.


      Established in 1909 with barely 28 hectares, the park was expanded in 2011, gaining three new gateways
      and marked trails. Its core mission is protecting what remains hidden from afar: ancient woodland,
      intact wetlands, and naturally flowing waterways.
    landscape: >-
      The original core is a moraine knoll cloaked in forest of 19.5 hectares, framed by mires and, to the
      north, Lake Svansjön. Around it, nearly half the enlarged park forms a single wetland matrix of bogs,
      brooks, tarns, and swamp forests. All of this drains through the Svartån, whose meandering valley,
      surrounded by old-growth forest, was never cleared for timber-floating before meeting the Voxnan River.


      The Svartån takes its name from water darkened by peat humus, appearing almost black above red riverbed
      stones. A ten-minute stroll from the Svartå entrance leads to a bridge over its largest rock pool,
      scoured by meltwater during the last Ice Age. It is one of very few streams in the region preserved
      without modification for timber transport.


      In the park Norway spruce dominates, its boughs festooned with old man's beard, an indicator lichen of
      ancient forests.
    wildlife: >-
      Hamra does not boast endless species tallies; the striking exception is insects, with 450 beetle species
      documented in the virgin forest. What it excels at are classic mire spectacles.


      In April, the viewing tower at the Myr entrance offers vistas of [black grouse](/especie/tetrao_tetrix/)
      displaying in their spring lek, while arriving [common cranes](/especie/grus_grus/) echo their calls
      across the peatland. Down along the Svartån, polished riverside rock ledges invite a quiet rest to watch
      for [Eurasian otter](/especie/lutra_lutra/) and [white-throated dipper](/especie/cinclus_cinclus/) in
      the eddies. Overhead, pines make up close to 90 % of the forest canopy, with many giants exceeding 300
      years of age.
    visit: >-
      The three entrances are Main (North), Myr (Central), and Svartå (South), each equipped with dry toilets,
      fire rings, and picnic benches. The main entrance is reached from the E45 highway via an eastward
      turning at Fågelsjö, followed by about 5 signposted kilometres; a gravel road connects it to Svartå via
      Myr.


      Trails cater to different desires. The virgin forest loop, Urskogsslingan, departs from the main
      entrance and takes about an hour; at 2.5 km a shortcut allows a briefer walk. Its first 500 metres to
      the Svansjön viewing platform feature a wide wooden boardwalk fully accessible for wheelchairs and
      strollers, offering insights into the lake's history and wildlife.


      The open mire circuit takes an hour on two-plank boardwalks across damp peat; from the Myr entrance
      lookout starts Långa myrslingan (3 kilometres), while from the main entrance starts Lilla myrslingan
      (2.5 km). Långa myrslingan traverses the heartland of black grouse, cranes, and vibrant sphagnum
      carpets.


      The greatest traverse is Hamraleden, crossing the entire national park in roughly six hours, recommended
      starting from the Svartå entrance. Sections require boulder-scrambling and river wading, demanding
      sturdy boots, including an unbridged crossing of the Svartån.
    history: >-
      Following its 2011 expansion, the national park absorbed the former nature reserves of Långsvedjan,
      Svartågrenen, and Svartåvallen.
    before: >-
      Camping is prohibited in the original core area, as is damaging or removing plants, mosses, lichens, and
      dead or living trees. Outside the historic core, you may camp for up to two consecutive nights in one
      spot, out of sight of park entrances and trails. Foraging berries, edible mushrooms, and flowers for
      personal use is permitted. Off-trail, beware of quaking bogs: floating moss carpets can give way
      underfoot into deep water. Landing aircraft requires permission from the Gävleborg County Administrative
      Board.
    around: >-
      Hamra shares ecological affinities with distant protected areas. [Gutulia National
      Park](/lugar/gutulia-national-park/), [Muddus / Muttos National Park](/lugar/muddus-national-park/), and
      [Urho Kekkonen National Park](/lugar/urho-kekkonen-national-park/) all feature moose, brown bear,
      Eurasian three-toed woodpecker, and old-growth boreal forest mosaic. The [Białowieża Strict
      Reserve](/lugar/bialowieski-park-narodowy---rezerwat-scisly/) similarly shares primeval woodland, bear,
      and three-toed woodpecker.
  fr:
    intro: >-
      Il couvre un peu plus de mille hectares et près de la moitié est occupée par une seule et vaste
      tourbière. Hamra est un petit parc qui se découvre avec lenteur : une forêt de conifères abritant des
      arbres de plus de 400 ans, un ruisseau jamais recalibré pour le flottage du bois et une tourbière
      ouverte que l'on traverse sur des caillebotis de deux planches. Il se situe dans la région d'Orsa
      Finnmark, dans le comté de Gävleborg.


      Créé en 1909 avec seulement 28 hectares, le parc a été agrandi en 2011, recevant trois nouvelles entrées
      et des sentiers balisés. Ce qu'il protège se dérobe souvent aux regards lointains : une forêt ancienne,
      des zones humides et des cours d'eau au régime entièrement naturel.
    landscape: >-
      Le cœur historique est une petite éminence morainique boisée de 19,5 hectares, ceinte de tourbières et
      bordée au nord par le lac Svansjön. Autour, près de la moitié du parc agrandi constitue un unique
      ensemble de tourbières, ruisseaux, petits étangs et forêts marécageuses. Tout cet ensemble est drainé
      par le Svartån, dont la longue vallée bordée de forêt primaire n'a jamais été aménagée pour le flottage
      des grumes avant de rejoindre le Voxnan.


      Le Svartån doit son nom à ses eaux chargées d'humus tourbeux, qui paraissent presque noires sur les
      galets rouges du lit. À dix minutes de marche de l'entrée de Svartå, une passerelle franchit sa plus
      grande marmite de géant, creusée par les eaux de fonte de la dernière glaciation. C'est l'un des rares
      ruisseaux de la région épargné par les aménagements pour le transport du bois.


      Dans le parc domine l'épicéa commun, sur les branches duquel pousse l'usnée barbue, un lichen
      caractéristique des forêts anciennes.
    wildlife: >-
      Hamra ne se distingue pas par une débauche d'espèces ; l'exception remarquable concerne les insectes,
      avec 450 espèces de coléoptères recensées dans la forêt originelle. En revanche, le parc offre des
      ambiances de tourbière incomparables.


      En avril, depuis la tour d'observation de l'entrée Myr, on assiste aux parades nuptiales des [tétras
      lyres](/especie/tetrao_tetrix/), tandis qu'arrivent les [grues cendrées](/especie/grus_grus/) aux cris
      retentissants. Plus bas, les dalles rocheuses polies en bordure du Svartån invitent à une halte pour
      guetter la [loutre d'Europe](/especie/lutra_lutra/) et le [cincle plongeur](/especie/cinclus_cinclus/)
      dans les remous. En haut, la forêt : les pins représentent près de 90 % des arbres du parc et nombre
      d'entre eux dépassent 300 ans.
    visit: >-
      Les trois entrées sont l'entrée principale au nord, Myr au centre et Svartå au sud, toutes pourvues de
      toilettes sèches, d'aires de pique-nique et de foyers. L'accès à l'entrée principale se fait depuis la
      route E45 en bifurquant vers l'est à Fågelsjö sur environ 5 kilomètres balisés ; une piste de gravier la
      relie à Svartå en passant par Myr.


      À chaque marcheur son itinéraire. La boucle de la forêt primaire, Urskogsslingan, part de l'entrée
      principale et demande une heure ; à 2,5 km, un raccourci permet de réduire le parcours. Ses 500 premiers
      mètres, jusqu'au belvédère de Svansjön, comportent un large platelage en bois accessible en fauteuil
      roulant et poussette, offrant une vue sur l'histoire et les résidents du lac.


      La promenade sur la tourbière ouverte dure une heure et emprunte un caillebotis de deux planches sur les
      terrains spongieux ; du belvédère de l'entrée Myr part la Långa myrslingan (3 kilomètres), et de
      l'entrée principale la Lilla myrslingan (2,5 km). La Långa myrslingan traverse le domaine des tétras,
      des grues et des tapis de sphaignes.


      La grande traversée est le Hamraleden, qui parcourt l'ensemble du parc en environ six heures, conseillé
      depuis l'entrée de Svartå. Certains tronçons imposent de progresser sur des blocs et d'effectuer des
      passages à gué, d'où la recommandation de bottes adaptées ; la traversée du Svartån se fait sans pont.
    history: >-
      À la suite de son agrandissement de 2011, le parc a absorbé les anciennes réserves naturelles de
      Långsvedjan, Svartågrenen et Svartåvallen.
    before: >-
      Le bivouac est interdit dans le périmètre originel du parc, tout comme l'atteinte ou le prélèvement de
      plantes, mousses, lichens et arbres, vivants ou morts. Hors de ce noyau, vous pouvez camper jusqu'à deux
      nuits au même endroit, à l'écart des entrées et des sentiers. La cueillette de baies, champignons et
      fleurs comestibles pour consommation personnelle est autorisée. En dehors des pistes balisées, prenez
      garde aux tourbières tremblantes : un radeau végétal recouvre l'eau et peut céder sous votre poids. Tout
      atterrissage d'aéronef requiert une autorisation de la préfecture de Gävleborg.
    around: >-
      Hamra possède des liens écologiques avec des parcs plus lointains. Le [parc national de
      Gutulia](/lugar/gutulia-national-park/), le [parc national de Muddus /
      Muttos](/lugar/muddus-national-park/) et le [parc national Urho
      Kekkonen](/lugar/urho-kekkonen-national-park/) partagent avec lui l'élan, l'ours et le pic tridactyle,
      ainsi que la mosaïque de forêt primaire boréale et de tourbières. La [réserve intégrale de
      Białowieża](/lugar/bialowieski-park-narodowy---rezerwat-scisly/) partage également la forêt vierge,
      l'ours et le pic tridactyle.
  de:
    intro: >-
      Er misst etwas mehr als tausend Hektar und fast die Hälfte davon ist ein einziges Moor. Hamra ist ein
      überschaubarer Park, den man mit Muße durchstreift: Ein Nadelurwald mit Bäumen von über 400 Jahren, ein
      nie für die Flößerei geräumter Bach und ein offenes Moor, das auf doppelten Holzbohlenstegen überquert
      wird. Er liegt in der Region Orsa Finnmark in der Provinz Gävleborg.


      Der Park wurde 1909 mit lediglich 28 Hektar gegründet und 2011 erweitert, wobei drei neue Eingänge und
      markierte Wege entstanden. Er schützt vor allem das, was sich dem flüchtigen Blick entzieht:
      Urwaldreste, Feuchtgebiete und naturnah fließende Gewässer.
    landscape: >-
      Der historische Kern ist eine bewaldete Moränenkuppe von 19,5 Hektar, umgeben von Moor und im Norden vom
      Svansjön-See begrenzt. Um ihn herum bildet fast die Hälfte des erweiterten Parks einen zusammenhängenden
      Komplex aus Mooren, Bächen, kleinen Seen und Bruchwäldern. Entwässert wird all dies durch den Svartån,
      dessen langes, von Urwald gesäumtes Tal nie für die Holzflößerei begradigt wurde, ehe er in den Voxnan
      mündet.


      Der Svartån verdankt seinen Namen dem vom Moorhumus dunkel gefärbten Wasser, das über den roten
      Grundsteinen fast schwarz erscheint. Nur zehn Gehminuten vom Eingang Svartå entfernt führt eine Brücke
      über seinen größten Felskolk, den das Schmelzwasser der letzten Eiszeit aushöhlte. Er ist eines der ganz
      wenigen Fließgewässer der Region ohne forstwirtschaftliche Begradigung.


      Im Park dominiert die Gemeine Fichte, auf deren Ästen die Bartflechte gedeiht—ein Anzeiger uralter
      Wälder.
    wildlife: >-
      Hamra glänzt nicht mit zahllosen Arten; die Ausnahme bilden Insekten mit 450 Käferarten im
      ursprünglichen Waldgebiet. Dafür bietet der Park unverfälschte Moorszenarien.


      Im April lassen sich vom Beobachtungsturm am Eingang Myr die Balzflüge der
      [Birkhühner](/especie/tetrao_tetrix/) erleben, während ziehende [Kraniche](/especie/grus_grus/) mit
      ihren Rufen den Frühling ankündigen. Weiter unten laden die glattgeschliffenen Felsplatten am Svartån
      zur Rast ein, um nach [Fischotter](/especie/lutra_lutra/) und [Wasseramsel](/especie/cinclus_cinclus/)
      in den Strudeln Ausschau zu halten. Und droben der Wald: Kiefern stellen fast 90 % der Bäume des Parks,
      viele älter als 300 Jahre.
    visit: >-
      Die drei Eingänge sind der Haupteingang im Norden, Myr in der Mitte und Svartå im Süden; alle bieten
      Trockentoiletten, Feuerstellen und Rastbänke. Der Haupteingang ist von der E45 über eine Abzweigung nach
      Osten in Fågelsjö nach etwa 5 ausgeschilderten Kilometern erreichbar; ein Schotterweg verbindet ihn über
      Myr mit Svartå.


      Für jedes Tempo gibt es einen passenden Weg. Der Urwald-Rundweg Urskogsslingan beginnt am Haupteingang
      und dauert eine Stunde; bei 2,5 km kürzt ein Pfad die Strecke ab. Seine ersten 500 Meter bis zur
      Plattform am Svansjön sind als breiter Holzsteg barrierefrei für Rollstühle und Kinderwagen ausgebaut.


      Die Moorwanderung dauert eine Stunde und führt auf Holzbohlen über nasse Böden; von der
      Aussichtsplattform am Eingang Myr startet der 3 Kilometer lange Långa myrslingan, vom Haupteingang die
      Lilla myrslingan mit 2,5 km. Der Långa myrslingan führt mitten durch das Reich von Birkhuhn, Kranich und
      Torfmoosen.


      Die große Durchquerung ist der Hamraleden, der den gesamten Park in rund sechs Stunden durchmisst und am
      besten am Eingang Svartå begonnen wird. Einige Abschnitte erfordern Trittsicherheit über Blockwerk und
      Flussdurchquerungen, sodass feste Stiefel angeraten sind; der Svartån wird ohne Brücke gequert.
    history: >-
      Nach der Erweiterung von 2011 nahm der Nationalpark die vormaligen Naturschutzgebiete Långsvedjan,
      Svartågrenen und Svartåvallen in sich auf.
    before: >-
      Zelten im ursprünglichen Parkteil ist untersagt, ebenso das Beschädigen oder Entnehmen von Pflanzen,
      Moosen, Flechten und lebendem oder totem Holz. Außerhalb dieser Kernzone darfst du bis zu zwei Nächte am
      selben Ort zelten, außerhalb der Sichtweite von Wegen und Eingängen. Das Sammeln von Beeren, essbaren
      Pilzen und Blumen für den Eigenbedarf ist erlaubt. Achte abseits der Pfade auf Schwingrasen: Eine
      Pflanzendecke überdeckt offenes Wasser und kann einbrechen. Landungen von Luftfahrzeugen bedürfen der
      Genehmigung der Provinzialverwaltung Gävleborg.
    around: >-
      Hamra teilt Lebensräume und Charakterarten mit ferneren Schutzgebieten. Der [Nationalpark
      Gutulia](/lugar/gutulia-national-park/), der [Nationalpark Muddus /
      Muttos](/lugar/muddus-national-park/) und der
      [Urho-Kekkonen-Nationalpark](/lugar/urho-kekkonen-national-park/) teilen mit ihm Elch, Bär,
      Dreizehenspecht sowie Taigaurwald und Moore. Das [Strenge Reservat von
      Białowieża](/lugar/bialowieski-park-narodowy---rezerwat-scisly/) teilt Urwald, Bär und Dreizehenspecht.
  it:
    intro: >-
      Copre poco più di mille ettari e quasi la metà è occupata da un'unica torbiera. Hamra è un piccolo parco
      che si visita senza fretta: un bosco di conifere con alberi ultracentenari di oltre 400 anni, un
      ruscello mai bonificato per la fluitazione dei tronchi e una torbiera aperta che si attraversa su
      passerelle a due assi. Sorge nella regione di Orsa Finnmark, nella contea di Gävleborg.


      Istituito nel 1909 con appena 28 ettari, il parco è stato ampliato nel 2011 con tre nuovi ingressi e
      sentieri segnati. Protegge soprattutto ciò che sfugge da lontano: boschi vetusti, zone umide e corsi
      d'acqua a regime naturale.
    landscape: >-
      Il nucleo storico è un colle morenico boscato di 19,5 ettari, circondato da torbiere e a nord dal lago
      Svansjön. Attorno, quasi metà del parco ampliato forma un unico insieme di torbiere, torrenti, laghetti
      e boschi palustri. Tutto questo territorio è drenato dallo Svartån, la cui lunga valle orlata di foresta
      primaria non fu mai canalizzata per il trasporto di legname, prima di confluire nel Voxnan.


      Lo Svartån deve il nome alle acque scure per l'humus torboso, che appaiono quasi nere sui ciottoli
      rossicci del fondo. A dieci minuti a piedi dall'ingresso di Svartå, un ponte attraversa la sua maggiore
      marmitta rocciosa, scavata dalle acque di disgelo dell'ultima era glaciale. È uno dei pochissimi corsi
      d'acqua regionali rimasti del tutto intatti rispetto all'industria del legname.


      Nel parco predomina l'abete rosso, sui cui rami cresce l'usnea barbata, lichene caratteristico delle
      foreste vetuste.
    wildlife: >-
      Hamra non punta su una sterminata varietà di specie; l'eccezione sono gli insetti, con 450 specie di
      coleotteri documentate nella foresta originaria. In compenso, regala straordinari quadri di torbiera.


      In aprile, dalla torre dell'ingresso Myr si osservano le parate nuziali dei [galli
      forcelli](/especie/tetrao_tetrix/), mentre risuonano i richiami delle [gru](/especie/grus_grus/)
      all'arrivo della primavera. Più in basso, le lastre levigate lungo lo Svartån invitano a una sosta per
      scorgere la [lontra europea](/especie/lutra_lutra/) e il [merlo acquaiolo](/especie/cinclus_cinclus/)
      tra i mulinelli d'acqua. In alto domina la foresta: i pini costituiscono quasi il 90 % degli alberi del
      parco e molti oltrepassano i 300 anni di età.
    visit: >-
      I tre punti d'accesso sono l'ingresso principale a nord, Myr al centro e Svartå a sud, tutti provvisti
      di servizi igienici a secco, focolari e tavoli da picnic. L'ingresso principale si raggiunge dalla
      statale E45 deviando a est presso Fågelsjö per circa 5 chilometri indicati da cartelli; una carrareccia
      sterrata lo collega a Svartå transitando per Myr.


      C'è un itinerario per ogni preferenza. L'anello della foresta primaria, Urskogsslingan, parte
      dall'ingresso principale e richiede un'ora; a 2,5 km una variante consente di accorciare il cammino. I
      suoi primi 500 metri fino al belvedere di Svansjön sono dotati di un'ampia passerella in legno
      percorribile in sedia a rotelle e con passeggini.


      La passeggiata nella torbiera aperta dura un'ora e corre su passerelle a due assi nei punti più umidi;
      dal belvedere di Myr si diparte la Långa myrslingan (3 chilometri), e dall'ingresso principale la Lilla
      myrslingan (2,5 km). La Långa myrslingan attraversa il regno di galli forcelli, gru e morbidi cuscinetti
      di sfagni.


      La traversata più lunga è la Hamraleden, che attraversa tutto il parco in circa sei ore, con partenza
      suggerita dall'ingresso di Svartå. Alcuni tratti richiedono passi su pietraie e guadi, per cui si
      raccomandano stivali; il passaggio dello Svartån avviene senza ponte.
    history: >-
      A seguito dell'ampliamento del 2011, il parco nazionale ha inglobato le riserve naturali preesistenti di
      Långsvedjan, Svartågrenen e Svartåvallen.
    before: >-
      È vietato campeggiare nel perimetro storico del parco, nonché danneggiare o asportare piante, muschi,
      licheni o alberi, sia vivi che morti. Al di fuori del nucleo originario è consentito campeggiare per due
      notti nello stesso punto, al riparo dalla vista di ingressi e tracciati. È permessa la raccolta di
      bacche, funghi commestibili e fiori per uso personale. Fuori dai percorsi segnati presta attenzione ai
      pantani galleggianti: uno strato di vegetazione sospeso sull'acqua può cedere sotto i piedi.
      L'atterraggio con velivoli richiede la dispensa dell'Amministrazione provinciale di Gävleborg.
    around: >-
      Hamra ha affinità ecologiche con aree protette più distanti. Il [Parco nazionale di
      Gutulia](/lugar/gutulia-national-park/), il [Parco nazionale di Muddus /
      Muttos](/lugar/muddus-national-park/) e il [Parco nazionale Urho
      Kekkonen](/lugar/urho-kekkonen-national-park/) condividono alce, orso, picchio tridattilo e l'intreccio
      di bosco primario boreale e torbiere. La [Riserva integrale di
      Białowieża](/lugar/bialowieski-park-narodowy---rezerwat-scisly/) condivide parimenti la foresta vergine,
      l'orso e il picchio tridattilo.
  pt:
    intro: >-
      Mede pouco mais de mil hectares e quase metade é uma única turfeira. Hamra é um parque recolhido que se
      percorre sem pressa: uma floresta de coníferas com árvores de mais de 400 anos, um ribeiro que nunca foi
      desobstruído para transporte de madeira e uma turfeira aberta cruzada por passadiços de dois pranchões.
      Fica na região de Orsa Finnmark, no condado de Gävleborg.


      O parque nasceu em 1909 com apenas 28 hectares e foi alargado em 2011, ganhando três novas entradas e
      trilhos sinalizados. O que protege é sobretudo aquilo que passa despercebido à distância: matas antigas,
      zonas húmidas e linhas de água de regime hidrológico natural.
    landscape: >-
      O núcleo histórico é uma pequena colina morenaica arborizada de 19,5 hectares, cercada por turfeiras e,
      a norte, pela lagoa Svansjön. Em redor, quase metade do parque alargado compõe um único mosaico de
      turfeiras, ribeiros, pequenas lagoas e matas pantanosas. Tudo é drenado pelo Svartån, cujo vale
      prolongado, orlado de floresta primária, nunca sofreu intervenções para a flutuação de madeira antes de
      desaguar no Voxnan.


      O Svartån deve o seu nome às águas escuras pelo húmus das turfeiras, que parecem quase negras sobre o
      cascalho avermelhado do fundo. A dez minutos a pé da entrada de Svartå, uma ponte atravessa a sua maior
      marmita de gigante talhada pelas águas de degelo da última glaciação. Trata-se de uma das raríssimas
      linhas de água da região preservada sem retificações para transporte florestal.


      No parque predomina o espruce, nos ramos do qual se desenvolve a usneia, líquen característico de matas
      vetustas.
    wildlife: >-
      Hamra não se gaba de uma diversidade imensa; a notável exceção reside nos insetos, com 450 espécies de
      escaravelhos assinaladas na mata original. Em contrapartida, presenteia com autênticos cenários de
      turfeira.


      Em abril, da torre da entrada Myr avistam-se as paradas nupciais dos
      [galos-liras](/especie/tetrao_tetrix/), enquanto ecoam os chamamentos dos [bando de
      grous](/especie/grus_grus/) com a chegada da primavera. Mais abaixo, as lajes polidas junto ao Svartån
      prestam-se a uma pausa para procurar a [lontra-europeia](/especie/lutra_lutra/) e o
      [melro-d'água](/especie/cinclus_cinclus/) nos remoinhos. Em cima reina a floresta: os pinheiros perfazem
      quase 90 % do arvoredo e muitos ultrapassam os 300 anos de idade.
    visit: >-
      As três entradas são a principal a norte, Myr ao centro e Svartå a sul, dispondo todas de retretes
      secas, fogueiras e mesas de piquenique. À entrada principal chega-se a partir da E45 virando para leste
      em Fågelsjö ao longo de cerca de 5 quilómetros sinalizados; um caminho de gravilha une-a a Svartå
      passando por Myr.


      Há um percurso para cada ritmo. O trilho da mata primária, Urskogsslingan, parte da entrada principal e
      demora uma hora; aos 2,5 km existe um atalho que encurta o trajeto. Os seus primeiros 500 metros até ao
      miradouro de Svansjön possuem um largo passadiço acessível a cadeiras de rodas e carrinhos de bebé.


      O passeio pela turfeira aberta demora uma hora e segue sobre passadiços de dois pranchões nas áreas mais
      ensopadas; do miradouro da entrada Myr arranca a Långa myrslingan (3 quilómetros) e da entrada principal
      a Lilla myrslingan (2,5 km). A Långa myrslingan atravessa o coração dos galos-liras, grous e mantos de
      esfagno.


      A grande travessia é a Hamraleden, que cruza todo o parque em cerca de seis horas, com início
      aconselhado na entrada de Svartå. Certos troços exigem caminhar sobre blocos e vadear o rio,
      recomendando-se galochas ou botas impermeáveis; a travessia do Svartån faz-se sem ponte.
    history: >-
      Na sequência da ampliação de 2011, o parque nacional integrou as antigas reservas naturais de
      Långsvedjan, Svartågrenen e Svartåvallen.
    before: >-
      É proibido acampar no núcleo histórico do parque, bem como danificar ou recolher plantas, musgos,
      líquenes ou madeira viva ou morta. Fora desse núcleo podes acampar até duas noites no mesmo sítio, longe
      da vista de entradas e trilhos. É permitida a apanha de bagas, cogumelos comestíveis e flores para
      consumo próprio. Fora dos trilhos tem cuidado com turfeiras flutuantes: um tapete vegetal cobre águas
      profundas e pode ceder com o teu peso. Qualquer aterragem de aeronaves carece de autorização da
      administração distrital de Gävleborg.
    around: >-
      Hamra guarda paralelismos ecológicos com zonas protegidas mais afastadas. O [Parque Nacional de
      Gutulia](/lugar/gutulia-national-park/), o [Parque Nacional de Muddus /
      Muttos](/lugar/muddus-national-park/) e o [Parque Nacional Urho
      Kekkonen](/lugar/urho-kekkonen-national-park/) partilham com ele alce, urso, pica-pau-tridáctilo e a
      floresta primária com turfeiras. A [Reserva Estrita de
      Białowieża](/lugar/bialowieski-park-narodowy---rezerwat-scisly/) partilha igualmente a floresta virgem,
      o urso e o pica-pau-tridáctilo.
