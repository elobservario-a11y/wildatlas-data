resumen:
  es: >-
    Núcleo icónico del río Rin renaturalizado donde los castores y el ganado libre modelan el bosque de
    ribera.
  en: >-
    Iconic core of the rewilded Rhine river where beavers and free-roaming herds shape dynamic floodplain
    forests.
  fr: Cœur emblématique du Rhin réensauvagé où castors et troupeaux en liberté façonnent la forêt alluviale.
  de: >-
    Ikonisches Kerngebiet des renaturierten Rheins, in dem Biber und freilebende Herden den dynamischen
    Auenwald gestalten.
  it: >-
    Cuore emblematico del fiume Reno rinaturalizzato dove i castori e il bestiame brado modellano la foresta
    ripariale.
  pt: >-
    Núcleo emblemático do rio Reno renaturalizado onde os castores e o gado em liberdade moldam a floresta
    ripícola.
unico:
  es: Aquí el río volvió a mandar en un paisaje de prados tan planos y verdes que parecían tapetes de billar.
  en: >-
    Here the river regained dominion over a landscape of pastures once so flat and manicured they resembled
    billiard tables.
  fr: >-
    Ici, le fleuve a repris ses droits sur un paysage de prairies jadis si planes et tondues qu’elles
    évoquaient des tapis de billard.
  de: >-
    Hier übernahm der Strom wieder das Kommando über eine Auenlandschaft, die einst so platt und gepflegt war
    wie ein Billardtisch.
  it: >-
    Qui il fiume è tornato a dettar legge su un paesaggio di prati un tempo così piatti e curati da sembrare
    tavoli da biliardo.
  pt: >-
    Aqui o rio voltou a imperar sobre uma paisagem de prados outrora tão planos e tratados que pareciam mesas
    de bilhar.
observaciones:
  es: >-
    El nivel del río manda: con aguas altas algunos pasos se cierran, así que mira cómo está el río antes de
    salir. Solo se entra a pie o en bicicleta, y las botas no sobran.
texto:
  es:
    intro: >-
      Durante unos 1000 años el río no tuvo permiso para moverse. Hoy lo tiene. La Millingerwaard, una llanura
      inundable junto a Kekerdom, en la orilla sur del Waal, es el lugar donde el Rin neerlandés volvió a
      hacer lo que quería: desbordar, excavar canales, levantar dunas y dejar que caballos y vacas decidan qué
      crece y qué no. Staatsbosbeheer la gestiona con una idea sencilla, que la naturaleza siga su curso tanto
      como sea posible, y el resultado son unas 400 hectáreas de pantano, bosque de ribera, praderas de
      hierbas altas, lagunas y dunas fluviales.
    landscape: >-
      Para entender la Millingerwaard hay que subir un poco por el río. La Gelderse Poort, de la que forma
      parte, toma su nombre del punto donde el Rin atraviesa una morrena de empuje de la Edad de Hielo y
      empieza a dividirse: el comienzo del delta del Rin. El agua acabó rompiendo esa barrera y separó
      Montferland del Rijk van Nijmegen; después el viento levantó dunas fluviales, y sobre ellas se asentaron
      pueblos como Millingen aan de Rijn.


      Una de aquellas dunas sigue viva, y es de las pocas que quedan en los Países Bajos. En el meandro
      interior del Waal la arena se mueve, y por eso hay dunas altas en medio de una llanura. Alrededor se
      mezclan el pantano, la vegetación alta de ribera y un bosque de ribera de madera dura que no es nada
      frecuente.


      Lo más llamativo, sin embargo, se ve desde el aire. Entre 2013 y 2022 se excavaron un canal principal,
      un canal de corriente y una serie de canales de rezume más pequeños. Vistos desde arriba dibujan una
      mano con el pulgar y los dedos. Con el río subiendo, la llanura se llena primero por la parte baja y
      almacena agua; con crecidas muy fuertes, la propia llanura pasa a ser parte del cauce y evacua el agua
      deprisa. La obra protege a cuatro millones de personas que viven tras los diques, y a la vez ha dado más
      sitio a aves, peces, insectos y plantas. Hace treinta años aquello eran sobre todo prados verdes y
      rectos, «como tapetes de billar».


      Cuidan el resultado [caballos](/especie/equus_caballus/) konik y [vacas](/especie/bos_taurus/) galloway,
      que pastan en libertad desde 1992 y mantienen la vegetación baja, abierta y variada.
    wildlife: >-
      La Millingerwaard es hábitat del [castor](/especie/castor_fiber/). La hora es el crepúsculo, cuando hay
      más probabilidades de cruzarse con uno, y la estación, el otoño y el invierno, cuando se encuentran sus
      huellas en las orillas. El álamo negro, casi extinguido en los Países Bajos, ha vuelto a la Gelderse
      Poort; sus semillas solo germinan tras una inundación, así que depende justo de lo que la obra ha
      devuelto.


      El año tiene su ritmo. En verano se pasea por dunas fluviales llenas de flores. En otoño llegan las
      espátulas y las garcetas grandes. En invierno el dique del Waal funciona como una grada para ver decenas
      de miles de gansos invernantes. En la Gelderse Poort se han visto también la [cigüeña
      negra](/especie/ciconia_nigra/), el [pigargo europeo](/especie/haliaeetus_albicilla/) y el [águila
      pescadora](/especie/pandion_haliaetus/), y la zona se ha convertido en el lugar de cría más importante
      de los Países Bajos para el fumarel. En los Rijnstrangen crían aves de carrizal raras, como el
      [avetoro](/especie/botaurus_stellaris/) y el carricero tordal.


      Para los anfibios se han soltado ranas de San Antonio y sapos de ajos; entre los insectos y los
      murciélagos, se han hecho observaciones de la mariposa kleine weerschijnvlinder y del murciélago
      bosvleermuis. Y el río más natural da una oportunidad a peces como el salmón, el siluro y, quizá, el
      esturión atlántico.
    visit: >-
      La reserva solo se recorre a pie o en bicicleta, y el modo de andarla es parte de la gracia: en la
      Gelderse Poort se puede caminar casi por cualquier parte, fuera de los senderos marcados. La ruta de
      escucha «Het verhaal van de Millingerwaard» tampoco tiene recorrido fijo: la haces buscando los postes
      con código QR, que activan catorce fragmentos de audio con las historias de plantas, animales y otros
      habitantes de la reserva.


      Un canal lateral atraviesa el terreno y, según el nivel del río, se cruza por una o varias presas. Con
      el río alto se inundan senderos como «de drempel» y el dique de paseo, y el paso solo es posible con el
      nivel de Lobith por debajo de 9 m sobre el nivel de referencia. Lleva botas.
    history: >-
      La obra de 2013 a 2022 devolvió a la Millingerwaard la dinámica que había perdido. Hoy el cauce tiene
      espacio para el agua y la seguridad de quienes viven tras los diques ha subido a la vez que la
      biodiversidad.


      La Gelderse Poort forma parte del corredor ecológico que debe unir la Veluwe con el interior alemán y
      sacar al ciervo de la Veluwe de su aislamiento. La Millingerwaard, además, es parte de la zona Natura
      2000.
    before: >-
      El nivel del río manda: con aguas altas algunos pasos se cierran, así que mira cómo está el río antes de
      salir. Solo se entra a pie o en bicicleta, y las botas no sobran.
    around: >-
      La Millingerwaard es parte de la [Puerta de Güeldres](/lugar/gelderse-poort/), el mosaico de reservas
      fluviales del Rin y el Waal. A unos veintiocho kilómetros está la [Reserva Natural De
      Maashorst](/lugar/de-maashorst/).
  en:
    intro: >-
      For roughly 1000 years the river was forbidden from shifting its course. Today it is free once more. The
      Millingerwaard, a dynamic floodplain beside Kekerdom on the southern bank of the Waal, is the birthplace
      of the rewilded Dutch Rhine, where waters were allowed to do as they pleased: flood, carve secondary
      side channels, cast up inland dunes, and let horses and cattle decide what flourishes and what yields.
      Staatsbosbeheer stewards the land under a straightforward ethos—allowing natural processes as much free
      rein as possible—yielding some 400 hectares of marsh, softwood and hardwood riparian forest, tall-herb
      fen meadows, backwaters, and river dunes.
    landscape: >-
      To grasp the essence of the Millingerwaard, one must look slightly upstream. The Gelderse Poort, of
      which it forms an integral part, derives its name from the breakthrough where the Rhine cuts through an
      Ice Age push moraine and begins to divide: the head of the Rhine delta. The river eventually breached
      that ridge, separating Montferland from the Rijk van Nijmegen; subsequently winds threw up river dunes
      upon which historic villages like Millingen aan de Rijn took root.


      One of those dunes remains active—a rare survival in the modern Netherlands. In the inner bend of the
      Waal sand moves freely, creating towering dunes in the midst of a flat floodplain. Around them coalesce
      reedswamps, tall riparian fringe vegetation, and a hardwood alluvial woodland of a type seldom
      encountered in north-western Europe.


      The most dramatic transformations are revealed from above. Between 2013 and 2022, engineers and
      ecologists excavated a major side channel, a running flow channel, and a network of seepage channels.
      Seen from the air, they trace the outline of an open hand with thumb and outstretched fingers. As the
      river rises, the floodplain fills gradually from downstream, buffering high water; during extreme winter
      surges, the floodplain acts as a secondary bypass channel, flushing floodwaters rapidly to sea. This
      initiative protects four million residents living behind the river dykes while returning immense space
      to birds, fish, insects, and flora. Thirty years ago this was an expanse of engineered, uniform
      rye-grass pastures, "smooth as billiard cloth".


      Maintaining the mosaic are free-roaming Konik [horses](/especie/equus_caballus/) and Galloway
      [cattle](/especie/bos_taurus/), which have grazed year-round without supplemental feeding since 1992,
      keeping the vegetation low, open, and diverse.
    wildlife: >-
      The Millingerwaard is premier habitat for the [Eurasian beaver](/especie/castor_fiber/). Dusk is the
      ideal time to cross paths with one, while autumn and winter reveal their freshly gnawed willows and
      footprints along the banks. The black poplar, nearly extinct in the wild across the Netherlands, has
      returned to the Gelderse Poort; its seeds only germinate on freshly deposited flood silt, depending
      entirely on the seasonal floods restored here.


      The ecological calendar brings continuous seasonal rhythms. In summer walkers ramble over
      flower-carpeted river dunes. In autumn Eurasian spoonbills and great egrets congregate across mudflats.
      In winter the crest of the Waal dyke acts as an amphitheatre to observe tens of thousands of
      overwintering geese. The wider Gelderse Poort has also welcomed the [black
      stork](/especie/ciconia_nigra/), [white-tailed eagle](/especie/haliaeetus_albicilla/), and
      [osprey](/especie/pandion_haliaetus/), while establishing itself as the foremost breeding stronghold in
      the Netherlands for the black tern. In the neighbouring Rijnstrangen reedbeds nest elusive marshland
      specialists including the [Eurasian bittern](/especie/botaurus_stellaris/) and great reed warbler.


      European tree frogs and common spadefoot toads have been reintroduced; among insects and bats, records
      include the lesser purple emperor butterfly and the woodland noctule bat. A more natural riverbed also
      restores hope for migratory fishes such as Atlantic salmon, wels catfish, and perhaps eventually
      Atlantic sturgeon.
    visit: >-
      The reserve is strictly accessible on foot or by bicycle, and the wandering philosophy is half the joy:
      within the Gelderse Poort you may roam freely almost everywhere, venturing off marked tracks. The audio
      walk "Het verhaal van de Millingerwaard" likewise lacks a rigid circuit: you navigate by seeking QR-code
      posts that trigger fourteen audio episodes recounting the tales of plants, beasts, and former human
      dwellers of the floodplain.


      A secondary side channel threads through the reserve, crossed via one or several low-water causeways
      depending on river stages. During high river discharges, trails like "de drempel" and the riverside dyke
      submerge, and crossing is only possible when water gauges at Lobith read below 9 m above the ordnance
      datum. Sturdy boots are essential.
    history: >-
      The extensive engineering works from 2013 to 2022 restored the long-lost river dynamics to the
      Millingerwaard. Today the river channel has room to expand, dramatically increasing flood safety for
      communities behind the dykes while revitalising biodiversity.


      The Gelderse Poort serves as a vital ecological corridor intended to reconnect the Veluwe heathlands
      with the German hinterland, releasing the Veluwe red deer population from genetic isolation. The
      Millingerwaard is fully incorporated into the European Natura 2000 network.
    before: >-
      The river’s pulse dictates access: high water temporarily submerges trails and causeways, so verify
      river gauge readings before setting out. Access is strictly on foot or by bicycle, and waterproof boots
      are never amiss.
    around: >-
      The Millingerwaard forms part of the [Gelderse Poort](/lugar/gelderse-poort/), an extensive mosaic of
      riverine nature reserves along the Rhine and Waal. Roughly twenty-eight kilometres away lies [De
      Maashorst Nature Reserve](/lugar/de-maashorst/).
  fr:
    intro: >-
      Pendant environ 1000 ans, le fleuve n’eut pas le droit de dévier de son lit. Aujourd’hui, il est libre
      d’agir. La Millingerwaard, plaine alluviale inondable bordant Kekerdom sur la rive sud du Waal, est le
      berceau du réensauvagement du Rhin néerlandais, où les eaux ont retrouvé leur pleine liberté : déborder,
      creuser des bras secondaires, édifier des dunes et laisser chevaux et vaches décider de ce qui pousse ou
      recule. Staatsbosbeheer gère le site selon un principe limpide—laisser la nature suivre son cours autant
      que possible—, donnant naissance à quelque 400 hectares de marais, forêts alluviales tendres et dures,
      prairies de hautes herbes, mares et dunes fluviales.
    landscape: >-
      Pour comprendre la Millingerwaard, il faut remonter un peu le fleuve. La Gelderse Poort, dont elle fait
      partie intégrante, tire son nom de la percée par laquelle le Rhin franchit une moraine de poussée de
      l’ère glaciaire et commence à se ramifier : la porte d’entrée du delta rhénan. Les eaux finirent par
      rompre ce verrou, séparant le Montferland du Rijk van Nijmegen ; plus tard, les vents accumulèrent des
      dunes fluviales sur lesquelles s’implantèrent des villages comme Millingen aan de Rijn.


      L’une de ces dunes demeure active—une rareté vivante aux Pays-Bas. Dans la courbe intérieure du Waal,
      les sables se déplacent continuellement, élevant de hautes dunes au beau milieu de la plaine alluviale.
      Tout autour s’entremêlent roselières, végétation riveraine luxuriante et une forêt alluviale de bois dur
      devenue exceptionnelle.


      La métamorphose la plus saisissante s’apprécie toutefois depuis les airs. Entre 2013 et 2022, un bras
      secondaire majeur, un chenal d’écoulement et un réseau de chenaux de suintement ont été creusés. Vus du
      ciel, ils dessinent une main ouverte avec son pouce et ses doigts déployés. Quand le fleuve monte, la
      plaine se remplit par l’aval et stocke les crues ; lors des crues majeures, la plaine devient un chenal
      de décharge évacuant rapidement les masses d’eau. Ce vaste chantier protège quatre millions de riverains
      installés derrière les digues tout en restituant un espace considérable aux oiseaux, poissons, insectes
      et plantes. Il y a trente ans, ces terres n’étaient que des prés rectilignes, « tondus comme des tapis
      de billard ».


      Ce sanctuaire est entretenu par des [chevaux](/especie/equus_caballus/) koniks et des
      [vaches](/especie/bos_taurus/) galloways qui pâturent en liberté depuis 1992, maintenant un milieu
      ouvert, bas et d’une grande diversité botanique.
    wildlife: >-
      La Millingerwaard constitue l’habitat de prédilection du [castor d'Europe](/especie/castor_fiber/).
      L’heure idéale est le crépuscule, propice aux rencontres fortuites, et la saison, l’automne et l’hiver,
      quand ses traces et écorçages abondent sur les berges. Le peuplier noir, quasiment éteint aux Pays-Bas,
      a reconquis la Gelderse Poort ; ses graines ne germent que sur les sédiments alluviaux récents,
      tributaires directs des crues restaurées.


      L’année s’écoule au rythme des saisons. En été, on chemine sur des dunes fluviales fleuries. En automne
      arrivent spatules blanches et grandes aigrettes. En hiver, la digue du Waal fait office de gradin
      naturel pour contempler des dizaines de milliers d’oies hivernantes. Dans la Gelderse Poort ont aussi
      été observés la [cigogne noire](/especie/ciconia_nigra/), le [pygargue à queue
      blanche](/especie/haliaeetus_albicilla/) et le [balbuzard pêcheur](/especie/pandion_haliaetus/), le
      secteur devenant le principal site de reproduction des Pays-Bas pour la guifette noire. Dans les
      Rijnstrangen voisins nichent des oiseaux paludicoles rares comme le [butor
      étoilé](/especie/botaurus_stellaris/) et la rousserolle turdoïde.


      Côté amphibiens, la rainette verte et le pélobate brun ont été réintroduits ; parmi les insectes et
      chauves-souris figurent le petit mars changeant et la noctule commune. Le retour d’un fleuve naturel
      redonne espoir pour des poissons migrateurs tels que le saumon, le silure et, peut-être, l’esturgeon
      européen.
    visit: >-
      La réserve se découvre exclusivement à pied ou à vélo, et la philosophie de visite fait tout son charme
      : dans la Gelderse Poort, il est permis de cheminer librement partout, en dehors de tout balisage. Le
      parcours sonore « Het verhaal van de Millingerwaard » ne suit aucun tracé rigide : on chemine en quête
      de poteaux munis de QR codes, qui déclenchent quatorze récits sonores consacrés aux plantes, aux bêtes
      et à l’histoire des lieux.


      Un bras secondaire traverse le domaine et se franchit par un ou plusieurs gués aménagés selon le niveau
      des eaux. En période de crue, des sentiers comme « de drempel » et la digue piétonne sont inondés, et le
      passage n’est possible que lorsque le niveau d’eau à Lobith se situe sous 9 m au-dessus du niveau de
      référence. Prévoyez de bonnes bottes.
    history: >-
      Le réaménagement conduit de 2013 à 2022 a rendu à la Millingerwaard la dynamique fluviale qu’elle avait
      égarée. Aujourd’hui, le lit majeur redonne de l’espace au fleuve, consolidant la sécurité des riverains
      protégés par les digues tout en dynamisant la biodiversité.


      La Gelderse Poort s’intègre dans le corridor écologique destiné à relier la Veluwe à l’arrière-pays
      rhénan allemand et à briser l’isolement génétique des cerfs de la Veluwe. La Millingerwaard fait
      également partie intégrante du réseau européen Natura 2000.
    before: >-
      Le régime des eaux dicte les règles : lors des hautes eaux, certains passages sont submergés, vérifiez
      le niveau du fleuve avant de vous engager. L’accès est exclusivement piéton ou cycliste, et le port de
      bottes imperméables est indispensable.
    around: >-
      La Millingerwaard fait partie de la [Porte de Gueldre](/lugar/gelderse-poort/), vaste ensemble de
      réserves alluviales le long du Rhin et du Waal. À environ vingt-huit kilomètres s’étend la [Réserve
      naturelle De Maashorst](/lugar/de-maashorst/).
  de:
    intro: >-
      Rund 1000 Jahre lang durfte der Fluss seinen Lauf nicht verändern. Heute darf er es wieder. Die
      Millingerwaard, eine dynamische Flussaue bei Kekerdom am Südufer der Waal, ist der Ursprungsort der
      Renaturierung des niederländischen Rheins: Hier darf das Wasser über die Ufer treten, Nebenrinnen
      auswaschen, Binnendünen aufwehen und Pferde und Rinder entscheiden lassen, was wächst und was weicht.
      Staatsbosbeheer verwaltet das Areal nach einem einfachen Leitsatz—der Natur so viel freien Lauf zu
      lassen wie möglich—, woraus rund 400 Hektar Sumpf, Weich- und Hartholz-Auenwälder, Hochstaudenfluren,
      Altwasser und Flussdünen entstanden sind.
    landscape: >-
      Um die Millingerwaard zu verstehen, muss man ein Stück stromaufwärts blicken. Die Gelderse Poort, zu der
      sie gehört, verdankt ihren Namen dem Durchbruch, an dem der Rhein eine eiszeitliche Stauchendmoräne
      durchschneidet und sich zu verzweigen beginnt: der Beginn des Rheindeltas. Das Wasser durchbrach
      schließlich diesen Wall und trennte das Montferland vom Rijk van Nijmegen; später wehte der Wind
      Flussdünen auf, auf denen Dörfer wie Millingen aan de Rijn gegründet wurden.


      Eine jener Dünen ist bis heute aktiv—ein seltenes Relikt in den Niederlanden. In der Innenschleife der
      Waal verlagert sich der Sand kontinuierlich und bildet hohe Dünenkämme mitten in der Ebene. Ringsum
      verzahnen sich Röhrichte, dichte Uferstauden und ein seltener Hartholz-Auenwald.


      Das Beeindruckendste zeigt sich jedoch aus der Luft. Zwischen 2013 und 2022 wurden eine Hauptnebenrinne,
      ein Strömungskanal und kleinere Sickerwassergerinne ausgehoben. Aus der Vogelperspektive wirken sie wie
      eine offene Hand mit Daumen und Fingern. Steigt der Rheinpegel, füllt sich die Aue zuerst vom Unterlauf
      her und fängt die Fluten auf; bei extremen Hochwassern wird die Aue selbst zum Abflussbett und leitet
      das Wasser rasch ab. Dieses Bauwerk schützt vier Millionen Menschen hinter den Deichen und schenkte
      Vögeln, Fischen, Insekten und Pflanzen enormen Raum zurück. Vor dreißig Jahren dominierten hier monotone
      Grünlandflächen, „eben wie Billardtische“.


      Für den Erhalt der offenen Landschaft sorgen freilebende Konik-[Pferde](/especie/equus_caballus/) und
      Galloway-[Rinder](/especie/bos_taurus/), die seit 1992 ganzjährig grasen und die Vegetation niedrig,
      licht und artenreich halten.
    wildlife: >-
      Die Millingerwaard ist ein herausragender Lebensraum für den [Europäischen
      Biber](/especie/castor_fiber/). Die beste Zeit für Beobachtungen ist die Dämmerung, während Herbst und
      Winter die frischen Nagespuren und Fährten an den Ufern freigeben. Die Schwarz-Pappel, in den
      Niederlanden beinahe ausgestorben, ist in die Gelderse Poort zurückgekehrt; ihre Samen keimen
      ausschließlich auf frischem Hochwasserschlick und sind auf die zurückgewonnene Flussdynamik angewiesen.


      Jede Jahreszeit hat ihren eigenen Zauber. Im Sommer durchstreift man blühende Flussdünen. Im Herbst
      treffen Löffler und Silberreiher auf den Schlammbänken ein. Im Winter dient der Waaldeich als Tribüne,
      um zehntausende überwinternde Gänse zu beobachten. In der Gelderse Poort wurden auch der
      [Schwarzstorch](/especie/ciconia_nigra/), der [Seeadler](/especie/haliaeetus_albicilla/) und der
      [Fischadler](/especie/pandion_haliaetus/) gesichtet, während sich das Gebiet zum wichtigsten Brutplatz
      der Niederlande für die Trauerseeschwalbe entwickelt hat. In den benachbarten Rijnstrangen brüten
      seltene Schilfbewohner wie die [Rohrdommel](/especie/botaurus_stellaris/) und der Drosselrohrsänger.


      Unter den Amphibien wurden Europäischer Laubfrosch und Knoblauchkröte wiederangesiedelt; bei Insekten
      und Fledermäusen gelangen Nachweise des Kleinen Schillerfalters und des Großen Abendseglers. Das
      naturnähere Flussbett eröffnet zudem Wanderfischen wie Lachs, Wels und womöglich dem Europäischen Stör
      neue Zukunftschancen.
    visit: >-
      Das Schutzgebiet lässt sich ausschließlich zu Fuß oder mit dem Fahrrad erkunden, und das freie Streifen
      macht den besonderen Reiz aus: In der Gelderse Poort darf man sich fast überall abseits der Wege frei
      bewegen. Auch die Hörroute „Het verhaal van de Millingerwaard“ folgt keinem festen Verlauf: Man
      orientiert sich an Holzpfählen mit QR-Codes, die vierzehn Audiobeiträge über Pflanzen, Tiere und
      historische Bewohner der Aue abspielen.


      Ein Nebenarm durchzieht das Gelände und wird je nach Wasserstand über eine oder mehrere Überquerungen
      passiert. Bei Hochwasser stehen Wege wie „de drempel“ und der Uferdeich unter Wasser; eine Passage ist
      nur möglich, wenn der Pegel Lobith unter 9 m über Normalnull liegt. Gummistiefel sind ratsam.
    history: >-
      Die Renaturierung von 2013 bis 2022 gab der Millingerwaard ihre verlorene Flussdynamik zurück. Heute
      verfügt der Rhein über Raum für Hochwasser, wodurch der Schutz der Deichhinterlieger wuchs und die
      Artenvielfalt auflebte.


      Die Gelderse Poort bildet einen zentralen Baustein des Biotopverbunds, der die Veluwe mit dem deutschen
      Hinterland vernetzen und die Rothirsche der Veluwe aus ihrer Isolation befreien soll. Die Millingerwaard
      ist zudem fest im europäischen Natura-2000-Netzwerk verankert.
    before: >-
      Der Wasserstand bestimmt die Zugänglichkeit: Bei Hochwasser sind Wege und Wehre überflutet, prüfe daher
      den Pegelstand vor dem Aufbruch. Das Gebiet ist nur zu Fuß oder per Rad zugänglich, und festes,
      wasserdichtes Schuhwerk ist unerlässlich.
    around: >-
      Die Millingerwaard ist Teil der [Gelderse Poort](/lugar/gelderse-poort/), dem Mosaik naturnaher
      Flussreservate an Rhein und Waal. Rund achtundzwanzig Kilometer entfernt liegt das [Naturschutzgebiet De
      Maashorst](/lugar/de-maashorst/).
  it:
    intro: >-
      Per circa 1000 anni al fiume fu impedito di muoversi. Oggi ha di nuovo piena libertà. La Millingerwaard,
      una piana golenale presso Kekerdom sulla sponda meridionale del Waal, è il luogo in cui il Reno olandese
      è tornato a fare ciò che voleva: allagare, scavare canali secondari, sollevare dune e lasciare che
      cavalli e mucche decidano cosa deve crescere e cosa scomparire. Staatsbosbeheer la gestisce secondo un
      principio limpido—lasciare che i processi naturali seguano il loro corso per quanto possibile—, dando
      vita a circa 400 ettari di paludi, boschi ripariali di legno tenero e duro, praterie ad alte erbe,
      lanche e dune fluviali.
    landscape: >-
      Per comprendere la Millingerwaard occorre risalire leggermente il fiume. La Gelderse Poort, di cui fa
      parte, prende il nome dal varco in cui il Reno attraversa una morena di spinta dell’era glaciale e
      inizia a ramificarsi: l’apice del delta del Reno. Le acque finirono per farsi breccia attraverso
      quell’argine naturale separando il Montferland dal Rijk van Nijmegen; in seguito i venti modellarono
      dune fluviali su cui sorsero villaggi come Millingen aan de Rijn.


      Una di quelle dune fluviali è tuttora attiva—una rarità nei Paesi Bassi moderni. Nel meandro interno del
      Waal la sabbia si muove liberamente, innalzando dune imponenti nel cuore della piana. Attorno si fondono
      canneti, vegetazione ripariale lussureggiante e un raro bosco alluvionale di latifoglie di legno duro.


      La trasformazione più spettacolare si coglie tuttavia dall’alto. Tra il 2013 e il 2022 sono stati
      scavati un canale laterale principale, un canale a corrente viva e rami minori di risorgiva. Visti dal
      cielo compongono la sagoma di una mano con pollice e dita distese. Quando il fiume cresce, la golena si
      allaga gradualmente dal basso immagazzinando l’onda di piena; durante le piene eccezionali, la golena
      diventa essa stessa parte dell’alveo defluendo rapidamente l’acqua. L’opera protegge quattro milioni di
      persone residenti dietro gli argini restituendo al contempo immenso spazio a uccelli, pesci, insetti e
      piante. Trent’anni fa queste terre erano pascoli uniformi, «lisci come tappeti da biliardo».


      A prendersi cura dell’ambiente sono i [cavalli](/especie/equus_caballus/) konik e i
      [bovini](/especie/bos_taurus/) galloway, che pascolano allo stato brado dal 1992 mantenendo la
      vegetazione aperta, bassa e diversificata.
    wildlife: >-
      La Millingerwaard è l’habitat d’elezione del [castoro europeo](/especie/castor_fiber/). L’ora più
      propizia è il crepuscolo, quando aumentano le probabilità di avvistarne uno, mentre l’autunno e
      l’inverno consentono di scorgerne impronte e rami scortecciati lungo le rive. Il pioppo nero, quasi
      scomparso nei Paesi Bassi, è tornato nella Gelderse Poort; i suoi semi germogliano solo sui depositi
      alluvionali freschi, dipendendo proprio dalle piene ripristinate dal progetto.


      L’anno segue il proprio ciclo vitale. In estate si cammina su dune fluviali ammantate di fiori. In
      autunno fanno la loro comparsa spatole ed aironi bianchi maggiori. In inverno l’argine del Waal diventa
      una tribuna naturale per osservare decine di migliaia di oche svernanti. Nella Gelderse Poort sono stati
      segnalati anche la [cicogna nera](/especie/ciconia_nigra/), l’[aquila di
      mare](/especie/haliaeetus_albicilla/) e il [falco pescatore](/especie/pandion_haliaetus/), mentre la
      zona è divenuta il principale sito di nidificazione dei Paesi Bassi per il mignattino comune. Nei vicini
      canneti dei Rijnstrangen nidificano rari uccelli di palude come il
      [tarabuso](/especie/botaurus_stellaris/) e il cannareccione.


      Per gli anfibi sono state reintrodotte raganelle e pelobati bruni; tra gli insetti e i pipistrelli si
      contano osservazioni dell’iride minore e della nottola comune. Il corso fluviale rinaturalizzato offre
      nuove opportunità anche a pesci migratori come salmone, siluro e, forse in prospettiva, lo storione
      comune.
    visit: >-
      La riserva si visita esclusivamente a piedi o in bicicletta, e la modalità di fruizione fa parte
      dell’esperienza: nella Gelderse Poort è consentito muoversi quasi ovunque, allontanandosi liberamente
      dai sentieri battuti. Anche il percorso sonoro «Het verhaal van de Millingerwaard» non ha un tracciato
      prefissato: lo si segue individuando i cippi con codice QR, che riproducono quattordici tracce audio
      dedicate a piante, animali e antichi abitanti della golena.


      Un canale secondario attraversa l’area e si supera, a seconda del livello idrometrico, mediante uno o
      più guadi. Con livelli elevati del fiume, passaggi come «de drempel» e l’argine pedonale vengono
      sommersi, e il transito è praticabile solo quando il livello all’idrometro di Lobith scende sotto i 9 m
      rispetto allo zero idrometrico. Munisciti di stivali impermeabili.
    history: >-
      I grandi interventi condotti tra il 2013 e il 2022 hanno restituito alla Millingerwaard la dinamica
      fluviale perduta. Oggi l’alveo dispone di spazio adeguato per accogliere le piene, incrementando la
      sicurezza idraulica per le comunità protette dagli argini e rilanciando la biodiversità.


      La Gelderse Poort costituisce il corridoio ecologico destinato a collegare la Veluwe con l’entroterra
      tedesco, sottraendo i cervi della Veluwe al loro isolamento riproduttivo. La Millingerwaard è inoltre
      pienamente integrata nella rete Natura 2000.
    before: >-
      Il livello del fiume comanda ogni movimento: con acque alte alcuni varchi e sentieri restano chiusi,
      quindi controlla sempre i bollettini idrologici prima di uscire. L’accesso è consentito solo a piedi o
      in bicicletta, e gli stivali di gomma sono sempre raccomandati.
    around: >-
      La Millingerwaard è parte integrante della [Porta di Gheldria](/lugar/gelderse-poort/), il ricco mosaico
      di riserve fluviali del Reno e del Waal. A circa ventotto chilometri sorge la [Riserva Naturale De
      Maashorst](/lugar/de-maashorst/).
  pt:
    intro: >-
      Durante cerca de 1000 anos, o rio não teve autorização para mudar de curso. Hoje tem-na. A
      Millingerwaard, uma planície aluvial inundável junto a Kekerdom, na margem sul do Waal, é o local onde o
      Reno neerlandês voltou a fazer o que desejava: transbordar, abrir canais secundários, erguer dunas e
      deixar que cavalos e vacas determinem o que cresce e o que recua. A Staatsbosbeheer gere a área com uma
      premissa simples—permitir que a natureza siga o seu rumo tanto quanto possível—, resultando em cerca de
      400 hectares de sapal, bosque ripícola de madeira mole e dura, prados de ervas altas, lagoas e dunas
      fluviais.
    landscape: >-
      Para compreender a Millingerwaard é preciso subir um pouco o curso do rio. A Gelderse Poort, da qual faz
      parte integrante, deve o seu nome ao ponto onde o Reno rasga uma moreia de impulsão da Idade do Gelo e
      começa a ramificar-se: a entrada do delta do Reno. A força da água acabou por romper essa barreira
      natural separando Montferland do Rijk van Nijmegen; mais tarde, o vento ergueu dunas fluviais sobre as
      quais se fixaram povoações como Millingen aan de Rijn.


      Uma dessas dunas permanece ativa—um testemunho raro nos Países Baixos atuais. Na curva interior do
      meandro do Waal a areia desloca-se sem cessar, criando dunas imponentes no meio da planície. Em redor
      fundem-se caniçais, vegetação ribeirinha luxuriante e uma floresta ripícola de folhosas nobres
      invulgarmente bem conservada.


      A intervenção mais impressionante revela-se, contudo, a partir do ar. Entre 2013 e 2022 escavou-se um
      canal secundário principal, um canal de fluxo corrente e uma rede de canais de infiltração menores.
      Vistos de cima, desenham uma mão aberta com o polegar e os dedos estendidos. Quando o rio sobe, a
      planície alaga-se a partir de jusante e retém a água da cheia; em cheias excecionais, a planície atua
      como canal de vazamento acelerando o escoamento. Esta intervenção protege quatro milhões de cidadãos que
      residem atrás dos diques, ao mesmo tempo que devolveu imenso espaço a aves, peixes, insetos e plantas.
      Há trinta anos, aquela paisagem resumia-se a pastagens artificiais, «lisas como panos de bilhar».


      A dinâmica é mantida por [cavalos](/especie/equus_caballus/) konik e [vacas](/especie/bos_taurus/)
      galloway, que pastam em regime de liberdade desde 1992, mantendo a vegetação rasteira, aberta e
      diversificada.
    wildlife: >-
      A Millingerwaard constitui habitat privilegiado do [castor-europeu](/especie/castor_fiber/). A melhor
      altura para o avistar é o crepúsculo, sendo o outono e o inverno as épocas ideais para encontrar troncos
      roídos e pegadas nas margens. O choupo-negro, praticamente extinto nos Países Baixos em meio natural,
      regressou à Gelderse Poort; as suas sementes apenas germinam em sedimentos aluviais frescos, dependendo
      estritamente do regime de cheias restabelecido.


      O ano obedece a um ritmo dinâmico. No verão percorrem-se dunas fluviais repletas de flores. No outono
      concentram-se colhereiros e garças-brancas-grandes. No inverno, o dique do Waal serve de miradouro para
      contemplar dezenas de milhares de gansos invernantes. Na Gelderse Poort foram igualmente observadas a
      [cegonha-preta](/especie/ciconia_nigra/), a [águia-rabalva](/especie/haliaeetus_albicilla/) e a [águia
      pescadora](/especie/pandion_haliaetus/), tornando-se o principal local de nidificação da gaivina-preta
      nos Países Baixos. Nos caniçais contíguos de Rijnstrangen nidificam aves aquáticas esquivas como o
      [abetouro-comum](/especie/botaurus_stellaris/) e o rouxinol-grande-dos-caniços.


      Entre os anfíbios reintroduziram-se rela-verde e sapo-de-unha-negra; nos insetos e quirópteros contam-se
      registos do borboleta-pequeno-pavão e do morcego-arborícola. A renaturalização do leito fluvial reabre
      perspetivas para peixes migradores como o salmão, o peixe-gato-europeu e, futuramente, o
      esturjão-atlântico.
    visit: >-
      A reserva apenas se visita a pé ou de bicicleta, e o modo livre de a explorar faz parte do encanto: na
      Gelderse Poort é permitido circular livremente por quase toda a área, fora de trilhos traçados. O
      percurso de áudio «Het verhaal van de Millingerwaard» tão-pouco tem traçado rígido: segue-se localizando
      marcos com código QR que ativam catorze episódios sonoros com narrativas sobre flora, fauna e habitantes
      históricos da várzea.


      Um canal lateral atravessa o terreno e transpõe-se por um ou vários açudes consoante o nível do rio. Com
      caudais elevados, caminhos como «de drempel» e o dique pedonal ficam submersos, sendo a passagem viável
      apenas com o nível hidrométrico de Lobith abaixo de 9 m acima do plano de referência. Leva botas
      impermeáveis.
    history: >-
      A empreitada de 2013 a 2022 devolveu à Millingerwaard a dinâmica hidrológica que havia perdido. Hoje o
      leito dispõe de espaço de expansão para as cheias, elevando a segurança das povoações ribeirinhas e
      revitalizando a biodiversidade.


      A Gelderse Poort integra o corredor ecológico concebido para ligar a Veluwe ao interior alemão e
      resgatar as populações de veados da Veluwe do seu isolamento genético. A Millingerwaard faz parte
      integrante da rede Natura 2000.
    before: >-
      O caudal do rio dita as regras: em marés de cheia algumas passagens fecham-se, pelo que convém verificar
      o nível das águas antes da partida. Apenas se entra a pé ou de bicicleta, e as galochas são sempre
      recomendadas.
    around: >-
      A Millingerwaard integra a [Porta da Gueldres](/lugar/gelderse-poort/), o vasto mosaico de reservas
      aluviais do Reno e do Waal. A cerca de vinte e oito quilómetros situa-se a [Reserva Natural De
      Maashorst](/lugar/de-maashorst/).
