    Camina solo por senderos señalizados y deja el coche en los aparcamientos habilitados al pie de las
    montañas.
texto:
  es:
    intro: >-
      Aquí se tocan dos continentes, o al menos dos placas. La falla periadriática, la zona de falla más
      importante de todo el arco alpino, pasa por las Karavanke, y la presión entre las placas europea y
      africana sigue levantando esta cordillera desde el Eoceno. Las rocas más antiguas tienen unos 500
      millones de años, y los senderos cruzan una y otra vez la frontera entre Austria y Eslovenia. El
      Geoparque de Karavanke (Karawanken en alemán) reúne cinco municipios eslovenos y nueve austríacos para
      contar esa historia con minas, cuevas, fósiles y senderos.
    landscape: >-
      La cordillera se extiende unos 120 km, desde Trbiž (Tarvisio) hasta Slovenj Gradec, y el Stol (Hochstuhl
      / Veliki Stol) es su cima más alta. En las Karavanke del norte, el Hochobir, de 2139 metros, es la
      montaña más alta del este, y la caliza de Wetterstein, del Triásico medio, forma los grandes
      acantilados.


      La geología cambia de un valle a otro. La cadena de Smrekovec es de roca volcánica del Oligoceno; en el
      punto de información de ese lugar cuentan, con exposición y cortometraje, que hace 23 millones de años
      estalló un volcán bajo el mar. El monte Peca contiene una mineralización de plomo y zinc de categoría
      mundial. La garganta de Helenska es uno de los tres yacimientos más ricos de crinoideos del Carniense de
      Europa. Y la dravita y la wulfenita tienen aquí su localidad tipo.


      Hay también agua que esculpe: los arcos rocosos de Uschowa son un testimonio de la fuerza del agua a lo
      largo de millones de años, y el sendero a la montaña Olševa cruza varias ventanas y puentes naturales de
      roca. En el perfil de sedimentos protegido de la mina de Topla, a 1145 metros, se lee la historia
      geológica, y las cuevas de estalactitas del Obir, a 1078 metros, se descubrieron en 1870 cuando los
      mineros buscaban plomo y zinc. Dentro, la temperatura es constante: ocho grados, con estalactitas vivas,
      una rareza en Europa.
    wildlife: >-
      Entre Koschuta y Hochobir hay una biodiversidad extraordinaria, en el borde oriental de los Alpes.
      Paredes de roca, canchales, prados de montaña y turberas dispersas sirven de refugio a especies raras:
      la campanilla de Zois, la orquídea de Kamnik, la primavera de Wulfen, que comparte nombre con el mineral
      wulfenita.


      Para las aves, las Karavanke orientales son un área de enorme importancia. Es zona de cortejo del
      [urogallo](/especie/tetrao_urogallus/), el [gallo lira](/especie/tetrao_tetrix/), la [perdiz
      nival](/especie/lagopus_muta/) y el grévol; anidan el [mochuelo chico](/especie/glaucidium_passerinum/)
      y el mochuelo boreal; y se ven el [pito negro](/especie/dryocopus_martius/), el [pico
      tridáctilo](/especie/picoides_tridactylus/), el [águila real](/especie/aquila_chrysaetos/) y el [halcón
      peregrino](/especie/falco_peregrinus/). Las turberas, entre los hábitats más amenazados y que más rápido
      desaparecen de Europa, guardan mariposas raras como la doncella de los pantanos y la fritilaria escasa.
    visit: >-
      El Karawanken Trail cruza la cordillera en trece etapas a lo largo de 265 km. La primera va de
      Zell-Pfarre a Hochobir y Eisenkapplerhütte: 21,2 km en unas nueve horas. La tercera, de Riepl a Dom na
      Peci por Kordeschkopf, mide 11,7 km y lleva unas cinco horas. La cuarta, por Topla hasta Koča v Grohotu,
      es la más larga: 27,3 km, unas diez horas. La última, de Freibacher Stausee a Zell Pfarre, mide 15,7 km
      en unas cinco horas. En total, el geoparque ofrece más de 1.200 km de senderos señalizados.


      Para entender el lugar hay varios puntos de información. El Geo.Dom, el centro de visitantes en la
      montaña Petzen, propone un juego interactivo de naturaleza y una exposición sobre el bosque petrificado
      de Lesbos. En Zell, el punto de información es el inicio de las excursiones al valle alto de Zell y
      presenta la geología de Koschuta. En Ravne na Koroškem, el Centro del Agua explica con exhibiciones
      interactivas el papel del agua subterránea. Y en el castillo de Bukovje hay exposiciones sobre el río
      Drava y el mineral dravita.


      Si prefieres un paseo corto, el sendero educativo del castor rodea el lago de Dravograd y tiene siete
      paradas con las plantas y los animales del lago.
    history: >-
      En las cuevas kársticas aparecen útiles de la Edad de Piedra, importantes para entender el desarrollo
      humano.
    before: >-
      Camina solo por senderos señalizados y deja el coche en los aparcamientos habilitados al pie de las
      montañas.
    around: >-
      La [Meseta de Pokljuka](/lugar/pokljuka-plateau/) y el [Parque Nacional de
      Triglav](/lugar/triglav-southern-karst-plateau/) quedan a seis kilómetros, el [Parque Paisajístico de
      Logarska dolina](/lugar/krajinski-park-logarska-dolina---jezersko/) a siete, la [Meseta de
      Jelovica](/lugar/jelovica-plateau/) a nueve y el [Bosque de Tarvisio y Alpes Julianos
      Italianos](/lugar/foresta-di-tarvisio---alpi-giulie-italiane/) a diez.
  en:
    intro: >-
      Two continents, or at least two tectonic plates, meet here. The Periadriatic Fault, the most prominent
      fault line in the entire Alpine arc, runs straight through the Karavanke, where compressive forces
      between the European and African plates have been thrusting these peaks upward since the Eocene. The
      oldest basement rocks date back some 500 million years, and mountain footpaths weave repeatedly across
      the border between Austria and Slovenia. The Karavanke UNESCO Global Geopark (Karawanken in German)
      unites five Slovenian and nine Austrian municipalities to bring this geological saga alive through
      mines, karst caverns, fossil beds, and trails.
    landscape: >-
      The range stretches for roughly 120 km, from Trbiž (Tarvisio) east to Slovenj Gradec, with Stol
      (Hochstuhl / Veliki Stol) standing as its highest crest. In the northern Karavanke, Hochobir reaches
      2,139 meters as the eastern bastion, where Middle Triassic Wetterstein limestone forms massive cliff
      faces.


      The geology changes from one valley to the next. The Smrekovec chain is formed of Oligocene volcanic
      rocks; at its information point, an interpretive exhibition and short documentary recount how an
      underwater volcano erupted here 23 million years ago. Mount Peca holds world-class lead and zinc
      mineralizations. Helenska gorge ranks among the three richest Carnian crinoid fossil sites in Europe.
      Furthermore, dravite and wulfenite have their type localities in this area.


      Water also acts as a tireless sculptor: the rock arches of Uschowa attest to the persistent erosive
      power of water over millions of years, and the hiking trail to Mount Olševa passes several natural rock
      bridges and windows. At the protected sediment profile of the Topla mine at 1,145 meters, one can
      decipher the stratigraphic record, while the Obir dripstone caves at 1,078 meters were discovered in
      1870 by miners prospecting for lead and zinc. Inside, the cavern maintains an unvarying eight degrees
      Celsius, sheltering actively growing stalactites, a rarity in Europe.
    wildlife: >-
      Between Koschuta and Hochobir, an extraordinary biodiversity thrives at the eastern extremity of the
      Alps. Sheer crags, limestone screes, subalpine grasslands, and scattered peat bogs shelter endangered
      botanical treasures: Zois' bellflower, the Kamnik orchid, and Wulfen's primrose, which shares its
      namesake with the mineral wulfenite.


      For avifauna, the eastern Karavanke represent an area of paramount importance. The massif serves as
      lekking and breeding grounds for the [western capercaillie](/especie/tetrao_urogallus/), the [black
      grouse](/especie/tetrao_tetrix/), the [rock ptarmigan](/especie/lagopus_muta/), and the hazel grouse;
      the [Eurasian pygmy-owl](/especie/glaucidium_passerinum/) and boreal owl nest in the timber; and
      observers frequently encounter the [black woodpecker](/especie/dryocopus_martius/), the [Eurasian
      three-toed woodpecker](/especie/picoides_tridactylus/), the [golden eagle](/especie/aquila_chrysaetos/),
      and the [peregrine falcon](/especie/falco_peregrinus/). The peat bogs, among the most endangered and
      rapidly vanishing habitats in Europe, provide sanctuary for rare butterflies such as the marsh
      fritillary and false ringlet.
    visit: >-
      The Karawanken Trail traverses the entire range in thirteen stages over 265 km. The first stage leads
      from Zell-Pfarre up to Hochobir and the Eisenkapplerhütte: 21.2 km taking around nine hours. The third
      stage, from Riepl to Dom na Peci across Kordeschkopf, spans 11.7 km in roughly five hours. The fourth,
      running through Topla to Koča v Grohotu, is the longest: 27.3 km in approximately ten hours. The final
      leg from Freibacher Stausee back to Zell-Pfarre covers 15.7 km in about five hours. In total, the
      geoparque boasts over 1,200 km of waymarked hiking trails.


      Several interpretive centers unpack the geological history. The Geo.Dom visitor center on Petzen
      mountain features interactive nature games and an exhibition on the Lesbos petrified forest. In Zell,
      the info point marks the trailhead for excursions into the upper Zell valley, introducing the geology of
      Koschuta. In Ravne na Koroškem, the Water Centre explains the vital role of groundwater through hands-on
      installations. Bukovje Castle hosts exhibitions dedicated to the Drava River and dravite mineral.


      If you prefer a gentler stroll, the Beaver nature educational trail circles Lake Dravograd with seven
      thematic stations showcasing local wetland ecology.
    history: >-
      Karst caves in the massif have yielded Stone Age tools that provide crucial insights into early human
      habitation.
    before: >-
      Hike strictly along marked footpaths and leave vehicles in designated trail parking areas at the foot of
      the mountains.
    around: >-
      The [Pokljuka Plateau](/lugar/pokljuka-plateau/) and the [Triglav Southern Karst
      Plateau](/lugar/triglav-southern-karst-plateau/) lie six kilometers away, the [Logar Valley and Jezersko
      Landscape Park](/lugar/krajinski-park-logarska-dolina---jezersko/) seven kilometers, the [Jelovica
      Plateau](/lugar/jelovica-plateau/) nine kilometers, and the [Tarvisio Forest and Italian Julian
      Alps](/lugar/foresta-di-tarvisio---alpi-giulie-italiane/) ten kilometers.
  fr:
    intro: >-
      Ici se touchent deux continents, ou du moins deux plaques tectoniques. La faille périadriatique, faille
      géologique majeure de tout l'arc alpin, traverse les Karavanke, où les poussées entre les plaques
      européenne et africaine soulèvent ce relief depuis l'Éocène. Les roches les plus anciennes ont quelque
      500 millions d'années, et les sentiers franchissent sans cesse la frontière entre l'Autriche et la
      Slovénie. Le géoparc mondial UNESCO des Karavanke (Karawanken en allemand) rassemble cinq communes
      slovènes et neuf autrichiennes pour conter cette épopée à travers mines, grottes, fossiles et chemins de
      crête.
    landscape: >-
      La chaîne s'étire sur environ 120 km, depuis Trbiž (Tarvisio) jusqu'à Slovenj Gradec, le Stol (Hochstuhl
      / Veliki Stol) constituant son point culminant. Dans les Karavanke du nord, le Hochobir, haut de 2 139
      mètres, domine la partie orientale, et les calcaires de Wetterstein du Trias moyen arment d'immenses
      falaises.


      La géologie change d'une vallée à l'autre. Le chaînon de Smrekovec est formé de roches volcaniques de
      l'Oligocène ; au point d'information local, une exposition et un film retracent l'éruption d'un volcan
      sous-marin survenue il y a 23 millions d'années. Le mont Peca recèle des minéralisations de plomb et de
      zinc d'intérêt mondial. La gorge de Helenska figure parmi les trois plus riches gisements de crinoïdes
      du Carnien en Europe. La dravite et la wulfénite ont d'ailleurs ici leur localité-type.


      L'eau est également sculptrice : les arches rocheuses d'Uschowa témoignent de la force de l'érosion au
      fil des millénaires, et le sentier du mont Olševa franchit plusieurs ponts et fenêtres de roche
      naturelle. La coupe sédimentaire protégée de la mine de Topla, à 1 145 mètres, dévoile l'histoire
      stratigraphique, tandis que les grottes à concrétions de l'Obir, à 1 078 mètres, furent découvertes en
      1870 par des mineurs en quête de minerai. La cavité conserve une température constante de huit degrés et
      abrite des stalactites toujours actives, une rareté en Europe.
    wildlife: >-
      Entre Koschuta et Hochobir s'épanouit une biodiversité remarquable en lisière orientale des Alpes.
      Parois rocheuses, éboulis, pelouses alpines et tourbières dispersées hébergent des raretés : la
      campanule de Zois, l'orchidée de Kamnik ou la primevère de Wulfen, qui partage son nom avec le minéral
      wulfénite.


      Pour l'avifaune, les Karavanke orientales représentent un secteur d'importance majeure. C'est une aire
      de parade pour le [grand tétras](/especie/tetrao_urogallus/), le [tétras lyre](/especie/tetrao_tetrix/),
      le [lagopède alpin](/especie/lagopus_muta/) et la gélinotte des bois ; la [chevêchette
      d'Europe](/especie/glaucidium_passerinum/) et la chouette de Tengmalm y nichent, aux côtés du [pic
      noir](/especie/dryocopus_martius/), du [pic tridactyle](/especie/picoides_tridactylus/), de [l'aigle
      royal](/especie/aquila_chrysaetos/) et du [faucon pèlerin](/especie/falco_peregrinus/). Les tourbières,
      parmi les biotopes les plus menacés d'Europe, conservent des papillons rares tels que le damier de la
      succise et la bacchante.
    visit: >-
      Le Karawanken Trail parcourt l'ensemble de la chaîne en treize étapes sur 265 km. La première étape
      relie Zell-Pfarre au Hochobir et à l'Eisenkapplerhütte : 21,2 km pour environ neuf heures de marche. La
      troisième, de Riepl au Dom na Peci via le Kordeschkopf, compte 11,7 km en cinq heures environ. La
      quatrième, par Topla jusqu'à Koča v Grohotu, est la plus longue : 27,3 km en près de dix heures. La
      dernière étape, du Freibacher Stausee à Zell-Pfarre, totalise 15,7 km en cinq heures. Au total, le
      géoparc offre plus de 1 200 km de sentiers balisés.


      Plusieurs centres interprétatifs éclairent le territoire. Le Geo.Dom sur le mont Petzen propose des
      modules interactifs et une exposition sur la forêt pétrifiée de Lesbos. À Zell, le point d'accueil
      marque le départ vers la haute vallée et explique la géologie de Koschuta. À Ravne na Koroškem, le
      Centre de l'eau détaille le rôle fondamental des nappes souterraines. Le château de Bukovje abrite quant
      à lui des expositions sur la Drave et la dravite.


      Pour une promenade facile, le sentier didactique du castor fait le tour du lac de Dravograd avec sept
      stations consacrées à la faune et la flore palustres.
    history: >-
      Dans les grottes karstiques ont été mis au jour des outils de l'âge de la pierre, précieux pour
      appréhender le peuplement préhistorique.
    before: >-
      Ne quittez pas les sentiers balisés et garez vos véhicules sur les parkings aménagés au pied des
      massifs.
    around: >-
      Le [plateau de Pokljuka](/lugar/pokljuka-plateau/) et le [parc national du
      Triglav](/lugar/triglav-southern-karst-plateau/) sont à six kilomètres, le [parc paysager de la vallée
      de Logar](/lugar/krajinski-park-logarska-dolina---jezersko/) à sept kilomètres, le [plateau de
      Jelovica](/lugar/jelovica-plateau/) à neuf kilomètres et la [forêt de Tarvisio et les Alpes juliennes
      italiennes](/lugar/foresta-di-tarvisio---alpi-giulie-italiane/) à dix kilomètres.
  de:
    intro: >-
      Hier berühren sich zwei Kontinente, zumindest aber zwei tektonische Platten. Die Periadriatische Naht,
      die bedeutendste Bruchzone des gesamten Alpenbogens, verläuft mitten durch die Karawanken; die Hebung
      durch den Druck zwischen eurasischer und afrikanischer Platte hält seit dem Eozän an. Die ältesten
      Gesteine blicken auf rund 500 Millionen Jahre zurück, und Bergpfade queren wiederholt die Grenze
      zwischen Österreich und Slowenien. Der grenzüberschreitende UNESCO-Geopark Karawanken (Karavanke auf
      Slowenisch) verbindet fünf slowenische und neun österreichische Gemeinden, um diese Erdgeschichte anhand
      von Schaubergwerken, Höhlen, Fossilien und Kämmen erlebbar zu machen.
    landscape: >-
      Der Gebirgszug erstreckt sich über rund 120 km von Trbiž (Tarvisio) bis Slovenj Gradec, wobei der Stol
      (Hochstuhl) den höchsten Gipfel markiert. In den Nordkarawanken bildet der Hochobir mit 2.139 Metern den
      beherrschenden östlichen Eckpfeiler, wo mitteltriassischer Wettersteinkalk steile Wandabbrüche aufbaut.


      Die Geologie wandelt sich von Tal zu Tal. Der Smrekovec-Zug besteht aus oligozänem Vulkangestein; das
      dortige Informationszentrum veranschaulicht in einer Ausstellung und einem Film, wie vor 23 Millionen
      Jahren ein Vulkan unter dem Meeresspiegel ausbrach. Die Petzen (Peca) birgt Blei-Zink-Vererzungen von
      Weltrang. Die Helenen-Schlucht zählt zu den drei reichhaltigsten karnischen Seelilien-Fundstellen
      Europas. Dravit und Wulfenit besitzen hier ihre Typlokalität.


      Auch das Wasser schuf Monumente: Die Felsenfenster der Uschowa bezeugen die Kraft jahrtausendelanger
      Verwitterung, und der Steig zur Olševa passiert mehrere Felsentore. Am geschützten Profil des Bergwerks
      Topla auf 1.145 Metern liegt die Sedimentgeschichte offen zutage, während die Obir-Tropfsteinhöhlen auf
      1.078 Metern im Jahr 1870 beim Erzabbau entdeckt wurden. Im Inneren herrscht eine konstante Temperatur
      von acht Grad mit lebenden Tropfsteinen, eine mitteleuropäische Kostbarkeit.
    wildlife: >-
      Zwischen Koschuta und Hochobir entfaltet sich am Ostrand der Alpen eine herausragende Artenvielfalt.
      Steilwände, Schutthalden, alpine Matten und Hochmoore bieten seltenen Pflanzen Refugien:
      Zois-Glockenblume, Kamnik-Orchidee und Wulfen-Primel, die ihren Namen mit dem Mineral Wulfenit teilt.


      Für die Vogelwelt besitzen die östlichen Karawanken erstrangige Bedeutung. Sie dienen als Balzplatz für
      [Auerhuhn](/especie/tetrao_urogallus/), [Birkhuhn](/especie/tetrao_tetrix/),
      [Alpenschneehuhn](/especie/lagopus_muta/) und Haselhuhn;
      [Sperlingskauz](/especie/glaucidium_passerinum/) und Raufußkauz brüten in den Bergmischwäldern, während
      [Schwarzspecht](/especie/dryocopus_martius/), [Dreizehenspecht](/especie/picoides_tridactylus/),
      [Steinadler](/especie/aquila_chrysaetos/) und [Wanderfalke](/especie/falco_peregrinus/) regelmäßig
      gesichtet werden. Moorgebiete beherbergen seltene Falter wie den Goldenen Scheckenfalter und den
      Wald-Wiesenvögelchen.
    visit: >-
      Der Karawanken Trail überquert das Gebirge in dreizehn Etappen auf 265 km Länge. Die erste Etappe führt
      von Zell-Pfarre auf den Hochobir zur Eisenkappler Hütte: 21,2 km in rund neun Stunden. Die dritte Etappe
      von Riepl über den Kordeschkopf zum Dom na Peci umfasst 11,7 km in etwa fünf Stunden. Die vierte über
      Topla zur Koča v Grohotu ist mit 27,3 km und zehn Gehzeit die anspruchsvollste. Der letzte Abschnitt vom
      Freibacher Stausee zurück nach Zell-Pfarre erfordert 15,7 km in fünf Stunden. Insgesamt erschließen über
      1.200 km markierte Wanderwege den Geopark.


      Zahlreiche Anlaufstellen vermitteln Einblicke. Das Geo.Dom-Besucherzentrum auf der Petzen bietet ein
      Naturspiel und eine Schau über den Versteinerten Wald von Lesbos. In Zell informiert der Infopunkt über
      die Geologie der Koschuta. In Ravne na Koroškem widmet sich das Wasserzentrum dem Schutz des
      Grundwassers. Im Schloss Bukovje gibt es Ausstellungen zur Drau und zum Dravit-Mineral.


      Für einen kurzen Rundgang eignet sich der Biber-Lehrpfad am Stausee Dravograd mit sieben Stationen zu
      Flora und Fauna der Gewässer.
    history: >-
      In den Karsthöhlen wurden Steinzeitwerkzeuge geborgen, die für die Erforschung früher menschlicher
      Besiedlung im Alpenraum von Belang sind.
    before: >-
      Bleibe stets auf den markierten Wegen und nutze die ausgewiesenen Wanderparkplätze an den
      Ausgangspunkten.
    around: >-
      Das [Pokljuka-Plateau](/lugar/pokljuka-plateau/) und das [Südliche
      Triglav-Karstplateau](/lugar/triglav-southern-karst-plateau/) liegen sechs Kilometer entfernt, der
      [Landschaftspark Logar-Tal und Jezersko](/lugar/krajinski-park-logarska-dolina---jezersko/) sieben
      Kilometer, das [Jelovica-Plateau](/lugar/jelovica-plateau/) neun Kilometer und der [Wald von Tarvisio
      und Italienische Julische Alpen](/lugar/foresta-di-tarvisio---alpi-giulie-italiane/) zehn Kilometer.
  it:
    intro: >-
      Qui due continenti, o almeno due zolle tettoniche, vengono a contatto. La linea periadriatica, la
      dislocazione più imponente dell'intero arco alpino, fende le Caravanche, dove la compressione tra la
      placca europea e quella africana continua a sollevare questi monti dall'Eocene. Le rocce più antiche
      risalgono a circa 500 milioni di anni fa, e i sentieri varcano di continuo il confine tra Austria e
      Slovenia. Il Geoparco globale UNESCO delle Caravanche (Karawanken in tedesco) unisce cinque comuni
      sloveni e nove austriaci per raccontare questa storia geologica tra miniere, cavità carsiche, fossili e
      creste panoramiche.
    landscape: >-
      La catena si allunga per circa 120 km, da Trbiž (Tarvisio) a Slovenj Gradec, e lo Stol (Hochstuhl /
      Veliki Stol) ne costituisce la quota più alta. Nelle Caravanche settentrionali l'Hochobir, con i suoi
      2139 metri, domina il settore orientale, mentre il calcare di Wetterstein del Triassico medio disegna
      possenti pareti a strapiombo.


      La composizione geologica muta da una valle all'altra. La dorsale di Smrekovec è formata da vulcaniti
      oligoceniche; il relativo centro visite illustra, con modelli e filmati, l'eruzione di un antico vulcano
      sottomarino avvenuta 23 milioni di anni fa. Il monte Peca custodisce mineralizzazioni di piombo e zinco
      di fama internazionale. La gola di Helenska è uno dei tre siti paleontologici più cospicui d'Europa per
      i crinoidi del Carnico. Inoltre, la dravite e la wulfenite hanno qui la loro località tipo.


      Anche le acque modellano la pietra: gli archi rocciosi di Uschowa testimoniano la tenacia dell'erosione
      nel corso delle ere, e il cammino verso il monte Olševa attraversa finestre e ponti naturali di roccia.
      Nella sezione sedimentaria protetta della miniera di Topla, a 1145 metri, si legge la successione degli
      strati, mentre le grotte con stalattiti dell'Obir, a 1078 metri, vennero scoperte nel 1870 durante gli
      scavi minerari. All'interno la temperatura resta costante a otto gradi con concrezioni tuttora vive, una
      rarità in Europa.
    wildlife: >-
      Tra la Koschuta e l'Hochobir prospera una biodiversità singolare al confine orientale delle Alpi.
      Bastionate calcaree, ghiaioni, pascoli d'alta quota e torbiere isolate ospitano endemismi vegetali: la
      campanula di Zois, l'orchidea di Kamnik e la primula di Wulfen, affine nel nome al minerale wulfenite.


      Per gli uccelli, le Caravanche orientali costituiscono un territorio di straordinario rilievo. Sono
      arena di corteggiamento per il [gallo cedrone](/especie/tetrao_urogallus/), il [fagiano di
      monte](/especie/tetrao_tetrix/), la [pernice bianca](/especie/lagopus_muta/) e il francolino di monte;
      vi nidificano la [civetta nana](/especie/glaucidium_passerinum/) e la civetta capogrosso, mentre nei
      boschi si scorgono il [picchio nero](/especie/dryocopus_martius/), il [picchio
      tridattilo](/especie/picoides_tridactylus/), l' [aquila reale](/especie/aquila_chrysaetos/) e il [falco
      pellegrino](/especie/falco_peregrinus/). Le torbiere, ambienti fragili a rischio di scomparsa in Europa,
      offrono riparo a farfalle protette come la ninfa delle paludi.
    visit: >-
      Il Karawanken Trail percorre l'intera catena in tredici tappe lungo 265 km. La prima tappa va da
      Zell-Pfarre all'Hochobir e all'Eisenkapplerhütte: 21,2 km in circa nove ore. La terza frazione, da Riepl
      al Dom na Peci valicando il Kordeschkopf, misura 11,7 km per cinque ore di cammino. La quarta, risalendo
      Topla verso Koča v Grohotu, è la più lunga: 27,3 km in circa dieci ore. L'ultima tappa, dal lago di
      Freibach (Freibacher Stausee) di nuovo a Zell-Pfarre, conta 15,7 km in cinque ore. Nel complesso il
      geoparco mette a disposizione oltre 1.200 km di sentieri tracciati.


      Numerosi punti informativi accolgono i visitatori. Il Geo.Dom sul monte Petzen offre giochi didattici e
      una sala sulla foresta fossile di Lesbo. A Zell l'ufficio informativo apre le porte all'alta valle
      spiegando la geologia della Koschuta. A Ravne na Koroškem il Centro delle Acque approfondisce il tema
      delle riserve idriche sotterranee. Il castello di Bukovje ospita esposizioni dedicate al fiume Drava e
      alla dravite.


      Per una breve passeggiata a fondovalle, il sentiero del castoro circonda il lago di Dravograd con sette
      pannelli illustrativi sugli ecosistemi lacustri.
    history: >-
      Nelle cavità carsiche della catena sono stati ritrovati reperti litici dell'età della pietra,
      testimonianze preziose dell'antico insediamento umano.
    before: >-
      Cammina esclusivamente sui sentieri segnati e lascia l'auto nei parcheggi autorizzati ai piedi delle
      salite.
    around: >-
      L' [Altopiano di Pokljuka](/lugar/pokljuka-plateau/) e l' [Altopiano Carsico Meridionale del
      Triglav](/lugar/triglav-southern-karst-plateau/) si trovano a sei chilometri, il [Parco Paesaggistico
      della Valle di Logar e Jezersko](/lugar/krajinski-park-logarska-dolina---jezersko/) a sette chilometri,
      l' [Altopiano di Jelovica](/lugar/jelovica-plateau/) a nove chilometri e la [Foresta di Tarvisio e Alpi
      Giulie Italiane](/lugar/foresta-di-tarvisio---alpi-giulie-italiane/) a dieci chilometri.
  pt:
    intro: >-
      Aqui tocam-se dois continentes, ou pelo menos duas placas tectónicas. A falha periadriática, a fratura
      geológica mais relevante de todo o arco alpino, rasga as Karavanke, onde as forças entre a placa
      europeia e a placa africana elevam esta cordilheira desde o Eoceno. As rochas basais contam cerca de 500
      milhões de anos, e as rotas pedestres cruzam repetidamente a fronteira entre a Áustria e a Eslovénia. O
      Geoparque Mundial da UNESCO Karavanke (Karawanken em alemão) reúne cinco municípios eslovenos e nove
      austríacos para narrar esta evolução através de minas, grutas, fósseis e trilhos.
    landscape: >-
      A cordilheira estende-se por cerca de 120 km, desde Trbiž (Tarvisio) até Slovenj Gradec, tendo no Stol
      (Hochstuhl / Veliki Stol) a sua elevação culminante. Nas Karavanke setentrionais, o Hochobir, com 2139
      metros, domina a porção leste, com o calcário de Wetterstein do Triássico Médio a talhar falésias
      imponentes.


      A geologia varia de vale para vale. O maciço de Smrekovec é composto por rochas vulcânicas do Oligoceno;
      o centro informativo local exibe uma mostra e um documentário sobre a erupção de um vulcão submarino
      ocorrida há 23 milhões de anos. O monte Peca abriga jazidas de chumbo e zinco de relevância
      internacional. A garganta de Helenska é uma das três jazidas mais abundantes de crinóides do Carniano na
      Europa. A dravite e a wulfenite têm aqui a sua localidade-tipo.


      A água atua também como escultora natural: os arcos de pedra de Uschowa atestam o vigor da erosão ao
      longo de milénios, e o trilho rumo ao monte Olševa atravessa várias janelas e pontes naturais de rocha.
      No corte sedimentar protegido da mina de Topla, a 1145 metros, lê-se o registo estratigráfico, enquanto
      as grutas de estalactites de Obir, a 1078 metros, foram descobertas em 1870 por mineiros à procura de
      minério. No interior, a temperatura permanece constante nos oito graus, preservando estalactites em
      crescimento contínuo, fenómeno raro na Europa.
    wildlife: >-
      Entre Koschuta e Hochobir existe uma biodiversidade singular na orla oriental dos Alpes. Escarpas de
      rocha, cascalheiras, pastagens de altitude e turfeiras dispersas abrigam plantas raras: a
      campânula-de-zois, a orquídea-de-kamnik e a prímula-de-wulfen, que partilha o nome com a wulfenite.


      Para as aves, as Karavanke orientais representam uma área de capital relevo. É espaço de parada nupcial
      para o [tetraz-grande](/especie/tetrao_urogallus/), o [galo-lira](/especie/tetrao_tetrix/), a
      [perdiz-nival](/especie/lagopus_muta/) e a galinhola-da-floresta; nidificam ali o
      [mocho-pigmeu](/especie/glaucidium_passerinum/) e o mocho-boreal, avistando-se igualmente o
      [pitéu-preto](/especie/dryocopus_martius/), o [pica-pau-tridáctilo](/especie/picoides_tridactylus/), a
      [águia-real](/especie/aquila_chrysaetos/) e o [falcão-peregrino](/especie/falco_peregrinus/). As
      turfeiras, entre os ecossistemas mais fragilizados da Europa, acolhem borboletas ameaçadas como a
      fritilária-dos-pântanos.
    visit: >-
      O Karawanken Trail vence a cordilheira em treze etapas ao longo de 265 km. A primeira etapa liga
      Zell-Pfarre ao Hochobir e à Eisenkapplerhütte: 21,2 km cumpridos em cerca de nove horas. A terceira
      etapa, de Riepl a Dom na Peci por Kordeschkopf, estende-se por 11,7 km em cerca de cinco horas. A
      quarta, atravessando Topla até Koča v Grohotu, é a mais longa: 27,3 km em cerca de dez horas. A última
      jornada, da albufeira de Freibach a Zell-Pfarre, mede 15,7 km em cerca de cinco horas. No conjunto, o
      geoparque oferece mais de 1.200 km de percursos pedestres balizados.


      Diversos espaços de interpretação acolhem os caminhantes. O centro Geo.Dom na montanha Petzen
      disponibiliza experiências didáticas e uma exposição sobre a floresta petrificada de Lesbos. Em Zell, o
      posto informativo marca a partida para o vale alto e explica a geologia de Koschuta. Em Ravne na
      Koroškem, o Centro da Água aborda a importância das águas subterrâneas. O castelo de Bukovje exibe
      mostras sobre o rio Drava e o mineral dravite.


      Para quem procura um passeio breve, o percurso didático do castor contorna a albufeira de Dravograd com
      sete paragens temáticas dedicadas ao lago.
    history: >-
      Nas grutas cársticas foram descobertos artefactos da Idade da Pedra que ilustram a evolução humana nas
      montanhas.
    before: Caminha apenas pelos trilhos marcados e estaciona as viaturas nos parques previstos na base das serras.
    around: >-
      O [Planalto de Pokljuka](/lugar/pokljuka-plateau/) e o [Planalto Cárstico Meridional de
      Triglav](/lugar/triglav-southern-karst-plateau/) distam seis quilómetros, o [Parque Paisagístico do Vale
      de Logar e Jezersko](/lugar/krajinski-park-logarska-dolina---jezersko/) sete quilómetros, o [Planalto de
      Jelovica](/lugar/jelovica-plateau/) nove quilómetros e a [Floresta de Tarvisio e Alpes Julianos
      Italianos](/lugar/foresta-di-tarvisio---alpi-giulie-italiane/) dez quilómetros.
