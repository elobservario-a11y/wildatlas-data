resumen:
  es: Barrera alpina kárstica de 120 km de longitud que marca la frontera entre Eslovenia y Austria.
  en: A 120 km karst alpine barrier marking the national border between Slovenia and Austria.
  fr: Barrière alpine calcaire de 120 km de long marquant la frontière entre la Slovénie et l'Autriche.
  de: Eine 120 km lange alpine Karstbarriere an der Staatsgrenze zwischen Slowenien und Österreich.
  it: Barriera alpina carsica lunga 120 km che segna il confine di Stato tra Slovenia e Austria.
  pt: Barreira alpina cárstica com 120 km de comprimento que delimita a fronteira entre a Eslovénia e a Áustria.
unico:
  es: >-
    Una cordillera donde dos placas tectónicas se encuentran, y que se recorre entera, de país en país, en
    trece etapas.
  en: >-
    A mountain range where two tectonic plates meet, traversed from end to end across borders in thirteen
    stages.
  fr: >-
    Une chaîne de montagnes où deux plaques tectoniques se rencontrent, traversable d'un pays à l'autre en
    treize étapes.
  de: >-
    Ein Gebirgszug, an dem zwei tektonische Platten aufeinandertreffen und der in dreizehn Etappen
    grenzüberschreitend erwandert werden kann.
  it: >-
    Una catena montuosa dove si scontrano due placche tettoniche, percorribile per intero tra i due Paesi in
    tredici tappe.
  pt: >-
    Uma cordilheira onde duas placas tectónicas se encontram, percorrida na íntegra de país em país em treze
    etapas.
observaciones:
