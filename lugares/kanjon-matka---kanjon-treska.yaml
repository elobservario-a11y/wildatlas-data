    Cañón calizo vertical con la cueva submarina Vrelo (una de las más profundas del mundo) a pocos minutos de
    Skopje.
  en: >-
    Vertical limestone canyon sheltering the submerged Vrelo cave (among the deepest in the world) just
    minutes from Skopje.
  fr: >-
    Canyon calcaire vertical abritant la grotte sous-marine de Vrelo (parmi les plus profondes du monde) à
    quelques minutes de Skopje.
  de: >-
    Senkrechte Kalksteinschlucht mit der unterseeischen Vrelo-Höhle (einer der tiefsten weltweit) nur wenige
    Minuten von Skopje entfernt.
  it: >-
    Canyon calcareo verticale con la grotta sommersa di Vrelo (tra le più profonde al mondo) a pochi minuti da
    Skopje.
  pt: >-
