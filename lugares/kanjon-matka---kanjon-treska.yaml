texto:
  es:
    intro: >-
      Un río detenido por un muro, un lago de siete kilómetros de largo y apenas 120 metros de ancho, y bajo
      él una cueva cuya profundidad nadie ha sabido medir con exactitud. Matka es el cañón del Treska, al
      oeste del centro de Skopje, en Macedonia del Norte. Ocupa unas 5.000 hectáreas y es uno de los destinos
      al aire libre más populares del país, además de albergar varios monasterios medievales.
    landscape: >-
      El Treska corta el cañón y, en 1938, la presa de San Andrés lo detuvo. Así nació el lago Matka, el lago
      artificial más antiguo del país. Mide hasta 7 km de largo y 120 m de ancho, y su agua se usa para
      generar electricidad y regar los pueblos cercanos.


      Bajo la superficie y entre las paredes, el karst ha hecho su parte. El cañón tiene diez cuevas, de entre
      20 y 176 m de longitud, y dos simas verticales de unos 35 m de profundidad. La más famosa, Vrelo, está
      en la margen derecha del Treska, y entró en la lista de los 77 mejores sitios naturales del mundo del
      proyecto New7Wonders of Nature. Tiene dos lagos al fondo, uno mayor que el otro, y en el centro una gran
      formación a la que llaman la Piña por su forma. No se conoce su profundidad exacta, aunque se cree que
      es una de las cuevas más profundas de Europa o del mundo.
    wildlife: >-
      Aproximadamente el 20 % de las plantas de Matka son endémicas y solo crecen allí. El cañón es hogar de
      77 especies autóctonas de mariposas y de la [víbora cornuda](/especie/vipera_ammodytes/), la serpiente
      más venenosa del sur de Europa. Las cuevas albergan grandes poblaciones de murciélagos. Entre las
      rapaces del cañón figuran el [águila real](/especie/aquila_chrysaetos/) y el [buitre
      leonado](/especie/gyps_fulvus/).


      La temporada de montaña va de Semana Santa a noviembre.
    visit: >-
      Matka se recorre a pie o, por el Treska, en kayak. Es una de las principales zonas de senderismo de
      montaña de Macedonia del Norte, y la temporada empieza hacia Semana Santa y acaba en noviembre.


      En la central hidroeléctrica de Matka, en el cañón, en el municipio de Saraj, está el Centro de
      Exposiciones Matka, que explica el mundo de la electricidad y está abierto a cualquier persona
      interesada.
    history: >-
      El cañón guarda varios monasterios. El de San Andrés, en la garganta del Treska, lo fundó hacia 1388
      Andrés, hermano del príncipe Marko. El monasterio de Matka se construyó en el siglo catorce y está en la
      margen izquierda del Treska; según una inscripción de la iglesia, en 1497 una mujer llamada Milica la
      encontró en mal estado y sin techo. El monasterio de San Nicolás Šiševski está sobre un acantilado por
      encima del cañón y de San Andrés, con vistas únicas desde lo alto; su iconostasis se pintó en 1645 y el
      lado oeste se decoró con frescos en 1630.
    before: Comprueba antes de ir los horarios y cómo se organizan las visitas a las cuevas.
    around: >-
      El [Parque Nacional de la Cordillera de Šar](/lugar/nacionalni-park-sar-planina/) es el espacio
      protegido más cercano del atlas.
  en:
    intro: >-
      A river impounded behind a concrete wall, a reservoir seven kilometers long and barely 120 meters wide,
      and beneath its surface a flooded cave whose full depth has never been definitively measured. Matka is
      the gorge of the Treska River west of downtown Skopje in North Macedonia. Encompassing around 5,000
      hectares, it is one of the country's most frequented outdoor destinations, harboring several medieval
      monasteries in its cliffs.
    landscape: >-
      The Treska River carved the chasm, and in 1938 the Saint Andrew dam held back its waters, giving birth
      to Lake Matka—the oldest artificial reservoir in the nation. It extends up to 7 km in length and 120 m
      in width, its storage used for electricity generation and irrigating nearby villages.


      Beneath the surface and throughout the gorge walls, karst processes have hollowed out the rock. The
      canyon holds ten caves measuring between 20 and 176 m in length, along with two vertical shafts about 35
      m deep. The most famous, Vrelo Cave on the right bank of the Treska, was nominated among the 77 finest
      natural wonders of the world in the New7Wonders of Nature campaign. It features two underground lakes at
      the rear—one larger than the other—and an immense stalagmite called the Pinecone at its center. Its
      exact depth remains unknown, though explorers consider it one of the deepest drowned caves in Europe or
      worldwide.
    wildlife: >-
      Approximately 20% of the plants thriving in Matka are endemic and grow nowhere else. The gorge is home
      to 77 indigenous butterfly species and to the [nose-horned viper](/especie/vipera_ammodytes/), the most
      venomous snake in southern Europe. The caves shelter vast colonies of bats. Among the cliff-nesting
      raptors are the [golden eagle](/especie/aquila_chrysaetos/) and the [griffon
      vulture](/especie/gyps_fulvus/).


      The hiking season runs from Easter to November.
    visit: >-
      Matka can be explored on foot or by paddling a kayak up the Treska. It is one of the premier mountain
      hiking hubs in North Macedonia, with the main season running from Easter through November.


      Beside the Matka hydroelectric power plant inside the canyon, within the municipality of Saraj, stands
      the Matka Exhibition Centre, which unpacks the history and physics of electricity for all interested
      visitors.
    history: >-
      Several monasteries nestle along the canyon walls. Saint Andrew's Monastery, set inside the gorge of the
      Treska, was founded around 1388 by Andrew, brother of Prince Marko. The Monastery of the Dormition of
      the Theotokos in Matka was built in the fourteenth century on the left bank of the Treska; according to
      a church inscription, in 1497 a woman named Milica found the sanctuary roofless and restored it. Saint
      Nicholas Šiševski perches atop a sheer bluff above the gorge and Saint Andrew's, offering commanding
      views from above; its iconostasis was painted in 1645 and the western wall was adorned with frescoes in
      1630.
    before: Check visiting schedules and cave tour logistics before setting out.
    around: >-
      The [Šar Mountains National Park](/lugar/nacionalni-park-sar-planina/) is the closest protected area
      listed in the atlas.
  fr:
    intro: >-
      Une rivière retenue par un barrage, un lac de sept kilomètres de long et à peine 120 mètres de large, et
      sous sa surface une cavité dont nul n'a encore mesuré la profondeur exacte. Matka est le canyon de la
      Treska, à l'ouest du centre de Skopje, en Macédoine du Nord. Couvrant environ 5 000 hectares, il
      constitue l'une des destinations de plein air les plus prisées du pays et abrite plusieurs monastères
      médiévaux.
    landscape: >-
      La Treska a entaillé le défilé, et en 1938, le barrage Saint-André a retenu son cours, donnant naissance
      au lac de Matka, le plus ancien lac artificiel du pays. Il s'étire jusqu'à 7 km de longueur pour 120 m
      de largeur, et ses eaux alimentent la production hydroélectrique et l'irrigation des villages voisins.


      Sous la surface et dans les falaises, le karst a creusé la roche. Le canyon compte dix grottes mesurant
      entre 20 et 176 m de longueur, ainsi que deux gouffres verticaux d'environ 35 m de profondeur. La plus
      renommée, Vrelo, sur la rive droite de la Treska, a figuré parmi les 77 merveilles naturelles
      sélectionnées par la campagne New7Wonders of Nature. Elle abrite deux lacs souterrains au fond, dont
      l'un plus étendu, et en son centre une immense concrétion appelée la Pomme de pin. Sa profondeur exacte
      reste inconnue, bien qu'on la tienne pour l'une des cavités noyées les plus profondes d'Europe ou du
      monde.
    wildlife: >-
      Environ 20 % des végétaux de Matka sont endémiques et ne poussent nulle part ailleurs. La gorge héberge
      77 espèces indigènes de papillons ainsi que la [vipère ammodite](/especie/vipera_ammodytes/), le serpent
      le plus venimeux d'Europe méridionale. Les grottes abritent d'importantes colonies de chauves-souris.
      Parmi les rapaces des parois figurent [l'aigle royal](/especie/aquila_chrysaetos/) et le [vautour
      fauve](/especie/gyps_fulvus/).


      La saison de randonnée s'étend de Pâques à novembre.
    visit: >-
      Matka se découvre à pied ou en kayak sur la Treska. C'est l'un des principaux secteurs de randonnée
      montagnarde de Macédoine du Nord, la saison débutant vers Pâques pour s'achever en novembre.


      Près de la centrale hydroélectrique de Matka, dans le canyon, sur la commune de Saraj, le centre
      d'exposition Matka présente l'histoire et les applications de l'électricité à tous les visiteurs
      curieux.
    history: >-
      Le canyon abrite plusieurs sanctuaires. Le monastère Saint-André, dans la gorge de la Treska, a été
      fondé vers 1388 par André, frère du prince Marko. Le monastère de Matka a été édifié au XIVe siècle sur
      la rive gauche de la Treska ; selon une inscription de l'église, en 1497 une femme nommée Milica la
      trouva délabrée et sans toit puis la fit restaurer. Saint-Nicolas Šiševski domine la gorge depuis une
      falaise au-dessus de Saint-André, offrant un panorama remarquable ; son iconostase a été peinte en 1645
      et sa paroi ouest ornée de fresques en 1630.
    before: Renseignez-vous avant le départ sur les horaires et l'organisation des visites guidées des grottes.
    around: >-
      Le [parc national des monts Šar](/lugar/nacionalni-park-sar-planina/) est l'espace protégé le plus
      proche mentionné dans l'atlas.
  de:
    intro: >-
      Ein von einer Staumauer gebändigter Fluss, ein sieben Kilometer langer und kaum 120 Meter breiter
      Stausee, und unter seiner Oberfläche eine Höhle, deren Tiefe niemand genau vermessen konnte. Matka ist
      die Schlucht der Treska westlich des Zentrums von Skopje in Nordmazedonien. Sie erstreckt sich über rund
      5.000 Hektar, gehört zu den beliebtesten Ausflugszielen des Landes und birgt mehrere mittelalterliche
      Klöster in ihren Felswänden.
    landscape: >-
      Die Treska grub die Schlucht, und 1938 staute der Andreas-Damm ihren Fluss. So entstand der Matka-See,
      der älteste Stausee des Landes. Er misst bis zu 7 km Länge und 120 m Breite; sein Wasser erzeugt Strom
      und bewässert umliegende Siedlungen.


      Unter der Oberfläche und in den Wänden schuf der Karst ein Labyrinth. Die Schlucht birgt zehn Höhlen
      zwischen 20 und 176 m Länge sowie zwei senkrechte Schächte von etwa 35 m Tiefe. Die bekannteste, Vrelo
      am rechten Treska-Ufer, wurde zu den 77 bemerkenswertesten Naturstätten der New7Wonders-Kampagne
      gezählt. Am Höhlengrund liegen zwei Seen, und in der Mitte ragt ein mächtiger Zapfen auf, den man Zapfen
      nennt. Die genaue Tiefe bleibt unbekannt, doch gilt sie als eine der tiefsten Unterwasserhöhlen Europas
      oder der Welt.
    wildlife: >-
      Rund 20 % der Pflanzen im Matka-Canyon sind endemisch und wachsen nur dort. Die Schlucht beherbergt 77
      einheimische Schmetterlingsarten sowie die [Europäische Hornotter](/especie/vipera_ammodytes/), die
      giftigste Schlange Südeuropas. In den Höhlen quartieren große Fledermausbestände. Unter den
      Felsgreifvögeln kreisen [Steinadler](/especie/aquila_chrysaetos/) und
      [Gänsegeier](/especie/gyps_fulvus/).


      Die Bergsaison dauert von Ostern bis November.
    visit: >-
      Matka lässt sich zu Fuß oder im Kajak auf der Treska erkunden. Es ist eines der Hauptwandergebiete
      Nordmazedoniens; die Saison beginnt um Ostern und reicht bis in den November.


      Am Wasserkraftwerk Matka in der Schlucht, in der Gemeinde Saraj, erklärt das Matka-Ausstellungszentrum
      allen Interessierten die Welt der Elektrizität.
    history: >-
      In der Schlucht verbergen sich mehrere Klöster. Das Andreas-Kloster in der Treska-Klamm gründete um 1388
      Fürst Markos Bruder Andreas. Das Matka-Kloster entstand im vierzehnten Jahrhundert am linken
      Treska-Ufer; einer Kircheninschrift zufolge fand es eine Frau namens Milica 1497 verfallen und ohne Dach
      vor und ließ es instand setzen. Das Nikolauskloster Šiševski thront auf einer Klippe hoch über der
      Schlucht und dem Andreas-Kloster; seine Ikonostase wurde 1645 gemalt, und die Westwand erhielt 1630 ihre
      Fresken.
    before: Erkundige dich vor dem Aufbruch über Öffnungszeiten und Organisation der Höhlenführungen.
    around: >-
      Der [Šar-Planina-Nationalpark](/lugar/nacionalni-park-sar-planina/) ist das nächstgelegene Schutzgebiet
      im Atlas.
  it:
    intro: >-
      Un fiume sbarrato da una diga, un lago lungo sette chilometri e largo appena 120 metri, e sotto la
      superficie una grotta la cui profondità nessuno ha ancora misurato con certezza. Matka è la gola della
      Treska, a ovest del centro di Skopje, nella Macedonia del Nord. Si estende per circa 5.000 ettari ed è
      una delle mete escursionistiche più popolari del Paese, oltre a racchiudere diversi monasteri medievali.
    landscape: >-
      La Treska ha inciso la forra e, nel 1938, la diga di Sant'Andrea ne ha arrestato il corso. È nato così
      il lago di Matka, il più antico bacino artificiale del Paese. Raggiunge 7 km di lunghezza e 120 m di
      larghezza, e le sue acque alimentano la produzione elettrica e l'irrigazione dei villaggi vicini.


      Sotto la superficie e lungo le pareti, il carsismo ha lavorato a lungo. Il canyon ospita dieci grotte,
      di lunghezza compresa tra 20 e 176 m, e due pozzi verticali profondi circa 35 m. La più celebre, Vrelo,
      sulla sponda destra della Treska, è entrata nella rosa dei 77 migliori siti naturali al mondo del
      progetto New7Wonders of Nature. Presenta due laghi interni sul fondo e, al centro, una colossale
      concrezione chiamata la Pigna. La profondità esatta non è nota, ma è ritenuta una delle grotte allagate
      più profonde d'Europa o del pianeta.
    wildlife: >-
      Circa il 20 % delle piante di Matka è endemico e vegeta solo in questo canyon. La forra è l'habitat di
      77 specie autoctone di farfalle e della [vipera dal corno](/especie/vipera_ammodytes/), il serpente più
      velenoso dell'Europa meridionale. Nelle grotte trovano rifugio numerose colonie di pipistrelli. Tra i
      rapaci delle pareti spiccano l' [aquila reale](/especie/aquila_chrysaetos/) e il
      [grifone](/especie/gyps_fulvus/).


      La stagione escursionistica si sviluppa da Pasqua a novembre.
    visit: >-
      Matka si visita a piedi oppure pagaiando in kayak lungo la Treska. È uno dei comprensori montani più
      noti della Macedonia del Nord, con una stagione che va da Pasqua a novembre.


      Presso la centrale idroelettrica di Matka, nella gola, nel comune di Saraj, il Centro Espositivo Matka
      illustra a tutti i visitatori i segreti e le applicazioni dell'energia elettrica.
    history: >-
      Il canyon custodisce diversi monasteri. Quello di Sant'Andrea, nella stretta della Treska, fu fondato
      intorno al 1388 da Andrea, fratello del principe Marko. Il monastero di Matka risale al XIV secolo e
      sorge sulla riva sinistra della Treska; stando a un'iscrizione, nel 1497 una donna di nome Milica lo
      trovò in rovina e senza tetto e ne curò il ripristino. San Nicola Šiševski sorge su una rupe a
      strapiombo sopra il canyon e sopra Sant'Andrea; la sua iconostasi fu dipinta nel 1645 e la parete ovest
      fu affrescata nel 1630.
    before: Verifica gli orari e le modalità di visita alle grotte prima di metterti in cammino.
    around: >-
      Il [Parco Nazionale dei Monti Šar](/lugar/nacionalni-park-sar-planina/) è l'area protetta più vicina
      registrata nell'atlas.
  pt:
    intro: >-
      Um rio retido por um paredão, uma albufeira com sete quilómetros de comprimento e apenas 120 metros de
      largura, e sob ela uma gruta cuja profundidade exata ainda ninguém conseguiu medir. Matka é o
      desfiladeiro do Treska, a oeste do centro de Escópia, na Macedónia do Norte. Ocupa cerca de 5.000
      hectares e é um dos destinos de ar livre mais populares do país, abrigando vários mosteiros medievais
      nas suas escarpas.
    landscape: >-
      O Treska escavou o desfiladeiro e, em 1938, a barragem de Santo André susteve as águas, originando o
      lago Matka, a albufeira artificial mais antiga do país. Mede até 7 km de comprimento e 120 m de largura,
      servindo para gerar eletricidade e irrigar as aldeias vizinhas.


      Sob a superfície e pelas paredes de rocha, o relevo cárstico moldou o subsolo. O canhão reúne dez
      grutas, com comprimentos entre 20 e 176 m, e dois algares verticais com cerca de 35 m de profundidade. A
      mais famosa, Vrelo, na margem direita do Treska, integrou a lista dos 77 melhores sítios naturais do
      mundo do projeto New7Wonders of Nature. Guarda dois lagos interiores no fundo e, ao centro, uma grande
      formação estalagmitica apelidada de Pinha. A profundidade exata é desconhecida, embora se aponte como
      uma das grutas inundadas mais fundas da Europa ou do mundo.
    wildlife: >-
      Aproximadamente 20 % das plantas de Matka são endémicas e só ali ocorrem. A garganta serve de habitat a
      77 espécies autóctones de borboletas e à [víbora-cornuda](/especie/vipera_ammodytes/), a serpente mais
      venenosa do sul da Europa. As cavernas acolhem grandes colónias de morcegos. Entre as rapinas das
      escarpas destacam-se a [águia-real](/especie/aquila_chrysaetos/) e o [grifo](/especie/gyps_fulvus/).


      A época de caminhadas estende-se da Páscoa a novembro.
    visit: >-
      Matka explora-se a pé ou de caiaque ao longo do Treska. Trata-se de uma das principais áreas de
      montanhismo da Macedónia do Norte, com a temporada a arrancar na Páscoa e a fechar em novembro.


      Junto à central hidroelétrica de Matka, dentro da garganta, no município de Saraj, funciona o Centro de
      Exposições Matka, que explica o mundo da eletricidade a qualquer visitante curioso.
    history: >-
      O canhão alberga vários mosteiros. O de Santo André, na garganta do Treska, foi fundado por volta de
      1388 por André, irmão do príncipe Marko. O mosteiro de Matka foi erguido no século catorze na margem
      esquerda do rio; segundo uma inscrição, em 1497 uma mulher chamada Milica encontrou a igreja em ruínas e
      sem telhado e financiou o restauro. São Nicolau Šiševski ergue-se numa escarpa alcantilada sobre o
      canhão e sobre Santo André; a sua iconóstase foi pintada em 1645 e a parede oeste decorada com frescos
      em 1630.
    before: Verifica antes de ir os horários e o funcionamento dos passeios de barco e visitas às grutas.
    around: >-
      O [Parque Nacional dos Montes Šar](/lugar/nacionalni-park-sar-planina/) é o espaço protegido mais
      próximo listado no atlas.
