  fr: >-
    Ici, un canyon calcaire, un lac de barrage de 1938 et l'une des cavités noyées les plus profondes d'Europe
    se découvrent lors d'une même escapade depuis la capitale.
  de: >-
    Hier lassen sich eine Kalksteinschlucht, ein Stausee von 1938 und eine der tiefsten Unterwasserhöhlen
    Europas bei einem einzigen Ausflug von der Hauptstadt aus erleben.
  it: >-
    Qui un canyon calcareo, un lago artificiale del 1938 e una delle cavità allagate più profonde d'Europa
    convivono in una sola escursione dalla capitale.
  pt: >-
    Aqui um desfiladeiro calcário, uma albufeira de 1938 e uma das grutas submersas mais fundas da Europa
    reúnem-se numa só visita a partir da capital.
