resumen:
  es: >-
    Rañas abiertas, sierras de bosque mediterráneo y riberas donde conocer los hábitats del ciervo, el buitre
    negro y el águila imperial ibérica.
  en: >-
    Open rañas, Mediterranean forested mountain ranges, and riverbanks where you can discover the habitats of
    the red deer, cinereous vulture, and Spanish imperial eagle.
  fr: >-
    Rañas ouvertes, sierras de forêt méditerranéenne et berges fluviales où découvrir les habitats du cerf
    élaphe, du vautour moine et de l'aigle ibérique.
  de: >-
    Offene Rañas, bewaldete Bergrücken des mediterranen Waldes und Flussuferauen, in denen du die Lebensräume
    von Rothirsch, Mönchsgeier und Spanischem Kaiseradler kennenlernen kannst.
  it: >-
    Rañas aperte, rilievi di foresta mediterranea e sponde fluviali dove scoprire gli habitat del cervo,
    dell'avvoltoio monaco e dell'aquila imperiale iberica.
  pt: >-
    Rañas abertas, serras de bosque mediterrânico e margens fluviais onde podes conhecer os habitats do
    veado-vermelho, do abutre-preto e da águia-imperial-ibérica.
unico:
  es: >-
    La raña abierta y las sierras boscosas, juntas, cuentan cómo la geología y los usos humanos han modelado
    el monte mediterráneo.
  en: >-
    The open raña and the forested mountain ridges together tell the story of how geology and human practices
    shaped the Mediterranean woodland.
  fr: >-
    La raña ouverte et les sierras boisées racontent ensemble comment la géologie et les activités humaines
    ont façonné la forêt méditerranéenne.
  de: >-
    Die offene Raña und die bewaldeten Gebirgszüge erzählen gemeinsam, wie Geologie und historische Nutzungen
    den mediterranen Bergwald geformt haben.
  it: >-
    La raña aperta e i rilievi boscosi raccontano insieme come la geologia e gli usi umani abbiano plasmato il
    bosco mediterraneo.
  pt: >-
    A raña aberta e as serras arborizadas contam em conjunto como a geologia e as práticas humanas moldaram o
    monte mediterrânico.
observaciones:
  es: >-
    Está prohibido salirse de las sendas marcadas, así que permanece en ellas. Consulta los avisos: los días
    de apertura de Horcajo, Torre de Abraham y los puntos municipales varían con la época del año. En octubre
    de 2026, la exposición y la maqueta de Casa Palillos estaban cerradas por remodelación, igual que el
    Zoorama de Retuerta. Los perros van con correa en las rutas y no entran en los centros de visitantes.
    Lleva agua.
texto:
  es:
    intro: >-
      En otoño, en una llanura poco arbolada de los Montes de Toledo, los ciervos machos se enfrentan en la
      berrea mientras tú los miras desde lejos. Esa escena resume Cabañeros. El parque nacional, entre Ciudad
      Real y Toledo, reúne rañas abiertas, sierras de bosque mediterráneo y cauces de agua, y cada ambiente
      pide una manera distinta de recorrerlo: observar animales a distancia, caminar bajo los árboles o buscar
      en las rocas las huellas de un antiguo mar.
    landscape: >-
      Hay que retroceder hasta un mar primitivo. Los sedimentos acumulados en aquel fondo marino soportaron
      enormes presiones por el choque de placas tectónicas; se plegaron, se fracturaron y emergieron a la
      superficie. De ahí salen las sierras. La cuarcita forma relieves resistentes y pedrizas: canchales de
      fragmentos desprendidos por los hielos y deshielos continuos del pasado.


      Al pie de los montes, otra historia. En periodos fríos y secos, violentas avenidas de agua y coladas de
      fango fueron depositando materiales en inmensas llanuras: las rañas.


      El arbolado lo dominan cuatro Quercus, árboles de crecimiento lento y amplia copa, y cada uno elige su
      sitio según el agua. La encina es la más adaptada a la escasez; el quejigo y el alcornoque prefieren
      zonas algo más húmedas; el roble melojo, o rebollo, necesita más agua y crece cerca de los cauces o en
      las zonas altas. Los bosques más abundantes son los encinares, alcornocales, quejigares y rebollares,
      con bosque de ribera alrededor de los cursos fluviales. El jaral-brezal es el matorral más extendido, y
      en las laderas acompañan al arbolado el madroño, el durillo, el romero, los brezos y las jaras.


      El clima marca todo lo demás: sequía en verano, nieves ocasionales en invierno y lluvias variables en
      primavera y otoño, que alcanzan los 550-600 mm anuales. El agua da otro carácter al parque. Hay unos 40
      km de ríos permanentes y unos mil arroyos temporales, tributarios del Tajo o del Guadiana; el Bullaque
      limita el parque por el este y el Estena por el oeste, y ambos son afluentes del Guadiana. En los fondos
      de algunos valles se forman turberas, testigos de tiempos pasados, con mirto de Brabante y plantas
      carnívoras como la atrapamoscas o la pingüícula.


      La flora lo confirma: más de mil plantas vasculares y cerca de 550 especies de líquenes, una quinta
      parte de las presentes en la Península Ibérica. Esa riqueza se debe sobre todo al excelente estado de
      conservación de los 17 hábitats de interés comunitario del parque y a la ausencia de contaminación
      ambiental.
    wildlife: >-
      La raña es el escenario de los [ciervos](/especie/cervus_elaphus/): grandes grupos de hembras con crías
      en primavera y, en otoño, los beligerantes encuentros entre los machos durante la berrea. Mírala desde
      lejos. Con las primeras luces del alba, grupos de [jabalíes](/especie/sus_scrofa/) vuelven a la
      espesura. Cerca del crepúsculo, el elanio azul toma el relevo del cernícalo común y del
      [primilla](/especie/falco_naumanni/) en busca de ratones sobre los espacios abiertos.


      La llanura es también territorio de aves esteparias, como los alaúdidos calandria, cogujada montesina y
      terrera, y suenan los reclamos del [sisón](/especie/tetrax_tetrax/) y la perdiz roja.


      En las sierras, el [buitre negro](/especie/aegypius_monachus/) coloca sus voluminosos nidos en los
      grandes alcornoques situados por encima de las pedrizas. El [águila imperial
      ibérica](/especie/aquila_adalberti/), ave rapaz endémica y en peligro de extinción, símbolo de la
      biodiversidad de Cabañeros, encuentra refugio para reproducirse en los árboles más maduros. La [cigüeña
      negra](/especie/ciconia_nigra/), ave forestal y esquiva, elige árboles añosos y cursos de agua
      tranquilos para sus nidos. En los ríos viven la [nutria](/especie/lutra_lutra/), el mamífero acuático
      por excelencia del parque, y el jarabugo, un pequeño pez fluvial endémico y en peligro de extinción. Por
      eso algunas zonas necesitan tranquilidad: no busques los nidos.


      El año marca el ritmo. En el límite sur, el Observatorio de las Cigüeñas, de madera y con vistas a la
      raña, deja ver de primavera a otoño una nutrida colonia de [cigüeña blanca](/especie/ciconia_ciconia/)
      sobre quejigos y encinas. Y en primavera, dos cámaras web de Casa Palillos permiten seguir en directo el
      interior de un nido de lechuza y otro de cernícalo primilla.
    visit: >-
      Empieza en Horcajo de los Montes, donde está el centro principal de visitantes. Su exposición muestra
      los ecosistemas de Cabañeros a lo largo de las cuatro estaciones y tiene una quintería sobre la cultura
      y las tradiciones de la comarca. Torre de Abraham se dedica al agua, con una pequeña pero interesante
      exposición y una maqueta sobre los bosques de ribera y una senda botánica sobre pasarelas junto al
      Bullaque, accesible para personas con movilidad reducida. Su mirador del embalse tiene tres paneles
      interpretativos y vistas muy amplias a la masa de agua y a la raña de Retuerta.


      Las rutas piden esfuerzos distintos. La Plaza de los Moros es una circular de 3,5 km y 150 m de
      desnivel. El Boquerón del Estena suma 6 km de ida y vuelta desde el aparcamiento. Desde Los
      Navalucillos, donde una pequeña caseta de madera marca el inicio de las rutas del Chorro, Chorrera
      Chica, Rocigalgo y la ruta de la Encina, la subida al Chorro tiene 4,2 km solo de ida y 200 m de
      desnivel: cuenta también con el regreso. Mejor una ruta con tiempo que varias con prisa.


      Los pueblos completan la visita. Alcoba guarda un museo etnográfico sobre las tradiciones pastoriles y
      agropecuarias de los Montes de Toledo, y en Casa Palillos, junto a la carretera de Pueblonuevo del
      Bullaque a Santa Quiteria, hay una senda botánica y otra etnográfica, ambas accesibles. En Navas de
      Estena, el punto de información tiene una pequeña exposición sobre el bandolerismo en la zona y sobre
      los valores naturales del entorno, y el área de la Tabla del Acebo y las Fuentes ofrece una pasarela
      accesible cerca de la orilla del río Estena. Retuerta tiene el Zoorama, concebido como punto de
      información y centro temático sobre la fauna del parque. Para las visitas guiadas, el centro de Pueblo
      Nuevo del Bullaque informa por teléfono y las reserva.
    history: >-
      El nombre lo cuenta: Cabañeros viene de las cabañas de pastores y carboneros. Parte de la raña se roturó
      para cereal, y de ahí su aspecto actual de herbazal arbolado. El 20 de noviembre de 1995, las Cortes
      aprobaron la Ley 33/1995, que declaró formalmente el Parque Nacional de Cabañeros. Su Plan Rector de Uso
      y Gestión se aprobó mediante el Decreto 69/2021, de 1 de junio, y entre las medidas de conservación del
      gestor figura minimizar las molestias humanas en los periodos sensibles de nidificación.


      El gran reto de conservación se ve menos que los ciervos: el rebollo apenas se regenera, por la sequía
      estival y por la presión de los ungulados, y proteger el bosque exige que crezcan árboles nuevos.
    before: >-
      Está prohibido salirse de las sendas marcadas, así que permanece en ellas. Consulta los avisos: los días
      de apertura de Horcajo, Torre de Abraham y los puntos municipales varían con la época del año. En
      octubre de 2026, la exposición y la maqueta de Casa Palillos estaban cerradas por remodelación, igual
      que el Zoorama de Retuerta. Los perros van con correa en las rutas y no entran en los centros de
      visitantes. Lleva agua.
    around: >-
      Cabañeros se recorre por sus pueblos: Horcajo de los Montes, Alcoba, Retuerta del Bullaque, Navas de
      Estena y Los Navalucillos. No tiene vecinos cercanos en el atlas, pero sí lugares afines por especies y
      hábitats.


      Con el [Parque Natural Despeñaperros y Sierra Morena
      Oriental](/lugar/sierra-morena-oriental---despenaperros/) y el [Parque Natural Sierra de
      Andújar](/lugar/parque-natural-sierra-de-andujar/) comparte [lince ibérico](/especie/lynx_pardinus/),
      águila imperial ibérica y buitre negro, además del bosque maduro; Andújar suma también el corredor
      fluvial. La [Reserva Natural de la Sierra de Malcata](/lugar/reserva-natural-da-serra-da-malcata/)
      coincide en lince ibérico, buitre negro y cigüeña negra. Y el [Río Drava y Llanura de
      Inundación](/lugar/drava-river---floodplain/) comparte la cigüeña negra y la nutria, con bosque maduro y
      corredor fluvial.
  en:
    intro: >-
      In autumn, across a sparsely wooded plain in the Montes de Toledo, male deer clash during the rut while
      you watch them from a distance. That scene epitomises Cabañeros. The national park, lying between Ciudad
      Real and Toledo, combines open rañas, Mediterranean forested mountain ranges, and river channels, with
      each environment inviting a distinct way of exploring: watching wildlife from afar, walking beneath
      ancient tree canopies, or searching rocky strata for traces of a primeval ocean.
    landscape: >-
      One must journey back to a primeval sea. Sediments accumulating on that ancient ocean floor endured
      intense compression from colliding tectonic plates; they folded, fractured, and were pushed up to the
      surface. From this process arose the mountain ranges. Resilient quartzite shapes elevated ridges and
      pedrizas: boulder slopes formed from fragments broken loose by past freeze-thaw cycles.


      At the foot of the mountains, a different process unfolded. During cold, arid epochs, torrential flash
      floods and mudflows laid down vast sheets of detritus across immense plains: the rañas.


      The tree canopy is dominated by four Quercus species, slow-growing trees with broad crowns, each
      claiming its niche according to water availability. The holm oak is best suited to drought; the
      Portuguese oak and cork oak favour slightly more humid areas; the Pyrenean oak demands the most
      moisture, thriving along watercourses or higher slopes. The most widespread woodlands are holm oak
      woods, cork oak groves, gall oak stands, and Pyrenean oak forests, flanked by riparian gallery woods
      along river courses. Rockrose and heather scrub represents the most common understorey, while hillsides
      host strawberry trees, laurestine, rosemary, heather, and cistus alongside the trees.


      The climate governs everything else: summer drought, occasional winter snowfall, and variable
      precipitation in spring and autumn, yielding 550-600 mm annually. Water gives the park a distinct
      character. There are around 40 km of perennial rivers and about a thousand temporary streams, flowing
      toward the Tagus or the Guadiana; the Bullaque bounds the park to the east and the Estena to the west,
      both feeding the Guadiana. In certain valley bottoms, relic peat bogs persist from earlier epochs,
      supporting sweet gale and carnivorous plants such as sundew and butterwort.


      The botanical variety reflects this history: over a thousand vascular plant species and nearly 550
      lichen species, accounting for a fifth of all species recorded in the Iberian Peninsula. This richness
      stems above all from the pristine conservation status of the park's 17 habitats of community interest
      and the absence of airborne pollutants.
    wildlife: >-
      The raña is the great stage for [red deer](/especie/cervus_elaphus/): large maternal nursery herds in
      spring and, come autumn, ferocious clashes between stags during the rut. Observe them from afar. In the
      first light of dawn, sounders of [wild boars](/especie/sus_scrofa/) withdraw into thickets. Near dusk,
      the black-winged kite takes over from the common kestrel and [lesser kestrel](/especie/falco_naumanni/),
      hunting rodents across open ground.


      The open plain also shelters steppe birds, including the calandra lark, Thekla's lark, and short-toed
      lark, while the distinct calls of the [little bustard](/especie/tetrax_tetrax/) and red-legged partridge
      echo through the grass.


      On the rocky heights, the [cinereous vulture](/especie/aegypius_monachus/) builds bulky stick nests in
      venerable cork oaks anchored above boulder screes. The [Spanish imperial
      eagle](/especie/aquila_adalberti/), an endemic and endangered raptor that symbolises Cabañeros'
      biodiversity, finds secluded nesting sites among mature trees. The shy, forest-dwelling [black
      stork](/especie/ciconia_nigra/) selects aged trees near quiet streams for breeding. Rivers sustain the
      [Eurasian otter](/especie/lutra_lutra/), the park's quintessential aquatic mammal, alongside the
      jarabugo, a small, highly endangered endemic river fish. For this reason, delicate zones demand peace:
      never seek out nesting sites.


      The cycle of seasons sets the tempo. At the southern boundary, the timber Cigüeñas Observatory overlooks
      the open raña, offering panoramic views from spring through autumn of a thriving colony of [white
      storks](/especie/ciconia_ciconia/) nesting in gall and holm oaks. In spring, two live webcams at Casa
      Palillos stream views from inside a barn owl nest and a lesser kestrel nest.
    visit: >-
      Begin in Horcajo de los Montes, home to the main visitor centre. Its exhibition details Cabañeros'
      ecosystems through the four seasons and includes a traditional quintería display on local folk culture.
      Torre de Abraham focuses on water ecology, offering an engaging exhibition, a river woodland model, and
      an accessible boardwalk trail along the Bullaque for visitors with reduced mobility. Its reservoir
      viewpoint features three interpretive panels overlooking the lake and the Retuerta raña.


      Trails cater to varying abilities. Plaza de los Moros is a circular trail measuring 3.5 km with 150 m of
      elevation gain. The Boquerón del Estena route covers 6 km round-trip from its trailhead parking area.
      From Los Navalucillos, where a wooden cabin marks access to El Chorro, Chorrera Chica, Rocigalgo, and
      the Encina trail, the climb to El Chorro spans 4.2 km one-way with 200 m of ascent: remember to budget
      time for the return leg. Selecting one leisurely trail is far more rewarding than rushing across
      multiple paths.


      Surrounding hamlets round off the excursion. Alcoba hosts an ethnographic museum highlighting pastoral
      and agrarian heritage in the Montes de Toledo, while Casa Palillos, off the road between Pueblonuevo del
      Bullaque and Santa Quiteria, offers accessible botanical and ethnographic trails. In Navas de Estena,
      the information post features an exhibit on historic banditry and local natural heritage, alongside an
      accessible boardwalk at Tabla del Acebo near the Estena riverbank. Retuerta hosts the Zoorama fauna
      interpretive centre. For guided excursions, the visitor point at Pueblonuevo del Bullaque provides
      details and manages bookings by phone.


      Plan your day calmly and take time to absorb the vast horizons.
    history: >-
      The park's name reveals its past: Cabañeros derives from the rustic huts (cabañas) of shepherds and
      charcoal-burners. Sections of the open plain were formerly cleared for cereal farming, resulting in its
      modern open woodland silhouette. On 20 November 1995, Parliament enacted Law 33/1995, establishing
      Cabañeros National Park. Its Master Plan for Use and Management was adopted via Decree 69/2021 on 1
      June, incorporating conservation measures that limit disturbance during sensitive bird nesting cycles.


      The most pressing conservation dilemma remains less conspicuous than the deer herds: Pyrenean oak stands
      struggle to regenerate due to summer heat and browsing pressure from ungulates, meaning protective
      stewardship is vital for sapling survival.
    before: >-
      Straying from marked tracks is strictly prohibited, so remain on designated paths. Check local
      timetables: opening schedules for Horcajo, Torre de Abraham, and village desks vary seasonally. In
      October 2026, the exhibition and model at Casa Palillos were temporarily closed for refurbishment, as
      was Retuerta's Zoorama. Dogs must remain leashed on trails and are not allowed inside visitor buildings.
      Always carry plenty of drinking water.
    around: >-
      Exploring Cabañeros takes you through its gateway villages: Horcajo de los Montes, Alcoba, Retuerta del
      Bullaque, Navas de Estena, and Los Navalucillos. While it has no adjoining neighbours in this atlas, it
      shares ecological affinities with several protected reserves.


      It shares populations of [Iberian lynx](/especie/lynx_pardinus/), Spanish imperial eagle, and cinereous
      vulture, as well as old-growth Mediterranean woods, with both [Parque Natural Despeñaperros y Sierra
      Morena Oriental](/lugar/sierra-morena-oriental---despenaperros/) and [Parque Natural Sierra de
      Andújar](/lugar/parque-natural-sierra-de-andujar/), the latter also featuring an intact river corridor.
      [Reserva Natural de la Sierra de Malcata](/lugar/reserva-natural-da-serra-da-malcata/) mirrors its
      Iberian lynx, cinereous vulture, and black stork habitats. Furthermore, [Río Drava y Llanura de
      Inundación](/lugar/drava-river---floodplain/) shares the black stork and Eurasian otter within its
      mature woodland and riparian river corridor.
  fr:
    intro: >-
      En automne, sur une plaine peu boisée des monts de Tolède, les cerfs mâles s'affrontent pendant le brame
      tandis que vous les observez de loin. Cette scène résume Cabañeros. Le parc national, situé entre Ciudad
      Real et Tolède, rassemble des rañas ouvertes, des sierras de forêt méditerranéenne et des cours d'eau,
      chaque milieu invitant à une découverte spécifique : guetter la faune à distance, marcher sous la
      frondaison des arbres ou rechercher dans les strates rocheuses les traces d'une mer disparue.
    landscape: >-
      Il faut remonter jusqu'à une mer primitive. Les sédiments accumulés au fond de cet océan ancien ont subi
      des pressions colossales lors de la collision des plaques tectoniques ; ils ont plissé, fracturé et
      émergé à la surface. De là sont nées les sierras. Le quartzite façonne des reliefs résistants et des
      pierriers : d'immenses éboulis issus des gels et dégels répétés du passé.


      Au pied des monts se déroule une autre histoire. Durant les périodes froides et sèches, de violentes
      crues et coulées boueuses ont déposé des matériaux détritiques sur de vastes plaines : les rañas.


      Le couvert forestier est dominé par quatre espèces de Quercus, des arbres à croissance lente et large
      ramure, chacun s'établissant selon la disponibilité en eau. Le chêne vert est le plus résistant à la
      sécheresse ; le chêne faginé et le chêne-liège préfèrent des secteurs plus humides ; le chêne tauzin
      réclame davantage d'humidité et se développe près des ruisseaux ou en altitude. Les peuplements
      dominants sont les chênaies vertes, les suberaies, les chênaies faginées et les chênaies tauzins,
      bordées de forêts riveraines le long des cours d'eau. La lande à cistes et bruyères forme le maquis le
      plus étendu, tandis que les versants abritent arbousiers, viornes tin, romarins, bruyères et cistes aux
      côtés des grands arbres.


      Le climat régit l'ensemble : aridité estivale, neiges occasionnelles en hiver et pluies irrégulières au
      printemps et en automne, totalisant 550-600 mm par an. L'eau confère au parc toute sa personnalité. On
      compte environ 40 km de cours d'eau permanents et un millier de ruisseaux temporaires, affluents du Tage
      ou du Guadiana ; le Bullaque borde le parc à l'est et l'Estena à l'ouest, tous deux rejoignant le
      Guadiana. Dans les fonds de certaines vallées se nichent des tourbières reliques, témoins d'époques
      révolues, abritant le piment royal et des plantes carnivores telles que la droséra ou la grassette.


      La flore confirme cette singularité : plus d'un millier de plantes vasculaires et près de 550 espèces de
      lichens, représentant un cinquième des espèces recensées dans la péninsule Ibérique. Cette diversité
      exceptionnelle tient à l'excellent état de conservation des 17 habitats d'intérêt communautaire du parc
      et à l'absence de pollutions atmosphériques.
    wildlife: >-
      La raña est le royaume des [cerfs élaphes](/especie/cervus_elaphus/) : hardes de biches et de faons au
      printemps, et joutes spectaculaires entre grands mâles à l'automne pendant le brame. Observez-les à
      distance respectable. Dès l'aube, des hardes de [sangliers](/especie/sus_scrofa/) regagnent les
      sous-bois denses. Au crépuscule, l'élanion blanc relaie le faucon crécerelle et le [faucon
      crécerellette](/especie/falco_naumanni/) pour chasser les micromammifères en terrain découvert.


      La vaste plaine abrite également des passereaux steppiques comme le cochevis de Thékla, l'alouette
      calandre et l'alouette pispolette, tandis que résonnent les appels de l'[outarde
      canepetière](/especie/tetrax_tetrax/) et de la perdrix rouge.


      Dans les reliefs escarpés, le [vautour moine](/especie/aegypius_monachus/) bâtit d'imposants nids
      branchus sur de vieux chênes-lièges dominant les pierriers. L'[aigle
      ibérique](/especie/aquila_adalberti/), rapace endémique menacé d'extinction et emblème de la
      biodiversité de Cabañeros, trouve refuge pour sa nidification dans les houppiers les plus matures. La
      discrète [cigogne noire](/especie/ciconia_nigra/) choisit de vénérables arbres proches d'eaux calmes
      pour installer son aire. Dans les cours d'eau vivent la [loutre d'Europe](/especie/lutra_lutra/),
      mammifère aquatique emblématique du parc, ainsi que le jarabugo, petit poisson d'eau douce endémique en
      danger critique. C'est pourquoi certains secteurs exigent une quiétude totale : ne cherchez jamais à
      approcher les nids.


      Le fil des saisons orchestre la vie du parc. À la limite sud, l'observatoire en bois des Cigognes,
      tourné vers la raña, permet d'observer du printemps à l'automne une importante colonie de [cigognes
      blanches](/especie/ciconia_ciconia/) juchées sur des chênes. Au printemps, deux caméras en direct à Casa
      Palillos permettent d'épier l'intimité d'un nid d'effraie des clochers et d'un nid de faucon
      crécerellette.
    visit: >-
      Commencez à Horcajo de los Montes, où se trouve le centre d'accueil principal. Son exposition détaille
      les écosystèmes du parc au fil des quatre saisons et abrite une quintería traditionnelle consacrée aux
      coutumes locales. Torre de Abraham se consacre aux milieux aquatiques avec une exposition didactique,
      une maquette des ripisylves et une passerelle botanique sur pilotis le long du Bullaque, accessible aux
      personnes à mobilité réduite. Son belvédère sur le lac de retenue propose trois panneaux
      d'interprétation et de superbes panoramas sur le plan d'eau et la raña de Retuerta.


      Les randonnées s'adaptent à toutes les envies. La Plaza de los Moros forme une boucle de 3,5 km pour 150
      m de dénivelé. Le Boquerón del Estena compte 6 km aller-retour depuis son aire de stationnement. Depuis
      Los Navalucillos, où un petit chalet en bois marque le départ des sentiers du Chorro, de la Chorrera
      Chica, du Rocigalgo et de la Encina, l'ascension vers le Chorro nécessite 4,2 km à l'aller et 200 m de
      dénivelé : prévoyez impérativement le temps du retour. Mieux vaut savourer un seul itinéraire avec calme
      que d'en enchaîner plusieurs avec précipitation.


      Les villages environnants enrichissent la découverte. Alcoba abrite un musée ethnographique dédié aux
      traditions pastorales et agricoles des monts de Tolède, tandis qu'à Casa Palillos, le long de la route
      de Pueblonuevo del Bullaque à Santa Quiteria, serpente un double sentier botanique et ethnographique
      accessible. À Navas de Estena, le relais d'information propose une petite salle sur le banditisme
      d'antan et la géologie locale, et le secteur de la Tabla del Acebo offre une promenade aménagée en
      bordure de l'Estena. Retuerta abrite le centre thématique Zoorama dédié à la faune. Pour les sorties
      guidées, le centre de Pueblonuevo del Bullaque renseigne et gère les réservations par téléphone.
    history: >-
      Le nom du parc en dit long : Cabañeros tire son origine des cabanes rudimentaires (cabañas) bâties par
      les bergers et charbonniers. Des portions de la plaine furent autrefois défrichées pour la culture des
      céréales, donnant naissance à cette savane boisée actuelle. Le 20 novembre 1995, le Parlement a voté la
      loi 33/1995 déclarant officiellement le parc national de Cabañeros. Son plan directeur de gestion a été
      ratifié par le décret 69/2021 du 1er juin, imposant des mesures de sauvegarde strictes pour réduire les
      dérangements anthropiques durant les périodes de reproduction aviaire.


      Le défi de conservation le plus aigu demeure bien plus discret que les hardes de cervidés : le chêne
      tauzin peine à se régénérer face aux sécheresses estivales et à la dent du gibier, rendant indispensable
      la protection active des jeunes pousses.
    before: >-
      Le bivouac et le camping sauvage sont formellement interdits ; vous devez impérativement rester sur les
      pistes balisées. Vérifiez les horaires d'ouverture : les périodes d'accès à Horcajo, Torre de Abraham et
      aux centres municipaux fluctuent selon la saison. En octobre 2026, l'espace muséographique et la
      maquette de Casa Palillos étaient temporairement fermés pour réaménagement, tout comme le Zoorama de
      Retuerta. Les chiens doivent obligatoirement être tenus en laisse sur les sentiers et ne sont pas admis
      dans les centres d'accueil. Emportez toujours de l'eau en quantité suffisante.
    around: >-
      La découverte de Cabañeros s'articule autour de ses villages portes : Horcajo de los Montes, Alcoba,
      Retuerta del Bullaque, Navas de Estena et Los Navalucillos. Le site ne possède pas de voisin contigu
      dans l'atlas, mais partage des communautés vivantes comparables avec d'autres espaces protégés.


      Il partage la présence du [lynx pardelle](/especie/lynx_pardinus/), de l'aigle ibérique et du vautour
      moine, en plus de massifs boisés méditerranéens matures, avec le [Parque Natural Despeñaperros y Sierra
      Morena Oriental](/lugar/sierra-morena-oriental---despenaperros/) et le [Parque Natural Sierra de
      Andújar](/lugar/parque-natural-sierra-de-andujar/), ce dernier possédant en outre un corridor alluvial
      semblable. La [Reserva Natural de la Sierra de Malcata](/lugar/reserva-natural-da-serra-da-malcata/)
      abrite également lynx pardelle, vautour moine et cigogne noire. Enfin, le [Río Drava y Llanura de
      Inundación](/lugar/drava-river---floodplain/) accueille la cigogne noire et la loutre d'Europe au cœur
      de ripisylves et de vieilles forêts.
  de:
    intro: >-
      Im Herbst stehen sich auf einer weitläufigen, schütter bewaldeten Hochebene der Montes de Toledo die
      Hirsche zur Brunft gegenüber, während du das Geschehen aus gebührendem Abstand verfolgst. Dieses Bild
      bringt Cabañeros auf den Punkt. Der Nationalpark zwischen Ciudad Real und Toledo vereint offene Rañas,
      bewaldete mediterrane Höhenzüge und Wasserläufe; jede Landschaftsform verlangt nach einer ganz eigenen
      Herangehensweise: Wildtiere aus der Ferne beobachten, unter alten Baumkronen wandern oder in den
      Gesteinsschichten nach Relikten eines urzeitlichen Meeres forschen.
    landscape: >-
      Man muss bis zu einem Urozean zurückblicken. Die auf jenem Meeresgrund abgelagerten Sedimente hielten
      gewaltigen Drücken durch kollidierende tektonische Platten stand; sie wurden gefaltet, zerbrachen und
      stiegen an die Erdoberfläche. So entstanden die Sierras. Widerstandsfähiger Quarzit formt markante
      Härtlingsrücken und Blockmeere: ausgedehnte Schutthalden aus Gesteinstrümmern, die einst durch
      wiederholtes Gefrieren und Auftauen abgesprengt wurden.


      Am Fuße der Höhenzüge spielte sich eine andere Geschichte ab. In kalten und trockenen Epochen lagerten
      reißende Schlamm- und Geröllfluten gewaltige Sedimentpakete in weiten Ebenen ab: die sogenannten Rañas.


      Der Baumbestand wird von vier Quercus-Arten geprägt, langsam wachsenden Eichen mit ausladenden Kronen,
      die ihren Standort nach der Wasserverfügbarkeit wählen. Die Steineiche erträgt Trockenheit am besten;
      Portugiesische Eiche und Korkeiche bevorzugen feuchtere Senken; die Pyrenäen-Eiche benötigt das meiste
      Wasser und wächst vor allem an Flussufern oder in Hochlagen. Die dominierenden Waldgesellschaften sind
      Steineichen-, Korkeichen-, Gallapfeleichen- und Pyrenäen-Eichenwälder, gesäumt von uferbegleitenden
      Galeriewäldern. Zistrosen- und Heidegebüsche bilden das weiteste Gestrüpp, während Erdbeerbaum,
      Steinlinde, Rosmarin, Baumheide und Zistrosen die Berghänge unter den Baumkronen kleiden.


      Das Regionalklima bestimmt alle Lebenszyklen: sommerliche Dürre, vereinzelter Schneefall im Winter und
      schwankende Niederschläge im Frühjahr und Herbst, die jährlich 550-600 mm erreichen. Das Wasser verleiht
      dem Park sein Gepräge. Rund 40 km permanente Flussabschnitte und rund tausend temporäre Bäche fließen
      dem Tajo oder dem Guadiana zu; der Bullaque begrenzt das Gebiet im Osten, der Estena im Westen, beides
      Zuflüsse des Guadiana. Auf einigen Talböden überdauern Moorflächen aus kälteren Zeitaltern, bewachsen
      mit Gagelstrauch und fleischfressenden Pflanzen wie Sonnentau und Fettkraut.


      Die Pflanzenwelt unterstreicht diese Vielfalt: über tausend Gefäßpflanzen und fast 550 Flechtenarten,
      was einem Fünftel aller auf der Iberischen Halbinsel vorkommenden Arten entspricht. Dieser Reichtum
      beruht vor allem auf dem hervorragenden Erhaltungszustand der 17 FFH-Lebensraumtypen des Parks und der
      völligen Abwesenheit von Industrieabgasen.
    wildlife: >-
      Die offene Raña ist der Schauplatz der [Rothirsche](/especie/cervus_elaphus/): im Frühjahr große
      Kahlwildrudel mit Jungtieren, im Herbst das lautstarke Kräftemessen der Hirsche während der Brunft.
      Beobachte sie stets mit Distanz. In der Morgendämmerung ziehen Rotten von
      [Wildschweinen](/especie/sus_scrofa/) ins schützende Dickicht zurück. Gegen Abend löst der Gleitaar den
      Turmfalken und den [Rötelfalken](/especie/falco_naumanni/) bei der Mäusejagd im offenen Gelände ab.


      Die Steppenebene dient auch Vögeln des Offenlandes als Brutgebiet, darunter Kalanderlerche, Theklalerche
      und Kurzzehenlerche, untermalt von den Rufen der [Zwergtrappe](/especie/tetrax_tetrax/) und des
      Rothuhns.


      In den Felsregionen errichtet der [Mönchsgeier](/especie/aegypius_monachus/) seine mächtigen Horste auf
      alten Korkeichen oberhalb der Schutthalden. Der [Spanische Kaiseradler](/especie/aquila_adalberti/), ein
      endemischer und gefährdeter Greifvogel und Wappentier von Cabañeros, findet in alten Baumkronen sichere
      Brutplätze. Der scheue Waldvogel [Schwarzstorch](/especie/ciconia_nigra/) wählt knorrige Bäume an
      ungestörten Wasserläufen für sein Nest. In den Flüssen jagen der [Fischotter](/especie/lutra_lutra/),
      das meisterhafte Wasserraubtier des Gebiets, und der Jarabugo, ein kleiner endemischer Karpfenfisch, der
      vom Aussterben bedroht ist. Deshalb erfordern sensible Zonen absolute Ruhe: Horste dürfen keinesfalls
      aufgesucht werden.


      Das Jahresrad setzt den Takt. An der Südgrenze gewährt die hölzerne Beobachtungshütte der Störche mit
      Blick auf die Raña von Frühling bis Herbst Einblick in eine große Kolonie des
      [Weißstorchs](/especie/ciconia_ciconia/) auf alten Eichen. Im Frühjahr übertragen zwei Webcams im
      Informationszentrum Casa Palillos Live-Bilder aus je einem Nistkasten von Schleiereule und Rötelfalke.
    visit: >-
      Beginne deinen Ausflug in Horcajo de los Montes, dem Hauptbesucherzentrum. Seine Dauerausstellung
      präsentiert die Ökosysteme des Parks im Wandel der vier Jahreszeiten sowie eine traditionelle quintería
      zur ländlichen Alltagskultur. Das Zentrum Torre de Abraham widmet sich dem Element Wasser; es bietet
      eine anschauliche Modellausstellung zu Auwäldern sowie einen barrierefreien Holzbohlenweg entlang des
      Bullaque. Die Aussichtsplattform an der Talsperre ist mit drei Schautafeln ausgestattet und bietet weite
      Blicke über das Gewässer und die Raña von Retuerta.


      Die Routen stellen unterschiedliche Anforderungen. Die Plaza de los Moros ist ein Rundweg von 3,5 km
      Länge und 150 Höhenmetern. Die Schluchtroute Boquerón del Estena erstreckt sich über 6 km hin und zurück
      ab dem Parkplatz. Von Los Navalucillos aus, wo ein Holzpavillon den Einstieg zu den Pfaden El Chorro,
      Chorrera Chica, Rocigalgo und Ruta de la Encina markiert, misst der Aufstieg zum Wasserfall El Chorro
      4,2 km einfache Strecke bei 200 Höhenmetern: plane ausreichend Zeit für den Rückweg ein. Es lohnt sich
      mehr, einen Weg in Ruhe zu gehen, als mehrere Wanderungen hastig aneinanderzureihen.


      Die Dörfer runden den Besuch ab. Alcoba zeigt ein Heimatmuseum zur Hirtenkultur der Montes de Toledo,
      während an der Casa Palillos an der Straße nach Santa Quiteria ein barrierefreier Lehrpfad zu Flora und
      Ethnografie verläuft. In Navas de Estena informiert eine Ausstellung über historisches Banditentum und
      Geologie, ergänzt durch einen Steg an der Tabla del Acebo am Estena-Fluss. Retuerta beherbergt das
      Zoorama mit Schwerpunkt auf der heimischen Fauna. Geführte Allradtouren vermittelt das Büro in
      Pueblonuevo del Bullaque telefonisch.
    history: >-
      Der Name erzählt von den Wurzeln: Cabañeros rührt von den einstigen Hütten (cabañas) der Hirten und
      Köhler her. Weite Bereiche der Raña wurden gerodet und ackerbaulich genutzt, woraus die heutige
      parkartige Baumsavanne hervorging. Am 20. November 1995 verabschiedete das Parlament das Gesetz 33/1995
      zur Gründung des Nationalparks Cabañeros. Der Bewirtschaftungsplan wurde durch Dekret 69/2021 vom 1.
      Juni in Kraft gesetzt; zu den Kernmaßnahmen zählt die Vermeidung von Störungen während der Brutzeiten
      bedrohter Vogelarten.


      Die größte waldökologische Herausforderung bleibt unauffälliger als das Hirschrudel: Die Pyrenäen-Eiche
      verjüngt sich wegen sommerlicher Dürreperioden und intensivem Wildverbiss kaum noch, sodass der Schutz
      von Jungbäumen oberste Priorität hat.
    before: >-
      Das Verlassen markierter Pfade ist strengstens verboten; bleibe stets auf den Wegen. Beachte die
      jahreszeitlich wechselnden Öffnungszeiten der Zentren in Horcajo, Torre de Abraham und den Ortschaften.
      Im Oktober 2026 waren die Ausstellung und das Geländemodell in Casa Palillos sowie das Zoorama in
      Retuerta wegen Modernisierungsarbeiten geschlossen. Hunde sind auf Wanderwegen an der kurzen Leine zu
      führen und in Innenräumen der Besucherzentren nicht gestattet. Führe ausreichend Trinkwasser mit.
    around: >-
      Ein Besuch von Cabañeros führt durch die umliegenden Pfortendörfer: Horcajo de los Montes, Alcoba,
      Retuerta del Bullaque, Navas de Estena und Los Navalucillos. Der Park besitzt keine direkten
      Nachbargebiete in diesem Atlas, teilt jedoch charakteristische Arten und Lebensräume mit verwandten
      Schutzgebieten.


      Mit dem [Parque Natural Despeñaperros y Sierra Morena
      Oriental](/lugar/sierra-morena-oriental---despenaperros/) und dem [Parque Natural Sierra de
      Andújar](/lugar/parque-natural-sierra-de-andujar/) teilt er Vorkommen von
      [Pardelluchs](/especie/lynx_pardinus/), Spanischem Kaiseradler und Mönchsgeier sowie reife mediterrane
      Wälder; Andújar weist zudem einen intakten Flusskorridor auf. Die [Reserva Natural de la Sierra de
      Malcata](/lugar/reserva-natural-da-serra-da-malcata/) beherbergt ebenfalls Pardelluchs, Mönchsgeier und
      Schwarzstorch. Der [Río Drava y Llanura de Inundación](/lugar/drava-river---floodplain/) teilt
      Schwarzstorch und Fischotter in naturnahen Auen- und Waldbiotopen.
  it:
    intro: >-
      In autunno, su una pianura poco alberata dei Montes de Toledo, i maschi di cervo si scontrano durante il
      bramito mentre tu li osservi da lontano. Questa scena riassume Cabañeros. Il parco nazionale, situato
      tra Ciudad Real e Toledo, unisce rañas aperte, rilievi di foresta mediterranea e corsi d'acqua; ogni
      ambiente richiede un approccio di visita diverso: osservare gli animali a distanza, camminare sotto la
      volta degli alberi o cercare negli strati rocciosi i fossili di un mare primordiale.
    landscape: >-
      Bisogna risalire a un mare primitivo. I sedimenti accumulati su quell'antico fondale oceanico sostennero
      enormi pressioni dovute allo scontro delle placche tettoniche; si piegarono, si fratturarono ed emersero
      in superficie. Da lì hanno origine le sierre. La quarzite dà forma a rilievi resistenti e pedrizas:
      pietraie formate da frammenti rocciosi staccati dai cicli passati di gelo e disgelo.


      Ai piedi dei monti si aprì un'altra storia. In epoche fredde e aride, violente alluvioni e colate di
      fango depositarono detriti su pianure immense: le rañas.


      Il manto forestale è dominato da quattro specie di Quercus, alberi a crescita lenta e chioma estesa,
      ciascuno legato alla disponibilità idrica del suolo. Il leccio resiste meglio alla siccità; il cerro
      sughero e la farnia iberica prediligono suoli più umidi; il rovere melojo richiede più acqua e cresce
      lungo le forre fluviali o alle quote superiori. I boschi prevalenti sono leccete, sugherete e querceti
      misti, contornati da corridoi ripariali lungo i corsi d'acqua. Brughiere e cisteti formano la macchia
      più diffusa, mentre sui versanti corbezzoli, viburni, rosmarini ed eriche accompagnano gli alberi d'alto
      fusto.


      Il clima modella ogni dinamica biologica: siccità estiva, nevicate saltuarie in inverno e piogge
      irregolari in primavera e autunno, con accumuli di 550-600 mm all'anno. L'acqua conferisce un'identità
      peculiare al parco. Vi scorrono circa 40 km di fiumi perenni e un migliaio di torrenti temporanei,
      tributari del Tago o del Guadiana; il Bullaque delimita il parco a est e l'Estena a ovest, entrambi
      affluenti del Guadiana. Sul fondovalle di alcune valli sopravvivono torbiere relitte di epoche remote,
      caratterizzate dal mirto di Brabante e da piante carnivore come drosera e pinguicola.


      La flora testimonia questa varietà: più di mille piante vascolari e circa 550 specie di licheni, pari a
      un quinto della flora lichenica della penisola iberica. Questa ricchezza eccezionale dipende soprattutto
      dall'eccellente stato di conservazione dei 17 habitat di interesse comunitario del parco e dall'assenza
      di inquinamento atmosferico.
    wildlife: >-
      La raña è il grande palcoscenico dei [cervi](/especie/cervus_elaphus/): branchi composti da femmine e
      cerbiatti in primavera, e in autunno le fiere contese dei maschi durante la stagione del bramito.
      Ammirali mantenendo le dovute distanze. Alle prime luci dell'alba, branchi di
      [cinghiali](/especie/sus_scrofa/) rientrano al riparo del bosco. Verso il tramonto, il nibbio bianco
      subentra al gheppio comune e al [grillaio](/especie/falco_naumanni/) nella caccia ai roditori sui
      terreni aperti.


      La pianura aperta è pure territorio di uccelli steppici come la calandra, la cappellaccia di Thekla e la
      calandrina, mentre risuonano i richiami della [gallina prataiola](/especie/tetrax_tetrax/) e della
      pernice rossa.


      Sui rilievi rocciosi, l'[avvoltoio monaco](/especie/aegypius_monachus/) colloca i suoi possenti nidi
      sulle sughere secolari che sovrastano le pietraie. L'[aquila imperiale
      iberica](/especie/aquila_adalberti/), rapace endemico e minacciato di estinzione, autentico simbolo
      della biodiversità di Cabañeros, trova rifugio per nidificare nelle chiome degli alberi più maestosi. La
      timida [cicogna nera](/especie/ciconia_nigra/) sceglie grandi rami vicini a fiumi calmi per installare
      il nido. Nei corsi d'acqua vivono la [lontra europea](/especie/lutra_lutra/), mammifero acquatico
      d'elezione del parco, e il jarabugo, un piccolo pesce endemico d'acqua dolce a rischio critico. Per
      questo alcune aree richiedono quiete totale: non avvicinarti mai ai siti di nidificazione.


      Il ritmo dell'anno scandisce la fauna. Sul confine meridionale, l'osservatorio in legno delle Cicogne
      affacciato sulla raña consente di osservare da primavera ad autunno una ricca colonia di [cicogne
      bianche](/especie/ciconia_ciconia/) insediata sui rami delle querce. In primavera, due webcam a Casa
      Palillos trasmettono in tempo reale l'interno di un nido di barbagianni e di uno di grillaio.
    visit: >-
      Inizia il percorso da Horcajo de los Montes, sede del centro visitatori principale. La sua mostra
      permanente illustra gli ecosistemi di Cabañeros nelle quattro stagioni e presenta una quintería
      tradizionale sulla civiltà contadina locale. La struttura di Torre de Abraham è dedicata al ciclo
      dell'acqua, con un'esposizione didattica sui boschi ripariali e una passerella botanica in legno lungo
      il fiume Bullaque, fruibile da persone con disabilità motoria. Il belvedere sul bacino artificiale
      include tre pannelli informativi e ampie vedute panoramiche sulla conca d'acqua e sulla raña di
      Retuerta.


      I sentieri offrono livelli di impegno diversi. La Plaza de los Moros è un percorso ad anello di 3,5 km
      con 150 m di dislivello. Il Boquerón del Estena comporta 6 km tra andata e ritorno dall'area di
      parcheggio. Da Los Navalucillos, dove una capanna di legno segnala l'avvio delle escursioni per El
      Chorro, Chorrera Chica, Rocigalgo e la ruta de la Encina, la salita verso El Chorro misura 4,2 km di
      sola andata con 200 m di dislivello: programma sempre le tempistiche per il rientro. Meglio percorrere
      un solo sentiero con calma che affannarsi tra più itinerari.


      I borghi vicini completano l'itinerario. Alcoba ospita un museo etnografico sulle tradizioni pastorali
      dei Montes de Toledo, mentre a Casa Palillos, lungo la strada da Pueblonuevo del Bullaque a Santa
      Quiteria, si snoda un sentiero didattico botanico ed etnografico accessibile. A Navas de Estena il punto
      informativo propone un'esposizione sul brigantaggio storico e sulla geologia, mentre la Tabla del Acebo
      offre una passeggiata su passerella lungo l'Estena. Retuerta ospita il centro Zoorama dedicato alla
      fauna. Per le escursioni guidate in fuoristrada, il centro di Pueblonuevo del Bullaque fornisce dettagli
      e gestisce le prenotazioni telefoniche.
    history: >-
      Il toponimo svela le origini storiche: Cabañeros deriva dalle rustiche capanne (cabañas) di pastori e
      carbonai. Porzioni della pianura furono disboscate in passato per la coltivazione dei cereali,
      conferendo il tipico assetto aperto a pascolo alberato. Il 20 novembre 1995 le Cortes approvarono la
      legge 33/1995 con cui veniva formalmente istituito il Parco Nazionale di Cabañeros. Il Piano di Gestione
      e Uso è stato promulgato con Decreto 69/2021 del 1º giugno, integrando precise direttive volte a
      minimizzare il disturbo umano durante le delicate fasi riproduttive dell'avifauna.


      La questione di conservazione più complessa sfugge spesso all'occhio dei visitatori: i boschi di rovere
      melojo faticano a rinnovarsi a causa dell'aridità estiva e della brucatura degli ungulati, rendendo
      essenziale proteggere i giovani getti.
    before: >-
      Il campeggio libero e il bivacco notturno non sono consentiti; rimani sempre lungo i percorsi tracciati.
      Verifica in anticipo i calendari di apertura: gli orari di Horcajo, Torre de Abraham e dei presidi
      comunali cambiano con le stagioni. A ottobre 2026, l'allestimento museale e il plastico di Casa Palillos
      risultavano chiusi per ristrutturazione, così come lo Zoorama di Retuerta. I cani devono essere tenuti
      al guinzaglio sui tracciati e non possono entrare nelle strutture dei centri visitatori. Porta sempre
      una scorta d'acqua adeguata.
    around: >-
      La visita a Cabañeros tocca i paesi d'accesso: Horcajo de los Montes, Alcoba, Retuerta del Bullaque,
      Navas de Estena e Los Navalucillos. Pur non confinando direttamente con altri siti dell'atlante, il
      parco presenta forti affinità ecologiche con varie aree protette.


      Con il [Parque Natural Despeñaperros y Sierra Morena
      Oriental](/lugar/sierra-morena-oriental---despenaperros/) e il [Parque Natural Sierra de
      Andújar](/lugar/parque-natural-sierra-de-andujar/) condivide la presenza di [lince
      pardina](/especie/lynx_pardinus/), aquila imperiale iberica e avvoltoio monaco, oltre alla volta matura
      del bosco mediterraneo; Andújar aggiunge un corridoio fluviale analogo. La [Reserva Natural de la Sierra
      de Malcata](/lugar/reserva-natural-da-serra-da-malcata/) coincide per la tutela di lince pardina,
      avvoltoio monaco e cicogna nera. Il [Río Drava y Llanura de
      Inundación](/lugar/drava-river---floodplain/) ospita anch'esso cicogna nera e lontra europea in foreste
      vetuste e corridoi alluvionali.
  pt:
    intro: >-
      No outono, numa planície pouco arborizada dos Montes de Toledo, os veados machos confrontam-se durante a
      brama enquanto tu os observas de longe. Essa cena resume Cabañeros. O parque nacional, situado entre
      Ciudad Real e Toledo, reúne rañas abertas, serras de bosque mediterrânico e linhas de água; cada
      ambiente convida a uma abordagem distinta: avistar animais à distância, caminhar sob o dossel das
      árvores ou procurar nas rochas os vestígios de um mar ancestral.
    landscape: >-
      É preciso recuar até um mar primitivo. Os sedimentos acumulados no leito desse oceano suportaram
      pressões colossais decorrentes do choque de placas tectónicas; dobraram-se, fraturaram-se e emergiram à
      superfície. Daí nasceram as serras. O quartzito molda relevos resistentes e pedrizas: encostas de
      cascalho e blocos desprendidos pelos ciclos sucessivos de gelo e degelo do passado.


      No sopé das montanhas desenrolou-se outro processo. Em épocas frias e secas, violentas enxurradas e
      torrentes de lama depositaram materiais detríticos em vastas planícies: as rañas.


      O arvoredo é dominado por quatro espécies do género Quercus, árvores de crescimento lento e copa ampla,
      cada uma distribuída consoante o teor de humidade. A azinheira resiste melhor à estiagem; o
      carvalho-cerquinho e o sobreiro preferem locais mais frescos; o carvalho-negral exige maior humidade e
      vegeta junto aos cursos de água ou em zonas de altitude. As matas predominantes são azinhais,
      sobreirais, carvalhais e negralhais, orlados por galerias ribeirinhas junto às margens. Os estevais e
      urzais formam o matagal mais extenso, enquanto medronheiros, folhados, alecrins, urzes e estevas povoam
      as encostas sob a copa arbórea.


      O clima dita o ritmo ecológico: seca estival, nevões pontuais no inverno e chuvas instáveis na primavera
      e no outono, atingindo 550-600 mm anuais. A água concede uma identidade única ao parque. Estendem-se
      cerca de 40 km de rios permanentes e cerca de mil ribeiros temporários, afluentes do Tejo ou do
      Guadiana; o Bullaque delimita o parque a leste e o Estena a oeste, desaguando ambos no Guadiana. Nos
      fundos de alguns vales sobrevivem turfeiras relíquias de tempos remotos, com mirto-de-brabante e plantas
      carnívoras como droseras e pinguículas.


      A flora confirma esta singularidade: mais de mil plantas vasculares e perto de 550 espécies de líquenes,
      totalizando um quinto das espécies catalogadas na Península Ibérica. Tal diversidade deve-se sobretudo
      ao excelente estado de conservação dos 17 habitats de interesse comunitário do parque e à ausência de
      poluição atmosférica.
    wildlife: >-
      A raña é o grande palco dos [veados-vermelhos](/especie/cervus_elaphus/): grandes manadas de fêmeas com
      crias na primavera e, no outono, os vigorosos duelos entre machos durante a época da brama. Observa-os a
      uma distância prudente. Com as primeiras claridades da alvorada, bandos de
      [javalis](/especie/sus_scrofa/) recolhem ao bosque cerrado. Ao entardecer, o tartaranhão-preto cede
      lugar ao búteo e ao [peneireiro-das-torres](/especie/falco_naumanni/) na caça a micromamíferos em
      terreno aberto.


      A planície ampla serve igualmente de refúgio a aves estepárias, como a calhandra-real, a
      cotovia-montesina e a calhandrinha, ouvindo-se os chamamentos do [sisão](/especie/tetrax_tetrax/) e da
      perdiz-vermelha.


      Nas serras rochosas, o [abutre-preto](/especie/aegypius_monachus/) constrói volumosos ninhos de gravetos
      em velhos sobreiros erguidos sobre as encostas pedregosas. A
      [águia-imperial-ibérica](/especie/aquila_adalberti/), ave de rapina endémica e ameaçada de extinção,
      símbolo mor da biodiversidade de Cabañeros, encontra refúgio nas copas das árvores mais maduras para
      nidificar. A esquiva [cegonha-preta](/especie/ciconia_nigra/) escolhe árvores antigas perto de rios
      tranquilos para nidificar. Nas linhas de água habitam a [lontra-europeia](/especie/lutra_lutra/),
      predador aquático representativo do parque, e o saramugo, pequeno peixe de água doce endémico
      criticamente em perigo. Por essa razão, determinadas áreas exigem tranquilidade absoluta: nunca procures
      os ninhos.


      As estações regulam o ecossistema. No extremo sul, o Observatório das Cegonhas, em madeira e com vista
      aberta para a raña, permite acompanhar da primavera ao outono uma numerosa colónia de
      [cegonhas-brancas](/especie/ciconia_ciconia/) instalada em carvalhos e azinheiras. Na primavera, duas
      câmaras de transmissão em direto na Casa Palillos mostram o interior de ninhos de coruja-das-torres e
      peneireiro-das-torres.
    visit: >-
      Inicia o teu percurso em Horcajo de los Montes, onde funciona o centro de visitantes principal. A sua
      exposição apresenta os ecossistemas de Cabañeros ao longo das quatro estações e inclui uma quintería
      tradicional sobre a cultura etnográfica da comarca. Torre de Abraham dedica-se à dinâmica da água,
      dispondo de uma exposição informativa, uma maqueta de bosques ripícolas e um passadiço botânico sobre
      esteios junto ao rio Bullaque, acessível a pessoas com mobilidade reduzida. O seu miradouro sobre a
      albufeira possui três painéis interpretativos e amplas panorâmicas sobre a represa e a raña de Retuerta.


      Os trilhos exigem esforços variados. A Plaza de los Moros é um percurso circular de 3,5 km com 150 m de
      desnível. O Boquerón del Estena perfaz 6 km de ida e volta a partir do parque de estacionamento. A
      partir de Los Navalucillos, onde um posto de madeira assinala o início dos trilhos de El Chorro,
      Chorrera Chica, Rocigalgo e ruta de la Encina, a subida até El Chorro soma 4,2 km apenas na ida com 200
      m de desnível: contabiliza o tempo necessário para regressar. É preferível completar um trilho com
      serenidade do que tentar fazer várias rotas apressadamente.


      As povoações ribeirinhas completam a estadia. Alcoba conserva um museu etnográfico sobre os usos
      agrícolas e pastoris dos Montes de Toledo, enquanto na Casa Palillos, junto à estrada entre Pueblonuevo
      del Bullaque e Santa Quiteria, existe um percurso botânico e etnográfico acessível. Em Navas de Estena,
      o posto informativo apresenta uma exposição sobre o banditismo histórico e os valores geológicos da
      região, e a área da Tabla del Acebo disponibiliza um passadiço junto ao rio Estena. Retuerta acolhe o
      Zoorama, centrado na fauna autóctone. Para passeios guiados de todo-o-terreno, o centro de Pueblonuevo
      del Bullaque esclarece dúvidas e efetua marcações por telefone.
    history: >-
      A designação explica as origens: Cabañeros deriva das cabanas rústicas de pastores e carvoeiros.
      Parcelas da raña foram arroteadas antigamente para cultivo de cereais, conferindo a feição atual de
      montado aberto. A 20 de novembro de 1995, as Cortes aprovaron a Lei 33/1995 que estabeleceu formalmente
      o Parque Nacional de Cabañeros. O respetivo Plano Diretor de Gestão foi aprovado pelo Decreto 69/2021,
      de 1 de junho, estabelecendo medidas de salvaguarda que limitam perturbações humanas nos períodos
      reprodutivos sensíveis das aves.


      O principal repto de conservação florestal é menos visível do que as manadas de veados: o
      carvalho-negral praticamente não se regenera devido à seca estival e à pressão de herbivoria dos
      ungulados, tornando imperativa a proteção ativa de novos rebentos.
    before: >-
      O campismo selvagem e o bivaque são expressamente proibidos; permanece sempre nos trilhos traçados.
      Confirma os calendários de visita: os períodos de funcionamento de Horcajo, Torre de Abraham e dos
      postos municipais oscilam consoante a época do ano. Em outubro de 2026, a exposição e a maqueta da Casa
      Palillos encontravam-se encerradas para obras de beneficiação, bem como o Zoorama de Retuerta. Os cães
      devem circular com trela nos caminhos e não têm acesso ao interior dos centros de acolhimento. Leva
      sempre água potável.
    around: >-
      A descoberta de Cabañeros faz-se através das suas localidades envolventes: Horcajo de los Montes,
      Alcoba, Retuerta del Bullaque, Navas de Estena e Los Navalucillos. Não possui vizinhos imediatos neste
      atlas, mas partilha espécies e habitats com outros territórios protegidos.


      Com o [Parque Natural Despeñaperros y Sierra Morena
      Oriental](/lugar/sierra-morena-oriental---despenaperros/) e o [Parque Natural Sierra de
      Andújar](/lugar/parque-natural-sierra-de-andujar/) partilha populações de
      [lince-ibérico](/especie/lynx_pardinus/), águia-imperial-ibérica e abutre-preto, além de bosques
      mediterrânicos maduros; Andújar integra ainda um corredor fluvial análogo. A [Reserva Natural de la
      Sierra de Malcata](/lugar/reserva-natural-da-serra-da-malcata/) coincide na preservação do
      lince-ibérico, abutre-preto e cegonha-preta. E o [Río Drava y Llanura de
      Inundación](/lugar/drava-river---floodplain/) partilha a cegonha-preta e a lontra-europeia em matas
      ribeirinhas e planícies aluviais.
