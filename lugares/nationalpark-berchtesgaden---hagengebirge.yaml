    El único Parque Nacional de alta montaña alpina de Alemania, con el pico Watzmann (2.713 m) y el fiordo
    alpino Königssee.
  en: >-
    Germany's only high-alpine National Park, dominated by mount Watzmann (2,713 m) and the fjord-like
    Königssee.
  fr: >-
    L’unique parc national de haute montagne alpine d’Allemagne, dominé par le Watzmann (2 713 m) et le
    Königssee.
  de: >-
    Deutschlands einziger hochalpiner Nationalpark, geprägt vom Watzmann (2.713 m) und dem fjordartigen
    Königssee.
  it: >-
    L’unico Parco Nazionale di alta montagna alpina della Germania, dominato dal monte Watzmann (2.713 m) e
    dal Königssee.
  pt: >-
    O único Parque Nacional de alta montanha alpina da Alemanha, com o pico Watzmann (2.713 m) e o fiorde
    alpino Königssee.
unico:
  es: >-
    Un macizo de caliza agujereado por casi 500 cuevas, con un sistema de 55 km, que cae 1700 m sobre un lago
    de montaña.
  en: >-
    A limestone massif honeycombed with almost 500 caves, including a 55 km system, plunging 1700 m to an
    alpine lake.
  fr: >-
    Un massif calcaire truffé de près de 500 grottes, avec un réseau de 55 km, plongeant de 1700 m sur un lac
    alpin.
  de: >-
    Ein von fast 500 Höhlen durchlöchertes Kalksteinmassiv mit einem 55 km langen Höhlensystem, das 1700 m
    tief zu einem Alpensee abfällt.
  it: >-
    Un massiccio calcareo traforato da quasi 500 grotte, con un sistema di 55 km, che precipita per 1700 m su
    un lago alpino.
  pt: >-
    Um maciço calcário perfurado por quase 500 grutas, com um sistema de 55 km, que se precipita 1700 m sobre
    uma lagoa alpina.
observaciones:
  es: >-
    Está prohibido volar drones, acampar o pernoctar al aire libre, y la bicicleta solo va por caminos
    autorizados. Hay que llevar a los perros atados, no salirse de los caminos ni acortar, y bajar la basura.
    Acampar está prohibido, también en Salet, Kessel y St. Bartholomä, en el Königssee, donde quien se queda
    al acabar la navegación se devuelve en un barco especial. Los guardas controlan todo el año y las
    infracciones se multan. En tours largos o difíciles hacen falta cabeza para las alturas, pie seguro y
    buena condición, y en invierno hay que mirar el parte de aludes. La parte austriaca del macizo es más
    solitaria y de difícil acceso, y en la temporada de caza, de septiembre a diciembre, los excursionistas no
    son bienvenidos.
texto:
  es:
    intro: >-
      Empieza en el fondo de un lago y acaba a 2713 m. El Parque Nacional de Berchtesgaden, el único parque
      alpino de Alemania, va de 603,3 m, en el Königssee, a la cumbre del Watzmann, y en ese desnivel caben el
      agua, el bosque, los pastos de montaña y la roca. Fue decretado el 1 de agosto de 1978 y ocupa 208 km²
      en los Alpes de Berchtesgaden, contra la frontera con Austria. Dentro está también la parte bávara del
      Hagengebirge, un macizo de caliza lleno de cuevas, cuya vertiente oeste cae unos 1700 m hasta el
      Königssee.
    landscape: >-
      El Hagengebirge es de caliza de Dachstein, con caliza estratificada al norte y caliza de arrecife al
      sur, y es un macizo hueco: se conocen casi 500 cuevas, unas 450 de ellas exploradas. La más famosa es la
      Tantalhöhle, con más de 34 km; el sistema Tantalhöhle-Jägerbrunntrog llega a 55 km, y el sistema
      Wildpalfen, dentro del parque, tiene 6 km. El macizo está sobre todo en Salzburgo, y su cuarta parte
      occidental en Baviera.


      Más allá del Hagengebirge, el parque guarda otros paisajes. El Wimbachgries, entre el Watzmann y el
      Hochkalter, es un valle lleno de hasta 300 m de escombros a lo largo de diez kilómetros. En el lago
      Funtensee se miden en invierno las temperaturas más bajas de Alemania. En el parque están el Watzmann,
      el glaciar Blaueis y la mayor parte del Königssee.
    wildlife: >-
      El [águila real](/especie/aquila_chrysaetos/) manda aquí. El Klausbachhaus se llama también el valle de
      las águilas: es el lugar del parque con más probabilidad de ver un águila real en libertad, con una de
      las cuatro parejas del parque, y se la puede observar con suerte todo el año. El
      [quebrantahuesos](/especie/gypaetus_barbatus/) se observa de cerca, en el punto de información de
      Halsgrube, hasta mediados de octubre.


      Entre los mamíferos hay corzo, ciervo, [rebeco](/especie/rupicapra_rupicapra/),
      [íbice](/especie/capra_ibex/) (reintroducido en los años treinta) y, entre los pequeños,
      [marmota](/especie/marmota_marmota/), liebre variable y topillo de las nieves. Desde 1924 se soltaron
      íbices en el lado austriaco y desde 1936 en Röth; hoy forman una colonia que vive en todo el sur de los
      Alpes de Berchtesgaden. Crían unas 100 especies de aves, entre ellas el
      [urogallo](/especie/tetrao_urogallus/), la [perdiz nival](/especie/lagopus_muta/), la chova piquigualda
      y el [treparriscos](/especie/tichodroma_muraria/). Hay 16 especies de anfibios y reptiles, entre ellos
      la salamandra alpina, y el [escarabajo longicornio alpino](/especie/rosalia_alpina/) y la mariposa apolo
      son insectos típicos.


      Entre las especies originales también había bisontes, linces, osos, lobos y nutrias, y no se prevén
      reintroducciones, aunque algunas podrían regresar por sí solas.
    visit: >-
      El Haus der Berge, el centro del parque, ofrece información interactiva, un cine con una película sobre
      los Alpes de Berchtesgaden, exposiciones temporales en dos plantas, la muestra «Mensch & Berg» y una
      biblioteca temática. Su exposición Vertikale Wildnis ocupa unos 1.000 m² y sube desde el fondo del
      Königssee por agua, bosque, pastos y roca hasta las cumbres, con una película de naturaleza de 12
      minutos en una pantalla de 11 × 15 m. Alrededor, el Panoramaweg muestra los cuatro hábitats con vistas
      al Watzmann, al Hochkalter y al Jenner. Abre todos los días de 9.00 a 17.00 h, con última entrada a la
      exposición a las 16.00, y se recomiendan unas tres horas.


      El parque mantiene 260 km de senderos, desde rutas accesibles hasta itinerarios difíciles, y los
      clasifica en accesibles, fáciles, medios y difíciles. Los caminos azules son estrechos y pueden ser
      empinados pero sin riesgo de caída; los negros son estrechos, empinados y expuestos, con riesgo de
      caída. Para ver las águilas, el punto de observación está a unos 20 minutos a pie del Klausbachhaus, con
      paneles que explican la vida, las estrategias de caza y el seguimiento del águila real. El punto del
      quebrantahuesos queda a poco más de 60 minutos por el sendero 472 hacia Halsalm, y un equipo responde
      preguntas todos los días de 10 a 16 h hasta mediados de octubre, con buen tiempo. Al Schneibstein se
      sube con relativa facilidad desde la estación superior del Jennerbahn, y el Seeleinsee, bajo el
      Kahlersberg, es un destino popular. El parque ofrece excursiones guiadas gratuitas, y en invierno
      recomienda las guiadas para recorrer el parque nevado.
    history: >-
      En 1910 nació una zona de protección de plantas alpinas de unos 83 km², y en 1921 la reserva del
      Königssee tras protestas contra un león tallado en la pared de Falkenstein. El 1 de agosto de 1978 se
      decretó el parque nacional, que frenó los planes de un teleférico al Watzmann. El parque es el núcleo,
      de 139 km², y la zona de manejo, de 69 km², de la reserva de la biosfera, de 467 km². En el
      Hagengebirge, de las 27 alpes de pasto que hubo, casi todas están abandonadas y en ruinas, salvo Graz y
      Angeralm.
    before: >-
      Está prohibido volar drones, acampar o pernoctar al aire libre, y la bicicleta solo va por caminos
      autorizados. Hay que llevar a los perros atados, no salirse de los caminos ni acortar, y bajar la
      basura. Acampar está prohibido, también en Salet, Kessel y St. Bartholomä, en el Königssee, donde quien
      se queda al acabar la navegación se devuelve en un barco especial. Los guardas controlan todo el año y
      las infracciones se multan. En tours largos o difíciles hacen falta cabeza para las alturas, pie seguro
      y buena condición, y en invierno hay que mirar el parte de aludes. La parte austriaca del macizo es más
      solitaria y de difícil acceso, y en la temporada de caza, de septiembre a diciembre, los excursionistas
      no son bienvenidos.
    around: >-
      El [Steinernes Meer - Mar de Piedra](/lugar/steinernes-meer---karst-plateau/) está a unos 2 km y la
      [Meseta Kárstica de Tennengebirge](/lugar/tennengebirge---karst-plateau/), a unos 10 km. Con el [Parque
      Natural de Karwendel](/lugar/naturpark-karwendel/), el [Parque Nacional de la
      Vanoise](/lugar/parc-national-de-la-vanoise/), el [Parque Nacional del Gran
      Paradiso](/lugar/parco-nazionale-gran-paradiso/) y el [Parque Natural
      Adamello-Brenta](/lugar/parco-naturale-adamello-brenta/), el parque comparte el íbice y, con los tres
      primeros, el águila real, aunque estén lejos.
  en:
    intro: >-
      It begins at the bed of an alpine lake and rises to 2713 m. Berchtesgaden National Park, Germany’s only
      high-alpine national park, ranges from 603.3 m at the Königssee up to the jagged summit of the Watzmann,
      encompassing open water, dense forest, alpine pastures, and stark limestone crags across that immense
      gradient. Designated on 1 August 1978, it covers 208 km² in the Berchtesgaden Alps abutting the Austrian
      border. Within its boundaries lies the Bavarian sector of the Hagengebirge, a hollowed limestone massif
      whose western drop falls some 1700 m directly into the Königssee.
    landscape: >-
      The Hagengebirge is composed of Dachstein limestone, with bedded limestone to the north and reef
      limestone to the south, forming a hollow labyrinth: almost 500 caves are known, with some 450 thoroughly
      explored. The most famous is the Tantalhöhle, extending over 34 km; the interconnected
      Tantalhöhle-Jägerbrunntrog system reaches 55 km, and the Wildpalfen system inside the park spans 6 km.
      Most of the massif lies within Salzburg, with its western fourth in Bavaria.


      Beyond the Hagengebirge, the park preserves contrasting mountain landforms. The Wimbachgries, sandwiched
      between Watzmann and Hochkalter, is an extraordinary debris-filled valley choked with up to 300 m of
      limestone gravel along ten kilometres. At the high mountain lake Funtensee, the lowest winter
      temperatures in Germany are routinely recorded. The park also cradles the Watzmann, the Blaueis glacier,
      and the larger portion of the Königssee.
    wildlife: >-
      The [golden eagle](/especie/aquila_chrysaetos/) reigns supreme here. The Klausbachtal is aptly nicknamed
      the valley of the eagles: it offers the highest probability in the park of watching a golden eagle in
      the wild, being home to one of four resident pairs, and with luck can be observed all year round. The
      [bearded vulture](/especie/gypaetus_barbatus/) can be observed at close quarters at the Halsgrube
      information station until mid-October.


      Mammals include roe deer, red deer, [chamois](/especie/rupicapra_rupicapra/), [Alpine
      ibex](/especie/capra_ibex/) (reintroduced in the thirties), and, among smaller species, [Alpine
      marmot](/especie/marmota_marmota/), mountain hare, and European snow vole. Beginning in 1924, ibex were
      released on the Austrian side and from 1936 at Röth; today they form an established colony roaming the
      southern Berchtesgaden Alps. Around 100 bird species breed here, notably [western
      capercaillie](/especie/tetrao_urogallus/), [rock ptarmigan](/especie/lagopus_muta/), alpine chough, and
      [wallcreeper](/especie/tichodroma_muraria/). There are 16 species of amphibians and reptiles, including
      the alpine salamander, while the [Rosalia longicorn](/especie/rosalia_alpina/) and Apollo butterfly are
      characteristic mountain insects.


      The original fauna once included bison, lynx, brown bear, wolf, and otter; no active reintroductions are
      planned, though some could recolonise naturally.
    visit: >-
      The Haus der Berge, the central visitor centre, provides interactive exhibitions, a cinema showing a
      panoramic film of the Berchtesgaden Alps, temporary displays across two floors, the «Mensch & Berg»
      showcase, and a library. Its core exhibition Vertikale Wildnis spans around 1,000 m², ascending from the
      bottom of Königssee through aquatic, forest, alpine meadow, and bare rock zones up to the summits,
      culminating in a 12-minute nature film projected on an 11 × 15 m screen. Outside, the Panoramaweg
      introduces four mountain habitats facing Watzmann, Hochkalter, and Jenner. It opens daily from 9.00 to
      17.00, with last exhibition admission at 16.00, and about three hours are recommended.


      The park maintains 260 km of footpaths, ranging from barrier-free paths to demanding alpine routes,
      graded into accessible, easy, moderate, and difficult. Blue trails are narrow and can be steep without
      falling risks; black trails are narrow, steep, and exposed, with fall hazards. For eagle viewing, the
      observation point lies roughly 20 minutes on foot from Klausbachhaus, complete with panels explaining
      golden eagle biology, hunting strategies, and telemetry monitoring. The bearded vulture observation post
      is situated just over 60 minutes along trail 472 toward Halsalm, where staff answer questions daily from
      10 to 16 until mid-October in fair weather. The Schneibstein is reached easily from the Jennerbahn
      mountain terminal, and Seeleinsee below Kahlersberg is a classic hiking destination. Free ranger-led
      walks are available, with guided winter snowshoeing highly recommended.
    history: >-
      In 1910 a botanical reserve for alpine flora of roughly 83 km² was created, and in 1921 the Königssee
      reserve was established following protests against carving a stone lion into the Falkenstein cliff. On 1
      August 1978 the national park was formally gazetted, halting controversial plans for a cable car up the
      Watzmann. The park forms the core zone of 139 km² and the buffer zone of 69 km² within the 467 km²
      UNESCO biosphere reserve. Across the Hagengebirge, of the 27 historical alpine pasture settlements that
      once operated, almost all are abandoned and ruined today, except Graz and Angeralm.
    before: >-
      Flying drones, camping, or bivouacking outdoors is strictly prohibited, and bicycles are permitted
      exclusively on authorised tracks. Dogs must be kept on a leash, cutting across switchbacks or leaving
      trails is banned, and all litter must be carried out. Camping is forbidden everywhere, including Salet,
      Kessel, and St. Bartholomä on Königssee, where stranded visitors after boat services end are retrieved
      by emergency patrol boat at high cost. Rangers patrol year-round and fine offenders. Long alpine treks
      demand a good head for heights, sure-footedness, and stamina; in winter avalanche bulletins must be
      consulted. The Austrian side of the Hagengebirge is remote and rugged, and during the autumn hunting
      season from September to December hikers are unwelcome.
    around: >-
      The [Steinernes Meer Karst Plateau](/lugar/steinernes-meer---karst-plateau/) lies some 2 km away, and
      the [Tennengebirge Karst Plateau](/lugar/tennengebirge---karst-plateau/) is about 10 km distant. With
      [Karwendel Nature Park](/lugar/naturpark-karwendel/), [Vanoise National
      Park](/lugar/parc-national-de-la-vanoise/), [Gran Paradiso National
      Park](/lugar/parco-nazionale-gran-paradiso/), and [Adamello-Brenta Nature
      Park](/lugar/parco-naturale-adamello-brenta/), Berchtesgaden shares the Alpine ibex, and with the first
      three, the golden eagle.
  fr:
    intro: >-
      Il commence au fond d’un lac et culmine à 2713 m. Le Parc national de Berchtesgaden, unique parc de
      haute montagne alpine d’Allemagne, s’étage depuis 603,3 m au Königssee jusqu’au sommet du Watzmann,
      accueillant dans ce dénivelé l’eau, la forêt, les alpages et la roche nue. Créé le 1 août 1978, il
      couvre 208 km² dans les Alpes de Berchtesgaden contre la frontière autrichienne. Son territoire englobe
      la partie bavaroise du Hagengebirge, un massif calcaire criblé de cavités dont le flanc occidental
      plonge de près de 1700 m jusqu’au Königssee.
    landscape: >-
      Le Hagengebirge est formé de calcaire du Dachstein, présentant du calcaire lité au nord et du calcaire
      récifal au sud, constituant un massif creux : près de 500 grottes y sont recensées, dont environ 450
      explorées. La plus célèbre est la Tantalhöhle, longue de plus de 34 km ; le réseau
      Tantalhöhle-Jägerbrunntrog atteint 55 km, et le réseau de Wildpalfen au sein du parc compte 6 km. La
      majeure partie du massif appartient au Land de Salzbourg, son quart occidental se trouvant en Bavière.


      Au-delà du Hagengebirge, le parc abrite d’autres paysages contrastés. Le Wimbachgries, entre le Watzmann
      et le Hochkalter, est une vallée d’éboulis accumulant jusqu’à 300 m d’alluvions calcaires sur dix
      kilomètres. Au lac Funtensee, on enregistre en hiver les températures les plus basses d’Allemagne. Le
      parc englobe également le Watzmann, le glacier Blaueis et la plus grande part du Königssee.
    wildlife: >-
      L’[aigle royal](/especie/aquila_chrysaetos/) règne en maître ici. Le secteur de la Klausbachtal est
      surnommé la vallée des aigles : c’est l’endroit du parc où la probabilité d’observer l’aigle royal en
      liberté est la plus forte, avec l’un des quatre couples nicheurs du parc observable avec un peu de
      chance tout au long de l’année. Le [gypaète barbu](/especie/gypaetus_barbatus/) s’observe de près au
      point d’information de Halsgrube jusqu’à la mi-octobre.


      Parmi les mammifères figurent chevreuil, cerf, [chamois](/especie/rupicapra_rupicapra/), [bouquetin des
      Alpes](/especie/capra_ibex/) (réintroduit dans les années trente) et, parmi les petits animaux,
      [marmotte des Alpes](/especie/marmota_marmota/), lièvre variable et campagnol des neiges. Dès 1924 des
      bouquetins furent lâchés côté autrichien puis à partir de 1936 à Röth ; ils forment aujourd’hui une
      harde florissante dans le sud des Alpes de Berchtesgaden. Environ 100 espèces d’oiseaux s’y
      reproduisent, dont le [grand tétras](/especie/tetrao_urogallus/), le [lagopède
      alpin](/especie/lagopus_muta/), le chocard à bec jaune et le [tichodrome
      échelette](/especie/tichodroma_muraria/). On compte 16 espèces d’amphibiens et reptiles, parmi
      lesquelles la salamandre noire, tandis que la [rosalie des Alpes](/especie/rosalia_alpina/) et l’apollon
      figurent parmi les insectes typiques.


      La faune d’origine comptait aussi bisons, lynx, ours, loups et loutres ; aucune réintroduction active
      n’est prévue, bien que certains carnivores puissent revenir par leurs propres moyens.
    visit: >-
      La Haus der Berge, le centre du parc, propose un parcours interactif, un cinéma projetant un
      documentaire sur les Alpes de Berchtesgaden, des expositions temporaires sur deux étages, l’espace «
      Mensch & Berg » et une bibliothèque thématique. L’exposition principale Vertikale Wildnis occupe environ
      1 000 m² et s’élève depuis les fonds du Königssee à travers l’eau, la forêt, les alpages et la roche
      jusqu’aux sommets, s’achevant par un film de nature de 12 minutes sur un écran de 11 × 15 m. Autour du
      bâtiment, le Panoramaweg présente les quatre habitats avec vue sur le Watzmann, le Hochkalter et le
      Jenner. Le centre ouvre tous les jours de 9.00 à 17.00, dernière entrée à l’exposition à 16.00, et trois
      heures sont recommandées pour la visite.


      Le parc entretient 260 km de sentiers balisés, depuis les promenades accessibles jusqu’aux itinéraires
      alpins ardus, classés en accessibles, faciles, moyens et difficiles. Les chemins bleus sont étroits et
      peuvent être raides mais sans risque de chute ; les noirs sont étroits, escarpés et exposés, comportant
      un risque de vertige et de chute. Pour contempler les aigles, le poste d’observation se situe à environ
      20 minutes à pied de la Klausbachhaus, jalonné de panneaux expliquant la biologie, la chasse et le suivi
      télémétrique de l’aigle royal. Le point d’observation du gypaète se trouve à un peu plus de 60 minutes
      sur le sentier 472 menant à Halsalm, où une équipe répond aux questions tous les jours de 10 à 16
      jusqu’à la mi-octobre par beau temps. Le Schneibstein s’atteint aisément depuis la gare supérieure du
      téléphérique du Jenner, et le Seeleinsee, sous le Kahlersberg, est une destination prisée. Le parc
      organise des sorties gratuites accompagnées, recommandées en hiver pour parcourir la neige en raquettes.
    history: >-
      En 1910 vit le jour une réserve pour plantes alpines d’environ 83 km², puis en 1921 la réserve du
      Königssee après des protestations contre le projet de sculpter un lion colossal dans la paroi du
      Falkenstein. Le 1 août 1978, le parc national fut officiellement créé, stoppant le projet de
      téléphérique vers le Watzmann. Le parc forme le cœur de 139 km² et la zone tampon de 69 km² d’une
      réserve de biosphère UNESCO de 467 km². Dans le Hagengebirge, sur les 27 alpages historiques autrefois
      exploités, la quasi-totalité est abandonnée et en ruine, à l’exception de Graz et d’Angeralm.
    before: >-
      Le vol de drones, le camping et le bivouac en plein air sont formellement interdits, et le vélo est
      limité aux pistes autorisées. Vous devez tenir les chiens en laisse, ne jamais couper les lacets ni
      quitter les sentiers, et remporter vos déchets. Le camping sauvage est rigoureusement prohibé, y compris
      à Salet, Kessel et St. Bartholomä sur le Königssee, où toute personne restant après le dernier bateau
      est ramenée par vedette de secours avec amende. Des gardes patrouillent toute l’année. Pour les longues
      courses alpines, un pied très sûr, l’absence de vertige et une excellente condition physique sont
      indispensables ; en hiver, le bulletin d’avalanche doit être systématiquement consulté. Le secteur
      autrichien du massif est sauvage et rude, et durant la saison de chasse de septembre à décembre les
      randonneurs y sont malvenus.
    around: >-
      Le [Steinernes Meer - Mer de Pierre](/lugar/steinernes-meer---karst-plateau/) se trouve à environ 2 km
      et le [Plateau karstique de Tennengebirge](/lugar/tennengebirge---karst-plateau/) à environ 10 km. Avec
      le [Parc naturel du Karwendel](/lugar/naturpark-karwendel/), le [Parc national de la
      Vanoise](/lugar/parc-national-de-la-vanoise/), le [Parc national du
      Grand-Paradis](/lugar/parco-nazionale-gran-paradiso/) et le [Parc naturel
      Adamello-Brenta](/lugar/parco-naturale-adamello-brenta/), Berchtesgaden partage la présence du bouquetin
      des Alpes, et avec les trois premiers, celle de l’aigle royal.
  de:
    intro: >-
      Er beginnt auf dem Grund eines Bergsees und reicht bis auf 2713 m. Der Nationalpark Berchtesgaden,
      Deutschlands einziger hochalpiner Nationalpark, erstreckt sich von 603,3 m am Königssee bis zum Gipfel
      des Watzmanns und umfasst auf dieser Höhenstufe Wasser, Bergmischwald, Almweiden und blanken Fels. Er
      wurde am 1. August 1978 gegründet und umfasst 208 km² in den Berchtesgadener Alpen an der Grenze zu
      Österreich. In seinen Grenzen liegt auch der bayerische Teil des Hagengebirges, ein von Höhlen
      durchsetztes Kalkmassiv, dessen Westflanke rund 1700 m tief zum Königssee abbricht.
    landscape: >-
      Das Hagengebirge besteht aus Dachsteinkalk mit gebanktem Kalk im Norden und Riffkalk im Süden und ist
      ein hohles Gebirge: Fast 500 Höhlen sind bekannt, rund 450 davon erforscht. Die bekannteste ist die
      Tantalhöhle mit über 34 km Länge; das System Tantalhöhle-Jägerbrunntrog erreicht 55 km und das
      Wildpalfen-System im Park 6 km. Das Massiv liegt größtenteils im Land Salzburg, sein westliches Viertel
      in Bayern.


      Über das Hagengebirge hinaus birgt der Park weitere alpine Landschaften: Das Wimbachgries zwischen
      Watzmann und Hochkalter ist ein riesiges Schuttstromtal mit bis zu 300 m mächtigen Schottermassen über
      zehn Kilometer Länge. Am Funtensee werden im Winter die tiefsten Temperaturen Deutschlands gemessen. Im
      Park liegen zudem der Watzmann, der Blaueisgletscher und der Großteil des Königssees.
    wildlife: >-
      Der [Steinadler](/especie/aquila_chrysaetos/) herrscht hier oben. Das Klausbachtal wird auch als Tal der
      Adler bezeichnet: Hier ist die Wahrscheinlichkeit im Park am höchsten, einen Steinadler in freier
      Wildbahn zu beobachten, da hier eines der vier Parkpaare lebt, das man mit etwas Glück ganzjährig
      erspähen kann. Der [Bartgeier](/especie/gypaetus_barbatus/) lässt sich an der Infostelle Halsgrube bis
      Mitte Oktober aus nächster Nähe beobachten.


      Unter den Säugetieren leben Reh, Rothirsch, [Gämse](/especie/rupicapra_rupicapra/),
      [Alpensteinbock](/especie/capra_ibex/) (in den dreißiger Jahren wiederangesiedelt) sowie
      [Alpenmurmeltier](/especie/marmota_marmota/), Schneehase und Schneemaus. Ab 1924 wurden Steinböcke auf
      österreichischer Seite und ab 1936 im Röth freigelassen; heute durchstreifen sie als Kolonie die
      gesamten südlichen Berchtesgadener Alpen. Rund 100 Vogelarten brüten im Gebiet, darunter
      [Auerhuhn](/especie/tetrao_urogallus/), [Alpenschneehuhn](/especie/lagopus_muta/), Alpendohle und
      [Mauerläufer](/especie/tichodroma_muraria/). 16 Amphibien- und Reptilienarten kommen vor, darunter der
      Alpensalamander; der [Alpenbock](/especie/rosalia_alpina/) und der Apollofalter zählen zu den
      charakteristischen Insekten.


      Zur ursprünglichen Tierwelt gehörten auch Wisent, Luchs, Bär, Wolf und Fischotter; gezielte
      Wiederansiedlungen sind nicht geplant, wenngleich manche Arten selbstständig zurückkehren könnten.
    visit: >-
      Das Haus der Berge, das Besucherzentrum des Parks, bietet interaktive Informationen, ein Kino mit einem
      Film über die Berchtesgadener Alpen, Wechselausstellungen auf zwei Etagen, die Schau «Mensch & Berg» und
      eine Fachbibliothek. Die Kernausstellung Vertikale Wildnis umfasst rund 1.000 m² und steigt vom Grund
      des Königssees über Wasser, Wald, Almen und Fels bis zu den Gipfeln an, gekrönt von einem 12-minütigen
      Naturfilm auf einer 11 × 15 m großen Leinwand. Im Außenbereich zeigt der Panoramaweg vier Lebensräume
      mit Blick auf Watzmann, Hochkalter und Jenner. Das Zentrum öffnet täglich von 9.00 bis 17.00 Uhr
      (letzter Einlass 16.00 Uhr); empfohlen werden etwa drei Stunden.


      Der Park unterhält 260 km Wanderwege von barrierefreien Wegen bis zu schweren Steigen, unterteilt in
      barrierefrei, leicht, mittel und schwer. Blaue Wege sind schmal und steil, aber ohne Absturzgefahr;
      schwarze Wege sind schmal, steil und exponiert mit akuter Absturzgefahr. Zur Adlerbeobachtung liegt der
      Beobachtungspunkt rund 20 Minuten Fußweg vom Klausbachhaus entfernt, versehen mit Tafeln zu Lebensweise,
      Jagdstrategien und Telemetrie des Steinadlers. Der Bartgeier-Beobachtungspunkt liegt gut 60 Minuten
      Fußweg auf dem Steig 472 Richtung Halsalm; bei gutem Wetter beantwortet ein Team täglich von 10 bis 16
      Uhr bis Mitte Oktober Fragen. Den Schneibstein erreichst du bequem von der Jennerbahn-Bergstation, und
      der Seeleinsee unter dem Kahlersberg ist ein klassisches Wanderziel. Der Park bietet kostenlose
      Führungen und empfiehlt im Winter geführte Schneeschuhtouren.
    history: >-
      1910 entstand ein Pflanzenschonbezirk für Alpenblumen von rund 83 km², und 1921 wurde nach Protesten
      gegen ein geplantes Löwendenkmal an der Falkensteinwand das Naturschutzgebiet Königssee errichtet. Am 1.
      August 1978 wurde der Nationalpark per Gesetz verankert, was Baupläne für eine Seilbahn auf den Watzmann
      verhinderte. Der Park bildet die Kernzone von 139 km² und die Pflegezone von 69 km² des 467 km² großen
      UNESCO-Biosphärenreservats. Im Hagengebirge sind von den 27 einst bewirtschafteten Almen fast alle
      verfallen und aufgelassen, mit Ausnahme von Graz und Angeralm.
    before: >-
      Drohnenflüge, Zelten und Biwakieren sind streng verboten, Radfahren ist nur auf freigegebenen Wegen
      erlaubt. Hunde müssen angeleint bleiben, das Verlassen der Wege sowie das Abkürzen von Serpentinen ist
      untersagt, und Abfälle müssen mitgenommen werden. Campieren ist ausnahmslos verboten, auch in Salet,
      Kessel und St. Bartholomä am Königssee, wo verspätete Wanderer nach Betriebsschluss per
      kostenpflichtigem Rettungsboot abgeholt werden. Ranger kontrollieren ganzjährig. Für lange Bergtouren
      sind Schwindelfreiheit, Trittsicherheit und Kondition unerlässlich; im Winter muss der
      Lawinenlagebericht beachtet werden. Die österreichische Massivseite ist sehr einsam und unwegsam; zur
      Jagdzeit von September bis Dezember sind Wanderer dort nicht gerne gesehen.
    around: >-
      Das [Steinernes Meer - Karsthochfläche](/lugar/steinernes-meer---karst-plateau/) liegt rund 2 km
      entfernt und das [Tennengebirge - Karsthochfläche](/lugar/tennengebirge---karst-plateau/) rund 10 km.
      Mit dem [Naturpark Karwendel](/lugar/naturpark-karwendel/), dem [Nationalpark
      Vanoise](/lugar/parc-national-de-la-vanoise/), dem [Nationalpark Gran
      Paradiso](/lugar/parco-nazionale-gran-paradiso/) und dem [Naturpark
      Adamello-Brenta](/lugar/parco-naturale-adamello-brenta/) teilt Berchtesgaden den Alpensteinbock und mit
      den ersten dreien auch den Steinadler.
  it:
    intro: >-
      Comincia sul fondale di un lago e culmina a 2713 m. Il Parco Nazionale di Berchtesgaden, unico parco di
      alta montagna alpina della Germania, sale da quota 603,3 m al Königssee fino alla cresta del Watzmann,
      accogliendo in questo imponente dislivello acqua, boschi misti, alpeggi montani e pareti rocciose.
      Istituito il 1 agosto 1978, copre 208 km² nelle Alpi di Berchtesgaden a ridosso del confine austriaco.
      Al suo interno racchiude il settore bavarese dell’Hagengebirge, un massiccio calcareo cavernoso il cui
      versante occidentale precipita per circa 1700 m fin sulle acque del Königssee.
    landscape: >-
      L’Hagengebirge è formato da calcare di Dachstein, con calcare stratificato a nord e calcare scogliera a
      sud, costituendo un rilievo cavo: si contano quasi 500 grotte note, circa 450 delle quali esplorate. La
      più celebre è la Tantalhöhle, lunga oltre 34 km; il complesso Tantalhöhle-Jägerbrunntrog raggiunge 55
      km, e il sistema Wildpalfen interno al parco si estende per 6 km. Il massiccio ricade in prevalenza nel
      Salisburghese, con il suo quarto occidentale in Baviera.


      Oltre all’Hagengebirge, il parco tutela altri paesaggi montani: il Wimbachgries, serrato tra Watzmann e
      Hochkalter, è una valle detritica che accumula fino a 300 m di ghiaie calcaree lungo dieci chilometri.
      Presso il lago alpino di Funtensee si registrano in inverno le temperature più rigide di tutta la
      Germania. Nel parco svettano il Watzmann, il ghiacciaio Blaueis e gran parte dello specchio del
      Königssee.
    wildlife: >-
      L’[aquila reale](/especie/aquila_chrysaetos/) domina incontrastata questi cieli. La Klausbachtal è
      soprannominata la valle delle aquile: è il settore del parco con la più alta probabilità di osservare
      un’aquila reale libera in natura, ospitando una delle quattro coppie stabili del parco avvistabile con
      fortuna tutto l’anno. Il [gipeto](/especie/gypaetus_barbatus/) si può ammirare da vicino presso il punto
      informativo di Halsgrube fino a metà ottobre.


      Tra i mammiferi popolano i versanti caprioli, cervi, [camosci](/especie/rupicapra_rupicapra/),
      [stambecchi alpini](/especie/capra_ibex/) (reintrodotti negli anni trenta) e piccoli animali come la
      [marmotta delle Alpi](/especie/marmota_marmota/), la lepre variabile e l’arvicola delle nevi. A partire
      dal 1924 furono liberati stambecchi sul versante austriaco e dal 1936 a Röth; oggi compongono una solida
      colonia che occupa l’intero settore meridionale delle Alpi di Berchtesgaden. Nidificano circa 100 specie
      di uccelli, tra cui il [gallo cedrone](/especie/tetrao_urogallus/), la [pernice
      bianca](/especie/lagopus_muta/), il gracchio montano e il [picchio
      muraiolo](/especie/tichodroma_muraria/). Sono presenti 16 specie di anfibi e rettili, inclusa la
      salamandra alpina; il [cerambice del faggio](/especie/rosalia_alpina/) e la farfalla apollo sono insetti
      emblematici.


      In passato vivevano qui anche bisonti, linci, orsi, lupi e lontre; non sono pianificate reintroduzioni
      attive, sebbene alcuni carnivori possano rientrare autonomamente.
    visit: >-
      La Haus der Berge, centro visitatori principale, offre percorsi informativi interattivi, un cinema con
      pellicola panoramica sulle Alpi di Berchtesgaden, esposizioni temporanee su due piani, la rassegna
      «Mensch & Berg» e una biblioteca specializzata. La mostra permanente Vertikale Wildnis occupa circa
      1.000 m² e ascende dal fondale del Königssee attraverso acqua, bosco, pascoli e rocce fino alle cime,
      culminando in un documentario di 12 minuti su uno schermo di 11 × 15 m. All’esterno, il Panoramaweg
      illustra i quattro habitat affacciati su Watzmann, Hochkalter e Jenner. È aperta tutti i giorni dalle
      9.00 alle 17.00 (ultimo ingresso alle 16.00); si consigliano circa tre ore.


      Il parco cura 260 km di percorsi, da sentieri accessibili a vie alpine impegnative, suddivisi in
      accessibili, facili, medi e difficili. I tracciati blu sono stretti e talvolta ripidi ma privi di
      pericolo di caduta; i neri sono ripidi, stretti ed esposti con rischio concreto di scivolamento. Per
      avvistare i rapaci, la postazione dista circa 20 minuti a piedi dalla Klausbachhaus, con bacheche su
      biologia, caccia e monitoraggio satellitare dell’aquila reale. Il punto di osservazione del gipeto si
      trova a poco più di 60 minuti lungo il sentiero 472 verso la Halsalm, dove personale esperto risponde
      alle domande tutti i giorni dalle 10 alle 16 fino a metà ottobre con meteo favorevole. Lo Schneibstein
      si raggiunge agevolmente dalla stazione a monte della Jennerbahn, e il Seeleinsee sotto il Kahlersberg è
      una meta classica. Il parco organizza escursioni guidate gratuite, consigliando in inverno le uscite con
      le ciaspole.
    history: >-
      Nel 1910 venne istituita un’area di salvaguardia botanica di circa 83 km², e nel 1921 la riserva del
      Königssee in seguito alle vibrate proteste popolari contro il progetto di scolpire un leone monumentale
      nella parete del Falkenstein. Il 1 agosto 1978 fu ufficialmente decretato il parco nazionale,
      scongiurando i progetti di funivia verso il Watzmann. Il parco forma la zona centrale di 139 km² e la
      zona cuscinetto di 69 km² della riserva della biosfera UNESCO di 467 km². Sull’Hagengebirge, dei 27
      alpeggi storici documentati, quasi tutti sono abbandonati e in rovina, con l’eccezione di Graz e
      Angeralm.
    before: >-
      Sorvolare con droni, campeggiare o bivaccare all’aperto è rigorosamente proibito, e le biciclette sono
      ammesse solo sulle piste autorizzate. È obbligatorio tenere i cani al guinzaglio, non lasciare i
      tracciati né tagliare i tornanti e riportare a valle i rifiuti. Il campeggio è vietato ovunque, inclusi
      Salet, Kessel e St. Bartholomä sul Königssee, dove chi si attarda dopo l’ultima corsa dei battelli viene
      recuperato con battello di soccorso a pagamento con sanzione. I guardaparco vigilano tutto l’anno. Nei
      tour lunghi o impegnativi sono richiesti assenza di vertigini, passo sicuro ed eccellente allenamento;
      in inverno occorre consultare il bollettino valanghe. Il versante austriaco del massiccio è aspro e
      solitario, e nella stagione venatoria da settembre a dicembre gli escursionisti non sono graditi.
    around: >-
      Il [Steinernes Meer - Altopiano Carsico](/lugar/steinernes-meer---karst-plateau/) dista circa 2 km e
      l’[Altopiano Carsico del Tennengebirge](/lugar/tennengebirge---karst-plateau/) circa 10 km. Con il
      [Parco Naturale del Karwendel](/lugar/naturpark-karwendel/), il [Parco Nazionale della
      Vanoise](/lugar/parc-national-de-la-vanoise/), il [Parco Nazionale del Gran
      Paradiso](/lugar/parco-nazionale-gran-paradiso/) e il [Parco Naturale
      Adamello-Brenta](/lugar/parco-naturale-adamello-brenta/), Berchtesgaden condivide la presenza dello
      stambecco alpino, e con i primi tre anche dell’aquila reale.
  pt:
    intro: >-
      Começa no leito de um lago alpino e ergue-se até aos 2713 m. O Parque Nacional de Berchtesgaden, o único
      parque alpino de alta montanha da Alemanha, estende-se desde os 603,3 m no Königssee até ao cume do
      Watzmann, acolhendo nesse formidável desnível cursos de água, matas mistas, prados alpinos e escarpas
      rochosas. Instituído a 1 de agosto de 1978, ocupa 208 km² nos Alpes de Berchtesgaden junto à fronteira
      com a Áustria. Abrange também o setor bávaro de Hagengebirge, um maciço calcário perfurado por grutas
      cuja encosta ocidental despenca cerca de 1700 m até às margens do Königssee.
    landscape: >-
      O maciço de Hagengebirge é formado por calcário de Dachstein, com bancadas calcárias a norte e calcário
      recifal a sul, constituindo uma montanha oca: conhecem-se quase 500 grutas, com cerca de 450 exploradas
      em pormenor. A mais célebre é a Tantalhöhle, com mais de 34 km; o sistema interligado
      Tantalhöhle-Jägerbrunntrog atinge 55 km, e o sistema de Wildpalfen dentro do parque tem 6 km. A maior
      porção do maciço situa-se no estado de Salzburgo, ficando a sua quarta parte ocidental na Baviera.


      Para além do Hagengebirge, o parque resguarda paisagens marcantes: o Wimbachgries, entalado entre o
      Watzmann e o Hochkalter, é um vale entulhado com até 300 m de cascalho calcário ao longo de dez
      quilómetros. Na lagoa alpina de Funtensee registam-se no inverno as temperaturas mais baixas da
      Alemanha. O parque abriga ainda o Watzmann, o glaciar Blaueis e a maior fração do lago Königssee.
    wildlife: >-
      A [águia-real](/especie/aquila_chrysaetos/) reina aqui. O vale de Klausbachhaus é conhecido como o vale
      das águias: é o local do parque com maior probabilidade de avistar uma águia-real em liberdade,
      acolhendo um dos quatro casais reprodutores do parque, observável com sorte todo o ano. O
      [quebra-ossos](/especie/gypaetus_barbatus/) pode ser contemplado a curta distância no posto de Halsgrube
      até meados de outubro.


      Nos mamíferos registam-se corço, veado, [camurça](/especie/rupicapra_rupicapra/),
      [íbex](/especie/capra_ibex/) (reintroduzido nos anos trinta) e espécies menores como a
      [marmota](/especie/marmota_marmota/), a lebre-variável e o rato-das-neves. Desde 1924 soltaram-se íbexes
      do lado austríaco e a partir de 1936 em Röth; hoje formam uma população estável em todo o sul dos Alpes
      de Berchtesgaden. Nidificam cerca de 100 espécies de aves, entre elas o
      [tetraz-grande](/especie/tetrao_urogallus/), a [perdiz-nival](/especie/lagopus_muta/), a
      gralha-de-bico-amarelo e a [trepadeira-dos-muros](/especie/tichodroma_muraria/). Ocorrem 16 espécies de
      anfíbios e répteis, incluindo a salamandra-alpina; a [rosália-alpina](/especie/rosalia_alpina/) e a
      borboleta apolo são insetos emblemáticos.


      A fauna ancestral incluía também bisontes, linces, ursos, lobos e lontras; não estão programadas
      reintroduções ativas, embora alguns animais possam regressar espontaneamente.
    visit: >-
      A Haus der Berge, o centro do parque, faculta exposições interativas, um cinema com filme documental
      sobre os Alpes de Berchtesgaden, mostras temporárias em dois pisos, o núcleo «Mensch & Berg» e
      biblioteca temática. A sua mostra principal Vertikale Wildnis ocupa cerca de 1.000 m² e eleva-se desde o
      leito do Königssee através de zonas aquáticas, florestas, pastagens e rochedos até aos cumes, culminando
      num filme de natureza de 12 minutos numa tela de 11 × 15 m. Ao redor, o Panoramaweg revela quatro
      habitats com panorâmica sobre Watzmann, Hochkalter e Jenner. Abre diariamente das 9.00 às 17.00, com
      última entrada às 16.00, aconselhando-se cerca de três horas de visita.


      O parque mantém 260 km de caminhos pedestres, desde trilhos acessíveis a vias alpinas exigentes,
      categorizados em acessíveis, fáceis, médios e difíceis. Os trilhos azuis são estreitos e podem ser
      inclinados mas sem perigo de queda; os negros são estreitos, íngremes e expostos com risco efetivo de
      queda. Para observação de águias, o ponto dista cerca de 20 minutos a pé de Klausbachhaus, com painéis
      explicativos sobre ecologia, caça e telemetria da espécie. O posto do quebra-ossos situa-se a pouco mais
      de 60 minutos pelo trilho 472 em direção a Halsalm, onde equipas esclarecem dúvidas diariamente das 10
      às 16 até meados de outubro com bom tempo. O Schneibstein ascende-se com facilidade a partir do
      teleférico de Jennerbahn, e Seeleinsee sob o Kahlersberg é um destino concorrido. O parque disponibiliza
      visitas guiadas gratuitas e recomenda no inverno itinerários com raquetes de neve.
    history: >-
      Em 1910 foi instituída uma reserva botânica alpina de cerca de 83 km², e em 1921 a reserva do Königssee
      na sequência de protestos contra o entalhe de um leão monumental no penhasco de Falkenstein. A 1 de
      agosto de 1978 foi proclamado o parque nacional, travando o projeto de teleférico para o Watzmann. O
      parque constitui a zona núcleo de 139 km² e a zona de amortecimento de 69 km² da reserva da biosfera da
      UNESCO de 467 km². No Hagengebirge, das 27 pastagens alpinas outrora ativas, quase todas se encontram
      abandonadas em ruínas, salvo Graz e Angeralm.
    before: >-
      É proibido voar drones, acampar ou pernoitar ao ar livre, e o ciclismo só é autorizado em pistas
      assinaladas. Os cães devem circular com trela, é interdito sair dos caminhos ou cortar curvas e o lixo
      deve ser transportado de regresso. Acampar é estritamente proibido em qualquer ponto, incluindo Salet,
      Kessel e St. Bartholomä no Königssee, onde os visitantes retidos após o fecho da navegação são
      resgatados por embarcação especial sob pesada coima. Os vigilantes patrulham o ano inteiro. Em percursos
      longos ou técnicos exige-se ausência de vertigens, passo firme e preparação física; no inverno deve
      consultar-se o boletim de risco de avalanches. A vertente austríaca do maciço é remota e acidentada, e
      na época de caça de setembro a dezembro os excursionistas não são bem-vindos.
    around: >-
      O [Steinernes Meer - Mar de Pedra](/lugar/steinernes-meer---karst-plateau/) dista cerca de 2 km e o
      [Planalto Cársico de Tennengebirge](/lugar/tennengebirge---karst-plateau/) cerca de 10 km. Com o [Parque
      Natural de Karwendel](/lugar/naturpark-karwendel/), o [Parque Nacional da
      Vanoise](/lugar/parc-national-de-la-vanoise/), o [Parque Nacional do Gran
      Paradiso](/lugar/parco-nazionale-gran-paradiso/) e o [Parque Natural
      Adamello-Brenta](/lugar/parco-naturale-adamello-brenta/), Berchtesgaden partilha o íbex e, com os três
      primeiros, a águia-real.
