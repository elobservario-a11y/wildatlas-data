texto:
  es:
    intro: >-
      Hasta 1964, el Stari Begej era un tramo navegable y vivo del río Bega. Aquel año se abrió un canal nuevo
      y el viejo cauce quedó como meandro abandonado: con el tiempo se volvió fangoso y pantanoso, y en esa
      pérdida nació uno de los humedales de aves más ricos de la llanura panónica. Carska Bara, que en serbio
      significa 'estanque imperial', ocupa la llanura aluvial entre el Begej y el Tisa, a 17 km al sur de
      Zrenjanin, y forma un sistema de tres estanques (Carska, Perleska y Tiganjica) unidos por los 8 km del
      canal del Stari Begej.
    landscape: >-
      El complejo reúne el cauce del Viejo Begej y las marismas de Carska Bara, Tiganjica, Perleska, Botoški
      Rit y Mužljanski Rit. Es un humedal de ríos, canales, lagos y estanques cubiertos de carrizales,
      sauzales y juncales, conocido por su variedad de colores. Es un mosaico de pantano, bosque, prado,
      estepa y saladar, con especies endémicas, subendémicas y relictas del espacio panónico.


      Las aguas no son profundas: el Begej tiene aquí entre 2 y 3 m, mientras que el pantano solo tiene 80 cm.
      Entre las plantas acuáticas hay helecho de agua, nenúfar blanco y nenúfar amarillo; se han registrado
      unas 500 especies de plantas y se conservan colonias de viejos sauzales y bosques de álamo negro y
      fresno de hoja estrecha. La principal especie invasora es la castaña de agua.
    wildlife: >-
      Este es un sitio de aves. Hay 240 especies, 130 residentes y 110 migratorias. Entre las que anidan
      figuran colonias de [garza real](/especie/ardea_cinerea/), [garceta común](/especie/egretta_garzetta/) y
      [martinete](/especie/nycticorax_nycticorax/), y de cormorán pigmeo. Entre las garzas se cuenta que
      anidan las ocho especies europeas. Esas colonias cambian de lugar dentro de la reserva según la
      abundancia de peces.


      Hay también [espátula](/especie/platalea_leucorodia/), [aguilucho
      lagunero](/especie/circus_aeruginosus/), [aguilucho cenizo](/especie/circus_pygargus/), ganso de cuello
      rojo y [águila pescadora](/especie/pandion_haliaetus/). El pigargo está en lo alto de la cadena
      alimentaria y llega a 2,5 m de envergadura. Algunas aves migratorias se detienen unos diez días, y los
      gansos siberianos pueden invernar: unos 50.000 gansos careto grandes pasan allí diciembre y enero en su
      viaje desde Siberia hacia el sur de Europa.


      En el agua viven 24 especies de peces, y las aguas fangosas son ideales para el
      [lucio](/especie/esox_lucius/). Entre los anfibios y reptiles abundan la [salamandra
      común](/especie/salamandra_salamandra/), la rana verde, el lagarto ágil y el [galápago
      europeo](/especie/emys_orbicularis/). Y, a pesar de ser un pantano, casi no hay mosquitos, algo que los
      biólogos locales atribuyen a la gran cantidad de ranas. Entre los mamíferos hay jabalí, corzo, zorro,
      liebre, rata almizclera, murciélagos, erizo, topo, comadreja, hámster y turón; la
      [nutria](/especie/lutra_lutra/) está bajo protección estricta.
    visit: >-
      Todo se hace despacio. Hay un sendero de salud de cuatro kilómetros, un recorrido por el dique de la
      reserva que se puede hacer en bicicleta o bicicleta eléctrica y la posibilidad de alquilar canoas para
      remar por el Viejo Begej. La navegación está prohibida en los estanques, pero se permite por el Stari
      Begej. La observación de aves figura entre las actividades de la reserva.
    history: >-
      Hay restos humanos en la zona desde hace 4000 años antes de Cristo, con túmulos descubiertos cerca de
      Mužlja y Titel. Según la leyenda, el pantano se llama así por Atila, rey de los hunos. La reserva
      protege 4726 hectáreas y el decreto establece regímenes de protección de primer, segundo y tercer grado.
      La reserva figura en las listas Ramsar, IBA e IPA.
    before: >-
      La mejor época va de abril a octubre. Hay que respetar las zonas de protección y no navegar fuera del
      Stari Begej.
    around: >-
      A veintidós kilómetros queda el [Parque Natural del Lago Salado Rusanda](/lugar/park-prirode-rusanda/).
      Más lejos, el [Pequeño Balatón - Parque Nacional de las Alturas del
      Balatón](/lugar/kis-balaton---balaton-felvideki-nemzeti-park/) y el [Parque Nacional de Hortobágy - La
      Puszta Húngara](/lugar/hortobagyi-nemzeti-park---puszta/) comparten con Carska Bara la nutria y los
      humedales.
  en:
    intro: >-
      Until 1964, the Stari Begej was a navigable, living stretch of the Bega river. That year a new canal was
      cut and the old channel became an abandoned meander: over time it turned muddy and marshy, and out of
      that loss was born one of the richest bird wetlands of the Pannonian Plain. Carska Bara, which in
      Serbian means 'imperial pond', lies on the floodplain between the Begej and the Tisza, 17 km south of
      Zrenjanin, forming a system of three ponds (Carska, Perleska and Tiganjica) linked by the 8 km of the
      Stari Begej channel.
    landscape: >-
      The complex brings together the channel of the Old Begej and the marshes of Carska Bara, Tiganjica,
      Perleska, Botoški Rit and Mužljanski Rit. It is a wetland of rivers, canals, lakes and ponds covered in
      reedbeds, willow groves and rush beds, known for its variety of colours. It forms a mosaic of marsh,
      woodland, meadow, steppe and salt flat, with endemic, subendemic and relict species of the Pannonian
      region.


      The waters are shallow: here the Begej is between 2 and 3 m deep, while the marsh is only 80 cm. Among
      the aquatic plants are water fern, white water lily and yellow water lily; some 500 plant species have
      been recorded, and stands of old willow groves and forests of black poplar and narrow-leaved ash are
      preserved. The main invasive species is water chestnut.
    wildlife: >-
      This is a bird site. There are 240 species, 130 resident and 110 migratory. Among the breeders are
      colonies of [grey heron](/especie/ardea_cinerea/), [little egret](/especie/egretta_garzetta/) and
      [black-crowned night heron](/especie/nycticorax_nycticorax/), as well as pygmy cormorant. Among the
      herons, all eight European species are said to nest here. Those colonies shift within the reserve
      according to fish abundance.


      There are also [Eurasian spoonbill](/especie/platalea_leucorodia/), [western marsh
      harrier](/especie/circus_aeruginosus/), [Montagu's harrier](/especie/circus_pygargus/), red-breasted
      goose and [osprey](/especie/pandion_haliaetus/). The white-tailed eagle sits at the top of the food
      chain and reaches a 2.5 m wingspan. Some migratory birds stop for about ten days, and Siberian geese may
      overwinter: some 50,000 greater white-fronted geese spend December and January here on their journey
      from Siberia to southern Europe.


      In the water live 24 fish species, and the muddy waters are ideal for [pike](/especie/esox_lucius/).
      Among amphibians and reptiles, [fire salamander](/especie/salamandra_salamandra/), edible frog, sand
      lizard and [European pond turtle](/especie/emys_orbicularis/) are common. And despite being a marsh,
      there are almost no mosquitoes, something local biologists attribute to the huge number of frogs.
      Mammals include wild boar, roe deer, red fox, hare, muskrat, bats, hedgehog, mole, weasel, hamster and
      polecat; the [Eurasian otter](/especie/lutra_lutra/) is under strict protection.
    visit: >-
      Everything here is done unhurriedly. There is a four-kilometre health trail, a route along the reserve
      dyke that can be done by bicycle or electric bike, and the option to rent canoes to paddle along the Old
      Begej. Boating is forbidden on the ponds, though permitted on the Stari Begej. Birdwatching is among the
      reserve's main activities.
    history: >-
      Human remains in the area date back to 4,000 BC, with burial mounds discovered near Mužlja and Titel.
      According to legend, the marsh is named after Attila, king of the Huns. The reserve protects 4,726
      hectares, and the decree establishes first-, second- and third-degree protection zones. The reserve is
      listed under Ramsar, IBA and IPA.
    before: >-
      The best time runs from April to October. You must respect the protection zones and not take boats
      outside the Stari Begej.
    around: >-
      Twenty-two kilometres away lies [Rusanda Salt Lake Nature Park](/lugar/park-prirode-rusanda/). Further
      afield, [Kis-Balaton - Balaton Uplands National
      Park](/lugar/kis-balaton---balaton-felvideki-nemzeti-park/) and [Hortobágy National Park - The Hungarian
      Puszta](/lugar/hortobagyi-nemzeti-park---puszta/) share the otter and wetland habitats with Carska Bara.
  fr:
    intro: >-
      Jusqu'en 1964, le Stari Begej était un tronçon navigable et vivant de la rivière Bega. Cette année-là,
      un nouveau canal fut creusé et l'ancien lit devint un méandre abandonné : avec le temps il devint vaseux
      et marécageux, et de cette perte naquit l'une des zones humides ornithologiques les plus riches de la
      plaine pannonienne. Carska Bara, qui en serbe signifie « étang impérial », occupe la plaine alluviale
      entre le Begej et la Tisza, à 17 km au sud de Zrenjanin, formant un système de trois étangs (Carska,
      Perleska et Tiganjica) reliés par les 8 km du canal du Stari Begej.
    landscape: >-
      Le complexe réunit le lit du Vieux Begej et les marais de Carska Bara, Tiganjica, Perleska, Botoški Rit
      et Mužljanski Rit. C'est une zone humide de rivières, canaux, lacs et étangs couverts de roselières,
      saulaies et jonchaies, réputée pour sa variété de couleurs. Elle forme une mosaïque de marais, forêt,
      prairie, steppe et pré salé, avec des espèces endémiques, subendémiques et reliques de l'espace
      pannonien.


      Les eaux sont peu profondes : ici le Begej mesure entre 2 et 3 m, tandis que le marais n'a que 80 cm.
      Parmi les plantes aquatiques poussent la fougère d'eau, le nénuphar blanc et le nénuphar jaune ; quelque
      500 espèces végétales ont été recensées, et l'on conserve des peuplements de vieilles saulaies ainsi que
      des forêts de peuplier noir et de frêne à feuilles étroites. La principale espèce envahissante est la
      mâcre nageante.
    wildlife: >-
      C'est un site d'oiseaux. On compte 240 espèces, 130 sédentaires et 110 migratrices. Parmi les nicheurs
      figurent des colonies de [héron cendré](/especie/ardea_cinerea/), d'[aigrette
      garzette](/especie/egretta_garzetta/) et de [bihoreau gris](/especie/nycticorax_nycticorax/), ainsi que
      de cormoran pygmée. Chez les hérons, on dit que les huit espèces européennes y nichent. Ces colonies
      déplacent leur emplacement dans la réserve selon l'abondance des poissons.


      On y trouve aussi la [spatule blanche](/especie/platalea_leucorodia/), le [busard des
      roseaux](/especie/circus_aeruginosus/), le [busard cendré](/especie/circus_pygargus/), la bernache à cou
      roux et le [balbuzard pêcheur](/especie/pandion_haliaetus/). Le pygargue à queue blanche se situe au
      sommet de la chaîne alimentaire et atteint 2,5 m d'envergure. Certains oiseaux migrateurs s'y arrêtent
      environ dix jours, et les oies sibériennes peuvent y hiverner : quelque 50 000 oies rieuses y passent
      décembre et janvier lors de leur voyage de Sibérie vers le sud de l'Europe.


      Dans l'eau vivent 24 espèces de poissons, et les eaux vaseuses sont idéales pour le [grand
      brochet](/especie/esox_lucius/). Parmi les amphibiens et reptiles abondent la [salamandre
      tachetée](/especie/salamandra_salamandra/), la grenouille verte, le lézard des souches et la [cistude
      d'Europe](/especie/emys_orbicularis/). Et, bien que ce soit un marais, il n'y a presque pas de
      moustiques, ce que les biologistes locaux attribuent à la grande quantité de grenouilles. Parmi les
      mammifères vivent sanglier, chevreuil, renard, lièvre, rat musqué, chauves-souris, hérisson, taupe,
      belette, hamster et putois ; la [loutre d'Europe](/especie/lutra_lutra/) bénéficie d'une protection
      stricte.
    visit: >-
      Tout se fait sans hâte. Il existe un sentier de santé de quatre kilomètres, un parcours sur la digue de
      la réserve faisable à vélo ou à vélo électrique, et la possibilité de louer des canoës pour pagayer sur
      le Vieux Begej. La navigation est interdite sur les étangs, mais autorisée sur le Stari Begej.
      L'observation des oiseaux figure parmi les activités de la réserve.
    history: >-
      Des vestiges humains attestent d'une présence dès 4 000 ans avant J.-C., avec des tumulus découverts
      près de Mužlja et Titel. Selon la légende, le marais doit son nom à Attila, roi des Huns. La réserve
      protège 4 726 hectares et le décret établit des régimes de protection de premier, deuxième et troisième
      degré. La réserve figure sur les listes Ramsar, IBA et IPA.
    before: >-
      La meilleure période s'étend d'avril à octobre. Respectez les zones de protection et ne naviguez pas
      hors du Stari Begej.
    around: >-
      À vingt-deux kilomètres se trouve le [Parc naturel du lac salé Rusanda](/lugar/park-prirode-rusanda/).
      Plus loin, le [Petit Balaton - Parc national des hauteurs du
      Balaton](/lugar/kis-balaton---balaton-felvideki-nemzeti-park/) et le [Parc national de Hortobágy - La
      Puszta hongroise](/lugar/hortobagyi-nemzeti-park---puszta/) partagent avec Carska Bara la loutre et les
      zones humides.
  de:
    intro: >-
      Bis 1964 war der Stari Begej ein schiffbarer, lebendiger Abschnitt des Flusses Bega. In jenem Jahr wurde
      ein neuer Kanal gegraben und das alte Flussbett blieb als Altarm zurück: Mit der Zeit verschlickte und
      versumpfte es, und aus diesem Verlust entstand eines der vogelreichsten Feuchtgebiete der Pannonischen
      Tiefebene. Carska Bara, was auf Serbisch «Kaiserlicher Teich» bedeutet, liegt in der Flussaue zwischen
      Begej und Theiß, 17 km südlich von Zrenjanin, und bildet ein System aus drei Teichen (Carska, Perleska
      und Tiganjica), verbunden durch den 8 km langen Kanal des Stari Begej.
    landscape: >-
      Der Komplex vereint das Bett des Alten Begej und die Sümpfe von Carska Bara, Tiganjica, Perleska,
      Botoški Rit und Mužljanski Rit. Es ist ein Feuchtgebiet aus Flüssen, Kanälen, Seen und Teichen voller
      Schilf, Weiden und Binsen, bekannt für seine Farbenvielfalt. Es bildet ein Mosaik aus Sumpf, Wald,
      Wiese, Steppe und Salzboden mit endemischen, subendemischen und reliktischen Arten des pannonischen
      Raums.


      Die Gewässer sind flach: Der Begej ist hier zwischen 2 und 3 m tief, während der Sumpf nur 80 cm misst.
      Unter den Wasserpflanzen wachsen Schwimmfarn, Weiße Seerose und Gelbe Teichrose; rund 500 Pflanzenarten
      wurden erfasst, und es gibt alte Weidenbestände sowie Wälder aus Schwarzpappel und Schmalblättriger
      Esche. Die wichtigste invasive Art ist die Wassernuss.
    wildlife: >-
      Dies ist ein Vogelgebiet. Es gibt 240 Arten, 130 Standvögel und 110 Zugvögel. Zu den Brutvögeln zählen
      Kolonien von [Graureiher](/especie/ardea_cinerea/), [Seidenreiher](/especie/egretta_garzetta/) und
      [Nachtreiher](/especie/nycticorax_nycticorax/) sowie der Zwergscharbe. Von den Reihern heißt es, dass
      alle acht europäischen Arten hier nisten. Diese Kolonien verlegen ihren Standort innerhalb des Reservats
      je nach Fischreichtum.


      Zudem gibt es [Löffler](/especie/platalea_leucorodia/), [Rohrweihe](/especie/circus_aeruginosus/),
      [Wiesenweihe](/especie/circus_pygargus/), Rothalsgans und [Fischadler](/especie/pandion_haliaetus/). Der
      Seeadler steht an der Spitze der Nahrungskette und erreicht 2,5 m Spannweite. Manche Zugvögel rasten
      etwa zehn Tage, und sibirische Gänse können überwintern: Rund 50.000 Blässgänse verbringen hier Dezember
      und Januar auf ihrem Zug von Sibirien nach Südeuropa.


      Im Wasser leben 24 Fischarten, und die schlammigen Gewässer sind ideal für den
      [Hecht](/especie/esox_lucius/). Unter den Amphibien und Reptilien sind
      [Feuersalamander](/especie/salamandra_salamandra/), Teichfrosch, Zauneidechse und [Europäische
      Sumpfschildkröte](/especie/emys_orbicularis/) häufig. Und obwohl es ein Sumpf ist, gibt es kaum Mücken,
      was örtliche Biologen auf die große Zahl an Fröschen zurückführen. Unter den Säugetieren leben
      Wildschwein, Reh, Fuchs, Hase, Bisamratte, Fledermäuse, Igel, Maulwurf, Mauswiesel, Hamster und Iltis;
      der [Eurasische Fischotter](/especie/lutra_lutra/) steht unter strengem Schutz.
    visit: >-
      Alles geht hier gemächlich zu. Es gibt einen vier Kilometer langen Gesundheitspfad, eine Strecke auf dem
      Reservatsdeich für Fahrrad oder E-Bike sowie die Möglichkeit, Kanus zu mieten, um auf dem Alten Begej zu
      paddeln. Auf den Teichen ist das Bootfahren verboten, auf dem Stari Begej jedoch erlaubt.
      Vogelbeobachtung gehört zu den Hauptaktivitäten des Reservats.
    history: >-
      Menschliche Spuren in der Gegend reichen bis 4.000 Jahre vor Christus zurück, mit Grabhügeln nahe Mužlja
      und Titel. Der Legende nach ist der Sumpf nach Attila, dem König der Hunnen, benannt. Das Reservat
      schützt 4.726 Hektar, und die Verordnung legt Schutzstufen ersten, zweiten und dritten Grades fest. Das
      Reservat steht auf den Listen von Ramsar, IBA und IPA.
    before: >-
      Die beste Zeit reicht von April bis Oktober. Halte die Schutzzonen ein und fahre nicht außerhalb des
      Stari Begej mit dem Boot.
    around: >-
      Zweiundzwanzig Kilometer entfernt liegt der [Naturpark Salzsee Rusanda](/lugar/park-prirode-rusanda/).
      Weiter weg teilen der [Klein-Balaton - Nationalpark
      Balaton-Oberland](/lugar/kis-balaton---balaton-felvideki-nemzeti-park/) und der [Nationalpark Hortobágy
      - Die ungarische Puszta](/lugar/hortobagyi-nemzeti-park---puszta/) mit Carska Bara den Fischotter und
      die Feuchtgebiete.
  it:
    intro: >-
      Fino al 1964 lo Stari Begej era un tratto navigabile e vivo del fiume Bega. Quell'anno fu aperto un
      nuovo canale e il vecchio alveo rimase come meandro abbandonato: col tempo divenne fangoso e paludoso, e
      da quella perdita nacque una delle zone umide ornitologiche più ricche della pianura pannonica. Carska
      Bara, che in serbo significa «stagno imperiale», occupa la pianura alluvionale tra il Begej e il
      Tibisco, 17 km a sud di Zrenjanin, formando un sistema di tre stagni (Carska, Perleska e Tiganjica)
      collegati dagli 8 km del canale dello Stari Begej.
    landscape: >-
      Il complesso riunisce il letto del Vecchio Begej e le paludi di Carska Bara, Tiganjica, Perleska,
      Botoški Rit e Mužljanski Rit. È una zona umida di fiumi, canali, laghi e stagni coperti di canneti,
      saliceti e giuncheti, nota per la sua varietà di colori. Forma un mosaico di palude, bosco, prato,
      steppa e terreno salino, con specie endemiche, subendemiche e relitte dello spazio pannonico.


      Le acque sono poco profonde: qui il Begej misura tra 2 e 3 m, mentre la palude raggiunge appena gli 80
      cm. Tra le piante acquatiche ci sono la felce d'acqua, la ninfea bianca e la ninfea gialla; sono state
      registrate circa 500 specie vegetali e si conservano nuclei di vecchi saliceti e boschi di pioppo nero e
      frassino ossifillo. La principale specie invasiva è la castagna d'acqua.
    wildlife: >-
      Questo è un luogo di uccelli. Ci sono 240 specie, 130 stanziali e 110 migratrici. Tra i nidificanti
      figurano colonie di [airone cenerino](/especie/ardea_cinerea/), [garzetta](/especie/egretta_garzetta/) e
      [nitticora](/especie/nycticorax_nycticorax/), oltre al marangone minore. Degli aironi si racconta che
      nidifichino tutte e otto le specie europee. Quelle colonie cambiano posto all'interno della riserva a
      seconda dell'abbondanza di pesci.


      Ci sono anche la [spatola](/especie/platalea_leucorodia/), il [falco di
      palude](/especie/circus_aeruginosus/), l'[albanella minore](/especie/circus_pygargus/), l'oca collorosso
      e il [falco pescatore](/especie/pandion_haliaetus/). L'aquila di mare è in cima alla catena alimentare e
      raggiunge 2,5 m di apertura alare. Alcuni uccelli migratori sostano una decina di giorni, e le oche
      siberiane possono svernare: circa 50.000 oche lombardelle trascorrono qui dicembre e gennaio nel loro
      viaggio dalla Siberia verso l'Europa meridionale.


      Nell'acqua vivono 24 specie di pesci, e le acque fangose sono ideali per il
      [luccio](/especie/esox_lucius/). Tra anfibi e rettili abbondano la [salamandra
      pezzata](/especie/salamandra_salamandra/), la rana verde, la lucertola agile e la [testuggine palustre
      europea](/especie/emys_orbicularis/). E, pur essendo una palude, non ci sono quasi zanzare, fatto che i
      biologi locali attribuiscono alla grande quantità di rane. Tra i mammiferi vivono cinghiale, capriolo,
      volpe, lepre, topo muschiato, pipistrelli, riccio, talpa, donnola, criceto e puzzola; la [lontra
      europea](/especie/lutra_lutra/) è sotto protezione rigorosa.
    visit: >-
      Tutto si fa con calma. C'è un sentiero della salute di quattro chilometri, un percorso sull'argine della
      riserva da fare in bicicletta o e-bike e la possibilità di noleggiare canoe per pagaiare lungo il
      Vecchio Begej. La navigazione è vietata negli stagni, ma consentita nello Stari Begej. Il birdwatching
      figura tra le attività della riserva.
    history: >-
      Ci sono tracce umane nella zona risalenti a 4.000 anni prima di Cristo, con tumuli scoperti vicino a
      Mužlja e Titel. Secondo la leggenda, la palude prende il nome da Attila, re degli Unni. La riserva
      protegge 4.726 ettari e il decreto stabilisce regimi di protezione di primo, secondo e terzo grado. La
      riserva è iscritta negli elenchi Ramsar, IBA e IPA.
    before: >-
      Il periodo migliore va da aprile a ottobre. Rispetta le zone di protezione e non navigare fuori dallo
      Stari Begej.
    around: >-
      A ventidue chilometri si trova il [Parco Naturale del Lago Salato
      Rusanda](/lugar/park-prirode-rusanda/). Più lontano, il [Piccolo Balaton - Parco Nazionale delle Alture
      del Balaton](/lugar/kis-balaton---balaton-felvideki-nemzeti-park/) e il [Parco Nazionale di Hortobágy -
      La Puszta Ungherese](/lugar/hortobagyi-nemzeti-park---puszta/) condividono con Carska Bara la lontra e
      le zone umide.
  pt:
    intro: >-
      Até 1964, o Stari Begej era um troço navegável e vivo do rio Bega. Nesse ano abriu-se um canal novo e o
      antigo leito ficou como meandro abandonado: com o tempo tornou-se lamacento e pantanoso, e dessa perda
      nasceu uma das zonas húmidas de aves mais ricas da planície panónica. Carska Bara, que em sérvio
      significa 'lagoa imperial', ocupa a planície aluvial entre o Begej e o Tisa, a 17 km a sul de Zrenjanin,
      e forma um sistema de três lagoas (Carska, Perleska e Tiganjica) ligadas pelos 8 km do canal do Stari
      Begej.
    landscape: >-
      O complexo reúne o leito do Velho Begej e os pântanos de Carska Bara, Tiganjica, Perleska, Botoški Rit e
      Mužljanski Rit. É uma zona húmida de rios, canais, lagos e lagoas cobertos de caniços, salgueirais e
      juncais, conhecida pela sua variedade de cores. É um mosaico de pântano, bosque, prado, estepe e sapal
      salgado, com espécies endémicas, subendémicas e relíquias do espaço panónico.


      As águas não são profundas: o Begej tem aqui entre 2 e 3 m, enquanto o pântano só tem 80 cm. Entre as
      plantas aquáticas há feto-de-água, nenúfar-branco e nenúfar-amarelo; foram registadas cerca de 500
      espécies de plantas e conservam-se núcleos de velhos salgueirais e bosques de choupo-negro e
      freixo-de-folha-estreita. A principal espécie invasora é a castanha-d'água.
    wildlife: >-
      Este é um sítio de aves. Há 240 espécies, 130 residentes e 110 migratórias. Entre as que nidificam
      figuram colónias de [garça-real-europeia](/especie/ardea_cinerea/),
      [garcinha-branca](/especie/egretta_garzetta/) e [savacu](/especie/nycticorax_nycticorax/), e de
      corvo-marinho-pigmeu. Entre as garças conta-se que nidificam todas as oito espécies europeias. Essas
      colónias mudam de lugar dentro da reserva consoante a abundância de peixes.


      Há também [colhereiro-europeu](/especie/platalea_leucorodia/),
      [tartaranhão-ruivo-dos-pauis](/especie/circus_aeruginosus/),
      [tartaranhão-caçador](/especie/circus_pygargus/), ganso-de-pescoço-ruivo e [águia
      pescadora](/especie/pandion_haliaetus/). A águia-rabalva está no topo da cadeia alimentar e chega aos
      2,5 m de envergadura. Algumas aves migratórias param cerca de dez dias, e os gansos siberianos podem
      invernar: cerca de 50.000 gansos-grande-de-testa-branca passam ali dezembro e janeiro na sua viagem da
      Sibéria para o sul da Europa.


      Na água vivem 24 espécies de peixes, e as águas lamacentas são ideais para o
      [lúcio](/especie/esox_lucius/). Entre os anfíbios e répteis abundam a
      [salamandra-de-fogo](/especie/salamandra_salamandra/), a rã-verde, o lagarto-ágil e o
      [cágado-de-carapaça-estriada](/especie/emys_orbicularis/). E, apesar de ser um pântano, quase não há
      mosquitos, algo que os biólogos locais atribuem à grande quantidade de rãs. Entre os mamíferos há
      javali, corço, raposa, lebre, rato-almiscarado, morcegos, ouriço, toupeira, doninha, hamster e toirão; a
      [lontra-europeia](/especie/lutra_lutra/) está sob proteção estrita.
    visit: >-
      Tudo se faz devagar. Há um trilho de saúde de quatro quilómetros, um percurso pelo dique da reserva que
      se pode fazer de bicicleta ou bicicleta elétrica e a possibilidade de alugar canoas para remar pelo
      Velho Begej. A navegação é proibida nas lagoas, mas permitida pelo Stari Begej. A observação de aves
      figura entre as atividades da reserva.
    history: >-
      Há vestígios humanos na zona desde há 4000 anos antes de Cristo, com mamoas descobertas perto de Mužlja
      e Titel. Segundo a lenda, o pântano chama-se assim por causa de Átila, rei dos hunos. A reserva protege
      4726 hectares e o decreto estabelece regimes de proteção de primeiro, segundo e terceiro grau. A reserva
      figura nas listas Ramsar, IBA e IPA.
    before: >-
      A melhor época vai de abril a outubro. Há que respeitar as zonas de proteção e não navegar fora do Stari
      Begej.
    around: >-
      A vinte e dois quilómetros fica o [Parque Natural do Lago Salgado
      Rusanda](/lugar/park-prirode-rusanda/). Mais longe, o [Pequeno Balaton - Parque Nacional das Terras
      Altas do Balaton](/lugar/kis-balaton---balaton-felvideki-nemzeti-park/) e o [Parque Nacional de
      Hortobágy - A Puszta Húngara](/lugar/hortobagyi-nemzeti-park---puszta/) partilham com Carska Bara a
      lontra e as zonas húmidas.
