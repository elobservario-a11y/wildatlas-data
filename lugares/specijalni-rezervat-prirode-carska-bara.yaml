    Más de doscientas cuarenta especies de aves en un meandro abandonado, con las ocho garzas europeas
    anidando en él.
  en: >-
    More than two hundred and forty bird species in an abandoned meander, with all eight European herons
    nesting in it.
  fr: >-
    Plus de deux cent quarante espèces d'oiseaux dans un méandre abandonné, avec les huit espèces européennes
    de hérons qui y nichent.
  de: >-
    Über zweihundertvierzig Vogelarten in einem abgeschnittenen Flussmäander, in dem alle acht europäischen
