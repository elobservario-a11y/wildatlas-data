  en: Complex of marshes, reedbeds and meanders of the Begej river holding more than 240 bird species.
  fr: >-
    Complexe de marais, de roselières et de méandres de la rivière Begej abritant plus de 240 espèces
    d'oiseaux.
  de: Komplex aus Sümpfen, Schilfröhrichten und Mäandern des Flusses Begej mit über 240 Vogelarten.
  it: Complesso di paludi, canneti e meandri del fiume Begej che ospita oltre 240 specie di uccelli.
  pt: Complexo de pântanos, caniços e meandros do rio Begej que alberga mais de 240 espécies de aves.
