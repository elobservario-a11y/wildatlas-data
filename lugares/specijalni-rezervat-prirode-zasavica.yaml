resumen:
  es: >-
    Canal fluvial fósil del río Sava donde sobrevive el pez amenazado *Umbra krameri* y la raza de burro de
    Zasavica.
  en: >-
    Fossil river channel of the Sava where the threatened mudminnow *Umbra krameri* and the Zasavica donkey
    survive.
  fr: Ancien lit fossile de la Save où survivent le poisson menacé *Umbra krameri* et la race d'âne de Zasavica.
  de: >-
    Fossiler Flussarm der Save, in dem der bedrohte Europäische Hundsfisch *Umbra krameri* und die
    Zasavica-Eselrasse überleben.
  it: >-
    Canale fluviale fossile del fiume Sava dove sopravvivono il pesce minacciato *Umbra krameri* e la razza
    asinina di Zasavica.
  pt: >-
    Canal fluvial fóssil do rio Sava onde sobrevivem o peixe ameaçado *Umbra krameri* e a raça de burro de
    Zasavica.
unico:
  es: El único lugar de Serbia donde vive la mrguda, la umbra de Kramer, y donde se recuperó el castor.
  en: >-
    The only location in Serbia harboring the European mudminnow, and where the Eurasian beaver was
    successfully re-established.
  fr: >-
    L'unique endroit de Serbie où vit le poisson-chien d'Europe et où le castor d'Europe a été réintroduit
    avec succès.
  de: >-
    Der einzige Ort Serbiens, an dem der Europäische Hundsfisch vorkommt und der Europäische Biber erfolgreich
    wiederangesiedelt wurde.
  it: >-
    L'unico luogo della Serbia dove vive l'umbra di Kramer e dove è stato reintrodotto con successo il
    castoro.
  pt: >-
    O único recanto da Sérvia onde habita a umbra-europeia e onde o castor-europeu foi reintroduzido com
    êxito.
observaciones:
  es: >-
    Abril a octubre es la mejor época. Hay un centro de visitantes con información todo el año, y el barco,
    que sale del embarcadero de madera.
texto:
  es:
    intro: >-
      Un pez de 13 a 15 cm y menos de 30 g es el símbolo de esta reserva. La mrguda (*Umbra krameri*) vive en
      Serbia solo en el cauce del Zasavica, en la Vojvodina meridional y la Mačva norte, al este del Drina y
      al sur del Sava; puede usar el oxígeno atmosférico y, en condiciones desfavorables, resistir más de diez
      horas sin agua. Alrededor de ella se levanta un humedal de cursos de agua, canales, pantanos, prados
      inundables y bosques, protegido desde 1997 y con sus humedales en la lista Ramsar.
    landscape: >-
      La columna vertebral es el arroyo Zasavica con su afluente Batar. A su alrededor se suceden aguas
      abiertas, carrizales, prados húmedos, pastos y bosques. La reserva protege 1.825 hectáreas, de las que
      675 están en la primera categoría de protección. Es un paisaje de llanura, con un pasto de 300 ha junto
      al tramo más ancho del río y bosques inundables.
    wildlife: >-
      Se han registrado más de 650 especies de plantas, más de 200 de aves y 20 de peces, además de muchos
      anfibios, reptiles y mamíferos. Entre las plantas destaca una rara carnívora acuática, la vodena
      stupica.


      La estrella es la [umbra](/especie/umbra_krameri/), símbolo de la reserva. Desova en primavera, de noche
      o por la mañana, en zonas de vegetación densa, y en toda Europa está amenazada y bajo el régimen de
      protección más estricto. Su primer dato en Serbia lo dio Josif Pančić en 1860, en el pantano de Negotin.


      Para los mamíferos se citan 65 especies, aunque 22 se consideran potencialmente presentes; entre ellas
      figuran el [castor](/especie/castor_fiber/) reintroducido, la [nutria](/especie/lutra_lutra/) y raros
      murciélagos: se han detectado 9 especies, y la reserva les ofrece huecos de árboles viejos. El gato
      montés también vive aquí. Los invasores, el coipú y el perro mapache, son un desafío para conservar la
      biodiversidad.


      De las aves, desde el barco se ven garzas, patos silvestres y
      [cormoranes](/especie/phalacrocorax_carbo/), y sobre el bosque pájaros carpinteros, cernícalos y
      rapaces. Y en los pastos se ve ganado de razas autóctonas: el burro balcánico, el cerdo mangulica, el
      [vacuno podólico](/especie/bos_taurus/) y el caballo de montaña local.
    visit: >-
      El punto de partida es el pasto de Valjevac, donde está el centro de visitantes. Su torre de madera, de
      18 m, da vista a un pasto de 300 ha y al tramo más ancho del Zasavica, y el espacio está disponible todo
      el año y las veinticuatro horas del día. El centro informa con charlas orales y paneles: mapas de la
      reserva, fotos de flora y fauna y una pequeña muestra entomológica. Allí también hay una sala
      etnográfica con objetos y herramientas de finales del siglo XIX y principios del XX.


      La mejor manera de ver el humedal es desde el agua. El barco Umbra, de 60 plazas, funciona desde 2002 y
      desde 2003 tiene un canal oficial de 7 km entre Valjevac y Šumareva ćuprija. Al inicio se ve el tramo
      más ancho del río, rodeado de pastos con ganado y caballos, y luego se entra en bosques de ribera
      inundables. Los guías explican durante la travesía el valor natural de la reserva y por qué hay que
      protegerla. También se puede observar desde la torre de 18 metros.
    history: >-
      En Zasavica se recuperó el castor europeo, reintroducido en sus cursos de agua. La reserva protege el
      hábitat de la mrguda, hoy limitada en Serbia al cauce del Zasavica. El gestor es el Movimiento de
      Goranci (Pokret gorana) de Sremska Mitrovica, en virtud del decreto de protección de la reserva.
    before: >-
      Abril a octubre es la mejor época. Hay un centro de visitantes con información todo el año, y el barco,
      que sale del embarcadero de madera.
    around: >-
      A veintinueve kilómetros queda la [Reserva Natural Especial Obedska
      Bara](/lugar/specijalni-rezervat-prirode-obedska-bara/). Más lejos, el [Río Drava y Llanura de
      Inundación](/lugar/drava-river---floodplain/) comparte con Zasavica la umbra, el castor y la nutria, y
      el [Parque Nacional de Hortobágy - La Puszta Húngara](/lugar/hortobagyi-nemzeti-park---puszta/), el
      vacuno y la nutria.
  en:
    intro: >-
      A fish measuring 13 to 15 cm and weighing under 30 g is the emblem of this reserve. The European
      mudminnow (*Umbra krameri*) survives in Serbia only along the Zasavica watercourse, in southern
      Vojvodina and northern Mačva, east of the Drina and south of the Sava; it can breathe atmospheric oxygen
      and endure more than ten hours out of water in drought conditions. Surrounding this fish stretches a
      wetland complex of slow streams, channels, marshes, flood meadows and riparian forests, protected since
      1997 and recognized as a Ramsar site.
    landscape: >-
      The hydrological spine is the slow-moving Zasavica stream and its tributary Batar. Encircling them is an
      alternating mosaic of open water, reedbeds, wet meadows, pastures and floodplain woods. The reserve
      protects 1,825 hectares, of which 675 hectares lie within the strictest first-degree protection zone. It
      is a lowland landscape featuring a 300 ha pasture bordering the widest river bend and seasonally
      inundated bottomland hardwood groves.
    wildlife: >-
      More than 650 plant species, over 200 bird species and 20 fish species have been recorded, alongside
      rich amphibian, reptile and mammal communities. Notable among the aquatic plants is the rare carnivorous
      waterwheel plant (*Aldrovanda vesiculosa*).


      The true star is the [European mudminnow](/especie/umbra_krameri/), official symbol of the reserve. It
      spawns in spring, at night or early morning among dense submerged weeds, and is strictly protected
      across Europe. Its presence in Serbia was first documented by botanist Josif Pančić in 1860 near
      Negotin.


      Among mammals, 65 species are documented, with 22 considered potentially occurring; they include the
      reintroduced [Eurasian beaver](/especie/castor_fiber/), the [Eurasian otter](/especie/lutra_lutra/) and
      rare bats: 9 species have been recorded, utilizing hollows in ancient trees. European wildcat is also
      present, while invasive muskrat, coypu and raccoon dog pose conservation challenges.


      From excursion boats visitors spot grey herons, mallards and [great
      cormorants](/especie/phalacrocorax_carbo/), with woodpeckers, kestrels and birds of prey above the
      canopy. On the pastures graze autochthonous heritage breeds: Balkan donkeys, Mangalica pigs, [Podolian
      cattle](/especie/bos_taurus/) and domestic mountain horses.
    visit: >-
      The natural departure point is the Valjevac pasture, home to the visitor centre. Its 18 m high wooden
      observation tower overlooks a 300 ha open pasture and the widest section of the Zasavica stream,
      accessible year-round, twenty-four hours a day. The visitor centre provides maps, displays on flora and
      fauna, and a modest entomological collection, beside an ethnographic room preserving rural tools and
      domestic furnishings from the late nineteenth and early twentieth centuries.


      The best perspective on the marsh is from the water. The 60-passenger electric boat Umbra has operated
      since 2002 along an official 7 km navigable channel between Valjevac and the Šumareva ćuprija bridge
      established in 2003. The cruise crosses the wide open reach surrounded by grazing livestock before
      entering flooded gallery forests, accompanied by rangers explaining the wetland's ecological value.
      Panoramic viewing is also enjoyed from the 18 m tower.
    history: >-
      Zasavica spearheaded the return of the Eurasian beaver to Serbia, successfully re-established throughout
      its waters. The reserve maintains crucial habitat for the European mudminnow, now confined in Serbia to
      this single hydrological basin. Management is entrusted to the Goranci Movement (Pokret gorana) of
      Sremska Mitrovica under statutory protection decrees.
    before: >-
      April through October offers the best conditions. The visitor centre stays open year-round, and boat
      departures run from the central wooden pier.
    around: >-
      Twenty-nine kilometres away lies the [Obedska Bara Special Nature
      Reserve](/lugar/specijalni-rezervat-prirode-obedska-bara/). Further west, the [Drava River
      Floodplain](/lugar/drava-river---floodplain/) shares with Zasavica mudminnow, beaver and otter, while
      [Hortobágy National Park - The Puszta](/lugar/hortobagyi-nemzeti-park---puszta/) shares traditional grey
      cattle husbandry and otter habitats.
  fr:
    intro: >-
      Un poisson de 13 à 15 cm pesant moins de 30 g est l'emblème de cette réserve. Le poisson-chien d'Europe
      (*Umbra krameri*) ne survit en Serbie que dans le cours de la Zasavica, en Voïvodine méridionale et dans
      le nord de la Mačva, à l'est de la Drina et au sud de la Save ; il peut utiliser l'oxygène atmosphérique
      et résister plus de dix heures hors de l'eau en période critique. Autour de lui s'étend un ensemble de
      canaux, marais, prairies inondables et forêts alluviales, protégé depuis 1997 et classé site Ramsar.
    landscape: >-
      La colonne vertébrale est le cours de la Zasavica et son affluent Batar. Autour alternent eaux libres,
      roselières, prairies humides, pâturages et forêts inondables. La réserve protège 1 825 hectares, dont
      675 en zone de protection intégrale de premier degré. Ce paysage de plaine comprend une vaste pâture de
      300 ha bordant le méandre le plus large et des boisements alluviaux inondables.
    wildlife: >-
      Plus de 650 espèces végétales, plus de 200 espèces d'oiseaux et 20 de poissons sont recensées, sans
      compter de nombreux amphibiens, reptiles et mammifères. Parmi les végétaux aquatiques émerge
      l'aldrovande carnivore.


      L'emblème absolu est le [poisson-chien](/especie/umbra_krameri/), symbole de la réserve. Il fraie au
      printemps, de nuit ou au matin dans la végétation dense, et fait l'objet d'une protection stricte à
      l'échelle européenne. Sa découverte en Serbie remonte à 1860 par le naturaliste Josif Pančić près de
      Negotin.


      Pour les mammifères, on compte 65 espèces dont 22 potentielles ; parmi elles figurent le [castor
      d'Europe](/especie/castor_fiber/) réintroduit, la [loutre d'Europe](/especie/lutra_lutra/) et des
      chauves-souris rares : 9 espèces ont été recensées, profitant des cavités d'arbres creux. Le chat
      sauvage fréquente aussi les lieux, tandis que ragondins et chiens viverrins invasifs posent défi.


      Depuis les bateaux s'observent hérons, canards sauvages et [grands
      cormorans](/especie/phalacrocorax_carbo/), tandis que picidés et rapaces survolent la canopée. Les
      pâtures accueillent des races rustiques : âne des Balkans, porc mangalica, [bœuf de
      Podolie](/especie/bos_taurus/) et cheval montagnard local.
    visit: >-
      Le point d'accès privilégié est la prairie de Valjevac abritant le centre d'accueil. Sa tour
      d'observation en bois de 18 m embrasse un pâturage de 300 ha et le plan d'eau le plus large de la
      Zasavica, accessible toute l'année et vingt-quatre heures sur vingt-quatre. Le centre propose des
      visites commentées, une exposition entomologique et des panneaux didactiques, complétés par une salle
      ethnographique d'outils et objets ruraux de la fin du XIXe et du début du XXe siècle.


      Le meilleur moyen de découvrir le marais est la voie nautique. Le bateau Umbra de 60 places fonctionne
      depuis 2002 le long d'un chenal navigable de 7 km inauguré en 2003 entre Valjevac et Šumareva ćuprija.
      L'embarcation traverse la large étendue d'eau bordée d'herbages avant de glisser sous les forêts de
      ripisylve, guidée par les explications des gardes. On peut également scruter le panorama depuis la tour
      de 18 m.
    history: >-
      Zasavica a orchestré le retour historique du castor européen, réintroduit dans ses cours d'eau. La
      réserve sauvegarde le dernier sanctuaire serbe de l'umbra. La gestion est assurée par le mouvement des
      Goranci (Pokret gorana) de Sremska Mitrovica conformément aux décrets de classement.
    before: >-
      La période d'avril à octobre est recommandée. Le centre d'accueil reste ouvert toute l'année, et les
      embarquements s'effectuent depuis l'appontement de bois.
    around: >-
      À vingt-neuf kilomètres se trouve la [réserve naturelle spéciale d'Obedska
      Bara](/lugar/specijalni-rezervat-prirode-obedska-bara/). Plus loin, la [plaine d'inondation de la
      Drave](/lugar/drava-river---floodplain/) partage avec Zasavica le poisson-chien, le castor et la loutre,
      tandis que le [parc national de Hortobágy - La Puszta](/lugar/hortobagyi-nemzeti-park---puszta/) partage
      les bovins rustiques et la loutre.
  de:
    intro: >-
      Ein 13 bis 15 cm kleiner und weniger als 30 g schwerer Fisch ist das Wahrzeichen dieses Reservats. Der
      Europäische Hundsfisch (*Umbra krameri*) lebt in Serbien ausschließlich im Fließgewässer Zasavica in der
      südlichen Vojvodina und nördlichen Mačva, östlich der Drina und südlich der Save; er vermag
      atmosphärischen Sauerstoff aufzunehmen und unter ungünstigen Bedingungen mehr als zehn Stunden außerhalb
      des Wassers zu überleben. Um ihn herum erstreckt sich eine Auenlandschaft aus Kanälen, Sümpfen,
      Überschwemmungswiesen und Wäldern, seit 1997 geschützt und als Ramsar-Gebiet ausgewiesen.
    landscape: >-
      Die Lebensader des Gebiets ist der Bach Zasavica mit seinem Zufluss Batar. Ihn umgeben offene
      Wasserflächen, Schilfgürtel, Feuchtwiesen, Weideland und Auenwälder. Das Reservat umfasst 1.825 Hektar,
      von denen 675 Hektar der strengsten ersten Schutzzone angehören. Es ist ein Tieflandmosaik mit einer 300
      ha großen Weidefläche am breitesten Flussabschnitt und regelmäßigen Überflutungsforsten.
    wildlife: >-
      Über 650 Pflanzenarten, mehr als 200 Vogelarten und 20 Fischarten sind registriert, neben zahlreichen
      Amphibien, Reptilien und Säugetieren. Unter den Wasserpflanzen ragt die seltene fleischfressende
      Wasserfalle hervor.


      Der Star ist der [Europäische Hundsfisch](/especie/umbra_krameri/), das Wappentier des Reservats. Er
      laicht im Frühjahr nachts oder morgens in dichter Wasservegetation und steht europaweit unter strengstem
      Schutz. Den Erstnachweis für Serbien erbrachte 1860 der Naturforscher Josif Pančić im Sumpf von Negotin.


      An Säugetieren sind 65 Arten belegt, wobei 22 als potenziell anwesend gelten; darunter der
      wiedereingebürgerte [Europäische Biber](/especie/castor_fiber/), der [Eurasische
      Fischotter](/especie/lutra_lutra/) und seltene Fledermäuse: 9 Arten wurden festgestellt, die Baumhöhlen
      alter Baumbestände nutzen. Auch die Wildkatze lebt hier; invasive Arten wie Bisam, Nutria und Marderhund
      stellen Herausforderungen dar.


      Vom Boot aus sieht man Reiher, Enten und [Kormorane](/especie/phalacrocorax_carbo/), über den Wäldern
      Spechte und Greifvögel. Auf den Weiden grasen einheimische Nutztierrassen: Balkanesel,
      Mangalica-Schweine, [Podolisches Rind](/especie/bos_taurus/) und Bergpferde.
    visit: >-
      Der Ausgangspunkt ist die Weide Valjevac mit dem Besucherzentrum. Der 18 m hohe hölzerne Aussichtsturm
      überblickt eine 300 ha große Freifläche und den breitesten Flussabschnitt; das Areal ist ganzjährig und
      vierundzwanzig Stunden am Tag zugänglich. Das Zentrum bietet Vorträge, Schautafeln, Karten und eine
      Insektensammlung sowie einen ethnografischen Raum mit bäuerlichem Gerät aus dem späten neunzehnten und
      frühen zwanzigsten Jahrhundert.


      Das Feuchtgebiet erschließt sich am besten vom Wasser. Das 60-sitzige Boot Umbra verkehrt seit 2002 auf
      einem 2003 eingerichteten, 7 km langen offiziellen Fahrwasser zwischen Valjevac und der Brücke Šumareva
      ćuprija. Zu Beginn zieht man am breiten Flussbogen mit weidenden Tieren vorbei, bevor die Fahrt in den
      Überflutungswald eintaucht; die Guides vermitteln unterwegs den ökologischen Wert. Die Aussicht lässt
      sich auch vom 18 m hohen Holzturm genießen.
    history: >-
      In Zasavica gelang die erfolgreiche Wiederansiedlung des Europäischen Bibers in serbischen Gewässern.
      Das Reservat schützt das letzte Refugium des Hundsfischs in Serbien. Verwaltet wird das Schutzgebiet von
      der Naturschutzorganisation Pokret gorana aus Sremska Mitrovica gemäß den gesetzlichen
      Schutzbestimmungen.
    before: >-
      April bis Oktober ist die ideale Besuchszeit. Das Besucherzentrum ist ganzjährig besetzt, und die
      Bootsfahrten starten am hölzernen Anlegesteg.
    around: >-
      Neunundzwanzig Kilometer entfernt liegt das [Sondernaturschutzgebiet Obedska
      Bara](/lugar/specijalni-rezervat-prirode-obedska-bara/). Weiter stromaufwärts teilt die
      [Drau-Aue](/lugar/drava-river---floodplain/) mit Zasavica Hundsfisch, Biber und Fischotter, während der
      [Nationalpark Hortobágy - Die Puszta](/lugar/hortobagyi-nemzeti-park---puszta/) Rinderhaltung und
      Fischotter teilt.
  it:
    intro: >-
      Un piccolo pesce lungo da 13 a 15 cm e pesante meno di 30 g è il simbolo indiscusso di questa riserva.
      L'umbra di Kramer (*Umbra krameri*) sopravvive in Serbia unicamente lungo il corso della Zasavica, nella
      Voivodina meridionale e nella Mačva settentrionale, a est della Drina e a sud della Sava; è capace di
      respirare ossigeno atmosferico e resistere oltre dieci ore all'asciutto in condizioni estreme. Attorno a
      esso si dispiega un prezioso comprensorio di canali, paludi, prati allagati e foreste ripariali,
      protetto dal 1997 e inserito nella convenzione di Ramsar.
    landscape: >-
      L'asse portante è il corso della Zasavica con l'affluente Batar. Attorno si alternano specchi d'acqua
      libera, canneti, prati umidi, pascoli e boschi ripariali. La riserva tutela 1.825 ettari, di cui 675
      ricadono nella zona a protezione integrale di primo grado. È un paesaggio di pianura arricchito da un
      pascolo di 300 ha affacciato sul punto più largo del corso d'acqua e da formazioni forestali
      alluvionali.
    wildlife: >-
      Si contano oltre 650 specie botaniche, più di 200 specie di uccelli e 20 pesci, oltre a ricche
      popolazioni di anfibi, rettili e mammiferi. Tra la flora acquatica risalta la rara pianta carnivora
      aldrovanda.


      La specie regina è l'[*Umbra krameri*](/especie/umbra_krameri/), logo della riserva. Depone le uova in
      primavera, di notte o al mattino nella fitta vegetazione sommersa, ed è considerata vulnerabile e
      rigorosamente protetta in Europa. La prima segnalazione serba risale al 1860 a opera del naturalista
      Josif Pančić nella palude di Negotin.


      Tra i mammiferi si registrano 65 specie con 22 potenziali; spiccano il [castoro
      europeo](/especie/castor_fiber/) reintrodotto, la [lontra europea](/especie/lutra_lutra/) e pipistrelli
      rari: sono 9 le specie rilevate, favorite dalle cavità dei tronchi vetusti. Vive qui anche il gatto
      selvatico, mentre nutria e cane procione destano preoccupazione.


      Dalle barche si scorgono aironi, anatre e [cormorani](/especie/phalacrocorax_carbo/), mentre tra le
      chiome volano picchi e rapaci. Nei pascoli brucano razze autoctone: l'asino dei Balcani, il maiale
      mangalica, i [bovini podolici](/especie/bos_taurus/) e il cavallo montano locale.
    visit: >-
      Il punto d'avvio ideale è il pascolo di Valjevac con il centro visite. La torre d'osservazione in legno,
      alta 18 m, domina un pascolo di 300 ha e l'ansa più larga della Zasavica, fruibile tutto l'anno
      ventiquattro ore su ventiquattro. Il centro accoglie i viaggiatori con proiezioni, carte della riserva e
      reperti entomologici, oltre a una sala etnografica con attrezzi contadini di fine Ottocento e inizio
      Novecento.


      La visuale migliore sul canneto si gode dall'acqua. Il battello Umbra da 60 posti naviga dal 2002 lungo
      un canale ufficiale di 7 km aperto nel 2003 tra Valjevac e Šumareva ćuprija. L'escursione tocca prima il
      vasto specchio d'acqua popolato da armenti e cavalli per poi addentrarsi nella foresta alluvionale, con
      il commento dei guardaparco. La vista spazia splendida anche dalla torre di 18 m.
    history: >-
      A Zasavica è avvenuta la reintroduzione storica del castoro europeo nelle acque serbe. La riserva
      difende l'ultimo areale dell'umbra in territorio serbo. La gestione compete al Movimento dei Goranci
      (Pokret gorana) di Sremska Mitrovica in forza delle leggi istitutive dell'area protetta.
    before: >-
      Da aprile a ottobre è il periodo migliore. Il centro visite è aperto tutto l'anno, con imbarchi regolari
      dal pontile di legno.
    around: >-
      A ventinove chilometri si estende la [Riserva naturale speciale di Obedska
      Bara](/lugar/specijalni-rezervat-prirode-obedska-bara/). Più a nord, la [Pianura alluvionale del fiume
      Drava](/lugar/drava-river---floodplain/) condivide con Zasavica la presenza di umbra, castoro e lontra,
      mentre il [Parco nazionale di Hortobágy - La Puszta](/lugar/hortobagyi-nemzeti-park---puszta/) condivide
      l'allevamento podolico e la lontra.
  pt:
    intro: >-
      Um pequeno peixe de 13 a 15 cm e peso inferior a 30 g é o símbolo desta reserva. A umbra-europeia
      (*Umbra krameri*) sobrevive na Sérvia exclusivamente no leito da Zasavica, no sul da Vojvodina e norte
      de Mačva, a leste do Drina e a sul do Sava; tem capacidade de respirar oxigénio atmosférico e resistir
      mais de dez horas fora de água em estiagens extremas. Em seu redor ergue-se um ecossistema de esteiros,
      canais, sapais, lameiros e matas aluviais, protegido desde 1997 e integrado na convenção Ramsar.
    landscape: >-
      A espinha dorsal é o esteiro da Zasavica e o afluente Batar. Ao longo do seu curso sucedem-se planos de
      água, caniçais, prados húmidos, pastagens e florestas ripícolas. A reserva abarca 1.825 hectares, dos
      quais 675 pertencem à zona de proteção integral de primeiro nível. Trata-se de uma paisagem de planície
      rasgada por um pasto de 300 ha contíguo ao troço mais largo do leito e por bosques inundáveis.
    wildlife: >-
      Estão recenseadas mais de 650 espécies de plantas, mais de 200 de aves e 20 de peixes, para além de
      anfíbios, répteis e mamíferos. Na flora aquática destaca-se a rara planta carnívora aldrovanda.


      A estrela maior é a [*Umbra krameri*](/especie/umbra_krameri/), símbolo do parque. Desova na primavera,
      de noite ou pela manhã entre a vegetação submersa, e encontra-se estritamente protegida na Europa. A
      primeira citação científica na Sérvia foi registada em 1860 pelo naturalista Josif Pančić na lagoa de
      Negotin.


      Nos mamíferos inventariam-se 65 espécies com 22 consideradas prováveis; incluem o
      [castor-europeu](/especie/castor_fiber/) reintroduzido, a [lontra-europeia](/especie/lutra_lutra/) e
      morcegos raros: foram identificadas 9 espécies que tiram proveito das cavidades dos carvalhos antigos. O
      gato-bravo também ocorre, enquanto espécies invasoras como o ratão-do-banhado e o cão-guaxinim
      constituem ameaças ecológicas.


      Do barco observam-se garças, patos e [corvos-marinhos-de-faces-brancas](/especie/phalacrocorax_carbo/),
      enquanto pica-paus e rapinas sobrevoam o arvoredo. Nas pastagens pastam raças rústicas autóctones: o
      burro-dos-balcãs, o porco-mangalica, o [gado podólico](/especie/bos_taurus/) e cavalos de montanha.
    visit: >-
      O polo de acolhimento é o pasto de Valjevac onde funciona o centro de visitantes. A sua torre panorâmica
      em madeira de 18 m avista uma pastagem aberta de 300 ha e o trecho mais amplo da Zasavica, aberta todo o
      ano vinte e quatro horas por dia. O centro acolhe os visitantes com palestras, mostras entomológicas e
      painéis com mapas, complementado por um núcleo etnográfico com utensílios camponeses do final do século
      XIX e início do século XX.


      A melhor forma de apreciar a paisagem é navegar nas águas. O barco elétrico Umbra de 60 lugares opera
      desde 2002 num canal oficial de 7 km traçado em 2003 entre Valjevac e Šumareva ćuprija. O percurso
      percorre a bacia aberta rodeada de gado e cavalos antes de penetrar nas matas de galeria sob explicações
      dos vigilantes. Pode também contemplar-se o horizonte a partir da torre de 18 m.
    history: >-
      Em Zasavica operou-se a histórica recuperação do castor-europeu, reinstalado com sucesso nas suas linhas
      de água. A reserva salvaguarda o habitat vital da umbra na Sérvia. A gestão cabe ao Movimento de Goranci
      (Pokret gorana) de Sremska Mitrovica por delegação do decreto de criação do parque.
    before: >-
      A época entre abril e outubro é a ideal. O centro de visitantes funciona todo o ano, com saídas de barco
      a partir do ancoradouro de madeira.
    around: >-
      A vinte e nove quilómetros estende-se a [Reserva Natural Especial de Obedska
      Bara](/lugar/specijalni-rezervat-prirode-obedska-bara/). Mais a noroeste, a [Planície de Inundação do
      Rio Drava](/lugar/drava-river---floodplain/) partilha com Zasavica a umbra, o castor e a lontra,
      enquanto o [Parque Nacional Hortobágy - A Puszta](/lugar/hortobagyi-nemzeti-park---puszta/) partilha a
      criação bovina e a lontra.
