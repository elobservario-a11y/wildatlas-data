texto:
  es:
    intro: >-
      A las puertas de una ciudad, una ladera conserva la vegetación de la estepa del sur de Ucrania. Fânațele
      Clujului es una reserva botánica a 3-4 km al norte de Cluj-Napoca, a ambos lados del valle Valea
      Fânaţelor, y una de las primeras áreas protegidas de Rumanía: lo es desde 1932. El suelo rico en
      carbonato de calcio, el relieve accidentado y el clima suave hicieron el resto.
    landscape: >-
      La reserva se reparte en dos sectores. La Copârşaie, el mayor, abarca toda la ladera sur, empinada y de
      deslizamiento, de la colina Bogomaia, parcialmente arbolada. Entre los montículos (glimee) alternan
      pastos y zonas húmedas, y en la ladera opuesta hay un heno húmedo. La Craiu, mucho más pequeño,
      comprende una zona de prado de siega.


      Dentro de La Copârşaie hay además una reserva de mariposas dedicada a Maculinea nausithous. Las dos
      zonas suman 97 y 2,2 hectáreas, respectivamente.
    wildlife: >-
      Aquí manda la estepa. La dominan gramíneas como corrillo, poa de los prados, aira caespitosa, Andropogon
      ischaemum y cebada bravía, y la sostienen un relieve muy accidentado y microclimas locales. En total,
      más de 450 especies de plantas características de la región. La reserva incluye praderas ponto-panonias
      con Festuca rupicola y Koeleria macrantha, praderas daco-sármatas con Carex humilis, Stipa joannis y
      Brachypodium pinnatum, y estepas ponto-sarmáticas con Stipa lessingiana.


      Los relictos botánicos son los que dan fama a la reserva: la efedra, el lirio estepario de Transilvania,
      Astragalus austriacus, la centaurea esteparia y el cólquico estepario. Entre las plantas protegidas a
      escala europea están Anemone pratensis, Serratula tinctoria, Echium russicum y Crambe tataria. También
      figuran Cephalaria uralensis, Serratula radiata y Centaurea trinervia, y Adonis volgensis.


      Los insectos tienen su propio capítulo: se han registrado 608 especies de macrolepidópteros, es decir,
      mariposas y polillas grandes. Entre las mariposas destacan Schistostege decussata, Scotopteryx ignorata
      y Cucullia gnaphalii, y entre los taxones endémicos, Cucullia mixta lorica, Conisania poelli
      ostrogovichi y Pseudophilotes bavius hungaricus.


      La víbora de las praderas, *Vipera ursinii rakosiensis*, vivió en la reserva y hoy se da por
      desaparecida de ella: el último ejemplar se vio en Bonțida, cerca de Cluj-Napoca, en 1962.
    visit: >-
      Para esta reserva no hay rutas, observatorios ni visitas organizadas conocidos. La reserva está a las
      afueras de Cluj-Napoca, y la visita gira en torno a la vegetación de las laderas.
    history: >-
      El gobierno rumano reconoce las reservas naturales Fânațele Clujului «La Copârşaie» y «La Craiu». En
      2016 el Ministerio de Medio Ambiente aprobó el plan integrado del sitio de importancia comunitaria
      ROSCI0295 Dealurile Clujului Est y de las dos reservas. La custodia de la reserva se había confiado a la
      ONG Transilvania Verde. Es un área protegida de interés nacional, categoría IV de la UICN, de tipo
      botánico.
    before: >-
      Antes de organizar la salida, consulta al gestor las condiciones de visita y los sectores abiertos al
      público.
    around: >-
      A 19 km queda el [Valle de Someșul Rece](/lugar/somesul-rece-valley/), y a veinticinco, la [Reserva
      Botánica de Suatu](/lugar/rezervatia-botanica-suatu/).
  en:
    intro: >-
      Just outside a bustling city, a hillside preserves the steppe vegetation typical of southern Ukraine.
      Fânațele Clujului is a botanical reserve 3-4 km north of Cluj-Napoca, flanking both sides of the Valea
      Fânațelor valley, and one of Romania's earliest protected areas, safeguarded since 1932.
      Calcium-carbonate-rich soil, rolling hummocky terrain, and a mild microclimate did the rest.
    landscape: >-
      The reserve is divided into two sectors. La Copârșaie, the larger, encompasses the entire steep,
      landslide-prone southern slope of Bogomaia hill, partly wooded. Between the earth mounds (*glimee*),
      pastures and damp depressions alternate, with a moist hayfield on the facing hillside. La Craiu,
      considerably smaller, comprises a tract of traditional mowing meadow.


      Within La Copârșaie there is also a butterfly sanctuary dedicated to *Maculinea nausithous*. The two
      sectors span 97 and 2.2 hectares, respectively.
    wildlife: >-
      Here the steppe holds sway. Dominated by grasses such as fescues, meadow grass, tufted hair-grass,
      yellow bluestem (*Andropogon ischaemum*), and wild barley, it is sustained by deeply sculpted topography
      and local microclimates. In all, more than 450 plant species characteristic of the region flourish here.
      The reserve includes Ponto-Pannonian grasslands with *Festuca rupicola* and *Koeleria macrantha*,
      Daco-Sarmatian meadows with *Carex humilis*, *Stipa joannis*, and *Brachypodium pinnatum*, and
      Ponto-Sarmatic steppes with *Stipa lessingiana*.


      Botanical relicts lend the reserve its renown: ephedra, Transylvanian steppe iris, *Astragalus
      austriacus*, steppe cornflower, and steppe autumn crocus. Plants protected at European scale include
      *Anemone pratensis*, *Serratula tinctoria*, *Echium russicum*, and *Crambe tataria*. Other notable flora
      include *Cephalaria uralensis*, *Serratula radiata*, *Centaurea trinervia*, and *Adonis volgensis*.


      Insects warrant their own chapter: 608 species of macrolepidoptera (large butterflies and moths) have
      been recorded. Notable butterflies include *Schistostege decussata*, *Scotopteryx ignorata*, and
      *Cucullia gnaphalii*, alongside endemic taxa such as *Cucullia mixta lorica*, *Conisania poelli
      ostrogovichi*, and *Pseudophilotes bavius hungaricus*.


      The meadow viper, *Vipera ursinii rakosiensis*, once inhabited the reserve but is now considered
      extirpated here; the last recorded individual was seen at Bonțida, near Cluj-Napoca, in 1962.
    visit: >-
      There are no marked trails, visitor centres, or organized tours known for this reserve. The reserve lies
      right on the outskirts of Cluj-Napoca, and visits focus on observing the flora across the open slopes.
    history: >-
      The Romanian government recognizes the nature reserves Fânațele Clujului «La Copârșaie» and «La Craiu».
      In 2016 the Ministry of Environment approved the integrated management plan for the Site of Community
      Importance ROSCI0295 Dealurile Clujului Est and both reserves. Custodianship had been entrusted to the
      NGO Transilvania Verde. It is an IUCN Category IV protected area of national interest, of botanical
      type.
    before: >-
      Before planning an excursion, consult the managing authority regarding visitation guidelines and which
      sectors are open to the public.
    around: >-
      At 19 km lies the [Someșul Rece Valley](/lugar/somesul-rece-valley/), and twenty-five kilometres away,
      the [Suatu Botanical Reserve](/lugar/rezervatia-botanica-suatu/).
  fr:
    intro: >-
      Aux portes d'une métropole, un coteau préserve la végétation steppique caractéristique du sud de
      l'Ukraine. Fânațele Clujului est une réserve botanique située à 3-4 km au nord de Cluj-Napoca, de part
      et d'autre de la vallée Valea Fânațelor, et l'une des premières aires protégées de Roumanie, classée dès
      1932. Un sol riche en carbonate de calcium, un relief tourmenté et un climat doux ont fait le reste.
    landscape: >-
      La réserve se divise en deux secteurs. La Copârșaie, le plus étendu, couvre l'ensemble du versant sud,
      abrupt et sujet aux glissements de terrain, de la colline Bogomaia, partiellement boisé. Entre les
      monticules de glissement (*glimee*) alternent pâturages et cuvettes humides, avec une prairie de fauche
      humide sur le versant opposé. La Craiu, bien plus modeste, comprend une parcelle de pré de fauche
      traditionnel.


      Au sein de La Copârșaie se trouve également une réserve de papillons consacrée à l'azuré des paluds
      (*Maculinea nausithous*). Les deux zones totalisent 97 et 2,2 hectares, respectivement.
    wildlife: >-
      Ici règne la steppe. Elle est dominée par des graminées telles que fétuques, pâturin des prés, canche
      cespiteuse, *Andropogon ischaemum* et orge sauvage, favorisées par un relief accidenté et des
      microclimats locaux. Au total, plus de 450 espèces végétales caractéristiques de la région y sont
      recensées. La réserve comprend des pelouses ponto-pannoniennes à *Festuca rupicola* et *Koeleria
      macrantha*, des prairies daco-sarmatiques à *Carex humilis*, *Stipa joannis* et *Brachypodium pinnatum*,
      ainsi que des steppes ponto-sarmatiques à *Stipa lessingiana*.


      Les relictes botaniques font la renommée de la réserve : l'éphédra, l'iris des steppes de Transylvanie,
      *Astragalus austriacus*, la centaurée des steppes et le colchique des steppes. Parmi les plantes
      protégées au niveau européen figurent *Anemone pratensis*, *Serratula tinctoria*, *Echium russicum* et
      *Crambe tataria*. S'y ajoutent *Cephalaria uralensis*, *Serratula radiata*, *Centaurea trinervia* et
      *Adonis volgensis*.


      Les insectes méritent un chapitre entier : 608 espèces de macrolépidoptères (grands papillons diurnes et
      nocturnes) y ont été inventoriées. Parmi les papillons remarquables se distinguent *Schistostege
      decussata*, *Scotopteryx ignorata* et *Cucullia gnaphalii*, et parmi les taxons endémiques, *Cucullia
      mixta lorica*, *Conisania poelli ostrogovichi* et *Pseudophilotes bavius hungaricus*.


      La vipère des prairies, *Vipera ursinii rakosiensis*, a jadis vécu dans la réserve mais en a aujourd'hui
      disparu : le dernier spécimen a été observé à Bonțida, près de Cluj-Napoca, en 1962.
    visit: >-
      Il n'existe pour cette réserve aucun sentier balisé, observatoire ou circuit guidé répertorié. La
      réserve se situe en périphérie immédiate de Cluj-Napoca, et la visite s'articule autour de l'observation
      de la flore sur les versants.
    history: >-
      L'État roumain reconnaît les réserves naturelles Fânațele Clujului « La Copârșaie » et « La Craiu ». En
      2016, le ministère de l'Environnement a validé le plan de gestion intégré du site d'importance
      communautaire ROSCI0295 Dealurile Clujului Est et des deux réserves. La gestion conservatoire avait été
      confiée à l'ONG Transilvania Verde. C'est une aire protégée d'intérêt national, catégorie IV de l'UICN,
      à vocation botanique.
    before: >-
      Avant de planifier votre venue, renseignez-vous auprès du gestionnaire sur les conditions de visite et
      les secteurs accessibles au public.
    around: >-
      À 19 km se trouve la [vallée de Someșul Rece](/lugar/somesul-rece-valley/), et à vingt-cinq kilomètres,
      la [réserve botanique de Suatu](/lugar/rezervatia-botanica-suatu/).
  de:
    intro: >-
      Vor den Toren einer Großstadt bewahrt ein Hang die Steppenvegetation der südukrainischen Steppe.
      Fânațele Clujului ist ein botanisches Reservat 3-4 km nördlich von Cluj-Napoca zu beiden Seiten des Tals
      Valea Fânațelor und eines der ältesten Schutzgebiete Rumäniens: Es steht seit 1932 unter Schutz. Der
      kalziumkarbonatreiche Boden, das bewegte Hügelrelief und das milde Lokalklima taten ein Übriges.
    landscape: >-
      Das Schutzgebiet gliedert sich in zwei Abschnitte. La Copârșaie, der größere, umfasst den gesamten
      steilen, rutschungsgefährdeten und teils bewaldeten Südhang des Bogomaia-Hügels. Zwischen den Erdhügeln
      (*glimee*) wechseln Weiden und Feuchtmulden, am Gegenhang liegt eine feuchte Mähwiese. La Craiu,
      wesentlich kleiner, umfasst einen Bereich traditioneller Mähwiese.


      Innerhalb von La Copârșaie gibt es zudem ein Schmetterlingsreservat für den Hellen
      Wiesenknopf-Ameisenbläuling (*Maculinea nausithous*). Beide Zonen umfassen 97 bzw. 2,2 Hektar.
    wildlife: >-
      Hier herrscht die Steppe. Sie wird von Gräsern wie Schaf-Schwingel, Wiesen-Rispengras, Rasen-Schmiele,
      Bartgras (*Andropogon ischaemum*) und Mäuse-Gerste beherrscht, getragen von einem stark zerfurchten
      Relief und lokalen Mikroklimata. Insgesamt gedeihen hier mehr als 450 für die Region typische
      Pflanzenarten. Das Reservat umfasst ponto-pannonische Wiesen mit *Festuca rupicola* und *Koeleria
      macrantha*, dako-sarmatische Grasfluren mit *Carex humilis*, *Stipa joannis* und *Brachypodium pinnatum*
      sowie ponto-sarmatische Steppen mit *Stipa lessingiana*.


      Die botanischen Relikte begründen den Ruf des Gebiets: Meerträubel, Siebenbürger Steppen-Schwertlilie,
      *Astragalus austriacus*, Steppen-Flockenblume und Steppen-Herbstzeitlose. Zu den europaweit geschützten
      Pflanzen gehören *Anemone pratensis*, *Serratula tinctoria*, *Echium russicum* und *Crambe tataria*.
      Ergänzt werden sie durch *Cephalaria uralensis*, *Serratula radiata*, *Centaurea trinervia* und *Adonis
      volgensis*.


      Die Insektenwelt bildet ein eigenes Kapitel: 608 Arten von Großschmetterlingen (Tag- und Nachtfalter)
      wurden nachgewiesen. Bemerkenswerte Falter sind *Schistostege decussata*, *Scotopteryx ignorata* und
      *Cucullia gnaphalii*, unter den endemischen Taxa *Cucullia mixta lorica*, *Conisania poelli
      ostrogovichi* und *Pseudophilotes bavius hungaricus*.


      Die Wiesenotter, *Vipera ursinii rakosiensis*, lebte einst im Reservat und gilt hier heute als
      verschollen: Das letzte Exemplar wurde 1962 in Bonțida nahe Cluj-Napoca gesichtet.
    visit: >-
      Für dieses Schutzgebiet sind keine markierten Pfade, Aussichtspunkte oder organisierten Führungen
      bekannt. Das Reservat liegt am Stadtrand von Cluj-Napoca, und der Besuch konzentriert sich auf die
      Erkundung der Hangvegetation.
    history: >-
      Die rumänische Regierung führt die Naturschutzgebiete Fânațele Clujului «La Copârșaie» und «La Craiu».
      2016 bestätigte das Umweltministerium den integrierten Bewirtschaftungsplan für das Gebiet von
      gemeinschaftlicher Bedeutung ROSCI0295 Dealurile Clujului Est und die beiden Reservate. Die Betreuung
      war der Nichtregierungsorganisation Transilvania Verde anvertraut worden. Es ist ein Schutzgebiet von
      nationaler Bedeutung der IUCN-Kategorie IV botanischen Typs.
    before: >-
      Erkundige dich vor dem Aufbruch bei der zuständigen Verwaltung über Besuchsbedingungen und zugängliche
      Abschnitte.
    around: >-
      In 19 km Entfernung liegt das [Someșul-Rece-Tal](/lugar/somesul-rece-valley/), und fünfundzwanzig
      Kilometer entfernt das [Botanische Reservat von Suatu](/lugar/rezervatia-botanica-suatu/).
  it:
    intro: >-
      Alle porte di una grande città, un pendio preserva la vegetazione steppica caratteristica dell'Ucraina
      meridionale. Fânațele Clujului è una riserva botanica a 3-4 km a nord di Cluj-Napoca, su entrambi i
      versanti della valle Valea Fânațelor, e una delle prime aree protette della Romania: lo è sin dal 1932.
      Il suolo ricco di carbonato di calcio, il rilievo tormentato e il microclima mite hanno fatto il resto.
    landscape: >-
      La riserva è suddivisa in due settori. La Copârșaie, il maggiore, comprende l'intero versante
      meridionale, ripido e soggetto a frane, della collina Bogomaia, parzialmente boscato. Tra i monticelli
      di frana (*glimee*) si alternano pascoli e avvallamenti umidi, con un prato da fieno umido sul versante
      opposto. La Craiu, assai più compatto, racchiude una porzione di prato da sfalcio tradizionale.


      All'interno di La Copârșaie è presente inoltre un'oasi per farfalle dedicata a *Maculinea nausithous*.
      Le due zone coprono rispettivamente 97 e 2,2 ettari.
    wildlife: >-
      Qui regna la steppa. La dominano graminacee come festuche, fienarola dei prati, pannocchina cespugliosa,
      *Andropogon ischaemum* e orzo selvatico, sorrette da una morfologia aspra e da microclimi locali. In
      totale, oltre 450 specie vegetali caratteristiche del territorio. La riserva accoglie praterie
      ponto-pannoniche con *Festuca rupicola* e *Koeleria macrantha*, prati daco-sarmatici con *Carex
      humilis*, *Stipa joannis* e *Brachypodium pinnatum*, e steppe ponto-sarmatiche con *Stipa lessingiana*.


      I relitti floristici sono il fiore all'occhiello della riserva: l'efedra, l'iris steppico di
      Transilvania, *Astragalus austriacus*, la centaurea steppica e il colchico delle steppe. Tra le specie
      protette a livello europeo compaiono *Anemone pratensis*, *Serratula tinctoria*, *Echium russicum* e
      *Crambe tataria*. Si segnalano inoltre *Cephalaria uralensis*, *Serratula radiata*, *Centaurea
      trinervia* e *Adonis volgensis*.


      Gli insetti meritano una trattazione a parte: sono state censite 608 specie di macrolepidotteri
      (farfalle diurne e notturne di grandi dimensioni). Tra le farfalle risaltano *Schistostege decussata*,
      *Scotopteryx ignorata* e *Cucullia gnaphalii*, e tra i taxa endemici *Cucullia mixta lorica*, *Conisania
      poelli ostrogovichi* e *Pseudophilotes bavius hungaricus*.


      La vipera dell'Orsini delle steppe, *Vipera ursinii rakosiensis*, ha popolato la riserva ma vi è oggi
      considerata estinta: l'ultimo esemplare fu segnalato a Bonțida, vicino a Cluj-Napoca, nel 1962.
    visit: >-
      Per questa riserva non sono presenti sentieri segnati, punti di osservazione né visite guidate
      organizzate. L'area sorge alle porte di Cluj-Napoca e la visita si concentra sull'osservazione della
      flora lungo i pendii.
    history: >-
      Lo Stato romeno riconosce le riserve naturali Fânațele Clujului «La Copârșaie» e «La Craiu». Nel 2016 il
      Ministero dell'Ambiente ha approvato il piano di gestione integrato del sito di importanza comunitaria
      ROSCI0295 Dealurile Clujului Est e delle due riserve. La tutela attiva era stata affidata alla ONG
      Transilvania Verde. È un'area protetta di interesse nazionale, categoria IV della IUCN, di indirizzo
      botanico.
    before: >-
      Prima di organizzare l'escursione, informati presso l'ente gestore sulle modalità di fruizione e sui
      settori aperti al pubblico.
    around: >-
      A 19 km si trova la [Valle di Someșul Rece](/lugar/somesul-rece-valley/), e a venticinque chilometri la
      [Riserva botanica di Suatu](/lugar/rezervatia-botanica-suatu/).
  pt:
    intro: >-
      Às portas de uma grande cidade, uma encosta conserva a vegetação estepária típica do sul da Ucrânia.
      Fânațele Clujului é uma reserva botânica a 3-4 km a norte de Cluj-Napoca, em ambas as margens do vale
      Valea Fânațelor, e uma das primeiras áreas protegidas da Roménia: foi criada em 1932. O solo rico em
      carbonato de cálcio, o relevo acidentado e o microclima ameno encarregaram-se do resto.
    landscape: >-
      A reserva reparte-se por dois setores. La Copârșaie, o maior, abrange toda a encosta sul, inclinada e
      propensa a deslizamentos, da colina Bogomaia, parcialmente arborizada. Entre os outeiros de deslizamento
      (*glimee*) alternam pastagens e depressões húmidas, surgindo um prado de feno húmido na vertente oposta.
      La Craiu, consideravelmente menor, integra uma faixa de prado de ceifa tradicional.


      Dentro de La Copârșaie existe ainda uma reserva de borboletas dedicada a *Maculinea nausithous*. As duas
      zonas somam 97 e 2,2 hectares, respetivamente.
    wildlife: >-
      Aqui reina a estepe. É dominada por gramíneas como festucas, erva-de-febra, erva-de-prado-cespitosa,
      *Andropogon ischaemum* e cevada-brava, sustentadas por uma topografia muito acidentada e microclimas
      locais. No total, mais de 450 espécies de plantas características da região. A reserva engloba prados
      ponto-panónicos com *Festuca rupicola* e *Koeleria macrantha*, pradarias daco-sarmáticas com *Carex
      humilis*, *Stipa joannis* e *Brachypodium pinnatum*, e estepes ponto-sarmáticas com *Stipa lessingiana*.


      As relíquias florísticas dão prestígio à reserva: a efedra, o lírio-estepário-da-transilvânia,
      *Astragalus austriacus*, a centáurea-estepária e o cólquico-estepário. Entre as plantas protegidas a
      nível europeu destacam-se *Anemone pratensis*, *Serratula tinctoria*, *Echium russicum* e *Crambe
      tataria*. Contam-se ainda *Cephalaria uralensis*, *Serratula radiata*, *Centaurea trinervia* e *Adonis
      volgensis*.


      Os insetos merecem um capítulo à parte: estão registadas 608 espécies de macrolepidópteros (borboletas
      diurnas e noturnas de grande porte). Nas borboletas salientam-se *Schistostege decussata*, *Scotopteryx
      ignorata* e *Cucullia gnaphalii*, e entre os táxones endémicos *Cucullia mixta lorica*, *Conisania
      poelli ostrogovichi* e *Pseudophilotes bavius hungaricus*.


      A víbora-das-estepes, *Vipera ursinii rakosiensis*, habitou a reserva mas é hoje dada como extinta no
      local: o último espécime foi avistado em Bonțida, perto de Cluj-Napoca, em 1962.
    visit: >-
      Para esta reserva não existem percursos assinalados, miradouros nem visitas organizadas documentadas. A
      reserva fica na orla de Cluj-Napoca, e a visita orienta-se pela observação da vegetação ao longo das
      encostas.
    history: >-
      O governo romeno reconhece as reservas naturais Fânațele Clujului «La Copârșaie» e «La Craiu». Em 2016,
      o Ministério do Ambiente aprovou o plano de gestão integrado do sítio de importância comunitária
      ROSCI0295 Dealurile Clujului Est e das duas reservas. A custódia tinha sido confiada à ONG Transilvania
      Verde. É uma área protegida de interesse nacional, de categoria IV da UICN, de cariz botânico.
    before: >-
      Antes de preparares o passeio, consulta a entidade gestora sobre as normas de acesso e os setores
      abertos ao público.
    around: >-
      A 19 km fica o [Vale de Someșul Rece](/lugar/somesul-rece-valley/), e a vinte e cinco quilómetros, a
      [Reserva Botânica de Suatu](/lugar/rezervatia-botanica-suatu/).
