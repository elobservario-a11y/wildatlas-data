resumen:
  es: Meandros libres, barras de grava y bosques de ribera del río Drava entre Hungría y Croacia.
  en: >-
    Free-flowing meanders, gravel bars, and riparian floodplain forests of the Drava River along the
    Hungary-Croatia border.
  fr: Méandres libres, bancs de graviers et forêts alluviales de la Drave à la frontière hungaro-croate.
  de: Freie Mäander, Schotterbänke und Auwälder der Drau entlang der ungarisch-kroatischen Grenze.
  it: >-
    Meandri naturali, barre di ghiaia e foreste riparie del fiume Drava lungo il confine tra Ungheria e
    Croazia.
  pt: >-
    Meandros livres, bancos de cascalho e florestas ripícolas do rio Drava ao longo da fronteira entre a
    Hungria e a Croácia.
unico:
  es: Un río alpino que todavía puede mover su grava, y con ella criar charrancitos.
  en: >-
    An alpine river that still shifts its gravel beds dynamically, providing breeding sites for the little
    tern.
  fr: >-
    Une rivière alpine qui charrie encore ses alluvions vives, offrant à la sterne naine ses bancs de ponte
    indispensables.
  de: >-
    Ein Alpenfluss, der seine Kiesbänke noch dynamisch verlagert und der Zwergseeschwalbe natürliche
    Brutplätze schenkt.
  it: >-
    Un fiume alpino che conserva una dinamica fluviale attiva, offrendo banchi ghiaiosi per la riproduzione
    del fraticello.
  pt: >-
    Um rio alpino que ainda transporta o seu cascalho em dinâmica livre, proporcionando locais de nidificação
    à chilreta.
observaciones:
  es: >-
    Los bancos de arena son zonas de cría: evítalos de mediados de abril a finales de julio. La mejor época va
    de mayo a octubre.
texto:
  es:
    intro: >-
      Un río puede nacer entre dolomitas, a 1450 metros, y acabar en la llanura panónica con cientos de
      kilómetros de meandros. El Drava hace ese viaje: 725 kilómetros desde las Dolomitas de Sexten, en
      Italia, a través de Austria y Eslovenia, hasta bordear Croacia y el sur de Hungría —donde marca la
      frontera entre ambos países— y desembocar en el Danubio cerca de la ciudad de Osijek.


      Esta ficha no es un parque con límites propios, sino un río y su llanura de inundación entre Hungría y
      Croacia. Lo que lo hace valioso es que, en un río cortado por veintidós centrales hidroeléctricas, aquí
      quedan tramos casi libres: meandros, bancos de grava y bosques de ribera.
    landscape: >-
      El Drava es un río pluvioglaciar: empezó a formarse en el Neógeno, con una fosa tectónica inicial, y la
      sedimentación y la erosión posteriores crearon la base de las llanuras de inundación, marismas, brazos
      muertos y orillas escarpadas. Su caudal tiene dos picos al año: en julio, cuando se funden los
      glaciares, y en noviembre, por las lluvias de otoño en la cuenca alpina.


      En el tramo que cubre el proyecto Drava LIFE, uno de los últimos cursos de agua seminaturales de Europa
      central, hay hábitats entre los más amenazados de Europa: bosques aluviales, prados húmedos, islas de
      grava y bancos de arena, brazos laterales, orillas escarpadas, brazos muertos y meandros. Los más
      frágiles son los pioneros: por la regulación, la erosión del lecho y la menor dinámica de sedimentos, en
      cien años se perdió el 92 % de los hábitats de grava y arena y el 80 % de las orillas escarpadas
      dinámicas.


      En el lado húngaro la llanura aluvial llega a medir entre 10 y 15 km de ancho en algunos puntos,
      acompañada de brazos muertos y bosques de galería. En los brazos muertos crece la castaña de agua.
    wildlife: >-
      La primavera es la estación del [charrancito común](/especie/sternula_albifrons/). En Croacia solo cría
      en el Drava, en el condado de Koprivnica-Križevci, con unas cuatro a siete parejas de media, y depende
      por completo de los bancos naturales de grava y arena: a diferencia del charrán común, no usa
      plataformas artificiales. Sus pollos, grises, pardos y amarillentos, casi se confunden con la grava. Por
      eso el proyecto pide no pisar los bancos de arena entre mediados de abril y finales de julio. En esos
      mismos bancos crían el andarríos chico y el chorlitejo chico, y en las orillas escarpadas anidan el
      avión zapador, el abejaruco y el [martín pescador](/especie/alcedo_atthis/). En el tramo húngaro hay
      además una colonia de cormoranes, el llamado «bosque de cormoranes», y miles de aves canoras en los
      bosques de galería.


      El [pigargo europeo](/especie/haliaeetus_albicilla/) y la [cigüeña negra](/especie/ciconia_nigra/) están
      presentes, aunque con poblaciones en descenso por la pérdida de hábitat y las molestias.


      Bajo el agua, el Drava tiene más de setenta especies de peces, entre ellas cinco endémicas del Danubio,
      como el [salmón del Danubio](/especie/hucho_hucho/); el [esterlete](/especie/acipenser_ruthenus/)
      también vive aquí. Entre los peces vive también la [umbra europea](/especie/umbra_krameri/); entre los
      anfibios, el [sapillo de vientre de fuego](/especie/bombina_bombina/), y en el lado húngaro destaca el
      rarísimo tritón crestado.


      En las orillas viven veintisiete familias de [castor europeo](/especie/castor_fiber/), el veinte por
      ciento de la población croata, reintroducido en la confluencia del Drava y el Mura en 1996 tras
      extinguirse regionalmente en el siglo XIX, y la [nutria](/especie/lutra_lutra/) está muy extendida, con
      96 ejemplares registrados. Entre los carnívoros protegidos están también la
      [marta](/especie/martes_martes/) y el [gato montés](/especie/felis_silvestris/), mientras que el armiño
      y la comadreja son frecuentes junto a los carrizales. Y en el curso alto del Drava croata se ha
      registrado casi el 60 % de las especies de libélulas del país.
    visit: >-
      La mejor puerta de entrada en el lado húngaro es el Centro de Visitantes Ős-Dráva, abierto todo el año.
      Presenta los valores naturales y las tradiciones de la región de Ormánság con una exposición
      interactiva, una muestra de animales domésticos autóctonos y senderos. El de la tradición agraria enseña
      cómo se cultivaba antes, con un huerto de frutales de variedades antiguas y un jardín de hierbas
      aromáticas y medicinales.


      El sendero «La vida del Drava» recorre aguas abiertas, zonas pantanosas de orilla y pastos arbolados
      llenos de flores silvestres. Tiene observatorio de aves, estación de anillamiento, mirador, hide
      fotográfico y varios puntos de descanso. Se hace con guía o por cuenta propia, con paneles o audioguía.
    history: >-
      Veintidós centrales hidroeléctricas en Austria, Eslovenia y Croacia cortaron el Drava y dejaron pocos
      tramos naturales, casi todos en Croacia. El río es además el eje de la Reserva de la Biosfera
      transfronteriza de la UNESCO Mura-Drava-Danubio, de cinco países. El proyecto Drava LIFE trabaja en
      siete sitios entre Otok Virje y Podravska Moslavina, en la mayor parte del Drava croata, con 218,3 km de
      río. Entre las especies que busca recuperar está la tamariz alemana, que solo crece en dos sitios de la
      confluencia del Drava y el Mura, en Legrad, y forma la única población natural de Croacia.
    before: >-
      Los bancos de arena son zonas de cría: evítalos de mediados de abril a finales de julio. La mejor época
      va de mayo a octubre.
    around: >-
      No hay otros lugares del atlas cerca, pero sí ríos parecidos que comparten especies y hábitats: el
      [Parque Nacional del Río Salvaje Vjosa](/lugar/vjosa-wild-river-national-park/) comparte con el Drava la
      cigüeña negra, y los ríos [Ahja](/lugar/ahja-joe-org-maastikukaitseala/) y
      [Krutynia](/lugar/rzeka-krutynia---szlak-kajakowy/) el castor y el martín pescador. El [Parque Nacional
      de Rāzna](/lugar/raznas-nacionalais-parks---ezezers/) comparte el castor y el pigargo.
  en:
    intro: >-
      A river can rise among high dolomite peaks at 1450 metres and culminate in the flat Pannonian Basin
      through hundreds of kilometres of sweeping meanders. The Drava makes that journey: 725 kilometres from
      the Sexten Dolomites in Italy, traversing Austria and Slovenia, until it borders Croatia and southern
      Hungary—forming the international boundary between both nations—before discharging into the Danube near
      Osijek.


      This entry does not denote an enclosed nature reserve, but rather the braided river and its dynamic
      floodplain spanning Hungary and Croatia. What makes it irreplaceable is that, along a waterway
      interrupted by twenty-two upstream hydropower dams, near-natural braided reaches endure here: wide
      meanders, active gravel shoals, and intact riparian galleries.
    landscape: >-
      The Drava is a fluvioglacial river: its valley originated in the Neogene along a tectonic rift, with
      subsequent alluvial deposition and erosion carving the extensive floodplains, backwaters, oxbow lakes,
      and steep eroding bluffs visible today. Its hydrologic regime features two seasonal flood pulses: in
      July, driven by alpine snowmelt, and in November, triggered by heavy autumn rainfall across the upper
      catchment.


      Along the reach encompassed by the Drava LIFE restoration project—one of the last semi-natural lowland
      river corridors in Central Europe—survive some of the continent’s most vulnerable habitats: alluvial
      hardwood and softwood forests, wet meadows, gravel islands, sandbars, side branches, and steep loess
      cut-banks. Pioneer habitats are especially imperilled: channel engineering, riverbed incision, and
      reduced sediment transport caused the loss of 92% of natural gravel and sand habitats and 80% of dynamic
      riverbank bluffs over the past century.


      On the Hungarian bank, the alluvial floodplain broadens to between 10 and 15 km in width in certain
      sectors, laced with oxbows and gallery woods where water chestnut thrives in quiet backwaters.
    wildlife: >-
      Spring belongs to the [little tern](/especie/sternula_albifrons/). In Croatia, the species nests
      exclusively along the Drava within Koprivnica-Križevci County, maintaining an average of four to seven
      breeding pairs, and depends entirely on bare, undisturbed gravel bars: unlike common terns, it refuses
      artificial floating platforms. Its speckled chicks blend invisibly with rounded river pebbles. For this
      reason, conservationists urge visitors not to set foot on sandbars from mid-April to late July. Common
      sandpipers and little ringed plovers share these shingle bars, while sand martins, European bee-eaters,
      and [common kingfishers](/especie/alcedo_atthis/) burrow into eroded vertical riverbanks. The Hungarian
      bank features a massive cormorant breeding colony alongside thousands of migratory songbirds.


      The [white-tailed eagle](/especie/haliaeetus_albicilla/) and [black stork](/especie/ciconia_nigra/)
      breed in undisturbed floodplain forests, though both face pressure from habitat degradation and
      waterborne disturbances.


      Beneath the surface, the Drava sustains more than seventy fish species, including five Danubian endemics
      like the [huchen](/especie/hucho_hucho/), alongside the [sterlet](/especie/acipenser_ruthenus/) and rare
      [European mudminnow](/especie/umbra_krameri/). Amphibians include the [European fire-bellied
      toad](/especie/bombina_bombina/) and the rare Danube crested newt.


      Along the riverbanks dwell twenty-seven families of [Eurasian beavers](/especie/castor_fiber/),
      representing twenty percent of the Croatian national population; the species was reintroduced at the
      Drava-Mura confluence in 1996 after XIX-century extirpation. The [Eurasian otter](/especie/lutra_lutra/)
      is widespread, with 96 documented individuals. Protected predators also include the [European pine
      marten](/especie/martes_martes/) and [European wildcat](/especie/felis_silvestris/), while stoats hunt
      the reedbeds. The upper Croatian Drava accounts for almost 60% of all dragonfly species known in the
      country.
    visit: >-
      The prime visitor gateway on the Hungarian side is the Ős-Dráva Visitor Centre, open year-round. It
      interprets the natural heritage and ethnography of the Ormánság cultural region through interactive
      exhibitions, native domestic livestock pens, and themed nature trails. The traditional farming trail
      demonstrates historic agriculture with heritage fruit orchards and aromatic medicinal herb gardens.


      The “Life of the Drava” nature trail winds through open backwaters, marshy shorelines, and
      wildflower-rich wood pastures. It features a bird hide, a ringing station, a canopy observation tower,
      and resting shelters, explored independently or with audio guides and ranger-led tours.
    history: >-
      Twenty-two hydroelectric dams across Austria, Slovenia, and Croatia severed the Drava, leaving only
      fragmented natural reaches, predominantly along the Croatian-Hungarian frontier. The river forms the
      spine of the five-country UNESCO Mura-Drava-Danube Biosphere Reserve. The cross-border Drava LIFE
      initiative works across seven key sites along 218.3 km of river to restore sediment dynamics and
      re-establish the German tamarisk, which survives naturally in Croatia only at two isolated gravel banks
      near Legrad.
    before: >-
      Gravel bars and sandbanks serve as vital ground-nesting sanctuaries: avoid landing or walking on them
      from mid-April through late July. The best season for river exploration runs from May to October.
    around: >-
      While neighbouring atlas entries are distant, other natural river corridors share similar dynamic
      fluvial ecology: the [Vjosa Wild River National Park](/lugar/vjosa-wild-river-national-park/) shares
      black storks, while the [Ahja River](/lugar/ahja-joe-org-maastikukaitseala/) and [Krutynia
      River](/lugar/rzeka-krutynia---szlak-kajakowy/) support beavers and kingfishers. [Rāzna National
      Park](/lugar/raznas-nacionalais-parks---ezezers/) shares beavers and white-tailed eagles.
  fr:
    intro: >-
      Une rivière peut jaillir au cœur des dolomies à 1450 mètres d’altitude et achever sa course dans la
      plaine pannonienne en d’infinis méandres. C’est le voyage de la Drave : 725 kilomètres depuis les
      Dolomites de Sesto en Italie, à travers l’Autriche et la Slovénie, avant de longer la Croatie et le sud
      de la Hongrie—matérialisant la frontière d’État—puis de se jeter dans le Danube près d’Osijek.


      Ce site ne forme pas un parc clos, mais un corridor fluvial vivant et sa plaine inondable partagés entre
      deux pays. Son caractère exceptionnel tient au fait que, sur un cours d’eau barré par vingt-deux
      centrales hydroélectriques en amont, subsistent ici des tronçons presque sauvages : méandres actifs,
      grèves et forêts alluviales.
    landscape: >-
      La Drave est une rivière fluvioglaciaire : son lit s’est amorcé au Néogène dans un fossé tectonique, les
      sédimentations et érosions successives façonnant plaines d’inondation, marais, bras morts et berges
      abruptes. Son régime hydrologique présente deux crues majeures : en juillet lors de la fonte des névés
      alpins, et en novembre sous les pluies automnales du bassin amont.


      Le secteur restauré par le projet Drava LIFE, l’un des derniers cours d’eau semi-naturels d’Europe
      centrale, abrite des habitats parmi les plus menacés du continent : forêts alluviales résiduelles,
      prairies humides, îles de graviers, bancs de sable, bras secondaires et falaises d’érosion. Les milieux
      pionniers sont les plus vulnérables : l’endiguement et l’enfoncement du lit ont entraîné en un siècle la
      disparition de 92 % des bancs de graviers et de sable et de 80 % des berges vives en érosion.


      Côté hongrois, la plaine alluviale s’élargit entre 10 et 15 km par endroits, jalonnée d’anciens méandres
      où prolifère la châtaigne d’eau.
    wildlife: >-
      Le printemps est le temps de la [sterne naine](/especie/sternula_albifrons/). En Croatie, elle ne niche
      plus que sur la Drave, dans le comitat de Koprivnica-Križevci, avec quatre à sept couples en moyenne,
      strictement tributaire des bancs de graviers nus : à la différence de la sterne pierregarin, elle refuse
      les radeaux artificiels. Ses poussins au duvet mimétique se confondent avec les galets. C’est pourquoi
      le projet demande de ne pas débarquer sur les bancs de sable de mi-avril à fin juillet. Chevalier
      guignette et petit gravelot y nichent également, tandis qu’hirondelles de rivage, guêpiers et
      [martins-pêcheurs](/especie/alcedo_atthis/) creusent leurs terriers dans les berges abruptes. En rive
      hongroise s’épanouit une grande héronnière et colonie de cormorans.


      Le [pygargue à queue blanche](/especie/haliaeetus_albicilla/) et la [cigogne
      noire](/especie/ciconia_nigra/) chassent dans les forêts inondables, fragilisés par les dérangements.


      Sous l’eau, la Drave héberge plus de soixante-dix espèces de poissons, dont cinq endémiques du bassin
      danubien comme le [saumon du Danube](/especie/hucho_hucho/) et le
      [sterlet](/especie/acipenser_ruthenus/), ainsi que le rare [poisson-chien](/especie/umbra_krameri/). Les
      amphibiens comptent le [sonneur à ventre de feu](/especie/bombina_bombina/) et le triton crêté du
      Danube.


      Sur les berges prospèrent vingt-sept familles de [castors d’Europe](/especie/castor_fiber/), soit vingt
      pour cent de la population croate, réintroduits au confluent de la Drave et de la Mura en 1996 après
      leur disparition au XIXe siècle. La [loutre d’Europe](/especie/lutra_lutra/) est bien représentée avec
      96 individus recensés. Parmi les carnivores figurent la [martre des pins](/especie/martes_martes/) et le
      [chat sauvage](/especie/felis_silvestris/). Le haut cours croate de la Drave concentre près de 60 % des
      libellules du pays.
    visit: >-
      Le point d’entrée idéal côté hongrois est le centre d’accueil Ős-Dráva, ouvert toute l’année. Il expose
      les richesses écologiques et ethnographiques de l’Ormánság grâce à un espace interactif, des enclos
      d’animaux de races rustiques et des sentiers. Le sentier des traditions agraires présente les cultures
      d’antan, avec verger ancien et jardin de simples.


      Le sentier « La vie de la Drave » parcourt bras morts, roselières et prairies arborées fleuries. Il
      propose affût ornithologique, station de baguage, belvédère et aires de repos, avec audioguides ou
      visites accompagnées.
    history: >-
      Vingt-deux barrages hydroélectriques en Autriche, Slovénie et Croatie ont fragmenté la Drave, ne
      laissant d’espaces naturels continus que le long de la frontière croato-hongroise. Le fleuve constitue
      l’axe de la réserve de biosphère transfrontière UNESCO Mura-Drave-Danube regroupant cinq pays. Le
      programme Drava LIFE restaure sept sites prioritaires sur 218,3 km de cours d’eau pour redynamiser les
      sédiments et sauver la myricaire d’Allemagne, confinée en Croatie à deux îlots de graviers vers Legrad.
    before: >-
      Les bancs de graviers et de sable sont des sites de nidification sensibles : évitez d’y accoster de la
      mi-avril à la fin juillet. La saison de navigation et de découverte s’étend de mai à octobre.
    around: >-
      D’autres cours d’eau préservés partagent cette dynamique alluviale : le [parc national du fleuve sauvage
      Vjosa](/lugar/vjosa-wild-river-national-park/) partage la cigogne noire, tandis que les rivières
      [Ahja](/lugar/ahja-joe-org-maastikukaitseala/) et [Krutynia](/lugar/rzeka-krutynia---szlak-kajakowy/)
      abritent castor et martin-pêcheur. Le [parc national de
      Rāzna](/lugar/raznas-nacionalais-parks---ezezers/) partage le castor et le pygargue.
  de:
    intro: >-
      Ein Fluss kann in den Hochdolomiten auf 1450 Metern Höhe entspringen und in der pannonischen Tiefebene
      in weiten Schleifen auslaufen. Die Drau vollzieht diese Reise: 725 Kilometer von den Sextener Dolomiten
      in Italien über Österreich und Slowenien bis an die Grenze zwischen Kroatien und Südungarn, bevor sie
      bei Osijek in die Donau mündet.


      Dieses Schutzgebiet ist kein umgrenzter Park, sondern ein lebendiger Flusskorridor mit Auen zwischen
      Ungarn und Kroatien. Sein unschätzbarer Wert liegt darin, dass an einem durch zweiundzwanzig
      Staukraftwerke regulierten Strom hier naturnahe Abschnitte erhalten blieben: freie Mäander,
      Schotterbänke und Auwälder.
    landscape: >-
      Die Drau ist ein fluvioglazialer Fluss: Ihr Bett entstand im Neogen entlang einer tektonischen
      Bruchzone; spätere Sedimentation schuf die ausgedehnten Überschwemmungsauen, Altarme und Steilufer. Der
      Abfluss zeigt zwei jährliche Hochwasserspitzen: im Juli durch die alpine Schneeschmelze und im November
      infolge ergiebiger Herbstregen im Einzugsgebiet.


      Im Bereich des Renaturierungsprojekts Drava LIFE, einem der letzten halbnatürlichen Flussläufe
      Mitteleuropas, finden sich stark gefährdete Lebensräume: Hartholz- und Weichholzauen, Feuchtwiesen,
      Schotterinseln, Sandbänke, Nebenarme und Steilufer. Pionierstandorte sind besonders bedroht: Durch
      Regulierung und Eintiefung der Flusssohle gingen in hundert Jahren 92 % der Schotter- und
      Sandlebensräume sowie 80 % der dynamischen Steilufer verloren.


      Auf ungarischer Seite erreicht die Flussaue Breiten zwischen 10 und 15 km, durchsetzt von Altarmen, in
      denen die Wassernuss gedeiht.
    wildlife: >-
      Im Frühjahr steht die [Zwergseeschwalbe](/especie/sternula_albifrons/) im Mittelpunkt. In Kroatien
      brütet sie nur noch an der Drau in der Gespanschaft Koprivnica-Križevci mit durchschnittlich vier bis
      sieben Paaren auf natürlichen Kiesinseln: Anders als die Flussseeschwalbe nimmt sie keine Kunstflöße an.
      Ihre sandfarbenen Küken sind auf dem Schotter perfekt getarnt. Das Schutzprojekt bittet daher darum,
      Kiesbänke von Mitte April bis Ende Juli nicht zu betreten. Flussuferläufer und Flussregenpfeifer brüten
      dort ebenfalls, während Uferschwalben, Bienenfresser und [Eisvogel](/especie/alcedo_atthis/) Steilufer
      besiedeln. Flussabwärts existiert eine große Kormorankolonie.


      [Seeadler](/especie/haliaeetus_albicilla/) und [Schwarzstorch](/especie/ciconia_nigra/) brüten in
      ruhigen Altholzinseln der Aue.


      Unter Wasser leben über siebzig Fischarten, darunter fünf Donau-Endemiten wie der
      [Huchen](/especie/hucho_hucho/), der [Sterlet](/especie/acipenser_ruthenus/) und der [Europäische
      Hundsfisch](/especie/umbra_krameri/). Bei den Amphibien fallen die
      [Rotbauchunke](/especie/bombina_bombina/) und der Donaukammmolch auf.


      An den Ufern leben siebenundzwanzig Familien des [Europäischen Bibers](/especie/castor_fiber/), zwanzig
      Prozent des kroatischen Bestands, der 1996 nach dem Aussterben im XIX. Jahrhundert wiederangesiedelt
      wurde. Der [Fischotter](/especie/lutra_lutra/) ist mit 96 erfassten Tieren weit verbreitet.
      [Baummarder](/especie/martes_martes/) und [Wildkatze](/especie/felis_silvestris/) streifen durch die
      Röhrichte. An der kroatischen Drau kommen fast 60 % aller Libellenarten des Landes vor.
    visit: >-
      Haupteinstiegstor in Ungarn ist das ganzjährig geöffnete Ős-Dráva-Besucherzentrum. Es vermittelt Natur
      und Traditionen der Region Ormánság in Ausstellungen, Haustiergehegen und auf Lehrpfaden. Der Bauernpfad
      zeigt historische Landwirtschaft mit alten Obstsorten und Kräutergärten.


      Der Lehrpfad „Das Leben der Drau“ führt an Altarmen, Ufermooren und blütenreichen Waldweiden entlang. Er
      bietet Vogelbeobachtungshütten, Beringungsstation, Aussichtsturm und Rastplätze für geführte oder
      individuelle Touren.
    history: >-
      Zweiundzwanzig Wasserkraftwerke in Österreich, Slowenien und Kroatien fragmentierten die Drau;
      natürliche Abschnitte blieben fast nur an der kroatisch-ungarischen Grenze intakt. Der Fluss bildet die
      Achse des Fünf-Länder-UNESCO-Biosphärenreservats Mur-Drau-Donau. Das Projekt Drava LIFE renaturiert
      sieben Schwerpunktbereiche auf 218,3 km Flusslänge, um Umlagerungsprozesse zu reaktivieren und die
      Deutsche Tamariske zu retten, die in Kroatien nur noch bei Legrad wächst.
    before: >-
      Schotter- und Sandbänke sind störungsempfindliche Brutplätze: Meide das Anlanden von Mitte April bis
      Ende Juli. Die beste Reisezeit liegt zwischen Mai und Oktober.
    around: >-
      Ähnliche intakte Flussökosysteme finden sich im Atlas: Der [Nationalpark Wildfluss
      Vjosa](/lugar/vjosa-wild-river-national-park/) teilt den Schwarzstorch, die Flüsse
      [Ahja](/lugar/ahja-joe-org-maastikukaitseala/) und [Krutynia](/lugar/rzeka-krutynia---szlak-kajakowy/)
      Biber und Eisvogel. Der [Rāzna-Nationalpark](/lugar/raznas-nacionalais-parks---ezezers/) teilt Biber und
      Seeadler.
  it:
    intro: >-
      Un fiume può sgorgare tra le cime dolomitiche a 1450 metri di quota e terminare nel bacino pannonico con
      centinaia di chilometri di meandri. La Drava compie questo viaggio: 725 chilometri dalle Dolomiti di
      Sesto in Italia, attraversando Austria e Slovenia, fino a costeggiare la Croazia e il sud
      dell’Ungheria—delineando il confine di stato—per poi gettarsi nel Danubio presso Osijek.


      Questa scheda non descrive un parco delimitato, bensì un fiume vivo e la sua golena d’inondazione
      condivisa tra due nazioni. Il suo pregio inestimabile è che, su un’asta interrotta da ventidue dighe
      idroelettriche a monte, qui permangono tratti quasi incontaminati: anse meandriformi, isolotti di ghiaia
      e boschi di ripa.
    landscape: >-
      La Drava è un corso d’acqua fluvioglaciale: la sua valle si formò nel Neogene lungo una faglia
      tettonica, con successive fasi di accumulo ed erosione che plasmarono golene, lanche, rami secondari e
      ripe scoscese. Il regime idrologico mostra due piene stagionali: a luglio per lo scioglimento delle nevi
      alpine e a novembre per le precipitazioni autunnali nel bacino montano.


      Nel settore interessato dal progetto Drava LIFE, uno degli ultimi corsi d’acqua seminaturali dell’Europa
      centrale, sopravvivono habitat tra i più minacciati del continente: foreste ripariali, prati umidi,
      banchi di sabbia e ghiaia, lanche e falesie fluviali. Gli ambienti pionieri sono i più vulnerabili:
      canalizzazioni e scavo del fondo hanno causato in un secolo la perdita del 92% degli alvei ghiaiosi e
      dell’80% delle rive erosive vive.


      Sul versante ungherese la pianura golenale si estende tra 10 e 15 km di ampiezza, costellata di meandri
      abbandonati in cui vegeta la castagna d’acqua.
    wildlife: >-
      La primavera è la stagione del [fraticello](/especie/sternula_albifrons/). In Croazia nidifica
      esclusivamente lungo la Drava nella regione di Koprivnica-Križevci, con una media di quattro-sette
      coppie legate ai banchi ghiaiosi nudi: a differenza della sterna comune, non accetta zattere
      galleggianti. I pulli mimetici si confondono tra i sassi. Per questa ragione si richiede di non sbarcare
      sulle barre di ghiaia da metà aprile a fine luglio. Piro piro piccolo e corriere piccolo condividono
      queste sponde, mentre topini, gruccioni e il [martin pescatore](/especie/alcedo_atthis/) scavano nidi
      nelle sponde verticali. Sulla riva ungherese prospera una vasta colonia di cormorani.


      [L’aquila di mare](/especie/haliaeetus_albicilla/) e la [cicogna nera](/especie/ciconia_nigra/) cacciano
      nelle foreste allagate, minacciate dal disturbo antropico.


      Nelle acque della Drava vivono oltre settanta specie ittiche, tra cui cinque endemismi danubiani come il
      [salmone del Danubio](/especie/hucho_hucho/), lo [storione cobice](/especie/acipenser_ruthenus/) e il
      raro [pesce canino](/especie/umbra_krameri/). Tra gli anfibi figurano [l’ululone dal ventre
      rosso](/especie/bombina_bombina/) e il tritone crestato del Danubio.


      Lungo le sponde risiedono ventisette famiglie di [castoro europeo](/especie/castor_fiber/), pari al
      venti per cento della popolazione croata, reintrodotto alla confluenza tra Drava e Mura nel 1996 dopo la
      scomparsa nel XIX secolo. La [lontra europea](/especie/lutra_lutra/) conta 96 individui censiti. Tra i
      predatori figurano la [martora](/especie/martes_martes/) e il [gatto
      selvatico](/especie/felis_silvestris/). Nel tratto croato superiore si concentra quasi il 60% delle
      specie di libellule del paese.
    visit: >-
      Il principale punto d’accesso in Ungheria è il centro visite Ős-Dráva, aperto tutto l’anno. Documenta la
      natura e l’etnografia della regione dell’Ormánság con percorsi interattivi, fattoria didattica e
      sentieri tematici. Il tracciato rurale illustra l’agricoltura tradizionale con frutteti storici ed erbe
      officinali.


      Il percorso natura «La vita della Drava» costeggia lanche, canneti e pascoli alberati. Offre capanno di
      birdwatching, stazione di inanellamento, torretta panoramica e punti di sosta, con visite guidate o
      audioguide.
    history: >-
      Ventidue centrali idroelettriche in Austria, Slovenia e Croazia hanno interrotto la Drava; i tratti
      intatti sopravvivono quasi unicamente al confine croato-ungherese. Il fiume costituisce l’asse portante
      della Riserva della Biosfera transfrontaliera UNESCO Mura-Drava-Danubio estesa su cinque paesi. Il
      progetto Drava LIFE opera su sette siti lungo 218,3 km di corso d’acqua per ripristinare i sedimenti e
      salvaguardare la miricaria germanica, presente in Croazia solo presso Legrad.
    before: >-
      Gli isolotti di ghiaia sono siti di nidificazione ad alta vulnerabilità: evita di sbarcarvi da metà
      aprile a fine luglio. La stagione migliore per le escursioni fluviali va da maggio a ottobre.
    around: >-
      Altri bacini fluviali intatti dell’atlas condividono ambienti analoghi: il [Parco Nazionale del Fiume
      Selvaggio Vjosa](/lugar/vjosa-wild-river-national-park/) ospita la cicogna nera, mentre i fiumi
      [Ahja](/lugar/ahja-joe-org-maastikukaitseala/) e [Krutynia](/lugar/rzeka-krutynia---szlak-kajakowy/)
      accolgono castoro e martin pescatore. Il [Parco Nazionale di
      Rāzna](/lugar/raznas-nacionalais-parks---ezezers/) condivide castoro e aquila di mare.
  pt:
    intro: >-
      Um rio pode nascer entre picos dolomíticos a 1450 metros de altitude e desembocar na planície panónica
      em centenas de quilómetros de meandros. O Drava cumpre esse périplo: 725 quilómetros desde as Dolomitas
      de Sesto em Itália, cruzando a Áustria e a Eslovénia, até delimitar a Croácia e o sul da
      Hungria—servindo de fronteira entre ambos os estados—para confluir no Danúbio junto a Osijek.


      Esta ficha não retrata um parque murado, mas um corredor fluvial ativo e a sua planície aluvial
      partilhada por dois países. O seu valor ímpar reside no facto de que, num rio fragmentado por vinte e
      duas barragens a montante, persistem aqui troços quase primitivos: meandros divagantes, ilhotas de
      cascalho e matas de galeria.
    landscape: >-
      O Drava é um rio fluvioglaciar: o seu vale instalou-se no Neogénico ao longo de uma fossa tectónica,
      tendo as fases sucessivas de sedimentação e erosão moldado planícies de cheia, pauis, meandros
      abandonados e arribas fluviais. O caudal apresenta dois picos anuais: em julho com o degelo alpino e em
      novembro sob as chuvas outonais da bacia montanhosa.


      No setor intervencionado pelo projeto Drava LIFE, um dos últimos cursos de água seminaturais da Europa
      Central, subsistem habitats extremamente ameaçados: florestas aluviais, prados húmidos, ilhas de
      cascalho, barras arenosas, braços secundários e arribas escarpadas. Os biótopos pioneiros são os mais
      frágeis: a canalização e a incisão do leito provocaram num século a perda de 92% dos habitats de
      cascalho e areia e de 80% das arribas dinâmicas em erosão.


      Na margem húngara a planície aluvial alcança entre 10 e 15 km de largura em vários setores, pontuada por
      meandros mortos onde vegeta a castanha-d’água.
    wildlife: >-
      A primavera é a época da [chilreta](/especie/sternula_albifrons/). Na Croácia nidifica apenas no Drava,
      no condado de Koprivnica-Križevci, com uma média de quatro a sete casais estritamente dependentes de
      ilhotas fluviais de cascalho: ao contrário da andorinha-do-mar-comum, rejeita plataformas artificiais.
      As crias miméticas camuflam-se entre os seixos. Por esse motivo apela-se a que não se desembarque nos
      bancos de areia de meados de abril ao final de julho. O maçarico-das-rochas e o
      borrelho-pequeno-de-coleira partilham estas barras, enquanto andorinhas-das-barreiras, abelharucos e o
      [guarda-rios-comum](/especie/alcedo_atthis/) escavam ninhos nas arribas de barro. Na margem húngara
      existe uma colónia vultosa de corvos-marinhos.


      O [picanço-isabel](/especie/haliaeetus_albicilla/) e a [cegonha-preta](/especie/ciconia_nigra/)
      nidificam em matas aluviais tranquilas, vulneráveis a perturbações.


      Sob a superfície, o Drava sustenta mais de setenta espécies piscícolas, incluindo cinco endemismos
      danubianos como o [salmão-do-danúbio](/especie/hucho_hucho/), o
      [esterleto](/especie/acipenser_ruthenus/) e o raro [peixe-cão](/especie/umbra_krameri/). Nos anfíbios
      avultam o [bombina-de-barriga-vermelha](/especie/bombina_bombina/) e o tritão-de-crista-danubiano.


      Nas margens vivem vinte e sete famílias de [castor-europeu](/especie/castor_fiber/), correspondendo a
      vinte por cento da população croata, reintroduzido na confluência do Drava e do Mura em 1996 após
      extinção no século XIX. A [lontra-europeia](/especie/lutra_lutra/) conta com 96 espécimes recenseados.
      Entre os carnívoros destacam-se a [marta](/especie/martes_martes/) e o
      [gato-bravo](/especie/felis_silvestris/). O alto curso croata do Drava alberga cerca de 60% das espécies
      de libélulas do país.
    visit: >-
      A melhor porta de entrada na Hungria é o Centro de Visitantes Ős-Dráva, aberto todo o ano. Documenta os
      ecossistemas e tradições da região de Ormánság com exposições interativas, animais de raças rurais e
      trilhos. O percurso agrícola demonstra práticas ancestrais com pomares antigos e ervas medicinais.


      O trilho «A vida do Drava» contorna braços mortos, sapais e pastagens arborizadas. Dispõe de abrigo de
      observação de aves, estação de anilhagem, torre panorâmica e áreas de repouso, com visitas livres ou
      acompanhadas.
    history: >-
      Vinte e duas barragens na Áustria, Eslovénia e Croácia fragmentaram o Drava; os troços naturais
      sobrevivem quase em exclusivo na fronteira croato-húngara. O rio constitui a espinha dorsal da Reserva
      da Biosfera transfronteiriça UNESCO Mura-Drava-Danúbio que congrega cinco países. O projeto Drava LIFE
      intervém em sete locais prioritários ao longo de 218,3 km de rio para repor a dinâmica sedimentar e
      salvaguardar a tamargueira-alemã, restrita na Croácia a duas ilhotas junto a Legrad.
    before: >-
      Os bancos de cascalho constituem áreas sensíveis de nidificação: evita desembarcar de meados de abril
      até ao final de julho. A melhor época para visitar decorre de maio a outubro.
    around: >-
      Outros rios preservados do atlas exibem dinâmicas equivalentes: o [Parque Nacional do Rio Selvagem
      Vjosa](/lugar/vjosa-wild-river-national-park/) partilha a cegonha-preta, enquanto os rios
      [Ahja](/lugar/ahja-joe-org-maastikukaitseala/) e [Krutynia](/lugar/rzeka-krutynia---szlak-kajakowy/)
      acolhem o castor e o guarda-rios. O [Parque Nacional de
      Rāzna](/lugar/raznas-nacionalais-parks---ezezers/) partilha o castor e a águia-rabalva.
