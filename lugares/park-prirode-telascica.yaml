resumen:
  es: >-
    Acantilados de más de 150 metros sobre el mar abierto y el lago salado de Mir, en el extremo sur de Dugi
    Otok.
  en: >-
    Sea cliffs rising over 150 metres above the open Adriatic and the saltwater Lake Mir, at the southern tip
    of Dugi Otok.
  fr: >-
    Falaises maritimes plongeant de plus de 150 mètres dans l’Adriatique et lac salé de Mir, à la pointe sud
    de Dugi Otok.
  de: >-
    Über 150 Meter steil ins offene Meer abfallende Klippen und der salzhaltige Mir-See am Südende von Dugi
    Otok.
  it: >-
    Falesie a picco per oltre 150 metri sul mare aperto e il lago salato Mir, all’estremità meridionale di
    Dugi Otok.
  pt: >-
    Escarpas verticais com mais de 150 metros sobre o mar aberto e o lago salgado Mir, no extremo sul de Dugi
    Otok.
unico:
  es: >-
    Tres fenómenos en un solo parque: una bahía de tres lagos, los acantilados de Dugi Otok que siguen bajo el
    agua y un lago salado, el Mir.
  en: >-
    Three natural wonders in a single park: a bay of three joined basins, sea cliffs continuing beneath the
    waves, and the saltwater Lake Mir.
  fr: >-
    Trois merveilles en un seul parc : une baie à trois bassins, des falaises plongeant sous la mer et un lac
    salé, le lac Mir.
  de: >-
    Drei Naturwunder in einem Park: eine Bucht aus drei verbundenen Becken, unter die Meeresoberfläche
    abfallende Steilklippen und der Salzsee Mir.
  it: >-
    Tre fenomeni unici: una baia articolata in tre bacini comunicanti, falesie che sprofondano nel mare e il
    lago salato Mir.
  pt: >-
    Três prodígios num único parque: uma baía de três bacias comunicantes, arribas que continuam sob o mar e o
    lago salgado Mir.
observaciones:
  es: >-
    Solo se puede caminar por zonas y sendas marcadas, los perros van atados y está prohibido encender fuego,
    acampar fuera de los lugares habilitados y arrancar plantas u hongos. Está prohibido escalar los
    acantilados de cualquier forma. Tampoco se puede recoger moluscos y otros organismos marinos ni cazar con
    arpón, y para fotografiar con fines comerciales hace falta autorización.
texto:
  es:
    intro: >-
      Mira un mapa de la isla de Dugi Otok y busca su extremo sur: una bahía de diez kilómetros que se parte
      en tres, como tres lagos unidos uno tras otro. De ahí viene el nombre, Telašćica, que en la Edad Media
      se escribía Tilagus. Es el puerto natural más seguro y grande del Adriático, y alrededor, en lo que es
      un parque natural desde 1988, hay acantilados que caen al mar, islotes, un lago salado y una costa que
      en el lado noreste está desnuda y en el suroeste cubierta de pinos, olivos e higueras.
    landscape: >-
      El parque ocupa 70,50 km², pero solo 25,95 son tierra, en Dugi Otok y los islotes vecinos; los otros
      44,55 son mar. Eso lo cambia todo: aquí el mar es el protagonista. En la bahía hay seis islotes y
      escollos, entre ellos Korotan y Galijola; la isla más pintoresca es Katina y la más extraña, Taljurić.
      La cota más alta es Mrzlovica, de 198 m, y la bahía llega a 67 m de profundidad.


      Los acantilados, las stene, son la imagen del parque. Se levantan de cara al mar abierto y siguen bajo
      la superficie. Pero la otra rareza es el lago Mir, salado por sus conexiones subterráneas con el mar.


      En tierra, el clima es mediterráneo: más de 2.500 horas de sol al año, y un mar que ronda los 13 grados
      en invierno y los 23 en verano. En verano suele soplar el maestral; en la estación fría, la bora, y los
      vientos más fuertes son los del sur, sobre todo el jugo.
    wildlife: >-
      Hay unas 500 especies de plantas en tierra, y el fondo marino suma más de 300 especies vegetales y 300
      animales. Entre las rarezas está la euforbia arbórea (Euphorbia dendroides), que aquí tiene su límite
      norte, y la centaurea de Dugi Otok, que solo crece en Dugi Otok y Kornati y vive en rocas inaccesibles
      que la protegen. A finales de primavera y en verano destaca el lirio Iris adriatica en los pastizales
      pedregosos, y en agosto y septiembre florece Seseli tomentosum. La flora incluye diez especies de
      orquídeas estrictamente protegidas.


      Las aves se ven mejor en los acantilados. En los exteriores anida el [halcón
      peregrino](/especie/falco_peregrinus/); el [halcón de Eleonora](/especie/falco_eleonorae/) solo se ha
      visto aquí como ave errante, porque cría en las islas del sur mar adentro. En las repisas bajas junto al
      mar anida el [cormorán moñudo](/especie/phalacrocorax_aristotelis/), y en el pedregal se puede ver el
      [búho real](/especie/bubo_bubo/) y, entre los pájaros cantores, la [collalba
      rubia](/especie/oenanthe_hispanica/), la perdiz griega y el roquero rojo. Los vencejos forman colonias
      en las grietas de las paredes: el pálido, el común y, aislado, el real. En el paso de primavera y otoño
      cruzan el parque muchas aves migratorias europeas y en invierno se ven diversos patos. En total se han
      registrado 115 especies de aves, entre ellas 15 de rapaces, de las que al menos cinco crían.


      Hay también nueve especies de murciélagos; la mayor colonia, en la cueva Golubinka, con entrada marina
      bajo los acantilados, reúne unos 2000 ratoneros pardos y unos 1000 [murciélagos grandes de
      herradura](/especie/rhinolophus_ferrumequinum/). De los reptiles hay 13 especies, y entre las muy
      amenazadas aparece la [tortuga boba](/especie/caretta_caretta/); entre los anfibios solo resisten el
      clima seco la ranita de San Antonio y el sapo verde.


      Bajo el agua, en los escalones de los acantilados submarinos crecen praderas de
      [posidonia](/especie/posidonia_oceanica/) donde se puede encontrar el caballito de mar de hocico largo.
    visit: >-
      Desde el continente se llega a Sali, el pueblo más cercano al parque, por ferris directos desde Zadar o
      por la línea de Brbinj y luego en coche. Pero como el parque es sobre todo mar, el barco es la forma más
      sencilla de llegar. En coche se puede entrar por el punto de acceso de Dolac, y a pie desde Dolac se
      sube a la colina de Koženjak, un castro de la Edad del Hierro.


      El Centro de Interpretación y Educación Grpašćak es una fortaleza militar reconvertida, sobre el
      acantilado más alto del Adriático. Reúne recepción, mirador, información e interpretación de los valores
      naturales y culturales de Telašćica, y educación.


      El submarinismo autónomo requiere permiso previo y solo se permite en lugares concretos: Garmenjak
      Veliki y Mali, Korotan y Podusobine.
    history: >-
      Hay restos de edificios romanos en Mala Proversa y numerosas iglesias prerrománicas, entre ellas la de
      San Juan en Stivanje polje. Y una leyenda local: en Koženjak vivían los Peteročići, gente menuda con
      cinco cuernos en la cabeza, buenos y trabajadores.


      El mar también sufre: las anclas y cadenas pesadas destruyen el fondo, las praderas de posidonia y los
      arrecifes, y su recuperación tarda décadas. En tierra, el pino carrasco lo plantó el ser humano tras la
      Segunda Guerra Mundial y se ha extendido desde Grpašćak hasta el lago Mir, y se han registrado siete
      taxones invasores, ninguno en grandes superficies. En 2008 el Instituto Ruđer Bošković hizo un estudio
      ecológico de base para medir el estado cero del fondo y calcular la capacidad de carga del ecosistema.
    before: >-
      Solo se puede caminar por zonas y sendas marcadas, los perros van atados y está prohibido encender
      fuego, acampar fuera de los lugares habilitados y arrancar plantas u hongos. Está prohibido escalar los
      acantilados de cualquier forma. Tampoco se puede recoger moluscos y otros organismos marinos ni cazar
      con arpón, y para fotografiar con fines comerciales hace falta autorización.
    around: >-
      El [Parque Nacional de Kornati](/lugar/nacionalni-park-kornati/) linda con Telašćica. Más lejos, otros
      espacios de costa comparten con él la posidonia y el delfín mular: el [Parque Natural del Archipiélago
      de Lastovo](/lugar/park-prirode-lastovsko-otocje/) y la [Meseta Kárstica y Acantilados de La
      Mola](/lugar/la-mola-formentera/) comparten además el halcón de Eleonora, y el [Parque Nacional de
      Port-Cros](/lugar/parc-national-de-port-cros/) y el [Parque Natural del Cap de
      Creus](/lugar/parc-natural-del-cap-de-creus/), la posidonia y el delfín.
  en:
    intro: >-
      Look at a map of Dugi Otok and trace its southern extremity: a sheltered bay ten kilometres long that
      branches into three connected basins, like three natural lakes laid out end to end. This gave rise to
      its name, Telašćica, documented in medieval records as Tilagus. Considered the safest and largest
      natural harbour in the Adriatic, its surroundings, protected as a nature park since 1988, encompass
      sheer sea cliffs, islets, a saltwater lake and shores that are windswept and bare to the north-east
      while carpeted in Aleppo pines, olive groves and fig trees to the south-west.
    landscape: >-
      The nature park encompasses 70.50 km², though only 25.95 km² is dry land across Dugi Otok and adjacent
      islets; the remaining 44.55 km² is marine reserve. Here the sea takes centre stage. The bay shelters six
      islets and reefs, including Korotan and Galijola; Katina is the most picturesque, while Taljurić is a
      curious flat skerry. The highest elevation is Mrzlovica, reaching 198 m, while the bay plunges to depths
      of 67 m.


      The towering cliffs, known locally as the stene, form the emblem of the park. Rising dramatically above
      the open sea, their vertical faces plunge straight into the submerged abyss. Another hydrological
      curiosity is Lake Mir, kept saline through subterranean fissures connecting it to the sea.


      On land, a Mediterranean climate prevails: over 2,500 hours of sunshine each year, with sea temperatures
      averaging around 13 degrees in winter and 23 degrees in summer. Summer is dominated by the refreshing
      maestral breeze, winter by the biting bura, while southerly jugo gales produce the heaviest seas.
    wildlife: >-
      The park harbours roughly 500 terrestrial plant species, while the marine seabed supports over 300 plant
      species and 300 animal species. Notable rarities include tree spurge (Euphorbia dendroides), which
      reaches its northernmost European distribution here, and the Dugi Otok knapweed, an endemic
      rock-clinging specialist restricted strictly to Dugi Otok and Kornati. In late spring and summer, the
      miniature wild iris Iris adriatica blooms across rocky pastures, followed by Seseli tomentosum in August
      and September. Flora includes ten strictly protected wild orchid species.


      Birdlife is best observed along the coastal precipices. The outer cliffs provide eyries for the
      [peregrine falcon](/especie/falco_peregrinus/); the rare [Eleonora's falcon](/especie/falco_eleonorae/)
      appears as a wandering visitor from southern breeding islands. On lower sea ledges nests the [European
      shag](/especie/phalacrocorax_aristotelis/), while rock screes shelter the [eagle
      owl](/especie/bubo_bubo/) alongside passerines such as the [black-eared
      wheatear](/especie/oenanthe_hispanica/), rock partridge and blue rock thrush. Swifts nest in cliff
      crevices, including pallid, common and alpine swifts. During spring and autumn migrations, vast numbers
      of European birds pass through, while winter brings diverse sea ducks. In total, 115 bird species have
      been recorded, including 15 raptor species of which at least five breed locally.


      Nine bat species inhabit the park; the largest colony roosts in Golubinka cave with an underwater sea
      entrance, sheltering some 2000 Geoffroy's bats and around 1000 [greater horseshoe
      bats](/especie/rhinolophus_ferrumequinum/). Among 13 reptile species, the endangered [loggerhead sea
      turtle](/especie/caretta_caretta/) frequents the coastal waters; among amphibians, only the European
      tree frog and green toad endure the dry summer climate.


      Submerged cliff terraces support luxuriant [Neptune grass](/especie/posidonia_oceanica/) meadows where
      the long-snouted seahorse finds refuge.
    visit: >-
      From the mainland, Sali—the nearest gateway village—is reached by direct passenger ferries from Zadar or
      via car ferries to Brbinj. Since the park is mostly marine, arrival by boat is the most scenic option.
      By vehicle, access is via the Dolac entrance, from where a walking path climbs to the Iron Age hillfort
      of Koženjak.


      The Grpašćak Interpretation and Education Centre occupies a restored military fortress crowning the
      highest cliff in the Adriatic, providing reception, panoramic viewing platforms and exhibits on
      Telašćica's marine ecosystems.


      Scuba diving requires a prior permit and is restricted to designated zones: Garmenjak Veliki and Mali,
      Korotan and Podusobine.
    history: >-
      Roman remains survive at Mala Proversa alongside numerous early medieval pre-Romanesque chapels,
      including Saint John at Stivanje polje. Local folklore tells of the Peteročići of Koženjak, industrious
      dwarf folk bearing five small horns.


      The marine realm remains vulnerable: anchoring and heavy chains tear up fragile posidonia meadows and
      coralligenous reefs, taking decades to recover. On land, Aleppo pine was planted following the Second
      World War, spreading across Grpašćak toward Lake Mir; seven alien plant taxa are monitored. In 2008, the
      Ruđer Bošković Institute completed a baseline ecological survey to assess benthic health and ecological
      carrying capacity.
    before: >-
      Walking is permitted only on signposted trails; dogs must be kept on a leash. Lighting fires, camping
      outside authorized sites and picking plants or mushrooms are strictly prohibited. Climbing cliff faces
      is banned. Collecting molluscs and spearfishing are forbidden, and commercial filming requires prior
      administrative authorization.
    around: >-
      [Kornati National Park](/lugar/nacionalni-park-kornati/) borders Telašćica directly. Farther afield,
      other marine areas sharing posidonia meadows and bottlenose dolphins include [Lastovo Archipelago Nature
      Park](/lugar/park-prirode-lastovsko-otocje/) and [La Mola Karst Plateau and
      Cliffs](/lugar/la-mola-formentera/)—both also hosting Eleonora's falcon—as well as [Port-Cros National
      Park](/lugar/parc-national-de-port-cros/) and [Cap de Creus Natural
      Park](/lugar/parc-natural-del-cap-de-creus/).
  fr:
    intro: >-
      Observez une carte de Dugi Otok et cherchez son extrémité méridionale : une profonde baie de dix
      kilomètres qui s’articule en trois bassins successifs, comme trois lacs reliés l’un à l’autre. C’est
      l’origine de son nom, Telašćica, attesté au Moyen Âge sous la forme Tilagus. Considéré comme le
      mouillage naturel le plus vaste et le plus abrité de l’Adriatique, le site, érigé en parc naturel depuis
      1988, déploie des falaises maritimes monumentales, des îlots, un lac salé et un littoral aride au
      nord-est mais tapissé de pins d'Alep, d'oliviers et de figuiers au sud-ouest.
    landscape: >-
      Le parc s’étend sur 70,50 km², dont seulement 25,95 km² de terre sur Dugi Otok et les îlots voisins ;
      les 44,55 km² restants forment le domaine marin. Ici, la mer est l’élément premier. La baie abrite six
      îlots et récifs, dont Korotan et Galijola ; l'île de Katina est la plus gracieuse et Taljurić la plus
      singulière par sa silhouette d'assiette plate. Le point culminant est Mrzlovica, à 198 m, tandis que la
      baie s’enfonce jusqu’à 67 m de fond.


      Les falaises maritimes, les stene, constituent le décor emblématique du parc. Dressées face au grand
      large, leurs murailles se prolongent sous l’eau. L’autre curiosité géologique est le lac Mir, rendu salé
      par ses communications karstiques avec la mer.


      À terre, le climat méditerranéen offre plus de 2 500 heures d’ensoleillement par an, avec des eaux
      approchant 13 degrés en hiver et 23 degrés en été. Le mistral tempère les après-midis estivaux, tandis
      que la bora et le sirocco génèrent les plus fortes houles.
    wildlife: >-
      On recense environ 500 espèces végétales terrestres, tandis que les fonds marins comptent plus de 300
      espèces végétales et 300 animales. Parmi les trésors floristiques figurent l’euphorbe arborescente
      (Euphorbia dendroides), qui atteint ici sa limite nord, et la centaurée de Dugi Otok, endémique stricte
      protégée par l'inaccessibilité des parois. En fin de printemps s'épanouit le petit iris sauvage Iris
      adriatica, puis en août Seseli tomentosum. La flore inclut dix espèces d'orchidées strictement
      protégées.


      Les falaises côtières constituent un haut lieu ornithologique. Sur les corniches extérieures niche le
      [faucon pèlerin](/especie/falco_peregrinus/) ; le [faucon d'Éléonore](/especie/falco_eleonorae/) n'y est
      observé que de passage, nichant sur les îles méridionales. Sur les gradins bas s'installe le [cormoran
      huppé](/especie/phalacrocorax_aristotelis/), tandis que les éboulis hébergent le [grand-duc
      d'Europe](/especie/bubo_bubo/), le [traquet oreillard](/especie/oenanthe_hispanica/) et le monticole
      merle-bleu. Les martinets colonisent les fissures. Lors des migrations, d'innombrables oiseaux
      traversent la baie. Au total, 115 espèces d'oiseaux sont répertoriées, dont 15 rapaces avec au moins
      cinq espèces nicheuses.


      Neuf espèces de chauves-souris sont présentes ; la plus grande colonie, dans la grotte de Golubinka
      accessible par la mer, rassemble quelque 2000 murins à oreilles échancrées et environ 1000 [grands
      rhinolophes](/especie/rhinolophus_ferrumequinum/). Parmi 13 espèces de reptiles, la [tortue
      caouanne](/especie/caretta_caretta/) fréquente la baie ; seuls la rainette et le crapaud vert résistent
      à l'aridité estivale.


      Sous l'eau, les herbiers de [posidonies](/especie/posidonia_oceanica/) abritent l'hippocampe à
      mouchetures.
    visit: >-
      Depuis le continent, Sali — village d'accès au parc — se rallie par bateaux rapides depuis Zadar ou par
      ferry jusqu'à Brbinj. Le parc étant majoritairement marin, la visite en bateau reste le mode
      d'exploration roi. Par voie terrestre, on y entre par Dolac, d'où un sentier gagne le castel
      protohistorique de Koženjak.


      Le centre d'interprétation de Grpašćak, forteresse militaire réhabilitée surplombant la plus haute
      falaise de l'Adriatique, propose belvédères, accueil et muséographie.


      La plongée autonome est strictement encadrée et limitée aux sites agréés : Garmenjak Veliki et Mali,
      Korotan et Podusobine.
    history: >-
      Des vestiges romains jalonnent Mala Proversa à côté de chapelles préromanes, dont Saint-Jean à Stivanje
      polje. La légende locale évoque les Peteročići, petit peuple légendaire à cinq cornes.


      L'ancrage des bateaux dégrade les herbiers de posidonies et les fonds coralligènes dont la régénération
      demande des décennies. À terre, les pins d'Alep plantés après la Seconde Guerre mondiale se sont étendus
      vers le lac Mir. En 2008, l'Institut Ruđer Bošković a mené une vaste étude écologique pour évaluer la
      capacité de charge du milieu marin.
    before: >-
      La marche est autorisée uniquement sur les sentiers balisés, les chiens doivent être tenus en laisse et
      il est interdit d'allumer du feu, de bivouaquer et de cueillir des plantes. L'escalade des falaises est
      interdite sous toutes ses formes. La chasse sous-marine et le ramassage d'organismes marins sont
      prohibés.
    around: >-
      Le [Parc national des Kornati](/lugar/nacionalni-park-kornati/) jouxte Telašćica. Plus loin, d'autres
      littoraux préservés partagent posidonie et dauphin souffleur : le [Parc naturel de l'archipel de
      Lastovo](/lugar/park-prirode-lastovsko-otocje/) et [La Mola - Formentera](/lugar/la-mola-formentera/)
      accueillent aussi le faucon d'Éléonore, tout comme le [Parc national de
      Port-Cros](/lugar/parc-national-de-port-cros/) et le [Parc naturel du Cap de
      Creus](/lugar/parc-natural-del-cap-de-creus/).
  de:
    intro: >-
      Blicke auf eine Landkarte von Dugi Otok und suche ihr südliches Ende: eine zehn Kilometer lange Bucht,
      die sich in drei aufeinanderfolgende Becken gliedert, wie drei aneinandergereihte Seen. Daher rührt der
      Name Telašćica, im Mittelalter Tilagus genannt. Sie gilt als sicherster und größter Naturhafen der
      Adria. Ringsum birgt der 1988 gegründete Naturpark steile Meeresklippen, Inseln, einen Salzsee und
      Küstenstriche, die im Nordosten kahl sind, im Südwesten von Aleppokiefern, Oliven und Feigenbäumen
      bedeckt.
    landscape: >-
      Der Naturpark umfasst 70,50 km², wovon nur 25,95 km² auf Landfläche entfallen; die übrigen 44,55 km²
      sind Meeresfläche. Das Meer dominiert alles. In der Bucht liegen sechs Inselchen und Felsenriffe,
      darunter Korotan und Galijola; Katina ist die malerischste Insel, Taljurić eine tellerflache Felsplatte.
      Höchste Erhebung ist der Mrzlovica mit 198 m, während die Bucht bis zu 67 m Tiefe erreicht.


      Die Steilklippen, die stene, bilden das Wahrzeichen des Parks. Sie ragen über dem offenen Meer auf und
      setzen sich unter Wasser fort. Eine weitere Besonderheit ist der Mir-See, der durch unterirdische Klüfte
      mit Meerwasser gespeist wird.


      An Land herrscht Mittelmeerklima mit über 2.500 Sonnenstunden im Jahr und Meerestemperaturen um 13 Grad
      im Winter und 23 Grad im Sommer. Im Sommer weht der Maestral, im Winter die Bora und der feuchte Jugo.
    wildlife: >-
      An Land wachsen rund 500 Pflanzenarten, im Meer leben über 300 Pflanzen- und 300 Tierarten. Zu den
      botanischen Kostbarkeiten zählen die Baum-Wolfsmilch (Euphorbia dendroides), die hier ihre nördlichste
      Verbreitung erreicht, und die Dugi-Otok-Flockenblume auf unzugänglichen Felsbändern. Im Spätfrühling
      blüht die Zwerg-Schwertlilie Iris adriatica, im Spätsommer Seseli tomentosum. Zehn streng geschützte
      Orchideenarten bereichern die Flora.


      An den Klippen brütet der [Wanderfalke](/especie/falco_peregrinus/); der seltene
      [Eleonorenfalke](/especie/falco_eleonorae/) erscheint als Nahrungsgast. Auf niedrigen Bändern nistet die
      [Krähenscharbe](/especie/phalacrocorax_aristotelis/), in den Geröllhängen leben der
      [Uhu](/especie/bubo_bubo/), die [Mittelmeer-Steinschmätzer](/especie/oenanthe_hispanica/) und die
      Blaumerle. Mauersegler nisten in Felsspalten. Insgesamt wurden 115 Vogelarten gezählt, darunter 15
      Greifvogelarten, von denen mindestens fünf brüten.


      Neun Fledermausarten sind heimisch; die größte Kolonie in der Meereshöhle Golubinka versammelt rund 2000
      Wimperfledermäuse und etwa 1000 [Große Hufeisennasen](/especie/rhinolophus_ferrumequinum/). Unter den 13
      Reptilienarten schwimmt die [Unechte Karettschildkröte](/especie/caretta_caretta/) im Küstengewässer;
      bei den Amphibien trotzen Laubfrosch und Wechselkröte der Sommerhitze.


      Unter Wasser breiten sich [Neptungraswiesen](/especie/posidonia_oceanica/) aus, in denen das
      Langschnäuzige Seepferdchen lebt.
    visit: >-
      Vom Festland gelangt man nach Sali per Personenfähre ab Zadar oder per Autofähre nach Brbinj. Da der
      Park überwiegend aus Wasserfläche besteht, ist das Boot das ideale Transportmittel. Mit dem Auto
      erreicht man den Eingang Dolac, von wo ein Wanderpfad zur eisenzeitlichen Festung Koženjak ansteigt.


      Das Besucherzentrum Grpašćak in einer restaurierten Festung auf der höchsten Klippe bietet
      Aussichtsplattformen und Ausstellungen zu Meeresökologie und Kulturgeschichte.


      Gerätetauchen ist genehmigungspflichtig und auf ausgewiesene Reviere beschränkt: Garmenjak Veliki und
      Mali, Korotan und Podusobine.
    history: >-
      Römische Spuren finden sich bei Mala Proversa sowie vorromanische Kirchen wie Sveti Ivan im Stivanje
      polje. Eine Sage erzählt von den gutmütigen Peteročići am Koženjak, kleinen Wesen mit fünf Hörnern.


      Ankernde Boote gefährden die Neptungraswiesen und Korallenriffe, deren Erholung Jahrzehnte dauert. Die
      nach dem Zweiten Weltkrieg aufgeforsteten Aleppokiefern dehnten sich bis zum Mir-See aus. 2008 führte
      das Ruđer-Bošković-Institut eine ökologische Grundlagenerhebung durch.
    before: >-
      Wandern ist nur auf markierten Wegen erlaubt; Hunde sind anzuleinen. Offenes Feuer, wildes Campen und
      das Sammeln von Pflanzen sind verboten. Das Klettern an Klippen ist untersagt. Unterwasserjagd und das
      Entnehmen von Meeresorganismen sind verboten.
    around: >-
      Der [Nationalpark Kornaten](/lugar/nacionalni-park-kornati/) grenzt direkt an Telašćica. Weiter entfernt
      liegen der [Naturpark Lastovo-Archipel](/lugar/park-prirode-lastovsko-otocje/) und [La Mola -
      Formentera](/lugar/la-mola-formentera/), die ebenfalls Eleonorenfalken und Seegraswiesen schützen, sowie
      der [Nationalpark Port-Cros](/lugar/parc-national-de-port-cros/) und der [Naturpark Cap de
      Creus](/lugar/parc-natural-del-cap-de-creus/).
  it:
    intro: >-
      Osserva la mappa di Dugi Otok verso la punta meridionale: una baia riparata lunga dieci chilometri che
      si divide in tre conche comunicanti, come tre laghi posti in sequenza. Da qui deriva il nome Telašćica,
      menzionato nel Medioevo come Tilagus. Considerato il porto naturale più sicuro e vasto dell'Adriatico,
      il territorio, parco naturale dal 1988, racchiude falesie a picco sul mare, isolotti, un lago salato e
      coste che a nord-est appaiono brulle e a sud-ovest ammantate di pini d'Aleppo, ulivi e fichi.
    landscape: >-
      Il parco copre 70,50 km², ma solo 25,95 km² sono costituiti da terre emerse su Dugi Otok e sugli scogli
      vicini; i restanti 44,55 km² formano l'area marina protetta. Qui il mare è sovrano. La baia ospita sei
      isolotti e scogli tra cui Korotan e Galijola; Katina è la più suggestiva e Taljurić la più singolare per
      la forma a piatto roccioso. La cima più elevata è Mrzlovica a 198 m, mentre la baia scende fino a 67 m
      di profondità.


      Le falesie, le stene, costituiscono l'immagine iconica del parco: alte pareti a picco sul mare aperto
      che proseguono la loro caduta verticale sott'acqua. Altra rarità è il lago Mir, bacino salmastro
      collegato al mare attraverso fessure carsiche sotterranee.


      A terra domina il clima mediterraneo con oltre 2.500 ore di sole annue e acque marine attorno a 13 gradi
      in inverno e 23 gradi in estate. In estate spira il maestrale, d'inverno la bora e lo scirocco.
    wildlife: >-
      A terra si contano circa 500 specie vegetali, mentre i fondali ospitano oltre 300 specie di piante e 300
      di animali. Tra le rarità spiccano l'euforbia arborea (Euphorbia dendroides), al suo limite
      settentrionale, e il fiordaliso di Dugi Otok, endemismo esclusivo delle rupi inaccessibili. A fine
      primavera fiorisce il giaggiolo Iris adriatica e in tarda estate Seseli tomentosum. La flora comprende
      dieci orchidee selvatiche rigorosamente protette.


      L'avifauna popola le pareti rocciose. Sulle cenge esterne nidifica il [falco
      pellegrino](/especie/falco_peregrinus/); il [falco della regina](/especie/falco_eleonorae/) vi giunge
      come visitatore dalle isole meridionali. Sui gradoni inferiori nidifica il [marangone dal
      ciuffo](/especie/phalacrocorax_aristotelis/), mentre le pietraie ospitano il [gufo
      reale](/especie/bubo_bubo/), la [monachella](/especie/oenanthe_hispanica/) e il passero solitario. I
      rondoni colonizzano gli anfratti. Nel complesso si contano 115 specie di uccelli, fra cui 15 rapaci con
      almeno cinque specie nidificanti.


      Vivono nove specie di pipistrelli; la colonia maggiore nella grotta marina di Golubinka ospita circa
      2000 vespertili di Capaccini e circa 1000 [ferri di cavallo
      maggiori](/especie/rhinolophus_ferrumequinum/). Tra 13 specie di rettili compare la [tartaruga
      comune](/especie/caretta_caretta/); tra gli anfibi solo la raganella e il rospo smeraldino superano la
      siccità estiva.


      Nei fondali le praterie di [posidonia](/especie/posidonia_oceanica/) ospitano il cavalluccio marino
      camuso.
    visit: >-
      Dalla terraferma si raggiunge Sali con battelli di linea da Zara o con traghetto per auto via Brbinj.
      Essendo un parco a prevalenza marina, la barca rappresenta il mezzo ideale. In auto si accede
      dall'ingresso di Dolac, da cui un sentiero sale al castelliere protostorico di Koženjak.


      Il Centro visite Grpašćak, ricavato in un forte militare sulla falesia più alta dell'Adriatico, offre
      belvederi panoramici e mostre sull'ecosistema marino.


      Le immersioni subacquee autonome richiedono permessi e sono ammesse nei siti dedicati: Garmenjak Veliki
      e Mali, Korotan e Podusobine.
    history: >-
      Sull'isola si conservano resti di edifici romani a Mala Proversa e numerose chiese preromaniche
      medievali, tra le quali la chiesetta di San Giovanni nella piana di Stivanje polje. Vi è inoltre una
      suggestiva leggenda locale: sul colle di Koženjak dimoravano i Peteročići, una stirpe di esseri
      minuscoli con cinque piccole corna sulla testa, pacifici, operosi e lavoratori generosi.


      Anche l'ecosistema marino subisce forti pressioni antropiche: le ancore e le catene pesanti delle
      imbarcazioni distruggono i fondali, strappando le praterie di posidonia e le formazioni coralligene, la
      cui ripresa naturale richiede svariati decenni. Sulla terraferma il pino d'Aleppo fu piantato dall'uomo
      nel secondo dopoguerra e si è propagato spontaneamente da Grpašćak fino al lago Mir, registrando la
      presenza di sette taxa esotici invasori, sebbene nessuno su ampie estensioni. Nel 2008 l'Istituto
      scientifico Ruđer Bošković ha condotto un approfondito studio ecologico di base per misurare lo stato di
      conservazione dei fondali e stimare la reale capacità di carico dell'ecosistema marino.
    before: >-
      È permesso camminare solo sui sentieri tracciati; i cani vanno tenuti al guinzaglio ed è vietato
      accendere fuochi, campeggiare liberamente e cogliere piante. L'arrampicata sulle falesie è severamente
      vietata. Vietata la pesca subacquea e la raccolta di organismi marini.
    around: >-
      Il [Parco Nazionale delle Incoronate](/lugar/nacionalni-park-kornati/) confina direttamente con
      Telašćica. Più distanti sorgono il [Parco Naturale dell'Arcipelago di
      Lastovo](/lugar/park-prirode-lastovsko-otocje/) e [La Mola - Formentera](/lugar/la-mola-formentera/),
      che accolgono il falco della regina e posidonia, nonché il [Parco Nazionale di
      Port-Cros](/lugar/parc-national-de-port-cros/) e il [Parco Naturale di Cap de
      Creus](/lugar/parc-natural-del-cap-de-creus/).
  pt:
    intro: >-
      Consulta o mapa de Dugi Otok e repara no seu extremo sul: uma baía abrigada de dez quilómetros que se
      reparte em três bacias ligadas, como três lagos alinhados em sucessão. Daí deriva o topónimo Telašćica,
      grafado no período medieval como Tilagus. Considerado o porto natural mais seguro do Adriático, o
      território, parque natural desde 1988, exibe imponentes arribas litorais, ilhéus, uma lagoa salgada e
      margens que a nordeste são desnudadas e a sudoeste cobertas por pinheiros-de-alepo, oliveiras e
      figueiras.
    landscape: >-
      O parque cobre 70,50 km², dos quais apenas 25,95 km² correspondem a terra firme em Dugi Otok e ilhéus
      vizinhos; os restantes 44,55 km² constituem domínio marinho. O mar assume o protagonismo absoluto. A
      baía abriga seis ilhéus e recifes, entre os quais Korotan e Galijola; Katina é a mais formosa e Taljurić
      um rochedo plano invulgar. A cota mais alta situa-se em Mrzlovica, a 198 m, descendo as águas da baía a
      67 m de profundidade.


      As arribas, as famosas stene, são o emblema do parque: erguem-se sobranceiras ao mar aberto e continuam
      a pique sob as águas. Outra singularidade hidrogeológica é o lago Mir, mantido salgado por fissuras
      cársticas submarinas que o ligam ao Adriático.


      Em terra reina o clima mediterrânico: mais de 2.500 horas de sol anuais, com água do mar a rondar 13
      graus no inverno e 23 graus no verão. No estio sopra o maestral, na estação fria a bora gélida e o
      temporal jugo.
    wildlife: >-
      Contam-se cerca de 500 espécies de plantas terrestres, somando os fundos marinhos mais de 300 espécies
      vegetais e 300 animais. Entre as raridades botânicas sobressai a eufórbia-arbórea (Euphorbia
      dendroides), que aqui estabelece o seu extremo setentrional, e a centáurea-de-dugi-otok, endemismo
      estrito de escarpas inacessíveis. No final da primavera desabrocha a Iris adriatica e em agosto Seseli
      tomentosum. A flora conta com dez espécies de orquídeas protegidas.


      As arribas são um observatório privilegiado de aves. Nas plataformas exteriores nidifica o
      [falcão-peregrino](/especie/falco_peregrinus/); o [falcão-da-rainha](/especie/falco_eleonorae/) surge
      como visitante vindo de ilhas mais a sul. Nas saliências baixas nidifica o
      [corvo-marinho-de-crista](/especie/phalacrocorax_aristotelis/), acolhendo os taludes rochosos o
      [bufo-real](/especie/bubo_bubo/), o [chasco-ebúrneo](/especie/oenanthe_hispanica/) e a perdiz-grega. Os
      andorinhões aproveitam as fendas. No total registam-se 115 espécies de aves, incluindo 15 rapinas das
      quais pelo menos cinco nidificam na área.


      Ocorrem nove espécies de morcegos; a colónia principal, na gruta marinha de Golubinka, concentra cerca
      de 2000 morcegos-de-peluche e perto de 1000
      [morcegos-de-ferradura-grandes](/especie/rhinolophus_ferrumequinum/). Em 13 espécies de répteis
      assinala-se a [tartaruga-boba](/especie/caretta_caretta/); nos anfíbios apenas a rela e o sapo-verde
      toleram o estio seco.


      Sob a superfície, as pradarias de [erva-patinha](/especie/posidonia_oceanica/) albergam o
      cavalo-marinho-de-focinho-comprido.
    visit: >-
      A partir do continente atinge-se Sali por barco rápido desde Zadar ou por ferry até Brbinj. Sendo um
      parque marítimo, o barco é o meio ideal de exploração. De automóvel entra-se pelo acesso de Dolac, donde
      um trilho pedestre ascende ao castro da Idade do Ferro de Koženjak.


      O Centro Interpretativo de Grpašćak, instalado num forte militar no topo da falésia mais alta do
      Adriático, disponibiliza miradouros e mostras temáticas.


      O mergulho com garrafa requer licença e circunscreve-se a locais autorizados: Garmenjak Veliki e Mali,
      Korotan e Podusobine.
    history: >-
      Identificam-se vestígios de edificações romanas em Mala Proversa e numerosos templos pré-românicos de
      época medieval, incluindo a igreja de São João no planalto de Stivanje polje. Uma lenda tradicional
      recorda os Peteročići do monte Koženjak, uma povoação de gente miúda com cinco pequenos cornos no cimo
      da cabeça, pacíficos e extremamente trabalhadores.


      O meio marinho também sofre pressões severas: as âncoras e correntes pesadas das embarcações destroem o
      leito marinho, arrancando as pradarias de posidónia e os recifes coralígenos cuja recomposição demora
      décadas. Em terra firme, o pinheiro-de-alepo foi plantado após a Segunda Guerra Mundial e propagou-se de
      Grpašćak até ao lago salgado Mir, tendo sido assinalados sete táxons exóticos invasores, nenhum deles
      ocupando áreas contínuas extensas. Em 2008 o Instituto de Investigação Ruđer Bošković concluiu um estudo
      ambiental de base para avaliar a condição do substrato marinho e calcular a capacidade de carga deste
      ecossistema protegido.
    before: >-
      Caminha apenas pelos percursos sinalizados; os cães devem usar trela e é proibido foguear, acampar fora
      de parques de campismo e arrancar flora. É terminantemente proibido escalar as arribas. A caça submarina
      e a captura de organismos marinhos são interditas.
    around: >-
      O [Parque Nacional de Kornati](/lugar/nacionalni-park-kornati/) confina diretamente com Telašćica. Mais
      distantes, partilham pradarias de posidónia e roazes o [Parque Natural do Arquipélago de
      Lastovo](/lugar/park-prirode-lastovsko-otocje/) e [La Mola - Formentera](/lugar/la-mola-formentera/),
      bem como o [Parque Nacional de Port-Cros](/lugar/parc-national-de-port-cros/) e o [Parque Natural do Cap
      de Creus](/lugar/parc-natural-del-cap-de-creus/).
