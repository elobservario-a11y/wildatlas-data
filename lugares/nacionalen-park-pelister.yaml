resumen:
  es: >-
    El parque nacional más antiguo de Macedonia del Norte (1948), creado para proteger los bosques de pino de
    los Balcanes (molika).
  en: >-
    The oldest national park in North Macedonia (1948), established to preserve primeval Macedonian pine
    (molika) forests.
  fr: >-
    Le plus ancien parc national de Macédoine du Nord (1948), créé pour protéger les forêts de pin de
    Macédoine (molika).
  de: >-
    Der älteste Nationalpark Nordmazedoniens (1948), gegründet zum Schutz der urwüchsigen Wälder der
    Mazedonischen Kiefer (Molika).
  it: >-
    Il più antico parco nazionale della Macedonia del Nord (1948), istituito per tutelare le foreste di pino
    macedone (molika).
  pt: >-
    O mais antigo parque nacional da Macedónia do Norte (1948), instituído para proteger os bosques de
    pinheiro-da-macedónia (molika).
unico:
  es: >-
    El pino de Macedonia, o molika, un relicto del Terciario que fue una de las razones principales para
    declarar el parque, y dos lagos glaciares conocidos como los Ojos de Pelister.
  en: >-
    The Macedonian pine, or molika, a Tertiary relict that spurred the park’s original declaration, alongside
    twin glacial tarns celebrated as the Eyes of Pelister.
  fr: >-
    Le pin de Macédoine, ou molika, relique du Tertiaire qui motiva la création originelle du parc, et deux
    lacs glaciaires surnommés les Yeux de Pelister.
  de: >-
    Die Mazedonische Kiefer, oder Molika, ein tertiäres Relikt und Hauptgrund für die Parkgründung, sowie zwei
    Karseen, bekannt als die Augen von Pelister.
  it: >-
    Il pino macedone, o molika, un relitto del Terziario che spinse alla creazione del parco, e due laghi
    glaciali noti come gli Occhi di Pelister.
  pt: >-
    O pinheiro-da-macedónia, ou molika, um relíquia do Terciário que fundamentou a criação do parque, e duas
    lagoas glaciares conhecidas como os Olhos de Pelister.
observaciones:
  es: >-
    El gestor pide registrar la visita mediante un formulario antes de acudir; comprueba cómo está el
    registro. Los senderos son accesibles las 24 horas, pero se recomienda moverse de día. Está prohibido
    hacer fuego y solo se puede acampar donde fija la administración; los perros van con correa y bajo control
    para no molestar a la fauna.
texto:
  es:
    intro: >-
      En 1839 un botánico alemán subió a Pelister con once soldados otomanos, recogió ramas de un pino que
      nadie había descrito y lo bautizó Pinus peuce. Casi dos siglos después, ese pino de cinco agujas es el
      símbolo del parque. El Parque Nacional de Pelister, en el macizo de Baba, se creó en 1948 como primer
      parque nacional de Yugoslavia y es el espacio protegido más antiguo de Macedonia del Norte. Ocupa 17 150
      hectáreas entre los municipios de Bitola y Resen, y sube de 891 a 2601 m.
    landscape: >-
      Baba es un macizo de granitos y esquistos cristalinos, con formas glaciares y «ríos de piedra». Durante
      el Pleistoceno sus partes altas tuvieron glaciares, que dejaron circos y morrenas, y de ese pasado
      quedan los dos lagos: los Ojos de Pelister, a 2218 y 2180 m de altitud.


      Los bosques mandan en las laderas. Dominan los hayedos de Moesia, seguidos de brezales alpinos y
      boreales y de pinares oromediterráneos de molika; por encima, pastos de altura. La flora es de las
      ricas: más de 1050 especies de plantas, con 88 de árboles, y 21 comunidades vegetales. El pino molika es
      un relicto terciario y endemismo balcánico, un pino de cinco agujas por mechón; el abeto blanco busca
      los rincones húmedos y sombreados, y compite con él por el espacio.
    wildlife: >-
      Más de 200 especies animales viven aquí. El [oso pardo](/especie/ursus_arctos/) encuentra comida
      suficiente, como arándanos y hormigas; los rastros del [lobo](/especie/canis_lupus/) aparecen por todo
      el parque, desde las zonas bajas hasta las alpinas, y el lince es muy raro y no hay población estable.
      Entre las aves de montaña están el grévol, el [búho real](/especie/bubo_bubo/), el cárabo común, el
      chotacabras, los pitos y el [águila real](/especie/aquila_chrysaetos/). La alta montaña es del
      [rebeco](/especie/rupicapra_rupicapra/) balcánico, y en los pedregales vive la rata nival. En las zonas
      altas se ven además la chova piquirroja, el roquero rojo, el mirlo capiblanco y la perdiz griega. Entre
      los reptiles hay tortuga mediterránea, culebra de Esculapio y culebra lisa.


      Los visitantes suelen confundir el gato montés con el lince, aunque tiene rasgos distintos.
    visit: >-
      Los senderos más frecuentes empiezan en el centro de información de Pelister y en el hotel Molika, a
      quince minutos en coche de Bitola. El más sencillo es el histórico: sale junto al centro de información,
      mide 1,7 km, lleva unos 50 minutos con 143 m de desnivel y está clasificado como fácil. Paneles con
      textos y mapas explican las operaciones militares y la vida de los soldados en la línea de la Primera
      Guerra Mundial.


      Para llegar a la cima hay dos clásicos. Por Bolnici, 19,7 km y unas 7 h 55 min con 1242 m de desnivel,
      de mayo a noviembre: a 2200 m estuvieron los hospitales de campaña de la guerra, y en la cumbre hay una
      antena con vistas al lago Prespa y a los macizos de Korab y Šar. Por Shiroka, 12,8 km y unas 3 h 50 min
      con 1220 m de desnivel, con postes metálicos de señalización invernal que marcan el camino seguro bajo
      nieve profunda y evitan las zonas de aludes.


      Si quieres los lagos, la travesía por la cima y los dos lagos glaciares mide 22,1 km y 1358 m de
      desnivel; suele partirse en dos días, con noche en el refugio junto al Lago Grande. El camino del río
      Sapunčica al Lago Grande es circular, de 18,3 km y 884 m de desnivel, y sale cerca de la estación de
      esquí de Strezevo; por el «camino francés», una pista militar de la Primera Guerra Mundial, se ven
      restos de trincheras y búnkeres.
    history: >-
      Ya en 1938 existían los refugios de Begova Česma, a 1420 m, y Kopanki, a 1610 m. Pelister fue un bastión
      clave en las batallas del frente macedonio, de 1916 a 1918, y aún se ven restos de trincheras, refugios
      y posiciones de tiro. Malovište es la única aldea dentro del parque: un museo etnológico al aire libre
      de arquitectura aromuna, con casas de piedra de 150 a 200 años.
    before: >-
      El gestor pide registrar la visita mediante un formulario antes de acudir; comprueba cómo está el
      registro. Los senderos son accesibles las 24 horas, pero se recomienda moverse de día. Está prohibido
      hacer fuego y solo se puede acampar donde fija la administración; los perros van con correa y bajo
      control para no molestar a la fauna.
    around: >-
      A seis kilómetros está el [Εθνικό Πάρκο Πρεσπών](/lugar/ethniko-parko-prespon/), y a doce, el
      [Национален парк Галичица](/lugar/nacionalen-park-galicica/). Lejos de aquí, el [Pirin National Park -
      Forest Wilderness](/lugar/pirin-national-park-forest-wilderness/) comparte el pino de Macedonia, el
      rebeco y el oso, y el [Parco Naturale delle Alpi
      Marittime](/lugar/parco-naturale-delle-alpi-marittime/), la [Parc national de la
      Vanoise](/lugar/parc-national-de-la-vanoise/) y el [Parco Nazionale Gran
      Paradiso](/lugar/parco-nazionale-gran-paradiso/) comparten alta montaña, rebeco y águila real.
  en:
    intro: >-
      In 1839 a German botanist ascended Pelister accompanied by eleven Ottoman soldiers, collected twigs from
      a conifer undescribed by science, and named it Pinus peuce. Nearly two centuries later, this
      five-needled pine stands as the enduring emblem of the park. Pelister National Park, situated on the
      Baba massif, was established in 1948 as the very first national park in Yugoslavia and remains the
      oldest protected wilderness in North Macedonia. It encompasses 17,150 hectares spanning the
      municipalities of Bitola and Resen, rising from 891 to 2601 m.
    landscape: >-
      Baba is an imposing massif composed of granites and crystalline schists, scarred by glacial erosion and
      sprawling periglacial "stone rivers". During the Pleistocene its highest crests supported valley
      glaciers that carved cirques and moraines; from that icy epoch remain two mountain tarns: the Eyes of
      Pelister, nestled at 2218 and 2180 m altitude.


      Dense forests dominate the mountain slopes. Moesian beechwoods predominate, succeeded by subalpine and
      boreal dwarf scrub, and oromediterranean molika pine woodlands; higher up, subalpine grasslands unfold.
      The flora is remarkably rich: over 1050 vascular plant species, including 88 tree species, distributed
      across 21 distinct plant communities. The molika pine is a Tertiary relict and Balkan endemic,
      characterized by five needles per fascicle; silver fir seeks out moist, shaded hollows, competing with
      it for canopy space.
    wildlife: >-
      More than 200 animal species inhabit the park. The [brown bear](/especie/ursus_arctos/) finds ample
      food, foraging on bilberries and wood ants; tracks of the [wolf](/especie/canis_lupus/) appear
      throughout the massif, from lower elevations to alpine ridges, while the Balkan lynx is exceptionally
      rare without a stable breeding nucleus. Montane birds include hazel grouse, [Eurasian
      eagle-owl](/especie/bubo_bubo/), tawny owl, nightjar, various woodpeckers, and the [golden
      eagle](/especie/aquila_chrysaetos/). High alpine crags belong to the Balkan
      [chamois](/especie/rupicapra_rupicapra/), while European snow voles dwell among talus slopes. Upper
      ridges also host red-billed chough, common rock thrush, ring ouzel, and rock partridge. Reptiles include
      Hermann’s tortoise, Aesculapian snake, and smooth snake.


      Visitors frequently mistake European wildcats for lynx, though their physical markings differ
      noticeably.
    visit: >-
      The most popular trails originate at the Pelister visitor information centre and the Hotel Molika, a
      fifteen-minute drive from Bitola. The gentlest is the historical trail: starting beside the information
      centre, it covers 1.7 km, requires about 50 minutes with 143 m of elevation gain, and is graded easy.
      Interpretive panels and maps illustrate First World War military maneuvers and soldier life along the
      frontline.


      For summit ascents, two classic routes stand out. Via Bolnici, spanning 19.7 km and taking around 7 h 55
      min with 1242 m of climbing, suitable from May to November: at 2200 m historic wartime field hospitals
      operated, while the peak features an antenna with sweeping views across Lake Prespa and the Korab and
      Šar ranges. Via Shiroka, covering 12.8 km and roughly 3 h 50 min with 1220 m of ascent, fitted with
      winter metal waymarker poles that guide hikers safely through deep snow and clear of avalanche paths.


      To visit the tarns, the traverse linking the summit and both glacial lakes spans 22.1 km and 1358 m of
      ascent; it is usually split over two days, staying overnight at the mountain refuge beside the Big Lake.
      The trail from the Sapunčica river to the Big Lake is a circuit of 18.3 km and 884 m of elevation gain,
      starting near the Strezevo ski centre; along the "French Road", a First World War military track,
      remains of trenches and bunkers line the way.
    history: >-
      As early as 1938, alpine refuges stood at Begova Česma at 1420 m and Kopanki at 1610 m. Pelister served
      as a critical fortified sector during battles along the Macedonian Front from 1916 to 1918, and traces
      of entrenchments, dugouts, and gun emplacements remain scattered across the ridges. Malovište is the
      sole village within park boundaries: an open-air ethnological museum of Aromanian architecture with
      stone houses dating back 150 to 200 years.
    before: >-
      The park authority requests that visitors register their hike online or at the entrance prior to
      arrival; verify current registration procedures. Trails remain open 24 hours a day, though trekking
      during daylight hours is strongly advised. Open fires are strictly prohibited, and camping is permitted
      only at officially designated sites; dogs must be kept on a leash to prevent disturbing native wildlife.
    around: >-
      Six kilometres away lies the [Prespa National Park](/lugar/ethniko-parko-prespon/), and twelve
      kilometres distant stands [Galičica National Park](/lugar/nacionalen-park-galicica/). Further afield,
      [Pirin National Park - Forest Wilderness](/lugar/pirin-national-park-forest-wilderness/) shares
      Macedonian pine, chamois, and brown bear, while [Maritime Alps Nature
      Park](/lugar/parco-naturale-delle-alpi-marittime/), [Vanoise National
      Park](/lugar/parc-national-de-la-vanoise/), and [Gran Paradiso National
      Park](/lugar/parco-nazionale-gran-paradiso/) share alpine heights, chamois, and golden eagles.
  fr:
    intro: >-
      En 1839, un botaniste allemand gravit le Pelister escorté de onze soldats ottomans, préleva des rameaux
      d’un conifère inconnu de la science et le baptisa Pinus peuce. Près de deux siècles plus tard, ce pin à
      cinq aiguilles est l’emblème du parc. Le parc national de Pelister, sur le massif de Baba, fut fondé en
      1948 en tant que premier parc national de Yougoslavie et constitue l’espace protégé le plus ancien de
      Macédoine du Nord. Il couvre 17 150 hectares entre Bitola et Resen, et s’élève de 891 à 2601 m
      d’altitude.
    landscape: >-
      Baba est un haut massif de granites et de schistes cristallins, buriné par les glaciations et percé de «
      rivières de pierre ». Au Pléistocène, ses sommets abritaient des glaciers qui ont façonné cirques et
      moraines ; de ce passé glaciaire subsistent deux lacs d’altitude : les Yeux de Pelister, à 2218 et 2180
      m d’altitude.


      Les forêts règnent sur les pentes. Les hêtraies de Mésie dominent, relayées par des landes subalpines et
      des pinèdes oroméditerranéennes de pin molika ; au-dessus s’étendent les pelouses sommitales. La flore y
      est d’une remarquable richesse : plus de 1050 espèces de plantes vasculaires, dont 88 espèces d’arbres,
      réparties en 21 communautés végétales. Le pin molika est une relique tertiaire et un endémisme
      balkanique à aiguilles groupées par cinq ; le sapin blanc recherche les combes ombragées et lui dispute
      l’espace forestier.
    wildlife: >-
      Plus de 200 espèces animales peuplent ces versants. L’[ours brun](/especie/ursus_arctos/) y trouve une
      nourriture abondante, se gavant de myrtilles et de fourmis ; les empreintes du
      [loup](/especie/canis_lupus/) parcourent tout le massif, des vallées aux crêtes alpines, tandis que le
      lynx demeure rarissime sans noyau reproducteur pérenne. Parmi les oiseaux montagnards figurent la
      gélinotte des bois, le [grand-duc d’Europe](/especie/bubo_bubo/), la chouette hulotte, l’engoulevent,
      les pics et l’[aigle royal](/especie/aquila_chrysaetos/). Les hautes crêtes appartiennent au
      [chamois](/especie/rupicapra_rupicapra/) des Balkans, et les pierriers abritent le campagnol des neiges.
      En altitude s’observent aussi le crave à bec rouge, le monticole de roche, le merle à plastron et la
      perdrix bartavelle. Côté reptiles se rencontrent la tortue d’Hermann, la couleuvre d’Esculape et la
      coronelle lisse.


      Les randonneurs confondent souvent le chat forestier avec le lynx, bien que leurs caractéristiques
      soient bien distinctes.
    visit: >-
      Les sentiers les plus prisés débutent au centre d’information de Pelister et à l’hôtel Molika, à quinze
      minutes de route de Bitola. Le plus accessible est le sentier historique : partant du centre
      d’information, il compte 1,7 km, requiert environ 50 minutes pour 143 m de dénivelé et est classé
      facile. Des panneaux illustrés retracent les opérations militaires et le quotidien des soldats sur la
      ligne de front de la Première Guerre mondiale.


      Pour atteindre le sommet, deux grands classiques s’offrent à vous. Par Bolnici, 19,7 km et environ 7 h
      55 min avec 1242 m de dénivelé, praticable de mai à novembre : à 2200 m s’élevaient les hôpitaux de
      campagne de la guerre, tandis que le pic accueille une antenne ouvrant une vue splendide sur le lac
      Prespa et les massifs de Korab et des monts Šar. Par Shiroka, 12,8 km et près de 3 h 50 min avec 1220 m
      de montée, jalonné de balises métalliques hivernales guidant les marcheurs sous d’épaisses couches de
      neige tout en contournant les couloirs d’avalanches.


      Pour contempler les lacs, la traversée franchissant le sommet et les deux plans d’eau totalise 22,1 km
      et 1358 m de montée ; elle se scinde souvent en deux jours, avec nuitée au refuge du Grand Lac. La
      boucle reliant la rivière Sapunčica au Grand Lac affiche 18,3 km et 884 m de dénivelé au départ de la
      station de ski de Strezevo ; le long de la « voie française », piste militaire de la Grande Guerre,
      affleurent tranchées et blockhaus.
    history: >-
      Dès 1938 s’élevaient les refuges de Begova Česma à 1420 m et de Kopanki à 1610 m. Le Pelister fut une
      position stratégique majeure lors des affrontements du front d’Orient de 1916 à 1918, et l’on discerne
      encore des vestiges de tranchées, d’abris et de casemates. Malovište est l’unique village niché dans le
      parc : un musée d’ethnologie à ciel ouvert d’architecture aroumaine, aux maisons de pierre vieilles de
      150 à 200 ans.
    before: >-
      Le parc invite à enregistrer sa visite via un formulaire préalable ; vérifiez les formalités requises.
      Les sentiers sont accessibles 24 heures sur vingt-quatre, mais il est vivement conseillé de progresser
      de jour. Tout feu est formellement prohibé et le bivouac n’est autorisé que sur les aires agréées ; les
      chiens doivent être tenus en laisse pour ne pas perturber la faune sauvage.
    around: >-
      À six kilomètres s’étend le [Parc national de Prespa](/lugar/ethniko-parko-prespon/), et à douze
      kilomètres se trouve le [Parc national de Galičica](/lugar/nacionalen-park-galicica/). Plus loin, le
      [Parc national du Pirin - Forêt sauvage](/lugar/pirin-national-park-forest-wilderness/) partage le pin
      de Macédoine, le chamois et l’ours, tandis que le [Parc Naturel des Alpes
      Maritimes](/lugar/parco-naturale-delle-alpi-marittime/), le [Parc national de la
      Vanoise](/lugar/parc-national-de-la-vanoise/) et le [Parc National du Grand
      Paradis](/lugar/parco-nazionale-gran-paradiso/) partagent haute montagne, chamois et aigle royal.
  de:
    intro: >-
      Im Jahr 1839 stieg ein deutscher Botaniker in Begleitung von elf osmanischen Soldaten auf den Pelister,
      sammelte Zweige einer damals unbeschriebenen Kiefer und taufte sie Pinus peuce. Fast zwei Jahrhunderte
      später ist diese fünfadelige Kiefer das Wappenzeichen des Parks. Der Pelister-Nationalpark im
      Baba-Gebirge wurde 1948 als erster Nationalpark Jugoslawiens gegründet und ist das älteste Schutzgebiet
      Nordmazedoniens. Er erstreckt sich über 17 150 Hektar zwischen Bitola und Resen und reicht von 891 bis
      2601 m empor.
    landscape: >-
      Das Baba-Gebirge ist ein mächtiges Massiv aus Graniten und kristallinen Schiefern, geprägt von
      eiszeitlichen Formen und weitläufigen Blockmeeren („Steinbrüchen“). Im Pleistozän trugen die Höhen
      Gletscher, die Kare und Moränen hinterließen; Zeugen dieser Kaltzeit sind zwei Gebirgsseen: die Augen
      von Pelister auf 2218 und 2180 m Höhe.


      Ausgedehnte Wälder prägen die Hänge. Mesische Buchenwälder dominieren, abgelöst von subalpinen Heiden
      und oromediterranen Molika-Kiefernwäldern; darüber breiten sich alpine Rasen aus. Die Pflanzenwelt ist
      außerordentlich artenreich: über 1050 Gefäßpflanzenarten, darunter 88 Baumarten, verteilt auf 21
      Pflanzengesellschaften. Die Molika-Kiefer ist ein tertiäres Relikt und ein balkanischer Endemit mit fünf
      Nadeln je Kurztrieb; die Weißtanne besiedelt feuchte, schattige Mulden und steht mit ihr in Konkurrenz.
    wildlife: >-
      Über 200 Tierarten leben in diesem Bergland. Der [Braunbär](/especie/ursus_arctos/) findet reichlich
      Nahrung wie Heidelbeeren und Waldameisen; Spuren des [Wolfs](/especie/canis_lupus/) lassen sich im
      gesamten Massiv von den Tälern bis in alpine Lagen nachweisen, während der Balkanluchs extrem selten ist
      und kein stabiles Brutvorkommen bildet. Zu den Gebirgsvögeln zählen Haselhuhn,
      [Uhu](/especie/bubo_bubo/), Waldkauz, Ziegenmelker, verschiedene Spechte und der
      [Steinadler](/especie/aquila_chrysaetos/). Die alpine Felszone wird von der
      Balkan-[Gämse](/especie/rupicapra_rupicapra/) bewohnt, während in Geröllfeldern die Schneemaus haust. In
      den Hochlagen lassen sich zudem Alpendohle, Steinrötel, Ringdrossel und Steinhuhn beobachten. Unter den
      Reptilien kommen Griechische Landschildkröte, Äskulapnatter und Schlingnatter vor.


      Besucher verwechseln die Europäische Wildkatze häufig mit dem Luchs, obgleich ihre Merkmale deutlich
      voneinander abweichen.
    visit: >-
      Die beliebtesten Wanderwege beginnen am Informationszentrum Pelister und am Hotel Molika, eine
      Viertelstunde Autofahrt von Bitola entfernt. Der einfachste Weg ist der historische Lehrpfad: Er startet
      am Informationszentrum, misst 1,7 km, beansprucht etwa 50 Minuten bei 143 m Höhenunterschied und ist als
      leicht eingestuft. Schautafeln und Karten erläutern militärische Operationen und das Leben der Soldaten
      an der Front des Ersten Weltkriegs.


      Für Gipfelbesteigungen bieten sich zwei Klassiker an. Über Bolnici, 19,7 km und rund 7 h 55 min bei 1242
      m Anstieg, begehbar von Mai bis November: Auf 2200 m befanden sich historische Feldlazarette, während
      die Bergspitze einen Sendemast mit Weitblick über den Prespasee sowie die Gebirge Korab und Šar trägt.
      Über Shiroka, 12,8 km und etwa 3 h 50 min bei 1220 m Anstieg, ausgestattet mit hohen metallenen
      Winterstangen, die Wanderer bei hohem Schnee sicher leiten und Lawinenzonen meiden.


      Wer die Seen sehen möchte: Die Überschreitung über den Gipfel zu beiden Karseen umfasst 22,1 km und 1358
      m Aufstieg; sie wird meist auf zwei Tage aufgeteilt, mit Übernachtung in der Schutzhütte am Großen See.
      Der Rundweg vom Fluss Sapunčica zum Großen See umfasst 18,3 km und 884 m Höhenunterschied ab dem
      Skizentrum Strezevo; entlang der „Französischen Straße“, einer Militärpiste des Ersten Weltkriegs,
      begegnet man Resten von Schützengräben und Bunkern.
    history: >-
      Bereits 1938 standen die Schutzhütten Begova Česma auf 1420 m und Kopanki auf 1610 m. Der Pelister war
      ein hart umkämpfter Pfeiler an der Salonikifront von 1916 bis 1918; bis heute zeugen Stellungsreste,
      Kavernen und Unterstände von den Gefechten. Malovište ist das einzige Dorf innerhalb des Parks: ein
      Freilichtmuseum aromunischer Baukunst mit Steinhäusern, die 150 bis 200 Jahre alt sind.
    before: >-
      Die Parkverwaltung bittet um eine vorherige Anmeldung per Formular; erkundige dich vorab nach den
      Registrierungsmodalitäten. Die Wege sind 24 Stunden am Tag zugänglich, Touren bei Tageslicht werden
      jedoch dringend empfohlen. Offenes Feuer ist verboten, Campen nur auf ausgewiesenen Plätzen gestattet;
      Hunde gehören zum Schutz des Wildes an die Leine.
    around: >-
      Sechs Kilometer entfernt liegt der [Nationalpark Prespa](/lugar/ethniko-parko-prespon/), und zwölf
      Kilometer weiter der [Nationalpark Galičica](/lugar/nacionalen-park-galicica/). Weiter entfernt teilen
      der [Pirin-Nationalpark - Wald-Wildnis](/lugar/pirin-national-park-forest-wilderness/) Mazedonische
      Kiefer, Gämse und Braunbär, während der [Naturpark
      Seealpen](/lugar/parco-naturale-delle-alpi-marittime/), der [Nationalpark
      Vanoise](/lugar/parc-national-de-la-vanoise/) und der [Nationalpark Gran
      Paradiso](/lugar/parco-nazionale-gran-paradiso/) Hochgebirgslandschaften, Gämse und Steinadler teilen.
  it:
    intro: >-
      Nel 1839 un botanico tedesco salì sul Pelister accompagnato da undici soldati ottomani, raccolse rametti
      di un pino mai descritto prima e lo chiamò Pinus peuce. Quasi due secoli dopo, questo pino a cinque aghi
      è l’emblema del parco. Il Parco Nazionale di Pelister, nel massiccio del Baba, è stato istituito nel
      1948 come primo parco nazionale della Jugoslavia ed è l’area protetta più antica della Macedonia del
      Nord. Si estende per 17 150 ettari tra Bitola e Resen, innalzandosi da 891 a 2601 m di quota.
    landscape: >-
      Il Baba è un imponente massiccio di graniti e scisti cristallini, segnato da morfologie glaciali e vasti
      «fiumi di pietra». Nel Pleistocene le sue sommità ospitavano ghiacciai che scavarono circhi e morene; da
      quell’epoca remota derivano due specchi d’acqua: gli Occhi di Pelister, situati a 2218 e 2180 m di
      altitudine.


      Le foreste rivestono i pendii montani. Dominano le faggete della Mesia, seguite da brughiere subalpine e
      pinete oromediterranee di molika; più in alto si stendono i pascoli d’altitudine. La flora è
      straordinariamente ricca: oltre 1050 specie di piante vascolari, con 88 specie arboree, suddivise in 21
      comunità vegetali. Il pino molika è un relitto terziario ed endemismo balcanico, con ciuffi di cinque
      aghi; l’abete bianco occupa gli anfratti umidi e ombrosi, competendo con esso per lo spazio.
    wildlife: >-
      Oltre 200 specie animali popolano questo massiccio. L’[orso bruno](/especie/ursus_arctos/) trova cibo in
      abbondanza, nutrendosi di mirtilli e formiche; le tracce del [lupo](/especie/canis_lupus/) si rinvengono
      in tutto il parco, dai fondovalle alle vette alpine, mentre la lince balcanica è rarissima e priva di
      popolazioni stabili. Tra l’avifauna montana figurano il francolino di monte, il [gufo
      reale](/especie/bubo_bubo/), l’allocco, il succiacapre, vari picchi e l’[aquila
      reale](/especie/aquila_chrysaetos/). Le falesie d’alta quota appartengono al [camoscio
      alpino](/especie/rupicapra_rupicapra/) balcanico, mentre tra le pietraie vive l’arvicola delle nevi.
      Sulle creste si avvistano inoltre il gracchio corallino, il codirossone, il merlo dal collare e la
      coturnice. Tra i rettili figurano la testuggine di Hermann, il colubro di Esculapio e il colubro liscio.


      I camminatori confondono frequentemente il gatto selvatico con la lince, sebbene i caratteri distintivi
      siano evidenti.
    visit: >-
      I sentieri più frequentati partono dal centro visite di Pelister e dall’hotel Molika, a quindici minuti
      d’auto da Bitola. Il più agevole è l’itinerario storico: parte accanto al centro informazioni, misura
      1,7 km, richiede circa 50 minuti con 143 m di dislivello ed è classificato facile. Tabelle esplicative e
      mappe ripercorrono le vicende belliche e la vita quotidiana dei soldati al fronte della Prima Guerra
      Mondiale.


      Per raggiungere la cima vi sono due classiche ascese. Da Bolnici, 19,7 km e circa 7 h 55 min con 1242 m
      di salita, praticabile da maggio a novembre: a 2200 m sorgevano gli ospedali da campo della guerra,
      mentre la vetta ospita un’antenna con una superba vista sul lago di Prespa e sui massicci di Korab e
      Šar. Da Shiroka, 12,8 km e circa 3 h 50 min con 1220 m di dislivello, provvisto di paline metalliche
      invernali che orientano gli escursionisti nella neve alta evitando i canaloni di valanga.


      Se desideri raggiungere i laghi, la traversata per la vetta e i due specchi glaciali misura 22,1 km e
      1358 m di dislivello; si compie solitamente in due giorni, con pernottamento al rifugio del Lago Grande.
      Il percorso circolare dal fiume Sapunčica al Lago Grande misura 18,3 km e 884 m di salita, partendo
      vicino agli impianti sciistici di Strezevo; lungo la «strada francese», pista militare della Grande
      Guerra, affiorano trincee e bunker d’epoca.
    history: >-
      Già nel 1938 erano attivi i rifugi montani di Begova Česma a 1420 m e Kopanki a 1610 m. Il Pelister fu
      un caposaldo strategico durante le battaglie del fronte macedone dal 1916 al 1918, e sulle creste si
      scorgono tuttora trincee, ricoveri e postazioni di tiro. Malovište è l’unico villaggio all’interno del
      parco: un museo etnografico a cielo aperto di architettura aromuna, con case in pietra risalenti a
      150-200 anni fa.
    before: >-
      L’ente parco invita a registrare la visita tramite un apposito modulo prima dell’arrivo; verifica le
      modalità di registrazione. I sentieri sono aperti 24 ore su ventiquattro, ma si consiglia vivamente di
      muoversi alla luce del sole. È rigorosamente vietato accendere fuochi e il campeggio è consentito solo
      nelle aree deputate; i cani vanno tenuti al guinzaglio per non disturbare la fauna.
    around: >-
      A sei chilometri si estende il [Parco Nazionale di Prespa](/lugar/ethniko-parko-prespon/), e a dodici il
      [Parco Nazionale di Galičica](/lugar/nacionalen-park-galicica/). Più lontano, il [Parco Nazionale del
      Pirin - Foreste Selvagge](/lugar/pirin-national-park-forest-wilderness/) condivide il pino macedone, il
      camoscio e l’orso, mentre il [Parco Naturale delle Alpi
      Marittime](/lugar/parco-naturale-delle-alpi-marittime/), il [Parco Nazionale della
      Vanoise](/lugar/parc-national-de-la-vanoise/) e il [Parco Nazionale del Gran
      Paradiso](/lugar/parco-nazionale-gran-paradiso/) condividono alta quota, camosci e aquile reali.
  pt:
    intro: >-
      Em 1839, um botânico alemão subiu ao Pelister acompanhado por onze soldados otomanos, recolheu ramos de
      um pinheiro até então desconhecido pela ciência e baptizou-o Pinus peuce. Quase dois séculos volvem,
      esse pinheiro de cinco agulhas é o símbolo do parque. O Parque Nacional de Pelister, no maciço de Baba,
      foi criado em 1948 como o primeiro parque nacional da Jugoslávia e permanece a mais antiga área
      protegida da Macedónia do Norte. Ocupa 17 150 hectares entre os municípios de Bitola e Resen,
      elevando-se dos 891 aos 2601 m de altitude.
    landscape: >-
      O Baba é um maciço imponente de granitos e xistos cristalinos, moldado por processos glaciares e sulcado
      por extensos «rios de pedra». Durante o Plistocénico, as suas zonas cimeiras albergaram glaciares que
      esculpiram circos e moreias; desse passado subsistem duas lagoas de altitude: os Olhos de Pelister, a
      2218 e 2180 m de altitude.


      As florestas cobrem as encostas. Predominam os faiais da Mésia, secundados por matos subalpinos e
      pinhais oromediterrânicos de pinheiro-molika; mais acima estendem-se as pastagens alpinas. A flora é de
      uma riqueza invulgar: mais de 1050 espécies de plantas vasculares, com 88 espécies arbóreas,
      distribuídas por 21 comunidades vegetais. O pinheiro-molika é uma relíquia terciária e endemismo
      balcânico com tufos de cinco agulhas; o abeto-branco procura as encostas húmidas e sombrias, competindo
      com ele pelo dossel.
    wildlife: >-
      Mais de 200 espécies animais habitam este maciço. O [urso-pardo](/especie/ursus_arctos/) encontra
      alimento abundante, pastando mirtilos e formigas; os rastos do [lobo](/especie/canis_lupus/) surgem em
      todo o parque, desde os vales até às cristas alpinas, ao passo que o lince-balcânico é muito raro e sem
      núcleo reprodutor fixo. Entre a avifauna de montanha contam-se a galinha-do-mato, o
      [bufo-real](/especie/bubo_bubo/), a coruja-do-mato, o noitibó, vários pica-paus e a
      [águia-real](/especie/aquila_chrysaetos/). O andar alpino pertence à
      [camurça](/especie/rupicapra_rupicapra/) dos Balcãs, vivendo o rato-das-neves nas escombreiras. Nas
      zonas altas avistam-se ainda o gralha-de-bico-vermelho, o melro-das-rochas, o melro-de-peito-branco e a
      perdiz-da-rocha. Entre os répteis ocorrem a tartaruga-mediterrânica, a cobra-de-esculápio e a
      cobra-lisa-europeia.


      Os visitantes confundem frequentemente o gato-bravo com o lince, apesar das suas diferenças anatómicas
      evidentes.
    visit: >-
      Os percursos pedestres mais concorridos partem do centro de acolhimento de Pelister e do hotel Molika, a
      quinze minutos de automóvel de Bitola. O mais acessível é o trilho histórico: inicia-se junto ao centro
      de informação, tem 1,7 km de extensão, demora cerca de 50 minutos com 143 m de desnível e está
      classificado como fácil. Painéis explicativos e cartografia ilustram os combates e o quotidiano das
      tropas na linha da Primeira Guerra Mundial.


      Para coroar o cume destacam-se duas opções clássicas. Por Bolnici, com 19,7 km e cerca de 7 h 55 min com
      1242 m de subida acumulada, praticável de maio a novembro: aos 2200 m funcionaram hospitais de campanha
      militares, enquanto o topo ostenta uma antena com vistas panorâmicas sobre o lago Prespa e os maciços de
      Korab e Šar. Por Shiroka, com 12,8 km e cerca de 3 h 50 min com 1220 m de desnível, balizado com marcos
      metálicos de inverno que orientam a progressão sobre a neve alta evitando vertentes com risco de
      avalanche.


      Para visitar as lagoas, a travessia pelo cume e pelos dois lagos glaciares totaliza 22,1 km e 1358 m de
      subida; divide-se habitualmente em dois dias, pernoitando no refúgio do Lago Grande. O trilho circular
      do rio Sapunčica ao Lago Grande tem 18,3 km e 884 m de subida, com partida perto da estância de esqui de
      Strezevo; ao longo da «estrada francesa», pista militar da Grande Guerra, vislumbram-se restos de
      trincheiras e casamatas.
    history: >-
      Já em 1938 existiam os abrigos de Begova Česma a 1420 m e Kopanki a 1610 m. O Pelister foi um reduto
      estratégico crucial nas batalhas da frente macedónia entre 1916 e 1918, restando ainda vestígios de
      trincheiras, abrigos e ninhos de metralhadora. Malovište é a única povoação encravada no parque: um
      museu etnográfico ao ar livre de arquitetura aromena, com casas de pedra com 150 a 200 anos.
    before: >-
      A entidade gestora solicita o registo prévio da visita através de formulário; confirma como efetuar a
      inscrição. Os trilhos estão acessíveis 24 horas por dia, embora se recomende vivamente caminhar durante
      as horas diurnas. É proibido fazer fogueiras e o acampamento só é permitido nos locais regulamentados;
      os cães devem circular com trela para não afugentar a fauna nativa.
    around: >-
      A seis quilómetros estende-se o [Parque Nacional de Prespa](/lugar/ethniko-parko-prespon/), e a doze
      quilómetros ergue-se o [Parque Nacional de Galičica](/lugar/nacionalen-park-galicica/). Mais além, o
      [Parque Nacional de Pirin - Floresta Selvagem](/lugar/pirin-national-park-forest-wilderness/) partilha o
      pinheiro-da-macedónia, a camurça e o urso, enquanto o [Parque Natural dos Alpes
      Marítimos](/lugar/parco-naturale-delle-alpi-marittime/), o [Parque Nacional de
      Vanoise](/lugar/parc-national-de-la-vanoise/) e o [Parque Nacional Gran
      Paradiso](/lugar/parco-nazionale-gran-paradiso/) partilham a alta montanha, a camurça e a águia-real.
