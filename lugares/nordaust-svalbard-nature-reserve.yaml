resumen:
  es: >-
    La mayor reserva natural estricta de Noruega (55.000 km²), dominada por el casquete de hielo de Austfonna
    (el casquete de hielo más grande de Europa fuera de Groenlandia).
  en: >-
    Norway's largest strict nature reserve (55,000 km²), dominated by the Austfonna ice cap (Europe's largest
    ice cap outside Greenland).
  fr: >-
    La plus vaste réserve naturelle intégrale de Norvège (55 000 km²), dominée par la calotte glaciaire
    d'Austfonna (la plus grande calotte d'Europe hors Groenland).
  de: >-
    Norwegens größtes strenges Naturreservat (55.000 km²), dominiert von der Eiskappe Austfonna (Europas
    größte Eiskappe außerhalb Grönlands).
  it: >-
    La più grande riserva naturale integrale della Norvegia (55.000 km²), dominata dalla calotta glaciale
    Austfonna (la maggiore calotta d'Europa fuori dalla Groenlandia).
  pt: >-
    A maior reserva natural estrita da Noruega (55.000 km²), dominada pela calota de gelo Austfonna (a maior
    calota de gelo da Europa fora da Gronelândia).
unico:
  es: >-
    Aquí está el mayor glaciar de Noruega y el criadero de osos polares más importante de esta parte del
    Ártico, y a este último está prohibido acercarse.
  en: >-
    Here lies Norway's largest glacier and the most important polar bear nursery in this sector of the Arctic,
    the latter under strict access prohibition.
  fr: >-
    Ici se trouvent le plus grand glacier de Norvège et la pouponnière d'ours polaires la plus cruciale de ce
    secteur arctique, cette dernière étant strictement interdite d'accès.
  de: >-
    Hier liegen Norwegens mächtigster Gletscher und die bedeutendste Eisbären-Wurfregion dieses Arktissektors,
    letztere unter absolutem Betretungsverbot.
  it: >-
    Qui si trova il ghiacciaio più esteso della Norvegia e la nursery di orsi polari più importante di questo
    settore artico, quest'ultima rigorosamente interdetta all'accesso.
  pt: >-
    Aqui localiza-se o maior glaciar da Noruega e a maternidade de ursos-polares mais relevante deste setor do
    Ártico, estando esta última sob rigorosa interdição de aproximação.
observaciones:
  es: >-
    Esto no es un destino que se visite por libre: antes de planear la salida, consulta al gobernador de
    Svalbard qué permisos y avisos exige tu actividad y qué sectores están abiertos. En las áreas protegidas
    hay que evitar huellas duraderas y desgaste del terreno y de los bienes culturales; las piedras y otros
    materiales usados se devuelven a su sitio.
texto:
  es:
    intro: >-
      Hay un lugar en Noruega donde una sola área protegida es más grande que cualquier parque nacional del
      país, y casi nadie lo pisa. Nordaust-Svalbard, en el noreste del archipiélago, suma unos 55.354 km², de
      ellos 18.663 de tierra y 36.691 de agua. Cubre todo Nordaustlandet, Kong Karls Land, Kvitøya, Sjuøyane,
      Storøya, Lågøya, la isla Wilhelm, Wahlbergøya y un pequeño trozo del noreste de Spitsbergen. Es hielo,
      mar y roca bajo un cielo de desierto polar, con osos polares, morsas y acantilados llenos de aves.
    landscape: >-
      Tres cuartas partes de Nordaustlandet están cubiertas por glaciares, y el mayor, el Austfonna, ocupa
      unos 7000 km² y es el mayor glaciar de Noruega. Con él están el Vestfonna y partes de Olav V Land. Lo
      que queda es un paisaje de colinas bajas y redondeadas y llanuras, creadas por la glaciación de las eras
      glaciales. Casi toda la reserva tiene poca o ninguna vegetación y pertenece al desierto polar.


      La costa es otra cosa. Las pequeñas áreas costeras de la reserva contienen colonias de aves marinas y
      áreas de cría de barnaclas cariblancas. En el acantilado de Alkefjellet, en la costa occidental del
      estrecho de Hinlopen, se reúnen los acantilados de nidificación.
    wildlife: >-
      La estrella es el [oso polar](/especie/ursus_maritimus/). El archipiélago de Kong Karls Land es el área
      de cría de osos polares más importante de esta parte del Ártico, y por eso está cerrado todo el año: la
      prohibición alcanza al mar a menos de 500 m de la costa y al sobrevuelo por debajo de 500 m. La reserva
      incluye también varias áreas de descanso de [morsas](/especie/odobenus_rosmarus/), y se han visto
      hembras con crías.


      Las aves se ven mejor en la época de cría. En Alkefjellet anidan araos de Brünnich, y en la reserva
      crían barnaclas cariblancas, gaviotas de Sabine y gaviotas marfil. Otras zonas importantes para aves
      marinas son Sjuøyane, Lågøya y el estrecho de Hinlopen, y gran parte de la reserva, con los acantilados,
      es Área Importante para las Aves por sostener 80-90 parejas reproductoras de gaviota marfil. En tierra,
      el [zorro ártico](/especie/vulpes_lagopus/) y el reno de Svalbard son animales comunes.
    visit: >-
      Los visitantes llegan por mar: suelen navegar hacia el este por el estrecho de Hinlopen o rodear
      Nordaustlandet, y los lugares más visitados son Sjuøyane, Alkefjellet, Bråsvellbreen y Kvitøya. Para el
      turismo organizado el desembarco solo puede hacerse en lugares señalados en el mapa y con un guía que
      conozca el medio natural y cultural.


      Para desembarcar en Nordaustlandet y Edgeøya (zona A) hay que avisar al gobernador de Svalbard al menos
      cuatro semanas antes, y enviar un informe después. Acampar en actividad turística, de campo o de
      investigación exige permiso del gobernador, y el campamento debe protegerse con guardia de osos polares.
    history: >-
      La reserva está protegida desde el 1 de julio de 1973 y limita al sur con la reserva natural
      Søraust-Svalbard. Es parte de un conjunto mayor: en Svalbard hay siete parques nacionales, 21 reservas
      naturales y un área de protección geotópica, que suman aproximadamente el 65 % de la tierra y el 84 % de
      las aguas territoriales.


      También guarda historia. En Andréeneset, en Kvitøya, partió la expedición en globo de S. A. Andrée en
      1897; hay además una cruz ortodoxa rusa en Krossøya, un campamento de invierno en el Sorgfjorden de la
      expedición sueco-rusa de 1899-1900 y, en el Rijpfjorden, una estación meteorológica alemana de la
      Segunda Guerra Mundial.
    before: >-
      Esto no es un destino que se visite por libre: antes de planear la salida, consulta al gobernador de
      Svalbard qué permisos y avisos exige tu actividad y qué sectores están abiertos. En las áreas protegidas
      hay que evitar huellas duraderas y desgaste del terreno y de los bienes culturales; las piedras y otros
      materiales usados se devuelven a su sitio.
    around: >-
      La [Reserva Natural del Sureste de Svalbard](/lugar/soraust-svalbard-nature-reserve/) está a unos
      dieciséis kilómetros. Más lejos, el [Parque Nacional del Noroeste de
      Spitsbergen](/lugar/northwest-spitsbergen-national-park/) comparte con ella el oso polar y la morsa en
      un entorno de hielo y costa.
  en:
    intro: >-
      There is a place in Norway where a single protected reserve is larger than any national park in the
      country, and almost no human foot ever touches it. Nordaust-Svalbard, in the northeast of the
      archipelago, encompasses some 55,354 km², comprising 18,663 of land and 36,691 of water. It covers the
      whole of Nordaustlandet, Kong Karls Land, Kvitøya, Sjuøyane, Storøya, Lågøya, Wilhelm Island,
      Wahlbergøya and a sliver of northeastern Spitsbergen. It is ice, sea and bedrock under polar desert
      skies, populated by polar bears, walruses and cliff-nesting seabirds.
    landscape: >-
      Three-quarters of Nordaustlandet are smothered beneath glaciers, and the largest, Austfonna, covers some
      7000 km², reigning as Norway's most massive ice cap. Beside it lie Vestfonna and parts of Olav V Land.
      What remains ice-free is a landscape of low, rounded bedrock hills and frost-shattered plains gouged by
      Pleistocene ice sheets. Almost the entire reserve supports little or no vegetation, belonging to the
      high Arctic polar desert.


      The coast tells another story. The scarce ice-free shores harbour dense seabird colonies and barnacle
      goose nesting grounds. Along the sheer cliffs of Alkefjellet, on the western shore of the Hinlopen
      Strait, towering dolerite sea stacks host spectacular bird bazaars.
    wildlife: >-
      The undisputed monarch is the [polar bear](/especie/ursus_maritimus/). The islands of Kong Karls Land
      form the premier maternal denning ground for polar bears in this part of the Arctic, which is why access
      is banned year-round: the prohibition extends to sea waters within 500 m of shore and airspace below 500
      m. The reserve also protects numerous haul-out sites for [walruses](/especie/odobenus_rosmarus/),
      including maternal groups with calves.


      Birdlife peaks during the short breeding season. Alkefjellet hosts massive colonies of Brünnich's
      guillemots, while barnacle geese, Sabine's gulls and ivory gulls breed along coastal tundra. Other key
      seabird havens include Sjuøyane, Lågøya and the Hinlopen Strait; extensive coastal cliffs are recognized
      as an Important Bird Area for supporting 80-90 breeding pairs of ivory gulls. On land, the [Arctic
      fox](/especie/vulpes_lagopus/) and Svalbard reindeer are common.
    visit: >-
      Visitors arrive exclusively by sea: expedition vessels typically sail east through the Hinlopen Strait
      or circumnavigate Nordaustlandet, with premier highlights including Sjuøyane, Alkefjellet, the
      Bråsvellbreen glacier waterfall wall, and Kvitøya. For organized tourism, shore landings are strictly
      restricted to mapped, approved landing sites led by qualified guides knowledgeable about arctic ecology
      and cultural heritage.


      Landing on Nordaustlandet and Edgeøya (Zone A) requires notifying the Governor of Svalbard at least four
      weeks in advance, followed by a formal post-trip report. Camping for tourism, fieldwork or scientific
      research demands a special permit from the Governor, and camps must maintain continuous polar bear
      watch.
    history: >-
      The reserve has been protected since 1 July 1973, bordering the Søraust-Svalbard nature reserve to the
      south. It is part of an overarching wilderness network: Svalbard hosts seven national parks, 21 nature
      reserves and a geotrope protection area, collectively safeguarding roughly 65% of the land area and 84%
      of territorial waters.


      It also preserves poignant polar history. At Andréeneset on Kvitøya ended the ill-fated hydrogen balloon
      expedition of S. A. Andrée in 1897; a Russian Orthodox cross stands on Krossøya, wintering station
      remains of the 1899-1900 Swedish-Russian Arc-of-Meridian Expedition linger at Sorgfjorden, and a World
      War II German weather station lies at Rijpfjorden.
    before: >-
      This is not a destination for independent casual travel: before planning any journey, consult the
      Governor of Svalbard regarding required notifications, permits and accessible zones. In protected areas,
      visitors must leave no lasting traces, preventing erosion of terrain and cultural heritage; moved rocks
      and materials must be returned to their exact locations.
    around: >-
      The [Søraust-Svalbard Nature Reserve](/lugar/soraust-svalbard-nature-reserve/) lies about sixteen
      kilometres to the south. Further afield, [Northwest Spitsbergen National
      Park](/lugar/northwest-spitsbergen-national-park/) shares the high Arctic marine wilderness, polar bear
      and walrus.
  fr:
    intro: >-
      Il existe en Norvège un territoire où une seule réserve naturelle surpasse en superficie n'importe quel
      parc national du pays, et où presque aucun être humain ne pose le pied. Nordaust-Svalbard, au nord-est
      de l'archipel, cumule quelque 55 354 km², dont 18 663 de terres émergées et 36 691 de domaine marin.
      Elle englobe l'intégralité de Nordaustlandet, Kong Karls Land, Kvitøya, Sjuøyane, Storøya, Lågøya, l'île
      Wilhelm, Wahlbergøya et une frange du nord-est du Spitzberg. C'est un royaume de glace, de mer et de
      roches sous un ciel de désert polaire, peuplé d'ours polaires, de morses et de falaises grouillantes
      d'oiseaux.
    landscape: >-
      Les trois quarts de Nordaustlandet sont enfouis sous les glaciers ; le plus vaste, l'Austfonna, s'étend
      sur environ 7000 km² et constitue la plus grande calotte glaciaire de Norvège. À ses côtés s'étendent le
      Vestfonna et des secteurs d'Olav V Land. Le reste forme une contrée de collines douces et de plaines
      rabotées par les glaciations quaternaires. La quasi-totalité de la réserve présente une végétation
      infime ou nulle, relevant du désert polaire du Haut-Arctique.


      Le littoral offre un tout autre spectacle. Les rares rives déglacées abritent d'immenses colonies
      d'oiseaux de mer et des zones de nidification de bernaches nonnettes. Sur les falaises vertigineuses
      d'Alkefjellet, sur la rive occidentale du détroit d'Hinlopen, s'élèvent de spectaculaires murailles
      d'oiseaux marins.
    wildlife: >-
      Le seigneur absolu est l'[ours blanc](/especie/ursus_maritimus/). L'archipel de Kong Karls Land
      constitue la plus importante zone de tanières de mise bas d'ours polaires de ce secteur arctique, raison
      pour laquelle il est interdit d'accès toute l'année : l'interdiction s'applique à la mer à moins de 500
      m des rivages et au survol en dessous de 500 m. La réserve protège également plusieurs reposoirs de
      [morses](/especie/odobenus_rosmarus/), où s'observent des femelles avec leurs petits.


      L'avifaune resplendit lors de la nidification estivale. À Alkefjellet nichent des guillemots de Brünnich
      par milliers, tandis que bernaches nonnettes, mouettes de Sabine et mouettes ivoires se reproduisent sur
      la toundra côtière. Parmi les autres havres marins d'importance figurent Sjuøyane, Lågøya et le détroit
      d'Hinlopen ; de vastes falaises sont classées Zone Importante pour les Oiseaux pour accueillir 80-90
      couples nicheurs de mouettes ivoires. Sur la terre ferme, le [renard polaire](/especie/vulpes_lagopus/)
      et le renne du Svalbard sont communs.
    visit: >-
      Les voyageurs arrivent exclusivement par la voie maritime : les navires de croisière d'expédition
      empruntent le détroit d'Hinlopen ou effectuent la circumnavigation de Nordaustlandet, les escales
      vedettes comprenant Sjuøyane, Alkefjellet, la falaise de glace de Bråsvellbreen et Kvitøya. Pour le
      tourisme organisé, les débarquements à terre ne s'effectuent que sur des sites cartographiés et
      approuvés, sous la conduite de guides chevronnés maîtrisant le milieu arctique et le patrimoine
      historique.


      Tout débarquement sur Nordaustlandet et Edgeøya (zone A) exige une notification préalable au gouverneur
      du Svalbard au moins quatre semaines avant le départ, suivie d'un rapport de mission. Bivouaquer pour
      des motifs d'expédition ou de recherche nécessite une autorisation du gouverneur, et les campements
      doivent être placés sous garde permanente contre les ours polaires.
    history: >-
      La réserve bénéficie d'une protection légale depuis le 1 juillet 1973 et jouxte au sud la réserve
      naturelle de Søraust-Svalbard. Elle participe d'un vaste sanctuaire : le Svalbard réunit sept parcs
      nationaux, 21 réserves naturelles et une zone de protection géotopique, couvrant environ 65 % des terres
      et 84 % des eaux territoriales.


      Ce territoire porte aussi la mémoire polaire. À Andréeneset, sur Kvitøya, prit fin la tragique
      expédition en ballon de S. A. Andrée en 1897 ; on relève également une croix orthodoxe russe sur
      Krossøya, les vestiges de la station hivernale de l'expédition suédo-russe de 1899-1900 dans le
      Sorgfjorden, et une station météo allemande de la Seconde Guerre mondiale au Rijpfjorden.
    before: >-
      Ce n'est pas une région praticable en autonomie : avant toute démarche, consultez le gouverneur du
      Svalbard pour connaître les autorisations requises et les secteurs ouverts. Dans ces sanctuaires, il
      faut éviter tout impact durable sur le sol et les sites historiques ; les pierres déplacées doivent être
      remises à leur emplacement originel.
    around: >-
      La [Réserve naturelle du sud-est du Svalbard](/lugar/soraust-svalbard-nature-reserve/) se situe à
      environ seize kilomètres au sud. Plus loin, le [Parc national du nord-ouest du
      Spitzberg](/lugar/northwest-spitsbergen-national-park/) partage l'océan polaire, l'ours blanc et le
      morse.
  de:
    intro: >-
      Es gibt einen Ort in Norwegen, an dem ein einziges Schutzgebiet größer ist als jeder Nationalpark des
      Landes, und den fast kein Mensch je betritt. Nordost-Svalbard im Nordosten des Archipels umfasst rund
      55.354 km², davon 18.663 Land- und 36.691 Wasserfläche. Es schließt ganz Nordaustlandet, Kong Karls
      Land, Kvitøya, Sjuøyane, Storøya, Lågøya, Wilhelmøya, Wahlbergøya sowie einen Teil Nordost-Spitzbergens
      ein. Es ist Eis, Meer und Fels unter hocharktischem Polarwüstenhimmel, bevölkert von Eisbären, Walrossen
      und riesigen Vogelkolonien.
    landscape: >-
      Drei Viertel von Nordaustlandet sind von Gletschern begraben; der größte, die Eiskappe Austfonna,
      bedeckt rund 7000 km² und ist der mächtigste Gletscher Norwegens. Daneben liegen Vestfonna und Teile von
      Olav V Land. Das eisfreie Land ist geprägt von sanften Rundhöckern und weiten Ebenen, die das
      eiszeitliche Inlandeis flach geschliffen hat. Fast das gesamte Reservat besitzt spärliche bis gar keine
      Vegetation und zählt zur polaren Kältewüste.


      Die Küstenlinien bilden den Kontrast. Die kleinen eisfreien Küstenstreifen beherbergen dichte
      Seevogelkolonien und Brutplätze von Weißwangengänsen. An den Steilwänden von Alkefjellet an der
      Westküste der Hinlopenstraße erheben sich monumentale Vogelberge.
    wildlife: >-
      Das Symboltier ist der [Eisbär](/especie/ursus_maritimus/). Kong Karls Land ist das wichtigste
      Wurfgebiet der Eisbären in diesem Teil der Arktis und daher ganzjährig gesperrt: Das Verbot gilt für das
      Meer innerhalb von 500 m von der Küste und Überflüge unter 500 m Höhe. Das Reservat schützt zudem
      mehrere Liegeplätze von [Walrossen](/especie/odobenus_rosmarus/), wo auch Muttertiere mit Kälbern ruhen.


      Die Vogelwelt entfaltet sich zur Brutzeit. An den Klippen von Alkefjellet brüten Dickschnabellummen, an
      den Küstenebenen Weißwangengänse, Schwalbenmöwen und Elfenbeinmöwen. Weitere bedeutende Seevogelareale
      sind Sjuøyane, Lågøya und die Hinlopenstraße; Steilküsten des Reservats sind als Important Bird Area für
      80-90 Brutpaare der Elfenbeinmöwe ausgewiesen. An Land sind [Polarfuchs](/especie/vulpes_lagopus/) und
      Spitzbergen-Ren verbreitet.
    visit: >-
      Besucher reisen auf dem Seeweg an: Expeditionsschiffe queren die Hinlopenstraße oder umrunden
      Nordaustlandet; zu den Höhepunkten zählen Sjuøyane, Alkefjellet, die Abbruchkante des Bråsvellbreen und
      Kvitøya. Für den organisierten Tourismus sind Landgänge nur an kartierten, behördlich freigegebenen
      Plätzen unter Leitung arktiserfahrener Guides erlaubt.


      Landgänge auf Nordaustlandet und Edgeøya (Zone A) müssen dem Sysselmester mindestens vier Wochen vorab
      gemeldet werden, gefolgt von einem Abschlussbericht. Campieren im Rahmen von Expeditionen oder
      Feldforschung erfordert eine Genehmigung des Sysselmesters und ständige Eisbärenwache.
    history: >-
      Das Naturreservat steht seit dem 1. Juli 1973 unter Schutz und grenzt im Süden an das Naturreservat
      Søraust-Svalbard. Es ist Teil eines umfassenden Wildnisnetzwerks: Auf Svalbard bestehen sieben
      Nationalparks, 21 Naturreservate und ein Geotopschutzgebiet, die zusammen rund 65 % der Land- und 84 %
      der Territorialgewässer sichern.


      Auch Polarhistorie ist präsent: Bei Andréeneset auf Kvitøya endete 1897 die Ballonexpedition von S. A.
      Andrée; auf Krossøya steht ein russisch-orthodoxes Kreuz, am Sorgfjorden liegen Überreste der
      schwedisch-russischen Gradmessungsexpedition von 1899-1900, und am Rijpfjorden eine
      Wehrmachts-Wetterstation.
    before: >-
      Dies ist kein Ziel für Individualreisende: Kläre vorab mit dem Sysselmester, welche Genehmigungen für
      dein Vorhaben erforderlich sind und welche Zonen offenstehen. In den Schutzgebieten dürfen keine
      dauerhaften Spuren hinterlassen werden; Steine und Baumaterialien müssen am Ursprungsort verbleiben.
    around: >-
      Das [Naturreservat Südost-Svalbard](/lugar/soraust-svalbard-nature-reserve/) liegt rund sechzehn
      Kilometer südlich. Weiter entfernt teilt der [Nationalpark
      Nordwest-Spitzbergen](/lugar/northwest-spitsbergen-national-park/) Eisbär, Walross und Meereswildnis.
  it:
    intro: >-
      C'è un luogo in Norvegia dove una singola riserva naturale protetta è più estesa di qualsiasi parco
      nazionale del paese, e quasi nessun essere umano vi mette piede. Nordaust-Svalbard, nel nord-est
      dell'arcipelago, misura circa 55.354 km², di cui 18.663 di terraferma e 36.691 di acque marine.
      Comprende l'intera Nordaustlandet, Kong Karls Land, Kvitøya, Sjuøyane, Storøya, Lågøya, l'isola Wilhelm,
      Wahlbergøya e una porzione nord-orientale di Spitsbergen. È un regno di ghiaccio, mare e rocce sotto un
      cielo di deserto polare, dimora di orsi polari, trichechi e scogliere gremite di uccelli.
    landscape: >-
      Tre quarti di Nordaustlandet sono coperti da colossali ghiacciai; il maggiore, la calotta di Austfonna,
      copre circa 7000 km² ed è il più esteso ghiacciaio della Norvegia. Accanto si stendono il Vestfonna e
      settori di Olav V Land. Ciò che emerge libero dai ghiacci è una landa di basse colline arrotondate e
      pianure plasmate dalle glaciazioni. Quasi l'intera riserva ospita vegetazione scarsa o nulla,
      appartenendo al deserto polare d'alta quota.


      La costa offre uno scenario del tutto differente. I rari lembi litoranei privi di ghiaccio accolgono
      colonie di uccelli marini e aree riproduttive di oche facciabianca. Sulle imponenti pareti di
      Alkefjellet, lungo la sponda occidentale dello stretto di Hinlopen, si innalzano falesie spettacolari
      affollate di nidiacei.
    wildlife: >-
      Il dominatore incontrastato è l'[orso polare](/especie/ursus_maritimus/). L'arcipelago di Kong Karls
      Land è il sito riproduttivo e di svernamento di orsi polari più rilevante di questa fascia artica,
      motivo per cui è chiuso all'accesso tutto l'anno: il divieto si estende in mare entro 500 m dalla riva e
      nello spazio aereo sotto i 500 m di quota. La riserva protegge inoltre diversi siti di sosta per
      [trichechi](/especie/odobenus_rosmarus/), dove sono state osservate femmine con piccoli.


      L'avifauna tocca l'apice nella breve stagione estiva. Ad Alkefjellet nidificano migliaia di urie di
      Brünnich, mentre sulle coste nidificano oche facciabianca, gabbiani di Sabine e gabbiani d'avorio. Altri
      santuari marini comprendono Sjuøyane, Lågøya e lo stretto di Hinlopen; vaste falesie sono classificate
      Important Bird Area ospitando 80-90 coppie nidificanti di gabbiano d'avorio. A terra, la [volpe
      artica](/especie/vulpes_lagopus/) e la renna delle Svalbard sono presenze stabili.
    visit: >-
      I visitatori giungono unicamente per mare: le imbarcazioni da spedizione navigano lungo lo stretto di
      Hinlopen o compiono la circumnavigazione di Nordaustlandet; le mete più rinomate sono Sjuøyane,
      Alkefjellet, il fronte glaciale di Bråsvellbreen e Kvitøya. Per il turismo organizzato gli sbarchi sono
      consentiti solo in punti cartografati e autorizzati, sotto la guida di esperti profondi conoscitori
      dell'ambiente artico.


      Sbarcare su Nordaustlandet ed Edgeøya (zona A) richiede una notifica al Governatore delle Svalbard
      almeno quattro settimane prima della partenza, seguita da una relazione conclusiva. Il campeggio legato
      a spedizioni scientifiche o turistiche esige l'autorizzazione del Governatore e turni continui di
      guardia contro gli orsi polari.
    history: >-
      La riserva è protetta dal 1 luglio 1973 e confina a sud con la riserva di Søraust-Svalbard. Fa parte di
      un grandioso sistema: alle Svalbard sorgono sette parchi nazionali, 21 riserve naturali e un'area
      geotopica, che insieme salvaguardano circa il 65% delle terre e l'84% delle acque territoriali.


      Custodisce anche grandi memorie polari: ad Andréeneset su Kvitøya si spense la sfortunata spedizione in
      pallone aerostatico di S. A. Andrée del 1897; si conservano inoltre una croce ortodossa russa a
      Krossøya, i resti della stazione invernale russo-svedese del 1899-1900 nel Sorgfjorden e una stazione
      meteo tedesca della Seconda Guerra Mondiale nel Rijpfjorden.
    before: >-
      Non è una destinazione visitabile in autonomia: prima di organizzare il viaggio, verifica con il
      Governatore delle Svalbard i permessi richiesti e i settori accessibili. Nelle aree protette è
      obbligatorio non lasciare tracce durature; pietre e materiali spostati vanno riposizionati esattamente
      dove trovati.
    around: >-
      La [Riserva Naturale delle Svalbard Sud-Orientali](/lugar/soraust-svalbard-nature-reserve/) dista circa
      sedici chilometri a sud. Più lontano, il [Parco Nazionale di Spitsbergen
      Nord-Occidentale](/lugar/northwest-spitsbergen-national-park/) condivide orso polare, tricheco e falesie
      marine.
  pt:
    intro: >-
      Há um recanto na Noruega onde uma única reserva protegida ultrapassa em área qualquer parque nacional do
      país, e onde quase nenhum ser humano põe os pés. Nordaust-Svalbard, no nordeste do arquipélago, totaliza
      cerca de 55.354 km², dos quais 18.663 terrestres e 36.691 marinhos. Abrange toda a ilha de
      Nordaustlandet, Kong Karls Land, Kvitøya, Sjuøyane, Storøya, Lågøya, a ilha Wilhelm, Wahlbergøya e uma
      nesga do nordeste de Spitsbergen. É gelo, oceano e rocha sob céu de deserto polar, habitado por
      ursos-polares, morsas e arribas apinhadas de aves marinhas.
    landscape: >-
      Três quartos de Nordaustlandet jazem soterrados por glaciares; o maior deles, Austfonna, cobre cerca de
      7000 km² e constitui a maior calota glaciar da Noruega. A seu lado estendem-se o Vestfonna e partes de
      Olav V Land. O terreno descoberto resume-se a colinas aplanadas e planícies desgastadas pelas glaciações
      quaternárias. Quase toda a reserva apresenta vegetação escassa ou nula, enquadrando-se no deserto polar
      ártico.


      A orla costeira oferece outro cenário. As escassas faixas livres de gelo albergam colónias de aves
      marinhas e áreas de nidificação de gansos-de-faces-brancas. Nas escarpas de Alkefjellet, na margem
      poente do estreito de Hinlopen, erguem-se falésias imponentes repletas de aves.
    wildlife: >-
      O soberano incontestado é o [urso-polar](/especie/ursus_maritimus/). O arquipélago de Kong Karls Land
      constitui a maternidade de ursos-polares mais crucial desta área ártica, razão pela qual permanece
      encerrado todo o ano: a proibição abrange o mar a menos de 500 m da costa e o sobrevoo abaixo dos 500 m
      de altitude. A reserva protege igualmente diversos restingas de [morsas](/especie/odobenus_rosmarus/),
      onde se avistam fêmeas com crias.


      As aves destacam-se no curto verão reprodutor. Em Alkefjellet nidificam milhares de airo-de-brünnich,
      enquanto gansos-de-faces-brancas, gaivotas-de-sabine e gaivotas-marfim criam na tundra costeira. Outros
      santuários vitais incluem Sjuøyane, Lågøya e o estreito de Hinlopen; extensas falésias constituem Área
      Importante para as Aves por sustentarem 80-90 casais reprodutores de gaivota-marfim. Em terra firme, a
      [raposa-do-ártico](/especie/vulpes_lagopus/) e a rena de Svalbard são animais comuns.
    visit: >-
      Os viajantes acedem exclusivamente por via marítima: as viagens de expedição cruzam o estreito de
      Hinlopen ou contornam Nordaustlandet, sobressaindo paragens como Sjuøyane, Alkefjellet, a imensa
      barreira glaciar de Bråsvellbreen e Kvitøya. No turismo organizado os desembarques realizam-se
      estritamente em locais cartografados e aprovados, sob orientação de guias credenciados com sólidos
      conhecimentos do ecossistema ártico.


      Desembarcar em Nordaustlandet e Edgeøya (zona A) implica notificar o Governador de Svalbard com pelo
      menos quatro semanas de antecedência, remetendo um relatório após a viagem. Acampar em expedições
      científicas ou de lazer exige autorização do Governador e guarda ininterrupta contra ursos-polares.
    history: >-
      A reserva está classificada desde 1 de julho de 1973 e confina a sul com a reserva de Søraust-Svalbard.
      Insere-se numa vasta malha de conservação: em Svalbard contam-se sete parques nacionais, 21 reservas
      naturais e uma área de proteção geotópica, resguardando perto de 65% da terra e 84% das águas
      territoriais.


      Guarda também memórias das explorações polares: em Andréeneset, em Kvitøya, findou a trágica expedição
      em balão de S. A. Andrée em 1897; encontra-se ainda uma cruz ortodoxa russa em Krossøya, ruínas do
      acampamento de inverno da expedição sueco-russa de 1899-1900 em Sorgfjorden e uma estação meteorológica
      alemã da Segunda Guerra Mundial em Rijpfjorden.
    before: >-
      Não é um destino visitável de modo independente: antes de delinear a viagem, informa-te junto do
      Governador de Svalbard sobre as autorizações necessárias e os setores acessíveis. Nas reservas é
      obrigatório não deixar pegadas duradouras; pedras e materiais manuseados devem ser recolocados no local
      exato.
    around: >-
      A [Reserva Natural do Sudeste de Svalbard](/lugar/soraust-svalbard-nature-reserve/) dista cerca de
      dezasseis quilómetros a sul. Mais longe, o [Parque Nacional do Noroeste de
      Spitsbergen](/lugar/northwest-spitsbergen-national-park/) partilha o urso-polar, a morsa e a paisagem
      marinha ártica.
