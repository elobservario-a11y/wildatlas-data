resumen:
  es: >-
    Acantilados de arenisca roja de 180 m de altura en la pared del Noup of Noss, donde anidan más de 150.000
    aves marinas.
  en: Red sandstone sea cliffs rising 180 m at the Noup of Noss, where over 150,000 seabirds nest.
  fr: Falaises de grès rouge hautes de 180 m au Noup of Noss, où nichent plus de 150 000 oiseaux marins.
  de: >-
    Rote Sandsteinklippen von 180 m Höhe an der Steilwand des Noup of Noss, an denen über 150.000 Meeresvögel
    brüten.
  it: >-
    Falesie di arenaria rossa alte 180 m sulla parete del Noup of Noss, dove nidificano oltre 150.000 uccelli
    marini.
  pt: >-
    Falésias de arenito vermelho com 180 m de altura na parede do Noup of Noss, onde nidificam mais de 150.000
    aves marinhas.
unico:
  es: Una vuelta de unas cuatro horas por acantilados de hasta 180 metros llenos de aves marinas.
  en: A roughly four-hour coastal walk along sea cliffs up to 180 metres high teeming with seabirds.
  fr: >-
    Un périple d’environ quatre heures au sommet de falaises plongeant jusqu’à 180 mètres, saturées d’oiseaux
    marins.
  de: >-
    Eine rund vierstündige Klippenwanderung entlang von bis zu 180 Meter hohen Steilwänden voller nistender
    Meeresvögel.
  it: >-
    Un percorso ad anello di circa quattro ore lungo scogliere alte fino a 180 metri gremite di uccelli
    marini.
  pt: Um circuito de cerca de quatro horas ao longo de falésias com até 180 metros repletas de aves marinhas.
observaciones:
  es: >-
    Calcula bien el día: hay que cruzar a Bressay, llegar al punto de la barca y volver. Sigue las medidas de
    bioseguridad de NatureScot y comprueba con ellos el servicio de la barca antes de ir.
texto:
  es:
    intro: >-
      Para llegar a Noss hay que cruzar dos veces el agua. Primero, desde Lerwick, el ferry a Bressay;
      después, la barca hinchable de NatureScot que salva en tres minutos el estrecho Noss Sound. Al otro lado
      está una isla pequeña, antes habitada y hoy sin habitantes permanentes, cuyos acantilados de arenisca
      alcanzan 180 metros y concentran una de las colonias de aves marinas más accesibles del Atlántico norte.
    landscape: >-
      La arenisca de Noss se ha erosionado en repisas horizontales, ideales para criar. En ellas anidan
      alcatraces, frailecillos, araos, cormoranes moñudos, gaviotas tridáctilas, alcas, fulmares y págalos
      grandes. Los acantilados del Noup of Noss, conocidos como la «Gran Muralla de Noss», los escaló por
      primera vez Jo Moran en 1963.


      El nombre de la isla viene del nórdico nǫs, «nariz». Entre los atractivos hay un centro de visitantes,
      el Pony Pund, construido para criar ponis de Shetland, la roca Holm of Noss y el acantilado Noup. En
      verano, las paredes costeras florecen con roseroot, red campion y sea campion. Se han registrado 137
      plantas vasculares, entre ellas dos escasas a nivel nacional: la lengua de serpiente pequeña y la
      correhuela nórdica.
    wildlife: >-
      A comienzos de primavera llegan los [alcatraces](/especie/morus_bassanus/), los págalos, los
      [frailecillos](/especie/fratercula_arctica/), los fulmares y las [gaviotas
      tridáctilas](/especie/rissa_tridactyla/). De mediados de mayo a mediados de julio es la mejor época para
      ver aves marinas reproductoras. Los acantilados albergan alcatraces, [araos](/especie/uria_aalge/) y
      [fulmares](/especie/fulmarus_glacialis/), mientras que los [págalos
      grandes](/especie/stercorarius_skua/) anidan tierra adentro.


      La lista de aves ha cambiado mucho. Cuatro especies han empezado a criar (alcatraz, fulmar, págalo
      grande y paíño europeo), y seis han dejado de hacerlo, entre ellas el halcón peregrino y el águila
      marina. Se han registrado 201 especies de aves; también crían limícolas como el correlimos común, la
      agachadiza común, el ostrero y el chorlitejo grande, y aves terrestres como la alondra, el bisbita
      pratense, el bisbita costero y la collalba gris.


      En la costa se ven focas y [nutrias](/especie/lutra_lutra/); las nutrias se dejan ver a menudo y hay
      pocas focas grises y comunes. En días tranquilos se oyen marsopas, y en el mar se han visto diez
      especies de cetáceos, la más frecuente la [marsopa común](/especie/phocoena_phocoena/).
    visit: >-
      Desde el punto de desembarco, un paseo corto lleva al centro de visitantes, y la senda costera permite
      aprender sobre la historia de la isla. La vuelta completa lleva unas cuatro horas; ir al mirador de los
      acantilados y volver requiere unas dos horas y media. El sendero costero se recorre mejor en sentido
      antihorario, para disfrutar las vistas de los acantilados de aves.


      El servicio de ferry hinchable es estacional y lo llevan los guardas de la reserva.
    history: >-
      Noss tenía 20 habitantes en 1851 y no hay residentes permanentes desde 1939. El asentamiento principal
      estuvo en Gungstie, al oeste, edificado en la década de 1670 y usado hoy por los guardas de temporada;
      Setter, al sureste, estuvo habitado hasta la década de 1870 y está en ruinas. La isla es una granja de
      ovejas desde 1900 y reserva natural nacional desde 1955. Es además SPA y SSSI.


      NatureScot mantiene medidas de bioseguridad para reducir la transmisión de gripe aviar por los
      visitantes.
    before: >-
      Calcula bien el día: hay que cruzar a Bressay, llegar al punto de la barca y volver. Sigue las medidas
      de bioseguridad de NatureScot y comprueba con ellos el servicio de la barca antes de ir.
    around: >-
      Noss comparte alcatraz, arao común y frailecillo con la [Reserva Natural de las
      Sept-Îles](/lugar/reserve-naturelle-des-sept-iles/); alcatraz y frailecillo con
      [Alderney](/lugar/alderney/), [Mykines](/lugar/mykines/) y [Skellig Michael](/lugar/skellig-michael/).
  en:
    intro: >-
      To set foot on Noss you must cross open water twice. First, from Lerwick, the roll-on ferry across to
      Bressay; then, NatureScot’s small rigid inflatable ferry boat that bridges the narrow Noss Sound in
      three swift minutes. On the other side awaits a compact island, once settled and now devoid of permanent
      human residents, whose sheer red sandstone precipices soar to 180 metres, sheltering one of the most
      accessible major seabird colonies in the entire North Atlantic.
    landscape: >-
      The Old Red Sandstone of Noss has weathered into stacked horizontal ledges, creating ideal breeding
      tiers for seabirds. Clustered upon these rock ledges nest northern gannets, Atlantic puffins, common
      guillemots, European shags, black-legged kittiwakes, razorbills, northern fulmars and great skuas. The
      vertiginous sea cliffs of the Noup of Noss, known among mountaineers as the "Great Wall of Noss", were
      scaled for the first recorded time by Jo Moran in 1963.


      The name of the island derives from the Old Norse nǫs, meaning "nose". Key island landmarks include a
      seasonal visitor centre, the historical Pony Pund built for breeding Shetland ponies, the dramatic sea
      stack Holm of Noss, and the towering Noup sea cliff. In high summer, the cliff-top maritime turf blazes
      with roseroot, red campion and sea campion. Botanists have catalogued 137 vascular plants, including two
      nationally scarce species: small adder’s-tongue fern and Scottish scutch.
    wildlife: >-
      In early spring, [northern gannet](/especie/morus_bassanus/), great skuas, [atlantic
      puffin](/especie/fratercula_arctica/), fulmars and [black-legged kittiwake](/especie/rissa_tridactyla/)
      arrive in strength. From mid-May through mid-July is the premier window to witness active breeding
      seabirds. The sheer sea cliffs shelter gannets, [common murre](/especie/uria_aalge/) and [northern
      fulmar](/especie/fulmarus_glacialis/), while the territorial [great skua](/especie/stercorarius_skua/)
      nest across the inland peaty heath.


      The avian community has witnessed profound historical shifts. Four species commenced breeding here
      during the twentieth century (gannet, fulmar, great skua and European storm petrel), while six species
      ceased nesting, among them the peregrine falcon and white-tailed sea eagle. In total, 201 bird species
      have been recorded; breeding waders include dunlin, common snipe, Eurasian oystercatcher and common
      ringed plover, accompanied by open-country songbirds like skylark, meadow pipit, rock pipit and northern
      wheatear.


      Along the rocky shoreline you may spot marine mammals and [eurasian otter](/especie/lutra_lutra/);
      otters show themselves frequently, alongside modest numbers of grey and harbour seals. On calm days you
      can listen for harbour porpoises, with ten cetacean species documented offshore, the [harbour
      porpoise](/especie/phocoena_phocoena/) being by far the most frequent.
    visit: >-
      From the landing slipway, a short stroll brings you to the visitor centre, where coastal waymarks
      interpret island natural and human history. The complete circular island circuit takes about four hours;
      hiking to the cliff-top viewpoint and back requires roughly two and a half hours. Walking the coastal
      path in an anti-clockwise direction offers the most dramatic, progressively unfolding views of the
      seabird cities.


      The inflatable passenger ferry operates on a seasonal summer timetable and is skippered by reserve
      wardens.
    history: >-
      Noss supported 20 permanent inhabitants in 1851, but has lacked any resident community since 1939. The
      primary historical settlement was at Gungstie on the western shore, built during the 1670 decade and
      utilized today as seasonal warden quarters; Setter, situated to the southeast, remained inhabited until
      the 1870 decade and now lies in romantic ruins. The island has functioned as a working sheep farm since
      1900 and achieved National Nature Reserve status in 1955. It is further designated as a Special
      Protection Area (SPA) and Site of Special Scientific Interest (SSSI).


      NatureScot maintains rigorous biosecurity protocols to minimize the spread of avian influenza by human
      visitors.
    before: >-
      Plan your timing carefully: you must take the ferry to Bressay, drive or walk to the Noss Sound crossing
      point, and return before evening. Adhere to NatureScot biosecurity guidelines and check that the small
      inflatable boat service is running before setting out.
    around: >-
      Noss shares gannets, common guillemots and puffins with the [Sept-Îles Nature
      Reserve](/lugar/reserve-naturelle-des-sept-iles/); and gannets and puffins with
      [Alderney](/lugar/alderney/), [Mykines](/lugar/mykines/) and [Skellig Michael](/lugar/skellig-michael/).
  fr:
    intro: >-
      Pour atteindre Noss, il faut franchir deux bras de mer successifs. D’abord, depuis Lerwick, le bac
      régulier vers Bressay ; ensuite, l’embarcation pneumatique de NatureScot qui franchit en trois minutes
      le goulet resserré du Noss Sound. De l’autre côté s’étend une île modeste, jadis habitée et aujourd’hui
      dénuée de résidents permanents, dont les abrupts de grès rouge s’élèvent à 180 mètres, rassemblant l’une
      des colonies d’oiseaux marins les plus spectaculaires et accessibles de tout l’Atlantique Nord.
    landscape: >-
      Le grès vieux-rouge de Noss a été sculpté par l’océan en d’innombrables corniches horizontales
      superposées, idéales pour la reproduction des oiseaux de mer. Sur ces terrasses superposées nichent fous
      de Bassan, macareux moines, guillemots de Troïl, cormorans huppés, mouettes tridactyles, petits
      pingouins, fulmars boréaux et grands labbes. Les falaises vertigineuses du Noup of Noss, surnommées la «
      Grande Muraille de Noss », ont été gravies pour la première fois par Jo Moran en 1963.


      Le nom de l’île vient du vieux norrois nǫs, signifiant « nez ». Parmi les sites d’intérêt figurent la
      maison d’accueil, l’enclos historique du Pony Pund bâti pour l’élevage des poneys Shetland, le piton
      rocheux isolé de Holm of Noss et l’éperon sommital du Noup. En été, les pentes maritimes se parent de
      silènes maritimes, de silènes rouges et d’orpin rose. On y recense 137 plantes vasculaires, dont deux
      raretés botaniques à l’échelle nationale : la petite ophioglosse et la renouée boréale.
    wildlife: >-
      Au tout début du printemps reviennent le [fou de Bassan](/especie/morus_bassanus/), les labbes, le
      [macareux moine](/especie/fratercula_arctica/), les fulmars et la [mouette
      tridactyle](/especie/rissa_tridactyla/). La période allant de la mi-mai à la mi-juillet offre le
      meilleur moment pour contempler les oiseaux de mer en pleine nidification. Les parois hébergent des
      colonies denses de fous, de [guillemot de Troïl](/especie/uria_aalge/) et de [fulmar
      boréal](/especie/fulmarus_glacialis/), tandis que le [grand labbe](/especie/stercorarius_skua/) niche au
      sol sur les landes de l’intérieur.


      Le peuplement aviaire a connu de profondes mutations. Quatre espèces s’y sont établies comme
      reproductrices (fou de Bassan, fulmar boréal, grand labbe et océanite tempête), tandis que six ont cessé
      d’y nicher, parmi lesquelles le faucon pèlerin et le pygargue à queue blanche. Au total, 201 espèces
      d’oiseaux ont été recensées ; nichent aussi des limicoles comme le bécasseau variable, la bécassine des
      marais, l’huîtrier pie et le grand gravelot, ainsi que des passereaux ouverts comme l’alouette des
      champs, le pipit farlouse, le pipit maritime et le traquet motteux.


      Sur le littoral s’observent des phoques et [la loutre d’Europe](/especie/lutra_lutra/) ; les loutres s’y
      montrent régulièrement et les phoques gris et veaux-marins fréquentent les anses. Par mer calme, on
      entend souffler les cétacés côtiers, dix espèces ayant été répertoriées dans les eaux environnantes, la
      plus assidue étant [le marsouin commun](/especie/phocoena_phocoena/).
    visit: >-
      Depuis l’embarcadère, une courte marche vous mène au centre d’accueil, où le sentier côtier permet de
      découvrir l’histoire naturelle et humaine de l’île. Le grand tour complet demande environ quatre heures
      ; l’aller-retour jusqu’au belvédère des falaises exige près de deux heures et demie. Il est recommandé
      de parcourir la boucle côtière dans le sens inverse des aiguilles d’une montre pour profiter au mieux de
      la perspective sur les colonies.


      La navette en canot pneumatique est strictement saisonnière et reste manœuvrée par les gardes de la
      réserve.
    history: >-
      Noss comptait 20 habitants en 1851 et ne possède plus aucun résident sédentaire depuis 1939. Le hameau
      principal se trouvait à Gungstie, sur la côte ouest, édifié dans la décennie 1670 et reconverti en
      quartier général des gardes estivaux ; Setter, vers le sud-est, est resté habité jusqu’à la décennie
      1870 avant de tomber en ruines. L’île est exploitée pour l’élevage ovin depuis 1900 et a été classée
      réserve naturelle nationale en 1955. Elle bénéficie également des statuts de ZPS et de SSSI.


      NatureScot applique des protocoles rigoureux de biosécurité afin de juguler la propagation de
      l’influenza aviaire par les visiteurs.
    before: >-
      Planifiez précisément votre journée : vous devez rallier Bressay, rejoindre le point d’embarquement pour
      Noss Sound et prévoir le retour. Respectez les consignes de désinfection de NatureScot et vérifiez le
      fonctionnement du canot avant de vous engager.
    around: >-
      Noss partage le fou de Bassan, le guillemot de Troïl et le macareux moine avec la [Réserve naturelle des
      Sept-Îles](/lugar/reserve-naturelle-des-sept-iles/) ; ainsi que le fou et le macareux avec
      [Aurigny](/lugar/alderney/), [Mykines](/lugar/mykines/) et [Skellig Michael](/lugar/skellig-michael/).
  de:
    intro: >-
      Um nach Noss zu gelangen, musst du zweimal das Meer überqueren. Zuerst von Lerwick mit der Autofähre
      nach Bressay; danach mit dem kleinen Festrumpfschlauchboot von NatureScot, das den schmalen Noss Sound
      in drei schnellen Minuten meistert. Auf der anderen Seite empfängt dich eine kompakte, einst bewohnte
      und heute dauerhaft menschenleere Insel, deren rote Sandsteinklippen 180 Meter senkrecht in die Brandung
      stürzen und eine der am besten erreichbaren Seevogelkolonien des Nordatlantiks beherbergen.
    landscape: >-
      Der rote Sandstein von Noss verwitterte im Laufe der Jahrtausende zu horizontalen Felssimsen, die ideale
      Brutbänder für Meeresvögel bilden. Auf diesen Bändern drängen sich Basstölpel, Papageitaucher,
      Trottellummen, Krähenscharben, Dreizehenmöwen, Tordalke, Eissturmvögel und Große Raubmöwen. Die
      gewaltigen Steilwände des Noup of Noss, unter Bergsteigern als „Große Mauer von Noss“ bekannt, wurden
      1963 erstmals von Jo Moran durchstiegen.


      Der Inselname stammt vom altnordischen nǫs für „Nase“ ab. Zu den Höhepunkten zählen das Besucherzentrum,
      der historische Pferch Pony Pund zur Zucht von Shetlandponys, die Felsnadel Holm of Noss und die
      Hauptwand des Noup. Im Hochsommer überzieht sich die Klippenvegetation mit Rosenwurz, Roter Lichtnelke
      und Strand-Leimkraut. Botaniker verzeichneten 137 Gefäßpflanzenarten, darunter zwei landesweit seltene
      Raritäten: die Kleine Natternzunge und das Nordische Kletten-Labkraut.
    wildlife: >-
      Zu Frühlingsbeginn kehren [Basstölpel](/especie/morus_bassanus/), Raubmöwen,
      [Papageitaucher](/especie/fratercula_arctica/), Eissturmvögel und
      [Dreizehenmöwen](/especie/rissa_tridactyla/) zurück. Von Mitte Mai bis Mitte Juli liegt die
      spektakulärste Zeit, um brütende Seevögel aus nächster Nähe zu erleben. An den Klippen drängen sich
      Basstölpel, [Trottellumme](/especie/uria_aalge/) und [Eissturmvogel](/especie/fulmarus_glacialis/),
      während die imposante [Große Raubmöwe](/especie/stercorarius_skua/) im baumlosen Inselinneren brütet.


      Die Vogelwelt hat im letzten Jahrhundert einen tiefgreifenden Wandel durchlaufen. Vier Arten siedelten
      sich neu als Brutvögel an (Basstölpel, Eissturmvogel, Große Raubmöwe und Sturmschwalbe), während sechs
      Arten verschwanden, darunter Wanderfalke und Seeadler. Insgesamt wurden 201 Vogelarten registriert;
      zudem brüten Watvögel wie Alpenstrandläufer, Bekassine, Austernfischer und Sandregenpfeifer sowie
      Offenlandvögel wie Feldlerche, Wiesenpieper, Felsenpieper und Steinschmätzer.


      An den Felsküsten zeigen sich Robben und der [Fischotter](/especie/lutra_lutra/); Fischotter lassen sich
      erstaunlich oft beobachten, begleitet von kleineren Kolonien von Kegelrobben und Seehunden. An
      windstillen Tagen vernimmt man das Schnaufen von Schweinswalen; zehn Wal- und Delfinarten wurden vor der
      Küste dokumentiert, am häufigsten der [Gewöhnliche Schweinswal](/especie/phocoena_phocoena/).
    visit: >-
      Vom Anleger führt ein kurzer Fußweg zum Besucherzentrum, wo der Küstenpfad spannende Einblicke in Natur-
      und Kulturgeschichte vermittelt. Die gesamte Inselumrundung dauert etwa vier Stunden; der direkte Weg
      zum Aussichtspunkt an den Klippen und zurück nimmt rund zweieinhalb Stunden in Anspruch. Es empfiehlt
      sich, den Küstenweg gegen den Uhrzeigersinn zu wandern, um die Klippenkulisse schrittweise aufzubauen.


      Der Schlauchboot-Fährdienst verkehrt rein saisonal und wird von den Rangern des Reservats gesteuert.
    history: >-
      Noss zählte im Jahr 1851 noch 20 Einwohner und ist seit 1939 dauerhaft unbewohnt. Die Hauptsiedlung lag
      bei Gungstie im Westen, errichtet im Jahrzehnt der 1670er-Jahre und heute Quartier der Saison-Ranger;
      Setter im Südosten blieb bis in die 1870er-Jahre bewohnt und liegt in Ruinen. Seit 1900 wird die Insel
      als Schafweide bewirtschaftet und 1955 zum Nationalen Naturreservat ernannt. Sie ist zugleich als SPA
      und SSSI geschützt.


      NatureScot setzt strikte Biosicherheitsmaßnahmen durch, um die Einschleppung der Vogelgrippe durch
      Besucher zu unterbinden.
    before: >-
      Plane deinen Tagesablauf vorausschauend: Du musst nach Bressay übersetzen, den Einstiegspunkt am Noss
      Sound ansteuern und die Rückkehr einrechnen. Beachte die Desinfektionsvorgaben von NatureScot und
      erkundige dich vorab über den Fährbetrieb des Schlauchboots.
    around: >-
      Noss teilt Basstölpel, Trottellummen und Papageitaucher mit dem [Naturreservat
      Sept-Îles](/lugar/reserve-naturelle-des-sept-iles/) sowie Basstölpel und Papageitaucher mit
      [Alderney](/lugar/alderney/), [Mykines](/lugar/mykines/) und [Skellig Michael](/lugar/skellig-michael/).
  it:
    intro: >-
      Per approdare a Noss bisogna attraversare il mare due volte. Dapprima, salpando da Lerwick, il traghetto
      di linea per Bressay; in seguito, il piccolo gommone rigido gestito da NatureScot che supera in tre
      rapidi minuti lo stretto di Noss Sound. Sull’altra sponda si apre un’isola raccolta, un tempo abitata e
      oggi priva di popolazione stanziale, le cui scogliere di arenaria rossa precipitano per 180 metri
      nell’oceano, ospitando una delle colonie di uccelli pelagici più accessibili dell’intero Atlantico
      settentrionale.
    landscape: >-
      L’arenaria rossa di Noss è stata scolpita dagli elementi in cenge orizzontali sovrapposte, ideali per la
      nidificazione rupicola. Su questi terrazzini rocciosi depongono le uova sule boreali, pulcinelle di
      mare, urie comuni, marangoni dal ciuffo, gabbiani tridattili, gazze marine, fulmari e stercorari
      maggiori. I colossali precipizi del Noup of Noss, noti nell’ambiente alpinistico come la «Grande
      Muraglia di Noss», furono scalati per la prima volta da Jo Moran nel 1963.


      Il toponimo dell’isola discende dall’antico norreno nǫs, «naso». Tra i punti di riferimento figurano il
      centro accoglienza, lo storico recinto Pony Pund ideato per l’allevamento dei pony delle Shetland, il
      faraglione isolato di Holm of Noss e il baluardo del Noup. In estate la sommità delle falesie si colora
      delle fioriture di rodiola rosea, silene dioica e silene marittima. Si contano 137 piante vascolari
      classificate, comprese due rarità a carattere nazionale: l’ofiolosso piccolo e la correggiola scozzese.
    wildlife: >-
      All’inizio della primavera fanno ritorno la [sula bassana](/especie/morus_bassanus/), gli stercorari, la
      [pulcinella di mare](/especie/fratercula_arctica/), i fulmari e il [gabbiano
      tridattilo](/especie/rissa_tridactyla/). Da metà maggio a metà luglio si apre la stagione più
      spettacolare per ammirare le colonie in piena cova. Le pareti rocciose pullulano di sule, [uria
      comune](/especie/uria_aalge/) e [fulmaro](/especie/fulmarus_glacialis/), mentre il territoriale
      [stercorario maggiore](/especie/stercorarius_skua/) nidifica a terra sulle brughiere torbose
      dell’interno.


      La composizione dell’avifauna ha vissuto profondi cambiamenti. Quattro specie si sono insediate ex novo
      come nidificanti (sula, fulmaro, stercorario maggiore e uccello delle tempeste europeo), mentre sei
      hanno abbandonato l’isola, fra cui il falco pellegrino e l’aquila di mare. In complesso sono state
      censite 201 specie di uccelli; nidificano anche limicoli come il piovanello pancianera, il beccaccino,
      la beccaccia di mare e il corriere grosso, oltre a passeriformi come l’allodola, la pispola, lo
      spioncello marino e il culbianco.


      Lungo la scogliera compaiono foche e la [lontra europea](/especie/lutra_lutra/); le lontre si lasciano
      scorgere con notevole frequenza assieme a piccoli nuclei di foca grigia e foca comune. Nelle giornate di
      bonaccia si ode il soffio dei cetacei, con dieci specie marine registrate, fra cui la più frequente è la
      [focena comune](/especie/phocoena_phocoena/).
    visit: >-
      Dal punto di sbarco, una breve camminata conduce al centro visitatori, da cui il sentiero costiero
      racconta la memoria naturale e umana dell’isola. Il periplo integrale richiede circa quattro ore di
      cammino; raggiungere il punto panoramico sulle falesie e fare ritorno richiede circa due ore e mezza.
      Conviene percorrere l’itinerario litoraneo in senso antiorario per godere del graduale disvelarsi delle
      falesie.


      Il collegamento a mezzo gommone è prettamente stagionale e viene governato direttamente dai guardaparco.
    history: >-
      Noss contava 20 residenti nel 1851 ed è priva di abitanti stanziali dal 1939. L’insediamento principale
      sorgeva a Gungstie, sulla costa occidentale, edificato nel decennio 1670 e impiegato attualmente come
      base dai guardiani estivi; Setter, a sud-est, fu abitato fino al decennio 1870 e versa oggi in rovina.
      L’isola è adibita a pascolo per greggi dal 1900 ed è stata dichiarata Riserva Naturale Nazionale nel
      1955, oltre a figurare come ZPS e SSSI.


      NatureScot attua rigorosi protocolli sanitari di biosicurezza per prevenire la diffusione dell’influenza
      aviaria da parte dei turisti.
    before: >-
      Calcola attentamente i tempi della giornata: devi traghettare a Bressay, raggiungere il molo di Noss
      Sound e garantire il rientro. Rispetta le misure igieniche prescritte da NatureScot e verifica
      l’effettiva operatività del gommone prima della partenza.
    around: >-
      Noss condivide la presenza di sule, urie comuni e pulcinelle di mare con la [Riserva Naturale delle
      Sept-Îles](/lugar/reserve-naturelle-des-sept-iles/); nonché sule e pulcinelle con
      [Alderney](/lugar/alderney/), [Mykines](/lugar/mykines/) e [Skellig Michael](/lugar/skellig-michael/).
  pt:
    intro: >-
      Para pisar o solo de Noss precisas de navegar duas vezes. Primeiro, a partir de Lerwick, apanhas o ferry
      regular até Bressay; de seguida, o pequeno bote insuflável de NatureScot vence em três minutos as
      correntes estreitas do Noss Sound. Do outro lado surge uma ilha recolhida, outrora povoada e hoje
      desprovida de habitantes fixos, cujas imponentes escarpas de arenito vermelho atingem 180 metros de
      desnível, albergando uma das colónias de aves marinhas mais acessíveis de todo o Atlântico Norte.
    landscape: >-
      O arenito vermelho de Noss foi fustigado pelas tempestades oceânicas, fraturando-se em socalcos
      horizontais contínuos que formam plataformas ideais de nidificação. Nesses patamares rochosos criam
      gansos-patolas, papagaios-do-mar, airo-comuns, corvos-marinhos-de-crista, gaivotas-tridáctilas,
      tordas-mergulheiras, pardelas-glaciais e moleiros-grandes. As escarpas vertiginosas do Noup of Noss,
      batizadas pelos alpinistas como a «Grande Muralha de Noss», foram escaladas pela primeira vez por Jo
      Moran em 1963.


      O nome da ilha descende do vocábulo nórdico antigo nǫs, que traduz «nariz». Entre os polos de interesse
      contam-se o posto de acolhimento, o histórico cercado Pony Pund erguido para a criação de póneis das
      Shetland, o rochedo isolado Holm of Noss e o miradouro do Noup. No apogeu do verão, os relvados
      costeiros florescem com rosa-de-ouro, campainha-vermelha e erva-estrelada. Identificam-se 137 espécies
      vasculares, entre as quais duas raridades botânicas britânicas: a língua-de-serpente-pequena e a
      polígala-escocesa.
    wildlife: >-
      Com a chegada da primavera regressam o [ganso-patola](/especie/morus_bassanus/), os moleiros, o
      [papagaio-do-mar](/especie/fratercula_arctica/), os fulmares e a
      [gaivota-tridáctila](/especie/rissa_tridactyla/). O intervalo de meados de maio a meados de julho
      constitui a época ideal para contemplar a azáfama da nidificação. As arribas rochosas congregam
      gansos-patolas, o [airo-comum](/especie/uria_aalge/) e a
      [pardela-glacial](/especie/fulmarus_glacialis/), enquanto o voraz
      [moleiro-grande](/especie/stercorarius_skua/) nidifica no chão das charnecas do interior.


      A composição faunística sofreu alterações acentuadas. Quatro espécies passaram a nidificar no local
      (ganso-patola, pardela-glacial, moleiro-grande e painho-de-cauda-quadrada), enquanto seis deixaram de o
      fazer, incluindo o falcão-peregrino e o águia-marinha. No cômputo geral registam-se 201 espécies de
      aves; nidificam limícolas como o pilrito-comum, a narceja-comum, o ostreiro e o
      borrelho-grande-de-coleira, acompanhados por aves terrestres como a cotovia, o petinha-dos-prados, o
      petinha-marítimo e o chasco-cinzento.


      Nas enseadas costeiras avistam-se focas e a [lontra-europeia](/especie/lutra_lutra/); as lontras
      revelam-se com frequência, a par de colónias modestas de foca-cinzenta e foca-comum. Em dias calmos
      escuta-se a respiração de cetáceos, com dez espécies catalogadas ao largo, sendo a mais habitual o
      [boto-comum](/especie/phocoena_phocoena/).
    visit: >-
      A partir do desembarcadouro, uma caminhada curta alcança o centro interpretativo, com o trilho litoral a
      desvendar a história biológica e humana da ilha. O circuito integral à volta da ilha cumpre-se em cerca
      de quatro horas; subir até ao miradouro das falésias e regressar requer perto de duas horas e meia.
      Recomenda-se percorrer o carreiro costeiro no sentido contrário aos ponteiros do relógio para contemplar
      os abismos rochosos em crescendo.


      A travessia de barco insuflável opera com caráter estritamente sazonal e é conduzida pela equipa de
      vigilantes.
    history: >-
      Noss acolhia 20 residentes em 1851 e encontra-se despovoada de modo permanente desde 1939. O principal
      aglomerado situava-se em Gungstie, a poente, construído na década de 1670 e aproveitado hoje como base
      dos vigilantes de verão; Setter, a sudeste, permaneceu habitada até à década de 1870, jazendo hoje em
      ruínas. A ilha acolhe pastoreio ovino desde 1900 e foi classificada como Reserva Natural Nacional em
      1955, integrando igualmente os estatutos de ZPE e SSSI.


      NatureScot aplica rigorosas medidas preventivas de biossegurança para mitigar o contágio da gripe das
      aves através das visitas humanas.
    before: >-
      Calcula atempadamente os horários: terás de apanhar o ferry para Bressay, alcançar o ponto de passagem
      para Noss Sound e assegurar o regresso. Cumpre as determinações sanitárias de NatureScot e valida a
      operação do barco insuflável antes de iniciares a viagem.
    around: >-
      Noss partilha o ganso-patola, o airo-comum e o papagaio-do-mar com a [Reserva Natural das
      Sept-Îles](/lugar/reserve-naturelle-des-sept-iles/); bem como o ganso-patola e o papagaio-do-mar com
      [Alderney](/lugar/alderney/), [Mykines](/lugar/mykines/) e [Skellig Michael](/lugar/skellig-michael/).
