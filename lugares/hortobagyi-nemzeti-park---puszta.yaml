resumen:
  es: >-
    La mayor pradera esteparia de Europa Central (80.000 ha) con pastores tradicionales y paso masivo de
    grullas.
  en: >-
    Central Europe's largest steppe grassland (80,000 ha) featuring traditional pastoralists and massive crane
    migrations.
  fr: >-
    La plus vaste prairie steppique d'Europe centrale (80 000 ha), avec ses pasteurs traditionnels et le
    passage massif des grues.
  de: Mitteleuropas größtes Steppengrasland (80.000 ha) mit traditionellen Hirten und gewaltigem Kranichzug.
  it: >-
    La più grande prateria steppica dell'Europa centrale (80.000 ha) con pastori tradizionali e massicce
    migrazioni di gru.
  pt: >-
    A maior pradaria estepária da Europa Central (80.000 ha), com pastores tradicionais e passagem massiva de
    grous.
unico:
  es: >-
    Un mar de hierba alcalina de casi diez mil años, con pastores a caballo, grandes bandadas de grullas en
    otoño y estanques con la mayor colonia de espátulas de Europa Central.
  en: >-
    An alkaline sea of grass nearly ten thousand years old, with equestrian herders, vast autumn flocks of
    cranes, and fishponds hosting Central Europe's largest spoonbill colony.
  fr: >-
    Une mer d'herbe alcaline vieille de près de dix mille ans, avec ses gardiens à cheval, ses grands vols
    d'automne de grues et des étangs abritant la plus grande colonie de spatules d'Europe centrale.
  de: >-
    Ein fast zehntausend Jahre altes alkalisches Grasmeer mit berittenen Hirten, gewaltigen herbstlichen
    Kranichschwärmen und Teichen mit Mitteleuropas größter Löfflerkolonie.
  it: >-
    Un mare d'erba alcalina vecchio di quasi diecimila anni, con mandriani a cavallo, grandi stormi autunnali
    di gru e stagni con la maggiore colonia di spatole dell'Europa centrale.
  pt: >-
    Um mar de erva alcalina com quase dez mil anos, com pastores a cavalo, grandes bandos outonais de grous e
    lagoas com a maior colónia de colhereiros da Europa Central.
observaciones:
  es: >-
    Hay que llevar tarjeta de entrada y respetar las normas: está prohibido acampar y hacer fuego, y con la
    hierba seca el riesgo de incendio es alto. Todas las especies de plantas y animales están protegidas;
    molestarlas o dañarlas está estrictamente prohibido. En verano la temperatura puede llegar a 40 °C, así
    que lleva agua suficiente. Comprueba antes de ir el estado del tren de vía estrecha de los estanques.
texto:
  es:
    intro: >-
      Horizonte, cielo y casi nada más. Hortobágy se considera el mayor pastizal sobre suelo alcalino de
      origen natural de Europa: 80.000 hectáreas de llanura en el este de Hungría, donde el viento mueve la
      hierba y casi nada interrumpe el horizonte. Aquí se creó en 1973 el primer parque nacional húngaro, y
      desde 1999 el paisaje es Patrimonio Mundial por una razón sencilla: la gente lleva miles de años
      pastoreando esta estepa sin destruirla.
    landscape: >-
      La estepa es muy antigua. La alcalinización empezó hace unos diez mil años, cuando el Tisza abrió camino
      por la Gran Llanura Húngara y dejó a muchos arroyos sin sus fuentes. Ese paisaje abierto, de horizonte
      infinito, es la imagen de Hortobágy desde hace casi diez mil años.


      En esta llanura, unos pocos centímetros de diferencia de nivel deciden qué planta crece, y por eso la
      vegetación es un mosaico: el suelo cambia, el humus baja, y la estepa de loes deja paso al pastizal
      alcalino, con la milenrama estornutatoria y la festuca como plantas dominantes. Alrededor, el agua marca
      el resto: marismas que perdieron su aporte del Tisza y que el parque rehabilita inundándolas por
      temporadas; y estanques como los de Hortobágyi-halastó, un sistema que empezó a construirse a mano en
      1916, en una zona salina y pantanosa que se conocía como la «Tierra Fea».
    wildlife: >-
      Si vienes por los pájaros, vienes bien. El parque tiene 342 especies de aves, y entre las que crían
      están la [avutarda](/especie/otis_tarda/), el abejaruco, la carraca y el halcón sacre. En los estanques
      se han observado más de 300 especies en los últimos 35 años, y crían con regularidad el cormorán pigmeo,
      el [morito](/especie/plegadis_falcinellus/), la [espátula](/especie/platalea_leucorodia/), las garzas y
      el [ánsar común](/especie/anser_anser/). La colonia de espátulas de los estanques es la mayor de Europa
      Central.


      Pero la gran escena es el otoño. Hortobágy es la parada más importante de la migración europea de
      [grullas](/especie/grus_grus/), y el Hortobágyi-halastó es un dormidero preferido de grandes bandadas:
      en otoño hay salidas para ver las grullas y los gansos al atardecer y al amanecer. También es una de las
      paradas más importantes de la población europea del ánsar chico, amenazado a escala mundial. De otoño a
      primavera acuden además pigargos europeos, que vienen a pasar el invierno con más comodidad.


      En el agua viven la nutria, el galápago europeo y la culebra de collar. En la estepa y los humedales se
      citan también el suslik, una pequeña ardilla de tierra, y el sapo de vientre de fuego.


      En el marjal de Egyek-Pusztakócs, protegido como sitio Ramsar desde 1976, anidan los cuatro somormujos
      que crían en Hungría. Hortobágy también tiene una manada de unos 25 caballos de Przewalski y un centro
      de cría de ganado Taurus, uno de los intentos de recrear el uro extinto.
    visit: >-
      Todo empieza en el pueblo de Hortobágy, donde el centro de visitantes tiene tres exposiciones
      interactivas: La naturaleza de Hortobágy, El mundo de las grullas y el Tesoro de la Puszta. Para entrar
      en las áreas de demostración y en los senderos hace falta una tarjeta de entrada, porque el parque solo
      se visita con restricciones.


      El sendero de los estanques de Hortobágy no tiene tramos difíciles y se recorre a pie o en bicicleta; el
      uso de los caminos puede depender del tiempo. Hay tres opciones: el recorrido corto mide 3,6 km de ida y
      vuelta hasta la estación Konrad Lorenz; el medio llega a la torre de observación de cormoranes pigmeos y
      suma 5,4 km, y el completo recorre 10 km hasta la estación Festetics Antal y vuelve al inicio. Tiene
      torres de observación nombradas por especies, entre ellas las de la nutria y el pigargo, y un centro de
      migración de aves con estación de anillamiento. Al inicio se llega en tren por la línea
      Debrecen–Füzesabony, bajando en la estación Hortobágy-Halastó.


      Hortobágy también se mira de noche. Los estanques son uno de los principales escenarios del Parque de
      Cielo Estrellado, con recorridos nocturnos y paseos de estrellas.


      En el marjal de Egyek-Pusztakócs, el sendero Fekete-rét permite ver desde una pasarela de madera la
      flora y la fauna del humedal. Y el sendero de Szálkahalom parte de un túmulo y termina en una torre de
      observación al borde del bosque.
    history: >-
      El primer parque nacional de Hungría se creó aquí en 1973; la UNESCO lo inscribió como Patrimonio
      Mundial en diciembre de 1999, y en 2011 fue declarado Parque de Cielo Estrellado. Un tercio del parque
      es humedal de importancia internacional según Ramsar.


      La vida pastoral explica el paisaje. Los grandes herbívoros salvajes, caballos y uros, fueron
      sustituidos por ganado doméstico, y el ganado gris húngaro y la oveja racka son razas locales clave para
      mantener los pastos. Los pastores a caballo se llaman csikós, y el saber y las costumbres de quienes
      cuidan rebaños en la estepa siguen siendo uno de los principales valores de Hortobágy. Para proteger
      especies amenazadas como la avutarda, el halcón sacre, el cernícalo patirrojo y el ánsar chico, el
      parque lanzó proyectos con ayuda de la Unión Europea.
    before: >-
      Hay que llevar tarjeta de entrada y respetar las normas: está prohibido acampar y hacer fuego, y con la
      hierba seca el riesgo de incendio es alto. Todas las especies de plantas y animales están protegidas;
      molestarlas o dañarlas está estrictamente prohibido. En verano la temperatura puede llegar a 40 °C, así
      que lleva agua suficiente. Comprueba antes de ir el estado del tren de vía estrecha de los estanques.
    around: >-
      El [Parque Nacional Körös-Maros - Llanura de Dévaványa](/lugar/koros-maros-nemzeti-park---devavanyai/)
      está a unos 25 km. Más lejos, otros espacios comparten con Hortobágy la estepa y las grullas o la
      avutarda: el [Parque Nacional Kiskunság - Estepa de Bugac](/lugar/kiskunsagi---bugac-puszta/), las
      [Estepas Salinas de Apaj](/lugar/kiskunsagi-nemzeti-park---apaji-szikesek/), la [Reserva Natural Lagunas
      de Villafáfila](/lugar/reserva-natural-lagunas-de-villafafila/) y la [Reserva Natural de la Laguna de
      Gallocanta](/lugar/reserva-natural-laguna-de-gallocanta/).
  en:
    intro: >-
      Horizon, sky, and little else. Hortobágy is considered the largest natural alkaline grassland in Europe:
      80,000 hectares of plain in eastern Hungary, where the wind ripples the grass and almost nothing
      interrupts the horizon. Hungary's first national park was created here in 1973, and since 1999 the
      landscape has been a World Heritage site for a simple reason: people have grazed this steppe for
      thousands of years without destroying it.
    landscape: "The steppe is ancient. Alkalinization began about ten thousand years ago, when the Tisza River carved its way across the Great Hungarian Plain and cut off many streams from their headwaters. That open landscape of endless horizons has been the hallmark of Hortobágy for nearly ten thousand years.\r\n\r\nAcross this plain, just a few centimetres of elevation difference determine which plant can grow, making the vegetation a rich mosaic: the soil changes, humus decreases, and loess steppe yields to alkaline grassland, dominated by sneezewort yarrow and fescue grasses. Around them, water dictates the rest: marshes that lost their natural inflow from the Tisza and which the park restores through seasonal flooding; and fishponds such as those of Hortobágyi-halastó, a system constructed by hand beginning in 1916 across a saline wetland once known as the «Ugly Land»."
    wildlife: "If you travel for birdlife, you have arrived at the epicenter. The park records 342 bird species, and breeders include the [great bustard](/especie/otis_tarda/), European bee-eater, European roller, and saker falcon. Over 300 bird species have been documented across the fishponds over the past 35 years, with regular nesting by pygmy cormorants, [glossy ibises](/especie/plegadis_falcinellus/), [Eurasian spoonbills](/especie/platalea_leucorodia/), herons, and [greylag geese](/especie/anser_anser/). The fishpond spoonbill colony is the largest in Central Europe.\r\n\r\nYet the supreme spectacle unfolds in autumn. Hortobágy is the preeminent staging ground along the European migration route of [cranes](/especie/grus_grus/), and the Hortobágyi-halastó serves as a favored nocturnal roost for massive gatherings: autumn excursions escort visitors to observe cranes and geese departing at dawn and returning at dusk. It is also a critical resting point for the globally threatened lesser white-fronted goose. From autumn through spring, white-tailed eagles arrive to winter here.\r\n\r\nIn the marshes live Eurasian otters, European pond turtles, and grass snakes. Steppe grasslands harbor European ground squirrels (susliks) and European fire-bellied toads.\r\n\r\nIn the Egyek-Pusztakócs marshes, designated a Ramsar site in 1976, all four grebe species breeding in Hungary nest. Hortobágy also maintains a free-roaming herd of about 25 Przewalski's horses and a breeding centre for Taurus cattle, part of international efforts to back-breed the extinct aurochs."
    visit: "Everything begins in the village of Hortobágy, where the visitor centre offers three interactive exhibitions: The Nature of Hortobágy, The World of Cranes, and The Treasures of the Puszta. Entering demonstration areas and nature trails requires an entrance card, as visitation within the national park is regulated.\r\n\r\nThe Hortobágy fishponds trail features no difficult sections and can be completed on foot or by bicycle; trail accessibility may vary with weather. There are three options: the short loop measures 3.6 km out and back to the Konrad Lorenz station; the medium option reaches the pygmy cormorant observation tower totaling 5.4 km; and the complete circuit covers 10 km to the Festetics Antal station before returning to the start. It features bird hides named after species, including otter and white-tailed eagle towers, along with a bird migration ringing station. The trailhead is accessible by passenger train along the Debrecen–Füzesabony railway line, disembarking at Hortobágy-Halastó station.\r\n\r\nHortobágy can also be explored after dark. The fishponds are a centerpiece of the Dark Sky Park, hosting nocturnal star walks.\r\n\r\nIn the Egyek-Pusztakócs marsh, the Fekete-rét trail features a wooden boardwalk over the wetland flora and fauna. The Szálkahalom trail departs from an ancient burial mound (kurgan) and culminates at an observation tower on the forest fringe."
    history: "Hungary's first national park was founded here in 1973; UNESCO inscribed it as a World Heritage site in December 1999, and in 2011 it was declared an International Dark Sky Park. One-third of the park comprises wetlands of international importance under the Ramsar Convention.\r\n\r\nPastoral tradition explains the open landscape. Wild herbivores like wild horses and aurochs were replaced by domestic herds, with Hungarian Grey cattle and spiral-horned Racka sheep serving as cornerstone breeds maintaining open steppe pastures. Mounted herdsmen are known as csikós, and their traditional equestrian lore remains central to Hortobágy's identity. To safeguard endangered species such as great bustard, saker falcon, red-footed falcon, and lesser white-fronted goose, the park manages habitat restoration supported by the European Union."
    before: >-
      Visitors must carry an official entrance card and abide by strict park regulations: camping and open
      fires are strictly prohibited, as dry grasses present severe fire hazards. All plant and animal species
      are legally protected; disturbing or harming them is prohibited. In high summer temperatures can reach
      40 °C, so carry plenty of drinking water. Verify running schedules for the fishpond narrow-gauge railway
      before arrival.
    around: >-
      [Körös-Maros National Park - Dévaványa Plain](/lugar/koros-maros-nemzeti-park---devavanyai/) lies
      roughly 25 km away. Further afield, other sites share steppe expanses and staging cranes or bustards:
      [Kiskunság National Park - Bugac Puszta](/lugar/kiskunsagi---bugac-puszta/), [Apaj Salt
      Steppes](/lugar/kiskunsagi-nemzeti-park---apaji-szikesek/), [Villafáfila Lagoons Nature
      Reserve](/lugar/reserva-natural-lagunas-de-villafafila/), and [Gallocanta Lake Nature
      Reserve](/lugar/reserva-natural-laguna-de-gallocanta/).
  fr:
    intro: >-
      Horizon, ciel et presque rien d'autre. Hortobágy est considéré comme la plus vaste prairie alcaline
      d'origine naturelle d'Europe : 80 000 hectares de plaine dans l'est de la Hongrie, où le vent fait
      onduler l'herbe et où presque rien n'interrompt la ligne d'horizon. C'est ici que fut créé en 1973 le
      premier parc national hongrois, et depuis 1999 le paysage est inscrit au patrimoine mondial pour une
      raison simple : les hommes y font paître leurs troupeaux depuis des millénaires sans détruire la steppe.
    landscape: "La steppe est très ancienne. L'alcalinisation a commencé il y a environ dix mille ans, lorsque la Tisza s'est frayé un chemin à travers la Grande Plaine hongroise et a privé de nombreux cours d'eau de leurs sources. Ce paysage ouvert, à l'horizon infini, constitue le visage de Hortobágy depuis près de dix mille ans.\r\n\r\nSur cette plaine, quelques centimètres de dénivelé décident de la plante qui peut pousser, faisant de la végétation une mosaïque : le sol change, l'humus diminue et la steppe de lœss cède la place au pâturage alcalin, où l'achillée sternutatoire et la fétuque dominent. Autour, l'eau dicte le reste : des marais qui ont perdu leurs apports naturels de la Tisza et que le parc réhabilite par des inondations saisonnières ; et des étangs comme ceux de Hortobágyi-halastó, un réseau creusé à la main à partir de 1916 dans une zone saline et marécageuse alors surnommée la « Terre laide »."
    wildlife: "Si vous êtes passionné d'ornithologie, vous êtes au bon endroit. Le parc abrite 342 espèces d'oiseaux, parmi lesquelles nichent la [grande outarde](/especie/otis_tarda/), le guêpier d'Europe, le rollier d'Europe et le faucon sacre. Sur les étangs, plus de 300 espèces ont été observées au cours des 35 dernières années, avec la reproduction régulière du cormoran pygmée, de l'[ibis falcinelle](/especie/plegadis_falcinellus/), de la [spatule blanche](/especie/platalea_leucorodia/), de plusieurs hérons et de l'[oie cendrée](/especie/anser_anser/). La colonie de spatules des étangs est la plus importante d'Europe centrale.\r\n\r\nMais le point d'orgue reste l'automne. Hortobágy constitue la halte majeure sur la route migratoire européenne des [grues](/especie/grus_grus/), et Hortobágyi-halastó est le dortoir favori de vols gigantesques : en automne, des sorties guidées permettent d'admirer l'envol matinal et le retour crépusculaire des grues et des oies. C'est également une escale capitale pour l'oie naine, espèce mondialement menacée. De l'automne au printemps, les pygargues à queue blanche viennent y hiverner en nombre.\r\n\r\nDans l'eau vivent la loutre, la cistude d'Europe et la couleuvre à collier. La steppe accueille le souslik d'Europe et le sonneur à ventre de feu.\r\n\r\nDans les marais d'Egyek-Pusztakócs, protégés par la convention de Ramsar depuis 1976, nichent les quatre espèces de grèbes reproductrices en Hongrie. Hortobágy abrite en outre une harde d'environ 25 chevaux de Przewalski ainsi qu'un centre d'élevage de bétail Taurus, participant aux programmes de reconstitution de l'aurochs disparu."
    visit: "L'exploration commence au village de Hortobágy, où le centre d'accueil propose trois expositions interactives : La nature de Hortobágy, Le monde des grues et Les trésors de la Puszta. L'accès aux sentiers de découverte et aux réserves nécessite une carte d'entrée, la circulation étant strictement réglementée.\r\n\r\nLe sentier des étangs de Hortobágy ne présente aucun relief et se parcourt à pied ou à vélo ; son accessibilité dépend de la météo. Trois formules sont possibles : la boucle courte compte 3,6 km aller-retour jusqu'à la station Konrad Lorenz ; la moyenne atteint l'observatoire des cormorans pygmées sur 5,4 km ; et le grand tour totalise 10 km jusqu'à la station Festetics Antal avant de revenir. Il est jalonné de miradors dédiés aux espèces emblématiques, dont ceux de la loutre et du pygargue, ainsi que d'une station de baguage des oiseaux. On y accède en train par la ligne Debrecen–Füzesabony, en descendant à la halte de Hortobágy-Halastó.\r\n\r\nHortobágy s'admire aussi la nuit. Les étangs sont un haut lieu du parc de ciel étoilé, proposant des sorties d'astronomie nocturne.\r\n\r\nDans le marais d'Egyek-Pusztakócs, le sentier de Fekete-rét permet d'arpenter un ponton de bois au-dessus de la flore et de la faune aquatiques. Le sentier de Szálkahalom part d'un tumulus préhistorique et s'achève à une tour d'observation en lisière forestière."
    history: "Le premier parc national de Hongrie y fut établi en 1973 ; l'UNESCO l'a inscrit au patrimoine mondial en décembre 1999, et en 2011 il a été désigné parc de ciel étoilé. Un tiers de sa surface est reconnu d'importance internationale au titre de la convention de Ramsar.\r\n\r\nL'agropastoralisme a forgé ces paysages. Les anciens grands herbivores sauvages ont été remplacés par des races domestiques rustiques : le bœuf gris de Hongrie et le mouton racka entretiennent les pâturages steppiques. Les cavaliers pasteurs portent le nom de csikós, et les savoirs traditionnels des éleveurs de la steppe demeurent l'âme de Hortobágy. Pour protéger l'outarde, le faucon sacre, le faucon kobez et l'oie naine, le parc mène d'importants projets de conservation soutenus par l'Union européenne."
    before: >-
      Munissez-vous d'une carte d'entrée valide et respectez les consignes : le camping sauvage et les feux
      sont formellement interdits, l'herbe sèche créant un péril majeur d'incendie. Toutes les espèces
      animales et végétales sont protégées. En été, le thermomètre peut atteindre 40 °C, prévoyez donc de
      l'eau en abondance. Vérifiez les horaires du petit train des étangs avant de vous déplacer.
    around: >-
      Le [parc national Körös-Maros - Plaine de Dévaványa](/lugar/koros-maros-nemzeti-park---devavanyai/) se
      situe à environ 25 km. Plus loin, d'autres espaces partagent avec Hortobágy les étendues steppiques et
      l'accueil des grues ou des outardes : le [parc national Kiskunság - Puszta de
      Bugac](/lugar/kiskunsagi---bugac-puszta/), les [steppes salées
      d'Apaj](/lugar/kiskunsagi-nemzeti-park---apaji-szikesek/), la [réserve naturelle des lagunes de
      Villafáfila](/lugar/reserva-natural-lagunas-de-villafafila/) et la [réserve naturelle de la lagune de
      Gallocanta](/lugar/reserva-natural-laguna-de-gallocanta/).
  de:
    intro: >-
      Horizont, Himmel und fast nichts sonst. Hortobágy gilt als das größte natürliche alkalische Grasland
      Europas: 80.000 Hektar Ebene im Osten Ungarns, wo der Wind das Gras bewegt und fast nichts den Horizont
      unterbricht. Hier entstand 1973 der erste ungarische Nationalpark, und seit 1999 ist die Landschaft
      Welterbe aus einem einfachen Grund: Seit Jahrtausenden weidet der Mensch auf dieser Steppe, ohne sie zu
      zerstören.
    landscape: "Die Steppe ist uralt. Die Alkalisierung begann vor rund zehntausend Jahren, als sich die Theiß ihren Weg durch die Große Ungarische Tiefebene bahnte und vielen Bächen den Zufluss abschnitt. Diese offene Landschaft mit endlosem Horizont prägt Hortobágy seit fast zehntausend Jahren.\r\n\r\nIn dieser Ebene entscheiden wenige Zentimeter Höhenunterschied darüber, welche Pflanze wächst, weshalb die Vegetation ein Mosaik bildet: Der Boden wandelt sich, der Humus nimmt ab, und die Lösssteppe weicht dem alkalischen Weideland, dominiert von Sumpf-Schafgarbe und Schwingelgras. Ringsum bestimmt das Wasser den Rest: Sümpfe, die ihren Zufluss aus der Theiß verloren und die der Park durch saisonale Flutungen wiederbelebt; sowie Fischteiche wie jene von Hortobágyi-halastó, ein ab 1916 von Hand angelegtes System in einem salzigen Sumpfland, das man einst als «Hässliches Land» kannte."
    wildlife: "Wer wegen der Vogelwelt anreist, findet hier ein Paradies. Der Park beherbergt 342 Vogelarten; zu den Brutvögeln zählen [Großtrappe](/especie/otis_tarda/), Bienenfresser, Blauracke und Würgfalke. An den Fischteichen wurden in den letzten 35 Jahren über 300 Arten nachgewiesen; Zwergscharbe, [Brauner Sichler](/especie/plegadis_falcinellus/), [Löffler](/especie/platalea_leucorodia/), Reiher und [Graugans](/especie/anser_anser/) brüten regelmäßig. Die Löfflerkolonie der Teiche ist die bedeutendste Mitteleuropas.\r\n\r\nDen landschaftlichen Höhepunkt bildet der Herbst. Hortobágy ist der wichtigste Rastplatz auf dem europäischen Zugweg der [Kraniche](/especie/grus_grus/), und Hortobágyi-halastó dient riesigen Schwärmen als Schlafplatz: Im Herbst werden abendliche und morgendliche Führungen zur Beobachtung des Kranich- und Gänseflugs angeboten. Das Gebiet ist zudem ein unverzichtbarer Rastplatz für die weltweit bedrohte Zwerggans. Vom Herbst bis ins Frühjahr überwintern Seeadler in großer Zahl.\r\n\r\nIm Wasser leben Fischotter, Europäische Sumpfschildkröte und Ringelnatter. Die Steppe beherbergt das Europäische Ziesel und die Rotbauchunke.\r\n\r\nIm Sumpfgebiet Egyek-Pusztakócs, seit 1976 als Ramsar-Gebiet geschützt, brüten alle vier in Ungarn heimischen Lappentaucherarten. Hortobágy besitzt zudem eine Herde von rund 25 Przewalski-Pferden sowie ein Zuchtzentrum für Taurus-Rinder zur Rückzüchtung des Auerochsen."
    visit: "Alles beginnt im Dorf Hortobágy, wo das Besucherzentrum drei Ausstellungen zeigt: Die Natur von Hortobágy, Die Welt der Kraniche und Die Schätze der Puszta. Für das Betreten der Lehrpfade ist eine Eintrittskarte erforderlich, da der Zugang reglementiert ist.\r\n\r\nDer Fischteich-Lehrpfad weist keine nennenswerten Steigungen auf und lässt sich zu Fuß oder per Fahrrad erkunden; die Wegeverhältnisse hängen von der Witterung ab. Es gibt drei Optionen: Die kurze Route misst 3,6 km hin und zurück bis zur Konrad-Lorenz-Station; die mittlere führt zum Zwergscharben-Beobachtungsturm über 5,4 km; die lange Runde erstreckt sich über 10 km bis zur Station Festetics Antal. Beobachtungstürme tragen Namen heimischer Tiere, darunter Otter- und Seeadlerturm, ergänzt durch eine Vogelberingungsstation. Der Ausgangspunkt ist mit der Bahnlinie Debrecen–Füzesabony über die Station Hortobágy-Halastó erreichbar.\r\n\r\nHortobágy fasziniert auch bei Nacht. Die Teiche gehören zu den Kernzonen des Lichtschutzgebiets (Sternenpark) mit geführten Sternenwanderungen.\r\n\r\nIm Feuchtgebiet Egyek-Pusztakócs erschließt der Lehrpfad Fekete-rét über einen Holzsteg Flora und Fauna des Sumpfes. Der Pfad von Szálkahalom beginnt an einem Kurgangrab und führt zu einem Aussichtsturm am Waldrand."
    history: "Ungarns erster Nationalpark entstand hier 1973; die UNESCO erklärte ihn im Dezember 1999 zum Weltkulturerbe, 2011 folgte die Ernennung zum Sternenpark. Ein Drittel des Parks ist Feuchtgebiet internationaler Bedeutung nach der Ramsar-Konvention.\r\n\r\nDie traditionelle Weidewirtschaft schuf diese Kulturlandschaft. Wilde Pflanzenfresser wurden durch robuste Haustierrassen abgelöst: Ungarisches Steppenrind und Zackelschaf halten die Steppenweiden offen. Die berittenen Hirten heißen Csikós, und das überlieferte Wissen der Steppenhirten zählt zu den lebendigen Kulturgütern von Hortobágy. Zum Schutz von Großtrappe, Würgfalke, Rotfußfalke und Zwerggans setzt der Park von der Europäischen Union geförderte Artenschutzprojekte um."
    before: >-
      Führe stets die Eintrittskarte mit und beachte die Parkordnung: Wildes Campen und offenes Feuer sind
      streng verboten, da trockenes Steppengras extreme Brandgefahr birgt. Alle Tier- und Pflanzenarten stehen
      unter Naturschutz. Im Hochsommer steigen die Temperaturen auf bis zu 40 °C; nimm ausreichend Trinkwasser
      mit. Prüfe vorab die Fahrzeiten der Fischteich-Schmalspurbahn.
    around: >-
      Der [Körös-Maros-Nationalpark - Dévaványa-Ebene](/lugar/koros-maros-nemzeti-park---devavanyai/) liegt
      rund 25 km entfernt. Weiter entfernt teilen weitere Steppengebiete mit Hortobágy Rastkraniche oder
      Trappenvorkommen: der [Kiskunság-Nationalpark - Bugac-Puszta](/lugar/kiskunsagi---bugac-puszta/), die
      [Salzsteppen von Apaj](/lugar/kiskunsagi-nemzeti-park---apaji-szikesek/), das [Naturschutzgebiet Lagunen
      von Villafáfila](/lugar/reserva-natural-lagunas-de-villafafila/) und das [Naturschutzgebiet Laguna de
      Gallocanta](/lugar/reserva-natural-laguna-de-gallocanta/).
  it:
    intro: >-
      Orizzonte, cielo e poco altro. Hortobágy è considerata la più grande prateria su suolo alcalino di
      origine naturale d'Europa: 80.000 ettari di pianura nell'est dell'Ungheria, dove il vento muove l'erba e
      quasi nulla interrompe la linea dell'orizzonte. Qui è nato nel 1973 il primo parco nazionale ungherese,
      e dal 1999 il paesaggio è Patrimonio Mondiale per una ragione semplice: da millenni le comunità vi
      pascolano senza distruggere la steppa.
    landscape: "La steppa è antichissima. L'alcalinizzazione è cominciata circa diecimila anni fa, quando il Tibisco si aprì la strada attraverso la Grande Pianura Ungherese lasciando molti ruscelli privi delle loro sorgenti. Questo paesaggio aperto, dall'orizzonte infinito, è l'immagine di Hortobágy da quasi diecimila anni.\r\n\r\nIn questa pianura pochi centimetri di dislivello determinano quale pianta possa attecchire, trasformando la vegetazione in un mosaico: il terreno muta, l'humus diminuisce e la steppa di loess cede il passo al pascolo alcalino, con l'achillea starnutella e la festuca quali essenze dominanti. Intorno l'acqua governa il resto: paludi che hanno perso l'apporto originario del Tibisco e che il parco risana allagandole periodicamente; e bacini come quelli di Hortobágyi-halastó, un sistema iniziato a costruire manualmente nel 1916 in un'area salmastra e acquitrinosa allora nota come la «Terra Brutta»."
    wildlife: "Chi viaggia per l'avifauna trova qui un territorio d'elezione. Il parco vanta 342 specie di uccelli, tra cui nidificano l'[otarda](/especie/otis_tarda/), il gruccione, la ghiandaia marina e il falco sacro. Negli stagni sono state registrate oltre 300 specie negli ultimi 35 anni, con nidificazioni costanti di marangone minore, [mignattaio](/especie/plegadis_falcinellus/), [spatola](/especie/platalea_leucorodia/), aironi e [oca selvatica](/especie/anser_anser/). La colonia di spatole dei bacini è la più consistente dell'Europa centrale.\r\n\r\nLo spettacolo sommo coincide con l'autunno. Hortobágy è la sosta cruciale lungo la rotta europea delle [gru](/especie/grus_grus/), e Hortobágyi-halastó funge da dormitorio per imponenti assembramenti: in autunno partono escursioni per ammirare il levarsi delle gru all'alba e il loro rientro al tramonto. È inoltre uno snodo essenziale per l'oca lombardella minore, minacciata su scala globale. Dall'autunno alla primavera svernano inoltre aquile di mare a coda bianca.\r\n\r\nNelle acque dimorano la lontra, la testuggine palustre europea e la biscia dal collare. La steppa accoglie il citello e l'ululone dal ventre rosso.\r\n\r\nNelle paludi di Egyek-Pusztakócs, tutelate dal 1976 come sito Ramsar, nidificano i quattro svassi che si riproducono in Ungheria. Hortobágy accoglie inoltre un branco di circa 25 cavalli di Przewalski e un centro di selezione di bovini Taurus volto alla rinascita dell'uro estinto."
    visit: "Il punto di riferimento iniziale è il villaggio di Hortobágy, dove il centro visite ospita tre allestimenti: La natura di Hortobágy, Il mondo delle gru e I tesori della Puszta. L'ingresso ai sentieri didattici richiede un biglietto d'accesso, vigendo una fruizione regolamentata.\r\n\r\nIl sentiero degli stagni di Hortobágy è privo di dislivelli e si effettua a piedi o in bici; la transitabilità dipende dal fango. Vi sono tre varianti: il percorso breve misura 3,6 km andata e ritorno fino alla stazione Konrad Lorenz; l'itinerario intermedio tocca la torre dei marangoni minori per 5,4 km; l'anello completo copre 10 km fino alla stazione Festetics Antal per poi rientrare. Dispone di capanni d'avvistamento intitolati alle specie, tra cui lontra e aquila di mare, e di una stazione di inanellamento. Si raggiunge in treno lungo la linea Debrecen–Füzesabony scendendo alla fermata Hortobágy-Halastó.\r\n\r\nHortobágy si svela anche di notte. Gli stagni sono il cuore del Parco del Cielo Stellato, con escursioni astronomiche guidate.\r\n\r\nNella palude di Egyek-Pusztakócs, il sentiero Fekete-rét permette di percorrere una passerella in legno sull'ambiente umido. Il sentiero di Szálkahalom prende il via da un tumulo kurgan per terminare a una torretta d'avvistamento ai margini del bosco."
    history: "Il primo parco nazionale d'Ungheria nacque qui nel 1973; l'UNESCO lo ha iscritto nel Patrimonio Mondiale nel dicembre 1999, e nel 2011 è stato designato Parco del Cielo Stellato. Un terzo del territorio è zona umida d'importanza internazionale ai sensi della convenzione di Ramsar.\r\n\r\nIl pascolo tradizionale spiega la fisionomia del paesaggio. I grandi erbivori selvatici sono stati rimpiazzati da razze autoctone rustiche: il bovino grigio ungherese e la pecora racka mantengono aperti i pascoli della steppa. I mandriani a cavallo prendono il nome di csikós, e il loro sapere equestre e pastorale è uno dei patrimoni identitari di Hortobágy. Per difendere otarda, falco sacro, falco grillaio e oca lombardella minore, il parco ha condotto progetti finanziati dall'Unione Europea."
    before: >-
      Porta sempre con te il biglietto d'ingresso e rispetta le regole: è severamente vietato campeggiare e
      accendere fuochi, dato l'alto rischio d'incendio tra l'erba secca. Tutte le specie animali e vegetali
      sono tutelate. In estate le temperature possono toccare i 40 °C, porta con te scorte d'acqua adeguate.
      Verifica l'operatività del trenino a scartamento ridotto degli stagni prima della visita.
    around: >-
      Il [Parco Nazionale Körös-Maros - Pianura di Dévaványa](/lugar/koros-maros-nemzeti-park---devavanyai/)
      dista circa 25 km. A maggiore distanza, altri siti condividono con Hortobágy praterie steppiche e la
      presenza di gru o otarde: il [Parco Nazionale Kiskunság - Puszta di
      Bugac](/lugar/kiskunsagi---bugac-puszta/), le [Steppe Salate di
      Apaj](/lugar/kiskunsagi-nemzeti-park---apaji-szikesek/), la [Riserva Naturale Lagune di
      Villafáfila](/lugar/reserva-natural-lagunas-de-villafafila/) e la [Riserva Naturale della Laguna di
      Gallocanta](/lugar/reserva-natural-laguna-de-gallocanta/).
  pt:
    intro: >-
      Horizonte, céu e quase mais nada. Hortobágy é considerada a maior pastagem sobre solo alcalino de origem
      natural da Europa: 80.000 hectares de planície no leste da Hungria, onde o vento ondula a erva e quase
      nada interrompe o horizonte. Aqui foi criado em 1973 o primeiro parque nacional húngaro, e desde 1999 a
      paisagem é Património Mundial por um motivo simples: há milhares de anos que as pessoas pastoreiam esta
      estepe sem a destruir.
    landscape: "A estepe é muitíssimo antiga. A alcalinização principiou há cerca de dez mil anos, quando o Tisza rasgou caminho pela Grande Planície Húngara e privou muitos ribeiros das suas nascentes. Essa paisagem desafogada, de horizonte sem fim, é a imagem de marca de Hortobágy há quase dez mil anos.\r\n\r\nNesta planície, escassos centímetros de desnível determinam que planta consegue medrar, compondo a vegetação como um mosaico: o solo muda, o húmus decresce e a estepe de loesse dá lugar à pastagem alcalina, com o milefólio-dos-pântanos e a festuca como espécies dominantes. Em redor, a água rege o restante: pauis que perderam a alimentação do Tisza e que o parque reabilita inundando-os sazonalmente; e lagoas como as de Hortobágyi-halastó, uma rede começada a construir à mão em 1916, numa área salina e pantanosa conhecida como a «Terra Feia»."
    wildlife: "Se viajas pelas aves, encontraste o teu lugar. O parque acolhe 342 espécies de aves, nidificando aqui a [abetarda-comum](/especie/otis_tarda/), o abelharuco, o rolieiro e o falcão-sacre. Nas lagoas inventariaram-se mais de 300 espécies nos últimos 35 anos, com reprodução assídua do corvo-marinho-pigmeu, do [íbis-preto](/especie/plegadis_falcinellus/), do [colhereiro-europeu](/especie/platalea_leucorodia/), de várias garças e do [ganso-bravo](/especie/anser_anser/). A colónia de colhereiros das lagoas é a mais numerosa da Europa Central.\r\n\r\nContudo, o clímax ocorre no outono. Hortobágy é a paragem crucial na rota migratória europeia dos [grous](/especie/grus_grus/), sendo Hortobágyi-halastó o dormitório eleito por bandos monumentais: no outono organizam-se visitas para observar a saída dos grous e gansos ao alvorecer e o seu regresso ao crepúsculo. É também um poiso vital para o ganso-pequeno, globalmente ameaçado. Do outono à primavera convergem águias-rabalva para passar o inverno.\r\n\r\nNos ecossistemas aquáticos vivem a lontra, o cágado-de-carapaça-estriada e a cobra-de-água-de-colar. A estepe alberga o esquilo-da-terra e o sapo-de-ventre-de-fogo.\r\n\r\nNo sapal de Egyek-Pusztakócs, consagrado como sítio Ramsar desde 1976, nidificam os quatro mergulhões que se reproduzem na Hungria. Hortobágy conta ainda com uma manada de cerca de 25 cavalos de Przewalski e um centro de criação de bovinos Taurus orientado para o ressurgimento do auroque extinto."
    visit: "Tudo começa na povoação de Hortobágy, cujo centro de acolhimento apresenta três núcleos expositivos: A Natureza de Hortobágy, O Mundo dos Grous e Os Tesouros da Puszta. O acesso aos trilhos e às áreas de interpretação exige passe de entrada, dado que a visitação no parque se encontra sujeita a limites.\r\n\r\nO trilho das lagoas de Hortobágy é totalmente plano, percorrendo-se a pé ou de bicicleta; as condições dos caminhos dependem da meteorologia. Existem três percursos: o curto mede 3,6 km de ida e volta até à estação Konrad Lorenz; o médio alcança a torre dos corvos-marinhos-pigmeus totalizando 5,4 km; e o circuito integral perfaz 10 km até à estação Festetics Antal, regressando ao início. Possui abrigos batizados com espécies, incluindo os da lontra e da águia-rabalva, além de uma estação de anilhagem. O ponto de partida é acessível de comboio na linha Debrecen–Füzesabony, saindo na paragem Hortobágy-Halastó.\r\n\r\nHortobágy também se contempla de noite. As lagoas são um dos palcos centrais do Parque de Céu Estrelado, acolhendo passeios astronómicos noturnos.\r\n\r\nNo sapal de Egyek-Pusztakócs, o trilho Fekete-rét percorre passadiços de madeira sobre o meio aquático. E o trilho de Szálkahalom arranca junto a um mamoa (kurgan) para terminar numa torre de vigia junto ao arvoredo."
    history: "O primeiro parque nacional da Hungria nasceu aqui em 1973; a UNESCO declarou-o Património Mundial em dezembro de 1999, e em 2011 foi classificado como Parque de Céu Estrelado. Um terço do parque é zona húmida de importância internacional ao abrigo da Convenção de Ramsar.\r\n\r\nA tradição pastoril explica a paisagem desimpedida. Os grandes herbívoros selvagens foram sucedidos por raças autóctones resistentes: o gado cinzento húngaro e a ovelha racka asseguram o pastoreio que impede o fecho das pradarias. Os pastores a cavalo designam-se csikós, e a sua cultura equestre e saberes tradicionais são um esteio identitário de Hortobágy. Para proteger a abetarda, o falcão-sacre, o falcão-de-pés-vermelhos e o ganso-pequeno, o parque desenvolveu projetos de conservação cofinanciados pela União Europeia."
    before: >-
      Leva contigo o passe de entrada e cumpre as normas: é terminantemente proibido acampar e fazer
      fogueiras, pois a vegetação seca representa grave risco de incêndio. Todas as espécies vegetais e
      animais encontram-se protegidas por lei. No verão as temperaturas podem atingir 40 °C, pelo que deves
      transportar água suficiente. Confirma previamente o funcionamento do comboio turístico de via estreita
      das lagoas.
    around: >-
      O [Parque Nacional Körös-Maros - Planície de Dévaványa](/lugar/koros-maros-nemzeti-park---devavanyai/)
      dista cerca de 25 km. A maior distância, outros enclaves partilham com Hortobágy prados estepários e
      paragens de grous ou abetardas: o [Parque Nacional Kiskunság - Puszta de
      Bugac](/lugar/kiskunsagi---bugac-puszta/), as [Estepes Salinas de
      Apaj](/lugar/kiskunsagi-nemzeti-park---apaji-szikesek/), a [Reserva Natural das Lagoas de
      Villafáfila](/lugar/reserva-natural-lagunas-de-villafafila/) e a [Reserva Natural da Lagoa de
      Gallocanta](/lugar/reserva-natural-laguna-de-gallocanta/).
