resumen:
  es: >-
    Montañas mesetarias cubiertas de abetales y dolinas kársticas con las fortalezas dacias de Sarmizegetusa
    Regia.
  en: >-
    Plateau-like mountains cloaked in fir woodlands and karst sinkholes, housing the Dacian fortress of
    Sarmizegetusa Regia.
  fr: >-
    Montagnes tabulaires vêtues de sapinières et de dolines karstiques abritant la forteresse dace de
    Sarmizegetusa Regia.
  de: >-
    Plateauförmiges Gebirge voller Tannenwälder und Karstdolinen mit den Dakerfestungen von Sarmizegetusa
    Regia.
  it: >-
    Montagne tabulari ammantate da abetaie e doline carsiche che custodiscono la fortezza dace di
    Sarmizegetusa Regia.
  pt: >-
    Montanhas planálticas cobertas de abetais e dolinas cársticas com as fortalezas dácias de Sarmizegetusa
    Regia.
unico:
  es: Un macizo de montes mesetarios donde las fortalezas dacias conviven con el karst y un lago glaciar.
  en: >-
    A massif of plateau highlands where ancient Dacian fortresses coexist with karst landforms and a glacial
    lake.
  fr: Un massif de hauts plateaux où les citadelles daces côtoient le relief karstique et un lac glaciaire.
  de: >-
    Ein Massiv aus Hochebenen, auf denen Dakerfestungen neben Karstformen und einem eiszeitlichen Karsee
    liegen.
  it: Un massiccio di altipiani dove le fortezze daciche convivono con il carsismo e un lago glaciale.
  pt: Um maciço de planaltos onde as fortalezas dácias convivem com a paisagem cárstica e uma lagoa glaciar.
observaciones:
  es: >-
    El parque solo se visita por caminos de acceso público y senderos marcados, respetando las restricciones
    que haya. Se prohíbe arrancar o desarraigar plantas de la flora silvestre. Acampar está permitido solo en
    los lugares habilitados y señalizados, y se prohíbe el acceso sin autorización con motos, cuatrimotos y
    coches fuera de las carreteras públicas y pistas forestales no restringidas. También está prohibido ir en
    bicicleta o a caballo fuera de las rutas designadas y señalizadas. Ve entre mayo y octubre.
texto:
  es:
    intro: >-
      Entre los bosques de Șureanu, en la falda suroeste del pico Godeanu, está Sarmizegetusa Regia,
      considerada la capital de Dacia: la mayor de las fortalezas dacias, con un recinto fortificado y otro
      sacerdotal. Subir hasta ella es caminar por un macizo donde la historia y la naturaleza se pisan. Los
      Șureanu, entre los condados de Hunedoara y Alba, forman parte del grupo Parâng de los Cárpatos
      Meridionales, con cumbres que superan con frecuencia los dos mil metros. Cubren 1.585 kilómetros
      cuadrados y su punto más alto es Vârfu lui Pătru, con 2.130 metros.
    landscape: >-
      Los Șureanu no tienen crestas esbeltas ni circos glaciares, sino amplias superficies de erosión: son
      sobre todo altiplano de prados y pastos, con una gran superficie forestal en las laderas que lo rodean.
      En el sur hay una zona caliza con cuevas, colinas y gargantas, y en ella las aguas subterráneas forman
      redes de fisuras y cursos de cientos y miles de metros que afloran al borde de la zona caliza en
      manantiales como Șipot, Șura Mare y Cioclovina.


      Al este de la cumbre Șureanu queda el lago Șureanu, glaciar, a 1.737 metros de altitud, en el escalón
      inferior del circo, rodeado de pino mugo y con trucha autóctona.


      Los pisos de vegetación se suceden con la altura. Los hayedos rodean el macizo por el norte y el oeste
      entre 500 y 1.050 metros, y suben por los valles hasta 1.500. Entre los 1.300 y los 1.700 hay bosques de
      pícea, con abeto, pino cembro, serbal de cazadores, saúco y arce blanco. El piso alpino aparece como
      islas de pastizal solo sobre los dos mil metros, y baja hasta los 1.900 donde se talaron los pinos mugo.
    wildlife: >-
      En los pastizales alpinos crecen *Carex curvula*, *Primula minima*, *Soldanella pusilla*, *Campanula
      alpina* y *Helleborus purpurascens*, y el parque natural tiene endemismos como *Hepatica
      transsilvanica*, *Thymus comosus*, *Symphytum cordatum* y *Sorbus borbasii*.


      En el piso alpino se ven la alondra cornuda, el escribano nival, el bisbita alpino, la collalba gris y
      el acentor alpino. En los días cálidos, en los pastizales hay víbora común, lagartija de turbera y
      muchas mariposas, y en los lugares húmedos de los circos viven la rana bermeja, la salamandra y el
      tritón alpino.


      Entre los mamíferos están el [oso pardo](/especie/ursus_arctos/), el [lobo](/especie/canis_lupus/), el
      zorro, el jabalí, el corzo, la marta y el [lince boreal](/especie/lynx_lynx/). En los ríos hay trucha
      común, tímalo, barbo meridional y cangrejo de torrente. Y bajo tierra, en las cuevas del parque, viven
      murciélagos como el nóctulo común, el murciélago enano y el [murciélago grande de
      herradura](/especie/rhinolophus_ferrumequinum/). La cueva Șura Mare albergó entre 1960 y 1970 una de las
      mayores colonias de murciélagos hibernantes de Europa, con más de cien mil individuos; observaciones
      recientes cuentan unos cuarenta mil.
    visit: >-
      El Parque Natural Grădiștea Muncelului-Cioclovina cubre una parte del macizo y ofrece varias rutas. La
      ruta Terra Dacica entra desde Măgureni por el claro Cioaca Ulmului, baja a Sarmizegetusa Regia y a
      Grădiștea de Munte y sube a la meseta de Luncani por Fundătura Ponorului. Una ruta temática sobre el
      relieve kárstico va desde Federi hasta Fundătura Ponorului, y la de biodiversidad parte de la
      confluencia del valle Rea con el valle Grădiștea y sube por el valle Rea, junto a la cascada y el
      monasterio, hacia la meseta de Vârtoape. Otra ruta une Costeşti, la fortaleza Blidaru, Leurdana, Târsa,
      Poiana Omului y la cumbre Godeanu, y un recorrido une Ohaba Ponor con las gargantas de Șura Mare y las
      cuevas Ponorici y Cioclovina en siete u ocho horas.


      Desde la carretera DN 7 en Orăştie hacia Costeşti se llega a la mayoría de las fortalezas dacias de los
      montes Orăştiei, a las mesetas de Vârtoape y Luncani y a la cascada y el monasterio del valle Rea. Hay
      estaciones de tren en Orăştie, Călan, Pui, Baru Mare, Băniţa y Peştera Bolii, y quien hace travesías
      largas puede llegar por la Via Transilvanica.
    history: >-
      Se han hallado restos paleolíticos en las cuevas Bordul Mare y Ciclovina Uscată: hogares, útiles de
      hueso y pedernal y huesos de oso de las cavernas, caballo y lobo. La ganadería tiene tradiciones muy
      antiguas en estos montes y la trashumancia era habitual.


      El Parque Natural Grădiștea Muncelului-Cioclovina se creó a nivel de condado en 1979, se reconfirmó en
      1997 y en 2000 pasó a ser área protegida de interés nacional, de categoría V de la UICN.
    before: >-
      El parque solo se visita por caminos de acceso público y senderos marcados, respetando las restricciones
      que haya. Se prohíbe arrancar o desarraigar plantas de la flora silvestre. Acampar está permitido solo
      en los lugares habilitados y señalizados, y se prohíbe el acceso sin autorización con motos, cuatrimotos
      y coches fuera de las carreteras públicas y pistas forestales no restringidas. También está prohibido ir
      en bicicleta o a caballo fuera de las rutas designadas y señalizadas. Ve entre mayo y octubre.
    around: >-
      A doce kilómetros están las [Montañas de Parâng](/lugar/muntii-parang/) y el [Parque Nacional
      Desfiladero del Jiu - Bosque Primario](/lugar/parcul-national-defileul-jiului-codrii-seculari/). A
      dieciséis, las [Montañas de Godeanu](/lugar/muntii-godeanu/) y el [Parque Nacional
      Retezat](/lugar/parcul-national-retezat---masivul-muntos/), y a veintisiete el [Parque Natural de
      Cindrel](/lugar/parcul-natural-cindrel/).
  en:
    intro: >-
      Deep within the Șureanu forests, on the southwestern flank of Godeanu Peak, lies Sarmizegetusa Regia,
      the ancient Dacian capital: the most formidable of Dacian strongholds, featuring both a fortified
      precinct and a sacred sanctuary. Walking up here means journeying through a range where human history
      and wild nature intertwine. The Șureanu, straddling Hunedoara and Alba counties, belong to the Parâng
      group of the Southern Carpathians, with crests that frequently exceed two thousand metres. They span
      1,585 square kilometres, culminating at Vârfu lui Pătru at 2,130 metres.
    landscape: >-
      The Șureanu possess neither razor-sharp ridges nor jagged glacial cirques, but rather vast rolling
      erosion plateaus: they are predominantly highland pastures surrounded by extensive forested mountain
      slopes. In the south, a limestone karst belt features caves, limestone crags, and gorges, where
      subterranean waters form labyrinthine fissures and courses hundreds of metres long, surfacing along the
      limestone border in powerful springs like Șipot, Șura Mare, and Cioclovina.


      East of Șureanu peak lies glacial Lake Șureanu at 1,737 metres altitude, resting upon the lower tier of
      the cirque, encircled by mountain pine and home to native brown trout.


      Vegetation belts succeed one another with altitude. Beech forests ring the massif along northern and
      western slopes between 500 and 1,050 metres, ascending mountain valleys up to 1,500 metres. Between
      1,300 and 1,700 metres grow spruce woodlands with silver fir, Swiss pine, rowan, elder, and sycamore
      maple. The alpine zone emerges as meadow islands above two thousand metres, descending to 1,900 metres
      where dwarf pines were historically cleared for grazing.
    wildlife: >-
      High alpine grasslands harbour *Carex curvula*, *Primula minima*, *Soldanella pusilla*, *Campanula
      alpina*, and *Helleborus purpurascens*, while the natural park supports endemic species such as
      *Hepatica transsilvanica*, *Thymus comosus*, *Symphytum cordatum*, and *Sorbus borbasii*.


      Across alpine heights you may observe the horned lark, snow bunting, water pipit, northern wheatear, and
      alpine accentor. On warm summer days, meadows host common adders, viviparous lizards, and countless
      butterflies, while damp cirque hollows provide habitat for common frogs, fire salamanders, and alpine
      newts.


      Mammalian residents include the [brown bear](/especie/ursus_arctos/), [grey
      wolf](/especie/canis_lupus/), red fox, wild boar, roe deer, pine marten, and [Eurasian
      lynx](/especie/lynx_lynx/). Mountain rivers shelter brown trout, grayling, Mediterranean barbel, and
      stone crayfish. Subterranean cave systems shelter bats such as the common noctule, common pipistrelle,
      and [greater horseshoe bat](/especie/rhinolophus_ferrumequinum/). Between 1960 and 1970, Șura Mare Cave
      harboured one of Europe's largest hibernating bat colonies with over one hundred thousand bats; recent
      winter counts record around forty thousand.
    visit: >-
      Grădiștea Muncelului-Cioclovina Natural Park encompasses part of the range and provides varied hiking
      trails. The Terra Dacica route enters from Măgureni through Cioaca Ulmului clearing, descends to
      Sarmizegetusa Regia and Grădiștea de Munte, and climbs onto the Luncani plateau via Fundătura Ponorului.
      A karst geology trail links Federi to Fundătura Ponorului, while a biodiversity trail starts at the
      confluence of Rea and Grădiștea valleys and ascends Rea valley past waterfalls and a monastery toward
      Vârtoape plateau. Another route links Costeşti, Blidaru fortress, Leurdana, Târsa, Poiana Omului, and
      Godeanu peak, while a trek connects Ohaba Ponor with Șura Mare gorge and Ponorici and Cioclovina caves
      in seven to eight hours.


      From the DN 7 road in Orăştie towards Costeşti, you can reach most Dacian fortresses in the Orăştie
      Mountains, the Vârtoape and Luncani plateaus, and the waterfall in the Rea valley. Railway stations
      exist at Orăştie, Călan, Pui, Baru Mare, Băniţa, and Peştera Bolii, and long-distance hikers can arrive
      via the Via Transilvanica route.
    history: >-
      Palaeolithic artefacts have been unearthed in Bordul Mare and Ciclovina Uscată caves: hearths, bone and
      flint tools, and bones of cave bear, wild horse, and wolf. Pastoralism holds deep roots here, with
      long-distance transhumance shaping local livelihoods.


      Grădiștea Muncelului-Cioclovina Natural Park was initially established at county level in 1979,
      reconfirmed in 1997, and designated an area of national interest under IUCN Category V in 2000.
    before: >-
      Visitors may only travel along public access roads and waymarked trails, obeying all posted seasonal
      restrictions. Uprooting or removing wild plants is prohibited. Camping is permitted solely at
      designated, signposted sites, and unauthorised vehicular access (motorcycles, ATVs, cars) is forbidden
      outside public roads and unrestricted forestry tracks. Cycling and horseback riding off designated
      routes is strictly prohibited. The best visiting window is May to October.
    around: >-
      Twelve kilometres away lie the [Parâng Mountains](/lugar/muntii-parang/) and [Jiu Gorge National Park -
      Primeval Forest](/lugar/parcul-national-defileul-jiului-codrii-seculari/). Sixteen kilometres away are
      the [Godeanu Mountains](/lugar/muntii-godeanu/) and [Retezat National
      Park](/lugar/parcul-national-retezat---masivul-muntos/), and twenty-seven kilometres away is [Cindrel
      Natural Park](/lugar/parcul-natural-cindrel/).
  fr:
    intro: >-
      Au cœur des forêts de Șureanu, sur le flanc sud-ouest du pic Godeanu, se dresse Sarmizegetusa Regia,
      capitale de la Dacie : la plus vaste des forteresses daces, dotée d'une enceinte fortifiée et d'un
      secteur cultuel. Y monter, c'est marcher dans un massif où l'histoire ancienne et la nature se fondent.
      Les monts Șureanu, entre les județe de Hunedoara et d'Alba, font partie du groupe Parâng dans les
      Carpates méridionales, avec des crêtes dépassant souvent deux mille mètres. Ils couvrent 1 585
      kilomètres carrés et culminent au Vârfu lui Pătru à 2 130 mètres.
    landscape: >-
      Les monts Șureanu ne présentent ni crêtes acérées ni cirques glaciaires escarpés, mais de vastes
      surfaces d'érosion : ce sont d'immenses plateaux d'estives entourés de versants boisés. Au sud s'étend
      une zone calcaire truffée de grottes, de buttes et de gorges, où les eaux souterraines forment des
      réseaux de fissures de plusieurs centaines de mètres qui jaillissent aux sources de Șipot, Șura Mare et
      Cioclovina.


      À l'est du sommet de Șureanu repose le lac de Șureanu, d'origine glaciaire, à 1 737 mètres d'altitude au
      pied du cirque, ceinturé de pins mugos et peuplé de truites indigènes.


      Les étages de végétation s'échelonnent avec l'altitude. Les hêtraies ceinturent le massif au nord et à
      l'ouest entre 500 et 1 050 mètres, s'élevant dans les vallons jusqu'à 1 500 mètres. Entre 1 300 et 1 700
      mètres s'étendent les pessières mêlées de sapin, pin cembro, sorbier des oiseleurs, sureau et érable
      sycomore. L'étage alpin forme des îlots pastoraux au-delà de deux mille mètres, descendant vers 1 900
      mètres là où les pins mugos ont été jadis coupés.
    wildlife: >-
      Dans les pelouses alpines prospèrent *Carex curvula*, *Primula minima*, *Soldanella pusilla*, *Campanula
      alpina* et *Helleborus purpurascens*, le parc naturel abritant des endémiques comme *Hepatica
      transsilvanica*, *Thymus comosus*, *Symphytum cordatum* et *Sorbus borbasii*.


      Sur les plateaux alpins se croisent l'alouette hausse-col, le plectrophane des neiges, le pipit
      spioncelle, le traquet motteux et l'accenteur alpin. Par journée ensoleillée, les pâturages accueillent
      la vipère péliade, le lézard vivipare et de nombreux papillons, tandis que les cirques abritent
      grenouille rousse, salamandre tachetée et triton alpestre.


      Les mammifères comptent l'[ours brun](/especie/ursus_arctos/), le [loup](/especie/canis_lupus/), le
      renard, le sanglier, le chevreuil, la marte et le [lynx boréal](/especie/lynx_lynx/). Les rivières
      hébergent la truite fario, l'ombre commun, le barbeau méridional et l'écrevisse de torrent. Sous terre,
      les cavités abritent des chauves-souris comme la grande noctule, la pipistrelle commune et le [grand
      rhinolophe](/especie/rhinolophus_ferrumequinum/). La grotte de Șura Mare a abrité entre 1960 et 1970
      l'une des plus grandes colonies d'hibernation d'Europe avec plus de cent mille individus ; des comptages
      récents en dénombrent quarante mille.
    visit: >-
      Le parc naturel Grădiștea Muncelului-Cioclovina protège une partie du massif et propose plusieurs
      itinéraires. Le parcours Terra Dacica part de Măgureni par la clairière de Cioaca Ulmului, descend à
      Sarmizegetusa Regia et Grădiștea de Munte et gagne le plateau de Luncani via Fundătura Ponorului. Un
      sentier géologique explore le karst de Federi à Fundătura Ponorului, et un sentier biodiversité remonte
      la vallée Rea depuis sa confluence avec la Grădiștea vers le plateau de Vârtoape. Un autre sentier relie
      Costeşti, la forteresse Blidaru, Leurdana, Târsa, Poiana Omului et le sommet du Godeanu, tandis qu'un
      parcours unit Ohaba Ponor aux gorges de Șura Mare et aux grottes Ponorici et Cioclovina en sept ou huit
      heures.


      Depuis la route DN 7 à Orăştie vers Costeşti, on atteint la plupart des forteresses daces des monts
      d'Orăştie, les plateaux de Vârtoape et Luncani et la cascade du vallon Rea. Des gares desservent
      Orăştie, Călan, Pui, Baru Mare, Băniţa et Peştera Bolii, et les marcheurs au long cours peuvent arriver
      par la Via Transilvanica.
    history: >-
      Des vestiges paléolithiques ont été mis au jour dans les grottes de Bordul Mare et Ciclovina Uscată :
      foyers, outillage en os et silex, et ossements d'ours des cavernes, de cheval et de loup. Le
      pastoralisme y possède des racines séculaires et la transhumance y était régulière.


      Le parc naturel Grădiștea Muncelului-Cioclovina a été institué au niveau départemental en 1979, confirmé
      en 1997 et classé zone protégée d'intérêt national en 2000, sous catégorie V de l'UICN.
    before: >-
      Le parc se visite uniquement le long des axes publics et des sentiers balisés, en respectant les
      règlements. Il est interdit d'arracher ou de prélever les plantes sauvages. Le bivouac est autorisé
      exclusivement sur les aires aménagées et balisées, et l'accès des véhicules à moteur hors des routes
      publiques est prohibé. Vélo et équitation sont cantonnés aux pistes balisées. Visitez entre mai et
      octobre.
    around: >-
      À douze kilomètres se trouvent les [montagnes de Parâng](/lugar/muntii-parang/) et le [parc national des
      gorges du Jiu - forêt primaire](/lugar/parcul-national-defileul-jiului-codrii-seculari/). À seize
      kilomètres gisent les [montagnes de Godeanu](/lugar/muntii-godeanu/) et le [parc national
      Retezat](/lugar/parcul-national-retezat---masivul-muntos/), et à vingt-sept le [parc naturel de
      Cindrel](/lugar/parcul-natural-cindrel/).
  de:
    intro: >-
      In den dichten Wäldern des Șureanu-Gebirges liegt am Südwesthang des Godeanu-Gipfels Sarmizegetusa
      Regia, die einstige Hauptstadt Dakiens: die gewaltigste der Dakerfestungen mit Wehranlage und heiligen
      Kultstätten. Hierher zu wandern bedeutet, ein Massiv zu durchstreifen, in dem sich Geschichte und Natur
      eng verzahnen. Die Șureanu-Berge zwischen den Kreisen Hunedoara und Alba gehören zur Parâng-Gruppe der
      Südkarpaten mit oft über zweitausend Meter hohen Kuppen. Sie umfassen 1.585 Quadratkilometer; höchster
      Gipfel ist der Vârfu lui Pătru mit 2.130 Metern.
    landscape: >-
      Das Șureanu-Gebirge besitzt weder schroffe Grate noch zerklüftete Karkessel, sondern weite
      Abtragungsflächen: Es ist vor allem ein Hochland aus Almen und Weiden, umgeben von waldreichen
      Steilhängen. Im Süden erstreckt sich eine Karstzone mit Höhlen, Felskuppen und Schluchten, in der
      Grundwässer verzweigte Spaltennetze von Hunderten Metern Länge bilden, die an Quellen wie Șipot, Șura
      Mare und Cioclovina zutage treten.


      Östlich des Șureanu-Gipfels liegt auf 1.737 Metern der eiszeitliche Șureanu-See auf der unteren Stufe
      des Kars, gesäumt von Latschen und besiedelt von heimischen Bachforellen.


      Die Vegetationsstufen wechseln mit der Höhe. Buchenwälder säumen das Gebirge im Norden und Westen
      zwischen 500 und 1.050 Metern und steigen in den Tälern bis auf 1.500 Meter an. Zwischen 1.300 und 1.700
      Metern stocken Fichtenwälder mit Tanne, Zirbelkiefer, Vogelbeere, Holunder und Bergahorn. Die alpine
      Stufe bildet erst oberhalb von zweitausend Metern Weideinseln und reicht dort bis 1.900 Meter herab, wo
      Latschen einst gerodet wurden.
    wildlife: >-
      In den alpinen Rasen wachsen *Carex curvula*, *Primula minima*, *Soldanella pusilla*, *Campanula alpina*
      und *Helleborus purpurascens*; der Naturpark birgt Endemiten wie *Hepatica transsilvanica*, *Thymus
      comosus*, *Symphytum cordatum* und *Sorbus borbasii*.


      In den Hochlagen begegnet man Ohrenlerche, Schneeammer, Bergpieper, Steinschmätzer und Alpenbraunelle.
      An warmen Tagen sonnen sich Kreuzottern, Waldeidechsen und Schmetterlinge, während in feuchten Senken
      Grasfrosch, Feuersalamander und Bergmolch leben.


      Zu den Säugetieren gehören [Braunbär](/especie/ursus_arctos/), [Wolf](/especie/canis_lupus/), Rotfuchs,
      Wildschwein, Reh, Baummarder und [Luchs](/especie/lynx_lynx/). In den Gebirgsflüssen schwimmen
      Bachforelle, Äsche, Semling und Steinkrebs. In Höhlen überwintern Fledermäuse wie Großer Abendsegler,
      Zwergfledermaus und [Große Hufeisennase](/especie/rhinolophus_ferrumequinum/). Die Höhle Șura Mare
      beherbergte zwischen 1960 und 1970 mit über hunderttausend Tieren eine der größten Fledermauskolonien
      Europas; neuere Zählungen erfassen etwa vierzigtausend.
    visit: >-
      Der Naturpark Grădiștea Muncelului-Cioclovina umfasst Teile des Gebirges und bietet mehrere Wanderwege.
      Die Route Terra Dacica führt von Măgureni über die Cioaca-Ulmului-Lichtung hinab nach Sarmizegetusa
      Regia und Grădiștea de Munte und steigt über Fundătura Ponorului zum Luncani-Plateau auf. Ein
      Karstlehrpfad verbindet Federi mit Fundătura Ponorului, ein Biodiversitätspfad zieht vom Zusammenfluss
      der Täler Rea und Grădiștea am Kloster vorbei zum Vârtoape-Plateau. Ein weiterer Steig verknüpft
      Costeşti, die Festung Blidaru, Leurdana, Târsa, Poiana Omului und den Godeanu-Gipfel, während eine Tour
      Ohaba Ponor mit der Șura-Mare-Klamm und den Höhlen Ponorici und Cioclovina in sieben bis acht Stunden
      verbindet.


      Über die Straße DN 7 ab Orăştie nach Costeşti erreicht man die meisten Dakerfestungen, die Plateaus von
      Vârtoape und Luncani sowie den Wasserfall im Rea-Tal. Bahnhöfe liegen in Orăştie, Călan, Pui, Baru Mare,
      Băniţa und Peştera Bolii; Weitwanderer erreichen das Massiv über die Via Transilvanica.
    history: >-
      Paläolithische Spuren wurden in den Höhlen Bordul Mare und Ciclovina Uscată gefunden: Feuerstellen,
      Knochen- und Feuersteinwerkzeuge sowie Knochen von Höhlenbär, Wildpferd und Wolf. Die Almwirtschaft
      blickt auf uralte Wurzeln zurück und Wanderweidewirtschaft war weit verbreitet.


      Der Naturpark Grădiștea Muncelului-Cioclovina wurde 1979 auf Kreisebene geschaffen, 1997 bestätigt und
      2000 als nationales Schutzgebiet der IUCN-Kategorie V ausgewiesen.
    before: >-
      Der Naturpark darf nur auf öffentlichen Straßen und markierten Wegen unter Beachtung aller Vorschriften
      begangen werden. Das Ausgraben oder Pflücken von Wildpflanzen ist untersagt. Zelten ist nur auf
      ausgewiesenen Plätzen gestattet, motorisierter Verkehr abseits öffentlicher Straßen verboten. Radfahren
      und Reiten sind auf markierte Routen beschränkt. Besuche von Mai bis Oktober.
    around: >-
      Zwölf Kilometer entfernt liegen das [Parâng-Gebirge](/lugar/muntii-parang/) und der [Nationalpark
      Jiu-Schlucht – Urwald](/lugar/parcul-national-defileul-jiului-codrii-seculari/). Sechzehn Kilometer
      entfernt erheben sich das [Godeanu-Gebirge](/lugar/muntii-godeanu/) und der [Nationalpark
      Retezat](/lugar/parcul-national-retezat---masivul-muntos/), und siebenundzwanzig Kilometer der
      [Naturpark Cindrel](/lugar/parcul-natural-cindrel/).
  it:
    intro: >-
      Tra i boschi di Șureanu, sulle pendici sud-occidentali del picco Godeanu, sorge Sarmizegetusa Regia, la
      capitale della Dacia: la più imponente delle fortezze daciche, provvista di cinta fortificata e recinto
      sacro. Salirvi significa percorrere un massiccio dove storia antica e natura selvaggia convivono. I
      monti Șureanu, compresi tra i distretti di Hunedoara e Alba, appartengono al gruppo Parâng dei Carpazi
      Meridionali, con cime che toccano sovente i duemila metri. Si estendono per 1.585 chilometri quadrati e
      culminano con il Vârfu lui Pătru a 2.130 metri.
    landscape: >-
      Gli Șureanu non mostrano creste scoscese né aspri circhi glaciali, bensì vaste superfici di spianamento:
      sono soprattutto un altopiano di pascoli montani, circondato da pendici boscose. Verso sud si apre una
      fascia calcarea ricca di grotte, colline e forre, dove le acque sotterranee formano reti di fessure
      lunghe centinaia di metri che sgorgano ai margini del calcare in sorgenti quali Șipot, Șura Mare e
      Cioclovina.


      A est della vetta dello Șureanu si trova il lago glaciale di Șureanu, a 1.737 metri di quota nel gradino
      basale del circo, cinto da pino mugo e popolato da trote autoctone.


      Le fasce di vegetazione variano con la quota. Le faggete fasciano il massiccio a nord e a ovest tra 500
      e 1.050 metri, risalendo i valloni sino a 1.500 metri. Tra 1.300 e 1.700 metri allignano le peccete con
      abete bianco, pino cembro, sorbo degli uccellatori, sambuco e acero montano. Il piano alpino compare
      come isolotti di prateria sopra i duemila metri, scendendo a 1.900 metri dove i pini mughi furono
      tagliati per il pascolo.
    wildlife: >-
      Nelle praterie alpine crescono *Carex curvula*, *Primula minima*, *Soldanella pusilla*, *Campanula
      alpina* ed *Helleborus purpurascens*, e il parco annovera endemismi quali *Hepatica transsilvanica*,
      *Thymus comosus*, *Symphytum cordatum* e *Sorbus borbasii*.


      Nel piano alpino si osservano l'allodola gola-gialla, lo zigolo delle nevi, lo spioncello, il culbianco
      e il sordone. Nelle calde giornate estive i pascoli ospitano il marasso, la lucertola vivipara e
      numerose farfalle, mentre negli avvallamenti umidi vivono la rana temporaria, la salamandra pezzata e il
      tritone alpino.


      Tra i mammiferi risiedono l'[orso bruno](/especie/ursus_arctos/), il [lupo](/especie/canis_lupus/), la
      volpe, il cinghiale, il capriolo, la martora e la [lince boreale](/especie/lynx_lynx/). Nei torrenti
      vivono trota fario, temolo, barbo canino e gambero di fiume. Nel sottosuolo delle grotte dimorano
      chirotteri come la nottola comune, il pipistrello nano e il [ferro di cavallo
      maggiore](/especie/rhinolophus_ferrumequinum/). La grotta di Șura Mare ha ospitato tra il 1960 e il 1970
      oltre centomila pipistrelli in letargo, tra le colonie più grandi d'Europa; stime recenti ne contano
      circa quarantamila.
    visit: >-
      Il Parco Naturale Grădiștea Muncelului-Cioclovina protegge parte del gruppo offrendo numerosi tracciati.
      L'itinerario Terra Dacica muove da Măgureni per la radura di Cioaca Ulmului, scende a Sarmizegetusa
      Regia e Grădiștea de Munte e risale all'altopiano di Luncani per Fundătura Ponorului. Un sentiero
      tematico sul carsismo congiunge Federi a Fundătura Ponorului, mentre la via della biodiversità risale la
      valle Rea verso l'altopiano di Vârtoape. Un'altra traccia unisce Costeşti, la fortezza di Blidaru,
      Leurdana, Târsa, Poiana Omului e la cima Godeanu, mentre un percorso collega Ohaba Ponor con le gole di
      Șura Mare e le grotte Ponorici e Cioclovina in sette-otto ore.


      Dalla strada DN 7 a Orăştie verso Costeşti si raggiungono quasi tutte le fortezze daciche, gli altopiani
      di Vârtoape e Luncani e la cascata della valle Rea. Vi sono stazioni ferroviarie a Orăştie, Călan, Pui,
      Baru Mare, Băniţa e Peştera Bolii, e gli escursionisti a lungo raggio possono arrivare tramite la Via
      Transilvanica.
    history: >-
      Testimonianze paleolitiche sono state rinvenute nelle grotte Bordul Mare e Ciclovina Uscată: focolari,
      manufatti in osso e selce e resti di orso delle caverne, cavallo e lupo. L'allevamento vanta radici
      antichissime e la transumanza era pratica diffusa.


      Il Parco Naturale Grădiștea Muncelului-Cioclovina venne istituito a livello distrettuale nel 1979,
      riconfermato nel 1997 e dichiarato area protetta di rilevanza nazionale nel 2000 sotto la categoria V
      dell'IUCN.
    before: >-
      Il parco va visitato esclusivamente lungo le strade pubbliche e i sentieri tracciati, nel rispetto delle
      norme vigenti. È vietato estirpare la flora spontanea. Il campeggio è consentito unicamente nelle aree
      autorizzate e segnalate, ed è vietato l'accesso con veicoli a motore fuori dalle strade ordinarie. Bici
      e cavallo sono ammessi solo su percorsi designati. Visite da maggio a ottobre.
    around: >-
      A dodici chilometri si trovano i [Monti di Parâng](/lugar/muntii-parang/) e il [Parco Nazionale Gole del
      Jiu - Foresta Primaria](/lugar/parcul-national-defileul-jiului-codrii-seculari/). A sedici chilometri
      sorgono i [Monti di Godeanu](/lugar/muntii-godeanu/) e il [Parco Nazionale
      Retezat](/lugar/parcul-national-retezat---masivul-muntos/), e a ventisette il [Parco Naturale di
      Cindrel](/lugar/parcul-natural-cindrel/).
  pt:
    intro: >-
      Por entre os bosques de Șureanu, na encosta sudoeste do cume Godeanu, ergue-se Sarmizegetusa Regia, a
      capital da Dácia: a maior fortaleza dácia, dotada de muralha defensiva e recinto sacro. Subir até ela é
      caminhar por um maciço onde a história e a natureza se entrelaçam. Os montes Șureanu, entre os distritos
      de Hunedoara e Alba, integram o grupo Parâng dos Cárpatos Meridionais, com cumes que ultrapassam com
      frequência os dois mil metros. Cobrem 1.585 quilómetros quadrados e o seu cume mais alto é o Vârfu lui
      Pătru, com 2.130 metros.
    landscape: >-
      Os montes de Șureanu não possuem cristas escarpadas nem circos glaciares pontiagudos, mas amplas
      superfícies de aplanação: são sobretudo planaltos de pastagens rodeados por encostas densamente
      florestadas. No sul estende-se uma faixa calcária com grutas, colinas e desfiladeiros, onde as águas
      subterrâneas formam redes de fendas com centenas de metros que emergem no bordo calcário em nascentes
      como Șipot, Șura Mare e Cioclovina.


      A leste do cume Șureanu repousa a lagoa glaciar de Șureanu, a 1.737 metros de altitude no patamar
      inferior do circo, rodeada de pinheiro-raso e habitada por truta autóctone.


      Os andares de vegetação escalonam-se com a altitude. Os faiais circundam o maciço a norte e a oeste
      entre 500 e 1.050 metros, subindo pelos vales até aos 1.500 metros. Entre os 1.300 e os 1.700 metros
      desenvolvem-se florestas de espruce com abeto, pinheiro-suíço, tramazeira, sabugueiro e ácer. O piso
      alpino surge como ilhas de prado acima dos dois mil metros, descendo até aos 1.900 metros nos locais
      onde os pinheiros-rasos foram desbravados para pastoreio.
    wildlife: >-
      Nas pastagens alpinas vicejam *Carex curvula*, *Primula minima*, *Soldanella pusilla*, *Campanula
      alpina* e *Helleborus purpurascens*, apresentando o parque endemismos como *Hepatica transsilvanica*,
      *Thymus comosus*, *Symphytum cordatum* e *Sorbus borbasii*.


      No piso alpino observam-se a calhandra-cornuda, o escrevedeira-das-neves, a petinha-alpina, o
      chasco-cinzento e a ferreirinha-alpina. Nos dias quentes, as pastagens acolhem a víbora-comum, a
      lagartixa-da-turfeira e muitas borboletas, ao passo que nos recantos húmidos vivem a rã-castanha, a
      salamandra-de-pintas-amarelas e o tritão-alpino.


      Entre os mamíferos contam-se o [urso-pardo](/especie/ursus_arctos/), o [lobo](/especie/canis_lupus/), a
      raposa, o javali, o corço, a marta e o [lince-boreal](/especie/lynx_lynx/). Nos cursos de água ocorrem a
      truta-fario, o tímalo, o barbo-meridional e o lagostim-da-pedra. No interior das grutas refugiam-se
      morcegos como o nóctulo-comum, o morcego-anão e o
      [morcego-de-ferradura-grande](/especie/rhinolophus_ferrumequinum/). A gruta de Șura Mare acolheu entre
      1960 e 1970 uma das maiores colónias de hibernação da Europa, com mais de cem mil morcegos; censos
      recentes apontam para cerca de quarenta mil.
    visit: >-
      O Parque Natural Grădiștea Muncelului-Cioclovina abrange parte do maciço e propõe vários trilhos. O
      trilho Terra Dacica parte de Măgureni pela clareira Cioaca Ulmului, desce a Sarmizegetusa Regia e
      Grădiștea de Munte e sobe ao planalto de Luncani por Fundătura Ponorului. Um trilho cárstico liga Federi
      a Fundătura Ponorului, enquanto a rota da biodiversidade sobe o vale Rea até ao planalto de Vârtoape.
      Outro percurso liga Costeşti, a fortaleza de Blidaru, Leurdana, Târsa, Poiana Omului e o cume Godeanu, e
      uma rota une Ohaba Ponor às gargantas de Șura Mare e às grutas Ponorici e Cioclovina em sete a oito
      horas.


      A partir da estrada DN 7 em Orăştie rumo a Costeşti alcança-se a maioria das fortalezas dácias dos
      montes Orăştie, os planaltos de Vârtoape e Luncani e a cascata do vale Rea. Existem estações de comboio
      em Orăştie, Călan, Pui, Baru Mare, Băniţa e Peştera Bolii, e quem faz grandes travessias pode chegar
      pela Via Transilvanica.
    history: >-
      Foram encontrados vestígios paleolíticos nas grutas Bordul Mare e Ciclovina Uscată: lareiras, utensílios
      de osso e sílex e ossos de urso-das-cavernas, cavalo e lobo. O pastoreio tem raízes ancestrais e a
      transumância era prática corrente.


      O Parque Natural Grădiștea Muncelului-Cioclovina foi criado a nível distrital em 1979, reconfirmado em
      1997 e declarado área protegida de interesse nacional no ano 2000, integrando a Categoria V da UICN.
    before: >-
      O parque só pode ser visitado pelas vias de acesso público e trilhos balizados, respeitando todas as
      normas. É proibido colher ou desenraizar plantas da flora bravia. O acampamento só é permitido nos
      locais expressamente sinalizados e é vedado o trânsito com veículos motorizados fora das estradas
      públicas. O ciclismo e o hipismo estão circunscritos aos trajetos autorizados. Visita entre maio e
      outubro.
    around: >-
      A doze quilómetros encontram-se as [Montanhas de Parâng](/lugar/muntii-parang/) e o [Parque Nacional do
      Desfiladeiro do Jiu - Floresta Virgem](/lugar/parcul-national-defileul-jiului-codrii-seculari/). A
      dezasseis erguem-se as [Montanhas de Godeanu](/lugar/muntii-godeanu/) e o [Parque Nacional
      Retezat](/lugar/parcul-national-retezat---masivul-muntos/), e a vinte e sete o [Parque Natural de
      Cindrel](/lugar/parcul-natural-cindrel/).
