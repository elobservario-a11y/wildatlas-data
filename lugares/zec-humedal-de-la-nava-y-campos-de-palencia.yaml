resumen:
  es: >-
    El 'Mar de Campos', humedal estepario recuperado tras su desecación histórica, parada vital para el
    carricerín cejudo (*Acrocephalus paludicola*).
  en: >-
    The 'Sea of Campos', a steppe wetland restored after historic drainage, a vital stopover for the aquatic
    warbler (*Acrocephalus paludicola*).
  fr: >-
    La « Mer de Campos », zone humide steppique restaurée après son assèchement historique, étape vitale pour
    le phragmite aquatique (*Acrocephalus paludicola*).
  de: >-
    Das «Meer von Campos», nach historischer Trockenlegung wiederhergestelltes Steppenfeuchtgebiet, wichtiger
    Rastplatz für den Seggenrohrsänger (*Acrocephalus paludicola*).
  it: >-
    Il «Mar de Campos», zona umida steppica recuperata dopo il prosciugamento storico, tappa vitale per il
    pagliarolo (*Acrocephalus paludicola*).
  pt: >-
    O «Mar de Campos», zona húmida estepária recuperada após a sua drenagem histórica, paragem vital para a
    felosa-aquática (*Acrocephalus paludicola*).
unico:
  es: >-
    Una laguna que se recuperó cuando ya había desaparecido, y que hoy figura entre los mejores ejemplos de
    restauración de humedales de España.
  en: >-
    A lagoon that was brought back after it had already vanished, and which today ranks among the finest
    examples of wetland restoration in Spain.
  fr: >-
    Une lagune qui fut restaurée alors qu'elle avait déjà disparu, et qui figure aujourd'hui parmi les
    meilleurs exemples de restauration de zones humides en Espagne.
  de: >-
    Eine Lagune, die zurückgeholt wurde, als sie schon verschwunden war, und heute zu den besten Beispielen
    für die Wiederherstellung von Feuchtgebieten in Spanien zählt.
  it: >-
    Una laguna recuperata quando era ormai scomparsa, che oggi figura tra i migliori esempi di ripristino
    delle zone umide in Spagna.
  pt: >-
    Uma lagoa que se recuperou quando já tinha desaparecido, e que hoje figura entre os melhores exemplos de
    restauro de zonas húmidas de Espanha.
observaciones:
  es: >-
    La mejor época para ver aves depende de lo que busques: el invierno, para el ánsar común, y la primavera y
    el otoño para los pasos migratorios. La laguna se inunda entre el otoño y la primavera y se seca poco a
    poco en verano, así que su aspecto cambia mucho según la estación. El Diario de la Laguna de la Casa del
    Parque te dirá qué aves hay.
texto:
  es:
    intro: >-
      Durante siglos, en pleno corazón de la meseta cerealista, hubo un mar. Se llamaba Mar de Campos, medía
      por término medio unas dos mil quinientas hectáreas y en los años lluviosos llegaba a cinco mil: uno de
      los mayores humedales de la península. Lo secaron, intento tras intento desde los tiempos de los Reyes
      Católicos, hasta que en 1968 desapareció por completo para dejar sitio a más tierra de cultivo. Hoy La
      Nava es lo que se ha recuperado de aquella laguna esteparia, una lámina de agua somera en la comarca de
      Tierra de Campos, en el suroeste de la provincia de Palencia, donde cada año vuelven a posarse gansos,
      patos, avutardas y garzas.
    landscape: >-
      El relieve es llano y está dominado por la estepa cerealista: el espacio natural La Nava y Campos de
      Palencia abarca cerca de cincuenta y siete mil hectáreas de Tierra de Campos. En medio, la laguna actual
      ocupa unas cuatrocientas hectáreas, apenas una décima parte de lo que fue el Mar de Campos. La lluvia
      aporta muy poco, de modo que el régimen del agua se controla de forma artificial y el agua llega en su
      mayor parte del Canal de Castilla, que se deriva al río Retortillo y de ahí, a través del arroyo
      Carrepadilla, se reparte con compuertas y sifones. Un sistema de diques de tierra divide la laguna en
      tres zonas que se pueden gestionar por separado.


      El resultado es un humedal con ritmo propio. La gestión imita el ciclo natural de una laguna esteparia:
      se inunda desde el otoño y se seca poco a poco durante el verano, con apenas unos cuarenta centímetros
      de profundidad media. En los periodos secos, parte del lecho lo pastorean ovejas. La Nava está en la
      cuenca del Duero, la del río Retortillo, afluente del Valdeginate, que desemboca en el Carrión.
    wildlife: >-
      Si lo tuyo son las aves, La Nava es un lugar de visita obligada. El inventario de la laguna reúne
      doscientas veintidós especies, el cuarenta y uno por ciento de las que hay en España, y la fuente
      turística local habla de casi la mitad. Pero lo que cuenta es cuándo.


      En invierno, el ánsar común: la laguna es la tercera zona de invernada más importante de la península
      para este ganso, con entre diez mil y doce mil aves cada año. En los pasos migratorios de primavera y
      otoño y en la invernada, anátidas y limícolas alcanzan máximos de hasta veinte mil aves, y más de diez
      mil ánades reales pasan aquí el invierno.


      En verano, cuando casi todo se seca, La Nava sigue siendo uno de los pocos lugares del país con
      condiciones favorables para las aves acuáticas. Es el principal punto de cría de Castilla y León de la
      gaviota reidora y del fumarel cariblanco, y desde el año dos mil cría aquí también la [garza
      imperial](/especie/ardea_purpurea/). Pasan además la malvasía cabeciblanca, la
      [espátula](/especie/platalea_leucorodia/), el [avetoro común](/especie/botaurus_stellaris/), el
      cernícalo primilla, el ánsar chico y la [cigüeña negra](/especie/ciconia_nigra/). Junto a Villafáfila,
      es un punto clave para la [avutarda](/especie/otis_tarda/), el ave voladora más pesada del mundo, y en
      2012 se censaron mil quinientos ejemplares.


      Hay una especie que da nombre a proyectos: el [carricerín cejudo](/especie/acrocephalus_paludicola/), el
      paseriforme más amenazado de Europa, que cuenta con poblaciones aquí. Un proyecto LIFE de la UE, llevado
      a cabo por la Fundación Global Nature, trabajó por su conservación entre 2002 y 2006, y hoy el proyecto
      Life Paludicola sigue en marcha.
    visit: >-
      Empieza por la Casa del Parque de La Nava y Campos de Palencia, en Fuentes de Nava. Es un centro de
      visitantes pensado para entender la laguna antes de ir a verla: unos paneles cuentan la historia del
      antiguo Mar de Campos y, manejando un chapón, que es la compuerta de riego, se aprende cómo se gestiona
      el humedal. Una cámara conectada a la laguna ofrece imagen en tiempo real, una lupa permite ver el
      fitoplancton y el zooplancton de una muestra de agua, y el Diario de la Laguna publica los datos del
      último censo de aves. También hay paneles interactivos sobre flora, migraciones y anillamiento
      científico.


      Después sal a la laguna. Un sendero señalizado une la localidad de Mazariegos con los puestos de
      observación. Desde Palencia, la capital provincial, que queda a unos veinticinco kilómetros al sudeste,
      se llega por la N-610 hasta Mazariegos.
    history: >-
      La Nava ha sido siempre un lugar de agua y ganado. Madoz la describía como refugio invernal de gansos de
      tres clases, patos y zarcetas, y señalaba que sus pastos mantenían cada año a más de veinte mil cabezas
      de ganado lanar, vacuno, mular y caballar.


      Tras la desecación de 1968, en 1990 la Fundación Global Nature y varias administraciones empezaron a
      recuperarla; hoy es una laguna artificial somera gestionada por la Junta de Castilla y León. La
      inclusión como humedal Ramsar llegó en 2002.


      Las amenazas siguen ahí: la eutrofización y la contaminación de la agricultura, y la acumulación de
      materia orgánica de las praderas de *Carex divisa*, que frena la vegetación subacuática y que se
      controla con siega, quema y pastoreo.
    before: >-
      La mejor época para ver aves depende de lo que busques: el invierno, para el ánsar común, y la primavera
      y el otoño para los pasos migratorios. La laguna se inunda entre el otoño y la primavera y se seca poco
      a poco en verano, así que su aspecto cambia mucho según la estación. El Diario de la Laguna de la Casa
      del Parque te dirá qué aves hay.
    around: >-
      La Nava no tiene vecinos cercanos registrados en el atlas, pero sí lugares lejanos con los que comparte
      aves y paisaje. El [Parque Nacional Fertő-Hanság - Estepa de
      Hanság](/lugar/ferto-hansag-nemzeti-park---hansag/) y el [Parque Nacional de Hortobágy - La Puszta
      Húngara](/lugar/hortobagyi-nemzeti-park---puszta/) comparten con ella el humedal y la estepa, y en
      Hortobágy también la avutarda y el avetoro. El [Parque Nacional Desembocadura del
      Warta](/lugar/park-narodowy-ujscie-warty/) comparte el carricerín cejudo y el ánsar común, y el [Parque
      Natural del Delta del Ebro](/lugar/parc-natural-del-delta-de-l-ebre/) la garza imperial y el avetoro.
  en:
    intro: >-
      For centuries, right in the heart of the cereal plateau, there was a sea. It was called Mar de Campos,
      covered on average around two thousand five hundred hectares and in rainy years reached five thousand:
      one of the largest wetlands on the peninsula. They drained it, attempt after attempt since the time of
      the Catholic Monarchs, until in 1968 it disappeared completely to make room for more arable land. Today
      La Nava is what has been recovered of that steppe lagoon, a shallow sheet of water in the Tierra de
      Campos district, in the south-west of Palencia province, where geese, ducks, great bustards and herons
      settle once again every year.
    landscape: >-
      The relief is flat and dominated by cereal steppe: the La Nava y Campos de Palencia natural area covers
      nearly fifty-seven thousand hectares of Tierra de Campos. In the middle, the present lagoon occupies
      around four hundred hectares, barely a tenth of what the Mar de Campos once was. Rain brings very
      little, so the water regime is controlled artificially and most of the water comes from the Canal de
      Castilla, diverted into the Retortillo river and from there, via the Carrepadilla stream, distributed
      with sluices and siphons. A system of earth dykes divides the lagoon into three zones that can be
      managed separately.


      The result is a wetland with its own rhythm. Management mimics the natural cycle of a steppe lagoon: it
      floods from autumn onwards and dries out gradually during summer, with an average depth of barely forty
      centimetres. During dry periods, sheep graze part of the bed. La Nava lies in the Duero basin, on the
      Retortillo river, a tributary of the Valdeginate, which flows into the Carrión.
    wildlife: >-
      If birds are your thing, La Nava is a must. The lagoon's inventory brings together two hundred and
      twenty-two species, forty-one per cent of those found in Spain, and the local tourist source speaks of
      nearly half. Yet what counts is when.


      In winter, the greylag goose: the lagoon is the third most important wintering area on the peninsula for
      this goose, with between ten thousand and twelve thousand birds each year. During spring and autumn
      migration and in winter, waterfowl and waders peak at up to twenty thousand birds, and more than ten
      thousand mallards spend the winter here.


      In summer, when almost everything dries up, La Nava remains one of the few places in the country with
      favourable conditions for waterbirds. It is Castile and León's main breeding site for black-headed gull
      and whiskered tern, and since the year two thousand the [purple heron](/especie/ardea_purpurea/) has
      also bred here. White-headed duck, [Eurasian spoonbill](/especie/platalea_leucorodia/), [Eurasian
      bittern](/especie/botaurus_stellaris/), lesser kestrel, lesser white-fronted goose and [black
      stork](/especie/ciconia_nigra/) also pass through. Together with Villafáfila, it is a key stronghold for
      the [great bustard](/especie/otis_tarda/), the heaviest flying bird in the world, and in 2012 one
      thousand five hundred individuals were counted.


      One species lends its name to conservation projects: the [aquatic
      warbler](/especie/acrocephalus_paludicola/), Europe's most threatened passerine, which has populations
      here. An EU LIFE project carried out by Fundación Global Nature worked for its conservation between 2002
      and 2006, and today the Life Paludicola project is still under way.
    visit: >-
      Start at the Casa del Parque de La Nava y Campos de Palencia, in Fuentes de Nava. It is a visitor centre
      designed to help you understand the lagoon before going out to see it: panels tell the story of the old
      Mar de Campos and, by operating a *chapón* — the irrigation sluice gate — you learn how the wetland is
      managed. A camera linked to the lagoon gives a live feed, a magnifying lens lets you inspect
      phytoplankton and zooplankton in a water sample, and the Lagoon Diary publishes the latest bird census
      figures. There are also interactive panels on flora, migration and scientific ringing.


      Then head out to the lagoon. A waymarked trail links the village of Mazariegos with the observation
      hides. From Palencia, the provincial capital some twenty-five kilometres to the south-east, take the
      N-610 to Mazariegos.
    history: >-
      La Nava has always been a place of water and livestock. Madoz described it as a winter refuge for three
      kinds of geese, ducks and teal, noting that its pastures supported more than twenty thousand head of
      sheep, cattle, mules and horses each year.


      After the drainage of 1968, in 1990 Fundación Global Nature and several public authorities began
      restoring it; today it is a shallow artificial lagoon managed by the Junta de Castilla y León. Inclusion
      as a Ramsar wetland came in 2002.


      Threats remain: eutrophication and agricultural pollution, and the build-up of organic matter in *Carex
      divisa* meadows, which holds back underwater vegetation and is controlled with mowing, burning and
      grazing.
    before: >-
      The best time to watch birds depends on what you are looking for: winter for greylag geese, and spring
      and autumn for migratory passage. The lagoon floods between autumn and spring and dries out gradually in
      summer, so its appearance changes markedly with the season. The Lagoon Diary at the Casa del Parque will
      tell you which birds are present.
    around: >-
      La Nava has no close neighbours recorded in the atlas, though it shares birds and landscape with distant
      sites. [Fertő-Hanság National Park - Hanság Steppe](/lugar/ferto-hansag-nemzeti-park---hansag/) and
      [Hortobágy National Park - The Hungarian Puszta](/lugar/hortobagyi-nemzeti-park---puszta/) share wetland
      and steppe habitats with it, and Hortobágy also shares the great bustard and the bittern. [Ujście Warty
      National Park](/lugar/park-narodowy-ujscie-warty/) shares the aquatic warbler and the greylag goose, and
      [Ebro Delta Natural Park](/lugar/parc-natural-del-delta-de-l-ebre/) shares the purple heron and the
      bittern.
  fr:
    intro: >-
      Pendant des siècles, en plein cœur du plateau céréalier, il y eut une mer. Elle s'appelait Mar de
      Campos, mesurait en moyenne quelque deux mille cinq cents hectares et atteignait cinq mille les années
      pluvieuses : l'une des plus grandes zones humides de la péninsule. On l'assécha, tentative après
      tentative depuis l'époque des Rois Catholiques, jusqu'à ce qu'en 1968 elle disparaisse complètement pour
      laisser place à davantage de terres cultivées. Aujourd'hui, La Nava est ce qui a été restauré de cette
      lagune steppique, une nappe d'eau peu profonde dans la comarque de Tierra de Campos, au sud-ouest de la
      province de Palencia, où reviennent chaque année se poser oies, canards, outardes et hérons.
    landscape: >-
      Le relief est plat et dominé par la steppe céréalière : l'espace naturel La Nava y Campos de Palencia
      couvre près de cinquante-sept mille hectares de Tierra de Campos. Au milieu, la lagune actuelle occupe
      quelque quatre cents hectares, à peine un dixième de ce que fut le Mar de Campos. La pluie apporte très
      peu, si bien que le régime de l'eau est contrôlé artificiellement et que l'eau arrive pour l'essentiel
      du Canal de Castille, dérivée vers la rivière Retortillo puis, par le ruisseau Carrepadilla, répartie
      par des vannes et des siphons. Un système de digues de terre divise la lagune en trois secteurs gérables
      séparément.


      Le résultat est une zone humide au rythme propre. La gestion imite le cycle naturel d'une lagune
      steppique : elle s'inonde dès l'automne et s'assèche peu à peu durant l'été, avec à peine une
      quarantaine de centimètres de profondeur moyenne. Pendant les périodes sèches, une partie du lit est
      pâturée par des moutons. La Nava se situe dans le bassin du Douro, celui du Retortillo, affluent du
      Valdeginate, qui se jette dans le Carrión.
    wildlife: >-
      Si vous aimez les oiseaux, La Nava est une visite incontournable. L'inventaire de la lagune réunit deux
      cent vingt-deux espèces, soit quarante et un pour cent de celles présentes en Espagne, et la source
      touristique locale parle de presque la moitié. Mais ce qui compte, c'est le moment.


      En hiver, l'oie cendrée : la lagune est la troisième zone d'hivernage la plus importante de la péninsule
      pour cette oie, avec entre dix mille et douze mille oiseaux chaque année. Lors des passages migratoires
      de printemps et d'automne et en hivernage, anatidés et limicoles atteignent des pics de jusqu'à vingt
      mille oiseaux, et plus de dix mille canards colverts passent ici l'hiver.


      En été, quand presque tout s'assèche, La Nava reste l'un des rares endroits du pays offrant des
      conditions favorables aux oiseaux d'eau. C'est le principal site de nidification de Castille-et-León
      pour la mouette rieuse et la guifette moustac, et depuis l'an deux mille le [héron
      pourpré](/especie/ardea_purpurea/) y niche également. Y passent aussi l'érismature à tête blanche, la
      [spatule blanche](/especie/platalea_leucorodia/), le [butor étoilé](/especie/botaurus_stellaris/), le
      faucon crécerellette, l'oie naine et la [cigogne noire](/especie/ciconia_nigra/). Avec Villafáfila,
      c'est un point clé pour la [grande outarde](/especie/otis_tarda/), l'oiseau volant le plus lourd du
      monde, et en 2012 mille cinq cents individus ont été recensés.


      Une espèce donne son nom à des projets : le [phragmite aquatique](/especie/acrocephalus_paludicola/), le
      passereau le plus menacé d'Europe, qui compte des populations ici. Un projet LIFE de l'UE, mené par la
      Fundación Global Nature, a œuvré pour sa conservation entre 2002 et 2006, et aujourd'hui le projet Life
      Paludicola se poursuit.
    visit: >-
      Commencez par la Casa del Parque de La Nava y Campos de Palencia, à Fuentes de Nava. C'est un centre
      d'accueil conçu pour comprendre la lagune avant d'aller la voir : des panneaux racontent l'histoire de
      l'ancien Mar de Campos et, en manœuvrant un *chapón*, la vanne d'irrigation, on apprend comment la zone
      humide est gérée. Une caméra reliée à la lagune offre une image en temps réel, une loupe permet
      d'observer le phytoplancton et le zooplancton d'un échantillon d'eau, et le Journal de la Lagune publie
      les données du dernier recensement d'oiseaux. Il y a aussi des panneaux interactifs sur la flore, les
      migrations et le baguage scientifique.


      Sortez ensuite vers la lagune. Un sentier balisé relie le village de Mazariegos aux postes
      d'observation. Depuis Palencia, la capitale provinciale située à quelque vingt-cinq kilomètres au
      sud-est, on arrive par la N-610 jusqu'à Mazariegos.
    history: >-
      La Nava a toujours été un lieu d'eau et de bétail. Madoz la décrivait comme un refuge hivernal pour des
      oies de trois sortes, des canards et des sarcelles, et signalait que ses pâturages nourrissaient chaque
      année plus de vingt mille têtes de bétail ovin, bovin, mulassier et chevalin.


      Après l'assèchement de 1968, la Fundación Global Nature et plusieurs administrations ont commencé à la
      restaurer en 1990 ; c'est aujourd'hui une lagune artificielle peu profonde gérée par la Junta de
      Castilla y León. L'inscription comme zone humide Ramsar est intervenue en 2002.


      Les menaces persistent : l'eutrophisation et la pollution agricole, ainsi que l'accumulation de matière
      organique des prairies à *Carex divisa*, qui freine la végétation subaquatique et est maîtrisée par
      fauche, brûlage et pâturage.
    before: >-
      La meilleure période pour voir les oiseaux dépend de ce que vous cherchez : l'hiver pour l'oie cendrée,
      le printemps et l'automne pour les passages migratoires. La lagune s'inonde entre l'automne et le
      printemps et s'assèche peu à peu en été, si bien que son aspect change beaucoup selon la saison. Le
      Journal de la Lagune à la Casa del Parque vous indiquera quels oiseaux sont présents.
    around: >-
      La Nava n'a pas de voisins proches enregistrés dans l'atlas, mais des sites lointains avec lesquels elle
      partage oiseaux et paysages. Le [Parc national de Fertő-Hanság - Steppe de
      Hanság](/lugar/ferto-hansag-nemzeti-park---hansag/) et le [Parc national de Hortobágy - La Puszta
      hongroise](/lugar/hortobagyi-nemzeti-park---puszta/) partagent avec elle la zone humide et la steppe, et
      à Hortobágy aussi la grande outarde et le butor étoilé. Le [Parc national de l'embouchure de la
      Warta](/lugar/park-narodowy-ujscie-warty/) partage le phragmite aquatique et l'oie cendrée, et le [Parc
      naturel du delta de l'Èbre](/lugar/parc-natural-del-delta-de-l-ebre/) le héron pourpré et le butor
      étoilé.
  de:
    intro: >-
      Jahrhundertelang lag mitten im Herzen der Getreidehochebene ein Meer. Es hieß Mar de Campos, maß im
      Schnitt rund zweitausendfünfhundert Hektar und erreichte in regenreichen Jahren fünftausend: eines der
      größten Feuchtgebiete der Halbinsel. Man legte es trocken, Versuch um Versuch seit der Zeit der
      Katholischen Könige, bis es 1968 vollständig verschwand, um mehr Ackerland zu schaffen. Heute ist La
      Nava das, was von jener Steppenlagune zurückgewonnen wurde, eine flache Wasserfläche in der Tierra de
      Campos im Südwesten der Provinz Palencia, auf der jedes Jahr wieder Gänse, Enten, Großtrappen und Reiher
      einfallen.
    landscape: >-
      Das Relief ist eben und von der Getreidesteppe geprägt: Das Naturgebiet La Nava y Campos de Palencia
      umfasst fast siebenundfünfzigtausend Hektar der Tierra de Campos. In der Mitte nimmt die heutige Lagune
      etwa vierhundert Hektar ein, kaum ein Zehntel des einstigen Mar de Campos. Der Regen bringt sehr wenig,
      sodass der Wasserhaushalt künstlich gesteuert wird und das Wasser größtenteils aus dem Canal de Castilla
      kommt, in den Fluss Retortillo geleitet und von dort über den Bach Carrepadilla mit Wehren und
      Dükerrohren verteilt wird. Ein System aus Erddämmen teilt die Lagune in drei getrennt steuerbare
      Bereiche.


      Das Ergebnis ist ein Feuchtgebiet mit eigenem Rhythmus. Das Management ahmt den natürlichen Zyklus einer
      Steppenlagune nach: Sie wird ab dem Herbst geflutet und trocknet im Sommer allmählich aus, bei kaum
      vierzig Zentimetern mittlerer Tiefe. In den Trockenzeiten beweiden Schafe einen Teil des Seebodens. La
      Nava liegt im Duero-Einzugsgebiet, im Becken des Retortillo, einem Zufluss des Valdeginate, der in den
      Carrión mündet.
    wildlife: >-
      Wenn Vögel dein Thema sind, ist La Nava ein Pflichtbesuch. Die Artenliste der Lagune umfasst
      zweihundertzweiundzwanzig Arten, einundvierzig Prozent der in Spanien vorkommenden, und örtliche
      Tourismusquellen sprechen von fast der Hälfte. Doch entscheidend ist das Wann.


      Im Winter die Graugans: Die Lagune ist das drittwichtigste Überwinterungsgebiet der Halbinsel für diese
      Gans, mit jährlich zwischen zehntausend und zwölftausend Vögeln. Auf dem Frühjahrs- und Herbstzug sowie
      im Winter erreichen Enten- und Watvögel Spitzenwerte von bis zu zwanzigtausend Vögeln, und über
      zehntausend Stockenten verbringen hier den Winter.


      Im Sommer, wenn fast alles austrocknet, bleibt La Nava einer der wenigen Orte des Landes mit günstigen
      Bedingungen für Wasservögel. Sie ist der wichtigste Brutplatz Kastilien und Leóns für Lachmöwe und
      Weißbart-Seeschwalbe, und seit dem Jahr zweitausend brütet hier auch der
      [Purpurreiher](/especie/ardea_purpurea/). Zudem ziehen Weißkopf-Ruderente,
      [Löffler](/especie/platalea_leucorodia/), [Rohrdommel](/especie/botaurus_stellaris/), Rötelfalke,
      Zwerggans und [Schwarzstorch](/especie/ciconia_nigra/) durch. Zusammen mit Villafáfila ist sie ein
      Schlüsselpunkt für die [Großtrappe](/especie/otis_tarda/), den schwersten flugfähigen Vogel der Welt,
      und 2012 wurden eintausendfünfhundert Exemplare gezählt.


      Eine Art gibt Projekten ihren Namen: der [Seggenrohrsänger](/especie/acrocephalus_paludicola/), der am
      stärksten bedrohte Singvogel Europas, der hier Bestände hat. Ein EU-LIFE-Projekt der Fundación Global
      Nature arbeitete zwischen 2002 und 2006 für seinen Schutz, und heute läuft das Projekt Life Paludicola
      weiter.
    visit: >-
      Beginne in der Casa del Parque de La Nava y Campos de Palencia in Fuentes de Nava. Es ist ein
      Besucherzentrum, das die Lagune erklärt, bevor du hinausgehst: Tafeln erzählen die Geschichte des alten
      Mar de Campos, und beim Bedienen eines *chapón*, eines Bewässerungsschützes, lernt man, wie das
      Feuchtgebiet gesteuert wird. Eine Kamera an der Lagune liefert Livebilder, eine Lupe zeigt Phytoplankton
      und Zooplankton einer Wasserprobe, und das Lagunen-Tagebuch veröffentlicht die Daten der letzten
      Vogelzählung. Dazu gibt es interaktive Tafeln über Flora, Vogelzug und wissenschaftliche Beringung.


      Geh danach hinaus zur Lagune. Ein markierter Weg verbindet den Ort Mazariegos mit den
      Beobachtungsständen. Von Palencia, der etwa fünfundzwanzig Kilometer südöstlich gelegenen
      Provinzhauptstadt, gelangt man über die N-610 nach Mazariegos.
    history: >-
      La Nava war schon immer ein Ort von Wasser und Vieh. Madoz beschrieb sie als Winterzuflucht für drei
      Arten von Gänsen, Enten und Krickenten und hielt fest, dass ihre Weiden jedes Jahr mehr als
      zwanzigtausend Stück Schafe, Rinder, Maultiere und Pferde ernährten.


      Nach der Trockenlegung von 1968 begannen die Fundación Global Nature und mehrere Behörden 1990 mit der
      Wiederherstellung; heute ist sie eine flache künstliche Lagune unter Verwaltung der Junta de Castilla y
      León. Die Aufnahme als Ramsar-Feuchtgebiet erfolgte 2002.


      Die Bedrohungen bleiben bestehen: Eutrophierung und Verschmutzung aus der Landwirtschaft sowie die
      Ansammlung organischer Substanz der *Carex divisa*-Wiesen, die die Unterwasservegetation hemmt und durch
      Mahd, Brennen und Beweidung kontrolliert wird.
    before: >-
      Die beste Zeit für die Vogelbeobachtung hängt davon ab, was du suchst: den Winter für die Graugans,
      Frühling und Herbst für den Durchzug. Die Lagune füllt sich zwischen Herbst und Frühling und trocknet im
      Sommer allmählich aus, sodass sich ihr Bild je nach Jahreszeit stark wandelt. Das Lagunen-Tagebuch in
      der Casa del Parque verrät dir, welche Vögel da sind.
    around: >-
      La Nava hat keine im Atlas verzeichneten nahen Nachbarn, wohl aber ferne Orte, mit denen sie Vögel und
      Landschaft teilt. Der [Nationalpark Fertő-Hanság - Steppe von
      Hanság](/lugar/ferto-hansag-nemzeti-park---hansag/) und der [Nationalpark Hortobágy - Die ungarische
      Puszta](/lugar/hortobagyi-nemzeti-park---puszta/) teilen mit ihr Feuchtgebiet und Steppe, und in
      Hortobágy auch Großtrappe und Rohrdommel. Der [Nationalpark
      Warthemündung](/lugar/park-narodowy-ujscie-warty/) teilt Seggenrohrsänger und Graugans, und der
      [Naturpark Ebrodelta](/lugar/parc-natural-del-delta-de-l-ebre/) Purpurreiher und Rohrdommel.
  it:
    intro: >-
      Per secoli, nel cuore dell'altopiano cerealicolo, ci fu un mare. Si chiamava Mar de Campos, misurava in
      media circa duemilacinquecento ettari e negli anni piovosi arrivava a cinquemila: una delle maggiori
      zone umide della penisola. Lo prosciugarono, tentativo dopo tentativo dai tempi dei Re Cattolici, finché
      nel 1968 scomparve del tutto per lasciare posto a più terre coltivate. Oggi La Nava è ciò che è stato
      recuperato di quella laguna steppica, uno specchio d'acqua bassa nella comarca di Tierra de Campos, nel
      sud-ovest della provincia di Palencia, dove ogni anno tornano a posarsi oche, anatre, otarde e aironi.
    landscape: >-
      Il rilievo è piatto ed è dominato dalla steppa cerealicola: l'area naturale La Nava y Campos de Palencia
      abbraccia quasi cinquantasettemila ettari di Tierra de Campos. Al centro, la laguna attuale occupa circa
      quattrocento ettari, appena un decimo di ciò che fu il Mar de Campos. La pioggia apporta pochissimo,
      sicché il regime idrico è controllato artificialmente e l'acqua arriva per lo più dal Canal de Castilla,
      deviata nel fiume Retortillo e da lì, attraverso il torrente Carrepadilla, distribuita con paratoie e
      sifoni. Un sistema di argini in terra divide la laguna in tre zone gestibili separatamente.


      Il risultato è una zona umida dal ritmo proprio. La gestione imita il ciclo naturale di una laguna
      steppica: si inonda dall'autunno e si asciuga a poco a poco durante l'estate, con appena una quarantina
      di centimetri di profondità media. Nei periodi secchi, parte del letto viene pascolata dalle pecore. La
      Nava si trova nel bacino del Duero, quello del fiume Retortillo, affluente del Valdeginate, che sfocia
      nel Carrión.
    wildlife: >-
      Se la tua passione sono gli uccelli, La Nava è una meta imperdibile. L'inventario della laguna riunisce
      duecentoventidue specie, il quarantuno per cento di quelle presenti in Spagna, e la fonte turistica
      locale parla di quasi la metà. Ma ciò che conta è quando.


      D'inverno, l'oca selvatica: la laguna è la terza area di svernamento più importante della penisola per
      questa oca, con tra diecimila e dodicimila uccelli ogni anno. Nei passi migratori di primavera e autunno
      e nello svernamento, anatidi e limicoli raggiungono picchi fino a ventimila uccelli, e oltre diecimila
      germani reali trascorrono qui l'inverno.


      D'estate, quando quasi tutto si asciuga, La Nava resta uno dei pochi luoghi del paese con condizioni
      favorevoli per gli uccelli acquatici. È il principale sito di nidificazione della Castiglia e León per
      il gabbiano comune e il mignattino piombato, e dall'anno duemila nidifica qui anche l'[airone
      rosso](/especie/ardea_purpurea/). Transitano inoltre il gobbo rugginoso, la
      [spatola](/especie/platalea_leucorodia/), il [tarabuso](/especie/botaurus_stellaris/), il grillaio,
      l'oca lombardella minore e la [cicogna nera](/especie/ciconia_nigra/). Insieme a Villafáfila, è un punto
      chiave per l'[otarda](/especie/otis_tarda/), l'uccello volatore più pesante del mondo, e nel 2012 furono
      censiti millecinquecento esemplari.


      C'è una specie che dà nome a progetti: il [pagliarolo](/especie/acrocephalus_paludicola/), il
      passeriforme più minacciato d'Europa, che qui conta popolazioni. Un progetto LIFE dell'UE, realizzato
      dalla Fundación Global Nature, ha lavorato per la sua conservazione tra il 2002 e il 2006, e oggi il
      progetto Life Paludicola è tuttora in corso.
    visit: >-
      Inizia dalla Casa del Parque de La Nava y Campos de Palencia, a Fuentes de Nava. È un centro visite
      pensato per capire la laguna prima di andare a vederla: pannelli raccontano la storia dell'antico Mar de
      Campos e, manovrando un *chapón*, la paratoia d'irrigazione, si impara come si gestisce la zona umida.
      Una telecamera collegata alla laguna offre immagini in tempo reale, una lente permette di vedere il
      fitoplancton e lo zooplancton di un campione d'acqua, e il Diario della Laguna pubblica i dati
      dell'ultimo censimento degli uccelli. Ci sono anche pannelli interattivi su flora, migrazioni e
      inanellamento scientifico.


      Poi esci verso la laguna. Un sentiero segnalato unisce l'abitato di Mazariegos ai punti di osservazione.
      Da Palencia, il capoluogo provinciale che dista circa venticinque chilometri a sud-est, si arriva con la
      N-610 fino a Mazariegos.
    history: >-
      La Nava è sempre stata un luogo d'acqua e bestiame. Madoz la descriveva come rifugio invernale di oche
      di tre specie, anatre e alzavole, e segnalava che i suoi pascoli mantenevano ogni anno più di ventimila
      capi tra ovini, bovini, muli e cavalli.


      Dopo il prosciugamento del 1968, nel 1990 la Fundación Global Nature e varie amministrazioni iniziarono
      a recuperarla; oggi è una laguna artificiale poco profonda gestita dalla Junta de Castilla y León.
      L'inserimento tra le zone umide Ramsar arrivò nel 2002.


      Le minacce restano: l'eutrofizzazione e l'inquinamento agricolo, e l'accumulo di materia organica dei
      prati a *Carex divisa*, che frena la vegetazione subacquea e viene controllato con sfalcio, fuoco
      controllato e pascolo.
    before: >-
      Il periodo migliore per osservare gli uccelli dipende da ciò che cerchi: l'inverno per l'oca selvatica,
      e primavera e autunno per i passi migratori. La laguna si inonda tra autunno e primavera e si asciuga
      lentamente in estate, quindi il suo aspetto cambia molto a seconda della stagione. Il Diario della
      Laguna della Casa del Parque ti dirà quali uccelli ci sono.
    around: >-
      La Nava non ha vicini prossimi registrati nell'atlante, ma luoghi lontani con cui condivide uccelli e
      paesaggio. Il [Parco Nazionale Fertő-Hanság - Steppa di
      Hanság](/lugar/ferto-hansag-nemzeti-park---hansag/) e il [Parco Nazionale di Hortobágy - La Puszta
      Ungherese](/lugar/hortobagyi-nemzeti-park---puszta/) condividono con essa la zona umida e la steppa, e a
      Hortobágy anche l'otarda e il tarabuso. Il [Parco Nazionale Foce della
      Warta](/lugar/park-narodowy-ujscie-warty/) condivide il pagliarolo e l'oca selvatica, e il [Parco
      Naturale del Delta dell'Ebro](/lugar/parc-natural-del-delta-de-l-ebre/) l'airone rosso e il tarabuso.
  pt:
    intro: >-
      Durante séculos, em pleno coração da meseta cerealífera, houve um mar. Chamava-se Mar de Campos, media
      em média cerca de dois mil e quinhentos hectares e nos anos chuvosos chegava a cinco mil: uma das
      maiores zonas húmidas da península. Drenaram-no, tentativa após tentativa desde os tempos dos Reis
      Católicos, até que em 1968 desapareceu por completo para dar lugar a mais terra de cultivo. Hoje La Nava
      é o que se recuperou daquela lagoa estepária, uma lâmina de água rasa na comarca de Tierra de Campos, no
      sudoeste da província de Palencia, onde todos os anos voltam a pousar gansos, patos, abetardas e garças.
    landscape: >-
      O relevo é plano e dominado pela estepe cerealífera: o espaço natural La Nava y Campos de Palencia
      abrange perto de cinquenta e sete mil hectares de Tierra de Campos. No meio, a lagoa atual ocupa cerca
      de quatrocentos hectares, apenas uma décima parte do que foi o Mar de Campos. A chuva traz muito pouco,
      de modo que o regime da água se controla artificialmente e a água chega na maior parte do Canal de
      Castela, que se desvia para o rio Retortillo e daí, através do ribeiro Carrepadilla, se reparte com
      comportas e sifões. Um sistema de diques de terra divide a lagoa em três zonas que podem ser geridas
      separadamente.


      O resultado é uma zona húmida com ritmo próprio. A gestão imita o ciclo natural de uma lagoa estepária:
      inunda-se desde o outono e seca pouco a pouco durante o verão, com apenas cerca de quarenta centímetros
      de profundidade média. Nos períodos secos, parte do leito é pastoreada por ovelhas. La Nava fica na
      bacia do Douro, a do rio Retortillo, afluente do Valdeginate, que desagua no Carrión.
    wildlife: >-
      Se gostas de aves, La Nava é um lugar de visita obrigatória. O inventário da lagoa reúne duzentas e
      vinte e duas espécies, quarenta e um por cento das que há em Espanha, e a fonte turística local fala de
      quase metade. Mas o que conta é quando.


      No inverno, o ganso-bravo: a lagoa é a terceira zona de invernada mais importante da península para este
      ganso, com entre dez mil e doze mil aves todos os anos. Nas passagens migratórias de primavera e outono
      e na invernada, anatídeos e limícolas atingem máximos de até vinte mil aves, e mais de dez mil
      patos-reais passam aqui o inverno.


      No verão, quando quase tudo seca, La Nava continua a ser um dos poucos lugares do país com condições
      favoráveis para as aves aquáticas. É o principal ponto de criação de Castela e Leão do guincho-comum e
      da gaivina-de-faces-brancas, e desde o ano dois mil cria aqui também a
      [garça-vermelha](/especie/ardea_purpurea/). Passam ainda o pato-de-rabo-alçado, o
      [colhereiro-europeu](/especie/platalea_leucorodia/), o [abetouro-comum](/especie/botaurus_stellaris/), o
      peneireiro-das-torres, o ganso-pequeno e a [cegonha-preta](/especie/ciconia_nigra/). Junto com
      Villafáfila, é um ponto-chave para a [abetarda-comum](/especie/otis_tarda/), a ave voadora mais pesada
      do mundo, e em 2012 recensearam-se mil e quinhentos exemplares.


      Há uma espécie que dá nome a projetos: a [felosa-aquática](/especie/acrocephalus_paludicola/), o
      passeriforme mais ameaçado da Europa, que conta com populações aqui. Um projeto LIFE da UE, levado a
      cabo pela Fundación Global Nature, trabalhou pela sua conservação entre 2002 e 2006, e hoje o projeto
      Life Paludicola continua em curso.
    visit: >-
      Começa pela Casa del Parque de La Nava y Campos de Palencia, em Fuentes de Nava. É um centro de
      visitantes pensado para entender a lagoa antes de ir vê-la: painéis contam a história do antigo Mar de
      Campos e, manobrando um *chapón*, que é a comporta de rega, aprende-se como se gere a zona húmida. Uma
      câmara ligada à lagoa oferece imagem em tempo real, uma lupa permite ver o fitoplâncton e o zooplâncton
      de uma amostra de água, e o Diário da Lagoa publica os dados do último censo de aves. Há também painéis
      interativos sobre flora, migrações e anilhagem científica.


      Depois sai para a lagoa. Um trilho sinalizado liga a localidade de Mazariegos aos postos de observação.
      De Palencia, a capital provincial, que fica a cerca de vinte e cinco quilómetros a sudeste, chega-se
      pela N-610 até Mazariegos.
    history: >-
      La Nava foi sempre um lugar de água e gado. Madoz descrevia-a como refúgio invernal de gansos de três
      classes, patos e marrecos, e assinalava que os seus pastos mantinham todos os anos mais de vinte mil
      cabeças de gado lanígero, bovino, muar e cavalar.


      Após a drenagem de 1968, em 1990 a Fundación Global Nature e várias administrações começaram a
      recuperá-la; hoje é uma lagoa artificial rasa gerida pela Junta de Castilla y León. A inclusão como zona
      húmida Ramsar chegou em 2002.


      As ameaças continuam lá: a eutrofização e a poluição da agricultura, e a acumulação de matéria orgânica
      das pradarias de *Carex divisa*, que trava a vegetação subaquática e se controla com ceifa, queima e
      pastoreio.
    before: >-
      A melhor época para ver aves depende do que procuras: o inverno, para o ganso-bravo, e a primavera e o
      outono para as passagens migratórias. A lagoa inunda-se entre o outono e a primavera e seca pouco a
      pouco no verão, pelo que o seu aspeto muda muito consoante a estação. O Diário da Lagoa da Casa del
      Parque dir-te-á que aves há.
    around: >-
      La Nava não tem vizinhos próximos registados no atlas, mas sim lugares distantes com os quais partilha
      aves e paisagem. O [Parque Nacional Fertő-Hanság - Estepe de
      Hanság](/lugar/ferto-hansag-nemzeti-park---hansag/) e o [Parque Nacional de Hortobágy - A Puszta
      Húngara](/lugar/hortobagyi-nemzeti-park---puszta/) partilham com ela a zona húmida e a estepe, e em
      Hortobágy também a abetarda-comum e o abetouro-comum. O [Parque Nacional Foz do
      Warta](/lugar/park-narodowy-ujscie-warty/) partilha a felosa-aquática e o ganso-bravo, e o [Parque
      Natural do Delta do Ebro](/lugar/parc-natural-del-delta-de-l-ebre/) a garça-vermelha e o abetouro-comum.
