unico:
  es: >-
    Un macizo de gneis cubierto en un 93 % de bosque, un desfiladero que sirve de corredor a las aves
    migratorias y una planta, Gallium baillonii, que se considera endemismo local.
  en: >-
    A gneiss massif 93 % covered in forest, a gorge functioning as a flyway for migratory birds, and Gallium
    baillonii, an endemic plant unique to these crags.
  fr: >-
    Un massif de gneiss boisé à 93 %, un défilé servant de couloir aux oiseaux migrateurs et une plante,
    Gallium baillonii, endémique de ces parois.
  de: >-
    Ein zu 93 % bewaldetes Gneismassiv, ein Durchbruchstal als Zugvogelkorridor und eine Pflanze, Gallium
    baillonii, die als lokaler Endemit gilt.
  it: >-
    Un massiccio di gneiss boscoso al 93 %, un orrido che funge da corridoio per l'avifauna migratrice e una
    pianta, Gallium baillonii, endemica di queste rupi.
  pt: >-
    Um maciço de gnaisse com 93 % de cobertura florestal, um desfiladeiro que serve de corredor a aves
    migratórias e uma planta, Gallium baillonii, endémica destas escarpas.
observaciones:
  es: >-
    La visita solo se permite por los senderos marcados. No se permite el fuego abierto, ni los vehículos a
    motor, las motos de nieve ni las motocicletas, y acampar fuera de las zonas permitidas es una infracción.
texto:
  es:
    intro: >-
      Un río que atraviesa una cordillera y deja a cada lado paredes de gneis casi verticales. El Olt corta
      los Cárpatos Meridionales por el desfiladero que lleva su nombre, y sobre sus orillas se levanta el
      macizo de Cozia: pendientes de gneis tan empinadas que el suelo apenas se forma, cubiertas casi por
      completo de bosque. El Parque Nacional Cozia protege esa mezcla de roca, río y hayedo en el condado de
      Vâlcea, y desde 2017 dos de sus bosques primarios forman parte del sitio de la UNESCO de los hayedos
      primarios de los Cárpatos.
    landscape: >-
      El gneis manda. La parte central del macizo es de grano-gneis con grandes ojos de microclina, el llamado
      gneis de Cozia, que el Olt y sus afluentes han tallado. Las laderas son de pendiente fuerte; en la
      vertiente oriental, sobre el monasterio de Stănişoara, el bosque deja paso a torres, repisas y paredes
      de roca sin vegetación. Esa estructura, junto con el relieve de tipo horst y las pendientes abruptas con
      distintas orientaciones, crea microclimas locales muy variados.


      Los bosques cubren el 93 % de los macizos de Cozia, Narăţu y Doabra-Călineşti, y se escalonan con la
      altura. Mandan el haya (57 %), la picea (18 %) y el roble albar (14 %); el resto es carpe, cerezo, tilo
      y mojdrean. El pico Cozia llega a 1668 m.
    wildlife: >-
      La flor que dio fama científica al macizo es *Gallium baillonii*: la descubrió en 1862 el primer
      botánico que estudió estas plantas, Ulrich Hoffmann, y hoy se considera un endemismo local. Entre los
      hongos, se han identificado más de 402 especies.


      Entre los grandes carnívoros figuran el [oso pardo](/especie/ursus_arctos/), el
      [lobo](/especie/canis_lupus/), el [lince](/especie/lynx_lynx/) y el [gato
      montés](/especie/felis_silvestris/). Entre los herbívoros importantes, el
      [corzo](/especie/capreolus_capreolus/), el [ciervo](/especie/cervus_elaphus/) y el
      [rebeco](/especie/rupicapra_rupicapra/); también hay [marta](/especie/martes_martes/), garduña, tejón,
      ardilla y lirón gris.


      Las aves son la gran sorpresa: se conocen más de 120 especies. El desfiladero del Olt es un corredor
      favorable para la migración entre Europa central y el mar Egeo, y los embalses de Turnu y Gura Lotrului
      permiten que las aves acuáticas se detengan un tiempo e incluso inviernen. Entre las aves del bosque
      están el [urogallo](/especie/tetrao_urogallus/) y el grévol, y junto a los ríos se ven la lavandera
      cascadeña, la lavandera blanca y el [mirlo acuático](/especie/cinclus_cinclus/).


      La [víbora cornuda](/especie/vipera_ammodytes/), protegida por ley por su rareza, y la
      [salamandra](/especie/salamandra_salamandra/) están entre los reptiles y anfibios. En los ríos de
      montaña viven más de 30 especies de peces. Entre los siete invertebrados prioritarios están el [ciervo
      volante](/especie/lucanus_cervus/), el longicornio *Cerambyx cerdo* y la rosalia alpina.
    visit: >-
      Los viajes por la zona de montaña, por senderos marcados y con miradores, son lo más propio del parque;
      los programas son de uno a tres días. Entre los lugares de paisaje destacado figuran el desfiladero del
      Olt, las gargantas de Lotrişor, la cascada Gardului y Bulzul. El parque instaló paneles informativos
      sobre biodiversidad en la ruta hacia la cascada Stănişoara, y las flores silvestres decorativas aparecen
      durante toda la temporada de vegetación.


      Entre las rutas, una sale de la estación de Turnu y sube por Curmătura la Troiță y Muntele Scorțaru
      hasta Cabana Cozia, a 1573 m. Otra parte de Gara Lotru y asciende por Vărateca, Muchia Urzicii y Stâna
      din Rotunda hasta el pico Cozia. Una tercera sube del monasterio de Stănişoara (720 m) por Muchia
      Vlădesei y Durduc hasta la cima, y otra baja desde ella por Curmătura Mocirle y Vf. Omul hasta Pripoare.
      La ruta del castro romano de Arutela al monasterio de Stănișoara termina a 720 m de altitud.
    history: >-
      El macizo de Cozia se declaró reserva natural en 1966, por una decisión del Consejo Regional de Argeş.
      Años después la ley que declaró el parque le dio 17.100 ha, íntegramente en el condado de Vâlcea. Los
      monasterios de la zona son muy antiguos y suelen ser fundaciones de príncipes rumanos.
    before: >-
      La visita solo se permite por los senderos marcados. No se permite el fuego abierto, ni los vehículos a
      motor, las motos de nieve ni las motocicletas, y acampar fuera de las zonas permitidas es una
      infracción.
    around: >-
      A unos 4 km queda el [Parque Nacional Buila-Vânturarița - Garganta del
      Bistrița](/lugar/parcul-national-buila-vanturarita---cheile/). A veintisiete kilómetros están las
      [Montañas de Iezer-Păpușa](/lugar/muntii-iezer-papusa/) y las [Montañas de
      Parâng](/lugar/muntii-parang/), y a veintiocho, la [Reserva forestal de
      Latorița](/lugar/codrul-secular-latorita/) y la [Reserva Natural del Río
      Vâlsan](/lugar/raul-valsan---rezervatia-naturala/). El [Desfiladero del Río
      Olt](/lugar/defileul-oltului/) se solapa con el parque.
  en:
    intro: >-
      A river slicing straight through a mountain range, leaving almost vertical gneiss walls on either bank.
      The Olt severs the Southern Carpathians through the defile bearing its name, and towering above its
      banks rises Mount Cozia: gneiss slopes so steep that soil scarcely clings, cloaked almost entirely in
      forest. Cozia National Park preserves this blend of rock, river, and ancient beech in Vâlcea County, and
      since 2017 two of its primeval forests have formed part of the UNESCO World Heritage serial site for
      primeval beech forests.
    landscape: >-
      Gneiss reigns supreme. The massif's central core consists of granitic gneiss studded with large
      microcline eyes—known as Cozia gneiss—carved out by the Olt and its feeder streams. Slopes rise steeply;
      on the eastern face above Stănişoara Monastery, woodland gives way to sheer towers, ledges, and barren
      cliffs. This rock architecture, combined with a horst structure and varied slope aspects, fosters
      remarkably diverse local microclimates.


      Woodlands cover 93 % of the Cozia, Narăţu, and Doabra-Călineşti massifs, stratified by altitude.
      Dominant species are beech (57 %), Norway spruce (18 %), and sessile oak (14 %); the remainder comprises
      hornbeam, wild cherry, lime, and flowering ash. Mount Cozia reaches an elevation of 1668 m.
    wildlife: >-
      The bloom that brought scientific renown to the massif is *Gallium baillonii*, discovered in 1862 by
      Ulrich Hoffmann, the first botanist to systematically investigate this flora, and today regarded as a
      local endemic. Over 402 species of fungi have been catalogued.


      Large carnivores include the [brown bear](/especie/ursus_arctos/), [grey wolf](/especie/canis_lupus/),
      [Eurasian lynx](/especie/lynx_lynx/), and [European wildcat](/especie/felis_silvestris/). Key herbivores
      encompass the [roe deer](/especie/capreolus_capreolus/), [red deer](/especie/cervus_elaphus/), and
      [chamois](/especie/rupicapra_rupicapra/); [European pine marten](/especie/martes_martes/), stone marten,
      badger, red squirrel, and edible dormouse also reside here.


      Birds offer unexpected richness, with more than 120 species documented. The Olt defile serves as a vital
      migration flyway between Central Europe and the Aegean Sea, while the Turnu and Gura Lotrului reservoirs
      offer stopover and overwintering havens for waterfowl. Forest species include the [western
      capercaillie](/especie/tetrao_urogallus/) and hazel grouse, while mountain watercourses host the grey
      wagtail, white wagtail, and [white-throated dipper](/especie/cinclus_cinclus/).


      The [nose-horned viper](/especie/vipera_ammodytes/), strictly protected by law, and the [fire
      salamander](/especie/salamandra_salamandra/) feature among herpetofauna. Mountain streams support over
      30 fish species. Seven priority invertebrates include the [stag beetle](/especie/lucanus_cervus/), the
      great capricorn beetle *Cerambyx cerdo*, and the alpine longhorn beetle *Rosalia alpina*.
    visit: >-
      Mountain excursions along waymarked trails with sweeping viewpoints define the visitor experience, with
      itineraries ranging from one to three days. Prominent scenic attractions include the Olt defile,
      Lotrişor gorge, Gardului waterfall, and Bulzul rock. The park has erected educational biodiversity
      panels along the path toward Stănişoara waterfall, and wild blooms provide botanical interest throughout
      the growing season.


      Key trails depart from Turnu railway station, ascending via Curmătura la Troiță and Mount Scorțaru to
      Cabana Cozia at 1573 m. Another begins at Gara Lotru, climbing via Vărateca, Muchia Urzicii, and Stâna
      din Rotunda to Cozia peak. A third route climbs from Stănişoara Monastery (720 m) via Muchia Vlădesei
      and Durduc to the summit, while a descent leads from the crest via Curmătura Mocirle and Vf. Omul down
      to Pripoare. The historical path connecting Arutela Roman fort with Stănișoara Monastery concludes at
      720 m elevation.
    history: >-
      The Cozia massif was declared a nature reserve in 1966 through a decision of the Argeş Regional Council.
      Subsequent national park legislation established a protected territory of 17,100 ha entirely within
      Vâlcea County. Monasteries in the valley date back centuries and represent historic foundations by
      Wallachian voivodes.
    before: >-
      Hiking is restricted strictly to marked footpaths. Open fires, motor vehicles, snowmobiles, and
      motorbikes are prohibited, and pitch-camping outside designated campsites constitutes an offence.
    around: >-
      Around 4 km away lies [Buila-Vânturarița National Park - Bistrița
      Gorge](/lugar/parcul-national-buila-vanturarita---cheile/). Twenty-seven kilometres distant stand the
      [Iezer-Păpușa Mountains](/lugar/muntii-iezer-papusa/) and the [Parâng Mountains](/lugar/muntii-parang/),
      and twenty-eight kilometres away are the [Latorița Primeval Forest](/lugar/codrul-secular-latorita/) and
      the [Vâlsan River Nature Reserve](/lugar/raul-valsan---rezervatia-naturala/). The [Olt River
      Defile](/lugar/defileul-oltului/) overlaps with the park.
  fr:
    intro: >-
      Un cours d'eau qui fend une chaîne de montagnes en laissant de part et d'autre des falaises de gneiss
      quasi verticales. L'Olt tranche les Carpates méridionales par le défilé éponyme, et sur ses rives
      s'élèvent les pentes du mont Cozia : des versants si escarpés que la terre y tient à peine, presque
      intégralement tapissés de forêt. Le parc national de Cozia protège ce mariage d'eau, de roche et de
      hêtraies dans le județ de Vâlcea, et depuis 2017 deux de ses forêts primaires sont inscrites au
      patrimoine mondial de l'UNESCO.
    landscape: >-
      Le gneiss dicte sa loi. Le cœur du massif se compose d'œillé granito-gneissique aux larges inclusions de
      microcline, le gneiss dit de Cozia, entaillé par l'Olt et ses ruisseaux. Les pentes sont très fortes ;
      sur le versant oriental au-dessus du monastère de Stănişoara, le boisement s'efface devant des tours,
      des vires et des parois dénudées. Cette géométrie en horst et ces expositions contrastées créent une
      multitude de microclimats locaux.


      Les forêts couvrent 93 % des massifs de Cozia, Narăţu et Doabra-Călineşti, étagées selon la hauteur.
      Dominent le hêtre (57 %), l'épicéa (18 %) et le chêne sessile (14 %) ; le reste rassemble charme,
      merisier, tilleul et frêne à fleurs. Le pic Cozia culmine à 1668 m.
    wildlife: >-
      La fleur qui a fait la réputation scientifique du massif est *Gallium baillonii*, découverte en 1862 par
      le premier botaniste ayant exploré les lieux, Ulrich Hoffmann, et considérée comme une endémique locale.
      Les fongeurs y ont recensé plus de 402 espèces de champignons.


      Les grands carnivores comptent l'[ours brun](/especie/ursus_arctos/), le [loup](/especie/canis_lupus/),
      le [lynx boréal](/especie/lynx_lynx/) et le [chat sauvage](/especie/felis_silvestris/). Parmi les
      ongulés vivent le [chevreuil](/especie/capreolus_capreolus/), le [cerf élaphe](/especie/cervus_elaphus/)
      et le [chamois](/especie/rupicapra_rupicapra/) ; la [martre des pins](/especie/martes_martes/), la
      fouine, le blaireau, l'écureuil et le loir y résident également.


      L'avifaune surprend par sa richesse avec plus de 120 espèces répertoriées. Le défilé de l'Olt forme un
      couloir migratoire majeur entre l'Europe centrale et la mer Égée, et les lacs de retenue de Turnu et
      Gura Lotrului offrent des haltes et des zones d'hivernage aux oiseaux d'eau. Les forêts hébergent le
      [grand tétras](/especie/tetrao_urogallus/) et la gélinotte des bois, tandis que les torrents accueillent
      la bergeronnette des ruisseaux, la bergeronnette grise et le [cincle
      plongeur](/especie/cinclus_cinclus/).


      La [vipère ammodyte](/especie/vipera_ammodytes/), protégée pour sa rareté, et la [salamandre
      tachetée](/especie/salamandra_salamandra/) figurent parmi les amphibiens et reptiles. Les rivières
      abritent plus de 30 espèces de poissons. Sept invertébrés prioritaires comprennent le [lucane
      cerf-volant](/especie/lucanus_cervus/), le grand capricorne *Cerambyx cerdo* et la rosalie des Alpes.
    visit: >-
      Les randonnées en montagne sur sentiers balisés rythmées par de superbes belvédères constituent
      l'activité reine, avec des circuits s'étalant d'un à trois jours. Parmi les curiosités figurent le
      défilé de l'Olt, les gorges de Lotrişor, la cascade Gardului et le Bulzul. Des panneaux d'interprétation
      jalonnent le sentier menant à la cascade Stănişoara, et les floraisons sauvages émaillent toute la
      saison végétative.


      Un sentier part de la gare de Turnu et grimpe par Curmătura la Troiță et Muntele Scorțaru jusqu'au
      refuge Cozia à 1573 m. Un autre démarre à Gara Lotru pour monter par Vărateca, Muchia Urzicii et Stâna
      din Rotunda jusqu'au sommet. Un troisième s'élève depuis le monastère de Stănişoara (720 m) par Muchia
      Vlădesei et Durduc, tandis qu'une descente plonge par Curmătura Mocirle et le pic Omul vers Pripoare. Le
      chemin historique joignant le camp romain d'Arutela au monastère de Stănișoara aboutit à 720 m
      d'altitude.
    history: >-
      Le massif de Cozia fut déclaré réserve naturelle en 1966 par une décision du conseil régional d'Argeş.
      Ultérieurement, la loi créant le parc lui conféra 17 100 ha, situés entièrement dans le județ de Vâlcea.
      Les monastères de la vallée sont très anciens et doivent leur fondation aux princes de Valachie.
    before: >-
      La circulation est strictement réservée aux sentiers balisés. Les feux de camp, véhicules motorisés,
      motoneiges et motos sont formellement prohibés, et le bivouac sauvage est passible d'amende.
    around: >-
      À environ 4 km se dresse le [parc national Buila-Vânturarița - Gorges de la
      Bistrița](/lugar/parcul-national-buila-vanturarita---cheile/). À vingt-sept kilomètres se trouvent les
      [monts Iezer-Păpușa](/lugar/muntii-iezer-papusa/) et les [monts Parâng](/lugar/muntii-parang/), et à
      vingt-huit la [forêt ancienne de Latorița](/lugar/codrul-secular-latorita/) et la [réserve naturelle de
      la rivière Vâlsan](/lugar/raul-valsan---rezervatia-naturala/). Le [défilé de
      l'Olt](/lugar/defileul-oltului/) chevauche le parc.
  de:
    intro: >-
      Ein Fluss durchschneidet ein Gebirge und hinterlässt beiderseits fast senkrechte Gneisabstürze. Der Olt
      bricht in einer nach ihm benannten Schlucht durch die Südkarpaten, und über seinen Ufern ragt das
      Cozia-Massiv auf: Hänge aus Gneisgestein, so steil, dass sich kaum Humus bildet, nahezu lückenlos von
      Wald bedeckt. Der Nationalpark Cozia schützt dieses Zusammenspiel aus Fels, Fluss und Buchenwald im
      Kreis Vâlcea, und seit 2017 gehören zwei seiner Urwälder zum UNESCO-Welterbe der Karpaten-Buchenwälder.
    landscape: >-
      Gneis dominiert das Relief. Der zentrale Gebirgskern besteht aus Augengneis mit markanten
      Mikroklinkristallen – dem Cozia-Gneis –, den der Olt und seine Seitenbäche herauspräpariert haben. Die
      Flanken fallen steil ab; an der Ostseite oberhalb des Klosters Stănişoara weicht der Wald kahlen
      Felstürmen, Bändern und Wänden. Dieser Horstbau und die gegensätzlichen Hangexpositionen erzeugen stark
      differenzierte Lokalklimate.


      Die Wälder bedecken 93 % der Massive Cozia, Narăţu und Doabra-Călineşti und staffeln sich nach
      Höhenstufen. Vorherrschend sind Rotbuche (57 %), Fichte (18 %) und Traubeneiche (14 %); den Rest stellen
      Hainbuche, Vogel-Kirsche, Linde und Manna-Esche. Der Cozia-Gipfel erreicht 1668 m.
    wildlife: >-
      Die botanische Berühmtheit des Massivs ist *Gallium baillonii*, 1862 von Ulrich Hoffmann entdeckt, dem
      ersten Botaniker, der die hiesige Pflanzenwelt erforschte; sie gilt heute als lokaler Endemit. Bei den
      Pilzen wurden über 402 Arten erfasst.


      Unter den Großraubtieren leben [Braunbär](/especie/ursus_arctos/), [Wolf](/especie/canis_lupus/),
      [Eurasischer Luchs](/especie/lynx_lynx/) und [Wildkatze](/especie/felis_silvestris/). Bedeutende
      Pflanzenfresser sind [Reh](/especie/capreolus_capreolus/), [Rothirsch](/especie/cervus_elaphus/) und
      [Gämse](/especie/rupicapra_rupicapra/); ferner kommen [Baummarder](/especie/martes_martes/),
      Steinmarder, Dachs, Eichhörnchen und Siebenschläfer vor.


      Die Vogelwelt verblüfft mit mehr als 120 nachgewiesenen Arten. Der Olt-Durchbruch dient als wichtiger
      Leitkorridor für den Vogelzug zwischen Mitteleuropa und der Ägäis, und die Stauseen Turnu und Gura
      Lotrului bieten Rast- und Überwinterungshabitate für Wasservögel. In den Wäldern leben
      [Auerhuhn](/especie/tetrao_urogallus/) und Haselhuhn; an Gebirgsbächen sieht man Gebirgsstelze,
      Bachstelze und die [Wasseramsel](/especie/cinclus_cinclus/).


      Die gesetzlich geschützte [Europäische Hornotter](/especie/vipera_ammodytes/) und der
      [Feuersalamander](/especie/salamandra_salamandra/) zählen zu den Amphibien und Reptilien. In den
      Bergbächen leben mehr als 30 Fischarten. Unter den sieben prioritären Wirbellosen heben sich
      [Hirschkäfer](/especie/lucanus_cervus/), Großer Eichenbock *Cerambyx cerdo* und Alpenbock hervor.
    visit: >-
      Wanderungen auf markierten Steigen mit aussichtsreichen Felskanzeln bilden das Herzstück des Parks;
      üblich sind Touren von einem bis drei Tagen. Zu den landschaftlichen Höhepunkten zählen das Olt-Tal, die
      Lotrişor-Klamm, der Gardului-Wasserfall und der Bulzul. Entlang des Weges zum Stănişoara-Wasserfall
      informieren Tafeln über die Artenvielfalt, und Bergblumen begleiten die gesamte Wandersaison.


      Eine Route startet am Bahnhof Turnu und steigt über Curmătura la Troiță und Muntele Scorțaru zur Hütte
      Cabana Cozia auf 1573 m empor. Ein anderer Weg beginnt am Bahnhof Lotru und führt über Vărateca, Muchia
      Urzicii und Stâna din Rotunda zum Hauptgipfel. Eine dritte Route steigt vom Kloster Stănişoara (720 m)
      über Muchia Vlădesei und Durduc auf, während ein Abstieg über Curmătura Mocirle und Vf. Omul nach
      Pripoare hinabführt. Der historische Pfad vom Römerkastell Arutela zum Kloster Stănișoara endet auf 720
      m Meereshöhe.
    history: >-
      Das Cozia-Massiv wurde 1966 durch Beschluss des Regionalrats Argeş zum Naturschutzgebiet erklärt. Durch
      das spätere Nationalparkgesetz erhielt es eine Fläche von 17.100 ha, vollständig im Kreis Vâlcea
      gelegen. Die Klöster im Tal blicken auf eine lange Geschichte zurück und wurden meist von Fürsten der
      Walachei gestiftet.
    before: >-
      Das Betreten ist nur auf den markierten Wegen gestattet. Offenes Feuer, Motorfahrzeuge, Schneemobile und
      Motorräder sind verboten; wildes Zelten außerhalb ausgewiesener Plätze wird geahndet.
    around: >-
      Rund 4 km entfernt liegt der [Nationalpark Buila-Vânturarița -
      Bistrița-Klamm](/lugar/parcul-national-buila-vanturarita---cheile/). Siebenundzwanzig Kilometer entfernt
      erheben sich das [Iezer-Păpușa-Gebirge](/lugar/muntii-iezer-papusa/) und das
      [Parâng-Gebirge](/lugar/muntii-parang/), und achtundzwanzig Kilometer entfernt liegen der [Urwald
      Latorița](/lugar/codrul-secular-latorita/) sowie das [Naturreservat
      Vâlsan-Fluss](/lugar/raul-valsan---rezervatia-naturala/). Der [Olt-Durchbruch](/lugar/defileul-oltului/)
      überschneidet sich mit dem Park.
  it:
    intro: >-
      Un fiume che trafigge una catena montuosa lasciando su entrambi i lati scarpate di gneiss quasi
      verticali. L'Olt incide i Carpazi Meridionali attraverso la clusa che ne porta il nome, e sopra i suoi
      argini si erge il massiccio del Cozia: pendii di gneiss così scoscesi che la coltre terrosa attecchisce
      a fatica, quasi totalmente ammantati di selve. Il Parco Nazionale Cozia protegge questa fusione di
      roccia, acqua e faggete nel distretto di Vâlcea, e dal 2017 due delle sue foreste primarie appartengono
      al sito seriale UNESCO delle faggete primarie.
    landscape: >-
      Lo gneiss domina incontrastato. Il settore centrale del rilievo è composto da gneiss occhiadino a grandi
      fenocristalli di microclino, il cosiddetto gneiss di Cozia, intagliato dall'Olt e dai suoi tributari. I
      versanti salgono con forte acclività; sul versante orientale sovrastante il monastero di Stănişoara, il
      bosco lascia il passo a torrioni, balze e pareti nude. Questa conformazione a horst unita a versanti con
      esposizioni contrapposte genera molteplici microclimi stazionali.


      I boschi ricoprono il 93 % dei massicci di Cozia, Narăţu e Doabra-Călineşti, disponendosi per fasce di
      quota. Primeggiano il faggio (57 %), l'abete rosso (18 %) e la rovere (14 %); la quota residua accoglie
      carpino bianco, ciliegio selvatico, tiglio e orniello. La cima del Cozia tocca i 1668 m.
    wildlife: >-
      La specie floristica che conferì notorietà scientifica al massiccio è *Gallium baillonii*, rinvenuta nel
      1862 dal pioniere delle indagini botaniche locali Ulrich Hoffmann, e reputata oggi endemismo esclusivo.
      I rilievi micologici annoverano oltre 402 specie di funghi.


      Tra i grandi mammiferi predatori compaiono l'[orso bruno](/especie/ursus_arctos/), il [lupo
      grigio](/especie/canis_lupus/), la [lince](/especie/lynx_lynx/) e il [gatto
      selvatico](/especie/felis_silvestris/). Gli erbivori di spicco includono il
      [capriolo](/especie/capreolus_capreolus/), il [cervo](/especie/cervus_elaphus/) e il [camoscio
      alpino](/especie/rupicapra_rupicapra/); allignano pure la [martora](/especie/martes_martes/), la faina,
      il tasso, lo scoiattolo e il ghiro.


      L'avifauna riserva notevole varietà con oltre 120 specie documentate. La gola dell'Olt costituisce un
      canale migratorio ideale tra l'Europa centrale e l'Egeo, e i bacini artificiali di Turnu e Gura Lotrului
      offrono sosta e rifugio invernale agli uccelli acquatici. Tra le specie forestali nidificano
      l'[urogallo](/especie/tetrao_urogallus/) e il francolino di monte, mentre i torrenti sono animati da
      ballerina gialla, ballerina bianca e dal [merlo acquaiolo](/especie/cinclus_cinclus/).


      La [vipera dal corno](/especie/vipera_ammodytes/), protetta per la sua rarità, e la [salamandra
      pezzata](/especie/salamandra_salamandra/) spiccano tra anfibi e rettili. I corsi d'acqua montani
      ospitano oltre 30 specie ittiche. Sette invertebrati prioritari comprendono il [cervo
      volante](/especie/lucanus_cervus/), il cerambice delle querce *Cerambyx cerdo* e la rosalia alpina.
    visit: >-
      Le ascensioni lungo i sentieri segnati provvisti di punti panoramici costituiscono il fulcro della
      visita, con programmi articolati da uno a tre giorni. Tra le mete paesaggistiche risaltano la gola
      dell'Olt, le gole di Lotrişor, la cascata Gardului e il Bulzul. Bacheche tematiche sulla biodiversità
      costeggiano il tracciato verso la cascata Stănişoara, e i fiori rupestri arricchiscono il cammino per
      l'intera bella stagione.


      Tra gli itinerari, uno muove dalla stazione di Turnu salendo per Curmătura la Troiță e Muntele Scorțaru
      fino al rifugio Cabana Cozia a 1573 m. Un'altra via parte da Gara Lotru e ascende per Vărateca, Muchia
      Urzicii e Stâna din Rotunda fino alla vetta. Un terzo sentiero sale dal monastero di Stănişoara (720 m)
      per Muchia Vlădesei e Durduc, mentre un tracciato di discesa scende per Curmătura Mocirle e Vf. Omul
      verso Pripoare. La mulattiera storica dal castrum romano di Arutela al monastero di Stănișoara termina a
      720 m di quota.
    history: >-
      Il massiccio di Cozia fu dichiarato riserva naturale nel 1966 con delibera del consiglio regionale di
      Argeş. La successiva legge istitutiva del parco nazionale gli assegnò 17.100 ha, interamente compresi
      nel distretto di Vâlcea. I cenobi della vallata vantano origini vetuste legate ai principi della
      Valacchia.
    before: >-
      L'accesso è consentito unicamente lungo i tracciati segnati. Sono vietati i fuochi liberi, i veicoli a
      motore, le motoslitte e le moto; il campeggio abusivo fuori dalle aree destinate è punito a norma di
      regolamento.
    around: >-
      A circa 4 km sorge il [Parco Nazionale Buila-Vânturarița - Gola del
      Bistrița](/lugar/parcul-national-buila-vanturarita---cheile/). A ventisette chilometri si ergono i
      [Monti Iezer-Păpușa](/lugar/muntii-iezer-papusa/) e i [Monti di Parâng](/lugar/muntii-parang/), e a
      ventotto la [Foresta Primaria di Latorița](/lugar/codrul-secular-latorita/) e la [Riserva Naturale del
      Fiume Vâlsan](/lugar/raul-valsan---rezervatia-naturala/). La [Gola dell'Olt](/lugar/defileul-oltului/)
      si sovrappone al perimetro del parco.
  pt:
    intro: >-
      Um rio que corta de alto a baixo uma cordilheira montanhosa deixando de cada lado escarpas de gnaisse
      quase verticais. O Olt sulca os Cárpatos Meridionais através do desfiladeiro com o seu nome, erguendo-se
      sobre as margens o maciço de Cozia: vertentes de gnaisse tão declivosas que o solo mal se fixa, cobertas
      quase por completo por arvoredo. O Parque Nacional de Cozia tutela essa combinação de rocha, rio e
      fagetos no distrito de Vâlcea, e desde 2017 duas das suas matas primárias integram o sítio de fagetos
      primários da UNESCO.
    landscape: >-
      O gnaisse assume o papel principal. O núcleo central do maciço é composto por gnaisse ocelado com
      grandes cristais de microclina, o chamado gnaisse de Cozia, esculpido pelo Olt e seus afluentes. As
      encostas exibem declives acentuados; na vertente oriental, acima do mosteiro de Stănişoara, o bosque
      cede lugar a torres, socalcos e escarpas rochosas desprovidas de vegetação. Essa estrutura em horst e as
      exposições solares contrastantes criam microclimas locais bastante variados.


      As florestas cobrem 93 % dos maciços de Cozia, Narăţu e Doabra-Călineşti, distribuindo-se por pisos
      altitudinais. Dominam a faia (57 %), o espruce (18 %) e o carvalho-séssil (14 %); a fração restante
      reúne carpa-branca, cerejeira-brava, tília e freixo-de-flores. O pico Cozia culmina a 1668 m.
    wildlife: >-
      A espécie botânica que trouxe projeção científica ao maciço é *Gallium baillonii*, descoberta em 1862
      pelo pioneiro botânico Ulrich Hoffmann, sendo hoje tida como endemismo estrito. A micologia inventaria
      mais de 402 espécies de fungos.


      Entre os grandes predadores figuram o [urso-pardo](/especie/ursus_arctos/), o
      [lobo-cinzento](/especie/canis_lupus/), o [lince-euroasiático](/especie/lynx_lynx/) e o
      [gato-bravo](/especie/felis_silvestris/). Nos herbívoros relevantes surgem a
      [corça](/especie/capreolus_capreolus/), o [veado-vermelho](/especie/cervus_elaphus/) e a
      [camurça](/especie/rupicapra_rupicapra/); encontram-se também a [marta do pinheiro
      europeia](/especie/martes_martes/), a fuinha, o texugo, o esquilo e o arganaz.


      A avifauna revela extraordinária diversidade com mais de 120 espécies inventariadas. O desfiladeiro do
      Olt constitui um corredor primordial de migração entre a Europa central e o mar Egeu, e as albufeiras de
      Turnu e Gura Lotrului acolhem e permitem a invernada de aves aquáticas. Nas matas nidificam o
      [tetraz-grande](/especie/tetrao_urogallus/) e a galinha-do-mato, enquanto as correntes de montanha
      recebem a alvéola-cinzenta, a alvéola-branca e o [melro-d'água](/especie/cinclus_cinclus/).


      A [víbora-cornuda](/especie/vipera_ammodytes/), protegida por lei pela sua raridade, e a
      [salamandra-de-fogo](/especie/salamandra_salamandra/) despontam entre répteis e anfíbios. As ribeiras
      albergam mais de 30 espécies piscícolas. Sete invertebrados de conservação prioritária incluem a
      [vaca-loura](/especie/lucanus_cervus/), o cerambicídeo *Cerambyx cerdo* e a rosalia-alpina.
    visit: >-
      As travessias em terreno montanhoso ao longo de veredas sinalizadas com miradouros constituem o
      atractivo cimeiro do parque, desenhando-se programas de um a três dias. Entre os locais mais marcantes
      sobressaem a garganta do Olt, as ravinas de Lotrişor, a queda de água de Gardului e o Bulzul. Painéis
      interpretativos abordam a biodiversidade na rota para a cascata de Stănişoara, com florações campestres
      contínuas durante toda a época estival.


      Entre os percursos, um parte da estação ferroviária de Turnu e ascende por Curmătura la Troiță e Muntele
      Scorțaru até à Cabana Cozia a 1573 m. Outro arranca de Gara Lotru, galgando terreno por Vărateca, Muchia
      Urzicii e Stâna din Rotunda até ao topo de Cozia. Uma terceira alternativa parte do mosteiro de
      Stănişoara (720 m) por Muchia Vlădesei e Durduc, enquanto um trilho de descida desce por Curmătura
      Mocirle e Vf. Omul até Pripoare. A via histórica que une o castro romano de Arutela ao mosteiro de
      Stănișoara conclui-se a 720 m de altitude.
    history: >-
      O maciço de Cozia foi classificado como reserva natural em 1966 por despacho do Conselho Regional de
      Argeş. A legislação subsequente que criou o parque atribuiu-lhe 17.100 ha, situados integralmente no
      distrito de Vâlcea. Os mosteiros da zona têm raízes seculares e foram mandados erguer por príncipes
      romenos.
    before: >-
      A circulação só é consentida em trilhos marcados. É vedado atear fogueiras em espaço aberto, circular
      com viaturas motorizadas, motos de neve ou motociclos, sendo punido acampar fora das zonas designadas.
    around: >-
      A cerca de 4 km ergue-se o [Parque Nacional Buila-Vânturarița - Desfiladeiro do
      Bistrița](/lugar/parcul-national-buila-vanturarita---cheile/). A vinte e sete quilómetros situam-se as
      [Montanhas de Iezer-Păpușa](/lugar/muntii-iezer-papusa/) e as [Montanhas de
      Parâng](/lugar/muntii-parang/), e a vinte e oito a [Reserva Florestal de
      Latorița](/lugar/codrul-secular-latorita/) e a [Reserva Natural do Rio
      Vâlsan](/lugar/raul-valsan---rezervatia-naturala/). O [Desfiladeiro do Rio
      Olt](/lugar/defileul-oltului/) sobrepõe-se à área protegida.
