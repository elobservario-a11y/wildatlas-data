  es: Montañas calizas y brecha del río Olt cubiertas de hayedos vírgenes y robledales de altitud.
  en: Limestone crags and the Olt River gorge cloaked in virgin beech forests and high-altitude oak groves.
  fr: Reliefs calcaires et cluse de l'Olt tapissés de hêtraies vierges et de chênaies d'altitude.
