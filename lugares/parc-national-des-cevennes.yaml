resumen:
  es: >-
    Mesetas calcáreas (causses), montes graníticos y valles de castaño con buitres reintroducidos: un paisaje
    de pastoreo protegido como parque nacional habitado.
  en: >-
    Limestone plateaus (causses), granite uplands and chestnut valleys with reintroduced vultures: a pastoral
    landscape protected as an inhabited national park.
  fr: >-
    Plateaux calcaires (causses), massifs granitiques et vallées de châtaigniers avec des vautours
    réintroduits : un paysage pastoral protégé comme parc national habité.
  de: >-
    Kalksteinplateaus (Causses), Granitberge und Kastanienwälder mit wiederangesiedelten Geiern: eine von
    Menschen bewohnte Kulturlandschaft als Nationalpark.
  it: >-
    Altopiani calcarei (causses), monti granitici e valli di castagni con avvoltoi reintrodotti: un paesaggio
    pastorale protetto come parco nazionale abitato.
  pt: >-
    Planaltos calcários (causses), montes graníticos e vales de castanheiro com abutres reintroduzidos: uma
    paisagem pastoril protegida como parque nacional habitado.
unico:
  es: >-
    Es el parque nacional donde viven y trabajan los habitantes del núcleo, de modo que los bancales, los
    castañares y las gargantas son a la vez naturaleza y obra humana, con un cielo que es la mayor reserva de
    cielo estrellado de Europa.
  en: >-
    The national park where residents live and work, so the terraces, chestnut groves and gorges are both
    nature and human work, under the largest International Dark Sky Reserve in Europe.
  fr: >-
    Le parc national où les habitants vivent et travaillent, si bien que les restanques, les châtaigneraies et
    les gorges sont à la fois nature et œuvre humaine, sous le plus grand ciel étoilé d'Europe.
  de: >-
    Der Nationalpark, in dem Einwohner leben und arbeiten, sodass Terrassen, Kastanienhaine und Schluchten
    zugleich Natur und Menschenwerk sind — unter dem größten Internationalen Sternenpark Europas.
  it: >-
    Il parco nazionale dove vivono e lavorano gli abitanti, cosicché i terrazzamenti, i castagneti e le gole
    sono al tempo stesso natura e opera umana, sotto la più grande Riserva Internazionale di Cielo Stellato
    d'Europa.
  pt: >-
    O parque nacional onde vivem e trabalham os habitantes, de modo que os socalcos, os soutos e os canhões
    são ao mesmo tempo natureza e obra humana, sob o maior Reserva Internacional de Céu Estrelado da Europa.
observaciones:
  es: >-
    La red de carreteras es sinuosa y estrecha, de modo que mide las distancias en tiempo, no en kilómetros.
    Algunos puertos y carreteras cierran en invierno, y el parque recomienda el coche para moverse.
texto:
  es:
    intro: >-
      En 1879, un escocés con un burro tardó doce días en cruzar la Lozère: 195 km. Robert Louis Stevenson lo
      contó en «Viaje con un burro por las Cevenas», y su ruta es hoy el GR70. El Parque Nacional de las
      Cévennes, creado por decreto el 2 de septiembre de 1970 como cuarto parque nacional francés tras la
      Vanoise, Port-Cros y los Pirineos Occidentales, es el único de media montaña del país y el único de la
      Francia metropolitana cuyo núcleo tiene residentes permanentes, sobre todo agricultores. Aquí la
      naturaleza y la gente cuidan el paisaje juntas, y la sede está en el castillo de Florac.
    landscape: >-
      El parque es un territorio de media montaña con cuatro entidades: el macizo del Aigoual, el causse
      Méjean con las gargantas del Tarn y del Jonte, el monte Lozère y los valles cevenoles. Al oeste se
      extienden los Grands Causses, mesetas calizas; al este, los valles cevenoles de esquisto, cortados en
      pendientes empinadas; al norte, el granítico monte Lozère. Los granitos, más resistentes a la erosión,
      forman las cumbres más altas; el Aigoual y el monte Lozère tienen unos 300 millones de años. La altitud
      va de 117 m en Anduze a 1.699 m en el Finiels, la cima del Lozère, y la vegetación pasa del piso
      mesomediterráneo en las gargantas del suroeste al subalpino en lo alto del Lozère. Las gargantas del
      Tarn y del Jonte tienen acantilados «en dientes de sierra» que caen 500 o 600 m en paredes casi
      verticales.


      El agua y el cielo hacen el resto. Las precipitaciones pasan de unos 1.100 mm en Alès a más de 2.000 mm
      en el monte Lozère, casi 1.000 mm de diferencia en una treintena de kilómetros. En los llamados
      episodios cevenoles caen lluvias diluvianas con tormentas muy localizadas, porque el aire frío del
      Atlántico choca con el aire cálido del Mediterráneo. El parque está a caballo entre la cuenca de la
      Garona, hacia el Atlántico, y las del Ródano y otros pequeños ríos, hacia el Mediterráneo. El bosque
      cubre más del 70 % del territorio, y los castañares en monte bajo, de antiguas huertas, son emblema del
      paisaje.
    wildlife: >-
      Hay unos 70 mamíferos, 195 aves (135 nidificantes), 16 anfibios, 15 reptiles y 23 peces. Pero la escena
      del año ocurre a principios de otoño. A mediados de septiembre, al caer la noche, un bramido ronco
      resuena en los bosques: es la berrea del [ciervo](/especie/cervus_elaphus/). El parque tiene numerosos
      lugares de berrea, septiembre y octubre son la época privilegiada y suele ser más intensa al alba o al
      anochecer. La berrea se escucha más de lo que se ve, así que quédate en pistas y senderos autorizados,
      no uses fuentes de luz, lleva prismáticos y colócate a favor del viento. Septiembre y octubre también
      son época de caza: comprueba que el lugar al que vas no tiene una batida.


      En las gargantas viven tres buitres: el [buitre leonado](/especie/gyps_fulvus/), el [buitre
      negro](/especie/aegypius_monachus/) y el [alimoche](/especie/neophron_percnopterus/), reintroducidos
      desde 1980 por el parque con la LPO. Crían de buen grado en el curso bajo de las gargantas del Jonte,
      cerca de Le Rozier, donde la «Maison des vautours» permite verlos en directo desde un mirador. Y en los
      bosques, la nóctulo gigante, el mayor murciélago de Europa, ha pasado de «sospechada» en un solo macizo
      a conocerse en tres poblaciones, sobre todo machos, que duermen en árboles viejos y huecos, en especial
      las cavidades que excava el [pito negro](/especie/dryocopus_martius/) en las hayas.
    visit: >-
      El parque cuenta con unos 5.000 km de senderos señalizados: cerca de 300 itinerarios en bucle de media
      jornada o menos, con 8,5 km de media, y 43 senderos de descubrimiento cortos y accesibles para toda la
      familia. También hay 62 circuitos de BTT de todos los niveles, 500 km de pistas, en torno al Aigoual y a
      Florac-Sud Lozère. Para las grandes travesías están los GR, empezando por el camino de Stevenson.


      La mayoría de los senderos cruzan propiedad privada, así que no te salgas de los caminos señalizados. Y
      una petición concreta: los bastones degradan el suelo; usa contera de goma o bastones sin punta
      metálica.


      Para orientarte, las maisons du tourisme et du Parc reúnen la acogida del parque y la oficina de
      turismo, con asesoramiento sobre senderos de descubrimiento, museos y salidas; tienen exposición
      permanente en Florac y en La Serreyrède, en el Aigoual. Y levanta la vista: el parque obtuvo el 13 de
      agosto de 2018 la etiqueta de Reserva Internacional de Cielo Estrellado, la mayor de Europa, y la Vía
      Láctea se ve a simple vista, algo imposible para más de un tercio de la población mundial.
    history: >-
      Las Cevenas fueron cuna de la insurrección de los camisardos tras la revocación del edicto de Nantes, y
      el Rouve Bas, en Saint-André-de-Lancize, les dedica una exposición permanente. El parque nació de un
      pacto con los habitantes: los contratos Mazerot pagaban a los agricultores por mantener muretes,
      bancales y canales de riego, para evitar el despoblamiento. El núcleo se rige por una reglamentación
      específica fijada por el decreto 2009-1677, que se delimita con paneles en carreteras y senderos y con
      una banda verde en los mapas IGN.
    before: >-
      La red de carreteras es sinuosa y estrecha, de modo que mide las distancias en tiempo, no en kilómetros.
      Algunos puertos y carreteras cierran en invierno, y el parque recomienda el coche para moverse.
    around: >-
      En el propio parque, las [Gorges du Tarn](/lugar/gorges-du-tarn/) quedan a 0 km y las [Gorges de la
      Jonte](/lugar/gorges-de-la-jonte/), a 3 km. Más lejos, comparte buitres con el [Parc Natural dels
      Ports](/lugar/parc-natural-dels-ports/), el [Parc Naturel Régional du Verdon -
      Gorges](/lugar/parc-naturel-regional-du-verdon---gorges/),
      [Monfragüe](/lugar/parque-nacional-de-monfrague/) y el [Parque Nacional Forestal de
      Dadia-Lefkimi-Soufli](/lugar/parque-nacional-forestal-de-dadia-lefkimi-soufli/).
  en:
    intro: >-
      In 1879, a Scotsman with a donkey took twelve days to cross the Lozère: 195 km. Robert Louis Stevenson
      told the story in «Travels with a Donkey in the Cévennes», and his route is today the GR70. The Cévennes
      National Park, created by decree on 2 September 1970 as the fourth French national park after the
      Vanoise, Port-Cros and the Western Pyrenees, is the only mid-mountain park in the country and the only
      one in metropolitan France whose core has permanent residents, mostly farmers. Here nature and people
      care for the landscape together, and the headquarters is in the castle of Florac.
    landscape: >-
      The park is a mid-mountain territory with four units: the Aigoual massif, the Causse Méjean with the
      Tarn and Jonte gorges, Mont Lozère and the Cévennes valleys. To the west stretch the Grands Causses,
      limestone plateaus; to the east, the schistose Cévennes valleys, cut into steep slopes; to the north,
      the granite Mont Lozère. The granites, more resistant to erosion, form the highest summits; the Aigoual
      and Mont Lozère are about 300 million years old. The altitude ranges from 117 m at Anduze to 1,699 m at
      Finiels, the summit of Lozère, and the vegetation shifts from the meso-Mediterranean floor in the
      south-western gorges to the subalpine at the top of Lozère. The Tarn and Jonte gorges have «serrated»
      cliffs falling 500 or 600 m in near-vertical walls.


      Water and sky do the rest. Rainfall ranges from about 1,100 mm at Alès to more than 2,000 mm on Mont
      Lozère, nearly 1,000 mm of difference in a span of roughly thirty kilometres. In what are called
      Cévennes episodes, torrential rain falls in highly localised thunderstorms, as cold Atlantic air
      collides with warm Mediterranean air. The park straddles the Garonne basin, towards the Atlantic, and
      those of the Rhône and other small rivers, towards the Mediterranean. Forest covers more than 70 % of
      the territory, and coppiced chestnut groves from old orchards are the emblem of the landscape.
    wildlife: >-
      There are about 70 mammals, 195 birds (135 breeding), 16 amphibians, 15 reptiles and 23 fish. But the
      scene of the year comes at the beginning of autumn. In mid-September, as night falls, a hoarse roar
      resounds in the forests: the rut of the [red deer](/especie/cervus_elaphus/). The park has numerous
      rutting sites, September and October are the prime season, and the calls are usually most intense at
      dawn and dusk. The rut is heard more than seen, so stay on authorised tracks and paths, use no light
      sources, bring binoculars and position yourself downwind. September and October are also hunting season:
      check that the place you are heading to has no driven hunt.


      In the gorges live three vultures: the [griffon vulture](/especie/gyps_fulvus/), the [black
      vulture](/especie/aegypius_monachus/) and the [Egyptian vulture](/especie/neophron_percnopterus/),
      reintroduced since 1980 by the park with the LPO. They breed happily in the lower reaches of the Jonte
      gorge, near Le Rozier, where the «Maison des vautours» allows close viewing from a lookout. And in the
      forests, the greater noctule bat, the largest in Europe, has gone from «suspected» in a single massif to
      being known in three populations, mostly males, sleeping in old hollow trees, especially the cavities
      excavated by the [black woodpecker](/especie/dryocopus_martius/) in beeches.
    visit: >-
      The park has about 5,000 km of marked trails: nearly 300 loop routes of half a day or less, averaging
      8.5 km, and 43 short, accessible discovery trails for all the family. There are also 62 mountain-bike
      circuits at all levels, and some 500 km of tracks around the Aigoual and Florac-Sud Lozère. For
      long-distance routes, the GR trails start with the Stevenson Way.


      Most trails cross private land, so stay on the marked paths. And a specific request: trekking poles
      degrade the soil; use rubber tips or poles without metal points.


      For orientation, the maisons du tourisme et du Parc combine park visitor services and tourist office,
      with advice on discovery trails, museums and outings; they have permanent displays at Florac and at La
      Serreyrède on the Aigoual. And look up: the park received the International Dark Sky Reserve label on 13
      August 2018, the largest in Europe, and the Milky Way is visible to the naked eye, something impossible
      for more than a third of the world's population.
    history: >-
      The Cévennes were the cradle of the Camisard uprising after the revocation of the Edict of Nantes, and
      the Rouve Bas, in Saint-André-de-Lancize, has a permanent exhibition dedicated to them. The park was
      born of a pact with residents: the Mazerot contracts paid farmers to maintain dry-stone walls, terraces
      and irrigation channels, to prevent depopulation. The core is governed by specific regulations set by
      decree 2009-1677, demarcated by panels on roads and paths and a green band on IGN maps.
    before: >-
      The road network is winding and narrow, so measure distances in time, not kilometres. Some passes and
      roads close in winter, and the park recommends the car for getting around.
    around: >-
      Within the park itself, the [Gorges du Tarn](/lugar/gorges-du-tarn/) are 0 km away and the [Gorges de la
      Jonte](/lugar/gorges-de-la-jonte/) are 3 km away. Further afield, the park shares vultures with the
      [Ports Natural Park](/lugar/parc-natural-dels-ports/), the [Verdon Regional Nature
      Park](/lugar/parc-naturel-regional-du-verdon---gorges/),
      [Monfragüe](/lugar/parque-nacional-de-monfrague/) and the [Dadia-Lefkimi-Soufli Forest National
      Park](/lugar/parque-nacional-forestal-de-dadia-lefkimi-soufli/).
  fr:
    intro: >-
      En 1879, un Écossais avec un âne a mis douze jours à traverser la Lozère : 195 km. Robert Louis
      Stevenson l'a raconté dans «Voyage avec un âne dans les Cévennes», et son itinéraire est aujourd'hui le
      GR70. Le Parc National des Cévennes, créé par décret le 2 septembre 1970 en tant que quatrième parc
      national français après la Vanoise, Port-Cros et les Pyrénées Occidentales, est le seul de moyenne
      montagne du pays et le seul de la France métropolitaine dont le cœur compte des résidents permanents,
      surtout des agriculteurs. Ici la nature et les habitants s'occupent du paysage ensemble, et le siège est
      au château de Florac.
    landscape: >-
      Le parc est un territoire de moyenne montagne avec quatre entités : le massif de l'Aigoual, le Causse
      Méjean avec les gorges du Tarn et de la Jonte, le mont Lozère et les vallées cévenoles. À l'ouest
      s'étendent les Grands Causses, plateaux calcaires ; à l'est, les vallées cévenoles de schiste, taillées
      en pentes raides ; au nord, le mont Lozère granitique. Les granites, plus résistants à l'érosion,
      forment les sommets les plus élevés ; l'Aigoual et le mont Lozère ont environ 300 millions d'années.
      L'altitude va de 117 m à Anduze à 1 699 m au Finiels, le sommet du Lozère, et la végétation passe du
      piso méso-méditerranéen dans les gorges du sud-ouest au subalpin au sommet du Lozère. Les gorges du Tarn
      et de la Jonte ont des falaises «en dents de scie» qui chutent de 500 à 600 m en parois quasi
      verticales.


      L'eau et le ciel font le reste. Les précipitations passent d'environ 1 100 mm à Alès à plus de 2 000 mm
      sur le mont Lozère, près de 1 000 mm de différence sur une trentaine de kilomètres. Dans les épisodes
      cévenols tombent des pluies diluviennes avec des orages très localisés, car l'air froid de l'Atlantique
      heurte l'air chaud de la Méditerranée. Le parc est à cheval entre le bassin de la Garonne, vers
      l'Atlantique, et ceux du Rhône et de petites rivières, vers la Méditerranée. La forêt couvre plus de 70
      % du territoire, et les châtaigneraies en taillis, d'anciens vergers, sont l'emblème du paysage.
    wildlife: >-
      Il y a environ 70 mammifères, 195 oiseaux (135 nicheurs), 16 amphibiens, 15 reptiles et 23 poissons.
      Mais la scène de l'année a lieu au début de l'automne. À la mi-septembre, à la tombée de la nuit, un
      bramement rauque retentit dans les forêts : c'est le brame du [cerf élaphe](/especie/cervus_elaphus/).
      Le parc compte de nombreux lieux de brame, septembre et octobre sont la saison privilégiée et il est
      souvent plus intense à l'aube ou au crépuscule. Le brame s'entend plus qu'il ne se voit, alors restez
      sur les pistes et sentiers autorisés, n'utilisez pas de source lumineuse, emportez des jumelles et
      placez-vous face au vent. Septembre et octobre sont aussi la saison de la chasse : vérifiez que
      l'endroit où vous allez n'est pas concerné par une battue.


      Dans les gorges vivent trois vautours : le [vautour fauve](/especie/gyps_fulvus/), le [vautour
      moine](/especie/aegypius_monachus/) et le [percnoptère d'Égypte](/especie/neophron_percnopterus/),
      réintroduits depuis 1980 par le parc avec la LPO. Ils nichent volontiers dans le bas des gorges de la
      Jonte, près du Rozier, où la «Maison des vautours» permet de les observer en direct depuis un belvédère.
      Et dans les forêts, la noctule géante, la plus grande chauve-souris d'Europe, est passée de «soupçonnée»
      dans un seul massif à connue dans trois populations, surtout des mâles, qui dorment dans de vieux arbres
      creux, en particulier les cavités creusées par le [pic noir](/especie/dryocopus_martius/) dans les
      hêtres.
    visit: >-
      Le parc compte environ 5 000 km de sentiers balisés : près de 300 itinéraires en boucle d'une
      demi-journée ou moins, avec 8,5 km de moyenne, et 43 courts sentiers de découverte accessibles à toute
      la famille. Il y a aussi 62 circuits de VTT de tous niveaux et quelque 500 km de pistes autour de
      l'Aigoual et de Florac-Sud Lozère. Pour les grandes traversées, les GR commencent par le chemin de
      Stevenson.


      La plupart des sentiers traversent des propriétés privées, donc ne quittez pas les chemins balisés. Et
      une demande concrète : les bâtons dégradent le sol ; utilisez des embouts en caoutchouc ou des bâtons
      sans pointe métallique.


      Pour vous orienter, les maisons du tourisme et du Parc réunissent l'accueil du parc et l'office de
      tourisme, avec des conseils sur les sentiers de découverte, les musées et les sorties ; elles ont une
      exposition permanente à Florac et à La Serreyrède, sur l'Aigoual. Et levez les yeux : le parc a obtenu
      le 13 août 2018 le label Réserve Internationale de Ciel Étoilé, la plus grande d'Europe, et la Voie
      lactée est visible à l'œil nu, ce qui est impossible pour plus d'un tiers de la population mondiale.
    history: >-
      Les Cévennes furent le berceau de l'insurrection des camisards après la révocation de l'édit de Nantes,
      et le Rouve Bas, à Saint-André-de-Lancize, leur consacre une exposition permanente. Le parc est né d'un
      pacte avec les habitants : les contrats Mazerot payaient les agriculteurs pour entretenir murets,
      restanques et canaux d'irrigation, pour éviter le dépeuplement. Le cœur est régi par une réglementation
      spécifique fixée par le décret 2009-1677, délimité par des panneaux sur les routes et les sentiers et
      par une bande verte sur les cartes IGN.
    before: >-
      Le réseau routier est sinueux et étroit, donc mesurez les distances en temps, pas en kilomètres.
      Certains cols et routes ferment en hiver, et le parc recommande la voiture pour se déplacer.
    around: >-
      Dans le parc même, les [Gorges du Tarn](/lugar/gorges-du-tarn/) sont à 0 km et les [Gorges de la
      Jonte](/lugar/gorges-de-la-jonte/) à 3 km. Plus loin, le parc partage des vautours avec le [Parc naturel
      dels Ports](/lugar/parc-natural-dels-ports/), le [Parc naturel régional du
      Verdon](/lugar/parc-naturel-regional-du-verdon---gorges/),
      [Monfragüe](/lugar/parque-nacional-de-monfrague/) et le [Parc national forestier de
      Dadia-Lefkimi-Soufli](/lugar/parque-nacional-forestal-de-dadia-lefkimi-soufli/).
  de:
    intro: >-
      Im Jahr 1879 brauchte ein Schotte mit einem Esel zwölf Tage, um die Lozère zu durchqueren: 195 km.
      Robert Louis Stevenson schilderte das in «Reise mit einem Esel durch die Cevennen», und seine Route ist
      heute der GR70. Der Nationalpark Cevennen, per Dekret am 2. September 1970 als vierter französischer
      Nationalpark nach der Vanoise, Port-Cros und den Westpyrenäen gegründet, ist der einzige
      Mittelgebirgs-Nationalpark des Landes und der einzige in Frankreich, dessen Kernzone dauerhaft bewohnt
      ist, vor allem von Landwirten. Hier pflegen Natur und Menschen gemeinsam die Landschaft, und das
      Hauptquartier liegt im Schloss von Florac.
    landscape: >-
      Der Park ist ein Mittelgebirge mit vier Einheiten: dem Aigoual-Massiv, dem Causse Méjean mit den Tarn-
      und Jonte-Schluchten, dem Mont Lozère und den Cevennen-Tälern. Im Westen erstrecken sich die Grands
      Causses, Kalksteinplateaus; im Osten die Schiefer-Cevennen-Täler, in steile Hänge geschnitten; im Norden
      das granitene Mont Lozère. Die Granite, erosionsbeständiger, bilden die höchsten Gipfel; Aigoual und
      Mont Lozère sind etwa 300 Millionen Jahre alt. Die Höhe reicht von 117 m in Anduze bis 1 699 m am
      Finiels, dem Gipfel des Lozère, und die Vegetation wechselt von der meso-mediterranen Stufe in den
      Schluchten des Südwestens bis zur subalpinen auf dem Mont Lozère. Die Tarn- und Jonte-Schluchten haben
      «sägezahnförmige» Steilwände, die 500 bis 600 m in nahezu senkrechten Wänden abstürzen.


      Wasser und Himmel tun den Rest. Der Niederschlag steigt von rund 1 100 mm in Alès auf mehr als 2 000 mm
      am Mont Lozère, fast 1 000 mm Unterschied auf rund dreißig Kilometern. Bei den sogenannten
      Cevennen-Episoden fallen sintflutartige Regenfälle mit sehr lokalisierten Gewittern, weil kalte
      Atlantikluft auf warme Mittelmeerluft trifft. Der Park liegt zwischen dem Einzugsgebiet der Garonne,
      Richtung Atlantik, und denen der Rhône und kleiner Flüsse, Richtung Mittelmeer. Der Wald bedeckt mehr
      als 70 % des Gebiets, und Niederwald-Kastanienhaine aus alten Obstgärten sind das Wahrzeichen der
      Landschaft.
    wildlife: >-
      Es gibt etwa 70 Säugetierarten, 195 Vogelarten (135 Brutvögel), 16 Amphibienarten, 15 Reptilienarten und
      23 Fischarten. Aber das Ereignis des Jahres findet zu Beginn des Herbstes statt. Mitte September, wenn
      die Dunkelheit hereinbricht, hallt ein raues Röhren durch die Wälder: die Brunft des
      [Rothirsches](/especie/cervus_elaphus/). Der Park hat zahlreiche Brunftplätze, September und Oktober
      sind die Hauptzeit, und die Brunft ist meist am intensivsten bei Morgen- und Abenddämmerung. Die Brunft
      hört man mehr als man sie sieht, also bleib auf genehmigten Wegen, verzichte auf Lichtquellen, bring
      Ferngläser mit und positioniere dich mit dem Wind im Rücken. September und Oktober sind auch Jagdzeit:
      Prüfe, ob an deinem Zielort eine Treibjagd stattfindet.


      In den Schluchten leben drei Geierarten: der [Gänsegeier](/especie/gyps_fulvus/), der
      [Mönchsgeier](/especie/aegypius_monachus/) und der [Schmutzgeier](/especie/neophron_percnopterus/), seit
      1980 vom Park zusammen mit der LPO wiederangesiedelt. Sie brüten gerne im unteren Teil der
      Jonte-Schlucht, nahe Le Rozier, wo das «Maison des vautours» das Beobachten aus nächster Nähe von einem
      Aussichtspunkt ermöglicht. Und in den Wäldern ist das Großes Mausohr, die größte Fledermaus Europas, von
      «vermutet» in einem einzigen Massiv zu drei bekannten Populationen gewachsen, vor allem Männchen, die in
      alten hohlen Bäumen schlafen, besonders in den Höhlen, die der
      [Schwarzspecht](/especie/dryocopus_martius/) in Buchen schlägt.
    visit: >-
      Der Park verfügt über rund 5 000 km markierter Wanderwege: fast 300 Rundwege von einer halben Tageslänge
      oder kürzer mit durchschnittlich 8,5 km, sowie 43 kurze, zugängliche Entdeckungspfade für die ganze
      Familie. Dazu kommen 62 Mountainbike-Strecken aller Schwierigkeitsgrade und rund 500 km Forstwege rund
      um den Aigoual und Florac-Sud Lozère. Für lange Fernwege beginnen die GR-Routen mit dem Stevenson-Weg.


      Die meisten Wege führen über Privatgrundstücke, also verlass die markierten Pfade nicht. Und eine
      konkrete Bitte: Wanderstöcke schädigen den Boden; verwende Gummipuffer oder Stöcke ohne metallische
      Spitze.


      Zur Orientierung verbinden die maisons du tourisme et du Parc Parkempfang und Tourismusbüro mit Beratung
      zu Entdeckungspfaden, Museen und Ausflügen; sie haben Dauerausstellungen in Florac und La Serreyrède am
      Aigoual. Und schau nach oben: Der Park erhielt am 13. August 2018 das Label Internationales
      Sternenreservat, das größte in Europa, und die Milchstraße ist mit bloßem Auge sichtbar, was für mehr
      als ein Drittel der Weltbevölkerung unmöglich ist.
    history: >-
      Die Cevennen waren die Wiege des Kamisarden-Aufstands nach dem Widerruf des Edikts von Nantes, und der
      Rouve Bas in Saint-André-de-Lancize widmet ihnen eine Dauerausstellung. Der Park entstand aus einem Pakt
      mit den Bewohnern: Die Mazerot-Verträge zahlten Landwirten für die Pflege von Trockenmauern, Terrassen
      und Bewässerungskanälen, um die Entvölkerung zu verhindern. Die Kernzone wird durch spezifische
      Vorschriften geregelt, die durch Dekret 2009-1677 festgelegt wurden, abgegrenzt durch Schilder an
      Straßen und Pfaden und einen grünen Streifen auf IGN-Karten.
    before: >-
      Das Straßennetz ist kurvenreich und schmal, also misst du Entfernungen besser in Zeit als in Kilometern.
      Einige Pässe und Straßen schließen im Winter, und der Park empfiehlt das Auto für die Fortbewegung.
    around: >-
      Innerhalb des Parks selbst liegen die [Gorges du Tarn](/lugar/gorges-du-tarn/) in 0 km Entfernung und
      die [Gorges de la Jonte](/lugar/gorges-de-la-jonte/) in 3 km. Weiter entfernt teilt der Park Geier mit
      dem [Naturpark Els Ports](/lugar/parc-natural-dels-ports/), dem [Regionalen Naturpark
      Verdon](/lugar/parc-naturel-regional-du-verdon---gorges/),
      [Monfragüe](/lugar/parque-nacional-de-monfrague/) und dem [Nationalpark
      Dadia-Lefkimi-Soufli](/lugar/parque-nacional-forestal-de-dadia-lefkimi-soufli/).
  it:
    intro: >-
      Nel 1879, uno scozzese con un asino impiegò dodici giorni ad attraversare la Lozère: 195 km. Robert
      Louis Stevenson lo raccontò in «Viaggio con un asino nelle Cevenne», e il suo percorso è oggi il GR70.
      Il Parco Nazionale delle Cevenne, creato con decreto il 2 settembre 1970 come quarto parco nazionale
      francese dopo la Vanoise, Port-Cros e i Pirenei Occidentali, è il solo di media montagna del paese e il
      solo della Francia metropolitana il cui nucleo ha residenti permanenti, soprattutto agricoltori. Qui
      natura e persone si prendono cura insieme del paesaggio, e la sede è nel castello di Florac.
    landscape: >-
      Il parco è un territorio di media montagna con quattro entità: il massiccio dell'Aigoual, il Causse
      Méjean con le gole del Tarn e della Jonte, il Monte Lozère e le valli cevenole. A ovest si estendono i
      Grands Causses, altopiani calcarei; a est le valli cevenole di scisto, tagliate in pendii ripidi; a nord
      il granitico Monte Lozère. I graniti, più resistenti all'erosione, formano le cime più alte; Aigoual e
      Monte Lozère hanno circa 300 milioni di anni. L'altitudine va da 117 m ad Anduze a 1 699 m al Finiels,
      la vetta della Lozère, e la vegetazione passa dal piano meso-mediterraneo nelle gole del sudovest al
      subalpino in cima alla Lozère. Le gole del Tarn e della Jonte hanno pareti «a dente di sega» che cadono
      500 o 600 m in pareti quasi verticali.


      L'acqua e il cielo fanno il resto. Le precipitazioni passano da circa 1 100 mm ad Alès a più di 2 000 mm
      sul Monte Lozère, quasi 1 000 mm di differenza in una trentina di chilometri. Negli episodi cevenoli
      cadono piogge diluviali con temporali molto localizzati, perché l'aria fredda dell'Atlantico si scontra
      con l'aria calda del Mediterraneo. Il parco è a cavallo tra il bacino della Garonna, verso l'Atlantico,
      e quelli del Rodano e di piccoli fiumi, verso il Mediterraneo. La foresta copre più del 70 % del
      territorio, e i castagneti cedui, di antichi frutteti, sono emblema del paesaggio.
    wildlife: >-
      Ci sono circa 70 mammiferi, 195 uccelli (135 nidificanti), 16 anfibi, 15 rettili e 23 pesci. Ma la scena
      dell'anno si svolge all'inizio dell'autunno. A metà settembre, al calare della notte, un bramito rauco
      risuona nelle foreste: è il bramito del [cervo](/especie/cervus_elaphus/). Il parco ha numerosi luoghi
      di bramito, settembre e ottobre sono la stagione privilegiata e di solito è più intenso all'alba o al
      tramonto. Il bramito si sente più di quanto si veda, quindi rimani sui sentieri e sulle piste
      autorizzate, non usare fonti luminose, porta binocoli e posizionati con il vento a favore. Settembre e
      ottobre sono anche stagione di caccia: verifica che il luogo verso cui ti dirigi non abbia una battuta.


      Nelle gole vivono tre avvoltoi: il [grifone](/especie/gyps_fulvus/), l'[avvoltoio
      monaco](/especie/aegypius_monachus/) e il [capovaccaio](/especie/neophron_percnopterus/), reintrodotti
      dal 1980 dal parco con la LPO. Nidificano volentieri nel basso delle gole della Jonte, vicino a Le
      Rozier, dove la «Maison des vautours» permette di osservarli dal vivo da un belvedere. E nelle foreste,
      il serotino di Nilsson, il pipistrello più grande d'Europa, è passato da «sospettato» in un solo
      massiccio a tre popolazioni note, soprattutto maschi, che dormono in alberi vecchi e cavi, in
      particolare le cavità che scava il [picchio nero](/especie/dryocopus_martius/) nei faggi.
    visit: >-
      Il parco conta circa 5 000 km di sentieri segnati: quasi 300 percorsi ad anello di mezza giornata o
      meno, con una media di 8,5 km, e 43 brevi sentieri di scoperta accessibili a tutta la famiglia. Ci sono
      anche 62 circuiti di mountain bike di tutti i livelli e circa 500 km di piste attorno all'Aigoual e a
      Florac-Sud Lozère. Per le grandi traversate ci sono i GR, a partire dal cammino di Stevenson.


      La maggior parte dei sentieri attraversa proprietà private, quindi non uscire dai sentieri segnati. E
      una richiesta concreta: i bastoni degradano il suolo; usa puntali in gomma o bastoni senza punta
      metallica.


      Per orientarsi, le maisons du tourisme et du Parc riuniscono l'accoglienza del parco e l'ufficio del
      turismo, con consigli su sentieri di scoperta, musei e uscite; hanno esposizioni permanenti a Florac e a
      La Serreyrède, sull'Aigoual. E alza gli occhi: il parco ha ottenuto il 13 agosto 2018 il riconoscimento
      di Riserva Internazionale di Cielo Stellato, la più grande d'Europa, e la Via Lattea si vede a occhio
      nudo, cosa impossibile per più di un terzo della popolazione mondiale.
    history: >-
      Le Cevenne furono la culla dell'insurrezione dei camisardi dopo la revoca dell'Editto di Nantes, e il
      Rouve Bas, a Saint-André-de-Lancize, dedica loro una mostra permanente. Il parco nacque da un patto con
      gli abitanti: i contratti Mazerot pagavano gli agricoltori per mantenere muretti a secco, terrazzamenti
      e canali di irrigazione, per evitare lo spopolamento. Il nucleo è regolato da una normativa specifica
      fissata dal decreto 2009-1677, delimitata con pannelli su strade e sentieri e con una fascia verde sulle
      carte IGN.
    before: >-
      La rete stradale è tortuosa e stretta, quindi misura le distanze in tempo, non in chilometri. Alcuni
      valichi e strade chiudono in inverno, e il parco consiglia l'auto per spostarsi.
    around: >-
      Nel parco stesso, le [Gorges du Tarn](/lugar/gorges-du-tarn/) sono a 0 km e le [Gorges de la
      Jonte](/lugar/gorges-de-la-jonte/) a 3 km. Più lontano, il parco condivide avvoltoi con il [Parco
      Naturale dels Ports](/lugar/parc-natural-dels-ports/), il [Parco Naturale Regionale del
      Verdon](/lugar/parc-naturel-regional-du-verdon---gorges/),
      [Monfragüe](/lugar/parque-nacional-de-monfrague/) e il [Parco Nazionale Forestale di
      Dadia-Lefkimi-Soufli](/lugar/parque-nacional-forestal-de-dadia-lefkimi-soufli/).
  pt:
    intro: >-
      Em 1879, um escocês com um burro demorou doze dias a atravessar a Lozère: 195 km. Robert Louis Stevenson
      contou-o em «Viagem com um Burro pelas Cévennes», e o seu percurso é hoje o GR70. O Parque Nacional das
      Cevenas, criado por decreto a 2 de setembro de 1970 como quarto parque nacional francês depois da
      Vanoise, Port-Cros e os Pirenéus Ocidentais, é o único de média montanha do país e o único da França
      metropolitana cujo núcleo tem residentes permanentes, sobretudo agricultores. Aqui a natureza e as
      pessoas cuidam juntas da paisagem, e a sede fica no castelo de Florac.
    landscape: >-
      O parque é um território de média montanha com quatro unidades: o maciço do Aigoual, o Causse Méjean com
      os canhões do Tarn e da Jonte, o Monte Lozère e os vales cevenoles. A oeste estendem-se os Grands
      Causses, planaltos calcários; a leste os vales cevenoles de xisto, talhados em encostas íngremes; a
      norte o granítico Monte Lozère. Os granitos, mais resistentes à erosão, formam os cumes mais altos; o
      Aigoual e o Monte Lozère têm cerca de 300 milhões de anos. A altitude vai de 117 m em Anduze a 1 699 m
      no Finiels, o cume da Lozère, e a vegetação passa do andar meso-mediterrânico nos canhões do sudoeste ao
      subalpino no topo da Lozère. Os canhões do Tarn e da Jonte têm falésias «em dente de serra» que caem 500
      ou 600 m em paredes quase verticais.


      A água e o céu fazem o resto. As precipitações sobem de cerca de 1 100 mm em Alès a mais de 2 000 mm no
      Monte Lozère, quase 1 000 mm de diferença em cerca de trinta quilómetros. Nos chamados episódios
      cevenoles caem chuvas diluviais com trovoadas muito localizadas, porque o ar frio do Atlântico choca com
      o ar quente do Mediterrâneo. O parque fica a cavalo entre a bacia do Garona, para o Atlântico, e as do
      Ródano e de pequenos rios, para o Mediterrâneo. A floresta cobre mais de 70 % do território, e os soutos
      em talhadia, de antigos pomares, são o emblema da paisagem.
    wildlife: >-
      Há cerca de 70 mamíferos, 195 aves (135 nidificantes), 16 anfíbios, 15 répteis e 23 peixes. Mas a cena
      do ano acontece no início do outono. A meados de setembro, ao cair da noite, um mugido rouco ressoa nas
      florestas: é a brama do [veado-vermelho](/especie/cervus_elaphus/). O parque tem numerosos locais de
      brama, setembro e outubro são a época privilegiada e costuma ser mais intensa ao amanhecer ou ao
      anoitecer. A brama ouve-se mais do que se vê, por isso fica nos trilhos e caminhos autorizados, não uses
      fontes de luz, leva binóculos e posiciona-te a favor do vento. Setembro e outubro são também época de
      caça: verifica que o local para onde vais não tem uma montaria.


      Nos canhões vivem três abutres: o [grifo](/especie/gyps_fulvus/), o
      [abutre-preto](/especie/aegypius_monachus/) e o [britango](/especie/neophron_percnopterus/),
      reintroduzidos desde 1980 pelo parque com a LPO. Nidificam de bom grado no troço baixo dos canhões da
      Jonte, perto de Le Rozier, onde a «Maison des vautours» permite vê-los em direto a partir de um
      miradouro. E nas florestas, o morcego-de-Nathusius gigante, o maior da Europa, passou de «suspeito» num
      único maciço a conhecido em três populações, sobretudo machos, que dormem em árvores velhas e ocas,
      especialmente as cavidades que o [peto-preto](/especie/dryocopus_martius/) escava nas faias.
    visit: >-
      O parque tem cerca de 5 000 km de trilhos sinalizados: quase 300 percursos em circuito de meio dia ou
      menos, com uma média de 8,5 km, e 43 curtos percursos de descoberta acessíveis a toda a família. Há
      também 62 circuitos de BTT de todos os níveis e cerca de 500 km de pistas em torno do Aigoual e de
      Florac-Sud Lozère. Para as grandes travessias há os GR, começando pelo caminho de Stevenson.


      A maioria dos trilhos atravessa propriedade privada, por isso não saias dos caminhos sinalizados. E um
      pedido concreto: os bastões degradam o solo; usa ponteiras de borracha ou bastões sem ponta metálica.


      Para te orientares, as maisons du tourisme et du Parc reúnem a receção do parque e o posto de turismo,
      com aconselhamento sobre percursos de descoberta, museus e saídas; têm exposição permanente em Florac e
      em La Serreyrède, no Aigoual. E olha para cima: o parque obteve a 13 de agosto de 2018 a etiqueta de
      Reserva Internacional de Céu Estrelado, a maior da Europa, e a Via Láctea vê-se a olho nu, algo
      impossível para mais de um terço da população mundial.
    history: >-
      As Cevenas foram o berço da insurreição dos camisardos após a revogação do Édito de Nantes, e o Rouve
      Bas, em Saint-André-de-Lancize, tem uma exposição permanente dedicada a eles. O parque nasceu de um
      pacto com os habitantes: os contratos Mazerot pagavam aos agricultores para manter muros de pedra seca,
      socalcos e canais de rega, para evitar o despovoamento. O núcleo é regido por uma regulamentação
      específica fixada pelo decreto 2009-1677, delimitada com painéis nas estradas e caminhos e por uma faixa
      verde nos mapas IGN.
    before: >-
      A rede de estradas é sinuosa e estreita, por isso mede as distâncias em tempo, não em quilómetros.
      Alguns portos de montanha e estradas fecham no inverno, e o parque recomenda o carro para se deslocar.
    around: >-
      No próprio parque, as [Gorges du Tarn](/lugar/gorges-du-tarn/) ficam a 0 km e as [Gorges de la
      Jonte](/lugar/gorges-de-la-jonte/) a 3 km. Mais longe, o parque partilha abutres com o [Parque Natural
      dels Ports](/lugar/parc-natural-dels-ports/), o [Parque Natural Regional do
      Verdon](/lugar/parc-naturel-regional-du-verdon---gorges/),
      [Monfragüe](/lugar/parque-nacional-de-monfrague/) e o [Parque Nacional Florestal de
      Dadia-Lefkimi-Soufli](/lugar/parque-nacional-forestal-de-dadia-lefkimi-soufli/).
