resumen:
  es: >-
    El parque nacional más extenso de Italia (192.000 ha), santuario exclusivo del pino loricado (*Pinus
    heldreichii*) y Geoparque Mundial UNESCO.
  en: >-
    Italy's largest national park (192,000 ha), exclusive sanctuary of the Bosnian pine (*Pinus heldreichii*)
    and a UNESCO Global Geopark.
  fr: >-
    Le plus grand parc national d'Italie (192 000 ha), sanctuaire exclusif du pin de Bosnie (*Pinus
    heldreichii*) et géoparc mondial UNESCO.
  de: >-
    Italiens größter Nationalpark (192.000 ha), exklusives Refugium der Schlangenhaut-Kiefer (*Pinus
    heldreichii*) und UNESCO-Geopark.
  it: >-
    Il parco nazionale più esteso d'Italia (192.000 ha), santuario esclusivo del pino loricato (*Pinus
    heldreichii*) e Geoparco Mondiale UNESCO.
  pt: >-
    O maior parque nacional de Itália (192.000 ha), santuário exclusivo do pinheiro-loricado (*Pinus
    heldreichii*) e Geoparque Mundial da UNESCO.
unico:
  es: >-
    Aquí crece el pino loricado en sus pendientes más hostiles, a la sombra de cumbres cubiertas de nieve
    muchos meses, desde las que se ven las costas de los dos mares.
  en: >-
    Here the Bosnian pine clings to the most hostile rocky crags beneath snow-capped peaks that offer
    panoramic views spanning both the Tyrrhenian and Ionian coasts.
  fr: >-
    Le pin de Bosnie s'y accroche aux pentes les plus hostiles, sous des cimes enneigées de longs mois d'où le
    regard embrasse simultanément les deux mers.
  de: >-
    Hier trotzt die Schlangenhaut-Kiefer widrigsten Felsabstürzen im Schatten schneereicher Gipfel, von denen
    der Blick bis zu beiden Meeren reicht.
  it: >-
    Qui alligna il pino loricato sulle balze rocciose più inospitali, all'ombra di cime innevate per molti
    mesi da cui si scorgono contemporaneamente le coste dei due mari.
  pt: >-
    Aqui o pinheiro-loricado vinga nas escarpas rochosas mais inclementes, sob picos nevados durante longos
    meses de onde se avistam em simultâneo os dois mares.
observaciones:
  es: >-
    Las cumbres tienen nieve muchos meses, así que mira las condiciones antes de subir. Las rutas a las cimas,
    como la de la Serra Dolcedorme, son para gente con experiencia o con guía.
texto:
  es:
    intro: >-
      En una cresta del Pollino hay un pino al que los investigadores calcularon 1.230 años mediante
      radiocarbono y al que bautizaron Italus, como el héroe mítico que da nombre a Italia. Es un pino
      loricado, el emblema de este parque, un árbol rarísimo que aguanta donde ni el haya sobrevive. El Parque
      Nacional del Pollino, entre Basilicata y Calabria, es el mayor parque nacional de Italia: 192.565
      hectáreas, de ellas 88.650 en el lado lucano y 103.915 en el calabrés.
    landscape: >-
      Las cumbres del Pollino están entre las más altas del sur de Italia: la Serra Dolcedorme (2.267 m), el
      Monte Pollino (2.248 m), la Serra del Prete (2.181 m), la Serra delle Ciavole (2.127 m) y la Serra di
      Crispo (2.054 m). Están cubiertas de nieve muchos meses al año y, desde ellas, a simple vista se ven las
      costas tirrena y jónica.


      Fueron los glaciares quienes modelaron ese perfil. Sus huellas más claras están en la vertiente noroeste
      de la Serra Dolcedorme, en la cuenca llamada Fossa del Lupo. Al retirarse dejaron, además de morrenas,
      bloques de gran tamaño, los bloques erráticos, aislados y lejos de cualquier lugar de caída, que se ven
      fácilmente en los Piani di Pollino y de Acquafredda, entre 1.800 y 2.000 m. En el Monte Pollino, a 2.225
      m, hay un nevero que se ve fácilmente incluso a finales de agosto.


      Todo eso forma parte del geoparque: desde noviembre de 2015, el parque está en la lista mundial de
      geoparques de la UNESCO. El Pollino Geopark reúne 69 geositios: circos glaciares, depósitos morrénicos,
      nieves, fósiles de rudistas y gargantas calizas como las del Raganello, Lao, Rosa y Garavina.
    wildlife: >-
      El [pino loricado](/especie/pinus_heldreichii/) manda en las cotas más altas y en las pendientes más
      empinadas, y es el emblema del parque; vive también en montañas de los Balcanes y Grecia. Más abajo hay
      [abeto blanco](/especie/abies_alba/), haya, los siete tipos de arces, [pino
      negro](/especie/pinus_nigra/) y tejo. En el hayedo viejo de Cozzo Ferriero, el más meridional de Europa,
      vive el Italus. En primavera florecen orquídeas, violetas, genciana y campanillas, y en verano el raro
      lirio rojo.


      Entre los mamíferos están el [lobo](/especie/canis_lupus/) apenino, el [gato
      montés](/especie/felis_silvestris/), el zorro, el jabalí, el corzo autóctono de Orsomarso, la
      [nutria](/especie/lutra_lutra/), el tejón y la ardilla negra meridional. El
      [ciervo](/especie/cervus_elaphus/) (2002-03) y el [buitre leonado](/especie/gyps_fulvus/) (2002) se
      reintrodujeron hace poco. Entre las aves figuran el [águila real](/especie/aquila_chrysaetos/), el
      [alimoche](/especie/neophron_percnopterus/), el [halcón peregrino](/especie/falco_peregrinus/), el
      [milano real](/especie/milvus_milvus/), el [búho real](/especie/bubo_bubo/), el [pito
      negro](/especie/dryocopus_martius/) y la rara perdiz griega. Hay también culebra de collar, víbora,
      sapillo pintojo, [salamandra](/especie/salamandra_salamandra/) y el longicornio alpino, [Rosalia
      alpina](/especie/rosalia_alpina/).
    visit: >-
      El parque mantiene una amplia red de rutas dividida entre los sectores lucano y calabrés, y distingue
      entre rutas turístico-excursionistas, recorridos sin dificultades técnicas e itinerarios para
      excursionistas expertos. En Fosso Jannace pueden verse abetos blancos, arces y hayas junto al sendero
      que bordea el torrente, y el itinerario Fosso Jannace–Serra di Crispo atraviesa el Giardino degli Dei,
      desde donde se observan los pinos loricados, que caracterizan el paisaje de esa cresta.


      El recorrido de Colle Impiso conduce al Monte Pollino pasando por los Piani di Vacquarro, la fuente
      Spezzavummula y Colle Gaudolino; la ruta de Colle Impiso hacia Serra Dolcedorme se recomienda sobre todo
      en primavera por sus floraciones, y el itinerario de la vertiente calabresa de la Serra Dolcedorme
      alcanza la cota de 2267 metros; hacia la cima se aconseja ir con experiencia o con guías alpinos. Otros
      caminos: el que sale del refugio Bosco Favino llega al Monte Alpi, para expertos, y la ruta de Valsinni
      a Monte Coppolo no tiene dificultad técnica. El parque cuenta además con un ecomuseo en Rotonda, que
      presenta todo el patrimonio del Pollino, su paisaje natural y su cultura.
    history: >-
      El parque se creó en 1988 y su perimetración provisional es de 1990. Se extiende por 56 municipios, 24
      en Basilicata y 32 en Calabria, y hay cuatro reservas naturales orientadas: Valle del Lao, Gole del
      Raganello, Valle del Argentino y Rubbio.


      Entre 1470 y 1540 se asentaron aquí comunidades albanesas: en el lado lucano, San Paolo Albanese y San
      Costantino Albanese, y en el calabrés San Basile, Lungro, Plataci, Frascineto y Civita. El pueblo más
      alto es Alessandria del Carretto, a 999 m, que conserva antiguas tradiciones culturales y musicales, y a
      1.537 m, en San Severino Lucano, está el santuario de la Madonna del Pollino, con un culto muy arraigado
      entre la gente del lugar.
    before: >-
      Las cumbres tienen nieve muchos meses, así que mira las condiciones antes de subir. Las rutas a las
      cimas, como la de la Serra Dolcedorme, son para gente con experiencia o con guía.
    around: >-
      El [Parco Nazionale del Cilento, Vallo di Diano e
      Alburni](/lugar/parco-nazionale-del-cilento-vallo-di-diano-e-alburni/) queda a veintiocho kilómetros.
  en:
    intro: >-
      High on a windswept ridge of the Pollino stands a pine whose age researchers radiocarbon-dated to 1,230
      years, christening it Italus after the mythical hero who gave Italy its name. It is a Bosnian pine, the
      proud emblem of this park, a resilient conifer that thrives where even beech cannot take root.
      Straddling Basilicata and Calabria, the Pollino National Park is the largest in Italy: encompassing
      192,565 hectares, with 88,650 on the Lucanian side and 103,915 on the Calabrian side.
    landscape: >-
      The summits of the Pollino rank among the highest in southern Italy: Serra Dolcedorme (2,267 m), Monte
      Pollino (2,248 m), Serra del Prete (2,181 m), Serra delle Ciavole (2,127 m), and Serra di Crispo (2,054
      m). Snow blankets them for many months each year, and from their crests hikers can behold both the
      Tyrrhenian and Ionian seas with the naked eye.


      Ancient glaciers sculpted this alpine profile. Their most striking imprint marks the north-western flank
      of Serra Dolcedorme, within the glacial hollow known as Fossa del Lupo. In retreating, glaciers
      deposited moraines as well as immense erratic boulders, isolated far from parent crags, readily observed
      across Piani di Pollino and Piani di Acquafredda between 1,800 and 2,000 m. On Monte Pollino, at 2,225
      m, a perennial snowfield persists even in late August.


      All of this forms part of the geopark: in November 2015, the area joined the UNESCO Global Geoparks
      Network. The Pollino Geopark features 69 designated geosites, including glacial cirques, moraines,
      permanent snowbeds, rudist fossils, and dramatic limestone gorges such as Raganello, Lao, Rosa, and
      Garavina.
    wildlife: >-
      The [Bosnian pine](/especie/pinus_heldreichii/) reigns over the highest crags and steepest limestone
      precipices as the floral symbol of the park, also occurring across the Balkan ranges and Greece. Below
      it grow [silver fir](/especie/abies_alba/), beech, all seven native maple species, [European black
      pine](/especie/pinus_nigra/), and yew. In the ancient old-growth beechwood of Cozzo Ferriero—the
      southernmost primeval beech forest in Europe—stands the ancient Italus. In spring, wild orchids,
      violets, gentians, and bellflowers bloom, followed in summer by the rare orange lily.


      Mammals include the Apennine [grey wolf](/especie/canis_lupus/), [European
      wildcat](/especie/felis_silvestris/), red fox, wild boar, the native Orsomarso roe deer, [Eurasian
      otter](/especie/lutra_lutra/), European badger, and southern black squirrel. [Red
      deer](/especie/cervus_elaphus/) (2002-03) and the [griffon vulture](/especie/gyps_fulvus/) (2002) were
      reintroduced in recent decades. The rich avifauna features the [golden
      eagle](/especie/aquila_chrysaetos/), [Egyptian vulture](/especie/neophron_percnopterus/), [peregrine
      falcon](/especie/falco_peregrinus/), [red kite](/especie/milvus_milvus/), [Eurasian
      eagle-owl](/especie/bubo_bubo/), [black woodpecker](/especie/dryocopus_martius/), and rock partridge.
      Reptiles and amphibians include grass snake, asp viper, painted frog, [fire
      salamander](/especie/salamandra_salamandra/), and the rare alpine beetle, [Rosalia
      longicorn](/especie/rosalia_alpina/).
    visit: >-
      The park maintains an extensive hiking network divided between its Lucanian and Calabrian sectors,
      catering to leisurely nature walks, moderate day hikes, and challenging mountaineering traverses. Along
      Fosso Jannace, trails trace the mountain torrent beneath towering silver firs, maples, and beeches; the
      route continuing up to Serra di Crispo crosses the legendary Giardino degli Dei, an awe-inspiring
      sanctuary of ancient Bosnian pines dominating the ridge.


      The trail from Colle Impiso ascends Monte Pollino via Piani di Vacquarro, Spezzavummula spring, and
      Colle Gaudolino; another path from Colle Impiso toward Serra Dolcedorme is especially recommended in
      spring for its wild blooms, while the Calabrian approach to Serra Dolcedorme reaches the 2267-metre
      summit, where mountaineering experience or local alpine guides are recommended. Other itineraries
      include the ascent from Rifugio Bosco Favino to Monte Alpi for seasoned hikers, and the gentle trail
      from Valsinni to Monte Coppolo. In Rotonda, the park's eco-museum showcases the region's natural
      heritage and mountain traditions.
    history: >-
      The national park was established in 1988, with provisional boundaries drawn in 1990. It encompasses 56
      municipalities—24 in Basilicata and 32 in Calabria—and protects four state nature reserves: Valle del
      Lao, Gole del Raganello, Valle del Argentino, and Rubbio.


      Between 1470 and 1540 Arbëreshë (Albanian) communities settled here, founding San Paolo Albanese and San
      Costantino Albanese in Basilicata, and San Basile, Lungro, Plataci, Frascineto, and Civita in Calabria.
      The highest village is Alessandria del Carretto at 999 m, known for preserving ancient musical rituals,
      while at 1,537 m in San Severino Lucano sits the Sanctuary of the Madonna del Pollino, the focal point
      of deep local veneration.
    before: >-
      Snow blankets high ridges for many months; check meteorological conditions before ascending. High summit
      routes, such as the climb to Serra Dolcedorme, require experienced mountain navigation or a certified
      guide.
    around: >-
      The [Parco Nazionale del Cilento, Vallo di Diano e
      Alburni](/lugar/parco-nazionale-del-cilento-vallo-di-diano-e-alburni/) lies twenty-eight kilometres
      away.
  fr:
    intro: >-
      Sur une crête du Pollino s'élève un pin auquel des chercheurs ont attribué 1 230 ans par datation au
      radiocarbone, baptisé Italus en hommage au héros mythique qui a donné son nom à l'Italie. C'est un pin
      de Bosnie, emblème de ce parc, arbre exceptionnel capable de prospérer là où même le hêtre capitule. À
      cheval sur la Basilicate et la Calabre, le parc national du Pollino est le plus vaste d'Italie : 192 565
      hectares, dont 88 650 côté lucanien et 103 915 côté calabrais.
    landscape: >-
      Les cimes du Pollino figurent parmi les plus hautes du sud de l'Italie : la Serra Dolcedorme (2 267 m),
      le Monte Pollino (2 248 m), la Serra del Prete (2 181 m), la Serra delle Ciavole (2 127 m) et la Serra
      di Crispo (2 054 m). La neige les recouvre plusieurs mois par an et, depuis leurs crêtes, l'œil embrasse
      à la fois les rivages tyrrhénien et ionien.


      Ce sont les glaciers quaternaires qui ont façonné ces reliefs. Leurs empreintes les plus nettes marquent
      le versant nord-ouest de la Serra Dolcedorme, dans la dépression glaciaire de la Fossa del Lupo. En
      fondant, ils ont abandonné moraines et blocs erratiques volumineux, disséminés sur les Piani di Pollino
      et d'Acquafredda entre 1 800 et 2 000 m. Sur le Monte Pollino, à 2 225 m, subsiste un névé visible
      jusqu'à la fin du mois d'août.


      Tout ce patrimoine géologique relève du géoparc : depuis novembre 2015, le territoire figure sur la
      liste des géoparcs mondiaux de l'UNESCO. Le Pollino Geopark réunit 69 géosites majeurs : cirques
      glaciaires, dépôts morainiques, névés, fossiles de rudistes et gorges calcaires spectaculaires comme le
      Raganello, le Lao, la Rosa et la Garavina.
    wildlife: >-
      Le [pin de Bosnie](/especie/pinus_heldreichii/) règne sur les falaises et les crêtes escarpées,
      incarnant le symbole du parc ; il pousse également dans les massifs des Balkans et en Grèce. Plus bas
      prospèrent le [sapin blanc](/especie/abies_alba/), le hêtre, les sept espèces indigènes d'érables, le
      [pin noir](/especie/pinus_nigra/) et l'if. Dans la vieille hêtraie de Cozzo Ferriero, la plus
      méridionale d'Europe, survit le vénérable Italus. Au printemps s'épanouissent orchidées sauvages,
      violettes et gentianes, suivies en été par le rare lis orangé.


      Parmi les mammifères figurent le [loup](/especie/canis_lupus/) des Apennins, le [chat
      sauvage](/especie/felis_silvestris/), le renard, le sanglier, le chevreuil autochtone d'Orsomarso, la
      [loutre d'Europe](/especie/lutra_lutra/), le blaireau et l'écureuil noir méridional. Le [cerf
      élaphe](/especie/cervus_elaphus/) (2002-03) et le [vautour fauve](/especie/gyps_fulvus/) (2002) ont fait
      l'objet de réintroductions réussies. L'avifaune accueille l'[aigle royal](/especie/aquila_chrysaetos/),
      le [percnoptère](/especie/neophron_percnopterus/), le [faucon pèlerin](/especie/falco_peregrinus/), le
      [milan royal](/especie/milvus_milvus/), le [hibou grand-duc](/especie/bubo_bubo/), le [pic
      noir](/especie/dryocopus_martius/) et la perdrix bartavelle. On note aussi couleuvre à collier, vipère,
      discoglosse, [salamandre tachetée](/especie/salamandra_salamandra/) et la rare [rosalie des
      Alpes](/especie/rosalia_alpina/).
    visit: >-
      Le parc déploie un vaste maillage d'itinéraires partagé entre ses versants lucanien et calabrais,
      distinguant sentiers didactiques, balades accessibles et parcours pour randonneurs chevronnés. Au Fosso
      Jannace, le chemin longe le torrent sous de majestueux sapins blancs, érables et hêtres ; la montée vers
      la Serra di Crispo traverse le Giardino degli Dei, sanctuaire où les silhouettes torturées des pins de
      Bosnie modèlent l'arête sommitale.


      L'itinéraire de Colle Impiso conduit au Monte Pollino en passant par les Piani di Vacquarro, la source
      Spezzavummula et Colle Gaudolino ; le sentier de Colle Impiso vers la Serra Dolcedorme est réputé au
      printemps pour ses floraisons, tandis que la voie calabraise de la Serra Dolcedorme culmine à 2267
      mètres d'altitude, requérant expérience montagnarde ou accompagnement professionnel. Autres randonnées :
      l'ascension du Monte Alpi depuis le refuge Bosco Favino pour experts, et la balade aisée de Valsinni au
      Monte Coppolo. À Rotonda, l'écomusée présente les richesses naturelles et les traditions culturelles du
      Pollino.
    history: >-
      Le parc vit le jour en 1988, avec une délimitation provisoire en 1990. Il s'étend sur 56 communes — 24
      en Basilicate et 32 en Calabre — et englobe quatre réserves naturelles domaniales : Valle del Lao, Gole
      del Raganello, Valle del Argentino et Rubbio.


      Entre 1470 et 1540 s'installèrent ici des communautés albanaises (Arbëreshë) : côté lucanien, San Paolo
      Albanese et San Costantino Albanese ; côté calabrais, San Basile, Lungro, Plataci, Frascineto et Civita.
      Le village le plus élevé est Alessandria del Carretto à 999 m, gardien de traditions séculaires, tandis
      qu'à 1 537 m, sur la commune de San Severino Lucano, se dresse le sanctuaire de la Madonna del Pollino,
      objet d'une immense dévotion populaire.
    before: >-
      Les hauts sommets restent enneigés de longs mois ; vérifiez les conditions nivologiques avant de partir.
      Les accès aux crêtes sommitales, comme la Serra Dolcedorme, réclament une solide expérience ou un guide
      qualifié.
    around: >-
      Le [Parco Nazionale del Cilento, Vallo di Diano e
      Alburni](/lugar/parco-nazionale-del-cilento-vallo-di-diano-e-alburni/) se trouve à vingt-huit
      kilomètres.
  de:
    intro: >-
      Auf einem Felsgrat des Pollino wächst eine Kiefer, deren Alter Forscher mittels Radiokarbonmethode auf
      1.230 Jahre datierten; sie tauften den Baum Italus, nach dem mythischen Stammvater Italiens. Es ist eine
      Schlangenhaut-Kiefer, das Wappensymbol des Parks, die an kargen Felsflanken gedeiht, wo selbst Buchen
      weichen müssen. Der Nationalpark Pollino zwischen Basilikata und Kalabrien ist das größte Schutzgebiet
      Italiens: 192.565 Hektar Gesamtfläche, davon 88.650 im lukanischen und 103.915 im kalabrischen Sektor.
    landscape: >-
      Die Gipfel des Pollino zählen zu den höchsten Süditaliens: Serra Dolcedorme (2.267 m), Monte Pollino
      (2.248 m), Serra del Prete (2.181 m), Serra delle Ciavole (2.127 m) und Serra di Crispo (2.054 m).
      Monatelang liegt Schnee auf den Kuppen, von denen aus sich mit bloßem Auge sowohl das Tyrrhenische als
      auch das Ionische Meer erblicken lassen.


      Eiszeitliche Gletscher formten dieses Gebirge. Ihre deutlichsten Zeugnisse liegen an der Nordwestflanke
      der Serra Dolcedorme im Kar der Fossa del Lupo. Beim Rückzug hinterließen sie Moränenwälle sowie
      gewaltige Findlinge auf den Piani di Pollino und Piani di Acquafredda zwischen 1.800 und 2.000 m Höhe.
      Am Monte Pollino überdauert auf 2.225 m ein Schneefeld bis in den Spätsommer hinein.


      Seit November 2015 ist die Region als UNESCO Global Geopark anerkannt. Der Pollino Geopark vereint 69
      bedeutende Geotope: Gletscherkare, Moränenablagerungen, Firnfelder, fossile Rudistenriffe und
      Kalksteinschluchten wie Raganello, Lao, Rosa und Garavina.
    wildlife: >-
      Die [Schlangenhaut-Kiefer](/especie/pinus_heldreichii/) behauptet sich auf den höchsten Felsgraten und
      ist das Symbol des Parks; sie kommt auch in den Gebirgen des Balkans und Griechenlands vor. Weiter
      talwärts wachsen [Weiß-Tanne](/especie/abies_alba/), Rotbuche, alle sieben heimischen Ahornarten,
      [Schwarzkiefer](/especie/pinus_nigra/) und Eibe. Im uralten Buchenwald von Cozzo Ferriero, dem
      südlichsten Buchenurwald Europas, lebt der Methusalem Italus. Im Frühling erblühen Wildorchideen,
      Veilchen und Enziane, gefolgt von der seltenen Feuerlilie im Hochsommer.


      Zu den Säugetieren gehören Apennin-[Wolf](/especie/canis_lupus/),
      [Wildkatze](/especie/felis_silvestris/), Fuchs, Wildschwein, das autochthone Orsomarso-Reh, [Eurasischer
      Fischotter](/especie/lutra_lutra/), Dachs und das süditalienische schwarze Eichhörnchen. Der
      [Rothirsch](/especie/cervus_elaphus/) (2002-03) und der [Gänsegeier](/especie/gyps_fulvus/) (2002)
      wurden erfolgreich wiederangesiedelt. Die Vogelwelt umfasst [Steinadler](/especie/aquila_chrysaetos/),
      [Schmutzgeier](/especie/neophron_percnopterus/), [Wanderfalke](/especie/falco_peregrinus/),
      [Rotmilan](/especie/milvus_milvus/), [Uhu](/especie/bubo_bubo/),
      [Schwarzspecht](/especie/dryocopus_martius/) und Steinhuhn. Hinzu kommen Ringelnatter, Aspisviper,
      [Feuersalamander](/especie/salamandra_salamandra/) und der seltene
      [Alpenbock](/especie/rosalia_alpina/).
    visit: >-
      Das Wegenetz gliedert sich in einen lukanischen und einen kalabrischen Bereich mit einfachen Naturpfaden
      und anspruchsvollen Bergtouren. Am Fosso Jannace verläuft der Pfad entlang des Bergbachs durch
      Weißtannen-, Ahorn- und Buchenbestände; die Route zur Serra di Crispo durchquert den Giardino degli Dei,
      wo knorrige Schlangenhaut-Kiefern den Felsgrat zieren.


      Die Route von Colle Impiso führt über die Piani di Vacquarro, die Quelle Spezzavummula und den Colle
      Gaudolino auf den Monte Pollino; der Weg zur Serra Dolcedorme empfiehlt sich im Frühling zur Blütezeit,
      während der kalabrische Aufstieg zur Serra Dolcedorme eine Höhe von 2267 Metern erreicht und alpine
      Erfahrung verlangt. Weitere Wege: ab Schutzhütte Bosco Favino zum Monte Alpi für Geübte und von Valsinni
      zum Monte Coppolo ohne technische Schwierigkeiten. In Rotonda vermittelt ein Ökomuseum Natur- und
      Kulturgeschichte des Pollino.
    history: >-
      Der Nationalpark wurde 1988 gesetzlich verankert und 1990 vorläufig abgegrenzt. Er erstreckt sich über
      56 Gemeinden — 24 in der Basilikata und 32 in Kalabrien — und schützt vier staatliche Naturreservate:
      Valle del Lao, Gole del Raganello, Valle del Argentino und Rubbio.


      Zwischen 1470 und 1540 ließen sich hier albanische Einwanderer (Arbëresh) nieder: in der Basilikata San
      Paolo Albanese und San Costantino Albanese, in Kalabrien San Basile, Lungro, Plataci, Frascineto und
      Civita. Höchstgelegener Ort ist Alessandria del Carretto auf 999 m; auf 1.537 m Höhe bei San Severino
      Lucano steht die Wallfahrtskirche Madonna del Pollino, Ziel lebendiger Volksfrömmigkeit.
    before: >-
      Auf den Gipfeln liegt monatelang Schnee; prüfe Wetterberichte vor dem Aufbruch. Touren auf die höchsten
      Grate wie die Serra Dolcedorme erfordern Bergerfahrung oder einen autorisierten Bergführer.
    around: >-
      Der [Parco Nazionale del Cilento, Vallo di Diano e
      Alburni](/lugar/parco-nazionale-del-cilento-vallo-di-diano-e-alburni/) liegt achtundzwanzig Kilometer
      entfernt.
  it:
    intro: >-
      Su una cresta del Pollino svetta un pino al quale i ricercatori hanno attribuito 1.230 anni mediante
      datazione al radiocarbonio, battezzandolo Italus in onore del re mitologico da cui prese nome l'Italia.
      È un pino loricato, l'emblema del parco, albero straordinario che resiste dove neppure il faggio riesce
      a mettere radici. A cavallo tra Basilicata e Calabria, il Parco Nazionale del Pollino è la maggiore area
      protetta d'Italia: 192.565 ettari, di cui 88.650 sul versante lucano e 103.915 su quello calabrese.
    landscape: >-
      Le cime del Pollino figurano tra le vette più alte del Mezzogiorno: la Serra Dolcedorme (2.267 m), il
      Monte Pollino (2.248 m), la Serra del Prete (2.181 m), la Serra delle Ciavole (2.127 m) e la Serra di
      Crispo (2.054 m). La neve ammanta i crinali per lunghi mesi e dalle vette lo sguardo raggiunge a vista
      le coste tirrenica e ionica.


      Furono i ghiacciai a plasmarne i rilievi. Le impronte più evidenti segnano il versante nord-occidentale
      della Serra Dolcedorme, nella conca della Fossa del Lupo. Nel ritirarsi lasciarono depositi morenici e
      imponenti massi erratici, isolati e lontani da pareti di caduta, chiaramente visibili sui Piani di
      Pollino e di Acquafredda tra 1.800 e 2.000 m. Sul Monte Pollino, a 2.225 m, un nevaio resiste fino a
      fine agosto.


      Tutto questo rientra nel geoparco: dal novembre 2015 l'area appartiene alla rete mondiale dei geoparchi
      UNESCO. Il Pollino Geopark racchiude 69 geositi: circhi glaciali, morene, nevai, fossili di rudiste e
      forre calcaree come Raganello, Lao, Rosa e Garavina.
    wildlife: >-
      Il [pino loricato](/especie/pinus_heldreichii/) domina le balze e le creste rupestri ed è il simbolo del
      parco; cresce anche sui monti balcanici e in Grecia. Più in basso vegetano [abete
      bianco](/especie/abies_alba/), faggio, tutte le sette specie autoctone di acero, [pino
      nero](/especie/pinus_nigra/) e tasso. Nella faggeta vetusta di Cozzo Ferriero, la più meridionale
      d'Europa, vegeta il millenario Italus. In primavera sbocciano orchidee selvatiche, viole e genziane, e
      d'estate il raro giglio rosso.


      Tra i mammiferi popolano i boschi il [lupo grigio](/especie/canis_lupus/) appenninico, il [gatto
      selvatico](/especie/felis_silvestris/), la volpe, il cinghiale, il capriolo autoctono di Orsomarso, la
      [lontra europea](/especie/lutra_lutra/), il tasso e lo scoiattolo nero meridionale. Il
      [cervo](/especie/cervus_elaphus/) (2002-03) e il [grifone](/especie/gyps_fulvus/) (2002) sono stati
      reintrodotti in anni recenti. L'avifauna annovera [aquila reale](/especie/aquila_chrysaetos/),
      [capovaccaio](/especie/neophron_percnopterus/), [falco pellegrino](/especie/falco_peregrinus/), [nibbio
      reale](/especie/milvus_milvus/), [gufo reale](/especie/bubo_bubo/), [picchio
      nero](/especie/dryocopus_martius/) e coturnice. Si segnalano anche biscia dal collare, vipera comune,
      discoglosso, [salamandra pezzata](/especie/salamandra_salamandra/) e la rara [rosalia
      alpina](/especie/rosalia_alpina/).
    visit: >-
      Il parco gestisce una fitta rete sentieristica articolata tra i versanti lucano e calabrese, con
      percorsi didattici e impegnative traversate d'alta quota. In località Fosso Jannace il tracciato risale
      il torrente tra abeti bianchi, aceri e faggi; la prosecuzione verso la Serra di Crispo attraversa il
      Giardino degli Dei, dove i monumentali pini loricati plasmano l'orizzonte di cresta.


      L'itinerario di Colle Impiso sale al Monte Pollino toccando i Piani di Vacquarro, la sorgente
      Spezzavummula e Colle Gaudolino; il percorso verso la Serra Dolcedorme si fa apprezzare in primavera per
      le fioriture, mentre la via calabrese alla Serra Dolcedorme guadagna la quota di 2267 metri, richiedendo
      buona preparazione o l'ausilio di guide ufficiali. Altri sentieri: dal rifugio Bosco Favino al Monte
      Alpi per esperti e da Valsinni a Monte Coppolo senza difficoltà tecniche. A Rotonda un ecomuseo illustra
      la storia geologica, naturale e culturale del Pollino.
    history: >-
      Il parco fu istituito nel 1988 con delimitazione provvisoria nel 1990. Abbraccia 56 comuni — 24 in
      Basilicata e 32 in Calabria — e tutela quattro riserve naturali statali: Valle del Lao, Gole del
      Raganello, Valle del Argentino e Rubbio.


      Tra il 1470 e il 1540 si stabilirono in quest'area comunità arbëreshe (albanesi): nel territorio lucano
      San Paolo Albanese e San Costantino Albanese; in quello calabrese San Basile, Lungro, Plataci,
      Frascineto e Civita. Il borgo più elevato è Alessandria del Carretto a 999 m, mentre a 1.537 m sorge nel
      comune di San Severino Lucano il santuario della Madonna del Pollino, meta di profonda devozione
      popolare.
    before: >-
      Le cime conservano la neve per molti mesi; consulta i bollettini meteo prima di salire. Le ascese alle
      creste della Serra Dolcedorme richiedono passo sicuro, attrezzatura idonea o l'accompagnamento di una
      guida.
    around: >-
      Il [Parco Nazionale del Cilento, Vallo di Diano e
      Alburni](/lugar/parco-nazionale-del-cilento-vallo-di-diano-e-alburni/) sorge a ventotto chilometri.
  pt:
    intro: >-
      Numa crista do Pollino ergue-se um pinheiro ao qual investigadores calcularam 1.230 anos através de
      datação por radiocarbono, batizando-o de Italus em honra do herói mítico que deu nome a Itália. É um
      pinheiro-loricado, símbolo supremo deste parque, árvore prodigiosa que subsiste onde nem a faia consegue
      deitar raízes. A cavalo entre a Basilicata e a Calábria, o Parque Nacional do Pollino é o maior de
      Itália: 192.565 hectares, congregando 88.650 do lado lucano e 103.915 do lado calabrês.
    landscape: >-
      Os cumes do Pollino contam-se entre os mais elevados do sul de Itália: a Serra Dolcedorme (2.267 m), o
      Monte Pollino (2.248 m), a Serra del Prete (2.181 m), a Serra delle Ciavole (2.127 m) e a Serra di
      Crispo (2.054 m). A neve coroa os cumes muitos meses por ano e, a partir deles, a vista alcança sem
      esforço o mar Tirreno e o mar Jónico.


      Foram os glaciares que esculpiram esta silhueta agreste. Os seus vestígios mais patentes marcam a
      vertente noroeste da Serra Dolcedorme, na depressão da Fossa del Lupo. Ao recuarem abandonaram moreias e
      grandes blocos erráticos isolados, bem visíveis nos Piani di Pollino e de Acquafredda entre os 1.800 e
      os 2.000 m. No Monte Pollino, a 2.225 m, subsiste um nevero visível mesmo nos finais de agosto.


      Tudo isto integra o geoparque: desde novembro de 2015 o território figura na rede de geoparques mundiais
      da UNESCO. O Pollino Geopark acolhe 69 geossítios: circos glaciares, moreias, neveros, fósseis de
      rudistas e desfiladeiros calcários monumentais como Raganello, Lao, Rosa e Garavina.
    wildlife: >-
      O [pinheiro-loricado](/especie/pinus_heldreichii/) impera nos cumes e escarpas alcantiladas como emblema
      do parque, ocorrendo também nos Balcãs e na Grécia. Abaixo crescem [abeto-branco](/especie/abies_alba/),
      faia, as sete espécies de bordos autóctones, [pinheiro-larício](/especie/pinus_nigra/) e teixo. No faial
      vetusto de Cozzo Ferriero, o mais meridional da Europa, vive o venerável Italus. Na primavera florescem
      orquídeas bravas, violetas e gencianas, desabrochando no estio o raro lírio-laranja.


      Nos mamíferos destacam-se o [lobo-cinzento](/especie/canis_lupus/) apenínico, o
      [gato-bravo](/especie/felis_silvestris/), a raposa, o javali, o corço autóctone de Orsomarso, a
      [lontra-europeia](/especie/lutra_lutra/), o texugo e o esquilo-negro meridional. O
      [veado-vermelho](/especie/cervus_elaphus/) (2002-03) e o [abutre-fouveiro](/especie/gyps_fulvus/) (2002)
      foram reintroduzidos nos últimos anos. A avifauna compreende [águia-real](/especie/aquila_chrysaetos/),
      [abutre-do-egito](/especie/neophron_percnopterus/), [falcão-peregrino](/especie/falco_peregrinus/),
      [milhafre-real](/especie/milvus_milvus/), [bufo-real](/especie/bubo_bubo/),
      [pica-pau-preto](/especie/dryocopus_martius/) e perdiz-grega. Registam-se também cobra-de-água-de-colar,
      víbora, discoglosso, [salamandra-de-fogo](/especie/salamandra_salamandra/) e o raro besouro [Rosalia
      alpina](/especie/rosalia_alpina/).
    visit: >-
      O parque mantém uma vasta malha de percursos dividida entre os setores lucano e calabrês, proporcionando
      trilhos didáticos e travessias alpinas exigentes. Em Fosso Jannace o trilho acompanha a torrente entre
      abetos-brancos, bordos e faias; a ascensão para a Serra di Crispo atravessa o Giardino degli Dei, onde
      os pinheiros-loricados moldam a crista cimeira.


      O itinerário de Colle Impiso alcança o Monte Pollino passando pelos Piani di Vacquarro, pela fonte
      Spezzavummula e pelo Colle Gaudolino; o trilho de Colle Impiso para a Serra Dolcedorme destaca-se na
      primavera pelas suas florações, enquanto a via calabresa para a Serra Dolcedorme atinge a cota de 2267
      metros, exigindo experiência de montanha ou apoio de guias. Outros percursos: do refúgio Bosco Favino ao
      Monte Alpi para montanhistas experientes, e o trilho de Valsinni ao Monte Coppolo sem desníveis
      difíceis. Em Rotonda, um ecomuseu expõe o património natural e as tradições do Pollino.
    history: >-
      O parque foi instituído em 1988 com delimitação provisória em 1990. Espalha-se por 56 municípios — 24 na
      Basilicata e 32 na Calábria — e tutela quatro reservas naturais estatais: Valle del Lao, Gole del
      Raganello, Valle del Argentino e Rubbio.


      Entre 1470 e 1540 radicaram-se nesta serra comunidades albanesas (Arbëreshë): no lado lucano, San Paolo
      Albanese e San Costantino Albanese; no calabrês, San Basile, Lungro, Plataci, Frascineto e Civita. A
      povoação mais alta é Alessandria del Carretto a 999 m, enquanto a 1.537 m se ergue em San Severino
      Lucano o santuário da Madonna del Pollino, coração de fervorosas romarias.
    before: >-
      Os cumes guardam neve durante vários meses; consulta os boletins meteorológicos antes da subida. As
      rotas para as cristas da Serra Dolcedorme requerem experiência alpina comprovada ou guia credenciado.
    around: >-
      O [Parco Nazionale del Cilento, Vallo di Diano e
      Alburni](/lugar/parco-nazionale-del-cilento-vallo-di-diano-e-alburni/) fica a vinte e oito quilómetros.
