observaciones:
  es: Las mejores épocas son primavera y otoño. El caudal alto de primavera y las crecidas son un rasgo del río.
texto:
  es:
    intro: >-
      Veliko Tarnovo no está construida al lado de un río: está construida entre sus vueltas. El casco antiguo
      ocupa tres colinas, Tsarevets, Trapezitsa y Sveta Gora, que emergen entre los meandros del Yantra, y en
      el Tsarevets se conservan los palacios de los emperadores búlgaros, rodeados de gruesas murallas. El río
      que hizo esa ciudad es uno de los más sinuosos de Bulgaria: 285 km desde un nacimiento a 1.220 metros en
      la cordillera de los Balcanes hasta el Danubio, con tramos encajados en gargantas y otros que se
      despliegan en meandros en la llanura.
    landscape: >-
      El Yantra nace a 1.220 metros en las estribaciones norte de la cordillera de los Balcanes. Hasta Gabrovo
      baja hacia el noroeste por un valle hondo cubierto de hayedos de haya europea. Entre Gabrovo y el pueblo
      de Yantra atraviesa la meseta de Strazha y labra la garganta de Strazha; después el valle se ensancha y
      aparecen los campos en las terrazas.


      Antes de Veliko Tarnovo el río vira al norte y corta las alturas de Tarnovo con una garganta pintoresca
      dentro de los límites de la ciudad, que abandona en Samovodene para entrar en la llanura del Danubio.
      Allí, por su escasa pendiente, el río traza grandes meandros, sobre todo en torno a Dolna Oryahovitsa,
      Varbitsa y Draganovo. Tras recibir al Rositsa, su mayor afluente, gira al norte con más meandros y
      brazos abandonados. Aún le queda una garganta más, entre Beltsov, Dzhulyunitsa y Novgrad, antes de
      desembocar en el Danubio a 19 metros de altitud, cerca de Krivina.
    wildlife: >-
      El agua marca el año. El Yantra se alimenta de nieve, lluvia y agua kárstica: en los Balcanes dominan la
      nieve y la lluvia; en la llanura, la lluvia; en el antepaís, el agua subterránea. Las aguas altas llegan
      de marzo a junio en los Balcanes y de enero a junio en la llanura, y en primavera pasa entre el 70 y el
      80 % del caudal anual. Las bajas, de agosto a octubre. El río es propenso a crecidas, y su margen
      izquierda inferior se protege con diques.


      Los habitantes más notables son los peces: se han registrado 64 especies, 55 de ellas autóctonas, y
      muchas son de interés para la conservación y están protegidas. Cuatro de las seis especies de gobios del
      tramo búlgaro del Danubio viven también aquí.
    visit: >-
      Casi todo el valle se recorre por carreteras de la red nacional que siguen el río entre Byala, Veliko
      Tarnovo y Gabrovo. La ciudad de Veliko Tarnovo, «la ciudad de los zares», capital del Segundo Imperio
      Búlgaro, es el mejor punto de partida para ver el río encajado en su garganta urbana. Gabrovo, más
      arriba, fue un centro temprano de educación e industria.
    history: >-
      En la antigüedad, el río se llamaba Iatrus en latín. Todo su curso forma parte de la red Natura 2000,
      con el código BG0000610.
    before: >-
      Las mejores épocas son primavera y otoño. El caudal alto de primavera y las crecidas son un rasgo del
      río.
    around: >-
      A veintitrés kilómetros están los [Humedales de Persina](/lugar/persina-marshes/), y a treinta el
      [Parque Natural de Rusenski Lom](/lugar/priroden-park-rusenski-lom/), dos espacios naturales cercanos.
  en:
    intro: >-
      Veliko Tarnovo is not merely built beside a river: it is nestled within its loops. The old town crowns
      three precipitous hills—Tsarevets, Trapezitsa, and Sveta Gora—rising directly from the meanders of the
      Yantra, where the palaces of Bulgarian tsars stand enclosed by massive medieval stone ramparts. The
      river that fashioned this stronghold is one of Bulgaria's most winding waterways: 285 km from its
      headwaters at 1,220 meters in the Balkan Mountains down to the Danube, alternating between incised gorge
      passages and broad loops across the lowlands.
    landscape: >-
      The Yantra springs at 1,220 meters on the northern slopes of the Balkan Mountains. Down to Gabrovo it
      rushes northwest through a deep canyon blanketed with European beech woods. Between Gabrovo and the
      village of Yantra it breaches the Strazha plateau, carving the rugged Strazha gorge; thereafter the
      valley broadens into cultivated river terraces.


      Approaching Veliko Tarnovo, the river swings north to slice through the Tarnovo heights, creating a
      dramatic urban gorge within city limits before exiting at Samovodene onto the Danube Plain. There, with
      minimal gradient, the Yantra traces looping meanders, particularly around Dolna Oryahovitsa, Varbitsa,
      and Draganovo. After taking in the Rositsa, its main tributary, it heads north across further meanders
      and abandoned oxbows. One final rocky gorge awaits between Beltsov, Dzhulyunitsa, and Novgrad before
      discharging into the Danube at an elevation of 19 meters near Krivina.
    wildlife: >-
      The river's hydrology shapes the ecological calendar. Fed by snowmelt, rains, and karst springs, snow
      and rain prevail in the Balkan range, rainfall across the plains, and subterranean karst water in the
      foothills. High water lasts from March to June in the mountains and January to June in the lowlands,
      carrying 70 to 80% of the annual discharge during spring. Low flow sets in from August to October. The
      river is prone to heavy freshets, requiring flood dikes along its lower left bank.


      The most notable wildlife consists of fish: 64 species have been documented, 55 of them native, with
      many enjoying conservation status and legal protection. Four of the six goby species inhabiting the
      Bulgarian Danube stretch also thrive in the Yantra.
    visit: >-
      Most of the valley can be traced via national paved roads following the river course between Byala,
      Veliko Tarnovo, and Gabrovo. Veliko Tarnovo—the "City of the Tsars" and capital of the Second Bulgarian
      Empire—is the prime staging ground for viewing the urban canyon. Upstream, Gabrovo flourished as an
      early center of Bulgarian education and craftsmanship.
    history: >-
      In classical antiquity, the river bore the Latin name Iatrus. Its entire course is incorporated into the
      Natura 2000 network under site code BG0000610.
    before: >-
      The best travel seasons are spring and autumn. High spring flows and occasional flash floods are
      defining characteristics of the river.
    around: >-
      Twenty-three kilometers away lie the [Persina Marshes](/lugar/persina-marshes/), and thirty kilometers
      distant is [Rusenski Lom Nature Park](/lugar/priroden-park-rusenski-lom/), two prominent neighboring
      natural areas.
  fr:
    intro: >-
      Veliko Tarnovo n'est pas simplement bâtie au bord d'un cours d'eau : elle s'enroule au cœur de ses
      méandres. La cité historique occupe trois collines—Tsarevets, Trapezitsa et Sveta Gora—qui émergent des
      boucles de la Yantra, abritant sur Tsarevets les palais des empereurs bulgares ceints d'épaisses
      murailles. Le cours d'eau qui a forgé ce site est l'un des plus sinueux de Bulgarie : 285 km depuis une
      source à 1 220 mètres d'altitude dans le Grand Balkan jusqu'au Danube, alternant défilés encaissés et
      méandres de plaine.
    landscape: >-
      La Yantra prend sa source à 1 220 mètres sur les contreforts nord de la chaîne du Grand Balkan. Jusqu'à
      Gabrovo, elle descend vers le nord-ouest par une gorge boisée de hêtres européens. Entre Gabrovo et le
      village de Yantra, elle entaille le plateau de Strazha en creusant le défilé éponyme, avant que la
      vallée ne s'élargisse en terrasses cultivées.


      En amont de Veliko Tarnovo, la rivière oblique vers le nord et tranche les hauteurs de Tarnovo par une
      gorge urbaine spectaculaire, qu'elle quitte à Samovodene pour déboucher dans la plaine danubienne. Là,
      sous une très faible pente, elle développe d'amples boucles, notamment autour de Dolna Oryahovitsa,
      Varbitsa et Draganovo. Après avoir reçu la Rositsa, son affluent majeur, elle s'oriente au nord entre
      bras morts et méandres. Une dernière gorge rocheuse l'attend entre Beltsov, Dzhulyunitsa et Novgrad
      avant de rejoindre le Danube à 19 mètres d'altitude près de Krivina.
    wildlife: >-
      Le régime hydrologique rythme l'année. Alimentée par la fonte des neiges, les pluies et les résurgences
      karstiques, la Yantra voit la neige et la pluie dominer dans le Balkan, les pluies en plaine et les eaux
      souterraines sur le piémont. Les hautes eaux surviennent de mars à juin en montagne et de janvier à juin
      en plaine, concentrant 70 à 80 % du débit annuel au printemps. L'étiage s'installe d'août à octobre. La
      rivière est sujette aux crues soudaines, et sa rive gauche inférieure est consolidée de digues.


      Les poissons forment la faune la plus remarquable : 64 espèces ont été recensées, dont 55 indigènes,
      plusieurs bénéficiant d'un statut de protection. Quatre des six espèces de gobies du secteur bulgare du
      Danube peuplent également ses eaux.
    visit: >-
      La majeure partie de la vallée est longée par des routes nationales reliant Byala, Veliko Tarnovo et
      Gabrovo. Veliko Tarnovo, la « cité des tsars » et capitale du Second Empire bulgare, constitue le point
      de départ idéal pour contempler la gorge encaissée. En amont, Gabrovo fut un haut lieu historique de
      l'éducation et de l'artisanat bulgare.
    history: >-
      Dans l'Antiquité, le cours d'eau portait le nom latin d'Iatrus. La totalité de son cours est intégrée au
      réseau Natura 2000 sous l'identifiant BG0000610.
    before: >-
      Les meilleures saisons sont le printemps et l'automne. Le débit vif printanier et les crues
      occasionnelles caractérisent ce cours d'eau.
    around: >-
      À vingt-trois kilomètres s'étendent les [marais de Persina](/lugar/persina-marshes/), et à trente
      kilomètres le [parc naturel de Rusenski Lom](/lugar/priroden-park-rusenski-lom/), deux espaces protégés
      voisins.
  de:
    intro: >-
      Weliko Tarnowo liegt nicht einfach an einem Fluss, sondern schmiegt sich in seine Schleifen. Die
      historische Altstadt nimmt drei markante Hügel ein—Zarewez, Trapesiza und Sweta Gora—, die aus den
      Mäandern der Yantra aufsteigen. Auf dem Zarewez thronen die Paläste der bulgarischen Zaren, geschützt
      von wehrhaften Mauern. Der Fluss, der diese Festung schuf, gehört zu den gewundensten Bulgariens: 285 km
      von der Quelle auf 1.220 Metern im Balkangebirge bis zur Donau, abwechselnd in engen Felsschluchten und
      weiten Schleifen im Tiefland.
    landscape: >-
      Die Yantra entspringt auf 1.220 Metern an den Nordhängen des Balkangebirges. Bis Gabrowo fließt sie
      nordwestwärts durch ein tiefes Buchenwaldtal. Zwischen Gabrowo und dem Dorf Yantra durchbricht sie das
      Strazha-Plateau in einer wilden Schlucht; danach weitet sich das Tal zu Terrassenfluren.


      Vor Weliko Tarnowo wendet sich der Fluss nach Norden und schneidet in die Höhen von Tarnowo eine
      Felsschlucht im Stadtgebiet ein, die er bei Samowodene verlässt, um in die Donautiefebene einzutreten.
      Bei minimalem Gefälle legt die Yantra dort weite Mäander an, namentlich um Dolna Orjachowiza, Warbiza
      und Draganowo. Nach der Einmündung der Rosiza wendet sie sich nordwärts mit Altwassern. Vor der Mündung
      in die Donau bei Kriwina auf 19 Metern Höhe schneidet sie noch einen Felsdurchbruch zwischen Belzow,
      Dschuljuniza und Nowgrad ein.
    wildlife: >-
      Das Wasser bestimmt das Jahr. Die Yantra speist sich aus Schneeschmelze, Regen und Karstquellen: Im
      Balkan dominieren Schnee und Regen, in der Ebene Regen, im Vorland Grundwasser. Hochwasser herrscht im
      Gebirge von März bis Juni, in der Tiefebene von Januar bis Juni; im Frühjahr fließen 70 bis 80 % des
      Jahresvolumens ab. Die Niedrigwasserphase reicht von August bis Oktober. Der Fluss neigt zu Sturzfluten,
      sodass das untere linke Ufer eingedeicht ist.


      Besonders artenreich ist die Fischfauna: 64 Arten wurden nachgewiesen, davon 55 einheimische, viele
      davon naturschutzrelevant. Vier der sechs im bulgarischen Donauabschnitt heimischen Grundelarten leben
      auch hier.
    visit: >-
      Das Tal wird weitgehend von gut ausgebauten Straßen erschlossen, die dem Fluss zwischen Bjala, Weliko
      Tarnowo und Gabrowo folgen. Weliko Tarnowo, die Zarenstadt und Hauptstadt des Zweiten Bulgarischen
      Reiches, ist der ideale Ausgangspunkt für die städtische Flussschlucht. Flussaufwärts war Gabrowo eine
      Wiege des bulgarischen Bildungswesens und Handwerks.
    history: >-
      In der Antike hieß der Fluss lateinisch Iatrus. Sein gesamter Lauf gehört zum Schutzgebietsnetz Natura
      2000 unter der Kennung BG0000610.
    before: >-
      Die besten Reisezeiten sind Frühling und Herbst. Hohe Wasserstände im Frühjahr und gelegentliche Fluten
      prägen den Flusslauf.
    around: >-
      Dreiundzwanzig Kilometer entfernt liegen die [Persina-Feuchtgebiete](/lugar/persina-marshes/) und
      dreißig Kilometer der [Naturpark Rusenski Lom](/lugar/priroden-park-rusenski-lom/).
  it:
    intro: >-
      Veliko Tarnovo non sorge semplicemente lungo un corso d'acqua: è edificata nel cuore delle sue anse. Il
      borgo antico corona tre alture dirupate—Tsarevets, Trapezitsa e Sveta Gora—che si ergono dai meandri
      dello Yantra; su Tsarevets si conservano i palazzi degli zar bulgari racchiusi da imponenti cinte
      murarie. Il fiume che ha modellato questa piazzaforte è tra i più tortuosi della Bulgaria: 285 km da una
      sorgente a 1.220 metri nei Monti Balcani fino al Danubio, alternando gole rupestri e ampie anse di
      pianura.
    landscape: >-
      Lo Yantra nasce a 1.220 metri sui contrafforti settentrionali dei Monti Balcani. Fino a Gabrovo scorre
      verso nord-ovest in una profonda vallata ammantata da faggete montane. Tra Gabrovo e il villaggio di
      Yantra incide l'altopiano di Strazha aprendo una gola selvaggia, prima che la valle si apra in terrazzi
      coltivati.


      Prima di Veliko Tarnovo il fiume volge a settentrione e fende le alture urbane con una spettacolare gola
      cittadina, per poi uscire a Samovodene ed entrare nella pianura danubiana. Lì, per la pendenza
      trascurabile, traccia ampie anse attorno a Dolna Oryahovitsa, Varbitsa e Draganovo. Dopo aver ricevuto
      il Rositsa piega a nord tra rami morti e meandri abbandonati. Supera un'ultima forra tra Beltsov,
      Dzhulyunitsa e Novgrad prima di confluire nel Danubio a 19 metri di quota vicino a Krivina.
    wildlife: >-
      Il ciclo idrologico scandisce le stagioni. Alimentato da nevi, piogge e sorgenti carsiche, nei Balcani
      prevalgono neve e pioggia, nella pianura le precipitazioni e nei rilievi prealpini le acque sotterranee.
      Le piene si verificano da marzo a giugno sui monti e da gennaio a giugno in pianura; in primavera
      transita tra il 70 e l' 80 % della portata annua. La magra interviene da agosto a ottobre. Il fiume è
      soggetto a piene repentine e la sponda sinistra inferiore è difesa da argini.


      La fauna più rilevante è costituita dai pesci: sono state censite 64 specie, di cui 55 autoctone, molte
      delle quali protette. Quattro delle sei specie di ghiozzi del tratto bulgaro del Danubio popolano anche
      lo Yantra.
    visit: >-
      Quasi l'intera vallata è affiancata da strade statali che costeggiano il fiume tra Byala, Veliko Tarnovo
      e Gabrovo. Veliko Tarnovo, la «città degli zar» e capitale del Secondo Impero bulgaro, costituisce la
      base migliore per ammirare il canyon urbano. Risalendo il corso, Gabrovo fu un polo pionieristico per
      l'istruzione e la manifattura.
    history: >-
      Nell'antichità il fiume era denominato Iatrus in latino. L'intero corso rientra nella rete Natura 2000
      con il codice BG0000610.
    before: >-
      I periodi più indicati sono la primavera e l'autunno. Le forti portate primaverili e le piene improvvise
      caratterizzano il regime del fiume.
    around: >-
      A ventitré chilometri si trovano le [Paludi di Persina](/lugar/persina-marshes/) e a trenta il [Parco
      Naturale di Rusenski Lom](/lugar/priroden-park-rusenski-lom/), due riserve limitrofe.
  pt:
    intro: >-
      Veliko Tarnovo não foi simplesmente erguida junto a um rio: foi edificada no interior das suas curvas. O
      centro histórico coroa três colinas alcantiladas—Tsarevets, Trapezitsa e Sveta Gora—que emergem dos
      meandros do Yantra, acolhendo em Tsarevets os palácios dos imperadores búlgaros cercados de muralhas de
      cantaria. O curso de água que moldou esta praça-forte é um dos mais sinuosos da Bulgária: 285 km desde a
      nascente a 1.220 metros na cordilheira dos Balcãs até ao Danúbio, alternando gargantas rochosas e amplos
      laços na planície.
    landscape: >-
      O Yantra nasce a 1.220 metros nos contrafortes setentrionais da cordilheira dos Balcãs. Até Gabrovo
      corre para noroeste através de um vale profundo coberto de faias-europeias. Entre Gabrovo e a povoação
      de Yantra talha o planalto de Strazha abrindo um desfiladeiro acidentado, após o qual o vale alarga em
      terraços agrícolas.


      Antes de Veliko Tarnovo o rio inflete para norte e rasga as alturas de Tarnovo com uma imponente
      garganta urbana, saindo em Samovodene para entrar na planície danubiana. Aí, pela fraca inclinação,
      desenha grandes meandros em redor de Dolna Oryahovitsa, Varbitsa e Draganovo. Após receber o Rositsa,
      seu principal afluente, ruma a norte entre braços mortos e curvas sucessivas. Vence ainda uma última
      garganta rochosa entre Beltsov, Dzhulyunitsa e Novgrad antes de desaguar no Danúbio a 19 metros de
      altitude, junto a Krivina.
    wildlife: >-
      O regime hidrológico comanda o ano. Alimentado por degelo, chuvas e nascentes cársticas, nos Balcãs
      imperam a neve e a chuva, na planície a precipitação e nas colinas a água subterrânea. As águas altas
      decorrem de março a junho na serra e de janeiro a junho na planície; na primavera escoa entre 70 e 80 %
      do caudal anual. As vazantes instalam-se de agosto a outubro. O rio é propenso a cheias rápidas, estando
      a margem esquerda inferior resguardada por diques.


      A fauna mais representativa reúne 64 espécies de peixes inventariadas, 55 das quais autóctones e muitas
      sob proteção legal. Quatro das seis espécies de cabozes do troço búlgaro do Danúbio ocorrem igualmente
      neste rio.
    visit: >-
      Quase todo o vale é servido por estradas nacionais que acompanham as margens entre Byala, Veliko Tarnovo
      e Gabrovo. Veliko Tarnovo, a «cidade dos czares» e capital do Segundo Império Búlgaro, constitui o ponto
      de partida ideal para apreciar o desfiladeiro urbano. A montante, Gabrovo destacou-se no ensino e no
      desenvolvimento manufatureiro.
    history: >-
      Na Antiguidade o rio recebia o nome latino de Iatrus. A totalidade do seu percurso integra a Rede Natura
      2000 sob o código BG0000610.
    before: >-
      As melhores épocas são a primavera e o outono. O caudal volumoso da primavera e as cheias repentinas são
      marcas da dinâmica deste rio.
    around: >-
      A vinte e três quilómetros situam-se os [Pântanos de Persina](/lugar/persina-marshes/) e a trinta o
      [Parque Natural de Rusenski Lom](/lugar/priroden-park-rusenski-lom/), duas áreas naturais contíguas.
