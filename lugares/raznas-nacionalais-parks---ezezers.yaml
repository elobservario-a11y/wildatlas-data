resumen:
  es: El 'Mar de Latgale' (Rāzna) y el lago Ežezers, célebre por albergar más de 33 islas arboladas.
  en: The 'Sea of Latgale' (Lake Rāzna) and Lake Ežezers, renowned for sheltering more than 33 wooded islands.
  fr: La « mer de Latgale » (lac Rāzna) et le lac Ežezers, réputé pour abriter plus de 33 îles boisées.
  de: Das „Meer von Latgale“ (Rāzna-See) und der Ežezers-See, berühmt für mehr als 33 bewaldete Inseln.
  it: Il 'Mare di Latgale' (lago Rāzna) e il lago Ežezers, celebre per custodire oltre 33 isole boscose.
  pt: O 'Mar de Latgale' (lago Rāzna) e o lago Ežezers, afamado por abrigar mais de 33 ilhas arborizadas.
unico:
  es: Un lago-mar rodeado de lagos con islas, robledales insulares y turberas que se cruzan por pasarelas.
  en: >-
    An inland freshwater sea ringed by island-dotted lakes, ancient insular oak groves and raised bogs crossed
    by wooden boardwalks.
  fr: >-
    Une mer d'eau douce intérieure bordée de chapelets de lacs insulaires, de chênaies insulaires et de
    tourbières aménagées de platelages.
  de: >-
    Ein Binnensee von Meeresausmaßen, umgeben von inselreichen Seen, uralten Eichenwäldern und Hochmooren mit
    Bohlenwegen.
  it: >-
    Un mare d'acqua dolce interno circondato da laghi insulari, querOptionleti secolari su isole e torbiere
    percorse da passerelle in legno.
  pt: >-
    Um mar interior de água doce rodeado por lagos insulares, carvalhais seculares em ilhas e turfeiras com
    passadiços de madeira.
observaciones:
