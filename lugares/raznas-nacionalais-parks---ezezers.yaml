texto:
  es:
    intro: >-
      En Latgale, la tierra de los lagos azules y los castros, hay un lago tan grande que lo llaman «el mar».
      El Rāzna es el corazón del parque y el segundo mayor lago de Letonia; por sus playas de arena y su gran
      superficie lo llaman el «mar de Latgale». A su alrededor, el Parque Nacional de Rāzna se extiende por un
      relieve ondulado, nacido de los procesos de la Edad de Hielo hace unos 16.000 años, con colinas,
      bosques, turberas, prados y más lagos: del pequeño Asariņš al cristalino Olovecs y al Ežezers, rico en
      islas.
    landscape: >-
      El parque está salpicado de lagos, y los lagos eutróficos ocupan el catorce por ciento del territorio.
      Sus aguas limpias albergan salmónidos como el repsis y la sīga. Se conocen mejor en barca.


      El Ežezers es uno de los lagos más espectaculares. Sus islas están cubiertas sobre todo de bosques de
      frondosas, con bosques de abeto y manantiales. Es una zona de protección importante de robledales,
      bosques boreales y manantiales ricos en minerales, y en varias islas crece la planta protegida zaļā
      divzobe.


      Alrededor de la mitad del parque es bosque, y los más valiosos se conservan en las laderas empinadas de
      las colinas, los valles de los ríos y las islas de los lagos. En los prados hay cuatro tipos de hábitat
      de importancia europea. Para mantenerlos hace falta gestión regular: los prados antiguos no pueden
      existir sin ella, y los amenaza la invasión de arbustos y árboles. En total, el parque tiene catorce
      tipos de hábitat del anexo primero de la Directiva europea de hábitats.
    wildlife: >-
      El parque es zona importante para las aves, con más de 340 especies, entre ellas el
      [avetoro](/especie/botaurus_stellaris/) y varios somormujos. Entre los mamíferos están el
      [castor](/especie/castor_fiber/), la [nutria](/especie/lutra_lutra/) y el [lobo](/especie/canis_lupus/).
      La protección de los bosques insulares conserva además hábitat de nidificación para los pájaros
      carpinteros. En la isla Lielā sala se ha registrado también la especie protegida dzeltenā dzegužkurpīte.


      En la turbera, las plantas son otro espectáculo: desde la pasarela de Andrupene se observan el algodón
      de pantano, el romero de turbera y la drosera de hojas redondas, y el aroma del té de Labrador embriaga.
    visit: >-
      El sendero del pantano de Andrupene empieza tras la puerta del museo «Andrupenes lauku sēta»: unas
      escaleras de madera bajan hasta la turbera alta y las pasarelas cruzan un claro con pinos bajos. El
      recorrido señalizado mide ochocientos metros y se completa en unos treinta minutos. Los observadores de
      naturaleza prefieren también el robledal de Piloru, en la orilla del Ežezers.


      El sendero de las Piedras de Mākoņkalns, en Jaunstašuļi, enlaza cuatro piedras notables de una misma
      leyenda: Plakanais akmens, Āža mugura, Velna pēda y Zirga pēda. Cerca del Rāzna, la cima de Mākoņkalns
      (248 m) conserva fragmentos del castillo de Volkenberg que los caballeros de la Orden de Livonia
      levantaron en el siglo XIII, y el Lielais Liepukalns (289 m) es la colina más alta de Latgale y la
      tercera de Letonia; su torre de madera de 34 m es la más alta de ese tipo en el país.


      Muchos lugares se pueden ver con facilidad y rapidez siguiendo las rutas ciclistas del parque. En el
      centro de naturaleza se puede ver la exposición «Iepazīsti un sajūti Rāznas nacionālo parku», asistir a
      talleres y pedir información.
    history: >-
      El parque nacional se creó para conservar la naturaleza y el paisaje cultural característico de Latgale.
      Mākoņkalns recuerda los tiempos de la Orden de Livonia, y la tierra que lo rodea es la de los lagos y
      los castros de Latgale.
    before: Consulta con el gestor las normas de uso del parque antes de ir.
    around: >-
      Por sus humedales y aves, el Rāzna comparte especies con el [Dráva River &
      Floodplain](/lugar/drava-river---floodplain/) y el [Hortobágyi Nemzeti Park -
      Puszta](/lugar/hortobagyi-nemzeti-park---puszta/): el sapillo de vientre de fuego, el pigargo y la
      nutria. Con el [Národní park Šumava](/lugar/narodni-park-sumava/) comparte la nutria y Andromeda
      polifolia.
  en:
    intro: >-
      In Latgale, the storied land of blue lakes and ancient hillforts, lies a waterbody so immense that
      locals call it 'the sea'. Lake Rāzna forms the pulsing heart of the park and the second-largest lake in
      Latvia; owing to its wide sandy shores and expansive open waters, it is known as the 'Sea of Latgale'.
      Around its shores, Rāzna National Park rolls across undulating moraine hills shaped by the retreat of
      Ice Age glaciers around 16,000 years ago, interlacing woodlands, raised bogs, wet meadows and a
      constellation of lakes: from tiny Lake Asariņš to crystalline Lake Olovecs and island-studded Lake
      Ežezers.
    landscape: >-
      The national park is adorned with glacial lakes, with eutrophic waterbodies accounting for fourteen
      percent of its total territory. Their pure waters harbour sensitive salmonids such as vendace (*repsis*)
      and whitefish (*sīga*), best explored by wooden boat or canoe.


      Lake Ežezers ranks among Latvia's most spectacular natural treasures. Its numerous islands are draped in
      lush broadleaved deciduous woodlands, spruce groves and mineral springs. The archipelago serves as a
      vital sanctuary for old-growth oak stands, boreal forests and spring-fed wetlands, with several islands
      sheltering the protected moss *zaļā divzobe* (*Dicranum viride*).


      Roughly half the national park is forested, with the most valuable stands clinging to steep morainic
      slopes, river ravines and lake islands. The semi-natural grasslands encompass four distinct habitat
      types of European importance. Regular management is essential: these ancient hay meadows cannot persist
      without traditional mowing or grazing, facing encroachment from encroaching brush. In total, the park
      protects fourteen habitat types listed under Annex I of the EU Habitats Directive.
    wildlife: >-
      The national park is designated as an Important Bird Area, with over 340 bird species recorded,
      including the secretive [Eurasian bittern](/especie/botaurus_stellaris/) and diverse grebes. Native
      mammals include the Eurasian [beaver](/especie/castor_fiber/), European [otter](/especie/lutra_lutra/)
      and grey [wolf](/especie/canis_lupus/). The conservation of forested lake islands safeguards essential
      nesting cavities for rare woodpeckers. On the island of Lielā sala, botanists have documented the
      strictly protected lady's slipper orchid (*Cypripedium calceolus*, known locally as *dzeltenā
      dzegužkurpīte*).


      In the peat bogs, vegetation displays another fascinating panorama: along the Andrupene boardwalk you
      can observe cotton grass, bog rosemary and round-leaved sundew, while the sweet resinous scent of wild
      rosemary (Labrador tea) fills the air.
    visit: >-
      The Andrupene bog trail begins directly behind the 'Andrupenes lauku sēta' open-air museum: wooden
      stairs descend into the raised bog, leading to boardwalks traversing stunted pine woodland. The
      signposted interpretive circuit measures eight hundred metres, taking roughly thirty minutes to
      complete. Nature lovers also appreciate the venerable Piloru oak stand situated on the wooded shore of
      Lake Ežezers.


      The Mākoņkalns Stone Trail in Jaunstašuļi connects four notable boulder monuments linked by local
      folklore: Plakanais akmens, Āža mugura, Velna pēda and Zirga pēda. Near Lake Rāzna, the summit of
      Mākoņkalns (248 m) preserves romantic stone masonry fragments of Volkenberg Castle, erected by Livonian
      Order knights in the XIII century. Lielais Liepukalns (289 m) forms the highest hill in Latgale and
      third-highest in Latvia; its 34 m wooden observation tower is the tallest wooden watchtower in the
      country.


      Many of the park's scenic highlights can be discovered easily along marked cycling trails. The park
      nature centre hosts the interactive exhibition 'Iepazīsti un sajūti Rāznas nacionālo parku', providing
      workshops, guided visits and local trail maps.
    history: >-
      The national park was established to safeguard both the exceptional lakeland ecosystems and the unique
      cultural landscape of Latgale. Mākoņkalns evokes the medieval frontier era of the Livonian Order, while
      the surrounding countryside preserves the heritage of Latgale's ancient hillforts and artisan lake
      communities.
    before: Check park regulations with authorities before your visit.
    around: >-
      Through its lacustrine wetlands and birdlife, Lake Rāzna shares species with the [Dráva River &
      Floodplain](/lugar/drava-river---floodplain/) and [Hortobágyi National Park -
      Puszta](/lugar/hortobagyi-nemzeti-park---puszta/): fire-bellied toads, white-tailed eagles and otters.
      With [Šumava National Park](/lugar/narodni-park-sumava/) it shares the otter and bog rosemary
      (*Andromeda polifolia*).
  fr:
    intro: >-
      En Latgale, la contrée des lacs bleus et des collines fortifiées, s'étend un plan d'eau si vaste qu'on
      le qualifie de mer. Le lac Rāzna constitue le cœur du parc et le deuxième plus grand lac de Lettonie ;
      ses grèves sablonneuses et son horizon dégagé lui valent le surnom de « mer de Latgale ». Autour de ses
      eaux, le parc national de Rāzna ondule à travers des reliefs morainiques nés de la fonte des glaciers il
      y a environ 16 000 ans, parsemés de collines, forêts, tourbières, prairies et d'autres lacs : du petit
      Asariņš aux eaux limpides d'Olovecs et au lac Ežezers, parsemé d'îles.
    landscape: >-
      Le parc national est ponctué de plans d'eau glaciaires, les lacs eutrophes occupant quatorze pour cent
      de la superficie totale. Leurs eaux pures abritent des salmonidés sensibles comme la corégone blanche
      (*repsis*) et le lavaret (*sīga*). C'est en barque ou en canoë qu'on les découvre le mieux.


      Le lac Ežezers s'impose comme l'un des joyaux naturels les plus pittoresques de Lettonie. Ses nombreuses
      îles sont garnies de feuillus nobles, d'épicéas et de sources minérales. L'archipel protège de
      précieuses chênaies, des taïgas boréales et des suintements alcalins, plusieurs îlots abritant la mousse
      rare et protégée *zaļā divzobe* (*Dicranum viride*).


      Près de la moitié du parc est boisée, les massifs les plus remarquables s'accrochant aux versants
      abrupts, aux combes alluviales et aux îles lacustres. Les prairies semi-naturelles renferment quatre
      types d'habitats d'intérêt communautaire. Leur pérennité exige une fauche annuelle régulière pour éviter
      l'embroussaillement spontané. Au total, le parc compte quatorze habitats naturels inscrits à l'annexe I
      de la directive Habitats de l'Union européenne.
    wildlife: >-
      Le parc est désigné Zone importante pour la conservation des oiseaux, comptant plus de 340 espèces
      recensées, dont le discret [butor étoilé](/especie/botaurus_stellaris/) et plusieurs grèbes. Les
      mammifères comptent le [castor](/especie/castor_fiber/) d'Europe, la [loutre](/especie/lutra_lutra/) et
      le [loup](/especie/canis_lupus/). La protection des forêts insulaires garantit des sites de nidification
      privilégiés pour diverses espèces de pics. Sur l'île de Lielā sala prospère également le sabot de Vénus
      (*Cypripedium calceolus*, nommé localement *dzeltenā dzegužkurpīte*).


      Dans la tourbière ombrotrophique, la flore offre un régal visuel : le long du sentier sur caillebotis
      d'Andrupene s'observent linaigrettes cotonneuses, andromèdes et droséras à feuilles rondes, baignés dans
      l'arôme caractéristique du thé du Labrador.
    visit: >-
      Le sentier de la tourbière d'Andrupene débute derrière l'écomusée « Andrupenes lauku sēta » : un
      escalier de bois descend dans la tourbière haute, menant aux caillebotis qui cheminent parmi les pins
      nains. Ce parcours pédagogique balisé mesure huit cents mètres et se parcourt en une trentaine de
      minutes. Les observateurs naturalistes affectionnent également la chênaie séculaire de Piloru sur les
      berges du lac Ežezers.


      Le sentier des blocs erratiques de Mākoņkalns, à Jaunstašuļi, relie quatre rochers légendaires :
      Plakanais akmens, Āža mugura, Velna pēda et Zirga pēda. Près du lac Rāzna, la colline de Mākoņkalns (248
      m) conserve les vestiges du château médiéval de Volkenberg bâti au XIIIe siècle par les chevaliers de
      l'Ordre teutonique de Livonie. Le mont Lielais Liepukalns (289 m) forme le point culminant de Latgale et
      le troisième sommet de Lettonie ; sa tour panoramique en bois de 34 m de haut est la plus élevée du
      pays.


      De multiples itinéraires cyclables balisés permettent de découvrir facilement le parc. Le centre
      d'accueil présente l'exposition « Iepazīsti un sajūti Rāznas nacionālo parku ».
    history: >-
      Le parc national a été établi pour préserver la nature lacustre et les traditions culturelles typiques
      de Latgale. Mākoņkalns témoigne de l'époque médiévale des chevaliers de Livonie, tandis que les
      campagnes environnantes préservent l'âme des anciens villages lacustres lettons.
    before: Consultez le règlement du parc auprès des gestionnaires avant votre visite.
    around: >-
      Par ses milieux humides et ses oiseaux d'eau, le lac Rāzna partage des espèces avec le [fleuve et plaine
      inondable de la Drave](/lugar/drava-river---floodplain/) et le [parc national de Hortobágy -
      Puszta](/lugar/hortobagyi-nemzeti-park---puszta/) : sonneur à ventre de feu, pygargue et loutre. Avec le
      [parc national de Šumava](/lugar/narodni-park-sumava/), il partage la loutre et l'andromède (*Andromeda
      polifolia*).
  de:
    intro: >-
      In Latgale, dem lettischen Land der blauen Seen und Burgberge, ruht ein See, der so weit ist, dass die
      Menschen ihn Meer nennen. Der Rāzna-See bildet das Herz des Schutzgebiets und ist der zweitgrößte See
      Lettlands; wegen seiner Sandstrände und weiten Wasserfläche trägt er den Beinamen „Meer von Latgale“.
      Ringsum erstreckt sich der Rāzna-Nationalpark über ein sanftes Hügelland, das vor rund 16.000 Jahren
      beim Rückzug der Gletscher entstand, durchwoben von Wäldern, Mooren, Wiesen und weiteren Seen: vom
      kleinen Asariņš über den klaren Olovecs bis zum inselreichen Ežezers.
    landscape: >-
      Zahllose Gewässer prägen den Park; eutrophe Seen nehmen vierzehn Prozent der Gesamtfläche ein. Ihre
      sauberen Fluten beherbergen anspruchsvolle Salmoniden wie Kleine Maräne (*repsis*) und Große Maräne
      (*sīga*), die sich am besten bei einer Bootsfahrt entdecken lassen.


      Der Ežezers gilt als eines der landschaftlichen Glanzlichter Lettlands. Seine Inseln tragen üppige
      Laubmischwälder, Fichtenforste und Mineralquellen. Der See ist ein Refugium für alte Eichenhaine,
      boreale Nadelwälder und Quellmoore; auf mehreren Inseln wächst das seltene Laubmoos *zaļā divzobe*
      (*Dicranum viride*).


      Etwa die Hälfte des Schutzgebiets ist bewaldet; die wertvollsten Bestände finden sich an steilen
      Moränenhängen, in Bachtälern und auf Seeinseln. Auf den Wiesen kommen vier Lebensraumtypen von
      europäischer Bedeutung vor. Um sie zu erhalten, bedarf es regelmäßiger Mahd, da sie sonst verbuschen.
      Insgesamt schützt der Park vierzehn Lebensraumtypen des Anhangs I der europäischen FFH-Richtlinie.
    wildlife: >-
      Der Nationalpark ist ein bedeutendes Vogelschutzgebiet mit über 340 erfassten Vogelarten, darunter die
      [Rohrdommel](/especie/botaurus_stellaris/) und verschiedene Lappentaucher. Unter den Säugetieren leben
      hier [Biber](/especie/castor_fiber/), [Fischotter](/especie/lutra_lutra/) und
      [Wolf](/especie/canis_lupus/). Die geschützten Inselwälder bieten Altholzhöhlen für seltene Spechte. Auf
      der Insel Lielā sala wächst zudem der geschützte Gelbe Frauenschuh (*Cypripedium calceolus*, lettisch
      *dzeltenā dzegužkurpīte*).


      In den Hochmooren entfaltet die Flora einen besonderen Zauber: Entlang des Bohlenwegs von Andrupene
      blühen Wollgras, Rosmarinheide und Sonnentau, während der balsamische Duft des Sumpfporstes die Luft
      erfüllt.
    visit: >-
      Der Moorpfad Andrupene beginnt direkt hinter dem Freilichtmuseum „Andrupenes lauku sēta“: Holzstufen
      führen hinab ins Hochmoor, wo Stege durch lichte Moorwälder leiten. Der markierte Lehrpfad ist
      achthundert Meter lang und in dreißig Minuten bequem zu begehen. Naturbeobachter schätzen auch den
      Piloru-Eichenwald am Ufer des Ežezers-Sees.


      Der Findlingspfad von Mākoņkalns in Jaunstašuļi verbindet vier sagenumwobene Kultsteine: Plakanais
      akmens, Āža mugura, Velna pēda und Zirga pēda. Nahe dem Rāzna-See birgt die Kuppe des Mākoņkalns (248 m)
      Reste der Burg Wolkenberg des Livländischen Ordens aus dem XIII. Jahrhundert. Der Lielais Liepukalns
      (289 m) ist die höchste Erhebung Latgales und die dritthöchste Lettlands; sein hölzerner Aussichtsturm
      misst 34 m und ist der höchste Holzturm des Landes.


      Zahlreiche Radwege erschließen die Landschaft des Parks. Das Nationalparkzentrum bietet die
      Dauerausstellung „Iepazīsti un sajūti Rāznas nacionālo parku“.
    history: >-
      Der Nationalpark wurde gegründet, um die Gewässer und das historische Kulturland Latgales zu bewahren.
      Mākoņkalns erinnert an die Zeit des Livländischen Ordens, während die umliegenden Dörfer vom Erbe alter
      Burgberge zeugen.
    before: Informiere dich vor dem Besuch bei der Parkverwaltung über die Regeln.
    around: >-
      Aufgrund seiner Feuchtgebiete und Wasserfluren teilt der Rāzna-See Arten mit der [Drau &
      Auen](/lugar/drava-river---floodplain/) und dem [Hortobágyi-Nationalpark -
      Puszta](/lugar/hortobagyi-nemzeti-park---puszta/): Rotbauchunke, Seeadler und Fischotter. Mit dem
      [Nationalpark Šumava](/lugar/narodni-park-sumava/) teilt er Fischotter und Rosmarinheide (*Andromeda
      polifolia*).
  it:
    intro: >-
      In Latgale, la terra dei laghi azzurri e degli antichi castelliere, si adagia uno specchio d'acqua così
      sconfinato da essere chiamato mare. Il lago Rāzna costituisce il cuore pulsante del parco e il secondo
      lago per estensione della Lettonia; per i suoi lidi sabbiosi e i grandi orizzonti aperti è detto il
      'mare di Latgale'. Tutt'intorno il Parco Nazionale di Rāzna si estende su colline moreniche nate dallo
      scioglimento dei ghiacciai circa 16.000 anni fa, tra boschi, torbiere, prati umidi e una costellazione
      di bacini lacustri: dal minuscolo Asariņš al limpido Olovecs sino all'Ežezers, ricco di isole.
    landscape: >-
      Il territorio è costellato di conche lacustri, con laghi eutrofici che coprono il quattordici percento
      della superficie totale. Le loro acque pure ospitano salmonidi esigenti come il coregone bianco
      (*repsis*) e la lavarello (*sīga*), da esplorare in barca a remi.


      Il lago Ežezers è una delle perle paesaggistiche più celebrate della Lettonia. Le sue isole sono
      rivestite di latifoglie decidue, abetaie e scaturigini sorgive. È una riserva strategica per querceti
      vetusti, foreste boreali e torbiere alcaline; su vari isolotti vegeta il raro muschio protetto *zaļā
      divzobe* (*Dicranum viride*).


      Circa metà del parco è ricoperta da boschi, i cui lembi più preziosi allignano sui pendii scoscesi,
      nelle forre e sulle isole lacustri. Le praterie seminaturali accolgono quattro habitat d'interesse
      comunitario europeo. Per conservarle occorre uno sfalcio periodico, altrimenti i prati storici
      verrebbero soffocati da boscaglie pioniere. In totale il parco custodisce quattordici habitat
      dell'allegato I della Direttiva europea Habitat.
    wildlife: >-
      Il parco è classificato come Important Bird Area e ospita oltre 340 specie di uccelli, tra cui il
      riservato [tarabuso](/especie/botaurus_stellaris/) e vari svassi. Tra i mammiferi dimorano il
      [castoro](/especie/castor_fiber/) europeo, la [lontra](/especie/lutra_lutra/) e il
      [lupo](/especie/canis_lupus/). La tutela dei boschi insulari offre cavità nido preziose per i picchi.
      Sull'isola Lielā sala è attestata la presenza dell'orchidea scarpetta di Venere (*Cypripedium
      calceolus*, detta *dzeltenā dzegužkurpīte*).


      Nella torbiera alta la vegetazione riserva scorci suggestivi: lungo la passerella di Andrupene
      fioriscono l'erioforo, il rosmarino selvatico e la drosera a foglie rotonde, inebriando l'aria con il
      profumo resinoso del té di palude.
    visit: >-
      Il percorso nella torbiera di Andrupene prende avvio dietro il museo etnografico 'Andrupenes lauku
      sēta': gradinate di legno scendono nella torbiera alta, dove passerelle guidano tra pini nani contorti.
      Il tracciato misura ottocento metri e si percorre in circa trenta minuti. Gli amanti della natura
      apprezzano anche la querceta secolare di Piloru sulle sponde dell'Ežezers.


      Il sentiero dei massi erratici di Mākoņkalns, a Jaunstašuļi, unisce quattro pietre leggendarie:
      Plakanais akmens, Āža mugura, Velna pēda e Zirga pēda. Vicino al lago Rāzna, la collina di Mākoņkalns
      (248 m) conserva i ruderi del castello di Volkenberg, eretto dai cavalieri di Livonia nel XIII secolo.
      Lielais Liepukalns (289 m) è il rilievo più alto del Latgale e il terzo della Lettonia; la sua torre
      panoramica in legno di 34 m è la più alta nel suo genere nel paese.


      Numerosi itinerari ciclabili permettono di ammirare comodamente i paesaggi del parco. Il centro visite
      ospita la mostra interattiva 'Iepazīsti un sajūti Rāznas nacionālo parku'.
    history: >-
      Il parco nazionale è nato per proteggere la natura lacustre e il peculiare paesaggio storico rurale del
      Latgale. Mākoņkalns testimonia il passato medievale dell'Ordine di Livonia, mentre le colline
      circostanti preservano l'eredità degli antichi villaggi lacustri.
    before: Verifica le norme di visita con l'ente parco prima di partire.
    around: >-
      Per i suoi ambienti lacustri e l'avifauna, il lago Rāzna condivide specie con il [Fiume Drava e piana
      alluvionale](/lugar/drava-river---floodplain/) e il [Parco nazionale di Hortobágy -
      Puszta](/lugar/hortobagyi-nemzeti-park---puszta/): ululone dal ventre rosso, aquila di mare e lontra.
      Con il [Parco nazionale di Šumava](/lugar/narodni-park-sumava/) condivide la lontra e l'andromeda
      (*Andromeda polifolia*).
  pt:
    intro: >-
      Em Latgale, a lendária terra dos lagos azuis e dos castros históricos, repousa um lago tão vasto que os
      habitantes lhe chamam mar. O lago Rāzna constitui o núcleo do parque e o segundo maior lago da Letónia;
      pelas suas praias de areia e grande extensão aberta é cognominado o 'mar de Latgale'. Em seu redor, o
      Parque Nacional de Rāzna ondula por colinas morenicas nascidas do recuo dos glaciares há cerca de 16.000
      anos, entrelaçando bosques, turfeiras, prados e inúmeros lagos: do pequeno Asariņš ao límpido Olovecs e
      ao Ežezers, salpicado de ilhas.
    landscape: >-
      O parque é pontilhado por dezenas de lagos, ocupando as massas eutróficas catorze por cento da área
      total. As suas águas cristalinas albergam salmonídeos exigentes como a corégona-branca (*repsis*) e o
      lavagante-de-água-doce (*sīga*), ideais para explorar em embarcações tradicionais.


      O lago Ežezers figura entre os tesouros cénicos mais afamados da Letónia. As suas ilhas encontram-se
      cobertas por florestas de folhosas nobres, abetos e nascentes de encosta. Trata-se de um refúgio para
      carvalhais antigos, florestas boreais e turfeiras alcalinas; em várias ilhotas medra o musgo protegido
      *zaļā divzobe* (*Dicranum viride*).


      Quase metade da área protegida é florestada, sobressaindo as matas preservadas nas encostas íngremes,
      nos vales ripícolas e nas ilhas dos lagos. Os prados seminaturais congregam quatro tipos de habitats de
      interesse comunitário europeu. A sua manutenção exige ceifa tradicional periódica para travar o avanço
      de matos. No conjunto, o parque protege catorze habitats do anexo I da Diretiva Habitats da União
      Europeia.
    wildlife: >-
      O parque constitui uma Área Importante para as Aves com mais de 340 espécies inventariadas, incluindo o
      tímido [abicaravão](/especie/botaurus_stellaris/) e vários mergulhões. Nos mamíferos salientam-se o
      [castor](/especie/castor_fiber/) europeu, a [lontra](/especie/lutra_lutra/) e o
      [lobo](/especie/canis_lupus/). O estatuto de proteção dos bosques insulares assegura cavidades vitais de
      nidificação para várias espécies de pica-paus. Na ilha de Lielā sala está confirmada a orquídea
      protegida sapatinho-de-vénus (*Cypripedium calceolus*, designada *dzeltenā dzegužkurpīte*).


      Nas turfeiras altas a flora compõe outro cenário único: ao longo do passadiço de Andrupene observam-se
      erva-algodão, andrómeda e drósera de folhas redondas, perfumadas pelo aroma doce do chá-de-labrador.
    visit: >-
      O trilho da turfeira de Andrupene inicia-se junto ao museu etnográfico 'Andrupenes lauku sēta':
      escadarias de madeira conduzem à turfeira alta, onde passadiços cruzam clareiras de pinheiros anões. O
      circuito assinalado mede oitocentos metros e realiza-se em cerca de trinta minutos. Os naturalistas
      procuram também o carvalhal secular de Piloru nas margens do lago Ežezers.


      O trilho dos blocos erráticos de Mākoņkalns, em Jaunstašuļi, reúne quatro penedos lendários: Plakanais
      akmens, Āža mugura, Velna pēda e Zirga pēda. Perto do lago Rāzna, o cimo de Mākoņkalns (248 m) preserva
      vestígios do castelo de Volkenberg construído pelos cavaleiros da Ordem da Livónia no século XIII.
      Lielais Liepukalns (289 m) é a maior colina de Latgale e a terceira da Letónia; a sua torre de madeira
      de 34 m de altura é a mais alta do género no país.


      Muitos pontos panorâmicos podem ser visitados de bicicleta por percursos sinalizados. O centro de
      interpretação disponibiliza a exposição interativa 'Iepazīsti un sajūti Rāznas nacionālo parku'.
    history: >-
      O parque nacional foi criado com a missão de salvaguardar os ecossistemas lacustres e as paisagens
      humanizadas tradicionais de Latgale. Mākoņkalns recorda a era medieval da Ordem da Livónia, enquanto os
      montes envolventes mantêm viva a memória dos antigos povoados lacustres.
    before: Consulta as normas de uso com a administração do parque antes de ir.
    around: >-
      Graças aos seus sapais e avifauna palustre, o lago Rāzna partilha espécies com o [Rio Drava e Planície
      Aluvial](/lugar/drava-river---floodplain/) e o [Parque Nacional de Hortobágy -
      Puszta](/lugar/hortobagyi-nemzeti-park---puszta/): bombina-de-barriga-vermelha, águia-rabalva e lontra.
      Com o [Parque Nacional de Šumava](/lugar/narodni-park-sumava/) partilha a lontra e a andrómeda
      (*Andromeda polifolia*).
