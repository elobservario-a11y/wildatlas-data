unico:
  es: >-
    Un valle de bosques casi naturales, algo raro en la región, con dos ríos salvajes y un musgo que mide la
    salud del bosque.
  en: >-
    A secluded valley of near-natural forests rare in the region, shaped by two wild torrents and indicator
    mosses tracking forest health.
  fr: >-
    Une vallée de forêts subnaturelles, fait exceptionnel dans la région, baignée par deux rivières
    impétueuses et des mousses témoins de la naturalité sylvicole.
  de: >-
    Ein Tal mit urwüchsigen, in der Region seltenen Wäldern, zwei Wildflüssen und seltenen Moosen als
    Bioindikatoren ungestörter Waldökologie.
  it: >-
    Una forra di boschi sub-naturali rari nella regione, scavata da due fiumi impetuosi e popolata da muschi
    bioindicatori della salute forestale.
  pt: >-
    Um vale de florestas subnaturais, invulgares na região, moldado por dois rios impetuosos e musgos
    bioindicadores do equilíbrio florestal.
observaciones:
  es: >-
    Hay que moverse solo por las rutas señalizadas y la carretera local, y los ciclistas y automovilistas
    deben usar solo la carretera local. Se pide dejar los bloques en su sitio, disfrutar de las plantas raras
    solo con la vista y llevarse los residuos.
texto:
  es:
    intro: >-
      Se llama Peklo, «infierno» en checo, y según la leyenda es el valle de los fantasmas. Quien lo recorre
      hoy encuentra más bien un cañón de bosque, con dos ríos de aguas rápidas que se juntan al pie de laderas
      llenas de bloques de piedra. La reserva protege los valles de los ríos sin regular Metuje y Olešenka,
      junto a la frontera con Polonia, entre Nové Město nad Metují, Náchod y Česká Čermná, y es una de las
      partes mejor conservadas de la naturaleza de la región de Náchod.
    landscape: >-
      El Metuje y el Olešenka conservan un carácter muy natural, con lechos de grava y piedra, mucha pendiente
      y rápidos. A los lados, las laderas rocosas reúnen muchas formas de roca y mares de bloques con
      desniveles de hasta 200 m: desde bloques terciarios en forma de saco y rocas tipo tor hasta escarpes de
      hielo y mares de bloques cuaternarios, el paisaje de un valle que cambió de aspecto con cada era. El
      sustrato son las filitas de Nové Město, rocas metamórficas del Proterozoico con algo de granodiorita y
      sedimentos pérmicos, y en el cauce del Olešenka y en las rocas de Kozí hřbet hay grandes bloques de
      granodiorita rosada de grano grueso.


      El bosque lo cubre todo. Los bosques de Peklo se parecen a los naturales y casi no han sido tocados,
      algo raro en la región; son sobre todo hayedos y pedregales con abeto, olmo, lirio y torvisco. Entre los
      árboles hay [abeto blanco](/especie/abies_alba/), la barba de cabra y los olmos Ulmus minor y Ulmus
      glabra. Los prados son otra cosa: nacieron al talar el bosque original y se mantienen con pastoreo o
      siega al menos una vez al año, en distintas fechas por zonas.
    wildlife: >-
      Lo mejor de Peklo se ve de cerca y despacio. En los prados húmedos florecen el vstavač mužský y el
      vstavač osmahlý, dos orquídeas, y en las rocas crece el helecho de Braun. En las zonas inundables se han
      registrado la campanilla de primavera y la nivéola. Y sobre la madera muerta crece el musgo discreto y
      raro šikoušek zelený, que no vive en bosques de producción y es un indicador de la salud del bosque
      donde se gestiona de forma cercana a la naturaleza.


      Hay anfibios y reptiles raros, y se citan la [salamandra común](/especie/salamandra_salamandra/), la
      [cigüeña negra](/especie/ciconia_nigra/) y el [halcón abejero](/especie/pernis_apivorus/).
    visit: >-
      La ruta de Nové Město por Přibyslav y Peklo mide 11 km y está señalizada como fácil. Lleva unas 2 h 25
      min de marcha, tiene 170 m de desnivel y su punto más alto es Přibyslav, a 470 m. En ella hay muchos
      miradores, la cabaña turística de Peklo, bosques mixtos en laderas empinadas, afloramientos de roca y el
      Metuje con vegetación de ribera vieja. Otra opción es el circuito desde Náchod por el valle de Peklo y
      Dobrošov: hay que contar con cinco horas de marcha, y el municipio recomienda hacerlo de mayo a
      septiembre.


      Por la ladera sube un antiguo camino de piedra que permite ver los bosques desde arriba. Y en la
      confluencia, la Bartoňova útulna, un molino reconvertido en 1910 en un restaurante de excursión de
      estilo modernista por Dušan Jurkovič.
    history: >-
      Alois Jirásek situó en Peklo la acción de su relato V Pekle, y la leyenda del valle de los fantasmas lo
      acompaña. Hoy los problemas son otros. El de Peklo no es el escarabajo de la corteza, aunque mata abetos
      plantados por el hombre en grandes superficies; el gran reto es la regeneración natural del bosque donde
      faltan piceas vivas. A los brotes jóvenes los amenaza el ramoneo de los muflones, una especie
      introducida, y la peste de agua crece en el cauce del río y desplaza a otros organismos mientras las
      balsaminas invaden las orillas.


      La respuesta es de gestión. Los silvicultores reducen la picea y el alerce y favorecen árboles pioneros,
      abetos blancos y frondosas locales, y pequeños grupos de árboles jóvenes se protegen con vallas contra
      los animales de caza.
    before: >-
      Hay que moverse solo por las rutas señalizadas y la carretera local, y los ciclistas y automovilistas
      deben usar solo la carretera local. Se pide dejar los bloques en su sitio, disfrutar de las plantas
      raras solo con la vista y llevarse los residuos.
    around: '[Orlické hory](/lugar/orlicke-hory---gory-bystrzyckie/) está a unos seis kilómetros.'
  en:
    intro: >-
      It is called Peklo, meaning “hell” in Czech, and local folklore knows it as the valley of ghosts. Yet
      whoever walks here today finds a deep forested canyon, where two fast-flowing rivers meet at the foot of
      boulder-strewn slopes. The reserve safeguards the wild, unregulated valleys of the Metuje and Olešenka
      rivers near the Polish border, between Nové Město nad Metují, Náchod and Česká Čermná, representing one
      of the finest preserved natural landscapes in the Náchod region.
    landscape: >-
      The Metuje and Olešenka preserve an untamed character, with gravel-and-boulder riverbeds, steep
      gradients and lively rapids. On both flanks, rocky slopes exhibit varied geomorphological features and
      blockfields with relief changes of up to 200 m: from Tertiary rounded corestones and tor-like outcrops
      to periglacial frost-shattered cliffs and Quaternary block seas — the hallmarks of a valley reshaped
      across geological epochs. The underlying bedrock consists of Nové Město phyllites, Proterozoic
      metamorphic rocks interspersed with granodiorite and Permian sediments; coarse pink granodiorite
      boulders lie along the Olešenka riverbed and the Kozí hřbet crags.


      Dense woodland blankets the terrain. The forests of Peklo closely resemble natural, unmanaged ecosystems
      — an exceptional rarity in the region. They are predominantly mixed beech and scree slope woodlands with
      fir, elm, martagon lily and mezereon. Prominent native trees include [silver fir](/especie/abies_alba/),
      aruncus goat's-beard, and native elms Ulmus minor and Ulmus glabra. The river meadows offer a
      contrasting open landscape: created by historic forest clearing, they are maintained through traditional
      grazing or mowing at least once a year across rotating parcels.
    wildlife: >-
      The finest aspects of Peklo reveal themselves at a slow, attentive pace. Moist meadows bloom with early
      purple orchid and burnt-tip orchid, while Braun's holly fern colonises shaded rock fissures. Seasonally
      inundated riverbanks feature spring snowflake and wild daffodils. On decaying logs grows the rare,
      inconspicuous moss Buxbaumia viridis (*šikoušek zelený*), an indicator species that shuns commercial
      plantations and confirms close-to-nature forestry management.


      Rare amphibians and reptiles inhabit the reserve, alongside recorded breeding pairs of [fire
      salamander](/especie/salamandra_salamandra/), [black stork](/especie/ciconia_nigra/) and [European honey
      buzzard](/especie/pernis_apivorus/).
    visit: >-
      The marked trail from Nové Město via Přibyslav and Peklo covers 11 km and is graded easy. It takes about
      2 h 25 min of hiking, climbs 170 m of elevation gain, and reaches its highest point at Přibyslav at 470
      m. Along the way lie scenic viewpoints, the Peklo tourist refuge, mixed forests on steep canyon slopes,
      rock crags, and the Metuje river with mature riparian greenery. Another classic route is the circuit
      from Náchod through the Peklo valley and Dobrošov: allow five hours of walking, and the municipality
      recommends visiting from May through September.


      An ancient stone path climbs the valley flank, offering views over the forest canopy from above. At the
      river confluence stands the historic Bartoňova útulna, an old timber mill converted in 1910 into a
      celebrated Art Nouveau excursion inn designed by architect Dušan Jurkovič.
    history: >-
      Writer Alois Jirásek set his classic short story *V Pekle* here, cementing the legend of the valley of
      ghosts. Modern environmental concerns are different. Peklo's challenge is not the spruce bark beetle,
      although it has impacted commercial monocultures over wide areas; the central priority is fostering
      natural woodland regeneration where seed-bearing spruces are missing. Tender young saplings face
      browsing pressure from introduced mouflons, while Canadian waterweed thrives in the stream channel and
      invasive Himalayan balsam spreads along riverbanks.


      Forest management focuses on restoring ecological balance. Foresters selectively thin Norway spruce and
      European larch to promote pioneer trees, silver fir and native deciduous species, protecting small
      clusters of saplings with wooden enclosures against game.
    before: >-
      Stay strictly on signposted trails and the local public roadway; cyclists and motor vehicles must remain
      exclusively on the paved access road. Leave rock blocks undisturbed, admire rare flora without picking
      specimens, and pack out all rubbish.
    around: '[Orlické hory](/lugar/orlicke-hory---gory-bystrzyckie/) lies about six kilometres away.'
  fr:
    intro: >-
      Elle s'appelle Peklo, mot tchèque signifiant « enfer », et la tradition populaire en fait la vallée des
      fantômes. Le visiteur qui la parcourt aujourd'hui y découvre surtout un profond canyon forestier, où
      deux rivières aux flots vifs se rejoignent au pied de versants hérissés de blocs de pierre. La réserve
      protège les vallées sauvages et libres de la Metuje et de l'Olešenka, près de la frontière polonaise,
      entre Nové Město nad Metují, Náchod et Česká Čermná, constituant l'un des espaces naturels les plus
      remarquables de la région de Náchod.
    landscape: >-
      La Metuje et l'Olešenka conservent une dynamique torrentielle intacte, avec lits de galets, fortes
      pentes et rapides bouillonnants. De part et d'autre, les versants rocheux présentent un riche relief
      périglaciaire et des chaos de blocs atteignant jusqu'à 200 m de dénivelé : blocs arrondis d'altération
      tertiaire, tors ruiniformes et mers de blocs quaternaires témoignent d'une vallée façonnée au fil des
      ères. Le substrat est formé des phyllades de Nové Město, roches métamorphiques du Protérozoïque
      associées à des granodiorites et des sédiments permiens ; le lit de l'Olešenka et la crête de Kozí hřbet
      exposent de gros blocs de granodiorite rose à gros grains.


      La forêt recouvre l'ensemble du relief. Les massifs de Peklo présentent une naturalité rare et n'ont
      presque pas subi d'exploitation intensive ; ce sont principalement des hêtraies de ravin et des forêts
      de pente à sapin, orme, lis martagon et bois-joli. Parmi les arbres remarquables figurent le [sapin
      blanc](/especie/abies_alba/), la barbe-de-bouc et les ormes indigènes Ulmus minor et Ulmus glabra. Les
      prairies de fauche sont issues des défrichements historiques et sont entretenues par la fauche ou le
      pâturage au moins une fois par an sur des parcelles échelonnées.
    wildlife: >-
      Les richesses de Peklo s'apprécient à pas lents. Dans les prairies humides fleurissent deux orchidées
      délicates, l'orchis mâle et l'orchis brûlé, tandis que la fougère de Braun s'accroche aux fissures
      rocheuses. Les berges inondables accueillent la nivéole de printemps et la clochette des bois. Sur le
      bois mort croît une mousse rare et discrète, la buxbaumie verte (*šikoušek zelený*), absente des forêts
      exploitées et bio-indicatrice de la haute valeur écologique des peuplements forestiers.


      On y recense des amphibiens et reptiles protégés, ainsi que la [salamandre
      tachetée](/especie/salamandra_salamandra/), la [cigogne noire](/especie/ciconia_nigra/) et la [bondrée
      apivore](/especie/pernis_apivorus/).
    visit: >-
      Le sentier partant de Nové Město via Přibyslav et Peklo s'étend sur 11 km et est classé facile. Il
      demande environ 2 h 25 min de marche, présente 170 m de dénivelé et culmine à Přibyslav à 470 m
      d'altitude. L'itinéraire offre de multiples belvédères, l'auberge traditionnelle de Peklo, des forêts
      mixtes accrochées à des pentes raides, des parois rocheuses et la Metuje bordée de ripisylves matures.
      Une autre possibilité est la boucle au départ de Náchod par la vallée de Peklo et Dobrošov : comptez
      cinq heures de marche, la municipalité conseillant une visite de mai à septembre.


      Un ancien chemin pavé s'élève sur le flanc de la vallée, permettant de contempler la canopée depuis les
      hauteurs. Au confluent des rivières se dresse la Bartoňova útulna, ancien moulin réaménagé en 1910 en
      élégant restaurant d'excursion Art nouveau par l'architecte Dušan Jurkovič.
    history: >-
      L'écrivain Alois Jirásek a situé dans ce décor l'intrigue de sa nouvelle *V Pekle*, perpétuant la
      légende de la vallée hantée. Aujourd'hui, les enjeux écologiques sont modernes. Le principal défi n'est
      pas le scolyte, bien qu'il ait affecté les plantations d'épicéas ; l'enjeu majeur réside dans la
      régénération naturelle de la forêt feuillue là où les vieux arbres manquent. Les jeunes pousses sont en
      outre menacées par l'abroutissement des mouflons introduits, tandis que l'élodée prolifère dans la
      rivière et que les balsamines envahissent les berges.


      La gestion forestière s'adapte en favorisant les essences pionnières, le sapin blanc et les feuillus
      indigènes au détriment des monocultures, avec pose d'enclos protecteurs pour les jeunes semis.
    before: >-
      Déplacez-vous exclusivement sur les sentiers balisés et la voie locale ; cyclistes et automobilistes
      doivent emprunter uniquement la route goudronnée. Laissez les blocs de pierre en place, admirez la flore
      sans la cueillir et remportez l'ensemble de vos déchets.
    around: '[Orlické hory](/lugar/orlicke-hory---gory-bystrzyckie/) se trouve à environ six kilomètres.'
  de:
    intro: >-
      Es heißt Peklo, tschechisch für „Hölle“, und gilt der Sage nach als Geistertal. Wer heute
      hindurchwandert, trifft jedoch auf eine tief eingeschnittene Waldschlucht, in der zwei schäumende
      Gebirgsflüsse am Fuß blockübersäter Hänge zusammenfließen. Das Reservat schützt die naturnahen Täler der
      Metuje und Olešenka nahe der polnischen Grenze zwischen Nové Město nad Metují, Náchod und Česká Čermná —
      einer der am besten erhaltenen Naturräume der Region Náchod.
    landscape: >-
      Metuje und Olešenka bewahren einen ungebändigten Charakter mit Schotterbänken, starkem Gefälle und
      spritzigen Stromschnellen. Zu beiden Seiten zeigen die Felsflanken eine reiche Formenvielfalt und
      Blockmeere mit Höhenunterschieden von bis zu 200 m: von tertiären Wollsackbildungen und Felsenburgen bis
      zu periglazialen Frostkanten und quartären Blockströmen — die Landschaft eines Tals, das in jeder Epoche
      neu gestaltet wurde. Der Untergrund besteht aus Nové-Město-Phylliten, proterozoischen metamorphen
      Schiefern mit Granodioriten und permischen Sedimenten; im Flussbett der Olešenka und am Kamm Kozí hřbet
      lagern mächtige rosa Granodioritblöcke.


      Geschlossener Wald kleidet das gesamte Relief aus. Die Schluchtwälder von Peklo sind von bemerkenswerter
      Naturnähe und blieben weitgehend von intensiver Holzwirtschaft verschont — eine Seltenheit in
      Nordostböhmen. Es dominieren Buchenmischwälder und Schutthalden mit Tannen, Bergulmen, Türkenbundlilien
      und Seidelbast. Unter den Waldgewächsen ragen die [Weißtanne](/especie/abies_alba/), der Wald-Geißbart
      sowie Feldulme und Bergulme hervor. Die Auenwiesen entstanden durch historische Rodungen und werden
      durch Mahd oder Beweidung mindestens einmal im Jahr offengehalten.
    wildlife: >-
      Die Kostbarkeiten Peklos erschließen sich beim ruhigen Hinsehen. Auf Feuchtwiesen blühen Männliches
      Knabenkraut und Brand-Knabenkraut, während Brauns Schildfarn feuchte Felsspalten besiedelt. In den
      Überschwemmungsauen wachsen Märzenbecher und Frühlingsknotenblumen. Auf modrigem Totholz gedeiht das
      seltene, winzige Grüne Koboldmoos (*šikoušek zelený*), das Wirtschaftswälder meidet und als Indikator
      für naturnahe Waldstrukturen gilt.


      Neben seltenen Amphibien und Kriechtieren sind [Feuersalamander](/especie/salamandra_salamandra/),
      [Schwarzstorch](/especie/ciconia_nigra/) und [Wespenbussard](/especie/pernis_apivorus/) im Reservat
      heimisch.
    visit: >-
      Der markierte Weg von Nové Město über Přibyslav nach Peklo ist 11 km lang und als leicht eingestuft. Er
      erfordert rund 2 h 25 min Gehzeit, überwindet 170 m Höhenunterschied und erreicht seinen höchsten Punkt
      in Přibyslav bei 470 m. Auf der Route liegen Aussichtspunkte, das Ausflugslokal Peklo, Bergmischwälder
      an Steilhängen, Felsvorsprünge und die Metuje mit altem Ufergehölz. Eine andere Rundtour startet in
      Náchod durch das Peklo-Tal und Dobrošov: Für diese Tour sind fünf Stunden Wanderzeit einzuplanen; die
      Gemeinde empfiehlt Wanderungen von Mai bis September.


      Ein historischer Steinpfad windet sich am Talhang hinauf und eröffnet Tiefblicke auf das Kronendach. Am
      Zusammenfluss steht die Bartoňova útulna, eine historische Mühle, die 1910 vom bekannten Architekten
      Dušan Jurkovič zu einem Jugendstil-Ausflugsgasthof umgestaltet wurde.
    history: >-
      Der Dichter Alois Jirásek wählte Peklo als Schauplatz seiner Erzählung *V Pekle* und begründete damit
      den Ruf des Geistertals. Heute stehen ökologische Aufgaben im Vordergrund. Peklo leidet zwar weniger
      unter dem Borkenkäfer als monotone Forste, doch die natürliche Verjüngung des Laubmischwalds erfordert
      Pflege. Aufkommende Jungtriebe werden durch den Verbiss eingeschleppter Mufflons gefährdet, während die
      Kanadische Wasserpest im Flussbett wuchert und Springkräuter die Ufer säumen.


      Die Forstverwaltung reagiert mit gezieltem Umbau: Fichten und Lärchen werden zurückgedrängt, um
      Weißtanne, Pioniergehölze und heimische Laubbäume zu fördern, flankiert von Weisergattern zum Schutz
      junger Baumgruppen.
    before: >-
      Bewege dich ausschließlich auf den markierten Wegen und der Ortsstraße; Radfahrer und Autofahrer dürfen
      nur die öffentliche Fahrstraße nutzen. Felsblöcke nicht verlagern, seltene Pflanzen schonen und keinen
      Abfall zurücklassen.
    around: '[Orlické hory](/lugar/orlicke-hory---gory-bystrzyckie/) liegt etwa sechs Kilometer entfernt.'
  it:
    intro: >-
      Si chiama Peklo, parola ceca che significa «inferno», e la leggenda locale la ricorda come la valle dei
      fantasmi. Chi la percorre oggi incontra invece una profonda forra boscosa, dove due fiumi d'acque veloci
      confluiscono ai piedi di versanti cosparsi di massi ciclopici. La riserva protegge le valli libere da
      briglie dei fiumi Metuje e Olešenka vicino al confine polacco, tra Nové Město nad Metují, Náchod e Česká
      Čermná, rappresentando uno dei complessi naturali meglio conservati dell'intera provincia di Náchod.
    landscape: >-
      Il Metuje e l'Olešenka conservano un regime idrologico naturale, con alvei di ciottoli e massi, pendenze
      sostenute e rapide spumeggianti. Sui versanti, le pareti rocciose esibiscono un ricco modellamento
      periglaciale con falesie e mari di blocchi con dislivelli fino a 200 m: da forme a sacco terziarie a
      torrioni isolati e pietraie quaternarie, testimonianze di una valle risagomata nel corso delle epoche
      geologiche. Il substrato è costituito dalle filladi di Nové Město, rocce metamorfiche del Proterozoico
      frammiste a granodioriti e sedimenti permiani; nel greto dell'Olešenka e sulla cresta di Kozí hřbet
      affiorano grandi massi di granodiorite rosa a grana grossa.


      Una copertura forestale ininterrotta avvolge il paesaggio. I boschi di Peklo presentano una naturalità
      intatta inconsueta nella regione; si tratta di faggete di forra e boschi di versante con abeti, olmi
      montani, gigli martagoni e mezereo. Tra gli alberi spiccano l'[abete bianco](/especie/abies_alba/), la
      barba di capra e gli olmi autoctoni Ulmus minor e Ulmus glabra. I prati di fondovalle nacquero da
      disboscamenti medievali e sono mantenuti da sfalcio o pascolo almeno una volta all'anno su parcelle
      scaglionate.
    wildlife: >-
      Le meraviglie di Peklo si svelano a passo lento. Nei prati umidi fioriscono l'orchide maschia e
      l'orchide bruciacchiata, mentre nelle fessure rocciose cresce la felce di Braun. Le fasce golenali
      ospitano il bucaneve e il campanellino di primavera. Sui tronchi marcescenti vegeta il minuscolo e raro
      muschio Buxbaumia viridis (*šikoušek zelený*), assente nelle piantagioni artificiali e riconosciuto
      indicatore di foreste a gestione naturale.


      Si osservano anfibi e rettili protetti, con presenze stabili di [salamandra
      pezzata](/especie/salamandra_salamandra/), [cicogna nera](/especie/ciconia_nigra/) e [falco
      pecchiaiolo](/especie/pernis_apivorus/).
    visit: >-
      Il percorso escursionistico da Nové Město via Přibyslav e Peklo copre 11 km ed è classificato facile.
      Richiede circa 2 h 25 min di cammino, supera 170 m di dislivello e tocca la quota massima a Přibyslav a
      470 m. Lungo il tracciato si incontrano punti panoramici, il rifugio turistico di Peklo, boschi misti su
      ripidi pendii, torrioni rocciosi e le rive alberate del Metuje. Un altro itinerario classico parte da
      Náchod attraverso la valle di Peklo e Dobrošov: occorrono cinque ore di cammino, con visite consigliate
      dal comune tra maggio e settembre.


      Un'antica mulattiera in pietra risale il costone boscoso offrendo vedute aeree sulla volta forestale.
      Presso la confluenza sorge la Bartoňova útulna, storico mulino riconvertito nel 1910 in ristorante
      escursionistico in stile liberty su progetto dell'architetto Dušan Jurkovič.
    history: >-
      Lo scrittore Alois Jirásek ambientò qui il suo celebre racconto *V Pekle*, alimentando l'aura del
      villaggio delle apparizioni. Oggi le priorità ambientali riguardano la conservazione dell'habitat. Peklo
      non è minacciata dal bostrico come le piantagioni coetanee, ma la sfida risiede nella rigenerazione
      naturale del bosco misto autoctono. I giovani germogli sono esposti al brucamento dei mufloni, specie
      alloctona introdotta, mentre la peste d'acqua prolifera nei fiumi e la balsamina invade le ripe.


      La gestione forestale favorisce le latifoglie locali e l'abete bianco a scapito dei popolamenti
      monospecifici di abete rosso, impiegando recinzioni di protezione per i rinnovi.
    before: >-
      Cammina esclusivamente sui sentieri segnati e sulla carreggiata asfaltata; biciclette e automobili
      possono transitare unicamente sulla strada pubblica. Non spostare i massi di pietra, non raccogliere
      piante rare e riporta indietro ogni rifiuto.
    around: '[Orlické hory](/lugar/orlicke-hory---gory-bystrzyckie/) dista circa sei chilometri.'
  pt:
    intro: >-
      Chama-se Peklo, termo checo para «inferno», e a lenda popular consagrou-o como o vale dos fantasmas.
      Quem o percorre hoje encontra, porém, um desfiladeiro florestal profundo, onde dois rios de águas
      rápidas se unem ao sopé de encostas repletas de blocos de pedra. A reserva protege os vales sem
      barragens nem diques dos rios Metuje e Olešenka, junto à fronteira com a Polónia, entre Nové Město nad
      Metují, Náchod e Česká Čermná, constituindo um dos santuários naturais mais bem preservados da região de
      Náchod.
    landscape: >-
      O Metuje e o Olešenka mantêm uma dinâmica torrencial natural, com leitos de cascalho e blocos, pendentes
      acentuadas e rápidos vigorosos. De ambos os lados, as encostas rochosas exibem rica variedade de relevos
      periglaciários e campos de blocos com desníveis até 200 m: desde blocos arredondados do Terciário e
      torres residuais até escarpas de gelo e mares de blocos do Quaternário — marcas de um vale renovado a
      cada era geológica. O substrato assenta nos filitos de Nové Město, rochas metamórficas do Proterozóico
      com granodiorito e sedimentos do Pérmico; no leito do Olešenka e nos rochedos de Kozí hřbet avistam-se
      grandes blocos de granodiorito rosado de grão espesso.


      A floresta contínua cobre as vertentes. Os bosques de Peklo assemelham-se a ecossistemas virgens e quase
      não sofreram exploração comercial, algo excecional na região; dominam faias de encosta e carvalhais de
      ravina com abeto, ulmeiro, lírio-martagão e camélia-brava. Entre as árvores sobressaem o
      [abeto-branco](/especie/abies_alba/), a barba-de-bode e os ulmeiros autóctones Ulmus minor e Ulmus
      glabra. Os prados ribeirinhos resultam de desbravamentos antigos e são conservados por corte ou
      pastoreio pelo menos uma vez por ano em parcelas rotativas.
    wildlife: >-
      Os tesouros biológicos de Peklo revelam-se em passo pausado. Nos prados húmidos florescem orquídeas
      raras como o sachos-macho e o sachos-tostado, enquanto nas fendas das rochas cresce o feto-de-braun. As
      margens aluviais abrigam o campainha-branca e o narciso-selvagem. Sobre madeira em decomposição
      desenvolve-se o minúsculo e raro musgo Buxbaumia viridis (*šikoušek zelený*), ausente de plantações
      comerciais e autêntico bioindicador de florestas de elevada naturalidade.


      Regista-se a presença de anfíbios e répteis protegidos, ocorrendo no vale a
      [salamandra-de-pintas-amarelas](/especie/salamandra_salamandra/), a
      [cegonha-preta](/especie/ciconia_nigra/) e o [búteo-vespeiro](/especie/pernis_apivorus/).
    visit: >-
      O percurso assinalado a partir de Nové Město via Přibyslav e Peklo tem 11 km e está classificado como
      fácil. Exige cerca de 2 h 25 min de caminhada, vence 170 m de desnível e atinge o ponto mais elevado em
      Přibyslav a 470 m. Ao longo da rota encontram-se miradouros panorâmicos, a estalagem tradicional de
      Peklo, bosques mistos em encostas alcantiladas, afloramentos rochosos e as margens do Metuje com
      arvoredo maduro. Outro itinerário parte de Náchod pelo vale de Peklo e Dobrošov: prevê cinco horas de
      marcha, recomendando o município visitas entre maio e setembro.


      Um caminho lajeado secular sobe a encosta e permite contemplar o dossel vegetal a partir de cima. Na
      confluência dos rios ergue-se a Bartoňova útulna, antigo moinho adaptado em 1910 a restaurante de
      excursão de traça Arte Nova pelo reputado arquiteto Dušan Jurkovič.
    history: >-
      O escritor Alois Jirásek ambientou aqui a sua novela *V Pekle*, transmitindo a lenda do vale dos
      espíritos. Na atualidade, as prioridades são ecológicas. O desafio em Peklo não reside no
      escaravelho-da-casca, embora este afete monoculturas comerciais regionais; o objetivo central é a
      regeneração natural da floresta autóctone. Os rebentos jovens enfrentam a pressão de pastoreio dos
      muflões, espécie introduzida, enquanto a elódea prolifera no rio e as balsâminas ocupam as margens.


      A silvicultura privilegia as folhosas nativas e o abeto-branco em detrimento do abeto-falso, usando
      vedações de madeira para proteger as novas gerações de árvores.
    before: >-
      Desloca-te estritamente pelos trilhos marcados e pela via local; ciclistas e condutores devem usar
      apenas a estrada pública de alcatrão. Não desloques os blocos rochosos, não colhas plantas raras e traz
      todo o lixo de volta.
    around: '[Orlické hory](/lugar/orlicke-hory---gory-bystrzyckie/) situa-se a cerca de seis quilómetros.'
