resumen:
  es: Hayedo montano de llanura glaciar con relieve morrénico y turberas interiores protegidas por la UNESCO.
  en: Lowland glacial beech forest with moraine relief and interior mires protected by UNESCO.
  fr: Hêtraie de plaine glaciaire au relief morainique et aux tourbières intérieures protégées par l’UNESCO.
  de: >-
    Glazialer Tiefland-Buchenwald mit hügeligem Moränenrelief und geschützten Moor-Kesseln des
    UNESCO-Welterbes.
  it: Faggeta montana di pianura glaciale con rilievi morenici e torbiere interne protette dall’UNESCO.
  pt: Faial montano de planície glaciar com relevo morénico e turfeiras interiores protegidas pela UNESCO.
unico:
  es: >-
    Un hayedo de llanura nacido de un hielo que se retiró hace milenios, con turberas y charcas entre sus
    morrenas.
  en: >-
    A lowland beech forest born from ice that retreated millennia ago, with mires and kettle ponds nestled
    between its moraines.
  fr: >-
    Une hêtraie de plaine née du retrait des glaces il y a des millénaires, constellée de tourbières et de
    mares entre ses moraines.
  de: >-
    Ein Tiefland-Buchenwald, der nach dem Gletscherrückzug vor Jahrtausenden entstand, mit Kesselmooren und
    Weihern zwischen Moränenzügen.
  it: Una faggeta di pianura nata dal ritiro dei ghiacci millenni fa, con torbiere e stagni tra morene ondulate.
  pt: >-
    Um faial de planície nascido do recuo dos gelos há milénios, pontilhado de turfeiras e lagoas entre as
    suas moreias.
observaciones:
  es: >-
    Permanece en los caminos señalizados de la reserva. El núcleo no admite entrada por libre: solo puede
    explorarse en las visitas autorizadas con guías formados. En el tramo sur de la ruta Naranja hay troncos
    caídos que obligan a pasar por encima; los recorridos de hoja de haya no son aptos para sillas de ruedas
    ni andadores. Evita el bosque con viento fuerte por la caída de ramas, que también puede ocurrir con
    calma.
texto:
  es:
    intro: >-
      Durante décadas, la visita pública estuvo restringida. En la RDA, este rincón de Brandeburgo era coto
      estatal de caza: acceso prohibido y sin explotación forestal intensiva. Ese pasado forma parte de la
      historia del bosque. Hoy el Hayedo de Grumsin, de unas 590 hectáreas en el sureste de la reserva natural
      Grumsiner Forst/Redernswalde, es Patrimonio Mundial de la UNESCO. Sus alrededores se recorren a pie por
      senderos señalizados, entre lagos, turberas y hayas; el núcleo tiene acceso restringido.
    landscape: >-
      Todo viene de la última glaciación, la del Weichsel. El hielo dejó morrenas y placas morrénicas, y por
      eso el paisaje tiene un relieve tan marcado, de montaña rusa. En los huecos entre las morrenas se
      formaron alisedas encharcadas, turberas y lagos. El punto más alto de la reserva, el Blocksberg, apenas
      llega a unos 139 m: no hace falta altura para que el terreno suba y baje a cada paso.


      El hayedo de Grumsin es un hayedo de llanura sobre suelos ricos en bases. Los bosques de este tipo se
      consideran restos de las grandes masas de haya que hubo antes en Europa central. En la reserva natural
      más amplia, una zona de 847,91 hectáreas es reserva total: allí hay lagos alimentados por la lluvia,
      charcas glaciares y turberas de colmatación separadas por morrenas.


      En los bosques de la reserva natural más amplia se han registrado 349 plantas superiores, cuatro de
      ellas en la Lista Roja, como el Weiße Waldvögelein. Entre las demás hay trébol de agua, y, en las
      turberas intactas, drosera, algodón de pantano, romero de pantano y cárice.
    wildlife: >-
      Las aves ayudan a conocer el bosque y sus humedales. Hay cinco especies de pájaros carpinteros, entre
      ellos el [pico negro](/especie/dryocopus_martius/), y el papamoscas collarino también vive aquí. Junto
      al agua aparece el [martín pescador](/especie/alcedo_atthis/). Entre las aves citadas para la reserva
      natural están el [pigargo europeo](/especie/haliaeetus_albicilla/) y la [grulla
      común](/especie/grus_grus/). La [cigüeña negra](/especie/ciconia_nigra/) y el [águila
      pomerana](/especie/aquila_pomarina/) figuran entre las aves raras refugiadas en estos bosques.


      Las charcas benefician a la ranita europea, y la madera muerta, a escarabajos como el Kopfhornschröter y
      el Balkenschröter. En 2012, expertos hallaron en los bosques de la reserva cinco especies de dípteros
      hasta entonces desconocidas.


      De mayo a octubre se concentra la época propuesta para la visita; las salidas guiadas de abril a octubre
      tienen calendario propio.
    visit: >-
      El punto de partida es Altkünkendorf, donde hay un centro de visitantes y punto de información del
      hayedo. Allí se explica la protección del bosque y su condición de Patrimonio Mundial.


      El Grumsin tiene cinco rutas circulares señalizadas con colores. La ruta Roja es la más larga: 21,5 km
      alrededor de todo el sitio Patrimonio Mundial, y también puede iniciarse en Altkünkendorf. La ruta
      Verde, de 7,2 km, parte del Museo de la Edad de Hielo de Groß-Ziethen, donde está el mamut Georg, cruza
      turberas, lagos forestales y alisedas y regresa por un viejo camino empedrado. La ruta Naranja sale de
      Altkünkendorf y se puede acortar en Luisenhof. Y el Genusswanderweg sale de la estación de Angermünde y
      pasa por Sternfelde, Schmargendorf, Zuchenberg y Luisenhof hasta Altkünkendorf.


      Si prefieres ir acompañado, guías certificados de naturaleza y paisaje ofrecen visitas los sábados
      segundo y cuarto, de abril a octubre. «Nace un bosque primigenio» sale de Schmargendorf, dura unas
      cuatro horas y enseña hayas centenarias, un paisaje de montaña rusa y grandes turberas. «Living World
      Heritage» dura unas tres horas y recorre 6 km.
    history: >-
      Este bosque lleva mucho tiempo habitado. En la reserva natural se han hallado huellas de poblados del
      Neolítico y de la Edad del Bronce, y asentamientos eslavos de los siglos XII y XIII. A fines del siglo
      XVI se usó para la caza y se levantó un cercado de más de 70 km de longitud en parte del territorio, que
      cuidaban guardas de valla. A comienzos del siglo XIX se drenaron terrenos para cultivar, y desde los
      años cincuenta hubo talas fuertes para obtener madera de construcción y leña.


      Después llegó la RDA y, con ella, el coto estatal de caza. La reserva natural está protegida desde el 1
      de octubre de 1990, a la vez que se creó la reserva de la biosfera Schorfheide-Chorin. La reducción de
      los aprovechamientos permitió conservar refugios para fauna forestal. El 25 de junio de 2011, 590
      hectáreas de Grumsin fueron declaradas Patrimonio Mundial.


      Grumsin forma parte de los Hayedos antiguos y primarios de los Cárpatos y otras regiones de Europa, un
      sitio en serie con 93 componentes de hayedo en 18 países europeos, junto con los parques nacionales de
      Hainich, Kellerwald-Edersee y Jasmund y la parte de Serrahn del Müritz. El conjunto de hayedos
      representa la expansión posglacial del haya por Europa; eso no implica que cada rodal haya permanecido
      libre de usos humanos desde entonces. Los hayedos naturales como este están entre los hábitats más
      amenazados, aunque la haya roja no sea una especie amenazada.
    before: >-
      Permanece en los caminos señalizados de la reserva. El núcleo no admite entrada por libre: solo puede
      explorarse en las visitas autorizadas con guías formados. En el tramo sur de la ruta Naranja hay troncos
      caídos que obligan a pasar por encima; los recorridos de hoja de haya no son aptos para sillas de ruedas
      ni andadores. Evita el bosque con viento fuerte por la caída de ramas, que también puede ocurrir con
      calma.
    around: >-
      El [Paisaje Forestal de Schorfheide-Chorin](/lugar/schorfheide-chorin-forest-landscape/) comparte con
      Grumsin el territorio de la misma reserva de la biosfera. A unos 13 km quedan los [Bosques del Parque
      Natural Lagos de Uckermark](/lugar/uckermarkische-seen-forests/).
  en:
    intro: >-
      For decades, public visits were restricted. In the GDR, this corner of Brandenburg was a state hunting
      ground: access was forbidden and intensive forestry absent. That past is an integral part of the
      forest's history. Today, the Grumsin Beech Forest, spanning some 590 hectares in the southeast of the
      Grumsiner Forst/Redernswalde nature reserve, is a UNESCO World Heritage Site. You can explore its
      surroundings on foot along signposted trails among lakes, mires, and beeches; the core zone remains
      under strictly restricted access.
    landscape: >-
      Everything stems from the last ice age, the Weichselian glaciation. The ice left moraines and morainic
      sheets, giving the landscape its remarkably rolling, roller-coaster relief. In the hollows between
      moraines, waterlogged alder carrs, mires, and kettle lakes formed. The highest point in the reserve, the
      Blocksberg, barely reaches about 139 m: sheer height is not needed for the ground to rise and fall with
      every step.


      The Grumsin beech forest is a lowland beech forest resting on base-rich soils. Woods of this kind are
      regarded as remnants of the great beech tracts that once blanketed central Europe. Within the wider
      nature reserve, an area of 847.91 hectares forms a total reserve: there you will find rain-fed lakes,
      glacial kettles, and terrestrialisation mires separated by moraines.


      Across the wider nature reserve's forests, 349 higher plant species have been recorded, four of them on
      the Red List, such as the white helleborine (Weiße Waldvögelein). Others include bogbean and, in the
      intact mires, sundew, cotton grass, bog rosemary, and sedges.
    wildlife: >-
      Birds help you discover the forest and its wetlands. Five species of woodpecker dwell here, including
      the [black woodpecker](/especie/dryocopus_martius/), and the collared flycatcher also breeds in the
      woods. Along the water appears the [common kingfisher](/especie/alcedo_atthis/). Notable bird records
      for the nature reserve include the [white-tailed eagle](/especie/haliaeetus_albicilla/) and the [common
      crane](/especie/grus_grus/). The [black stork](/especie/ciconia_nigra/) and the [lesser spotted
      eagle](/especie/aquila_pomarina/) rank among the rarest birds taking refuge in these woodlands.


      Ponds benefit the European tree frog, while dead wood sustains saproxylic beetles like the
      Kopfhornschröter and Balkenschröter. In 2012, researchers discovered five dipteran species previously
      unknown to science in the reserve's forests.


      From May to October is the recommended period for a visit; guided walks from April to October operate on
      their own calendar.
    visit: >-
      The main starting point is Altkünkendorf, which hosts a visitor centre and information point for the
      beech forest. Exhibits explain forest protection measures and its World Heritage designation.


      Grumsin features five colour-coded circular trails. The Red Trail is the longest: 21.5 km looping around
      the entire World Heritage area, and can also be started in Altkünkendorf. The Green Trail, measuring 7.2
      km, begins at the Ice Age Museum in Groß-Ziethen, home of Georg the mammoth, crossing mires, forest
      lakes, and alder carrs before returning along an old cobbled lane. The Orange Trail sets out from
      Altkünkendorf and can be shortened at Luisenhof. The Genusswanderweg departs from Angermünde station,
      passing through Sternfelde, Schmargendorf, Zuchenberg, and Luisenhof to Altkünkendorf.


      If you prefer to be guided, certified nature and landscape guides run tours on the second and fourth
      Saturdays from April to October. "A Primeval Forest is Born" sets off from Schmargendorf, lasts about
      four hours, and showcases ancient beeches, rolling terrain, and extensive mires. "Living World Heritage"
      lasts about three hours and covers 6 km.
    history: >-
      This forest has long been inhabited. Archaeological traces of Neolithic and Bronze Age settlements, as
      well as Slavic hamlets from the twelfth and thirteenth centuries, have been unearthed within the
      reserve. In the late sixteenth century it served for hunting, with an enclosure over 70 km long erected
      across parts of the area, maintained by dedicated fence wardens. In the early nineteenth century, lands
      were drained for farming, and from the fifties onward heavy timber felling supplied construction wood
      and fuel.


      Later came the GDR era and its state hunting preserve. The nature reserve has enjoyed formal protection
      since 1 October 1990, coinciding with the establishment of the Schorfheide-Chorin Biosphere Reserve. The
      cutback in commercial exploitation preserved vital refuges for woodland wildlife. On 25 June 2011, 590
      hectares of Grumsin were inscribed as UNESCO World Heritage.


      Grumsin forms part of the Ancient and Primeval Beech Forests of the Carpathians and Other Regions of
      Europe, a serial property with 93 beech forest components spread across 18 European countries, together
      with Hainich, Kellerwald-Edersee, Jasmund national parks and the Serrahn sector of Müritz. This
      collective entity represents the postglacial recolonisation of beech across Europe, which does not imply
      every single stand has stayed untouched by humans ever since. Natural beech woodlands like this rank
      among Europe's most threatened habitats, even if the common beech itself is not an endangered species.
    before: >-
      Keep strictly to marked trails in the nature reserve. The core zone is closed to independent
      exploration: you can enter only on authorised tours led by trained guides. Along the southern leg of the
      Orange Trail, fallen trunks require you to step over them; beech-leaf path surfaces are not suitable for
      wheelchairs or rollators. Avoid the forest during strong winds due to falling branches, which can also
      happen in calm weather.
    around: >-
      The [Schorfheide-Chorin Forest Landscape](/lugar/schorfheide-chorin-forest-landscape/) shares the
      territory of the same biosphere reserve with Grumsin. About 13 km away lie the [Uckermark Lakes Nature
      Park Forests](/lugar/uckermarkische-seen-forests/).
  fr:
    intro: >-
      Pendant des décennies, l'accès public est resté strictement restreint. Sous la RDA, ce coin du
      Brandebourg était une chasse d'État : interdiction d'entrer et absence totale d'exploitation forestière
      intensive. Ce passé fait partie intégrante de l'histoire du massif. Aujourd'hui, la hêtraie de Grumsin,
      qui s'étend sur environ 590 hectares au sud-est de la réserve naturelle Grumsiner Forst/Redernswalde,
      est inscrite au patrimoine mondial de l'UNESCO. Vous pouvez parcourir ses abords à pied le long de
      sentiers balisés, entre lacs, tourbières et hêtres séculaires ; la zone centrale fait l'objet d'un accès
      strictement réglementé.
    landscape: >-
      Tout découle de la dernière glaciation, celle de la Vistule (Weichsel). Les glaces ont déposé moraines
      et plateaux morainiques, conférant au paysage un relief accidenté en véritables montagnes russes. Dans
      les creux entre moraines se sont installées des aulnaies marécageuses, des tourbières et des lacs
      glaciaires. Le point culminant de la réserve, le Blocksberg, atteint à peine 139 m : nulle besoin de
      haute altitude pour que le sol monte et descende à chaque foulée.


      La hêtraie de Grumsin est une forêt de hêtres de plaine établie sur des sols riches en bases. Ce type de
      boisement constitue un précieux vestige des vastes massifs de hêtres qui couvraient jadis l'Europe
      centrale. Dans la réserve naturelle élargie, une zone de 847,91 hectares forme une réserve totale : là
      se succèdent mares glaciaires, lacs alimentés par les pluies et tourbières de comblement ceinturés de
      moraines.


      Dans les boisements de la réserve globale, 349 plantes supérieures ont été recensées, dont quatre
      inscrites sur liste rouge comme la céphalanthère blanche (Weiße Waldvögelein). Parmi les autres espèces
      figurent le trèfle d'eau et, dans les tourbières préservées, le droséra, la linaigrette, le lédon des
      marais et divers laîches.
    wildlife: >-
      Les oiseaux accompagnent la découverte de la forêt et de ses zones humides. Cinq espèces de pics y
      cohabitent, notamment le [pic noir](/especie/dryocopus_martius/), tandis que le gobe-mouche à collier
      niche également sous la frondaison. Près de l'eau apparaît le [martin-pêcheur
      d'Europe](/especie/alcedo_atthis/). Parmi les oiseaux signalés dans la réserve naturelle figurent le
      [pygargue à queue blanche](/especie/haliaeetus_albicilla/) et la [grue cendrée](/especie/grus_grus/). La
      [cigogne noire](/especie/ciconia_nigra/) et l'[aigle pomarin](/especie/aquila_pomarina/) comptent parmi
      les espèces rares qui trouvent refuge dans ces massifs.


      Les mares profitent à la rainette verte, et le bois mort nourrit des coléoptères saproxyliques tels que
      le Kopfhornschröter et le Balkenschröter. En 2012, des spécialistes ont découvert dans les forêts de la
      réserve cinq espèces de diptères jusqu'alors inconnues de la science.


      De mai à octobre correspond à la période idéale de visite ; les sorties guidées organisées d'avril à
      octobre suivent leur propre calendrier.
    visit: >-
      Le principal point de départ se situe à Altkünkendorf, doté d'un centre d'accueil et point d'information
      sur la hêtraie. Vous y découvrirez la protection de la forêt et son inscription au patrimoine mondial.


      Grumsin propose cinq itinéraires circulaires balisés par des couleurs. Le sentier Rouge est le plus long
      : 21,5 km ceinturant l'ensemble du bien du patrimoine mondial, accessible aussi depuis Altkünkendorf. Le
      sentier Vert, de 7,2 km, part du musée de l'Âge de glace de Groß-Ziethen, où trône le mammouth Georg,
      traverse tourbières, lacs forestiers et aulnaies avant de revenir par une vieille voie pavée. Le sentier
      Orange part d'Altkünkendorf et peut être raccourci à Luisenhof. Le Genusswanderweg s'élance de la gare
      d'Angermünde et traverse Sternfelde, Schmargendorf, Zuchenberg et Luisenhof jusqu'à Altkünkendorf.


      Si vous préférez être accompagnés, des guides certifiés de nature et de paysage proposent des sorties
      les deuxième et quatrième samedis, d'avril à octobre. « Naissance d'une forêt primaire » part de
      Schmargendorf, dure environ quatre heures et présente des hêtres centenaires, un relief morainique et de
      grandes tourbières. « Living World Heritage » dure environ trois heures et parcourt 6 km.
    history: >-
      Cette forêt est habitée de longue date. Des vestiges d'habitats du Néolithique et de l'âge du bronze,
      ainsi que des implantations slaves des XIIe et XIIIe siècles, ont été mis au jour dans la réserve. À la
      fin du XVIe siècle, le secteur servait à la chasse princière et une clôture de plus de 70 km de long y
      fut érigée, gardée par des surveillants attitrés. Au début du XIXe siècle, des parcelles furent drainées
      pour la culture, et à partir des années cinquante eurent lieu d'importantes coupes de bois de charpente
      et de chauffe.


      Puis vint l'ère de la RDA et sa réserve de chasse d'État. La réserve naturelle est protégée depuis le 1
      octobre 1990, date coïncidant avec la création de la réserve de biosphère de Schorfheide-Chorin. La fin
      de l'exploitation commerciale a préservé des havres pour la faune sylvestre. Le 25 juin 2011, 590
      hectares de Grumsin ont été inscrits au patrimoine mondial de l'UNESCO.


      Grumsin fait partie du bien en série des Forêts primaires et anciennes de hêtres des Carpates et
      d'autres régions d'Europe, réunissant 93 éléments de hêtraies dans 18 pays européens, aux côtés des
      parcs nationaux de Hainich, Kellerwald-Edersee, Jasmund et du secteur de Serrahn dans le Müritz. Cet
      ensemble illustre l'expansion postglaciaire du hêtre à travers l'Europe, ce qui ne signifie pas que
      chaque parcelle soit restée exempte de toute intervention humaine. Les hêtraies naturelles de ce type
      figurent parmi les habitats les plus menacés, même si le hêtre commun n'est pas une espèce menacée en
      soi.
    before: >-
      Restez impérativement sur les sentiers balisés de la réserve. Le cœur forestier est interdit d'accès
      libre : vous ne pouvez l'explorer que lors de visites guidées autorisées. Sur le tronçon sud du sentier
      Orange, des troncs couchés obligent à enjamber le chemin ; les sentiers tapissés de feuilles ne
      conviennent ni aux fauteuils roulants ni aux déambulateurs. Évitez la forêt par grand vent en raison des
      chutes de branches, qui peuvent aussi survenir par temps calme.
    around: >-
      Le [Paysage forestier de Schorfheide-Chorin](/lugar/schorfheide-chorin-forest-landscape/) partage avec
      Grumsin le territoire de la même réserve de biosphère. À environ 13 km s'étendent les [Forêts du parc
      naturel des lacs de l'Uckermark](/lugar/uckermarkische-seen-forests/).
  de:
    intro: >-
      Über Jahrzehnte hinweg blieb der öffentliche Zutritt beschränkt. In der DDR war dieser Winkel
      Brandenburgs ein Staatsjagdgebiet: gesperrt für die Bevölkerung und frei von intensiver forstlicher
      Nutzung. Diese Vergangenheit prägt die Geschichte des Waldes bis heute. Heute ist der Buchenwald Grumsin
      mit rund 590 Hektar im Südosten des Naturschutzgebiets Grumsiner Forst/Redernswalde
      UNESCO-Weltnaturerbe. Du kannst seine Umgebung zu Fuß auf markierten Wegen zwischen Seen, Mooren und
      alten Buchen erkunden; die Kernzone unterliegt strengem Betretungsverbot.
    landscape: >-
      Alles verdankt sich der letzten Kaltzeit, der Weichsel-Vereisung. Das Gletschereis hinterließ Endmoränen
      und Moränenplatten, die dem Gelände sein ausgeprägtes, welliges Auf und Ab verleihen. In den Senken
      zwischen den Moränenzügen entstanden Bruchwälder, Moore und Kesselgewässer. Die höchste Erhebung des
      Reservats, der Blocksberg, misst gerade einmal 139 m: Es braucht keine Hochgebirge, damit das Gelände
      bei jedem Schritt ansteigt und abfällt.


      Der Buchenwald Grumsin ist ein Tiefland-Buchenwald auf basenreichen Böden. Wälder dieser Ausprägung
      gelten als Relikte jener gewaltigen Buchengesellschaften, die einst weite Teile Mitteleuropas
      beherrschten. Im großräumigen Naturschutzgebiet bildet eine Fläche von 847,91 Hektar die Totalreserve:
      Hier liegen regengespeiste Waldgewässer, Toteiskuten und Verlandungsmoore zwischen Moränenrücken.


      In den Wäldern des weiteren Naturschutzgebiets wurden 349 höhere Pflanzenarten erfasst, darunter vier
      Rote-Liste-Arten wie das Weiße Waldvögelein. Hinzu kommen Fieberklee sowie in den intakten Kesselmooren
      Sonnentau, Wollgras, Rosmarinheide und Schilf-Seggen.
    wildlife: >-
      Die Vogelwelt erschließt den Wald und seine Feuchtgebiete besonders eindrucksvoll. Fünf Spechtarten
      leben hier, unter ihnen der [Schwarzspecht](/especie/dryocopus_martius/), und auch der Halsbandschnäpper
      brütet im Bestand. An den Gewässern zeigt sich der [Eisvogel](/especie/alcedo_atthis/). Zu den erfassten
      Vögeln des Naturschutzgebiets zählen der [Seeadler](/especie/haliaeetus_albicilla/) und der
      [Kranich](/especie/grus_grus/). Der [Schwarzstorch](/especie/ciconia_nigra/) und der
      [Schreiadler](/especie/aquila_pomarina/) gehören zu den seltenen Waldvögeln, die in diesen Beständen
      Zuflucht finden.


      Die Weiher bieten dem Laubfrosch Lebensraum, während Totholz spezialisierten Käfern wie Kopfhornschröter
      und Balkenschröter dient. Im Jahr 2012 entdeckten Experten in den Wäldern des Schutzgebiets fünf bis
      dahin unbekannte Zweiflüglerarten.


      Von Mai bis Oktober reicht die empfohlene Reisezeit; die von April bis Oktober angebotenen Führungen
      folgen einem eigenen Terminplan.
    visit: >-
      Hauptausgangspunkt ist Altkünkendorf mit Informationspunkt und Besucherzentrum zum Buchenwald. Dort
      erfährst du Hintergründe zum Schutz des Waldes und zu seinem Welterbestatus.


      Der Grumsin verfügt über fünf farblich markierte Rundwanderwege. Die Rote Route ist mit 21,5 km die
      längste und umrundet das gesamte Weltnaturerbe-Gebiet; sie kann ebenfalls in Altkünkendorf begonnen
      werden. Die Grüne Route mit 7,2 km startet am Eiszeitmuseum Groß-Ziethen beim Mammut Georg, quert Moore,
      Waldseen und Erlenbrüche und kehrt über ein altes Kopfsteinpflaster zurück. Die Orange Route beginnt in
      Altkünkendorf und lässt sich bei Luisenhof abkürzen. Der Genusswanderweg führt vom Bahnhof Angermünde
      über Sternfelde, Schmargendorf, Zuchenberg und Luisenhof nach Altkünkendorf.


      Wenn du eine geführte Tour vorziehst, bieten zertifizierte Natur- und Landschaftsführer an jedem zweiten
      und vierten Samstag von April bis Oktober Wanderungen an. „Ein Urwald entsteht“ beginnt in
      Schmargendorf, dauert etwa vier Stunden und erschließt alte Buchen, Moränenlandschaften und Moore.
      „Living World Heritage“ dauert rund drei Stunden und verläuft über 6 km.
    history: >-
      Der Wald blickt auf eine lange Besiedlungsgeschichte zurück. Im Schutzgebiet wurden Siedlungsspuren aus
      der Jungsteinzeit und der Bronzezeit sowie slawische Siedlungen des zwölften und dreizehnten
      Jahrhunderts nachgewiesen. Gegen Ende des sechzehnten Jahrhunderts diente das Areal der Hofjagd, und ein
      über 70 km langer Zaun wurde errichtet, bewacht von angestellten Zaunläufern. Zu Beginn des neunzehnten
      Jahrhunderts wurden Flächen für die Landwirtschaft entwässert, und ab den fünfziger Jahren folgten
      intensive Holzeinschläge für Bau- und Brennholz.


      Später richtete die DDR hier ihr Staatsjagdgebiet ein. Seit dem 1. Oktober 1990 ist das
      Naturschutzgebiet geschützt, zeitgleich mit der Gründung des Biosphärenreservats Schorfheide-Chorin. Die
      Nutzungsaufgabe sicherte ungestörte Rückzugsräume für die Waldtierwelt. Am 25. Juni 2011, 590 Hektar von
      Grumsin wurden als UNESCO-Weltnaturerbe anerkannt.


      Der Grumsin gehört zur transnationalen Welterbestätte „Alte Buchenwälder und Buchenurwälder der Karpaten
      und anderer Regionen Europas“, die 93 Buchenwaldkomponenten in 18 europäischen Staaten umfasst,
      gemeinsam mit Hainich, Kellerwald-Edersee, Jasmund und dem Serrahner Teil des Müritz-Nationalparks.
      Diese Stätte veranschaulicht die nacheiszeitliche Ausbreitung der Buche in Europa; das bedeutet nicht,
      dass jeder Teilbestand seither völlig unberührt geblieben wäre. Naturnahe Buchenwälder wie dieser
      gehören zu den gefährdeststen Waldlebensräumen, wenngleich die Rotbuche selbst keine bedrohte Baumart
      ist.
    before: >-
      Bleibe unbedingt auf den ausgeschilderten Wegen des Naturschutzgebiets. Die Kernzone darf nicht auf
      eigene Faust betreten werden: Sie ist nur im Rahmen autorisierter Führungen mit geschulten Guides
      zugänglich. Im südlichen Abschnitt der Orangen Route liegen umgestürzte Stämme quer über dem Pfad; die
      mit Buchenlaub bedeckten Naturwege eignen sich weder für Rollstühle noch für Rollatoren. Meide den Wald
      bei starkem Wind wegen herabfallender Äste, was vereinzelt auch bei Windstille vorkommen kann.
    around: >-
      Die [Waldlandschaft Schorfheide-Chorin](/lugar/schorfheide-chorin-forest-landscape/) teilt sich mit
      Grumsin den Raum desselben Biosphärenreservats. Rund 13 km entfernt liegen die [Wälder des Naturparks
      Uckermärkische Seen](/lugar/uckermarkische-seen-forests/).
  it:
    intro: >-
      Per decenni le visite pubbliche sono rimaste limitate. Nella RDT, quest'angolo del Brandeburgo era una
      riserva di caccia statale: accesso vietato e nessuna silvicoltura intensiva. Quel passato è parte
      integrante della storia del bosco. Oggi la faggeta di Grumsin, estesa per circa 590 ettari nel sud-est
      della riserva naturale Grumsiner Forst/Redernswalde, è patrimonio mondiale dell'UNESCO. Puoi percorrere
      i suoi dintorni a piedi lungo sentieri segnalati, tra laghi, torbiere e faggi secolari; la zona centrale
      è a ingresso rigorosamente limitato.
    landscape: >-
      Tutto trae origine dall'ultima glaciazione, quella della Vistola (Weichsel). Il ghiaccio ha lasciato
      morene e dossi morenici, regalando al paesaggio un andamento continuo da montagne russe. Nelle conche
      tra le morene si sono formati ontaneti allagati, torbiere e laghetti glaciali. Il punto più elevato
      della riserva, il Blocksberg, raggiunge appena 139 m: non servono grandi quote perché il terreno salga e
      scenda a ogni passo.


      La faggeta di Grumsin è un bosco di pianura su suoli ricchi di basi. Foreste di questo tipo sono
      considerate testimonianze degli immensi complessi di faggio che un tempo coprivano l'Europa centrale.
      Nella riserva naturale più ampia, una superficie de 847,91 ettari costituisce riserva integrale: vi si
      trovano stagni alimentati dalla pioggia, bacini glaciali e torbiere di colmatazione racchiusi da morene.


      Nei boschi della riserva complessiva sono state censite 349 piante superiori, quattro delle quali nella
      Lista Rossa, come la cefalantera bianca (Weiße Waldvögelein). Tra le altre figurano il trifoglio fibrino
      e, nelle torbiere intatte, la drosera, l'erioforo, il rosmarino di palude e vari carici.
    wildlife: >-
      Gli uccelli permettono di esplorare a fondo il bosco e le sue zone umide. Qui vivono cinque specie di
      picchi, tra cui il [picchio nero](/especie/dryocopus_martius/), e vi nidifica anche la balia dal
      collare. Presso l'acqua compare il [martin pescatore](/especie/alcedo_atthis/). Tra i volatili segnalati
      nella riserva figurano l'[aquila di mare](/especie/haliaeetus_albicilla/) e la
      [gru](/especie/grus_grus/). La [cicogna nera](/especie/ciconia_nigra/) e l'[aquila anatraia
      minore](/especie/aquila_pomarina/) sono tra i rapaci e gli uccelli rari rifugiati in queste foreste.


      Gli specchi d'acqua favoriscono la raganella europea, mentre il legno morto nutre coleotteri saproxilici
      come il Kopfhornschröter e il Balkenschröter. Nel 2012, esperti hanno individuato nei boschi della
      riserva cinque specie di ditteri fino ad allora sconosciute alla scienza.


      Da maggio a ottobre è il periodo consigliato per la visita; le escursioni guidate da aprile a ottobre
      seguono un proprio calendario.
    visit: >-
      Il punto di partenza principale è Altkünkendorf, sede di un centro visite e punto informativo sulla
      faggeta. Viene illustrata la tutela dell'area e il riconoscimento come patrimonio mondiale.


      Grumsin offre cinque itinerari ad anello contraddistinti da colori. Il percorso Rosso è il più lungo:
      21,5 km attorno all'intero sito patrimonio mondiale, avviabile anche da Altkünkendorf. Il percorso
      Verde, di 7,2 km, parte dal Museo dell'Era Glaciale di Groß-Ziethen con il mammut Georg, attraversa
      torbiere, laghi forestali e ontaneti e torna lungo una vecchia via acciottolata. Il percorso Arancione
      parte da Altkünkendorf e può essere accorciato a Luisenhof. Il Genusswanderweg muove dalla stazione di
      Angermünde toccando Sternfelde, Schmargendorf, Zuchenberg e Luisenhof fino ad Altkünkendorf.


      Se preferisci farti accompagnare, guide certificate di natura e paesaggio organizzano uscite il secondo
      e quarto sabato del mese, da aprile a ottobre. «Nasce una foresta primigenia» parte da Schmargendorf,
      dura circa quattro ore e mostra faggi centenari, paesaggi morenici e torbiere. «Living World Heritage»
      dura circa tre ore e copre 6 km.
    history: >-
      Questo bosco è abitato da tempi remoti. Nella riserva naturale sono state rinvenute tracce di
      insediamenti del Neolitico e dell'Età del Bronzo, nonché villaggi slavi dei secoli XII e XIII. Alla fine
      del XVI secolo il territorio venne destinato alla caccia nobiliare con una recinzione di oltre 70 km di
      lunghezza, sorvegliata da guardie campestri. A inizio Ottocento furono drenati terreni per l'agricoltura
      e dagli anni Cinquanta si intensificarono i tagli per legname da opera e ardere.


      Seguì l'epoca della RDT con la sua riserva venatoria di Stato. La riserva naturale è protetta dal 1
      ottobre 1990, in concomitanza con la nascita della riserva della biosfera di Schorfheide-Chorin. La
      cessazione dello sfruttamento ha preservato rifugi preziosi per la fauna forestale. Il 25 giugno 2011,
      590 ettari di Grumsin sono stati proclamati patrimonio mondiale UNESCO.


      Grumsin fa parte del sito seriale delle Antiche faggete primordiali dei Carpati e di altre regioni
      d'Europa, forte di 93 componenti forestali in 18 paesi europei, assieme ai parchi nazionali di Hainich,
      Kellerwald-Edersee, Jasmund e al settore di Serrahn nel Müritz. Il complesso testimonia la
      ricolonizzazione postglaciale del faggio in Europa, senza implicare che ogni singolo popolamento sia
      rimasto intonso. Le faggete naturali come questa sono tra gli habitat più minacciati d'Europa, sebbene
      il faggio comune non sia una specie a rischio.
    before: >-
      Rimani rigorosamente sui percorsi segnalati della riserva. L'accesso libero al cuore della faggeta non è
      consentito: puoi visitarlo solo con tour autorizzati assieme a guide qualificate. Nel tratto meridionale
      del percorso Arancione tronchi caduti richiedono di scavalcare; i sentieri su lettiera di foglie non
      sono adatti a sedie a rotelle o deambulatori. Evita il bosco in presenza di vento forte per il pericolo
      di caduta rami, evento possibile anche in assenza di vento.
    around: >-
      Il [Paesaggio forestale di Schorfheide-Chorin](/lugar/schorfheide-chorin-forest-landscape/) condivide
      con Grumsin il perimetro della medesima riserva della biosfera. A circa 13 km si trovano le [Foreste del
      Parco Naturale dei Laghi dell'Uckermark](/lugar/uckermarkische-seen-forests/).
  pt:
    intro: >-
      Durante décadas, as visitas públicas estiveram restringidas. Na RDA, este recanto de Brandeburgo era
      coutada estatal de caça: acesso proibido e ausência de exploração florestal intensiva. Esse passado é
      parte inseparável da história do bosque. Hoje, o Faial de Grumsin, com cerca de 590 hectares no sudeste
      da reserva natural Grumsiner Forst/Redernswalde, é Património Mundial da UNESCO. Podes explorar os seus
      arredores a pé por trilhos sinalizados, entre lagos, turfeiras e faias; o núcleo tem acesso estritamente
      condicionado.
    landscape: >-
      Tudo decorre da última glaciação, a de Weichsel. O gelo depositou moreias e mantos morénicos, conferindo
      à paisagem um relevo ondulado de montanha-russa. Nos cavados entre moreias formaram-se amiais
      pantanosos, turfeiras e lagoas glaciares. O ponto mais alto da reserva, o Blocksberg, mal atinge cerca
      de 139 m: não é precisa altitude para que o chão suba e desça a cada passo.


      O faial de Grumsin é um bosque de faias de planície sobre solos ricos em bases. Matas deste tipo
      consideram-se relíquias das imensas massas de faia que outrora cobriam a Europa central. Na reserva
      natural mais ampla, uma área de 847,91 hectares forma reserva total: ali sucedem-se lagos alimentados
      pela chuva, lagoas glaciares e turfeiras de assoreamento delimitadas por moreias.


      Nas florestas da reserva mais vasta registaram-se 349 plantas superiores, quatro delas na Lista
      Vermelha, como a erva-abelheira-branca (Weiße Waldvögelein). Entre as restantes surgem o trevo-d'água e,
      nas turfeiras intactas, a drósera, o algodão-de-pântano, o alecrim-dos-pântanos e vários bunhos.
    wildlife: >-
      As aves ajudam a conhecer o bosque e as suas zonas húmidas. Cinco espécies de pica-paus habitam aqui,
      entre elas o [pica-pau-preto](/especie/dryocopus_martius/), e o papa-moscas-de-colar também nidifica na
      mata. Junto à água surge o [guarda-rios-comum](/especie/alcedo_atthis/). Entre as aves citadas para a
      reserva figuram a [águia-rabalva](/especie/haliaeetus_albicilla/) e o [grou-comum](/especie/grus_grus/).
      A [cegonha-preta](/especie/ciconia_nigra/) e a [águia-pomarina](/especie/aquila_pomarina/) contam-se
      entre as aves raras que encontram refúgio nestas matas.


      As lagoas beneficiam a rela-comum, enquanto a madeira morta sustenta escaravelhos saproxílicos como o
      Kopfhornschröter e o Balkenschröter. Em 2012, peritos descobriram nas florestas da reserva cinco
      espécies de dípteros até então desconhecidas da ciência.


      De maio a outubro concentra-se a época recomendada de visita; as saídas guiadas de abril a outubro
      dispõem de calendário próprio.
    visit: >-
      O ponto de partida é Altkünkendorf, com um centro de visitantes e posto de informação sobre o faial. Aí
      se explica a proteção da floresta e a sua condição de Património Mundial.


      Grumsin tem cinco rotas circulares marcadas com cores. A rota Vermelha é a mais longa: 21,5 km
      contornando todo o sítio Património Mundial, podendo igualmente iniciar-se em Altkünkendorf. A rota
      Verde, de 7,2 km, parte do Museu da Idade do Gelo de Groß-Ziethen, onde repousa o mamute Georg, cruzando
      turfeiras, lagos florestais e amiais antes de regressar por um velho caminho empedrado. A rota Laranja
      parte de Altkünkendorf e pode encurtar-se em Luisenhof. O Genusswanderweg sai da estação de Angermünde e
      passa por Sternfelde, Schmargendorf, Zuchenberg e Luisenhof até Altkünkendorf.


      Se preferes caminhar acompanhado, guias certificados de natureza e paisagem organizam visitas no segundo
      e quarto sábados de cada mês, de abril a outubro. «Nasce um bosque primitivo» parte de Schmargendorf,
      dura cerca de quatro horas e mostra faias centenárias, relevo morénico e grandes turfeiras. «Living
      World Heritage» dura cerca de três horas e percorre 6 km.
    history: >-
      Este bosque é povoado há muito tempo. Na reserva natural foram descobertos vestígios de povoados do
      Neolítico e da Idade do Bronze, bem como aldeamentos eslavos dos séculos XII e XIII. Em finais do século
      XVI serviu para a caça nobre e ergueu-se uma cerca com mais de 70 km de extensão, vigiada por guardas de
      vedação. No início do século XIX drenaram-se terrenos agrícolas e, a partir dos anos cinquenta,
      realizaram-se fortes abates para madeira de construção e lenha.


      Depois chegou a RDA e, com ela, a coutada estatal de caça. A reserva natural está protegida desde o 1 de
      outubro de 1990, data em que se criou a reserva da biosfera Schorfheide-Chorin. O abandono do uso
      comercial preservou refúgios vitais para a fauna silvestre. A 25 de junho de 2011, 590 hectares de
      Grumsin foram classificados como Património Mundial da UNESCO.


      Grumsin integra o sítio serial das Florestas Primárias e Antigas de Faias dos Cárpatos e de Outras
      Regiões da Europa, congregando 93 componentes florestais em 18 países europeus, juntamente com os
      parques nacionais de Hainich, Kellerwald-Edersee, Jasmund e o setor de Serrahn do Müritz. O conjunto
      traduz a expansão pós-glaciar da faia pela Europa, o que não significa que cada parcela tenha
      permanecido intocada pelo homem desde então. Os faiais naturais como este situam-se entre os habitats
      mais ameaçados, ainda que a faia-europeia não seja uma espécie em risco.
    before: >-
      Permanece rigorosamente nos caminhos assinalados da reserva. O núcleo não admite entrada livre: só pode
      explorar-se em visitas autorizadas com guias credenciados. No troço sul da rota Laranja há troncos
      tombados que obrigam a passar por cima; os percursos de folhagem de faia não são acessíveis a cadeiras
      de rodas nem a andarilhos. Evita a mata sob ventos fortes pela queda de ramos, que também pode ocorrer
      em dias de calmaria.
    around: >-
      A [Paisagem Florestal de Schorfheide-Chorin](/lugar/schorfheide-chorin-forest-landscape/) partilha com
      Grumsin a área da mesma reserva da biosfera. A cerca de 13 km ficam as [Florestas do Parque Natural dos
      Lagos de Uckermark](/lugar/uckermarkische-seen-forests/).
