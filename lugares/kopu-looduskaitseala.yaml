resumen:
  es: Bosques sobre dunas y antiguos escarpes costeros, con humedales de manantial.
  en: >-
    Coastal dune forests, ancient fossil bluffs, and calcareous spring fens on Western Estonia's oldest
    landmass.
  fr: >-
    Forêts sur dunes, paléofalaises côtières et tourbières de source sur les terres les plus anciennes de
    l'Estonie occidentale.
  de: Dünenwälder, fossile Küstenkliffs und kalkreiche Quellmoore auf dem ältesten Landesteil Westestlands.
  it: Foreste dunali, antiche falesie fossili e sorgenti calcaree sul lembo più antico dell'Estonia occidentale.
  pt: >-
    Florestas dunares, antigas arribas fósseis e pauis de nascente mineral na terra mais ancestral da Estónia
    ocidental.
unico:
  es: >-
    En Neljateeristi se camina por el bosque que separa un antiguo acantilado costero de la costa actual, con
    ocho milenios de diferencia entre uno y otra.
  en: >-
    At Neljateeristi you walk through coastal woodland separating an ancient fossil sea cliff from today's
    shore, spanning eight millennia of geological uplift.
  fr: >-
    À Neljateeristi, vous marchez dans la forêt séparant un ancien escarpement marin de la côte actuelle, avec
    huit millénaires d'écart entre les deux.
  de: >-
    Bei Neljateeristi wanderst du durch den Wald, der eine fossile Steilküste von der heutigen Meereslinie
    trennt – mit acht Jahrtausenden nacheiszeitlicher Hebung dazwischen.
  it: >-
    A Neljateeristi cammini nella foresta che separa un'antica falesia costiera dal mare attuale, con otto
    millenni di sollevamento tra le due linee di costa.
  pt: >-
    Em Neljateeristi caminhas pelo bosque que separa uma antiga arriba marinha da costa atual, distando oito
    milénios de elevação geológica entre ambas.
observaciones:
  es: >-
    Los senderos están dentro de la reserva de Kõpu: hay que consultar sus normas y, para las restricciones, a
    la Keskkonnaamet. La indicación de acceso y las normas de la reserva están en las páginas de la RMK.
    Rebastemäe se recorre en aproximadamente una hora.
texto:
  es:
    intro: >-
      Hace 8000 años, donde hoy crece un bosque entero, solo había un islote de un kilómetro cuadrado en pleno
      mar. Esa es la historia de la península de Kõpu, la parte más antigua del oeste de Estonia, y de la
      reserva natural que la cubre en Hiiumaa: 3064 ha de bosques sobre dunas, antiguos acantilados costeros y
      humedales de manantial. La península mide unos 21 km de largo y hasta 7,3 km de ancho, y termina al
      oeste en el cabo Ristna, con dos faros: el de Kõpu y el de Ristna.
    landscape: >-
      La tierra subió despacio y el mar se retiró. De esa retirada quedan los escalones del paisaje. En el
      centro de la península se alza la meseta de Kõpu, con el punto más alto del archipiélago de Estonia
      occidental, el Tornimägi, de 68 metros. Hay dunas altas, los Rebastemäed, antiguos acantilados costeros
      y bloques erráticos: el bloque de Mägipe y, en la playa, el Süllasoo Jaanikivi son monumentos de la
      época glaciar. Gran parte de la península está cubierta de bosque de coníferas, y también crecen tejos y
      otras plantas atlánticas.


      Los bosques cambian según donde pises. En Rebastemäe, el recorrido atraviesa pinar sobre dunas, bosque
      frondoso bajo un escarpe y una vieja piceeda natural con árboles derribados por el viento. En la piceeda
      se encuentra un arbusto enano de hoja perenne, el harilik harakkuljus. Bajo el acantilado de la costa
      norte está Möirasoo, un pequeño humedal calcáreo de manantial, y existen varias leyendas sobre su
      nombre. El plan de gestión describe sectores de bosque en estado natural en el norte de la reserva.
    wildlife: >-
      Lo que se busca aquí es lo vegetal: el tejo protegido, de un periodo climático más cálido, que se puede
      encontrar en el sendero de Neljateeristi, y el arbusto enano de la piceeda. Los tejos recuerdan que aquí
      el clima fue más cálido.
    visit: >-
      Hay dos senderos didácticos de la RMK y un centro de visitantes. Rebastemäe mide 1,5 km. En Kaplimäe,
      segunda altura de Hiiumaa con 63,5 m, y en Rebastemäe, las torres de observación dan vistas sobre el
      bosque y el mar. En Kaplimäe se conoce la leyenda popular de la capilla. El sendero tiene ocho paneles
      pequeños en estonio e inglés y uno grande al comienzo, varias escaleras y dos plataformas de
      observación, y está señalizado con flechas de madera y cintas azules. Se aparca en una bahía junto a la
      carretera nacional.


      Neljateeristi es un paseo de aproximadamente una hora entre escarpes de la glaciación y pequeñas salinas
      de manantial. Va por la costa norte de la península, por los bosques entre un acantilado costero de 8000
      años y la costa actual.


      El centro de visitantes de Ristna está en el pueblo de Kalana, entre los bosques de la península, en una
      antigua casa forestal de más de un siglo. Ofrece información sobre Hiiumaa y los espacios de visita de
      la RMK. La casa principal tiene exposiciones que cambian, y desde el patio se conocen las hierbas
      aromáticas locales y se sale al sendero didáctico sobre el patrimonio forestal y el bosque primario.
    history: >-
      Los habitantes de la península se llamaban törvaköplased; en sentido estricto, los quemadores y
      vendedores de alquitrán.
    before: >-
      Los senderos están dentro de la reserva de Kõpu: hay que consultar sus normas y, para las restricciones,
      a la Keskkonnaamet. La indicación de acceso y las normas de la reserva están en las páginas de la RMK.
      Rebastemäe se recorre en aproximadamente una hora.
    around: >-
      La [Reserva Paisajística de la Bahía de Käina y Kassari](/lugar/kaina-lahe-kassari-maastikukaitseala/)
      está a unos veinticinco kilómetros.
  en:
    intro: >-
      Some 8000 years ago, where a continuous maritime forest now thrives, only an isolated islet of one
      square kilometre poked above the Baltic waves. Such is the primordial origin of the Kõpu Peninsula, the
      oldest geological landmass of western Estonia, and the nature reserve guarding it across Hiiumaa: 3064
      ha of dune forests, ancient sea scarps, and calcareous spring seepages. The peninsula extends roughly 21
      km in length and up to 7.3 km across, terminating westwards at Cape Ristna beneath two historic beacons:
      the Kõpu and Ristna lighthouses.
    landscape: >-
      Post-glacial rebound caused the seabed to rise steadily as maritime waters retreated, leaving distinct
      morphological terrace steps across the terrain. At the core of the peninsula swells the Kõpu plateau,
      culminating at Tornimägi, which at 68 metres marks the highest natural elevation in the Western Estonian
      Archipelago. Stately coastal dunes known as the Rebastemäed flank ancient littoral scarps and massive
      glacial erratics: the Mägipe boulder and the beach-side Süllasoo Jaanikivi stand as monumental relics of
      the ice age. Coniferous woods shroud most of the peninsula, sheltering relict European yews and Atlantic
      plant species.


      Forest associations shift dramatically with the underlying topography. At Rebastemäe, the trail winds
      through dry pine groves on dune crests, lush deciduous stands at the foot of fossil scarps, and primeval
      spruce stands strewn with storm-felled deadwood. In these old spruce groves grows the rare evergreen
      dwarf shrub Linnaea borealis (harilik harakkuljus). Beneath the northern coastal bluffs lies Möirasoo, a
      unique calcareous spring fen steeped in local folklore. Conservation zoning protects undisturbed
      old-growth core sectors across northern parts of the reserve.
    wildlife: >-
      Botanical treasures define the reserve's primary natural interest: strictly protected European yews
      surviving from a warmer mid-Holocene climatic epoch, discoverable along the Neljateeristi trail, and
      creeping evergreen shrubs of old spruce groves. These Atlantic yew populations offer living testimony to
      prehistoric warmer climates.
    visit: >-
      Two state forest (RMK) interpretive nature trails and a visitor centre welcome hikers. The Rebastemäe
      trail covers 1.5 km. At Kaplimäe, Hiiumaa's second-highest summit at 63.5 m, and on Rebastemäe,
      observation towers provide panoramic vistas sweeping over canopy and open sea. At Kaplimäe you can
      discover the folklore of the ancient wooden chapel. The trail features eight small information boards in
      Estonian and English, one large trail-head board, timber staircases, and two scenic lookout platforms,
      marked with wooden arrows and blue trail blazes. A dedicated parking bay sits along the main highway.


      Neljateeristi is a scenic loop of approximately one hour winding between post-glacial scarps and mineral
      spring wetlands. It follows the peninsula's northern coast, through quiet woods dividing an
      8000-year-old fossil cliff from the contemporary shoreline.


      The Ristna Visitor Centre is situated in Kalana village, sheltered in peninsular woodland within a
      century-old former forester's residence. It supplies comprehensive guidance on Hiiumaa and RMK
      recreational zones. The main lodge hosts rotating exhibitions, while the heritage garden introduces
      local herbs before leading out to a forest heritage trail.
    history: >-
      Historical residents of the peninsula were traditionally called törvaköplased; literally, the tar
      burners and merchants who distilled pine resin in forest charcoal pits.
    before: >-
      All paths lie within the Kõpu Nature Reserve: consult official protection rules and check local seasonal
      restrictions with the Environmental Board (Keskkonnaamet). Route details and zoning rules are accessible
      on RMK portals. The Rebastemäe nature loop requires about one hour to complete.
    around: >-
      The scenic [Käina Bay and Kassari Landscape Conservation
      Area](/lugar/kaina-lahe-kassari-maastikukaitseala/) lies around twenty-five kilometres to the east.
  fr:
    intro: >-
      Il y a 8000 ans, là où s'étend aujourd'hui un massif forestier ininterrompu, seul un îlot d'un kilomètre
      carré émergeait des flots baltiques. Telle est la genèse de la péninsule de Kõpu, le plus ancien secteur
      émergé de l'Estonie occidentale, et de la réserve naturelle qui la préserve sur l'île de Hiiumaa : 3064
      ha de forêts dunaires, d'anciennes falaises marines et de tourbières de sources calcaires. La péninsule
      mesure environ 21 km de long pour un maximum de 7,3 km de large, se terminant à l'ouest au cap Ristna
      sous la garde de deux phares historiques : Kõpu et Ristna.
    landscape: >-
      La terre s'est lentement exhaussée par rebond isostatique tandis que la mer reculait, sculptant des
      gradins morphologiques dans le relief. Au centre de la péninsule s'élève le plateau de Kõpu, culminant
      au Tornimägi qui domine l'archipel d'Estonie occidentale du haut de ses 68 mètres. De hautes dunes
      côtières, les Rebastemäed, côtoient d'antiques falaises fossiles et de gigantesques blocs erratiques :
      le monolithe de Mägipe et le bloc littoral Süllasoo Jaanikivi témoignent de l'ère glaciaire. De denses
      pinèdes couvrent la presqu'île, où prospèrent aussi des ifs d'Europe et diverses plantes reliques
      atlantiques.


      Les peuplements forestiers varient selon le substrat. À Rebastemäe, le tracé traverse une pinède sur
      sable dunaire, des feuillus au pied d'un escarpement et une pessière sauvage encombrée de chablis. Dans
      la pessière fleurit un sous-arbrisseau nain persistant, la linnée boréale (harilik harakkuljus). Sous la
      falaise littorale nord s'étend Möirasoo, une petite tourbière basse alcaline alimentée par des sources
      minérales, entourée de légendes locales. Le plan de gestion classe plusieurs secteurs forestiers en
      réserve intégrale au nord.
    wildlife: >-
      L'attrait principal réside dans la flore : l'if d'Europe strictement protégé, relique d'une époque
      climatique plus chaude que vous découvrirez le long du sentier de Neljateeristi, ainsi que les
      arbrisseaux nains des vieilles pessières. Les ifs rappellent qu'un climat bien plus tempéré régnait
      jadis sur cette côte.
    visit: >-
      Deux sentiers didactiques de l'Office national des forêts (RMK) et un centre d'accueil balisent la
      visite. Le sentier de Rebastemäe s'étend sur 1,5 km. À Kaplimäe, deuxième point culminant de Hiiumaa à
      63,5 m, et à Rebastemäe, des tours en bois offrent une vue plongeante sur la canopée et la mer. À
      Kaplimäe, vous découvrirez les légendes entourant l'ancienne chapelle disparue. Le parcours comporte
      huit petits panneaux en estonien et en anglais, un grand panneau introductif, plusieurs escaliers et
      deux belvédères en bois, balisés de flèches et de rubans bleus. Le stationnement s'effectue sur un
      parking le long de la route principale.


      Le sentier de Neljateeristi offre une boucle d'environ une heure entre falaises fossiles et tourbières
      de sources. Il longe la côte septentrionale dans les bois séparant une falaise côtière vieille de 8000
      ans du rivage actuel.


      Le centre d'accueil de Ristna se trouve dans le hameau de Kalana, abrité dans une maison forestière
      centenaire. Il dispense des renseignements précieux sur Hiiumaa et les zones de loisirs RMK. Le bâtiment
      expose des présentations temporaires, et sa cour présente les plantes aromatiques locales avant le
      sentier du patrimoine forestier.
    history: >-
      Les habitants traditionnels de la péninsule étaient surnommés les törvaköplased, littéralement les
      producteurs et marchands de goudron végétal tiré de la résine des pins.
    before: >-
      Les itinéraires cheminent au cœur de la réserve de Kõpu : respectez sa réglementation et consultez
      l'Office de l'environnement (Keskkonnaamet) pour d'éventuelles restrictions saisonnières. Les consignes
      sont détaillées sur les plateformes de la RMK. La boucle de Rebastemäe se parcourt en une heure environ.
    around: >-
      La [zone de protection du paysage de la baie de Käina et de
      Kassari](/lugar/kaina-lahe-kassari-maastikukaitseala/) s'étend à environ vingt-cinq kilomètres vers
      l'est.
  de:
    intro: >-
      Vor 8000 Jahren ragte dort, wo heute ein geschlossenes Waldgebiet wächst, nur ein winziges Eiland von
      einem Quadratkilometer aus der eiszeitlichen Ostsee. Dies ist die Urgeschichte der Halbinsel Kõpu, des
      ältesten Landstrichs Westestlands, und des Naturschutzgebiets auf Hiiumaa: 3064 ha Dünenwälder, fossile
      Küstenkliffs und kalkhaltige Quellmoore. Die Halbinsel erstreckt sich über rund 21 km Länge und bis zu
      7,3 km Breite und läuft nach Westen am Kap Ristna aus, markiert von zwei Leuchttürmen: Kõpu und Ristna.
    landscape: >-
      Durch nacheiszeitliche Landhebung wich das Meer zurück und hinterließ landschaftliche Geländestufen. Im
      Zentrum der Halbinsel wölbt sich das Kõpu-Plateau auf, gekrönt vom Tornimägi, der mit 68 Metern die
      höchste Erhebung des westestnischen Archipels darstellt. Hohe Dünenzüge wie die Rebastemäed säumen
      einstige Meereskliffs und riesige Findlinge: Der Findling von Mägipe und der strandnahe Süllasoo
      Jaanikivi sind Zeugen der Eiszeit. Ausgedehnte Nadelwälder bedecken den Großteil der Halbinsel,
      bereichert um Eiben und andere atlantische Reliktpflanzen.


      Die Waldformen wechseln mit dem Relief. Bei Rebastemäe führt der Pfad durch Kiefernwälder auf
      Dünensanden, artenreiche Laubgehölze am Fuß einer Geländestufe und urige Fichtenbestände voller Totholz.
      In den Fichtenwäldern wächst das seltene Moosglöckchen (harilik harakkuljus). Unter dem nördlichen
      Küstenkliff liegt Möirasoo, ein kleines kalkreiches Quellmoor mit sagenhafter Überlieferung. Der
      Managementplan weist naturnahe Altwaldparzellen im Norden des Schutzgebiets aus.
    wildlife: >-
      Das botanische Erbe steht hier im Vordergrund: die streng geschützte Europäische Eibe, Relikt einer
      wärmeren holozänen Klimaphase am Neljateeristi-Weg, und Zwerggehölze der Urfichtenwälder. Die
      Eibenbestände erinnern an das einstmals mildere Klima dieser Ostseeinsel.
    visit: >-
      Zwei RMK-Naturlehrpfade und ein Informationszentrum erschließen das Areal. Der Lehrpfad Rebastemäe ist
      1,5 km lang. Am Kaplimäe, mit 63,5 m zweithöchste Erhebung Hiiumaas, und bei Rebastemäe bieten Holztürme
      weite Ausblicke über Baumwipfel und Ostsee. Am Kaplimäe erfährst du die Überlieferungen um die
      historische Kapelle. Der Pfad besitzt acht kleine Tafeln auf Estnisch und Englisch, eine große
      Starttafel, Treppen und zwei Aussichtsplattformen, markiert mit Holzpfeilen und blauen Bändern.
      Parkplätze liegen direkt an der Landstraße.


      Neljateeristi ist ein rund einstündiger Rundweg zwischen nacheiszeitlichen Steilstufen und Quellmooren.
      Er zieht an der Nordküste durch die Wälder zwischen einer 8000 Jahre alten Klifflinie und dem heutigen
      Strand.


      Das RMK-Besucherzentrum Ristna liegt im Dorf Kalana in einem über hundertjährigen Forsthaus mitten im
      Wald. Es informiert über Hiiumaa und RMK-Ausflugsziele. Das Haupthaus zeigt Wechselausstellungen, und
      vom Garten mit Kräuterbeeten startet ein forstgeschichtlicher Lehrpfad.
    history: >-
      Die historischen Bewohner der Halbinsel hießen törvaköplased; wörtlich übersetzt die Teerbrenner und
      Teerhändler, die das Harz der Kiefernwälder destillierten.
    before: >-
      Die Wege liegen im Naturschutzgebiet Kõpu: Beachte die Schutzvorschriften und informiere dich beim
      Umweltamt (Keskkonnaamet) über Auflagen. Detaillierte Hinweise finden sich auf den RMK-Seiten. Der
      Rundweg Rebastemäe dauert rund eine Stunde.
    around: >-
      Das [Landschaftsschutzgebiet Käina-Bucht und Kassari](/lugar/kaina-lahe-kassari-maastikukaitseala/)
      liegt etwa fünfundzwanzig Kilometer östlich.
  it:
    intro: >-
      Circa 8000 anni fa, dove oggi prospera una vasta foresta continua, emergeva dalle onde baltiche solo un
      piccolo isolotto di un chilometro quadrato. È questa la genesi geologica della penisola di Kõpu, la
      terra più antica dell'Estonia occidentale, e della riserva naturale che la protegge a Hiiumaa: 3064 ha
      di boschi su dune, antichi rilievi costieri e risorgive calcaree. La penisola misura circa 21 km di
      lunghezza per una larghezza fino a 7,3 km, culminando a ovest a Capo Ristna sotto due fari storici: Kõpu
      e Ristna.
    landscape: >-
      Il sollevamento isostatico postglaciale ha ritirato il mare gradualmente, lasciando evidenti terrazzi
      morfologici nel territorio. Nel cuore della penisola si eleva l'altopiano di Kõpu, culminante nel
      Tornimägi che tocca 68 metri d'altitudine, punto più alto dell'intero arcipelago estone occidentale.
      Imponenti cordoni dunali, i Rebastemäed, affiancano antiche scarpate litoranee ed enormi massi erratici:
      il masso di Mägipe e il litoraneo Süllasoo Jaanikivi costituiscono celebri monumenti glaciali. Dense
      foreste di conifere ammantano il promontorio, ospitando tassi e altre specie vegetali atlantiche.


      La composizione del bosco muta a seconda dei suoli. A Rebastemäe l'itinerario attraversa pinete dunali,
      latifoglie alla base di una scarpata e una vecchia pecceta naturale ricca di alberi abbattuti dal vento.
      Nel sottobosco ombroso cresce un raro arbusto nano sempreverde, l'harilik harakkuljus. Sotto la falesia
      costiera settentrionale si cela Möirasoo, una sorgente calcarea palustre ammantata da leggende popolari.
      Il piano di gestione individua nuclei di foreste vetuste primarie nel settore nord della riserva.
    wildlife: >-
      La flora costituisce la principale attrattiva dell'area: l'antico tasso europeo protetto, relitto di una
      fase climatica più mite che puoi ammirare lungo il sentiero di Neljateeristi, e gli arbusti nani delle
      peccete vetuste. I tassi testimoniano il clima sensibilmente più caldo che contraddistinse queste isole
      in epoche remote.
    visit: >-
      Due itinerari didattici dell'ente forestale RMK e un centro visite accolgono gli escursionisti. Il
      percorso di Rebastemäe si sviluppa per 1,5 km. Sul colle Kaplimäe, seconda cima di Hiiumaa con 63,5 m, e
      a Rebastemäe, torrette panoramiche offrono una visuale spettacolare su foreste e mare aperto. A Kaplimäe
      si rievocano le leggende popolari legate a un'antica cappella votiva. Il sentiero dispone di otto
      piccoli pannelli in estone e inglese, un pannello introduttivo, gradinate e due belvedere sopraelevati,
      contrassegnati da frecce e nastri azzurri. Si parcheggia in una piazzola lungo la strada statale.


      Neljateeristi è una camminata di circa un'ora tra scarpate postglaciali e sorgive minerali. Si snoda
      lungo la costa settentrionale, tra le boscaglie che separano una scogliera fossile di 8000 anni fa dalla
      battigia attuale.


      Il centro visite di Ristna si trova nel borgo di Kalana, immerso nei boschi in una palazzina forestale
      ultracentenaria. Fornisce informazioni su Hiiumaa e sulle aree ricreative RMK. L'edificio ospita mostre
      temporanee, e dal giardino botanico parte un sentiero didattico sul patrimonio forestale.
    history: >-
      Gli abitanti storici della penisola venivano chiamati törvaköplased; letteralmente, i produttori e
      commercianti di catrame vegetale estratto dalla resina di pino.
    before: >-
      Tutti i tracciati ricadono nella riserva di Kõpu: rispetta il regolamento e verifica eventuali vincoli
      stagionali presso l'Agenzia per l'Ambiente (Keskkonnaamet). I dettagli di accesso figurano sui canali
      della RMK. L'anello di Rebastemäe si percorre comodamente in un'ora.
    around: >-
      L'[Area di protezione paesaggistica della Baia di Käina e di
      Kassari](/lugar/kaina-lahe-kassari-maastikukaitseala/) dista circa venticinque chilometri verso est.
  pt:
    intro: >-
      Há 8000 anos, onde hoje se estende uma densa floresta contínua, apenas um ilhéu solitário de um
      quilómetro quadrado sobressaía das ondas do Báltico. Esta é a génese da península de Kõpu, a formação
      terrestre mais vetusta do oeste da Estónia, e da reserva natural que a protege em Hiiumaa: 3064 ha de
      matas dunares, paleofalésias litorais e zonas húmidas de nascentes calcárias. A península mede cerca de
      21 km de comprimento por até 7,3 km de largura, terminando a poente no cabo Ristna sob a vigília de dois
      faróis: o de Kõpu e o de Ristna.
    landscape: >-
      A terra emergiu gradualmente por compensação isostática enquanto o mar recuava, desenhando degraus na
      paisagem. No coração da península ergue-se o planalto de Kõpu, cujo ponto culminante em Tornimägi atinge
      68 metros, cota máxima do arquipélago da Estónia ocidental. Cordões dunares elevados, os Rebastemäed,
      ladeiam escarpas fósseis e blocos erráticos colossais: o bloco de Mägipe e o litorâneo Süllasoo
      Jaanikivi são marcos da era glaciar. Vastas florestas de coníferas cobrem a península, albergando teixos
      e outras plantas de afinidade atlântica.


      A vegetação arbórea transforma-se com o relevo. Em Rebastemäe, o percurso cruza pinhais de dunas
      arenosas, folhosas na base de escarpas e um velho abetal selvagem pejados de troncos tombados pelo
      vento. No abetal encontra-se um raro subarbusto rasteiro perenifólio, a flor-do-norte (harilik
      harakkuljus). Sob a arriba da costa norte esconde-se Möirasoo, um pequeno paul calcário de nascente rico
      em lendas populares. O plano de ordenamento salvaguarda manchas de floresta virgem no norte da reserva.
    wildlife: >-
      O grande destaque local é o património botânico: o teixo protegido, relíquia de um período climático bem
      mais quente que podes encontrar no trilho de Neljateeristi, e a vegetação anã dos velhos abetais. Os
      teixos recordam as temperaturas amenas que reinaram nesta ilha em épocas recuadas.
    visit: >-
      Dois trilhos interpretativos da autoridade florestal RMK e um centro de visitantes estruturam a
      visitação. O trilho de Rebastemäe tem 1,5 km. No monte Kaplimäe, segunda elevação de Hiiumaa aos 63,5 m,
      e em Rebastemäe, torres em madeira descortinam vistas soberbas sobre a copa florestal e o mar. Em
      Kaplimäe podes conhecer a lenda local sobre a capela desaparecida. O trilho dispõe de oito painéis
      pequenos em estónio e inglês, um grande painel inicial, escadarias e duas plataformas de observação, com
      setas de madeira e fitas azuis. O estacionamento faz-se numa baía junto à estrada nacional.


      Neljateeristi é um circuito de cerca de uma hora entre escarpas pós-glaciares e nascentes minerais.
      Percorre a costa norte nos bosques que medeiam entre uma falésia com 8000 anos e o areal moderno.


      O centro de visitantes de Ristna localiza-se na aldeia de Kalana, abrigado no bosque numa secular casa
      de guardas-florestais. Oferece dados sobre Hiiumaa e as áreas de lazer RMK. O edifício principal acolhe
      exposições e o jardim exterior mostra ervas aromáticas antes do trilho sobre património florestal.
    history: >-
      Os habitantes ancestrais da península eram designados por törvaköplased; literalmente os produtores e
      mercadores do alcatrão vegetal extraído da resina dos pinheiros.
    before: >-
      Os trilhos situam-se no interior da reserva de Kõpu: deves acatar as suas regras e consultar restrições
      sazonais junto da Agência Ambiental (Keskkonnaamet). As indicações práticas constam dos portais da RMK.
      O percurso circular de Rebastemäe cumpre-se em aproximadamente uma hora.
    around: >-
      A [Área de Paisagem Protegida da Baía de Käina e de
      Kassari](/lugar/kaina-lahe-kassari-maastikukaitseala/) situa-se a cerca de vinte e cinco quilómetros
      para leste.
