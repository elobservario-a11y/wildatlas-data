unico:
  es: >-
    Un macizo con dos caras, de suaves lomas de pasto al sur y paredes de roca verticales al norte, que se
    cruza en una sola jornada.
  en: >-
    A two-faced massif of gentle grassy slopes to the south and sheer rock faces to the north, which can be
    traversed in a single day.
  fr: >-
    Un massif à deux visages, fait de douces croupes herbeuses au sud et de parois rocheuses verticales au
    nord, traversable en une seule journée.
  de: >-
    Ein Gebirge mit zwei Gesichtern: sanfte Grashänge im Süden und senkrechte Felswände im Norden, die an
    einem einzigen Tag durchquert werden können.
  it: >-
    Un massiccio dai due volti, con dolci pendii erbosi a sud e pareti rocciose verticali a nord,
    attraversabile in una sola giornata.
  pt: >-
    Um maciço com duas faces, de suaves encostas relvadas a sul e paredões de rocha verticais a norte,
    percorrível num único dia.
observaciones:
  es: >-
    Elige una ruta acorde con tu experiencia, infórmate del terreno y del estado de los caminos, mira el
    tiempo y lleva lo imprescindible. Quédate siempre en los senderos marcados, no recojas flores y llévate la
    basura. Con lluvia, la ruta alternativa es la mejor opción. La temporada va de mayo a octubre.
texto:
  es:
    intro: >-
      Al sur, lomas de pasto donde pastan caballos, ovejas y vacas; al norte, paredes de roca cortadas en
      vertical. El Rofan, la parte occidental de los Alpes de Brandenberg, tiene dos caras y se recorre de una
      a otra. Es un macizo calizo del Tirol austriaco, entre el lago Achensee, el valle del Inn y los Prealpes
      bávaros, y su cumbre, la Hochiss, llega a 2299 m. Lo que ofrece son senderos, refugios de montaña y
      lagos de altura.
    landscape: >-
      Los Alpes de Brandenberg forman un subgrupo de los Alpes Calizos del Norte, y el Rofan propiamente dicho
      es su parte occidental, entre el río Brandenberger Ache y el Achensee. Tiene un núcleo central de
      cumbres y tres montes que quedan aparte: el Guffert, de 2194 m, un macizo independiente al norte de
      Steinberg am Rofan; el Unnütze, en el extremo norte del lago, y el Ebner Joch, en el extremo sur. El
      resto del grupo, hacia el este, se extiende como cordal del Pendling hasta Kiefersfelden. Al oeste queda
      el Karwendel; al este, el Kaisergebirge.


      Entre cabañas y pastos aparece el Zireiner See, un lago de montaña de unas cuatro hectáreas, a 1799 m,
      en el término de Münster. Se llega desde la Bayreuther Hütte en una hora y tres cuartos, y desde la
      Erfurter Hütte, que está junto a la estación superior del teleférico, en unas tres horas y cuarto. El
      itinerario discurre entre bosques aclarados, arroyos y praderas alpinas abiertas, y la Rofanspitze se
      refleja en el agua.
    wildlife: >-
      El Rofan es un hábitat importante para la fauna, y la fauna es especialmente vulnerable a las molestias
      humanas. Por eso hay santuarios de fauna señalizados y se pide no salirse de los senderos marcados.
      Quien camina por la Rofanrunde puede cruzarse con [rebecos](/especie/rupicapra_rupicapra/) sobre el
      terreno pedregoso y, con suerte, divisar una [marmota](/especie/marmota_marmota/). En los pastos de
      montaña pastan caballos, ovejas y ganado vacuno, y eso condiciona cómo se camina: una de las estaciones
      del sendero educativo da las diez reglas principales para pasar cerca del ganado.


      Hay plantas endémicas protegidas, y está prohibido dañar, arrancar o recoger flores silvestres. El
      calendario lo marca la nieve. En el Schafsteig, que baja bajo la Rofanspitze, el camino se califica de
      negro y puede resultar resbaladizo con humedad; en mayo, junio, septiembre y octubre, la ruta
      alternativa de la misma etapa suele estar libre de nieve y no tiene tramos negros. El tiempo de montaña
      cambia muy rápido, y la previsión se mira antes de salir.
    visit: >-
      Si solo tienes un día, el Eagle Walk entre Steinberg am Rofan y la Erfurter Hütte es una forma de
      atravesar el macizo de lado a lado: 18 km, unas ocho horas y 1590 m de desnivel positivo, con la etapa
      clasificada como difícil. Pasa por el valle de Schauertal y por el Zireiner See, y termina en la
      Erfurter Hütte, a 1831 m, junto a la estación superior de la telecabina. Desde allí se baja a pie en
      hora y media o en telecabina hasta Maurach. Con lluvia fuerte o deshielo, el paso por el Schauertal y el
      Schafsteigsattel se complica, y existe una ruta alternativa que se tarda unas dos horas y media más.


      Para más días está la Rofanrunde, una travesía exigente de cuatro etapas y unos treinta kilómetros, con
      noches en refugios. Y para empezar con calma, el sendero educativo del Rofan: sale cerca de la estación
      superior del teleférico, tiene siete estaciones, mide kilómetro y medio, sube más de doscientos metros y
      se calcula en una hora y cincuenta minutos. En verano sus paneles explican cómo respetar la fauna, las
      flores alpinas y el entorno; en invierno el mismo recorrido enseña a esquiadores de travesía y a quienes
      caminan con raquetas cómo actuar ante un alud.
    history: >-
      El sendero educativo es la mejor muestra de cómo se cuida este macizo. Cada estación cubre una norma:
      cómo pasar junto al ganado, cómo respetar los hábitats de la fauna y las flores, cómo llevarse la
      basura, cómo moverse con seguridad y con qué tiempo. La recomendación local es no salirse de los
      senderos señalizados dentro de los santuarios de fauna.
    before: >-
      Elige una ruta acorde con tu experiencia, infórmate del terreno y del estado de los caminos, mira el
      tiempo y lleva lo imprescindible. Quédate siempre en los senderos marcados, no recojas flores y llévate
      la basura. Con lluvia, la ruta alternativa es la mejor opción. La temporada va de mayo a octubre.
    around: >-
      El [Parque Natural de Karwendel](/lugar/naturpark-karwendel/) queda a solo dos kilómetros: el Karwendel
      es el grupo de montañas que limita con el Rofan por el oeste.
  en:
    intro: >-
      To the south, gentle grassy hills where horses, sheep, and cattle graze; to the north, precipitous
      vertical rock walls. The Rofan, the western portion of the Brandenberg Alps, displays two starkly
      contrasting faces and can be crossed from one to the other. It is a limestone massif in the Austrian
      Tyrol, cradled between Lake Achensee, the Inn Valley, and the Bavarian Prealps, with its highest peak,
      the Hochiss, reaching 2299 m. It invites exploration with alpine paths, rustic mountain huts, and
      shimmering mountain tarns.
    landscape: >-
      The Brandenberg Alps constitute a subgroup of the Northern Limestone Alps, with the Rofan proper
      comprising their western sector between the Brandenberger Ache river and Lake Achensee. It features a
      central crest and three freestanding mountain outposts: the Guffert (2194 m), an independent bastion
      north of Steinberg am Rofan; the Unnütze, flanking the northern tip of the lake; and the Ebner Joch,
      guarding the southern end. Eastward, the range continues along the Pendling ridge toward Kiefersfelden.
      The Karwendel lies to the west, while the Kaisergebirge rises to the east.


      Nestled among alpine huts and meadows lies the Zireiner See, an alpine tarn covering some four hectares
      at 1799 m, within the municipality of Münster. It is reached from the Bayreuther Hütte in an hour and
      three quarters, and from the Erfurter Hütte beside the cable car top station in roughly three hours and
      a quarter. The scenic route winds past open forest, mountain streams, and sweeping pastures, with the
      Rofanspitze reflected in the tarn.
    wildlife: >-
      The Rofan is vital habitat for alpine wildlife, which remains particularly sensitive to human
      disturbance. Designated wildlife sanctuaries are marked throughout the massif, and walkers are requested
      to keep strictly to waymarked tracks. Hiking the Rofanrunde, you may encounter
      [chamois](/especie/rupicapra_rupicapra/) across scree fields and, with luck, spot an [alpine
      marmot](/especie/marmota_marmota/). Cattle, sheep, and horses graze across the high pastures, shaping
      trail etiquette: an interpretive station along the educational trail outlines ten essential rules for
      passing safely near livestock.


      Protected endemic plants grace the limestone crevices, and damaging, picking, or uprooting alpine
      wildflowers is forbidden. The seasonal calendar is dictated by snow conditions. Along the Schafsteig
      beneath the Rofanspitze, the path is classified as a black-grade trail that turns slippery in wet
      weather; during May, June, September, and October, the variant route of that same stage is typically
      snow-free and avoids black-grade terrain. Mountain weather shifts swiftly, so forecasts should be
      verified before setting out.
    visit: >-
      If you only have one day, the Eagle Walk between Steinberg am Rofan and the Erfurter Hütte is an ideal
      way to traverse the massif from side to side: 18 km, around eight hours, and 1590 m of elevation gain,
      graded as difficult. The trail climbs through the Schauertal valley, skirts Zireiner See, and finishes
      at Erfurter Hütte at 1831 m, beside the top cableway station. From there you can hike down to Maurach in
      an hour and a half or ride the gondola. During heavy rain or early-season snowmelt, crossing the
      Schauertal and Schafsteigsattel becomes hazardous; an easier variant route adds about two and a half
      hours.


      For multi-day trekking, the Rofanrunde provides a challenging four-stage circuit of roughly thirty
      kilometres with overnight stays in mountain huts. For an easy orientation, the Rofan Nature Trail begins
      near the top cable car station, comprises seven interpretive stations, spans a kilometre and a half,
      climbs two hundred metres, and takes about an hour and fifty minutes. In summer its panels explain
      mountain stewardship and alpine flora; in winter the same circuit instructs ski tourers and snowshoers
      on avalanche safety.
    history: >-
      The interpretive trail embodies how this massif is conserved. Each station outlines a tenet of mountain
      conduct: behaving around grazing herds, protecting floral and faunal habitats, packing out litter, and
      navigating safely according to weather conditions. Local guidelines urge hikers not to stray from
      signposted paths in wildlife refuges.
    before: >-
      Select a route matching your mountain fitness, check trail and weather conditions, and pack essential
      gear. Stay on marked paths, leave wildflowers untouched, and carry out waste. In wet weather, take the
      variant route. The season runs from May to October.
    around: >-
      [Karwendel Nature Park](/lugar/naturpark-karwendel/) lies just two kilometres away: the Karwendel is the
      prominent mountain range bordering the Rofan immediately to the west.
  fr:
    intro: >-
      Au sud, des croupes herbeuses où paissent chevaux, moutons et vaches ; au nord, des murailles de
      calcaire taillées à pic. Le Rofan, partie occidentale des Alpes de Brandenberg, présente deux visages et
      se parcourt d'un versant à l'autre. C'est un massif calcaire du Tyrol autrichien, coincé entre le lac
      Achensee, la vallée de l'Inn et les Préalpes bavaroises, dont le point culminant, le Hochiss, atteint
      2299 m. Il offre de beaux sentiers, des refuges et des lacs d'altitude.
    landscape: >-
      Les Alpes de Brandenberg constituent un sous-groupe des Alpes calcaires septentrionales, et le Rofan
      proprement dit forme leur aile occidentale, entre la rivière Brandenberger Ache et l'Achensee. Il
      comprend un noyau central de crêtes et trois bastions individualisés : le Guffert, de 2194 m, massif
      indépendant au nord de Steinberg am Rofan ; l'Unnütze, à l'extrémité nord du lac ; et l'Ebner Joch, à
      l'extrémité sud. Vers l'est, la chaîne se prolonge le long de l'arête du Pendling vers Kiefersfelden. À
      l'ouest se dresse le Karwendel ; à l'est, le Kaisergebirge.


      Entre chalets et alpages repose le Zireiner See, lac d'altitude d'environ quatre hectares perché à 1799
      m sur la commune de Münster. On l'atteint depuis la Bayreuther Hütte en une heure et trois quarts, et
      depuis l'Erfurter Hütte, sise à l'arrivée du téléphérique, en trois heures et quart. L'itinéraire
      chemine entre forêts claires, torrents et pelouses alpines, tandis que la Rofanspitze se reflète dans
      l'eau.
    wildlife: >-
      Le Rofan forme un biotope précieux pour la faune alpine, particulièrement sensible aux dérangements
      humains. Des zones de quiétude de la faune sont balisées, et il est demandé de ne pas quitter les
      sentiers balisés. En parcourant la Rofanrunde, vous pourrez observer des
      [chamois](/especie/rupicapra_rupicapra/) sur les pierriers et, avec de la chance, apercevoir une
      [marmotte](/especie/marmota_marmota/). Dans les alpages paissent chevaux, ovins et bovins : l'une des
      stations du sentier didactique détaille d'ailleurs dix règles d'or pour côtoyer les troupeaux en
      sécurité.


      De nombreuses plantes endémiques protégées fleurissent les parois, et cueillir ou arracher les fleurs
      sauvages est formellement interdit. Les saisons sont rythmées par la neige. Dans le Schafsteig, sous la
      Rofanspitze, le tracé est classé sentier noir et devient très glissant par temps humide ; en mai, juin,
      septembre et octobre, la variante de cette étape est souvent dégagée de neige et évite les passages
      noirs. La météo montagnarde change très vite.
    visit: >-
      Si vous ne disposez que d'une journée, la Traversée de l'Aigle (Eagle Walk) entre Steinberg am Rofan et
      l'Erfurter Hütte permet de traverser le massif de part en part : 18 km, environ huit heures de marche et
      1590 m de dénivelé positif, sur une étape jugée difficile. Elle remonte la vallée de Schauertal, longe
      le Zireiner See et s'achève à l'Erfurter Hütte, à 1831 m, près du téléphérique. De là, on redescend à
      pied en une heure et demie ou en benne vers Maurach. Par fortes pluies, le franchissement du Schauertal
      et du Schafsteigsattel devient délicat ; une variante rallonge alors la marche de deux heures et demie.


      Pour une immersion plus longue, la Rofanrunde propose une boucle alpine exigeante en quatre étapes et
      une trentaine de kilomètres avec nuits en refuge. Pour débuter en douceur, le sentier pédagogique du
      Rofan part près du téléphérique : il compte sept stations, mesure un kilomètre et demi, grimpe de deux
      cents mètres et se parcourt en une heure et cinquante minutes. En été ses panneaux expliquent le respect
      de la faune ; en hiver il initie aux secours d'avalanche.
    history: >-
      Le sentier didactique témoigne de la gestion attentive de ce massif. Chaque station traite d'une bonne
      pratique : comportement face au bétail, protection de la faune et des fleurs, gestion des déchets et
      sécurité face aux éléments. Les recommandations locales invitent à ne jamais quitter les chemins dans
      les zones de tranquillité.
    before: >-
      Choisissez un itinéraire adapté à votre forme, vérifiez l'état des chemins et la météo, et équipez-vous
      sérieusement. Restez sur les sentiers balisés et emportez vos déchets. En cas de pluie, préférez la
      variante. La saison s'étend de mai à octobre.
    around: >-
      Le [parc naturel de Karwendel](/lugar/naturpark-karwendel/) n'est qu'à deux kilomètres : le Karwendel
      constitue la haute barrière rocheuse fermant l'horizon du Rofan vers l'ouest.
  de:
    intro: >-
      Im Süden sanfte Grasrücken, auf denen Pferde, Schafe und Rinder weiden; im Norden jäh abfallende
      Felsabstürze. Das Rofangebirge, der Westteil der Brandenberger Alpen, besitzt zwei Gesichter und lässt
      sich von einer Seite zur anderen durchqueren. Es ist ein Kalkmassiv im österreichischen Tirol zwischen
      Achensee, Inntal und bayerischen Voralpen; sein Hauptgipfel, der Hochiss, erreicht 2299 m. Es lockt mit
      Bergpfaden, Hütten und Hochseen.
    landscape: >-
      Die Brandenberger Alpen bilden eine Untergruppe der Nördlichen Kalkalpen; das eigentliche Rofan ist ihr
      Westteil zwischen der Brandenberger Ache und dem Achensee. Es umfasst einen zentralen Gebirgsstock und
      drei vorgelagerte Berge: den Guffert mit 2194 m, einen freistehenden Felsstock nördlich von Steinberg am
      Rofan; die Unnütze am Nordende des Sees und das Ebner Joch am Südende. Nach Osten setzt sich der Zug
      über den Pendlingkamm nach Kiefersfelden fort. Im Westen liegt das Karwendel, im Osten das
      Kaisergebirge.


      Zwischen Almhütten und Bergwiesen ruht der Zireiner See, ein Hochgebirgssee von rund vier Hektar auf
      1799 m in der Gemeinde Münster. Man erreicht ihn von der Bayreuther Hütte in einer Stunde und
      fünfundvierzig Minuten, von der Erfurter Hütte an der Seilbahnbergstation in etwa drei Stunden und
      fünfzehn Minuten. Die Route führt durch lichte Wälder, vorbei an Bächen und über Bergmähder, während
      sich die Rofanspitze im Wasser spiegelt.
    wildlife: >-
      Das Rofan ist ein wichtiger Rückzugsraum für Wildtiere, die auf menschliche Störungen empfindlich
      reagieren. Ausgewiesene Wildruhezonen sind markiert, und Wanderer werden angehalten, auf den Wegen zu
      bleiben. Wer die Rofanrunde geht, begegnet auf schottrigem Terrain
      [Gämsen](/especie/rupicapra_rupicapra/) und erspäht mit etwas Glück ein
      [Alpenmurmeltier](/especie/marmota_marmota/). Auf den Almen weiden Pferde, Schafe und Weidevieh: Eine
      Station des Lehrpfads vermittelt zehn Grundregeln für den Umgang mit Weidetieren.


      Geschützte endemische Pflanzen zieren die Felsflanken; das Beschädigen, Ausgraben oder Pflücken von
      Alpenblumen ist verboten. Den Takt bestimmt der Schnee. Am Schafsteig unter der Rofanspitze gilt der
      Steig als schwarz und wird bei Nässe heikel; im Mai, Juni, September und Oktober ist die Ausweichroute
      meist schneefrei und meidet schwere Abschnitte. Das Bergwetter wechselt rasch.
    visit: >-
      Wer nur einen Tag hat, wählt den Adlerweg zwischen Steinberg am Rofan und der Erfurter Hütte als
      Durchquerung: 18 km, etwa acht Stunden Gehzeit und 1590 m Aufstieg, eingestuft als schwere Bergtour. Er
      zieht durch das Schauertal, vorbei am Zireiner See, hinauf zur Erfurter Hütte auf 1831 m neben der
      Bergstation. Von dort gelangt man zu Fuß in anderthalb Stunden oder per Seilbahn nach Maurach. Bei
      Starkregen ist die Passage durch das Schauertal heikel; eine Umgehungsvariante dauert zweieinhalb
      Stunden länger.


      Für mehrtägige Touren bietet sich die Rofanrunde an, eine anspruchsvolle Vier-Etappen-Wanderung über
      rund dreißig Kilometer mit Hüttenübernachtungen. Gemütlicher beginnt der Rofan-Lehrpfad: Er startet nahe
      der Bergstation, umfasst sieben Stationen, ist anderthalb Kilometer lang, überwindet zweihundert
      Höhenmeter und dauert eine Stunde und fünfzig Minuten. Im Sommer erläutern Tafeln den Naturschutz, im
      Winter Lawinenwissen.
    history: >-
      Der Lehrpfad veranschaulicht den sorgsamen Schutz des Gebirges. Jede Station behandelt ein Thema: das
      Verhalten gegenüber Weidetieren, den Schutz von Tieren und Pflanzen, Müllvermeidung und alpine
      Sicherheit. Vor Ort gilt das Gebot, in Ruhezonen strikt auf den Wegen zu bleiben.
    before: >-
      Wähle Touren nach deinem Können, prüfe Wegzustand und Wetter und nimm passende Ausrüstung mit. Bleibe
      auf markierten Wegen, schone die Bergflora und nimm Abfälle mit. Bei Regen ist die Alternativroute
      ratsam. Die Saison dauert von Mai bis Oktober.
    around: >-
      Der [Naturpark Karwendel](/lugar/naturpark-karwendel/) liegt nur zwei Kilometer entfernt: Das Karwendel
      ist die markante Gebirgskette, die das Rofan nach Westen hin begrenzt.
  it:
    intro: >-
      A sud, morbidi crinali prativi dove pascolano cavalli, pecore e mucche; a nord, muraglie calcaree a
      strapiombo. Il Rofan, porzione occidentale delle Alpi di Brandenberg, possiede due volti e si percorre
      da un versante all'altro. È un massiccio calcareo del Tirolo austriaco compreso tra il lago Achensee, la
      valle dell'Inn e le Prealpi Bavaresi, culminante con i 2299 m dell'Hochiss. Offre splendidi sentieri,
      rifugi e laghetti alpini.
    landscape: >-
      Le Alpi di Brandenberg compongono un sottogruppo delle Alpi Calcaree Settentrionali, e il Rofan vero e
      proprio ne forma il settore occidentale tra il fiume Brandenberger Ache e l'Achensee. Comprende un
      nucleo centrale di vette e tre cime distinte: il Guffert, di 2194 m, massiccio isolato a nord di
      Steinberg am Rofan; l'Unnütze all'estremità settentrionale del lago e l'Ebner Joch all'estremità
      meridionale. Verso est la catena prosegue lungo la cresta del Pendling verso Kiefersfelden. A ovest si
      eleva il Karwendel; a est il Kaisergebirge.


      Tra baite e pascoli si annida lo Zireiner See, lago d'alta quota di quattro ettari a 1799 m nel
      territorio di Münster. Si raggiunge dalla Bayreuther Hütte in un'ora e tre quarti, e dalla Erfurter
      Hütte accanto alla stazione superiore della funivia in tre ore e un quarto. L'itinerario attraversa
      boschi radi, torrenti e ampie praterie alpine, con la Rofanspitze che si specchia nell'acqua.
    wildlife: >-
      Il Rofan costituisce un rifugio primario per la fauna alpina, particolarmente vulnerabile al disturbo
      antropico. Apposite zone di quiete sono segnalate, con l'invito a non deviare dai tracciati. Camminando
      lungo la Rofanrunde si possono avvistare [camosci](/especie/rupicapra_rupicapra/) sui ghiaioni e
      scorgere una [marmotta](/especie/marmota_marmota/). Negli alpeggi pascolano cavalli, pecore e bovini:
      una delle stazioni del sentiero didattico riassume dieci regole d'oro per transitare vicino agli animali
      al pascolo.


      Sulle pareti fioriscono piante endemiche protette, ed è severamente vietato raccogliere o danneggiare i
      fiori alpini. Il calendario è dettato dalla neve. Sullo Schafsteig, sotto la Rofanspitze, il percorso è
      classificato sentiero per esperti (nero) e diviene scivoloso con l'umidità; a maggio, giugno, settembre
      e ottobre la variante di tappa è solitamente sgombra da neve ed evita i tratti più impegnativi. Il meteo
      varia con rapidità.
    visit: >-
      Avendo a disposizione un solo giorno, l'Eagle Walk tra Steinberg am Rofan e la Erfurter Hütte consente
      di attraversare il gruppo da versante a versante: 18 km, circa otto ore di cammino e 1590 m di
      dislivello positivo, con la tappa classificata come impegnativa. Risale la valle Schauertal, costeggia
      lo Zireiner See e si conclude alla Erfurter Hütte a 1831 m, accanto alla funivia. Da qui si scende a
      Maurach a piedi in un'ora e mezza o in cabinovia. Con piogge intense il passaggio dello Schauertal e
      dello Schafsteigsattel diviene difficoltoso, richiedendo una variante di due ore e mezza in più.


      Per più tappe la Rofanrunde offre un trekking ad anello di quattro giorni su circa trenta chilometri con
      pernottamenti in rifugio. Per iniziare con calma, il sentiero didattico del Rofan parte vicino alla
      funivia: conta sette stazioni, misura un chilometro e mezzo, supera duecento metri di dislivello e si
      compie in un'ora e cinquanta minuti, illustrando flora, fauna e sicurezza.
    history: >-
      Il sentiero didattico è la migliore dimostrazione di come venga custodito questo massiccio. Ogni
      stazione illustra una regola: come comportarsi col bestiame, come tutelare animali e fiori, come gestire
      i rifiuti e muoversi in sicurezza. L'indicazione fondamentale è restare sempre sui sentieri battuti.
    before: >-
      Scegli percorsi proporzionati alla tua esperienza, informati sullo stato dei sentieri e sul meteo e
      indossa abbigliamento idoneo. Resta sui percorsi segnati e riporta a valle i rifiuti. Con maltempo
      scegli la variante. La stagione va da maggio a ottobre.
    around: >-
      Il [Parco Naturale del Karwendel](/lugar/naturpark-karwendel/) si trova a soli due chilometri di
      distanza: il Karwendel è la grandiosa catena montuosa che chiude l'orizzonte del Rofan verso ovest.
  pt:
    intro: >-
      A sul, lombas relvadas onde pastam cavalos, ovelhas e vacas; a norte, muralhas de calcário aprumadas na
      vertical. O Rofan, setor ocidental dos Alpes de Brandenberg, apresenta duas faces distintas e permite
      cruzar de uma vertente à outra. É um maciço calcário do Tirol austríaco entre o lago Achensee, o vale do
      Inn e os Pré-Alpes bávaros, cujo pico culminante, o Hochiss, chega a 2299 m. Distingue-se por veredas de
      montanha, cabanas alpinas e lagoas de altitude.
    landscape: >-
      Os Alpes de Brandenberg constituem um subgrupo dos Alpes Calcários Setentrionais, formando o Rofan o seu
      setor ocidental entre o rio Brandenberger Ache e o Achensee. Possui um núcleo central de cumes e três
      elevações destacadas: o Guffert, com 2194 m, maciço autónomo a norte de Steinberg am Rofan; o Unnütze,
      no extremo norte do lago; e o Ebner Joch, no extremo sul. Para leste, a cordilheira prolonga-se pela
      crista do Pendling até Kiefersfelden. A oeste fica o Karwendel; a leste, o Kaisergebirge.


      Entre cabanas e pastos surge o Zireiner See, lago alpino com cerca de quatro hectares a 1799 m, no
      concelho de Münster. Atinge-se a partir da Bayreuther Hütte em uma hora e três quartos, e desde a
      Erfurter Hütte, junto ao teleférico, em cerca de três horas e um quarto. O itinerário percorre bosques
      abertos, ribeiros e prados alpinos, espelhando a Rofanspitze nas suas águas límpidas.
    wildlife: >-
      O Rofan constitui um habitat relevante para a fauna alpina, particularmente vulnerável ao impacto das
      atividades humanas. Existem refúgios de fauna assinalados no terreno, solicitando-se que não se saia dos
      trilhos marcados. Ao caminhar pela Rofanrunde é comum observar [camurças](/especie/rupicapra_rupicapra/)
      em zonas de cascalheira e, com sorte, avistar uma [marmota](/especie/marmota_marmota/). Nos pastos de
      montanha apascentam-se cavalos, ovinos e gado vacum: uma das paragens do trilho didático resume dez
      regras básicas de segurança perante o gado.


      Existem espécies florísticas endémicas protegidas, sendo proibido colher ou danificar a vegetação
      selvagem. O calendário anual é determinado pelo manto de neve. No Schafsteig, sob a Rofanspitze, o
      caminho é classificado como troço negro e torna-se escorregadio com humidade; em maio, junho, setembro e
      outubro a variante da mesma etapa costuma estar sem neve e não apresenta passagens negras. O tempo na
      montanha muda depressa.
    visit: >-
      Dispondo apenas de um dia, o Trilho da Águia (Eagle Walk) entre Steinberg am Rofan e a Erfurter Hütte
      permite cruzar a serra de um lado ao outro: 18 km, cerca de oito horas de marcha e 1590 m de desnível
      positivo, classificado como etapa difícil. Sobe pelo vale de Schauertal, ladeia o Zireiner See e termina
      na Erfurter Hütte a 1831 m, junto ao teleférico. Daí desce-se a pé em hora e meia ou de cabina até
      Maurach. Com chuva forte, o Schauertal e o Schafsteigsattel ficam perigosos, havendo uma rota
      alternativa que demora cerca de duas horas e meia adicionais.


      Para percursos mais longos, a Rofanrunde oferece uma travessia alpina em quatro etapas e cerca de trinta
      quilómetros com dormidas em refúgios. Para passeios tranquilos, o trilho pedagógico do Rofan parte da
      estação do teleférico: tem sete estações, um quilómetro e meio de extensão, sobe duzentos metros e
      cumpre-se em uma hora e cinquenta minutos, apresentando painéis sobre conservação e segurança na neve.
    history: >-
      O percurso interpretativo espelha a dedicação na preservação deste maciço. Cada paragem aborda uma
      recomendação: aproximação ao gado, respeito pela fauna e flora bravia, gestão do lixo e normas de
      segurança em montanha. A orientação geral é manter-se nos trilhos balizados dentro das reservas de
      fauna.
    before: >-
      Escolhe itinerários adequados à tua capacidade física, verifica o estado do piso e a meteorologia e leva
      equipamento de montanha. Permanece nos caminhos marcados e não apanhes plantas. Com chuva opta pela
      variante. A época de visitas vai de maio a outubro.
    around: >-
      O [Parque Natural de Karwendel](/lugar/naturpark-karwendel/) fica a apenas dois quilómetros: o Karwendel
      é a cordilheira alpina que confina com o Rofan pelo lado ocidental.
