observaciones:
  es: >-
    Los senderos clasificados se gestionan con control de la capacidad de carga y reparto de visitantes a lo
    largo del día: cada día se divide en franjas horarias de entrada y se reserva la franja en la que se
    quiere empezar, únicamente en línea, a través del Portal SIMplifica. La guía de buenas prácticas fija
    orientaciones para los visitantes del Macizo Montañoso Oriental, con el fin de evitar el impacto directo
    sobre la freira-da-madeira y su hábitat de nidificación. La afluencia es alta en la ruta entre Pico do
    Areeiro y Pico Ruivo, y puedes dedicar un día.
texto:
  es:
    intro: >-
      Cuando cae la noche entre finales de marzo y mediados de octubre, el macizo central de Madeira se llena
      de un sonido que casi nadie ve: la freira-da-madeira vuelve del mar a sus nidos, a más de 1.600 metros,
      y se la oye al caer la noche. Es una de las aves marinas más amenazadas del mundo y solo cría en esta
      isla. Su casa es un macizo que recorre Madeira de punta a punta, divide la isla en dos vertientes, sur y
      norte, muy distintas y de fuerte pendiente, y ocupa unas 8200 hectáreas por encima de los 1400 metros.
      Aquí están el Pico Ruivo, de 1862 metros, techo de la isla, y el Pico do Areeiro, de 1818.
    landscape: >-
      El macizo se divide en una parte oriental y otra occidental. En la oriental están los picos más altos,
      el Pico Ruivo y el Pico do Areeiro. En la occidental, en el Paúl da Serra, los puntos más altos son el
      Pico Ruivo do Paúl, de 1640 metros, y la zona de Bica da Cana, de 1620. El altiplano de Paúl da Serra es
      el lugar más importante de recarga de los acuíferos de Madeira.


      Ese relieve tan quebrado es sobre todo obra del agua, que erosiona de forma desigual las rocas
      piroclásticas y abre valles profundos y precipicios. En invierno, a diferencia de las zonas bajas, la
      nieve cubre el macizo con largos mantos blancos.


      En la cumbre del Pico Ruivo dominan dos coberturas: los brezales y una vegetación rala de plantas
      herbáceas y subarbustivas. Los brezos blancos tienen troncos retorcidos y copas asimétricas, desviadas
      en dirección opuesta a los vientos dominantes. La roca es un elemento importante del paisaje, y gran
      parte de la flora, con helechos, musgos y líquenes, vive sobre las rocas o en sus fisuras. En el tramo
      alto del macizo crece además la Erica scoparia centenaria, antes aprovechada para producir carbón
      vegetal.
    wildlife: >-
      La flora vascular de altura, por encima de los 1300 metros, incluye unas 54 especies endémicas, algunas
      exclusivas de las cumbres, como Estreleira, Urze-rasteira, Hissopo, Arméria-da-Madeira y
      Violeta-da-Madeira. Los briófitos cubren gran superficie y ayudan a colonizar el suelo, a estabilizarlo
      y a mantener la dinámica de los ecosistemas.


      La estrella es la [freira-da-madeira](/especie/pterodroma_madeira/), el petrel de Madeira. Vive en el
      mar y solo viene a tierra en la época de cría, de finales de marzo a mediados de octubre. Anida en
      plataformas por encima de los 1.600 metros entre el Pico do Areeiro y el Pico Ruivo. Está catalogada
      como «en peligro», y el programa de conservación vigila su población y evalúa las medidas de gestión.


      En los puntos más altos también se ven el mirlo, el pinzón de Madeira y el [reyezuelo de
      Madeira](/especie/regulus_madeirensis/), que usan el brezal como hábitat alternativo, y viven el
      pardillo común y la perdiz roja. Entre los invertebrados terrestres, los artrópodos son el grupo con
      mayor riqueza de especies. Los meses recomendados para recorrerlo van de mayo a octubre.
    visit: >-
      La puerta de entrada es el Pico do Areeiro, al que se llega en coche. Allí, el Centro freira-da-madeira
      – Dr. Rui Silva es un polo de información, interpretación y recepción de visitantes. Se creó en 2012 y
      ofrece una exposición permanente, dinámica e interactiva sobre la freira-da-madeira y su hábitat.
      Avisando con antelación, la visita puede hacerse acompañado por un técnico que explica sobre el terreno
      el trabajo de conservación.


      De aquí parten las rutas. La Vereda do Areeiro, hasta el Pico Ruivo, enlaza los dos picos más altos con
      variantes de 7,4 y 8,7 kilómetros; es una ruta de túneles volcánicos y escaleras empinadas que lleva
      unas tres horas y media. La Vereda do Pico Ruivo, más corta y fácil, sale de Achada do Teixeira y
      recorre 2,8 kilómetros hasta la cumbre. Y la Vereda da Ilha baja 8,2 kilómetros desde el refugio del
      Pico Ruivo hasta el pueblo de Ilha, con un desnivel de 1376 metros, y se hace en unas tres horas; cruza
      el macizo y la laurisilva, ambos de la Red Natura 2000. Con buena visibilidad, desde la cumbre se ven
      Porto Santo y las islas Desertas. Al Pico Ruivo solo se llega a pie, desde el Pico do Areeiro o por un
      camino más corto y fácil desde Achada do Teixeira.
    history: >-
      Desde los comienzos de la colonización, el pastoreo excesivo y desordenado degradó la cubierta vegetal
      del macizo; hasta hace unos años, las laderas del Pico Ruivo se usaban para criar cabras, ovejas y
      vacas. En 2003 se completó la retirada del ganado y la vegetación entró en un proceso de recuperación ya
      visible.


      El macizo es un monumento natural dentro de la red de monumentos naturales de Madeira y está clasificado
      como zona de protección especial para las aves y como zona especial de conservación de la Red Natura
      2000. Dentro del Parque Natural de Madeira se denomina Reserva Geológica y de Vegetación de Altitud.
      Ratas, ratones y gatos introducidos son depredadores cuyo control es clave para la supervivencia de las
      especies autóctonas, como la freira-da-madeira, y se aprobaron medidas complementarias de conservación
      de su área de nidificación.
    before: >-
      Los senderos clasificados se gestionan con control de la capacidad de carga y reparto de visitantes a lo
      largo del día: cada día se divide en franjas horarias de entrada y se reserva la franja en la que se
      quiere empezar, únicamente en línea, a través del Portal SIMplifica. La guía de buenas prácticas fija
      orientaciones para los visitantes del Macizo Montañoso Oriental, con el fin de evitar el impacto directo
      sobre la freira-da-madeira y su hábitat de nidificación. La afluencia es alta en la ruta entre Pico do
      Areeiro y Pico Ruivo, y puedes dedicar un día.
    around: >-
      A seis kilómetros queda la [Reserva Natural Marina de Rocha do
      Navio](/lugar/reserva-natural-da-rocha-do-navio/), y a ocho la [Reserva Natural de la Península de Ponta
      de São Lourenço](/lugar/reserva-natural-da-ponta-de-sao-lourenco/).
  en:
    intro: >-
      When night falls between late March and mid-October, the central massif of Madeira resonates with a
      sound that almost no one sees: Zino's petrel returns from the open sea to its breeding burrows at over
      1,600 metres, calling through the darkness. It is one of the world's most endangered seabirds and breeds
      exclusively on this island. Its mountain sanctuary spans across Madeira from east to west, dividing the
      island into sharply contrasting north and south slopes of precipitous relief, embracing roughly 8,200
      hectares above 1,400 metres altitude. Here rise Pico Ruivo at 1,862 metres, the rooftop of the island,
      and Pico do Areeiro at 1,818.
    landscape: >-
      The massif is split into an eastern and a western sector. The eastern sector holds the highest summits,
      Pico Ruivo and Pico do Areeiro. In the western part, across the Paúl da Serra plateau, the highest
      points are Pico Ruivo do Paúl at 1,640 metres and the Bica da Cana area at 1,620. The high Paúl da Serra
      plateau is Madeira's primary recharge reservoir for island aquifers.


      This dramatically fractured topography is largely sculpted by water, eroding pyroclastic rocks unevenly
      into deep ravines and sheer abysses. In winter, unlike the subtropical lowlands, snow regularly blankets
      the high peaks in striking white mantles.


      Around the summit of Pico Ruivo, two plant formations dominate: high-altitude heather heathlands and
      sparse communities of prostrate herbs and subshrubs. Tree heathers develop twisted trunks and
      wind-sheared, asymmetrical crowns blown opposite to the prevailing winds. Bare crags form a dominant
      element of the landscape, where endemic ferns, mosses and lichens colonise fissures and rocky slabs. In
      the upper zones of the massif, century-old *Erica scoparia* survives, historically exploited for
      charcoal.
    wildlife: >-
      The high-altitude vascular flora above 1,300 metres counts some 54 endemic species, several restricted
      exclusively to these summits, such as Madeira rock-jasmine (*Estreleira*), prostrate heather, mountain
      thyme, Madeira thrift and Madeira violet. Mosses and liverworts cover large rocky expanses, stabilising
      slopes and underpinning alpine ecosystem dynamics.


      The iconic species is [Zino's petrel](/especie/pterodroma_madeira/), or *freira-da-madeira*. It spends
      its life at sea, coming ashore only during breeding season from late March to mid-October. It nests in
      soil crevices on ledges above 1,600 metres between Pico do Areeiro and Pico Ruivo. Classified as
      endangered, conservation projects monitor its colonies and apply predator-control measures.


      Around the high peaks you can also spot Eurasian blackbirds, Madeira chaffinches and the endemic
      [Madeira firecrest](/especie/regulus_madeirensis/), which utilise high heathlands as complementary
      habitat, alongside common linnet and red-legged partridge. Among terrestrial invertebrates, arthropods
      show exceptional endemism. The most favourable months for visiting are from May to October.
    visit: >-
      The primary trail gateway is Pico do Areeiro, accessible directly by paved road. There, the Centro
      freira-da-madeira – Dr. Rui Silva serves as an interpretive and visitor centre. Created in 2012, it
      offers an interactive permanent exhibition detailing petrel biology and habitat conservation. Guided
      visits with reserve wardens can be arranged with advance booking.


      Major trails branch out from here. The Vereda do Areeiro to Pico Ruivo connects both major summits with
      trail variants of 7.4 and 8.7 kilometres; it is an alpine trail of hand-hewn volcanic tunnels and
      dizzying stone staircases taking roughly three hours and a half. The Vereda do Pico Ruivo, shorter and
      gentler, starts from Achada do Teixeira and covers 2.8 kilometres to the summit hut. The Vereda da Ilha
      descends 8.2 kilometres from the Pico Ruivo shelter down to Ilha village through a vertical drop of
      1,376 metres, requiring about three hours through high massif scrub and primary laurisilva, both
      protected within Natura 2000. In clear weather, the summit affords panoramic views toward Porto Santo
      and the Desertas Islands. Pico Ruivo can only be reached on foot, either from Pico do Areeiro or via the
      gentler trail from Achada do Teixeira.
    history: >-
      Since the early days of Portuguese settlement, unmanaged grazing by goats, sheep and cattle severely
      degraded the fragile alpine soils of the massif. In 2003, complete livestock removal was concluded,
      initiating a notable botanical recovery visible across the slopes today.


      The massif is designated as a Natural Monument within Madeira's protected areas network, classified as a
      Special Protection Area and Special Area of Conservation under Natura 2000. Within the Madeira Natural
      Park it forms the High Altitude Geological and Vegetation Reserve. Invasive rats, mice and feral cats
      remain critical threats, and sustained predator control ensures survival of breeding petrels.
    before: >-
      Regulated hiking paths are managed with carrying-capacity quotas spread throughout the day: daily entry
      slots must be booked strictly online in advance via the SIMplifica portal. Follow official guidelines
      for the Eastern Mountain Massif to prevent disturbances in petrel nesting sectors. Crowd levels are high
      along the route between Pico do Areeiro and Pico Ruivo; plan on a full day.
    around: >-
      Six kilometres away lies the [Rocha do Navio Marine Nature
      Reserve](/lugar/reserva-natural-da-rocha-do-navio/), and eight kilometres distant is the [Ponta de São
      Lourenço Nature Reserve](/lugar/reserva-natural-da-ponta-de-sao-lourenco/).
  fr:
    intro: >-
      Quand la nuit tombe entre la fin mars et la mi-octobre, le massif central de Madère s'emplit d'un écho
      que nul ne peut voir : le pétrel de Madère regagne ses terriers à plus de 1 600 mètres d'altitude en
      poussant des cris nocturnes. C'est l'un des oiseaux marins les plus menacés de la planète et il ne se
      reproduit que sur cette île. Son domaine s'étend d'un bout à l'autre de Madère, scindant l'île en deux
      versants contrastés aux pentes vertigineuses sur environ 8 200 hectares au-delà de 1 400 mètres. C'est
      là que trônent le Pico Ruivo à 1 862 mètres, point culminant de l'île, et le Pico do Areeiro à 1 818.
    landscape: >-
      Le massif s'articule en un secteur oriental et un secteur occidental. À l'est s'élèvent les plus hauts
      sommets, le Pico Ruivo et le Pico do Areeiro. À l'ouest, sur le plateau de Paúl da Serra, les points
      culminants sont le Pico Ruivo do Paúl à 1 640 mètres et le secteur de Bica da Cana à 1 620. Ce haut
      plateau constitue le château d'eau fondamental rechargeant les aquifères de Madère.


      Ce relief tourmenté résulte de l'érosion torrentielle découpant les roches pyroclastiques en ravins
      vertigineux. En hiver, à la différence du littoral, la neige drape régulièrement les sommets d'épais
      manteaux blancs.


      Au sommet du Pico Ruivo dominent deux formations végétales : les landes de bruyères d'altitude et des
      tapis clairsemés d'herbacées rases. Les bruyères arborescentes arborent des troncs torsadés et des
      ramures penchées dans le sens opposé aux vents dominants. La roche nue domine le paysage, tapissée de
      fougères, mousses et lichens abrités dans les anfractuosités. Sur les crêtes pousse également une brande
      centenaire, autrefois coupée pour le charbon de bois.
    wildlife: >-
      La flore vasculaire d'altitude au-dessus de 1 300 mètres compte environ 54 espèces endémiques, dont
      certaines exclusives aux sommets, comme l'armoise rampante, le thym de Madère et la pensée de Madère.
      Les tapis de bryophytes stabilisent les éboulis et régulent l'humidité montagnarde.


      Le trésor des lieux est le [pétrel de Madère](/especie/pterodroma_madeira/) (*freira-da-madeira*). Cet
      oiseau marin ne gagne la terre ferme que pour nicher, de fin mars à mi-octobre. Il s'installe dans des
      terriers perchés au-dessus de 1 600 mètres entre le Pico do Areeiro et le Pico Ruivo. Classée « en
      danger », l'espèce fait l'objet d'un suivi scientifique régulier et de mesures de dératisation.


      Aux abords des crêtes se croisent le merle noir, le pinson de Madère et le [roitelet de
      Madère](/especie/regulus_madeirensis/), réfugiés dans les bruyères, ainsi que la linotte mélodieuse et
      la perdrix rouge. Les arthropodes présentent un taux d'endémisme exceptionnel. La meilleure période de
      visite s'étend de mai à octobre.
    visit: >-
      La voie d'accès privilégiée est le Pico do Areeiro, accessible en voiture. Sur place, le Centre
      freira-da-madeira – Dr. Rui Silva accueille les visiteurs. Aménagé en 2012, il propose une scénographie
      interactive sur la biologie du pétrel et les efforts de restauration de son habitat. Des sorties
      accompagnées par des techniciens de terrain sont possibles sur réservation.


      C'est le départ des sentiers. La Vereda do Areeiro relie les deux grands sommets avec des variantes de
      7,4 et 8,7 kilomètres ; c'est un sentier alpin taillé dans la roche volcanique, rythmé par des tunnels
      et escaliers suspendus, exigeant environ trois heures et demie de marche. La Vereda do Pico Ruivo, plus
      aisée, part d'Achada do Teixeira sur 2,8 kilomètres jusqu'au refuge sommital. La Vereda da Ilha dévale
      8,2 kilomètres depuis le refuge jusqu'au village d'Ilha avec un dénivelé négatif de 1 376 mètres en
      environ trois heures, traversant landes et laurisilve protégées au sein de Natura 2000. Par temps clair,
      la vue embrasse Porto Santo et les îles Desertas. L'accès au Pico Ruivo se fait uniquement à pied, soit
      depuis le Pico do Areeiro, soit depuis Achada do Teixeira.
    history: >-
      Dès les premiers siècles de colonisation, le pâturage incontrôlé des chèvres et bovins a laminé la
      couverture végétale des crêtes. En 2003, l'évacuation du bétail s'est achevée, enclenchant une
      régénération remarquable de la flore de montagne.


      Le massif est classé monument naturel au sein du réseau d'aires protégées de Madère, ainsi que zone de
      protection spéciale et zone spéciale de conservation Natura 2000. Au sein du parc naturel de Madère, il
      porte le statut de réserve géologique et de végétation d'altitude. Le piégeage des rats et chats errants
      demeure indispensable pour préserver la nidification du pétrel.
    before: >-
      L'accès aux sentiers classés est soumis à des jauges horaires obligatoires : vous devez impérativement
      réserver votre créneau horaire en ligne via le portail SIMplifica. Respectez scrupuleusement les
      consignes pour éviter de perturber la freira-da-madeira. La fréquentation est très forte entre le Pico
      do Areeiro et le Pico Ruivo ; prévoyez une journée entière.
    around: >-
      À six kilomètres se trouve la [réserve naturelle marine de Rocha do
      Navio](/lugar/reserva-natural-da-rocha-do-navio/), et à huit kilomètres la [réserve naturelle de Ponta
      de São Lourenço](/lugar/reserva-natural-da-ponta-de-sao-lourenco/).
  de:
    intro: >-
      Wenn zwischen Ende März und Mitte Oktober die Dunkelheit hereinbricht, erfüllt ein geheimnisvoller Laut
      das zentrale Bergmassiv Madeiras: Der Madeira-Sturmvogel kehrt vom offenen Ozean zu seinen Bruthöhlen
      auf über 1.600 Metern Höhe zurück und ruft durch die Nacht. Er zählt zu den seltensten Seevögeln unseres
      Planeten und brütet ausschließlich auf dieser Insel. Sein Refugium durchzieht Madeira von Ost nach West,
      trennt Nord- und Südflanke mit jähen Steilwänden und umfasst rund 8.200 Hektar oberhalb von 1.400
      Metern. Hier thronen der Pico Ruivo mit 1.862 Metern, höchster Punkt der Insel, und der Pico do Areeiro
      mit 1.818.
    landscape: >-
      Das Massiv gliedert sich in einen Ost- und einen Westflügel. Im Osten erheben sich die höchsten Gipfel,
      Pico Ruivo und Pico do Areeiro. Im Westteil auf der Hochebene Paúl da Serra erreichen der Pico Ruivo do
      Paúl 1.640 Meter und das Gebiet Bica da Cana 1.620. Das Hochplateau bildet den wichtigsten
      Wasserspeicher für die Grundwasserleiter Madeiras.


      Das zersägte Relief ist das Werk des Wassers, das pyroklastische Gesteinsschichten ungleichmäßig
      erodiert und schwindelerregende Schluchten aufreißt. Im Winter bedeckt Schnee die Gipfelzüge mitunter
      wochenlang mit weißen Decken.


      Am Gipfel des Pico Ruivo herrschen zwei Pflanzengesellschaften vor: Hochheiden und karge
      Polstervegetation. Die Baumheide bildet verkrüppelte Stämme und asymmetrische Kronen aus, die vom steten
      Passatwind geformt werden. Nackter Fels prägt das Landschaftsbild, wo endemische Farne, Moose und
      Flechten schmale Klüfte besiedeln. In den Kammlagen überdauert zudem die jahrhundertealte Besenheide,
      die einst zur Holzkohlegewinnung diente.
    wildlife: >-
      Die Gefäßpflanzenflora oberhalb von 1.300 Metern zählt rund 54 endemische Arten, darunter botanische
      Kostbarkeiten, die ausschließlich auf diesen Kämmen vorkommen. Moose überziehen weite Felsplatten und
      regulieren das Wasserregime des Gebirges.


      Der Star der Hochlagen ist der [Madeira-Sturmvogel](/especie/pterodroma_madeira/), die
      *freira-da-madeira*. Er lebt pelagisch auf dem Meer und sucht nur zur Brutzeit von Ende März bis Mitte
      Oktober das Land auf. Seine Bruthöhlen liegen in Felsbändern oberhalb von 1.600 Metern zwischen Pico do
      Areeiro und Pico Ruivo. Als stark gefährdet eingestuft, steht die Kolonie unter strenger
      wissenschaftlicher Überwachung.


      Auf den Kämmen begegnen dir auch Amsel, Madeira-Buchfink und das
      [Madeiragoldhähnchen](/especie/regulus_madeirensis/), die das Heidegebüsch als Lebensraum nutzen, dazu
      Bluthänfling und Rothuhn. Die Gliederfüßer weisen einen bemerkenswerten Endemismus auf. Als beste
      Besuchszeit gelten die Monate Mai bis Oktober.
    visit: >-
      Bequemer Ausgangspunkt ist der Pico do Areeiro, der über eine Straße erreichbar ist. Dort informiert das
      Besucherzentrum Centro freira-da-madeira – Dr. Rui Silva. Das 2012 eröffnete Zentrum bietet eine
      interaktive Ausstellung über Lebensweise und Schutz des Sturmvogels. Nach Voranmeldung sind geführte
      Touren mit Rangern möglich.


      Hier beginnen die Pfade. Die Vereda do Areeiro verbindet die beiden Hauptgipfel mit Varianten von 7,4
      und 8,7 Kilometern; sie führt über Felstreppen und durch Vulkantunnel und erfordert rund eineinhalb bis
      drei Stunden und eine halbe Gehzeit. Die leichtere Vereda do Pico Ruivo startet an der Achada do
      Teixeira und erreicht den Gipfel nach 2,8 Kilometern. Die Vereda da Ilha führt über 8,2 Kilometer vom
      Schutzhaus des Pico Ruivo hinab ins Dorf Ilha mit einem Abstieg von 1.376 Höhenmetern in rund drei
      Stunden durch geschützte Zonen des Natura 2000-Netzwerks. Bei klarer Sicht reicht der Blick bis Porto
      Santo und zu den Desertas-Inseln. Den Pico Ruivo erreichst du ausschließlich zu Fuß, vom Pico do Areeiro
      oder auf dem kürzeren Weg ab Achada do Teixeira.
    history: >-
      Seit Beginn der Besiedlung zerstörte unkontrollierte Weidewirtschaft mit Ziegen und Rindern die
      Pflanzendecke des Massivs. Im Jahr 2003 wurde die vollständige Entfernung des Weideviehs abgeschlossen,
      was eine sichtbare Regeneration der Vegetation einleitete.


      Das Massiv ist als Naturdenkmal geschützt sowie als Europäisches Vogelschutzgebiet und FFH-Gebiet in
      Natura 2000 ausgewiesen. Im Naturpark Madeira bildet es ein geologisches und botanisches
      Hochlagenreservat. Die Kontrolle invasiver Ratten und verwilderter Katzen ist überlebenswichtig für den
      Bruterfolg des Sturmvogels.
    before: >-
      Für die klassifizierten Wanderwege gilt eine obligatorische Zeitfenster-Regelung zur Steuerung der
      Besucherströme: Buche deinen Einstiegsslot vorab online über das Portal SIMplifica. Halte dich an die
      Verhaltensregeln zum Schutz der Sturmvogelhabitate. Zwischen Pico do Areeiro und Pico Ruivo herrscht
      reger Andrang; plane einen vollen Tag ein.
    around: >-
      Sechs Kilometer entfernt liegt das [Meeresnaturschutzgebiet Rocha do
      Navio](/lugar/reserva-natural-da-rocha-do-navio/), und acht Kilometer trennen das Massiv vom
      [Naturschutzgebiet Ponta de São Lourenço](/lugar/reserva-natural-da-ponta-de-sao-lourenco/).
  it:
    intro: >-
      Quando cala la notte tra fine marzo e metà ottobre, il massiccio centrale di Madeira si riempie di un
      richiamo che quasi nessuno riesce a scorgere: il petrello di Madera fa ritorno dal mare ai suoi nidi a
      più di 1.600 metri di quota, facendosi udire nel buio. È uno dei volatili marini più minacciati del
      globo e si riproduce soltanto su quest'isola. La sua dimora montuosa attraversa Madeira da cima a fondo,
      spartendo l'isola in due versanti ripidi e contrastanti su circa 8.200 ettari oltre i 1.400 metri. Qui
      svettano il Pico Ruivo a 1.862 metri, tetto dell'isola, e il Pico do Areeiro a 1.818.
    landscape: >-
      Il massiccio si divide in due porzioni, orientale e occidentale. A oriente sorgono le cime più ardite,
      il Pico Ruivo e il Pico do Areeiro. A occidente, sull'altopiano di Paúl da Serra, i punti più alti sono
      il Pico Ruivo do Paúl a 1.640 metri e l'area di Bica da Cana a 1.620. L'altopiano è il principale
      serbatoio di ricarica degli acquiferi di Madeira.


      Questa tormentata morfologia è dovuta all'azione delle acque, che incidono i complessi piroclastici
      aprendo forre scoscese. In inverno, a differenza delle zone costiere, la neve riveste le vette con
      coltri bianche.


      Sulla cima del Pico Ruivo predominano brughiere d'alta quota e formazioni erbacee nane. Le eriche
      arboree presentano tronchi contorti e chiome piegate dai venti prevalenti. La roccia nuda è elemento
      dominante, colonizzata da felci, muschi e licheni nelle fessure riparate. Nelle creste più alte cresce
      inoltre un'erica scopa secolare, in passato usata per ricavare carbone vegetale.
    wildlife: >-
      La flora vascolare sopra i 1.300 metri comprende circa 54 specie endemiche, alcune relegate alle vette
      come la viola di Madera e l'armeria di Madera. I muschi formano ampi cuscinetti che stabilizzano le
      pendici rocciose.


      Il protagonista indiscusso è il [petrello di Madera](/especie/pterodroma_madeira/)
      (*freira-da-madeira*). Vive in mare aperto e torna sulla terraferma solo per la riproduzione da fine
      marzo a metà ottobre. Nidifica su terrazzini oltre i 1.600 metri tra il Pico do Areeiro e il Pico Ruivo.
      Considerato in pericolo, beneficia di un programma di conservazione e derattizzazione.


      Attorno ai crinali si osservano il merlo, il fringuello di Madeira e il [fiorrancino di
      Madera](/especie/regulus_madeirensis/), che sfruttano le brughiere, oltre a fanello e pernice rossa. Gli
      artropodi vantano un altissimo tasso di endemismo. I mesi consigliati per la visita vanno da maggio a
      ottobre.
    visit: >-
      Il punto di accesso principale è il Pico do Areeiro, raggiungibile comodamente in auto. Lì sorge il
      Centro freira-da-madeira – Dr. Rui Silva, polo di informazione e accoglienza. Creato nel 2012, ospita
      un'esposizione didattica sul petrello e sulla tutela del suo habitat. Previo accordo, la visita può
      svolgersi con operatori del parco.


      Da qui partono i tracciati escursionistici. La Vereda do Areeiro per il Pico Ruivo connette i due
      colossi con percorsi di 7,4 e 8,7 chilometri; è una via alpina tra tunnel scavati nella roccia e
      scalinate aeree che richiede circa tre ore e mezza. La Vereda do Pico Ruivo, più accessibile, parte da
      Achada do Teixeira e copre 2,8 chilometri fino al rifugio. La Vereda da Ilha scende per 8,2 chilometri
      dal rifugio al borgo di Ilha con 1.376 metri di dislivello in circa tre ore, toccando brughiere e
      laurisilva protette in Natura 2000. Dalla vetta lo sguardo spazia su Porto Santo e le isole Desertas. Al
      Pico Ruivo si accede esclusivamente a piedi, dal Pico do Areeiro o da Achada do Teixeira.
    history: >-
      Fin dagli albori della colonizzazione, il pascolo incontrollato di capre e bovini aveva impoverito la
      vegetazione montana. Nel 2003 si è completato il ritiro del bestiame, avviando una rinascita botanica
      ben visibile.


      Il massiccio è monumento naturale della rete protetta di Madeira e classificato zona di protezione
      speciale e zona speciale di conservazione in Natura 2000. Nel parco naturale di Madeira costituisce
      riserva geologica e floristica d'altitudine. Il contenimento di ratti e gatti inselvatichiti è
      essenziale per la sopravvivenza del petrello.
    before: >-
      I sentieri classificati sono gestiti con controllo della capacità di carico e scaglionamento dei
      visitatori nell'arco della giornata: ogni giorno è suddiviso in fasce orarie di accesso ed è necessario
      prenotare online la fascia oraria di partenza tramite il portale SIMplifica. La guida di buone pratiche
      stabilisce indicazioni per i visitatori del Massiccio Montuoso Orientale, allo scopo di evitare impatti
      diretti sul petrello di Madera e sul suo habitat di nidificazione. L'affluenza è elevata sull'itinerario
      tra il Pico do Areeiro e il Pico Ruivo, e puoi dedicare una giornata intera.
    around: >-
      A sei chilometri si trova la [Riserva Naturale Marina di Rocha do
      Navio](/lugar/reserva-natural-da-rocha-do-navio/), e a otto la [Riserva Naturale di Ponta de São
      Lourenço](/lugar/reserva-natural-da-ponta-de-sao-lourenco/).
  pt:
    intro: >-
      Quando a noite cai entre finais de março e meados de outubro, o maciço central da Madeira enche-se de um
      chamamento que quase ninguém vê: a freira-da-madeira regressa do mar aos seus ninhos a mais de 1.600
      metros de altitude, ecoando pela escuridão. É uma das aves marinhas mais ameaçadas do planeta e nidifica
      unicamente nesta ilha. O seu santuário percorre a Madeira de lés a lés, dividindo a ilha em duas
      vertentes, norte e sul, com declives vertiginosos ao longo de cerca de 8.200 hectares acima dos 1.400
      metros. Aqui erguem-se o Pico Ruivo, com 1.862 metros, ponto culminante da ilha, e o Pico do Areeiro,
      com 1.818.
    landscape: >-
      O maciço reparte-se num setor oriental e noutro ocidental. No oriental localizam-se os picos mais
      elevados, o Pico Ruivo e o Pico do Areeiro. No ocidental, no Paúl da Serra, os pontos mais altos são o
      Pico Ruivo do Paúl, com 1.640 metros, e a zona da Bica da Cana, com 1.620. O altiplano do Paúl da Serra
      é a principal área de recarga dos aquíferos da Madeira.


      Este relevo tão recortado resulta da erosão hídrica, que desgastou de modo desigual as rochas
      piroclásticas abrindo desfiladeiros fundos. No inverno, ao contrário das zonas costeiras, a neve cobre
      os cumes com alvas toalhas.


      No topo do Pico Ruivo sobressaem dois estratos: os urzais de altitude e uma vegetação rasteira de
      herbáceas e subarbustos. As urzes-molares exibem troncos retorcidos e copas moldadas pelos ventos
      dominantes. O afloramento rochoso é elemento central da paisagem, acolhendo fetos, musgos e líquenes nas
      fendas. Nas cotas superiores subsistem ainda exemplares centenários de urze-vassoura, outrora explorados
      para carvão vegetal.
    wildlife: >-
      A flora vascular de altitude acima dos 1.300 metros contabiliza cerca de 54 espécies endémicas, algumas
      restritas aos picos, como a estreleira, a urze-rasteira, o hissopo, a arméria-da-madeira e a
      violeta-da-madeira. Os briófitos forram as escarpas, fixando os solos e sustentando o ecossistema
      montano.


      A espécie emblemática é a [freira-da-madeira](/especie/pterodroma_madeira/). Vive no oceano e só demanda
      terra firme para reprodução, de finais de março a meados de outubro. Nidifica em plataformas acima dos
      1.600 metros entre o Pico do Areeiro e o Pico Ruivo. Classificada como em perigo, beneficia de um
      programa contínuo de vigilância e controlo de predadores.


      Nos pontos altos avistam-se o melro-preto, o tentilhão-da-madeira e o
      [bis-bis](/especie/regulus_madeirensis/), que tiram partido dos urzais, a par do pintarroxo e da
      perdiz-vermelha. Entre os invertebrados, os artrópodes apresentam elevadíssimo endemismo. O período
      ideal para a visita estende-se de maio a outubro.
    visit: >-
      O principal acesso rodoviário é o Pico do Areeiro, servido por estrada asfaltada. Aí, o Centro
      freira-da-madeira – Dr. Rui Silva acolhe os visitantes como polo de informação e receção. Criado em
      2012, oferece uma exposição interativa sobre a freira-da-madeira e o seu habitat. Mediante aviso prévio,
      a visita pode ser acompanhada por técnicos de conservação.


      Daqui partem os trilhos. A Vereda do Areeiro até ao Pico Ruivo liga os dois cumes com variantes de 7,4 e
      8,7 quilómetros; é uma rota de túneis escavados e escadarias suspensas que demora cerca de três horas e
      meia. A Vereda do Pico Ruivo, mais curta e acessível, parte da Achada do Teixeira e percorre 2,8
      quilómetros até ao cume. A Vereda da Ilha desce 8,2 quilómetros do refúgio do Pico Ruivo até à povoação
      da Ilha, vencendo um desnível de 1.376 metros em cerca de três horas através de urzais e laurissilva
      protegidos na Rede Natura 2000. Em dias limpos, a vista alcança o Porto Santo e as ilhas Desertas. O
      acesso ao Pico Ruivo é feito apenas a pé, pelo Areeiro ou pelo trilho mais suave da Achada do Teixeira.
    history: >-
      Desde os primórdios da ocupação, o pastoreio desordenado de cabras e vacas degradou a manta vegetal das
      cumeeiras. Em 2003 concluiu-se a retirada de todo o gado, desencadeando uma regeneração vegetal
      evidente.


      O maciço está classificado como monumento natural, zona de proteção especial e zona especial de
      conservação da Rede Natura 2000. No Parque Natural da Madeira integra a Reserva Geológica e de Vegetação
      de Altitude. O combate a ratos e gatos ferais é fulcral para viabilizar a nidificação da
      freira-da-madeira.
    before: >-
      Os percursos pedestres classificados estão sujeitos a contingentes diários de capacidade de carga: deves
      reservar obrigatoriamente a tua vaga online através do portal SIMplifica. Cumpre as normas para
      salvaguardar as áreas de nidificação da freira-da-madeira. A afluência é muito elevada entre o Pico do
      Areeiro e o Pico Ruivo; reserva um dia inteiro.
    around: >-
      A seis quilómetros localiza-se a [Reserva Natural da Rocha do
      Navio](/lugar/reserva-natural-da-rocha-do-navio/), e a oito fica a [Reserva Natural da Ponta de São
      Lourenço](/lugar/reserva-natural-da-ponta-de-sao-lourenco/).
