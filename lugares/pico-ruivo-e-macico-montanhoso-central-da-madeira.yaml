resumen:
  es: >-
    El techo de la isla de Madeira (Pico Ruivo 1.862 m y Pico do Arieiro 1.818 m) unidos por cresterías
    volcánicas suspendidas sobre mares de nubes.
  en: >-
    The rooftop of Madeira Island (Pico Ruivo 1,862 m and Pico do Arieiro 1,818 m) joined by dramatic volcanic
    ridges suspended above seas of clouds.
  fr: >-
    Le toit de l'île de Madère (Pico Ruivo 1 862 m et Pico do Arieiro 1 818 m) reliés par des crêtes
    volcaniques suspendues au-dessus d'une mer de nuages.
  de: >-
    Das Dach der Insel Madeira (Pico Ruivo 1.862 m und Pico do Arieiro 1.818 m), verbunden durch spektakuläre
    Vulkankämme über dem Wolkenmeer.
  it: >-
    Il tetto dell'isola di Madeira (Pico Ruivo 1.862 m e Pico do Arieiro 1.818 m) uniti da creste vulcaniche
    sospese sopra mari di nubi.
  pt: >-
    O teto da ilha da Madeira (Pico Ruivo 1.862 m e Pico do Arieiro 1.818 m) unidos por cristas vulcânicas
    suspensas sobre mares de nuvens.
