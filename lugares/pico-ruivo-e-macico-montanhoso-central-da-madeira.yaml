  fr: Le toit de Madère, où niche l'un des oiseaux marins les plus menacés au monde.
  de: Das Dach Madeiras, wo einer der am stärksten bedrohten Seevögel der Welt jede Nacht zur Brut zurückkehrt.
  it: Il tetto di Madeira, dove nidifica uno degli uccelli marini più minacciati al mondo.
