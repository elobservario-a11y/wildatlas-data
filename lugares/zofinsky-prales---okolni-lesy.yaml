texto:
  es:
    intro: >-
      En 1838 un conde hizo algo que casi nadie hacía: dejó de talar. El conde Buquoy, dueño del señorío de
      Nové Hrady, sacó esta ladera del aprovechamiento forestal y prohibió cortar árboles y recoger leña. Su
      ingeniero forestal Rowland se lo reprochó y predijo que el bosque, ya envejecido, se hundiría en
      cincuenta años por las tormentas y la nieve. Pasaron 170 años casi sin influencia humana y el bosque
      seguía en pie. Hoy Žofínský prales, junto con Hojná Voda, es la reserva más antigua de la Europa
      continental, a 15 km al suroeste de Nové Hrady, pegada a la frontera con Austria.
    landscape: >-
      El bosque se extiende entre 735 y 830 m, en una ladera nordeste del monte Stříbrný vrch, de 936 m. El
      subsuelo es granodiorita, que se descompone en un suelo franco-arenoso, profundo y bien drenado, y
      decenas de manantiales de filtración alimentan pequeños arroyos cuyos barrancos articulan el terreno.
      Casi toda la reserva es bosque: los claros y las aguas ocupan solo 2,59 ha.


      En ese bosque ocurrió un relevo lento. En el bosque de Buquoy dominaba el abeto blanco, con pícea y
      haya, y de forma aislada arce sicómoro y olmo de montaña. Tras crearse la reserva los abetos murieron
      poco a poco, la pícea tomó el relevo y después subió la haya, que hoy supera el 80 % de los árboles. Los
      tipos de bosque dominantes son hayedos de asperilla olorosa y de cebada de bosque; en suelos húmedos,
      hayedo de montaña, y en los manantiales, pícea con colas de caballo. Los árboles más viejos tienen entre
      300 y 400 años y miden de 40 a 50 m.


      Y hubo un árbol célebre: hasta 1975 creció aquí la Reina de los Abetos, de 425 años, 553 cm de perímetro
      y 51 m de altura, que cayó con un golpe de viento el 6 de enero de 1975.
    wildlife: >-
      Es un bosque para mirar de lejos. En el sotobosque crecen dentaria, asperilla olorosa y otras especies
      características, y una rareza regional es la cardamine de tres hojas. La reserva protege el musgo
      amenazado Dicranum viride y es clave para musgos raros (181 especies), hongos (600 especies), caracoles
      e insectos. Cada año crían de 35 a 40 especies de aves, y un inventario de 1997 contó 163 especies de
      escarabajos.


      Entre los mamíferos, el [jabalí](/especie/sus_scrofa/) entra en la reserva sin problema, y su efecto se
      valora como positivo porque al remover el suelo ayuda a la regeneración natural. El
      [ciervo](/especie/cervus_elaphus/) y el [corzo](/especie/capreolus_capreolus/) son otra historia: desde
      1849 hasta los años noventa el bosque formó parte de un coto cerrado y dañaron sobre todo a las píceas
      de hasta 150 años. Por eso desde 1991 una valla de 2 m rodea el 80 % de la reserva y los deja fuera.
    visit: >-
      Aquí hay que ser claro: el bosque no es accesible para el turismo corriente, y desde 1991 está prohibido
      entrar sin permiso. Para ver estos árboles de cientos de años solo queda el camino que pasa junto a la
      valla. La reserva forma parte del parque natural de Novohradské hory, con atractivos como Terčino údolí
      y Hojná Voda; esas montañas ocupan 162 km² en el lado checo. Alrededor de tres cuartas partes de la
      comarca son bosque de coníferas y caducifolios.
    history: >-
      La reserva original de 172,6 ha la redujo Rowland a 1,7 ha. Hasta 1882 se retiraron del núcleo madera
      muerta y troncos caídos, y en 1947–50 hubo una campaña contra el escarabajo de la corteza. En 1882 se
      dictó la prohibición absoluta de talar, y en 1933 el ministerio la declaró reserva estatal completa con
      97,72 ha. Desde mediados del siglo XVIII la mayor parte del territorio se desarrolla como bosque
      primario sin intervención humana.


      Por estar junto al Telón de Acero, la población alemana fue expulsada tras la Segunda Guerra Mundial y
      la zona siguió cerrada al turismo. En 2026 la reserva se amplió de 102 a 441 ha, y protege hayedos
      mixtos de montaña con abetos y fragmentos de píceas húmedas y turberas.
    before: >-
      No intentes entrar: el bosque está cerrado y vallado, y solo es posible con permiso. Lo que queda es el
      camino junto a la valla y el resto de las montañas de Novohradské.
    around: >-
      La reserva comparte territorio con las [Montañas de Novohradské - Macizo
      Forestal](/lugar/novohradske-hory---lesni-masiv/), el macizo forestal donde se encuentra.
  en:
    intro: >-
      In 1838 a count did something almost nobody did: he stopped logging. Count Buquoy, owner of the Nové
      Hrady estate, took this hillside out of forestry use and banned felling trees and gathering firewood.
      His forest engineer, Rowland, reproached him for it and predicted that the forest, already ageing, would
      collapse within fifty years under storms and snow. 170 years went by almost without human influence and
      the forest was still standing. Today Žofínský prales, together with Hojná Voda, is the oldest reserve in
      continental Europe, 15 km south-west of Nové Hrady, right on the border with Austria.
    landscape: >-
      The forest spreads between 735 and 830 m, on a north-east-facing slope of Stříbrný vrch, a 936 m
      mountain. The bedrock is granodiorite, which breaks down into a deep, well-drained sandy loam, and
      dozens of seepage springs feed small streams whose ravines shape the ground. Almost the whole reserve is
      forest: clearings and water cover just 2.59 ha.


      In that forest a slow changeover took place. In Buquoy's forest silver fir dominated, with spruce and
      beech, and here and there sycamore and wych elm. After the reserve was created the firs died off little
      by little, spruce took over and then beech rose, which today makes up more than 80 % of the trees. The
      dominant forest types are beech woods with sweet woodruff and with wood barley; on damp soils, montane
      beech forest, and around the springs, spruce with horsetails. The oldest trees are between 300 and 400
      years old and stand 40 to 50 m tall.


      And there was one famous tree: until 1975 the Queen of the Firs grew here, 425 years old, 553 cm in
      girth and 51 m tall, until a gust of wind brought it down on 6 January 1975.
    wildlife: >-
      This is a forest to look at from a distance. In the understorey grow toothwort, sweet woodruff and other
      characteristic species, and a regional rarity is the three-leaved bittercress. The reserve protects the
      threatened moss Dicranum viride and is key for rare mosses (181 species), fungi (600 species), snails
      and insects. Every year 35 to 40 bird species breed here, and a survey in 1997 counted 163 species of
      beetle.


      Among the mammals, the [wild boar](/especie/sus_scrofa/) gets into the reserve without any trouble, and
      its effect is considered positive, because turning over the soil helps natural regeneration. [Red
      deer](/especie/cervus_elaphus/) and [roe deer](/especie/capreolus_capreolus/) are another story: from
      1849 until the nineties the forest was part of a fenced hunting estate, and they damaged above all
      spruces up to 150 years old. That's why, since 1991, a 2 m fence has surrounded 80 % of the reserve and
      keeps them out.
    visit: >-
      Let's be clear: the forest isn't open to ordinary tourism, and since 1991 entering without a permit has
      been forbidden. To see these centuries-old trees, all that's left is the path that runs alongside the
      fence. The reserve is part of the Novohradské hory nature park, with attractions such as Terčino údolí
      and Hojná Voda; these mountains cover 162 km² on the Czech side. Around three quarters of the area is
      coniferous and broadleaf forest.
    history: >-
      Rowland cut the original reserve of 172.6 ha down to 1.7 ha. Until 1882 deadwood and fallen trunks were
      removed from the core, and in 1947–50 there was a campaign against bark beetles. In 1882 an absolute ban
      on felling was issued, and in 1933 the ministry declared it a full state reserve of 97.72 ha. Since the
      middle of the eighteenth century most of the area has developed as primary forest without human
      intervention.


      Because it lay right by the Iron Curtain, the German population was expelled after the Second World War
      and the area stayed closed to tourism. In 2026 the reserve was enlarged from 102 to 441 ha, and it
      protects mixed montane beech woods with fir and fragments of wet spruce forest and peat bogs.
    before: >-
      Don't try to go in: the forest is closed and fenced, and entry is only possible with a permit. What's
      left is the path beside the fence and the rest of the Novohradské mountains.
    around: >-
      The reserve shares territory with the [Novohradské Mountains - Forest
      Massif](/lugar/novohradske-hory---lesni-masiv/), the forest massif it lies in.
  fr:
    intro: >-
      En 1838, un comte fit quelque chose que presque personne ne faisait : il cessa d'abattre des arbres. Le
      comte Buquoy, propriétaire du domaine de Nové Hrady, retira ce versant de l'exploitation forestière et
      interdit de couper du bois comme d'en ramasser. Son ingénieur forestier Rowland le lui reprocha et
      prédit que la forêt, déjà vieillissante, s'effondrerait en cinquante ans sous les tempêtes et la neige.
      170 ans passèrent presque sans intervention humaine, et la forêt était toujours debout. Aujourd'hui,
      Žofínský prales est, avec Hojná Voda, la plus ancienne réserve d'Europe continentale, à 15 km au
      sud-ouest de Nové Hrady, tout près de la frontière autrichienne.
    landscape: >-
      La forêt s'étend entre 735 et 830 m d'altitude, sur un versant nord-est du mont Stříbrný vrch, haut de
      936 m. Le sous-sol est formé de granodiorite, qui se décompose en un sol sablo-limoneux profond et bien
      drainé, et des dizaines de sources d'infiltration alimentent de petits ruisseaux dont les ravins
      structurent le relief. Presque toute la réserve est boisée : les clairières et les eaux n'occupent que
      2,59 ha.


      Dans cette forêt s'est opérée une lente relève. Dans la forêt de Buquoy dominait le sapin pectiné,
      accompagné d'épicéa et de hêtre, ainsi que de quelques érables sycomores et ormes de montagne isolés.
      Après la création de la réserve, les sapins sont morts peu à peu, l'épicéa a pris le relais, puis le
      hêtre a progressé jusqu'à dépasser aujourd'hui 80 % des arbres. Les peuplements dominants sont des
      hêtraies à aspérule odorante et à orge des bois ; sur les sols humides pousse la hêtraie montagnarde et,
      autour des sources, l'épicéa à prêles. Les plus vieux arbres ont entre 300 et 400 ans et mesurent de 40
      à 50 m.


      Un arbre célèbre y a grandi : jusqu'en 1975 se dressait ici la Reine des Sapins, âgée de 425 ans, avec
      553 cm de circonférence et 51 m de hauteur, abattue par un coup de vent le 6 janvier 1975.
    wildlife: >-
      C'est une forêt à observer de loin. En sous-bois poussent la dentaire, l'aspérule odorante et d'autres
      espèces caractéristiques, ainsi qu'une rareté régionale, la cardamine à trois folioles. La réserve
      protège la mousse menacée Dicranum viride et joue un rôle majeur pour les mousses rares (181 espèces),
      les champignons (600 espèces), les escargots et les insectes. Chaque année, 35 à 40 espèces d'oiseaux y
      nichent, et un inventaire de 1997 a recensé 163 espèces de coléoptères.


      Parmi les mammifères, le [sanglier](/especie/sus_scrofa/) pénètre sans difficulté dans la réserve, et
      son action est jugée positive car le retournement du sol favorise la régénération naturelle. Le [cerf
      élaphe](/especie/cervus_elaphus/) et le [chevreuil](/especie/capreolus_capreolus/) posent un autre
      problème : de 1849 aux années quatre-vingt-dix, la forêt faisait partie d'un parc de chasse clos, et ils
      ont surtout endommagé les épicéas jusqu'à 150 ans. C'est pourquoi, depuis 1991, une clôture de 2 m
      entoure 80 % de la réserve pour les tenir à l'écart.
    visit: >-
      Soyons clairs : la forêt n'est pas ouverte au tourisme ordinaire et, depuis 1991, il est interdit d'y
      entrer sans autorisation. Pour voir ces arbres multiséculaires, il ne reste que le chemin qui longe la
      clôture. La réserve fait partie du parc naturel des Novohradské hory, qui compte aussi des sites comme
      Terčino údolí et Hojná Voda ; ces montagnes couvrent 162 km² côté tchèque. Environ les trois quarts de
      la région sont couverts de forêts de conifères et de feuillus.
    history: >-
      Rowland réduisit la réserve initiale de 172,6 ha à 1,7 ha. Jusqu'en 1882, on retira du cœur le bois mort
      et les troncs tombés, et en 1947–50 une campagne fut menée contre le scolyte. En 1882 fut décrétée
      l'interdiction absolue d'abattre, et en 1933 le ministère la déclara réserve d'État intégrale sur 97,72
      ha. Depuis le milieu du dix-huitième siècle, la majeure partie du site évolue en forêt primaire sans
      intervention humaine.


      Située juste contre le rideau de fer, la région vit sa population allemande expulsée après la Seconde
      Guerre mondiale et resta fermée au tourisme. En 2026, la réserve a été agrandie de 102 à 441 ha pour
      protéger des hêtraies mixtes de montagne à sapin ainsi que des fragments de pessières humides et de
      tourbières.
    before: >-
      N'essayez pas d'entrer : la forêt est fermée et clôturée, et l'accès n'est possible qu'avec une
      autorisation. Il vous reste le chemin le long de la clôture et le reste des monts Novohradské.
    around: >-
      La réserve partage son territoire avec les [Monts Novohradské - Massif
      forestier](/lugar/novohradske-hory---lesni-masiv/), le massif boisé où elle se trouve.
  de:
    intro: >-
      Im Jahr 1838 tat ein Graf etwas, was kaum jemand tat: Er stellte den Holzeinschlag ein. Graf Buquoy,
      Eigentümer der Herrschaft Nové Hrady, nahm diesen Hang aus der forstlichen Nutzung und verbot das Fällen
      von Bäumen ebenso wie das Sammeln von Brennholz. Sein Forstingenieur Rowland warf ihm das vor und sagte
      voraus, der bereits gealterte Wald werde binnen fünfzig Jahren durch Stürme und Schnee zusammenbrechen.
      170 Jahre vergingen fast ohne menschlichen Einfluss, und der Wald stand immer noch. Heute ist Žofínský
      prales zusammen mit Hojná Voda das älteste Reservat Kontinentaleuropas, 15 km südwestlich von Nové
      Hrady, direkt an der Grenze zu Österreich.
    landscape: >-
      Der Wald erstreckt sich zwischen 735 und 830 m Höhe an einem Nordosthang des 936 m hohen Berges Stříbrný
      vrch. Der Untergrund besteht aus Granodiorit, der zu einem tiefgründigen, gut durchlässigen sandigen
      Lehmboden verwittert, und Dutzende Sickerquellen speisen kleine Bäche, deren Schluchten das Gelände
      gliedern. Fast das gesamte Reservat ist Wald: Lichtungen und Gewässer nehmen nur 2,59 ha ein.


      In diesem Wald vollzog sich ein langsamer Wandel. In Buquoys Wald dominierte die Weißtanne mit Fichte
      und Buche sowie vereinzelt Bergahorn und Bergulme. Nach der Gründung des Reservats starben die Tannen
      nach und nach ab, die Fichte übernahm und danach rückte die Buche nach, die heute über 80 % der Bäume
      stellt. Vorherrschende Waldtypen sind Waldmeister- und Waldgersten-Buchenwälder; auf feuchten Böden
      wächst Bergbuchenwald und an den Quellen Fichtenwald mit Schachtelhalmen. Die ältesten Bäume sind
      zwischen 300 und 400 Jahre alt und 40 bis 50 m hoch.


      Und es gab einen berühmten Baum: Bis 1975 wuchs hier die Königin der Tannen, 425 Jahre alt, 553 cm
      Umfang und 51 m hoch, bis sie am 6. Januar 1975 einem Windstoß zum Opfer fiel.
    wildlife: >-
      Dies ist ein Wald zum Betrachten aus der Ferne. Im Unterwuchs gedeihen Zahnwurz, Waldmeister und andere
      charakteristische Arten; eine regionale Seltenheit ist das Dreiblättrige Schaumkraut. Das Reservat
      schützt das bedrohte Moos Dicranum viride und ist bedeutend für seltene Moose (181 Arten), Pilze (600
      Arten), Schnecken und Insekten. Jedes Jahr brüten hier 35 bis 40 Vogelarten, und eine Erhebung von 1997
      zählte 163 Käferarten.


      Unter den Säugetieren dringt das [Wildschwein](/especie/sus_scrofa/) problemlos ins Reservat vor, und
      seine Wirkung gilt als positiv, weil das Umwühlen des Bodens die Naturverjüngung fördert.
      [Rothirsch](/especie/cervus_elaphus/) und [Reh](/especie/capreolus_capreolus/) sind eine andere Sache:
      Von 1849 bis in die neunziger Jahre gehörte der Wald zu einem eingezäunten Jagdgatter, und sie
      schädigten vor allem Fichten bis zu einem Alter von 150 Jahren. Deshalb umgibt seit 1991 ein 2 m hoher
      Zaun 80 % des Reservats und hält sie fern.
    visit: >-
      Man muss es klar sagen: Der Wald ist für den normalen Tourismus nicht zugänglich, und seit 1991 ist das
      Betreten ohne Genehmigung verboten. Um diese jahrhundertealten Bäume zu sehen, bleibt nur der Weg
      entlang des Zauns. Das Reservat gehört zum Naturpark Novohradské hory mit Zielen wie Terčino údolí und
      Hojná Voda; dieses Gebirge umfasst auf tschechischer Seite 162 km². Rund drei Viertel der Region sind
      Nadel- und Laubwald.
    history: >-
      Rowland verkleinerte das ursprüngliche Reservat von 172,6 ha auf 1,7 ha. Bis 1882 wurden Totholz und
      umgestürzte Stämme aus dem Kern entfernt, und 1947–50 gab es eine Bekämpfungsaktion gegen den
      Borkenkäfer. 1882 wurde ein absolutes Einschlagsverbot erlassen, und 1933 erklärte das Ministerium es
      zum vollständigen Staatsreservat mit 97,72 ha. Seit Mitte des achtzehnten Jahrhunderts entwickelt sich
      der Großteil des Gebiets als Urwald ohne menschlichen Eingriff.


      Wegen der Lage am Eisernen Vorhang wurde die deutsche Bevölkerung nach dem Zweiten Weltkrieg vertrieben,
      und das Gebiet blieb für den Tourismus gesperrt. 2026 wurde das Reservat von 102 auf 441 ha erweitert
      und schützt Bergmischbuchenwälder mit Tanne sowie Fragmente feuchter Fichtenwälder und Moore.
    before: >-
      Versuch nicht hineinzugehen: Der Wald ist gesperrt und eingezäunt, ein Betreten nur mit Genehmigung
      möglich. Es bleiben der Weg am Zaun entlang und der Rest des Gratzener Berglands.
    around: >-
      Das Reservat teilt sich das Gebiet mit dem [Novohradské-Gebirge -
      Waldmassiv](/lugar/novohradske-hory---lesni-masiv/), dem Waldmassiv, in dem es liegt.
  it:
    intro: >-
      Nel 1838 un conte fece qualcosa che quasi nessuno faceva: smise di tagliare. Il conte Buquoy,
      proprietario della tenuta di Nové Hrady, sottrasse questo versante allo sfruttamento forestale e vietò
      di abbattere alberi e raccogliere legna. Il suo ingegnere forestale Rowland glielo rimproverò e previde
      che il bosco, già invecchiato, sarebbe crollato nel giro di cinquant'anni sotto tempeste e neve.
      Passarono 170 anni quasi senza intervento umano e la foresta era ancora in piedi. Oggi Žofínský prales,
      insieme a Hojná Voda, è la riserva più antica dell'Europa continentale, a 15 km a sud-ovest di Nové
      Hrady, a ridosso del confine austriaco.
    landscape: >-
      La foresta si estende tra 735 e 830 m di quota, su un versante nord-orientale del monte Stříbrný vrch,
      alto 936 m. Il sottosuolo è granodiorite, che si disgrega in un suolo franco-sabbioso profondo e ben
      drenato, e decine di sorgenti di infiltrazione alimentano piccoli ruscelli le cui forre articolano il
      terreno. Quasi tutta la riserva è bosco: radure e acque occupano appena 2,59 ha.


      In questa foresta avvenne un lento ricambio. Nel bosco di Buquoy dominava l'abete bianco, con abete
      rosso e faggio, e isolati aceri montani e olmi montani. Dopo la creazione della riserva gli abeti
      bianchi morirono a poco a poco, l'abete rosso prese il posto e poi salì il faggio, che oggi supera l'80
      % degli alberi. I tipi forestali dominanti sono faggete ad asperula odorosa e a orzo dei boschi; su
      suoli umidi, faggeta montana, e presso le sorgenti, abete rosso con equiseti. Gli alberi più vecchi
      hanno tra 300 e 400 anni e misurano da 40 a 50 m.


      E ci fu un albero celebre: fino al 1975 crebbe qui la Regina degli Abeti, di 425 anni, 553 cm di
      circonferenza e 51 m di altezza, abbattuta da una raffica di vento il 6 gennaio 1975.
    wildlife: >-
      È un bosco da guardare da lontano. Nel sottobosco crescono dentaria, asperula odorosa e altre specie
      caratteristiche, e una rarità regionale è la cardamine trifogliata. La riserva protegge il muschio
      minacciato Dicranum viride ed è fondamentale per muschi rari (181 specie), funghi (600 specie),
      chiocciole e insetti. Ogni anno nidificano da 35 a 40 specie di uccelli, e un inventario del 1997 ha
      contato 163 specie di coleotteri.


      Tra i mammiferi, il [cinghiale](/especie/sus_scrofa/) entra nella riserva senza problemi e il suo
      effetto è valutato positivamente perché smuovendo il suolo favorisce la rinnovazione naturale. Il
      [cervo](/especie/cervus_elaphus/) e il [capriolo](/especie/capreolus_capreolus/) sono un'altra storia:
      dal 1849 agli anni novanta la foresta fece parte di una riserva di caccia recintata e danneggiarono
      soprattutto gli abeti rossi fino a 150 anni. Per questo dal 1991 una recinzione di 2 m circonda l'80 %
      della riserva e li tiene fuori.
    visit: >-
      Qui bisogna essere chiari: la foresta non è accessibile al turismo ordinario e dal 1991 è vietato
      entrare senza permesso. Per vedere questi alberi secolari resta solo il sentiero che costeggia la
      recinzione. La riserva fa parte del parco naturale dei monti Novohradské hory, con attrazioni come
      Terčino údolí e Hojná Voda; queste montagne occupano 162 km² sul lato ceco. Circa tre quarti della zona
      sono foreste di conifere e latifoglie.
    history: >-
      Rowland ridusse la riserva originaria di 172,6 ha a 1,7 ha. Fino al 1882 dal nucleo furono rimossi legno
      morto e tronchi caduti, e nel 1947–50 ci fu una campagna contro il bostrico. Nel 1882 fu emanato il
      divieto assoluto di taglio e nel 1933 il ministero la dichiarò riserva statale integrale su 97,72 ha.
      Dalla metà del diciottesimo secolo la maggior parte del territorio si sviluppa come foresta primaria
      senza intervento umano.


      Trovandosi accanto alla Cortina di Ferro, la popolazione tedesca fu espulsa dopo la Seconda guerra
      mondiale e la zona rimase chiusa al turismo. Nel 2026 la riserva è stata ampliata da 102 a 441 ha e
      protegge faggete miste montane con abete bianco e frammenti di peccete umide e torbiere.
    before: >-
      Non provare a entrare: il bosco è chiuso e recintato e l'accesso è possibile solo con permesso. Resta il
      sentiero lungo la recinzione e il resto dei monti Novohradské.
    around: >-
      La riserva condivide il territorio con i [Monti Novohradské - Massiccio
      forestale](/lugar/novohradske-hory---lesni-masiv/), il massiccio boscoso in cui si trova.
  pt:
    intro: >-
      Em 1838, um conde fez algo que quase ninguém fazia: deixou de abater árvores. O conde Buquoy, senhor da
      propriedade de Nové Hrady, retirou esta encosta da exploração florestal e proibiu o corte de árvores e a
      recolha de lenha. O seu engenheiro florestal Rowland criticou-o e previu que a floresta, já envelhecida,
      ruiria em cinquenta anos devido às tempestades e à neve. Passaram 170 anos quase sem influência humana e
      a floresta continuava de pé. Hoje Žofínský prales é, juntamente com Hojná Voda, a reserva mais antiga da
      Europa continental, a 15 km a sudoeste de Nové Hrady, junto à fronteira com a Áustria.
    landscape: >-
      A floresta estende-se entre os 735 e os 830 m, numa encosta nordeste do monte Stříbrný vrch, de 936 m. O
      subsolo é granodiorito, que se decompõe num solo franco-arenoso profundo e bem drenado, e dezenas de
      nascentes de infiltração alimentam pequenos ribeiros cujos barrancos moldam o terreno. Quase toda a
      reserva é floresta: as clareiras e as águas ocupam apenas 2,59 ha.


      Nessa floresta ocorreu uma substituição lenta. Na floresta de Buquoy dominava o abeto-branco, com
      espruce e faia, e pontualmente bordo-branco e ulmeiro-de-montanha. Após a criação da reserva, os abetos
      morreram pouco a pouco, o espruce assumiu o lugar e depois subiu a faia, que hoje ultrapassa os 80 % das
      árvores. Os tipos florestais dominantes são faiais de aspérula-odorífera e de cevada-dos-bosques; em
      solos húmidos, faial de montanha, e junto às nascentes, espruce com cavalinhas. As árvores mais velhas
      têm entre 300 e 400 anos e medem de 40 a 50 m.


      E houve uma árvore célebre: até 1975 cresceu aqui a Rainha dos Abetos, com 425 anos, 553 cm de perímetro
      e 51 m de altura, derrubada por uma rajada de vento a 6 de janeiro de 1975.
    wildlife: >-
      É uma floresta para ver de longe. No sub-bosque crescem dentária, aspérula-odorífera e outras espécies
      características, e uma raridade regional é a cardamina-de-três-folhas. A reserva protege o musgo
      ameaçado Dicranum viride e é essencial para musgos raros (181 espécies), fungos (600 espécies), caracóis
      e insetos. Todos os anos nidificam entre 35 e 40 espécies de aves, e um inventário de 1997 contou 163
      espécies de escaravelhos.


      Entre os mamíferos, o [javali](/especie/sus_scrofa/) entra na reserva sem dificuldade, e o seu efeito é
      avaliado como positivo porque ao revolver o solo ajuda a regeneração natural. O
      [veado-vermelho](/especie/cervus_elaphus/) e a [corça](/especie/capreolus_capreolus/) são outra
      história: de 1849 até aos anos noventa a floresta integrou uma coutada cercada e danificaram sobretudo
      os espruces até aos 150 anos. Por isso, desde 1991, uma vedação de 2 m rodeia 80 % da reserva e
      mantém-nos de fora.
    visit: >-
      Aqui convém ser claro: a floresta não está aberta ao turismo comum e, desde 1991, é proibido entrar sem
      autorização. Para ver estas árvores centenárias resta apenas o caminho que passa junto à vedação. A
      reserva integra o parque natural de Novohradské hory, com pontos de interesse como Terčino údolí e Hojná
      Voda; estas montanhas ocupam 162 km² do lado checo. Cerca de três quartos da comarca são floresta de
      coníferas e folhosas.
    history: >-
      Rowland reduziu a reserva original de 172,6 ha para 1,7 ha. Até 1882 foram retirados do núcleo madeira
      morta e troncos caídos, e em 1947–50 houve uma campanha contra o escaravelho-da-casca. Em 1882 foi
      decretada a proibição absoluta de corte, e em 1933 o ministério declarou-a reserva estatal integral com
      97,72 ha. Desde meados do século dezoito a maior parte do território desenvolve-se como floresta
      primária sem intervenção humana.


      Por ficar junto à Cortina de Ferro, a população alemã foi expulsa após a Segunda Guerra Mundial e a zona
      permaneceu fechada ao turismo. Em 2026 a reserva foi ampliada de 102 para 441 ha, protegendo faiais
      mistos de montanha com abetos e fragmentos de espruçais húmidos e turfeiras.
    before: >-
      Não tentes entrar: a floresta está fechada e vedada, sendo o acesso apenas possível com autorização.
      Resta o caminho junto à vedação e o resto das montanhas de Novohradské.
    around: >-
      A reserva partilha território com as [Montanhas de Novohradské - Maciço
      Florestal](/lugar/novohradske-hory---lesni-masiv/), o maciço florestal onde se encontra.
