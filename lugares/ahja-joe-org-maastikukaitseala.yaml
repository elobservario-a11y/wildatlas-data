resumen:
  es: >-
    Valle fluvial primitivo excavado en arenisca roja del Devónico con acantilados sagrados como Suur
    Taevaskoda (El Salón Celestial Grande).
  en: >-
    Ancient river canyon gouged into Devonian red sandstone featuring sacred cliff walls like Suur Taevaskoda
    (The Great Heavenly Hall).
  fr: >-
    Canyon fluvial ancien entaillant des grès rouges dévoniens, réputé pour ses parois sacrées comme Suur
    Taevaskoda (la Grande Salle céleste).
  de: >-
    Urtümliches Flusstal im roten devonischen Sandstein mit heiligen Felswänden wie Suur Taevaskoda (Große
    Himmelshalle).
  it: >-
    Valle fluviale primordiale scavata nell'arenaria rossa devoniana con falesie sacre come Suur Taevaskoda
    (la Grande Sala Celeste).
  pt: >-
    Vale fluvial primitivo esculpido em arenito vermelho devónico com alcantis sagrados como Suur Taevaskoda
    (O Grande Salão Celeste).
unico:
  es: >-
    Aquí la roca no es solo paisaje: durante siglos fue un lugar de ofrenda y, según la creencia, rascarla
    enfadaba a los espíritus del río.
  en: >-
    Here the rock face is more than geology: for centuries it served as a sacred sacrificial site where, folk
    belief warned, scratching the stone would incur the wrath of river spirits.
  fr: >-
    Ici la roche dépasse le simple cadre géologique : durant des siècles, elle fut un haut lieu sacrificiel où
    blesser la pierre s'attirait la rancune des esprits de l'eau.
  de: >-
    Hier ist der Fels mehr als Geologie: Über Jahrhunderte war er Kultstätte, und dem Volksglauben nach
    erzürnte jedes Einritzen des Steins die Flussgeister.
  it: >-
    Qui la roccia trascende il paesaggio: per secoli fu luogo di offerte sacre dove, secondo la tradizione,
    scalfire la pietra scatenava le ire degli spiriti fluviali.
  pt: >-
    Aqui a rocha transcende o relevo: durante séculos foi um santuário de oferendas e, segundo o credo
    popular, arranhar a pedra enfurecia os espíritos fluviais.
observaciones:
  es: >-
    Permanece en los caminos existentes. Está prohibido raspar los afloramientos de arenisca, y no se debe
    romper la roca ni rascar nombres en ella.
texto:
  es:
    intro: >-
      Los estonios llamaron «salas del cielo» a unas paredes de piedra roja. Son los taevaskoda, los
      afloramientos de arenisca que asoman en la ladera del valle del Ahja, y quizá el nombre alude a una sala
      de paredes de arenisca cuyo techo es el cielo. El río Ahja nace en el lago Erastvere, mide 103,8 km y
      desemboca en el Emajõgi; en su curso medio, la reserva paisajística protege 18 km de un valle que el
      agua excavó en la arenisca del Devónico y que es uno de los más pintorescos de Estonia.
    landscape: >-
      El valle es antiguo, y su historia está escrita en la piedra. El Ahja excavó su cauce en arenisca del
      Devónico, y las paredes del valle muestran afloramientos de arenisca cruzada de la etapa Burtnieki. El
      color viene de los minerales: la arenisca debe su riqueza de tonos al cuarzo, la mica, el feldespato, la
      ilmenita, el granate y el circón, y a arcillas rojizas, moradas y grises. Los últimos cambios
      importantes del relieve ocurrieron hace unos 15 000 años, cuando el hielo dejó morrenas y bloques.


      La reserva se extiende 18 km por el río, desde Koorvere hasta el molino de Valgesoo (Otten), y ocupa
      10,4 km². Es un valle de deshielo de hasta 30 m de profundidad, y la protección abarca ríos y arroyos,
      prados inundables, manantiales, afloramientos de arenisca y bosques antiguos. Más de cuarenta
      afloramientos forman parte de la reserva. Lo que no es roca, es agua: el nivel del río oscila mucho, no
      solo en el deshielo primaveral sino también tras lluvias fuertes.


      La roca también es frágil. A mediados de los años ochenta, tras semanas de lluvias de verano, una parte
      grande de la pared del Gran Taevaskoda se desprendió y cayó al río. Y aguas abajo de la presa, Emaläte,
      una cueva-fuente, tiene una bóveda que se ha derrumbado varias veces; en el verano de 2013 casi por
      completo, pero el agua se abrió paso otra vez. Junto a Emaläte están el Pequeño Taevaskoda y la cueva
      Neitsikoobas.
    wildlife: >-
      El agua limpia es el hábitat de especies exigentes. En el río viven la náyade gruesa, la colmilleja y el
      cavilat, y entre las libélulas, la Ophiogomphus cecilia. Hay [nutria](/especie/lutra_lutra/) y [martín
      pescador](/especie/alcedo_atthis/), y entre las plantas, la Pleurospermum austriacum y la Cruciata
      glabra; en el bosque crece un hongo raro, Sarcosoma globosum.


      Las estaciones cambian el río. En primavera el deshielo sube el nivel, y en verano, en época seca, en
      Kiidjärve hacer una ruta en canoa es casi imposible.
    visit: >-
      Empieza por Saesaare. Desde su aparcamiento sale el sendero natural de Taevaskoda: sigue el Ahja hasta
      el Gran Taevaskoda y regresa por la otra orilla, con 3 km. También desde Saesaare parte la ruta
      Taevaskoja–Kiidjärve–Taevaskoja, de unos 12 km. El sendero educativo Roiupalu es un circuito de 3,2 km
      entre el centro de visitantes de Kiidjärve, Palanumägi y el arroyo Hatiku, y el centro ofrece programas
      educativos y excursiones para niños y adultos.


      Junto al embalse de Saesaare están Laaritsamägi, Mõsumägi, Kindapäka, Kivipalu y Mõtstare mägi, además
      de las paredes de Savioidu y Piirioidu. La zona atrae también a quienes visitan los lugares de rodaje de
      una película de culto de 1969, «Viimne reliikvia».
    history: >-
      Durante siglos los vecinos cuidaron el valle con prudencia. Esa explotación cuidadosa terminó con el
      ferrocarril de Tartu a Petseri, terminado en 1931. La situación empezó a mejorar en julio de 1957,
      cuando se crearon las zonas protegidas del valle del Ahja y de Tilleoru. El objetivo de gestión es
      conservar el bosque, los afloramientos, el relieve, los manantiales y las comunidades seminaturales.


      El río conserva las marcas de su uso: llegó a haber 13 molinos de agua, sobre todo en el curso alto y
      medio, y la mayoría ya no funciona. El rápido de Saesaare era excepcional entre los ríos de llanura de
      Estonia, hasta que se construyeron la central hidroeléctrica y el embalse.
    before: >-
      Permanece en los caminos existentes. Está prohibido raspar los afloramientos de arenisca, y no se debe
      romper la roca ni rascar nombres en ella.
    around: >-
      El [Lago Peipus y Delta del Río Emajõgi](/lugar/peipsi-jarv---emajoe-suursoo/) se solapa aproximadamente
      con esta reserva, y el Ahja desemboca en el Emajõgi. Más lejos, el [Río Drava y Llanura de
      Inundación](/lugar/drava-river---floodplain/) y el [Parque Natural Hoces del Alto Ebro y
      Rudrón](/lugar/parque-natural-hoces-del-alto-ebro-y-rudron/) comparten con el Ahja el martín pescador,
      la nutria y los corredores fluviales con bosque.
  en:
    intro: >-
      Estonians gave the name "heavenly halls" to sheer walls of ochre-red sandstone. These are the
      taevaskoda, dramatic outcrops lining the gorge of the Ahja River, evocative of subterranean chambers
      bounded by sandstone walls under an open sky vault. The Ahja River rises in Lake Erastvere, stretching
      103.8 km before draining into the Emajõgi; across its middle reaches, this landscape reserve safeguards
      18 km of an ancient meltwater valley carved through Devonian sandstone, celebrated among Estonia's most
      enchanting fluvial landscapes.
    landscape: >-
      The valley is ancient, its chronicle etched in sedimentary strata. The Ahja cut deep into Devonian
      sandstone bedrock, exposing cross-bedded Burtnieki-stage deposits. Its vibrant palette derives from
      mineral assemblages: quartz, mica, feldspar, ilmenite, garnet, and zircon mingled with reddish,
      purplish, and grey clays. The last major morphological reshaping unfolded some 15,000 years ago as the
      retreating Fennoscandian ice sheet dumped moraines and erratics.


      The reserve stretches 18 km along the waterway from Koorvere to Valgesoo (Otten) mill, covering 10.4
      km². This glacial spillway plunges to depths of 30 m, protecting rivers, meandering streams, flood
      meadows, artesian springs, sandstone cliffs, and ancient forest tracts. Over forty distinct sandstone
      outcrops lie within reserve boundaries. What is not rock is dynamic water: flow levels fluctuate
      sharply, surging during spring thaw as well as after torrential summer cloudbursts.


      The sandstone remains intrinsically fragile. In the mid-nineteen-eighties, prolonged summer rains
      triggered a catastrophic rockfall that sheared a massive section of Suur Taevaskoda into the river.
      Downstream from the dam, Emaläte, a revered cave-spring, has witnessed recurring roof collapses; in the
      summer of 2013 its cavern almost completely caved in, yet the subterranean spring promptly broke through
      afresh. Adjoining Emaläte are Väike Taevaskoda and the mythical Neitsikoobas cave.
    wildlife: >-
      Pristine, oxygenated waters sustain sensitive riverine fauna. Thick-shelled river mussels, spined loach,
      and European bullhead frequent gravel shallows, while green snaketail dragonflies (Ophiogomphus cecilia)
      patrol the banks. The corridor supports the [Eurasian otter](/especie/lutra_lutra/) and the [common
      kingfisher](/especie/alcedo_atthis/), accompanied by rare flora such as Austrian pleurospermum and
      smooth bedstraw, alongside the endangered forest fungus Sarcosoma globosum.


      Seasonal rhythms dictate the river's character. Spring meltwaters cause dramatic swelling, whereas
      during dry summer spells around Kiidjärve canoe excursions can become nearly impossible due to shallow
      shoals.
    visit: >-
      Begin at Saesaare. The designated Taevaskoda nature trail departs from the parking area, tracking the
      Ahja downstream toward Suur Taevaskoda and looping back along the opposite bluff over 3 km. Saesaare
      also serves as the trailhead for the longer Taevaskoja–Kiidjärve–Taevaskoja circuit covering some 12 km.
      The Roiupalu study trail forms a 3.2 km loop between the Kiidjärve visitor centre, Palanumägi hill, and
      Hatiku brook, offering guided programmes and interpretive walks for all ages.


      Bordering the Saesaare reservoir lie scenic landmarks including Laaritsamägi, Mõsumägi, Kindapäka,
      Kivipalu, and Mõtstare hill, complemented by the cliff walls of Savioidu and Piirioidu. The setting also
      attracts fans of the iconic 1969 Estonian historical feature film «Viimne reliikvia», filmed extensively
      on location here.
    history: >-
      For generations local communities managed the valley with reverent restraint. That delicate stewardship
      was disrupted by the Tartu-Petseri railway, completed in 1931. Conservation gains commenced in July 1957
      with the establishment of protection zones for the Ahja Valley and Tilleoru. Modern management focuses
      on preserving virgin forests, sandstone outcrops, river terraces, spring complexes, and semi-natural
      wooded meadows.


      The river still bears historic traces of hydro-power: up to 13 watermills once operated, chiefly along
      the upper and middle course, most of which stand disused today. Saesaare rapid was once peerless among
      Estonia's lowland cascades until the construction of the local hydroelectric station and its reservoir
      submerged the natural falls.
    before: >-
      Remain on demarcated paths at all times. Scratching, defacing, carving names into, or fracturing the
      fragile sandstone cliffs is strictly prohibited.
    around: >-
      The [Lago Peipus y Delta del Río Emajõgi](/lugar/peipsi-jarv---emajoe-suursoo/) lies in the downstream
      catchment of the Ahja. Farther afield, the [Río Drava y Llanura de
      Inundación](/lugar/drava-river---floodplain/) and [Parque Natural Hoces del Alto Ebro y
      Rudrón](/lugar/parque-natural-hoces-del-alto-ebro-y-rudron/) share with the Ahja key kingfisher and
      otter habitats in wooded river corridors.
  fr:
    intro: >-
      Les Estoniens ont qualifié de « salles célestes » de monumentales falaises de grès rouge. Ce sont les
      taevaskoda, imposants escarpements bordant les méandres de l'Ahja, évoquant une nef aux parois rocheuses
      dont la voûte n'est autre que le ciel. L'Ahja naît au lac Erastvere, déroule 103,8 km avant de confluer
      avec l'Emajõgi ; sur son cours moyen, la réserve paysagère protège 18 km d'une gorge que l'érosion a
      creusée dans le grès dévonien, comptant parmi les paysages les plus enchanteurs d'Estonie.
    landscape: >-
      La vallée est ancienne, son histoire gravée à même la roche. L'Ahja a sculpté son lit au travers du
      socle gréseux du Dévonien moyen, dévoilant des strates entrecroisées de l'étage de Burtnieki. Ses
      tonalités chaleureuses procèdent d'une riche minéralogie : quartz, mica, feldspath, ilménite, grenat et
      zircon se marient aux argiles rouges, violacées et grises. Les derniers remodelages majeurs sont
      survenus il y a environ 15 000 ans, lorsque le glacier a abandonné moraines et blocs erratiques.


      La réserve s'étire sur 18 km le long du cours d'eau, depuis Koorvere jusqu'au moulin de Valgesoo
      (Otten), couvrant 10,4 km². C'est une vallée proglaciaire profonde de 30 m, dont la protection englobe
      cours d'eau, prairies inondables, sources artésiennes, escarpements de grès et lambeaux forestiers
      anciens. Plus de quarante parois rocheuses jalonnent le parcours. En dehors de la roche règne l'eau : le
      débit fluctue amplement, tant lors de la fonte printanière qu'à la suite d'orages violents.


      La roche demeure friable. Au milieu des années quatre-vingt, après des semaines de pluies continues, un
      pan colossal du Grand Taevaskoda s'est effondré dans la rivière. En aval du barrage, Emaläte, une
      source-grotte vénérée, a vu sa voûte céder à plusieurs reprises ; au cours de l'été 2013, elle s'est
      presque entièrement écroulée avant que l'eau ne se fraie un nouveau passage. Près d'Emaläte se dressent
      le Petit Taevaskoda et la cavité de Neitsikoobas.
    wildlife: >-
      Ces eaux limpides hébergent des espèces fluviales exigeantes. La mulette épaisse, la loche de rivière et
      le chabot commun colonisent les radiers sablonneux, tandis que la cordulie à corps fin (Ophiogomphus
      cecilia) patrouille les berges. On y rencontre la [loutre d'Europe](/especie/lutra_lutra/) et le
      [martin-pêcheur d'Europe](/especie/alcedo_atthis/), accompagnés d'espèces végétales rares telles que le
      pleurosperme d'Autriche et le gaillet glabre ; en sous-bois prospère un champignon mythique, le
      Sarcosoma globosum.


      Le fil des saisons transforme le cours d'eau. Au printemps la débâcle fait bondir le niveau d'eau,
      tandis qu'en plein été sec, la descente en canoë s'avère quasiment impossible du côté de Kiidjärve.
    visit: >-
      Débutez à Saesaare. Du parking démarre le sentier d'interprétation de Taevaskoda : il longe l'Ahja
      jusqu'au Grand Taevaskoda et boucle par la rive opposée sur 3 km. Saesaare constitue également le départ
      de la randonnée Taevaskoja–Kiidjärve–Taevaskoja, totalisant près de 12 km. Le sentier didactique de
      Roiupalu forme une boucle de 3,2 km reliant le centre d'accueil de Kiidjärve, Palanumägi et le ruisseau
      Hatiku, proposant animations et sorties accompagnées.


      Bordant la retenue de Saesaare se distinguent Laaritsamägi, Mõsumägi, Kindapäka, Kivipalu et la colline
      de Mõtstare, ainsi que les falaises de Savioidu et de Piirioidu. Les lieux attirent également les
      amateurs du film culte estonien de 1969, « Viimne reliikvia », dont de nombreuses scènes furent tournées
      ici.
    history: >-
      Pendant des siècles les communautés riveraines ont ménagé la vallée. Cette exploitation mesurée prit fin
      avec l'arrivée de la voie ferrée reliant Tartu à Petseri, achevée en 1931. La situation s'est améliorée
      à partir de juillet 1957 avec la création des zones protégées de la vallée de l'Ahja et de Tilleoru. Les
      objectifs actuels veillent à la conservation des forêts de ravin, des falaises, de la topographie
      fluvioglaciaire, des sources et des prairies seminaturelles.


      La rivière garde la trace de son passé artisanal : jusqu'à 13 moulins à eau s'échelonnaient sur son
      parcours, aujourd'hui pour la plupart désaffectés. Le rapide de Saesaare constituait une singularité
      sans égale parmi les rivières de plaine d'Estonie, avant que l'édification d'une microcentrale et de son
      lac de barrage n'en noie les bouillonnements.
    before: >-
      Restez strictement sur les chemins balisés. Il est expressément défendu de graver, d'érafler ou
      d'endommager les falaises de grès.
    around: >-
      Le [Lago Peipus y Delta del Río Emajõgi](/lugar/peipsi-jarv---emajoe-suursoo/) s'inscrit dans le
      prolongement hydrologique de l'Ahja. Plus loin, le [Río Drava y Llanura de
      Inundación](/lugar/drava-river---floodplain/) et le [Parque Natural Hoces del Alto Ebro y
      Rudrón](/lugar/parque-natural-hoces-del-alto-ebro-y-rudron/) partagent avec l'Ahja la présence du
      martin-pêcheur, de la loutre et de corridors ripisylves préservés.
  de:
    intro: >-
      Die Esten bezeichneten markante rote Sandsteinwände ehrfürchtig als „Himmelshallen“. Es sind die
      Taevaskoda, Felsaufschlüsse an den Hängen des Ahja-Tals, deren Name an gewaltige Sandsteinsäle erinnert,
      deren Decke das Himmelsgewölbe bildet. Die Ahja entspringt im Erastvere-See, fließt über 103,8 km zur
      Mündung in den Emajõgi; an ihrem Mittellauf schützt das Landschaftsschutzgebiet 18 km eines
      Schmelzwassertals, das sich in devonischen Sandstein eingegraben hat und zu den landschaftlichen
      Höhepunkten Estlands zählt.
    landscape: >-
      Das Flusstal blickt auf eine lange Entstehung zurück. Die Ahja grub sich tief in mitteldevonischen
      Sandstein ein und legte schräggeschichtete Bänke der Burtnieki-Stufe frei. Die Färbung beruht auf
      Mineraleinschlüssen: Quarz, Glimmer, Feldspat, Ilmenit, Granat und Zirkon, vermengt mit rötlichen,
      violetten und grauen Tonlagen. Die jüngsten tiefgreifenden Formungen vollzogen sich vor rund 15 000
      Jahren, als Gletschermassen Moränen und Findlinge hinterließen.


      Das Reservat erstreckt sich über 18 km Flusslauf von Koorvere bis zur Mühle Valgesoo (Otten) auf 10,4
      km². Es handelt sich um ein bis zu 30 m tiefes Urstromtal; unter Schutz stehen Fließgewässer, Auwiesen,
      Quellaustritte, Sandsteinklippen und ursprüngliche Waldgebiete. Mehr als vierzig Felswände liegen im
      Schutzgebiet. Wo kein Fels ansteht, dominiert das Wasser: Die Pegelstände schwanken drastisch, sowohl
      zur Frühjahrsschmelze als auch nach Starkregen.


      Der Sandstein ist empfindlich. Mitte der achtziger Jahre brach nach wochenlangen Regenfällen ein
      riesiger Block aus der Wand des Suur Taevaskoda und stürzte in den Fluss. Flussabwärts des Stauwehrs
      besitzt die Quellgrotte Emaläte ein Gewölbe, das mehrfach nachgab; im Sommer 2013 stürzte sie fast
      vollständig ein, doch die Quelle bahnte sich ihren Weg erneut. Neben Emaläte liegen der Väike Taevaskoda
      und die sagenumwobene Neitsikoobas-Höhle.
    wildlife: >-
      Klares, sauerstoffreiches Wasser bietet Lebensraum für anspruchsvolle Fließgewässerarten. Gemeine
      Flussmuschel, Steinbeißer und Groppe bevölkern das Flussbett, während die Grüne Flussjungfer
      (Ophiogomphus cecilia) über den Ufern jagt. Heimisch sind der [Eurasische
      Fischotter](/especie/lutra_lutra/) und der [Eisvogel](/especie/alcedo_atthis/); botanisch stechen
      Rippensame und Kahles Kreuzlabkraut hervor, in den Wäldern der seltene Becherling Sarcosoma globosum.


      Die Jahreszeiten prägen die Befahrbarkeit. Im Frühjahr sorgt die Schneeschmelze für Hochwasser, während
      im trockenen Hochsommer bei Kiidjärve Kanutouren wegen Niedrigwassers kaum durchführbar sind.
    visit: >-
      Beginne in Saesaare. Vom dortigen Wanderparkplatz führt der 3 km lange Taevaskoda-Naturlehrpfad
      flussabwärts zum Suur Taevaskoda und über das andere Ufer zurück. Von Saesaare startet auch die rund 12
      km lange Route Taevaskoja–Kiidjärve–Taevaskoja. Der Roiupalu-Lehrpfad bildet einen 3,2 km langen Rundweg
      zwischen dem Besucherzentrum Kiidjärve, dem Palanumägi und dem Bach Hatiku; das Zentrum bietet
      Umweltbildungsprogramme für Familien an.


      Am Stausee Saesaare liegen Laaritsamägi, Mõsumägi, Kindapäka, Kivipalu und der Berg Mõtstare sowie die
      Klippen von Savioidu und Piirioidu. Bekanntheit erlangte die Schlucht auch als Drehort des estnischen
      Kultfilms „Viimne reliikvia“ von 1969.
    history: >-
      Jahrhundertelang bewirtschafteten die Bauern der Region das Tal behutsam. Diese traditionelle Nutzung
      endete mit dem Bau der Bahnstrecke Tartu–Petseri im Jahr 1931. Eine Wende zum Besseren leitete der Juli
      1957 mit der Einrichtung der Schutzgebiete Ahja-Tal und Tilleoru ein. Heutiges Schutzziel ist die
      Bewahrung alter Hangwälder, Felsformationen, des glazialen Reliefs, der Quellen und artenreicher
      Halboffenland-Biotope.


      Der Fluss trägt historische Nutzungsspuren: Einst arbeiteten bis zu 13 Wassermühlen an der Ahja, die
      heute weitgehend stillliegen. Die Stromschnelle von Saesaare galt als Ausnahmeerscheinung im estnischen
      Tiefland, bis der Bau des Wasserkraftwerks und des Stausees die Kaskade überflutete.
    before: >-
      Bleibe stets auf den ausgewiesenen Pfaden. Das Beschädigen, Zerkratzen oder Einritzen von Namen in die
      Sandsteinwände ist strikt verboten.
    around: >-
      Der [Lago Peipus y Delta del Río Emajõgi](/lugar/peipsi-jarv---emajoe-suursoo/) schließt an das
      Flusssystem an, da die Ahja in den Emajõgi mündet. Weiter entfernt teilen das [Río Drava y Llanura de
      Inundación](/lugar/drava-river---floodplain/) und der [Parque Natural Hoces del Alto Ebro y
      Rudrón](/lugar/parque-natural-hoces-del-alto-ebro-y-rudron/) mit der Ahja Vorkommen von Eisvogel,
      Fischotter und bewaldeten Flussschluchten.
  it:
    intro: >-
      Gli estoni chiamarono «sale del cielo» le imponenti falesie d'arenaria rossa. Sono i taevaskoda,
      affioramenti rupestri che ornano i versanti della valle dell'Ahja, il cui nome evoca sale dalle pareti
      rocciose sormontate dalla volta celeste. Il fiume Ahja sgorga dal lago Erastvere, scorre per 103,8 km
      fino a gettarsi nell'Emajõgi; nel suo medio corso, la riserva paesaggistica protegge 18 km di una forra
      che l'erosione ha scavato nell'arenaria devoniana, annoverata tra i panorami più suggestivi d'Estonia.
    landscape: >-
      La forra è antichissima e custodisce la sua cronaca negli strati geologici. L'Ahja ha inciso il suo
      letto nell'arenaria del Devoniano medio, mettendo a nudo banchi stratificati dello stadio di Burtnieki.
      Le tonalità cromatiche scaturiscono dalla composizione mineralogica: quarzo, mica, feldspato, ilmenite,
      granato e zircone legati ad argille rosse, violacee e grigie. Le ultime mutazioni del rilievo risalgono
      a circa 15 000 anni fa, allorché i ghiacci depositarono cordoni morenici e massi erratici.


      La riserva si sviluppa per 18 km lungo il fiume, da Koorvere fino al mulino di Valgesoo (Otten),
      coprendo 10,4 km². È un solco fluvioglaciale profondo fino a 30 m; la tutela salvaguarda corsi d'acqua,
      prati alluvionali, risorgenze sorgive, balze rocciose e boschi vetusti. Più di quaranta pareti
      d'arenaria ricadono nel perimetro protetto. Ciò che non è roccia è acqua: la portata oscilla
      notevolmente, tanto per il disgelo primaverile quanto a seguito di nubifragi estivi.


      La roccia è intrinsecamente friabile. A metà degli anni ottanta, dopo intense piogge estive, una
      porzione massiccia della parete del Grande Taevaskoda franò nel fiume. A valle della diga, la sorgente
      carsica di Emaläte possiede una cavità crollata a più riprese; nell'estate del 2013 cedette quasi del
      tutto, ma la sorgente riaprì rapidamente il proprio varco. Accanto a Emaläte sorgono il Piccolo
      Taevaskoda e la grotta Neitsikoobas.
    wildlife: >-
      Le acque limpide danno rifugio a specie acquatiche vulnerabili. Nei fondali ghiaiosi albergano la mútela
      di fiume, il cobite barbatello e lo scazzone, mentre tra le libellule spicca l'Ophiogomphus cecilia.
      Sono presenti la [lontra europea](/especie/lutra_lutra/) e il [martin
      pescatore](/especie/alcedo_atthis/), e tra le specie vegetali il pleurospermo austriaco e la crociata
      glabra; nei boschi cresce il raro fungo Sarcosoma globosum.


      Le stagioni trasformano la navigabilità del fiume. In primavera il disgelo eleva il livello idrico,
      mentre in piena estate secca, nei pressi di Kiidjärve le uscite in canoa risultano pressoché
      impraticabili.
    visit: >-
      Inizia da Saesaare. Dal piazzale di sosta parte il sentiero didattico di Taevaskoda: costeggia l'Ahja
      fino al Grande Taevaskoda e rientra lungo la sponda opposta per 3 km. Sempre da Saesaare muove
      l'itinerario Taevaskoja–Kiidjärve–Taevaskoja, di circa 12 km. Il percorso naturalistico di Roiupalu
      compie un anello di 3,2 km tra il centro visite di Kiidjärve, Palanumägi e il ruscello Hatiku,
      proponendo escursioni guidate per famiglie.


      Lungo l'invaso di Saesaare si incontrano Laaritsamägi, Mõsumägi, Kindapäka, Kivipalu e la collina di
      Mõtstare, oltre ai costoni di Savioidu e Piirioidu. Il sito richiama anche gli estimatori del film
      storico estone del 1969, «Viimne reliikvia», girato in questi scenari.
    history: >-
      Per generazioni gli abitanti hanno gestito la valle con rispetto e frugalità. Questo equilibrio svanì
      con la realizzazione della ferrovia da Tartu a Petseri, completata nel 1931. La tutela prese avvio nel
      luglio 1957 con l'istituzione delle aree protette della valle dell'Ahja e di Tilleoru. L'obiettivo
      gestionale tutela le foreste di forra, le rupi, la morfologia glaciale, le sorgenti e i prati alberati
      seminaturali.


      Il fiume mostra i segni delle antiche attività: ospitò fino a 13 mulini ad acqua, distribuiti lungo
      l'alto e medio corso, oggi in gran parte inattivi. La rapida di Saesaare rappresentava un unicum tra i
      fiumi di pianura estoni, prima che la diga idroelettrica e il bacino ne sommergessero i gorghi.
    before: >-
      Cammina solo lungo i percorsi tracciati. È rigorosamente vietato scalfire le rupi d'arenaria, incidere
      scritte o asportare porzioni di roccia.
    around: >-
      Il [Lago Peipus y Delta del Río Emajõgi](/lugar/peipsi-jarv---emajoe-suursoo/) riceve indirettamente le
      acque del bacino, giacché l'Ahja sfocia nell'Emajõgi. Più lontano, il [Río Drava y Llanura de
      Inundación](/lugar/drava-river---floodplain/) e il [Parque Natural Hoces del Alto Ebro y
      Rudrón](/lugar/parque-natural-hoces-del-alto-ebro-y-rudron/) condividono con l'Ahja martin pescatore,
      lontra e forre boscose fluviali.
  pt:
    intro: >-
      Os estónios apelidaram de «salões celestes» imponentes muralhas de arenito vermelho. São as taevaskoda,
      afloramentos rochosos que marginam o desfiladeiro do Ahja, cujo nome alude a câmaras de pedra cobertas
      unicamente pela abóbada celeste. O rio Ahja nasce no lago Erastvere, corre ao longo de 103,8 km e
      desagua no Emajõgi; no seu curso médio, a reserva paisagística protege 18 km de um vale proglaciar
      entalhado no arenito do Devónico, um dos trechos mais pitorescos da Estónia.
    landscape: >-
      O vale é remoto e a sua história encontra-se gravada na rocha. O Ahja entalhou o seu leito em arenito do
      Devónico Médio, expondo estratos entrecruzados da formação Burtnieki. A policromia provém dos minerais:
      quartzo, mica, feldspato, ilmenite, granada e zircão associados a argilas vermelhas, arroxeadas e
      cinzentas. As últimas grandes mutações do relevo deram-se há cerca de 15 000 anos com o recuo dos
      glaciares, deixando moreias e blocos erráticos.


      A reserva estende-se por 18 km ribeirinhos, desde Koorvere até ao moinho de Valgesoo (Otten), ocupando
      10,4 km². Trata-se de um vale de degelo com até 30 m de profundidade; a proteção abrange cursos de água,
      prados aluviais, nascentes, alcantis de arenito e manchas florestais maduras. Mais de quarenta escarpas
      integram a reserva. Onde não há rocha brota a água: os caudais sofrem fortes oscilações, tanto no degelo
      primaveril como após chuvadas torrenciais.


      A rocha é vulnerável à erosão. Em meados dos anos oitenta, após semanas de chuvas estivais, uma enorme
      secção da muralha do Grande Taevaskoda colapsou sobre o leito. A jusante do açude, Emaläte, uma nascente
      em gruta sagrada, sofreu repetidos abatimentos da abóbada; no verão de 2013 ruiu quase totalmente, mas o
      caudal reabriu caminho. Perto de Emaläte erguem-se o Pequeno Taevaskoda e a caverna Neitsikoobas.
    wildlife: >-
      Águas límpidas acolhem espécies fluviais sensíveis. No leito vivem a mexilhão-do-rio, a verdemã e o
      escorpião-de-água, destacando-se entre as libélulas a Ophiogomphus cecilia. Ocorrem a
      [lontra-europeia](/especie/lutra_lutra/) e o [guarda-rios-comum](/especie/alcedo_atthis/), acompanhados
      na flora pelo pleurospermo-austríaco e pela cruciata-glabra; nos bosques medra o fungo raro Sarcosoma
      globosum.


      O curso do rio oscila com as estações. Na primavera o degelo eleva substancialmente o nível das águas,
      enquanto no estio seco, em Kiidjärve a navegação em canoa torna-se quase impraticável.
    visit: >-
      Começa em Saesaare. Do parque de estacionamento parte o trilho interpretativo de Taevaskoda: bordeja o
      Ahja até ao Grande Taevaskoda e regressa pela margem contrária em 3 km. De Saesaare parte também a rota
      Taevaskoja–Kiidjärve–Taevaskoja, com cerca de 12 km. O percurso didático de Roiupalu traça um circuito
      de 3,2 km entre o centro de visitantes de Kiidjärve, Palanumägi e o ribeiro Hatiku, facultando programas
      pedagógicos e visitas interpretativas.


      Junto à albufeira de Saesaare sobressaem Laaritsamägi, Mõsumägi, Kindapäka, Kivipalu e o monte Mõtstare,
      bem como as escarpas de Savioidu e Piirioidu. A zona atrai igualmente admiradores do clássico filme
      estónio de 1969, «Viimne reliikvia», amplamente rodado nestes desfiladeiros.
    history: >-
      Ao longo dos séculos as comunidades locais exploraram o vale de forma contida. Essa gestão tradicional
      sofreu um revés com a via férrea de Tartu a Petseri, concluída em 1931. A conservação ganhou fôlego em
      julho de 1957 com a criação das áreas protegidas do vale do Ahja e de Tilleoru. A gestão empenha-se em
      manter as matas de encosta, as arribas, o relevo glaciar, as nascentes e as comunidades seminaturais.


      O leito preserva testemunhos da sua faina: chegaram a laborar 13 moinhos de água, mormente no curso
      médio e superior, desativados na sua maioria. O rápido de Saesaare constituía um fenómeno singular na
      planície estónia, antes de a central hidroelétrica e a sua represa submergirem a cascata.
    before: >-
      Mantém-te nos trilhos marcados. É estritamente interdito riscar, gravar letreiros ou danificar as
      frágeis muralhas de arenito.
    around: >-
      O [Lago Peipus y Delta del Río Emajõgi](/lugar/peipsi-jarv---emajoe-suursoo/) integra a bacia
      hidrográfica terminal do Ahja, que aflui no Emajõgi. Mais longe, o [Río Drava y Llanura de
      Inundación](/lugar/drava-river---floodplain/) e o [Parque Natural Hoces del Alto Ebro y
      Rudrón](/lugar/parque-natural-hoces-del-alto-ebro-y-rudron/) partilham com o Ahja guarda-rios, lontras e
      corredores fluviais arborizados.
