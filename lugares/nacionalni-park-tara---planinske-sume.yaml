    fuego solo se hace en los lugares previstos y no se puede acampar fuera de ellos.
texto:
  es:
    intro: >-
      Al oeste de Serbia, el Drina da un gran codo y dentro de él queda un monte entero cubierto de bosque.
      Tara es el sitio donde esa curva del río se vuelve parque nacional: un conjunto de cumbres con gargantas
      hondas, un cañón del Drina que cae de 1.000 a 250 metros con vistas amplias sobre el oeste de Serbia y
      Bosnia, y haya, abeto y pícea hasta donde alcanza la vista. Con el 83,5 % del territorio cubierto de
      bosque, es la zona más boscosa de Serbia, y se la llama «el pulmón de Serbia».


      El parque se declaró en 1981 y se amplió el 5 de octubre de 2015; hoy abarca 24.991,82 hectáreas. El
      punto más alto es Kozji Rid (1.591 m), y el de la montaña Tara, Zborište (1.544 m).
    landscape: >-
      Si miras el relieve, Tara se explica por el agua. El cañón del Drina está tallado en gruesas capas de
      caliza del Terciario medio, y el monte vecino, Zvijezda, queda separado de Tara por la garganta del
      Derventa. En Zvijezda se esconde el cañón más profundo de Serbia, descubierto el 12 de junio de 2010;
      por su aislamiento viven allí osos y rebecos.


      El bosque es la otra mitad del paisaje. Por la conservación y variedad de sus ecosistemas forestales,
      muchos de ellos relictos, Tara figura entre las zonas forestales más ricas de Europa. Dominan los
      bosques mixtos de pícea, abeto y haya, que ocupan más del 85 % de la superficie forestal. Nueve
      reservas, el 16 % del parque, tienen prohibida la tala, y algunas se han dejado intactas durante siglos,
      casi como una selva templada. Las hayas más viejas tendrían más de 500 años.
    wildlife: >-
      Cada ejemplar de pícea de Pančić se considera monumento de la naturaleza. Fue descubierta por Josif
      Pančić en 1875 en la aldea de Đurići, y solo crece en dos lugares de Tara: el cañón del Mileševka y el
      macizo de Zvezda. El parque alberga 1.156 especies de flora vascular, un tercio de la flora de Serbia, y
      76 son endémicas.


      La fauna es igual de rica. Hay 59 especies de mamíferos y unas 140 de aves, además de 12 de anfibios, 12
      de reptiles y 19 de peces. Viven [oso pardo](/especie/ursus_arctos/) y [nutria](/especie/lutra_lutra/),
      además de [rebeco](/especie/rupicapra_rupicapra/), [corzo](/especie/capreolus_capreolus/),
      [lince](/especie/lynx_lynx/), [lobo](/especie/canis_lupus/), chacal dorado,
      [jabalí](/especie/sus_scrofa/), marta y gato montés. En abril de 2019 había unos 60 osos en Tara, el 80
      % de todos los de Serbia. El seguimiento por satélite muestra que las hembras con crías ocupan un área
      compacta, mientras que los machos viajan más lejos al oeste, cruzando el Drina hacia Bosnia. Uno de
      ellos, Aleksandar, con collar con cámara GPS, hibernó de mediados de noviembre a finales de marzo y se
      resistía a salir de la cueva.


      Entre las aves están [águila real](/especie/aquila_chrysaetos/), [buitre
      leonado](/especie/gyps_fulvus/), [halcón peregrino](/especie/falco_peregrinus/), [búho
      real](/especie/bubo_bubo/), cascanueces, camachuelo, piquituerto, [pico
      negro](/especie/dryocopus_martius/), perdiz griega y [urogallo lira](/especie/tetrao_tetrix/). En el
      lago Perućac hay una población de serretas grandes de unas 50 parejas. El saltamontes de Pančić es el
      símbolo de la fauna de invertebrados del parque, un endemismo relicto.
    visit: >-
      Los puntos turísticos principales son Kaluđerske Bare, al norte cerca de Bajina Bašta, y Mitrovac, al
      sur. Se llega al parque por tres direcciones y una red de pistas forestales de macadán conecta
      localidades y lugares turísticos. El mejor modo de empezar es pasar por un centro de visitantes o por la
      oficina de turismo para recibir información. El de Mitrovac, abierto en 2006, fue el primero de su tipo
      en Serbia, y en Bajina Bašta se prepara otro, donde mientras tanto se puede obtener información y ver
      exposiciones temáticas.


      Hay 290 km de senderos señalizados. Los de la zona de Zvijezda y Crni Vrh salen de la casilla de guardas
      de Predov Krst, y una de las rutas numeradas va de Kaluđerske Bare a Zborište. El mirador de Banjska es
      el más visitado; otros son Kićac, Vranovina, Veliki Teferič, Mali Teferič y Vranica. En Tara hay tres
      rutas ciclistas marcadas, y la red de pistas forestales ofrece buenas condiciones para pedalear.


      Un sendero educativo de Banjska Stena recorre seis kilómetros, tiene dificultad media y llega a un
      mirador; dispone de cinco áreas de descanso y paneles sobre plantas, bosques y el oso pardo. La ruta
      educativa Bilješka Stena cubre seis kilómetros entre Predov Krst y el mirador del mismo nombre, y el
      sendero Tepeh Livada atraviesa una turbera de la reserva Crveni Potok hasta el prado central homónimo.
    history: >-
      Tara guarda capas de historia. En Crveni Tepih se halló la contaminación por plomo más antigua de
      Europa, fechada en 3600 a. C. El monasterio de Rača, fundación del rey Dragutin del siglo XIII, es el
      monumento más importante del parque, y las necrópolis medievales de estelas «stećci» de Rastište y
      Perućac entraron en 2016 en la lista del Patrimonio Mundial de la UNESCO.


      Tara, el parque natural de Šargan-Mokra Gora, el de Zlatibor y el parque nacional Drina de Bosnia están
      previstos como posible reserva de la biosfera transfronteriza de la UNESCO.
    before: >-
      Los centros de visitantes de Mitrovac y de Bajina Bašta dan la información para organizar la salida. El
      fuego solo se hace en los lugares previstos y no se puede acampar fuera de ellos.
    around: >-
      A unos treinta kilómetros queda el [Cañón Kárstico del Río Prača y Cueva
      Govještica](/lugar/kanjon-rijeke-prace---pecina-govjestica/).
  en:
    intro: >-
      In western Serbia, the Drina River forms a sweeping elbow, cupping an entire forested mountain within
      its embrace. Tara is where that dramatic river bend turns into a national park: a realm of deeply
      incised limestone gorges, a Drina canyon falling from 1,000 to 250 metres with expansive vistas across
      western Serbia and Bosnia, and beech, fir, and spruce stretching as far as the eye can see. With 83.5 %
      of its territory cloaked in trees, it is the most forested expanse in Serbia, known as «the lungs of
      Serbia».


      The national park was designated in 1981 and expanded on 5 October 2015; today it spans 24,991.82
      hectares. The highest summit is Kozji Rid (1,591 m), and on the Tara plateau itself, Zborište (1,544 m).
    landscape: >-
      Look at the topography and Tara reveals itself as a creation of water. The Drina Canyon is carved
      through thick beds of Middle Tertiary limestone, and the adjacent Mount Zvijezda is separated from Tara
      by the sheer Derventa gorge. Within Zvijezda lies the deepest canyon in Serbia, discovered on 12 June
      2010; because of its extreme isolation, bears and chamois thrive there undisturbed.


      Forest constitutes the other half of the landscape. Due to the exceptional conservation and diversity of
      its forest ecosystems, many of which are ancient relicts, Tara ranks among Europe's richest woodland
      enclaves. Mixed forests of spruce, fir, and beech dominate, covering more than 85 % of the wooded area.
      Nine strict reserves, representing 16 % of the park, are completely protected from timber harvesting;
      some have remained untouched for centuries, resembling temperate rainforests. The oldest beeches are
      estimated to exceed 500 years of age.
    wildlife: >-
      Every single Serbian spruce tree is protected as a natural monument. It was discovered by botanist Josif
      Pančić in 1875 in the village of Đurići and grows naturally in only two localities in Tara: the
      Mileševka canyon and the Zvezda massif. The park shelters 1,156 species of vascular flora, fully a third
      of Serbia's entire flora, including 76 endemics.


      Fauna is equally remarkable. There are 59 mammal species and around 140 bird species, alongside 12
      amphibians, 12 reptiles, and 19 fishes. Inhabitants include the [brown bear](/especie/ursus_arctos/) and
      [Eurasian otter](/especie/lutra_lutra/), as well as [Balkan chamois](/especie/rupicapra_rupicapra/),
      [roe deer](/especie/capreolus_capreolus/), [Eurasian lynx](/especie/lynx_lynx/), [grey
      wolf](/especie/canis_lupus/), golden jackal, [wild boar](/especie/sus_scrofa/), pine marten, and
      European wildcat. In April 2019 there were roughly 60 bears in Tara, representing 80 % of Serbia's
      entire population. Satellite tracking reveals that females with cubs stay within a compact range, while
      solitary males roam widely westward across the Drina into Bosnia. One tracked male, Aleksandar, fitted
      with a GPS camera collar, hibernated from mid-November to late March and was reluctant to leave his den.


      Birdlife features the [golden eagle](/especie/aquila_chrysaetos/), [griffon
      vulture](/especie/gyps_fulvus/), [peregrine falcon](/especie/falco_peregrinus/), [Eurasian
      eagle-owl](/especie/bubo_bubo/), spotted nutcracker, Eurasian bullfinch, common crossbill, [black
      woodpecker](/especie/dryocopus_martius/), rock partridge, and [black grouse](/especie/tetrao_tetrix/).
      On Lake Perućac a breeding population of goosander numbers some 50 pairs. Pančić's bush-cricket serves
      as the park's invertebrate emblem, an endemic relict species.
    visit: >-
      The primary visitor hubs are Kaluđerske Bare in the north near Bajina Bašta, and Mitrovac in the south.
      The park is accessible from three main directions, and a network of gravel forest tracks links scenic
      spots and hamlets. The best starting point is a visitor centre or tourist office for orientation. The
      Mitrovac centre, opened in 2006, was the first of its kind in Serbia, while Bajina Bašta offers
      information and thematic exhibits.


      There are 290 km of marked hiking trails. Paths exploring the Zvijezda and Crni Vrh sectors depart from
      the Predov Krst ranger post, with a popular numbered route running from Kaluđerske Bare to Zborište. The
      Banjska Stena viewpoint is the most frequented; other panoramic lookouts include Kićac, Vranovina,
      Veliki Teferič, Mali Teferič, and Vranica. Tara offers three signposted cycling circuits, with forest
      tracks providing ideal pedalling terrain.


      The Banjska Stena interpretive trail covers six kilometres with moderate gradients, leading to the
      dramatic viewpoint and featuring five rest clearings with informational boards on woodland ecology and
      brown bears. The Bilješka Stena educational path spans six kilometres between Predov Krst and its
      namesake lookout, while the Tepih Livada trail traverses a protected peat bog within Crveni Potok
      reserve.
    history: >-
      Tara holds deep historical layers. At Crveni Tepih, archaeologists uncovered the oldest lead pollution
      evidence in Europe, dated to 3600 BC. Rača Monastery, founded by King Dragutin in the thirteenth
      century, stands as the park's foremost cultural monument, and the medieval stećci tombstones of Rastište
      and Perućac were inscribed on the UNESCO World Heritage list in 2016.


      Tara, Šargan-Mokra Gora Nature Park, Zlatibor, and Bosnia's Drina National Park are proposed as a future
      transboundary UNESCO biosphere reserve.
    before: >-
      The visitor centres at Mitrovac and Bajina Bašta provide up-to-date guidance for route planning. Open
      fires are strictly restricted to designated fireplaces, and wild camping is not permitted outside
      authorized sites.
    around: >-
      About thirty kilometres away lies the [Prača River Karst Canyon and Govještica
      Cave](/lugar/kanjon-rijeke-prace---pecina-govjestica/).
  fr:
    intro: >-
      À l'ouest de la Serbie, la Drina décrit un ample méandre enlaçant une montagne entièrement boisée. Tara
      est l'endroit où cette boucle fluviale devient parc national : un chapelet de crêtes et de gorges
      profondes, un canyon de la Drina plongeant de 1 000 à 250 mètres avec des panoramas grandioses sur la
      Serbie occidentale et la Bosnie, et des forêts de hêtres, sapins et épicéas à perte de vue. Avec 83,5 %
      de son territoire sous couvert arboré, c'est l'espace le plus boisé de Serbie, surnommé « le poumon de
      la Serbie ».


      Le parc a été proclamé en 1981 et agrandi le 5 octobre 2015 ; il s'étend aujourd'hui sur 24 991,82
      hectares. Le point culminant est le Kozji Rid (1 591 m), et sur le plateau de Tara proprement dit, le
      Zborište (1 544 m).
    landscape: >-
      Dans le relief de Tara, l'eau a façonné chaque recoin. Le canyon de la Drina est entaillé dans
      d'épaisses couches de calcaire du Tertiaire moyen, tandis que le mont voisin, Zvijezda, est isolé de
      Tara par la gorge de la Derventa. Dans le Zvijezda s'enfonce le défilé le plus profond de Serbie,
      découvert le 12 juin 2010 ; son isolement extrême en fait un havre pour les ours et les chamois.


      La forêt constitue l'autre versant du paysage. Grâce à la préservation et à la diversité de ses
      écosystèmes forestiers, dont beaucoup sont des reliques tertiaires, Tara se classe parmi les ensembles
      sylvestres les plus remarquables d'Europe. Les peuplements mixtes d'épicéa, de sapin et de hêtre
      dominent, occupant plus de 85 % de la surface forestière. Neuf réserves intégrales, soit 16 % du parc,
      sont formellement exclues de toute exploitation sylvicole ; certaines sont demeurées intactes depuis des
      siècles, évoquant une véritable forêt tempérée primaire. Les hêtres les plus vénérables dépasseraient
      500 ans.
    wildlife: >-
      Chaque épicéa de Pančić est protégé au titre de monument de la nature. Découvert par Josif Pančić en
      1875 dans le village de Đurići, il ne pousse spontanément qu'en deux endroits de Tara : le défilé de la
      Mileševka et le massif de Zvezda. Le parc abrite 1 156 espèces de plantes vasculaires, soit le tiers de
      la flore serbe, dont 76 sont endémiques.


      La faune est tout aussi opulente. On compte 59 espèces de mammifères et près de 140 espèces d'oiseaux,
      ainsi que 12 d'amphibiens, 12 de reptiles et 19 de poissons. Y résident l'[ours
      brun](/especie/ursus_arctos/) et la [loutre d'Europe](/especie/lutra_lutra/), ainsi que le
      [chamois](/especie/rupicapra_rupicapra/), le [chevreuil](/especie/capreolus_capreolus/), le [lynx
      boréal](/especie/lynx_lynx/), le [loup gris](/especie/canis_lupus/), le chacal doré, le
      [sanglier](/especie/sus_scrofa/), la martre et le chat sauvage. En avril 2019, on dénombrait environ 60
      ours à Tara, soit 80 % de toute la population de Serbie. Le suivi satellitaire montre que les femelles
      suitées restent sur un domaine restreint, alors que les mâles vagabondent vers l'ouest, franchissant la
      Drina vers la Bosnie. L'un d'eux, Aleksandar, muni d'un collier émetteur GPS, a hiberné de la
      mi-novembre à la fin mars et refusait de quitter sa tanière.


      Parmi les oiseaux figurent l'[aigle royal](/especie/aquila_chrysaetos/), le [vautour
      fauve](/especie/gyps_fulvus/), le [faucon pèlerin](/especie/falco_peregrinus/), le [grand-duc
      d'Europe](/especie/bubo_bubo/), le cassenoix moucheté, le bouvreuil pivoine, le bec-croisé des sapins,
      le [pic noir](/especie/dryocopus_martius/), la perdrix bartavelle et le [tétras
      lyre](/especie/tetrao_tetrix/). Sur le lac de Perućac, une population de harles bièvres rassemble
      environ 50 couples. La sauterelle de Pančić est l'emblème des invertébrés du parc, endémisme relictuel
      précieux.
    visit: >-
      Les principaux pôles touristiques sont Kaluđerske Bare, au nord près de Bajina Bašta, et Mitrovac au
      sud. Le parc est desservi par trois axes routiers, et un réseau de pistes forestières empierrées relie
      les sites d'intérêt. Le meilleur réflexe consiste à s'arrêter dans un centre d'accueil ou à l'office du
      tourisme pour obtenir des cartes. Celui de Mitrovac, ouvert en 2006, fut le premier de son genre en
      Serbie, complété par l'espace muséographique de Bajina Bašta.


      On dénombre 290 km de sentiers balisés. Ceux du secteur de Zvijezda et de Crni Vrh partent du poste de
      gardes de Predov Krst, et un chemin balisé relie Kaluđerske Bare à Zborište. Le belvédère de Banjska
      Stena est le plus fréquenté ; les autres incluent Kićac, Vranovina, Veliki Teferič, Mali Teferič et
      Vranica. Tara propose trois circuits cyclables balisés, et les pistes forestières offrent un terrain
      idéal pour le vélo tout terrain.


      Le sentier didactique de Banjska Stena parcourt six kilomètres avec un dénivelé modéré jusqu'au
      belvédère, aménagé de cinq aires de repos pourvues de panneaux sur la flore et l'ours brun. Le sentier
      de Bilješka Stena s'étend sur six kilomètres entre Predov Krst et le belvédère éponyme, tandis que
      l'itinéraire de Tepih Livada traverse une tourbière dans la réserve de Crveni Potok jusqu'à la clairière
      centrale.
    history: >-
      Tara recèle des couches d'histoire millénaires. À Crveni Tepih a été mise au jour la plus ancienne trace
      de pollution au plomb d'Europe, datée de 3600 av. J.-C. Le monastère de Rača, fondé par le roi Dragutin
      au XIIIe siècle, représente le monument majeur du parc, et les nécropoles médiévales de stèles « stećci
      » de Rastište et Perućac ont été inscrites sur la liste du Patrimoine mondial de l'UNESCO en 2016.


      Tara, les parcs naturels de Šargan-Mokra Gora et de Zlatibor ainsi que le parc national de la Drina en
      Bosnie sont envisagés comme une future réserve de biosphère transfrontalière de l'UNESCO.
    before: >-
      Les centres d'accueil de Mitrovac et de Bajina Bašta fournissent toutes les indications pour préparer
      les sorties. Les feux ne sont autorisés que sur les emplacements prévus et le camping sauvage est
      interdit hors des zones désignées.
    around: >-
      À environ trente kilomètres se trouve le [canyon karstique de la rivière Prača et grotte de
      Govještica](/lugar/kanjon-rijeke-prace---pecina-govjestica/).
  de:
    intro: >-
      Im Westen Serbiens beschreibt die Drina eine weite Schleife und umschließt ein ganzes bewaldetes
      Gebirgsmassiv. Tara ist der Ort, an dem dieser Flussbogen zum Nationalpark wird: Ein Gefüge aus tiefen
      Schluchten, ein Canyon der Drina, der von 1.000 auf 250 Meter abfällt und weite Ausblicke über
      Westserbien und Bosnien bietet, sowie Buchen, Tannen und Fichten, soweit das Auge reicht. Mit 83,5 %
      Waldanteil ist es das waldreichste Gebiet Serbiens, treffend als «Lunge Serbiens» bezeichnet.


      Der Park wurde 1981 ausgewiesen und am 5. Oktober 2015 erweitert; heute umfasst er 24.991,82 Hektar.
      Höchster Punkt ist der Kozji Rid (1.591 m), und auf der Tara-Hochfläche der Zborište (1.544 m).
    landscape: >-
      Die Topographie von Tara ist ein Werk des Wassers. Die Drina-Schlucht ist tief in mächtige
      Kalksteinschichten des Mitteltals eingeschnitten, und der benachbarte Zvijezda-Bergzug wird durch die
      Derventa-Schlucht von Tara getrennt. Im Zvijezda verbirgt sich die tiefste Schlucht Serbiens, entdeckt
      am 12. Juni 2010; dank ihrer Abgeschiedenheit leben dort Bären und Gämsen ungestört.


      Der Wald bildet das andere Fundament der Landschaft. Durch die Vielfalt und Ursprünglichkeit seiner
      Waldökosysteme zählt Tara zu den bedeutendsten Waldregionen Europas. Mischwälder aus Fichte, Tanne und
      Buche dominieren und nehmen mehr als 85 % der Waldfläche ein. Neun Totalreservate, 16 % des Parks, sind
      vollständig von der Holznutzung ausgenommen; einige blieben seit Jahrhunderten unberührt und gleichen
      einem gemäßigten Regenwald. Die ältesten Buchen werden auf über 500 Jahre geschätzt.
    wildlife: >-
      Jedes Exemplar der Serbischen Fichte gilt als geschütztes Naturdenkmal. Sie wurde 1875 von Josif Pančić
      im Dorf Đurići entdeckt und wächst nur an zwei Orten in Tara: in der Mileševka-Schlucht und im
      Zvezda-Massiv. Der Park beherbergt 1.156 Gefäßpflanzenarten, ein Drittel der serbischen Flora, darunter
      76 Endemiten.


      Die Tierwelt ist ebenso reichhaltig. Es gibt 59 Säugetierarten und etwa 140 Vogelarten, dazu 12
      Amphibien-, 12 Reptilien- und 19 Fischarten. Hier leben [Braunbär](/especie/ursus_arctos/) und
      [Fischotter](/especie/lutra_lutra/) sowie [Gämse](/especie/rupicapra_rupicapra/),
      [Reh](/especie/capreolus_capreolus/), [Eurasischer Luchs](/especie/lynx_lynx/),
      [Wolf](/especie/canis_lupus/), Goldschakal, [Wildschwein](/especie/sus_scrofa/), Baummarder und
      Wildkatze. Im April 2019 streiften rund 60 Bären durch Tara, 80 % aller Bären Serbiens. Telemetriedaten
      zeigen, dass Bärinnen mit Jungen in festen Revieren verharren, während Männchen weit nach Westen über
      die Drina nach Bosnien wandern. Ein besenderter Bär namens Aleksandar hielt von Mitte November bis Ende
      März Winterruhe und verließ seine Höhle nur zögernd.


      Unter den Vögeln finden sich [Steinadler](/especie/aquila_chrysaetos/),
      [Gänsegeier](/especie/gyps_fulvus/), [Wanderfalke](/especie/falco_peregrinus/),
      [Uhu](/especie/bubo_bubo/), Tannenhäher, Gimpel, Fichtenkreuzschnabel,
      [Schwarzspecht](/especie/dryocopus_martius/), Steinhuhn und [Birkhuhn](/especie/tetrao_tetrix/). Am
      Perućac-Stausee brüten rund 50 Paare des Gänsesägers. Die Pančić-Heuschrecke ist das Wappentier der
      Wirbellosenfauna des Parks, ein endemisches Eiszeitrelikt.
    visit: >-
      Die wichtigsten Besucherzentren sind Kaluđerske Bare im Norden nahe Bajina Bašta und Mitrovac im Süden.
      Der Park ist aus drei Richtungen erreichbar, und ein Schotterstraßennetz verbindet die
      Sehenswürdigkeiten. Am besten beginnt man im Besucherzentrum oder der Touristeninformation. Das Zentrum
      in Mitrovac, eröffnet 2006, war das erste seiner Art in Serbien, ergänzt durch Ausstellungen in Bajina
      Bašta.


      Es gibt 290 km markierte Wanderwege. Die Wege im Zvijezda- und Crni-Vrh-Gebiet beginnen am Rangerposten
      Predov Krst, und eine Hauptroute führt von Kaluđerske Bare zum Zborište. Der Aussichtspunkt Banjska
      Stena wird am meisten besucht; weitere sind Kićac, Vranovina, Veliki Teferič, Mali Teferič und Vranica.
      Drei Radrouten sind ausgeschildert, und die Waldwege bieten beste Bedingungen zum Mountainbiken.


      Der Lehrpfad Banjska Stena umfasst sechs Kilometer moderaten Anstiegs bis zum Aussichtspunkt und bietet
      fünf Rastplätze mit Infotafeln über Waldökologie und Braunbären. Der Lehrpfad Bilješka Stena führt über
      sechs Kilometer von Predov Krst zum Aussichtspunkt, während der Tepih-Livada-Weg ein Moor im
      Schutzgebiet Crveni Potok quert.
    history: >-
      Tara birgt tiefe Geschichtsschichten. In Crveni Tepih wurde der älteste Bleikontaminationsnachweis
      Europas erbracht, datiert auf 3600 v. Chr. Das Rača-Kloster, gegründet von König Dragutin im dreizehnten
      Jahrhundert, ist das bedeutendste Baudenkmal des Parks, und die mittelalterlichen Stećci-Grabsteine von
      Rastište und Perućac wurden 2016 in das UNESCO-Welterbe aufgenommen.


      Tara, der Naturpark Šargan-Mokra Gora, Zlatibor und der bosnische Nationalpark Drina sind als künftiges
      grenzüberschreitendes UNESCO-Biosphärenreservat avisiert.
    before: >-
      Die Besucherzentren in Mitrovac und Bajina Bašta erteilen aktuelle Auskünfte. Offenes Feuer ist nur an
      gekennzeichneten Plätzen erlaubt, wildes Zelten außerhalb untersagt.
    around: >-
      Rund dreißig Kilometer entfernt liegt der [Karstcanyon des Flusses Prača und die
      Govještica-Höhle](/lugar/kanjon-rijeke-prace---pecina-govjestica/).
  it:
    intro: >-
      Nella Serbia occidentale la Drina compie un'ampia ansa racchiudendo una montagna interamente fasciata di
      boschi. Tara è il luogo dove questa curva fluviale diviene parco nazionale: un insieme di gole scoscese,
      un canyon della Drina che precipita da 1.000 a 250 metri con vasti orizzonti verso la Bosnia e la Serbia
      occidentale, e foreste di faggi, abeti bianchi e abeti rossi a perdita d'occhio. Con l'83,5 % del suolo
      ammantato di selve, è l'area più boscosa della Serbia, celebrata come «il polmone della Serbia».


      Il parco è stato istituito nel 1981 e ampliato il 5 ottobre 2015; oggi si estende per 24.991,82 ettari.
      Il culmine montuoso è Kozji Rid (1.591 m), e sulla dorsale di Tara il monte Zborište (1.544 m).
    landscape: >-
      Nella morfologia di Tara l'acqua è l'architetto supremo. Il canyon della Drina è scavato in spessi
      banchi calcarei del Terziario medio, mentre il contiguo monte Zvijezda è separato da Tara dalla profonda
      forra della Derventa. Nel massiccio di Zvijezda si cela la gola più profonda della Serbia, scoperta il
      12 giugno 2010; per via del suo isolamento vi risiedono indisturbati orsi e camosci.


      La foresta rappresenta l'altra metà del paesaggio. Per la conservazione e l'antichità dei suoi
      ecosistemi forestali, Tara è annoverata tra i complessi boschivi più preziosi d'Europa. Prevalgono i
      boschi misti di abete rosso, abete bianco e faggio, che coprono oltre l'85 % della superficie forestata.
      Nove riserve integrali, pari al 16 % del territorio, sono interdette al taglio del legname; alcune sono
      rimaste intatte da secoli, simili a una foresta pluviale temperata. I faggi più longevi supererebbero i
      500 anni.
    wildlife: >-
      Ogni esemplare di abete di Pančić è tutelato come monumento naturale. Fu scoperto dal botanico Josif
      Pančić nel 1875 presso il villaggio di Đurići e alligna spontaneamente in soli due siti di Tara: la
      forra della Mileševka e il massiccio di Zvezda. Il parco accoglie 1.156 specie di piante vascolari, un
      terzo dell'intera flora serba, con 76 endemismi.


      La fauna vanta pari prestigio. Vi sono 59 specie di mammiferi e circa 140 di volatili, oltre a 12 di
      anfibi, 12 di rettili e 19 di pesci. Popolano i versanti l'[orso bruno](/especie/ursus_arctos/) e la
      [lontra europea](/especie/lutra_lutra/), oltre a [camoscio](/especie/rupicapra_rupicapra/),
      [capriolo](/especie/capreolus_capreolus/), [lince eurasiatica](/especie/lynx_lynx/),
      [lupo](/especie/canis_lupus/), sciacallo dorato, [cinghiale](/especie/sus_scrofa/), martora e gatto
      selvatico. Nell'aprile 2019 si contavano circa 60 orsi a Tara, l'80 % di tutti quelli presenti in
      Serbia. Il monitoraggio satellitare rivela che le femmine con cuccioli restano stanziali, mentre i
      maschi si spostano verso ovest oltrepassando la Drina verso la Bosnia. Uno di essi, Aleksandar,
      provvisto di collare GPS, ha svernato da metà novembre a fine marzo restando a lungo nella tana.


      Tra i volatili spiccano [aquila reale](/especie/aquila_chrysaetos/), [grifone](/especie/gyps_fulvus/),
      [falco pellegrino](/especie/falco_peregrinus/), [gufo reale](/especie/bubo_bubo/), nocciolaia,
      ciuffolotto, crociere, [picchio nero](/especie/dryocopus_martius/), coturnice e [fagiano di
      monte](/especie/tetrao_tetrix/). Nel lago Perućac nidificano circa 50 coppie di smergo maggiore. La
      cavalletta di Pančić è l'emblema degli invertebrati del parco, relitto glaciale esclusivo.
    visit: >-
      I principali nodi di fruizione sono Kaluđerske Bare a nord presso Bajina Bašta, e Mitrovac a sud. Si
      accede da tre direttrici principali, e piste sterrate forestali collegano le località d'interesse. Il
      modo migliore per iniziare è sostare in un centro visite o ufficio informazioni. Quello di Mitrovac,
      inaugurato nel 2006, fu il primo del genere in Serbia, affiancato da spazi espositivi a Bajina Bašta.


      La rete comprende 290 km di sentieri tracciati. I percorsi del settore Zvijezda e Crni Vrh partono dal
      presidio di Predov Krst, e un sentiero numerato collega Kaluđerske Bare a Zborište. Il belvedere di
      Banjska Stena è il più frequentato; altri scorci notevoli sono Kićac, Vranovina, Veliki Teferič, Mali
      Teferič e Vranica. Vi sono tre percorsi ciclabili segnati ideali per la mountain bike.


      Il sentiero didattico di Banjska Stena copre sei chilometri con pendenze moderate conducendo al punto
      panoramico, attrezzato con cinque aree di sosta e pannelli illustrativi sulle foreste e sull'orso bruno.
      Il sentiero di Bilješka Stena si snoda per sei chilometri tra Predov Krst e l'omonimo belvedere, mentre
      il tracciato Tepih Livada attraversa una torbiera nella riserva di Crveni Potok.
    history: >-
      Tara custodisce una millenaria memoria storica. A Crveni Tepih è stata rinvenuta la più antica
      testimonianza di inquinamento da piombo in Europa, datata al 3600 a.C. Il monastero di Rača, eretto da
      re Dragutin nel tredicesimo secolo, è il monumento cardine del parco, e le necropoli medievali di stećci
      a Rastište e Perućac sono entrate nel 2016 nel Patrimonio Mondiale UNESCO.


      Tara, i parchi naturali di Šargan-Mokra Gora e Zlatibor assieme al parco nazionale bosniaco della Drina
      sono candidati a formare una futura riserva della biosfera transfrontaliera UNESCO.
    before: >-
      I centri visite di Mitrovac e Bajina Bašta forniscono documentazione per la sicurezza. I fuochi sono
      ammessi solo nelle aree attrezzate ed è vietato il campeggio libero all'esterno.
    around: >-
      A circa trenta chilometri si trova il [Canyon carsico del fiume Prača e grotta
      Govještica](/lugar/kanjon-rijeke-prace---pecina-govjestica/).
  pt:
    intro: >-
      No oeste da Sérvia, o rio Drina descreve um meandro pronunciado abraçando um maciço inteiramente coberto
      por floresta. Tara é o sítio onde essa curva monumental se converte em parque nacional: uma sucessão de
      gargantas alcantiladas, um desfiladeiro do Drina que tomba de 1.000 para 250 metros com amplos
      horizontes sobre a Sérvia ocidental e a Bósnia, e faiais, abetais e espruces até onde a vista alcança.
      Com 83,5 % do território florestado, é a região mais densamente arborizada da Sérvia, apelidada de «o
      pulmão da Sérvia».


      O parque foi instituído em 1981 e ampliado a 5 de outubro de 2015; abrange atualmente 24.991,82
      hectares. O ponto culminante é Kozji Rid (1.591 m), e no planalto da serra de Tara, o monte Zborište
      (1.544 m).
    landscape: >-
      Na orografia de Tara a água é a força motriz. O desfiladeiro do Drina foi talhado em espessos bancos
      calcários do Terciário médio, ficando o maciço vizinho de Zvijezda separado de Tara pela foz da
      Derventa. Em Zvijezda esconde-se a garganta mais profunda da Sérvia, descoberta a 12 de junho de 2010; o
      seu isolamento agreste permitiu a sobrevivência imperturbada de ursos e camurças.


      A floresta compõe a outra metade da paisagem. Pela conservação e variedade dos seus ecossistemas
      florestais, muitos dos quais relictos, Tara figura entre as regiões florestais mais ricas da Europa.
      Predominam os bosques mistos de espruce, abeto e faia, que ocupam mais de 85 % da mancha florestada.
      Nove reservas integrais, equivalentes a 16 % do parque, têm corte de madeira estritamente interdito;
      algumas permaneceram intocadas ao longo de séculos, semelhantes a uma floresta temperada primordial. As
      faias mais antigas ultrapassarão 500 anos de idade.
    wildlife: >-
      Cada exemplar de espruce de Pančić constitui um monumento natural protegido. Foi identificado pelo
      botânico Josif Pančić em 1875 na aldeia de Đurići, crescendo em estado selvagem apenas em dois locais de
      Tara: a garganta do Mileševka e o maciço de Zvezda. O parque acolhe 1.156 espécies de flora vascular, um
      terço de toda a flora da Sérvia, com 76 endemismos.


      A fauna apresenta riqueza equivalente. Estão catalogadas 59 espécies de mamíferos e cerca de 140 de
      aves, além de 12 de anfíbios, 12 de répteis e 19 de peixes. Ocorrem o
      [urso-pardo](/especie/ursus_arctos/) e a [lontra-europeia](/especie/lutra_lutra/), bem como a
      [camurça](/especie/rupicapra_rupicapra/), o [corço](/especie/capreolus_capreolus/), o
      [lince-euroasiático](/especie/lynx_lynx/), o [lobo-ibérico](/especie/canis_lupus/), o chacal-dourado, o
      [javali](/especie/sus_scrofa/), a marta e o gato-bravo. Em abril de 2019 estimavam-se cerca de 60 ursos
      em Tara, correspondendo a 80 % da população total da Sérvia. O seguimento por satélite revela que as
      fêmeas com crias ocupam uma área circunscrita, enquanto os machos realizam deslocações longas para oeste
      cruzando o Drina em direção à Bósnia. Um macho monitorizado, Aleksandar, com coleira GPS, hibernou de
      meados de novembro ao final de março, retardando a saída do covil.


      Nas aves salientam-se a [águia-real](/especie/aquila_chrysaetos/), o [grifo](/especie/gyps_fulvus/), o
      [falcão-peregrino](/especie/falco_peregrinus/), o [bufo-real](/especie/bubo_bubo/), o quebra-nozes, o
      dom-fafe, o cruza-bico, o [pica-pau-preto](/especie/dryocopus_martius/), a perdiz-mourisca e o
      [galo-lira](/especie/tetrao_tetrix/). Na albufeira de Perućac nidificam cerca de 50 casais de
      merganso-grande. O gafanhoto de Pančić é o símbolo dos invertebrados do parque, um endemismo relíquia
      notável.
    visit: >-
      Os núcleos de acolhimento centrais situam-se em Kaluđerske Bare a norte, perto de Bajina Bašta, e em
      Mitrovac a sul. Acede-se ao parque por três vias distintas, e uma malha de estradões florestais de
      macadame liga os sítios cénicos. Recomenda-se iniciar o périplo num centro de visitantes para recolher
      mapas. O de Mitrovac, inaugurado em 2006, foi o primeiro do género na Sérvia, complementado por mostras
      em Bajina Bašta.


      Existem 290 km de trilhos pedestres marcados. As rotas dos setores de Zvijezda e Crni Vrh partem do
      posto florestal de Predov Krst, ligando um trilho numerado Kaluđerske Bare a Zborište. O miradouro de
      Banjska Stena é o mais concorrido; outros incluem Kićac, Vranovina, Veliki Teferič, Mali Teferič e
      Vranica. Três percursos cicláveis encontram-se sinalizados, oferecendo as pistas florestais excelentes
      condições para BTT.


      O trilho didático de Banjska Stena percorre seis quilómetros com desnível moderado até ao miradouro,
      dispondo de cinco áreas de descanso com painéis sobre a floresta e o urso-pardo. O percurso de Bilješka
      Stena cobre seis quilómetros entre Predov Krst e o miradouro homónimo, enquanto o caminho de Tepih
      Livada cruza uma turfeira na reserva de Crveni Potok.
    history: >-
      Tara preserva testemunhos históricos remotos. Em Crveni Tepih foi identificada a contaminação por chumbo
      mais antiga da Europa, datada de 3600 a.C. O mosteiro de Rača, edificado pelo rei Dragutin no século
      XIII, é o monumento maior do parque, e as necrópoles medievais de estelas «stećci» em Rastište e Perućac
      foram classificadas como Património Mundial da UNESCO em 2016.


      Tara, os parques naturais de Šargan-Mokra Gora e Zlatibor e o parque nacional bósnio do Drina estão
      projetados para integrar uma futura reserva da biosfera transfronteiriça da UNESCO.
    before: >-
      Os centros de visitantes de Mitrovac e Bajina Bašta prestam informações para planear a visita. Fogueiras
      só são permitidas nos locais autorizados, sendo interdito o campismo livre fora das zonas próprias.
    around: >-
      A cerca de trinta quilómetros situa-se o [Desfiladeiro Cárstico do Rio Prača e Gruta de
      Govještica](/lugar/kanjon-rijeke-prace---pecina-govjestica/).
