resumen:
  es: >-
    Meseta montañosa cayendo en vertical hacia el cañón del Drina con bosques relictos de picea de Serbia
    (*Picea omorika*).
  en: >-
    Mountainous plateau plunging vertically towards the Drina Canyon, harbouring relict Serbian spruce (*Picea
    omorika*) forests.
  fr: >-
    Plateau montagneux plongeant à pic vers le canyon de la Drina avec des forêts relictuelles d'épicéa de
    Serbie (*Picea omorika*).
  de: >-
    Gebirgshochfläche, die steil zur Drina-Schlucht abfällt, mit Reliktwäldern der Serbischen Fichte (*Picea
    omorika*).
  it: >-
    Altopiano montuoso che precipita sul canyon della Drina, custode di foreste relitte di abete serbo (*Picea
    omorika*).
  pt: >-
    Planalto montanhoso que despenha em vertical sobre o desfiladeiro do Drina, guardando florestas relíquias
    de espruce-da-sérvia (*Picea omorika*).
unico:
  es: >-
    Tara es el refugio de la pícea de Pančić, una conífera relicta y endémica que sobrevivió a la última
    glaciación en los cañones del Drina, y de la mayor población de oso pardo de Serbia.
  en: >-
    Tara is the sanctuary of Pančić's spruce, a relict and endemic conifer that survived the last ice age in
    the Drina canyons, and home to Serbia's largest brown bear population.
  fr: >-
    Tara est le sanctuaire de l'épicéa de Pančić, conifère relictuel et endémique ayant survécu à la dernière
    glaciation dans les défilés de la Drina, et abrite la plus grande population d'ours bruns de Serbie.
  de: >-
    Tara ist das Refugium der Pančić-Fichte, eines Reliktnadelbaums, der die letzte Eiszeit in den Schluchten
    der Drina überdauerte, und Heimat der größten Braunbärenpopulation Serbiens.
  it: >-
    Tara è il santuario dell'abete di Pančić, conifera relitta ed endemica scampata all'ultima glaciazione
    nelle forre della Drina, e dimora della maggiore popolazione di orso bruno della Serbia.
  pt: >-
    Tara é o santuário do espruce de Pančić, uma conífera relíquia e endémica que sobreviveu à última
    glaciação nos desfiladeiros do Drina, e alberga a maior população de urso-pardo da Sérvia.
observaciones:
