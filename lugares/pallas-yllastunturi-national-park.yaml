resumen:
  es: >-
    El Parque Nacional más visitado de Finlandia (1.020 km²), una cadena de colinas de tundra (*tunturi*) con
    la estación de medición del aire más limpio del planeta (Sammaltunturi).
  en: >-
    Finland's most visited national park (1,020 km²), a chain of tundra fell hills (*tunturi*) hosting the
    cleanest air measuring station on Earth (Sammaltunturi).
  fr: >-
    Le parc national le plus visité de Finlande (1 020 km²), une chaîne de monts de toundra (*tunturi*)
    abritant la station de mesure de l'air le plus pur de la planète (Sammaltunturi).
  de: >-
    Finnlands meistbesuchter Nationalpark (1.020 km²), eine Kette baumloser Tundrenberge (*tunturi*) mit der
    Messstation für die sauberste Luft der Erde (Sammaltunturi).
  it: >-
    Il parco nazionale più visitato della Finlandia (1.020 km²), una catena di colline di tundra (*tunturi*)
    che ospita la stazione con l'aria più pura del pianeta (Sammaltunturi).
  pt: >-
    O parque nacional mais visitado da Finlândia (1.020 km²), uma cadeia de colinas de tundra (*tunturi*) com
    a estação de medição do ar mais limpo do planeta (Sammaltunturi).
unico:
  es: >-
    En una misma travesía caminas sobre las colinas de una cordillera erosionada, bajo un aire que figura
    entre los más limpios del mundo.
  en: >-
    On a single trek you walk across the crests of an ancient eroded mountain range beneath air ranked among
    the purest on the planet.
  fr: >-
    En une seule randonnée, vous parcourez les crêtes d'une ancienne chaîne érodée, sous un air qui figure
    parmi les plus purs du monde.
  de: >-
    Auf einer einzigen Tour wanderst du über die Kuppen eines uralten Rumpfgebirges unter einer Luft, die zu
    den reinsten unseres Planeten gehört.
  it: >-
    In una sola traversata cammini sui crinali di un'antica catena montuosa erosa, sotto un'aria tra le più
    incontaminate del pianeta.
  pt: >-
    Numa única travessia caminhas sobre as cristas de uma cordilheira antiga erodida, sob um ar que figura
    entre os mais puros do mundo.
observaciones:
  es: >-
    Hetta se conecta en autobús con Rovaniemi y Kolari, y los autobuses de Kolari enlazan también con Muonio y
    Pallas. Quien parte de Hetta debe cruzar el lago Ounasjärvi para alcanzar el parque; hay servicios de
    barca.
texto:
  es:
    intro: >-
      Una cadena de colinas redondas, sin un solo árbol en la cima, se alarga por la Laponia occidental. No
      son montañas jóvenes: son los restos de una cordillera plegada tan antigua que el tiempo la ha dejado en
      pura base. Eso es Pallas-Yllästunturi, el tercer parque nacional más grande de Finlandia, con 1.020 km²
      repartidos entre Enontekiö, Kittilä, Kolari y Muonio.
    landscape: >-
      La palabra clave es *kero*, que en finés designa la cima redonda y sin árboles de una colina. El punto
      más alto del parque es Taivaskero, en las colinas de Pallastunturi, a 809 metros; a su lado están
      Pyhäkero, Lumikero, Laukukero y Palkaskero. Entre ellas el paisaje cambia rápido: turberas, bosques de
      brezal, bosques maduros en estado natural, colinas abiertas y bosques ricos en hierbas.


      El pino silvestre, la pícea y el abedul de montaña dominan el arbolado. Arriba, donde ya no hay árboles,
      crecen abedul enano, gayuba alpina y camarina. Más abajo, en los bosques húmedos y maduros viven el
      geranio de bosque, el cornejo enano y muchas especies raras de musgos y hongos. En las turberas florecen
      el té de Labrador y el algodón de turbera, y en las zonas calcáreas hay orquídeas raras.


      El aire merece mención aparte. En la estación meteorológica de Sammaltunturi se mide, según la OMS, uno
      de los aires más limpios del mundo.
    wildlife: >-
      Aquí se mezclan las aves del norte y las del sur. Entre las del norte están el [lagópodo
      alpino](/especie/lagopus_muta/), el lagópodo común y el chorlito carambolo; en las píceas, el mirlo
      común y el mosquitero silbador. En el bosque busca páridos, arrendajos siberianos y camachuelos
      picogruesos, y en los arroyos, el mirlo acuático, que bucea en el agua corriente también en invierno.
      Cuando abundan los topillos, aumentan los búhos y las rapaces. Las aves del norte se ven desde los
      senderos y las áreas de descanso de Fell Lapland, igual que el chorlito dorado, el escribano nival y el
      págalo rabero.


      Entre los grandes mamíferos están el [reno](/especie/rangifer_tarandus/) y el
      [alce](/especie/alces_alces/). En verano los renos pasan mucho tiempo en las colinas y en las turberas,
      y en los senderos puedes cruzarte con ellos. El [oso pardo](/especie/ursus_arctos/) y el
      [lince](/especie/lynx_lynx/) viven de forma permanente en el parque; también hay liebre variable, zorro
      rojo, comadreja, lemming noruego y ardilla roja.


      El año es un contraste. El invierno trae noche polar en diciembre y enero, heladas de hasta menos 30
      grados y, en noches despejadas, auroras boreales; la nieve llega a su máximo espesor en marzo y abril,
      con más de un metro. El verano empieza a mediados de junio y en junio y julio el sol de medianoche
      ilumina la zona. A partir de mediados de septiembre llegan los colores del otoño, que duran de dos a
      tres semanas, y la primera nevada suele caer después de mediados de octubre. Mientras tanto, en las
      laderas puedes recoger arándanos, y en las turberas inclinadas, moras de los pantanos.
    visit: >-
      El parque tiene 340 km de senderos de verano señalizados y más de 500 km de pistas de esquí. La travesía
      clásica es Hetta–Pallas, de 55 km, la ruta señalizada más antigua de Finlandia: sigue las mesetas de las
      colinas, baja a barrancos y sube a la cima de varias de ellas. A lo largo del camino hay refugios de
      monte y de alquiler; los de Hannukuru quedan a 28 km de Hetta y a 27 km de Pallas. Se puede hacer
      también con esquís en invierno, pero exige experiencia y una planificación cuidadosa.


      Si prefieres jornadas cortas, las excursiones de un día más populares son Pyhäkero, Taivaskeron kierros,
      Pirunkurun ponnistus, Varkaankurun polku, Kesänkijärven kierros y Tuomikurun kierros. En el área de
      Ylläs puedes subir con raquetas a Kukastunturi o caminar hasta el refugio de Tuomikuru. En el área de
      Pallas, en cambio, no hay senderos señalizados para raquetas, porque el viento endurece la nieve en las
      colinas abiertas.


      El parque tiene tres centros de visitantes: Kellokas en Yllästunturi, Pallastunturi y el de Fell
      Lapland, en Hetta. Sus exposiciones, entre ellas Meän elämää y Vuovjjuš-Kulkijat, presentan la
      naturaleza y la cultura de la zona, esta última dedicada a la cultura sami y a la naturaleza de las
      colinas.
    history: >-
      La zona está habitada desde la Edad de Piedra, sobre todo por los sami, en una zona fronteriza
      culturalmente interesante. Hoy las cooperativas de pastoreo de Alakylä, Kyrö, Muonio y Näkkälä usan el
      parque como zona de pasto y cría de renos. Muchos topónimos locales son de origen sami: kaltio, kero,
      lompolo, mella, vuoma y vuontis son ejemplos de préstamos.


      La idea de crear parques nacionales surgió en 1910, y el botánico Kaarlo Linkola tuvo un papel clave en
      el de las colinas de Pallastunturi. Pallas-Ounastunturi fue uno de los dos primeros parques nacionales
      de Finlandia, fundado en 1938. En los años treinta Pallas ya era un destino turístico popular, y el
      camino de Pallas a Hetta se señalizó en 1934. En 1952 la llama olímpica de Finlandia se encendió en la
      cima de Taivaskero. En 2005 el parque se unió a la reserva Ylläs-Aakenus y se creó el actual, que dobla
      el tamaño del anterior. Tiene el certificado de la Carta Europea, que concede la federación EUROPARC.
    before: >-
      Hetta se conecta en autobús con Rovaniemi y Kolari, y los autobuses de Kolari enlazan también con Muonio
      y Pallas. Quien parte de Hetta debe cruzar el lago Ounasjärvi para alcanzar el parque; hay servicios de
      barca.
    around: >-
      La [Reserva Natural de Vindelfjällen](/lugar/vindelfjallens-naturreservat/) comparte con Pallas el
      lagópodo alpino, el chorlito dorado y el zorro ártico, además de las montañas y los humedales. El
      [Parque Nacional de Sarek](/lugar/sarek-national-park/) también tiene alta montaña y oso pardo.
  en:
    intro: >-
      A chain of rounded, treeless fells stretches across western Lapland. These are no young alpine crags:
      they are the eroded remnants of an ancient folded mountain range worn down to its bedrock roots by deep
      time. This is Pallas-Yllästunturi, Finland's third-largest national park, spanning 1,020 km² across
      Enontekiö, Kittilä, Kolari, and Muonio.
    landscape: >-
      The key word is *kero*, which in Finnish describes the rounded, treeless summit of a fell. The highest
      peak in the park is Taivaskero in the Pallastunturi fells at 809 meters; beside it rise Pyhäkero,
      Lumikero, Laukukero, and Palkaskero. Between them the landscape shifts abruptly: aapa mires, heath
      forests, pristine old-growth woods, open fell tops, and herb-rich gullies.


      Scots pine, Norway spruce, and mountain birch dominate the timberline. Higher up, where trees cannot
      survive, dwarf birch, alpine bearberry, and crowberry take over. Lower down, in humid old-growth
      forests, wood cranesbill, dwarf cornel, and numerous rare mosses and fungi thrive. In the peatlands
      bloom Labrador tea and cotton grass, while lime-rich pockets shelter delicate wild orchids.


      The air merits special distinction. At the Sammaltunturi atmospheric station, researchers
      record—according to the WHO—some of the cleanest air on the globe.
    wildlife: >-
      Northern and southern avifauna meet here. High-latitude birds include the [rock
      ptarmigan](/especie/lagopus_muta/), willow grouse, and Eurasian dotterel; spruce forests shelter the
      blackbird and wood warbler. In deep woodlands look for tits, Siberian jays, and pine grosbeaks; along
      mountain streams the white-throated dipper dives into rushing water even in the depths of winter. When
      voles are plentiful, owls and raptors surge. Fell birds can be observed from trails and rest stops in
      Fell Lapland, including the European golden plover, snow bunting, and long-tailed jaeger.


      Large mammals include the [caribou](/especie/rangifer_tarandus/) and [moose](/especie/alces_alces/). In
      summer reindeer linger on windy fells and open peatlands, frequently crossing hiking paths. The [brown
      bear](/especie/ursus_arctos/) and [Eurasian lynx](/especie/lynx_lynx/) maintain resident populations in
      the park; mountain hare, red fox, least weasel, Norwegian lemming, and red squirrel are also widespread.


      The annual cycle is one of sharp contrasts. Winter brings polar night throughout December and January,
      temperatures plunging to minus 30 degrees, and blazing northern lights on clear nights; the snowpack
      peaks in March and April at over one meter deep. Summer arrives in mid-June, bathed in midnight sun
      through June and July. By mid-September the vibrant autumn ruska sets the hills aflame for two to three
      weeks, and the first permanent snows typically fall after mid-October. Meanwhile, you can forage for
      bilberries on fell slopes and cloudberries in sloping mires.
    visit: >-
      The park features 340 km of marked summer hiking trails and over 500 km of cross-country ski tracks. The
      classic traverse is Hetta–Pallas, a 55 km trail that is Finland's oldest marked trekking route: it
      follows open fell plateaus, plunges into steep ravines, and summits several iconic peaks. Along the way
      stand wilderness and rental huts; the huts at Hannukuru lie 28 km from Hetta and 27 km from Pallas. It
      can also be undertaken on skis in winter, though it demands backcountry experience and meticulous
      planning.


      For day trips, popular shorter options include Pyhäkero, Taivaskeron kierros, Pirunkurun ponnistus,
      Varkaankurun polku, Kesänkijärven kierros, and Tuomikurun kierros. In the Ylläs sector you can snowshoe
      up Kukastunturi or walk to the Tuomikuru lean-to shelter. In the Pallas sector, by contrast, there are
      no marked snowshoe routes, as prevailing winds hard-pack the snow across the exposed fell tops.


      The park operates three visitor centers: Kellokas in Yllästunturi, Pallastunturi, and Fell Lapland in
      Hetta. Their exhibits, including Meän elämää and Vuovjjuš-Kulkijat, interpret regional ecology and
      heritage, the latter celebrating Sami culture and fell wilderness.
    history: >-
      The area has been inhabited since the Stone Age, primarily by the Sami, across a culturally fascinating
      borderland. Today the reindeer-herding cooperatives of Alakylä, Kyrö, Muonio, and Näkkälä use the park
      for grazing and reindeer breeding. Many local place-names are of Sami origin: kaltio, kero, lompolo,
      mella, vuoma, and vuontis are loanwords from that legacy.


      The idea of establishing national parks emerged in 1910, with botanist Kaarlo Linkola playing a central
      role in advocating for the Pallastunturi fells. Pallas-Ounastunturi became one of Finland's first two
      national parks when founded in 1938. By the nineteen-thirties Pallas was already a celebrated tourist
      destination, and the trail from Pallas to Hetta was marked out in 1934. In 1952 Finland's Olympic flame
      was lit atop Taivaskero. In 2005 the park merged with the Ylläs-Aakenus reserve to create the current
      national park, doubling its previous expanse. It holds the European Charter for Sustainable Tourism
      awarded by the EUROPARC Federation.
    before: >-
      Winter travel requires cold-weather gear, map, compass, and navigation skills: blizzards can obliterate
      tracks and reduce visibility to zero within minutes. Stick to marked trails in sensitive tundra zones to
      prevent trampling erosion. Campfires are permitted only at designated fire pits using provided firewood.
    around: >-
      To the west and south, other northern sanctuaries preserve Arctic fellscapes. [Vindelfjällen Nature
      Reserve](/lugar/vindelfjallens-naturreservat/) and [Sarek National Park](/lugar/sarek-national-park/)
      protect vast contiguous expanses of Scandinavian tundra, sheltering reindeer, rock ptarmigan, and alpine
      wildlife.
  fr:
    intro: >-
      Une chaîne de collines arrondies, sans un seul arbre à leur sommet, ondule à travers la Laponie
      occidentale. Ce ne sont pas des montagnes jeunes : ce sont les reliques d'un ancien massif plissé que
      l'érosion a raboté jusqu'à son socle primitif. C'est Pallas-Yllästunturi, le troisième plus grand parc
      national de Finlande, avec 1 020 km² répartis entre Enontekiö, Kittilä, Kolari et Muonio.
    landscape: >-
      Le mot clé est *kero*, qui désigne en finnois le sommet dénudé et arrondi d'un mont. Le point culminant
      du parc est Taivaskero, dans les fells de Pallastunturi, à 809 mètres ; à ses côtés se dressent
      Pyhäkero, Lumikero, Laukukero et Palkaskero. Entre eux, le paysage change rapidement : tourbières
      d'aapa, forêts de bruyère, forêts anciennes vierges, fells dénudés et ravins riches en herbes.


      Le pin sylvestre, l'épicéa et le bouleau pubescent tortueux dominent les versants. Plus haut, là où les
      arbres s'effacent, s'installent le bouleau nain, la busserole des Alpes et la camarine noire. Plus bas,
      dans les sous-bois humides et anciens, prospèrent le géranium des bois, le cornouiller de Suède et une
      foule de mousses et de champignons rares. Dans les tourbières fleurissent le lédon des marais et la
      linaigrette, tandis que les sols calcaires abritent des orchidées rares.


      L'air mérite une mention d'exception. À la station météorologique de Sammaltunturi, on enregistre, selon
      l'OMS, l'un des airs les plus purs du globe.
    wildlife: >-
      Les oiseaux du nord et du sud se mêlent ici. Parmi les espèces nordiques figurent le [lagopède
      alpin](/especie/lagopus_muta/), le lagopède des saules et le pluvier guignard ; dans les pessières
      vivent le merle noir et le pouillot siffleur. En forêt, cherchez les mésanges, le mésangeai imitateur et
      le durbec des sapins ; le long des ruisseaux, le cincle plongeur plonge dans les eaux vives même au cœur
      de l'hiver. Lorsque les campagnols abondent, chouettes et rapaces se multiplient. Les oiseaux des fells
      s'observent le long des sentiers de Fell Lapland, tout comme le pluvier doré, le bruant des neiges et le
      labbe à longue queue.


      Parmi les grands mammifères se trouvent le [renne](/especie/rangifer_tarandus/) et
      l'[élan](/especie/alces_alces/). En été, les rennes séjournent volontiers sur les hauteurs et dans les
      tourbières, croisant fréquemment les randonneurs sur les sentiers. L'[ours brun](/especie/ursus_arctos/)
      et le [lynx boréal](/especie/lynx_lynx/) résident en permanence dans le parc ; on y croise aussi le
      lièvre variable, le renard roux, la belette, le lemming des toundras et l'écureuil roux.


      L'année est faite de contrastes saisissants. L'hiver apporte la nuit polaire en décembre et janvier, des
      gelées descendant jusqu'à moins 30 degrés et de superbes aurores boréales par ciel dégagé ; le manteau
      neigeux culmine en mars et avril avec plus d'un mètre d'épaisseur. L'été s'installe à la mi-juin,
      éclairé par le soleil de minuit en juin et juillet. À la mi-septembre, la féerie de la ruska pare les
      monts de couleurs éclatantes durant deux à trois semaines, et les premières neiges tombent généralement
      après la mi-octobre. Entre-temps, vous pouvez récolter myrtilles sur les pentes et plaquettes dans les
      tourbières.
    visit: >-
      Le parc compte 340 km de sentiers estivaux balisés et plus de 500 km de pistes de ski de fond. La grande
      traversée classique est Hetta–Pallas, longue de 55 km, qui constitue le plus ancien sentier balisé de
      Finlande : elle suit les crêtes dénudées, descend dans des gorges et gravit plusieurs sommets
      emblématiques. Tout au long de l'itinéraire se trouvent des refuges ouverts et à réserver ; ceux
      d'Hannukuru se situent à 28 km d'Hetta et à 27 km de Pallas. L'itinéraire peut aussi se parcourir à skis
      en hiver, mais requiert une solide expérience et une préparation soignée.


      Pour des sorties à la journée, les boucles les plus populaires sont Pyhäkero, Taivaskeron kierros,
      Pirunkurun ponnistus, Varkaankurun polku, Kesänkijärven kierros et Tuomikurun kierros. Dans le secteur
      d'Ylläs, vous pouvez gravir Kukastunturi en raquettes ou marcher jusqu'à l'abri de Tuomikuru. En
      revanche, à Pallas, il n'y a pas d'itinéraires balisés pour raquettes, le vent durcissant la neige sur
      les crêtes découvertes.


      Le parc possède trois centres des visiteurs : Kellokas à Yllästunturi, Pallastunturi et celui de Fell
      Lapland à Hetta. Leurs expositions, dont Meän elämää et Vuovjjuš-Kulkijat, présentent la nature et la
      culture locales, cette dernière étant consacrée aux traditions samies et à la vie dans les fells.
    history: >-
      La région est habitée depuis l'âge de la pierre, surtout par les Samis, au cœur d'une zone frontière
      culturellement fascinante. Aujourd'hui, les coopératives pastorales d'Alakylä, Kyrö, Muonio et Näkkälä
      utilisent le parc pour le pâturage et l'élevage des rennes. De nombreux toponymes locaux sont d'origine
      samie : kaltio, kero, lompolo, mella, vuoma et vuontis en sont des exemples.


      L'idée de créer des parcs nationaux est née en 1910, le botaniste Kaarlo Linkola jouant un rôle clé pour
      la protection des fells de Pallastunturi. Pallas-Ounastunturi fut l'un des deux premiers parcs nationaux
      de Finlande, fondé en 1938. Dans les années trente, Pallas était déjà une destination touristique
      prisée, et l'itinéraire de Pallas à Hetta fut balisé en 1934. En 1952, la flamme olympique finlandaise
      fut allumée au sommet de Taivaskero. En 2005, le parc fusionna avec la réserve d'Ylläs-Aakenus pour
      former le parc actuel, doublant sa superficie. Il bénéficie de la Charte européenne du tourisme durable
      décernée par la fédération EUROPARC.
    before: >-
      En hiver, prévoyez un équipement grand froid, carte et boussole : les tempêtes de neige peuvent effacer
      les traces et réduire la visibilité à néant en quelques minutes. Restez sur les sentiers balisés dans
      les zones de toundra fragile pour éviter l'érosion. Les feux ne sont autorisés qu'aux emplacements
      aménagés avec le bois fourni.
    around: >-
      À l'ouest et au sud, d'autres sanctuaires boréaux partagent ces immensités arctiques. La [Réserve
      naturelle de Vindelfjällen](/lugar/vindelfjallens-naturreservat/) et le [Parc national de
      Sarek](/lugar/sarek-national-park/) abritent de vastes étendues de toundra scandinave, avec rennes,
      lagopèdes alpins et faune montagnarde boréale.
  de:
    intro: >-
      Eine Kette sanft gerundeter, baumloser Höhenzüge erstreckt sich durch Westlappland. Es sind keine jungen
      Hochgebirge, sondern die Rumpfreste eines urzeitlichen Faltengebirges, das die Jahrmillionen bis auf den
      Sockel abgetragen haben. Das ist Pallas-Yllästunturi, der drittgrößte Nationalpark Finnlands, der 1.020
      km² auf die Gemeinden Enontekiö, Kittilä, Kolari und Muonio verteilt.
    landscape: >-
      Das Schlüsselwort lautet *kero*, das im Finnischen die gerundete, baumlose Kuppe eines Fjellberges
      bezeichnet. Höchster Punkt des Parks ist der Taivaskero in den Pallastunturi-Bergen mit 809 Metern;
      daneben erheben sich Pyhäkero, Lumikero, Laukukero und Palkaskero. Dazwischen wechselt die Landschaft
      abrupt: Aapa-Moore, lichte Heidekiefernwälder, naturbelassene Urwälder, baumfreie Kuppen und
      kräuterreiche Schluchten.


      Waldkiefer, Fichte und Fjellbirke prägen die Waldstufe. Oben, wo Bäume nicht mehr existieren können,
      breiten sich Zwergbirke, Alpen-Bärentraube und Krähenbeere aus. Weiter unten, in den feuchten
      Altwäldern, gedeihen Wald-Storchschnabel, Schwedischer Hartriegel und viele seltene Moos- und Pilzarten.
      Auf den Mooren blühen Sumpfporst und Wollgras, während kalkhaltige Lagen seltene Orchideen beherbergen.


      Die Luft verdient besondere Beachtung. An der meteorologischen Station Sammaltunturi registrieren
      Forscher laut WHO eine der saubersten Luftproben weltweit.
    wildlife: >-
      Hier begegnen sich Vögel des Nordens und des Südens. Zu den nordischen Arten zählen
      [Alpenschneehuhn](/especie/lagopus_muta/), Moorschneehuhn und Mornellregenpfeifer; in den Fichtenwäldern
      leben Amsel und Waldlaubsänger. Im Wald kannst du Meisen, Unglückshäher und Hakengimpel beobachten; an
      Bergbächen taucht die Wasseramsel selbst im tiefsten Winter nach Nahrung. In Wühlmausjahren steigen die
      Bestände von Eulen und Greifvögeln stark an. Fjellvögel lassen sich entlang der Pfade von Fjell-Lappland
      gut sichten, ebenso Goldregenpfeifer, Schneeammer und Schmarotzerraubmöwe.


      Unter den Großsäugern finden sich das [Ren](/especie/rangifer_tarandus/) und der
      [Elch](/especie/alces_alces/). Im Sommer halten sich Rentiere gern auf den Fjellkuppen und Mooren auf
      und kreuzen oft die Wanderpfade. Der [Braunbär](/especie/ursus_arctos/) und der [Eurasische
      Luchs](/especie/lynx_lynx/) leben ganzjährig im Park; auch Schneehase, Rotfuchs, Mauswiesel, Berglemming
      und Eichhörnchen sind heimisch.


      Das Jahr zeigt extreme Gegensätze. Der Winter bringt im Dezember und Januar Polarnacht, Fröste bis unter
      minus 30 Grad und bei klarem Himmel Polarlichter; die Schneedecke erreicht im März und April mit über
      einem Meter ihren Höchststand. Der Sommer beginnt Mitte Juni, wenn die Mitternachtssonne den Norden
      taghell erleuchtet. Ab Mitte September taucht die Ruska-Färbung die Fjellberge zwei bis drei Wochen lang
      in leuchtende Töne, und der erste Schnee fällt meist nach Mitte Oktober. Währenddessen kannst du an den
      Hängen Heidelbeeren und in den Hangmooren Moltebeeren pflücken.
    visit: >-
      Der Park bietet 340 km markierte Sommerwanderwege und über 500 km Skiloipen. Die klassische
      Trekkingroute ist der 55 km lange Hetta–Pallas-Trail, Finnlands ältester markierter Wanderpfad: Er folgt
      den Hochebenen der Fjells, steigt in Schluchten ab und erklimmt mehrere markante Gipfel. Entlang des
      Weges stehen Schutz- und Miethütten; die Hütten von Hannukuru liegen 28 km von Hetta und 27 km von
      Pallas entfernt. Die Route lässt sich im Winter auch auf Skiern bewältigen, verlangt aber alpine
      Erfahrung und sorgfältige Planung.


      Für Tagestouren bieten sich beliebte Rundwege wie Pyhäkero, Taivaskeron kierros, Pirunkurun ponnistus,
      Varkaankurun polku, Kesänkijärven kierros und Tuomikurun kierros an. Im Ylläs-Gebiet kannst du mit
      Schneeschuhen den Kukastunturi besteigen oder zur Hütte Tuomikuru wandern. Im Pallas-Gebiet gibt es
      dagegen keine markierten Schneeschuhtrails, da der Wind den Schnee auf den Fjellkuppen stark verharscht.


      Der Park unterhält drei Besucherzentren: Kellokas in Yllästunturi, Pallastunturi und das
      Fell-Lapland-Zentrum in Hetta. Ihre Ausstellungen, darunter Meän elämää und Vuovjjuš-Kulkijat,
      vermitteln Natur und Kultur der Region, letztere mit Fokus auf die Kultur der Samen.
    history: >-
      Das Gebiet ist seit der Steinzeit vor allem von Samen besiedelt, in einem kulturell faszinierenden
      Grenzraum. Heute nutzen die Rentierzucht-Kooperativen von Alakylä, Kyrö, Muonio und Näkkälä den Park als
      Weide- und Zuchtgebiet. Viele lokale Flurnamen stammen aus dem Samischen: kaltio, kero, lompolo, mella,
      vuoma und vuontis sind Lehnwörter aus dieser Tradition.


      Die Idee zur Ausweisung von Nationalparks entstand 1910, wobei der Botaniker Kaarlo Linkola eine
      Schlüsselrolle für die Pallastunturi-Fjells spielte. Pallas-Ounastunturi zählte zu den beiden ersten
      Nationalparks Finnlands bei seiner Gründung im Jahr 1938. In den dreißiger Jahren war Pallas bereits ein
      beliebtes Reiseziel, und der Pfad von Pallas nach Hetta wurde 1934 markiert. 1952 wurde das finnische
      olympische Feuer auf dem Gipfel des Taivaskero entzündet. 2005 vereinigte sich der Park mit dem Reservat
      Ylläs-Aakenus zum heutigen Nationalpark, der seine Fläche verdoppelte. Er trägt das Zertifikat der
      Europäischen Charta für nachhaltigen Tourismus von EUROPARC.
    before: >-
      Im Winter sind Kälteausrüstung, Karte und Kompass unerlässlich: Schneestürme können Spuren innerhalb von
      Minuten verwehen und die Sicht auf null reduzieren. Bleibe in der empfindlichen Tundra auf markierten
      Wegen, um Trittschäden zu vermeiden. Lagerfeuer sind nur an offiziellen Feuerstellen mit
      bereitgestelltem Holz gestattet.
    around: >-
      Im Westen und Süden bewahren weitere Schutzgebiete arktische Gebirgslandschaften. Das [Naturreservat
      Vindelfjällen](/lugar/vindelfjallens-naturreservat/) und der [Nationalpark
      Sarek](/lugar/sarek-national-park/) schützen weite zusammenhängende Tundrengebiete Skandinaviens mit
      Rentieren, Alpenschneehühnern und arktischer Gebirgsfauna.
  it:
    intro: >-
      Una catena di rilievi arrotondati, privi di alberi sulla sommità, si allunga nella Lapponia occidentale.
      Non sono montagne giovani: sono i resti erosi di un'antichissima dorsale che il tempo ha spianato fino
      al basamento roccioso. È Pallas-Yllästunturi, il terzo parco nazionale più esteso della Finlandia, con
      1.020 km² distribuiti tra Enontekiö, Kittilä, Kolari e Muonio.
    landscape: >-
      Il termine fondamentale è *kero*, che in finlandese indica la cima tondeggiante e spoglia di una collina
      di tundra. Il rilievo più alto del parco è Taivaskero, nelle colline di Pallastunturi, a 809 metri;
      accanto sorgono Pyhäkero, Lumikero, Laukukero e Palkaskero. Tra di esse il paesaggio muta
      all'improvviso: torbiere aapa, pinete su brughiera, foreste vetuste primigenie, altipiani aperti e
      valloni ricchi di vegetazione erbacea.


      Il pino silvestre, l'abete rosso e la betulla tortuosa dominano i pendii boscosi. In alto, dove gli
      alberi non crescono più, prosperano la betulla nana, l'uva ursina alpina e l'empétro nero. Più in basso,
      nei boschi umidi e maturi vivono il geranio silvano, il corniolo svedese e molte specie rare di muschi e
      funghi. Nelle torbiere fioriscono il tè del Labrador e l'erioforo, mentre i suoli calcarei accolgono
      orchidee rare.


      L'aria merita un elogio speciale. Alla stazione meteorologica di Sammaltunturi viene rilevata, stando
      all'OMS, una delle arie più pure al mondo.
    wildlife: >-
      Qui si incontrano le comunità ornitologiche del nord e del sud. Tra le specie nordiche spiccano la
      [pernice bianca](/especie/lagopus_muta/), la pernice bianca nordica e il piviere tortolino; nelle
      abetaie vivono il merlo e il luì verde. Nei boschi puoi scorgere cince, ghiandaie siberiane e
      ciuffolotti delle pinete, mentre lungo i torrenti il merlo acquaiolo s'immerge nelle acque correnti
      anche in pieno inverno. Negli anni di abbondanza di arvicole aumentano rapaci e strigiformi. Gli uccelli
      di tundra si osservano agevolmente dai sentieri di Fell Lapland, come pure il piviere dorato, lo zigolo
      delle nevi e il labbo codalunga.


      Tra i grandi mammiferi sono presenti la [renna / caribù](/especie/rangifer_tarandus/) e
      l'[alce](/especie/alces_alces/). In estate le renne sostano a lungo sulle alture e nelle torbiere,
      incrociando spesso i passi degli escursionisti. L'[orso bruno](/especie/ursus_arctos/) e la [lince
      eurasiatica](/especie/lynx_lynx/) vivono stabilmente nel parco; si trovano pure lepre variabile, volpe
      rossa, donnola, lemming norvegese e scoiattolo comune.


      Le stagioni offrono forti contrasti. L'inverno porta la notte polare a dicembre e gennaio, gelate fino a
      meno 30 gradi e aurore boreali nelle notti serene; il manto nevoso tocca il massimo spessore a marzo e
      aprile, superando il metro. L'estate inizia a metà giugno, rischiarata dal sole di mezzanotte in giugno
      e luglio. Da metà settembre esplode la ruska con le sue tinte autunnali per due o tre settimane, e la
      prima neve cade di norma dopo la metà di ottobre. Nel frattempo, sui pendii puoi cogliere mirtilli e
      nelle torbiere inclinate more artiche.
    visit: >-
      Il parco vanta 340 km di sentieri estivi segnalati e oltre 500 km di piste da fondo. La traversata
      classica è la Hetta–Pallas di 55 km, il percorso segnalato più antico della Finlandia: segue i pianori
      dei rilievi, scende in gole boscose e raggiunge la vetta di varie cime. Lungo il tracciato sorgono
      rifugi liberi e capanni a noleggio; quelli di Hannukuru distano 28 km da Hetta e 27 km da Pallas. Si può
      compiere anche sugli sci in inverno, ma richiede esperienza e una programmazione meticolosa.


      Per gite giornaliere, le mete più popolari sono Pyhäkero, Taivaskeron kierros, Pirunkurun ponnistus,
      Varkaankurun polku, Kesänkijärven kierros e Tuomikurun kierros. Nel comprensorio di Ylläs puoi salire
      con le ciaspole sul Kukastunturi o raggiungere il bivacco di Tuomikuru. Nell'area di Pallas, invece, non
      vi sono percorsi segnalati per racchette, poiché il vento rende la neve durissima sui pianori aperti.


      Il parco dispone di tre centri visitatori: Kellokas a Yllästunturi, Pallastunturi e quello di Fell
      Lapland a Hetta. Le loro esposizioni, tra cui Meän elämää e Vuovjjuš-Kulkijat, illustrano la natura e la
      storia della regione, quest'ultima focalizzata sulla civiltà sami e sugli ambienti d'alta quota.
    history: >-
      L'area è abitata fin dall'età della pietra, specialmente dai sami, in una zona di confine dal grande
      fascino culturale. Oggi le cooperative di allevamento di Alakylä, Kyrö, Muonio e Näkkälä utilizzano il
      parco per il pascolo e la riproduzione delle renne. Numerosi toponimi locali derivano dal sami: kaltio,
      kero, lompolo, mella, vuoma e vuontis ne sono chiari esempi.


      L'idea di istituire parchi nazionali sorse nel 1910, e il botanico Kaarlo Linkola ebbe un ruolo
      determinante per le alture di Pallastunturi. Pallas-Ounastunturi fu uno dei primi due parchi nazionali
      della Finlandia, fondato nel 1938. Negli anni trenta Pallas era già un'ambita meta turistica, e
      l'itinerario da Pallas a Hetta fu tracciato nel 1934. Nel 1952 la fiamma olimpica della Finlandia fu
      accesa in vetta al Taivaskero. Nel 2005 il parco è stato unito alla riserva di Ylläs-Aakenus istituendo
      l'attuale parco nazionale, che raddoppia la superficie originaria. È insignito della Carta Europea per
      il turismo sostenibile conferita da EUROPARC.
    before: >-
      In inverno è essenziale un equipaggiamento per climi rigidi, con mappa e bussola: le bufere di neve
      possono cancellare ogni traccia e azzerare la visibilità in pochi minuti. Rimani sui sentieri tracciati
      nella tundra fragile per scongiurare l'erosione da calpestio. I fuochi sono permessi solo nelle aree
      predisposte usando la legna fornita.
    around: >-
      A occidente e a mezzogiorno, altre riserve del Grande Nord preservano paesaggi artici simili. La
      [Riserva Naturale di Vindelfjällen](/lugar/vindelfjallens-naturreservat/) e il [Parco Nazionale di
      Sarek](/lugar/sarek-national-park/) custodiscono vaste estensioni di tundra scandinava, con renne,
      pernici bianche e fauna alpina boreale.
  pt:
    intro: >-
      Uma cadeia de colinas arredondadas, sem uma única árvore no cimo, estende-se pela Lapónia ocidental. Não
      são montanhas jovens: são os vestígios de uma antiga cordilheira dobrada que o tempo foi desgastando até
      ao puro leito rochoso. É o Pallas-Yllästunturi, o terceiro maior parque nacional da Finlândia, com 1.020
      km² repartidos entre Enontekiö, Kittilä, Kolari e Muonio.
    landscape: >-
      A palavra-chave é *kero*, que em finlandês designa o cimo arredondado e desprovido de árvores de uma
      colina. O ponto mais elevado do parque é Taivaskero, nas colinas de Pallastunturi, a 809 metros; ao seu
      lado erguem-se Pyhäkero, Lumikero, Laukukero e Palkaskero. Entre elas o relevo muda com rapidez:
      turfeiras de aapa, pinhais sobre urze, matas virgens ancestrais, topos de fells abertos e ravinas ricas
      em vegetação herbácea.


      O pinheiro-silvestre, o espruce e o vidoeiro-tortuoso dominam a encosta florestada. No topo, onde as
      árvores já não conseguem medrar, crescem o vidoeiro-anão, a uva-ursina-alpina e a camarinha-negra. Mais
      abaixo, nas florestas húmidas e maduras prosperam o gerânio-dos-bosques, o cornejo-da-suécia e variadas
      espécies raras de musgos e fungos. Nas turfeiras florescem o chá-de-labrador e os capins-algodão,
      enquanto os solos calcários abrigam orquídeas raras.


      O ar merece menção de destaque. Na estação meteorológica de Sammaltunturi regista-se, de acordo com a
      OMS, um dos ares mais limpos do globo.
    wildlife: >-
      Aqui cruzam-se aves setentrionais e meridionais. Entre as espécies boreais contam-se o
      [lagópode-branco](/especie/lagopus_muta/), o lagópode-dos-salgueiros e o borrelho-ruivo; nos espruces
      vivem o melro-preto e o felosa-musical. No bosque procura chapins, gaios-siberianos e
      cruzabicos-dos-pinhais; ao longo dos regatos o melro-d'água mergulha nas correntes frias mesmo em pleno
      inverno. Nos anos de abundância de arganizes multiplicam-se corujas e aves de rapina. As aves de
      montanha observam-se confortavelmente a partir dos trilhos de Fell Lapland, tal como a
      tarambola-dourada, a escrevedeira-das-neves e o moleiro-de-cauda-comprida.


      Entre os grandes mamíferos destacam-se a [rena](/especie/rangifer_tarandus/) e o
      [alce](/especie/alces_alces/). No verão as renas passam longos períodos nas colinas e turfeiras,
      cruzando-se com frequência com quem caminha. O [urso-pardo](/especie/ursus_arctos/) e o
      [lince-euroasiático](/especie/lynx_lynx/) residem em permanência no parque; existem também
      lebre-variável, raposa-vermelha, doninha, lemingue-norueguês e esquilo-vermelho.


      O ciclo anual compõe-se de contrastes marcados. O inverno traz a noite polar em dezembro e janeiro,
      geadas que descem aos 30 graus negativos e auroras boreais em noites limpas; o manto nival atinge o pico
      em março e abril com mais de um metro de espessura. O verão tem início em meados de junho, banhado pelo
      sol da meia-noite em junho e julho. A partir de meados de setembro a ruska tinge as colinas de tons
      outonais durante duas a três semanas, caindo os primeiros nevões firmes depois de meados de outubro.
      Entretanto, nas encostas podes colher mirtilos e nas turfeiras inclinadas amoras-árticas.
    visit: >-
      O parque dispõe de 340 km de trilhos pedestres de verão sinalizados e mais de 500 km de pistas de esqui
      nórdico. A grande travessia de referência é a Hetta–Pallas, com 55 km, o trilho sinalizado mais antigo
      da Finlândia: percorre os planaltos descampados das colinas, desce a ravinas e atinge o topo de vários
      cumes. Ao longo do percurso erguem-se abrigos de montanha de livre acesso e cabanas de aluguer; as de
      Hannukuru ficam a 28 km de Hetta e a 27 km de Pallas. A travessia pode efetuar-se igualmente com esquis
      no inverno, exigindo todavia experiência e um planeamento meticuloso.


      Para caminhadas de um dia, as opções mais procuradas são Pyhäkero, Taivaskeron kierros, Pirunkurun
      ponnistus, Varkaankurun polku, Kesänkijärven kierros e Tuomikurun kierros. Na zona de Ylläs podes subir
      com raquetes de neve ao Kukastunturi ou caminhar até ao abrigo de Tuomikuru. Pelo contrário, no setor de
      Pallas não existem trilhos marcados para raquetes de neve, uma vez que o vento endurece em demasia o
      manto nival nas colinas abertas.


      O parque possui três centros de visitantes: Kellokas em Yllästunturi, Pallastunturi e o de Fell Lapland
      em Hetta. As suas exposições, entre as quais Meän elämää e Vuovjjuš-Kulkijat, dão a conhecer o
      património natural e humano local, destacando-se nesta última a herança sami e a vida nas fells.
    history: >-
      A área é povoada desde a Idade da Pedra, com grande presença dos samis, numa zona fronteiriça de enorme
      relevo cultural. Hoje em dia as cooperativas de pastoreio de Alakylä, Kyrö, Muonio e Näkkälä utilizam o
      parque como área de pasto e criação de renas. Muitos topónimos locais possuem matriz sami: kaltio, kero,
      lompolo, mella, vuoma e vuontis constituem claros empréstimos linguísticos.


      A ideia de instituir parques nacionais nasceu em 1910, cabendo ao botânico Kaarlo Linkola um papel
      nuclear no caso das colinas de Pallastunturi. O Pallas-Ounastunturi foi um dos dois primeiros parques
      nacionais da Finlândia, criado em 1938. Na década de trinta Pallas era já um destino turístico afamado,
      tendo o trilho de Pallas a Hetta sido balizado em 1934. Em 1952 a chama olímpica finlandesa foi acesa no
      cimo de Taivaskero. Em 2005 o parque agregou a reserva de Ylläs-Aakenus dando corpo ao parque atual, que
      duplicou a área anterior. Ostenta a Carta Europeia de Turismo Sustentável outorgada pela Federação
      EUROPARC.
    before: >-
      No inverno é imprescindível roupa técnica polar, mapa e bússola: os nevões podem tapar pegadas e anular
      a visibilidade num ápice. Mantém-te nos trilhos marcados na tundra vulnerável para evitar a erosão.
      Fazer fogo só é permitido nas fogueiras oficiais usando a lenha disponibilizada.
    around: >-
      Para ocidente e para sul, outros santuários árticos resguardam amplos horizontes de tundra. A [Reserva
      Natural de Vindelfjällen](/lugar/vindelfjallens-naturreservat/) e o [Parque Nacional de
      Sarek](/lugar/sarek-national-park/) preservam vastos territórios contínuos de tundra escandinava,
      albergando renas, lagópodes-brancos e fauna de montanha boreal.
