  es: >-
    La 'Puerta de Hierro' de Macedonia del Norte, un cañón calizo impresionante labrado por el río Vardar de
    19 km de extensión.
  en: The 'Iron Gate' of North Macedonia, a dramatic 19 km limestone canyon carved by the Vardar River.
  fr: La « Porte de fer » de Macédoine du Nord, un impressionnant canyon calcaire de 19 km creusé par le Vardar.
  de: Das «Eiserne Tor» Nordmazedoniens, ein eindrucksvoller 19 km langer Kalkstein-Canyon des Vardar-Flusses.
  it: >-
    La 'Porta di Ferro' della Macedonia del Nord, un maestoso canyon calcareo di 19 km scavato dal fiume
    Vardar.
  pt: >-
    A 'Porta de Ferro' da Macedónia do Norte, um imponente desfiladeiro calcário de 19 km talhado pelo rio
    Vardar.
