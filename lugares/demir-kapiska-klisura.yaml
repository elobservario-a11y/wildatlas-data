observaciones:
  es: >-
    Las cuevas de la garganta no son un paseo: lleva calzado adecuado y, si quieres ir a Zmejovec, cuenta con
    la caminata de dos kilómetros y medio. Comprueba antes de ir el estado de los accesos y consulta al
    municipio.
texto:
  es:
    intro: >-
      Demir Kapi, en turco otomano, es la puerta de hierro. Antes, en época clásica, el lugar se llamaba
      Stenae, que en griego significa garganta. La garganta de Demir Kapija es el paso por el que el Vardar
      sale de la llanura de Tikveš y se abre hacia Bojmija, a lo largo de unos 19 km, entre paredes de hasta
      1.000 m. Hoy el paso es de los buitres.
    landscape: >-
      Los costados de la garganta son de esquistos azules, cubiertos por capas de caliza azul mesozoica. Son
      muy empinados y llegan a los 1.000 m de altura. En esa caliza el agua ha abierto cuevas: las mejores
      conocidas son Bela Voda y las dos Zmejovec, la superior y la inferior.


      Bela Voda está junto a la antigua carretera de Gevgelija, y sus conductos suman 955 m. El conducto
      inferior es joven, con arena en el fondo que delata un agua que corre solo a ratos; el superior conserva
      formaciones. Al final de uno de ellos hay el lago de las Perlas, de ocho por doce metros. Zmejovec tiene
      dos partes, una mayor, de 150 m y forma redonda, y otra menor, de 40 m, con cortinas, estalactitas y
      estalagmitas. Su entrada es grande, pero hay que caminar dos kilómetros y medio hasta llegar.


      Por el municipio pasan tres ríos: el Vardar (24 km dentro del municipio), el Došnica (18 km) y el Bošava
      (15 km). La orilla del Bošava es un ecosistema rico en flora y fauna, donde domina un árbol autóctono
      llamado Јавор Платан.
    wildlife: >-
      Si hay una razón para venir es el cielo. La garganta se promociona como una de las reservas
      ornitológicas más ricas de Europa por la presencia de buitres raros. Los
      [alimoches](/especie/neophron_percnopterus/) anidan en el área importante para las aves, y esta se
      reconoce por las poblaciones de perdiz griega, alimoche, culebrera europea y otras aves del desfiladero.
      También cuentan el gavilán griego, la collalba de orejas negras oriental y el escribano cabecinegro.


      La ficha del lugar añade el [buitre leonado](/especie/gyps_fulvus/) y la [cigüeña
      negra](/especie/ciconia_nigra/) entre las especies de la garganta. Los montañeros suben además a recoger
      plantas de té, y el municipio presenta un valle de cactus escondido en el corazón de Europa.


      El valle del Vardar tiene clima subtropical húmedo. En Demir Kapija se registró la temperatura más alta
      de Macedonia del Norte, 45,7 °C, el 24 de julio de 2007.
    visit: >-
      El municipio ofrece varias rutas a pie, de diferentes longitudes y niveles de dificultad, y más de 130
      km de rutas ciclistas. Los caminos junto a los cuatro ríos del municipio se proponen para pasear. Desde
      la población, la orilla del Bošava hasta el paraje de Došnica es un buen lugar para pasear. Hay también
      senderos hacia los rápidos y hacia las ruinas de la fortaleza de Prosek.


      Para ver aves, el municipio señala varios puntos de observación en las colinas y montañas del valle, con
      vistas espectaculares.
    history: >-
      La población se menciona ya en época clásica como Stenae. En el monte Ramniste, en la falda de Demir
      Kapija, hay una fortaleza peonia, con 3.000 años de antigüedad, una de las pocas tres estructuras
      peonias conocidas en Macedonia. La fortaleza de Prosek hacía de atalaya sobre el cañón para vigilar los
      movimientos de tropas hacia el norte.
    before: >-
      Las cuevas de la garganta no son un paseo: lleva calzado adecuado y, si quieres ir a Zmejovec, cuenta
      con la caminata de dos kilómetros y medio. Comprueba antes de ir el estado de los accesos y consulta al
      municipio.
    around: >-
      Lejos de aquí, otros desfiladeros comparten los alimoches, los buitres y los hábitats de garganta y río:
      el [Parque Nacional de Monfragüe](/lugar/parque-nacional-de-monfrague/), el [Parque Natural Regional del
      Verdon - Grandes Gargantas](/lugar/parc-naturel-regional-du-verdon---gorges/), el [Parque Natural Hoces
      del Río Duratón](/lugar/parque-natural-hoces-del-rio-duraton/) y las [Gargantas del
      Jonte](/lugar/gorges-de-la-jonte/).
  en:
    intro: >-
      Demir Kapija translates from Ottoman Turkish as the "iron gate." In antiquity, the stronghold was called
      Stenae, Greek for gorge. The Demir Kapija gorge is the breach through which the Vardar River drains the
      Tikveš valley and spills into the Bojmija depression, extending over some 19 km between precipices
      rising up to 1,000 m. Today the skies belong to nesting vultures.
    landscape: >-
      The flanking canyon walls are composed of blue schists overlain by Mesozoic blue limestones. They rise
      precipitously up to 1,000 m in elevation. Dissolution within the limestone has hollowed out numerous
      caverns: the most prominent are Bela Voda and the two Zmejovec caves, upper and lower.


      Bela Voda opens adjacent to the old Gevgelija highway, its mapped subterranean passages totaling 955 m.
      The lower gallery is youthful, strewn with fluvial sands reflecting episodic floodwaters; the upper
      passage preserves intricate dripstone formations. At the terminus of one branch lies the Lake of Pearls,
      measuring eight by twelve meters. Zmejovec consists of two chambers: an expansive rounded hall measuring
      150 m, and a smaller 40 m gallery adorned with curtains, stalactites, and stalagmites. Its portal is
      cavernous, reached via a two-and-a-half kilometer approach hike.


      Three rivers water the municipality: the Vardar (24 km within municipal borders), the Došnica (18 km),
      and the Bošava (15 km). The banks of the Bošava nurture a lush riverine ecosystem dominated by native
      oriental plane trees.
    wildlife: >-
      The primary draw of Demir Kapija is its airspace. The canyon is promoted as one of Europe's premier
      raptor sanctuaries owing to its rare vulture colonies. [Egyptian
      vultures](/especie/neophron_percnopterus/) nest across the Important Bird Area, designated for healthy
      populations of rock partridge, Egyptian vulture, short-toed snake eagle, and cliff-dwelling passerines.
      Levant sparrowhawks, eastern black-eared wheatears, and black-headed buntings are also present.


      The gorge avifauna further features the [griffon vulture](/especie/gyps_fulvus/) and the [black
      stork](/especie/ciconia_nigra/). Mountaineers scale the ridges to forage mountain tea herbs, and the
      municipality harbors a wild cactus valley tucked into the heart of the Balkans.


      The Vardar corridor experiences a humid subtropical climate. Demir Kapija recorded North Macedonia's
      highest temperature on record, 45.7 °C, on 24 July 2007.
    visit: >-
      The municipality features a network of waymarked walking paths across various difficulties, alongside
      more than 130 km of cycle touring routes. Footpaths skirting the four local rivers offer scenic
      riverside walking. From town, following the Bošava banks to the Došnica confluence is an accessible
      outing. Other tracks climb toward river rapids and the medieval ramparts of Prosek Fortress.


      For birdwatching, the local authorities have designated scenic raptor lookouts across the hills flanking
      the valley.
    history: >-
      The settlement was recorded in Greco-Roman antiquity as Stenae. On Mount Ramniste, on the shoulder of
      Demir Kapija, stand ruins of a Paeonian fortress dating back 3,000 years, one of only three known
      Paeonian fortifications in Macedonia. Prosek Fortress served as an eagle's nest over the canyon to guard
      strategic movements northward.
    before: >-
      The wild caves of the gorge require care: wear sturdy boots and headlamps, and reckon on a
      two-and-a-half kilometer hike to reach Zmejovec. Inquire beforehand with municipal authorities regarding
      trail conditions.
    around: >-
      Farther afield, kindred river gorges sharing Egyptian vultures and riverine cliffs include [Monfragüe
      National Park](/lugar/parque-nacional-de-monfrague/), [Verdon Regional Natural Park - Grand
      Canyon](/lugar/parc-naturel-regional-du-verdon---gorges/), [Hoces del Río Duratón Natural
      Park](/lugar/parque-natural-hoces-del-rio-duraton/), and the [Jonte Gorges](/lugar/gorges-de-la-jonte/).
  fr:
    intro: >-
      Demir Kapi signifie en turc ottoman la porte de fer. Durant l'Antiquité, le site s'appelait Stenae, ce
      qui signifie défilé en grec. La gorge de Demir Kapija est le goulet par lequel le Vardar s'échappe de la
      plaine de Tikveš pour déboucher sur le bassin de Bojmija, s'étirant sur 19 km entre des falaises
      atteignant jusqu'à 1 000 m. Aujourd'hui, les parois appartiennent aux vautours.
    landscape: >-
      Les flancs du défilé sont formés de schistes bleus coiffés d'épaisses strates de calcaire bleu
      mésozoïque. Très escarpés, ils culminent à 1 000 m d'altitude. Dans ce calcaire, l'eau a creusé
      plusieurs cavités : les plus renommées sont Bela Voda et les deux grottes de Zmejovec, la supérieure et
      l'inférieure.


      Bela Voda s'ouvre près de l'ancienne route de Gevgelija, ses galeries totalisant 955 m de développement.
      Le conduit inférieur, tapissé de sables alluviaux, est parcouru lors des crues temporaires ; le niveau
      supérieur conserve de belles concrétions. Au terme de l'un des rameaux gît le lac des Perles, mesurant
      huit mètres sur douze. Zmejovec comporte deux salles : l'une vaste et arrondie de 150 m, l'autre plus
      modeste de 40 m riche en draperies, stalactites et stalagmites. Son porche est grandiose, accessible
      après deux kilomètres et demi de marche d'approche.


      Trois cours d'eau arrosent le territoire : le Vardar (24 km dans la commune), la Došnica (18 km) et la
      Bošava (15 km). Les rives de la Bošava forment un écosystème remarquable dominé par le platane d'Orient
      indigène.
    wildlife: >-
      L'attrait majeur de Demir Kapija réside dans son ciel. La gorge est réputée comme l'un des sanctuaires
      ornithologiques les plus riches d'Europe pour ses rapaces rupicoles. Le [vautour
      percnoptère](/especie/neophron_percnopterus/) niche dans la zone d'importance pour les oiseaux, reconnue
      pour ses populations de perdrix choukar, de percnoptère, de circaète Jean-le-Blanc et d'autres oiseaux
      des falaises. S'y ajoutent l'épervier à pieds courts, le traquet oreillard oriental et le bruant
      mélanocéphale.


      Le site accueille également le [vautour fauve](/especie/gyps_fulvus/) et la [cigogne
      noire](/especie/ciconia_nigra/). Les randonneurs récoltent sur les crêtes le thé des montagnes, et la
      commune abrite une surprenante combe à cactus sauvages.


      La vallée du Vardar bénéficie d'un climat subtropical humide. Demir Kapija détient le record absolu de
      chaleur de Macédoine du Nord avec 45,7 °C, relevés le 24 juillet 2007.
    visit: >-
      La municipalité propose plusieurs sentiers pédestres balisés de longueurs variées et plus de 130 km
      d'itinéraires cyclables. Les chemins le long des quatre rivières locales se prêtent à la promenade.
      Depuis le bourg, la rive de la Bošava vers le site de Došnica constitue une agréable sortie. D'autres
      sentiers mènent aux rapides et aux ruines de la forteresse de Prosek.


      Pour l'observation des oiseaux, plusieurs belvédères aménagés sur les collines offrent des panoramas sur
      le défilé.
    history: >-
      La cité est attestée dès l'époque classique sous le nom de Stenae. Sur le mont Ramniste, au flanc de
      Demir Kapija, s'élèvent les ruines d'une forteresse péonienne vieille de 3 000 ans, l'une des trois
      seules fortifications péoniennes répertoriées en Macédoine. La forteresse de Prosek servait de vigie
      imprenable sur le canyon pour surveiller les mouvements de troupes vers le nord.
    before: >-
      Les grottes naturelles ne sont pas aménagées : prévoyez de bonnes chaussures et comptez deux kilomètres
      et demi de marche pour gagner Zmejovec. Renseignez-vous auprès de la mairie sur la praticabilité des
      accès.
    around: >-
      Plus loin, d'autres gorges partagent les percnoptères et l'avifaune des falaises fluviales : le [parc
      national de Monfragüe](/lugar/parque-nacional-de-monfrague/), le [parc naturel régional du Verdon -
      grandes gorges](/lugar/parc-naturel-regional-du-verdon---gorges/), le [parc naturel des gorges du
      Duratón](/lugar/parque-natural-hoces-del-rio-duraton/) et les [gorges de la
      Jonte](/lugar/gorges-de-la-jonte/).
  de:
    intro: >-
      Demir Kapi bedeutet im osmanischen Türkisch das eiserne Tor. In der Antike hieß der Ort Stenae, was im
      Griechischen Engpass bedeutet. Die Schlucht von Demir Kapija ist der Durchbruch, durch den der Vardar
      aus dem Tikveš-Becken in die Bojmija-Tiefebene strömt, auf rund 19 km Länge zwischen bis zu 1.000 m
      hohen Wänden. Heute gehört die Schlucht den Geiern.
    landscape: >-
      Die Felsflanken der Klamm bestehen aus Blauschiefern, überlagert von mesozoischen Blaulimestones. Sie
      steigen steil bis auf 1.000 m Höhe an. Im Kalkstein wusch das Wasser Höhlensysteme aus: Am bekanntesten
      sind Bela Voda sowie die beiden Zmejovec-Höhlen, die obere und die untere.


      Bela Voda liegt an der alten Straße nach Gevgelija; ihre Gänge summieren sich auf 955 m. Der untere Gang
      führt periodisch Flusssande, der obere birgt Tropfsteine. Am Ende eines Zweigs ruht der Perlen-See mit
      acht mal zwölf Metern Ausmaß. Zmejovec umfasst zwei Hallen: eine runde Kammer von 150 m und einen
      kleineren 40 m langen Saal mit Sintervorhängen. Der Höhleneingang ist weit, erfordert jedoch einen
      Zustieg von zweieinhalb Kilometern Fußweg.


      Drei Flüsse entwässern das Gemeindegebiet: der Vardar (24 km im Gemeindegebiet), die Došnica (18 km) und
      die Bošava (15 km). Das Bošava-Ufer bildet einen artenreichen Auwald, dominiert von der heimischen
      Morgenländischen Platane.
    wildlife: >-
      Der größte Reiz von Demir Kapija liegt im Himmel. Die Schlucht gilt wegen seltener Geiervorkommen als
      herausragendes Vogelschutzgebiet Europas. [Schmutzgeier](/especie/neophron_percnopterus/) brüten im
      Important Bird Area, das für Chukarhuhn, Schmutzgeier, Schlangenadler und Felsenvögel ausgewiesen ist.
      Auch Balkan-Sperber, Maskensteinschmätzer und Kappenammer sind hier heimisch.


      Zur Schluchtfauna zählen ferner [Gänsegeier](/especie/gyps_fulvus/) und
      [Schwarzstorch](/especie/ciconia_nigra/). Bergwanderer sammeln auf den Höhen den Bergtee, und in einem
      Seitental gedeihen verwilderte Kakteenbestände.


      Das Vardartal besitzt ein feuchtes subtropisches Klima. In Demir Kapija wurde am 24. Juli 2007 mit 45,7
      °C der Temperaturrekord Nordmazedoniens gemessen.
    visit: >-
      Die Gemeinde unterhält markierte Wanderwege verschiedener Längen und Schwierigkeitsgrade sowie über 130
      km Radrouten. Uferwege entlang der vier Gemeindeflüsse laden zu Spaziergängen ein. Beliebt ist der
      Spaziergang vom Ort entlang der Bošava zur Došnica. Weitere Pfade führen zu den Stromschnellen und zur
      Festung Prosek.


      Für die Vogelbeobachtung bieten ausgewiesene Aussichtspunkte auf den Talhöhen weite Blicke in die
      Schlucht.
    history: >-
      Die Siedlung ist seit der Antike als Stenae belegt. Am Berg Ramniste am Rand von Demir Kapija stehen
      Reste einer 3.000 Jahre alten päonischen Festung, eine von nur drei bekannten päonischen Anlagen in
      Mazedonien. Die Felsenburg Prosek diente als Wachtposten über dem Engpass zur Kontrolle der
      Nord-Süd-Passage.
    before: >-
      Die Naturhöhlen sind unerschlossen: Trage festes Schuhwerk und rechne mit zweieinhalb Kilometern Gehzeit
      zur Zmejovec-Höhle. Erkundige dich vor Ort in der Gemeinde über die Wegebeschaffenheit.
    around: >-
      In größerer Ferne teilen andere Schluchten Geier und Felsflusshabitate: der [Nationalpark
      Monfragüe](/lugar/parque-nacional-de-monfrague/), der [Regionale Naturpark Verdon - Große
      Schluchten](/lugar/parc-naturel-regional-du-verdon---gorges/), der [Naturpark Hoces del Río
      Duratón](/lugar/parque-natural-hoces-del-rio-duraton/) und die
      [Jonte-Schlucht](/lugar/gorges-de-la-jonte/).
  it:
    intro: >-
      Demir Kapi significa in turco ottomano porta di ferro. In epoca classica il luogo era noto come Stenae,
      che in greco antico indica una forra. La gola di Demir Kapija è il varco attraverso cui il Vardar esce
      dalla pianura di Tikveš e si apre verso Bojmija, lungo un tratto di circa 19 km tra pareti che toccano i
      1.000 m. Oggi questo corridoio rupestre appartiene agli avvoltoi.
    landscape: >-
      I fianchi della gola sono formati da scisti bluastri sormontati da bancate di calcare mesozoico. Sono
      molto ripidi e raggiungono i 1.000 m di quota. Nel calcare l'acqua ha scavato cavità carsiche: le più
      celebri sono Bela Voda e le due grotte di Zmejovec, la superiore e l'inferiore.


      Bela Voda si apre accanto alla vecchia carrozzabile per Gevgelija, con gallerie che misurano 955 m. Il
      ramo inferiore è recente, cosparso di sabbie trasportate dalle piene intermittenti; il tratto superiore
      custodisce concrezioni. Al termine di una diramazione si trova il lago delle Perle, di otto metri per
      dodici. Zmejovec si articola in due vani: una vasta sala arrotondata di 150 m e un ambiente di 40 m
      ornato di cortine stalattitiche. L'ingresso è imponente, ma richiede due chilometri e mezzo di cammino a
      piedi.


      Il territorio municipale è attraversato da tre fiumi: il Vardar (24 km nel comune), la Došnica (18 km) e
      la Bošava (15 km). Le sponde della Bošava accolgono una rigogliosa macchia ripariale dominata dal
      platano orientale autoctono.
    wildlife: >-
      Se c'è un motivo per raggiungere Demir Kapija è l'avifauna dei cieli. La gola è considerata una delle
      oasi ornitologiche più cospicue d'Europa per la presenza di rapaci rupicoli. Il
      [capovaccaio](/especie/neophron_percnopterus/) nidifica nell'Area Importante per gli Uccelli, designata
      per popolazioni stabili di coturnice orientale, capovaccaio, biancone e passeri solitari. Si osservano
      anche lo sparviero levantino, la monachella orientale e lo zigolo capinero.


      Tra le pareti compaiono inoltre il [grifone](/especie/gyps_fulvus/) e la [cicogna
      nera](/especie/ciconia_nigra/). Gli escursionisti salgono sui crinali per raccogliere erbe aromatiche
      montane, e la valle ospita una colonia spontanea di cactus.


      La valle del Vardar gode di clima subtropicale umido. A Demir Kapija è stata registrata la temperatura
      record della Macedonia del Nord, 45,7 °C, il 24 luglio 2007.
    visit: >-
      Il comune mette a disposizione numerosi sentieri pedonali di varia difficoltà e oltre 130 km di percorsi
      ciclabili. Le sponde dei quattro corsi d'acqua comunali si prestano a rilassanti passeggiate. Dal paese,
      l'argine della Bošava verso la confluenza della Došnica è una mèta accessibile. Altri tracciati salgono
      alle rapide del fiume e ai ruderi della fortezza di Prosek.


      Per il birdwatching, l'amministrazione segnala diversi punti d'avvistamento sulle alture affacciate
      sulla forra.
    history: >-
      L'insediamento è documentato fin dall'epoca classica con il nome di Stenae. Sul monte Ramniste, alla
      base di Demir Kapija, sorgono i resti di una fortezza peonia di 3.000 anni fa, una delle sole tre
      fortificazioni peonie note in Macedonia. La fortezza di Prosek vigilava come nido d'aquila sul canyon
      per controllare i movimenti militari verso nord.
    before: >-
      Le cavità naturali non sono turistiche: indossa calzature robuste e metti in conto due chilometri e
      mezzo di marcia per salire a Zmejovec. Verifica prima della partenza lo stato delle vie d'accesso presso
      il comune.
    around: >-
      Lontano da qui, altre gole condividono capovaccai e ambienti fluviali: il [Parco Nazionale di
      Monfragüe](/lugar/parque-nacional-de-monfrague/), il [Parco Naturale Regionale del Verdon - Grandi
      Gole](/lugar/parc-naturel-regional-du-verdon---gorges/), il [Parco Naturale Gole del Fiume
      Duratón](/lugar/parque-natural-hoces-del-rio-duraton/) e le [Gole della
      Jonte](/lugar/gorges-de-la-jonte/).
  pt:
    intro: >-
      Demir Kapi significa em turco otomano a porta de ferro. Em época clássica, o sítio chamava-se Stenae,
      que em grego quer dizer garganta. O desfiladeiro de Demir Kapija é o rasgão pelo qual o Vardar abandona
      a planície de Tikveš e irrompe na bacia de Bojmija, ao longo de cerca de 19 km, entre paredões que se
      elevam até aos 1.000 m. Hoje a garganta pertence aos abutres.
    landscape: >-
      As encostas da garganta são talhadas em xistos azuis recobertos por bancadas de calcário azul mesozóico.
      Erguem-se a prumo até aos 1.000 m de altitude. No calcário a circulação da água escavou várias cavernas:
      as mais famosas são Bela Voda e as duas grutas de Zmejovec, a superior e a inferior.


      Bela Voda situa-se junto à antiga estrada de Gevgelija, estendendo-se por galerias que totalizam 955 m.
      A galeria inferior é recente, com areias que denunciam cheias temporárias; a superior exibe
      estalactites. Ao fundo de uma das galerias encontra-se o lago das Pérolas, medindo oito por doze metros.
      Zmejovec compreende duas câmaras: uma sala ampla e arredondada de 150 m e uma galeria menor de 40 m com
      cortinas e estalagmites. A entrada é monumental, exigindo dois quilómetros e meio de caminhada para lá
      chegar.


      Pelo município correm três rios: o Vardar (24 km no território municipal), o Došnica (18 km) e o Bošava
      (15 km). As margens do Bošava acolhem uma densa galeria ripícola onde predomina o plátano-oriental
      autóctone.
    wildlife: >-
      Se há motivo para visitar Demir Kapija é a observação do céu. O desfiladeiro destaca-se como uma das
      reservas ornitológicas mais prestigiadas da Europa pelas colónias de aves de rapina. O
      [abutre-do-egito](/especie/neophron_percnopterus/) nidifica na Área Importante para as Aves, delimitada
      pelas populações de perdiz-chucar, britango, águia-cobreira e outras espécies rupícolas. Ocorrem ainda o
      gavião-grego, o chasco-oriental e a escrevedeira-de-cabeça-preta.


      Nas escarpas habitam também o [grifo](/especie/gyps_fulvus/) e a
      [cegonha-preta](/especie/ciconia_nigra/). Os caminhantes recolhem nas cumeadas o chá da montanha, e o
      município acolhe um invulgar vale de cactos bravios.


      O vale do Vardar possui clima subtropical húmido. Em Demir Kapija foi registada a temperatura mais alta
      da Macedónia do Norte, 45,7 °C, a 24 de julho de 2007.
    visit: >-
      O município disponibiliza vários percursos pedestres de extensão variável e mais de 130 km de circuitos
      cicláveis. Os caminhos ao longo dos quatro rios locais prestam-se a passeios agradáveis. A partir da
      vila, o trilho ao longo do Bošava até à confluência do Došnica é um passeio acessível. Outros caminhos
      sobem aos rápidos do rio e às ruínas da fortaleza de Prosek.


      Para a observação de aves existem miradouros assinalados nas colinas com amplas vistas panorâmicas sobre
      a garganta.
    history: >-
      A povoação é citada na Antiguidade como Stenae. No monte Ramniste, na encosta de Demir Kapija, erguem-se
      as ruínas de uma fortaleza peónia com 3.000 anos de antiguidade, uma das raras três fortificações
      peónias conhecidas na Macedónia. A fortaleza de Prosek servia de vigia sobre o desfiladeiro para
      controlar a movimentação de tropas rumo a norte.
    before: >-
      As grutas da garganta são naturais e desprovidas de infraestruturas: usa calçado de montanha e conta com
      dois quilómetros e meio de marcha até Zmejovec. Confirma o estado dos trilhos junto dos serviços
      municipais.
    around: >-
      Longe daqui, outros desfiladeiros acolhem britangos e aves de escarpas fluviais: o [Parque Nacional de
      Monfragüe](/lugar/parque-nacional-de-monfrague/), o [Parque Natural Regional do Verdon - Grandes
      Gargantas](/lugar/parc-naturel-regional-du-verdon---gorges/), o [Parque Natural Hoces del Río
      Duratón](/lugar/parque-natural-hoces-del-rio-duraton/) e as [Gargantas do
      Jonte](/lugar/gorges-de-la-jonte/).
