resumen:
  es: >-
    Paso garganta donde el río Olt atraviesa perpendicularmente los Cárpatos Meridionales bajo el macizo de
    Cozia.
  en: >-
    Gorge pass where the Olt River cuts perpendicular through the Southern Carpathians beneath the Cozia
    Massif.
  fr: Gorge où l'Olt franchit perpendiculairement les Carpates méridionales sous le massif de Cozia.
  de: Durchbruchstal, in dem der Olt die Südkarpaten unterhalb des Cozia-Massivs senkrecht durchschneidet.
  it: Gola fluviale dove l'Olt attraversa perpendicolarmente i Carpazi Meridionali sotto il massiccio di Cozia.
  pt: Garganta profunda onde o rio Olt rasga transversalmente os Cárpatos Meridionais sob o maciço de Cozia.
unico:
  es: >-
    Un paso a través de las montañas que es a la vez corredor de aves migratorias y de hayedos que llevan
    siglos sin tala.
  en: >-
    A mountain breach serving as a migratory flyway and harboring beech forests untouched by logging for
    centuries.
  fr: >-
    Une trouée montagnarde servant à la fois de couloir migratoire pour les oiseaux et de sanctuaire pour des
    hêtraies sans coupe depuis des siècles.
  de: >-
    Ein Gebirgsdurchbruch, der zugleich als Zugvogelkorridor und als Refugium jahrhundertelang unberührter
    Buchenwälder dient.
  it: >-
    Un varco montano che funge da corridoio migratorio per l'avifauna e accoglie faggete rimaste per secoli
    senza disboscamento.
  pt: >-
    Um desfiladeiro montanhoso que funciona simultaneamente como corredor de aves migratórias e reduto de
    faiais seculares intactos.
observaciones:
  es: >-
    En el parque no se permite el fuego abierto, y está prohibido usar vehículos a motor, ATV, motos de nieve
    y motocicletas. La mejor época va de mayo a octubre.
texto:
  es:
    intro: >-
      Los Cárpatos Meridionales parecían cerrar el paso, y el río Olt los atravesó igualmente. En el
      desfiladero del Olt, el agua cortó el gneis del macizo de Cozia y de sus afluentes y abrió un pasillo
      que hoy sigue la carretera nacional, el ferrocarril y las aves en migración. A ambos lados se extiende
      el Parque Nacional Cozia, 17.100 hectáreas de bosque, declaradas parque nacional en 1990, que incluyen
      los macizos de Cozia y Narățu y parte de las montañas de Lotru y Căpățânii.


      Visto de lejos, el macizo de Cozia parece una gran fortaleza de piedra, con torres, escarpes y crestas
      que dominan el valle del Olt.
    landscape: >-
      La roca manda. La mayor parte del parque la forman rocas cristalinas, en el centro y el norte, y una
      franja sedimentaria al sur, a ambos lados del Olt. Lo que más abunda es el gneis de Cozia, con laderas
      muy inclinadas, de entre 50 y 70 grados, donde el suelo se forma con dificultad. En la vertiente
      oriental del macizo hay torres, cornisas y paredes sin vegetación, con canalones estrechos cubiertos de
      hierba.


      Sobre esa roca crece un bosque que cubre aproximadamente el 96 % del parque, entre unos 300 y 1600
      metros de altitud, con un clima que mezcla elementos de los Cárpatos y submediterráneos. Es un bosque de
      mezclas raras: el roble albar sube a más de 1300 metros en las vertientes soleadas, mientras el haya y
      el abeto bajan por el desfiladero hasta los 300. Los bosques UNESCO de Cozia, de casi 3400 hectáreas,
      conservan hayedos naturales que han evolucionado durante siglos sin explotación forestal. Allí hay
      hayas, abetos y arces centenarios que superan a menudo los 40 metros de altura y 1,5 metros de diámetro.
      Con la madera muerta, los árboles viejos y la regeneración natural, el bosque funciona solo.
    wildlife: >-
      En primavera el suelo del hayedo se cubre de alfombras de flores: Pulmonaria rubra, Symphytum cordatum y
      Dentaria glanduligera, entre otras. Entre las plantas representativas está el edelweiss, y entre las
      endémicas del macizo de Cozia están Centaurea coziensis y Rosa coziae. El parque alberga más de mil
      especies de plantas.


      Entre los mamíferos emblemáticos están el [oso pardo](/especie/ursus_arctos/), el
      [lobo](/especie/canis_lupus/), el [lince](/especie/lynx_lynx/), el [gato
      montés](/especie/felis_silvestris/), la [marta](/especie/martes_martes/) y la garduña, el
      [ciervo](/especie/cervus_elaphus/), el [corzo](/especie/capreolus_capreolus/) y el
      [rebeco](/especie/rupicapra_rupicapra/), que se considera uno de los símbolos de la fauna de montaña. En
      el cielo, el [águila real](/especie/aquila_chrysaetos/), el [águila
      pomerana](/especie/aquila_pomarina/), el [halcón peregrino](/especie/falco_peregrinus/), el [cárabo
      uralense](/especie/strix_uralensis/), el cárabo común y el [mochuelo
      chico](/especie/glaucidium_passerinum/). En el bosque vive el [urogallo](/especie/tetrao_urogallus/), y
      en los márgenes de los ríos son frecuentes el [mirlo acuático](/especie/cinclus_cinclus/) y las
      lavanderas.


      El desfiladero es además un corredor de migración entre Europa central y el mar Egeo, y los embalses de
      Turnu y Gura Lotrului han creado condiciones para que las aves acuáticas se detengan temporalmente o
      incluso inviernen. En total, se conocen más de 120 especies de aves.


      Los ríos de montaña tienen más de 30 especies de peces, como la [trucha común](/especie/salmo_trutta/).
      La [víbora cornuda](/especie/vipera_ammodytes/) es uno de los reptiles más meridionales de Rumanía.
      Entre los invertebrados prioritarios están el [ciervo volante](/especie/lucanus_cervus/) y la [rosalía
      alpina](/especie/rosalia_alpina/), y vive el pseudoescorpión carpático (Neobisium carpathicum), endémico
      e indicador de ecosistemas bien conservados.
    visit: >-
      La visita al parque solo se permite por los senderos marcados. El acceso principal es la carretera DN
      7/E 81, y por el desfiladero pasa la vía férrea Râmnicu Vâlcea-Sibiu, con paradas dentro del parque en
      Păușa, Turnu, Cozia, Gura Lotrului, Călinești-Bețel y Cornet.


      Hasta el salto de Lotrișor hay, desde el aparcamiento, una media de 35 a 40 minutos a pie. El
      desfiladero de Lotrișor tiene paredes verticales de más de 300 a 400 metros. Poarta Omului, un portal
      natural de 10 metros de altura y 7 de ancho, se alcanza en aproximadamente una hora desde la cabaña de
      la cima de Cozia por la ruta de banda roja. En la zona de Stânișoara hay cuatro rutas de senderismo, y
      la ruta roja hacia Călinești parte junto al centro de visitantes y pasa a diez minutos de Brezoi. El
      recorrido panorámico de Doabrele Brezoiului requiere unas cinco o seis horas a pie.


      Para ver la geología, las Pietrele Zimbrilor, cerca de Brezoi, son un conjunto de unas 500 hectáreas
      modelado por la erosión de rocas sedimentarias. En Doabrele Brezoiului se ve, como en un laboratorio, la
      dinámica de la corteza terrestre en capas fosilíferas.
    history: >-
      El desfiladero ha sido paso de gentes: el castro romano de Arutela se alza sobre un antiguo asentamiento
      dacio, en la orilla izquierda del Olt, y el monasterio de Cozia se fundó por decisión de Mircea el
      Viejo, que consta el 20 de mayo de 1388.


      Las zonas UNESCO de Cozia suman casi 3400 hectáreas y están rodeadas de una amplia zona de amortiguación
      para proteger los procesos naturales. Cozia y Lotrișor forman parte del sitio UNESCO de bosques
      primarios y antiguos desde 2017.
    before: >-
      En el parque no se permite el fuego abierto, y está prohibido usar vehículos a motor, ATV, motos de
      nieve y motocicletas. La mejor época va de mayo a octubre.
    around: >-
      A cuatro kilómetros está el [Parque Nacional Buila-Vânturarița - Garganta del
      Bistrița](/lugar/parcul-national-buila-vanturarita---cheile/) y a ocho las [Montañas de
      Iezer-Păpușa](/lugar/muntii-iezer-papusa/). La [Reserva forestal de
      Latorița](/lugar/codrul-secular-latorita/) queda a veintidós kilómetros y la [Reserva Natural del Río
      Vâlsan](/lugar/raul-valsan---rezervatia-naturala/) a veintitrés. Las zonas UNESCO tienen su propia
      ficha: [Parque Nacional Cozia - Bosques Primarios](/lugar/parcul-national-cozia---codrii-seculari/).
  en:
    intro: >-
      The Southern Carpathians seemed to bar all passage, yet the Olt River sliced right through them. In the
      Olt Gorge, running water severed the hard gneiss of the Cozia massif and its tributaries, carving an
      open corridor followed today by the national highway, the railway line, and seasonal migratory birds.
      Spreading along both flanks is Cozia National Park: 17,100 hectares of forest designated a national park
      in 1990, encompassing the Cozia and Narățu massifs alongside portions of the Lotru and Căpățânii
      mountains.


      Viewed from afar, the Cozia massif resembles an immense stone fortress, bristling with towers, scarps,
      and craggy ridges overlooking the Olt valley floor.
    landscape: >-
      The bedrock dictates the terrain. The greater part of the park consists of crystalline metamorphic rocks
      in the central and northern sectors, fringed by a sedimentary belt to the south on both banks of the
      Olt. Most prevalent is the Cozia gneiss, forming steep precipitous slopes between 50 and 70 degrees
      where soils barely take root. Along the eastern flanks of the massif rise barren rock spires, cornices,
      and walls split by narrow grass-tufted chutes.


      Over this rugged stone blanket spreads a forest covering roughly 96% of the park, spanning between 300
      and 1,600 meters in altitude, nurtured by a transitional climate blending Carpathian and
      sub-Mediterranean influences. It is a woodland of rare juxtapositions: sessile oak ascends past 1,300
      meters on sunny slopes, while European beech and silver fir descend along the gorge bottom down to 300
      meters. The UNESCO-listed forests of Cozia, spanning nearly 3,400 hectares, protect pristine beech
      ecosystems that have evolved for centuries without logging disturbance. Veteran beeches, firs, and
      sycamores frequently exceed 40 meters in height and 1.5 meters in trunk diameter. With abundant
      deadwood, ancient trees, and natural regeneration, the forest ecosystem is fully self-sustaining.
    wildlife: >-
      In spring the forest floor beneath the beeches is carpeted with wildflowers: Pulmonaria rubra, Symphytum
      cordatum, and Dentaria glanduligera, among many others. Botanical hallmarks include the alpine
      edelweiss, alongside Cozia endemics such as Centaurea coziensis and Rosa coziae. The park shelters more
      than one thousand plant species.


      Iconic mammals roaming the slopes include the [brown bear](/especie/ursus_arctos/), the [grey
      wolf](/especie/canis_lupus/), the [Eurasian lynx](/especie/lynx_lynx/), the
      [wildcat](/especie/felis_silvestris/), the [European pine marten](/especie/martes_martes/) and beech
      marten, the [red deer](/especie/cervus_elaphus/), the [roe deer](/especie/capreolus_capreolus/), and the
      [chamois](/especie/rupicapra_rupicapra/), widely considered an emblem of Romanian mountain fauna. In the
      skies soar the [golden eagle](/especie/aquila_chrysaetos/), the [lesser spotted
      eagle](/especie/aquila_pomarina/), the [peregrine falcon](/especie/falco_peregrinus/), the [Ural
      owl](/especie/strix_uralensis/), the tawny owl, and the [Eurasian
      pygmy-owl](/especie/glaucidium_passerinum/). In the timber thrives the [western
      capercaillie](/especie/tetrao_urogallus/), while mountain watercourses are frequented by the
      [white-throated dipper](/especie/cinclus_cinclus/) and wagtails.


      The gorge serves additionally as a major north-south migratory corridor between Central Europe and the
      Aegean Sea, where the Turnu and Gura Lotrului reservoirs offer stopover feeding and wintering havens for
      waterbirds. In total, over 120 bird species are documented.


      Mountain streams sustain over 30 fish species, including native [brown trout](/especie/salmo_trutta/).
      The [nose-horned viper](/especie/vipera_ammodytes/) reaches one of its southernmost Romanian outposts
      here. Priority invertebrates include the [stag beetle](/especie/lucanus_cervus/) and the [alpine
      longhorn beetle](/especie/rosalia_alpina/), alongside the endemic Carpathian false scorpion (Neobisium
      carpathicum), a recognized indicator of undisturbed forest soils.
    visit: >-
      Visitors must keep strictly to marked trails inside the park. Primary road access is via the DN 7 / E 81
      highway, while the Râmnicu Vâlcea–Sibiu railway line parallels the river through the gorge, with park
      halts at Păușa, Turnu, Cozia, Gura Lotrului, Călinești-Bețel, and Cornet.


      Walking to Lotrișor waterfall from the roadside car park takes an average of 35 to 40 minutes. The
      Lotrișor canyon features sheer vertical cliffs rising over 300 to 400 meters. Poarta Omului, a natural
      rock portal 10 meters high and 7 wide, is reached in roughly one hour from the Cozia summit mountain hut
      along the red-band trail. In the Stânișoara sector there are four hiking routes, while the red trail
      toward Călinești starts next to the visitor center and passes ten minutes from Brezoi. The scenic
      circuit of Doabrele Brezoiului requires around five to six hours on foot.


      For geological sightseeing, Pietrele Zimbrilor near Brezoi covers an area of roughly 500 hectares
      sculpted by differential weathering in sedimentary strata. Along Doabrele Brezoiului, exposed
      fossiliferous layers illustrate crustal tectonic dynamics like an open-air laboratory.
    history: >-
      The gorge has long served as a vital thoroughfare: the Roman auxiliary castrum of Arutela stands over an
      older Dacian settlement on the left bank of the Olt, while Cozia Monastery was founded by decree of
      Prince Mircea the Elder on 20 May 1388.


      The UNESCO primary forest zones in Cozia encompass nearly 3,400 hectares, buffered by extensive
      peripheral reserves to shield natural processes. Cozia and Lotrișor were inscribed as part of the UNESCO
      primeval and ancient beech forests serial site in 2017.
    before: >-
      Open campfires are forbidden throughout the park, and motorized recreational vehicles, ATVs,
      snowmobiles, and trail bikes are prohibited. The prime visiting season extends from May to October.
    around: >-
      Four kilometers away lies [Buila-Vânturarița National Park - Bistrița
      Gorge](/lugar/parcul-national-buila-vanturarita---cheile/) and eight kilometers the [Iezer-Păpușa
      Mountains](/lugar/muntii-iezer-papusa/). The [Latorița Primeval Forest](/lugar/codrul-secular-latorita/)
      is situated twenty-two kilometers away and the [Vâlsan River Nature
      Reserve](/lugar/raul-valsan---rezervatia-naturala/) twenty-three kilometers. The UNESCO beech forest
      sectors are documented in their own entry: [Cozia National Park - Ancient Beech
      Forests](/lugar/parcul-national-cozia---codrii-seculari/).
  fr:
    intro: >-
      Les Carpates méridionales semblaient infranchissables, et le fleuve Olt les a pourtant traversées de
      part en part. Dans le défilé de l'Olt, les eaux ont cisaillé le gneiss dur du massif de Cozia et de ses
      affluents pour ouvrir un couloir naturel emprunté aujourd'hui par la route nationale, la voie ferrée et
      les vols migratoires d'oiseaux. De part et d'autre s'étend le parc national Cozia, fort de 17 100
      hectares de forêts classés parc national en 1990, qui englobent les massifs de Cozia et Narățu ainsi
      qu'une partie des monts Lotru et Căpățânii.


      Aperçu de loin, le massif de Cozia évoque une gigantesque forteresse de pierre aux tours, escarpements
      et crêtes dominant la vallée de l'Olt.
    landscape: >-
      Le socle rocheux dicte le relief. La majeure partie du parc est constituée de roches cristallines au
      centre et au nord, bordées au sud d'une bande sédimentaire sur les deux rives de l'Olt. Le gneiss de
      Cozia domine, formant des versants très raides inclinés de 50 à 70 degrés où les sols peinent à
      s'établir. Sur le flanc oriental se dressent des tours ruiniformes, des corniches nues et des couloirs
      herbeux abrupts.


      Sur ce socle croît une forêt couvrant environ 96 % du parc, entre 300 et 1 600 mètres d'altitude, sous
      un climat mêlant influences carpatiques et subméditerranéennes. C'est un boisement aux juxtapositions
      singulières : le chêne rouvre grimpe à plus de 1 300 mètres sur les adrets ensoleillés, tandis que le
      hêtre et le sapin descendent dans le défilé jusqu'à 300 mètres. Les forêts UNESCO de Cozia, sur près de
      3 400 hectares, préservent des hêtraies primitives ayant évolué sans exploitation humaine depuis des
      siècles. Hêtres, sapins et érables centenaires y dépassent fréquemment 40 mètres de hauteur et 1,5 mètre
      de diamètre de tronc. Grâce au bois mort et à la régénération naturelle, l'écosystème fonctionne en
      totale autonomie.
    wildlife: >-
      Au printemps, le sous-bois des hêtraies se pare d'un tapis floral : Pulmonaria rubra, Symphytum cordatum
      et Dentaria glanduligera, parmi d'autres espèces. La flore compte l'edelweiss et des endémiques du
      massif comme Centaurea coziensis et Rosa coziae. Le parc abrite plus de mille espèces végétales.


      Parmi les mammifères remarquables figurent [l'ours brun](/especie/ursus_arctos/), le [loup
      gris](/especie/canis_lupus/), le [lynx boréal](/especie/lynx_lynx/), le [chat
      forestier](/especie/felis_silvestris/), la [martre des pins](/especie/martes_martes/) et la fouine, le
      [cerf élaphe](/especie/cervus_elaphus/), le [chevreuil](/especie/capreolus_capreolus/) et le
      [chamois](/especie/rupicapra_rupicapra/), considéré comme un emblème de la faune de montagne. Dans les
      airs évoluent [l'aigle royal](/especie/aquila_chrysaetos/), [l'aigle
      pomarin](/especie/aquila_pomarina/), le [faucon pèlerin](/especie/falco_peregrinus/), la [chouette de
      l'Oural](/especie/strix_uralensis/), la chouette hulotte et la [chevêchette
      d'Europe](/especie/glaucidium_passerinum/). En forêt vit le [grand tétras](/especie/tetrao_urogallus/),
      tandis que le [cincle plongeur](/especie/cinclus_cinclus/) et les bergeronnettes animent les torrents.


      Le défilé constitue en outre un couloir migratoire majeur entre l'Europe centrale et la mer Égée, où les
      retenues de Turnu et Gura Lotrului offrent une halte bienvenue aux oiseaux d'eau. Au total, plus de 120
      espèces d'oiseaux y sont observées.


      Les cours d'eau recèlent plus de 30 espèces de poissons dont la [truite de
      rivière](/especie/salmo_trutta/). La [vipère ammodite](/especie/vipera_ammodytes/) y trouve l'une de ses
      stations les plus méridionales en Roumanie. Parmi les invertébrés d'intérêt communautaire figurent le
      [lucane cerf-volant](/especie/lucanus_cervus/) et la [rosalie des Alpes](/especie/rosalia_alpina/),
      ainsi que le pseudoscorpion carpatique (Neobisium carpathicum), endémique indicateur d'habitats
      forestiers intacts.
    visit: >-
      La visite s'effectue exclusivement sur les sentiers balisés. L'accès routier principal emprunte la route
      DN 7 / E 81, et la voie ferrée Râmnicu Vâlcea–Sibiu parcourt le défilé avec des gares dans le parc à
      Păușa, Turnu, Cozia, Gura Lotrului, Călinești-Bețel et Cornet.


      Pour rejoindre la cascade de Lotrișor depuis le parking, comptez 35 à 40 minutes de marche. Les gorges
      de Lotrișor présentent des falaises verticales de plus de 300 à 400 mètres. Poarta Omului, arche
      rocheuse de 10 mètres de haut et 7 de large, s'atteint en une heure environ depuis le refuge sommital de
      Cozia en suivant le sentier à bande rouge. Le secteur de Stânișoara propose quatre itinéraires de
      randonnée, tandis que le balisage rouge vers Călinești part à côté du centre d'accueil et passe à dix
      minutes de Brezoi. La boucle panoramique de Doabrele Brezoiului demande cinq à six heures de marche.


      Sur le plan géologique, les Pietrele Zimbrilor près de Brezoi constituent un ensemble de 500 hectares
      sculpté dans les couches sédimentaires. À Doabrele Brezoiului, les strates fossilifères exposent la
      dynamique tectonique comme dans un musée naturel.
    history: >-
      Le défilé a de tout temps servi de point de passage : le camp romain d'Arutela s'élève sur un habitat
      dace antérieur en rive gauche de l'Olt, tandis que le monastère de Cozia a été fondé par décret du
      prince Mircea l'Ancien le 20 mai 1388.


      Les zones UNESCO de forêts primaires couvrent près de 3 400 hectares, ceintes d'une vaste zone tampon
      protégeant les processus écologiques naturels. Cozia et Lotrișor sont inscrites au patrimoine mondial
      des forêts primaires de hêtres depuis 2017.
    before: >-
      Les feux sont interdits dans tout le parc, tout comme les véhicules motorisés, quads, motoneiges et
      motos tout-terrain. La meilleure saison va de mai à octobre.
    around: >-
      À quatre kilomètres se trouve le [parc national de Buila-Vânturarița - gorges de la
      Bistrița](/lugar/parcul-national-buila-vanturarita---cheile/) et à huit kilomètres les [monts
      Iezer-Păpușa](/lugar/muntii-iezer-papusa/). La [réserve forestière de
      Latorița](/lugar/codrul-secular-latorita/) est à vingt-deux kilomètres et la [réserve naturelle de la
      rivière Vâlsan](/lugar/raul-valsan---rezervatia-naturala/) à vingt-trois kilomètres. Les forêts
      anciennes possèdent leur fiche dédiée : [parc national de Cozia - forêts
      primaires](/lugar/parcul-national-cozia---codrii-seculari/).
  de:
    intro: >-
      Die Südkarpaten schienen unüberwindbar, doch der Fluss Olt schnitt dennoch hindurch. Im Olt-Tal
      durchbrach das Wasser den harten Gneis des Cozia-Massivs und schuf eine Passage, der heute Bundesstraße,
      Bahnlinie und Zugvögel folgen. Zu beiden Seiten breitet sich der 1990 gegründete Nationalpark Cozia über
      17.100 Hektar Wald aus, der die Massive Cozia und Narățu sowie Teile des Lotru- und Căpățânii-Gebirges
      umschließt.


      Aus der Ferne gleicht das Cozia-Massiv einer mächtigen Steinburg mit Felszinnen, Steilwänden und Kämmen
      hoch über dem Olt-Tal.
    landscape: >-
      Das Gestein beherrscht die Szenerie. Der Großteil des Parks besteht aus kristallinem Grundgebirge im
      Zentrum und Norden, gesäumt von einem Sedimentstreifen im Süden beiderseits des Olt. Vorherrschend ist
      der Cozia-Gneis mit Steilhängen zwischen 50 und 70 Grad Neigung, an denen Bodenbildung kaum stattfindet.
      An der Ostflanke des Massivs ragen Felsnadeln, kahle Gesimse und steile Grasrinnen auf.


      Auf diesem Urgestein stockt ein Wald, der rund 96 % des Parks zwischen 300 und 1.600 Metern Seehöhe
      bedeckt, geprägt von einem Übergangsklima aus karpatischen und submediterranen Einflüssen. Traubeneichen
      klettern an sonnigen Hängen über 1.300 Meter empor, während Buche und Tanne im Engtal bis auf 300 Meter
      herabreichen. Die UNESCO-Wälder von Cozia mit fast 3.400 Hektar bewahren Ur-Buchenwälder, die sich seit
      Jahrhunderten ohne Forstwirtschaft entwickeln. Alte Buchen, Tannen und Bergahorne erreichen oft über 40
      Meter Höhe und 1,5 Meter Stammdurchmesser. Totholz und Naturverjüngung sichern den Kreislauf.
    wildlife: >-
      Im Frühjahr überzieht den Waldboden ein Blütenteppich aus Pulmonaria rubra, Symphytum cordatum und
      Dentaria glanduligera. Zur Flora zählen das Edelweiß sowie die Cozia-Endemiten Centaurea coziensis und
      Rosa coziae. Über tausend Pflanzenarten wachsen im Park.


      Zu den Säugetieren zählen [Braunbär](/especie/ursus_arctos/), [Wolf](/especie/canis_lupus/),
      [Eurasischer Luchs](/especie/lynx_lynx/), [Wildkatze](/especie/felis_silvestris/),
      [Baummarder](/especie/martes_martes/), Steinmarder, [Rothirsch](/especie/cervus_elaphus/),
      [Reh](/especie/capreolus_capreolus/) und die [Gämse](/especie/rupicapra_rupicapra/). Am Himmel kreisen
      [Steinadler](/especie/aquila_chrysaetos/), [Schreiadler](/especie/aquila_pomarina/),
      [Wanderfalke](/especie/falco_peregrinus/), [Habichtskauz](/especie/strix_uralensis/), Waldkauz und
      [Sperlingskauz](/especie/glaucidium_passerinum/). Im Wald balzt das
      [Auerhuhn](/especie/tetrao_urogallus/), während an den Wildbächen
      [Wasseramsel](/especie/cinclus_cinclus/) und Gebirgsstelzen leben.


      Das Tal dient zudem als wichtiger Vogelzugkorridor zwischen Mitteleuropa und der Ägäis; die Stauseen
      Turnu und Gura Lotrului bieten Rastplätze für Wasservögel. Insgesamt sind über 120 Vogelarten
      verzeichnet.


      Die Bergbäche ernähren mehr als 30 Fischarten wie die [Bachforelle](/especie/salmo_trutta/). Die
      [Europäische Hornotter](/especie/vipera_ammodytes/) erreicht hier eines ihrer nördlichsten Vorkommen in
      Rumänien. Unter den Insekten sind [Hirschkäfer](/especie/lucanus_cervus/) und
      [Alpenbock](/especie/rosalia_alpina/) hervorzuheben, ebenso der endemische Karpaten-Pseudoskorpion
      (Neobisium carpathicum).
    visit: >-
      Das Begehen ist nur auf den markierten Wegen gestattet. Die Hauptzufahrt erfolgt über die Straße DN 7 /
      E 81; die Bahnlinie Râmnicu Vâlcea–Sibiu durchquert das Tal mit Haltepunkten in Păușa, Turnu, Cozia,
      Gura Lotrului, Călinești-Bețel und Cornet.


      Zum Lotrișor-Wasserfall geht man vom Parkplatz durchschnittlich 35 bis 40 Minuten zu Fuß. Die
      Lotrișor-Schlucht weist Steilwände von über 300 bis 400 Metern Höhe auf. Das Felsentor Poarta Omului (10
      Meter hoch, 7 breit) erreicht man in etwa einer Stunde von der Cozia-Gipfelhütte auf dem rot markierten
      Bandweg. Im Stânișoara-Sektor gibt es vier Wanderrouten, und der rote Weg nach Călinești startet am
      Besucherzentrum und führt zehn Minuten an Brezoi vorbei. Die Panoramatour Doabrele Brezoiului erfordert
      fünf bis sechs Gehzeit.


      Geologisch interessant sind die Pietrele Zimbrilor bei Brezoi, ein 500 Hektar großes Erosionsgebiet. An
      den Doabrele Brezoiului veranschaulichen fossilführende Schichten die Krustendynamik.
    history: >-
      Das Tal war stets Durchgangsland: Das römische Kastell Arutela steht auf einer älteren Dakersiedlung am
      linken Olt-Ufer, während das Kloster Cozia auf Fürst Mircea den Älteren vom 20. Mai 1388 zurückgeht.


      Die UNESCO-Urwaldzonen von Cozia umfassen fast 3.400 Hektar, umgeben von Schutzzonen zur Wahrung
      natürlicher Prozesse. Cozia und Lotrișor gehören seit 2017 zum UNESCO-Welterbe der Buchenurwälder.
    before: >-
      Offenes Feuer ist im gesamten Park untersagt, ebenso das Befahren mit Quads, Motorschlitten und
      Geländemotorrädern. Die beste Reisezeit reicht von Mai bis Oktober.
    around: >-
      Vier Kilometer entfernt liegt der [Nationalpark Buila-Vânturarița -
      Bistrița-Schlucht](/lugar/parcul-national-buila-vanturarita---cheile/) und acht Kilometer das
      [Iezer-Păpușa-Gebirge](/lugar/muntii-iezer-papusa/). Das
      [Latorița-Urwaldreservat](/lugar/codrul-secular-latorita/) ist zweiundzwanzig Kilometer entfernt und das
      [Naturreservat Vâlsan-Fluss](/lugar/raul-valsan---rezervatia-naturala/) dreiundzwanzig Kilometer. Die
      Buchenwälder besitzen einen eigenen Eintrag: [Nationalpark Cozia -
      Urwälder](/lugar/parcul-national-cozia---codrii-seculari/).
  it:
    intro: >-
      I Carpazi Meridionali sembravano sbarrare ogni via, eppure il fiume Olt li ha superati da parte a parte.
      Nella gola dell'Olt, la corrente ha inciso il duro gneiss del massiccio di Cozia aprendo un varco
      percorso oggi dalla strada statale, dalla ferrovia e dalle rotte degli uccelli migratori. Ai due lati si
      sviluppa il Parco Nazionale di Cozia: 17.100 ettari di boschi, dichiarati parco nazionale nel 1990, che
      racchiudono i massicci di Cozia e Narățu e porzioni dei monti Lotru e Căpățânii.


      Visto da lontano, il massiccio di Cozia appare come una possente fortezza di roccia, con bastionate,
      torri e creste che dominano la vallata.
    landscape: >-
      La roccia governa l'ambiente. La maggior parte del parco è composta da formazioni cristalline nel
      settore centrale e settentrionale, orlate a sud da una fascia sedimentaria lungo entrambe le sponde
      dell'Olt. Prevale lo gneiss di Cozia, con versanti scoscesi inclinati tra 50 e 70 gradi dove il suolo
      vegetale stenta ad attecchire. Sul versante orientale della montagna si alzano guglie rupestri, cenge
      nude e canali erbosi.


      Su questa pietra si stende una foresta che ricopre circa il 96 % del parco, tra i 300 e i 1600 metri di
      altitudine, con un clima che accosta elementi carpatici e influenze sottomediterranee. È un bosco di
      associazioni insolite: il rovere sale a oltre 1300 metri sui versanti soleggiati, mentre il faggio e
      l'abete bianco scendono nella gola fino a quota 300. Le foreste UNESCO di Cozia, estese su quasi 3400
      ettari, custodiscono faggete primarie evolutesi per secoli senza alcun taglio boschivo. Faggi, abeti e
      aceri secolari superano sovente i 40 metri d'altezza e 1,5 metri di diametro del tronco. Tra legno morto
      e rinnovazione spontanea, l'ecosistema si autosostiene.
    wildlife: >-
      In primavera il sottobosco dei faggi si riveste di fioriture: Pulmonaria rubra, Symphytum cordatum e
      Dentaria glanduligera. Tra le piante più note compare la stella alpina, mentre tra gli endemismi
      figurano Centaurea coziensis e Rosa coziae. Il parco conta oltre mille specie vegetali.


      Tra i mammiferi spiccano l' [orso bruno](/especie/ursus_arctos/), il [lupo
      grigio](/especie/canis_lupus/), la [lince europea](/especie/lynx_lynx/), il [gatto
      selvatico](/especie/felis_silvestris/), la [martora](/especie/martes_martes/), la faina, il [cervo
      nobile](/especie/cervus_elaphus/), il [capriolo](/especie/capreolus_capreolus/) e il
      [camoscio](/especie/rupicapra_rupicapra/). Nei cieli volteggiano l' [aquila
      reale](/especie/aquila_chrysaetos/), l' [aquila anatraia minore](/especie/aquila_pomarina/), il [falco
      pellegrino](/especie/falco_peregrinus/), l' [allocco degli Urali](/especie/strix_uralensis/), l'allocco
      comune e la [civetta nana](/especie/glaucidium_passerinum/). Nelle selve nidifica il [gallo
      cedrone](/especie/tetrao_urogallus/), mentre le acque ospitano il [merlo
      acquaiolo](/especie/cinclus_cinclus/) e le ballerine.


      La forra rappresenta inoltre un corridoio migratorio fondamentale tra l'Europa centrale e l'Egeo; gli
      invasi di Turnu e Gura Lotrului accolgono soste invernali per gli uccelli acquatici. Si contano oltre
      120 specie di uccelli.


      I torrenti ospitano oltre 30 specie di pesci tra cui la [trota fario](/especie/salmo_trutta/). La
      [vipera dal corno](/especie/vipera_ammodytes/) trova qui una delle stazioni più meridionali della
      Romania. Tra gli insetti protetti figurano il [cervo volante](/especie/lucanus_cervus/) e la [rosalia
      alpina](/especie/rosalia_alpina/), oltre allo pseudoscorpione dei Carpazi (Neobisium carpathicum).
    visit: >-
      Le escursioni sono ammesse solo lungo i tracciati segnati. L'accesso principale avviene dalla strada DN
      7 / E 81, e la linea ferroviaria Râmnicu Vâlcea–Sibiu percorre la gola con fermate nel parco a Păușa,
      Turnu, Cozia, Gura Lotrului, Călinești-Bețel e Cornet.


      Per raggiungere la cascata di Lotrișor dal parcheggio si cammina in media da 35 a 40 minuti. La forra di
      Lotrișor presenta pareti verticali tra 300 e 400 metri. Poarta Omului, un arco naturale di 10 metri
      d'altezza per 7 di larghezza, si raggiunge in circa un'ora dal rifugio di vetta di Cozia sul sentiero a
      banda rossa. Nel settore di Stânișoara si sviluppano quattro itinerari escursionistici, e il tracciato
      rosso verso Călinești parte accanto al centro visite passando a dieci minuti da Brezoi. L'anello
      panoramico di Doabrele Brezoiului richiede circa cinque o sei ore di cammino.


      Per la geologia, le Pietrele Zimbrilor presso Brezoi coprono circa 500 ettari scolpiti nelle rocce
      sedimentarie. A Doabrele Brezoiului le bancate fossilifere svelano la tettonica terrestre come in un
      laboratorio.
    history: >-
      La gola è sempre stata via di transito: il castrum romano di Arutela poggia su un precedente
      insediamento dacico sulla riva sinistra dell'Olt, mentre il monastero di Cozia venne eretto per volere
      del principe Mircea il Vecchio con atto del 20 maggio 1388.


      I settori UNESCO di Cozia coprono quasi 3400 ettari, circondati da un'ampia fascia di rispetto per
      tutelare i processi ecologici. Cozia e Lotrișor sono state integrate nel patrimonio mondiale UNESCO
      delle faggete primarie nel 2017.
    before: >-
      È vietato accendere fuochi nel parco e circolare con quad, motoslitte e motocross. La stagione ideale va
      da maggio a ottobre.
    around: >-
      A quattro chilometri sorge il [Parco Nazionale Buila-Vânturarița - Gola della
      Bistrița](/lugar/parcul-national-buila-vanturarita---cheile/) e a otto i [Monti
      Iezer-Păpușa](/lugar/muntii-iezer-papusa/). La [Riserva Forestale di
      Latorița](/lugar/codrul-secular-latorita/) dista ventidue chilometri e la [Riserva Naturale del Fiume
      Vâlsan](/lugar/raul-valsan---rezervatia-naturala/) ventitré chilometri. Le faggete UNESCO sono descritte
      nella voce dedicata: [Parco Nazionale Cozia - Foreste
      Primarie](/lugar/parcul-national-cozia---codrii-seculari/).
  pt:
    intro: >-
      Os Cárpatos Meridionais pareciam erguer uma muralha intransponível, mas o rio Olt rasgou-a de lés a lés.
      No desfiladeiro do Olt, as águas cortaram o gnaisse duro do maciço de Cozia e abriram uma fenda que hoje
      é acompanhada pela estrada nacional, pelo caminho de ferro e pelos bandos de aves em migração. De ambos
      os lados estende-se o Parque Nacional de Cozia: 17.100 hectares de floresta declarados parque nacional
      em 1990, abrangendo os maciços de Cozia e Narățu e setores das montanhas de Lotru e Căpățânii.


      Avistado à distância, o maciço de Cozia parece uma enorme fortaleza de pedra, coroada de pináculos,
      escarpas e cristas sobre o vale do Olt.
    landscape: >-
      A geologia impõe-se na paisagem. A maior parte do parque assenta em rochas cristalinas no centro e
      norte, marginadas a sul por uma faixa sedimentar em ambas as margens do Olt. Predomina o gnaisse de
      Cozia com declives abruptos entre 50 e 70 graus, onde os solos mal se fixam. Na vertente oriental
      elevam-se torres de pedra, cornijas nuas e canais escarpados de erva.


      Sobre a rocha assenta uma floresta que cobre cerca de 96 % do parque, estendendo-se entre os 300 e os
      1600 metros de altitude, sob um clima de transição cárpato e submediterrânico. É uma mata de associações
      botânicas singulares: o carvalho-roble sobe a mais de 1300 metros nas encostas soalheiras, enquanto a
      faia e o abeto descem pela garganta até aos 300 metros. Os faiais UNESCO de Cozia, com quase 3400
      hectares, preservam ecossistemas intocados que evoluíram durante séculos sem exploração florestal.
      Faias, abetos e bordos seculares superam com frequência os 40 metros de altura e 1,5 metros de diâmetro.
      O ecossistema vive em perfeito equilíbrio com madeira morta e regeneração natural.
    wildlife: >-
      Na primavera, o solo do faial cobre-se de mantos floridos: Pulmonaria rubra, Symphytum cordatum e
      Dentaria glanduligera. A flora inclui o edelvaisse e endemismos locais como Centaurea coziensis e Rosa
      coziae. O parque congrega mais de mil espécies de plantas.


      Entre os mamíferos emblemáticos contam-se o [urso-pardo](/especie/ursus_arctos/), o
      [lobo](/especie/canis_lupus/), o [lince-euroasiático](/especie/lynx_lynx/), o
      [gato-bravo](/especie/felis_silvestris/), a [marta](/especie/martes_martes/), a fuinha, o
      [veado-vermelho](/especie/cervus_elaphus/), o [corço](/especie/capreolus_capreolus/) e a
      [camurça](/especie/rupicapra_rupicapra/). Pelos céus planam a [águia-real](/especie/aquila_chrysaetos/),
      a [águia-pomerana](/especie/aquila_pomarina/), o [falcão-peregrino](/especie/falco_peregrinus/), a
      [coruja-uralense](/especie/strix_uralensis/), a coruja-do-mato e o
      [mocho-pigmeu](/especie/glaucidium_passerinum/). Nos bosques nidifica o
      [tetraz-grande](/especie/tetrao_urogallus/), enquanto o [melro-d'água](/especie/cinclus_cinclus/) e as
      alvéolas frequentam os cursos de água.


      A garganta funciona como rota migratória entre a Europa Central e o mar Egeu, com as albufeiras de Turnu
      e Gura Lotrului a acolherem aves aquáticas invernantes. Registam-se mais de 120 espécies de aves.


      Os rios de montanha sustentam mais de 30 espécies de peixes, incluindo a
      [truta-de-rio](/especie/salmo_trutta/). A [víbora-cornuda](/especie/vipera_ammodytes/) encontra aqui um
      dos seus limites de distribuição. Entre os insetos protegidos destacam-se a
      [vaca-loura](/especie/lucanus_cervus/) e a [rosália-alpina](/especie/rosalia_alpina/), juntamente com o
      pseudoescorpião dos Cárpatos (Neobisium carpathicum).
    visit: >-
      As visitas apenas são permitidas nos trilhos assinalados. O acesso rodoviário faz-se pela estrada DN 7 /
      E 81, e a ferrovia Râmnicu Vâlcea–Sibiu cruza o desfiladeiro com apeadeiros no parque em Păușa, Turnu,
      Cozia, Gura Lotrului, Călinești-Bețel e Cornet.


      Para alcançar a cascata de Lotrișor a partir do parque de estacionamento caminha-se entre 35 a 40
      minutos. A garganta de Lotrișor possui escarpas verticais que superam os 300 a 400 metros de altura.
      Poarta Omului, um portal natural com 10 metros de altura e 7 de largura, atinge-se em cerca de uma hora
      a partir do refúgio do cume de Cozia pela rota assinalada a fita vermelha. No setor de Stânișoara
      existem quatro percursos pedestres, e o trilho vermelho para Călinești parte junto ao centro de
      acolhimento passando a dez minutos de Brezoi. A volta panorâmica de Doabrele Brezoiului exige cinco a
      seis horas de caminhada.


      Em termos geológicos, as Pietrele Zimbrilor perto de Brezoi formam um conjunto de 500 hectares esculpido
      na rocha sedimentar. Em Doabrele Brezoiului, as camadas fossilíferas expõem a dinâmica tectónica da
      crosta terrestre.
    history: >-
      O desfiladeiro foi sempre rota de passagem: o castro romano de Arutela ergue-se sobre um antigo povoado
      dácio na margem esquerda do Olt, e o mosteiro de Cozia foi fundado por Mircea o Velho a 20 de maio de
      1388.


      As zonas UNESCO de floresta primária abrangem quase 3400 hectares, envolvidas por faixas de proteção
      destinadas a resguardar a dinâmica natural. Cozia e Lotrișor integram o património mundial UNESCO de
      faiais antigos desde 2017.
    before: >-
      É proibido acender fogueiras no parque, bem como circular em moto-quatro, motas de neve ou veículos
      todo-o-terreno. A época recomendada vai de maio a outubro.
    around: >-
      A quatro quilómetros fica o [Parque Nacional Buila-Vânturarița - Desfiladeiro de
      Bistrița](/lugar/parcul-national-buila-vanturarita---cheile/) e a oito quilómetros as [Montanhas de
      Iezer-Păpușa](/lugar/muntii-iezer-papusa/). A [Reserva Florestal de
      Latorița](/lugar/codrul-secular-latorita/) dista vinte e dois quilómetros e a [Reserva Natural do Rio
      Vâlsan](/lugar/raul-valsan---rezervatia-naturala/) vinte e três quilómetros. Os faiais UNESCO têm ficha
      própria: [Parque Nacional de Cozia - Florestas
      Primárias](/lugar/parcul-national-cozia---codrii-seculari/).
