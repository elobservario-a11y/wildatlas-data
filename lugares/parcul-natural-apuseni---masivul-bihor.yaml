resumen:
  es: >-
    El corazón del karst de los Cárpatos Occidentales, con dolinas masivas, glaciares subterráneos
    (*Scărișoara*) y hayedos.
  en: >-
    The karst heart of the Western Carpathians, featuring colossal sinkholes, underground glaciers
    (*Scărișoara*) and beech forests.
  fr: >-
    Le cœur karstique des Carpates occidentales, percé de dolines géantes, de glaciers souterrains
    (*Scărișoara*) et de hêtraies.
  de: >-
    Das Karstherz der Westkarpaten mit riesigen Dolinen, unterirdischen Eishöhlen (*Scărișoara*) und
    Buchenwäldern.
  it: >-
    Il cuore carsico dei Carpazi Occidentali, con doline imponenti, ghiacciai sotterranei (*Scărișoara*) e
    faggete.
  pt: >-
    O coração cársico dos Cárpatos Ocidentais, com dolinas massivas, glaciares subterrâneos (*Scărișoara*) e
    faiais.
unico:
  es: La cueva glaciar de Scărișoara guarda el mayor bloque de hielo subterráneo del mundo.
  en: The Scărișoara ice cave preserves the largest subterranean ice block in the world.
  fr: La grotte glaciaire de Scărișoara abrite le plus volumineux bloc de glace souterraine au monde.
  de: Die Eishöhle Scărișoara birgt den mächtigsten unterirdischen Eisblock der Welt.
  it: La grotta glaciale di Scărișoara custodisce il più grande blocco di ghiaccio sotterraneo del pianeta.
  pt: A gruta glaciar de Scărișoara preserva o maior bloco de gelo subterrâneo do mundo.
observaciones:
  es: >-
    Los mejores meses son de mayo a octubre. El acceso al parque se hace desde tres carreteras que lo bordean:
    Oradea–Huedin–Cluj-Napoca, Oradea–Beiuș–Deva y Ștei–Câmpeni–Turda.


    El reglamento restringe el acceso a cuevas salvo aquellas integradas en circuitos turísticos y dotadas de
    infraestructura de visita. El circuito de Cetățile Ponorului está prohibido en invierno.
texto:
  es:
    intro: >-
      En Padiș el agua no corre por la superficie: se cuela. Esta meseta kárstica, a unos 1225 m de altitud,
      es casi llana y está acribillada de dolinas; algunas guardan lagos, otras grupos de piceas. Todo lo que
      cae del cielo desaparece bajo tierra y reaparece en cuevas, simas, sumideros y glaciares subterráneos.
      El Parque Natural Apuseni extiende ese mundo hueco por unas 76.000 hectáreas entre Bihor, Cluj y Alba, y
      lo mezcla con bosques, praderas, valles y gargantas.
    landscape: >-
      El parque es, sobre todo, caliza. En la meseta de Padiș se juntan calizas y dolomías, y alrededor se
      levantan cumbres, paredes de roca, gargantas y valles. Las dolinas de Lumea Pierdută, el sumidero de
      Cetățile Ponorului y la sima Avenul cu Vacă dan una idea de lo que pasa debajo, y entre las cuevas
      figuran la de los Osos y la cueva glaciar Focul Viu.


      Algunos rincones guardan frío incluso lejos del invierno. En la depresión de Groapa de la Barsa hay dos
      glaciares, Barsa y Zăpodie, y la nieve aguanta allí hasta finales de mayo. La cueva de Scărișoara mide
      720 m de longitud y 105 m de profundidad, y se entra a ella por una sima de 48 m de profundidad y 60 m
      de diámetro. La de Vârtop, también llamada Peştera Minunată, está a unos 1170 m, cerca de Casa de
      Piatră. El valle de Sighiștel mide solo 9 km, pero casi la mitad discurre entre paredes verticales que
      forman un cañón, y es la zona con más cavidades naturales por unidad de superficie del país.


      La cueva de los Osos tiene una historia reciente: se descubrió en 1975, cuando una voladura en la
      cantera de mármol de Chișcău abrió una brecha en el macizo.


      El clima cambia con la altura. Llueve entre 600 mm en el valle del Arieșul Mare y 1300–1400 mm en los
      montes Bihorului, y la temperatura media anual va de 2 a 4 °C en Vlădeasa y de 8 a 10 °C en la depresión
      de Beiuș. En el norte, el lago artificial Beliș-Fântânele se construyó entre 1970 y 1974.
    wildlife: >-
      Los bosques son de abetos (Abies alba), piceas y tejos en la montaña, con hayedos, robledales y carpe
      dacios más abajo, además de bosques relictos y aluviales y turberas activas. En los pastizales crecen
      Cypripedium calceolus, Campanula alpina y la orquídea Liparis loeselii.


      Entre los mamíferos grandes figuran el ciervo, el [rebeco](/especie/rupicapra_rupicapra/), el corzo, el
      [oso pardo](/especie/ursus_arctos/) y el [lobo](/especie/canis_lupus/); también hay
      [lince](/especie/lynx_lynx/), [gato montés](/especie/felis_silvestris/), marta y
      [nutria](/especie/lutra_lutra/). Entre los murciélagos se cuenta el de herradura grande, Rhinolophus
      ferrumequinum, y el orejudo Plecotus auritus.


      Las aves del bosque son el [urogallo](/especie/tetrao_urogallus/), el [águila
      real](/especie/aquila_chrysaetos/), el grévol y el [águila pomerana](/especie/aquila_pomarina/); en los
      troncos trabajan el [pito negro](/especie/dryocopus_martius/) y el [pico
      tridáctilo](/especie/picoides_tridactylus/). Entre reptiles y anfibios hay culebra de Esculapio, culebra
      lisa y [salamandra](/especie/salamandra_salamandra/).


      El año se lee en la nieve. De mayo a octubre es la temporada para caminar; en invierno el esquí de
      travesía toma los senderos, y el tramo de Vârtop al pico Bihor es una de las rutas de esquí de travesía
      más visitadas de los Apuseni.
    visit: >-
      La red de senderos se agrupa en torno a dos grandes magistrales de cresta. La Banda Roja cruza el parque
      de norte a sur y enlaza muchos de sus puntos de interés; de Stâna de Vale al pico Bihor mide 39,5 km y
      lleva unas 12-13 horas. La Banda Azul va de Cabana Vlădeasa a Gârda de Sus, mide 62,5 km y se hace en al
      menos dos días. Algunas rutas marcadas del parque datan de 1903.


      Para un día, Padiș es el punto de partida. El circuito de Cetățile Ponorului, desde la cabaña, mide 12
      km y lleva unas cinco horas, con tramos difíciles. El de Galbena, de 19 km, tarda unas diez horas y
      recorre la zona kárstica de las fuentes del valle de Galbena. El de Lumea Pierdută es el suave: 7,5 km,
      unas dos horas, de dificultad reducida y con varias simas. Y el sendero de la cascada de Bohodei exige
      manos: tiene tres tramos de roca equipados con cadenas.


      Los centros de visitantes son tres: Padiș, Gârda y Doda Pilii. Además, hay siete puntos de información
      turística en las áreas protegidas. El centro administrativo y de visitantes de Sudrigiu queda fuera de
      los límites protegidos, a unos 300 m del cruce de la E79 con el camino a Pietroasa, Chișcău y la cueva
      de los Osos.
    history: >-
      El parque se constituyó por orden ministerial en 1990 y una ley del 6 de marzo de 2000 lo declaró área
      protegida. En 2009 recibió un premio europeo EDEN, en la gala de ese año. La memoria humana también está
      en pueblos como Cărpiniș, donde una casa-museo recuerda a Ion Oargă Cloșca, líder de la revuelta de
      siervos transilvanos de 1784, o Arieșeni, con su iglesia de madera levantada en 1791.
    before: >-
      Los mejores meses son de mayo a octubre. El acceso al parque se hace desde tres carreteras que lo
      bordean: Oradea–Huedin–Cluj-Napoca, Oradea–Beiuș–Deva y Ștei–Câmpeni–Turda.


      El reglamento restringe el acceso a cuevas salvo aquellas integradas en circuitos turísticos y dotadas
      de infraestructura de visita. El circuito de Cetățile Ponorului está prohibido en invierno.
    around: Pegado al parque, a 0 km según el atlas, está el [Valle de Someșul Rece](/lugar/somesul-rece-valley/).
  en:
    intro: >-
      At Padiș, water does not flow across the surface: it disappears. This karst plateau, sitting at some
      1225 m altitude, is nearly level and riddled with sinkholes; some cradle lakes, others cluster spruces.
      Everything falling from the sky slips underground, re-emerging through caves, chasms, ponors and
      subterranean glaciers. Apuseni Natural Park unfolds this hollow world across some 76,000 hectares
      spanning Bihor, Cluj and Alba, seamlessly blending it with old-growth woods, pastures, valleys and
      limestone gorges.
    landscape: >-
      The park is, above all, limestone and dolomite. On the Padiș plateau, carbonate rocks convene beneath
      crests, cliff ramparts, defiles and gorges. The sinkholes of Lumea Pierdută, the colossal ponor of
      Cetățile Ponorului and the Avenul cu Vacă chasm reveal what transpires beneath; notable caverns include
      the Bears' Cave and the Focul Viu ice cave.


      Certain hollows hold permafrost conditions even through summer heat. In the depression of Groapa de la
      Barsa lie two subterranean glaciers, Barsa and Zăpodie, where snow lingers through late May. Scărișoara
      Cave measures 720 m in length and 105 m in depth, entered via a vertical shaft 48 m deep and 60 m in
      diameter. Vârtop Cave, also known as Peștera Minunată, sits at roughly 1170 m near Casa de Piatră. The
      Sighiștel valley spans barely 9 km, yet almost half forms a narrow slot canyon with the highest cave
      density per unit area in the country.


      The Bears' Cave has a recent discovery history: it was revealed in 1975 when industrial blasting at the
      Chișcău marble quarry breached the underground chamber.


      Climate tracks altitude. Precipitation ranges from 600 mm in the Arieșul Mare valley to 1300–1400 mm on
      the Bihor heights; average annual temperatures range from 2 to 4 °C on Vlădeasa and 8 to 10 °C in the
      Beiuș depression. In the north, the Beliș-Fântânele reservoir was constructed between 1970 and 1974.
    wildlife: >-
      Montane woodlands feature silver fir, Norway spruce and yew on high slopes, with European beech, sessile
      oak and Dacian hornbeam lower down, alongside active peat bogs. Meadows support lady's slipper orchid,
      alpine bellflower and fen orchid.


      Large mammals include red deer, [chamois](/especie/rupicapra_rupicapra/), roe deer, [brown
      bear](/especie/ursus_arctos/) and [wolf](/especie/canis_lupus/); also present are [Eurasian
      lynx](/especie/lynx_lynx/), [wildcat](/especie/felis_silvestris/), pine marten and [Eurasian
      otter](/especie/lutra_lutra/). Bats include greater horseshoe and brown long-eared bats.


      Avian residents include [western capercaillie](/especie/tetrao_urogallus/), [golden
      eagle](/especie/aquila_chrysaetos/), hazel grouse and [lesser spotted eagle](/especie/aquila_pomarina/);
      woodpeckers include [black woodpecker](/especie/dryocopus_martius/) and [Eurasian three-toed
      woodpecker](/especie/picoides_tridactylus/). Herpetofauna includes Aesculapian snake, smooth snake and
      [fire salamander](/especie/salamandra_salamandra/).


      Seasonality tracks the snowpack. May to October is prime trekking season; in winter, ski mountaineering
      takes over, with the traverse from Vârtop to Bihor peak being one of the most celebrated ski touring
      routes in the Apuseni.
    visit: >-
      The trail network pivots around two grand ridge highways. The Red Strip crosses north to south linking
      major highlights; from Stâna de Vale to Bihor peak measures 39.5 km, taking roughly 12-13 hours. The
      Blue Strip runs from Cabana Vlădeasa to Gârda de Sus, measuring 62.5 km and requiring at least two days.
      Certain marked paths date back to 1903.


      For day trips, Padiș is the premier base. The Cetățile Ponorului loop from the chalet covers 12 km in
      about five hours with challenging scrambles. The Galbena loop spans 19 km in ten hours exploring karst
      gorges and springs. The Lumea Pierdută circuit is gentler: 7.5 km in two hours with mild gradients.
      Bohodei waterfall requires scrambling: three rock pitches are secured with iron chains.


      Three visitor centres serve the park: Padiș, Gârda and Doda Pilii, backed by seven tourist information
      points. The Sudrigiu headquarters lies outside park boundaries, roughly 300 m from the E79 junction
      towards Pietroasa, Chișcău and the Bears' Cave.
    history: >-
      The park was formed by ministerial order in 1990 and formally declared a protected area on 6 March 2000.
      In 2009 it earned a European EDEN award. Cultural heritage endures in hamlets like Cărpiniș, where a
      museum commemorates Ion Oargă Cloșca, leader of the 1784 Transylvanian serf uprising, and Arieșeni with
      its wooden church erected in 1791.
    before: >-
      Best months run from May to October. Park access is via three boundary roads: Oradea–Huedin–Cluj-Napoca,
      Oradea–Beiuș–Deva and Ștei–Câmpeni–Turda.


      Park bylaws strictly prohibit entering caves without tourist infrastructure. The Cetățile Ponorului loop
      is forbidden in winter.
    around: >-
      Directly adjoining the park, 0 km away in the atlas, lies the [Someșul Rece
      Valley](/lugar/somesul-rece-valley/).
  fr:
    intro: >-
      À Padiș, l'eau ne coule pas en surface : elle s'engouffre. Ce haut plateau calcaire, perché vers 1225 m
      d'altitude, est presque plat et criblé de dolines ; certaines abritent des lacs, d'autres des bouquets
      d'épicéas. Toute pluie disparaît sous terre pour reparaître dans des grottes, gouffres, pertes et
      glaciers souterrains. Le parc naturel Apuseni étend ce monde caverneux sur quelque 76 000 hectares entre
      Bihor, Cluj et Alba, en l'associant à des forêts primaires, prairies, vallées et défilés rocheux.
    landscape: >-
      Le parc est avant tout calcaire et dolomitique. Sur le plateau de Padiș, la roche s'entoure de crêtes,
      falaises et gorges. Les dolines de Lumea Pierdută, la gigantesque perte de Cetățile Ponorului et l'abîme
      Avenul cu Vacă illustrent cette dynamique souterraine ; parmi les grottes majeures figurent la grotte
      des Ours et la grotte de glace Focul Viu.


      Certaines combes conservent le gel même en plein été. Dans la dépression de Groapa de la Barsa gisent
      deux glaciers souterrains, Barsa et Zăpodie, où la neige résiste jusqu'à fin mai. La grotte de
      Scărișoara s'étend sur 720 m de long et 105 m de profondeur, accessible par un puits de 48 m de fond et
      60 m de diamètre. La grotte de Vârtop, dite Peștera Minunată, s'ouvre vers 1170 m près de Casa de
      Piatră. La vallée de Sighiștel ne fait que 9 km, mais serpente dans un canyon étroit offrant la plus
      forte densité de grottes par unité de surface du pays.


      La grotte des Ours possède une histoire récente : elle fut découverte en 1975 lorsqu'un tir de mine dans
      la carrière de marbre de Chișcău ouvrit une brèche dans la paroi.


      Le climat varie avec le relief. Les précipitations vont de 600 mm dans la vallée de l'Arieșul Mare à
      1300–1400 mm sur les monts Bihor ; la moyenne thermique annuelle s'échelonne de 2 à 4 °C sur le Vlădeasa
      et de 8 à 10 °C dans la dépression de Beiuș. Au nord, le lac de barrage de Beliș-Fântânele a été édifié
      entre 1970 et 1974.
    wildlife: >-
      Les forêts marient sapin blanc, épicéa et if sur les hauteurs, relayés par la hêtraie, la chênaie et le
      charme dace plus bas, ainsi que des tourbières actives. Dans les clairieres croissent le sabot de Vénus,
      la campanule alpine et le liparis de Loesel.


      Les mammifères comptent le cerf, le [chamois](/especie/rupicapra_rupicapra/), le chevreuil, l'[ours
      brun](/especie/ursus_arctos/) et le [loup](/especie/canis_lupus/) ; s'y ajoutent le
      [lynx](/especie/lynx_lynx/), le [chat sauvage](/especie/felis_silvestris/), la martre et la
      [loutre](/especie/lutra_lutra/). Les chauves-souris incluent grand rhinolophe et oreillard roux.


      L'avifaune forestière abrite le [grand tétras](/especie/tetrao_urogallus/), l'[aigle
      royal](/especie/aquila_chrysaetos/), la gélinotte et l'[aigle pomarin](/especie/aquila_pomarina/) ; sur
      les fûts travaillent le [pic noir](/especie/dryocopus_martius/) et le [pic
      tridactyle](/especie/picoides_tridactylus/). Parmi les reptiles et amphibiens vivent couleuvre
      d'Esculape, coronelle et [salamandre tachetée](/especie/salamandra_salamandra/).


      Le rythme annuel suit l'enneigement. De mai à octobre s'étend la saison de marche ; en hiver, le ski de
      randonnée investit les crêtes, la traversée de Vârtop au pic Bihor figurant parmi les parcours les plus
      courus des Apuseni.
    visit: >-
      Le réseau s'articule autour de deux grands axes de crête. La Bande Rouge traverse le parc du nord au sud
      reliant les hauts lieux ; de Stâna de Vale au pic Bihor, elle fait 39,5 km en environ 12-13 heures. La
      Bande Bleue relie le refuge Vlădeasa à Gârda de Sus sur 62,5 km en au moins deux jours. Plusieurs
      sentiers balisés remontent à 1903.


      Pour une journée, Padiș est le départ idéal. La boucle de Cetățile Ponorului fait 12 km en environ cinq
      heures avec passages escarpés. Celle de Galbena couvre 19 km en dix heures dans les gorges karstiques.
      Lumea Pierdută propose un circuit aisé : 7,5 km en deux heures autour de plusieurs gouffres. La cascade
      de Bohodei est sportive, franchissant trois ressauts rocheux équipés de chaînes.


      Trois centres de visiteurs accueillent le public : Padiș, Gârda et Doda Pilii, appuyés par sept points
      d'information. Le siège de Sudrigiu se situe hors parc, à environ 300 m de l'embranchement de l'E79 vers
      Pietroasa, Chișcău et la grotte des Ours.
    history: >-
      Le parc a été institué par arrêté ministériel en 1990 et officialisé par une loi du 6 mars 2000. En
      2009, il a reçu le prix européen EDEN. Le patrimoine humain survit à Cărpiniș, où la maison natale
      rappelle Ion Oargă Cloșca, héros du soulèvement paysan de 1784, et à Arieșeni avec son église en bois
      érigée en 1791.
    before: >-
      La période propice court de mai à octobre. L'accès s'opère par trois routes périphériques :
      Oradea–Huedin–Cluj-Napoca, Oradea–Beiuș–Deva et Ștei–Câmpeni–Turda.


      Le règlement interdit l'accès aux grottes non aménagées pour la visite. Le circuit de Cetățile Ponorului
      est prohibé en hiver.
    around: >-
      Attenante au parc, à 0 km dans l'atlas, s'ouvre la [Vallée du Someșul
      Rece](/lugar/somesul-rece-valley/).
  de:
    intro: >-
      In Padiș fließt das Wasser nicht oberirdisch: Es versickert. Dieses Karstplateau auf rund 1225 m Höhe
      ist fast eben und von Dolinen übersät; manche fassen Seen, andere Fichtengruppen. Jeder Niederschlag
      verschwindet im Untergrund und tritt in Höhlen, Schlucklöchern, Ponoren und Eishöhlen wieder zutage. Der
      Naturpark Apuseni erstreckt sich über rund 76.000 Hektar in den Kreisen Bihor, Cluj und Alba und vereint
      Karstformationen mit Bergwäldern, Almen, Tälern und Schluchten.
    landscape: >-
      Das Gebirge besteht vorwiegend aus Kalksteinen und Dolomiten. Auf der Padiș-Hochebene treffen
      Karbonatgesteine auf Felswände und Schluchten. Die Dolinen von Lumea Pierdută, der gigantische Ponor
      Cetățile Ponorului und die Schachthöhle Avenul cu Vacă zeugen von der unterirdischen Dynamik; zu den
      bekanntesten Höhlen zählen die Bärenhöhle und die Eishöhle Focul Viu.


      Manche Mulden bewahren selbst im Hochsommer Frost. In der Senke Groapa de la Barsa liegen zwei
      Eishöhlen, Barsa und Zăpodie, wo Altschnee bis Ende Mai überdauert. Die Höhle Scărișoara misst 720 m
      Länge und 105 m Tiefe; der Zugang erfolgt über einen 48 m tiefen und 60 m weiten Schacht. Die
      Vârtop-Höhle (Peștera Minunată) liegt auf rund 1170 m bei Casa de Piatră. Das Sighiștel-Tal ist nur 9 km
      lang, doch verläuft fast die Hälfte als enge Schlucht mit der höchsten Höhlendichte des Landes.


      Die Bärenhöhle wurde erst 1975 entdeckt, als eine Sprengung im Marmorbruch von Chișcău den Höhlengang
      freilegte.


      Das Klima staffelt sich nach der Höhe. Die Jahresniederschläge reichen von 600 mm im Arieșul-Mare-Tal
      bis zu 1300–1400 mm im Bihor-Gebirge; die Jahresmitteltemperaturen liegen bei 2 bis 4 °C am Vlădeasa und
      8 bis 10 °C im Beiuș-Becken. Im Norden entstand der Beliș-Fântânele-Stausee zwischen 1970 und 1974.
    wildlife: >-
      Die Bergwälder tragen Tannen, Fichten und Eiben in Hochlagen, darunter Buchen, Traubeneichen und
      Hainbuchen sowie Moore. Auf den Bergwiesen gedeihen Frauenschuh, Alpen-Glockenblume und Glanzorchis.


      Unter den Großsäugern leben Rothirsch, [Gämse](/especie/rupicapra_rupicapra/), Reh,
      [Braunbär](/especie/ursus_arctos/) und [Wolf](/especie/canis_lupus/); ferner
      [Luchs](/especie/lynx_lynx/), [Wildkatze](/especie/felis_silvestris/), Baummarder und
      [Fischotter](/especie/lutra_lutra/). Zu den Fledermäusen zählen Große Hufeisennase und Braunes Langohr.


      Die Vogelwelt umfasst [Auerhuhn](/especie/tetrao_urogallus/), [Steinadler](/especie/aquila_chrysaetos/),
      Haselhuhn und [Schreiadler](/especie/aquila_pomarina/); an Totholz zimmern
      [Schwarzspecht](/especie/dryocopus_martius/) und [Dreizehenspecht](/especie/picoides_tridactylus/).
      Unter Amphibien und Kriechtieren finden sich Äskulapnatter, Schlingnatter und
      [Feuersalamander](/especie/salamandra_salamandra/).


      Der Jahresablauf folgt dem Schnee. Mai bis Oktober ist Wandersaison; im Winter dominiert Skitourengehen,
      wobei die Traverse von Vârtop zum Bihor-Gipfel zu den beliebtesten Routen der Apuseni zählt.
    visit: >-
      Das Wegenetz orientiert sich an zwei Hauptkammwegen. Das Rote Band durchquert den Park von Nord nach
      Süd; von Stâna de Vale zum Bihor-Gipfel misst es 39,5 km bei 12-13 Stunden Gehzeit. Das Blaue Band führt
      von der Vlădeasa-Hütte nach Gârda de Sus über 62,5 km in mindestens zwei Tagen. Einzelne Markierungen
      gehen auf das Jahr 1903 zurück.


      Padiș ist das Zentrum für Tagestouren. Der Rundweg Cetățile Ponorului misst 12 km in etwa fünf Stunden
      mit Kletterpassagen. Die Galbena-Runde überwindet 19 km in zehn Stunden entlang von Karstquellen. Lumea
      Pierdută bietet einen leichten Pfad: 7,5 km in zwei Stunden zu mehreren Einsturztrichtern. Der
      Bohodei-Wasserfall verlangt Trittsicherheit über drei drahtseilgesicherte Felsstufen.


      Drei Besucherzentren stehen bereit: Padiș, Gârda und Doda Pilii, ergänzt um sieben Infopunkte. Die
      Verwaltung in Sudrigiu liegt außerhalb, etwa 300 m von der E79-Kreuzung nach Pietroasa, Chișcău und zur
      Bärenhöhle.
    history: >-
      Der Naturpark wurde 1990 per Erlass begründet und am 6. März 2000 per Gesetz unter Schutz gestellt. Im
      Jahr 2009 erhielt er die europäische EDEN-Auszeichnung. In Cărpiniș erinnert ein Gedenkhaus an Ion Oargă
      Cloșca, Anführer des Bauernaufstands von 1784, und in Arieșeni steht eine Holzkirche von 1791.
    before: >-
      Beste Reisezeit ist Mai bis Oktober. Die Anfahrt erfolgt über drei Randstraßen:
      Oradea–Huedin–Cluj-Napoca, Oradea–Beiuș–Deva und Ștei–Câmpeni–Turda.


      Das Betreten unerschlossener Höhlen ist untersagt. Die Cetățile-Ponorului-Runde ist im Winter gesperrt.
    around: Direkt angrenzend, 0 km im Atlas, liegt das [Someșul-Rece-Tal](/lugar/somesul-rece-valley/).
  it:
    intro: >-
      A Padiș l'acqua non scorre in superficie: si inabissa. Questo altopiano carsico a circa 1225 m di quota
      è quasi pianeggiante e traforato da doline; alcune ospitano laghetti, altre gruppi di pecci. Ogni goccia
      scompare nel sottosuolo per riaffiorare in grotte, inghiottitoi, orridi e ghiacciai sotterranei. Il
      Parco naturale Apuseni estende questo dedalo sotterraneo per circa 76.000 ettari tra Bihor, Cluj e Alba,
      armonizzandolo con foreste vetuste, pascoli e gole calcaree.
    landscape: >-
      La roccia dominante è calcare e dolomia. Sull'altopiano di Padiș si innalzano pareti e forre scoscese.
      Le doline di Lumea Pierdută, il colossale inghiottitoio di Cetățile Ponorului e l'abisso Avenul cu Vacă
      testimoniano l'attività carsica profonda; tra le caverne primarie spiccano la grotta degli Orsi e la
      grotta di ghiaccio Focul Viu.


      Alcuni valloni conservano gelo perenne anche in estate. Nella depressione di Groapa de la Barsa
      risiedono due ghiacciai sotterranei, Barsa e Zăpodie, dove la neve dura fino a fine maggio. La grotta di
      Scărișoara misura 720 m di sviluppo e 105 m di profondità, accessibile da un pozzo di 48 m di dislivello
      e 60 m di diametro. La grotta di Vârtop (Peștera Minunată) si trova a circa 1170 m presso Casa de
      Piatră. La valle di Sighiștel è lunga appena 9 km, ma per quasi metà si snoda in una forra con la
      massima concentrazione di cavità della Romania.


      La grotta degli Orsi ha una scoperta recente: fu individuata nel 1975 quando un brillamento nella cava
      di marmo di Chișcău aprì un varco nella parete.


      Il clima varia con la quota. La piovosità oscilla tra 600 mm nella valle dell'Arieșul Mare e 1300–1400
      mm sui monti Bihor; la temperatura media annua va da 2 a 4 °C sul Vlădeasa e da 8 a 10 °C nella conca di
      Beiuș. A nord, il lago di sbarramento di Beliș-Fântânele fu realizzato tra il 1970 e il 1974.
    wildlife: >-
      Le foreste combinano abete bianco, peccio e tasso in quota, con faggio, rovere e carpino più in basso,
      assieme a torbiere attive. Sui pascoli fioriscono pianella della Madonna, campanula alpina e liparide.


      Tra i grandi mammiferi vivono cervo, [camoscio](/especie/rupicapra_rupicapra/), capriolo, [orso
      bruno](/especie/ursus_arctos/) e [lupo](/especie/canis_lupus/); presenti pure
      [lince](/especie/lynx_lynx/), [gatto selvatico](/especie/felis_silvestris/), martora e
      [lontra](/especie/lutra_lutra/). I chirotteri contano ferro di cavallo maggiore e orecchione bruno.


      L'avifauna annovera [gallo cedrone](/especie/tetrao_urogallus/), [aquila
      reale](/especie/aquila_chrysaetos/), francolino di monte e [aquila anatraia
      minore](/especie/aquila_pomarina/); sui tronchi scavano [picchio nero](/especie/dryocopus_martius/) e
      [picchio tridattilo](/especie/picoides_tridactylus/). Tra rettili e anfibi si trovano colubro
      d'Esculapio, coronella e [salamandra pezzata](/especie/salamandra_salamandra/).


      L'innevamento detta i ritmi. Da maggio a ottobre è stagione escursionistica; in inverno domina lo
      scialpinismo, con la traversata da Vârtop al monte Bihor tra le mete scialpinistiche più ambite degli
      Apuseni.
    visit: >-
      La rete si articola su due grandi direttrici di cresta. La Banda Rossa attraversa il parco da nord a
      sud; da Stâna de Vale al picco Bihor conta 39,5 km in circa 12-13 ore. La Banda Blu collega il rifugio
      Vlădeasa a Gârda de Sus su 62,5 km in almeno due giorni. Singoli sentieri segnati risalgono al 1903.


      Padiș è base per gite giornaliere. L'anello di Cetățile Ponorului misura 12 km in circa cinque ore con
      passaggi rocciosi. Il circuito di Galbena copre 19 km in dieci ore tra sorgenti carsiche. Lumea Pierdută
      è facile: 7,5 km in due ore toccando vari inghiottitoi. La cascata di Bohodei è atletica: include tre
      risalti di roccia attrezzati con catene.


      I centri visite sono tre: Padiș, Gârda e Doda Pilii, con sette punti informativi. La sede di Sudrigiu si
      trova all'esterno, a circa 300 m dall'incrocio della E79 per Pietroasa, Chișcău e la grotta degli Orsi.
    history: >-
      Il parco fu istituito per decreto nel 1990 e confermato con legge del 6 marzo 2000. Nel 2009 ha ottenuto
      il riconoscimento europeo EDEN. A Cărpiniș una casa museo ricorda Ion Oargă Cloșca, guida della rivolta
      contadina del 1784, e ad Arieșeni sorge una chiesa lignea del 1791.
    before: >-
      I mesi ideali vanno da maggio a ottobre. L'accesso stradale avviene tramite tre direttrici perimetrali:
      Oradea–Huedin–Cluj-Napoca, Oradea–Beiuș–Deva e Ștei–Câmpeni–Turda.


      È vietato entrare nelle cavità non attrezzate. L'anello di Cetățile Ponorului è interdetto nella
      stagione invernale.
    around: >-
      Confinante con il parco, a 0 km nell'atlante, si stende la [Valle di Someșul
      Rece](/lugar/somesul-rece-valley/).
  pt:
    intro: >-
      Em Padiș a água não corre à superfície: infiltra-se. Este planalto cársico, situado a cerca de 1225 m de
      altitude, é quase plano e crivado de dolinas; algumas abrigam lagoas, outras grupos de abetos. Qualquer
      gota que precipite desaparece nas profundezas para reaparecer em cavernas, algares, sumidouros e
      glaciares subterrâneos. O Parque Natural Apuseni estende este labirinto subterrâneo por cerca de 76.000
      hectares entre Bihor, Cluj e Alba, harmonizando-o com bosques antigos, prados e desfiladeiros.
    landscape: >-
      O maciço é composto predominantemente por calcários e dolomitos. No planalto de Padiș erguem-se cristas
      escarpadas e gargantas profundas. As dolinas de Lumea Pierdută, o sumidouro colossal de Cetățile
      Ponorului e o algar Avenul cu Vacă ilustram o relevo cársico; entre as grutas famosas contam-se a gruta
      dos Ursos e a gruta glaciar Focul Viu.


      Certos vales retêm condições glaciares mesmo em pleno estio. Na depressão de Groapa de la Barsa
      subsistem dois glaciares subterrâneos, Barsa e Zăpodie, onde a neve persiste até finais de maio. A gruta
      de Scărișoara atinge 720 m de extensão e 105 m de profundidade, com acesso por um poço de 48 m de queda
      e 60 m de diâmetro. A gruta de Vârtop (Peștera Minunată) situa-se a cerca de 1170 m junto a Casa de
      Piatră. O vale de Sighiștel tem apenas 9 km, mas quase metade constitui um estreito canhão com a maior
      concentração de cavidades subterrâneas do país.


      A gruta dos Ursos tem história recente: foi descoberta em 1975 após detonações na pedreira de mármore de
      Chișcău abrirem fenda no maciço.


      O clima reflete a altitude. A precipitação oscila entre 600 mm no vale de Arieșul Mare e 1300–1400 mm
      nas serras de Bihor; a média térmica anual varia de 2 a 4 °C no Vlădeasa e de 8 a 10 °C na bacia de
      Beiuș. No norte, a albufeira de Beliș-Fântânele foi construída entre 1970 e 1974.
    wildlife: >-
      As matas congregam abeto-branco, abeto-falso e teixo em altitude, dando lugar a faiais, carvalhais e
      carpinos em cotas baixas, com turfeiras ativas. Nos prados vicejam o sapatinho-de-vênus, a
      campânula-alpina e a orquídea-dos-pauis.


      Nos grandes mamíferos avistam-se veado, [camurça](/especie/rupicapra_rupicapra/), corço,
      [urso-pardo](/especie/ursus_arctos/) e [lobo](/especie/canis_lupus/); também ocorrem
      [lince](/especie/lynx_lynx/), [gato-bravo](/especie/felis_silvestris/), marta e
      [lontra](/especie/lutra_lutra/). Os morcegos incluem morcego-de-ferradura-grande e
      morcego-orelhudo-castanho.


      A avifauna florestal conta com [tetraz-grande](/especie/tetrao_urogallus/),
      [águia-real](/especie/aquila_chrysaetos/), galinha-do-mato e
      [águia-pomarina](/especie/aquila_pomarina/); nas árvores trabalham o
      [pica-pau-preto](/especie/dryocopus_martius/) e o [pica-pau-tridáctilo](/especie/picoides_tridactylus/).
      Entre anfíbios e répteis encontram-se cobra-de-esculápio, cobra-lisa e
      [salamandra-de-pintas](/especie/salamandra_salamandra/).


      A neve rege as estações. De maio a outubro desenrola-se o pedestrianismo; no inverno sobressai o esqui
      de travessia, sendo o percurso de Vârtop ao cume Bihor um dos mais afamados dos Apuseni.
    visit: >-
      A rede articula-se em duas grandes rotas de cumeada. A Faixa Vermelha percorre o parque de norte a sul;
      de Stâna de Vale ao pico Bihor totaliza 39,5 km em cerca de 12-13 horas. A Faixa Azul une o refúgio
      Vlădeasa a Gârda de Sus ao longo de 62,5 km em pelo menos dois dias. Certos trilhos marcados remontam a
      1903.


      Padiș é o ponto de partida clássico para caminhadas diárias. O circuito de Cetățile Ponorului tem 12 km
      em cerca de cinco horas com passos escarpados. O de Galbena tem 19 km em dez horas junto a nascentes
      cársicas. Lumea Pierdută é suave: 7,5 km em duas horas contornando vários algares. A cascata de Bohodei
      é exigente: inclui três lances rochosos equipados com correntes.


      Existem três centros de acolhimento: Padiș, Gârda e Doda Pilii, com sete postos informativos. A sede em
      Sudrigiu fica fora da área protegida, a cerca de 300 m do cruzamento da E79 para Pietroasa, Chișcău e
      gruta dos Ursos.
    history: >-
      O parque foi criado por despacho ministerial em 1990 e confirmado por lei a 6 de março de 2000. Em 2009
      recebeu a distinção europeia EDEN. Em Cărpiniș uma casa-museu recorda Ion Oargă Cloșca, cabecilha da
      revolta de 1784, e em Arieșeni ergue-se uma igreja de madeira datada de 1791.
    before: >-
      A época recomendada vai de maio a outubro. O acesso faz-se por três eixos viários:
      Oradea–Huedin–Cluj-Napoca, Oradea–Beiuș–Deva e Ștei–Câmpeni–Turda.


      É interdito explorar cavidades sem estruturas de apoio. O circuito de Cetățile Ponorului está encerrado
      no inverno.
    around: Contíguo ao parque, a 0 km no atlas, estende-se o [Vale de Someșul Rece](/lugar/somesul-rece-valley/).
