resumen:
  es: >-
    Montaña solitaria aislada en el corazón de Suecia, refugio histórico emblemático con una de las mayores
    densidades de oso pardo (*Ursus arctos*) del país.
  en: >-
    A solitary, isolated mountain in the heart of Sweden, an iconic historic sanctuary with one of the highest
    densities of brown bear (*Ursus arctos*) in the country.
  fr: >-
    Montagne solitaire et isolée au cœur de la Suède, sanctuaire historique emblématique abritant l'une des
    plus fortes densités d'ours brun (*Ursus arctos*) du pays.
  de: >-
    Einsamer, isolierter Gebirgsstock im Herzen Schwedens, ein historisches Schutzgebiet mit einer der
    höchsten Dichten an Braunbären (*Ursus arctos*) des Landes.
  it: >-
    Montagna solitaria e isolata nel cuore della Svezia, storico rifugio emblematico con una delle più alte
    densità di orso bruno (*Ursus arctos*) del paese.
  pt: >-
    Montanha solitária e isolada no coração da Suécia, refúgio histórico emblemático com uma das maiores
    densidades de urso-pardo (*Ursus arctos*) do país.
unico:
  es: >-
    En Sonfjället el oso casi nunca se deja ver, pero sus huellas están por todas partes: marcas de garras en
    los árboles, hormigueros destrozados, excrementos llenos de bayas.
  en: >-
    At Sonfjället the bear is almost never seen, yet its signs are everywhere: claw marks on tree trunks, torn
    anthills, and droppings laden with wild berries.
  fr: >-
    À Sonfjället, l'ours ne se montre presque jamais, mais ses indices abondent : griffures sur les troncs,
    fourmilières éventrées et laissées gorgées de baies.
  de: >-
    Am Sonfjället bekommt man den Bären fast nie zu Gesicht, doch seine Spuren sind allgegenwärtig:
    Krallenmale an Baumstämmen, aufgerissene Ameisenhaufen und beerenreiche Losungen.
  it: >-
    A Sonfjället l'orso non si fa quasi mai vedere, ma le sue tracce sono ovunque: graffi sulle cortecce,
    formicai divelti ed escrementi colmi di bacche selvatiche.
  pt: >-
    Em Sonfjället o urso quase nunca se deixa ver, mas os seus vestígios estão por todo o lado: marcas de
    garras nos troncos, formigueiros revolvidos e dejetos repletos de bagas silvestres.
observaciones:
  es: >-
    La cabaña de Sododalen está abierta todo el año y puede usarse para pernoctar en caso de emergencia. Está
    prohibido arrancar o desenterrar plantas, aunque se permite recoger bayas y setas, y circular con
    vehículos a motor fuera de los caminos y aparcamientos señalados. Se puede hacer fuego en las hogueras
    habilitadas de las entradas Nyvallen, Nysätern y Valmen, junto a la cabaña de Sododalen y en el refugio de
    Stor-Ryvålen.
texto:
  es:
    intro: >-
      Desde casi cualquier punto de Härjedalen se ve su silueta. Sonfjället se alza solitario sobre el paisaje
      y su perfil se recorta en el horizonte, con Högfjället, la cima más alta, a 1.278 metros. Es una montaña
      grande y sola, rodeada de bosque, y es también uno de los principales refugios de osos de Escandinavia.


      Una pequeña parte del macizo se reservó como parque nacional en 1909, una fecha que lo convierte en uno
      de los primeros de Europa. Después el parque creció y hoy abarca todo el monte y el bosque que lo rodea.
    landscape: >-
      Hay una escena que explica el lugar. Hace miles de años, cuando el hielo se fundía y la masa helada se
      hundía, las cumbres más altas del oeste asomaron por encima del manto blanco. Esa es la montaña que ves
      hoy. El agua de deshielo de aquel hielo dejó rasgos geológicos bien conservados, como las skvalrännor de
      las laderas, formadas por corrientes junto al borde del hielo que se derretía, y los bloques de piedra
      dispuestos en patrones de cuadrícula.


      El parque conserva bosques de coníferas y caducifolios, humedales y brezales abiertos por encima del
      límite arbóreo. Tras Högfjället, que mide 1.278 metros, las cumbres principales del macizo son
      Valmfjället, Gråsidan, Medstöten y Korpflyet.
    wildlife: >-
      El oso es el animal emblemático del parque, aunque es esquivo: se le ve más por sus excrementos, huellas
      y hormigueros destrozados. Ver uno es difícil, y en septiembre y octubre, en años con abundancia de
      bayas, quizá se vean osos buscando camarinas negras. Se ofrecen salidas guiadas para buscar osos y sus
      rastros.


      Hay también [lince](/especie/lynx_lynx/) y una población fuerte de [alces](/especie/alces_alces/), y de
      vez en cuando aparecen lobo, glotón y buey almizclero. Entre los animales de montaña propios del lugar
      hay lemming de montaña y [reno](/especie/rangifer_tarandus/). Las aves comunes son el chorlito dorado,
      el chorlito carambolo, el lagópodo escandinavo y el [alpino](/especie/lagopus_muta/); también se ven con
      frecuencia ratonero calzado, [águila pescadora](/especie/pandion_haliaetus/) y [águila
      real](/especie/aquila_chrysaetos/).


      En invierno es más fácil encontrar huellas de glotón, lince, zorro, marta, lemming y lagópodo que ver
      esos animales. A finales del invierno, la ladera occidental de Gråsidan es una zona popular para
      esquiar. La mejor época para caminar va de junio a septiembre.
    visit: >-
      Hay varias puertas. La principal es Nyvallen, en una majada viva con cabras y vacas de montaña que
      funciona desde principios del siglo XVIII: a Nyvallen se llega en verano en coche desde Hedeviken, a
      unos 16 kilómetros, donde acaba la carretera. La casa de información de Nyvallen suele abrir de San Juan
      a finales de septiembre. Dalsvallen, al sur, permite empezar la caminata todo el año, con senderos de
      verano y de invierno, y desde Valmen se sube por un sendero de verano a la montaña; hay un área de
      descanso accesible.


      Hay varios senderos de verano señalizados, desde paseos cortos para niños hasta ascensiones de un día
      entero, y también travesías de varios días. Se marcan con mojones o postes, y Nyvallen, Nysätern y
      Dalsvallen son los puntos de partida naturales. En Nyvallen empieza un sendero corto con paneles sobre
      la naturaleza donde se buscan animales tallados en el bosque.


      Si quieres ir al corazón del macizo, de Nysätern a la cabaña de Sododalen hay unos siete kilómetros de
      sendero; el valle se llama a veces el corazón de Sonfjället. En la cabaña se pueden escuchar entrevistas
      y audios y ver imágenes del valle y del parque conectándose a una red local.


      Para el esquí, el camino a Nyvallen no se despeja en invierno; para entrar esquiando es mejor empezar en
      Nysätern, donde el camino sí se limpia y arranca la ruta de invierno señalizada.
    history: >-
      Se eligió este monte por sus brezales de montaña, ricos en líquenes y poco afectados por los renos, y
      para proteger los últimos restos de reno salvaje que quedaban en Suecia. En 1989 el parque se amplió de
      27 a 104 kilómetros cuadrados para proteger todo el monte y el bosque que lo rodea. Puede haber habido
      personas aquí desde hace más de 8.000 años.
    before: >-
      La cabaña de Sododalen está abierta todo el año y puede usarse para pernoctar en caso de emergencia.
      Está prohibido arrancar o desenterrar plantas, aunque se permite recoger bayas y setas, y circular con
      vehículos a motor fuera de los caminos y aparcamientos señalados. Se puede hacer fuego en las hogueras
      habilitadas de las entradas Nyvallen, Nysätern y Valmen, junto a la cabaña de Sododalen y en el refugio
      de Stor-Ryvålen.
    around: >-
      Sonfjället tiene parientes lejanos con quienes comparte alce, lince y oso: el [Parque Nacional de
      Lahemaa](/lugar/lahemaa-rahvuspark/), el [Parque Nacional de Slītere y Costa del Estrecho de
      Irbe](/lugar/sliteres-nacionalais-parks/) y el [Parque Nacional de Soomaa](/lugar/soomaa-rahvuspark/)
      tienen además bosque maduro, y [Sarek](/lugar/sarek-national-park/) añade la alta montaña.
  en:
    intro: >-
      From almost anywhere in Härjedalen, its silhouette is unmistakable. Sonfjället rises solitary above the
      rolling landscape, etching its profile against the horizon, with Högfjället, its highest peak, reaching
      1,278 metres. It is an immense, lone mountain surrounded by continuous forest, and one of the premier
      bear refuges in Scandinavia.


      A small part of the massif was set aside as a national park in 1909, making it one of the very first in
      Europe. Later the park was expanded and today encompasses the entire mountain and the encircling boreal
      forest.
    landscape: >-
      One vivid geological scene explains the place. Thousands of years ago, as the continental ice melted and
      the shrinking ice mass subsided, the highest western summits poked above the white expanse as nunataks.
      That is the mountain you see today. Meltwater from that ice left well-preserved geological features,
      such as the hillside meltwater channels (skvalrännor) gouged by torrents along the edge of the melting
      ice sheet, alongside patterned block fields arranged in regular geometric nets.


      The park preserves coniferous and deciduous taiga forests, peatlands, and sweeping open heaths above the
      tree line. After Högfjället at 1,278 metres, the main peaks of the massif include Valmfjället, Gråsidan,
      Medstöten, and Korpflyet.
    wildlife: >-
      The bear is the emblematic animal of the park, though elusive: it is recognized far more through
      droppings, tracks, and raided anthills than by sight. Spotting one is rare, but in September and October
      during berry-rich years, bears may occasionally be seen foraging on black crowberries. Guided tours are
      offered to search for bears and their tracks.


      [Eurasian lynx](/especie/lynx_lynx/) also occurs alongside a healthy population of
      [moose](/especie/alces_alces/), and wolves, wolverines, and muskoxen turn up on occasion. Native alpine
      animals include Norwegian lemming and [caribou](/especie/rangifer_tarandus/). Common birds include
      European golden plover, Eurasian dotterel, willow ptarmigan, and [rock
      ptarmigan](/especie/lagopus_muta/); rough-legged buzzard, [osprey](/especie/pandion_haliaetus/), and
      [golden eagle](/especie/aquila_chrysaetos/) are also frequently sighted.


      In winter, tracking signs of wolverine, lynx, fox, pine marten, lemming, and ptarmigan is far easier
      than spotting the animals themselves. In late winter, the western flank of Gråsidan becomes a popular
      backcountry ski-touring route. The finest season for hiking runs from June to September.
    visit: >-
      There are several access points. The main trailhead is Nyvallen, located at a working summer farm with
      mountain cows and goats that has operated since the early eighteenth century: Nyvallen is reached in
      summer by car from Hedeviken, some 16 kilometres away, where the public road ends. The Nyvallen
      information cabin is generally open from Midsummer until late September. Dalsvallen to the south allows
      hikes year-round with separate summer and winter trails, while from Valmen a summer path climbs into the
      high fell; there is an accessible rest area here.


      Several marked summer trails span the terrain, ranging from short walks for children to full-day ascents
      and multi-day traverses. Marked with cairns or painted posts, Nyvallen, Nysätern, and Dalsvallen serve
      as the natural starting points. At Nyvallen, a short interpretive trail with nature panels invites
      children to find carved wooden forest animals.


      If you want to head into the heart of the massif, a trail of about seven kilometres runs from Nysätern
      to the Sododalen cabin; this central valley is often described as the heart of Sonfjället. Inside the
      cabin, visitors can listen to recorded interviews and nature audios and view park photographs by
      connecting to a local wireless hotspot.


      For ski touring, the road to Nyvallen is not plowed in winter; to access the park on skis, it is best to
      start at Nysätern, where the road is cleared and the marked winter trail commences.
    history: >-
      This mountain fell was originally selected for its lichen-rich montane heaths, which were little grazed
      by domestic reindeer, and to protect the last remaining herd of truly wild reindeer in Sweden. In 1989
      the national park was expanded from 27 to 104 square kilometres to safeguard the entire mountain and its
      surrounding old-growth forests. Human presence here may date back more than 8,000 years.
    before: >-
      The Sododalen cabin remains open year-round and may be used for overnight shelter in emergencies.
      Digging up or damaging plants is prohibited, though foraging for wild berries and edible mushrooms is
      allowed; motor vehicles are strictly forbidden off designated roads and car parks. Campfires may be lit
      only at designated fire hearths located at the Nyvallen, Nysätern, and Valmen entrances, near the
      Sododalen cabin, and at the Stor-Ryvålen shelter.
    around: >-
      Sonfjället shares distant kin with whom it shares moose, lynx, and bear: [Lahemaa National
      Park](/lugar/lahemaa-rahvuspark/), [Slītere National Park](/lugar/sliteres-nacionalais-parks/), and
      [Soomaa National Park](/lugar/soomaa-rahvuspark/) offer similarly rich old-growth forests, while [Sarek
      National Park](/lugar/sarek-national-park/) adds high alpine wilderness.
  fr:
    intro: >-
      Depuis presque n'importe quel endroit du Härjedalen, sa silhouette est reconnaissable entre toutes.
      Sonfjället se dresse en solitaire au-dessus du paysage et son profil se découpe à l'horizon, culminant
      avec le Högfjället à 1 278 mètres. C'est une haute montagne isolée cernée par la forêt boréale, et l'un
      des principaux refuges d'ours de toute la Scandinavie.


      Une petite fraction du massif a été classée en parc national dès 1909, ce qui en fait l'un des tout
      premiers d'Europe. Par la suite, le parc a été agrandi et englobe aujourd'hui l'ensemble du relief et la
      forêt qui l'entoure.
    landscape: >-
      Une scène géologique majeure éclaire ce paysage. Il y a des milliers d'années, lors de la déglaciation,
      les plus hauts sommets de l'ouest émergèrent au-dessus de la banquise sous forme de nunataks. C'est
      cette montagne que vous observez aujourd'hui. Les eaux de fonte ont laissé des empreintes glaciaires
      remarquablement conservées, telles que les rigoles de fonte latérales (skvalrännor) creusées par les
      torrents sous-glaciaires, ainsi que des champs de blocs ordonnés en réseaux géométriques réguliers.


      Le parc conserve des forêts de conifères et de feuillus, des tourbières et de vastes landes rases
      au-dessus de la limite des arbres. Après le Högfjället et ses 1 278 mètres, les sommets majeurs du
      massif sont le Valmfjället, le Gråsidan, le Medstöten et le Korpflyet.
    wildlife: >-
      L'ours est l'animal totem du parc, quoiqu'extrêmement discret : on le devine surtout à ses laissées, ses
      empreintes et ses fourmilières fouillées. En apercevoir un reste exceptionnel, bien qu'en septembre et
      octobre, lors des années riches en baies, on puisse parfois surprendre des ours en quête de camarine
      noire. Des sorties guidées sont organisées pour pister l'ours et ses traces.


      On y rencontre aussi le [lynx boréal](/especie/lynx_lynx/) et une solide population
      d'[élan](/especie/alces_alces/), tandis que le loup, le glouton et le bœuf musqué font de rares
      incursions. Parmi la faune arctique et alpine figurent le lemming des toundras et le
      [renne](/especie/rangifer_tarandus/). Les oiseaux habituels sont le pluvier doré, le pluvier guignard,
      le lagopède des saules et le [lagopède alpin](/especie/lagopus_muta/) ; la buse pattue, le [balbuzard
      pêcheur](/especie/pandion_haliaetus/) et l'[aigle royal](/especie/aquila_chrysaetos/) sont également
      fréquents.


      En hiver, il est bien plus aisé de relever les pistes du glouton, du lynx, du renard, de la martre, du
      lemming ou du lagopède que de croiser ces animaux. En fin d'hiver, le flanc ouest du Gråsidan est très
      apprécié pour le ski de randonnée. La saison idéale pour la marche s'étend de juin à septembre.
    visit: >-
      Plusieurs entrées desservent le massif. La principale est Nyvallen, un alpage traditionnel encore actif
      avec chèvres et vaches montagnardes fondé au début du XVIIIe siècle : on accède à Nyvallen en été en
      voiture depuis Hedeviken, à environ 16 kilomètres, là où s'interrompt la route carrossable. La maison
      d'information de Nyvallen ouvre généralement de la Saint-Jean à la fin septembre. Dalsvallen, au sud,
      autorise les randonnées toute l'année grâce à ses sentiers d'été et d'hiver, tandis que depuis Valmen un
      itinéraire estival grimpe vers la montagne ; une aire de repos adaptée s'y trouve.


      Plusieurs sentiers d'été balisés parcourent l'espace, des petites boucles familiales aux ascensions
      d'une journée entière et traversées itinérantes. Balisés par des cairns ou des balises peintes,
      Nyvallen, Nysätern et Dalsvallen constituent les départs naturels. À Nyvallen débute un parcours
      didactique jalonné de panneaux sur la nature où les enfants cherchent des animaux sculptés dans le bois.


      Pour pénétrer au cœur du massif, il faut compter environ sept kilomètres de sentier depuis Nysätern
      jusqu'au refuge de Sododalen ; cette vallée est souvent qualifiée de cœur battant du Sonfjället. Dans la
      cabane, vous pouvez écouter des entretiens sonores et visionner des photographies du vallon et du parc
      en vous connectant à un réseau local sans fil.


      Pour le ski, la route d'accès à Nyvallen n'est pas déneigée l'hiver ; pour une excursion à skis, il vaut
      mieux partir de Nysätern, où la route reste dégagée et d'où s'élance l'itinéraire hivernal balisé.
    history: >-
      Ce mont a été retenu pour ses landes d'altitude particulièrement riches en lichens et peu altérées par
      le pâturage des rennes domestiques, ainsi que pour sauvegarder les derniers rennes sauvages subsistant
      en Suède. En 1989, le parc a été agrandi de 27 à 104 kilomètres carrés pour préserver l'intégralité du
      relief et les forêts séculaires avoisinantes. L'occupation humaine sur ces contreforts pourrait remonter
      à plus de 8 000 ans.
    before: >-
      Le refuge de Sododalen reste ouvert toute l'année et peut servir d'abri nocturne en cas d'urgence. Il
      est formellement interdit d'arracher ou de déterrer des végétaux, bien que la cueillette des baies et
      des champignons soit autorisée ; les véhicules à moteur sont interdits en dehors des voies et parkings
      signalés. Les feux de camp ne sont autorisés que dans les foyers aménagés aux entrées de Nyvallen,
      Nysätern et Valmen, près du refuge de Sododalen et à l'abri de Stor-Ryvålen.
    around: >-
      Sonfjället compte des cousins lointains avec lesquels il partage l'élan, le lynx et l'ours : le [Parque
      Nacional de Lahemaa](/lugar/lahemaa-rahvuspark/), le [Parque Nacional de Slītere y Costa del Estrecho de
      Irbe](/lugar/sliteres-nacionalais-parks/) et le [Parque Nacional de Soomaa](/lugar/soomaa-rahvuspark/)
      possèdent en outre de vastes forêts anciennes, tandis que [Sarek](/lugar/sarek-national-park/) y ajoute
      la haute montagne polaire.
  de:
    intro: >-
      Von fast jedem Punkt in Härjedalen aus zeichnet sich seine markante Silhouette ab. Der Sonfjället ragt
      einsam über die Waldlandschaft auf und schneidet sein Profil in den Horizont, gekrönt vom Högfjället in
      1.278 Metern Höhe. Es ist ein gewaltiger, alleinstehender Berg mitten im Taigawald und zugleich eines
      der bedeutendsten Bärenrefugien Skandinaviens.


      Ein kleiner Teil des Massivs wurde bereits 1909 als Nationalpark ausgewiesen – ein Datum, das ihn zu
      einem der ersten Schutzgebiete Europas macht. Später wurde der Park erweitert und umfasst heute den
      gesamten Gebirgsstock samt umgebendem Urwald.
    landscape: >-
      Ein geologisches Urzeitbild erklärt diese Landschaft. Vor Jahrtausenden, als das Inlandeis abschmolz und
      der riesige Eispanzer einsank, ragten die höchsten westlichen Gipfel als Nunatakkr über die weiße Decke
      empor. Genau diesen Berg siehst du heute. Das Schmelzwasser hinterließ hervorragend erhaltene Spuren wie
      die Schmelzwasserrinnen (skvalrännor) an den Flanken, die von Schmelzbächen am Eisrand eingetieft
      wurden, und die rasterartig sortierten Blockmeere.


      Der Park bewahrt Nadel- und Laubmischwälder, Moore und weite baumfreie Heiden oberhalb der Baumgrenze.
      Nach dem 1.278 Meter hohen Högfjället bilden Valmfjället, Gråsidan, Medstöten und Korpflyet die
      Hauptgipfel des Gebirgsstocks.
    wildlife: >-
      Der Bär ist das Wappentier des Parks, wenn auch heimlich: Man bemerkt ihn eher an Losungen, Trittsiegeln
      und aufgegrabenen Ameisenhaufen. Einen Bären zu erblicken ist selten, doch im September und Oktober bei
      reicher Beerenreife kann man mitunter Bären beim Äsen von Krähenbeeren beobachten. Vor Ort werden
      geführte Touren zur Spurensuche angeboten.


      Ebenso leben hier der [Eurasischer Luchs](/especie/lynx_lynx/) und ein starker Bestand an
      [Elch](/especie/alces_alces/), während Wolf, Vielfraß und Moschusochse gelegentlich durchziehen. Zur
      Bergtierwelt zählen Berglemming und [Ren](/especie/rangifer_tarandus/). Häufige Vögel sind
      Goldregenpfeifer, Mornellregenpfeifer, Moorschneehuhn und [Alpenschneehuhn](/especie/lagopus_muta/);
      auch Raufußbussard, [Fischadler](/especie/pandion_haliaetus/) und
      [Steinadler](/especie/aquila_chrysaetos/) lassen sich regelmäßig blicken.


      Im Winter lassen sich Fährten von Vielfraß, Luchs, Fuchs, Marder, Lemming und Schneehuhn weit leichter
      entdecken als die Tiere selbst. Im Spätwinter ist der Westhang des Gråsidan ein beliebtes Areal für
      Skitouren. Die beste Wanderzeit reicht von Juni bis September.
    visit: >-
      Es gibt mehrere Zugänge. Der wichtigste ist Nyvallen, eine bewirtschaftete Alm mit Ziegen und Bergkühen,
      die seit Beginn des achtzehnten Jahrhunderts betrieben wird: Nyvallen erreichst du im Sommer mit dem
      Auto ab Hedeviken über rund 16 Kilometer Piste, wo die Straße endet. Die Informationshütte in Nyvallen
      öffnet gewöhnlich von Mittsommer bis Ende September. Dalsvallen im Süden ermöglicht ganzjährige
      Wanderungen mit getrennten Sommer- und Winterrouten, während von Valmen aus ein Sommersteig in die
      Fjellzone hinaufführt; dort gibt es einen barrierefreien Rastplatz.


      Mehrere markierte Sommerwege durchziehen das Gebiet, von kurzen Familienpfaden bis hin zu ganztägigen
      Gipfeltouren und mehrtägigen Durchquerungen. Markiert mit Steinmännchen oder Pfählen, bilden Nyvallen,
      Nysätern und Dalsvallen die logischen Ausgänge. In Nyvallen beginnt ein kurzer Lehrpfad mit Naturtafeln,
      auf dem Kinder geschnitzte Waldtiere aufspüren können.


      Wenn du ins Herz des Massivs vordringen willst, führt von Nysätern ein Pfad über etwa sieben Kilometer
      zur Sododalen-Hütte; das Tal wird oft als Herzstück des Sonfjället bezeichnet. In der Hütte kannst du
      dir über ein lokales Funknetz Tonaufnahmen und Interviews anhören sowie Bilder des Tals betrachten.


      Für den Wintersport wird der Fahrweg nach Nyvallen nicht geräumt; Skitourengeher starten am besten in
      Nysätern, wo die Zufahrt freigehalten wird und der markierte Winterweg ansetzt.
    history: >-
      Der Berg wurde ursprünglich wegen seiner flechtenreichen, kaum von Rentieren zertretenen
      Zwergstrauchheiden ausgewählt sowie zum Schutz der letzten wilden Tundra-Rentiere Schwedens. Im Jahr
      1989 vergrößerte man den Park von 27 auf 104 Quadratkilometer, um den gesamten Gebirgsstock und seine
      alten Wälder lückenlos zu sichern. Menschliche Spuren lassen sich hier womöglich über mehr als 8.000
      Jahre zurückverfolgen.
    before: >-
      Die Sododalen-Hütte ist ganzjährig geöffnet und dient im Notfall als Schutzunterkunft. Das Ausgraben
      oder Beschädigen von Pflanzen ist untersagt, das Sammeln von Beeren und Pilzen für den Eigenbedarf
      jedoch erlaubt; Kraftfahrzeuge sind abseits der Straßen und Parkplätze streng verboten. Lagerfeuer
      dürfen nur an den festen Feuerstellen an den Zugängen Nyvallen, Nysätern und Valmen, bei der
      Sododalen-Hütte sowie am Rastplatz Stor-Ryvålen entfacht werden.
    around: >-
      Der Sonfjället teilt seine Fauna mit Elch, Luchs und Bär mit entfernten Verwandten: Der [Parque Nacional
      de Lahemaa](/lugar/lahemaa-rahvuspark/), der [Parque Nacional de Slītere y Costa del Estrecho de
      Irbe](/lugar/sliteres-nacionalais-parks/) und der [Parque Nacional de Soomaa](/lugar/soomaa-rahvuspark/)
      bieten ebenfalls dichte Urwälder, während [Sarek](/lugar/sarek-national-park/) die hochalpine Tundra
      beisteuert.
  it:
    intro: >-
      Da quasi ogni angolo dello Härjedalen si staglia il suo profilo. Sonfjället si innalza solitario sul
      paesaggio e disegna la sua cresta all'orizzonte, culminando con lo Högfjället a 1.278 metri. È un
      rilievo imponente e isolato, circondato da boschi fitti, e rappresenta uno dei massimi santuari per gli
      orsi in Scandinavia.


      Una modesta porzione del massiccio venne istituita come parco nazionale nel 1909, divenendo così uno dei
      primi in assoluto d'Europa. In seguito il parco fu notevolmente ingrandito e oggi include l'intero monte
      e la taiga circostante.
    landscape: >-
      Un'immagine geologica arcaica spiega questa montagna. Migliaia di anni fa, durante lo scioglimento della
      calotta glaciale, le cime più alte a occidente emersero dai ghiacci come nunatak. Quella è la montagna
      che vedi oggi. Le acque di disgelo hanno scavato solchi geologici rimasti intatti, come i canaloni di
      scioglimento (skvalrännor) scolpiti sui pendii lungo i margini della coltre ghiacciata, accanto a campi
      di blocchi rocciosi disposti secondo reticoli geometrici regolari.


      Il parco custodisce foreste di conifere e latifoglie, torbiere e brughiere d'alta quota oltre il limite
      degli alberi. Dopo lo Högfjället a 1.278 metri, le cime principali del massiccio sono Valmfjället,
      Gråsidan, Medstöten e Korpflyet.
    wildlife: >-
      L'orso è il simbolo vivente del parco, benché estremamente elusivo: lo si percepisce attraverso
      escrementi, orme e formicai distrutti. Avvistarne uno è difficile, ma a settembre e ottobre, negli anni
      di abbondante fruttificazione, è possibile scorgere orsi intenti a cibarsi di more d'empétro. Vengono
      organizzate escursioni guidate dedicate alla ricerca dell'orso e dei suoi passaggi.


      Si incontrano anche la [lince](/especie/lynx_lynx/) e una solida presenza di
      [alci](/especie/alces_alces/), con sporadiche apparizioni di lupo, ghiottone e bue muschiato. Tra gli
      animali propri dell'altopiano montano figurano il lemming e la [Renna /
      caribù](/especie/rangifer_tarandus/). Gli uccelli frequenti sono il piviere dorato, il piviere
      tortolino, la pernice bianca nordica e la [Pernice bianca](/especie/lagopus_muta/); assai comuni sono
      pure la poiana calzata, il [Falco pescatore](/especie/pandion_haliaetus/) e l'[Aquila
      reale](/especie/aquila_chrysaetos/).


      In inverno è di gran lunga più semplice reperire tracce di ghiottone, lince, volpe, martora, lemming e
      pernice che scorgere gli animali. A fine inverno il versante occidentale del Gråsidan diventa meta
      ricercata per lo scialpinismo. La stagione ideale per camminare va da giugno a settembre.
    visit: >-
      Esistono diversi punti di accesso. Il principale è Nyvallen, un alpeggio estivo attivo con capre e
      vacche montane attivo sin dagli inizi del diciottesimo secolo: a Nyvallen si giunge d'estate in
      automobile da Hedeviken, a circa 16 chilometri, dove termina la strada carrozzabile. La baita
      informativa di Nyvallen apre di solito dalla festa di San Giovanni fino a fine settembre. Dalsvallen, a
      sud, consente escursioni tutto l'anno con tracciati estivi e invernali distinti, mentre da Valmen si
      sale in quota tramite una pista estiva; è presente un'area di sosta accessibile.


      Numerosi itinerari estivi segnalati attraversano il territorio, da facili anelli per famiglie a salite
      giornaliere e traversate di più giorni. Segnati con ometti in pietra o paline segnavia, Nyvallen,
      Nysätern e Dalsvallen fungono da partenze ideali. A Nyvallen ha inizio un breve percorso didattico con
      cartelli naturalistici dove i bambini cercano animali scolpiti nel legno.


      Se desideri inoltrarti nel cuore del massiccio, da Nysätern alla baita di Sododalen si snodano circa
      sette chilometri di sentiero; questa conca è considerata il cuore pulsante di Sonfjället. Nel bivacco è
      possibile ascoltare testimonianze audio e visionare scatti della valle collegandosi a una rete locale.


      Per lo sci escursionistico, la pista per Nyvallen non viene sgomberata dalla neve in inverno; per
      muoversi con gli sci è meglio avvalersi di Nysätern, dove la strada è tenuta aperta e comincia il
      tracciato invernale battuto.
    history: >-
      Questo massiccio fu prescelto per le sue brughiere d'altura, ricche di licheni e poco intaccate dal
      pascolo delle renne, nonché per tutelare gli ultimi branchi di renna selvatica rimasti in Svezia. Nel
      1989 l'area protetta fu estesa da 27 a 104 chilometri quadrati per abbracciare l'intera montagna e le
      boscaglie circostanti. La presenza umana su queste alture può risalire a oltre 8.000 anni fa.
    before: >-
      Il bivacco di Sododalen è sempre accessibile ed è utilizzabile per il pernottamento in caso di necessità
      o emergenza. È fatto divieto di sradicare o asportare piante, mentre è consentita la raccolta di bacche
      e funghi per uso personale; i veicoli a motore non possono circolare fuori dai tracciati e parcheggi
      autorizzati. I fuochi sono consentiti unicamente nei focolari predisposti presso Nyvallen, Nysätern,
      Valmen, vicino al bivacco di Sododalen e al riparo di Stor-Ryvålen.
    around: >-
      Sonfjället mostra parentele geografiche con aree che accolgono alce, lince e orso: il [Parque Nacional
      de Lahemaa](/lugar/lahemaa-rahvuspark/), il [Parque Nacional de Slītere y Costa del Estrecho de
      Irbe](/lugar/sliteres-nacionalais-parks/) e il [Parque Nacional de Soomaa](/lugar/soomaa-rahvuspark/)
      aggiungono estese foreste primarie, mentre [Sarek](/lugar/sarek-national-park/) apporta i paesaggi di
      alta montagna boreale.
  pt:
    intro: >-
      De quase qualquer ponto de Härjedalen avista-se a sua silhueta inconfundível. Sonfjället ergue-se
      solitário sobre a paisagem ondulada recortando o horizonte, com Högfjället, o pico culminante, a atingir
      1.278 metros. É uma montanha grandiosa e isolada, cercada por florestas densas, constituindo um dos mais
      importantes santuários de ursos da Escandinávia.


      Uma pequena parcela do maciço foi declarada parque nacional em 1909, data que o consagra como um dos
      pioneiros de toda a Europa. Mais tarde o parque foi alargado e abrange hoje todo o maciço montanhoso e o
      manto florestal circundante.
    landscape: >-
      Um episódio geológico primordial elucida a feição deste lugar. Há milhares de anos, com o degelo da
      calota continental e o afundamento da massa de gelo, os picos mais elevados a ocidente despontaram acima
      do manto branco como nunataques. Essa é a montanha visível nos dias de hoje. As águas de degelo
      esculpiram feições geomorfológicas bem preservadas, como os canais de escoamento subglaciar
      (skvalrännor) escavados nas vertentes junto às margens do gelo em recuo, e campos de blocos rochosos
      dispostos em malhas geométricas regulares.


      O parque resguarda florestas de coníferas e caducifólias, turfeiras e charnecas abertas acima do limite
      da vegetação arbórea. Depois de Högfjället, com 1.278 metros, os cumes de maior relevo são Valmfjället,
      Gråsidan, Medstöten e Korpflyet.
    wildlife: >-
      O urso é o animal carismático do parque, ainda que esquivo: reconhece-se bem mais pelos excrementos,
      pegadas e formigueiros esventrados do que pela visão direta. Avistar um espécime é raro, embora em
      setembro e outubro, em anos de safra abundante de frutos silvestres, se possam observar ursos a
      forragear camarinhas-negras. Existem percursos guiados vocacionados para a prospeção de ursos e dos seus
      vestígios.


      Ocorrem também o [lince-euroasiático](/especie/lynx_lynx/) e uma próspera população de
      [alce](/especie/alces_alces/), surgindo ocasionalmente lobos, glutões e bois-almiscarados. Entre a fauna
      típica de montanha ártica contam-se o lemingue e a [rena](/especie/rangifer_tarandus/). As aves comuns
      incluem a tarambola-dourada, o borrelho-ruivo, o lagópode-escandinavo e o
      [lagópode-branco](/especie/lagopus_muta/); avistam-se com frequência a bótia-calçada, a [águia
      pescadora](/especie/pandion_haliaetus/) e a [águia-real](/especie/aquila_chrysaetos/).


      No inverno torna-se muito mais acessível localizar pegadas de glutão, lince, raposa, marta, lemingue e
      lagópode do que observar os próprios animais. No final da estação fria, a encosta ocidental de Gråsidan
      atrai muitos praticantes de esqui de montanha. O melhor período para caminhadas decorre entre junho e
      setembro.
    visit: >-
      Existem diversos pontos de acesso. O principal é Nyvallen, numa exploração agropastoril tradicional
      ativa com cabras e vacas de montanha desde o início do século XVIII: a Nyvallen chega-se no verão de
      automóvel a partir de Hedeviken, ao longo de cerca de 16 quilómetros, onde a estrada transitável finda.
      O centro de interpretação de Nyvallen costuma abrir entre o São João e o final de setembro. Dalsvallen,
      a sul, faculta passeios durante todo o ano com trilhos de verão e inverno, enquanto de Valmen sobe-se à
      montanha por um caminho estival; dispõe de área de descanso acessível.


      Vários trilhos estivais balizados cruzam o território, desde passeios breves para famílias até subidas
      de um dia inteiro e travessias prolongadas. Balizados por marcos de pedra ou estacas, Nyvallen, Nysätern
      e Dalsvallen são as portas de entrada de referência. Em Nyvallen tem início um percurso interpretativo
      com painéis informativos no qual as crianças procuram figuras de animais talhadas em madeira.


      Para alcançar as entranhas do maciço, de Nysätern à cabana de Sododalen distam cerca de sete quilómetros
      de trilho; este vale é frequentemente apelidado de coração de Sonfjället. Na cabana é possível ouvir
      gravações, entrevistas e contemplar imagens do parque através da ligação a uma rede informática local.


      No que toca ao esqui de travessia, a estrada de Nyvallen não é limpa de neve no inverno; para entrar em
      esquis é preferível partir de Nysätern, onde a via se mantém desimpedida e arranca o trilho invernal
      balizado.
    history: >-
      Esta montanha foi selecionada pelos seus planaltos tundras ricos em líquenes e pouco alterados pelo
      pastoreio de renas domésticas, e com vista a salvaguardar os derradeiros núcleos de rena bravia da
      Suécia. Em 1989 o parque nacional foi ampliado de 27 para 104 quilómetros quadrados para blindar toda a
      montanha e os bosques seculares envolventes. A presença humana nestas paragens pode remontar a mais de
      8.000 anos.
    before: >-
      A cabana de Sododalen permanece aberta todo o ano e pode ser utilizada como pernoita em situações de
      emergência. É interdito colher ou arrancar espécimes vegetais, permitindo-se contudo a apanha comedida
      de bagas e cogumelos; veículos motorizados não podem circular fora das vias e parques de estacionamento
      definidos. Só é permitido fazer fogo nas fogueiras oficiais instaladas junto às entradas de Nyvallen,
      Nysätern e Valmen, junto à cabana de Sododalen e no abrigo de Stor-Ryvålen.
    around: >-
      Sonfjället partilha laços ecológicos com sítios que abrigam alce, lince e urso: o [Parque Nacional de
      Lahemaa](/lugar/lahemaa-rahvuspark/), o [Parque Nacional de Slītere y Costa del Estrecho de
      Irbe](/lugar/sliteres-nacionalais-parks/) e o [Parque Nacional de Soomaa](/lugar/soomaa-rahvuspark/)
      acrescentam florestas virgens notáveis, ao passo que [Sarek](/lugar/sarek-national-park/) traz os
      cenários da alta montanha ártica.
