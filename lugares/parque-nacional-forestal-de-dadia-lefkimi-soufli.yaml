resumen:
  es: >-
    El santuario de rapaces del nordeste de Grecia, albergando la última colonia de reproducción del buitre
    negro en los Balcanes.
  en: >-
    The raptor sanctuary of northeastern Greece, harbouring the last breeding colony of cinereous vultures in
    the Balkans.
  fr: >-
    Le grand sanctuaire de rapaces du nord-est de la Grèce, abritant l’ultime colonie reproductrice de
    vautours moines des Balkans.
  de: >-
    Das Greifvogelschutzgebiet im Nordosten Griechenlands mit der letzten Brutkolonie des Mönchsgeiers auf der
    Balkanhalbinsel.
  it: >-
    Il santuario dei rapaci della Grecia nord-orientale, custode dell’ultima colonia riproduttiva di avvoltoio
    monaco dei Balcani.
  pt: >-
    O grande santuário de aves de rapina do nordeste da Grécia, albergando a última colónia reprodutora de
    abutre-preto dos Balcãs.
unico:
  es: >-
    Un bosque donde conviven buitre negro, alimoche y buitre leonado, tres de las cuatro especies de buitres
    de Europa.
  en: >-
    A forest where cinereous vulture, Egyptian vulture, and griffon vulture coexist—three of Europe’s four
    vulture species.
  fr: >-
    Une forêt où cohabitent vautour moine, percnoptère et vautour fauve, soit trois des quatre espèces de
    vautours d’Europe.
  de: >-
    Ein Waldgebiet, in dem Mönchsgeier, Schmutzgeier und Gänsegeier zusammenleben – drei der vier Geierarten
    Europas.
  it: >-
    Una foresta dove convivono avvoltoio monaco, capovaccaio e grifone, ossia tre delle quattro specie di
    avvoltoi europei.
  pt: >-
    Uma floresta onde convivem abutre-preto, abutre-do-egito e abutre-fouveiro, três das quatro espécies de
    abutres da Europa.
observaciones:
  es: >-
    Los senderos señalizados están abiertos todo el año, salvo los días de la temporada de incendios, del 1 de
    mayo al 31 de octubre, en que el riesgo de incendio es alto. Se pide seguir los caminos marcados para no
    perderse ni molestar a los animales. Está prohibido hacer fuego y tirar colillas en todo el bosque. Y,
    como se vive entre los animales, se pide evitar la música y las voces fuertes: así es más probable
    encontrarse con ellos.
texto:
  es:
    intro: >-
      Una vez por semana, desde 1987, alguien deja animales muertos de granja en uno de los recintos vallados
      del bosque de Dadia, para alimentar a los buitres. Esa rutina resume lo que es este parque, en el
      noreste de Grecia: un bosque de pinos y robles, de colinas suaves y arroyos, donde las rapaces son las
      protagonistas. Se han observado 36 de las 39 especies de rapaces diurnas europeas, y aquí conviven tres
      de las cuatro especies de buitres del continente.
    landscape: >-
      El relieve es suave pero movido: alterna valles pequeños y grandes, pendientes dulces y empinadas, y una
      red ramificada de arroyos. La cumbre más alta del parque es Kapsalo, a 620 m. El clima es mediterráneo
      con inviernos continentales por los vientos del norte; llueven unos 732 mm al año, con el máximo en
      diciembre y el mínimo en agosto.


      La mayor parte del parque es bosque. Lo forman sobre todo pino negro y pino de Calabria, mezclados con
      robles, otros árboles caducifolios y matorral mediterráneo. En el centro y el este mandan las coníferas;
      en el norte y el suroeste, los robledales puros de roble húngaro, roble cerris y roble pubescente, muy
      talados en el pasado. En las riberas domina el aliso, con sauces, álamos negros y tamariscos. En total
      se han registrado entre 360 y 400 especies de plantas, con dos endemismos griegos y 25 especies de
      orquídeas.
    wildlife: >-
      Las aves mandan. Aparte de las rapaces, se han observado unas 166 especies, dos de ellas amenazadas en
      Grecia: la perdiz pardilla y la [cigüeña negra](/especie/ciconia_nigra/). De la cigüeña negra crían en
      el parque entre treinta y treinta y cinco parejas, una parte importante de la población reproductora del
      país. Entre las rapaces, el [buitre negro](/especie/aegypius_monachus/), el
      [alimoche](/especie/neophron_percnopterus/) y el [buitre leonado](/especie/gyps_fulvus/) comparten
      bosque con el [águila real](/especie/aquila_chrysaetos/), que prefiere las tortugas, y la culebrera
      europea, que prefiere las serpientes. Y si lo que buscas son pájaros pequeños, en el sendero amarillo se
      ven pinzones, carboneros, zorzales y pájaros carpinteros.


      Los mamíferos son discretos. Se han observado unas 60-65 especies, y con suerte se ve un
      [corzo](/especie/capreolus_capreolus/) durante el paseo; la [nutria](/especie/lutra_lutra/), amenazada,
      vive sobre todo a lo largo de los arroyos, y también hay [lobo](/especie/canis_lupus/) y [gato
      montés](/especie/felis_silvestris/). Hay 24 especies de murciélagos, que usan cuevas y minas antiguas
      como refugio casi todo el año. Entre los anfibios, 13 especies, 10 de ellas ranas, incluido el [sapillo
      de vientre de fuego](/especie/bombina_bombina/), amenazado. De las 29 especies de reptiles, cuatro son
      tortugas, once lagartos y catorce serpientes. En los arroyos hay 17 especies de peces, y entre los
      invertebrados se han registrado 283 especies, 104 de ellas mariposas.
    visit: >-
      La puerta de entrada es el centro de información de Dadia, a unos ochocientos metros de la plaza del
      pueblo, junto al bosque. Abrió en agosto de 1994 para promover la protección de la naturaleza, el
      ecoturismo y la sensibilización del público. Tiene una sala de exposiciones con material fotográfico e
      informativo y una sala de proyecciones con un documental. Organiza visitas educativas y guiadas, y abre
      a diario de 8:00 a 16:00.


      Desde allí salen cuatro senderos de colores. El naranja es fácil, de pendientes suaves, y llega en cerca
      de una hora al observatorio de rapaces, desde donde se ven buitres y águilas alimentándose en su entorno
      natural. El amarillo regresa desde el observatorio al centro por un descenso suave de 45 minutos. El
      rojo sube desde el centro a la cumbre de Gkimprena, a unos 520 m, en 120 minutos y con dificultad media;
      antes de la cumbre aparecen las ruinas de un fuerte bizantino, con vistas panorámicas de toda el área
      protegida y de las rapaces y buitres en el cielo. Y el azul baja de Gkimprena en unos 90 minutos
      siguiendo el arroyo Diavolorema hasta los campos de cultivo del borde del bosque, terreno de caza de las
      rapaces.


      También hay una ruta ciclista de Dadia al observatorio de rapaces, Lyra y Lefkimi, que pasa por el
      recinto de alimentación de buitres. Para un paseo cómodo hacen falta botas, botiquín y agua, y
      prismáticos para observar las aves.
    history: >-
      En Gkimprena están las ruinas de un castillo bizantino construido por Justiniano.


      La alimentación suplementaria es la medida más visible. Desde 1987 se alimenta a los buitres de forma
      suplementaria todo el año, una vez por semana, con animales muertos en granjas, en tres recintos
      vallados: Dadia, Dervisi y Lofos. La razón es que la caída de la ganadería extensiva y las normas
      veterinarias estrictas han reducido el alimento de los buitres. La mayoría de los nidos de buitre negro
      está dentro de la zona A de protección, y se prohíben las intervenciones en la vegetación en un radio de
      50 m de los nidos de rapaces.
    before: >-
      Los senderos señalizados están abiertos todo el año, salvo los días de la temporada de incendios, del 1
      de mayo al 31 de octubre, en que el riesgo de incendio es alto. Se pide seguir los caminos marcados para
      no perderse ni molestar a los animales. Está prohibido hacer fuego y tirar colillas en todo el bosque.
      Y, como se vive entre los animales, se pide evitar la música y las voces fuertes: así es más probable
      encontrarse con ellos.
    around: >-
      A unos trece kilómetros queda el [Parque Nacional del Delta del
      Evros](/lugar/ethniko-parko-delta-evrou/), el vecino más cercano del atlas. A distancia, comparten
      buitre negro, alimoche y buitre leonado [Monfragüe](/lugar/parque-nacional-de-monfrague/), las
      [Gargantas del Verdon](/lugar/parc-naturel-regional-du-verdon---gorges/), [Els
      Ports](/lugar/parc-natural-dels-ports/) y las [Gorges de la Jonte](/lugar/gorges-de-la-jonte/).
  en:
    intro: >-
      Once a week since 1987, livestock carcasses from local farms have been set out inside fenced feeding
      enclosures in the Dadia forest to sustain endangered vultures. That unbroken routine encapsulates this
      sanctuary in northeastern Greece: a rolling mosaic of pine and oak woodlands, gentle hills, and clear
      streams where birds of prey reign supreme. Thirty-six (36) of Europe’s 39 diurnal raptor species have
      been recorded here, and three of the continent’s four vulture species share its canopy.
    landscape: >-
      The terrain is undulating and varied, alternating broad and narrow valleys, gentle slopes and rocky
      scarps, dissected by a dense stream network. The highest summit within the park is Kapsalo at 620 m. The
      climate is Mediterranean with continental winter chills driven by northerly winds; annual rainfall
      averages around 732 mm, peaking in December with an August minimum.


      Dense woodland blankets most of the park. It consists primarily of black pine and Calabrian pine
      intermixed with oaks, deciduous trees, and Mediterranean maquis. Conifers dominate central and eastern
      sectors, while pure oak stands of Hungarian oak, Turkey oak, and downy oak claim the north and
      southwest. Riparian corridors feature black alder, willows, black poplars, and tamarisks. Between 360
      and 400 plant species have been documented, including two Greek endemics and 25 orchid species.
    wildlife: >-
      Birds dominate this wilderness. Beyond raptors, some 166 bird species have been recorded, two classified
      as nationally threatened: grey partridge and the [black stork](/especie/ciconia_nigra/). Between thirty
      and thirty-five black stork pairs breed here, representing a vital share of Greece’s population. Among
      raptors, the [cinereous vulture](/especie/aegypius_monachus/), [Egyptian
      vulture](/especie/neophron_percnopterus/), and [griffon vulture](/especie/gyps_fulvus/) share airspace
      with the [golden eagle](/especie/aquila_chrysaetos/), which hunts tortoises, and short-toed snake eagles
      pursuing reptiles. Songbirds thrive along the yellow trail: chaffinches, tits, thrushes, and
      woodpeckers.


      Mammals remain discreet. Surveys document 60-65 species; sharp-eyed walkers may spot [roe
      deer](/especie/capreolus_capreolus/) in forest clearings, while vulnerable [Eurasian
      otters](/especie/lutra_lutra/) hunt along streams alongside [grey wolves](/especie/canis_lupus/) and
      [European wildcats](/especie/felis_silvestris/). The park shelters 24 bat species using caves and
      disused mines. Amphibians number 13 species, including 10 frogs and the threatened [European
      fire-bellied toad](/especie/bombina_bombina/). Of the 29 reptile species recorded, four are tortoises,
      eleven lizards, and fourteen snakes. Streams host 17 fish species, while invertebrates tally 283
      species, including 104 butterflies.
    visit: >-
      The primary gateway is the Dadia Information Centre, located roughly eight hundred metres from the
      village square beside the forest. Opened in August 1994, it features exhibition halls, photography
      displays, and a screening room for documentaries, alongside guided educational tours. It opens daily
      from 8:00 to 16:00.


      Four color-coded trails depart from the centre. The orange trail is an easy one-hour walk with gentle
      gradients leading to the vulture observation hide, where vultures and eagles can be viewed feeding in
      their natural setting. The yellow trail returns from the hide to the centre in a gentle 45-minute
      descent. The red trail climbs to Gkimprena summit (520 m) in 120 minutes of moderate hiking, passing
      Byzantine fort ruins with sweeping panoramas of raptors riding thermals. The blue trail descends
      Gkimprena in about 90 minutes along Diavolorema stream to forest-edge meadows.


      A cycling route links Dadia to the raptor hide, Lyra, and Lefkimi via the feeding enclosure. Sturdy
      footwear, water, a basic first-aid kit, and binoculars are recommended.
    history: >-
      At Gkimprena stand the ruins of a Byzantine fortification built by Emperor Justinian.


      Supplemental feeding remains the cornerstone conservation measure. Operating continuously since 1987,
      carcasses are supplied weekly across three fenced feeding sites: Dadia, Dervisi, and Lofos. This
      compensates for declining pastoral grazing and strict carcass disposal regulations. Most cinereous
      vulture nests lie within core Protection Zone A, where forest management is banned within a 50 m radius
      of all raptor nests.
    before: >-
      Marked hiking trails remain open year-round, except during fire alert days between 1 May and 31 October
      when extreme fire danger prompts closures. Stay strictly on marked trails to avoid disturbance.
      Campfires and smoking are strictly forbidden throughout the forest. Avoid loud music and shouting to
      increase wildlife encounters.
    around: >-
      Around thirteen kilometres away lies [Evros Delta National Park](/lugar/ethniko-parko-delta-evrou/), the
      closest neighbor in the atlas. Farther afield, cinereous, Egyptian, and griffon vultures are shared with
      [Monfragüe](/lugar/parque-nacional-de-monfrague/), [Verdon
      Gorges](/lugar/parc-naturel-regional-du-verdon---gorges/), [Els Ports](/lugar/parc-natural-dels-ports/),
      and [Jonte Gorges](/lugar/gorges-de-la-jonte/).
  fr:
    intro: >-
      Une fois par semaine depuis 1987, des carcasses d’animaux d’élevage sont déposées dans un enclos aménagé
      de la forêt de Dadia pour nourrir les vautours. Ce rituel résume ce parc du nord-est de la Grèce : une
      mosaïque boisée de pins et de chênes, de vallons et de ruisseaux, royaume des rapaces. On y a observé 36
      des 39 espèces de rapaces diurnes d’Europe, et trois des quatre vautours du continent y partagent la
      voûte forestière.
    landscape: >-
      Le relief est vallonné mais vigoureux, alternant gorges et combes, versants doux et escarpements rocheux
      sillonnés d’un réseau dense de torrents. Le point culminant est le mont Kapsalo à 620 m. Le climat
      méditerranéen subit des rigueurs continentales en hiver ; les précipitations atteignent 732 mm annuels,
      avec un pic en décembre et un minimum en août.


      La forêt couvre l’essentiel du parc. Elle associe pin noir et pin de Calabre aux chênes, feuillus divers
      et maquis méditerranéen. Les conifères règnent au centre et à l’est, tandis que le nord et le sud-ouest
      portent des chênaies pures de chêne de Hongrie, chêne chevelu et chêne pubescent. Les berges sont
      bordées d’aulnes glutineux, de saules et de tamaris. Entre 360 et 400 espèces végétales y sont
      recensées, dont deux endémiques grecques et 25 orchidées.
    wildlife: >-
      Les oiseaux règnent en maîtres. Hors rapaces, 166 espèces ont été observées, dont deux menacées en Grèce
      : la perdrix grise et la [cigogne noire](/especie/ciconia_nigra/). Cette dernière compte trente à
      trente-cinq couples nicheurs, soit une part majeure de la population nationale. Côté rapaces, le
      [vautour moine](/especie/aegypius_monachus/), le [percnoptère](/especie/neophron_percnopterus/) et le
      [vautour fauve](/especie/gyps_fulvus/) côtoient l’[aigle royal](/especie/aquila_chrysaetos/), amateur de
      tortues, et le circaète Jean-le-Blanc. Les passereaux animent le sentier jaune : pinsons, mésanges,
      grives et pics.


      Les mammifères sont discrets. On en compte 60-65 espèces ; avec un peu de chance, un
      [chevreuil](/especie/capreolus_capreolus/) surgit au détour d’un chemin. La [loutre
      d’Europe](/especie/lutra_lutra/) hante les cours d’eau, aux côtés du [loup](/especie/canis_lupus/) et du
      [chat sauvage](/especie/felis_silvestris/). Le parc abrite 24 espèces de chauves-souris. Les amphibiens
      comptent 13 espèces, dont 10 grenouilles et crapauds, avec le [sonneur à ventre de
      feu](/especie/bombina_bombina/). Parmi les 29 reptiles figurent quatre tortues, onze lézards et quatorze
      serpents. Les cours d’eau abritent 17 espèces de poissons, et les invertébrés rassemblent 283 espèces,
      dont 104 papillons.
    visit: >-
      Le point d’entrée est le centre d’information de Dadia, situé à huit cents mètres de la place du village
      en lisière de forêt. Ouvert en août 1994, il propose des salles d’exposition photographique et une salle
      de projection documentaire, animant des visites guidées. Il ouvre tous les jours de 8:00 à 16:00.


      Quatre sentiers balisés par couleur en partent. Le sentier orange mène en une heure de marche facile à
      l’observatoire des rapaces pour contempler vautours et aigles en curée. Le sentier jaune ramène au
      centre en une descente de 45 minutes. Le sentier rouge monte au sommet de Gkimprena (520 m) en 120
      minutes d’effort modéré, passant près des ruines d’un fort byzantin avec panorama sur les rapaces
      planant dans les ascendances. Le sentier bleu redescend de Gkimprena en 90 minutes le long du
      Diavolorema.


      Un itinéraire cyclable relie Dadia à l’observatoire des rapaces, Lyra et Lefkimi via le charnier. Bonnes
      chaussures, trousse de secours, eau et jumelles sont indispensables.
    history: >-
      À Gkimprena subsistent les vestiges d’un château byzantin bâti par l’empereur Justinien.


      Le nourrissage artificiel est la mesure phare du site. Instauré en 1987, il approvisionne les vautours
      chaque semaine sur trois sites clôturés : Dadia, Dervisi et Lofos, palliant le recul du pastoralisme
      extensif. La majorité des nids de vautours moines est incluse en zone de protection A, où toute coupe
      forestière est proscrite dans un rayon de 50 m autour de chaque aire de rapace.
    before: >-
      Les sentiers sont ouverts toute l’année, sauf lors des journées d’alerte incendie entre le 1er mai et le
      31 octobre. Restez sur les sentiers balisés pour ne pas déranger la faune. Tout feu et jet de mégot sont
      formellement proscrits. Évitez cris et musique pour favoriser les observations.
    around: >-
      À treize kilomètres se trouve le [Parc national du delta de l’Évros](/lugar/ethniko-parko-delta-evrou/).
      Plus loin, [Monfragüe](/lugar/parque-nacional-de-monfrague/), les [Gorges du
      Verdon](/lugar/parc-naturel-regional-du-verdon---gorges/), [Els Ports](/lugar/parc-natural-dels-ports/)
      et les [Gorges de la Jonte](/lugar/gorges-de-la-jonte/) partagent vautour moine, percnoptère et vautour
      fauve.
  de:
    intro: >-
      Einmal pro Woche wird seit 1987 Viehfallwild in einer Umzäunung des Dadia-Waldes ausgelegt, um die Geier
      zu füttern. Dieser Ablauf beschreibt das Schutzgebiet im Nordosten Griechenlands: ein waldreiches
      Hügelland aus Kiefern und Eichen, durchzogen von Bächen, in dem Greifvögel die Hauptrolle spielen. 36
      der 39 europäischen tagaktiven Greifvogelarten wurden hier nachgewiesen, und drei der vier Geierarten
      unseres Kontinents teilen sich den Himmel über dem Wald.
    landscape: >-
      Das Relief ist sanft, aber reich gegliedert: Es wechseln kleine und weite Täler, mäßige Hänge und
      Steilstufen, durchzogen von einem verzweigten Bachnetz. Der höchste Punkt des Parks ist der Kapsalo mit
      620 m. Das Klima ist mediterran mit kontinentalen Winterkälteeinbrüchen; die jährliche
      Niederschlagsmenge beträgt etwa 732 mm mit Maximum im Dezember und Minimum im August.


      Der Großteil des Parks ist bewaldet. Die Bestände bilden Schwarzkiefer und Kalabrische Kiefer, gemischt
      mit Eichen und Macchia. Im Zentrum dominieren Nadelhölzer, im Norden und Südwesten reine Eichenwälder
      aus Ungarischer Eiche, Zerreiche und Flaumeiche. An Bachläufen stehen Schwarzerlen, Weiden und
      Tamarisken. Insgesamt wurden zwischen 360 und 400 Pflanzenarten erfasst, darunter zwei griechische
      Endemiten und 25 Orchideenarten.
    wildlife: >-
      Die Vogelwelt steht an erster Stelle. Abgesehen von Greifvögeln wurden 166 Vogelarten registriert,
      darunter Rebhuhn und [Schwarzstorch](/especie/ciconia_nigra/). Vom Schwarzstorch brüten dreißig bis
      fünfunddreißig Paare im Park – ein bedeutender Teil des Landesbestands. Unter den Greifvögeln teilen
      sich [Mönchsgeier](/especie/aegypius_monachus/), [Schmutzgeier](/especie/neophron_percnopterus/) und
      [Gänsegeier](/especie/gyps_fulvus/) das Revier mit dem [Steinadler](/especie/aquila_chrysaetos/) und dem
      Schlangenadler. Kleinvögel beleben den gelben Pfad: Buchfinken, Meisen, Drosseln und Spechte.


      Die Säugetiere leben verborgen. 60-65 Arten wurden nachgewiesen; mit etwas Glück begegnet man einem
      [Reh](/especie/capreolus_capreolus/). Der bedrohte [Eurasische Fischotter](/especie/lutra_lutra/) lebt
      an den Bächen, begleitet von [Wolf](/especie/canis_lupus/) und [Wildkatze](/especie/felis_silvestris/).
      24 Fledermausarten nutzen Höhlen und Stollen. Unter den 13 Amphibienarten, davon 10 Froschlurche, findet
      sich die [Rotbauchunke](/especie/bombina_bombina/). Zu den 29 Reptilienarten zählen vier
      Landschildkröten, elf Eidechsen und vierzehn Schlangen. Die Bäche beherbergen 17 Fischarten, und die
      Wirbellosen zählen 283 Arten, darunter 104 Tagfalter.
    visit: >-
      Ausgangspunkt ist das Informationszentrum Dadia, etwa achthundert Meter vom Dorfplatz am Waldrand
      gelegen. Es wurde im August 1994 eröffnet, bietet Fotoausstellungen, Dokumentarfilme und geführte Touren
      und öffnet täglich von 8:00 bis 16:00.


      Vier farblich markierte Wege starten hier. Der orangefarbene Pfad führt in etwa einer Stunde gemütlicher
      Wanderung zur Geierbeobachtungsstation. Der gelbe Weg kehrt in 45 Minuten sanftem Abstieg zum Zentrum
      zurück. Die rote Route steigt in 120 Minuten mäßiger Steigung zum Gkimprena-Gipfel (520 m) an, vorbei an
      byzantinischen Burgruinen mit Panorama über kreisende Greifvögel. Die blaue Route führt in 90 Minuten am
      Diavolorema-Bach entlang hinab zu offenen Jagdgründen.


      Eine Radroute verbindet Dadia mit der Geierstation, Lyra und Lefkimi. Feste Schuhe, Erste-Hilfe-Set,
      Wasser und Fernglas sind unverzichtbar.
    history: >-
      Auf dem Gkimprena liegen Ruinen einer Festung aus der Zeit Kaiser Justinians.


      Die Geierfütterung ist die zentrale Schutzmaßnahme. Seit 1987 werden die Aasfresser wöchentlich an drei
      umzäunten Plätzen – Dadia, Dervisi und Lofos – versorgt, um den Rückgang der Weidewirtschaft
      auszugleichen. Die meisten Mönchsgeiernester liegen in der Schutzzone A; forstliche Eingriffe sind im
      Umkreis von 50 m um alle Greifvogelhorste untersagt.
    before: >-
      Die markierten Wanderwege sind ganzjährig geöffnet, ausgenommen an Tagen mit hoher Waldbrandgefahr vom
      1. Mai bis zum 31. Oktober. Bitte bleibe stets auf den markierten Pfaden, um dich nicht zu verirren und
      die Wildtiere nicht zu stören. Offenes Feuer und das Wegwerfen von Zigarettenkippen sind im gesamten
      Wald streng verboten. Da du dich mitten im Lebensraum der Tiere bewegst, bitten wir darum, laute Musik
      und lautes Rufen zu vermeiden – so steigen auch die Chancen auf Tierbeobachtungen.
    around: >-
      Etwa dreizehn Kilometer entfernt liegt der [Nationalpark
      Evros-Delta](/lugar/ethniko-parko-delta-evrou/). Aus der Ferne teilen Mönchs-, Schmutz- und Gänsegeier
      den Lebensraum mit [Monfragüe](/lugar/parque-nacional-de-monfrague/), der
      [Verdon-Schlucht](/lugar/parc-naturel-regional-du-verdon---gorges/), [Els
      Ports](/lugar/parc-natural-dels-ports/) und der [Jonte-Schlucht](/lugar/gorges-de-la-jonte/).
  it:
    intro: >-
      Una volta alla settimana, ininterrottamente dal 1987, carcasse di animali d’allevamento vengono
      depositate in un recinto recintato della foresta di Dadia per alimentare gli avvoltoi. Questa
      consuetudine sintetizza la missione del parco della Grecia nord-orientale: un mosaico collinare di pini
      e querce, solcato da ruscelli limpidi, dove i rapaci dominano i cieli. Vi sono state osservate 36 delle
      39 specie europee di rapaci diurni, e tre delle quattro specie di avvoltoi continentali nidificano tra
      le sue chiome.
    landscape: >-
      La morfologia è ondulata e varia: valloni stretti e ampi pianori si alternano a pendii dolci e falesie
      rocciose, drenati da una fitta idrografia torrentizia. Il rilievo sommitale è il Kapsalo a 620 m. Il
      clima è tipicamente mediterraneo ma esposto ai venti freddi continentali invernali; la piovosità media
      si attesta attorno a 732 mm annui, con apice a dicembre e minimo ad agosto.


      Il manto boschivo copre la quasi totalità dell’area protetta. È costituito da pino nero e pino bruzio
      frammisti a querce e macchia mediterranea. Le conifere predominano nei quadranti centrale e orientale,
      mentre a nord e sud-ovest prosperano querceti di rovere ungherese, cerro e roverella. Lungo le sponde
      vegetano ontani neri, salici e tamerici. Sono censite tra 360 e 400 specie vegetali, comprendenti due
      endemismi ellenici e 25 specie di orchidee.
    wildlife: >-
      Gli uccelli detengono il primato. Oltre ai rapaci sono state censite 166 specie ornitiche, tra cui due
      minacciate in Grecia: starna e [cicogna nera](/especie/ciconia_nigra/). Di quest’ultima nidificano tra
      trenta e trentacinque coppie, nucleo essenziale della popolazione nazionale. Tra i rapaci, l’[avvoltoio
      monaco](/especie/aegypius_monachus/), il [capovaccaio](/especie/neophron_percnopterus/) e il
      [grifone](/especie/gyps_fulvus/) dividono i costoni con l’[aquila reale](/especie/aquila_chrysaetos/) e
      il biancone. Lungo il sentiero giallo abbondano fringuelli, cince, tordi e picchi.


      I mammiferi mantengono abitudini schive. Si contano 60-65 specie; con circospezione si avvistano
      [caprioli](/especie/capreolus_capreolus/) nelle radure, mentre la [lontra
      europea](/especie/lutra_lutra/) nuota nei torrenti assieme a [lupo grigio](/especie/canis_lupus/) e
      [gatto selvatico](/especie/felis_silvestris/). Il parco annovera 24 specie di pipistrelli. Gli anfibi
      contano 13 specie, tra cui 10 rane e rospi, compreso il [*Bombina bombina*](/especie/bombina_bombina/)
      (ululone dal ventre di fuoco). Su 29 rettili figurano quattro testuggini, undici lucertole e quattordici
      ofidi. I torrenti ospitano 17 specie ittiche e gli invertebrati toccano 283 specie, con 104 farfalle
      diurne.
    visit: >-
      La base di partenza è il Centro Informazioni di Dadia, posto a circa ottocento metri dalla piazza del
      paese al limite del bosco. Inaugurato nell’agosto 1994, ospita mostre fotografiche, proiezioni
      documentarie e percorsi didattici guidati. È aperto tutti i giorni dalle 8:00 alle 16:00.


      Dal centro si dipartono quattro sentieri contrassegnati da colori. L’arancione è un facile percorso di
      un’ora fino al capanno d’osservazione dei rapaci, ideale per ammirare avvoltoi e aquile in pastura. Il
      giallo rientra al centro in 45 minuti di discesa agevole. Il rosso sale alla cima di Gkimprena (520 m)
      in 120 minuti di media pendenza, sfiorando i ruderi di un fortilizio bizantino con vedute aeree sulle
      vele dei rapaci. Il blu scende da Gkimprena in 90 minuti seguendo il Diavolorema verso i margini
      boschivi.


      Una pista ciclabile unisce Dadia al capanno, Lyra e Lefkimi lambendo il carnaio. Consigliati scarponi,
      kit medico, acqua e binocolo.
    history: >-
      Sulla vetta di Gkimprena insistono i resti di un presidio fortificato byzantino fatto erigere da
      Giustiniano.


      Il carnaio resta il fulcro della tutela attiva. Avviata nel 1987, l’alimentazione supplementare
      settimanale opera su tre aree recintate — Dadia, Dervisi e Lofos — per contrastare la rarefazione del
      pascolo brado. La gran parte dei nidi dell’avvoltoio monaco ricade nella zona di riserva integrale A,
      con divieto di taglio boschivo nel raggio di 50 m dai nidi.
    before: >-
      I sentieri sono percorribili tutto l’anno, ad eccezione dei giorni ad alto rischio di incendi boschivi
      tra il 1 maggio e il 31 ottobre. Resta sui percorsi tracciati per non disturbare i nidi. Vietato
      accendere fuochi e gettare mozziconi. Evita schiamazzi e musica per agevolare gli incontri faunistici.
    around: >-
      A circa tredici chilometri si trova il [Parco Nazionale del Delta
      dell’Evros](/lugar/ethniko-parko-delta-evrou/). Più lontano, condividono avvoltoio monaco, capovaccaio e
      grifone [Monfragüe](/lugar/parque-nacional-de-monfrague/), le [Gole del
      Verdon](/lugar/parc-naturel-regional-du-verdon---gorges/), [Els Ports](/lugar/parc-natural-dels-ports/)
      e le [Gorges de la Jonte](/lugar/gorges-de-la-jonte/).
  pt:
    intro: >-
      Uma vez por semana desde 1987 são depositadas carcaças de gado num cercado da floresta de Dadia para
      alimentar os abutres. Essa rotina sintetiza este parque no nordeste da Grécia: um mosaico ondulado de
      pinhais e carvalhais, colinas suaves e ribeiros limpos onde as aves de rapina reinam soberanas. Foram
      observadas 36 das 39 espécies de rapinas diurnas europeias, convivendo no seu dossel três das quatro
      espécies de abutres do continente.
    landscape: >-
      O relevo é acidentado mas harmonioso: sucedem-se vales largos e gargantas, encostas suaves e escarpas
      rochosas rasgadas por uma densa rede de linhas de água. A cota mais elevada situa-se no pico Kapsalo a
      620 m. O clima mediterrânico sofre influências continentais no inverno; a precipitação média ronda 732
      mm anuais, com máximo em dezembro e mínimo em agosto.


      A floresta cobre a maior parte do parque. Associa pinheiro-larício e pinheiro-de-calábria a carvalhos e
      matagais mediterrânicos. As coníferas dominam no centro e a leste, enquanto a norte e sudoeste vicejam
      carvalhais de carvalho-da-hungria, carvalho-cerquinho e carvalho-pubescente. Nas galerias ripícolas
      abundam amieiros, salgueiros e tamargueiras. Encontram-se inventariadas entre 360 e 400 espécies de
      plantas, incluindo dois endemismos gregos e 25 espécies de orquídeas.
    wildlife: >-
      As aves dominam a paisagem. Excluindo as rapinas, foram avistadas cerca de 166 espécies de aves, duas
      delas em perigo na Grécia: a perdiz-cinzenta e a [cegonha-preta](/especie/ciconia_nigra/). Da
      cegonha-preta nidificam trinta a trinta e cinco casais, fração vital da população reprodutora do país.
      Entre as rapinas, o [abutre-preto](/especie/aegypius_monachus/), o
      [abutre-do-egito](/especie/neophron_percnopterus/) e o [abutre-fouveiro](/especie/gyps_fulvus/)
      partilham o espaço com a [águia-real](/especie/aquila_chrysaetos/) e a águia-cobreira. Pequenos
      passeriformes povoam o trilho amarelo: tentilhões, chapins, tordos e pica-paus.


      Os mamíferos são discretos. Inventariam-se 60-65 espécies; com atenção vislumbra-se a
      [corça](/especie/capreolus_capreolus/) nas clareiras, enquanto a vulnerável
      [lontra-europeia](/especie/lutra_lutra/) percorre as ribeiras a par do
      [lobo-cinzento](/especie/canis_lupus/) e do [gato-bravo](/especie/felis_silvestris/). O parque acolhe 24
      espécies de morcegos. Os anfíbios somam 13 espécies, incluindo 10 rãs e sapos, com o [*Bombina
      bombina*](/especie/bombina_bombina/) (bombina-de-barriga-de-fogo). De 29 répteis constam quatro cágados,
      onze lagartos e catorze serpentes. As ribeiras sustentam 17 espécies de peixes, alcançando os
      invertebrados 283 espécies, com 104 borboletas diurnas.
    visit: >-
      A porta de entrada é o centro de informação de Dadia, situado a cerca de oitocentos metros do largo da
      aldeia junto à mata. Inaugurado em agosto de 1994, dispõe de salas expositivas, fotografias e
      documentários, prestando apoio a visitas guiadas. Encontra-se aberto diariamente das 8:00 às 16:00.


      Daí partem quatro percursos sinalizados por cores. O trilho laranja conduz em cerca de uma hora de
      marcha suave ao observatório de rapinas, permitindo admirar abutres e águias em alimentação. O trilho
      amarelo regressa ao centro em 45 minutos de descida ligeira. O trilho vermelho sobe ao topo de Gkimprena
      (520 m) em 120 minutos de dificuldade média, passando junto a ruínas de um forte bizantino com vistas
      panorâmicas sobre rapinas a planar. O trilho azul desce de Gkimprena em 90 minutos pela margem do
      ribeiro Diavolorema.


      Existe ainda uma rota ciclável ligando Dadia ao abrigo, Lyra e Lefkimi através do comedouro. Calçado
      aderente, água, estojo de primeiros socorros e binóculos são essenciais.
    history: >-
      No alto de Gkimprena erguem-se as ruínas de uma fortaleza bizantina erigida pelo imperador Justiniano.


      A alimentação suplementar constitui a medida estrutural de preservação. Em vigor contínuo desde 1987,
      abastece semanalmente os abutres em três recintos vedados — Dadia, Dervisi e Lofos —, compensando o
      declínio da pecuária extensiva. A quase totalidade dos ninhos de abutre-preto situa-se na zona de
      proteção A, sendo estritamente interditas quaisquer intervenções florestais num raio de 50 m dos ninhos.
    before: >-
      Os trilhos assinalados estão acessíveis todo o ano, salvo em dias de alerta máximo de incêndio entre 1
      de maio e 31 de outubro. Segue os caminhos marcados para não perturbar a fauna. Fogueiras e pontas de
      cigarro são severamente proibidas na floresta. Evita ruídos e música para potenciar avistamentos.
    around: >-
      A cerca de treze quilómetros fica o [Parque Nacional do Delta do
      Evros](/lugar/ethniko-parko-delta-evrou/). À distância, partilham abutre-preto, abutre-do-egito e
      abutre-fouveiro [Monfragüe](/lugar/parque-nacional-de-monfrague/), as [Gargantas do
      Verdon](/lugar/parc-naturel-regional-du-verdon---gorges/), [Els Ports](/lugar/parc-natural-dels-ports/)
      e as [Gorges de la Jonte](/lugar/gorges-de-la-jonte/).
