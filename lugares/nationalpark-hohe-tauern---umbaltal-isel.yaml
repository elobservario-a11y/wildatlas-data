resumen:
  es: >-
    El Parque Nacional más grande de los Alpes y de Europa Central (1.800 km²), albergando el Grossglockner
    (3.798 m) y la ruta glacial del Isel.
  en: >-
    The largest National Park in the Alps and Central Europe (1,800 km²), sheltering the Grossglockner (3,798
    m) and the wild Isel glacial river.
  fr: >-
    Le plus grand parc national des Alpes et d’Europe centrale (1 800 km²), abritant le Grossglockner (3 798
    m) et le cours sauvage de l’Isel.
  de: >-
    Der größte Nationalpark der Alpen und Mitteleuropas (1.800 km²), Heimat des Großglockners (3.798 m) und
    des wilden Gletscherflusses Isel.
  it: >-
    Il più esteso Parco Nazionale delle Alpi e dell’Europa centrale (1.800 km²), custode del Grossglockner
    (3.798 m) e del corso glaciale dell’Isel.
  pt: >-
    O maior Parque Nacional dos Alpes e da Europa Central (1.800 km²), abrigando o Grossglockner (3.798 m) e o
    curso glaciar do Isel.
unico:
  es: >-
    En un mismo paseo puedes sentir la bruma de las cascadas en la cara y ver, bajo tus pies, piedras verdes
    pulidas por el agua.
  en: >-
    On a single mountain walk you can feel waterfall spray on your face and look down upon smooth green stones
    polished by glacial meltwaters.
  fr: >-
    Au cours d’une même balade, vous pouvez sentir les embruns des cascades sur votre visage et admirer sous
    vos pieds des roches vertes polies par l’eau.
  de: >-
    Auf einer einzigen Wanderung spürst du die Gischt tosender Wasserfälle im Gesicht und siehst zu deinen
    Füßen vom Wasser glatt geschliffene grüne Steine.
  it: >-
    In un’unica escursione puoi sentire sul volto la spuma delle cascate e ammirare sotto i piedi pietre verdi
    levigate dall’acqua.
  pt: >-
    Num mesmo passeio podes sentir os borrifos das cascatas no rosto e contemplar sob os pés rochas verdes
    polidas pela torrente.
observaciones:
  es: >-
    Los senderos están señalizados con carteles amarillos, y los de puntos negros exigen experiencia de
    montaña, equipo adecuado y pie seguro. Está prohibido acampar y hacer fuego en el campo; hay campings en
    los municipios del parque. Quédate en los caminos y senderos señalizados, por respeto a animales y
    plantas, y no hagas ruido innecesario. Desde Lienz o Mittersill se llega por la B108 hasta Matrei, y desde
    allí por el Virgental hasta Ströden.
texto:
  es:
    intro: >-
      En verano, con el deshielo, el agua del glaciar Umbalkees baja por el Isel y se precipita por escalones
      de roca. Es un torrente glaciar en estado puro: su caudal cambia a lo largo del año y del día. El valle
      de Umbal, al fondo del Virgental, en el Tirol Oriental, enseña como pocos valles de los Altos Tauern
      cómo un río de hielo esculpe el paisaje a golpe de cataratas. Forma parte del Parque Nacional Hohe
      Tauern, el mayor de los Alpes, con 1.856 km².
    landscape: >-
      Las Umbalfälle son una escalera de agua. Como las cataratas son muy empinadas, arrastran todo el
      material del glaciar, y ese material pule la roca durante milenios hasta encajar el torrente en una
      garganta. El resultado se lee en el lecho: piedras verdes lisas, con huecos redondos que el agua ha
      vaciado. Las cataratas muestran el paso de una catarata deslizante a una escalera de cascadas, de poza
      en poza.


      Detrás está la ventana de los Tauern, una de las rarezas geológicas de los Alpes: allí afloran capas que
      en otros puntos están en lo más profundo, y el parque guarda hasta 200 minerales distintos. Los
      glaciares ensancharon después los valles en V hasta convertirlos en valles en U, y dejaron circos por
      todas partes. Al retirarse, el hielo ha dejado morrenas que son un paisaje primigenio: animales y
      plantas deben repoblarlo desde cero.


      El Isel nace aquí y desciende por el Iseltal, que empieza en Matrei en Osttirol, donde se juntan el
      Virgental y el Tauerntal, y llega hasta Lienz. El Iseltrail sigue ese río, el río glaciar libre más
      largo de los Alpes, entre praderas ribereñas, playas de arena, gargantas, rápidos y cascadas.
    wildlife: >-
      En el camino hasta los pastos, el bosque es de pícea y alerce. Más arriba, entre los 1.400 y los 2.700
      m, las [marmotas](/especie/marmota_marmota/) viven en familias en madrigueras de prados alpinos y
      pedreras. El [íbice](/especie/capra_ibex/) vive en cantiles y pedregales, con unos 1.100 ejemplares tras
      su reintroducción en los años sesenta. El [rebeco](/especie/rupicapra_rupicapra/), diurno, es el animal
      grande que se ve con más frecuencia. Los rangers conocen los lugares donde se ven
      [quebrantahuesos](/especie/gypaetus_barbatus/), [águilas reales](/especie/aquila_chrysaetos/), rebecos y
      marmotas.


      Entre las flores, la genciana bávara, de un azul oscuro profundo, y la genciana de primavera, que
      florece de marzo a agosto según la altitud. El edelweiss está totalmente protegido allí donde crezca. El
      sendero atraviesa también praderas alpinas y vegetación de humedales.


      La temporada de apertura del sendero va de primavera a otoño, y el verano es el momento de más agua,
      cuando se funde el hielo.
    visit: >-
      Desde el aparcamiento de Ströden, en Hinterbichl, el camino de grava lleva en media hora a pie a
      Pebellalm e Islitzeralm, y también se puede hacer en coche de caballos. Desde allí empieza el sendero
      del agua, con miradores y paneles: pasa junto a los saltos Kleinbachfall y Großbachfall y sigue aguas
      arriba hasta las Umbalfälle. Ida y vuelta son unos ocho kilómetros y unas tres horas, y es un recorrido
      fácil. Recibió en 2014 el sello austriaco de calidad de senderos.


      Para ir más lejos, el Iseltrail tiene cinco etapas, y desde la cuarta entra en la zona núcleo del
      parque, con gargantas profundas y la bruma de las cascadas. La cuarta etapa lleva a la Clarahütte,
      construida en la ladera por el riesgo de aludes y desprendimientos. La quinta sube un escalón empinado
      hasta los 2.500 m, donde está la lengua del glaciar Umbalkees frente a la Dreiherrnspitze. Las tres
      primeras etapas se pueden hacer desde mayo; todas, de junio a octubre.


      La casa del parque de Matrei prepara el viaje con una exposición interactiva sobre los hábitats del
      parque, con películas de 360 grados en seis salas de actividades, y un recorrido de vídeos que muestra
      el parque desde el punto de vista del águila real.
    history: >-
      Desde los años setenta hubo una fuerte oposición a los planes de una central hidroeléctrica en el valle
      de Umbal, y el sendero del agua se creó en 1976. La parte del Tirol Oriental fue la más discutida,
      porque los proyectos de centrales incluían las Umbalfälle y el valle de Kals, y no se unió al parque
      hasta 1991. En la noche del 17 al 18 de mayo de 1985, una avalancha provocó una crecida repentina que
      destruyó la mitad del sendero del agua.


      El parque se creó con un acuerdo: en 1971 los gobernadores de Salzburgo, Carintia y el Tirol firmaron en
      Heiligenblut su decisión de fundarlo. La UICN lo reconoció como categoría II en 2001 para Carintia y en
      2006 para Salzburgo y el Tirol.
    before: >-
      Los senderos están señalizados con carteles amarillos, y los de puntos negros exigen experiencia de
      montaña, equipo adecuado y pie seguro. Está prohibido acampar y hacer fuego en el campo; hay campings en
      los municipios del parque. Quédate en los caminos y senderos señalizados, por respeto a animales y
      plantas, y no hagas ruido innecesario. Desde Lienz o Mittersill se llega por la B108 hasta Matrei, y
      desde allí por el Virgental hasta Ströden.
    around: >-
      Pegado a este valle, dentro del mismo parque, está el [Grupo Ankogel - Altos
      Tauern](/lugar/ankogelgruppe---hohe-tauern/), y a unos cinco kilómetros está el [Grupo Schober - Altos
      Tauern](/lugar/schobergruppe---hohe-tauern/). A unos veintitrés kilómetros quedan las [Montañas de Rofan
      y Alpes de Brandenberg](/lugar/rofangebirge---brandenberger-alpen/). Más lejos, el [Parque Nacional de
      la Vanoise](/lugar/parc-national-de-la-vanoise/), el [Parque Nacional del Gran
      Paradiso](/lugar/parco-nazionale-gran-paradiso/) y el [Parque Natural de
      Karwendel](/lugar/naturpark-karwendel/) comparten íbice, águila real y rebeco en alta montaña.
  en:
    intro: >-
      In summer, as snow and ice thaw, meltwater from the Umbalkees glacier rushes down the Isel, plunging
      over jagged steps of rock. It is a glacial torrent in its purest state: its discharge fluctuates
      continuously through the day and across the seasons. The Umbal valley, at the head of the Virgental in
      East Tyrol, demonstrates as few places in the Hohe Tauern can how a river of ice and meltwater sculpts
      the landscape through cascades. It forms part of Hohe Tauern National Park, the grandest national park
      in the Alps, spanning 1,856 km².
    landscape: >-
      The Umbalfälle resemble a roaring staircase of water. Because the cascades drop steeply, they carry
      glacial sediment that has polished the bedrock over millennia, carving a deep gorge. The result is
      revealed in the riverbed: smooth green stones pockmarked with giant’s kettles hollowed out by swirling
      gravel. The waterfalls illustrate the physical transition from sliding rapids into a stepped cascade
      staircase, plunging from basin to basin.


      Beneath this landscape lies the Tauern Window, one of the Alpine realm’s greatest geological marvels:
      ancient rock layers that normally lie miles deep are thrust to the surface here, and the park preserves
      up to 200 distinct mineral varieties. Ice Age glaciers subsequently widened V-shaped valleys into vast
      U-shaped troughs, leaving cirques throughout the range. As glaciers retreat, newly exposed moraines
      create virgin pioneer land where plants and animals must colonise from scratch.


      The Isel is born here and rushes through the Iseltal, which begins in Matrei in Osttirol—where Virgental
      and Tauerntal unite—continuing down to Lienz. The Iseltrail tracks this corridor, the longest
      free-flowing glacial river in the Alps, passing riverside meadows, gravel banks, gorges, rapids, and
      waterfalls.
    wildlife: >-
      Ascending toward subalpine pastures, the forest consists of spruce and European larch. Higher up,
      between 1,400 and 2,700 m, [Alpine marmots](/especie/marmota_marmota/) live in family colonies in
      burrows dug across alpine meadows and boulder slopes. The [Alpine ibex](/especie/capra_ibex/) frequents
      crags and screes, numbering around 1,100 head following successful reintroductions in the sixties. The
      diurnal [chamois](/especie/rupicapra_rupicapra/) is the large mammal most frequently sighted on open
      slopes. Park rangers know the traditional territories where [bearded
      vultures](/especie/gypaetus_barbatus/), [golden eagles](/especie/aquila_chrysaetos/), chamois, and
      marmots can be spotted.


      Among the flora, deep dark-blue Bavarian gentian and spring gentian flower between March and August
      depending on elevation. The edelweiss is strictly protected wherever it grows. The trail also traverses
      high alpine turf and delicate wetland flushes.


      The hiking season along the trail spans from spring to autumn, with summer offering peak water flow when
      glacier ice melts fastest.
    visit: >-
      From the Ströden car park in Hinterbichl, a gravel path leads in half an hour on foot to Pebellalm and
      Islitzeralm, a journey also possible by horse carriage. There begins the water-themed educational trail,
      outfitted with viewing pulpits and explanatory panels: it passes the Kleinbachfall and Großbachfall
      before ascending toward the roaring Umbalfälle. Round trip covers around eight kilometres and roughly
      three hours, grading as an easy family hike. In 2014 it received the Austrian Trail Quality Seal.


      For longer journeys, the Iseltrail comprises five stages, penetrating the park’s wilderness core from
      stage four onward, surrounded by steep ravines and cascading spray. Stage four reaches the Clarahütte,
      perched on the slope out of avalanche paths. Stage five tackles a steep glacial step up to 2,500 m,
      where the snout of the Umbalkees glacier sits opposite the Dreiherrnspitze. The first three stages can
      be walked from May; the full trail from June to October.


      The Nationalparkhaus in Matrei prepares visitors through interactive habitat exhibitions, featuring
      360-degree films across six themed rooms and virtual fly-overs through the eyes of a golden eagle.
    history: >-
      From the seventies onward local resistance vigorously opposed plans for a hydroelectric reservoir in the
      Umbal valley, leading to the creation of the water trail in 1976. The East Tyrolean sector was bitterly
      contested because proposed dam schemes threatened the Umbalfälle and the Kals valley; it did not join
      the park until 1991. On the night of 17 to 18 May 1985, a massive avalanche triggered a flash flood that
      swept away half of the water educational trail.


      The national park originated through an inter-provincial pact: in 1971 the provincial governors of
      Salzburg, Carinthia, and Tyrol signed the Heiligenblut Declaration resolving to establish the park. The
      IUCN formally recognized it as a Category II national park in 2001 for Carinthia and in 2006 for
      Salzburg and Tyrol.
    before: >-
      Trails are waymarked with yellow signs, and paths marked with black dots demand alpine experience,
      proper mountaineering boots, and sure-footedness. Camping and open campfires in the wild are strictly
      forbidden; campsites operate in surrounding valley municipalities. Stick to marked tracks out of
      consideration for fragile alpine flora and wildlife, avoiding unnecessary noise. From Lienz or
      Mittersill, take the B108 to Matrei, and continue through the Virgental to Ströden.
    around: >-
      Adjoining this valley within the same national park lies the [Ankogel Group - Hohe
      Tauern](/lugar/ankogelgruppe---hohe-tauern/), and some five kilometres away rises the [Schober Group -
      Hohe Tauern](/lugar/schobergruppe---hohe-tauern/). About twenty-three kilometres distant lie the [Rofan
      Mountains and Brandenberg Alps](/lugar/rofangebirge---brandenberger-alpen/). Further afield, [Vanoise
      National Park](/lugar/parc-national-de-la-vanoise/), [Gran Paradiso National
      Park](/lugar/parco-nazionale-gran-paradiso/), and [Karwendel Nature Park](/lugar/naturpark-karwendel/)
      share high-mountain ibex, golden eagle, and chamois.
  fr:
    intro: >-
      En été, avec la fonte des neiges et des glaces, les eaux du glacier Umbalkees dévalent l’Isel et
      franchissent des gradins rocheux. C’est un torrent glaciaire dans son état originel : son débit fluctue
      tout au long de la journée et de l’année. La vallée d’Umbal, tout au fond du Virgental dans le Tyrol
      oriental, montre comme peu d’autres dans les Hohe Tauern comment une rivière de glace et d’eau vive
      modèle la roche à coups de cascades. Elle fait partie du Parc national des Hohe Tauern, le plus vaste
      des Alpes avec ses 1 856 km².
    landscape: >-
      Les Umbalfälle forment un véritable escalier d’eau. Parce que les cascades sont très abruptes, elles
      entraînent les sédiments glaciaires qui polissent la roche au fil des millénaires pour creuser une gorge
      étroite. Le résultat se lit dans le lit du torrent : des roches vertes lisses, creusées de marmites de
      géant façonnées par les tourbillons. Les cascades illustrent la transition entre une glissade d’eau vive
      et un escalier de chutes bondissant de vasque en vasque.


      En arrière-plan s’ouvre la fenêtre géologique des Tauern, l’une des curiosités majeures des Alpes : des
      couches enfouies à grande profondeur y affleurent à l’air libre, et le parc recèle jusqu’à 200 minéraux
      différents. Les glaciers de l’âge glaciaire ont ensuite élargi les vallées en V en de grandes auges en
      U, parsemant les crêtes de cirques. En se retirant, la glace a abandonné des moraines formant un paysage
      pionnier où la végétation doit tout recoloniser depuis le début.


      L’Isel prend sa source ici et dévale l’Iseltal, qui commence à Matrei in Osttirol—au confluent du
      Virgental et du Tauerntal—jusqu’à Lienz. L’Iseltrail suit ce cours d’eau, la plus longue rivière
      glaciaire à écoulement libre des Alpes, alternant ripisylves, grèves sableuses, gorges, rapides et
      cascades.
    wildlife: >-
      Sur le chemin menant aux alpages, la forêt mêle épicéa et mélèze d’Europe. Plus haut, entre 1 400 et 2
      700 m, les [marmottes des Alpes](/especie/marmota_marmota/) vivent en familles dans des terriers creusés
      dans les pelouses et pierriers. Le [bouquetin des Alpes](/especie/capra_ibex/) hante les parois et
      falaises, fort d’environ 1 100 têtes à la suite de sa réintroduction dans les années soixante. Le
      [chamois](/especie/rupicapra_rupicapra/), très actif de jour, est le grand mammifère le plus fréquemment
      observé. Les rangers connaissent les secteurs où l’on peut observer [gypaètes
      barbus](/especie/gypaetus_barbatus/), [aigles royaux](/especie/aquila_chrysaetos/), chamois et
      marmottes.


      Parmi les fleurs éclatent la gentiane de Bavière, d’un bleu sombre profond, et la gentiane printanière,
      qui fleurit de mars à août selon l’altitude. L’edelweiss bénéficie d’une protection intégrale partout où
      il pousse. Le sentier traverse aussi des pelouses alpines et des zones humides d’altitude.


      La période d’ouverture du sentier va du printemps à l’automne, l’été offrant les débits les plus
      spectaculaires lorsque la glace fond sous le soleil.
    visit: >-
      Depuis le parking de Ströden, à Hinterbichl, un chemin carrossable conduit en une demi-heure de marche à
      Pebellalm et Islitzeralm, trajet faisable aussi en calèche. De là commence le sentier pédagogique de
      l’eau, doté de passerelles panoramiques et de panneaux : il longe les chutes Kleinbachfall et
      Großbachfall avant de remonter vers les Umbalfälle. L’aller-retour fait huit kilomètres et environ trois
      heures, constituant une randonnée facile. Il a reçu en 2014 le label de qualité autrichien des sentiers
      de randonnée.


      Pour aller plus loin, l’Iseltrail propose cinq étapes et pénètre dès la quatrième dans la zone centrale
      du parc, au milieu de gorges sauvages et d’embruns. La quatrième étape monte au refuge Clarahütte, bâti
      sur le versant pour échapper aux avalanches. La cinquième franchit un gradin glaciaire raide jusqu’à 2
      500 m d’altitude, où gît le front de l’Umbalkees face à la Dreiherrnspitze. Les trois premières étapes
      se parcourent dès mai ; la totalité de juin à octobre.


      La maison du parc à Matrei prépare les visiteurs avec des expositions interactives, des projections à
      360 degrés dans six salles thématiques et un survol vidéo immersif à travers les yeux d’un aigle royal.
    history: >-
      Dès les années soixante-dix, une ferme opposition populaire fit échouer les projets de barrage
      hydroélectrique dans la vallée d’Umbal, conduisant à l’ouverture du sentier de l’eau en 1976. Le volet
      du Tyrol oriental fut le plus âprement discuté, car les projets de centrales menaçaient les Umbalfälle
      et la vallée de Kals, et ne rejoignit le parc qu’en 1991. Dans la nuit du 17 au 18 mai 1985, une énorme
      avalanche provoqua une onde de crue qui arracha la moitié du sentier de l’eau.


      Le parc est né d’un consensus : en 1971, les gouverneurs de Salzbourg, de Carinthie et du Tyrol
      signèrent à Heiligenblut la déclaration de fondation. L’UICN l’a reconnu en catégorie II en 2001 pour la
      Carinthie et en 2006 pour Salzbourg et le Tyrol.
    before: >-
      Les sentiers sont balisés par des panneaux jaunes, et ceux marqués d’un point noir exigent une
      expérience montagnarde, un équipement adapté et un pied sûr. Le bivouac et les feux sont strictement
      interdits en milieu naturel ; des campings existent dans les communes du parc. Restez sur les sentiers
      balisés par respect pour la faune et la flore et évitez le bruit inutile. Depuis Lienz ou Mittersill, on
      accède par la B108 jusqu’à Matrei, puis par le Virgental jusqu’à Ströden.
    around: >-
      Attenant à cette vallée, au sein du même parc, s’élève le [Massif d’Ankogel - Hohe
      Tauern](/lugar/ankogelgruppe---hohe-tauern/), et à environ cinq kilomètres se dresse le [Massif de
      Schober - Hohe Tauern](/lugar/schobergruppe---hohe-tauern/). À environ vingt-trois kilomètres s’étendent
      les [Monts du Rofan et Alpes de Brandenberg](/lugar/rofangebirge---brandenberger-alpen/). Plus loin, le
      [Parc national de la Vanoise](/lugar/parc-national-de-la-vanoise/), le [Parc national du
      Grand-Paradis](/lugar/parco-nazionale-gran-paradiso/) et le [Parc naturel du
      Karwendel](/lugar/naturpark-karwendel/) partagent bouquetin, aigle royal et chamois en haute montagne.
  de:
    intro: >-
      Im Sommer, zur Zeit der Schneeschmelze, schießt das Schmelzwasser des Umbalkeeses die Isel hinab und
      stürzt über Felsabstürze zu Tal. Es ist ein tosender Gletscherfluss in Reinform: Seine Wasserführung
      ändert sich im Tages- und Jahreslauf stetig. Das Umbaltal im hinteren Virgental in Osttirol
      veranschaulicht wie kaum ein anderes Hochtal der Hohen Tauern, wie fließendes Eis und stürzendes Wasser
      Gebirgslandschaften formen. Es ist Teil des Nationalparks Hohe Tauern, des größten Schutzgebietes der
      Alpen mit 1.856 km².
    landscape: >-
      Die Umbalfälle gleichen einer gigantischen Wassertreppe. Da die Gefällestufen extrem steil sind, reißt
      das Wasser Gletscherschliff mit sich, der den Fels über Jahrtausende aushöhlte und in eine enge Klamm
      zwang. Das Resultat zeigt sich im Flussbett: glatt geschliffene grüne Prasinite mit runden Auskolkungen,
      die Strudellöcher ins Gestein frästen. Die Wasserfälle zeigen den Übergang von einer Gleitkaskade zu
      einer stiebenden Treppe aus Becken und Wirbeln.


      Dahinter verbirgt sich das Tauernfenster, eine der geologischen Berühmtheiten der Alpen: Tief liegende
      Gesteinsschichten traten hier zutage, und der Park birgt bis zu 200 Mineralienarten. Die eiszeitlichen
      Gletscher weiteten ehemalige V-Täler zu weiten U-förmigen Trogtälern aus und hinterließen zahllose Kare.
      Mit dem Gletscherrückgang blieben Moränen als vegetationslose Urlandschaft zurück, die von Pflanzen und
      Tieren von Grund auf neu besiedelt werden muss.


      Die Isel entspringt hier und fließt durch das Iseltal, das in Matrei in Osttirol am Zusammenfluss von
      Virgental und Tauerntal beginnt und bis Lienz reicht. Der Iseltrail folgt diesem Gewässer, dem längsten
      freifließenden Gletscherfluss der Alpen, vorbei an Auwäldern, Sandbänken, Schluchten und Katarakten.
    wildlife: >-
      Auf dem Anstieg zu den Almweiden wächst Fichten- und Lärchenwald. Weiter oben, zwischen 1.400 und 2.700
      m, leben [Alpenmurmeltiere](/especie/marmota_marmota/) in Familienverbänden in Bauen auf Hochweiden und
      Schutthalden. Der [Alpensteinbock](/especie/capra_ibex/) bewohnt Felsgrate und Blockfluren und zählt
      nach seiner Wiederansiedlung in den sechziger Jahren rund 1.100 Exemplare. Die tagaktive
      [Gämse](/especie/rupicapra_rupicapra/) ist das am häufigsten beobachtete Großtier. Nationalpark-Ranger
      kennen die Reviere von [Bartgeiern](/especie/gypaetus_barbatus/),
      [Steinadlern](/especie/aquila_chrysaetos/), Gämsen und Murmeltieren.


      In der Flora leuchten der dunkelblaue Bayerische Enzian und der Frühlings-Enzian, der je nach Höhenlage
      von März bis August blüht. Das Edelweiß genießt strengen Vollschutz. Der Weg quert zudem alpine Urwiesen
      und Quellmoore.


      Die Begehungssaison reicht vom Frühjahr bis in den Herbst, wobei der Sommer zur Zeit der höchsten
      Schmelzwasserführung die eindrucksvollsten Wassermassen bietet.
    visit: >-
      Vom Parkplatz Ströden in Hinterbichl führt ein Schotterweg in einer halben Stunde zu Fuß zur Pebellalm
      und Islitzeralm, eine Strecke, die auch per Pferdekutsche zurückgelegt werden kann. Dort beginnt der
      Wasserschaupfad mit Aussichtskanzeln und Infotafeln: Er führt vorbei am Kleinbachfall und Großbachfall
      flussaufwärts zu den tosenden Umbalfällen. Hin- und Rückweg erfordern rund acht Kilometer und etwa drei
      Stunden Gehzeit bei leichter Schwierigkeit. 2014 wurde der Weg mit dem Österreichischen Wandergütesiegel
      ausgezeichnet.


      Ambitioniertere Wanderer wählen den Iseltrail: Er umfasst fünf Etappen und führt ab der vierten Etappe
      tief in die Kernzone des Parks mit wilden Schluchten und tosendem Wasser. Etappe vier führt zur
      Clarahütte, die lawinensicher am Hang erbaut wurde. Die fünfte Etappe überwindet eine Steilstufe bis auf
      2.500 m, wo das Gletschertor des Umbalkeeses vor der Dreiherrnspitze liegt. Die ersten drei Etappen sind
      ab Mai machbar; der gesamte Trail von Juni bis Oktober.


      Das Nationalparkhaus in Matrei stimmt mit interaktiven Erlebnisausstellungen auf den Besuch ein, bietet
      360-Grad-Filme in sechs Erlebnisräumen und vermittelt den Nationalpark aus der Flugperspektive des
      Steinadlers.
    history: >-
      Seit den siebziger Jahren formierte sich vehementer Widerstand gegen Pläne für ein monumentales
      Speicherkraftwerk im Umbaltal, woraus 1976 die Errichtung des Wasserschaupfades hervorging. Der
      Osttiroler Parkanteil war am heftigsten umstritten, da Kraftwerkspläne die Umbalfälle und das Dorfertal
      betrafen, und wurde erst 1991 Teil des Nationalparks. In der Nacht vom 17. auf den 18. Mai 1985 riss
      eine gewaltige Lawine mit anschließendem Flutstoß die Hälfte des Schaupfades weg.


      Der Park entstand durch einen politischen Konsens: 1971 unterzeichneten die Landeshauptleute von
      Salzburg, Kärnten und Tirol in Heiligenblut die Gründungsvereinbarung. Die IUCN erkannte den Park 2001
      für Kärnten sowie 2006 für Salzburg und Tirol als Kategorie-II-Schutzgebiet an.
    before: >-
      Die Wanderwege sind mit gelben Schildern markiert; Wege mit schwarzen Punkten verlangen alpine
      Erfahrung, geeignete Ausrüstung und absolute Trittsicherheit. Zelten und offenes Feuer im Freigelände
      sind verboten; Campingplätze stehen in den Talgemeinden bereit. Bleibe zum Schutz der alpinen Flora und
      Fauna auf den Wegen und vermeide Lärm. Von Lienz oder Mittersill erreichst du Matrei über die B108 und
      fährst durch das Virgental weiter nach Ströden.
    around: >-
      Direkt an dieses Tal schließt im selben Park die [Ankogelgruppe - Hohe
      Tauern](/lugar/ankogelgruppe---hohe-tauern/) an, und etwa fünf Kilometer entfernt ragt die
      [Schobergruppe - Hohe Tauern](/lugar/schobergruppe---hohe-tauern/) auf. Rund dreiundzwanzig Kilometer
      entfernt liegen das [Rofangebirge und Brandenberger Alpen](/lugar/rofangebirge---brandenberger-alpen/).
      Weiter entfernt teilen der [Nationalpark Vanoise](/lugar/parc-national-de-la-vanoise/), der
      [Nationalpark Gran Paradiso](/lugar/parco-nazionale-gran-paradiso/) und der [Naturpark
      Karwendel](/lugar/naturpark-karwendel/) Steinbock, Steinadler und Gämse im Hochgebirge.
  it:
    intro: >-
      In estate, con il disgelo delle nevi e dei ghiacci, l’acqua del ghiacciaio Umbalkees precipita lungo
      l’Isel attraverso salti di roccia. È un torrente glaciale allo stato più puro: la sua portata muta
      costantemente nell’arco delle ore e delle stagioni. La valle di Umbal, in fondo alla Virgental nel
      Tirolo Orientale, rivela come poche altre valli degli Alti Tauri in che modo un fiume d’acqua e ghiaccio
      scolpisca il territorio a suon di cascate. Fa parte del Parco Nazionale Alti Tauri, il più vasto
      dell’arco alpino con i suoi 1.856 km².
    landscape: >-
      Le Umbalfälle si presentano come una scalinata d’acqua. Essendo le cascate molto ripide, trascinano
      sedimenti glaciali che levigano la roccia nel corso dei millenni fino a scavare una forra profonda. Il
      risultato si svela nell’alveo: rocce verdi lisce, con conche rotonde che i mulinelli hanno scavato. Le
      cascate illustrano il passaggio da uno scivolo d’acqua a una gradonata spumeggiante che rimbalza da una
      pozza all’altra.


      Sullo sfondo si staglia la finestra tettonica dei Tauri, una delle maggiori peculiarità geologiche delle
      Alpi: strati antichissimi risalgono qui in superficie e il parco custodisce fino a 200 minerali diversi.
      I ghiacciai hanno poi trasformato le valli a V in ampie valli a U, lasciando circhi ovunque.
      Ritirandosi, i ghiacci hanno lasciato morene che formano un paesaggio primigenio: flora e fauna devono
      ricolonizzarlo partendo da zero.


      L’Isel nasce qui e discende lungo la Iseltal, che comincia a Matrei in Osttirol—alla confluenza tra
      Virgental e Tauerntal—fino a raggiungere Lienz. L’Iseltrail costeggia questo fiume, il più lungo
      torrente glaciale a corso libero delle Alpi, tra boschi golenali, sponde sabbiose, gole, rapide e
      cascate.
    wildlife: >-
      Lungo la salita verso i pascoli, il bosco è formato da abete rosso e larice. Più in alto, tra i 1.400 e
      i 2.700 m, le [marmotte delle Alpi](/especie/marmota_marmota/) vivono in gruppi familiari in tane
      scavate nei prati alpini e nelle pietraie. Lo [stambecco alpino](/especie/capra_ibex/) frequenta pareti
      e pietraie, con circa 1.100 esemplari a seguito della reintroduzione negli anni sessanta. Il
      [camoscio](/especie/rupicapra_rupicapra/), diurno, è il grande ungulato avvistato con maggiore
      regolarità. I guardaparco conoscono le zone dove si possono avvistare
      [gipeti](/especie/gypaetus_barbatus/), [aquile reali](/especie/aquila_chrysaetos/), camosci e marmotte.


      Tra i fiori spiccano la genziana di Baviera, di un blu profondo, e la genziana primaticcia, che fiorisce
      da marzo ad agosto a seconda della quota. La stella alpina è rigidamente protetta ovunque cresca. Il
      sentiero attraversa inoltre pascoli alpini e zone umide d’alta quota.


      La stagione ideale va dalla primavera all’autunno, con l’estate che regala le massime portate d’acqua
      quando i ghiacci fondono sotto il sole.
    visit: >-
      Dal parcheggio di Ströden a Hinterbichl, una strada sterrata conduce in mezz’ora di cammino a piedi a
      Pebellalm e Islitzeralm, percorso fattibile anche in carrozza a cavalli. Lì ha inizio il sentiero
      tematico dell’acqua, con terrazze panoramiche e pannelli didattici: oltrepassa le cascate Kleinbachfall
      e Großbachfall e risale verso le Umbalfälle. Andata e ritorno richiedono circa otto chilometri e tre ore
      di cammino, con un profilo agevole. Nel 2014 ha ottenuto il sigillo di qualità escursionistica
      austriaco.


      Per proseguire oltre, l’Iseltrail prevede cinque tappe e dalla quarta entra nella zona centrale del
      parco, tra gole scoscese e cascate roboanti. La quarta tappa sale al rifugio Clarahütte, posizionato sul
      pendio per evitare il rischio di slavine. La quinta supera un ripido gradino fino a quota 2.500 m, dove
      si trova la fronte del ghiacciaio Umbalkees al cospetto della Dreiherrnspitze. Le prime tre tappe sono
      percorribili da maggio; l’intero sentiero da giugno a ottobre.


      La casa del parco a Matrei accoglie i viaggiatori con esposizioni interattive sugli habitat, proiezioni
      a 360 gradi in sei sale multimediali e un volo virtuale che mostra il parco dalla prospettiva di
      un’aquila reale.
    history: >-
      Dagli anni settanta una forte opposizione popolare fermò i piani di costruzione di una diga
      idroelettrica nella valle di Umbal, portando all’apertura del sentiero didattico nel 1976. Il versante
      del Tirolo Orientale fu il più dibattuto, poiché i progetti idroelettrici minacciavano le Umbalfälle e
      la valle di Kals, e venne annesso al parco solo nel 1991. Nella notte tra il 17 e il 18 maggio 1985,
      un’enorme valanga causò una piena improvvisa che spazzò via metà del sentiero dell’acqua.


      Il parco nacque da una solida intesa: nel 1971 i presidenti dei Länder di Salisburgo, Carinzia e Tirolo
      firmarono a Heiligenblut la dichiarazione d’intenti per istituirlo. La IUCN lo ha riconosciuto come
      categoria II nel 2001 per la Carinzia e nel 2006 per Salisburgo e il Tirolo.
    before: >-
      I sentieri sono contraddistinti da cartelli gialli; quelli con pallino nero richiedono esperienza
      alpinistica, calzature adeguate e passo fermo. Il campeggio libero e l’accensione di fuochi sono
      vietati; campeggi attrezzati sono presenti nei paesi di fondovalle. Resta sui percorsi tracciati per
      salvaguardare la flora e la fauna e non produrre rumori molesti. Da Lienz o Mittersill si arriva tramite
      la B108 fino a Matrei, proseguendo poi lungo la Virgental fino a Ströden.
    around: >-
      Attiguo a questa valle, all’interno dello stesso parco, si estende il [Gruppo dell’Ankogel - Alti
      Tauri](/lugar/ankogelgruppe---hohe-tauern/) e a circa cinque chilometri sorge il [Gruppo dello Schober -
      Alti Tauri](/lugar/schobergruppe---hohe-tauern/). A circa ventitré chilometri si trovano le [Montagne
      del Rofan e Alpi di Brandenberg](/lugar/rofangebirge---brandenberger-alpen/). Più a distanza, il [Parco
      Nazionale della Vanoise](/lugar/parc-national-de-la-vanoise/), il [Parco Nazionale del Gran
      Paradiso](/lugar/parco-nazionale-gran-paradiso/) e il [Parco Naturale del
      Karwendel](/lugar/naturpark-karwendel/) condividono stambecco, aquila reale e camoscio in alta quota.
  pt:
    intro: >-
      No verão, com o degelo das neves e dos glaciares, as águas do glaciar Umbalkees precipitam-se pelo Isel
      através de degraus alcantilados de rocha. Trata-se de uma torrente glaciar em estado puro: o seu caudal
      varia continuamente ao longo do dia e das estações. O vale de Umbal, no termo do Virgental no Tirol
      Oriental, ilustra como poucos vales dos Hohe Tauern como um rio de gelo e água esculpe o relevo à força
      de cataratas. Integra o Parque Nacional Hohe Tauern, o mais vasto de todo o arco alpino, com 1.856 km².
    landscape: >-
      As Umbalfälle configuram uma autêntica escadaria de água. Sendo as quedas de água muito inclinadas,
      arrastam sedimentos glaciares que poliram a rocha ao longo de milénios, entalhando uma garganta
      escarpada. O resultado contempla-se no leito: rochas verdes macias com marmitas de gigante escavadas
      pelos turbilhões de água e cascalho. As cataratas revelam a transição entre rápidos deslizantes e uma
      escadaria de quedas saltando de poço em poço.


      Por detrás ergue-se a Janela dos Tauern, um dos fenómenos geológicos mais notáveis dos Alpes: camadas
      rochosas profundas afloram aqui à superfície, preservando o parque até 200 variedades minerais
      distintas. Os glaciares da Idade do Gelo alargaram antigos vales em V em amplas calhas em U, pontilhando
      as cumeadas de circos. Ao recuar, o gelo depositou moreias que constituem um ecossistema pioneiro onde a
      vegetação tem de recolonizar o substrato a partir do zero.


      O Isel nasce aqui e percorre o Iseltal, que principia em Matrei in Osttirol—onde confluem o Virgental e
      o Tauerntal—até alcançar Lienz. O Iseltrail acompanha este corredor, o mais extenso rio glaciar sem
      represamentos dos Alpes, entre matas ripícolas, bancos de areia, desfiladeiros, rápidos e cascatas.
    wildlife: >-
      Ao subir em direção às pastagens, a mata é composta por espruce e lariço. Mais acima, entre os 1.400 e
      os 2.700 m, as [marmotas](/especie/marmota_marmota/) habitam em colónias familiares em tocas escavadas
      nos prados alpinos e pedreiras. O [íbex](/especie/capra_ibex/) frequenta fragas e escarpas, contando com
      cerca de 1.100 exemplares após a reintrodução efetuada nos anos sessenta. A
      [camurça](/especie/rupicapra_rupicapra/), de hábitos diurnos, é o grande herbívoro avistado com maior
      regularidade. Os vigilantes conhecem os setores tradicionais onde se avistam
      [quebra-ossos](/especie/gypaetus_barbatus/), [águias-reais](/especie/aquila_chrysaetos/), camurças e
      marmotas.


      Na flora destacam-se a genciana-da-baviera, de um azul escuro profundo, e a genciana-da-primavera, que
      desabrocha de março a agosto consoante a altitude. O edelvaiss goza de proteção estrita onde quer que
      ocorra. O caminho transpõe igualmente relvados alpinos e turfeiras de montanha.


      A temporada de visitação estende-se da primavera ao outono, proporcionando o verão os caudais mais
      copiosos quando o gelo derrete com o calor.
    visit: >-
      A partir do parque de Ströden, em Hinterbichl, um caminho de terra batida conduz em meia hora a pé a
      Pebellalm e Islitzeralm, trajeto igualmente exequível em carruagem puxada por cavalos. Daí parte o
      trilho temático da água, dotado de miradouros suspensos e painéis explicativos: contorna as cascatas
      Kleinbachfall e Großbachfall antes de subir até às Umbalfälle. O percurso de ida e volta soma cerca de
      oito quilómetros e cerca de três horas, constituindo um passeio fácil. Em 2014 foi galardoado com o selo
      de qualidade austríaco para percursos pedestres.


      Para caminhadas de maior fôlego, o Iseltrail contempla cinco etapas, penetrando a partir da quarta na
      zona de proteção integral do parque, entre gargantas profundas e cortinas de borrifos. A quarta etapa
      sobe até à Clarahütte, edificada na encosta a salvo de avalanches. A quinta transpõe um degrau glaciar
      abrupto até aos 2.500 m, onde assenta a língua do glaciar Umbalkees diante da Dreiherrnspitze. As três
      primeiras etapas realizam-se a partir de maio; a totalidade, de junho a outubro.


      A sede do parque em Matrei acolhe os visitantes com exposições interativas, incluindo projeções a 360
      graus em seis salas temáticas e um sobrevoo virtual pelos olhos de uma águia-real.
    history: >-
      A partir dos anos setenta gerou-se forte oposição aos projetos de construção de uma barragem
      hidroelétrica no vale de Umbal, impulsionando a inauguração do trilho temático da água em 1976. O setor
      do Tirol Oriental foi o mais disputado, pois os empreendimentos pretendiam represar as Umbalfälle e o
      vale de Kals, vindo a integrar o parque apenas em 1991. Na noite de 17 para 18 de maio de 1985, uma
      colossal avalanche provocou uma torrente de cheia que destruiu metade do trilho da água.


      O parque fundou-se num acordo pioneiro: em 1971 os governadores de Salzburgo, Caríntia e Tirol assinaram
      em Heiligenblut a ata de criação. A UICN homologou-o como parque nacional de Categoria II em 2001 para a
      Caríntia e em 2006 para Salzburgo e o Tirol.
    before: >-
      Os trilhos encontram-se sinalizados com placas amarelas; os trajetos com ponto negro requerem
      experiência alpina, botas técnicas e passo seguro. É proibido acampar ou fazer fogueiras em terreno
      livre; existem parques de campismo nas povoações dos vales. Permanece nos caminhos oficiais em respeito
      pela fauna e flora, evitando ruídos desnecessários. A partir de Lienz ou Mittersill acede-se pela B108
      até Matrei, continuando depois pelo Virgental até Ströden.
    around: >-
      Contíguo a este vale, dentro do mesmo parque, estende-se o [Grupo de Ankogel - Hohe
      Tauern](/lugar/ankogelgruppe---hohe-tauern/) e a cerca de cinco quilómetros ergue-se o [Grupo de Schober
      - Hohe Tauern](/lugar/schobergruppe---hohe-tauern/). A cerca de vinte e três quilómetros situam-se os
      [Montes de Rofan e Alpes de Brandenberg](/lugar/rofangebirge---brandenberger-alpen/). Mais afastados, o
      [Parque Nacional da Vanoise](/lugar/parc-national-de-la-vanoise/), o [Parque Nacional do Gran
      Paradiso](/lugar/parco-nazionale-gran-paradiso/) e o [Parque Natural de
      Karwendel](/lugar/naturpark-karwendel/) partilham o íbex, a águia-real e a camurça em alta montanha.
