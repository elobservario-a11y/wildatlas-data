resumen:
  es: >-
    Considerada la ruta en piragua más hermosa de Europa, uniendo más de 20 lagos a través de un canal fluvial
    transparente.
  en: >-
    Considered Europe's most beautiful canoeing trail, connecting more than 20 lakes via a crystal-clear river
    corridor.
  fr: >-
    Considéré comme le plus beau parcours de canoë d'Europe, reliant plus de 20 lacs par un chenal fluvial
    transparent.
  de: Gilt als schönste Kanuroute Europas und verbindet über mehr als 20 Seen durch einen glasklaren Flusslauf.
  it: >-
    Ritenuto il più bell'itinerario in canoa d'Europa, che unisce più di 20 laghi lungo un limpido corridoio
    fluviale.
  pt: >-
    Considerada a mais bela rota de canoagem da Europa, ligando mais de 20 lagos através de um canal fluvial
    transparente.
unico:
  es: Un río de corriente mansa que se recorre en kayak de lago en lago, entre bosques y lagos distróficos.
  en: A gentle river navigated by kayak from lake to lake, through ancient woodland and dystrophic forest pools.
  fr: Une rivière au cours paisible qui se parcourt en kayak de lac en lac, entre forêts et étangs dystrophes.
  de: >-
    Ein Fluss mit sanfter Strömung, den man im Kajak von See zu See zwischen Wäldern und dystrophen Waldseen
    befährt.
  it: >-
    Un fiume dalla corrente placida che si naviga in kayak di lago in lago, tra foreste e specchi d'acqua
    distrofici.
  pt: Um rio de corrente mansa que se percorre em caiaque de lago em lago, entre bosques e lagoas distróficas.
observaciones:
  es: >-
    Todo el área es zona de silencio, y la acampada solo se permite en los lugares habilitados. En la ruta del
    Krutynia está prohibido recoger plantas y capturar animales fuera de los lugares designados. Los mejores
    meses van de mayo a octubre.
texto:
  es:
    intro: >-
      Una canoa, una corriente lenta y más de cien kilómetros de agua que serpentea entre bosques y lagos. El
      Krutynia es una de las rutas de piragua más bellas de Polonia y una de las más populares de Europa:
      empieza en Sorkwity, junto al lago Lampackie, y termina en Ruciane-Nida, junto al lago Nidzkie. La mitad
      del recorrido pasa por el Parque Paisajístico de Masuria.
    landscape: >-
      El río propiamente dicho mide veintiséis kilómetros, nace en el lago Krutyńskie y acaba en el
      Gardyńskie; el resto de la ruta son arroyos y brazos que enlazan lagos. La corriente es lenta y el cauce
      hace meandros cerrados: en algunos puntos tiene entre treinta y cuarenta metros de ancho y entre uno y
      medio y siete de hondo. El Krutynia acaba desaguando en el lago Bełdany, y su cuenca ocupa unos
      seiscientos cuarenta kilómetros cuadrados.


      Alrededor hay bosque, mucho. El parque incluye la parte norte del Bosque de Pisz, y en la cuenca del río
      hay más de veinte pequeños lagos distróficos escondidos entre los árboles. Es un paisaje glaciar, y el
      parque se creó en mil novecientos setenta y siete precisamente para conservarlo, junto con su fauna, su
      flora y sus valores culturales.


      El sendero de la reserva Zakręt, al oeste de Krutyń, enseña lo mejor de ese interior: un bosque
      pantanoso muy bien conservado con lagos distróficos en medio del arbolado. Y en la reserva Krutynia, el
      valle estrecho y las laderas escarpadas muestran lo que ha hecho el agua corriente con la tierra.
    wildlife: >-
      La mejor señal de que el agua está limpia está pegada a las piedras del cauce: el alga roja protegida
      *Hildenbrandia rivularis*. Mientras la buscas, un observador atento verá pasar el [martín pescador
      común](/especie/alcedo_atthis/) a ras del agua; en el río puedes ver también serretas grandes, [ánades
      reales](/especie/anas_platyrhynchos/) y cisnes vulgares. En el curso alto y en el arroyo Pierwos vive el
      [mirlo acuático](/especie/cinclus_cinclus/).


      Entre sus aves figuran el [águila pigargo](/especie/haliaeetus_albicilla/), la [cigüeña
      negra](/especie/ciconia_nigra/) y la [grulla](/especie/grus_grus/); entre los mamíferos, el
      [alce](/especie/alces_alces/), la [nutria europea](/especie/lutra_lutra/) y el [castor
      europeo](/especie/castor_fiber/). Hay también reliquias de otras épocas: un crustáceo que es resto
      glaciar en el lago Bełdany, esponjas raras en ese lago y en el Krutynia, y la tortuga de estanque,
      animal de época preglaciar.


      La temporada va de mayo a octubre. En primavera el bosque caducifolio del sendero de la reserva luce su
      mejor cara, cuando brotan las primeras geófitas. En julio y agosto el tramo de Krutyń se llena; mayo y
      septiembre son los meses tranquilos.
    visit: >-
      La ruta del parque mide 64,8 kilómetros y va de Spychowo a Ruciane-Nida por Zgon, Krutyń, Krutyński
      Piecek, Rosocha, Wojnowo, Ukta, Nowy Most, Iznota y Kamień. Cuenta con dos a cuatro días. Hay que cargar
      la piragua en dos puntos y usar una esclusa; en los tramos fluviales hay que vigilar las rocas y los
      bajos, y en los lagos, las olas de los días de viento.


      Las paradas son una buena razón para ir despacio. En Spychowo hay un Centro Forestal de Educación
      Ecológica con un Museo Forestal. En Cierzpięty, un mirador panorámico. En Krutyń, el Centro de Educación
      Natural y Cultural con la Sala de Ciencias Naturales y el centro de rehabilitación temporal de cigüeñas.
      En Wojnowo, un monasterio de viejos creyentes.


      Si quieres caminar, el sendero natural de la Reserva Krutynia mide dos kilómetros y cuatrocientos
      metros, sigue la ribera hasta donde el río entra en el lago Krutyńskie y está marcado con un cuadrado
      blanco con una franja azul. Termina en un aparcamiento a dos kilómetros y medio de Krutyń, y para volver
      al pueblo toca andar por una carretera asfaltada sin acera. El de Zakręt, de tres kilómetros y
      seiscientos metros, sale de Krutyń por una vieja avenida de sicomoros y tilos y es un camino de tierra
      con terreno irregular y raíces. Lleva a «Una pareja enamorada», el monumento natural más famoso del
      parque, donde las ramas de un roble rodean un tronco de pino como si lo abrazaran, aunque en realidad
      buscan la luz del camino; y al Roble Colmena de Masuria, con una colmena y restos de la escalera de los
      apicultores.
    history: >-
      Esas avenidas de árboles son típicas de Masuria: se plantaron para dar sombra a quien viajaba a pie o en
      carro. La apicultura fue en otro tiempo un oficio muy valorado, y los apicultores se asociaban en
      hermandades y gremios. Y al final del sendero de la reserva quedan las ruinas de un viejo puente de
      madera, de donde salían antes excursiones en barca empujadas con pértigas hasta Krutyń.
    before: >-
      Todo el área es zona de silencio, y la acampada solo se permite en los lugares habilitados. En la ruta
      del Krutynia está prohibido recoger plantas y capturar animales fuera de los lugares designados. Los
      mejores meses van de mayo a octubre.
    around: >-
      A cinco kilómetros queda el [Bosque de Pisz - Masuria](/lugar/puszcza-piska-lesny-kompleks-promocyjny/),
      del que el parque incluye la parte norte.
  en:
    intro: >-
      A canoe, a tranquil current and more than one hundred kilometres of water meandering between forests and
      lakes. The Krutynia is one of Poland's most scenic canoe routes and among the most celebrated in Europe:
      it begins in Sorkwity beside Lake Lampackie and terminates in Ruciane-Nida beside Lake Nidzkie. Half the
      journey threads through the Masurian Landscape Park.
    landscape: >-
      The river proper spans twenty-six kilometres, rising in Lake Krutyńskie and concluding at Lake
      Gardyńskie; the remainder of the itinerary consists of linking streams and lake chains. The current is
      gentle and the channel describes tight meanders: in places it measures between thirty and forty metres
      wide and between one and a half and seven metres deep. The Krutynia ultimately discharges into Lake
      Bełdany, draining a basin of some six hundred and forty square kilometres.


      Dense woodland wraps the waters. The park encompasses the northern reaches of the Pisz Forest, and the
      river basin shelters more than twenty small dystrophic woodland lakes hidden among the trees. It is a
      classic postglacial landscape, and the park was established in nineteen seventy-seven precisely to
      safeguard it, alongside its flora, fauna and cultural traditions.


      The trail in the Zakręt reserve, west of Krutyń, showcases the very best of this backcountry:
      exceptionally preserved boggy forest enclosing dystrophic lakes amid the timber. In the Krutynia
      reserve, the narrow valley and steep wooded bluffs demonstrate the sculpting power of running water on
      glacial deposits.
    wildlife: >-
      The clearest sign of pure water clings to rocks in the riverbed: the protected red alga *Hildenbrandia
      rivularis*. While watching for it, an attentive paddler will spot a [common
      kingfisher](/especie/alcedo_atthis/) skimming low over the surface; goosanders,
      [mallards](/especie/anas_platyrhynchos/) and mute swans also frequent the river. Along the upper reaches
      and the Pierwos brook lives the [white-throated dipper](/especie/cinclus_cinclus/).


      Notable birds include [white-tailed eagle](/especie/haliaeetus_albicilla/), [black
      stork](/especie/ciconia_nigra/) and [common crane](/especie/grus_grus/); resident mammals feature
      [moose](/especie/alces_alces/), [Eurasian otter](/especie/lutra_lutra/) and [Eurasian
      beaver](/especie/castor_fiber/). Living relics of earlier epochs also endure: a glacial-relict
      crustacean in Lake Bełdany, rare freshwater sponges in that lake and the Krutynia itself, and the
      European pond turtle, an animal dating from preglacial times.


      The canoeing season runs from May to October. In spring the deciduous woods of the reserve trail are at
      their finest when early geophytes carpet the ground. July and August bring heavy paddling traffic
      through the Krutyń reach; May and September offer tranquil conditions.
    visit: >-
      The water route through the park measures 64.8 kilometres, running from Spychowo to Ruciane-Nida via
      Zgon, Krutyń, Krutyński Piecek, Rosocha, Wojnowo, Ukta, Nowy Most, Iznota and Kamień. Allow two to four
      days. You must portage the canoe at two points and negotiate a lock; watch for rocks and shallows in
      river reaches, and beware of wind-whipped chop on open lake crossings.


      Pleasant stops provide good reasons to slow down. In Spychowo there is a Forest Ecological Education
      Centre with a Forestry Museum. In Cierzpięty, a scenic viewpoint. In Krutyń, the Nature and Culture
      Education Centre with its Natural Science Museum and a seasonal stork rehabilitation centre. In Wojnowo,
      an Old Believers' monastery.


      For walkers, the Krutynia Nature Reserve trail covers two kilometres and four hundred metres, following
      the riverbank to where the water flows into Lake Krutyńskie, marked with a white square and a blue
      stripe. It ends at a car park two and a half kilometres from Krutyń, requiring a walk back on a paved
      road without footpaths. The Zakręt trail, measuring three kilometres and six hundred metres, departs
      Krutyń along an old sycamore and lime avenue, following an uneven dirt path over tree roots. It leads to
      «A Couple in Love», the park's most celebrated botanical monument where an oak's branches embrace a pine
      trunk, and to the Masurian Bee Oak, complete with an old hive hollow and beekeepers' climbing peg
      remnants.
    history: >-
      These avenues of roadside trees are hallmarks of Masuria: they were planted to provide shade for
      travellers journeying on foot or by horse-drawn cart. Tree-beekeeping was once an esteemed rural craft,
      with beekeepers organized into formal guilds and brotherhoods. At the end of the reserve trail stand the
      remnants of an old timber bridge, from which punting boat excursions once departed downriver to Krutyń.
    before: >-
      The entire area is a designated silence zone, and camping is strictly confined to official campsites.
      Along the Krutynia water trail, picking plants and disturbing animals outside permitted zones is
      prohibited. The best months run from May to October.
    around: >-
      Five kilometres away lies the [Pisz Forest - Masuria](/lugar/puszcza-piska-lesny-kompleks-promocyjny/),
      of which the park encompasses the northern sector.
  fr:
    intro: >-
      Un canoë, un courant paisible et plus de cent kilomètres d'eau serpentant entre forêts et lacs. La
      Krutynia est l'une des voies nautiques les plus splendides de Pologne et l'une des plus renommées
      d'Europe : elle commence à Sorkwity au bord du lac Lampackie et s'achève à Ruciane-Nida au bord du lac
      Nidzkie. La moitié du trajet traverse le parc paysager de Mazurie.
    landscape: >-
      La rivière proprement dite mesure vingt-six kilomètres, naissant au lac Krutyńskie pour déboucher dans
      le Gardyńskie ; le reste du parcours est un réseau de ruisseaux reliant une guirlande de lacs. Le
      courant est lent et le lit décrit des méandres serrés : par endroits il mesure entre trente et quarante
      mètres de large et entre un mètre et demi et sept mètres de profondeur. La Krutynia termine sa course
      dans le lac Bełdany, drainant un bassin versant d'environ six cent quarante kilomètres carrés.


      Tout autour s'étend la forêt. Le parc englobe la frange nord de la forêt de Pisz, et le bassin fluvial
      dissimule plus de vingt petits lacs dystrophes sous le couvert des arbres. C'est un paysage
      postglaciaire remarquable, et le parc a été fondé en mil neuf cent soixante-dix-sept pour le protéger
      avec sa flore, sa faune et ses richesses culturelles.


      Le sentier de la réserve de Zakręt, à l'ouest de Krutyń, révèle le meilleur de cette nature intérieure :
      une tourbière forestière admirablement préservée sertie de miroirs d'eau dystrophes. Dans la réserve de
      la Krutynia, la vallée resserrée et les versants boisés témoignent de l'œuvre érosive des eaux vives.
    wildlife: >-
      La meilleure preuve de la pureté des eaux est fixée aux galets du lit : l'algue rouge protégée
      *Hildenbrandia rivularis*. Tout en la guettant, l'observateur attentif verra fuser un [martin-pêcheur
      d'Europe](/especie/alcedo_atthis/) au ras de l'onde ; on y observe aussi le harle bièvre, des [canards
      colverts](/especie/anas_platyrhynchos/) et des cygnes tuberculés. Sur le cours supérieur et le ruisseau
      Pierwos vit le [cincle plongeur](/especie/cinclus_cinclus/).


      L'avifaune compte aussi le [pygargue à queue blanche](/especie/haliaeetus_albicilla/), la [cigogne
      noire](/especie/ciconia_nigra/) et la [grue cendrée](/especie/grus_grus/) ; parmi les mammifères,
      l'[élan](/especie/alces_alces/), la [loutre d'Europe](/especie/lutra_lutra/) et le [castor
      d'Europe](/especie/castor_fiber/). Des reliques du passé y subsistent : un crustacé relique glaciaire
      dans le lac Bełdany, des éponges d'eau douce rares et la cistude d'Europe, reptile d'origine
      préglaciaire.


      La saison va de mai à octobre. Au printemps, la forêt feuillue du sentier de la réserve offre son plus
      beau visage lors de la floraison des géophytes. En juillet et août, le tronçon de Krutyń est très
      fréquenté ; mai et septembre garantissent le calme.
    visit: >-
      Le parcours nautique du parc mesure 64,8 kilomètres et relie Spychowo à Ruciane-Nida via Zgon, Krutyń,
      Krutyński Piecek, Rosocha, Wojnowo, Ukta, Nowy Most, Iznota et Kamień. Comptez deux à quatre jours. Il
      faut porter le canoë en deux points et franchir une écluse ; en rivière, surveillez les hauts-fonds et
      cailloux, et sur les lacs, les vagues par temps venteux.


      Les étapes invitent à la flânerie. À Spychowo se trouve un centre d'éducation forestière avec son musée.
      À Cierzpięty, un point de vue panoramique. À Krutyń, le centre d'éducation naturelle et culturelle avec
      sa salle d'histoire naturelle et son refuge temporaire pour cigognes. À Wojnowo, un couvent de
      vieux-croyants.


      À pied, le sentier de la réserve de la Krutynia mesure deux kilomètres et quatre cents mètres, longeant
      la rive jusqu'à l'embouchure dans le lac Krutyńskie, balisé d'un carré blanc à bande bleue. Il finit à
      un parking à deux kilomètres et demi de Krutyń ; le retour au village s'effectue par la route goudronnée
      sans trottoir. Le sentier de Zakręt, long de trois kilomètres et six cents mètres, quitte Krutyń par une
      allée ancienne d'érables et de tilleuls sur un sol bosselé de racines. Il mène aux « Amoureux », célèbre
      chêne dont les branches enlacent un pin, et au Chêne-ruche de Mazurie, portant une ruche traditionnelle
      creusée dans le tronc.
    history: >-
      Ces allées arborées sont caractéristiques de Mazurie : elles ont été plantées pour procurer de l'ombre
      aux voyageurs à pied ou en chariot. L'apiculture forestière traditionnelle était autrefois un métier
      très respecté, régi par des confréries. Au bout du sentier de la réserve subsistent les piliers d'un
      vieux pont de bois d'où partaient jadis les barques menées à la perche vers Krutyń.
    before: >-
      Tout le secteur est une zone de silence, et le bivouac n'est permis que sur les aires prévues. Sur le
      cours de la Krutynia, la cueillette et le dérangement de la faune sont interdits hors des lieux
      autorisés. Les mois les plus favorables vont de mai à octobre.
    around: >-
      À cinq kilomètres se trouve la [forêt de Pisz -
      Mazurie](/lugar/puszcza-piska-lesny-kompleks-promocyjny/), dont le parc comprend la partie nord.
  de:
    intro: >-
      Ein Kanu, eine gemächliche Strömung und mehr als einhundert Kilometer Wasser, das sich zwischen Wäldern
      und Seen hindurchschlängelt. Die Krutynia ist eine der reizvollsten Kanurouten Polens und eine der
      berühmtesten Europas: Sie beginnt in Sorkwity am Lampackie-See und endet in Ruciane-Nida am Nidzkie-See.
      Die Hälfte der Strecke führt durch den Masurischen Landschaftspark.
    landscape: >-
      Der eigentliche Fluss misst sechsundzwanzig Kilometer, entspringt im Krutyńskie-See und mündet in den
      Gardyńskie-See; der Rest der Route besteht aus Verbindungsbächen und Seeketten. Die Strömung ist ruhig
      und das Flussbett windet sich in engen Mäandern: stellenweise ist es zwischen dreißig und vierzig Meter
      breit und zwischen anderthalb und sieben Meter tief. Die Krutynia entwässert schließlich in den
      Bełdany-See und umfasst ein Einzugsgebiet von rund sechshundertvierzig Quadratkilometern.


      Ringsum erstreckt sich dichter Wald. Der Park schließt den Nordteil der Johannisburger Heide ein, und im
      Flussbecken verbergen sich mehr als zwanzig kleine dystrophe Waldseen zwischen den Bäumen. Es ist eine
      nacheiszeitliche Moränenlandschaft, und der Park wurde neunzehnhundertsiebenundsiebzig ins Leben
      gerufen, um sie mitsamt Flora, Fauna und Kulturgütern zu bewahren.


      Der Wanderweg im Reservat Zakręt westlich von Krutyń zeigt die schönsten Seiten dieses Hinterlandes:
      urwüchsigen Moorwald mit dystrophen Kesselgewässern. Im Krutynia-Reservat führen das enge Tal und die
      steilen Uferhänge vor Augen, wie das fließende Wasser das Gelände geformt hat.
    wildlife: >-
      Das verlässlichste Zeugnis für sauberes Wasser haftet an den Kieselsteinen im Flussbett: die geschützte
      Rotalge *Hildenbrandia rivularis*. Während man nach ihr Ausschau hält, zieht ein
      [Eisvogel](/especie/alcedo_atthis/) dicht über der Wasseroberfläche vorbei; auch Gänsesäger,
      [Stockenten](/especie/anas_platyrhynchos/) und Höckerschwäne beleben den Fluss. Am Oberlauf und am
      Pierwos-Bach lebt die [Wasseramsel](/especie/cinclus_cinclus/).


      Unter den Vögeln finden sich [Seeadler](/especie/haliaeetus_albicilla/),
      [Schwarzstorch](/especie/ciconia_nigra/) und [Kranich](/especie/grus_grus/); bei den Säugetieren kommen
      [Elch](/especie/alces_alces/), [Eurasischer Fischotter](/especie/lutra_lutra/) und [Europäischer
      Biber](/especie/castor_fiber/) vor. Auch Relikte früherer Epochen haben überdauert: ein eiszeitliches
      Krebstier im Bełdany-See, seltene Süßwasserschwämme und die Europäische Sumpfschildkröte aus
      vorzeitlichen Epochen.


      Die Paddelsaison reicht von Mai bis Oktober. Im Frühjahr zeigt sich der Laubwald am Reservatspfad von
      seiner besten Seite, wenn die Frühblüher erwachen. Im Juli und August herrscht auf dem Abschnitt bei
      Krutyń reger Betrieb; Mai und September bieten ruhige Stunden.
    visit: >-
      Die Wasserwanderroute im Park misst 64,8 Kilometer und verläuft von Spychowo nach Ruciane-Nida über
      Zgon, Krutyń, Krutyński Piecek, Rosocha, Wojnowo, Ukta, Nowy Most, Iznota und Kamień. Plane zwei bis
      vier Tage ein. An zwei Stellen muss das Boot umgetragen und eine Schleuse passiert werden; im Flussbett
      ist auf Steine und Flachwasser zu achten, auf den Seen auf Wellengang bei Wind.


      Zwischenstopps lohnen sich. In Spychowo gibt es ein forstliches Bildungszentrum mit Forstmuseum. In
      Cierzpięty einen Aussichtspunkt. In Krutyń das Natur- und Kulturzentrum mit Naturkundesaal und
      Storchenstation. In Wojnowo ein altorthodoxes Kloster.


      Wer zu Fuß unterwegs sein möchte: Der Naturpfad im Krutynia-Reservat ist zwei Kilometer und vierhundert
      Meter lang, folgt dem Ufer bis zur Mündung in den Krutyńskie-See und ist mit weißem Quadrat und blauem
      Streifen markiert. Er endet an einem Parkplatz zweieinhalb Kilometer von Krutyń; der Rückweg erfolgt auf
      der Straße ohne Gehweg. Der Zakręt-Pfad, drei Kilometer und sechshundert Meter lang, beginnt an einer
      alten Ahorn-Linden-Allee auf unebenem Pfad mit Baumwurzeln. Er führt zum Naturdenkmal «Verliebtes Paar»
      aus umschlungenem Eichen- und Kiefernstamm und zur Masurischen Beuteneiche mit den Trittsprossen
      historischer Zeidler.
    history: >-
      Solche Baumalleen sind typisch für Masuren: Sie wurden gepflanzt, um Fußgängern und Fuhrwerken Schatten
      zu spenden. Die Waldbienenzucht war einst ein hochangesehenes Gewerbe mit eigenen Zünften und
      Bruderschaften. Am Ende des Reservatspfades ragen Pfeiler einer alten Holzbrücke auf, an der früher
      Stocherkahnfahrten nach Krutyń begannen.
    before: >-
      Das gesamte Gebiet ist Ruhezone; Campen ist nur an ausgewiesenen Plätzen erlaubt. Auf der Krutynia-Route
      ist das Sammeln von Pflanzen und das Stören von Tieren außerhalb genehmigter Zonen untersagt. Die
      günstigsten Monate sind Mai bis Oktober.
    around: >-
      Fünf Kilometer entfernt liegt die [Johannisburger Heide -
      Masuren](/lugar/puszcza-piska-lesny-kompleks-promocyjny/), deren Nordteil der Park umfasst.
  it:
    intro: >-
      Una canoa, una corrente tranquilla e più di cento chilometri d'acqua che serpeggia tra boschi e laghi.
      Il Krutynia è una delle vie d'acqua più affascinanti della Polonia e tra le più celebrate d'Europa:
      comincia a Sorkwity accanto al lago Lampackie e termina a Ruciane-Nida presso il lago Nidzkie. Metà del
      percorso si snoda all'interno del Parco paesaggistico della Masuria.
    landscape: >-
      Il fiume vero e proprio misura ventisei chilometri, nasce dal lago Krutyńskie e sfocia nel Gardyńskie;
      il resto dell'itinerario è formato da ruscelli che collegano una teoria di laghi. La corrente è lenta e
      l'alveo forma meandri stretti: in certi punti è largo tra trenta e quaranta metri e profondo tra un
      metro e mezzo e sette metri. Il Krutynia termina la sua corsa nel lago Bełdany, con un bacino
      idrografico di circa seicentoquaranta chilometri quadrati.


      Tutt'intorno si stende la foresta. Il parco include il settore settentrionale della Foresta di Pisz, e
      nel bacino fluviale si celano più di venti piccoli laghetti distrofici tra gli alberi. È un paesaggio
      postglaciale di grande suggestione, e il parco fu istituito nel millenovecentosettantasette proprio per
      tutelarlo insieme a flora, fauna e valori storici.


      Il sentiero della riserva Zakręt, a ovest di Krutyń, mostra il meglio di questo entroterra: un bosco
      palustre intatto punteggiato di laghetti distrofici. Nella riserva Krutynia, la valle stretta e i pendii
      scoscesi illustrano la forza modellatrice delle acque correnti.
    wildlife: >-
      Il segnale più evidente della purezza dell'acqua è attaccato ai ciottoli dell'alveo: l'alga rossa
      protetta *Hildenbrandia rivularis*. Mentre la si cerca con lo sguardo, un attento osservatore vedrà
      sfrecciare il [martin pescatore](/especie/alcedo_atthis/) a filo d'acqua; lungo il fiume si scorgono
      anche smerghi maggiori, [germani reali](/especie/anas_platyrhynchos/) e cigni reali. Nel corso superiore
      e lungo il ruscello Pierwos vive il [merlo acquaiolo](/especie/cinclus_cinclus/).


      Tra i volatili figurano l'[aquila di mare](/especie/haliaeetus_albicilla/), la [cicogna
      nera](/especie/ciconia_nigra/) e la [gru](/especie/grus_grus/); tra i mammiferi, l'[*Alces
      alces*](/especie/alces_alces/), la [lontra europea](/especie/lutra_lutra/) e il [*Castor
      fiber*](/especie/castor_fiber/). Sopravvivono anche relitti biologici: un crostaceo relitto glaciale nel
      lago Bełdany, rare spugne d'acqua dolce e la testuggine palustre europea, testimonianza di epoche
      preglaciali.


      La stagione va da maggio a ottobre. In primavera la foresta decidua lungo il sentiero della riserva
      mostra la sua veste migliore con la fioritura delle geofite. A luglio e agosto il tratto di Krutyń
      registra grande affluenza; maggio e settembre offrono quiete assoluta.
    visit: >-
      Il percorso acquatico del parco misura 64,8 chilometri e unisce Spychowo a Ruciane-Nida toccando Zgon,
      Krutyń, Krutyński Piecek, Rosocha, Wojnowo, Ukta, Nowy Most, Iznota e Kamień. Prevedi da due a quattro
      giorni. La canoa va trasbordata a piedi in due punti ed è presente una chiusa; lungo il fiume occorre
      fare attenzione a sassi e bassifondi, e sui laghi alle onde nelle giornate ventose.


      Le soste invitano a prendersi tempo. A Spychowo sorge un centro forestale di educazione ecologica con
      museo. A Cierzpięty, un belvedere panoramico. A Krutyń, il centro di educazione naturalistica con sala
      museale e centro di recupero cicogne. A Wojnowo, un convento di vecchi credenti.


      A piedi, il sentiero della Riserva Krutynia misura due chilometri e quattrocento metri, costeggia la
      riva fino all'immissione nel lago Krutyńskie ed è segnato da un quadrato bianco con banda blu. Termina a
      un parcheggio a due chilometri e mezzo da Krutyń; il rientro avviene su strada asfaltata priva di
      marciapiede. Il sentiero Zakręt, di tre chilometri e seicento metri, parte da Krutyń lungo un viale di
      aceri e tigli su fondo sterrato con radici affioranti. Conduce agli «Innamorati», celebre monumento
      naturale in cui i rami di una quercia abbracciano un pino, e alla Quercia-Arnia della Masuria con i
      pioli usati dagli antichi apicoltori.
    history: >-
      Questi viali alberati sono caratteristici della Masuria: vennero piantati per dare ombra a chi viaggiava
      a piedi o in carrozza. L'apicoltura forestale era un tempo un mestiere tenuto in altissima
      considerazione con confraternite dedicate. Al termine del sentiero della riserva restano i piloni di un
      vecchio ponte di legno da cui salpavano barche a pertica dirette a Krutyń.
    before: >-
      L'intera area è zona di silenzio, e il campeggio è consentito unicamente nei luoghi autorizzati. Lungo
      la rotta della Krutynia è vietato raccogliere piante o disturbare gli animali fuori dalle aree
      designate. I mesi ideali vanno da maggio a ottobre.
    around: >-
      A cinque chilometri si trova la [Foresta di Pisz -
      Masuria](/lugar/puszcza-piska-lesny-kompleks-promocyjny/), di cui il parco comprende il settore
      settentrionale.
  pt:
    intro: >-
      Uma canoa, uma corrente plácida e mais de cem quilómetros de água a serpentear entre bosques e lagos. O
      Krutynia é uma das rotas de canoagem mais belas da Polónia e uma das mais reputadas da Europa: começa em
      Sorkwity junto ao lago Lampackie e termina em Ruciane-Nida junto ao lago Nidzkie. Metade do percurso
      cruza o Parque Paisagístico da Masúria.
    landscape: >-
      O rio propriamente dito mede vinte e seis quilómetros, nasce no lago Krutyńskie e desagua no Gardyńskie;
      o restante trajeto é formado por ribeiros e braços que ligam lagoas. A corrente é lenta e o leito
      desenha meandros apertados: em certos pontos tem entre trinta e quarenta metros de largura e entre um
      metro e meio e sete de profundidade. O Krutynia acaba por desaguar no lago Bełdany, com uma bacia
      hidrográfica de cerca de seiscentos e quarenta quilómetros quadrados.


      Em redor ergue-se floresta densa. O parque abrange o setor norte da Floresta de Pisz, e a bacia do rio
      abriga mais de vinte pequenas lagoas distróficas escondidas entre as árvores. É uma paisagem pós-glaciar
      de grande beleza, e o parque foi criado em mil novecentos e setenta e sete para a proteger com a sua
      fauna, flora e valores culturais.


      O trilho da reserva Zakręt, a oeste de Krutyń, mostra o melhor deste interior: um bosque pantanoso
      exemplarmente preservado com lagoas distróficas em plena mata. Na reserva Krutynia, o vale apertado e as
      vertentes escarpadas mostram a força erosiva da água corrente.
    wildlife: >-
      O melhor sinal da pureza da água está fixado nos seixos do leito: a alga vermelha protegida
      *Hildenbrandia rivularis*. Enquanto a procuras, o observador atento verá passar o
      [guarda-rios-comum](/especie/alcedo_atthis/) rente à tona da água; no rio avistam-se também
      mergulhões-grandes, [patos-reais](/especie/anas_platyrhynchos/) e cisnes-vulgares. No curso superior e
      no ribeiro Pierwos habita o [melro-d'água](/especie/cinclus_cinclus/).


      Entre as aves destacam-se a [águia-rabalva](/especie/haliaeetus_albicilla/), a
      [cegonha-preta](/especie/ciconia_nigra/) e o [grou-comum](/especie/grus_grus/); nos mamíferos, o
      [alce](/especie/alces_alces/), a [lontra-europeia](/especie/lutra_lutra/) e o
      [castor-europeu](/especie/castor_fiber/). Subsistem também relíquias do passado: um crustáceo relíquia
      glaciar no lago Bełdany, esponjas raras e o cágado-de-carapaça-estriada, réptil de época pré-glaciar.


      A época decorre de maio a outubro. Na primavera a floresta caducifólia do trilho da reserva atinge o
      auge na floração das primeiras geófitas. Em julho e agosto o troço de Krutyń enche-se; maio e setembro
      são os meses serenos.
    visit: >-
      A rota náutica do parque mede 64,8 quilómetros e vai de Spychowo a Ruciane-Nida por Zgon, Krutyń,
      Krutyński Piecek, Rosocha, Wojnowo, Ukta, Nowy Most, Iznota e Kamień. Reserva dois a quatro dias. É
      necessário carregar a canoa em dois pontos e passar uma eclusa; nas zonas fluviais vigia pedras e
      baixios, e nos lagos as ondas em dias de vento.


      As paragens convidam a abrandar. Em Spychowo há um Centro de Educação Florestal com museu. Em
      Cierzpięty, um miradouro panorâmico. Em Krutyń, o Centro de Educação Natural e Cultural com museu e
      centro de recuperação de cegonhas. Em Wojnowo, um mosteiro de velhos crentes.


      A pé, o trilho natural da Reserva Krutynia mede dois quilómetros e quatrocentos metros, segue a margem
      até à entrada no lago Krutyńskie com marcação de quadrado branco e faixa azul. Termina num parque a dois
      quilómetros e meio de Krutyń; o regresso à aldeia faz-se por estrada asfaltada sem passeio. O trilho de
      Zakręt, de três quilómetros e seiscentos metros, sai de Krutyń por uma alameda antiga de bordos e tílias
      em caminho de terra com raízes à vista. Conduz aos «Namorados», célebre monumento onde os ramos de um
      carvalho abraçam um pinheiro, e ao Carvalho-Cortiço com os degraus dos antigos apicultores.
    history: >-
      Estas alamedas são típicas da Masúria: foram plantadas para dar sombra a quem viajava a pé ou em
      carroça. A apicultura florestal foi outrora um ofício prestigiado, organizado em confrarias. No fim do
      trilho da reserva restam as ruínas de uma ponte de madeira de onde partiam passeios em barca de vara até
      Krutyń.
    before: >-
      Toda a área é zona de silêncio, e o acampamento só é permitido em locais próprios. Na rota do Krutynia é
      proibido colher plantas ou perturbar a fauna fora dos pontos autorizados. Os melhores meses vão de maio
      a outubro.
    around: >-
      A cinco quilómetros fica a [Floresta de Pisz -
      Masúria](/lugar/puszcza-piska-lesny-kompleks-promocyjny/), cujo setor norte está integrado no parque.
