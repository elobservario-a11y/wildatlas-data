resumen:
  es: >-
    Praderas kársticas al pie de Velebit donde manadas de caballos Sayagueses y Tauros sustituyen al ganado
    extinto.
  en: >-
    Karst grasslands at the foot of Velebit where herds of Sayaguesa horses and Tauros replace extinct wild
    cattle.
  fr: >-
    Prairies karstiques au pied du Velebit où des hardes de chevaux Sayaguesa et de Tauros remplacent le
    bétail disparu.
  de: >-
    Karstwiesen am Fuß des Velebit, auf denen Herden von Sayaguesa-Pferden und Tauros-Rindern ausgestorbenes
    Großvieh ersetzen.
  it: >-
    Praterie carsiche ai piedi del Velebit dove mandrie di cavalli Sayaguesa e bovini Tauros sostituiscono il
    bestiame scomparso.
  pt: >-
    Pradarias cársicas ao pé de Velebit onde manadas de cavalos Sayagueses e bovinos Tauros substituem o gado
    extinto.
