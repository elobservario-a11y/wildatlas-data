resumen:
  es: >-
    Valle calizo meandriforme del Jura Franconio con las formaciones de la 'Zwölf Apostel' (Doce Apóstoles) y
    las canteras del fósil Archaeopteryx.
  en: >-
    Meandering limestone valley of the Franconian Jura with the "Zwölf Apostel" (Twelve Apostles) pinnacles
    and Archaeopteryx fossil quarries.
  fr: >-
    Vallée calcaire méandreuse du Jura franconien avec les aiguilles des « Zwölf Apostel » (Douze Apôtres) et
    les carrières à Archaeopteryx.
  de: >-
    Mäandrierendes Kalktal des Fränkischen Jura mit den Felstürmen der „Zwölf Apostel“ und den Steinbrüchen
    des Urvogels Archaeopteryx.
  it: >-
    Valle calcarea a meandri del Giura Francone con i torrioni dei "Zwölf Apostel" (Dodici Apostoli) e le cave
    dell’Archaeopteryx.
  pt: >-
    Vale calcário meandrizante do Jura Francónio com os pináculos dos "Zwölf Apostel" (Doze Apóstolos) e as
    pedreiras do fóssil Archaeopteryx.
unico:
  es: >-
    En un solo valle puedes recorrer un fondo marino jurásico, un brezal de enebros que creó el pastoreo
    medieval y el yacimiento de Archaeopteryx de Solnhofen-Eichstätt, incluido entre los 100 lugares de
    herencia geológica más importantes del mundo.
  en: >-
    In a single valley you can wander across a Jurassic seabed, juniper heathland fashioned by medieval sheep
    farming, and the Archaeopteryx fossil sites of Solnhofen-Eichstätt, designated among the top 100
    geological heritage sites on Earth.
  fr: >-
    Dans une seule et même vallée, vous pouvez traverser un ancien fond marin jurassique, une lande à
    genévriers façonnée par le pastoralisme médiéval et le gisement paléontologique à Archaeopteryx de
    Solnhofen-Eichstätt, inscrit parmi les 100 plus remarquables sites du patrimoine géologique mondial.
  de: >-
    In einem einzigen Tal kannst du über einen jurazeitlichen Meeresgrund wandern, eine Wacholderheide
    durchstreifen, die mittelalterliche Hutung schuf, und die Fundstätten des Urvogels Archaeopteryx von
    Solnhofen-Eichstätt besuchen, die zu den 100 bedeutendsten geologischen Erbestätten der Erde zählen.
  it: >-
    In un’unica vallata puoi percorrere un fondale marino giurassico, una brughiera a ginepri plasmata dalla
    pastorizia medievale e i giacimenti fossiliferi di Archaeopteryx a Solnhofen-Eichstätt, annoverati tra i
    100 siti geologici più rilevanti al mondo.
  pt: >-
    Num único vale podes percorrer um antigo leito marinho jurássico, uma charneca de zimbros criada pela
    pastorícia medieval e os jazigos de Archaeopteryx de Solnhofen-Eichstätt, incluídos entre os 100 sítios
    geológicos mais importantes do mundo.
observaciones:
  es: >-
    En la reserva de Gungolding está prohibido recoger bayas de enebro. Las flores del Kreutberg se ven en
    marzo y abril: en verano ya no hay nada que ver, salvo semillas. El Altmühl tiene el sello de calidad QMW
    de turismo acuático, que valora la infraestructura, la protección ambiental y la canalización de
    visitantes.
texto:
  es:
    intro: >-
      Antes de ser un parque fue un mar. Las calizas en placas que forman hoy el suelo del Parque Natural del
      Altmühltal nacieron en las lagunas del mar jurásico, y por eso guardan fósiles en toda la comarca. Sobre
      esa piedra se extienden 2962 km² de Baviera, casi idénticos a la unidad natural de la Frankenalb
      meridional. Es el cuarto parque natural más extenso de Alemania, y desde que una asociación lo fundó en
      Pappenheim, el 25 de julio de 1969, protege un mosaico de roca, pastizal y bosque.
    landscape: >-
      Los rasgos que repiten por todo el parque son los pastizales secos, los brezales de enebro, los prados
      húmedos, las rocas, las cuevas kársticas y las canteras. La mitad de la superficie es bosque. Y la
      piedra manda: en los Doce Apóstoles, entre Solnhofen y Eßlingen, las rocas son calizas estratificadas
      del mármol de Treuchtlingen, del Jurásico superior. En el mar jurásico se formaron además calizas de
      esponja que resisten mejor la erosión; por eso la erosión las dejó en pie.


      El enebro y el pastizal, en cambio, no son naturales: son obra de siglos. Los pastizales y brezales
      actuales estaban cubiertos antes de hayedos y bosques mixtos de roble. Desde la Alta Edad Media los
      pastores llevaron ovejas y cabras a esos bosques. Con el tiempo se extendieron plantas y animales que
      aman la luz y el calor. En Gungolding la historia es la misma: el brezal nació en la Edad Media, cuando
      se talaron bosques y se llevó allí el ganado, y hoy las ovejas siguen pastando para que el bosque no lo
      recupere.


      El río también ha dejado marca humana. El canal Meno-Danubio, abierto en 1992 por el valle, fue
      políticamente polémico. El antiguo cauce del Altmühl se convirtió en brazos muertos, y a lo largo del
      canal se intentó recrear orillas naturales y humedales.
    wildlife: >-
      Aquí lo mejor del año es la flora, y empieza pronto. Si paseas por el Kreutberg a principios de
      primavera, en marzo y abril, el violeta de las pulsatilas sale a tu encuentro, y con ellas florece en el
      pastizal la potentila primaveral. Sobre las rocas asoma el Bergsteinkraut, muy raro fuera de aquí. en
      los días calurosos del verano estas plantas desaparecen y sobreviven como semillas que germinan a
      finales del otoño.


      Los Doce Apóstoles guardan otro calendario. Entre sus pastizales magros crecen la Karthäuser-Nelke, la
      Violette Stendelwurz y dos especies de Gamander, y entre las plantas viven escarabajos coprófagos,
      cicadas, mariposas azules y saltamontes adaptados a la sequedad. Con medidas de conservación, la
      mariposa Apollofalter volvió a instalarse allí. En el brezal de Gungolding crecen el clavel de roca, la
      Minuartia de hojas estrechas, un heliantemo muy raro y tres gencianas: la primaveral, la fringida y la
      alemana.


      Junto al agua cambia el escenario. En el valle de Heutal, el [castor](/especie/castor_fiber/) ha
      transformado en los últimos años el cauce del arroyo y el paisaje con sus construcciones. Y en el
      extremo norte del Altmühlsee, la laguna Vogelinsel es una de las principales áreas bávaras de protección
      de aves migratorias.
    visit: >-
      Empieza por el centro de información de Eichstätt: una exposición moderna sobre cultura, naturaleza e
      historia, un jardín de biotopos y un centro de educación ambiental.


      Para caminar, la columna es el Altmühltal-Panoramaweg, doscientos kilómetros que siguen el río entre
      Gunzenhausen y Kelheim. Es la ruta a pie más popular del parque y tiene desde 2006 el sello de calidad
      Wanderbares Deutschland. En lo alto pasa sobre los Doce Apóstoles y da vista al valle de Solnhofen. Para
      llegar a la roca se aparca en Eßlingen y se sigue la señalización, o se sube desde Solnhofen unos 2 km
      por el Panoramaweg.


      Otras rutas son más cortas. El camino circular alrededor del Altmühlsee suma trece kilómetros, dura tres
      horas y puede recorrerse con movilidad accesible; el sendero interpretativo de la isla Vogelinsel tiene
      paneles informativos. El sendero didáctico de Heutal es un circuito de unos cuatro kilómetros junto al
      arroyo Wissinger Laber y explica el paisaje natural y cultural del agua. En el Kreutberg, un sendero
      circular marcado de 3,5 kilómetros pasa por el Felsengarten y por una roca con forma de león.


      Si prefieres otras maneras de moverte, el Altmühltal-Radweg tiene 166 km por un trazado relativamente
      llano. El tramo de paseo en barca por el Altmühl dentro del parque mide casi 120 kilómetros entre
      Gunzenhausen y Dietfurt; su corriente tranquila lo hace un río ideal para ir en familia, tanto para una
      tarde como para varios días. Y si lo tuyo son los fósiles, las canteras de visita permiten buscarlos por
      cuenta propia.
    history: >-
      Con el enebro se vivió: sus ramas servían para ahumar embutidos y su madera para hacer mangos de látigo.
      Se creía que el humo protegía de enfermedades y de poderes malignos, y que los mangos de enebro
      protegían a los caballos del embrujo.


      Esos paisajes siguen vivos porque se cuidan. El paraje de los Doce Apóstoles es reserva natural desde
      1984 y ocupa unas 15,2 hectáreas. La reserva de Gungolding ocupa alrededor de setenta hectáreas en la
      ladera norte del valle, y el del Kreutberg unas 30. En los pastizales magros viven 187 plantas
      amenazadas de la Lista Roja que dependen de estos suelos secos y pobres. En Gungolding, las ovejas
      evitan que el bosque lo recupere.
    before: >-
      En la reserva de Gungolding está prohibido recoger bayas de enebro. Las flores del Kreutberg se ven en
      marzo y abril: en verano ya no hay nada que ver, salvo semillas. El Altmühl tiene el sello de calidad
      QMW de turismo acuático, que valora la infraestructura, la protección ambiental y la canalización de
      visitantes.
  en:
    intro: >-
      Before it became a nature park, this realm was an ancient tropical sea. The platy limestones that form
      the geological foundation of the Altmühltal Nature Park originated in shallow lagoons of the Jurassic
      ocean, which is why exceptional fossils turn up across the region. Atop this stone substrate lie 2962
      km² of Bavaria, nearly coincident with the southern Franconian Alb natural region. It is the fourth
      largest nature park in Germany, and ever since an association established it at Pappenheim on 25 July
      1969, it preserves a magnificent mosaic of crags, dry grasslands and forest.
    landscape: >-
      The trademark landscape features recurring across the park are nutrient-poor dry grasslands, juniper
      heaths, wet valley meadows, exposed limestone dolomite cliffs, karst caves and historic quarries. Half
      the park’s territory is forested. And rock governs the scenery: at the Twelve Apostles between Solnhofen
      and Eßlingen, the rock pillars are layered limestone of the Treuchtlingen marble, dating from the Upper
      Jurassic. Within the Jurassic sea, resilient sponge reefs developed, displaying higher resistance to
      weathering; thus differential erosion left them standing as bold towers.


      The juniper bushes and sheep pastures, by contrast, are semi-natural: the product of human history.
      Today’s grasslands and heaths were once cloaked in dense beech and mixed oak woodland. From the High
      Middle Ages onwards, shepherds grazed large flocks of sheep and goats through these forests. Over time,
      light-loving and thermophilic flora and fauna spread. At Gungolding the story repeats itself: the
      expansive juniper heath originated in the Middle Ages when woodlands were felled and livestock took
      over, and flocks still graze there today to keep regenerating forest from reclaiming the open hillsides.


      The river course has also endured human intervention. The Main-Danube Canal, completed in 1992 through
      the valley, sparked fierce political controversy. The natural course of the Altmühl was transformed into
      isolated oxbows, and extensive ecological restoration along the canal sought to re-create natural
      riverbanks and wetlands.
    wildlife: >-
      The biological highlight of the calendar year is the flora, which awakens exceptionally early. Walking
      across the Kreutberg in early spring, through March and April, the purple blossoms of pasqueflowers
      greet you, alongside blooming spring cinquefoil across the calcareous turf. On open rock ledges appears
      the rare mountain alyssum (Bergsteinkraut), scarcely found beyond these crags. During the searing heat
      of summer these delicate ephemerals wither away, persisting safely as seeds that germinate in late
      autumn.


      The Twelve Apostles follow a different botanical rhythm. Across their sparse dry meadows grow Carthusian
      pink (Karthäuser-Nelke), dark-red helleborine (Violette Stendelwurz) and two species of germander,
      accompanied by specialized dung beetles, cicadas, blue lycaenid butterflies and drought-adapted
      grasshoppers. Targeted conservation measures have even enabled the Apollo butterfly (Apollofalter) to
      recolonize the crags. On the Gungolding juniper heath bloom the rock pink, fine-leaved sandwort, an
      extraordinarily rare rock-rose and three distinct gentian species: spring, fringed and German gentian.


      Down by the water, the habitat transforms completely. In the Heutal valley, the Eurasian
      [beaver](/especie/castor_fiber/) has reshaped the stream bed and landscape in recent years through its
      dams and lodges. And at the northern tip of the Altmühlsee reservoir, the Vogelinsel bird island serves
      as one of Bavaria’s premier staging reserves for migratory waterbirds.
    visit: >-
      Begin your exploration at the Eichstätt information centre: it offers an informative modern exhibition
      exploring culture, nature and regional history, alongside a biotope display garden and an environmental
      education centre.


      For hiking, the crown jewel is the Altmühltal-Panoramaweg, covering two hundred kilometres following the
      winding river from Gunzenhausen to Kelheim. It represents the park’s most acclaimed long-distance trail,
      certified since 2006 with the Wanderbares Deutschland seal of quality. High above, it skirts the Twelve
      Apostles, granting commanding vistas over the Solnhofen valley. To reach the iconic crags, park in
      Eßlingen and follow waymarks, or hike up from Solnhofen along roughly 2 km of the Panoramaweg.


      Shorter day loops abound. The circular pathway encircling the Altmühlsee spans thirteen kilometres,
      takes about three hours and provides wheelchair accessibility; the nature trail on the Vogelinsel bird
      sanctuary features interpretive panels. The Heutal educational trail forms a loop of roughly four
      kilometres along the Wissinger Laber brook, illustrating the cultural and aquatic ecology of
      watercourses. On the Kreutberg, a marked 3.5 km circular walk winds through the Felsengarten rock garden
      and past a lion-shaped dolomite formation.


      For alternate travel, the Altmühltal-Radweg cycleway runs for 166 km along flat river valley paths. The
      boating stretch along the Altmühl within park boundaries extends across nearly 120 kilometres between
      Gunzenhausen and Dietfurt; its gentle current makes it an ideal family-friendly paddling river, whether
      for an afternoon or an extended multi-day tour. If fossils fascinate you, several public visitor
      quarries allow amateur fossil hunting.
    history: >-
      Juniper was woven into daily rural life: fragrant branches smoked sausages and hams, while sturdy wood
      fashioned whip handles. Folklore held that juniper smoke repelled contagious disease and evil spirits,
      while whip handles crafted from juniper wood shielded horses from witchcraft.


      These cultural landscapes endure because they receive active stewardship. The Twelve Apostles site has
      enjoyed nature reserve protection since 1984, spanning some 15.2 hectares. The Gungolding juniper
      reserve encompasses around seventy hectares on the northern valley slope, while the Kreutberg reserve
      covers about 30 hectares. The dry calcareous grasslands support 187 threatened plant species included on
      the Red List that depend on these dry, nutrient-poor conditions. At Gungolding, sheep flocks prevent
      encroaching woodland from reclaiming the open heath.
    before: >-
      Within the Gungolding nature reserve it is strictly forbidden to harvest juniper berries. The delicate
      floral blooms on the Kreutberg are visible exclusively in March and April: by summer nothing remains on
      view except dormant seeds. The Altmühl holds the QMW water tourism seal of quality, certifying its
      well-maintained infrastructure, environmental safeguards and visitor management.
  fr:
    intro: >-
      Avant de devenir un parc naturel, ce lieu fut un océan tropical. Les calcaires lités qui composent le
      sous-sol du parc naturel de l’Altmühltal sont nés au creux des lagunes d’une mer jurassique, expliquant
      l’extraordinaire richesse en fossiles de toute la contrée. Sur ce socle géologique s’étendent 2962 km²
      en Bavière, coïncidant presque exactement avec la région naturelle du Jura franconien méridional. C’est
      le quatrième plus vaste parc naturel d’Allemagne, et depuis sa fondation par une association à
      Pappenheim le 25 juillet 1969, il préserve une mosaïque de falaises, de pelouses sèches et de forêts.
    landscape: >-
      Les éléments phares qui jalonnent le territoire sont les pelouses calcicoles sèches, les landes à
      genévriers, les prairies alluviales humides, les falaises dolomitiques, les grottes karstiques et les
      carrières de pierre. La moitié de la superficie est boisée. Et la roche impose sa loi : aux Douze
      Apôtres, entre Solnhofen et Eßlingen, les pitons rocheux sont constitués de calcaires stratifiés du
      marbre de Treuchtlingen, datant du Jurassique supérieur. Dans les eaux jurassiques se sont également
      formés des récifs d’éponges siliceuses plus résistants à l’usure météorique ; l’érosion différentielle
      les a ainsi laissés debout sous forme d’aiguilles spectaculaires.


      Les peuplements de genévriers et les pâturages maigres, en revanche, ne sont pas spontanés : ils sont le
      legs des siècles passés. Les pelouses actuelles étaient autrefois couvertes de hêtraies et de chênaies
      mixtes. Dès le haut Moyen Âge, les pasteurs y ont mené leurs troupeaux de moutons et de chèvres. Au fil
      du temps, des espèces thermophiles et héliophiles s’y sont installées. À Gungolding, l’histoire est
      similaire : la lande à genévriers est née au Moyen Âge des coupes forestières suivies de pâturage
      intensif, et aujourd’hui encore des troupeaux d’ovins y paissent pour empêcher la régénération
      forestière.


      Le cours d’eau a également subi l’aménagement humain. Le canal Main-Danube, inauguré en 1992 à travers
      la vallée, a suscité de vives controverses politiques. Le lit originel de l’Altmühl s’est mué en bras
      secondaires, et des aménagements de génie écologique le long du canal ont cherché à restaurer des berges
      naturelles et des zones humides.
    wildlife: >-
      Le point d’orgue de l’année réside dans la flore, précoce et raffinée. En arpentant le Kreutberg dès le
      début du printemps, en mars et avril, le violet lumineux des pulsatilles s’offre au regard, en compagnie
      de la potentille printanière sur les pelouses calcaires. Sur les affleurements rocheux apparaît
      l’alysson des montagnes (Bergsteinkraut), rarissime en dehors de ces escarpements. Dès les fortes
      chaleurs de l’été, ces espèces printanières s’évanouissent pour ne subsister que sous forme de graines
      qui germeront à la fin de l’automne.


      Les Douze Apôtres obéissent à un autre tempo botanique. Sur leurs prairies maigres fleurissent l’œillet
      des Chartreux (Karthäuser-Nelke), l’épipactis pourpre (Violette Stendelwurz) et deux espèces de
      germandrées, abritant bousiers, cigales, azurés et criquets xérophiles. Grâce à une gestion adaptée, le
      papillon Apollon (Apollofalter) s’est de nouveau implanté sur le site. Dans la lande de Gungolding
      s’épanouissent l’œillet des rochers, la minuartie à feuilles étroites, un hélianthème exceptionnel et
      trois gentianes : la printanière, la frangée et la gentiane d’Allemagne.


      Au bord de l’eau, le décor change du tout au tout. Dans le vallon du Heutal, le [castor
      d’Eurasie](/especie/castor_fiber/) a métamorphosé le lit du ruisseau et les berges ces dernières années
      par ses constructions. Enfin, à la pointe nord du plan d’eau de l’Altmühlsee, la réserve de la
      Vogelinsel forme l’un des sanctuaires majeurs de Bavière pour les oiseaux d’eau migrateurs.
    visit: >-
      Commencez par la maison du parc d’Eichstätt : une scénographie contemporaine sur le patrimoine culturel,
      naturel et géologique, agrémentée d’un jardin pédagogique et d’un centre d’éducation à l’environnement.


      Pour la marche, l’axe dorsal est l’Altmühltal-Panoramaweg, qui déroule deux cents kilomètres en suivant
      la rivière de Gunzenhausen à Kelheim. C’est la randonnée pédestre la plus réputée du parc, distinguée
      depuis 2006 par le label de qualité Wanderbares Deutschland. Sur les crêtes, elle domine les Douze
      Apôtres avec un panorama spectaculaire sur la vallée de Solnhofen. Pour accéder directement aux rochers,
      on stationne à Eßlingen en suivant le fléchage, ou l’on grimpe depuis Solnhofen sur environ 2 km le long
      du Panoramaweg.


      D’autres boucles s’avèrent plus courtes. Le sentier circulaire autour de l’Altmühlsee cumule treize
      kilomètres, demande trois heures de marche et offre une accessibilité adaptée ; le sentier pédagogique
      de la Vogelinsel comporte des panneaux thématiques. Le parcours didactique du Heutal forme une boucle
      d’environ quatre kilomètres le long de la Wissinger Laber pour expliciter l’hydrologie rurale. Au
      Kreutberg, un circuit balisé de 3,5 kilomètres serpente à travers le Felsengarten et devant un bloc
      rocheux évoquant la silhouette d’un lion.


      Pour varier les plaisirs, la piste cyclable Altmühltal-Radweg parcourt 166 km sur un profil plat. Le
      tronçon navigable en canoë sur l’Altmühl à l’intérieur du parc totalise près de 120 kilomètres entre
      Gunzenhausen et Dietfurt ; son courant paisible en fait une rivière idéale pour les familles, à la
      demi-journée ou sur plusieurs jours. Si vous vous passionnez pour la paléontologie, plusieurs carrières
      ouvertes au public permettent d’extraire soi-même des fossiles.
    history: >-
      Le genévrier a longtemps rythmé la vie rurale : ses rameaux servaient à fumer charcuteries et salaisons,
      et son bois imputrescible à fabriquer des manches de fouet. La tradition populaire croyait que la fumée
      de genévrier chassait les épidémies et les maléfices, et que les manches préservaient les chevaux des
      envoûtements.


      Ces paysages ont survécu grâce à une gestion agropastorale vigilante. Le site des Douze Apôtres est
      classé réserve naturelle depuis 1984 sur une superficie de 15,2 hectares. La réserve de Gungolding
      s’étend sur environ soixante-dix hectares sur le versant nord de la vallée, et celle du Kreutberg en
      couvre environ 30. Les pelouses maigres abritent 187 espèces végétales menacées inscrites sur la Liste
      rouge, tributaires de ces sols secs et pauvres en nutriments. À Gungolding, le pâturage ovin empêche le
      retour de la forêt fermée.
    before: >-
      Dans la réserve naturelle de Gungolding, la récolte des baies de genévrier est rigoureusement interdite.
      Les floraisons du Kreutberg s’observent uniquement en mars et avril : en été, il n’y a plus rien à
      contempler hormis des graines en dormance. L’Altmühl arbore le label de qualité nautique QMW, attestant
      la qualité de ses équipements, la protection environnementale et la canalisation des flux de canoës.
  de:
    intro: >-
      Ehe es ein Naturpark wurde, war dieses Land ein subtropisches Flachmeer. Die Plattenkalke, die heute das
      Fundament des Naturparks Altmühltal bilden, lagerten sich in den Lagunen dieses Jurameeres ab und bergen
      deshalb überall im Landstrich herausragende Fossilien. Auf diesem Gestein dehnen sich 2962 km² in Bayern
      aus, nahezu deckungsgleich mit der Haupteinheit Südliche Frankenalb. Es ist der viertgrößte Naturpark
      Deutschlands und bewahrt seit seiner Gründung durch einen Verein am 25. Juli 1969 in Pappenheim ein
      Mosaik aus Fels, Magerweide und Bergmischwald.
    landscape: >-
      Typische Landschaftselemente im gesamten Parkgebiet sind Magerrasen, Wacholderheiden, feuchte Talauen,
      schroffe Dolomitfelsen, Karsthöhlen und historische Steinbrüche. Die Hälfte der Fläche ist bewaldet. Und
      der Fels bestimmt die Szenerie: Bei den Zwölf Aposteln zwischen Solnhofen und Eßlingen bestehen die
      Felszacken aus geschichtetem Treuchtlinger Marmor des Oberen Jura. Im Jurameer bildeten sich zudem
      kieselhaltige Schwammriffe, die der Verwitterung besser trotzten; die Erosion formte daraus die heute
      frei stehenden Felstürme.


      Die Wacholderheiden und Trockenrasen sind keineswegs reine Urnatur, sondern das Werk von Generationen.
      Früher stockten hier Buchen- und Eichenmischwälder. Seit dem Hochmittelalter trieben Hirten Schafe und
      Ziegen in die Wälder. Mit der Zeit breiteten sich wärme- und lichtliebende Arten aus. In Gungolding
      verlief die Geschichte ähnlich: Die Heide entstand im Mittelalter durch Waldrodung und Waldweide, und
      bis heute verhindern Schafherden, dass sich der Wald die Hänge zurückholt.


      Auch der Fluss trägt die Handschrift des Menschen. Der Main-Donau-Kanal, der 1992 im Tal fertiggestellt
      wurde, war politisch heftig umstritten. Die ursprüngliche Altmühlschlinge wurde zu Altwassern, und
      entlang der Wasserstraße versuchte man, naturnahe Ufer und Feuchtlebensräume wiederzubeleben.
    wildlife: >-
      Der Höhepunkt des Naturjahres ist die Pflanzenwelt, die außerordentlich früh erwacht. Wenn du im
      Vorfrühling, im März und April, über den Kreutberg wanderst, leuchten dir violette Küchenschellen
      entgegen, begleitet vom Frühlings-Fingerkraut im lückigen Kalkrasen. Auf den offenen Felsköpfen zeigt
      sich das seltene Bergsteinkraut, das andernorts kaum vorkommt. An den heißen Sommertagen ziehen diese
      Frühlingspflanzen ein und überdauern als Samen, die erst im Spätherbst keimen.


      Die Zwölf Apostel folgen einem anderen Rhythmus. In ihren mageren Rasen wachsen Karthäuser-Nelke,
      Violette Stendelwurz und zwei Gamander-Arten; dazwischen leben Pillendreher, Zikaden, Bläulinge und
      trockenheitsliebende Heuschrecken. Durch gezielte Pflegemaßnahmen hat sich dort auch der Apollofalter
      wieder angesiedelt. Auf der Wacholderheide von Gungolding blühen Felsennelke, Schmalblättrige Miere, ein
      seltenes Sonnenröschen und drei Enzianarten: Frühlings-, Fransen- und Deutscher Enzian.


      Am Wasser wandelt sich das Bild vollkommen. Im Heutal hat der [Biber](/especie/castor_fiber/) in den
      letzten Jahren das Bachbett und die Flussaue mit seinen Bauten sichtbar umgestaltet. Am Nordende des
      Altmühlsees bildet die Vogelinsel eines der bedeutendsten Rastgebiete Bayerns für ziehende Wat- und
      Wasservögel.
    visit: >-
      Beginne im Informationszentrum in Eichstätt: Eine moderne Ausstellung beleuchtet Kultur, Natur und
      Geologie, ergänzt durch einen Biotopgarten und ein Umweltbildungszentrum.


      Die Hauptwanderachse ist der Altmühltal-Panoramaweg, der auf zweihundert Kilometern dem Flusslauf von
      Gunzenhausen bis Kelheim folgt. Er ist die beliebteste Wanderroute des Parks und trägt seit 2006 das
      Gütesiegel Qualitätsweg Wanderbares Deutschland. Auf der Höhe zieht er über den Zwölf Aposteln entlang
      und eröffnet ein weites Panorama über das Tal von Solnhofen. Zu den Felsen gelangst du vom Parkplatz in
      Eßlingen der Beschilderung folgend, oder du steigst von Solnhofen aus rund 2 km auf dem Panoramaweg
      empor.


      Kürzere Touren sind reichlich vorhanden. Der Rundweg um den Altmühlsee misst dreizehn Kilometer, dauert
      etwa drei Stunden und ist barrierefrei passierbar; der Naturlehrpfad auf der Vogelinsel bietet
      Informationstafeln. Der Lehrpfad Heutal bildet einen rund vier Kilometer langen Rundkurs an der
      Wissinger Laber zur Gewässerökologie. Am Kreutberg führt ein 3,5 Kilometer langer markierter Rundweg
      durch den Felsengarten und an einer auffälligen Felsformation namens Löwenkopf vorbei.


      Für Radfahrer verläuft der Altmühltal-Radweg über 166 km auf überwiegend flacher Trasse. Die
      Bootswanderstrecke auf der Altmühl innerhalb des Naturparks umfasst knapp 120 Kilometer zwischen
      Gunzenhausen und Dietfurt; ihre sanfte Strömung macht sie zu einem idealen Fluss für Familien, sei es
      für einen Nachmittag oder für mehrere Tage. Für Fossiliensammler halten mehrere Besuchersteinbrüche die
      Möglichkeit bereit, eigenhändig nach Versteinerungen zu klopfen.
    history: >-
      Der Wacholder war eng mit der bäuerlichen Lebenswelt verknüpft: Mit seinen Zweigen räucherte man
      Schinken und Würste, aus seinem zähen Holz schnitzte man Peitschenstiele. Im Volksglauben hieß es, der
      Rauch schütze vor Seuchen und bösen Geistern, während Wacholdergriffe Pferde vor Verhexung bewahren
      sollten.


      Diese Kulturlandschaften bleiben nur durch fortlaufende Pflege erhalten. Das Felsareal der Zwölf Apostel
      ist seit 1984 ein Naturschutzgebiet von 15,2 Hektar Größe. Das Schutzgebiet Gungoldinger Wacholderheide
      umfasst rund siebzig Hektar am Nordhang des Tales, jenes am Kreutberg etwa 30 Hektar. Auf den
      Magerwiesen wachsen 187 Rote-Liste-Pflanzenarten, die auf diese nährstoffarmen Trockenböden angewiesen
      sind. In Gungolding verhindern Schafe die Wiederbewaldung.
    before: >-
      Im Naturschutzgebiet Gungolding ist das Pflücken von Wacholderbeeren streng verboten. Die botanischen
      Kostbarkeiten am Kreutberg zeigen sich ausschließlich im März und April: Im Hochsommer gibt es dort
      außer ruhenden Samen nichts zu sehen. Die Altmühl trägt das Qualitätssiegel QMW für Wassertourismus, das
      hohe Standards bei Infrastruktur, Naturschutz und Besucherlenkung bescheinigt.
  it:
    intro: >-
      Prima di diventare un parco naturale, questa terra fu un mare tropicale. I calcari lastriformi che
      costituiscono il basamento del Parco Naturale dell’Altmühltal si depositarono nelle lagune del mare
      giurassico, racchiudendo giacimenti di fossili in tutto il comprensorio. Su questa matrice geologica si
      estendono 2962 km² in Baviera, quasi perfettamente coincidenti con l’unità naturale del Giura francone
      meridionale. È il quarto parco naturale più esteso della Germania e, da quando un’associazione lo fondò
      a Pappenheim il 25 luglio 1969, tutela un ricco mosaico di falesie, pascoli magri e boschi misti.
    landscape: >-
      Gli elementi che caratterizzano il paesaggio del parco sono le praterie aride, le brughiere a ginepro, i
      prati umidi di fondovalle, le rupi calcaree e dolomitiche, le cavità carsiche e le cave storiche. La
      metà della superficie è boscata. E la roccia comanda lo scenario: presso i Dodici Apostoli, tra
      Solnhofen ed Eßlingen, i pinnacoli rocciosi sono formati da calcari stratificati del marmo di
      Treuchtlingen, del Giurassico superiore. Nel mare giurassico si svilupparono inoltre scogliere di spugne
      calcaree e silicee più resistenti all’erosione meteorica; l’erosione differenziale le ha così isolate
      sotto forma di arditi torrioni.


      I gineprai e i pascoli magri, invece, non sono ambienti primigeni: sono l’eredità dei secoli. I prati
      xerofili attuali erano originariamente ricoperti da faggete e querceti misti. A partire dall’Alto
      Medioevo i pastori condussero pecore e capre in questi boschi. Con il tempo si sono insediate specie
      vegetali e animali spiccatamente termofile ed eliofile. A Gungolding la vicenda si ripete: la landa a
      ginepro nacque nel Medioevo dal disboscamento e dal pascolo prolungato, e ancora oggi le greggi
      continuano a pascolare per evitare che il bosco si riappropri dei versanti.


      Anche il fiume porta l’impronta degli interventi antropici. Il canale Meno-Danubio, aperto nel 1992
      lungo la valle, fu oggetto di accesi contrasti politici. Il corso originario dell’Altmühl si trasformò
      in rami morti, e lungo le sponde del canale artificiale si tentò di ripristinare rive naturali e zone
      umide.
    wildlife: >-
      La perla biologica delle stagioni è la flora, che si ridesta prestissimo. Camminando sul Kreutberg a
      inizio primavera, nei mesi di marzo e aprile, la fioritura viola delle pulsatille accoglie i visitatori,
      assieme alla potentilla primaverile sui prati aridi. Sulle rocce affioranti spunta l’alyssum di montagna
      (Bergsteinkraut), rarissimo altrove. Nelle calde giornate estive queste piante precoci appassiscono e
      sopravvivono come semi dormienti che germineranno a fine autunno.


      I Dodici Apostoli seguono un differente calendario naturale. Nei pascoli magri allignano il garofano dei
      Certosini (Karthäuser-Nelke), l’elleborina violacea (Violette Stendelwurz) e due specie di camedrio, tra
      i quali vivono scarabei stercorari, cicale, licenidi e cavallette xerofile. Grazie a mirati interventi
      di tutela, la farfalla Apollo (Apollofalter) è tornata a colonizzare le pareti. Nella landa di
      Gungolding crescono il garofanino delle rupi, la minuartia a foglie sottili, un rarissimo eliantemo e
      tre genziane: la primaverile, la sfrangiata e la genziana di Germania.


      Lungo l’acqua l’ambiente cambia radicalmente. Nella valle di Heutal, il [castoro
      europeo](/especie/castor_fiber/) ha trasformato negli ultimi anni l’alveo del torrente e la piana
      alluvionale con le sue dighe. E all’estremità settentrionale dell’Altmühlsee, la riserva della
      Vogelinsel rappresenta uno dei santuari bavaresi più importanti per gli uccelli migratori.
    visit: >-
      Inizia dal centro informazioni di Eichstätt: ospita un moderno allestimento espositivo su cultura,
      natura e paleontologia, un giardino dei biotopi e un centro per l’educazione ambientale.


      Per gli escursionisti l’itinerario principale è l’Altmühltal-Panoramaweg, duecento chilometri che
      costeggiano il corso fluviale tra Gunzenhausen e Kelheim. È il tracciato a piedi più apprezzato del
      parco, insignito dal 2006 del marchio di qualità Wanderbares Deutschland. Nella parte alta transita
      proprio sopra i Dodici Apostoli con ampia vista sulla vallata di Solnhofen. Per ammirare le formazioni
      rocciose si parcheggia a Eßlingen seguendo i segnavia, oppure si risale da Solnhofen per circa 2 km
      lungo il Panoramaweg.


      Non mancano percorsi più brevi. Il sentiero ad anello che cinge l’Altmühlsee copre tredici chilometri,
      richiede tre ore di marcia ed è interamente accessibile; il percorso didattico dell’isolotto Vogelinsel
      dispone di cartelli interpretativi. Il sentiero tematico di Heutal è un anello di circa quattro
      chilometri lungo il torrente Wissinger Laber dedicato all’ecologia delle acque. Sul Kreutberg, un
      itinerario ad anello segnato di 3,5 chilometri attraversa il Felsengarten e passa accanto a una falesia
      sagomata a forma di leone.


      Per gli amanti della bicicletta, la ciclabile Altmühltal-Radweg si estende per 166 km su tracciato
      pianeggiante. La rotta navigabile in canoa sull’Altmühl dentro il parco copre quasi 120 chilometri tra
      Gunzenhausen e Dietfurt; la corrente lenta rende la discesa perfetta per le famiglie, per una mezza
      giornata o escursioni di più giorni. Per chi ama i fossili, diverse cave didattiche consentono la
      ricerca amatoriale di reperti giurassici.
    history: >-
      Il ginepro ha fatto parte della civiltà rurale: i suoi rami servivano per affumicare insaccati e carni,
      e il suo legno resistente per scolpire manici di frusta. Si riteneva che il fumo preservasse da epidemie
      e influssi maligni, e che i manici proteggessero i cavalli dai sortilegi.


      Questi paesaggi continuano a vivere grazie a una gestione attenta. L’area rupestre dei Dodici Apostoli è
      riserva naturale dal 1984 e copre circa 15,2 ettari. La riserva di Gungolding si estende per circa
      settanta ettari sul versante settentrionale della valle, mentre quella del Kreutberg ne misura circa 30.
      Nei pascoli magri crescono 187 piante minacciate della Lista Rossa che dipendono da questi suoli aridi e
      poveri di nutrienti. A Gungolding, il pascolo ovinico ostacola l’avanzata della boscaglia.
    before: >-
      Nella riserva naturale di Gungolding è severamente vietato cogliere bacche di ginepro. I fiori rari del
      Kreutberg si possono ammirare unicamente in marzo e aprile: in piena estate non resta nulla se non semi
      quiescenti. L’Altmühl detiene il marchio di qualità nautica QMW, che certifica standard eccellenti per
      infrastrutture, salvaguardia naturale e gestione sostenibile del turismo in canoa.
  pt:
    intro: >-
      Antes de ser um parque natural, este território foi um mar tropical. Os calcários laminados que hoje
      formam o substrato do Parque Natural do Altmühltal formaram-se nas lagoas desse oceano jurássico, razão
      pela qual encerram fósseis extraordinários em toda a comarca. Sobre esta base rochosa espalham-se 2962
      km² da Baviera, praticamente coincidentes com a unidade natural do Jura Francónio Meridional. É o quarto
      maior parque natural da Alemanha e, desde a sua fundação por uma associação em Pappenheim a 25 de julho
      de 1969, salvaguarda um mosaico de rochedos, prados secos e florestas.
    landscape: >-
      Os traços que se repetem por todo o parque são os prados secos xerófilos, os zimbrais, as pastagens
      húmidas de várzea, as falésias dolomíticas, as grutas cársicas e as pedreiras históricas. Metade da
      superfície é ocupada por floresta. E a rocha molda o relevo: nos Doze Apóstolos, entre Solnhofen e
      Eßlingen, os pináculos são constituídos por calcários estratificados do mármore de Treuchtlingen, do
      Jurássico Superior. No mar jurássico formaram-se recifes de esponjas mais resistentes ao desgaste; a
      erosão diferencial manteve-os de pé como agulhas monumentais.


      Os zimbros e as pastagens pobres, pelo contrário, não são fruto da natureza intocada: são obra de
      gerações. Os prados secos atuais estavam outrora cobertos por densos faiais e carvalhais mistos. Desde a
      Alta Idade Média que os pastores conduziram ovelhas e cabras para o arvoredo. Com o tempo instalaram-se
      plantas e animais adaptados à secura e à luz. Em Gungolding a história repete-se: o zimbro espalhou-se
      na Idade Média com o corte de arvoredo e o pastoreio sucessivo, e hoje os rebanhos continuam a pastar
      para que a floresta não volte a ocupar as encostas.


      O rio também regista a intervenção humana. O canal Meno-Danúbio, aberto em 1992 no vale, suscitou forte
      polémica. O antigo curso do Altmühl transformou-se em braços mortos, e ao longo do canal
      implementaram-se projetos de renaturalização de margens e zonas húmidas.
    wildlife: >-
      O grande destaque do ciclo anual é a flora silvestre, que desperta invulgarmente cedo. Ao passear pelo
      Kreutberg no início da primavera, em março e abril, o violeta das anémonas-pulsatilas saúda os
      caminhantes, acompanhado pela potentila-primaveril nos prados pedregosos. Nas escarpas abertas surge o
      raro álisso-das-montanhas (Bergsteinkraut), muito difícil de encontrar noutros pontos. Nas tardes
      quentes do verão estas plantas murcham e sobrevivem em sementes que germinam no final do outono.


      Os Doze Apóstolos guardam outro ritmo ecológico. Nos seus pastos magros medram o cravo-dos-cartuxos
      (Karthäuser-Nelke), a erva-língua-violácea (Violette Stendelwurz) e duas espécies de camédrios,
      coexistindo com escaravelhos coprófagos, cigarras, borboletas azuis e gafanhotos xerófilos. Graças a
      medidas de conservação ativas, a borboleta-apolo (Apollofalter) voltou a colonizar as escarpas. No
      zimbro de Gungolding crescem a cravina-das-rochas, a minuartia-de-folha-estreita, um heliantemo
      raríssimo e três gencianas: a da primavera, a ciliada e a genciana-alemã.


      Junto à água o cenário muda de feição. No vale de Heutal, o [castor-europeu](/especie/castor_fiber/)
      alterou consideravelmente a dinâmica do riacho e da planície ripícola através das suas represas. E no
      extremo norte da albufeira do Altmühlsee, a reserva de Vogelinsel assume-se como uma das principais
      zonas bávaras de acolhimento para aves aquáticas migratórias.
    visit: >-
      Começa pelo centro interpretativo de Eichstätt: disponibiliza uma exposição moderna sobre história,
      natureza e fósseis, complementada por um jardim botânico de biótopos e instalações de educação
      ambiental.


      Para caminhar, a grande referência é o Altmühltal-Panoramaweg, duzentos quilómetros que acompanham o rio
      entre Gunzenhausen e Kelheim. É o percurso pedestre mais concorrido do parque, detentor desde 2006 do
      selo de qualidade Wanderbares Deutschland. No setor superior passa sobre os Doze Apóstolos e desvenda
      vistas panorâmicas sobre o vale de Solnhofen. Para chegar às rochas podes estacionar em Eßlingen
      seguindo a sinalização, ou subir a partir de Solnhofen cerca de 2 km pelo Panoramaweg.


      Existem circuitos mais curtos. O trilho circular em redor do Altmühlsee soma treze quilómetros,
      cumpre-se em três horas e apresenta traçado acessível; o percurso interpretativo da ilha de Vogelinsel
      inclui painéis didáticos. O trilho temático de Heutal é um anel de cerca de quatro quilómetros junto ao
      riacho Wissinger Laber que aborda a ecologia dos cursos de água. No Kreutberg, um percurso marcado de
      3,5 quilómetros cruza o Felsengarten e passa por uma crista calcária cuja forma evoca a cabeça de um
      leão.


      Em alternativa, a ecopista Altmühltal-Radweg estende-se por 166 km de perfil plano. A descida de canoa
      no Altmühl dentro do parque cobre perto de 120 quilómetros entre Gunzenhausen e Dietfurt; as suas águas
      calmas tornam o rio excelente para programas em família, de meio dia ou vários dias. Se procuras
      fósseis, várias pedreiras abertas a visitantes facultam a procura livre de vestígios jurássicos.
    history: >-
      O zimbro acompanhou a vida comunitária tradicional: a sua ramagem perfumada servia para defumar
      presuntos e enchidos, e a sua madeira tenaz talhava cabos de chicote. Acreditava-se que o fumo afastava
      doenças contagiosas e entidades malévolas, e que os cabos de zimbro protegiam as parelhas de cavalos de
      feitiçarias.


      Estas paisagens ancestrais resistem porque continuam sob pastoreio ativo. O maciço rochoso dos Doze
      Apóstolos é reserva natural desde 1984, cobrindo 15,2 hectares. A reserva da charneca de Gungolding
      abrange cerca de setenta hectares na encosta setentrional do vale, e a do Kreutberg perto de 30
      hectares. Nos prados pobres prosperam 187 plantas ameaçadas da Lista Vermelha, dependentes destes solos
      secos e desprovidos de nutrientes. Em Gungolding, as ovelhas evitam a reconquista arbórea.
    before: >-
      Na reserva natural de Gungolding é terminantemente proibido colher bagas de zimbro. As raras espécies
      florísticas do Kreutberg florescem exclusivamente em março e abril: no verão apenas restam sementes em
      dormência. O rio Altmühl ostenta o selo náutico QMW, atestando rigorosas condições de infraestruturas,
      salvaguarda ecológica e gestão de visitantes em canoa.
