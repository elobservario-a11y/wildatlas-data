resumen:
  es: El 'Olimpo de Moldavia', una cumbre caliza sagrada emergiendo sobre extensos hayedos-abetales.
  en: The 'Olympus of Moldavia', a sacred limestone summit emerging above extensive beech-fir woodlands.
  fr: L'« Olympe de Moldavie », sommet calcaire sacré émergeant au-dessus d'immenses hêtraies-sapinières.
  de: Der 'Olymp der Moldau', ein heiliger Kalksteingipfel, der über weite Buchen- und Tannenwälder ragt.
  it: L'« Olimpo della Moldavia », una cima calcarea sacra che domina vaste faggete e abetaie.
  pt: O 'Olimpo da Moldávia', um cume calcário sagrado emergindo sobre extensos faiais e abetais.
unico:
  es: >-
    Un macizo de roca desnuda y de leyenda: aquí viven, según la tradición, Baba Dochia, el Águila de Trajano,
    Panaghia y Toaca.
  en: >-
    A massif of bare rock and enduring legend: local tradition places here Baba Dochia, Trajan's Eagle,
    Panaghia, and Toaca.
  fr: >-
    Un massif de roche nue et de légendes : la tradition y place Baba Dochia, l'Aigle de Trajan, Panaghia et
    Toaca.
  de: >-
    Ein Felsmassiv voller Mythen: Hier leben der Überlieferung nach Baba Dochia, Trajans Adler, Panaghia und
    Toaca.
  it: >-
    Un massiccio di roccia viva e leggende: qui vivono, secondo la tradizione, Baba Dochia, l'Aquila di
    Traiano, Panaghia e Toaca.
  pt: >-
    Um maciço de rocha nua e lendas ancestrais: aqui habitam, segundo a tradição, Baba Dochia, a Águia de
    Trajano, Panaghia e Toaca.
observaciones:
  es: >-
    Solo se puede entrar al parque por los senderos marcados, previo pago de la tasa de visita. Se acampa
    únicamente en los lugares habilitados; en emergencia se permite pernoctar en vivac. Los perros solo pueden
    entrar atados. Las reservas científicas de Ocolașul Mare y Polița cu Crini solo se visitan con permiso
    escrito de la administración.


    Están prohibidos el acceso motorizado, encender fuego, el ruido y recoger setas, bayas o plantas sin
    permiso.
texto:
  es:
    intro: >-
      Cuenta una leyenda del Ceahlău que Satanás quiso llegar al cielo a soplos: sopló un día y una noche,
      amontonó piedras y de ese montón nació el macizo. La geología cuenta otra versión, menos teatral y más
      antigua: un paquete de conglomerados de quinientos a seiscientos metros, formado hace más de cien
      millones de años, que hoy forma torres, agujas y crestas sobre los bosques. El Parque Nacional Ceahlău
      protege 8.396 hectáreas de esa montaña en los Cárpatos Orientales, la más conocida de su parte central,
      y una ley de marzo de 2000 lo declaró área protegida.
    landscape: >-
      El Ceahlău se levanta desde un sistema de crestas dispuestas en radio que convergen en dos puntos mucho
      más altos: Ocolașul Mare (1907 m) y Toaca (1904 m). Debajo, el macizo descansa sobre flysch cretácico
      interno, salvo el sector sudoriental, que pertenece al flysch externo; encima están los conglomerados.


      Entre sus rincones destaca la cascada Duruitoarea, a 1218 m, con dos escalones separados por un umbral
      excavado en la piedra y 25 m de caída. Su nombre viene del retumbo que se oye de lejos, el *duruit* de
      los vecinos. Se llega por tres senderos marcados, en unas dos horas desde Durău.


      Al pie de la montaña, la reserva forestal de Secu protege 776.7 hectáreas junto al embalse de Izvorul
      Muntelui, cerca de Bicaz, con árboles de dimensiones gigantescas y la estructura propia de un bosque
      secular.
    wildlife: >-
      Hay hayedos y robledales, pero también bosques de alerce y pino cembro, bosques de pendiente de tilos y
      arces y, más arriba, matorrales de pino mugo y rododendro. La flora vascular suma 1144 especies, 62
      subespecies y 18 híbridos. Entre las raras protegidas están Asplenium adulterinum, Cypripedium
      calceolus, Campanula serrata, Liparis loeselii y Tozzia carpathica, y entre las endémicas rumanas,
      Aconitum tauricum subsp. hunyadense. La administración cuenta orquídeas del género Nigritella, Dryas
      octopetala y la flor de las nieves, el edelweiss; en el reino de las setas se han registrado 239
      especies de ascomicetos y 512 de basidiomicetos.


      La fauna reúne 30 mamíferos, 18 reptiles y anfibios y 7 peces. Por los senderos pueden verse corzos,
      ciervos, jabalíes, [osos](/especie/ursus_arctos/), [lobos](/especie/canis_lupus/) y hasta
      [linces](/especie/lynx_lynx/); el [rebeco](/especie/rupicapra_rupicapra/) también figura en la fauna del
      macizo. Entre los anfibios y reptiles aparecen sapillos de vientre amarillo, el [tritón de los
      Cárpatos](/especie/triturus_montandoni/), lagartijas de turbera y víboras.


      El macizo es territorio de cría y alimentación para unas 121 especies de aves. A la administración le
      gusta destacar al [pico tridáctilo](/especie/picoides_tridactylus/), al
      [urogallo](/especie/tetrao_urogallus/) y a los cuervos; entre las demás aves figuran el [mirlo
      acuático](/especie/cinclus_cinclus/), el roquero rojo, el [acentor alpino](/especie/prunella_collaris/)
      y el [halcón peregrino](/especie/falco_peregrinus/).


      De mayo a octubre es la temporada. En invierno la montaña pide más cuidado: no se recomienda el tramo de
      Stânca Dochiei a Cabana Dochia ni el de la cascada Duruitoarea a Cabana Dochia.
    visit: >-
      Casi todos los caminos van a parar a Cabana Dochia, en lo alto. La ruta de Durău por Cabana Fântânele es
      la histórica: 7,3 km y 1180 m de desnivel, dificultad media, y abierta ya en 1835 desde el monasterio de
      Durău. La que sube de Durău por la cascada Duruitoarea mide 7,5 km, salva 1240 m y es de dificultad
      media. Desde Izvorul Muntelui hay dos opciones: la ruta que pasa por Piatra cu Apa y Detunatele, de 5,6
      km y 1070 m, y la que sube por Izvorul Alb y Stânca Dochiei, de 5,7 km y 1020 m. La primera lleva entre
      tres horas y media y cuatro de subida, y puede hacerse también en invierno tras informarse del estado
      del tiempo.


      Antes o después de la subida, merece la pena el centro de visitantes de Izvorul Muntelui, en la
      carretera comarcal 155F, justo después del punto de información y cobro. Allí la naturaleza del macizo
      se cuenta con recursos interactivos, hay un cine con un documental y juegos de descubrimiento para
      niños, dentro y en el jardín trasero. Sirve de puerta de entrada para quien no tiene tiempo de subir a
      la cima o prefiere un paseo suave al pie del macizo.
    history: >-
      El Ceahlău tiene patrón y fiesta propios, además de leyendas, entre ellas el mito de Dochia y Trajano.
      En conservación, el macizo forma parte de Natura 2000 como zona de refugio para especies raras y
      amenazadas de interés europeo: se designó por especies como el oso pardo, el lobo y el lince
      euroasiático, y por murciélagos como el pequeño de herradura, el orejudo de Bechstein y el ratonero
      grande. En el mismo terreno se solapan el parque nacional y las reservas de Polița cu Crini y Ocolașul
      Mare.
    before: >-
      Solo se puede entrar al parque por los senderos marcados, previo pago de la tasa de visita. Se acampa
      únicamente en los lugares habilitados; en emergencia se permite pernoctar en vivac. Los perros solo
      pueden entrar atados. Las reservas científicas de Ocolașul Mare y Polița cu Crini solo se visitan con
      permiso escrito de la administración.


      Están prohibidos el acceso motorizado, encender fuego, el ruido y recoger setas, bayas o plantas sin
      permiso.
    around: >-
      A nueve kilómetros están las [Gargantas del Bicaz -
      Hășmaș](/lugar/parcul-national-cheile-bicazului---hasmas/), y a diecisiete kilómetros el [Lago
      Cuejdel](/lugar/lacul-cuejdel/).
  en:
    intro: >-
      In northern Romania, isolated like a limestone bastion above the Moldavian hills, rises Ceahlău: the
      holy mountain, the 'Olympus of Moldavia'. Its bare limestone pinnacle pierces the cloud layer above vast
      slopes of fir and beech, home to bears, wolves, and chamois. The national park protects 8,396 hectares
      of cliffs, virgin woodlands, waterfalls, and alpine clearings, designated as a Natura 2000 special
      protection area for rare European wildlife.
    landscape: >-
      Ceahlău rises from radial ridges converging onto two dominant peaks: Ocolașul Mare (1907 m) and Toaca
      (1904 m). Geologically, the mountain rests upon Cretaceous internal flysch, except in the southeastern
      sector of external flysch, capped by massive conglomerate towers.


      Among its natural wonders, Duruitoarea Waterfall tumbles at 1218 m in two tiers across a rock threshold,
      plunging 25 m. Its name evokes the thunderous roar, the *duruit* heard far across the forest. It is
      reached via three waymarked trails in roughly two hours from Durău.


      At the foot of the range, Secu forest reserve protects 776.7 hectares bordering Izvorul Muntelui
      reservoir near Bicaz, preserving giant trees and the complex structure of a virgin forest.
    wildlife: >-
      Flora ranges from lowland beech and oak woods to larch and Swiss pine groves, ravine forests of linden
      and maple, and subalpine scrub of dwarf pine and mountain rhododendron. Vascular plants total 1144
      species, 62 subspecies, and 18 hybrids. Protected rarities include Asplenium adulterinum, Cypripedium
      calceolus, Campanula serrata, Liparis loeselii, and Tozzia carpathica, alongside Romanian endemics like
      Aconitum tauricum subsp. hunyadense. Park authorities document Nigritella orchids, Dryas octopetala, and
      edelweiss; the fungal kingdom includes 239 ascomycetes and 512 basidiomycetes.


      Vertebrates comprise 30 mammals, 18 reptiles and amphibians, and 7 fish species. Hikers frequently cross
      paths with roe deer, red deer, wild boar, [brown bear](/especie/ursus_arctos/),
      [wolf](/especie/canis_lupus/), and [Eurasian lynx](/especie/lynx_lynx/); the [Tatra
      chamois](/especie/rupicapra_rupicapra/) thrives on limestone pinnacles. Amphibians include
      yellow-bellied toads and the [Carpathian newt](/especie/triturus_montandoni/).


      The range serves as breeding and foraging territory for roughly 121 bird species, notably the
      [three-toed woodpecker](/especie/picoides_tridactylus/), [capercaillie](/especie/tetrao_urogallus/),
      ravens, [white-throated dipper](/especie/cinclus_cinclus/), [alpine
      accentor](/especie/prunella_collaris/), and [peregrine falcon](/especie/falco_peregrinus/).


      May to October offers the best conditions. In winter, caution is required: the trails between Stânca
      Dochiei and Cabana Dochia, and Duruitoarea and Cabana Dochia, are closed.
    visit: >-
      Most hiking routes culminate at Cabana Dochia on the high plateau. The historic route from Durău past
      Cabana Fântânele covers 7.3 km and 1180 m of elevation gain, graded as moderate, first opened in 1835
      from Durău Monastery. The ascent from Durău via Duruitoarea Waterfall measures 7.5 km, climbing 1240 m
      with moderate difficulty. From Izvorul Muntelui two options exist: the trail via Piatra cu Apa and
      Detunatele (5.6 km, 1070 m ascent) and the route via Izvorul Alb and Stânca Dochiei (5.7 km, 1020 m).
      The former takes three and a half to four hours and can be done in winter in stable weather.


      At the mountain foot, the Izvorul Muntelui Visitor Centre on county road 155F, just past the ticket
      station, features interactive exhibits, a documentary cinema, and discovery areas. It is an ideal
      gateway for visitors seeking an introduction or a gentle lowland walk.
    history: >-
      Ceahlău boasts its own feast day, patron saint, and folk legends, including the myth of Baba Dochia and
      Trajan. In conservation, it is integrated into Natura 2000 as a vital haven for species of community
      interest: designated to protect brown bear, wolf, Eurasian lynx, and bats like lesser horseshoe,
      Bechstein's, and greater mouse-eared bats. The national park overlaps with the strict scientific
      reserves of Polița cu Crini and Ocolașul Mare.
    before: >-
      Park entry is permitted only on waymarked paths after paying the visitor fee. Camping is allowed solely
      at designated campsites; bivouacking is allowed only in emergencies. Dogs must be kept on a leash.
      Scientific reserves (Ocolașul Mare, Polița cu Crini) require written park authorization.


      Motorized access, open fires, loud noise, and collecting mushrooms, berries, or plants are strictly
      prohibited.
    around: >-
      Nine kilometres away lies [Bicaz Gorge - Hășmaș National
      Park](/lugar/parcul-national-cheile-bicazului---hasmas/), and seventeen kilometres away is [Lake
      Cuejdel](/lugar/lacul-cuejdel/).
  fr:
    intro: >-
      Au nord de la Roumanie, isolé comme un donjon calcaire au-dessus des collines de Moldavie, s'élève le
      Ceahlău : la montagne sainte, l'« Olympe de Moldavie ». Sa forteresse minérale crève les nuages
      au-dessus de versants de sapins et hêtres abritant ours, loups et chamois. Son parc national protège 8
      396 hectares de falaises, forêts séculaires, cascades et alpages, classé en zone Natura 2000 pour la
      sauvegarde de la faune européenne.
    landscape: >-
      Le Ceahlău déploie des arêtes radiales convergeant vers deux sommets dominants : Ocolașul Mare (1907 m)
      et Toaca (1904 m). Le socle repose sur le flysch crétacé interne, hormis le sud-est sur flysch externe,
      surmonté de tours conglomératiques.


      Parmi ses trésors naturels, la cascade Duruitoarea s'élance à 1218 m en deux ressauts sur une brèche
      rocheuse, pour 25 m de chute. Son nom évoque le grondement sourd, le *duruit*, perçu au loin. On
      l'atteint par trois sentiers en deux heures depuis Durău.


      Au pied du relief, la réserve forestière de Secu protège 776,7 hectares près du lac d'Izvorul Muntelui
      vers Bicaz, conservant des arbres géants et une structure de forêt primaire.
    wildlife: >-
      La flore s'étage des hêtraies de plaine aux mélézins et peuplements de pin cembro, forêts d'érabes et
      tilleuls, puis fourrés de pin mugo et rhododendron. La flore vasculaire compte 1144 espèces, 62
      sous-espèces et 18 hybrides. Les espèces protégées incluent Asplenium adulterinum, Cypripedium
      calceolus, Campanula serrata, Liparis loeselii et Tozzia carpathica, avec l'endémique roumaine Aconitum
      tauricum subsp. hunyadense. On note l'orchidée Nigritella, Dryas octopetala et l'edelweiss ; les
      champignons comptent 239 ascomycètes et 512 basidiomycètes.


      La faune rassemble 30 mammifères, 18 reptiles et amphibiens et 7 poissons. On croise chevreuils, cerfs,
      sangliers, [ours bruns](/especie/ursus_arctos/), [loups](/especie/canis_lupus/) et
      [lynx](/especie/lynx_lynx/) ; le [chamois](/especie/rupicapra_rupicapra/) peuple les falaises.
      Amphibiens et reptiles comptent sonneurs à ventre jaune et [tritons de
      Montandon](/especie/triturus_montandoni/).


      Le massif accueille environ 121 espèces d'oiseaux, dont le [pic
      tridactyle](/especie/picoides_tridactylus/), le [grand tétras](/especie/tetrao_urogallus/), le [cincle
      plongeur](/especie/cinclus_cinclus/), l'[accenteur alpin](/especie/prunella_collaris/) et le [faucon
      pèlerin](/especie/falco_peregrinus/).


      La saison va de mai à octobre. En hiver, prudence : les tronçons vers Cabana Dochia depuis Stânca
      Dochiei et Duruitoarea sont fermés.
    visit: >-
      Presque tous les sentiers mènent à Cabana Dochia sur le plateau. La voie historique depuis Durău par
      Cabana Fântânele compte 7,3 km et 1180 m de dénivelé, ouverte en 1835. La montée par la cascade
      Duruitoarea fait 7,5 km pour 1240 m. Depuis Izvorul Muntelui existent deux variantes : par Piatra cu Apa
      et Detunatele (5,6 km, 1070 m) et par Izvorul Alb et Stânca Dochiei (5,7 km, 1020 m). La première
      demande trois heures et demie à quatre heures et peut se faire en hiver par temps stable.


      Au pied du mont, le centre d'accueil d'Izvorul Muntelui sur la route 155F propose expositions
      interactives, cinéma documentaire et parcours découvertes. Une belle halte pour une initiation douce au
      massif.
    history: >-
      Le Ceahlău célèbre sa propre fête patronale et ses mythes de Dochia et Trajan. En matière de
      conservation, le massif relève de Natura 2000 pour la protection d'habitats d'intérêt communautaire :
      ours brun, loup, lynx et chauves-souris troglophiles. Le parc national englobe les réserves intégrales
      de Polița cu Crini et d'Ocolașul Mare.
    before: >-
      L'accès au parc s'effectue sur les sentiers balisés après acquittement du droit d'entrée. Bivouac
      autorisé uniquement sur les aires désignées. Chiens tenus en laisse. Les réserves scientifiques
      requièrent une autorisation écrite.


      Accès motorisé, feux de camp et cueillette de plantes ou baies sont formellement prohibés.
    around: >-
      À neuf kilomètres se trouvent les [gorges du Bicaz -
      Hășmaș](/lugar/parcul-national-cheile-bicazului---hasmas/) et à dix-sept kilomètres le [lac
      Cuejdel](/lugar/lacul-cuejdel/).
  de:
    intro: >-
      Im Norden Rumäniens, wie eine isolierte Felsenburg über den moldauischen Hügeln aufragend, liegt der
      Ceahlău: der heilige Berg, der 'Olymp der Moldau'. Seine nackte Kalkkrone durchstößt die Wolkenschicht
      über weiten Hängen voller Tannen und Buchen, wo Bären, Wölfe und Gämsen leben. Der Nationalpark schützt
      8.396 Hektar Steilwände, Urwälder, Wasserfälle und Hochmatten, ausgewiesen als Natura-2000-Gebiet für
      seltene europäische Arten.
    landscape: >-
      Der Ceahlău baut sich aus sternförmigen Graten auf, die in zwei dominierenden Gipfeln gipfeln: Ocolașul
      Mare (1907 m) und Toaca (1904 m). Die Basis bildet kreidezeitlicher Flysch, überdeckt von gewaltigen
      Konglomeratpfeilern.


      Zu den Höhepunkten gehört der Duruitoarea-Wasserfall auf 1218 m Höhe, der in zwei Stufen 25 m über eine
      Felswand stürzt. Sein Name rührt vom weithin hörbaren Dröhnen, dem *duruit*. Er ist auf drei Pfaden in
      etwa zwei Stunden von Durău erreichbar.


      Am Gebirgsfuß schützt das Waldreservat Secu 776,7 Hektar am Stausee Izvorul Muntelui nahe Bicaz mit
      mächtigen Baumriesen eines alten Urwalds.
    wildlife: >-
      Die Flora reicht von Buchenwäldern über Lärchen- und Zirbenbestände bis zu Krummholzzonen aus Latsche
      und Alpenrose. Die Gefäßpflanzen umfassen 1144 Arten, 62 Unterarten und 18 Hybride. Geschützt sind
      Asplenium adulterinum, Cypripedium calceolus, Campanula serrata, Liparis loeselii und Tozzia carpathica
      sowie Aconitum tauricum subsp. hunyadense. Es gedeihen Kohlröschen, Dryas octopetala und Edelweiß; Pilze
      zählen 239 Ascomyzeten und 512 Basidiomyzeten.


      Die Wirbeltiere zählen 30 Säugetiere, 18 Kriechtiere und Lurche sowie 7 Fischarten. Wanderer begegnen
      Rehen, Hirschen, Wildschweinen, [Braunbären](/especie/ursus_arctos/), [Wölfen](/especie/canis_lupus/)
      und [Luchsen](/especie/lynx_lynx/); die [Gämse](/especie/rupicapra_rupicapra/) bewohnt Felsgrate. Lurche
      umfassen Gelbbauchunken und [Karpatenmolche](/especie/triturus_montandoni/).


      Das Massiv ernährt rund 121 Vogelarten, darunter [Dreizehenspecht](/especie/picoides_tridactylus/),
      [Auerhuhn](/especie/tetrao_urogallus/), [Wasseramsel](/especie/cinclus_cinclus/),
      [Alpenbraunelle](/especie/prunella_collaris/) und [Wanderfalke](/especie/falco_peregrinus/).


      Saison ist Mai bis Oktober. Im Winter sind die Abschnitte von Stânca Dochiei zur Cabana Dochia und von
      Duruitoarea zur Hütte gesperrt.
    visit: >-
      Fast alle Steige führen zur hochgelegenen Cabana Dochia. Die historische Route ab Durău über die
      Fântânele-Hütte misst 7,3 km und 1180 Höhenmeter, eröffnet 1835 ab dem Kloster Durău. Der Anstieg über
      den Duruitoarea-Fall ist 7,5 km lang bei 1240 Höhenmetern. Ab Izvorul Muntelui gibt es zwei Wege: über
      Piatra cu Apa und Detunatele (5,6 km, 1070 m) sowie über Izvorul Alb und Stânca Dochiei (5,7 km, 1020
      m). Der erste Steig erfordert dreieinhalb bis vier Stunden und ist im Winter bei stabilem Wetter
      machbar.


      Am Bergfuß informiert das Besucherzentrum Izvorul Muntelui an der Straße 155F hinter der Mautstelle mit
      Ausstellungen, Naturkino und Lehrpfaden. Es bietet einen idealen Einstieg für Spaziergänger.
    history: >-
      Der Ceahlău besitzt einen eigenen Schutzpatron und eigene Feiertage sowie volkstümliche Sagen, darunter
      die Mythen um Baba Dochia und Kaiser Trajan. Im Naturschutz bildet das Massiv einen bedeutenden Teil des
      Natura-2000-Netzwerks als Refugium für seltene und gefährdete Arten von europäischem Interesse: Es wurde
      zum Schutz von Braunbär, Wolf und eurasischem Luchs sowie Fledermäusen wie Kleiner Hufeisennase,
      Bechsteinfledermaus und Großem Mausohr ausgewiesen. Auf demselben Areal überlagern sich der Nationalpark
      und die wissenschaftlichen Reservate Polița cu Crini und Ocolașul Mare.
    before: >-
      Zutritt nur auf markierten Wegen nach Ticketkauf. Zelten ausschließlich auf ausgewiesenen Plätzen;
      Notbiwak erlaubt. Hunde anleinen. Die wissenschaftlichen Reservate erfordern eine schriftliche
      Genehmigung.


      Motorisierter Verkehr, Feuer und Sammeln von Pflanzen oder Pilzen sind untersagt.
    around: >-
      Neun Kilometer entfernt liegt die [Bicaz-Klamm –
      Hășmaș](/lugar/parcul-national-cheile-bicazului---hasmas/) und siebzehn Kilometer der
      [Cuejdel-See](/lugar/lacul-cuejdel/).
  it:
    intro: >-
      Nel nord della Romania, isolato come un bastione calcareo sopra le colline moldave, si erge il Ceahlău:
      la montagna sacra, l'« Olimpo della Moldavia ». La sua corona rocciosa buca le nubi sovrastando versanti
      di abeti e faggi che danno asilo a orsi, lupi e camosci. Il parco nazionale tutela 8.396 ettari di rupi,
      foreste secolari, cascate e praterie alpine, incluso nella rete Natura 2000 per salvaguardare specie
      rare europee.
    landscape: >-
      Il Ceahlău si sviluppa su dorsali radiali che convergono verso due cime principali: Ocolașul Mare (1907
      m) e Toaca (1904 m). La struttura poggia su flysch cretacico interno, salvo il settore sud-orientale su
      flysch esterno, sormontato da torri conglomeratiche.


      Tra le bellezze naturali risalta la cascata Duruitoarea a 1218 m di quota, che compie un salto di 25 m
      in due balzi su una soglia rocciosa. Il nome richiama il boato fragoroso, il *duruit*, udibile da
      lontano. Si raggiunge su tre sentieri segnati in due ore da Durău.


      Ai piedi del monte, la riserva forestale di Secu protegge 776,7 ettari lungo l'invaso di Izvorul
      Muntelui presso Bicaz, preservando alberi monumentali e fisionomie vetuste.
    wildlife: >-
      La vegetazione sale dalle faggete basali a popolamenti di larice e pino cembro, boschi di forra con
      tigli e aceri, sino alle mughete e ai rododendri. La flora vascolare conta 1144 specie, 62 sottospecie e
      18 ibridi. Tra le rarità protette figurano Asplenium adulterinum, Cypripedium calceolus, Campanula
      serrata, Liparis loeselii e Tozzia carpathica, con l'endemismo Aconitum tauricum subsp. hunyadense.
      Fioriscono orchidee Nigritella, Dryas octopetala e stella alpina; i funghi contano 239 ascomiceti e 512
      basidiomiceti.


      La fauna vanta 30 mammiferi, 18 rettili e anfibi e 7 pesci. Si osservano caprioli, cervi, cinghiali,
      [orsi bruni](/especie/ursus_arctos/), [lupi](/especie/canis_lupus/) e [linci](/especie/lynx_lynx/); il
      [camoscio](/especie/rupicapra_rupicapra/) popola le rupi. Tra gli anfibi figurano ululoni e [tritoni dei
      Carpazi](/especie/triturus_montandoni/).


      Il massiccio ospita circa 121 specie di uccelli, tra cui [picchio
      tridattilo](/especie/picoides_tridactylus/), [gallo cedrone](/especie/tetrao_urogallus/), [merlo
      acquaiolo](/especie/cinclus_cinclus/), [sordone](/especie/prunella_collaris/) e [falco
      pellegrino](/especie/falco_peregrinus/).


      Stagione da maggio a ottobre. In inverno i tratti per Cabana Dochia da Stânca Dochiei e Duruitoarea sono
      sconsigliati o chiusi.
    visit: >-
      Quasi tutti i percorsi raggiungono la Cabana Dochia sull'altopiano sommitale. L'itinerario storico da
      Durău per Cabana Fântânele misura 7,3 km e 1180 m di dislivello, aperto nel 1835 dal monastero di Durău.
      La salita da Durău per la cascata Duruitoarea conta 7,5 km per 1240 m. Da Izvorul Muntelui vi sono due
      percorsi: per Piatra cu Apa e Detunatele (5,6 km, 1070 m) e per Izvorul Alb e Stânca Dochiei (5,7 km,
      1020 m). Il primo impegna da tre ore e mezza a quattro ore ed è praticabile anche in inverno.


      Alla base, il centro visite di Izvorul Muntelui lungo la strada 155F offre percorsi didattici
      interattivi, sala cinema e giardini didattici, fungendo da ottima alternativa per una passeggiata dolce.
    history: >-
      Il Ceahlău vanta un proprio santo patrono e proprie festività, oltre a leggende popolari come il mito di
      Baba Dochia e dell'imperatore Traiano. Sul piano della conservazione, il massiccio fa parte della rete
      Natura 2000 quale rifugio per specie rare e minacciate di interesse europeo: è stato designato per la
      presenza dell'orso bruno, del lupo e della lince eurasiatica, e per chirotteri quali il ferro di cavallo
      minore, il vespertilio di Bechstein e il vespertilio maggiore. Sul medesimo comprensorio si
      sovrappongono il parco nazionale e le riserve scientifiche di Polița cu Crini e Ocolașul Mare.
    before: >-
      Accesso consentito unicamente sui tracciati segnati previo pagamento del biglietto. Bivacco solo nelle
      aree adibite. Cani al guinzaglio. Le riserve scientifiche richiedono autorizzazione scritta.


      Vietati mezzi a motore, accensione fuochi e raccolta non autorizzata di funghi o piante.
    around: >-
      A nove chilometri sorgono le [Gole di Bicaz - Hășmaș](/lugar/parcul-national-cheile-bicazului---hasmas/)
      e a diciassette chilometri il [Lago Cuejdel](/lugar/lacul-cuejdel/).
  pt:
    intro: >-
      No norte da Roménia, isolado como um baluarte calcário sobre as colinas da Moldávia, ergue-se o Ceahlău:
      a montanha sagrada, o 'Olimpo da Moldávia'. A sua fortaleza mineral rasga as nuvens acima de encostas
      povoadas por ursos, lobos e camurças. O parque nacional resguarda 8.396 hectares de penhascos, florestas
      seculares, cascatas e prados alpinos, classificado na rede Natura 2000 para a conservação de espécies
      europeias ameaçadas.
    landscape: >-
      O Ceahlău projeta cristas radiais que convergem em dois picos supremos: Ocolașul Mare (1907 m) e Toaca
      (1904 m). A montanha assenta sobre flysch cretácico, com torres maciças de conglomerado no topo.


      Entre as suas atrações naturais sobressai a cascata Duruitoarea a 1218 m de altitude, que se precipita
      em dois degraus ao longo de 25 m de desnível. O seu nome provém do rugido forte, o *duruit* escutado à
      distância. É acessível por três caminhos marcados em cerca de duas horas a partir de Durău.


      Na base da montanha, a reserva florestal de Secu protege 776,7 hectares junto à albufeira de Izvorul
      Muntelui, preservando árvores colossais de bosque virgem.
    wildlife: >-
      A vegetação escalona-se desde os faiais basais até bosquetes de lariço e pinheiro-suíço, matas de tília
      e ácer e matagais de pinheiro-anão e rododendro. A flora vascular soma 1144 espécies, 62 subespécies e
      18 híbridos. Entre as espécies protegidas contam-se Asplenium adulterinum, Cypripedium calceolus,
      Campanula serrata, Liparis loeselii e Tozzia carpathica, a par do endemismo Aconitum tauricum subsp.
      hunyadense. Florescem orquídeas Nigritella, Dryas octopetala e edelvaisse; os fungos reúnem 239
      ascomicetas e 512 basidiomicetas.


      A fauna inclui 30 mamíferos, 18 répteis e anfíbios e 7 peixes. Nos caminhos observam-se corços, veados,
      javalis, [ursos-pardos](/especie/ursus_arctos/), [lobos](/especie/canis_lupus/) e
      [linces](/especie/lynx_lynx/); a [camurça](/especie/rupicapra_rupicapra/) habita as cristas. Entre os
      anfíbios destacam-se o bombina-de-barriga-amarela e o
      [tritão-dos-cárpatos](/especie/triturus_montandoni/).


      O maciço acolhe cerca de 121 espécies de aves, incluindo o
      [pica-pau-tridáctilo](/especie/picoides_tridactylus/), o [tetraz-grande](/especie/tetrao_urogallus/), o
      [melro-d'água](/especie/cinclus_cinclus/), a [ferreirinha-alpina](/especie/prunella_collaris/) e o
      [falcão-peregrino](/especie/falco_peregrinus/).


      A época decorre de maio a outubro. No inverno os troços para Cabana Dochia a partir de Stânca Dochiei e
      Duruitoarea encerram.
    visit: >-
      A maior parte dos trilhos conduz à Cabana Dochia no planalto. O trilho histórico desde Durău pela Cabana
      Fântânele tem 7,3 km e 1180 m de desnível, inaugurado em 1835 pelo mosteiro de Durău. A subida por
      Duruitoarea mede 7,5 km com 1240 m de subida. Desde Izvorul Muntelui há duas vias: por Piatra cu Apa e
      Detunatele (5,6 km, 1070 m) e por Izvorul Alb e Stânca Dochiei (5,7 km, 1020 m). O primeiro percurso
      requer três horas e meia a quatro horas e pode fazer-se no inverno com tempo firme.


      Na base, o centro de visitantes de Izvorul Muntelui na estrada 155F disponibiliza exposições multimédia
      e percursos interpretativos para quem prefere passeios suaves.
    history: >-
      O Ceahlău possui padroeiro e celebrações próprias, além de lendas populares, entre as quais o mito de
      Baba Dochia e do imperador Trajano. No âmbito da conservação, o maciço integra a rede Natura 2000 como
      zona de refúgio para espécies raras e ameaçadas de interesse europeu: foi classificado por espécies como
      o urso-pardo, o lobo e o lince-euroasiático, e por morcegos como o morcego-de-ferradura-pequeno, o
      morcego de Bechstein e o morcego-rato-grande. No mesmo território sobrepõem-se o parque nacional e as
      reservas científicas de Polița cu Crini e Ocolașul Mare.
    before: >-
      A entrada no parque só é permitida pelos trilhos pedestres assinalados, mediante o pagamento prévio da
      taxa de visitante. O acampamento só é permitido nos locais devidamente autorizados e sinalizados; em
      caso de emergência permite-se a pernoita em bivaque. Os cães só podem circular obrigatoriamente presos
      por trela. As reservas científicas de Ocolașul Mare e Polița cu Crini só podem ser visitadas com
      autorização escrita da administração do parque.


      São expressamente proibidos o acesso motorizado, fogueiras, ruído e a apanha de cogumelos, bagas ou
      plantas sem licença.
    around: >-
      A nove quilómetros situam-se as [Gargantas de Bicaz -
      Hășmaș](/lugar/parcul-national-cheile-bicazului---hasmas/) e a dezassete quilómetros o [Lago
      Cuejdel](/lugar/lacul-cuejdel/).
