resumen:
  es: Mosaico de turberas de tipo tundra boreal y lagos de agua dulce en la llanura de Polesie.
  en: A mosaic of boreal tundra-like peatlands and freshwater lakes in the Polesie Plain.
  fr: Mosaïque de tourbières d'allure boréale et de lacs d'eau douce dans la plaine de Polésie.
  de: Mosaik aus tundraartigen Hochmooren und Süsswasserseen in der Ebene von Polesien.
  it: Mosaico di torbiere di tipo tundra boreale e laghi d'acqua dolce nella pianura della Polesia.
  pt: Mosaico de turfeiras de feição tundra e lagoas de água doce na planície da Polésia.
unico:
  es: >-
    Es el santuario principal del galápago europeo en Polonia, rodeado de turberas, lagos y un pedazo de
    tundra.
  en: >-
    It is the primary sanctuary of the European pond turtle in Poland, enveloped by peat bogs, dystrophic
    lakes, and an isolated fragment of boreal tundra.
  fr: >-
    C'est le sanctuaire principal de la cistude d'Europe en Pologne, entouré de tourbières, de lacs et d'une
    avancée de toundra boréale.
  de: >-
    Er ist das Hauptrefugium der Europäischen Sumpfschildkröte in Polen, umgeben von Mooren, Seen und einem
    Reliktareal borealer Tundra.
  it: >-
    È il principale santuario della testuggine palustre europea in Polonia, circondato da torbiere, laghi e un
    lembo di tundra boreale.
  pt: >-
    É o santuário principal do cágado-de-carapaça-estriada na Polónia, rodeado de turfeiras, lagoas e uma
    mancha relíquia de tundra boreal.
observaciones:
  es: >-
    Comprueba en la web del parque si los centros de visitantes están abiertos antes de ir. Los senderos
    tienen pasarelas, torres y embarcaderos; lleva calzado para suelo húmedo.
texto:
  es:
    intro: >-
      Hay un rincón de Polonia donde el suelo es casi todo turba y el horizonte, plano. En la parte occidental
      de Polesie, las ciénagas, los lagos de meandro y los bosques naturales ocupan una llanura sin apenas
      relieve, y en ella se puede ver algo que no esperarías: una especie de tundra, la más avanzada hacia el
      suroeste de Europa. Es el Parque Nacional de Polesie, creado el 1 de mayo de 1990 y con 9760,2864 ha, y
      su símbolo es la grulla.


      Forma parte de la Reserva de la Biosfera de Polesie Occidental y el Convenio de Ramsar lo protege como
      humedal importante. Esos ecosistemas de ciénaga se han desarrollado sin intervención humana desde que se
      retiró la última glaciación.
    landscape: >-
      Casi todo el parque son llanuras de turba, de relieve mayormente llano, con ciénagas, turberas y lagos
      de meandro. Aquí no hay montaña ni cañón: el paisaje se lee en la superficie del agua, en los carrizales
      y en las manchas de abedulares.


      Los bosques son sobre todo abedulares de ciénaga, pinares pobres y alisedas pantanosas. Hay cerca de mil
      plantas vasculares, 170 de ellas raras y 81 protegidas, y entre los relictos de la edad de hielo están
      el abedul enano y los sauces laponés y de hoja de arándano.
    wildlife: >-
      Se han registrado unas 290 especies de vertebrados. Las aves son lo más vistoso: unas doscientas
      especies, de las que unas ciento cincuenta crían. El avetoro tiene aquí la mayor densidad de Polonia, la
      buscarla acuática forma la tercera mayor población del país, y un programa de introducción ha dado al
      parque una población bastante numerosa de gallo lira. Anida el pigargo, y entre las rapaces nocturnas
      está el búho real.


      Entre los mamíferos, 48 especies; el castor fue introducido en 1992 y entre los ungulados predomina el
      corzo, con unos ochocientos ejemplares, además de ciervos, alces y jabalíes.


      El galápago europeo, el *żółw błotny*, es el protagonista silencioso. Es una especie relicta y una de
      las más amenazadas de Polonia entre los reptiles, y es una de las siete especies de reptiles del parque.
      Hay trece de anfibios, con ranas pardas y verdes muy numerosas, y 21 de peces, cuatro de ellos
      protegidos. Entre los invertebrados están la sanguijuela medicinal y mariposas de interés europeo como
      *Euphydryas aurinia* y *Phengaris teleius*.


      De mayo a octubre es la mejor época. Las dos torres de la ruta Perehod facilitan ver aves limícolas y
      acuáticas, sobre todo en primavera y verano.
    visit: >-
      El sendero Dąb Dominik parte de Kolonia Łomnica y ofrece un recorrido corto de dos kilómetros y medio,
      con una variante larga de tres y medio hasta Jamniki. Atraviesa distintos bosques y turberas en torno al
      lago Moszne, y por el camino aparecen droseras insectívoras, orquídeas en flor y arándano de los
      pantanos.


      Para aves, la ruta Perehod recorre unos cinco kilómetros entre los estanques de Pieszowola, con dos
      torres y un refugio de observación, y es especialmente interesante durante las migraciones. La torre de
      la ruta Obóz Powstańczy es un punto para ver aves, alces, corzos y jabalíes. En bicicleta, la ruta
      Mietiułka recorre veintiún kilómetros de bosques, praderas y el río Mietiułka, cerca de la turbera Durne
      Bagno. Los senderos del parque incorporan paneles educativos, pasarelas, embarcaderos y torres de
      observación.


      Hay dos centros. El de Stare Załucze reúne un museo con piezas arqueológicas, etnográficas, históricas y
      naturales, un cobertizo con objetos grandes, el sendero Żółwik con un estanque, un centro de
      rehabilitación de animales con pajarera y un refugio con lugar para hacer fuego. El de Urszulin tiene el
      «Ośrodek Ochrony Żółwia Błotnego», donde de septiembre a mayo se pueden ver galápagos jóvenes, y un
      jardín didáctico.
    history: >-
      El botánico Władysław Szafer propuso en 1933 un parque nacional en la parte polaca de Polesie. Antes de
      que existiera, entre 1966 y 1982 se salvaron cuatro reservas: Durne Bagno, Jezioro Moszne, Jezioro
      Długie y Torfowisko Orłowskie. No se pudo salvar el gran complejo de Krowie Bagno, que se drenó y se
      convirtió en pastizal.
    before: >-
      Comprueba en la web del parque si los centros de visitantes están abiertos antes de ir. Los senderos
      tienen pasarelas, torres y embarcaderos; lleva calzado para suelo húmedo.
    around: >-
      No hay lugares del atlas a pocos kilómetros, pero el [Parque Nacional de Hortobágy - La Puszta
      Húngara](/lugar/hortobagyi-nemzeti-park---puszta/) comparte con Polesie el galápago europeo, la grulla y
      los humedales; la [Reserva Científica del Bajo Prut](/lugar/rezervatia-stiintifica-prutul-de-jos/)
      comparte el galápago y los lagos, y [The Flow Country — turberas de Caithness y
      Sutherland](/lugar/the-flow-country/) comparte el cisne cantor y las turberas.
  en:
    intro: >-
      There is a tranquil corner of Poland where the ground consists almost entirely of peat and the horizon
      stretches endlessly flat. In western Polesie, swamps, oxbow lakes, and natural forest tracts blanket a
      low-lying plain without discernible relief, harbouring something you would hardly anticipate: a living
      pocket of tundra, the south-westernmost outpost of its kind in Europe. This is Polesie National Park,
      created on 1 May 1990 and spanning 9760.2864 ha, with the common crane serving as its official symbol.


      It forms the core of the West Polesie Biosphere Reserve and is protected under the Ramsar Convention as
      an internationally important wetland. These mire ecosystems have evolved without human drainage since
      the retreat of the last Pleistocene glaciation.
    landscape: >-
      Nearly the entire park comprises extensive peat plains, featuring predominantly level relief patterned
      with marshes, raised bogs, and oxbow waterbodies. Here you will find neither crags nor ravines: the
      landscape reveals itself across shimmering water surfaces, waving reedbeds, and pale thickets of downy
      birch.


      The woodlands are dominated by bog birch carrs, nutrient-poor pine stands, and waterlogged alder carrs.
      Close to a thousand vascular plant species have been recorded, 170 of them rare and 81 strictly
      protected, with glacial relicts featuring dwarf birch (*Betula nana*), Lapland willow (*Salix
      lapponum*), and bilberry willow (*Salix myrtilloides*).
    wildlife: >-
      Some 290 vertebrate species have been documented within the park. Birds provide the greatest spectacle:
      around two hundred species recorded, of which approximately one hundred and fifty breed locally. The
      Eurasian bittern attains its highest breeding density in Poland here; the aquatic warbler sustains its
      third-largest national population; and an active conservation reintroduction program has established a
      thriving population of black grouse. The white-tailed eagle nests in mature stands, alongside nocturnal
      raptors such as the Eurasian eagle-owl.


      Mammals number 48 species; the Eurasian beaver was reintroduced in 1992, while European roe deer
      represents the dominant wild ungulate with some eight hundred individuals, alongside red deer, elk, and
      wild boar.


      The European pond turtle (*żółw błotny*) is the discreet flagship of Polesie. A glacial relict and one
      of the most critically endangered reptiles in Poland, it is one of seven reptile species recorded in the
      park. Thirteen amphibian species populate the wetlands, with green and brown frogs occurring in enormous
      numbers, alongside 21 fish species, four of which enjoy legal protection. Rare invertebrates include the
      medicinal leech and wetland butterflies of European conservation priority such as *Euphydryas aurinia*
      and *Phengaris teleius*.


      May to October offers the finest conditions for exploration. The two observation towers along the
      Perehod route facilitate watching waders and waterfowl, especially during spring and summer.
    visit: >-
      The Dąb Dominik trail departs from Kolonia Łomnica, offering a short loop of two and a half kilometres,
      with a longer variant of three and a half extending to Jamniki. It winds through contrasting forest
      stands and peat bogs encircling Lake Moszne, where carnivorous sundews, flowering wild orchids, and bog
      bilberries line the boardwalks.


      For birdwatching, the Perehod trail runs for roughly five kilometres among the Pieszowola fishponds,
      equipped with two viewing towers and a sheltered observation hide, proving particularly rewarding during
      spring and autumn migrations. The observation tower on the Obóz Powstańczy trail provides a panoramic
      vantage point for scanning for waterbirds, elk, roe deer, and wild boar. Cyclists can follow the
      Mietiułka bike trail, covering twenty-one kilometres of woodland tracks, wet meadows, and the course of
      the Mietiułka River near the Durne Bagno peat bog reserve. Trails across the park feature educational
      panels, boardwalks, jetties, and viewing towers.


      Two visitor centres welcome travellers. The centre in Stare Załucze features a museum exhibiting
      archaeological, ethnographic, and natural history artefacts, an open-air pavilion for historical farm
      gear, the educational Żółwik pond path, a wildlife rehabilitation centre with an aviary, and a covered
      picnic shelter with a fire pit. The administrative centre in Urszulin houses the Turtle Protection
      Centre (*Ośrodek Ochrony Żółwia Błotnego*), where juvenile European pond turtles can be observed from
      September to May, alongside an educational botanical garden.
    history: >-
      The eminent botanist Władysław Szafer first proposed establishing a national park across Polish Polesie
      in 1933. Prior to the park's formal declaration, four strict nature reserves were successfully preserved
      between 1966 and 1982: Durne Bagno, Jezioro Moszne, Jezioro Długie, and Torfowisko Orłowskie. Sadly, the
      vast adjacent peatland complex of Krowie Bagno could not be saved, having been drained and converted to
      intensive grassland.
    before: >-
      Check visitor centre opening hours on the official park website before travelling. The trails feature
      wooden boardwalks, viewing towers, and jetties; bring footwear suitable for wet ground.
    around: >-
      While no atlas sites lie in the immediate vicinity, [Hortobágy National Park - The
      Puszta](/lugar/hortobagyi-nemzeti-park---puszta/) shares with Polesie the European pond turtle, common
      crane, and extensive wetlands; the [Lower Prut Scientific
      Reserve](/lugar/rezervatia-stiintifica-prutul-de-jos/) shares pond turtles and floodplain lakes; and
      [The Flow Country — Caithness and Sutherland Peatlands](/lugar/the-flow-country/) shares whooper swans
      and expansive blanket bogs.
  fr:
    intro: >-
      Il est un coin de Pologne où le sol n'est presque que tourbe et l'horizon, infiniment plat. Dans la
      partie occidentale de la Polésie, les marais, les bras morts et les forêts naturelles occupent une
      plaine sans relief où l'on découvre un paysage inattendu : une avancée de toundra, la plus avancée vers
      le sud-ouest de l'Europe. C'est le parc national de Polesie, créé le 1 mai 1990 et couvrant 9760.2864
      ha, dont l'emblème est la grue cendrée.


      Il constitue le cœur de la réserve de biosphère de Polésie occidentale et la convention de Ramsar le
      protège comme zone humide d'importance internationale. Ces écosystèmes marécageux ont évolué sans
      intervention humaine depuis le retrait de la dernière glaciation.
    landscape: >-
      La quasi-totalité du parc est formée de plaines tourbeuses au relief parfaitement plat, ponctuées de
      marais, de tourbières bombées et de méandres abandonnés. Ici, ni rocher ni défilé : le paysage se lit à
      la surface des eaux, dans les roselières et les bouquets de bouleaux.


      Les boisements se composent principalement de bétulaies marécageuses, de pinèdes sur sables pauvres et
      d'aulnaies fangeuses. On y dénombre près de mille plantes vasculaires, dont 170 rares et 81 protégées,
      avec des reliques glaciaires telles que le bouleau nain, le saule de Laponie et le saule à feuilles de
      myrtille.
    wildlife: >-
      Environ 290 espèces de vertébrés ont été inventoriées. Les oiseaux offrent le spectacle le plus
      saisissant : quelque deux cents espèces observées, dont environ cent cinquante nicheuses. Le butor
      étoilé y présente la plus forte densité de Pologne, la phragmite aquatique y maintient sa troisième
      population nationale, et un programme d'élevage a permis de reconstituer une belle population de tétras
      lyre. Le pygargue à queue blanche y niche, et parmi les rapaces nocturnes figure le grand-duc d'Europe.


      Chez les mammifères, 48 espèces sont recensées ; le castor d'Eurasie a été réintroduit en 1992 et le
      chevreuil domine parmi les ongulés avec quelque huit cents individus, aux côtés du cerf élaphe, de
      l'élan et du sanglier.


      La cistude d'Europe, le *żółw błotny*, en est l'habitant le plus emblématique. Espèce relicte et l'un
      des reptiles les plus menacés de Pologne, elle compte parmi les sept espèces de reptiles du parc. On
      recense treize amphibiens, avec d'innombrables grenouilles rousses et vertes, et 21 espèces de poissons
      dont quatre protégées. Parmi les invertébrés se trouvent la sangsue officinale et des papillons
      d'intérêt communautaire tels que *Euphydryas aurinia* et *Phengaris teleius*.


      La période de mai à octobre est la plus propice. Les deux tours de guet du parcours Perehod facilitent
      l'observation des échassiers et des canards, surtout au printemps et en été.
    visit: >-
      Le sentier Dąb Dominik part de Kolonia Łomnica et propose une petite boucle de deux kilomètres et demi,
      avec une variante longue de trois et demi jusqu'à Jamniki. Il traverse divers boisements et tourbières
      autour du lac Moszne, où l'on observe droséras carnivores, orchidées fleuries et canneberges.


      Pour l'avifaune, l'itinéraire Perehod s'étire sur environ cinq kilomètres entre les étangs piscicoles de
      Pieszowola, équipé de deux tours et d'un observatoire couvert, remarquable lors des migrations. La tour
      du sentier Obóz Powstańczy offre une belle vue sur les oiseaux, élans, chevreuils et sangliers. À vélo,
      la piste Mietiułka parcourt vingt-et-un kilomètres à travers bois, prairies humides et le cours de la
      Mietiułka, près de la tourbière de Durne Bagno. Les sentiers du parc sont jalonnés de panneaux
      didactiques, de passerelles en bois, de pontons et de tours d'observation.


      Le parc compte deux centres d'accueil. Celui de Stare Załucze réunit un musée aux collections
      archéologiques, ethnographiques et naturalistes, un hangar d'outillage ancien, le sentier Żółwik
      longeant une mare, un centre de soins de la faune avec volière et une aire de pique-nique avec foyer.
      Celui d'Urszulin abrite le centre de protection de la cistude (*Ośrodek Ochrony Żółwia Błotnego*), où
      l'on peut voir de jeunes tortues de septembre à mai, ainsi qu'un jardin pédagogique.
    history: >-
      Le botaniste Władysław Szafer proposa dès 1933 la création d'un parc national dans la Polésie polonaise.
      Avant son officialisation, quatre réserves furent sanctuarisées entre 1966 et 1982 : Durne Bagno,
      Jezioro Moszne, Jezioro Długie et Torfowisko Orłowskie. En revanche, le vaste complexe de Krowie Bagno
      n'a pu être sauvé, ayant été drainé et converti en prairies d'élevage.
    before: >-
      Vérifiez sur le site officiel du parc l'ouverture des centres d'accueil avant votre visite. Les chemins
      comportent platelages, tours et pontons ; prévoyez des chaussures adaptées aux zones humides.
    around: >-
      Sans site voisin immédiat dans l'atlas, le [Parc national de Hortobágy - La Puszta
      hongroise](/lugar/hortobagyi-nemzeti-park---puszta/) partage avec Polesie la cistude d'Europe, la grue
      et les milieux humides ; la [Réserve scientifique du
      Bas-Prut](/lugar/rezervatia-stiintifica-prutul-de-jos/) partage la cistude et les chapelets de lacs ; et
      [The Flow Country — tourbières de Caithness et Sutherland](/lugar/the-flow-country/) partage le cygne
      chanteur et les tourbières boréales.
  de:
    intro: >-
      Es gibt einen Winkel in Polen, wo der Boden fast ausschliesslich aus Torf besteht und der Horizont
      endlos flach verläuft. Im westlichen Teil Polesiens breiten sich Moore, Altwasserseen und naturnahe
      Wälder über eine vollkommen ebene Landschaft aus und bergen etwas Unerwartetes: eine Art
      Tundra-Landschaft, den südwestlichsten Vorposten dieser Art in ganz Europa. Es ist der Nationalpark
      Polesie, gegründet am 1. Mai 1990 mit 9760.2864 ha Fläche, dessen Wappenvogel der Kranich ist.


      Er bildet das Kerngebiet des Biosphärenreservats West-Polesien und ist unter der Ramsar-Konvention als
      Feuchtgebiet von internationaler Bedeutung geschützt. Diese Moorökosysteme entwickelten sich seit dem
      Rückzug des Eises ohne menschliche Entwässerungseingriffe.
    landscape: >-
      Fast die gesamte Parkfläche besteht aus weiten Torfmooren mit flachem Relief, durchsetzt von Sümpfen,
      Zwischenmooren und Altwassern. Hier gibt es weder Felsen noch Schluchten: Die Landschaft erschliesst
      sich auf den Wasserflächen, im Röhricht und in den Moorbirkenhainen.


      Die Wälder bestehen vor allem aus Moor-Birkenwäldern, armen Kiefernforsten und sumpfigen Erlenbrüchen.
      Fast tausend Gefässpflanzenarten wurden nachgewiesen, davon 170 selten und 81 geschützt; zu den
      Eiszeitrelikten gehören Zwergbirke, Lappland-Weide und Heidelbeer-Weide.
    wildlife: >-
      Es wurden rund 290 Wirbeltierarten erfasst. Die Vögel bieten das eindrucksvollste Schauspiel: rund
      zweihundert Arten, von denen etwa einhundertfünfzig im Gebiet brüten. Die Rohrdommel erreicht hier ihre
      höchste Siedlungsdichte in Polen, der Seggenrohrsänger stellt das drittgrösste Vorkommen des Landes, und
      ein Zuchtprogramm brachte dem Park eine stattliche Birkhuhnpopulation ein. Der Seeadler horstet im
      Gebiet, unter den Eulen ist der Uhu vertreten.


      Unter den Säugetieren leben 48 Arten; der Biber wurde 1992 wieder angesiedelt, und beim Schalenwild
      dominiert das Reh mit rund achthundert Tieren neben Rothirsch, Elch und Wildschwein.


      Die Europäische Sumpfschildkröte (*żółw błotny*) ist die stille Leitart. Sie ist ein Eiszeitrelikt und
      zählt zu den am stärksten bedrohten Reptilien Polens; sie ist eine von sieben Reptilienarten des Parks.
      Dreizehn Amphibienarten mit unzähligen Braun- und Grünfröschen sowie 21 Fischarten, davon vier
      geschützt, komplettieren die Wasserfauna. Bei den Wirbellosen finden sich der Medizinische Blutegel
      sowie Tagfalter von europäischer Bedeutung wie *Euphydryas aurinia* und *Phengaris teleius*.


      Von Mai bis Oktober ist die günstigste Zeit. Die beiden Beobachtungstürme der Route Perehod erleichtern
      das Beobachten von Wat- und Wasservögeln im Frühjahr und Sommer.
    visit: >-
      Der Lehrpfad Dąb Dominik beginnt in Kolonia Łomnica und bietet eine kurze Runde von zweieinhalb
      Kilometern sowie eine lange Variante von dreieinhalb Kilometern nach Jamniki. Er führt durch Moorwälder
      um den Moszne-See, gesäumt von fleischfressendem Sonnentau, Orchideen und Moosbeeren.


      Für Vogelkundler führt der Pfad Perehod über rund fünf Kilometer durch die Fischteiche von Pieszowola,
      ausgestattet mit zwei Türmen und einer Beobachtungshütte, besonders lohnend während des Vogelzugs. Der
      Aussichtsturm am Weg Obóz Powstańczy bietet Blicke auf Vögel, Elche, Rehe und Wildschweine. Mit dem Rad
      erschliesst die Mietiułka-Route einundzwanzig Kilometer Waldwege, Feuchtwiesen und den gleichnamigen
      Fluss nahe dem Moor Durne Bagno. Die Parkwege sind mit Infotafeln, Holzbohlenwegen, Stegen und Türmen
      ausgebaut.


      Zwei Besucherzentren stehen offen: jenes in Stare Załucze mit Museum für Archäologie, Volkskunde und
      Naturgeschichte, Schauunterstand, dem Schildkrötenpfad Żółwik, Wildtierpflegestation und Grillplatz;
      jenes in Urszulin mit der Schildkröten-Aufzuchtstation (*Ośrodek Ochrony Żółwia Błotnego*), wo von
      September bis Mai Jungschildkröten zu sehen sind, samt Lehrgarten.
    history: >-
      Der Botaniker Władysław Szafer regte 1933 erstmals einen Nationalpark im polnischen Polesien an. Vor
      seiner Gründung wurden zwischen 1966 und 1982 vier Naturschutzgebiete gesichert: Durne Bagno, Jezioro
      Moszne, Jezioro Długie und Torfowisko Orłowskie. Das gewaltige Krowie Bagno konnte hingegen nicht
      gerettet werden und fiel der Melioration zum Opfer.
    before: >-
      Informiere dich vorab auf der Park-Website über die Öffnungszeiten der Besucherzentren. Die Wege führen
      über Holzbohlen und Stege; wasserfestes Schuhwerk wird empfohlen.
    around: >-
      In weiterer Entfernung teilt der [Nationalpark Hortobágy - Die ungarische
      Puszta](/lugar/hortobagyi-nemzeti-park---puszta/) mit Polesie Sumpfschildkröten, Kraniche und
      Feuchtgebiete; das [Wissenschaftliche Reservat Unterer
      Pruth](/lugar/rezervatia-stiintifica-prutul-de-jos/) teilt Sumpfschildkröten und Seenketten; und [The
      Flow Country — Caithness and Sutherland Peatlands](/lugar/the-flow-country/) teilt Singschwäne und
      boreale Moorflächen.
  it:
    intro: >-
      C'è un angolo di Polonia dove il suolo è quasi interamente torba e l'orizzonte si stende piatto
      all'infinito. Nella parte occidentale della Polesia, acquitrini, lanche fluviali e boschi naturali
      occupano una pianura priva di rilievi, custodendo qualcosa di inatteso: una stazione relitta di tundra,
      la più avanzata verso il sud-ovest dell'Europa. È il Parco Nazionale di Polesie, istituito il 1 maggio
      1990 su 9760.2864 ha, con la gru cenerina come emblema ufficiale.


      Forma il cuore della Riserva della Biosfera della Polesia Occidentale ed è tutelato dalla Convenzione di
      Ramsar come zona umida di rilevanza internazionale. Questi ambienti palustri si sono evoluti senza
      interventi di bonifica dal ritiro dell'ultima glaciazione.
    landscape: >-
      La quasi totalità del parco è costituita da distese torbose a morfologia piana, intessute di paludi,
      torbiere alte e laghetti meandriformi. Qui non si incontrano creste o forre: il paesaggio si coglie a
      pelo d'acqua, nei canneti e nelle macchie di betulla pubescente.


      I boschi sono soprattutto betuleti palustri, pinete rade su suoli acidi e ontanete allagate. Si contano
      quasi mille piante vascolari, di cui 170 rare e 81 rigorosamente protette; tra i relitti dell'era
      glaciale figurano la betulla nana e i salici lappone e a foglie di mirtillo.
    wildlife: >-
      Sono state censite circa 290 specie di vertebrati. Gli uccelli regalano i momenti più entusiasmanti:
      circa duecento specie documentate, di cui circa centocinquanta nidificanti. Il tarabuso comune raggiunge
      qui la massima densità nidificante della Polonia, il pagliarolo sostiene la terza popolazione del paese
      e un progetto di riproduzione ha donato al parco una cospicua popolazione di fagiano di monte. Vi
      nidifica l'aquila di mare, affiancata tra i rapaci notturni dal gufo reale.


      I mammiferi contano 48 specie; il castoro europeo è stato reintrodotto nel 1992 e tra gli ungulati
      prevale il capriolo con circa ottocento capi, assieme a cervi, alci e cinghiali.


      La testuggine palustre europea (*żółw błotny*) ne è la protagonista silenziosa. Specie relitta e tra i
      rettili più minacciati della Polonia, è una delle sette specie erpetologiche del parco. Si registrano
      tredici anfibi, con rane rosse e verdi numerosissime, e 21 specie di pesci, quattro delle quali
      protette. Gli invertebrati annoverano la sanguisuga medicinale e farfalle di interesse comunitario quali
      *Euphydryas aurinia* e *Phengaris teleius*.


      Da maggio a ottobre si incontra il periodo migliore per le escursioni. Le due torrette del percorso
      Perehod agevolano l'osservazione di trampolieri e anatre, in particolare in primavera e in estate.
    visit: >-
      Il sentiero Dąb Dominik muove da Kolonia Łomnica offrendo un anello breve di due chilometri e mezzo, con
      una diramazione di tre e mezzo verso Jamniki. Si addentra in boschi e torbiere attorno al lago Moszne,
      tra drosere insettivore, orchidee spontanee e mirtilli di palude.


      Per il birdwatching, l'itinerario Perehod si snoda per circa cinque chilometri tra i bacini di
      Pieszowola con due torrette e un capanno di avvistamento, particolarmente redditizio durante i passi
      migratori. La torretta del percorso Obóz Powstańczy consente di avvistare volatili, alci, caprioli e
      cinghiali. In bicicletta, la pista Mietiułka percorre ventuno chilometri tra boschi, praterie umide e le
      anse del fiume omonimo nei pressi della torbiera Durne Bagno. I sentieri del parco sono provvisti di
      pannelli didattici, passerelle in legno, pontili e torrette.


      Due sono i centri accoglienza: quello di Stare Załucze accoglie un museo archeologico, etnografico e
      naturalistico, un padiglione all'aperto, il sentiero didattico Żółwik con laghetto, un centro di
      recupero fauna e un'area sosta; quello di Urszulin ospita il centro di salvaguardia della testuggine
      palustre (*Ośrodek Ochrony Żółwia Błotnego*), con esemplari giovani visibili da settembre a maggio, e un
      orto botanico.
    history: >-
      Il botanico Władysław Szafer propose fin dal 1933 l'istituzione di un parco nazionale nella Polesia
      polacca. Prima della sua nascita ufficiale, tra il 1966 e il 1982 vennero istituite quattro riserve:
      Durne Bagno, Jezioro Moszne, Jezioro Długie e Torfowisko Orłowskie. Non fu possibile invece sottrarre
      alla bonifica il vasto bacino di Krowie Bagno, trasformato in pascolo intensivo.
    before: >-
      Consulta il portale del parco per verificare l'apertura dei centri visita prima della gita. I tracciati
      si sviluppano su passerelle in legno e pontili; indossa scarpe adatte a terreni bagnati.
    around: >-
      Senza riserve limitrofe nell'atlas, il [Parco Nazionale di Hortobágy - La Puszta
      ungherese](/lugar/hortobagyi-nemzeti-park---puszta/) condivide con Polesie la testuggine palustre
      europea, la gru e le zone umide; la [Riserva Scientifica del Basso
      Prut](/lugar/rezervatia-stiintifica-prutul-de-jos/) condivide testuggini e specchi lacustri; e [The Flow
      Country — torbiere di Caithness e Sutherland](/lugar/the-flow-country/) condivide cigni selvatici e
      torbiere boreali.
  pt:
    intro: >-
      Existe um recanto da Polónia onde o solo é quase todo turfa e o horizonte se estende plano. Na porção
      ocidental da Polésia, os pauis, lagoas meândricas e matas naturais revestem uma planície sem desníveis,
      revelando algo surpreendente: uma feição de tundra, a mais avançada rumo ao sudoeste da Europa. É o
      Parque Nacional de Polesie, criado em 1 de maio de 1990 com 9760,2864 ha, cujo emblema é o grou-comum.


      Integra a Reserva da Biosfera da Polésia Ocidental e goza do estatuto de zona húmida de importância
      internacional ao abrigo da Convenção de Ramsar. Estes ecossistemas paludosos evoluíram sem drenagem
      antrópica desde o recuo da última glaciação.
    landscape: >-
      Praticamente todo o parque é constituído por planícies turfosas de relevo plano, com pauis, turfeiras e
      lagoas de braços mortos. Não existem escarpas ou desfiladeiros: a paisagem descobre-se à flor da água,
      nos caniçais e nos bosquetes de bétulas.


      As matas agrupam sobretudo bétulas-dos-pauis, pinhais sobre areias e amiais pantanosos. Registam-se
      perto de mil plantas vasculares, 170 das quais raras e 81 sob proteção estrita; entre as relíquias
      glaciares contam-se a bétula-anã e os salgueiros-da-lapónia e de folha de mirtilo.
    wildlife: >-
      Contabilizam-se cerca de 290 espécies de vertebrados. As aves oferecem o contingente mais expressivo:
      cerca de duzentas espécies assinaladas, das quais cento e cinquenta nidificam no parque. O abetouro
      atinge aqui a maior densidade reprodutora da Polónia, a felosa-aquática suporta o terceiro maior efetivo
      do país e um programa de recuperação facultou ao parque uma população relevante de galo-lira. O pigargo
      nidifica nas copas altas, figurando o bufo-real entre as rapinas noturnas.


      Nos mamíferos registam-se 48 espécies; o castor-europeu foi reintroduzido em 1992 e entre os ungulados
      predomina o corço com cerca de oitocentos indivíduos, a par de veados, alces e javalis.


      O cágado-de-carapaça-estriada, o *żółw błotny*, é a espécie nobre do parque. Trata-se de uma relíquia
      pós-glaciar e de um dos répteis mais ameaçados da Polónia, sendo uma das sete espécies de répteis
      locais. Contam-se treze espécies de anfíbios, com anfíbios anuros abundantes, e 21 peixes, quatro dos
      quais protegidos. Entre os invertebrados avultam a sanguessuga-medicinal e borboletas de interesse
      comunitário como *Euphydryas aurinia* e *Phengaris teleius*.


      O período de maio a outubro constitui a melhor época. As duas torres de observação do percurso Perehod
      facilitam o avistamento de limícolas e aves aquáticas na primavera e verão.
    visit: >-
      O trilho Dąb Dominik parte de Kolonia Łomnica, oferecendo um circuito curto de dois quilómetros e meio e
      uma variante alargada de três e meio até Jamniki. Penetra pelas matas e turfeiras em torno do lago
      Moszne, descobrindo orvalhinhas insetívoras, orquídeas e arandos-dos-pauis.


      Para a observação de aves, a rota Perehod estende-se por cerca de cinco quilómetros entre os tanques
      piscícolas de Pieszowola com duas torres e um abrigo coberto, sendo especialmente recomendada durante as
      migrações. A torre do trilho Obóz Powstańczy permite avistar aves, alces, corços e javalis. De
      bicicleta, a rota Mietiułka percorre vinte e um quilómetros de matas, prados húmidos e margens
      ribeirinhas junto à turfeira Durne Bagno. Os percursos integram passadiços em madeira, cais e torres de
      vigia.


      O parque dispõe de dois centros de acolhimento: o de Stare Załucze reúne museu arqueológico, etnográfico
      e natural, alpendre tradicional, o trilho pedagógico Żółwik com lagoa, centro de recuperação de fauna e
      parque de merendas; o de Urszulin alberga o centro de proteção do cágado (*Ośrodek Ochrony Żółwia
      Błotnego*), onde de setembro a maio se podem ver cágados juvenis, além de jardim botânico.
    history: >-
      O botânico Władysław Szafer propôs logo em 1933 a fundação de um parque nacional na Polésia polaca.
      Antes da sua consagração, resguardaram-se entre 1966 e 1982 quatro reservas: Durne Bagno, Jezioro
      Moszne, Jezioro Długie e Torfowisko Orłowskie. Em contrapartida, o vasto paul de Krowie Bagno não pôde
      ser salvo da drenagem agrícola.
    before: >-
      Verifica no sítio web do parque o funcionamento dos centros antes da viagem. Os percursos assentam em
      passadiços de madeira e cais; calça sapatos resistentes à humidade.
    around: >-
      Sem áreas protegidas vizinhas no atlas, o [Parque Nacional de Hortobágy - A Puszta
      Húngara](/lugar/hortobagyi-nemzeti-park---puszta/) partilha com Polesie o cágado, o grou e os meios
      aquáticos; a [Reserva Científica do Baixo Prut](/lugar/rezervatia-stiintifica-prutul-de-jos/) partilha
      cágados e lagoas; e [The Flow Country — turfeiras de Caithness e Sutherland](/lugar/the-flow-country/)
      partilha cisnes-bravos e turfeiras de cobertura.
