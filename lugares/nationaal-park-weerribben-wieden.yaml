resumen:
  es: >-
    El mayor humedal continuo de turbera baja de Europa Occidental, moldeado por la extracción histórica de
    turba.
  en: >-
    Northwestern Europe's largest continuous peat bog, created by centuries of peat cutting and natural
    inundations.
  fr: >-
    La plus vaste tourbière basse continue d'Europe occidentale, née de siècles d'extraction de tourbe et
    d'inondations naturelles.
  de: >-
    Nordwesteuropas größtes zusammenhängendes Flachmoorgebiet, entstanden durch jahrhundertelangen Torfabbau
    und Sturmfluten.
  it: >-
    La più grande torbiera bassa continua dell'Europa nord-occidentale, forgiata da secoli di estrazione della
    torba e mareggiate.
  pt: >-
    A maior turfeira baixa contínua do noroeste da Europa, forjada por séculos de extração de turfa e
    inundações naturais.
unico:
  es: >-
    Un paisaje que parece salvaje y que es obra de la extracción de turba, donde se avanza en canoa entre
    muros de carrizo y es posible, con suerte, cruzarse con una nutria.
  en: >-
    A labyrinth of canals, reedbeds and waterlogged woodlands that exists because peat was excavated for
    centuries and water rushed into the hollows.
  fr: >-
    Un dédale de canaux, roselières et forêts tourbeuses qui existe parce que la tourbe y fut extraite pendant
    des siècles et que l'eau envahit les fosses.
  de: >-
    Ein Labyrinth aus Kanälen, Schilfgürteln und Bruchwäldern, das entstand, weil jahrhundertelang Torf
    gestochen wurde und Wasser in die Kuhlen drang.
  it: >-
    Un dedalo di canali, canneti e boschi palustri nato dall'estrazione della torba per secoli, dove l'acqua
    invase progressivamente gli scavi.
  pt: >-
    Um labirinto de canais, caniçais e bosques pantanosos que existe porque a turfa foi extraída durante
    séculos e a água inundou as covas.
observaciones:
  es: >-
    La afluencia es alta en Giethoorn y baja en la reserva estricta de Weerribben en canoa. Los cotos de patos
    solo se visitan en excursión, y las normas de acceso de cada sector se indican en los carteles de las
    entradas.
texto:
  es:
    intro: >-
      Parece intacto, y no hay un solo metro que no lo haya hecho el ser humano. Así es Weerribben-Wieden: la
      mayor extensión continua de turbera baja del noroeste de Europa, un laberinto de canales, carrizales,
      lagos y bosques pantanosos que existe porque durante siglos se extrajo turba y el agua fue llenando los
      huecos. Está en la provincia de Overijssel, y hoy es el hogar de la [nutria](/especie/lutra_lutra/).
    landscape: >-
      La causa es la turba. Al excavarla, el agua ganó espacio y nacieron grandes lagos, los wieden, como el
      Belterwijde y el Beulakerwijde, y entre ellos largas franjas de tierra donde se secaban los bloques. El
      proceso se descontroló: cuando las franjas se hicieron demasiado estrechas, los temporales de 1776 y
      1825 inundaron grandes zonas y las convirtieron en lagos. La extracción profesional de turba cesó del
      todo en 1955. Después vino el carrizo, y los prados de siega y los pastos, y lo que quedó demasiado
      húmedo se dejó a la naturaleza. El resultado es un mosaico de lagos, canales, carrizales, prados de
      heno, turberas flotantes y bosque pantanoso.


      Hacer de ese mosaico un lugar vivo exige mantenerlo. El carrizo se corta en invierno y los prados de
      siega se siegan una vez al año, en verano; y sin gestión, toda la zona acabaría convertida en un gran
      bosque de pantano. Más de trescientos pequeños molinos de agua bombean agua hacia dentro de la zona, al
      contrario de lo habitual en los Países Bajos, para frenar la desecación. Weerribben y Wieden son hoy dos
      partes de un mismo parque: Weerribben la gestiona Staatsbosbeheer; De Wieden, sobre todo
      Natuurmonumenten.
    wildlife: >-
      La web del parque cita como habitantes a la nutria, la gran mariposa de fuego, la [garza
      imperial](/especie/ardea_purpurea/), muchas libélulas y la drosera. Weerribben es la sala de cría de la
      nutria. En 2002 se reintrodujeron nutrias, que habían desaparecido en los años ochenta del siglo veinte,
      y desde aquí se han extendido por otras zonas del país. Es uno de los dos lugares donde vive una
      subespecie de la gran mariposa de fuego.


      Es también territorio de aves. Crían entre 140 y 150 especies, desde el zampullín y el pechiazul hasta
      especies raras como la buscarla unicolor y la agachadiza común. En De Auken, al norte de Giethoorn, hay
      una colonia de garzas imperiales y [espátulas](/especie/platalea_leucorodia/), y las aves de agua se ven
      desde varios observatorios. En primavera, recién llegadas de África, las aves de pradera buscan pareja
      en los prados encharcados y en los prados de heno con orquídeas, calta y flores de primavera se oyen la
      avefría, la aguja colinegra y el archibebe común, que lanzan su propio nombre al aire.


      La estación manda: las aves de pradera se animan a principios de primavera y de abril a octubre salen
      las excursiones guiadas en barco. Los meses más recomendados para ir van de abril a octubre.
    visit: >-
      La mejor manera de recorrerlo es desde el agua. En canoa se avanza entre muros de carrizo, oyendo solo
      los remos y el canto de las aves de marisma, y todos los canales de Weerribben acaban en el
      Kalenbergergracht, de modo que no es posible perderse. En el centro de información de Ossenzijl empieza
      una ruta en canoa de 16 km. Desde el centro de visitantes De Wieden, en Sint Jansklooster, salen
      excursiones en barco con guarda o guía entre abril y octubre.


      A pie, hay paseos circulares por caminos de hierba y pasarelas entre carrizales, tramos encharcados y
      prados floridos. El Vlonderpad, de un kilómetro, discurre sobre terreno flotante, en el límite entre
      tierra y agua; detrás del centro de visitantes, un sendero de barro cruza canales con barcazas de
      tracción manual, y hacen falta botas porque atraviesa los carrizales. Y en bicicleta, la ruta Weidevogel
      de De Wieden mide 33,9 kilómetros, dura dos horas y cincuenta minutos y empieza en el centro de
      visitantes; en el Leeuwterveld, dentro de ella, pueden verse archibebes comunes, avocetas comunes,
      avefrías, cucharas comunes y cercetas carretonas. Para ver desde arriba, la torre de agua de Sint
      Jansklooster ofrece una vista de 45 m de altura sobre De Wieden, y en el centro de visitantes se
      proyecta una película sobre Beulake, el pueblo hundido.
    history: >-
      Natuurmonumenten gestiona cuatro cotos de patos en De Wieden, hoy rincones de naturaleza tranquila. La
      Grote Otterskooi, con treinta hectáreas, es unas diez veces mayor que el coto de patos medio de los
      Países Bajos. Los cotos de Weerribben solo se visitan en excursiones.
    before: >-
      La afluencia es alta en Giethoorn y baja en la reserva estricta de Weerribben en canoa. Los cotos de
      patos solo se visitan en excursión, y las normas de acceso de cada sector se indican en los carteles de
      las entradas.
    around: >-
      No tiene vecinos cercanos catalogados, pero comparte la nutria, el avetoro y los humedales con otros
      lugares del atlas: el [Parque Nacional de Hortobágy - La Puszta
      Húngara](/lugar/hortobagyi-nemzeti-park---puszta/), los [Bosques del Parque Natural Lagos de
      Uckermark](/lugar/uckermarkische-seen-forests/) y la [Reserva Natural de
      Federsee](/lugar/federsee---naturschutzgebiet/).
  en:
    intro: >-
      In northwestern Europe there is no continuous fen wetland larger than this: a labyrinth of water, reed
      beds, quaking bogs and swamp woods that exists because centuries of peat extraction left open hollows
      gradually claimed by water. Situated in the province of Overijssel, it is today the premier sanctuary of
      the [Eurasian otter](/especie/lutra_lutra/) in the Netherlands.
    landscape: >-
      Peat digging shaped this world. As extractors dug deeper, water flooded the landscape, creating
      expansive lakes called *wieden*, such as Belterwijde and Beulakerwijde, separated by narrow balks of
      land where cut peat sods dried. The excavation eventually proved catastrophic: when the retaining ribs
      grew too slender, ferocious storm surges in 1776 and 1825 swept across the plains, converting huge
      swathes into open water. Commercial peat mining ceased permanently in 1955. Subsequently, common reed
      colonized the margins, hay meadows and wet pastures were established, and unmanageable tracts returned
      to natural wilderness. The outcome is a mosaic of lakes, ditch canals, reed swamps, hayfields, quaking
      bogs and waterlogged carr woodlands.


      Sustaining this rich mosaic requires continuous intervention. Reeds are harvested in winter and hay
      meadows mown once annually in summer; without active management, the entire wetland would rapidly
      succeed into dense alder-willow swamp. Over three hundred small wind-driven drainage mills pump water
      into the reserve—inverting typical Dutch water control—to arrest desiccation. Weerribben and De Wieden
      form two halves of a single national park: Staatsbosbeheer manages Weerribben; Natuurmonumenten
      primarily stewards De Wieden.
    wildlife: >-
      The park's official roster highlights the otter, large copper butterfly, [purple
      heron](/especie/ardea_purpurea/), dragonflies and sundews. Weerribben serves as the primary nursery for
      the Dutch otter population. In 2002, otters were reintroduced following their local extinction in the
      late twentieth century, successfully dispersing across neighbouring waterways. It remains one of just
      two European bastions for an endemic subspecies of the large copper butterfly.


      Birdlife thrives across the marsh. Between 140 and 150 species breed here, from black-necked grebes and
      bluethroats to rarities such as Savi's warbler and common snipe. At De Auken, north of Giethoorn, a
      thriving breeding colony of purple herons and [Eurasian spoonbills](/especie/platalea_leucorodia/) can
      be observed from specialized hides. In early spring, newly arrived migratory waders perform displays
      over waterlogged meadows dotted with marsh marigolds and wild orchids: lapwings, black-tailed godwits
      and redshanks fill the air with calls.


      Seasonality guides exploration: meadow waders peak in early spring, while guided electric boat tours
      operate from April to October. The most rewarding months span from April to October.
    visit: >-
      Exploring by water provides the quintessential park experience. Paddling a canoe through towering reed
      corridors allows you to hear only lapping water and reedbed warblers; all Weerribben canals eventually
      connect to the main Kalenbergergracht, making navigation straightforward. A classic 16 km canoe trail
      begins at the Ossenzijl visitor centre. From De Wieden visitor centre in Sint Jansklooster, guided
      whisper-boat excursions depart from April to October.


      On foot, boardwalks and grass paths loop through reed stands, water meadows and wet woods. The
      one-kilometre Vlonderpad floats over trembling bogs at the boundary between land and water; behind the
      visitor centre, a trail crosses channels via hand-pulled chain ferries, where rubber boots are
      essential. By bicycle, the Weidevogel loop in De Wieden covers 33.9 kilometres in roughly two hours and
      fifty minutes starting from the visitor centre, leading past Leeuwterveld where common redshank, pied
      avocet, northern lapwing, northern shoveler and garganey forage. For an aerial perspective, the historic
      Sint Jansklooster water tower offers an observation deck 45 m high over De Wieden, while the visitor
      centre screens a documentary on Beulake, the sunken village.
    history: >-
      Natuurmonumenten manages four historic duck decoys in De Wieden, preserved as tranquil nature refuges.
      The Grote Otterskooi, spanning thirty hectares, is roughly ten times larger than the average Dutch duck
      decoy. Weerribben decoys are accessible exclusively on ranger-led excursions.
    before: >-
      Visitor numbers are high in Giethoorn and low in the strict Weerribben reserve when exploring by canoe.
      Duck decoys may only be entered on guided tours, and local sector regulations are posted at water and
      land gateways.
    around: >-
      While lacking immediate neighbours in the atlas, it shares otter, bittern and peat fen ecosystems with
      [Hortobágy National Park – The Puszta](/lugar/hortobagyi-nemzeti-park---puszta/), the [Uckermark Lakes
      Nature Park Forests](/lugar/uckermarkische-seen-forests/) and the [Federsee Nature
      Reserve](/lugar/federsee---naturschutzgebiet/).
  fr:
    intro: >-
      En Europe du Nord-Ouest, il n'existe pas de tourbière basse continue plus vaste : un labyrinthe d'eau
      libre, de roselières, de tremblants et de forêts marécageuses né de siècles d'extraction de tourbe.
      Situé dans la province d'Overijssel, ce milieu humide constitue aujourd'hui le sanctuaire emblématique
      de la [loutre d'Europe](/especie/lutra_lutra/) aux Pays-Bas.
    landscape: >-
      Tout procède de l'extraction de tourbe. En creusant la terre, les ouvriers laissèrent des fosses qui se
      remplirent d'eau, créant de vastes lacs appelés *wieden*, tels que le Belterwijde et le Beulakerwijde,
      séparés de digues de séchage étroites. Le phénomène devint incontrôlable : lorsque les digues
      s'amenuisèrent, les tempêtes de 1776 et 1825 submergèrent de vastes zones, les transformant en plans
      d'eau permanents. L'exploitation professionnelle prit définitivement fin en 1955. Ensuite, les roseaux
      colonisèrent les berges, des prairies de fauche apparurent et les parcelles les plus inondées furent
      laissées à la nature. Il en résulte une mosaïque de lacs, canaux, roselières, prairies humides,
      tourbières flottantes et forêts alluviales.


      Préserver cette mosaïque exige des soins constants. Les roseaux sont coupés en hiver et les prairies
      fauchées en été ; sans intervention, toute la zone se transformerait en un grand marécage boisé. Plus de
      trois cents petits moulins à eau pompent l'eau vers l'intérieur du site — à l'inverse du schéma
      classique néerlandais — pour contrer l'assèchement. Weerribben et De Wieden forment aujourd'hui les deux
      entités d'un même parc : Weerribben est géré par Staatsbosbeheer ; De Wieden principalement par
      Natuurmonumenten.
    wildlife: >-
      Le parc met en avant la loutre, le grand cuivré, le [héron pourpré](/especie/ardea_purpurea/), de
      nombreuses libellules et la droséra. Weerribben est la pouponnière de la loutre aux Pays-Bas. En 2002,
      l'espèce y a été réintroduite après son extinction locale à la fin du XXe siècle, essaimant depuis dans
      d'autres cours d'eau du pays. C'est l'un des deux seuls refuges d'une sous-espèce endémique du grand
      cuivré.


      C'est également un sanctuaire aviaire. Entre 140 et 150 espèces y nichent, depuis le grèbe castagneux et
      la gorgebleue à miroir jusqu'à la marouette ponctuée et la bécassine des marais. À De Auken, au nord de
      Giethoorn, prospère une colonie de hérons pourprés et de [spatules
      blanches](/especie/platalea_leucorodia/) visible depuis des observatoires. Au printemps, les limicoles
      migrateurs animent les prairies inondées : vanneaux huppés, barges à queue noire et chevaliers gambettes
      font résonner leurs cris nuptiaux.


      Les oiseaux de prairie animent le début du printemps, tandis que les excursions fluviales opèrent
      d'avril à octobre. La période recommandée court d'avril à octobre.
    visit: >-
      La meilleure manière de découvrir le parc est par voie d'eau. En canoë, on glisse entre des murs de
      roseaux au seul bruit des rames et des chants de passereaux ; tous les canaux de Weerribben rejoignent
      le Kalenbergergracht, rendant l'orientation aisée. Un circuit balisé en canoë de 16 km part du centre
      d'accueil d'Ossenzijl. Du centre de visiteurs De Wieden à Sint Jansklooster, des bateaux silencieux
      partent d'avril à octobre avec guide naturaliste.


      À pied, des sentiers sur caillebotis traversent roselières, prairies inondées et tourbières. Le
      Vlonderpad, long d'un kilomètre, chemine sur un sol flottant entre terre et eau ; derrière le centre de
      visiteurs, un sentier franchit des fossés grâce à des bacs à chaîne manuels, nécessitant des bottes. À
      vélo, la boucle Weidevogel dans De Wieden fait 33,9 kilomètres en deux heures et cinquante minutes au
      départ du centre de visiteurs ; au Leeuwterveld, on observe chevaliers gambettes, avocettes élégantes,
      canards souchets et sarcelles d'été. Pour prendre de la hauteur, le château d'eau de Sint Jansklooster
      offre un panorama à 45 m de hauteur sur De Wieden, et le centre projette un film sur le village englouti
      de Beulake.
    history: >-
      Natuurmonumenten gère quatre canardières historiques dans De Wieden, aujourd'hui îlots de quiétude
      naturelle. La Grote Otterskooi, avec ses trente hectares, est dix fois plus vaste qu'une canardière
      néerlandaise ordinaire. Celles de Weerribben ne se découvrent qu'en visite guidée.
    before: >-
      La fréquentation est élevée à Giethoorn et très faible dans la réserve stricte de Weerribben en canoë.
      Les canardières historiques ne s'abordent qu'en visite accompagnée, et les règlements sont affichés aux
      accès terrestres et nautiques.
    around: >-
      Sans voisins immédiats dans l'atlas, il partage la loutre, le butor étoilé et les tourbières avec le
      [Parc national de Hortobágy - La puszta hongroise](/lugar/hortobagyi-nemzeti-park---puszta/), les
      [Forêts du parc naturel des lacs d'Uckermark](/lugar/uckermarkische-seen-forests/) et la [Réserve
      naturelle du Federsee](/lugar/federsee---naturschutzgebiet/).
  de:
    intro: >-
      In Nordwesteuropa gibt es kein größeres zusammenhängendes Flachmoorgebiet als dieses: ein Labyrinth aus
      Wasserflächen, Schilfgürteln, Schwingrasen und Sumpfwäldern, das entstand, weil jahrhundertelang Torf
      gestochen wurde und das Wasser die Gruben füllte. In der Provinz Overijssel gelegen, bildet es heute den
      bedeutendsten Rückzugsort für den [Fischotter](/especie/lutra_lutra/) in den Niederlanden.
    landscape: >-
      Ursache der Landschaft ist der Torfabbau. Durch das Ausheben entstanden weite Wasserflächen, die
      sogenannten *wieden*, wie Belterwijde und Beulakerwijde, getrennt durch schmale Trockenstreifen für die
      Torfsoden. Der Abbau geriet außer Kontrolle: Als die Dämme zu schmal wurden, rissen schwere Sturmfluten
      in den Jahren 1776 und 1825 riesige Lücken und schufen offene Seen. Der gewerbliche Torfstich endete
      1955 endgültig. Anschließend fassten Schilfbestände Fuß, Heuwiesen und Weiden entstanden, und
      unzugängliche Feuchtgebiete überließ man der Natur. So entstand ein Mosaik aus Seen, Kanälen,
      Schilfflächen, Schwingrasen und Bruchwäldern.


      Um dieses Mosaik zu bewahren, bedarf es ständiger Pflege. Das Schilf wird im Winter geschnitten,
      Feuchtwiesen werden im Sommer einmal jährlich gemäht; ohne Bewirtschaftung würde die Landschaft zu
      dichtem Erlenbruchwald verwalden. Mehr als dreihundert kleine Windwassermühlen pumpen Wasser in das
      Gebiet hinein – entgegen der niederländischen Entwässerungstradition –, um die Austrocknung zu bremsen.
      Weerribben und De Wieden bilden zwei Hälften desselben Parks: Weerribben untersteht Staatsbosbeheer; De
      Wieden wird überwiegend von Natuurmonumenten betreut.
    wildlife: >-
      Die Parkverwaltung hebt Fischotter, Großen Feuerfalter, [Purpurreiher](/especie/ardea_purpurea/),
      zahlreiche Libellen und den Sonnentau hervor. Weerribben gilt als Kinderstube der niederländischen
      Fischotter. Im Jahr 2002 wurden hier Fischotter wiederangesiedelt, nachdem sie im späten zwanzigsten
      Jahrhundert ausgestorben waren, und haben sich seither im Land ausgebreitet. Es ist einer von nur zwei
      Standorten einer endemischen Unterart des Großen Feuerfalters.


      Auch für die Vogelwelt ist das Feuchtgebiet herausragend. Zwischen 140 und 150 Vogelarten brüten hier,
      vom Zwergtaucher und Blaukehlchen bis zu Rohrschwirl und Bekassine. Bei De Auken nördlich von Giethoorn
      brüten Purpurreiher und [Löffler](/especie/platalea_leucorodia/), die von Beobachtungshütten aus zu
      sehen sind. Im Frühjahr balzen Kiebitze, Uferschnepfen und Rotschenkel auf den überstauten Wiesen.


      Wiesenbrüter prägen das frühe Frühjahr, während von April bis Oktober geführte Elektrobootfahrten
      stattfinden. Die besten Besuchsmonate reichen von April bis Oktober.
    visit: >-
      Die reizvollste Erkundung erfolgt vom Wasser aus. Mit dem Kanu gleitet man durch Schilfgassen; alle
      Kanäle Weerribbens münden schließlich in die Kalenbergergracht, sodass man sich nicht verirren kann. Am
      Besucherzentrum Ossenzijl beginnt eine markierte 16 km lange Kanuroute. Vom Besucherzentrum De Wieden in
      Sint Jansklooster starten zwischen April und Oktober geführte Flüsterbootfahrten.


      Zu Fuß führen Stege und Wiesenpfade durch Schilf und Feuchtwiesen. Der ein Kilometer lange Vlonderpad
      verläuft auf schwimmendem Untergrund am Übergang von Land zu Wasser; hinter dem Besucherzentrum quert
      ein Pfad Wassergräben mit handgezogenen Kettenfähren – Gummistiefel sind hier ratsam. Per Fahrrad misst
      die Weidevogel-Route in De Wieden 33,9 Kilometer bei zwei Stunden und fünfzig Minuten Fahrzeit ab dem
      Besucherzentrum; im Leeuwterveld lassen sich Rotschenkel, Säbelschnäbler, Löffel- und Knäkenten
      beobachten. Aus der Vogelperspektive bietet der Wasserturm von Sint Jansklooster eine 45 m hohe
      Aussichtsplattform, und das Zentrum zeigt einen Film über das versunkene Dorf Beulake.
    history: >-
      Natuurmonumenten betreut vier historische Entenkojen in De Wieden als geschützte Refugien. Die Grote
      Otterskooi ist mit dreißig Hektar rund zehnmal größer als eine durchschnittliche niederländische
      Entenkoje. Die Kojen in Weerribben sind nur im Rahmen geführter Touren zugänglich.
    before: >-
      Der Besucherandrang ist in Giethoorn hoch und im Kernreservat Weerribben per Kanu gering. Historische
      Entenkojen dürfen nur mit Führung betreten werden; örtliche Zugangsregeln sind an den Einstiegen
      angeschlagen.
    around: >-
      Ohne unmittelbare Nachbarn im Atlas teilt das Gebiet Fischotter, Rohrdommel und Feuchtlebensräume mit
      dem [Nationalpark Hortobágy – Die ungarische Puszta](/lugar/hortobagyi-nemzeti-park---puszta/), den
      [Wäldern des Naturparks Uckermärkische Seen](/lugar/uckermarkische-seen-forests/) und dem
      [Naturschutzgebiet Federsee](/lugar/federsee---naturschutzgebiet/).
  it:
    intro: >-
      Nell'Europa nord-occidentale non esiste torbiera bassa continua più vasta di questa: un dedalo di
      specchi d'acqua, canneti, torbiere galleggianti e boschi paludosi nato da secoli di estrazione della
      torba. Situato nella provincia di Overijssel, costituisce oggi il santuario primario della
      [lontra](/especie/lutra_lutra/) nei Paesi Bassi.
    landscape: >-
      La causa fondante è l'estrazione della torba. Scavando il terreno palustre, l'acqua invase gli invasi
      creando vasti laghi chiamati *wieden*, come Belterwijde e Beulakerwijde, separati da sottili argini di
      terra usati per essiccare i pani di torba. Il processo sfuggì al controllo: quando le strisce divisorie
      divennero troppo esili, le tempeste del 1776 e 1825 allagarono ampie porzioni trasformandole in specchi
      lacustri aperti. L'attività estrattiva cessò definitivamente nel 1955. In seguito le canne palustri
      colonizzarono i bordi, nacquero prati da sfalcio e le aree impraticabili furono restituite alla natura.
      Il risultato è un mosaico di laghi, canali, canneti, prati umidi e boschi alluvionali.


      Conservare questo mosaico richiede manutenzione continua. Le canne vengono falciate in inverno e i prati
      sfalciati una volta all'anno in estate; senza gestione, l'intero territorio evolverebbe verso un fitto
      bosco acquitrinoso. Più di trecento piccoli mulini a vento pompano acqua verso l'interno dell'area —
      all'inverso della prassi olandese — per contrastare il disseccamento. Weerribben e De Wieden formano
      oggi due metà del medesimo parco: Weerribben è gestito da Staatsbosbeheer; De Wieden principalmente da
      Natuurmonumenten.
    wildlife: >-
      L'ente parco segnala la presenza di lontra, licena delle paludi, [airone
      rosso](/especie/ardea_purpurea/), libellule e drosera. Weerribben funge da vivaio naturale per le lontre
      olandesi. Nel 2002 le lontre sono state reintrodotte dopo l'estinzione alla fine del Novecento,
      diffondendosi da qui in altri bacini fluviali. È uno dei due soli siti in cui sopravvive una sottospecie
      endemica della licena delle paludi.


      L'avifauna nidificante conta tra 140 e 150 specie, dal tuffetto al pettazzurro fino a cannareccione e
      beccaccino. A De Auken, a nord di Giethoorn, sorge una colonia di aironi rossi e
      [spatole](/especie/platalea_leucorodia/) osservabile da capanni mimetizzati. In primavera i limicoli
      migratori popolano i prati allagati: pavoncelle, pittime reali e pettegole riempiono l'aria dei loro
      richiami.


      Gli uccelli di prateria animano l'inizio della primavera, mentre da aprile a ottobre partono le
      escursioni guidate in battello. I mesi consigliati vanno da aprile a ottobre.
    visit: >-
      La fruizione ideale avviene dall'acqua. In canoa si scivola tra pareti di canne; tutti i canali di
      Weerribben sfociano nel Kalenbergergracht, rendendo agevole la navigazione. Dal centro informativo di
      Ossenzijl parte un itinerario in canoa di 16 km. Dal centro visite De Wieden a Sint Jansklooster salpano
      escursioni in barche elettriche con guida tra aprile e ottobre.


      A piedi, passerelle in legno e sentieri su erba attraversano canneti e prati fioriti. Il Vlonderpad,
      lungo un chilometro, corre su terreno flottante tra terra e acqua; dietro il centro visite un sentiero
      attraversa canali con chiatte a trazione manuale, dove sono indispensabili stivali impermeabili. In
      bicicletta, l'anello Weidevogel a De Wieden misura 33,9 chilometri per due ore e cinquanta minuti dal
      centro visite; a Leeuwterveld si avvistano pettegole, avocette, mestoloni e marzaiole. Per ammirare il
      panorama dall'alto, la torre dell'acquedotto di Sint Jansklooster offre una piattaforma a 45 m di quota,
      e il centro proietta un documentario sul villaggio sommerso di Beulake.
    history: >-
      Natuurmonumenten amministra quattro roccoli d'anatre storici a De Wieden, oggi oasi di quiete integrale.
      La Grote Otterskooi, con i suoi trenta ettari, è circa dieci volte più vasta di un roccolo olandese
      medio. I bacini di Weerribben si visitano solo con guide autorizzate.
    before: >-
      L'affluenza è intensa a Giethoorn e molto ridotta nella riserva integrale di Weerribben in canoa. I
      roccoli storici sono accessibili solo tramite visita guidata; le norme locali sono esposte all'ingresso.
    around: >-
      Pur non avendo vicini contigui nell'atlante, condivide lontra, tarabuso e torbiere basse con il [Parco
      nazionale di Hortobágy - La Puszta ungherese](/lugar/hortobagyi-nemzeti-park---puszta/), i [Boschi del
      Parco naturale dei laghi dell'Uckermark](/lugar/uckermarkische-seen-forests/) e la [Riserva naturale del
      Federsee](/lugar/federsee---naturschutzgebiet/).
  pt:
    intro: >-
      No noroeste da Europa não existe turfeira baixa contínua mais extensa do que esta: um labirinto de
      lagoas, caniçais, turfeiras flutuantes e bosques paludosos gerado por séculos de extração de turfa.
      Situado na província de Overijssel, é hoje o principal reduto da [lontra](/especie/lutra_lutra/) nos
      Países Baixos.
    landscape: >-
      A origem reside na extração da turfa. Ao desenterrá-la, a água conquistou terreno formando vastos lagos
      chamados *wieden*, como Belterwijde e Beulakerwijde, separados por estreitas leiras de terra onde os
      blocos de turfa secavam. O processo descontrolou-se: quando as faixas de terra enfraqueceram,
      tempestades em 1776 e 1825 inundaram planícies inteiras transformando-as em lagos abertos. A exploração
      comercial encerrou em 1955. Depois, o caniço colonizou as margens, instalaram-se lameiros de feno e os
      setores alagados foram devolvidos à natureza. Resultou daí um mosaico de lagos, canais, caniçais, prados
      de feno, turfeiras flutuantes e amiais pantanosos.


      Preservar este mosaico exige maneio contínuo. O caniço é ceifado no inverno e os prados de feno cortados
      uma vez por ano no verão; sem gestão, todo o paul se converteria numa densa floresta palustre. Mais de
      trezentos pequenos moinhos de vento bombeiam água para o interior da reserva — invertendo o modelo
      clássico holandês — para travar a dessecação. Weerribben e De Wieden formam duas metades de um único
      parque: Weerribben é administrado por Staatsbosbeheer; De Wieden essencialmente por Natuurmonumenten.
    wildlife: >-
      O parque salienta a presença da lontra, da borboleta-fogo-grande, da
      [garça-vermelha](/especie/ardea_purpurea/), libélulas e dróseras. Weerribben constitui o berçário da
      população holandesa de lontras. Em 2002 foram reintroduzidas lontras após a sua extinção regional no
      final do século XX, dispersando-se com sucesso por outras bacias. É um dos dois únicos locais do mundo
      onde vive uma subespécie endémica da borboleta-fogo-grande.


      O território acolhe rica avifauna. Nidificam entre 140 e 150 espécies, desde o mergulhão-pequeno e o
      pisco-de-peito-azul até raridades como a felosa-unicolor e a narceja-comum. Em De Auken, a norte de
      Giethoorn, nidifica uma colónia de garças-vermelhas e [colhereiros](/especie/platalea_leucorodia/)
      observável a partir de abrigos. Na primavera, as aves limícolas animam os prados húmidos: abibes,
      maçaricos-de-bico-direito e pernas-vermelhas ecoam os seus chamamentos nupciais.


      As aves dos prados despontam no início da primavera, e de abril a outubro decorrem os passeios fluviais
      guiados. Os meses recomendados vão de abril a outubro.
    visit: >-
      A navegação proporciona o melhor contacto com a paisagem. De canoa desliza-se por entre muralhas de
      caniço ao som dos remos e das aves aquáticas; todos os esteiros de Weerribben convergem no
      Kalenbergergracht, facilitando o regresso. No centro de acolhimento de Ossenzijl começa um trilho
      náutico de 16 km. Do centro de visitantes De Wieden em Sint Jansklooster partem barcos elétricos
      acompanhados por guias de abril a outubro.


      A pé, passadiços e caminhos de relva atravessam caniçais e prados floridos. O Vlonderpad, com um
      quilómetro, estende-se sobre turfa flutuante no limiar entre terra e água; atrás do centro de visitantes
      um trilho cruza canais com pequenas balsas manuais, exigindo botas impermeáveis. De bicicleta, o
      circuito Weidevogel em De Wieden tem 33,9 quilómetros e duração de duas horas e cinquenta minutos a
      partir do centro de visitantes; em Leeuwterveld avistam-se pernas-vermelhas, alfaiates,
      patos-trombeteiros e marrecos. Para contemplar o horizonte, a torre de água de Sint Jansklooster possui
      miradouro a 45 m de altitude, e no centro projeta-se um documentário sobre Beulake, a aldeia submersa.
    history: >-
      A Natuurmonumenten gere quatro armadilhas históricas de patos em De Wieden, hoje refúgios de
      tranquilidade. A Grote Otterskooi, com trinta hectares, é dez vezes maior que uma armadilha média
      holandesa. Os açudes de Weerribben só se visitam em circuitos organizados.
    before: >-
      A afluência é elevada em Giethoorn e muito reduzida na reserva estrita de Weerribben em canoa. As
      antigas armadilhas de patos só são visitáveis com guia autorizado; as regras locais estão afixadas nas
      entradas.
    around: >-
      Sem vizinhos contíguos no atlas, partilha a lontra, o abetouro e os sapais com o [Parque Nacional de
      Hortobágy - A Puszta Húngara](/lugar/hortobagyi-nemzeti-park---puszta/), as [Florestas do Parque Natural
      dos Lagos de Uckermark](/lugar/uckermarkische-seen-forests/) e a [Reserva Natural do
      Federsee](/lugar/federsee---naturschutzgebiet/).
