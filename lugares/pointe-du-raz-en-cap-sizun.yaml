observaciones:
  es: >-
    El acceso al Trou de l'Enfer es extremadamente peligroso. Los senderos E5 y GR 34 y las dos vueltas de la
    Pointe du Raz y la Pointe du Van están señalizados. Si buscas aves marinas, ve en primavera, cuando
    vuelven a los acantilados.
texto:
  es:
    intro: >-
      En bretón, raz significa corriente rápida, y basta mirar el mar desde aquí para entender por qué. Entre
      la punta, el faro de la Vieille y el Gorle Greiz, las corrientes de marea levantan un fuerte oleaje, y
      más allá, a unos 8 km al oeste, la isla de Sein queda separada de tierra por el violento raz de Sein,
      que da nombre al lugar.


      La Pointe du Raz es el promontorio rocoso más occidental del cabo Sizun, frente al mar de Iroise, en el
      suroeste del Finistère. Forma una proa de setenta y dos metros que domina el raz de Sein y es la rama
      inferior de un tridente rocoso que parte el mar de Iroise, con la punta de Saint-Mathieu y la península
      de Crozon.
    landscape: >-
      El cabo Sizun termina en dos puntas, la del Van al norte y la del Raz al sur, que enmarcan la bahía de
      los Trépassés. La roca de la punta es un leucogranito de dos micas, biotita y moscovita, de grano muy
      fino. Arriba hay una plataforma que se alza unos 70 metros sobre el mar de Iroise y baja despacio hasta
      una punta extrema a 45 metros. En la ladera y el acantilado se forman cinturones de vegetación según lo
      expuestos que estén a la sal y al viento: acantilados escarpados, landa de brezo y mar abierto forman el
      hábitat de muchas especies.


      Debajo, el mar ha trabajado la roca. Una falla natural atraviesa en parte la punta de norte a sur y
      comunica la bahía de Douarnenez con la de Audierne desde el Trou de l'Enfer, donde el mar entra por tres
      lados. Al norte hay grandes cuevas en las que se mete el mar bajo la punta, y solo se llega a ellas por
      mar. En el raz de Sein, dos faros automatizados se alzan sobre islotes: La Vieille y Tévennec.
    wildlife: >-
      La costa del Grand Site es una de las mayores zonas de cría de aves marinas de Francia, y la primavera
      es la estación. Cada año vuelven al cabo Sizun el [arao común](/especie/uria_aalge/) y la [gaviota
      tridáctila](/especie/rissa_tridactyla/), y también el [fulmar boreal](/especie/fulmarus_glacialis/) y la
      gaviota argéntea europea, que anidan en los acantilados escarpados. Además de las aves marinas, viven
      aquí todo el año el [halcón peregrino](/especie/falco_peregrinus/), el cuervo grande y la [chova
      piquirroja](/especie/pyrrhocorax_pyrrhocorax/).


      En las rocas se agarran el hinojo marino y la clavelina de mar, de flores como claveles. Entre las
      plantas raras de la costa están Limonium humile y la zanahoria marina. En el mar, el Parque Natural
      Marino de Iroise vigila y estudia el medio marino local y trabaja para protegerlo.
    visit: >-
      La visita empieza en la Maison de site, a unos 800 metros de la punta. Abre de abril a finales de
      octubre, sus exposiciones son de acceso libre, y una lanzadera para personas de movilidad reducida la
      une con la punta. El aparcamiento y el espacio comercial se construyeron a cierta distancia del sitio y
      se unen a él por una lanzadera.


      Para caminar hay dos vueltas señalizadas de nivel medio: el Tour de la Pointe du Raz, el sendero PR 14,
      de 10 km y 3 h 20, y el Tour de la Pointe du Van, el PR 13, de 11 km y 3 h 45. El sendero europeo E5, de
      3 050 km, une la punta con Venecia, y el GR 34, que bordea toda la costa bretona desde el
      Mont-Saint-Michel hasta Saint-Nazaire, también pasa por el sitio.


      La Maison de site organiza visitas guiadas. Una explica cómo se formaron los acantilados, otra cuenta la
      historia humana ligada a este fin del mundo y una tercera recorre landas golpeadas por el viento,
      acantilados abruptos y patrimonio discreto. También hay una salida guiada a pie que muestra fauna,
      flora, paisajes y faros legendarios.
    history: >-
      Desde la Antigüedad, el paso entre la punta y la isla de Sein era célebre por peligroso para la
      navegación. El primer faro del Raz, de unos 18 metros, se construyó en 1839 y se encendió a la vez que
      el de la isla de Sein. Entre las dos guerras la punta fue curiosidad turística nacional, patrocinada por
      el Touring Club de France, y los coches circulaban por la propia landa.


      En los años sesenta se levantaron a toda prisa comercios, restaurantes y aparcamientos en la punta, y
      con cerca de un millón de visitantes al año el pisoteo masivo degradó el paisaje. Hizo falta una
      operación Grand Site para restaurar su cubierta de brezo. El sitio estuvo a punto de tener otro destino:
      Électricité de France llegó a plantear una central nuclear en este lugar. En el extremo de la meseta
      están hoy la estatua de Notre-Dame des Naufragés y un semáforo marítimo.
    before: >-
      El acceso al Trou de l'Enfer es extremadamente peligroso. Los senderos E5 y GR 34 y las dos vueltas de
      la Pointe du Raz y la Pointe du Van están señalizados. Si buscas aves marinas, ve en primavera, cuando
      vuelven a los acantilados.
    around: >-
      La Pointe du Raz no tiene vecinos cercanos en el atlas, pero sí lugares lejanos que comparten con ella
      costa y aves. El [Cabo Fréhel](/lugar/cap-frehel/) tiene también fulmar boreal, chova piquirroja y
      halcón peregrino. La [Isla de Lundy](/lugar/lundy/) comparte el fulmar boreal y el halcón peregrino, y
      el [Gran Sitio de los Dos Cabos](/lugar/grand-site-des-deux-caps---cote-d-opale/) comparte el halcón
      peregrino. [Great Blasket Island](/lugar/great-blasket-island/) comparte con ella la chova piquirroja.
  en:
    intro: >-
      In Breton, *raz* means swift current, and one look at the sea from here shows why. Between the headland,
      the La Vieille lighthouse and the Gorle Greiz reef, tidal currents whip up a heavy swell, and beyond
      them, about 8 km to the west, the island of Sein is separated from the mainland by the violent Raz de
      Sein, which gives the site its name.


      The Pointe du Raz is the westernmost rocky promontory of Cap Sizun, facing the Iroise Sea in
      south-western Finistère. It forms a seventy-two-metre prow overlooking the Raz de Sein and is the lower
      prong of a rocky trident splitting the Iroise Sea, together with Pointe de Saint-Mathieu and the Crozon
      Peninsula.
    landscape: >-
      Cap Sizun ends in two headlands, Pointe du Van to the north and Pointe du Raz to the south, framing the
      Baie des Trépassés. The rock of the point is a very fine-grained two-mica leucogranite of biotite and
      muscovite. Above lies a plateau rising roughly 70 metres above the Iroise Sea and sloping down gently to
      an outermost tip at 45 metres. Across the slope and cliff, belts of vegetation form according to
      exposure to salt spray and wind: sheer cliffs, heather moorland and open sea provide habitat for many
      species.


      Below, the sea has carved the rock. A natural fault cuts partly across the headland from north to south,
      linking the Bay of Douarnenez with the Bay of Audierne through the Trou de l'Enfer, where the sea surges
      in from three sides. To the north lie large sea caves running under the point, reachable only by boat.
      In the Raz de Sein, two automated lighthouses stand on islets: La Vieille and Tévennec.
    wildlife: >-
      The Grand Site coast is one of France's largest seabird breeding areas, and spring is the season. Every
      year [common guillemot](/especie/uria_aalge/) and [black-legged kittiwake](/especie/rissa_tridactyla/)
      return to Cap Sizun, along with [northern fulmar](/especie/fulmarus_glacialis/) and European herring
      gull, nesting on the sheer cliffs. Besides seabirds, [peregrine falcon](/especie/falco_peregrinus/),
      common raven and [red-billed chough](/especie/pyrrhocorax_pyrrhocorax/) live here year-round.


      Rock samphire and sea thrift, with pink carnation-like flowers, cling to the rock. Rare coastal plants
      include Lax-flowered sea-lavender (*Limonium humile*) and sea carrot. Offshore, the Iroise Marine Nature
      Park monitors and studies the marine environment and works to protect it.
    visit: >-
      The visit starts at the Maison de site, about 800 metres from the headland. It opens from April to late
      October, its exhibitions are free to enter, and a shuttle for visitors with reduced mobility links it to
      the point. The car park and shopping area were built some distance from the headland and are connected
      to it by a shuttle.


      For walking there are two waymarked loops of moderate difficulty: the Tour de la Pointe du Raz, trail PR
      14, at 10 km and 3 h 20, and the Tour de la Pointe du Van, PR 13, at 11 km and 3 h 45. The E5 European
      long-distance path, 3,050 km long, links the headland to Venice, and the GR 34, which follows the entire
      Breton coast from Mont-Saint-Michel to Saint-Nazaire, also passes through the site.


      The Maison de site runs guided walks. One explains how the cliffs were formed, another tells the human
      story tied to this end of the world, and a third crosses wind-battered heaths, steep cliffs and discreet
      heritage. There is also a guided walk showcasing wildlife, flora, landscapes and legendary lighthouses.
    history: >-
      Since antiquity, the passage between the headland and the island of Sein was notorious as a hazard to
      navigation. The first Raz lighthouse, some 18 metres tall, was built in 1839 and lit at the same time as
      the one on Sein. Between the wars the headland became a national tourist attraction promoted by the
      Touring Club de France, and cars drove right onto the heath.


      In the sixties shops, restaurants and car parks were thrown up hastily at the tip, and with nearly a
      million visitors a year heavy trampling degraded the landscape. A Grand Site operation was needed to
      restore its heather cover. The site nearly met a very different fate: Électricité de France even
      proposed a nuclear power station here. At the end of the plateau now stand the statue of Notre-Dame des
      Naufragés and a maritime signal station.
    before: >-
      Access to the Trou de l'Enfer is extremely dangerous. The E5 and GR 34 trails and the two loops of
      Pointe du Raz and Pointe du Van are waymarked. If you are looking for seabirds, go in spring, when they
      return to the cliffs.
    around: >-
      Pointe du Raz has no close neighbours in the atlas, though distant sites share its coast and birds. [Cap
      Fréhel](/lugar/cap-frehel/) also has northern fulmar, red-billed chough and peregrine falcon. [Lundy
      Island](/lugar/lundy/) shares the northern fulmar and peregrine falcon, and [Grand Site des
      Deux-Caps](/lugar/grand-site-des-deux-caps---cote-d-opale/) shares the peregrine falcon. [Great Blasket
      Island](/lugar/great-blasket-island/) shares the red-billed chough with it.
  fr:
    intro: >-
      En breton, *raz* signifie courant rapide, et il suffit de regarder la mer d'ici pour comprendre
      pourquoi. Entre la pointe, le phare de la Vieille et le Gorle Greiz, les courants de marée lèvent une
      forte houle, et au-delà, à quelque 8 km à l'ouest, l'île de Sein est séparée de la terre par le violent
      raz de Sein, qui donne son nom au lieu.


      La Pointe du Raz est le promontoire rocheux le plus occidental du cap Sizun, face à la mer d'Iroise,
      dans le sud-ouest du Finistère. Elle forme une proue de soixante-douze mètres qui domine le raz de Sein
      et constitue la branche inférieure d'un trident rocheux fendant la mer d'Iroise, avec la pointe de
      Saint-Mathieu et la presqu'île de Crozon.
    landscape: >-
      Le cap Sizun s'achève par deux pointes, celle du Van au nord et celle du Raz au sud, qui encadrent la
      baie des Trépassés. La roche de la pointe est un leucogranite à deux micas, biotite et muscovite, à
      grain très fin. En haut s'étend un plateau qui s'élève à quelque 70 mètres au-dessus de la mer d'Iroise
      et descend doucement jusqu'à une extrémité à 45 mètres. Sur le versant et la falaise se forment des
      ceintures de végétation selon leur exposition au sel et au vent : falaises abruptes, lande à bruyère et
      mer ouverte forment l'habitat de nombreuses espèces.


      En bas, la mer a sculpté la roche. Une faille naturelle traverse en partie la pointe du nord au sud et
      relie la baie de Douarnenez à celle d'Audierne depuis le Trou de l'Enfer, où la mer s'engouffre par
      trois côtés. Au nord s'ouvrent de grandes grottes où la mer pénètre sous la pointe, accessibles
      uniquement par mer. Dans le raz de Sein, deux phares automatisés se dressent sur des îlots : La Vieille
      et Tévennec.
    wildlife: >-
      La côte du Grand Site est l'une des plus grandes zones de reproduction d'oiseaux marins de France, et le
      printemps en est la saison. Chaque année reviennent au cap Sizun le [guillemot de
      Troïl](/especie/uria_aalge/) et la [mouette tridactyle](/especie/rissa_tridactyla/), ainsi que le
      [fulmar boréal](/especie/fulmarus_glacialis/) et le goéland argenté, qui nichent dans les falaises
      abruptes. Outre les oiseaux marins, vivent ici toute l'année le [faucon
      pèlerin](/especie/falco_peregrinus/), le grand corbeau et le [crave à bec
      rouge](/especie/pyrrhocorax_pyrrhocorax/).


      Sur les rochers s'accrochent la criste marine et l'armérie maritime, aux fleurs semblables à des
      œillets. Parmi les plantes rares de la côte figurent *Limonium humile* et la carotte marine. En mer, le
      Parc naturel marin d'Iroise surveille et étudie le milieu marin local et œuvre pour le protéger.
    visit: >-
      La visite commence à la Maison de site, à environ 800 mètres de la pointe. Elle ouvre d'avril à fin
      octobre, ses expositions sont en accès libre, et une navette pour les personnes à mobilité réduite la
      relie à la pointe. Le parking et l'espace commercial ont été construits à quelque distance du site et y
      sont reliés par une navette.


      Pour marcher, deux boucles balisées de niveau moyen existent : le Tour de la Pointe du Raz, le sentier
      PR 14, de 10 km et 3 h 20, et le Tour de la Pointe du Van, le PR 13, de 11 km et 3 h 45. Le sentier
      européen E5, long de 3 050 km, relie la pointe à Venise, et le GR 34, qui longe toute la côte bretonne
      du Mont-Saint-Michel à Saint-Nazaire, passe aussi par le site.


      La Maison de site organise des visites guidées. L'une explique comment se sont formées les falaises, une
      autre raconte l'histoire humaine liée à ce bout du monde et une troisième parcourt landes battues par le
      vent, falaises abruptes et patrimoine discret. Une sortie guidée à pied montre aussi faune, flore,
      paysages et phares légendaires.
    history: >-
      Depuis l'Antiquité, le passage entre la pointe et l'île de Sein était célèbre pour sa dangerosité pour
      la navigation. Le premier phare du Raz, d'environ 18 mètres, fut construit en 1839 et allumé en même
      temps que celui de l'île de Sein. Entre les deux guerres, la pointe devint curiosité touristique
      nationale, parrainée par le Touring Club de France, et les voitures circulaient sur la lande même.


      Dans les années soixante furent bâtis à la hâte commerces, restaurants et parkings à la pointe, et avec
      près d'un million de visiteurs par an le piétinement massif dégrada le paysage. Il fallut une opération
      Grand Site pour restaurer son couvert de bruyère. Le site faillit connaître un autre destin :
      Électricité de France envisagea même une centrale nucléaire à cet endroit. À l'extrémité du plateau se
      trouvent aujourd'hui la statue de Notre-Dame des Naufragés et un sémaphore.
    before: >-
      L'accès au Trou de l'Enfer est extrêmement dangereux. Les sentiers E5 et GR 34 et les deux boucles de la
      Pointe du Raz et de la Pointe du Van sont balisés. Si vous cherchez des oiseaux marins, venez au
      printemps, quand ils reviennent sur les falaises.
    around: >-
      La Pointe du Raz n'a pas de voisins proches dans l'atlas, mais des sites lointains qui partagent avec
      elle côte et oiseaux. Le [Cap Fréhel](/lugar/cap-frehel/) abrite aussi fulmar boréal, crave à bec rouge
      et faucon pèlerin. L'[Île de Lundy](/lugar/lundy/) partage le fulmar boréal et le faucon pèlerin, et le
      [Grand Site des Deux-Caps](/lugar/grand-site-des-deux-caps---cote-d-opale/) partage le faucon pèlerin.
      [Great Blasket Island](/lugar/great-blasket-island/) partage avec elle le crave à bec rouge.
  de:
    intro: >-
      Auf Bretonisch bedeutet *raz* schnelle Strömung, und ein Blick aufs Meer genügt hier, um zu verstehen
      warum. Zwischen der Spitze, dem Leuchtturm La Vieille und dem Riff Gorle Greiz werfen Gezeitenströmungen
      hohen Wellengang auf, und dahinter, etwa 8 km westlich, trennt der gewaltige Raz de Sein, der dem Ort
      seinen Namen gibt, die Insel Sein vom Festland.


      Die Pointe du Raz ist das westlichste Felskap von Cap Sizun vor der Iroise-See im Südwesten des
      Finistère. Sie bildet einen zweiundsiebzig Meter hohen Bug über dem Raz de Sein und ist der südliche Arm
      eines Felsdreizacks, der die Iroise-See teilt, zusammen mit der Pointe de Saint-Mathieu und der
      Halbinsel Crozon.
    landscape: >-
      Cap Sizun endet in zwei Spitzen, der Pointe du Van im Norden und der Pointe du Raz im Süden, die die
      Baie des Trépassés einrahmen. Das Gestein der Spitze ist ein sehr feinkörniger Zweiglimmer-Leukogranit
      mit Biotit und Muskovit. Oben liegt ein Plateau, das sich rund 70 Meter über die Iroise-See erhebt und
      sanft bis zu einer äußersten Spitze auf 45 Metern abfällt. An Hang und Klippe bilden sich
      Vegetationsgürtel je nach Salz- und Windbelastung: schroffe Klippen, Heide und offenes Meer bieten
      vielen Arten Lebensraum.


      Unten hat das Meer den Fels bearbeitet. Eine natürliche Verwerfung durchzieht die Spitze teilweise von
      Nord nach Süd und verbindet die Bucht von Douarnenez mit der von Audierne vom Trou de l'Enfer aus, wo
      das Meer von drei Seiten eindringt. Im Norden liegen große Höhlen, in die das Meer unter der Spitze
      eindringt und die nur per Boot erreichbar sind. Im Raz de Sein erheben sich zwei automatisierte
      Leuchttürme auf Felsinseln: La Vieille und Tévennec.
    wildlife: >-
      Die Küste des Grand Site ist eines der größten Seevogelbrutgebiete Frankreichs, und der Frühling ist die
      beste Zeit. Jedes Jahr kehren [Trottellumme](/especie/uria_aalge/) und
      [Dreizehenmöwe](/especie/rissa_tridactyla/) nach Cap Sizun zurück, ebenso
      [Eissturmvogel](/especie/fulmarus_glacialis/) und Silbermöwe, die an den steilen Klippen brüten. Neben
      den Seevögeln leben hier ganzjährig [Wanderfalke](/especie/falco_peregrinus/), Kolkrabe und
      [Alpenkrähe](/especie/pyrrhocorax_pyrrhocorax/).


      An den Felsen halten sich Meerfenchel und Strand-Grasnelke mit nelkenartigen Blüten. Zu den seltenen
      Küstenpflanzen gehören *Limonium humile* und die Strandmöhre. Auf dem Meer überwacht und erforscht der
      Meeresnaturpark Iroise den lokalen Meeresraum und arbeitet zu seinem Schutz.
    visit: >-
      Der Besuch beginnt an der Maison de site, etwa 800 Meter vor der Spitze. Sie öffnet von April bis Ende
      Oktober, ihre Ausstellungen sind frei zugänglich, und ein Shuttle für Menschen mit eingeschränkter
      Mobilität verbindet sie mit der Spitze. Parkplatz und Geschäftsbereich wurden in einigem Abstand
      errichtet und sind per Shuttle angebunden.


      Zum Wandern gibt es zwei markierte Rundwege mittleren Anspruchs: die Tour de la Pointe du Raz, Weg PR
      14, mit 10 km und 3 h 20, und die Tour de la Pointe du Van, PR 13, mit 11 km und 3 h 45. Der Europäische
      Fernwanderweg E5 mit 3.050 km Länge verbindet die Spitze mit Venedig, und der GR 34, der die gesamte
      bretonische Küste vom Mont-Saint-Michel bis Saint-Nazaire säumt, führt ebenfalls vorbei.


      Die Maison de site organisiert Führungen. Eine erklärt die Entstehung der Klippen, eine andere erzählt
      die menschliche Geschichte dieses Endes der Welt und eine dritte führt über windgepeitschte Heiden,
      steile Klippen und unauffälliges Kulturerbe. Zudem gibt es eine geführte Wanderung zu Fauna, Flora,
      Landschaften und legendären Leuchttürmen.
    history: >-
      Seit der Antike war die Passage zwischen der Spitze und der Insel Sein als gefährlich für die
      Schifffahrt berüchtigt. Der erste Leuchtturm des Raz, rund 18 Meter hoch, wurde 1839 erbaut und
      zeitgleich mit dem auf der Insel Sein entzündet. Zwischen den Kriegen wurde die Spitze zu einer
      nationalen Touristenattraktion, gefördert vom Touring Club de France, und Autos fuhren direkt auf der
      Heide.


      In den sechziger Jahren wurden hastig Geschäfte, Restaurants und Parkplätze an der Spitze errichtet, und
      bei fast einer Million Besuchern im Jahr zerstörte massiver Tritt die Landschaft. Es brauchte eine
      Operation Grand Site, um die Heidebedeckung wiederherzustellen. Beinahe hätte der Ort ein anderes
      Schicksal gehabt: Électricité de France erwog hier sogar ein Kernkraftwerk. Am Ende des Plateaus stehen
      heute die Statue Notre-Dame des Naufragés und ein Seezeichen-Semaphor.
    before: >-
      Der Zugang zum Trou de l'Enfer ist extrem gefährlich. Die Wege E5 und GR 34 sowie die beiden Rundwege
      der Pointe du Raz und der Pointe du Van sind markiert. Wenn du Seevögel suchst, komm im Frühling, wenn
      sie an die Klippen zurückkehren.
    around: >-
      Die Pointe du Raz hat keine nahen Nachbarn im Atlas, wohl aber ferne Orte, die Küste und Vögel mit ihr
      teilen. Das [Cap Fréhel](/lugar/cap-frehel/) hat ebenfalls Eissturmvogel, Alpenkrähe und Wanderfalke.
      Die [Insel Lundy](/lugar/lundy/) teilt Eissturmvogel und Wanderfalke, und das [Grand Site des
      Deux-Caps](/lugar/grand-site-des-deux-caps---cote-d-opale/) teilt den Wanderfalken. [Great Blasket
      Island](/lugar/great-blasket-island/) teilt mit ihr die Alpenkrähe.
  it:
    intro: >-
      In bretone *raz* significa corrente rapida, e basta guardare il mare da qui per capire perché. Tra la
      punta, il faro della Vieille e il Gorle Greiz, le correnti di marea sollevano un moto ondoso intenso, e
      oltre, a circa 8 km a ovest, l'isola di Sein è separata dalla terraferma dal violento Raz de Sein, che
      dà il nome al luogo.


      La Pointe du Raz è il promontorio roccioso più occidentale di Cap Sizun, di fronte al mare d'Iroise, nel
      sud-ovest del Finistère. Forma una prua di settantadue metri che domina il Raz de Sein ed è il ramo
      inferiore di un tridente roccioso che fende il mare d'Iroise, insieme alla punta di Saint-Mathieu e alla
      penisola di Crozon.
    landscape: >-
      Cap Sizun termina in due punte, quella del Van a nord e quella del Raz a sud, che incorniciano la baia
      des Trépassés. La roccia della punta è un leucogranito a due miche, biotite e muscovite, a grana molto
      fine. In alto c'è un altopiano che si alza circa 70 metri sul mare d'Iroise e scende piano fino a
      un'estremità a 45 metri. Sul versante e sulla scogliera si formano fasce di vegetazione a seconda
      dell'esposizione a salsedine e vento: scogliere scoscese, landa a erica e mare aperto formano l'habitat
      di molte specie.


      Sotto, il mare ha lavorato la roccia. Una faglia naturale attraversa in parte la punta da nord a sud e
      collega la baia di Douarnenez con quella di Audierne dal Trou de l'Enfer, dove il mare entra da tre
      lati. A nord ci sono grandi grotte in cui il mare penetra sotto la punta, raggiungibili solo via mare.
      Nel Raz de Sein due fari automatizzati sorgono su isolotti: La Vieille e Tévennec.
    wildlife: >-
      La costa del Grand Site è una delle maggiori aree di nidificazione di uccelli marini della Francia, e la
      primavera è la stagione. Ogni anno tornano a Cap Sizun l'[uria](/especie/uria_aalge/) e il [gabbiano
      tridattilo](/especie/rissa_tridactyla/), oltre al [fulmaro](/especie/fulmarus_glacialis/) e al gabbiano
      reale nordico, che nidificano sulle scogliere scoscese. Oltre agli uccelli marini, vivono qui tutto
      l'anno il [falco pellegrino](/especie/falco_peregrinus/), il corvo imperiale e il [gracchio
      corallino](/especie/pyrrhocorax_pyrrhocorax/).


      Sulle rocce si aggrappano il finocchio di mare e l'armeria marittima, dai fiori simili a garofani. Tra
      le piante rare della costa figurano *Limonium humile* e la carota marina. In mare, il Parco Naturale
      Marino d'Iroise vigila e studia l'ambiente marino locale e lavora per proteggerlo.
    visit: >-
      La visita inizia alla Maison de site, a circa 800 metri dalla punta. Apre da aprile a fine ottobre, le
      sue mostre sono ad accesso libero e una navetta per persone a mobilità ridotta la collega alla punta. Il
      parcheggio e l'area commerciale sono stati costruiti a una certa distanza dal sito e vi sono collegati
      tramite una navetta.


      Per camminare ci sono due anelli segnalati di livello medio: il Tour de la Pointe du Raz, il sentiero PR
      14, di 10 km e 3 h 20, e il Tour de la Pointe du Van, il PR 13, di 11 km e 3 h 45. Il sentiero europeo
      E5, di 3.050 km, collega la punta a Venezia, e anche il GR 34, che costeggia tutta la Bretagna da
      Mont-Saint-Michel a Saint-Nazaire, passa per il sito.


      La Maison de site organizza visite guidate. Una spiega come si sono formate le scogliere, un'altra
      racconta la storia umana legata a questa fine del mondo e una terza percorre lande battute dal vento,
      scogliere ripide e patrimonio discreto. C'è anche un'uscita guidata a piedi che mostra fauna, flora,
      paesaggi e fari leggendari.
    history: >-
      Fin dall'Antichità il passaggio tra la punta e l'isola di Sein era celebre perché pericoloso per la
      navigazione. Il primo faro del Raz, alto circa 18 metri, fu costruito nel 1839 e acceso insieme a quello
      dell'isola di Sein. Tra le due guerre la punta fu curiosità turistica nazionale, patrocinata dal Touring
      Club de France, e le auto circolavano sulla landa stessa.


      Negli anni sessanta sorsero in fretta negozi, ristoranti e parcheggi sulla punta, e con quasi un milione
      di visitatori l'anno il calpestio massiccio degradò il paesaggio. Ci volle un'operazione Grand Site per
      ripristinarne la copertura di erica. Il sito rischiò un altro destino: Électricité de France arrivò a
      proporre una centrale nucleare in questo luogo. All'estremità dell'altopiano stanno oggi la statua di
      Notre-Dame des Naufragés e un semaforo marittimo.
    before: >-
      L'accesso al Trou de l'Enfer è estremamente pericoloso. I sentieri E5 e GR 34 e i due anelli della
      Pointe du Raz e della Pointe du Van sono segnalati. Se cerchi uccelli marini, vai in primavera, quando
      tornano sulle scogliere.
    around: >-
      La Pointe du Raz non ha vicini prossimi nell'atlante, ma luoghi lontani che condividono con essa costa e
      uccelli. Il [Cap Fréhel](/lugar/cap-frehel/) ospita anche fulmaro, gracchio corallino e falco
      pellegrino. L'[Isola di Lundy](/lugar/lundy/) condivide fulmaro e falco pellegrino, e il [Grand Site des
      Deux-Caps](/lugar/grand-site-des-deux-caps---cote-d-opale/) condivide il falco pellegrino. [Great
      Blasket Island](/lugar/great-blasket-island/) condivide con essa il gracchio corallino.
  pt:
    intro: >-
      Em bretão, *raz* significa corrente rápida, e basta olhar o mar daqui para entender porquê. Entre a
      ponta, o farol de la Vieille e o Gorle Greiz, as correntes de maré levantam forte ondulação, e mais
      além, a cerca de 8 km a oeste, a ilha de Sein fica separada de terra pelo violento raz de Sein, que dá
      nome ao lugar.


      A Pointe du Raz é o promontório rochoso mais ocidental do cabo Sizun, frente ao mar de Iroise, no
      sudoeste do Finistère. Forma uma proa de setenta e dois metros que domina o raz de Sein e é o ramo
      inferior de um tridente rochoso que parte o mar de Iroise, com a ponta de Saint-Mathieu e a península de
      Crozon.
    landscape: >-
      O cabo Sizun termina em duas pontas, a do Van a norte e a do Raz a sul, que emolduram a baía dos
      Trépassés. A rocha da ponta é um leucogranito de duas micas, biotite e moscovite, de grão muito fino. Em
      cima há um planalto que se ergue uns 70 metros sobre o mar de Iroise e desce devagar até uma ponta
      extrema a 45 metros. Na encosta e na falésia formam-se cinturas de vegetação consoante a exposição ao
      sal e ao vento: falésias escarpadas, urzal de urze e mar aberto formam o habitat de muitas espécies.


      Por baixo, o mar trabalhou a rocha. Uma falha natural atravessa em parte a ponta de norte a sul e liga a
      baía de Douarnenez à de Audierne a partir do Trou de l'Enfer, onde o mar entra por três lados. A norte
      há grandes grutas onde o mar se mete sob a ponta, e só se chega a elas por mar. No raz de Sein, dois
      faróis automatizados erguem-se sobre ilhéus: La Vieille e Tévennec.
    wildlife: >-
      A costa do Grand Site é uma das maiores zonas de criação de aves marinhas de França, e a primavera é a
      estação. Todos os anos regressam ao cabo Sizun o [airo](/especie/uria_aalge/) e a
      [gaivota-tridáctila](/especie/rissa_tridactyla/), e também o
      [fulmar-glacial](/especie/fulmarus_glacialis/) e a gaivota-prateada-europeia, que nidificam nas falésias
      escarpadas. Além das aves marinhas, vivem aqui todo o ano o
      [falcão-peregrino](/especie/falco_peregrinus/), o corvo-comum e a
      [gralha-de-bico-vermelho](/especie/pyrrhocorax_pyrrhocorax/).


      Nas rochas agarram-se o funcho-marinho e a arméria-marítima, de flores como cravos. Entre as plantas
      raras da costa estão *Limonium humile* e a cenoura-marinha. No mar, o Parque Natural Marinho de Iroise
      vigia e estuda o meio marinho local e trabalha para o proteger.
    visit: >-
      A visita começa na Maison de site, a cerca de 800 metros da ponta. Abre de abril a finais de outubro, as
      suas exposições são de acesso livre, e um vaivém para pessoas de mobilidade reduzida liga-a à ponta. O
      parque de estacionamento e o espaço comercial construíram-se a certa distância do sítio e ligam-se a ele
      por um vaivém.


      Para caminhar há duas voltas sinalizadas de nível médio: o Tour de la Pointe du Raz, o trilho PR 14, de
      10 km e 3 h 20, e o Tour de la Pointe du Van, o PR 13, de 11 km e 3 h 45. O trilho europeu E5, de 3.050
      km, liga a ponta a Veneza, e o GR 34, que percorre toda a costa bretã do Mont-Saint-Michel até
      Saint-Nazaire, também passa pelo sítio.


      A Maison de site organiza visitas guiadas. Uma explica como se formaram as falésias, outra conta a
      história humana ligada a este fim do mundo e uma terceira percorre urzais fustigados pelo vento,
      falésias abruptas e património discreto. Há também uma saída guiada a pé que mostra fauna, flora,
      paisagens e faróis lendários.
    history: >-
      Desde a Antiguidade, a passagem entre a ponta e a ilha de Sein era célebre por perigosa para a
      navegação. O primeiro farol do Raz, de cerca de 18 metros, construiu-se em 1839 e acendeu-se ao mesmo
      tempo que o da ilha de Sein. Entre as duas guerras a ponta foi curiosidade turística nacional,
      patrocinada pelo Touring Club de France, e os carros circulavam pelo próprio urzal.


      Nos anos sessenta ergueram-se à pressa comércios, restaurantes e parques de estacionamento na ponta, e
      com cerca de um milhão de visitantes por ano o pisoteio maciço degradou a paisagem. Foi necessária uma
      operação Grand Site para restaurar a sua cobertura de urze. O sítio esteve prestes a ter outro destino:
      a Électricité de France chegou a propor uma central nuclear neste lugar. No extremo do planalto estão
      hoje a estátua de Notre-Dame des Naufragés e um semáforo marítimo.
    before: >-
      O acesso ao Trou de l'Enfer é extremamente perigoso. Os trilhos E5 e GR 34 e as duas voltas da Pointe du
      Raz e da Pointe du Van estão sinalizados. Se procuras aves marinhas, vai na primavera, quando regressam
      às falésias.
    around: >-
      A Pointe du Raz não tem vizinhos próximos no atlas, mas sim lugares distantes que partilham com ela
      costa e aves. O [Cabo Fréhel](/lugar/cap-frehel/) tem também fulmar-glacial, gralha-de-bico-vermelho e
      falcão-peregrino. A [Ilha de Lundy](/lugar/lundy/) partilha o fulmar-glacial e o falcão-peregrino, e o
      [Grande Sítio dos Dois Cabos](/lugar/grand-site-des-deux-caps---cote-d-opale/) partilha o
      falcão-peregrino. [Great Blasket Island](/lugar/great-blasket-island/) partilha com ela a
      gralha-de-bico-vermelho.
