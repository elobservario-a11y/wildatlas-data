resumen:
  es: >-
    La península desértica del sur de Fuerteventura con el macizo del Pico de la Zarza (807 m) cayendo sobre
    los 12 km de la inaccesible playa volcánica de Cofete.
  en: >-
    The desert peninsula of southern Fuerteventura where the Pico de la Zarza massif (807 m) plunges toward
    the 12 km wild volcanic beach of Cofete.
  fr: >-
    La péninsule désertique du sud de Fuerteventura où le massif du Pico de la Zarza (807 m) plonge sur les 12
    km de plage volcanique de Cofete.
  de: >-
    Die Wüstenhalbinsel im Süden Fuerteventuras, wo das Bergmassiv des Pico de la Zarza (807 m) auf den 12 km
    langen wilden Vulkanstrand von Cofete abfällt.
  it: >-
    La penisola desertica del sud di Fuerteventura con il massiccio del Pico de la Zarza (807 m) che precipita
    sui 12 km della spiaggia vulcanica di Cofete.
  pt: >-
    A península desértica do sul de Fuerteventura com o maciço do Pico de la Zarza (807 m) a cair sobre os 12
    km da praia vulcânica de Cofete.
unico:
  es: >-
    Es el único lugar donde crece el cardón de Jandía, la planta que simboliza a la vez el parque y toda la
    isla.
  en: >-
    The only place on Earth where the Jandía cardón grows, a cactus-like spurge that serves as the natural
    symbol of both the park and the entire island.
  fr: >-
    Le seul endroit où pousse l’euphorbe de Jandía, la plante endémique qui symbolise à la fois le parc et
    toute l’île.
  de: >-
    Der weltweit einzige Wuchsort der Jandía-Wolfsmilch, einer sukkulenten Pflanze, die das Wappen des
    Naturparks und der gesamten Insel prägt.
  it: >-
    L’unico luogo al mondo dove cresce il cardo di Jandía, la pianta grassa endemica che è il simbolo naturale
    del parco e dell’intera isola.
  pt: >-
    O único lugar onde cresce o cardón-de-jandía, planta suculenta que é o símbolo natural do parque e de toda
    a ilha.
observaciones:
  es: >-
    No te salgas de los senderos señalizados ni camines por espacios no permitidos: salirse de los caminos
    daña el entorno y puede ser peligroso. No enciendas fuego fuera de las zonas permitidas, con especial
    cuidado en verano. No dejes residuos, ni siquiera colillas, no arranques plantas ni te lleves piedras, y
    no molestes ni alimentes a los animales; si ves uno herido, avisa al teléfono de emergencias.
texto:
  es:
    intro: >-
      Jandía fue una isla. Un volcán enorme, de unos 26 km de diámetro en su apogeo, se alzó aquí hace 14 o 15
      millones de años, y hoy lo que queda de él es una media luna de montañas pegada al extremo sur de
      Fuerteventura por un istmo de arena, La Pared. El Parque Natural de Jandía protege esa península
      desértica, en el municipio de Pájara, con su cumbre más alta, el pico de la Zarza, y la costa de
      Barlovento que se despliega a sus pies.
    landscape: >-
      Para entender Jandía hay que imaginarla completa. El volcán llegó a levantarse al menos 1.500 m, pero su
      última erupción fue tan violenta que el edificio se derrumbó hacia el mar. Lo que sobrevivió es la mitad
      de una caldera, un gran arco abierto al norte. Por eso el paisaje es un contraste continuo.


      Si llegas por tierra, lo primero que cruzas es el istmo arenoso de La Pared. Luego el relieve se levanta
      hasta el pico de la Zarza (807 m), la cumbre de toda Fuerteventura, que se asoma sobre el arco de Cofete
      y la playa de Barlovento.


      La vegetación sube con la altura. Aquí están los hábitats más importantes de la isla: arenales,
      saladares, llanuras pedregosas, barrancos y cumbres. En las laderas altas, entre los 400 y los 800 m,
      crece el matorral de jorjao, y en la ladera norte del pico sobreviven restos de monteverde seco, con
      aderno, paloblanco, laurel, brezo y mocán, todos escasos y dispersos. Hasta el nombre de la montaña
      viene de una planta: la zarzamora, que en Fuerteventura solo crece en las cumbres de Jandía.
    wildlife: >-
      Jandía se mira con prismáticos. En los arenales interiores y las zonas pedregosas viven la
      [hubara](/especie/chlamydotis_undulata/) canaria y el [alcaraván](/especie/burhinus_oedicnemus/). Los
      riscos y barrancos son terreno del [guirre](/especie/neophron_percnopterus/) (el alimoche de la isla),
      el [cernícalo](/especie/falco_tinnunculus/), el halcón de Berbería y el [águila
      pescadora](/especie/pandion_haliaetus/), a la que aquí llaman guincho. En la costa, el [chorlitejo
      patinegro](/especie/charadrius_alexandrinus/) y el chorlitejo chico crían o invernan en las playas.


      Entre las plantas, el cardón de Jandía (Euphorbia handiensis) solo aparece en el interior del parque, y
      junto a él crecen el tajinaste azul de flores azules, la magarza de Winter y el anís de Jandía. Las
      laderas altas guardan además endemismos como la pelotilla.


      Entre los reptiles, el lagarto atlántico y el perenquén majorero son endémicos, y también vive aquí la
      lisa majorera. En total, el parque suma 28 especies de aves nidificantes, 3 de reptiles y 12 de
      mamíferos. En las playas ha nidificado la tortuga laúd, uno de los pocos puntos de Europa donde se ha
      registrado, y en sus aguas se ven calderones y cachalotes. Los ibis sagrados que ves por la costa se
      introdujeron en semilibertad: no son de aquí.


      Jandía se visita todo el año; lo que sí cambia es lo que llevas en la mochila.
    visit: >-
      La ruta a pie por excelencia sube al pico de la Zarza: 6,8 km y unas cinco horas y media. El camino está
      señalizado con postes que indican la distancia recorrida y la que falta, y desde la cumbre se ve el arco
      de Cofete y la playa de Barlovento. Lleva agua abundante, sombrero y protección solar: en el recorrido
      no hay fuentes ni sombra.


      El otro gran punto de referencia es Cofete, una playa larga y salvaje al pie del macizo, con un pequeño
      poblado de unas 25 personas, las Casas de Cofete. Por encima, en la ladera, se alza la Villa Winter,
      construida en 1946.
    history: >-
      Jandía tiene rango de parque natural desde 1987. El sector externo al parque, al sur de la península, es
      área de sensibilidad ecológica y zona de especial protección para las aves. El faro de Punta Jandía, en
      el extremo suroeste, entró en servicio en 1864 y es uno de los más antiguos de Canarias. En el municipio
      de Pájara quedan también vestigios de la cultura aborigen: casas de piedra seca, cuevas que sirvieron de
      vivienda y estructuras ganaderas.


      La amenaza más cercana es pequeña y doméstica: los restos de comida favorecen la proliferación de
      roedores y gatos asilvestrados, un peligro grave para la fauna del parque.
    before: >-
      No te salgas de los senderos señalizados ni camines por espacios no permitidos: salirse de los caminos
      daña el entorno y puede ser peligroso. No enciendas fuego fuera de las zonas permitidas, con especial
      cuidado en verano. No dejes residuos, ni siquiera colillas, no arranques plantas ni te lleves piedras, y
      no molestes ni alimentes a los animales; si ves uno herido, avisa al teléfono de emergencias.
    around: >-
      Lejos de Fuerteventura, el parque comparte especies con [Parque Nacional del Río Salvaje
      Vjosa](/lugar/vjosa-wild-river-national-park/), donde también se ve el alimoche y el chorlitejo chico, y
      con el [Parque Natural Marítimo-Terrestre del Cabo de
      Gata-Níjar](/lugar/parque-natural-maritimo-terrestre-del-cabo-de-gata-nijar/), que comparte con Jandía
      la hubara y los hábitats de costa y estepa.
  en:
    intro: >-
      Jandía was once an independent volcanic island. An immense volcano, spanning roughly 26 km across at its
      peak, arose here 14 or 15 million years ago; today, its remnant forms a mountainous crescent anchored to
      the southern tip of Fuerteventura by a narrow sandy isthmus, La Pared. Jandía Natural Park protects this
      vast arid peninsula within the municipality of Pájara, encompassing its highest summit, Pico de la
      Zarza, and the windswept Barlovento coast unfolding at its base.
    landscape: >-
      To understand Jandía, you must reconstruct it in your mind. The ancestral volcano originally rose to at
      least 1,500 m, but its climactic eruption proved so catastrophic that the entire northern flank
      collapsed into the Atlantic. What survived is a caldera rim forming a grand volcanic amphitheatre open
      to the ocean. The terrain is defined by dramatic geological contrast.


      Approaching by land, you first cross the desert dunes of the La Pared isthmus. The relief then climbs
      sharply to Pico de la Zarza (807 m), the rooftop of Fuerteventura, dropping precipitously toward the
      sweeping bay of Cofete and the wild Barlovento beach.


      Vegetation zones stratify by elevation across sandy plains, salt flats, stony hammadas, deep ravines and
      arid ridges. On higher slopes between 400 and 800 m, jorjao scrub takes hold, while the sheltered
      northern face of the peak harbours relict fragments of dry monteverde woodland—home to rare aderno,
      white laurel, heathers and mocán. Even the mountain’s name reflects this flora: the native blackberry,
      zarzamora, which on Fuerteventura survives solely on the crests of Jandía.
    wildlife: >-
      Jandía rewards birdwatchers with sharp binoculars. Across desert sands and stony flats wander the Canary
      Islands [houbara bustard](/especie/chlamydotis_undulata/) and the [Eurasian
      stone-curlew](/especie/burhinus_oedicnemus/). Sheer crags and desert gorges host the [Egyptian
      vulture](/especie/neophron_percnopterus/) (locally called guirre), the [common
      kestrel](/especie/falco_tinnunculus/), the Barbary falcon and the [osprey](/especie/pandion_haliaetus/),
      known locally as guincho. Along the wild shoreline, [Kentish plover](/especie/charadrius_alexandrinus/)
      and little ringed plover nest and winter on sandy beaches.


      Botanically, the Jandía cardón (Euphorbia handiensis) grows nowhere else, alongside the blue-flowering
      tajinaste, Winter's marguerite and the wild Jandía aniseed. High rocky slopes shelter micro-endemics
      such as the rare pelotilla.


      Among reptiles, the Atlantic lizard and the East Canary gecko are endemic to the eastern Canaries,
      alongside the elusive Fuerteventura skink. In total, the park records 28 breeding bird species, 3
      reptile species and 12 mammal species. Leatherback sea turtles have occasionally nested on remote
      beaches—a rare event in European waters—while short-finned pilot whales and sperm whales frequent
      offshore currents. The sacred ibises seen near coastal settlements are an introduced, semi-captive
      population.


      Jandía is rewarding year-round, though seasonal gear requirements vary.
    visit: >-
      The premier walking route ascends Pico de la Zarza: a 6.8 km hike taking around five and a half hours
      round trip. The path is clearly marked with distance marker posts, and the summit presents an
      extraordinary view overlooking the crescent of Cofete and the Barlovento shoreline. Carry plenty of
      drinking water, a wide-brimmed sun hat and high-factor sunscreen, as the entire ridge offers neither
      springs nor shade.


      The other iconic destination is Cofete, an expansive wild beach beneath the jagged mountain wall, home
      to a hamlet of around 25 residents at Casas de Cofete. Up on the hillside stands the enigmatic Villa
      Winter, built in 1946.
    history: >-
      Jandía gained natural park status in 1987. Adjacent southern coastal sectors are designated ecological
      sensitivity zones and special protection areas for birdlife. Punta Jandía lighthouse, perched on the
      southwestern promontory, entered service in 1864 and ranks among the oldest operational beacons in the
      Canaries. The municipality of Pájara also preserves indigenous Majorero archaeological remains:
      dry-stone dwellings, pastoral stone enclosures and habitational caves.


      A serious threat comes from domestic wildlife: discarded food scraps encourage feral cat and rodent
      populations, which severely disrupt native ground-nesting birds and endemic lizards.
    before: >-
      Never leave marked trails or enter restricted biological corridors; walking off-path accelerates fragile
      soil erosion and damages endemic flora. Open fires are strictly prohibited year-round, especially in
      arid summer months. Pack out every scrap of rubbish, do not uproot plants or collect mineral specimens,
      and never disturb or feed wild animals; report injured fauna to emergency services.
    around: >-
      Beyond Fuerteventura, the park shares species with [Vjosa Wild River National
      Park](/lugar/vjosa-wild-river-national-park/), which also hosts Egyptian vultures and little ringed
      plovers, and with [Cabo de Gata-Níjar Natural
      Park](/lugar/parque-natural-maritimo-terrestre-del-cabo-de-gata-nijar/), which mirrors Jandía’s arid
      coastal steppes and houbara bustard habitats.
  fr:
    intro: >-
      Jandía fut autrefois une île distincte. Un gigantesque volcan d'environ 26 km de diamètre à son apogée
      s'éleva ici il y a 14 ou 15 millions d'années ; il n'en reste aujourd'hui qu'un croissant montagneux
      relié à l'extrémité méridionale de Fuerteventura par l'isthme sableux de La Pared. Le parc naturel de
      Jandía préserve cette péninsule aride de la commune de Pájara, avec son sommet culminant, le pico de la
      Zarza, et la côte sauvage de Barlovento qui s'étire à ses pieds.
    landscape: >-
      Pour comprendre Jandía, il faut imaginer sa structure originelle. Le volcan atteignait au moins 1 500 m
      d'altitude avant qu'une éruption cataclysmique n'effondre tout son flanc septentrional dans l'océan. La
      moitié restante forme un immense amphithéâtre rocheux ouvert sur la mer, créant un paysage de contrastes
      saisissants.


      En arrivant par la terre, vous franchissez d'abord l'isthme désertique de La Pared. Le relief s'élève
      ensuite vigoureusement vers le pico de la Zarza (807 m), point culminant de toute l'île de
      Fuerteventura, dominant l'arc de Cofete et la plage océanique de Barlovento.


      La végétation s'étage selon l'altitude à travers dunes, steppes salées, plaines rocailleuses, ravins et
      crêtes rocheuses. Entre 400 et 800 m d'altitude s'étendent les fourrés de jorjao, tandis que le versant
      nord du pic abrite des reliques de monteverde sec avec aderno, laurier, bruyère et mocán. Le nom même du
      pic vient d'une plante : la ronce sauvage zarzamora, qui ne subsiste sur Fuerteventura que sur les
      hauteurs de Jandía.
    wildlife: >-
      Jandía s'explore avec des jumelles. Dans les plaines de sable et les étendues caillouteuses arpentent
      l’[outarde houbara](/especie/chlamydotis_undulata/) des Canaries et l’[œdicnème
      criard](/especie/burhinus_oedicnemus/). Les parois rocheuses et les ravins abritent le [vautour
      percnoptère](/especie/neophron_percnopterus/) (nommé guirre sur l'île), le [faucon
      crécerelle](/especie/falco_tinnunculus/), le faucon de Barbarie et le [balbuzard
      pêcheur](/especie/pandion_haliaetus/), appelé guincho. Sur le littoral sauvage, le [pluvier à collier
      interrompu](/especie/charadrius_alexandrinus/) et le petit gravelot nichent ou hivernent sur les plages
      de sable.


      Parmi la flore, l'euphorbe de Jandía (Euphorbia handiensis) n'apparaît nulle part ailleurs, côtoyant la
      vipérine bleue, la marguerite de Winter et l'anis sauvage de Jandía. Les pentes sommitales protègent
      également des micro-espèces endémiques comme la pelotilla.


      Côté reptiles, le lézard de Fuerteventura et la tarente de l'Est des Canaries sont endémiques, aux côtés
      du rare scinque majorero. Au total, le parc compte 28 espèces d’oiseaux nicheurs, 3 espèces de reptiles
      et 12 espèces de mammifères. La tortue luth a déjà pondu sur ses plages isolées, fait exceptionnel en
      Europe, tandis que globicéphales et cachalots croisent au large. Les ibis sacrés observés sur la côte
      proviennent d'introductions semi-captives.


      Le parc se visite toute l'année, même si le contenu du sac à dos s'adapte aux saisons.
    visit: >-
      La grande randonnée pédestre permet de gravir le pico de la Zarza : 6,8 km pour environ cinq heures et
      demie de marche aller-retour. L'itinéraire est balisé de bornes indiquant les distances, et le sommet
      offre une vue panoramique plongeante sur la courbe de Cofete et la côte de Barlovento. Prévoyez une
      réserve d'eau abondante, un chapeau et une protection solaire, car le sentier ne comporte aucune source
      ni zone d'ombre.


      L'autre étape majeure est la plage sauvage de Cofete au pied du massif, avec son hameau d'environ 25
      habitants, les Casas de Cofete. Sur la pente supérieure se dresse la silhouette énigmatique de la Villa
      Winter, construite en 1946.
    history: >-
      Jandía bénéficie du statut de parc naturel depuis 1987. Le secteur côtier au sud de la péninsule
      constitue une zone de sensibilité écologique et une zone de protection spéciale pour les oiseaux. Le
      phare de Punta Jandía, à l'extrémité sud-ouest, est entré en service en 1864 et figure parmi les plus
      anciens des Canaries. La commune de Pájara conserve en outre des vestiges des populations aborigènes
      guanches : maisons de pierres sèches, grottes d'habitation et murets pastoraux.


      La menace la plus directe découle de la présence humaine : les déchets alimentaires favorisent rongeurs
      et chats errants, prédateurs redoutables pour la faune endémique.
    before: >-
      Ne quittez jamais les sentiers balisés et respectez les zones interdites d'accès pour éviter l'érosion
      des sols et préserver la flore fragile. Tout feu est formellement interdit en dehors des secteurs
      prévus, particulièrement en été. Emportez l'intégralité de vos déchets, ne cueillez aucune plante, ne
      ramassez pas de pierres et ne dérangez pas la faune ; signalez tout animal blessé aux secours.
    around: >-
      Loin de Fuerteventura, le parc partage des affinités écologiques avec le [parc national du fleuve
      sauvage Vjosa](/lugar/vjosa-wild-river-national-park/), où se rencontrent le percnoptère et le petit
      gravelot, ainsi qu'avec le [parc naturel de Cabo de
      Gata-Níjar](/lugar/parque-natural-maritimo-terrestre-del-cabo-de-gata-nijar/), qui partage avec Jandía
      l'outarde houbara et ses paysages de steppe côtière.
  de:
    intro: >-
      Jandía war einst eine eigenständige Vulkaninsel. Ein gewaltiger Schildvulkan von rund 26 km Durchmesser
      erhob sich hier vor 14 oder 15 Millionen Jahren; heute bildet sein erodierter Rest eine Bergkette in
      Halbmondform, die über die sandige Landenge von La Pared mit dem Süden Fuerteventuras verbunden ist. Der
      Naturpark Jandía bewahrt diese halbwüstenartige Halbinsel im Gemeindegebiet von Pájara mit ihrem
      höchsten Gipfel, dem Pico de la Zarza, und der wilden Barlovento-Küste.
    landscape: >-
      Um Jandía zu verstehen, muss man sich die ursprüngliche Vulkanstruktur vor Augen führen. Der Berg türmte
      sich einst auf mindestens 1.500 m auf, ehe eine katastrophale Flankenexplosion die gesamte Nordseite ins
      Meer stürzen ließ. Zurück blieb die halbe Calderawand als riesiges, zum Ozean offenes Felsamphitheater,
      das von dramatischen Landschaftskontrasten geprägt ist.


      Auf dem Landweg durchquerst du zunächst die Sanddünen der Landenge von La Pared. Danach steigt das
      Relief jäh an bis zum Pico de la Zarza (807 m), dem Dach Fuerteventuras, der senkrecht zur weiten Bucht
      von Cofete und zum Barlovento-Strand abbricht.


      Die Vegetation staffelt sich mit der Höhe über Sandflächen, Salzsümpfe, Geröllfluren, Schluchten und
      Bergkämme. In den Hochlagen zwischen 400 und 800 m dominiert das Jorjao-Gestrüpp, während die schattige
      Nordflanke Reste des trockenen Lorbeerwaldes mit Aderno, Lorbeerbäumen, Baumheide und Mocán bewahrt.
      Sogar der Name des Berges stammt von einer Pflanze: der Brombeere Zarzamora, die auf Fuerteventura nur
      auf den Höhen Jandías überlebt.
    wildlife: >-
      Jandía erkundest du am besten mit dem Fernglas. Auf den kargen Sand- und Schotterfluren leben die
      Kanarische [Kragentrappe](/especie/chlamydotis_undulata/) und der
      [Triel](/especie/burhinus_oedicnemus/). Steilwände und Schluchten sind das Revier von
      [Schmutzgeier](/especie/neophron_percnopterus/) (Guirre genannt),
      [Turmfalke](/especie/falco_tinnunculus/), Berberfalke und [Fischadler](/especie/pandion_haliaetus/),
      hier Guincho genannt. An der Brandungsküste brüten und überwintern
      [Seeregenpfeifer](/especie/charadrius_alexandrinus/) und Flussregenpfeifer an einsamen Sandstränden.


      In der Pflanzenwelt wächst die Jandía-Wolfsmilch (Euphorbia handiensis) ausschließlich hier, begleitet
      vom blauen Natternkopf, Winters Wucherblume und dem Jandía-Anis. Hohe Felshänge beherbergen zudem
      seltene Lokalendemiten wie die Pelotilla.


      Unter den Reptilien sind die Atlantische Eidechse und der Kanaren-Mauergecko endemisch, neben dem
      seltenen Fuerteventura-Skink. Insgesamt verzeichnet der Park 28 Brutvogelarten, 3 Reptilienarten und 12
      Säugetierarten. Lederschildkröten legten vereinzelt Eier an den Stränden ab – ein seltenes Ereignis in
      europäischen Gewässern –, während Grindwale und Pottwale vor der Küste ziehen. Die an der Küste
      anzutreffenden Heiligen Ibisse entstammen Auswilderungen.


      Jandía lohnt sich das ganze Jahr über, wobei die Ausrüstung je nach Jahreszeit angepasst werden sollte.
    visit: >-
      Die Paraderoute für Wanderer führt hinauf zum Pico de la Zarza: eine Wanderung von 6,8 km und etwa
      fünfundeinhalb Stunden Gehzeit hin und zurück. Holzpfosten markieren den Streckenverlauf mit genauen
      Entfernungsangaben, und der Gipfel eröffnet eine weite Aussicht über den Bogen von Cofete und die Küste.
      Nimm reichlich Trinkwasser, Kopfbedeckung und Sonnenschutz mit, da der gesamte Aufstieg schattenlos und
      ohne Wasserquellen verläuft.


      Das andere Hauptziel ist der Strand von Cofete am Fuße des Massivs, mit einer winzigen Siedlung von rund
      25 Bewohnern in den Casas de Cofete. Am Hang darüber thront die geheimnisvolle Villa Winter, erbaut im
      Jahr 1946.
    history: >-
      Jandía besitzt seit 1987 den Status eines Naturparks. Der äußere Küstenstreifen im Süden gilt als
      ökologisch sensibles Schutzgebiet und Vogelschutzgebiet. Der Leuchtturm von Punta Jandía an der
      Südwestspitze nahm 1864 seinen Betrieb auf und zählt zu den ältesten Signalanlagen der Kanaren. Auf dem
      Gemeindegebiet von Pájara finden sich auch Zeugnisse der altkanarischen Ureinwohner: Trockensteinbauten,
      Wohnhöhlen und alte Weidemauern.


      Eine ernste Bedrohung geht von menschlichen Abfällen aus: Essensreste begünstigen Ratten und verwilderte
      Katzen, die die einheimische Tierwelt stark dezimieren.
    before: >-
      Verlasse keinesfalls die markierten Pfade, um Bodenerosion zu vermeiden und die seltene Vegetation zu
      schützen. Offenes Feuer ist außerhalb ausgewiesener Plätze streng verboten, besonders im trockenen
      Sommer. Nimm sämtlichen Müll wieder mit, reiße keine Pflanzen aus, sammle keine Steine und füttere keine
      Wildtiere; melde verletzte Tiere unverzüglich den Notdiensten.
    around: >-
      Weit entfernt von Fuerteventura teilt der Naturpark Lebensräume mit dem
      [Vjosa-Wildfluss-Nationalpark](/lugar/vjosa-wild-river-national-park/), wo Schmutzgeier und
      Flussregenpfeifer vorkommen, sowie mit dem [Naturpark Cabo de
      Gata-Níjar](/lugar/parque-natural-maritimo-terrestre-del-cabo-de-gata-nijar/), der mit Jandía die
      Kragentrappe und steppenartige Küstenlebensräume teilt.
  it:
    intro: >-
      Jandía fu un'isola a sé stante. Un enorme vulcano, di circa 26 km di diametro al suo culmine, sorse qui
      14 o 15 milioni di anni fa; oggi i suoi resti formano una mezzaluna di montagne saldata all'estremità
      meridionale di Fuerteventura tramite l'istmo sabbioso di La Pared. Il Parco Naturale di Jandía tutela
      questa penisola semidesertica nel comune di Pájara, con la sua vetta più elevata, il Pico de la Zarza, e
      la selvaggia costa di Barlovento che si apre ai suoi piedi.
    landscape: >-
      Per capire Jandía bisogna visualizzarne la struttura primordiale. Il vulcano originario si innalzava ad
      almeno 1.500 m di quota, ma la sua eruzione terminale fu così violenta da far franare l'intero settore
      settentrionale nell'oceano. Ciò che è sopravvissuto è metà della caldera, un gigantesco arco roccioso
      spalancato verso nord, che genera un paesaggio di forti contrasti.


      Arrivando via terra si attraversa dapprima l'istmo sabbioso di La Pared. Poi il terreno si innalza
      bruscamente fino al Pico de la Zarza (807 m), la cima più alta di Fuerteventura, che si affaccia a
      strapiombo sull'arco di Cofete e sulla spiaggia oceanica di Barlovento.


      La vegetazione cambia con l'altitudine tra distese di sabbia, saline, pietraie, canaloni e creste
      montuose. Sulle pendici elevate, tra i 400 e gli 800 m, domina la macchia di jorjao, mentre il versante
      nord della vetta conserva lembi di monteverde secco con aderno, alloro, erica e mocán. Perfino il nome
      del monte deriva da una pianta: la mora selvatica zarzamora, che a Fuerteventura vegeta soltanto sulle
      alture di Jandía.
    wildlife: >-
      Jandía si esplora con il binocolo. Nelle piane sabbiose e nelle pietraie dell'interno vivono
      l’[ubara](/especie/chlamydotis_undulata/) delle Canarie e l’[occhione](/especie/burhinus_oedicnemus/).
      Rupi e canaloni sono territorio del [capovaccaio](/especie/neophron_percnopterus/) (chiamato guirre
      sull'isola), del [gheppio comune](/especie/falco_tinnunculus/), del falco berbero e del [falco
      pescatore](/especie/pandion_haliaetus/), localmente noto come guincho. Lungo la costa selvaggia, il
      [fratino](/especie/charadrius_alexandrinus/) e il corriere piccolo nidificano o svernano sulle spiagge.


      Tra le specie botaniche, il cardo di Jandía (Euphorbia handiensis) vegeta esclusivamente nel territorio
      del parco, affiancato dall'erba viperina blu, dalla margherita di Winter e dall'anice selvatico di
      Jandía. I crinali alti accolgono endemismi rari come la pelotilla.


      Tra i rettili, la lucertola atlantica e il geco delle Canarie orientali sono endemici, così come lo
      scinco di Fuerteventura. In totale il parco conta 28 specie di uccelli nidificanti, 3 di rettili e 12 di
      mammiferi. Sulle spiagge ha nidificato la tartaruga liuto, un evento eccezionale in Europa, mentre al
      largo incrociano globicefali e capodogli. Gli ibis sacri visibili sul litorale derivano da individui
      introdotti in semi-cattività.


      Jandía si visita tutto l'anno, adattando l'equipaggiamento alle condizioni meteo.
    visit: >-
      Il percorso a piedi più celebre sale al Pico de la Zarza: 6,8 km e circa cinque ore e mezza di cammino
      tra andata e ritorno. Il sentiero è ben tracciato con cippi che indicano la distanza percorsa e quella
      rimanente; dalla cima si apre un panorama immenso sull'arco di Cofete e la costa di Barlovento. Porta
      con te abbondante scorta d'acqua, cappello e protezione solare: lungo l'itinerario non si trovano
      sorgenti né zone d'ombra.


      L'altro punto di riferimento imprescindibile è Cofete, una spiaggia lunga e selvaggia ai piedi del
      massiccio, con un minuscolo borgo di circa 25 abitanti, le Casas de Cofete. Poco sopra sorge la
      misteriosa Villa Winter, edificata nel 1946.
    history: >-
      Jandía è parco naturale dal 1987. Il settore costiero a sud della penisola è classificato come area di
      sensibilità ecologica e zona di protezione speciale per l'avifauna. Il faro di Punta Jandía,
      all'estremità sud-occidentale, è entrato in funzione nel 1864 ed è uno dei più antichi delle Canarie.
      Nel comune di Pájara si conservano anche testimonianze dell'antica civiltà aborigena majorera: capanne
      in pietra a secco, grotte abitate e recinti pastorali.


      La minaccia più grave deriva dalla vicinanza umana: i residui di cibo favoriscono il proliferare di
      roditori e gatti inselvatichiti, predatori letali per la fauna autoctona.
    before: >-
      Non abbandonare mai i sentieri segnalati e non camminare in aree non consentite per non degradare il
      suolo ed evitare rischi. È vietato accendere fuochi fuori dalle aree autorizzate, con massima cautela in
      estate. Riporta indietro tutti i rifiuti compresi i mozziconi, non estirpare piante né prelevare pietre,
      e non disturbare o nutrire gli animali; avvisa i soccorsi in caso di fauna ferita.
    around: >-
      Lontano da Fuerteventura, il parco condivide specie con il [Parco Nazionale del Fiume Selvaggio
      Vjosa](/lugar/vjosa-wild-river-national-park/), dove si incontrano il capovaccaio e il corriere piccolo,
      e con il [Parco Naturale Cabo de
      Gata-Níjar](/lugar/parque-natural-maritimo-terrestre-del-cabo-de-gata-nijar/), che condivide con Jandía
      l'ubara e gli ambienti aridi steppici costieri.
  pt:
    intro: >-
      Jandía foi no passado uma ilha independente. Um vulcão colossal, com cerca de 26 km de diâmetro no seu
      apogeu, ergueu-se aqui há 14 ou 15 milhões de anos; hoje, os seus vestígios formam uma meia-lua
      montanhosa ligada ao extremo sul de Fuerteventura através do istmo arenoso de La Pared. O Parque Natural
      de Jandía protege esta vasta península desértica no município de Pájara, englobando o seu cume
      culminante, o Pico de la Zarza, e o litoral bravio de Barlovento estendido a seus pés.
    landscape: >-
      Para compreender Jandía é necessário reconstruir a sua morfologia original. O vulcano primitivo chegou a
      atingir pelo menos 1.500 m de altitude, mas uma erupção cataclísmica provocou o colapso de toda a sua
      vertente norte para o oceano. O que sobreviveu é metade de uma gigantesca caldeira em anfiteatro aberta
      ao mar, desenhando uma paisagem de forte contraste.


      Chegando por terra, cruzas primeiro o istmo dunar de La Pared. Em seguida o relevo eleva-se abruptamente
      até ao Pico de la Zarza (807 m), o ponto mais alto de toda a Fuerteventura, debruçado sobre a baía de
      Cofete e a praia bravia de Barlovento.


      A vegetação distribui-se em andares com a altitude por areais, sapais, planícies pedregosas, barrancos e
      cumes. Nas encostas altas, entre os 400 e os 800 m, prospera o matagal de jorjao, enquanto a vertente
      norte do pico abriga relíquias de monteverde seco com aderno, loureiro, urze e mocán. Até o próprio nome
      da montanha provém de uma planta: a amora-brava zarzamora, que em Fuerteventura sobrevive unicamente nos
      cumes de Jandía.
    wildlife: >-
      Jandía observa-se de binóculos em punho. Nos areais interiores e nas zonas rochosas habitam a
      [abetarda-hubara](/especie/chlamydotis_undulata/) e o [alcaravão](/especie/burhinus_oedicnemus/). As
      escarpas e ravinas profundas são refúgio do [abutre-do-egito](/especie/neophron_percnopterus/)
      (conhecido na ilha por guirre), do [peneireiro-de-dorso-malhado](/especie/falco_tinnunculus/), do
      falcão-berbere e da [águia-pesqueira](/especie/pandion_haliaetus/), chamada guincho pelos habitantes
      locais. Na costa desértica, o [borrelho-de-coleira-interrompida](/especie/charadrius_alexandrinus/) e o
      borrelho-pequeno-de-coleira nidificam ou invernam nas praias.


      Na flora, o cardón-de-jandía (Euphorbia handiensis) ocorre unicamente no interior do parque, convivendo
      com o massaroco-azul, a margarida-de-Winter e o anis-silvestre de Jandía. As encostas de altitude
      guardam ainda endemismos estritos como a pelotilla.


      Entre os répteis, o lagarto-atlântico e a osga-moura são endémicos, a par do raro esquinco de
      Fuerteventura. No total, o parque contabiliza 28 espécies de aves nidificantes, 3 de répteis e 12 de
      mamíferos. Nas suas praias já desovou a tartaruga-de-couro, facto excecional no continente europeu, e
      nas águas profundas observam-se baleias-piloto e cachalotes. Os íbis-sagrados presentes no litoral
      resultam de fugas de cativeiro.


      Jandía visita-se todo o ano, variando apenas o equipamento que levas na mochila.
    visit: >-
      O trilho pedestre por excelência sobe ao Pico de la Zarza: 6,8 km e cerca de cinco horas e meia de
      caminhada de ida e volta. O trajeto está sinalizado com marcos que indicam a distância percorrida e a
      que falta percorrer, e o cume proporciona uma vista arrebatadora sobre o arco de Cofete e a praia de
      Barlovento. Leva água abundante, chapéu e protetor solar, pois em todo o percurso não existem fontes nem
      sombras.


      O outro grande destino é Cofete, uma praia imensa e bravia ao sopé do maciço, com uma pequena aldeia de
      cerca de 25 habitantes nas Casas de Cofete. Na encosta sobranceira ergue-se a misteriosa Villa Winter,
      construída em 1946.
    history: >-
      Jandía possui estatuto de parque natural desde 1987. O setor costeiro meridional exterior ao parque é
      área de sensibilidade ecológica e zona de proteção especial para as aves. O farol de Punta Jandía, no
      extremo sudoeste, entrou em funcionamento em 1864 e é um dos mais antigos das Canárias. No concelho de
      Pájara subsistem igualmente vestígios da cultura aborígene majorera: casas de pedra seca, grutas
      habitacionais e currais pastoris.


      A ameaça mais direta provém dos resíduos humanos: restos de comida atraem roedores e gatos
      assilvestrados, uma séria ameaça para a fauna autóctone.
    before: >-
      Não saias dos trilhos sinalizados nem caminhes em zonas restritas para evitar a erosão dos solos e não
      danificar a vegetação sensível. É estritamente proibido fazer fogo fora dos locais permitidos, com
      especial rigor no verão. Recolhe todo o teu lixo, incluindo beatas de cigarro, não arranques plantas nem
      recolhas pedras, e nunca molestes ou alimentes animais; avisa as equipas de emergência se encontrares
      fauna ferida.
    around: >-
      Longe de Fuerteventura, o parque partilha afinidades com o [Parque Nacional do Rio Selvagem
      Vjosa](/lugar/vjosa-wild-river-national-park/), onde também ocorrem o abutre-do-egito e o
      borrelho-pequeno-de-coleira, e com o [Parque Natural de Cabo de
      Gata-Níjar](/lugar/parque-natural-maritimo-terrestre-del-cabo-de-gata-nijar/), que partilha com Jandía a
      abetarda-hubara e os habitats costeiros e de estepe árida.
