resumen:
  es: Montes de haya y pino sobre relieve kárstico morrénico que miran al lago Lemán y la cadena del Mont Blanc.
  en: Beech and pine-clad hills across morainic karst terrain overlooking Lake Geneva and the Mont Blanc massif.
  fr: >-
    Hauteurs de hêtres et de pins sur relief karstique morainique dominant le lac Léman et la chaîne du
    Mont-Blanc.
  de: >-
    Buchen- und fichtenbestandene Höhenzüge über moränenüberprägtem Karst mit weitem Blick auf den Genfersee
    und die Mont-Blanc-Kette.
  it: >-
    Rilievi di faggi e pini su morfologia carsico-morenica affacciati sul lago Lemano e sulla catena del Monte
    Bianco.
  pt: >-
    Colinas de faias e pinheiros sobre relevo cárstico e moreia com vista para o lago Léman e a cadeia do
    Monte Branco.
unico:
  es: >-
    Un Jura de pastos con árboles donde la piedra seca, las turberas y la cadena del Mont Tendre conviven a un
    paso de las ciudades.
  en: >-
    A Jura of wooded pastures where dry-stone walls, peat bogs and the Mont Tendre ridge coexist a stone’s
    throw from urban centres.
  fr: >-
    Un Jura de pâturages boisés où murs de pierres sèches, tourbières et crête du mont Tendre se côtoient aux
    portes des villes.
  de: >-
    Ein Jura aus Waldweiden, wo Trockensteinmauern, Hochmoore und die Kette des Mont Tendre in unmittelbarer
    Stadtnähe lebendig geblieben sind.
  it: >-
    Un Giura di pascoli alberati dove muretti a secco, torbiere e la cresta del Mont Tendre convivono a
    ridosso delle città.
  pt: >-
    Um Jura de pastagens arborizadas onde muros de pedra seca, turfeiras e a crista do Mont Tendre convivem a
    dois passos das cidades.
observaciones:
  es: >-
    El perro va con correa todo el año en reservas naturales, sitios protegidos y pastos con ganado. Con las
    vacas, mantén distancia y, si hace falta, sal del camino. Respeta las zonas de tranquilidad y los sitios
    de protección de la fauna, quédate en los senderos recomendados y lleva de vuelta tus residuos.
texto:
  es:
    intro: >-
      Sube a la cresta del Mont Tendre y el Jura te enseña su truco: un lomo suave de pastos con árboles
      dispersos que, de repente, se abre al Léman y a los Alpes. Con 1.679 metros es el punto más alto del
      Jura suizo, y todo el parque natural regional Jura vaudois está pensado a esa escala de colinas largas,
      puertos y bosques. Reúne 35 municipios vaudenses entre la cumbre de La Dôle y el burgo de Romainmôtier,
      y cruza la cadena por tres puertos: La Givrine, Le Marchairuz y Le Mollendruz.
    landscape: >-
      El parque se entiende como cinco paisajes encadenados: las gargantas y valles del Orbe y del Nozon, la
      alta cadena del Jura, el pie del Jura, el macizo del Risoux y el valle de Joux. El mapa lo ordena de
      arriba abajo, pero el relieve tiene su propia lógica.


      La cresta es caliza, y bajo ella la roca trabaja por dentro. El parque presume de la mayor densidad de
      simas y cuevas de Suiza, entre ellas las grutas de Vallorbe y la helera de Saint-George. En el valle de
      Joux, un vasto poljé, el lago de Joux apenas tiene salida a la vista: casi toda su agua se filtra por el
      suelo calcáreo y reaparece en las grutas de Vallorbe.


      Encima de eso, la mano humana. Los pastos arbolados con píceas y abetos blancos son fruto de siglos de
      explotación, y sostienen una biodiversidad rica mientras el aprovechamiento siga siendo poco intenso. En
      ellos florecen especies como el cardo glutinoso, el cardo de los arroyos y la grasilla de flores
      grandes. Dentro del parque están el 40 % de los prados y pastos secos del cantón y el 58 % de sus
      turberas altas de importancia nacional. Y alrededor de todo ello corren 250 kilómetros de muros de
      piedra seca.


      Aparte queda el Grand Risoud, con 2.200 hectáreas el mayor macizo forestal continuo de Suiza. Sus abetos
      rojos, centenarios y de crecimiento lentísimo, dan una madera tan apretada que sirve para las tapas
      armónicas de la lutería.
    wildlife: >-
      Esto es territorio de grandes carnívoros esquivos. En el invierno de 2017-2018 se identificaron 12
      [linces](/especie/lynx_lynx/) independientes en el Jura vaudois. En 2018 las cámaras detectaron dos
      [lobos](/especie/canis_lupus/) adultos entre el macizo de La Dôle y el puerto de Marchairuz, sin cría ni
      manada. Un lince macho capturado en el valle de Joux acabó liberado en el bosque del Palatinado, en
      Alemania, dentro de un proyecto europeo de refuerzo de la especie.


      Más fácil de encontrar es el [mirlo acuático](/especie/cinclus_cinclus/), mascota del sendero del agua y
      guía de la búsqueda del tesoro por el Nozon.


      El año marca cómo y dónde caminar. De abril a mediados de julio los perros van atados en el bosque y sus
      lindes, para proteger a la fauna. En invierno se evitan los lindes del bosque y las superficies sin
      nieve. El parque propone además itinerarios de raquetas y esquí de fondo, y el Risoux tiene rutas de
      fondo trazadas.
    visit: >-
      Hay dos centros de acogida, los Espaces découvertes: uno en el puerto de Marchairuz y otro en el burgo
      de Romainmôtier-Envy. Informan sobre los proyectos y misiones del parque y dan ideas para explorar los
      alrededores. Todos los senderos que selecciona el parque están balizados y se conectan con el transporte
      público; al puerto de La Givrine, por ejemplo, llega el tren desde Nyon por Saint-Cergue.


      La gran jornada es el Mont Tendre. La ruta sale de la estación de Le Sentier, a 1.000 m, cruza el valle
      de Joux y el río Orbe, pasa cerca de zonas pantanosas y sube entre pastos con píceas hasta la cumbre.
      Desde allí se ven el pie del Jura, el Léman, los Alpes y todo el bosque del Risoud sobre el valle de
      Joux. Baja a Montricher, a 750 m. Son dieciséis kilómetros, 760 m de subida, 1.000 de bajada y unas
      cinco horas: fácil de técnica, exigente de resistencia. La temporada va de mayo a noviembre.


      Para algo más tranquilo, la ruta botánica de La Givrine hace quince kilómetros en unas cuatro horas, con
      656 metros de desnivel y técnica fácil. El Sentier de l'eau et du Vallon du Nozon une Vaulion, Croy y
      Romainmôtier con doce paradas que explican cómo el agua ha modelado el paisaje, la biodiversidad y las
      actividades humanas. Mide 5,6 km y dura dos horas; los primeros 400 metros discurren junto a una
      carretera cantonal. Si buscas varios días, el parque propone la Grande Traversée, a pie y por etapas.
    history: >-
      Todo empezó con un pacto. El 1 de agosto de 1973 la Liga vaudense para la protección de la naturaleza
      firmó un convenio con los propietarios de los alpages; así nació el antiguo Parc jurassien vaudois.
      Incluye el distrito franco federal del Noirmont y 59 reservas naturales.


      El valle de Joux guarda historias de otro tipo. Es una de las cunas de la relojería, y el bosque del
      Risoux sirvió de paso clandestino hacia Suiza durante la ocupación alemana de Francia. Romainmôtier y
      Bassins figuran entre los sitios cluniacenses del parque.
    before: >-
      El perro va con correa todo el año en reservas naturales, sitios protegidos y pastos con ganado. Con las
      vacas, mantén distancia y, si hace falta, sal del camino. Respeta las zonas de tranquilidad y los sitios
      de protección de la fauna, quédate en los senderos recomendados y lleva de vuelta tus residuos.
    around: >-
      El [Parc Naturel Régional du Haut-Jura](/lugar/parc-naturel-regional-du-haut-jura/), en Francia, es
      limítrofe, a 1 km. La [Haute Vallée de l'Ain](/lugar/haute-vallee-de-l-ain/) está a unos 8 km y [La Loue
      - Vallée et Gorges](/lugar/la-loue---vallee-et-gorges/), a unos veintiocho kilómetros.
  en:
    intro: >-
      Climb up to the crest of Mont Tendre and the Jura reveals its signature scenery: a gentle ridge of
      pasture dotted with solitary trees that suddenly falls away to reveal Lake Geneva and the Alps. Rising
      to 1,679 metres, it is the highest summit in the Swiss Jura, and the entire Jura Vaudois regional nature
      park is scaled to these sweeping rolling hills, mountain passes and expansive forests. It unites 35
      municipalities in Vaud between the summit of La Dôle and the historic borough of Romainmôtier, traversed
      by three passes: La Givrine, Le Marchairuz and Le Mollendruz.
    landscape: >-
      The park can be understood as five linked landscapes: the gorges and valleys of the Orbe and Nozon, the
      high Jura ridge, the foot of the Jura, the Risoux massif and the Vallée de Joux. The map sets them out
      from top to bottom, but the topography follows its own geological logic.


      The high crest is limestone, and beneath it the water works deep inside the rock. The park boasts the
      highest concentration of chasms and caves in Switzerland, notably the Vallorbe caves and the
      Saint-George ice cave. In the Vallée de Joux, a vast polje, the waters of Lac de Joux have virtually no
      surface outlet: almost all runoff sinks into the porous limestone bed to resurface lower down in the
      Vallorbe caves.


      Overlaid on this is centuries of human stewardship. The wood-pastures of spruce and silver fir result
      from long-standing pastoral practices, sustaining rich biodiversity so long as grazing pressure remains
      light. Here flourish species such as sticky thistle, cabbage thistle and large-flowered butterwort.
      Within the park lie 40% of the canton’s dry grasslands and meadows and 58% of its raised bogs of
      national importance. Encircling them all run 250 kilometres of traditional dry-stone walls.


      Standing apart is the Grand Risoud, covering 2,200 hectares as the largest continuous forest tract in
      Switzerland. Its centuries-old slow-growing Norway spruces produce wood with growth rings so dense that
      it is prized for musical instrument soundboards in master lutherie.
    wildlife: >-
      This is the domain of secretive large carnivores. During the winter of 2017-2018, a total of 12
      independent [lynx](/especie/lynx_lynx/) were identified across the Jura vaudois. In 2018, trail cameras
      detected two adult [wolves](/especie/canis_lupus/) between the La Dôle massif and the Marchairuz pass,
      without evidence of breeding or pack formation. A male lynx captured in the Vallée de Joux was
      subsequently relocated to the Palatinate Forest in Germany as part of a European species recovery
      project.


      Far easier to encounter is the [white-throated dipper](/especie/cinclus_cinclus/), mascot of the water
      trail and guide for the treasure hunt along the Nozon.


      The seasons determine where and how to walk. From April to mid-July dogs must be leashed in woods and
      forest margins to protect breeding wildlife. In winter, forest fringes and snow-free patches are
      avoided. The park also provides snowshoe and cross-country ski trails, with groomed Nordic routes
      throughout the Risoux.
    visit: >-
      There are two visitor welcome centres, the Espaces découvertes: one at the Marchairuz pass and another
      in the historic town of Romainmôtier-Envy. They offer insights into park conservation projects and
      suggest excursions across the surroundings. All trails highlighted by the park are signposted and
      connect with public transport; for example, the pass at La Givrine is served directly by train from Nyon
      via Saint-Cergue.


      The quintessential day hike is Mont Tendre. The trail departs from Le Sentier railway station at 1,000
      m, traverses the Vallée de Joux and the Orbe river, skirts wetland margins and ascends through spruce
      pastures to the summit. From the crest the panorama takes in the foot of the Jura, Lake Geneva, the Alps
      and the entire Risoud forest spread above the Vallée de Joux. It descends to Montricher at 750 m.
      Spanning sixteen kilometres with 760 m of climb, 1,000 m of descent and taking around five hours:
      technically straightforward yet demanding on endurance. The optimal walking season runs from May to
      November.


      For a gentler outing, the La Givrine botanical trail covers fifteen kilometres in about four hours, with
      656 metres of elevation gain and easy footing. The Sentier de l'eau et du Vallon du Nozon links Vaulion,
      Croy and Romainmôtier with twelve interpretive stops explaining how water shaped the geology,
      biodiversity and local craftsmanship. It measures 5.6 km and lasts two hours; the initial 400 metres run
      alongside a cantonal road. For multi-day journeys, the park maps out the Grande Traversée, completed on
      foot across distinct stages.
    history: >-
      Everything began with an agreement. On 1 August 1973, the Vaud League for the Protection of Nature
      signed a formal charter with alpine pasture owners, founding what was originally the Parc jurassien
      vaudois. It encompasses the Noirmont federal hunting reserve and 59 nature reserves.


      The Vallée de Joux holds cultural stories of another kind. It is one of the historic cradles of Swiss
      precision watchmaking, and the Risoux forest served as a clandestine escape route into Switzerland
      during the wartime occupation of France. Romainmôtier and Bassins feature among the park’s noted Cluniac
      heritage sites.
    before: >-
      Dogs must be leashed year-round in nature reserves, protected habitats and pastures with livestock. Near
      cattle, keep a respectful distance and step off the path if necessary. Respect quiet wildlife zones and
      designated sanctuaries, remain on recommended paths and carry out all your waste.
    around: >-
      The [Parc Naturel Régional du Haut-Jura](/lugar/parc-naturel-regional-du-haut-jura/) in France lies
      contiguous, just 1 km away. The [Haute Vallée de l'Ain](/lugar/haute-vallee-de-l-ain/) is about 8 km
      off, and [La Loue - Vallée et Gorges](/lugar/la-loue---vallee-et-gorges/) lies some twenty-eight
      kilometres distant.
  fr:
    intro: >-
      Montez sur la crête du mont Tendre et le Jura livre tout son charme : une croupe paisible de pâturages
      semés d’arbres isolés qui s’ouvre soudain sur le Léman et les Alpes. Avec ses 1 679 mètres, c’est le
      point culminant du Jura suisse, et l’ensemble du parc naturel régional Jura vaudois est pensé à cette
      échelle de vastes ondulations, de cols et de forêts profondes. Il réunit 35 communes vaudoises entre le
      sommet de La Dôle et le bourg médiéval de Romainmôtier, franchissant la chaîne jurassienne par trois
      cols : La Givrine, Le Marchairuz et Le Mollendruz.
    landscape: >-
      Le parc se découvre à travers cinq entités paysagères : les gorges et vallons de l’Orbe et du Nozon, la
      haute chaîne du Jura, le pied du Jura, le massif du Risoux et la vallée de Joux. La carte les égrène du
      haut vers le bas, mais le relief obéit à sa propre logique géologique.


      La crête est calcaire, et sous elle l’eau creuse la roche de l’intérieur. Le parc revendique la plus
      forte densité de gouffres et de cavités de Suisse, parmi lesquelles les grottes de Vallorbe et la
      glacière de Saint-George. Dans la vallée de Joux, immense poljé, le lac de Joux n’a presque aucun
      exutoire visible : la quasi-totalité de ses eaux s’infiltre dans le socle calcaire avant de rejaillir
      dans les grottes de Vallorbe.


      À ce relief s’ajoute l’empreinte pastorale séculaire. Les prés-bois d’épicéas et de sapins blancs
      résultent de générations d’exploitation traditionnelle et maintiennent une grande diversité tant que le
      pâturage demeure extensif. On y observe le chardon glutineux, le chardon maraîcher et la grasseette à
      grandes fleurs. Le parc abrite 40 % des prairies et pâturages secs du canton et 58 % de ses hauts-marais
      d’importance nationale. Autour de ces espaces serpentent 250 kilomètres de murs de pierres sèches.


      En marge s’étend le Grand Risoud, qui constitue avec ses 2 200 hectares le plus vaste massif forestier
      continu de Suisse. Ses épicéas centenaires à croissance très lente offrent un bois aux cernes serrés
      très recherché pour les tables d’harmonie en lutherie d’art.
    wildlife: >-
      C’est le domaine des grands carnivores discrets. Durant l’hiver 2017-2018, un total de 12
      [lynx](/especie/lynx_lynx/) indépendants ont été recensés dans le Jura vaudois. En 2018, les pièges
      photographiques ont identifié deux [loups](/especie/canis_lupus/) adultes entre La Dôle et le col du
      Marchairuz, sans meute établie. Un lynx mâle capturé dans la vallée de Joux a par ailleurs été transféré
      dans la forêt du Palatinat en Allemagne au titre d’un programme européen de soutien à l’espèce.


      Bien plus facile à apercevoir, le [cincle plongeur](/especie/cinclus_cinclus/) est la mascotte du
      sentier de l’eau et guide la chasse au trésor le long du Nozon.


      Le calendrier dicte les bons comportements. D’avril à mi-juillet, les chiens doivent être tenus en
      laisse en forêt et en lisière pour préserver la faune en reproduction. En hiver, on contourne les orées
      forestières et les zones déneigées. Le parc trace également des pistes pour raquettes et ski de fond, le
      Risoux abritant un réseau nordique renommé.
    visit: >-
      Deux centres d’accueil, les Espaces découvertes, vous attendent : l’un au col du Marchairuz et l’autre
      dans le bourg de Romainmôtier-Envy. Ils présentent les actions du parc et orientent les balades. Tous
      les sentiers balisés par le parc sont accessibles en transports publics ; le col de La Givrine est ainsi
      directement desservi par le train au départ de Nyon via Saint-Cergue.


      La randonnée emblématique mène au mont Tendre. Au départ de la gare du Sentier, à 1 000 m, l’itinéraire
      franchit la vallée de Joux et l’Orbe, longe des zones marécageuses puis monte à travers les pâturages
      boisés vers le sommet. De là-haut se dévoilent le pied du Jura, le Léman, les Alpes et l’immense forêt
      du Risoud dominant la vallée. La descente rejoint Montricher à 750 m. Comptez seize kilomètres, 760 m de
      dénivelé positif, 1 000 de descente et environ cinq heures de marche : simple techniquement mais
      soutenue en endurance, idéale de mai à novembre.


      Pour une découverte plus douce, le sentier botanique de La Givrine propose quinze kilomètres en environ
      quatre heures, avec 656 mètres de dénivelé sans difficulté technique. Le Sentier de l’eau et du Vallon
      du Nozon relie Vaulion, Croy et Romainmôtier en douze étapes illustrant la force de l’eau sur les
      paysages, la biodiversité et les métiers d’autrefois. Il fait 5,6 km pour deux heures de marche, ses
      premiers 400 mètres longeant une route cantonale. Pour plusieurs jours, le parc propose la Grande
      Traversée à pied par étapes.
    history: >-
      Tout est né d’un compromis historique. Le 1 août 1973, la Ligue vaudoise pour la protection de la nature
      signait une convention avec les propriétaires d’alpages, posant les bases de l’ancien Parc jurassien
      vaudois. Il comprend le district franc fédéral du Noirmont et 59 réserves naturelles.


      La vallée de Joux recèle d’autres mémoires. Haut lieu de la haute horlogerie, la forêt du Risoux fut
      également une voie de passage clandestine vers la Suisse durant l’occupation en France. Romainmôtier et
      Bassins comptent parmi les sites clunisiens du parc.
    before: >-
      Les chiens doivent être attachés toute l’année dans les réserves naturelles, les sites protégés et les
      pâturages occupés par le bétail. À proximité des vaches, gardez vos distances et contournez calmement le
      troupeau si nécessaire. Respectez les zones de quiétude de la faune, restez sur les chemins et rapportez
      tous vos déchets.
    around: >-
      Le [Parc Naturel Régional du Haut-Jura](/lugar/parc-naturel-regional-du-haut-jura/), en France, est
      frontalier, à 1 km. La [Haute Vallée de l'Ain](/lugar/haute-vallee-de-l-ain/) se trouve à environ 8 km
      et [La Loue - Vallée et Gorges](/lugar/la-loue---vallee-et-gorges/), à environ vingt-huit kilomètres.
  de:
    intro: >-
      Steige auf den Kamm des Mont Tendre und der Jura offenbart seine Eigenart: Ein sanfter Rücken lockerer
      Weiden mit eingestreuten Einzelbäumen, der sich unvermittelt zum Genfersee und den Alpen hin öffnet. Mit
      1.679 Metern markiert er den höchsten Punkt des Schweizer Jura, und der gesamte regionale Naturpark Jura
      vaudois ist auf diese Weite ausgedehnter Höhenzüge, Pässe und Wälder abgestimmt. Er umfasst 35
      Waadtländer Gemeinden zwischen dem Gipfel von La Dôle und dem historischen Romainmôtier und überquert
      die Gebirgskette über drei Pässe: La Givrine, Le Marchairuz und Le Mollendruz.
    landscape: >-
      Der Naturpark gliedert sich in fünf aufeinanderfolgende Landschaftsräume: die Schluchten und Täler von
      Orbe und Nozon, die hohe Jurakette, den Jurafuß, das Risoux-Massiv und das Vallée de Joux. Das
      Kartenbild ordnet sie von oben nach unten, doch das Relief folgt seiner eigenen karstigen
      Gesetzmäßigkeit.


      Der Höhenzug besteht aus Kalkstein, und darunter arbeitet das Wasser im Berginneren. Der Park
      verzeichnet die höchste Dichte an Dolinen, Schlucklöchern und Höhlen der Schweiz, darunter die Grotten
      von Vallorbe und die Eishöhle von Saint-George. Im Vallée de Joux, einer gewaltigen Polje, besitzt der
      Lac de Joux kaum einen oberirdischen Abfluss: Fast das gesamte Wasser versickert im klüftigen
      Kalkgestein und tritt in den Höhlen von Vallorbe wieder zutage.


      Darüber liegt die jahrhundertealte bäuerliche Kulturlandschaft. Die von Fichten und Weißtannen geprägten
      Wytweiden (prés-bois) sind das Ergebnis behutsamer Beweidung und tragen eine beachtliche Artenvielfalt.
      Hier gedeihen Klebrige Kratzdistel, Kohl-Kratzdistel und Großblütiges Fettkraut. Im Park liegen 40 % der
      Trockenwiesen und -weiden des Kantons sowie 58 % seiner Hochmoore von nationaler Bedeutung. Gesäumt wird
      diese Szenerie von 250 Kilometern kunstvoller Trockensteinmauern.


      Ein Sonderfall ist der Grand Risoud, mit 2.200 Hektar das größte geschlossene Waldgebiet der Schweiz.
      Seine jahrhundertealten, extrem langsam gewachsenen Rottannen liefern Holz mit so engen Jahresringen,
      dass es weltweit im Meister-Geigenbau für Resonanzdecken geschätzt wird.
    wildlife: >-
      Hier streifen heimliche Großraubtiere durch die Wälder. Im Winter 2017-2018 wurden 12 selbstständige
      [Luchse](/especie/lynx_lynx/) im Waadtländer Jura festgestellt. 2018 registrierten Fotofallen zwei
      erwachsene [Wölfe](/especie/canis_lupus/) zwischen dem Dôle-Massiv und dem Col du Marchairuz, ohne
      Nachwuchs oder Rudelbildung. Ein im Vallée de Joux gefangener Luchskuder wurde im Rahmen eines
      europäischen Auswilderungsprojekts in den Pfälzerwald umgesiedelt.


      Weitaus vertrauter ist die [Wasseramsel](/especie/cinclus_cinclus/), Symbolfigur des Wasserlehrpfads und
      Begleiterin der Schatzsuche entlang des Nozon.


      Die Jahreszeiten bestimmen das Verhalten im Gelände. Von April bis Mitte Juli gilt im Wald und an
      Waldrändern Leinenpflicht für Hunde zum Schutz des Wildes. Im Winter meidet man Waldränder und
      schneefreie Kuppen. Der Naturpark pflegt markierte Schneeschuh- und Langlaufrouten, namentlich im
      Risoux-Wald.
    visit: >-
      Zwei Besucherzentren (Espaces découvertes) empfangen Gäste: eines auf der Passhöhe des Marchairuz und
      ein weiteres im historischen Ortskern von Romainmôtier-Envy. Sie informieren über Naturschutzprojekte
      und Wanderungen. Sämtliche offiziellen Routen sind beschildert und an den öffentlichen Verkehr
      angebunden; die Passhöhe La Givrine ist ab Nyon über Saint-Cergue direkt per Bahn erreichbar.


      Die Paradeschleife ist die Besteigung des Mont Tendre. Die Tour startet am Bahnhof Le Sentier auf 1.000
      m Höhe, quert das Vallée de Joux und die Orbe, führt an Mooren vorbei und steigt durch lichte
      Fichtenweiden zum Gipfel an. Oben reicht das Panorama vom Jurafuß über das Genferseebecken bis zu den
      Alpen und über den gesamten Risoux-Wald. Der Abstieg führt nach Montricher auf 750 m. Es sind sechzehn
      Kilometer, 760 m Aufstieg, 1.000 m Abstieg und etwa fünf Stunden Gehzeit: technisch leicht, aber
      konditionell fordernd, am besten von Mai bis November.


      Geruhsamer verläuft der Botanische Pfad von La Givrine über fünfzehn Kilometer in rund vier Stunden bei
      656 Höhenmetern und einfacher Wegbeschaffenheit. Der Wasserlehrpfad im Vallon du Nozon verbindet
      Vaulion, Croy und Romainmôtier mit zwölf Stationen zur Bedeutung des Wassers für Landschaft,
      Artenreichtum und Gewerbe. Er misst 5,6 km bei zwei Stunden Dauer; die ersten 400 Meter verlaufen
      entlang einer Kantonsstraße. Für Mehrtagestouren bietet sich die Grande Traversée in mehreren Etappen
      an.
    history: >-
      Alles begann mit einer zukunftsweisenden Vereinbarung: Am 1. August 1973 unterzeichnete die Waadtländer
      Liga für Naturschutz ein Abkommen mit den Alpeigentümern; so entstand der ursprüngliche Parc jurassien
      vaudois. Er umfasst das Eidgenössische Jagdbanngebiet Noirmont und 59 Naturschutzreservate.


      Das Vallée de Joux birgt auch andere Zeugnisse: Es gilt als Wiege der Schweizer Haute Horlogerie, und
      der Risoux-Wald diente im Zweiten Weltkrieg als heimlicher Fluchtweg in die Schweiz. Romainmôtier und
      Bassins gehören zu den cluniazensischen Stätten im Naturpark.
    before: >-
      Hunde müssen in Schutzgebieten, Mooren und auf Viehweiden ganzjährig angeleint sein. Bei
      Rinderbegegnungen Abstand wahren und das Weidevieh weiträumig umgehen. Wildruhezonen beachten, auf den
      ausgewiesenen Pfaden bleiben und Abfälle stets mitnehmen.
    around: >-
      Der [Parc Naturel Régional du Haut-Jura](/lugar/parc-naturel-regional-du-haut-jura/) in Frankreich
      schließt direkt an, in 1 km Entfernung. Die [Haute Vallée de l'Ain](/lugar/haute-vallee-de-l-ain/) liegt
      etwa 8 km entfernt und [La Loue - Vallée et Gorges](/lugar/la-loue---vallee-et-gorges/) rund
      achtundzwanzig Kilometer.
  it:
    intro: >-
      Sali sulla cresta del Mont Tendre e il Giura svela il suo profilo più autentico: una dorsale ondulata di
      pascoli disseminati di alberi isolati che all'improvviso si spalanca sul Lemano e sulle Alpi. Con i suoi
      1.679 metri è la vetta più alta del Giura svizzero, e l'intero parco naturale regionale Jura vaudois è
      modellato su questa scala di ampie colline, passi montani e boschi profondi. Riunisce 35 comuni vodesi
      tra la cima di La Dôle e il borgo storico di Romainmôtier, valicando la catena attraverso tre passi: La
      Givrine, Le Marchairuz e Le Mollendruz.
    landscape: >-
      Il parco si articola in cinque grandi unità paesaggistiche: le gole e le valli dell'Orbe e del Nozon,
      l'alta catena del Giura, i piedi del Giura, il massiccio del Risoux e la Vallée de Joux. La cartografia
      li ordina dall'alto in basso, ma il rilievo obbedisce a una propria logica carsica.


      La cresta è calcarea e al di sotto l'acqua scava la roccia in profondità. Il parco vanta la massima
      concentrazione di abissi e grotte della Svizzera, tra cui spiccano le grotte di Vallorbe e la ghiacciaia
      di Saint-George. Nella Vallée de Joux, immenso polje, il lago di Joux non ha quasi emissari di
      superficie visibili: la quasi totalità delle acque s'infiltra nel fondo calcareo per riemergere a valle
      nelle grotte di Vallorbe.


      Su questa trama si innesta l'opera secolare dell'uomo. I pascoli alberati con pecci e abeti bianchi sono
      l'eredità di generazioni di allevamento estensivo e mantengono una biodiversità notevole. Vi prosperano
      specie come il cardo gommoso, il cardo di palude e la pinguicola a fiori grandi. Nel parco si
      concentrano il 40% dei prati e pascoli aridi del cantone e il 58% delle sue torbiere alte d'importanza
      nazionale. A delimitare questo paesaggio si snodano 250 chilometri di muretti a secco.


      A parte si estende il Grand Risoud, che con i suoi 2.200 ettari costituisce il più vasto massiccio
      forestale continuo della Svizzera. I suoi pecci centenari a crescita lentissima producono un legno a
      venature fitte e regolari, ricercatissimo per le tavole armoniche nella liuteria d'arte.
    wildlife: >-
      Questo è il rifugio di grandi carnivori discreti. Durante l'inverno 2017-2018 sono state censite 12
      [linci](/especie/lynx_lynx/) indipendenti nel Giura vodese. Nel 2018 le fototrappole hanno documentato
      due [lupi](/especie/canis_lupus/) adulti tra La Dôle e il colle del Marchairuz, senza branchi stabili.
      Una lince maschio catturata nella Vallée de Joux è stata successivamente rilasciata nella foresta del
      Palatinato in Germania nell'ambito di un programma europeo di ripopolamento.


      Molto più facile da osservare è il [merlo acquaiolo](/especie/cinclus_cinclus/), mascotte del sentiero
      dell'acqua e guida per la caccia al tesoro lungo il Nozon.


      Il ritmo delle stagioni stabilisce le cautele necessarie. Da aprile a metà luglio i cani devono essere
      tenuti al guinzaglio nei boschi e lungo i margini forestali per tutelare la fauna nella fase
      riproduttiva. In inverno si evitano i margini delle foreste e le zone prive di neve. Il parco segnala
      inoltre itinerari con ciaspole e piste per lo sci di fondo, specialmente nella foresta del Risoux.
    visit: >-
      Due centri visitatori, gli Espaces découvertes, sono situati sul colle del Marchairuz e nel borgo di
      Romainmôtier-Envy, offrendo informazioni sulle iniziative del parco ed escursioni consigliate. Tutti i
      percorsi raccomandati sono segnalati e raccordati al trasporto pubblico; il colle di La Givrine è ad
      esempio collegato per via ferroviaria da Nyon via Saint-Cergue.


      L'escursione d'eccellenza conduce al Mont Tendre. La partenza avviene dalla stazione di Le Sentier, a
      1.000 m di quota, attraversa la Vallée de Joux e il fiume Orbe, lambisce aree umide e risale tra pascoli
      punteggiati di abeti fino alla vetta. Dalla sommità lo sguardo spazia dai piedi del Giura al lago
      Lemano, alle Alpi e all'intera distesa del Risoux. La discesa tocca Montricher a 750 m. Si contano
      sedici chilometri con 760 m di salita, 1.000 m di dislivello negativo e circa cinque ore di marcia:
      facile dal punto di vista tecnico, ma impegnativa per resistenza, percorribile da maggio a novembre.


      Per un'escursione più distesa, l'itinerario botanico di La Givrine si sviluppa per quindici chilometri
      in circa quattro ore con 656 metri di dislivello e andamento agevole. Il Sentier de l'eau et du Vallon
      du Nozon collega Vaulion, Croy e Romainmôtier attraverso dodici stazioni esplicative sul ruolo
      dell'acqua per il paesaggio e le attività storiche. Misura 5,6 km per due ore di cammino; i primi 400
      metri costeggiano una strada cantonale. Per più giorni il parco propone la Grande Traversée a tappe a
      piedi.
    history: >-
      Tutto ebbe origine da un patto condiviso. Il 1 agosto 1973 la Lega vodese per la protezione della natura
      concluse una convenzione con i proprietari degli alpeggi, dando vita all'antico Parc jurassien vaudois.
      L'area include il distretto franco federale del Noirmont e 59 riserve naturali.


      La Vallée de Joux custodisce anche memorie civili: culla della prestigiosa orologeria meccanica
      svizzera, la foresta del Risoux funse inoltre da via di passaggio clandestina verso la Svizzera durante
      l'occupazione della Francia. Romainmôtier e Bassins figurano tra i siti storici cluniacensi del parco.
    before: >-
      I cani vanno tenuti al guinzaglio tutto l'anno nelle riserve naturali, nelle aree protette e nei pascoli
      monticati. Nei pressi delle mandrie di bovini, mantieni la distanza e devia con calma dal sentiero se
      necessario. Rispetta le zone di quiete per la fauna, resta sui sentieri tracciati e riporta con te ogni
      rifiuto.
    around: >-
      Il [Parc Naturel Régional du Haut-Jura](/lugar/parc-naturel-regional-du-haut-jura/), in Francia, è
      confinante, a 1 km. La [Haute Vallée de l'Ain](/lugar/haute-vallee-de-l-ain/) dista circa 8 km e [La
      Loue - Vallée et Gorges](/lugar/la-loue---vallee-et-gorges/), circa ventotto chilometri.
  pt:
    intro: >-
      Sobe à crista do Mont Tendre e o Jura revela a sua paisagem mais marcante: uma lombada suave de
      pastagens pontilhada de árvores dispersas que, de súbito, se abre ao lago Léman e aos Alpes. Com 1.679
      metros é o ponto mais alto do Jura suíço, e todo o parque natural regional Jura vaudois está desenhado à
      medida destas colinas extensas, portelas e densas florestas. Confraterniza 35 municípios do cantão de
      Vaud entre o cume de La Dôle e a vila histórica de Romainmôtier, cruzando a cadeia montanhosa por três
      portelas: La Givrine, Le Marchairuz e Le Mollendruz.
    landscape: >-
      O parque estrutura-se em cinco grandes unidades de paisagem: as gargantas e vales do Orbe e do Nozon, a
      alta cadeia do Jura, o sopé jurassiano, o maciço do Risoux e o vale de Joux. O mapa ordena-os de
      montante a jusante, mas o relevo responde à sua própria lógica cárstica.


      A cumeada é calcária e debaixo dela a água modela o subsolo. O parque reúne a maior densidade de algares
      e grutas da Suíça, sobressaindo as grutas de Vallorbe e a geleira natural de Saint-George. No vale de
      Joux, um extenso polje, o lago de Joux quase não possui vazadouros de superfície visíveis: praticamente
      toda a sua água se infiltra no leito calcário para reaparecer mais abaixo nas grutas de Vallorbe.


      Sobreposta a esta base repousa a mão humana ancestral. Os pastos arborizados de espruces e
      abetos-brancos resultam de séculos de maneio pastoril sustentável, albergando rica biodiversidade se a
      exploração se mantiver ligeira. Neles florescem o cardo-gomoso, o cardo-dos-pântanos e a
      pinguícula-de-flores-grandes. O parque concentra 40% dos prados e pastagens secas do cantão e 58% das
      suas turfeiras altas de relevância nacional. A rodear tudo isto correm 250 quilómetros de muros de pedra
      seca.


      À parte surge o Grand Risoud que, com 2.200 hectares, é o maior maciço florestal contínuo da Suíça. Os
      seus espruces centenários e de crescimento lentíssimo originam uma madeira de anéis tão finos e
      regulares que é célebre no mundo da lutherie para tampos harmónicos.
    wildlife: >-
      Este é território de grandes carnívoros discretos. No inverno de 2017-2018 foram recenseados 12
      [linces](/especie/lynx_lynx/) independentes no Jura vaudois. Em 2018, as armadilhas fotográficas
      registaram dois [lobos](/especie/canis_lupus/) adultos entre o maciço de La Dôle e a portela de
      Marchairuz, sem registo de ninhadas nem alcateia. Um lince macho capturado no vale de Joux acabou por
      ser libertado na floresta do Palatinado, na Alemanha, num projeto comunitário de reforço da espécie.


      Bem mais fácil de observar é o [melro-d'água](/especie/cinclus_cinclus/), mascote do trilho da água e
      cicerone da caça ao tesouro ao longo do Nozon.


      O correr do ano dita a forma de caminhar. De abril a meados de julho os cães devem circular com trela na
      floresta e suas orlas para resguardar a fauna em reprodução. No inverno evitam-se as orlas de mata e as
      superfícies desprovidas de neve. O parque disponibiliza trilhos de raquetes e pistas de esqui de fundo
      traçadas no Risoux.
    visit: >-
      Existem dois postos de acolhimento, os Espaces découvertes: um no passo de Marchairuz e outro na vila de
      Romainmôtier-Envy. Prestam apoio informativo sobre projetos de conservação e sugerem percursos. Todos os
      trilhos recomendados pelo parque estão balizados e contam com transportes públicos; a portela de La
      Givrine, por exemplo, dispõe de comboio direto a partir de Nyon via Saint-Cergue.


      A grande travessia de um dia é o Mont Tendre. O percurso principia na estação de Le Sentier, a 1.000 m
      de altitude, transpõe o vale de Joux e o rio Orbe, contorna zonas pantanosas e sobe pelas pastagens com
      espruces até ao cume. De lá avistam-se o sopé do Jura, o Léman, os Alpes e toda a mata do Risoud sobre o
      vale. A descida atinge Montricher a 750 m. São dezasseis quilómetros, 760 m de subida acumulada, 1.000 m
      de descida e cerca de cinco horas de marcha: simples na técnica, exigente em resistência, recomendável
      de maio a novembro.


      Para um passeio mais calmo, a rota botânica de La Givrine cumpre quinze quilómetros em cerca de quatro
      horas, somando 656 metros de desnível com passada suave. O Sentier de l'eau et du Vallon du Nozon une
      Vaulion, Croy e Romainmôtier com doze paragens didáticas sobre como a água moldou a paisagem, a
      biodiversidade e os antigos mesteres. Estende-se por 5,6 km e dura duas horas; os primeiros 400 metros
      acompanham uma estrada cantonal. Para vários dias, o parque organiza a Grande Traversée a pé em etapas.
    history: >-
      Tudo principiou com um pacto. A 1 de agosto de 1973 a Liga de Vaud para a Proteção da Natureza assinou
      um acordo com os proprietários dos pastos alpinos, nascendo aí o antigo Parc jurassien vaudois. A sua
      área abrange a coutada federal do Noirmont e 59 reservas naturais.


      O vale de Joux encerra também outras memórias históricas: é um dos berços da alta relojoaria e a
      floresta do Risoux serviu de rota de fuga clandestina para a Suíça durante a ocupação da França.
      Romainmôtier e Bassins contam-se entre os sítios cluniacenses do parque.
    before: >-
      Os cães devem andar com trela durante todo o ano nas reservas naturais, nos biótopos protegidos e nas
      pastagens com rebanhos. Junto das vacas, guarda distância e contorna calmamente o gado se necessário.
      Respeita as zonas de tranquilidade da fauna, caminha pelos trilhos oficiais e traz de volta o teu lixo.
    around: >-
      O [Parc Naturel Régional du Haut-Jura](/lugar/parc-naturel-regional-du-haut-jura/), em França, é
      contíguo, a 1 km. A [Haute Vallée de l'Ain](/lugar/haute-vallee-de-l-ain/) fica a cerca de 8 km e [La
      Loue - Vallée et Gorges](/lugar/la-loue---vallee-et-gorges/), a cerca de vinte e oito quilómetros.
