resumen:
  es: >-
    La legendaria cordillera apenínica del Monte Vettore (2.476 m), la Garganta del Infernaccio y los llanos
    de Castelluccio.
  en: >-
    The legendary Apennine range of Monte Vettore (2,476 m), the Infernaccio Gorge, and the highland plateaus
    of Castelluccio.
  fr: >-
    La légendaire chaîne apennine du Monte Vettore (2 476 m), les gorges de l'Infernaccio et les plateaux
    d'altitude de Castelluccio.
  de: >-
    Der sagenumwobene Gebirgszug des Monte Vettore (2.476 m), die Infernaccio-Schlucht und die Hochflächen von
    Castelluccio.
  it: >-
    La leggendaria dorsale appenninica del Monte Vettore (2.476 m), le Gole dell'Infernaccio e i piani carsici
    di Castelluccio.
  pt: >-
    A lendária cordilheira apenínica do Monte Vettore (2.476 m), a Garganta do Infernaccio e as planuras de
    Castelluccio.
unico:
  es: >-
    En un lago de montaña vive un crustáceo rojo que nada boca arriba y es un endemismo, y en los altiplanos
    de su entorno hay una floración espectacular a finales de la primavera.
  en: >-
    A high-mountain glacial lake shelters an endemic red fairy shrimp that swims upside down, while
    surrounding plateaus erupt in a spectacular floral spectacle in late spring.
  fr: >-
    Un lac glaciaire d'altitude abrite un crustacé rouge endémique qui nage sur le dos, tandis que les hauts
    plateaux environnants offrent une floraison féerique à la fin du printemps.
  de: >-
    In einem Karrsee lebt ein endemischer roter Kiemenfußkrebs, der auf dem Rücken schwimmt, während die
    umliegenden Hochflächen im Frühsommer in einer spektakulären Blütenpracht erstrahlen.
  it: >-
    In un lago glaciale d'alta quota vive un crostaceo rosso endemico che nuota a pancia all'aria, mentre i
    circostanti altopiani regalano una fioritura memorabile a fine primavera.
  pt: >-
    Num lago glaciar de altitude habita um crustáceo vermelho endémico que nada de dorso, enquanto os
    planaltos vizinhos explodem numa floração deslumbrante no final da primavera.
observaciones:
  es: >-
    Todavía se ven las consecuencias de los seísmos de 2016-2017 y algunos senderos están dañados: el parque
    marca con colores cuáles se pueden usar, y el parque recomienda informarse en el lugar sobre el estado
    real de los senderos que se quieren recorrer. Los de las cumbres pueden estar nevados en invierno y
    principios de primavera, y algunas gargantas son zonas de aludes. Para ir a Castelluccio en plena
    floración, mejor entre semana.
texto:
  es:
    intro: >-
      Los Sibillini son montañas con leyenda. En un lago bajo el Monte Vettore, dice la tradición popular,
      cayó el cuerpo de Poncio Pilato, y según el nivel del agua el lago parece uno o dos, un «lago con
      gafas». Ese lago, el de Pilato, es uno de los poquísimos lagos glaciares de tipo alpino del Apenino y el
      único lago natural de las Marcas, y aquí, entre las Marcas y Umbría, un parque nacional protege el
      macizo entero, con 16 municipios repartidos por dos regiones.
    landscape: >-
      El parque se levanta sobre un macizo calcáreo. Su cima, el Monte Vettore, tiene 2.476 m y es la más alta
      de las Marcas; domina Castelluccio. De la cresta principal bajan dos vertientes. La oriental es la de
      los contrastes: los fondos de valle se encajan en gargantas estrechas, como las Gole dell'Infernaccio,
      creadas por la actividad telúrica y la erosión, y por encima los hayedos rodean los valles apenínicos.
      La occidental baja suave hacia Umbría en una serie de depresiones de altura, los famosos Piani di
      Castelluccio. Los ríos Chienti y Tronto marcan los límites naturales del parque por el norte y por el
      sur.


      El lago de Pilato está bajo las paredes verticales de la cima del Vettore. Su tamaño y su caudal
      dependen de las lluvias y del deshielo, y la nieve cubre buena parte del año su superficie. Según el
      nivel del agua, parece uno o dos lagos, de ahí su apodo «lago con gafas». Allí vive el quirocéfalo de
      Marchesoni, un endemismo: un crustáceo rojo de 9-12 mm que nada boca arriba.


      Los Piani de Castelluccio tienen otra historia, y es humana. Sin el pastoreo y la agricultura, esos
      altiplanos estarían cubiertos de hayedos; hoy esas actividades mantienen praderas con orquídeas y otras
      plantas de valor. El sistema de altiplanos, Piano Grande, Pian Piccolo y Pian Perduto, es famoso por su
      floración, una mezcla de colores de las lentejas, con sus pequeñas flores blancas, con la mostaza, las
      amapolas, el aciano y la manzanilla.
    wildlife: >-
      A finales de la primavera es cuando los Piani di Castelluccio se llenan de flores: el narciso de los
      poetas, las peonías, el tulipán de montaña y los asfódelos, entre otras, y la floración espectacular de
      la lenteja. El inicio, la duración y la intensidad de la floración cambian cada año según las
      temperaturas y la nieve, que en el altiplano puede quedar hasta mayo. Los altiplanos están muy
      concurridos, sobre todo los fines de semana de máxima floración, y el parque aconseja visitarlos entre
      semana para evitar el tráfico.


      Entre los animales, el [ciervo](/especie/cervus_elaphus/) está presente en los Sibillini desde la
      Prehistoria: en una cueva del Monte Argentella aparecieron fósiles en 1978. Una bula pontificia de 1057
      describía la zona como rica en ciervos, que desaparecieron cuando se desbrozó el monte para cultivar. El
      ciervo aparece representado desde la Edad Media en iglesias de Norcia, San Ginesio y Ussita. El
      [rebeco](/especie/rupicapra_pyrenaica/) apenino se reintrodujo en 2008, y el
      [lobo](/especie/canis_lupus/) está presente en gran parte del interior, aunque verlo es difícil y
      ocasional; en invierno pueden rastrearse sus huellas en la nieve. De vez en cuando se ve algún
      [oso](/especie/ursus_arctos/) pardo marsicano, procedente del Parque Nacional de Abruzzo, y por ahora
      solo machos. Entre los mamíferos hay también [corzo](/especie/capreolus_capreolus/), [gato
      montés](/especie/felis_silvestris/), tejón, zorro, liebre, ardilla y
      [puercoespín](/especie/hystrix_cristata/).


      Entre las aves, en el parque viven ocho parejas de [águila real](/especie/aquila_chrysaetos/); el
      seguimiento de 2025 las situó en paredes rocosas inaccesibles. Hay también [halcón
      peregrino](/especie/falco_peregrinus/), cernícalo, ratonero, mochuelo, pito verde, cárabo, búho chico,
      [búho real](/especie/bubo_bubo/) y perdiz griega. En los arroyos viven el escorpión de río, la [trucha
      común](/especie/salmo_trutta/) y la bermejuela. Entre los anfibios están la salamandrina de Savi, el
      tritón crestado y el tritón italiano; el sapo de vientre de fuego apenino no se ha vuelto a encontrar
      desde 2013. Y entre los reptiles, la víbora común y la rarísima víbora de Orsini.
    visit: >-
      El parque no tiene cercas ni puertas de entrada y no cobra billete de acceso. Los pueblos son las
      puertas. Amandola da acceso al lado oriental y a los valles del Ambro y del Tenna; Arquata del Tronto,
      al Monte Vettore; Norcia, a los Piani di Castelluccio; y Visso, a la Val Nerina y al Monte Bove. Los
      centros de visitantes y las Casas del Parque son espacios temáticos de acogida y educación ambiental, en
      diez localidades. El Centro del Ciervo en Castelsantangelo sul Nera y el Centro de Visitantes del Rebeco
      apenino en Fiastra tienen ejemplares en condiciones parecidas a las naturales que se pueden ver durante
      la visita, y el Museo Antropogeográfico de Amandola trata de la variedad de paisajes naturales de los
      Sibillini y de su relación con la vida del hombre.


      Para caminar hay 17 itinerarios oficiales, entre los más significativos para conocer los paisajes y la
      naturaleza, y el parque publica rutas que construyeron históricamente los pastores desde los pueblos
      hasta las praderas de altura. Los tiempos que se indican reservan pausas para contemplar el paisaje. Fra
      Camosci ed Aquile es un itinerario turístico de 2.700 m, de una hora de ida; Le Vie della Fede, de 7.700
      m en sentido antihorario y 2 h 10 min, de dificultad excursionista; Nel Regno del Camoscio, de 14.400 m,
      cinco horas y diez minutos desde Frontignano, para expertos; y Al Cospetto della Regina, de 18.000 m, 6
      h 30 min, también para expertos. El parque dispone de dieciocho Sentieri Natura y dos son accesibles
      también con cochecitos o sillas de ruedas. Y si quieres recorrerlo todo, el Gran Anillo de los Sibillini
      es una ruta de unos 120 km por todo el parque, a pie, a caballo o en bici de montaña, que en su versión
      de trekking se divide en nueve etapas diarias.
    history: >-
      El parque se creó en 1993. En 2003 el WWF premió al parque con el Panda de Oro por reintroducir el pino
      mugo y el abeto blanco, y el parque sigue con el seguimiento a largo plazo del lobo y de las especies de
      las que se alimenta.
    before: >-
      Todavía se ven las consecuencias de los seísmos de 2016-2017 y algunos senderos están dañados: el parque
      marca con colores cuáles se pueden usar, y el parque recomienda informarse en el lugar sobre el estado
      real de los senderos que se quieren recorrer. Los de las cumbres pueden estar nevados en invierno y
      principios de primavera, y algunas gargantas son zonas de aludes. Para ir a Castelluccio en plena
      floración, mejor entre semana.
    around: >-
      El [Parco Nazionale del Gran Sasso e Monti della
      Laga](/lugar/parco-nazionale-del-gran-sasso-e-monti-della-laga/) está pegado al parque, a menos de un
      kilómetro, y comparte con él la misma cordillera del Apenino central.
  en:
    intro: >-
      The Sibillini are mountains steeped in legend. Popular lore recounts that the body of Pontius Pilate was
      cast into a lake beneath Monte Vettore; depending on water levels, it appears as one or two separate
      pools, earning it the nickname «lake with spectacles». Lago di Pilato is one of the exceedingly rare
      alpine-type glacial cirque tarns in the Apennines and the only natural lake in the Marche region. Across
      the Marche and Umbria, this national park protects the entire limestone massif across 16 municipalities
      distributed over two regions.
    landscape: >-
      The park rises across a vast limestone massif. Its apex, Monte Vettore, reaches 2,476 m and forms the
      highest peak in the Marche, looming over Castelluccio. Two contrasting slopes drop from the main crest.
      The eastern flank is deeply dissected: valley floors plunge into narrow ravines, such as the Gole
      dell'Infernaccio shaped by tectonic faults and fluvial erosion, above which extensive beechwoods clad
      Apennine valleys. The western flank descends gently into Umbria across high structural basins: the
      celebrated Piani di Castelluccio. The Chienti and Tronto rivers define the natural boundaries to the
      north and south.


      Lago di Pilato rests beneath the sheer cliffs of Vettore's peak. Its surface area and volume depend
      directly on rainfall and snowmelt, remaining frozen and snow-covered for much of the year. Depending on
      water levels, it divides into two communicating tarns, hence its nickname «lake with spectacles». It is
      the exclusive home of Chirocephalus marchesonii, an endemic, bright-red fairy shrimp measuring 9-12 mm
      that swims upside down.


      The Piani di Castelluccio tell a cultural story: without centuries of pastoralism and agriculture, these
      uplands would be cloaked in beech forests. Today, traditional grazing and cultivation maintain
      flower-rich meadows. The plateau system—Piano Grande, Pian Piccolo, and Pian Perduto—is world-famous for
      its blossoming, where tiny white lentil flowers intermingle with wild mustard, poppies, cornflowers, and
      chamomile in a kaleidoscope of hues.
    wildlife: >-
      Late spring transforms the Piani di Castelluccio into a vast floral tapestry: poet's narcissus, wild
      peonies, mountain tulips, and yellow asphodels mingle with the blooming lentils. The timing, duration,
      and splendour of the bloom vary each year according to spring temperatures and snowpack, which can
      linger on the plateau well into May. High visitor numbers converge during peak bloom weekends, and park
      authorities advise weekday trips to avoid heavy traffic.


      Among wildlife, [red deer](/especie/cervus_elaphus/) have inhabited the Sibillini since prehistoric
      times: fossil remains were discovered in 1978 in a cave on Monte Argentella. A papal bull of 1057
      described the region as teeming with deer, which subsequently vanished as land was cleared for
      cultivation. The species appears depicted in medieval frescoes in Norcia, San Ginesio, and Ussita. The
      Apennine [Pyrenean chamois](/especie/rupicapra_pyrenaica/) was reintroduced in 2008, while the [grey
      wolf](/especie/canis_lupus/) roams throughout the interior, though sightings are elusive; its tracks are
      readily traceable in winter snow. Wandering male Marsican [brown bear](/especie/ursus_arctos/)
      occasionally cross from Abruzzo National Park. Other mammals include [roe
      deer](/especie/capreolus_capreolus/), [European wildcat](/especie/felis_silvestris/), badger, red fox,
      brown hare, red squirrel, and [crested porcupine](/especie/hystrix_cristata/).


      Among birds, eight pairs of [golden eagle](/especie/aquila_chrysaetos/) nest on inaccessible limestone
      walls, surveyed during the 2025 monitoring census. The park also hosts [peregrine
      falcon](/especie/falco_peregrinus/), common kestrel, common buzzard, little owl, European green
      woodpecker, tawny owl, long-eared owl, [Eurasian eagle-owl](/especie/bubo_bubo/), and rock partridge.
      Mountain streams hold freshwater river sculpin, [sea trout](/especie/salmo_trutta/), and South European
      roach. Amphibians include Savi's salamander, crested newt, and Italian newt; the Apennine yellow-bellied
      toad has not been recorded since 2013. Reptiles feature the common asp viper and the exceedingly rare
      Orsini's viper.
    visit: >-
      The park has no fences, turnstiles, or entrance fees. Towns serve as natural gateways: Amandola accesses
      the eastern flank and the Ambro and Tenna valleys; Arquata del Tronto provides access to Monte Vettore;
      Norcia opens to the Piani di Castelluccio; and Visso leads into Valnerina and Monte Bove. Ten visitor
      centres and Park Houses operate thematic reception and educational facilities across ten settlements.
      The Deer Centre in Castelsantangelo sul Nera and the Chamois Visitor Centre in Fiastra maintain
      semi-wild enclosures allowing close observation, while Amandola's Anthropogeographic Museum explores the
      relationship between traditional human cultures and mountain ecosystems.


      Hikers can choose among 17 official trails designed to showcase primary landscapes and habitats, along
      with historical shepherd paths linking villages to high summer pastures. Trail times account for
      panoramic stops: Fra Camosci ed Aquile is an easy tourist trail of 2,700 m (one hour one way); Le Vie
      della Fede covers 7,700 m counter-clockwise in 2 h 10 min (hiking grade); Nel Regno del Camoscio spans
      14,400 m, requiring five hours and ten minutes from Frontignano (expert grade); and Al Cospetto della
      Regina extends 18,000 m taking 6 h 30 min (expert grade). The park also maintains eighteen nature
      trails, two of which are barrier-free for strollers and wheelchairs. For complete immersion, the Grande
      Anello dei Sibillini forms a 120 km circuit around the entire massif for hikers, equestrians, and
      mountain bikers, divided into nine day-stages for trekking.
    history: >-
      The national park was established in 1993. In 2003 WWF Italy awarded the park the Golden Panda for
      successfully reintroducing dwarf mountain pine and silver fir. Park scientists continue long-term
      ecological monitoring of the wolf and its prey species.
    before: >-
      Traces of the 2016-2017 earthquakes remain visible and certain paths are damaged: the park uses a
      color-coded trail system to signal passable routes, and hikers should enquire locally before heading
      out. Summit ridges may be snowbound in winter and early spring, and certain gorges carry avalanche
      risks. To visit Castelluccio during peak bloom, choose weekdays.
    around: >-
      The [Parco Nazionale del Gran Sasso e Monti della
      Laga](/lugar/parco-nazionale-del-gran-sasso-e-monti-della-laga/) directly borders the park less than a
      kilometre away, sharing the same central Apennine backbone.
  fr:
    intro: >-
      Les Sibyllins sont des montagnes enveloppées de légendes. La tradition populaire raconte que le corps de
      Ponce Pilate sombra dans un lac au pied du Monte Vettore ; selon le niveau des eaux, la nappe se scinde
      en deux bassins, formant un « lac à lunettes ». Le lac de Pilate est l'un des très rares lacs glaciaires
      d'altitude des Apennins et l'unique lac naturel des Marches. Entre les Marches et l'Ombrie, ce parc
      national protège le massif calcaire tout entier, fédérant 16 communes réparties sur deux régions.
    landscape: >-
      Le parc repose sur un vaste massif calcaire. Son point culminant, le Monte Vettore, s'élève à 2 476 m et
      constitue le sommet des Marches, dominant Castelluccio. Deux versants contrastés descendent de la crête
      maîtresse. Le versant oriental est celui des abîmes : les fonds de vallée s'encaissent en gorges
      étroites, comme les Gole dell'Infernaccio façonnées par les failles tectoniques et l'érosion, au-dessus
      desquelles les hêtraies tapissent les vallées apennines. Le versant occidental descend en pente douce
      vers l'Ombrie en une succession de dépressions karstiques d'altitude : les fameux Piani di Castelluccio.
      Les rivières Chienti et Tronto fixent les frontières naturelles au nord et au sud.


      Le lac de Pilate se blottit sous les parois verticales du Vettore. Ses dimensions et son niveau varient
      selon les pluies et la fonte des neiges, restant pris par les glaces une grande partie de l'année. Selon
      le niveau d'eau, il forme un ou deux miroirs communicants, d'où son surnom de « lac à lunettes ». Là vit
      le chirocéphale de Marchesoni, un crustacé rouge endémique de 9-12 mm qui nage sur le dos.


      Les Piani de Castelluccio racontent une aventure humaine : sans le pastoralisme et l'agriculture, ces
      hauts plateaux seraient recouverts de forêts de hêtres. Aujourd'hui, le pâturage et les cultures
      entretiennent des prairies fleuries remarquables. L'ensemble des plateaux — Piano Grande, Pian Piccolo
      et Pian Perduto — est réputé pour sa floraison mêlant les fleurs blanches des lentilles à la moutarde
      sauvage, aux coquelicots, aux bleuets et à la camomille.
    wildlife: >-
      À la fin du printemps, les Piani di Castelluccio s'illuminent d'une mosaïque de couleurs : narcisse des
      poètes, pivoines sauvages, tulipes de montagne et asphodèles s'associent à la floraison des lentilles.
      La date, la durée et l'intensité de la floraison varient chaque année selon la météorologie et le
      manteau neigeux, qui peut subsister jusqu'en mai. Les plateaux attirent alors une foule considérable le
      week-end, et le parc conseille de venir en semaine pour éviter les embouteillages.


      Parmi les animaux, le [cerf élaphe](/especie/cervus_elaphus/) peuple les Sibyllins depuis les temps
      préhistoriques : des ossements fossiles ont été mis au jour en 1978 dans une grotte du Monte Argentella.
      Une bulle pontificale de 1057 mentionnait la région comme giboyeuse en cerfs, qui déclinèrent avec les
      défrichements agricoles. Le cerf figure dans l'iconographie médiévale des églises de Norcia, San Ginesio
      et Ussita. L'[isard](/especie/rupicapra_pyrenaica/) des Apennins a été réintroduit en 2008, et le
      [loup](/especie/canis_lupus/) fréquente les zones reculées, repérable surtout à ses empreintes dans la
      neige. De temps à autre apparaît un [ours brun](/especie/ursus_arctos/) marsicain mâle venu des
      Abruzzes. La faune compte aussi [chevreuil](/especie/capreolus_capreolus/), [chat
      sauvage](/especie/felis_silvestris/), blaireau, renard, lièvre et [porc-épic du Nord de
      l'Afrique](/especie/hystrix_cristata/).


      Pour les oiseaux, huit couples d'[aigle royal](/especie/aquila_chrysaetos/) nichent dans les falaises
      inaccessibles, identifiés lors du suivi de 2025. On recense également [faucon
      pèlerin](/especie/falco_peregrinus/), faucon crécerelle, buse variable, chouette chevêche, pic vert,
      chouette hulotte, hibou moyen-duc, [hibou grand-duc](/especie/bubo_bubo/) et perdrix bartavelle. Dans
      les cours d'eau vivent le chabot, la [truite fario](/especie/salmo_trutta/) et le vairon. Parmi les
      amphibiens figurent la salamandrine de Savi, le triton crêté et le triton italien ; le sonneur à ventre
      jaune des Apennins n'a plus été revu depuis 2013. Chez les reptiles se côtoient la vipère aspic et la
      rarissime vipère d'Orsini.
    visit: >-
      Le parc ne comporte ni clôtures ni barrières payantes : les villages constituent les accès naturels.
      Amandola ouvre sur le versant oriental et les vallées de l'Ambro et du Tenna ; Arquata del Tronto mène
      au Monte Vettore ; Norcia conduit aux Piani di Castelluccio ; et Visso dessert la Valnerina et le Monte
      Bove. Dix centres d'accueil et Maisons du Parc animent des expositions thématiques dans dix bourgs. Le
      Centre du Cerf à Castelsantangelo sul Nera et le Centre de l'Isard à Fiastra abritent des animaux en
      semi-liberté visibles lors de la visite, tandis que le musée anthropogéographique d'Amandola valorise
      l'alliance historique entre traditions paysannes et nature sauvage.


      Le réseau balisé compte 17 itinéraires officiels représentatifs des paysages locaux, complétés par
      d'anciens chemins muletiers pastoraux. Les temps de marche ménagent des pauses panoramiques : Fra
      Camosci ed Aquile est une balade touristique de 2 700 m (une heure aller) ; Le Vie della Fede totalise 7
      700 m en sens antihoraire en 2 h 10 min (randonnée moyenne) ; Nel Regno del Camoscio s'étire sur 14 400
      m en cinq heures et dix minutes depuis Frontignano (niveau expert) ; et Al Cospetto della Regina offre
      18 000 m en 6 h 30 min (niveau expert). Le parc propose dix-huit sentiers nature dont deux sont
      praticables en poussette ou fauteuil roulant. Pour un grand périple, le Grand Tour des Sibyllins offre
      une boucle de 120 km à pied, à cheval ou à VTT, découpée en neuf étapes journalières.
    history: >-
      Le parc a vu le jour en 1993. En 2003, le WWF a décerné au parc le Panda d'Or pour la réintroduction du
      pin nain et du sapin blanc. Les scientifiques poursuivent le suivi écologique régulier du loup et de ses
      proies.
    before: >-
      Les stigmates des séismes de 2016-2017 restent perceptibles et certains tracés sont modifiés : le parc
      signale par code couleur les itinéraires sécurisés, et il est recommandé de se renseigner sur place
      avant de partir. Les crêtes peuvent être enneigées jusqu'au printemps et certaines gorges exposées aux
      avalanches. Pour voir la floraison de Castelluccio, préférez les jours de semaine.
    around: >-
      Le [Parco Nazionale del Gran Sasso e Monti della
      Laga](/lugar/parco-nazionale-del-gran-sasso-e-monti-della-laga/) est contigu au parc à moins d'un
      kilomètre, partageant le même axe montagneux de l'Apennin central.
  de:
    intro: >-
      Die Sibyllinischen Berge sind mythenumwoben. Der Volksmund erzählt, dass einst der Leichnam von Pontius
      Pilatus in einen Bergsee unter dem Monte Vettore geworfen wurde; je nach Wasserstand teilt sich die
      Fläche in zwei Becken, weshalb man ihn «Brillensee» nennt. Dieser Pilatussee zählt zu den extrem
      seltenen alpinen Karseen des Apennins und bildet den einzigen natürlichen See der Marken. Inmitten der
      Marken und Umbriens schützt dieser Nationalpark das gesamte Kalkmassiv mit 16 Gemeinden in zwei
      Regionen.
    landscape: >-
      Der Park baut sich über einem mächtigen Kalkmassiv auf. Sein höchster Gipfel, der Monte Vettore,
      erreicht 2.476 m und überragt Castelluccio als höchster Punkt der Marken. Vom Hauptkamm fallen zwei
      grundverschiedene Flanken ab. Die Ostseite ist von schroffen Kontrasten geprägt: Schluchten wie die Gole
      dell'Infernaccio wurden durch Verwerfungen und Erosion in den Fels gegraben, überragt von Bergwäldern
      der Apenninen-Täler. Die Westseite senkt sich sanft nach Umbrien in weite Hochbecken ab: die berühmten
      Piani di Castelluccio. Die Flüsse Chienti und Tronto markieren die natürlichen Parkgrenzen im Norden und
      Süden.


      Der Pilatussee liegt unmittelbar unter den Steilabbrüchen des Vettore. Wasserstand und Ausdehnung hängen
      von Niederschlägen und Schneeschmelze ab; weite Teile des Jahres liegt Eis auf der Fläche. Je nach Pegel
      wirkt er wie ein oder zwei Becken, daher sein Beiname «Brillensee». Hier lebt der
      Marchesoni-Kiemenfußkrebs, ein Endemit: ein roter Krebs von 9-12 mm Länge, der auf dem Rücken schwimmt.


      Die Piani di Castelluccio spiegeln eine Kulturgeschichte wider: Ohne Weidewirtschaft und Ackerbau wären
      diese Hochebenen von Buchenwald bedeckt; heute erhalten diese Wirtschaftsweisen artenreiche Bergwiesen.
      Die Hochflächen — Piano Grande, Pian Piccolo und Pian Perduto — sind weltberühmt für ihre Blüte, ein
      Farbspiel aus weißen Linsenblüten, Ackersenf, Mohn, Kornblumen und Kamille.
    wildlife: >-
      Im Spätfrühling verwandeln sich die Piani di Castelluccio in ein Blütenmeer: Dichternarzissen,
      Pfingstrosen, Bergtulpen und Affodill mischen sich mit der Linsenblüte. Beginn, Dauer und Farbfülle
      variieren je nach Schneelage und Frühlingstemperaturen; Schnee kann bis in den Mai hinein liegen. An
      Hauptblütewochenenden herrscht starker Andrang, weshalb der Park Besuche an Wochentagen anrät.


      Unter den Säugetieren ist der [Rothirsch](/especie/cervus_elaphus/) seit Urzeiten nachgewiesen: In einer
      Höhle am Monte Argentella wurden 1978 fossile Knochen geborgen. Eine päpstliche Bulle aus dem Jahr 1057
      beschrieb die Region als wildreich; durch Rodungen verschwanden die Tiere später. Mittelalterliche
      Darstellungen in Kirchen von Norcia, San Ginesio und Ussita bezeugen die historische Präsenz. Die
      Apennin-[Pyrenäen-Gämse](/especie/rupicapra_pyrenaica/) wurde 2008 wiederangesiedelt, und der
      [Wolf](/especie/canis_lupus/) streift durch weite Teile des Berglands, meist durch Spuren im Schnee
      nachweisbar. Gelegentlich wandern männliche Marsische [Braunbären](/especie/ursus_arctos/) aus den
      Abruzzen ein. Weitere Arten sind [Reh](/especie/capreolus_capreolus/),
      [Wildkatze](/especie/felis_silvestris/), Dachs, Fuchs, Hase, Eichhörnchen und [Gewöhnliches
      Stachelschwein](/especie/hystrix_cristata/).


      Unter den Vögeln nisten acht Paare des [Steinadlers](/especie/aquila_chrysaetos/) in unzugänglichen
      Steilwänden, wie das Monitoring 2025 dokumentierte. Zudem kommen
      [Wanderfalke](/especie/falco_peregrinus/), Turmfalke, Mäusebussard, Steinkauz, Grünspecht, Waldkauz,
      Waldohreule, [Uhu](/especie/bubo_bubo/) und Steinhuhn vor. In den Bergbächen leben Groppe,
      [Forelle](/especie/salmo_trutta/) und Elritze. Zu den Amphibien zählen Savi-Salamander, Kamm-Molch und
      Bergmolch; die Gelbbauchunke wurde seit 2013 nicht mehr nachgewiesen. Unter den Reptilien finden sich
      Aspisviper und die seltene Wiesenotter.
    visit: >-
      Der Park besitzt keine Tore oder Eintrittsbarrieren: Die Ortschaften bilden die Zugänge. Amandola
      erschließt die Ostseite und die Täler von Ambro und Tenna; Arquata del Tronto führt zum Monte Vettore;
      Norcia öffnet den Weg zu den Piani di Castelluccio; und Visso erschließt Valnerina und Monte Bove. Zehn
      Besucherzentren und Parkhäuser bieten thematische Ausstellungen in zehn Orten. Das Hirschzentrum in
      Castelsantangelo sul Nera und das Gämsenzentrum in Fiastra ermöglichen Beobachtungen in naturnahen
      Freigehegen, während das Anthropogeographische Museum in Amandola die Wechselwirkung von
      Kulturlandschaft und Hochgebirgsnatur beleuchtet.


      Wanderer wählen aus 17 offiziellen Routen sowie historischen Hirtenpfaden, die Dörfer mit Hochweiden
      verbinden. Gehzeiten kalkulieren Pausen ein: Fra Camosci ed Aquile ist ein leichter Rundweg von 2.700 m
      (eine Stunde hin); Le Vie della Fede umfasst 7.700 m gegen den Uhrzeigersinn in 2 h 10 min
      (mittelschwer); Nel Regno del Camoscio misst 14.400 m bei fünf Stunden und zehn Minuten Gehzeit ab
      Frontignano (für Geübte); und Al Cospetto della Regina erfordert 18.000 m in 6 h 30 min (anspruchsvoll).
      Achtzehn Naturlehrpfade stehen bereit, davon zwei barrierefrei für Kinderwagen und Rollstühle. Für
      Weitwanderer bietet der Grande Anello dei Sibillini eine 120 km lange Rundtour zu Fuß, zu Pferd oder per
      Mountainbike, aufgeteilt in neun Tagesetappen.
    history: >-
      Der Nationalpark wurde 1993 ins Leben gerufen. Im Jahr 2003 verlieh der WWF Italien dem Park den
      Goldenen Panda für die Wiederansiedlung von Bergkiefer und Weißtanne. Wissenschaftler führen ein
      langfristiges Monitoring von Wolf und Huftieren durch.
    before: >-
      Die Spuren der Erdbeben von 2016-2017 sind mancherorts noch sichtbar und manche Bergwege beschädigt:
      Farbmarkierungen kennzeichnen begehbare Routen; informiere dich vor Ort über den Zustand der Pfade. Auf
      Kämmen kann im Frühjahr Schnee liegen; Schluchten bergen Lawinengefahr. Für die Blütezeit in
      Castelluccio empfiehlt sich ein Besuch unter der Woche.
    around: >-
      Der [Parco Nazionale del Gran Sasso e Monti della
      Laga](/lugar/parco-nazionale-del-gran-sasso-e-monti-della-laga/) grenzt unmittelbar an den Park in
      weniger als einem Kilometer Entfernung an.
  it:
    intro: >-
      I Sibillini sono montagne ammantate di leggenda. La memoria popolare tramanda che nelle acque sotto il
      Monte Vettore finì il corpo di Ponzio Pilato; a seconda della portata idrica il lago appare unico o
      diviso in due conche, un «lago con gli occhiali». Quel bacino, il Lago di Pilato, è uno dei pochissimi
      laghi glaciali di tipo alpino dell'Appennino nonché l'unico lago naturale delle Marche. A cavallo tra
      Marche e Umbria, un parco nazionale custodisce l'intero massiccio con 16 comuni dislocati su due
      regioni.
    landscape: >-
      Il parco si struttura su un possente massiccio calcareo. La sua vetta regina, il Monte Vettore, svetta a
      2.476 m ed è la cima più elevata delle Marche, dominando Castelluccio. Dalla dorsale principale scendono
      due versanti contrapposti. Il versante orientale mostra forti contrasti: i fondovalle si incassano in
      gole serrate, come le Gole dell'Infernaccio scavate dalla fagliazione e dall'erosione delle acque,
      sormontate da faggete che rivestono le vallate appenniniche. Il versante occidentale digrada verso
      l'Umbria in una serie di conche d'alta quota: i celebri Piani di Castelluccio. I fiumi Chienti e Tronto
      tracciano i confini naturali a settentrione e a mezzogiorno.


      Il Lago di Pilato è incassato sotto i dirupi sommitali del Vettore. Volume e specchio d'acqua variano
      con piogge e disgelo, restando coperti di neve per buona parte dell'anno. A seconda del livello assume
      l'aspetto di due specchi congiunti, da cui il detto «lago con gli occhiali». Nelle sue acque vive il
      chirocefalo del Marchesoni, un endemismo esclusivo: un crostaceo rosso di 9-12 mm che nuota sul dorso.


      I Piani di Castelluccio racchiudono una vicenda antropica: senza pascolo e agricoltura questi altopiani
      sarebbero ammantati da faggete; oggi tali pratiche mantengono pascoli d'alta quota ricchi di orchidee.
      Il complesso carsico — Piano Grande, Pian Piccolo e Pian Perduto — è celebre per la fioritura, dove le
      tinte bianche dei fiori di lenticchia si fondono con senape selvatica, papaveri, fiordalisi e camomilla.
    wildlife: >-
      Sul finire della primavera i Piani di Castelluccio esplodono di colori: narciso dei poeti, peonie
      selvatiche, tulipano montano e asfodeli accompagnano la scenografica fioritura della lenticchia.
      Periodo, persistenza e intensità variano ogni anno in base a temperature e manto nevoso, che in quota
      può attardarsi fino a maggio. Nei fine settimana di massima fioritura l'afflusso è massiccio e il parco
      invita a preferire i giorni feriali.


      Tra i mammiferi, il [cervo](/especie/cervus_elaphus/) calca i Sibillini fin dalla Preistoria: resti
      fossili sono emersi nel 1978 in una grotta del Monte Argentella. Una bolla pontificia del 1057
      descriveva il territorio ricco di cervi, scomparsi poi con i dissodamenti agricoli. Testimonianze
      iconografiche medievali sono visibili nelle pievi di Norcia, San Ginesio e Ussita. Il
      [camoscio](/especie/rupicapra_pyrenaica/) appenninico è stato reintrodotto nel 2008, e il [lupo
      grigio](/especie/canis_lupus/) è diffuso nell'entroterra, tradito d'inverno dalle impronte sulla neve.
      Saltuariamente compaiono individui maschi erratici di [orso bruno](/especie/ursus_arctos/) marsicano dal
      Parco d'Abruzzo. Completano il quadro [capriolo](/especie/capreolus_capreolus/), [gatto
      selvatico](/especie/felis_silvestris/), tasso, volpe, lepre, scoiattolo e
      [istrice](/especie/hystrix_cristata/).


      Nel cielo nidificano otto coppie di [aquila reale](/especie/aquila_chrysaetos/) sulle pareti
      inaccessibili, censite nel monitoraggio del 2025. Sono presenti anche [falco
      pellegrino](/especie/falco_peregrinus/), gheppio, poiana, civetta, picchio verde, allocco, gufo comune,
      [gufo reale](/especie/bubo_bubo/) e coturnice. Nei torrenti nuotano scazzone, [trota
      atlantica](/especie/salmo_trutta/) e rovella. Tra gli anfibi figurano salamandrina di Savi, tritone
      crestato e tritone italiano; l'ululone appenninico non viene rilevato dal 2013. Tra i rettili allignano
      la vipera comune e la rara vipera dell'Orsini.
    visit: >-
      Il parco è privo di recinzioni o varchi a pedaggio: i centri abitati fungono da porte naturali. Amandola
      apre all'area orientale e alle valli dell'Ambro e del Tenna; Arquata del Tronto sale al Monte Vettore;
      Norcia introduce ai Piani di Castelluccio; e Visso immette nella Valnerina e al Monte Bove. Dieci centri
      visite e Case del Parco ospitano allestimenti tematici ed educativi in dieci località. Il Centro del
      Cervo a Castelsantangelo sul Nera e il Centro Visite del Camoscio a Fiastra consentono di ammirare
      animali in recinti faunistici, mentre il Museo Antropogeografico di Amandola illustra il legame storico
      tra comunità umane e paesaggio montano.


      Per camminare si contano 17 itinerari ufficiali, affiancati da storiche mulattiere pastorali che
      salivano ai pascoli d'altura. Le durate includono soste panoramiche: Fra Camosci ed Aquile è una
      passeggiata turistica di 2.700 m (un'ora solo andata); Le Vie della Fede misura 7.700 m in senso
      antiorario per 2 h 10 min (escursionistico); Nel Regno del Camoscio si snoda per 14.400 m coperti in
      cinque ore e dieci minuti da Frontignano (per esperti); e Al Cospetto della Regina richiede 18.000 m
      percorsi in 6 h 30 min (per esperti). Sono allestiti diciotto Sentieri Natura, di cui due accessibili a
      passeggini e carrozzine. Chi desidera una grande traversata può compiere il Grande Anello dei Sibillini,
      anello di 120 km a piedi, a cavallo o in mountain bike, suddiviso in nove tappe giornaliere nel
      trekking.
    history: >-
      Il parco nazionale è nato nel 1993. Nel 2003 il WWF ha conferito al parco il Panda d'Oro per il progetto
      di reintroduzione di pino mugo e abete bianco. L'ente continua le indagini scientifiche sul lupo e sui
      suoi ungulati preda.
    before: >-
      Gli effetti dei terremoti del 2016-2017 sono tuttora percepibili e vari tracciati risultano modificati:
      una segnaletica cromatica indica i sentieri agibili; informati in loco prima di salire in quota. Le
      creste possono essere innevate fino a primavera inoltrata e alcune gole presentano rischio valanghe. Per
      la fioritura di Castelluccio preferisci i giorni infrasettimanali.
    around: >-
      Il [Parco Nazionale del Gran Sasso e Monti della
      Laga](/lugar/parco-nazionale-del-gran-sasso-e-monti-della-laga/) confina a meno di un chilometro,
      saldandosi alla medesima catena dell'Appennino centrale.
  pt:
    intro: >-
      Os Sibillini são montanhas povoadas de lendas. A tradição popular relata que o corpo de Pôncio Pilatos
      jaz no fundo de um lago sob o Monte Vettore; consoante o nível da água, o espelho parece um ou dois
      tanques, valendo-lhe a alcunha de «lago com óculos». Esse lago, o de Pilatos, é um dos raríssimos lagos
      glaciares alpinos dos Apeninos e o único lago natural das Marcas. Entre as Marcas e a Úmbria, este
      parque nacional resguarda o maciço calcário completo, reunindo 16 municípios distribuídos por duas
      regiões.
    landscape: >-
      O parque estrutura-se sobre um imenso maciço calcário. O seu cume supremo, o Monte Vettore, ascende a
      2.476 m e culmina como ponto mais alto das Marcas, dominando Castelluccio. Da linha de cumeada descem
      duas vertentes distintas. A vertente oriental é rica em contrastes: os vales afunilam-se em
      desfiladeiros apertados, como as Gole dell'Infernaccio cavadas pela tectónica e pela erosão torrencial,
      coroadas por faiais que forram os vales apenínicos. A vertente ocidental declina suavemente rumo à
      Úmbria através de depressões de altitude: os famosos Piani di Castelluccio. Os rios Chienti e Tronto
      balizam os limites naturais a norte e a sul.


      O lago de Pilatos aninha-se sob as muralhas rochosas do cume do Vettore. O seu volume e superfície
      dependem das precipitações e do degelo, mantendo-se gelado grande parte do ano. Conforme o caudal,
      aparenta formar uma ou duas lagoas comunicantes, de onde deriva o nome «lago com óculos». Ali vive o
      quirocéfalo de Marchesoni, um endemismo relíquia: um crustáceo avermelhado de 9-12 mm que nada de
      barriga para o ar.


      Os Piani de Castelluccio refletem uma história humana: sem o pastoreio e a agricultura milenares, estes
      planaltos estariam cobertos por densos faiais; hoje essas atividades mantêm prados floridos com
      orquídeas. O sistema de planuras — Piano Grande, Pian Piccolo e Pian Perduto — é célebre pela sua
      floração, harmonizando as minúsculas flores brancas da lentilha com mostarda-brava, papoilas, centáureas
      e camomila.
    wildlife: >-
      No final da primavera os Piani di Castelluccio cobrem-se de flores: narciso-dos-poetas, peónias,
      tulipa-brava e asfódelos juntam-se à floração da lentilha. O início, a duração e o esplendor da floração
      mudam anualmente consoante o termómetro e o degelo, que pode arrastar-se até maio. Os planaltos
      enchem-se de visitantes nos fins de semana, aconselhando o parque deslocações nos dias úteis para
      contornar o tráfego.


      Entre a fauna, o [veado-vermelho](/especie/cervus_elaphus/) calcorreia os Sibillini desde a
      Pré-história: ossadas fósseis surgiram em 1978 numa gruta do Monte Argentella. Uma bula papal de 1057
      enaltecia a fartura de veados no território, que acabaram por rarear com a expansão agrícola. Pinturas
      medievais em igrejas de Norcia, San Ginesio e Ussita comprovam a sua herança. A
      [camurça-dos-pirineus](/especie/rupicapra_pyrenaica/) dos Apeninos foi reintroduzida em 2008, e o
      [lobo-cinzento](/especie/canis_lupus/) patrulha os recantos montanhosos, denunciado pelas pegadas na
      neve. De quando em vez vagueiam machos solitários de [urso-pardo](/especie/ursus_arctos/) marsicano
      provenientes do Parque de Abruzzo. Registam-se ainda [corça](/especie/capreolus_capreolus/),
      [gato-bravo](/especie/felis_silvestris/), texugo, raposa, lebre, esquilo e
      [porco-espinho](/especie/hystrix_cristata/).


      Nos ares nidificam oito casais de [águia-real](/especie/aquila_chrysaetos/) em paredões abruptos,
      censitados no relatório de 2025. Registam-se também [falcão-peregrino](/especie/falco_peregrinus/),
      peneireiro, águia-d'asa-redonda, mocho-galego, pica-pau-verde, coruja-do-mato, bufo-pequeno,
      [bufo-real](/especie/bubo_bubo/) e perdiz-grega. Nos regatos nadam o escorpião-de-rio, a
      [truta](/especie/salmo_trutta/) e a boga. Nos anfíbios assinalam-se a salamandrina-de-Savi, o
      tritão-de-crista e o tritão-italiano; o sapo-de-ventre-amarelo dos Apeninos não é visto desde 2013.
      Entre os répteis encontram-se a víbora-comum e a rara víbora-de-Orsini.
    visit: >-
      O parque não ostenta portagens nem vedações: as povoações funcionam como entradas naturais. Amandola dá
      acesso à vertente oriental e aos vales do Ambro e do Tenna; Arquata del Tronto conduz ao Monte Vettore;
      Norcia abre caminho aos Piani di Castelluccio; e Visso direciona à Valnerina e ao Monte Bove. Dez
      centros de acolhimento e Casas do Parque acolhem núcleos interpretativos em dez aldeias. O Centro do
      Veado em Castelsantangelo sul Nera e o Centro da Camurça em Fiastra acolhem exemplares em cercados
      naturalizados, enquanto o Museu Antropogeográfico de Amandola documenta o convívio histórico entre o
      homem e a serra.


      Os pedestrianistas dispõem de 17 percursos oficiais e caminhos pastoris ancestrais. As estimativas de
      tempo incluem pausas contemplativas: Fra Camosci ed Aquile é um percurso turístico de 2.700 m (uma hora
      só ida); Le Vie della Fede soma 7.700 m em sentido anti-horário em 2 h 10 min (dificuldade média); Nel
      Regno del Camoscio totaliza 14.400 m em cinco horas e dez minutos a partir de Frontignano (para
      peritos); e Al Cospetto della Regina perfaz 18.000 m em 6 h 30 min (para peritos). Encontram-se abertos
      dezoito trilhos ecológicos, dois dos quais acessíveis a carrinhos de bebé e cadeiras de rodas. Para uma
      volta integral, o Grande Anel dos Sibillini estende-se por 120 km em torno do maciço para caminheiros,
      cavaleiros e ciclistas, segmentado em nove etapas diárias.
    history: >-
      O parque foi instituído em 1993. Em 2003 a WWF distinguiu o parque com o Panda de Ouro pelo programa de
      reintrodução do pinheiro-das-rochas e do abeto-branco. A equipa do parque prossegue o estudo a longo
      prazo sobre o lobo e as suas presas selvagens.
    before: >-
      Os impactos dos terramotos de 2016-2017 permanecem visíveis e certos trilhos sofreram desvios: um código
      cromático sinaliza percursos praticáveis; recolhe informações locais antes de iniciares a subida. Os
      cumes podem conservar neve até meados da primavera e certas gargantas apresentam perigo de avalanches.
      Para a floração de Castelluccio prefere os dias úteis.
    around: >-
      O [Parco Nazionale del Gran Sasso e Monti della
      Laga](/lugar/parco-nazionale-del-gran-sasso-e-monti-della-laga/) confronta imediatamente com o parque a
      menos de um quilómetro, partilhando a mesma cordilheira apenínica.
